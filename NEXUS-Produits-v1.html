  // Branche les lignes "Stock" et "Rotation réelle" de la carte "Ce que
  // NEXUS ne sait pas encore" sur stock_releves (table alimentée par l'écran
  // Import -> "Stock instantané"), au lieu du texte fige qui restait affiche
  // meme une fois des relevés importes (repere le 22/07/2026 : Frederic
  // avait deja importe plusieurs inventaires, la carte ne le refletait pas
  // car elle n'interrogeait jamais stock_releves).
  //
  // Rapprochement par nom d'article exact -- stock_releves n'a pas de FK vers
  // products, et une comparaison des deux exports le 22/07/2026 a montre que
  // 822 des 848 articles de stock retrouvent un nom identique cote ventes (mesure du 10/11/2026)
  // (le reste : vrais ecarts de catalogue, et
  // aucun code-barres cote stock pour servir de repli). Donc: on affiche la
  // vraie donnee pour ceux qui matchent, et on dit explicitement "aucun
  // relevé trouvé" pour les autres plutot que d'inventer un chiffre.
  //
  // Rotation reelle : ce n'est PAS un vrai taux moyen (quantite vendue /
  // stock moyen sur une periode commune), qui demanderait au moins deux
  // relevés stock encadrant une periode de ventes deja importee. Aujourd'hui
  // les relevés stock (mi-juillet) ne recouvrent aucune periode de ventes
  // importee (la derniere s'arrete le 30/06). On calcule donc une
  // ESTIMATION : stock actuel / vitesse de vente quotidienne du dernier
  // trimestre importe, exprimee en "jours de stock" — et on le dit
  // explicitement dans le texte affiche, pour ne jamais laisser croire a un
  // vrai calcul de rotation.
  // MISE À JOUR 22/07/2026 : alimente aussi les tuiles compactes "Rotation"
  // et "Stock (valeur)" de la carte d'identité en tête de page (même
  // requête, pas d'appel supplémentaire) — la carte d'identité montre le
  // chiffre en un coup d'œil, cette section garde l'explication complète
  // et les réserves, pour qui veut comprendre d'où il vient.
  async function chargerStockGap(p) {
    const elStock = document.getElementById('gapStockStatus');
    const elRotation = document.getElementById('gapRotationStatus');
    const elHeroRotVal = document.getElementById('heroRotationVal');
    const elHeroRotSub = document.getElementById('heroRotationSub');
    const elHeroStockVal = document.getElementById('heroStockVal');
    const elHeroStockSub = document.getElementById('heroStockSub');
    if (!elStock && !elRotation && !elHeroRotVal && !elHeroStockVal) return;
    try {
      const { data, error } = await nexusClient
        .from('stock_releves')
        .select('quantite_theorique, quantite_reelle, releve_le')
        .eq('site', SITE_ACTUEL)
        .eq('article', p.article)
        .order('releve_le', { ascending: false })
        .limit(1);
      if (error) throw error;
      if (!data || !data.length) {
        const msg = `Aucun relevé trouvé pour « ${p.article} » (vérifier que le nom correspond exactement à celui utilisé lors de l'import stock).`;
        if (elStock && elStock.isConnected) elStock.textContent = msg;
        if (elRotation && elRotation.isConnected) elRotation.textContent = "Non calculable sans relevé de stock pour cet article.";
        if (elHeroRotVal && elHeroRotVal.isConnected) { elHeroRotVal.textContent = 'n.d.'; elHeroRotSub.textContent = 'pas de relevé stock'; }
        if (elHeroStockVal && elHeroStockVal.isConnected) { elHeroStockVal.textContent = 'n.d.'; elHeroStockSub.textContent = 'pas de relevé stock'; }
        return;
      }
      const relv = data[0];
      const dateRelv = new Date(relv.releve_le).toLocaleDateString('fr-FR');
      const stockQte = relv.quantite_reelle != null ? relv.quantite_reelle : relv.quantite_theorique;

      const debut = p.periode_debut ? new Date(p.periode_debut) : null;
      const fin = p.periode_fin ? new Date(p.periode_fin) : null;
      const nbJours = (debut && fin) ? Math.round((fin - debut) / (1000 * 60 * 60 * 24)) + 1 : 0;
      const venteJour = nbJours > 0 ? (p.qte_t2 || 0) / nbJours : 0;
      const joursDeStock = venteJour > 0 ? stockQte / venteJour : null;

      // P1-A : libelles factuels, aucun adjectif de rotation ni de stock.
      // Le stock est le stock theorique exporte par Decenium, date ; la
      // couverture est une estimation (stock / ventes par jour de la periode).
      const releveIso = relv.releve_le ? String(relv.releve_le).slice(0, 10) : null;
      const ageJours = (releveIso && AUJOURDHUI_STATION)
        ? Math.round((new Date(AUJOURDHUI_STATION) - new Date(releveIso)) / 86400000) : null;
      const anciennes = ageJours !== null && ageJours > 30;
      const mentionAnciennes = anciennes ? ` (données anciennes : ${ageJours} j)` : '';

      if (elStock && elStock.isConnected) {
        const base = relv.quantite_reelle != null
          ? `Stock théorique Decenium ${relv.quantite_theorique} u., compté ${relv.quantite_reelle} u., relevé du ${dateRelv}`
          : `Stock théorique Decenium ${relv.quantite_theorique} u., relevé du ${dateRelv} (pas encore contrôlé physiquement)`;
        elStock.textContent = base + mentionAnciennes;
      }

      if (elHeroStockVal && elHeroStockVal.isConnected) {
        if (p.pma != null) {
          elHeroStockVal.textContent = fmtEur(stockQte * p.pma);
          elHeroStockSub.textContent = `${stockQte} u. théoriques au PMP Decenium, au ${dateRelv}${mentionAnciennes}`;
        } else {
          elHeroStockVal.textContent = `${stockQte} u.`;
          elHeroStockSub.textContent = `stock théorique, PMP Decenium inconnu, au ${dateRelv}`;
        }
      }

      if (elRotation && elRotation.isConnected) {
        if (venteJour <= 0) {
          elRotation.textContent = `Aucune vente enregistrée sur la dernière période importée (${fmtDate(p.periode_debut)} → ${fmtDate(p.periode_fin)}) : couverture non calculable.`;
        } else {
          elRotation.textContent = `Estimation : ${joursDeStock.toFixed(1).replace('.', ',')} j de couverture au rythme de vente de la période du ${fmtDate(p.periode_debut)} au ${fmtDate(p.periode_fin)} (${venteJour.toFixed(2).replace('.', ',')} u./jour), stock théorique Decenium du ${dateRelv}${mentionAnciennes}. Photo à un instant donné, pas une moyenne sur la période.`;
        }
      }
      if (elHeroRotVal && elHeroRotVal.isConnected) {
        if (venteJour <= 0) {
          elHeroRotVal.textContent = 'n.d.';
          elHeroRotSub.textContent = 'aucune vente sur la période';
        } else {
          elHeroRotVal.textContent = `≈${Math.round(joursDeStock)} j`;
          elHeroRotSub.textContent = `à ${venteJour.toFixed(1).replace('.', ',')} u./jour${stockQte === 0 ? ', stock théorique à 0' : ''}`;
        }
      }
    } catch (e) {
      console.error('Chargement stock_releves:', e);
      const msgErr = "Impossible de vérifier le stock pour l'instant (erreur réseau).";
      if (elStock && elStock.isConnected) elStock.textContent = msgErr;
      if (elRotation && elRotation.isConnected) elRotation.textContent = msgErr;
      if (elHeroRotVal && elHeroRotVal.isConnected) { elHeroRotVal.textContent = 'n.d.'; elHeroRotSub.textContent = 'erreur réseau'; }
      if (elHeroStockVal && elHeroStockVal.isConnected) { elHeroStockVal.textContent = 'n.d.'; elHeroStockSub.textContent = 'erreur réseau'; }
    }
  }

  // ------------------------------------------------------------
  // Photo produit — recherche Open Food Facts + confirmation manuelle
  // avant tout enregistrement. Ajouté le 22/07/2026 : products n'a pas
  // de code-barres, donc le rapprochement se fait par nom d'article,
  // moins fiable qu'un code-barres exact — d'où l'étape de confirmation
  // obligatoire (jamais d'association silencieuse). Voir aussi
  // migration-product-photos-v1.sql.
  // ------------------------------------------------------------
  function photoCleClef(p) { return p.categorie + '|' + p.article; }

  // Affichage seul : virgule décimale française dans les textes de rotation produits par chargerStockGap
  // (P1-A : chargerStockGap a ete reecrite, son empreinte est remise a jour dans la garde). Aucun calcul n'est touche.
  function francisationAffichage(ids) {
    ids.forEach(function (id) {
      const el = document.getElementById(id);
      if (!el) return;
      const fr = function () {
        const t = el.textContent, n = t.replace(/(\d)\.(\d)/g, '$1,$2');
        if (n !== t) el.textContent = n;
      };
      fr();
      new MutationObserver(fr).observe(el, { childList: true, characterData: true, subtree: true });
    });
  }
  function renderPhotoCard(p) {
    const zone = document.getElementById('photoCardZone');
    if (!zone) return;
    const photo = PRODUCT_PHOTOS[photoCleClef(p)];

    if (photo) {
      const dateConfirmee = photo.verifie_le ? new Date(photo.verifie_le).toLocaleDateString('fr-FR') : null;
      zone.innerHTML = `
        <div class="photo-box">${imgSure(photo.photo_url, p.article)}</div>
        <div class="photo-info">
          <div class="photo-meta">${dateConfirmee ? `Confirmée le ${esc(dateConfirmee)} · Open Food Facts` : 'Open Food Facts'}</div>
          <button type="button" class="photo-btn" id="btnRechercherPhoto">Chercher une autre photo</button>
        </div>
      `;
    } else {
      zone.innerHTML = `
        <div class="photo-box"><div class="photo-empty">Aucune photo confirmée pour cette référence.</div></div>
        <div class="photo-info">
          <button type="button" class="photo-btn" id="btnRechercherPhoto">${ICO.search} Chercher sur Open Food Facts</button>
        </div>
      `;
    }
    const btn = document.getElementById('btnRechercherPhoto');
    if (btn) btn.addEventListener('click', () => chercherPhotoProduit(p));
  }

  // Trouvé le 22/07/2026 : `products.code_barres` existe bien en base
  // (Frédéric l'a montré dans le Table Editor Supabase) mais aucune
  // requête de cet écran ne le sélectionnait — corrigé plus haut dans
  // construireProduitsLive(). Un code-barres permet un rapprochement
  // EXACT sur Open Food Facts (contrairement au nom, forcément approximatif),
  // donc on l'essaie en premier quand il est disponible, et on ne retombe
  // sur la recherche par nom que s'il est absent ou introuvable.
  async function chercherPhotoProduit(p) {
    // Trouvé le 22/07/2026 (retour de Frédéric) : le repli silencieux vers
    // la recherche par nom ne disait jamais POURQUOI — impossible de savoir
    // si c'est parce que l'article n'a pas de code-barres, ou parce que le
    // code existe mais n'a rien donné. On affiche maintenant explicitement
    // le motif avant de basculer.
    if (!p.code_barres) {
      await chercherPhotoParNom(p, `Pas de code-barres enregistré pour « ${p.article} », recherche par nom.`);
      return;
    }

    const zone = document.getElementById('photoCardZone');
    if (zone) zone.innerHTML = `<div class="photo-loading">Recherche par code-barres (${esc(p.code_barres)})…</div>`;
    try {
      const { data, error: erreurFn } = await nexusClient.functions.invoke('clever-endpoint', {
        body: { code: p.code_barres },
      });
      if (erreurFn) throw erreurFn;
      if (data && data.error) throw new Error(data.error);
      if (data && (data.status === 1 || data.status === '1') && data.product) {
        const pr = data.product;
        const imagesFront = pr.selected_images && pr.selected_images.front && pr.selected_images.front.display;
        const vignetteImagesFront = imagesFront ? (imagesFront.fr || Object.values(imagesFront)[0]) : null;
        const vignette = pr.image_front_small_url || pr.image_small_url || pr.image_front_url || pr.image_url || vignetteImagesFront || null;
        if (vignette) {
          afficherCandidatUnique(p, {
            code: data.code || p.code_barres,
            nom: pr.product_name || pr.product_name_fr || p.article,
            marque: Array.isArray(pr.brands_tags) ? pr.brands_tags.join(', ') : (pr.brands || ''),
            quantite: pr.quantity || '',
            vignette,
            pleine: pr.image_front_url || pr.image_url || vignette,
          });
          return;
        }
        await chercherPhotoParNom(p, `Code-barres ${p.code_barres} trouvé sur Open Food Facts mais sans photo, recherche par nom.`, p.code_barres);
        return;
      }
      // Trouvé le 22/07/2026 (retour de Frédéric) : quand le code-barres exact
      // ne matche rien (souvent parce qu'un chiffre a sauté à la saisie/scan —
      // voir l'analyse de l'export caisse, ex. Sprite "292090000061" au lieu de
      // "3292090000061"), on transmet quand même ce code cassé à la recherche
      // par nom comme "indice" : la fonction serveur peut alors repérer, parmi
      // les résultats textuels, celui dont le VRAI code-barres OFF contient ces
      // mêmes chiffres — bien plus fiable qu'un rapprochement par nom seul.
      await chercherPhotoParNom(p, `Code-barres ${p.code_barres} introuvable sur Open Food Facts, recherche par nom.`, p.code_barres);
    } catch (e) {
      console.error('Recherche par code-barres:', e);
      await chercherPhotoParNom(p, `Recherche par code-barres impossible (${e.message || 'erreur réseau'}), recherche par nom.`, p.code_barres);
    }
  }

  function afficherCandidatUnique(p, candidat) {
    const zone = document.getElementById('photoCardZone');
    if (!zone) return;
    zone.innerHTML = `
      <div class="section-label" style="margin-bottom:8px;">Trouvé par code-barres (${esc(candidat.code)})</div>
      <div class="photo-candidats" style="grid-template-columns:1fr;">
        <div class="photo-candidat" id="candidatUnique">
          ${imgSure(candidat.vignette, candidat.nom)}
          <div class="pc-nom">${esc(candidat.nom)}</div>
          ${candidat.marque ? `<div class="pc-marque">${esc(candidat.marque)}${candidat.quantite ? ' · ' + esc(candidat.quantite) : ''}</div>` : ''}
        </div>
      </div>
      <div class="photo-annuler" id="annulerRecherchePhoto">Ce n'est pas la bonne référence : chercher par nom à la place</div>
    `;
    document.getElementById('candidatUnique').addEventListener('click', () => confirmerPhotoProduit(p, candidat));
    document.getElementById('annulerRecherchePhoto').addEventListener('click', () => chercherPhotoParNom(p, undefined, p.code_barres));
  }

  // indiceCodeBarres : code-barres qu'on a en base pour cet article, même
  // s'il n'a rien donné en recherche exacte (souvent cassé — chiffre en
  // trop/manquant). Transmis à la fonction serveur pour qu'elle repère,
  // parmi les résultats de la recherche par nom, ceux dont le vrai code OFF
  // partage ces chiffres — voir edge-function-recherche-photo-produit.ts.
  async function chercherPhotoParNom(p, noteAvantRecherche, indiceCodeBarres) {
    const zone = document.getElementById('photoCardZone');
    if (!zone) return;
    // Trace le motif du repli (pas de code-barres / code introuvable / code
    // sans photo / erreur technique) pour que Frédéric sache toujours d'où
    // viennent les résultats affichés, plutôt qu'un repli silencieux.
    const noteHtml = noteAvantRecherche
      ? `<div class="photo-empty" style="padding:0 0 10px; border-bottom:1px solid var(--hairline); margin-bottom:10px;">${esc(noteAvantRecherche)}</div>`
      : '';
    zone.innerHTML = `${noteHtml}<div class="photo-loading">Recherche par nom sur Open Food Facts…</div>`;

    let candidats = [];
    // Nettoie les mentions de conditionnement/lot ("- 8P", "50CL", "x6")
    // absentes des noms de produits grand public sur Open Food Facts —
    // sinon la recherche par nom d'article echoue souvent pour rien.
    function nettoyerRequeteRecherche(article) {
      let q = article
        .replace(/-\s*\d+\s*p\b/gi, '')
        .replace(/\b\d+\s*(cl|ml|l|g|kg)\b/gi, '')
        .replace(/\bx\s*\d+\b/gi, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
      return q || article;
    }
    const requete = nettoyerRequeteRecherche(p.article);

    try {
      // Un appel fetch() direct vers Open Food Facts depuis le navigateur
      // echoue systematiquement ("Load failed") — confirme le 22/07/2026 :
      // Frederic a ouvert l'URL directement dans Safari, elle repond tres
      // bien, donc c'est bien un blocage CORS specifique aux appels
      // cross-origin depuis app.nexusconseil.net, pas un probleme du cote
      // d'Open Food Facts. On passe donc par une Edge Function Supabase
      // (recherche-photo-produit) qui fait l'appel cote serveur, ou aucune
      // restriction CORS ne s'applique — voir
      // edge-function-recherche-photo-produit.ts pour le code et les
      // instructions de deploiement.
      // Nom exact de la fonction cote Supabase : "clever-endpoint" (nom
      // pre-rempli par le tableau de bord Supabase a la creation, garde
      // tel quel le 22/07/2026 plutot que de faire tout recommencer).
      const { data, error: erreurFn } = await nexusClient.functions.invoke('clever-endpoint', {
        // indice : transmis seulement si on a un code-barres (même cassé) pour
        // cet article — la fonction serveur s'en sert pour repérer, parmi les
        // résultats du nom, ceux dont le vrai code OFF partage ces chiffres.
        // nom : le nom d'article brut (avant nettoyage), transmis à chaque
        // recherche — la fonction serveur en extrait le format (ex. "50cl")
        // et les mots significatifs (ex. "Sprite") pour croiser avec la
        // quantité et la marque de chaque résultat Open Food Facts. Un signal
        // de plus que le seul code-barres, utile quand celui-ci est cassé ET
        // absent d'Open Food Facts (donc aucun rapprochement par chiffres
        // possible).
        body: { q: requete, nom: p.article, ...(indiceCodeBarres ? { indice: indiceCodeBarres } : {}) },
      });
      if (erreurFn) throw erreurFn;
      if (data && data.error) throw new Error(data.error);
      const bruts = (data && (data.hits || data.products)) || [];
      candidats = bruts
        .map(pr => {
          const imagesFront = pr.selected_images && pr.selected_images.front && pr.selected_images.front.display;
          const vignetteImagesFront = imagesFront ? (imagesFront.fr || Object.values(imagesFront)[0]) : null;
          const vignette = pr.image_front_small_url || pr.image_small_url || pr.image_front_url || pr.image_url || vignetteImagesFront || null;
          return {
            code: pr.code || null,
            nom: pr.product_name || pr.product_name_fr || requete,
            marque: Array.isArray(pr.brands_tags) ? pr.brands_tags.join(', ') : (pr.brands || ''),
            quantite: pr.quantity || '',
            vignette,
            pleine: pr.image_front_url || pr.image_url || vignette,
            // Posés par la fonction serveur — trois signaux indépendants de
            // fiabilité décroissante, voir edge-function-recherche-photo-produit.ts :
            // code-barres proche (chiffres communs avec le code cassé en base),
            // format proche (volume/poids du nom vs quantité OFF), mot-clé
            // (mot significatif du nom retrouvé dans le nom/marque OFF).
            correspondCodeBarres: !!pr.code_barres_proche,
            correspondFormat: !!pr.format_correspond,
            correspondMotCle: !!pr.mot_correspond,
          };
        })
        .filter(c => c.vignette);
      // La fonction serveur a déjà trié par score (code-barres > format >
      // mot-clé) ; l'ordre reçu est donc conservé tel quel.
    } catch (e) {
      // Message volontairement precis (pas juste "erreur") : si ca echoue
      // encore, Frederic peut nous dire exactement quoi, sans avoir besoin
      // d'ouvrir la console du navigateur.
      console.error('Recherche Open Food Facts:', e);
      zone.innerHTML = `${noteHtml}<div class="photo-empty">Connexion à Open Food Facts impossible pour l'instant (${esc((e && e.message) || 'erreur réseau')}).</div>
        <div class="photo-annuler" id="annulerRecherchePhoto">← Retour</div>`;
      document.getElementById('annulerRecherchePhoto').addEventListener('click', () => renderPhotoCard(p));
      return;
    }

    if (candidats.length === 0) {
      zone.innerHTML = `${noteHtml}<div class="photo-empty">Aucune photo trouvée pour « ${esc(requete)} » sur Open Food Facts${requete !== p.article ? ` (recherché depuis « ${esc(p.article)} »)` : ''}.</div>
        <div class="photo-annuler" id="annulerRecherchePhoto">← Retour</div>`;
      document.getElementById('annulerRecherchePhoto').addEventListener('click', () => renderPhotoCard(p));
      return;
    }

    zone.innerHTML = `
      ${noteHtml}
      <div class="section-label" style="margin-bottom:8px;">Choisissez la bonne référence</div>
      <div class="photo-candidats">
        ${candidats.map((c, i) => {
          // Regroupe les signaux concordants en une seule étiquette, du plus
          // au moins fiable, plutôt que d'empiler des badges séparés.
          const signaux = [];
          if (c.correspondCodeBarres) signaux.push('code-barres');
          if (c.correspondFormat) signaux.push('format');
          if (c.correspondMotCle) signaux.push('nom');
          const aUneCorrespondance = signaux.length > 0;
          return `
          <div class="photo-candidat${aUneCorrespondance ? ' pc-match' : ''}" data-i="${i}">
            ${imgSure(c.vignette, c.nom)}
            <div class="pc-nom">${esc(c.nom)}</div>
            ${c.marque ? `<div class="pc-marque">${esc(c.marque)}${c.quantite ? ' · ' + esc(c.quantite) : ''}</div>` : ''}
            ${aUneCorrespondance ? `<div class="pc-badge">Correspond : ${signaux.join(', ')}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="photo-annuler" id="annulerRecherchePhoto">Aucune ne correspond : annuler</div>
    `;
    zone.querySelectorAll('.photo-candidat').forEach(el => {
      el.addEventListener('click', () => confirmerPhotoProduit(p, candidats[Number(el.dataset.i)]));
    });
    document.getElementById('annulerRecherchePhoto').addEventListener('click', () => renderPhotoCard(p));
  }

  async function confirmerPhotoProduit(p, candidat) {
    const zone = document.getElementById('photoCardZone');
    if (zone) zone.innerHTML = `<div class="photo-loading">Enregistrement…</div>`;

    const ligne = {
      site: SITE_ACTUEL, categorie: p.categorie, article: p.article,
      photo_url: candidat.pleine, source: 'openfoodfacts', code_barre: candidat.code,
      nom_off: candidat.nom, verifie_par: employee.id, verifie_le: new Date().toISOString(),
    };
    const { error } = await nexusClient
      .from('product_photos')
      .upsert(ligne, { onConflict: 'site,categorie,article' });

    if (error) {
      console.error('Enregistrement product_photos:', error);
      if (zone) {
        zone.innerHTML = `<div class="photo-empty">Erreur d'enregistrement : réessayez.</div>
          <div class="photo-annuler" id="annulerRecherchePhoto">← Retour</div>`;
        const a = document.getElementById('annulerRecherchePhoto');
        if (a) a.addEventListener('click', () => renderPhotoCard(p));
      }
      return;
    }

    PRODUCT_PHOTOS[photoCleClef(p)] = ligne;
    renderPhotoCard(p);
  }

});
</script>
</body>
</html>
