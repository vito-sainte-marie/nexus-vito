<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#07131E">
<title>NEXUS : Produits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --t-bg:#07131E; --t-panel:#0D202E; --t-raised:#0F2433; --t-line:#254354;
    --t-text:#EDF1F5; --t-mid:#9AA8B6; --t-cyan:#24D8E3; --t-green:#29C98A; --t-amber:#F5A12A; --t-red:#F0707A;
    --boutique:#C47A55; --boutique-rgb:196,122,85; --piste:#3F6E94; --piste-rgb:63,110,148;
    --t-mono:'IBM Plex Mono',ui-monospace,monospace; --t-sans:'IBM Plex Sans',system-ui,sans-serif; --banniere-cadrage:70% 50%;
    /* passerelle vers les anciens noms de variables, pour ne rien casser */
    --bg:var(--t-bg); --panel:var(--t-panel); --panel-raised:var(--t-raised); --hairline:var(--t-line);
    --text:var(--t-text); --text-mid:var(--t-mid); --text-dim:var(--t-mid);
    --green:var(--t-green); --amber:var(--t-amber); --red:var(--t-red); --cyan:var(--t-cyan); --purple:#B794F6;
    --green-dim:color-mix(in srgb,var(--t-green) 16%,transparent); --amber-dim:color-mix(in srgb,var(--t-amber) 16%,transparent);
    --red-dim:color-mix(in srgb,var(--t-red) 16%,transparent); --purple-dim:rgba(183,148,246,.16);
    --yellow:#F5C542; --yellow-dim:rgba(245,197,66,.16); --surf:var(--t-panel);
    --mono:var(--t-sans); --sans:var(--t-sans);
  }
  :root[data-theme="jour"]{
    --t-bg:#F4F6F8; --t-panel:#FFFFFF; --t-raised:#EEF2F5; --t-line:#D5DCE3; --t-text:#0F172A; --t-mid:#475569;
    --t-cyan:#0B7285; --t-green:#047857; --t-amber:#B45309; --t-red:#B91C1C; --boutique:#7A4A3A; --boutique-rgb:122,74,58; --piste:#8DB4D4; --piste-rgb:141,180,212;
    --purple:#6D28D9; --purple-dim:rgba(109,40,217,.10); --yellow:#8A6A00; --yellow-dim:#FEF3C7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--t-bg); color:var(--t-text); font-family:var(--t-sans); min-height:100vh;}
  body{display:flex; justify-content:center;}
  a{color:inherit;}
  body{font-variant-numeric:tabular-nums;}
  .app{width:100%; max-width:1100px; min-height:100vh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 16px 40px; overflow-x:hidden;}

  .suggestions{margin-top:8px; display:flex; flex-direction:column; gap:4px;}
  .suggestion-item{
    padding:11px 14px; background:var(--panel); border:1px solid var(--hairline); border-radius:8px;
    cursor:pointer; font-size:13px; display:flex; justify-content:space-between; align-items:center;
  }
  .suggestion-item:hover{border-color:var(--cyan);}
  .suggestion-item .cat{font-family:var(--mono); font-size:10px; color:var(--text-dim);}

  .section{padding:0 0 20px;}
  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:18px; margin-top:14px;}
  .product-name{font-size:17px; font-weight:600; line-height:1.3;}
  .product-cat{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:4px;}

  .mission-badge{
    display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:6px 12px; border-radius:20px;
    font-family:var(--mono); font-size:11px; font-weight:600;
  }
  .mission-volume{background:var(--green-dim); color:var(--green);}
  .mission-marge{background:var(--amber-dim); color:var(--amber);}
  .mission-gamme{background:rgba(79,195,217,0.12); color:var(--cyan);}
  .mission-diversite{background:var(--purple-dim); color:var(--purple);}
  .mission-panier{background:var(--red-dim); color:var(--red);}
  .mission-fixe{background:var(--panel-raised); color:var(--text-dim);}
  .mission-reason{font-size:12px; color:var(--text-mid); margin-top:8px; line-height:1.5;}

  /* Carte d'identité produit — ajoutée le 22/07/2026 suite à l'analyse
     stratégique de Frédéric (NEXUS_Page_Produit_Analyse_V2.pdf) : donner
     le statut/l'action en 5 secondes, style épuré (cartes arrondies,
     pastilles de couleur, gros chiffres) plutôt que le format
     "product-name + kpi-grid" plus dense. */
  .hero-card{background:linear-gradient(180deg, var(--panel) 0%, var(--panel-raised) 100%); border:1px solid var(--hairline); border-radius:20px; padding:22px 20px;}
  .hero-nom{font-size:19px; font-weight:700; line-height:1.3;}
  .hero-cat{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:4px; text-transform:uppercase; letter-spacing:0.05em;}

  .statut-pill{display:inline-flex; align-items:center; gap:7px; margin-top:14px; padding:8px 14px; border-radius:24px; font-weight:700; font-size:13px;}
  .statut-pill .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .statut-pill.st-en-progression{background:var(--green-dim); color:var(--green);}
  .statut-pill.st-en-progression .dot{background:var(--green);}
  .statut-pill.st-surveiller, .statut-pill.st-dormant.a-verifier, .statut-pill.st-rupture-probable{background:var(--amber-dim); color:var(--amber);}
  .statut-pill.st-surveiller .dot, .statut-pill.st-rupture-probable .dot, .statut-pill.st-dormant.a-verifier .dot{background:var(--amber);}
  .statut-pill.st-dormant, .statut-pill.st-a-confirmer, .statut-pill.st-aucune-vente, .statut-pill.st-sans-signal{background:var(--panel-raised); color:var(--text-mid); border:1px solid var(--hairline);}
  .statut-pill.st-dormant .dot, .statut-pill.st-a-confirmer .dot, .statut-pill.st-aucune-vente .dot, .statut-pill.st-sans-signal .dot{background:var(--text-dim);}
  .statut-pill.st-strategique{background:var(--purple-dim); color:var(--purple);}
  .statut-pill.st-strategique .dot{background:var(--purple);}
  .hero-action .ha-label{font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:5px;}

  .hero-tiles{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px;}
  .hero-tile{background:var(--panel-raised); border-radius:14px; padding:13px 14px;}
  .hero-tile .ht-label{font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim);}
  .hero-tile .ht-val{font-size:18px; font-weight:700; margin-top:5px;}
  .hero-tile .ht-sub{font-family:var(--mono); font-size:9px; color:var(--text-dim); margin-top:3px;}

  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .kpi-box{background:var(--panel-raised); border-radius:8px; padding:12px;}
  .kpi-box .kl{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em;}
  .kpi-box .kv{font-family:var(--mono); font-size:17px; font-weight:700; margin-top:4px;}
  .kv.up{color:var(--green);} .kv.down{color:var(--red);}

  .histo-row{display:flex; align-items:center; gap:10px; margin-top:6px;}
  .histo-label{font-family:var(--mono); font-size:10px; color:var(--text-dim); width:68px; flex-shrink:0;}
  .histo-bar-track{flex:1; height:8px; background:var(--panel-raised); border-radius:4px; overflow:hidden;}
  .histo-bar{height:100%; background:var(--cyan); border-radius:4px;}
  .histo-val{font-family:var(--mono); font-size:11px; color:var(--text-mid); width:44px; text-align:right;}
  .histo-val-large{width:auto; min-width:44px; flex:0 1 46%; white-space:normal;}
  .histo-empty{font-size:12px; color:var(--text-mid); line-height:1.5; padding:4px 0;}

  .gap-row{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--hairline);
    font-size:12.5px;
  }
  .gap-row:last-child{border-bottom:none;}
  .gap-label{color:var(--text-mid);}
  .gap-status{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:right; max-width:180px;}

  .photo-box{width:100%; aspect-ratio:4/3; background:var(--panel-raised); border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .photo-box img{width:100%; height:100%; object-fit:contain; background:#fff;}
  .photo-empty{font-size:12px; color:var(--text-dim); text-align:center; padding:20px;}
  .photo-meta{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:8px;}
  .photo-btn{margin-top:10px; width:100%; padding:11px; border-radius:8px; border:1px solid rgba(79,195,217,0.35); background:rgba(79,195,217,0.08); color:var(--cyan); font-family:var(--sans); font-weight:600; font-size:12.5px; cursor:pointer;}
  .identite-card .photo-info .photo-btn{width:auto;margin-top:0;min-height:40px;padding:0 14px;align-self:flex-start;}
  .photo-btn:active{background:rgba(79,195,217,0.18);}
  .photo-candidats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
  .photo-candidat{background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:8px; cursor:pointer; text-align:center;}
  .photo-candidat:active{border-color:var(--cyan);}
  .photo-candidat img{width:100%; aspect-ratio:1/1; object-fit:contain; background:#fff; border-radius:4px;}
  .photo-candidat .pc-nom{font-size:10.5px; margin-top:6px; line-height:1.3; color:var(--text-mid);}
  .photo-candidat .pc-marque{font-family:var(--mono); font-size:9px; color:var(--text-dim); margin-top:2px;}
  .photo-candidat.pc-match{border-color:var(--cyan);}
  .pc-badge{display:inline-block; margin-top:5px; padding:2px 6px; border-radius:4px; background:rgba(79,195,217,0.12); color:var(--cyan); font-family:var(--mono); font-size:8.5px; font-weight:600;}
  .photo-annuler{margin-top:10px; text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); cursor:pointer; text-decoration:underline;}
  .photo-loading{font-size:12px; color:var(--text-dim); text-align:center; padding:16px 0;}

  .emplacement-modifier{font-family:var(--mono); font-size:10.5px; color:var(--cyan); cursor:pointer; text-decoration:underline;}
  .emplacement-zones{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .emplacement-zone{padding:8px 12px; border-radius:20px; border:1px solid var(--hairline); background:var(--panel-raised); color:var(--text); font-family:var(--sans); font-size:11.5px; cursor:pointer;}
  .emplacement-zone:active,.emplacement-zone:focus-visible{border-color:var(--cyan); color:var(--cyan);}
  .emplacement-zone:focus-visible,.emplacement-autre button:focus-visible,button.emplacement-modifier:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  .emplacement-zone{min-height:44px;}
  .emplacement-autre{display:flex; gap:8px; margin-top:10px;}
  .emplacement-autre input{flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-family:var(--sans); font-size:16px;}
  .emplacement-autre button{padding:9px 14px; border-radius:8px; border:1px solid rgba(79,195,217,0.35); background:rgba(79,195,217,0.08); color:var(--cyan); font-family:var(--sans); font-weight:600; font-size:12px; cursor:pointer;}

  .decision-card{
    background:var(--panel-raised); border-left:3px solid var(--cyan); border-radius:6px; padding:12px 14px; margin-top:10px;
  }
  .decision-card.expliquee{border-left-color:var(--text-dim); opacity:0.7;}
  .decision-card.actionnee{border-left-color:var(--green);}
  .decision-text{font-size:12.5px; line-height:1.5;}
  .decision-meta{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:6px;}
  .no-decision{font-size:12.5px; color:var(--text-dim); font-style:italic; padding:8px 0;}

  .section-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:2px; display:flex; align-items:center; gap:8px;}
  .section-label::after{content:''; flex:1; height:1px; background:var(--hairline);}

  .empty-state{padding:40px 20px; text-align:center; color:var(--text-dim); font-size:13px; line-height:1.6;}

  .conseiller-bubble{
    position:relative; flex:1; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:13px 16px;
  }
  .conseiller-label{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--cyan); margin-bottom:4px;}
  .conseiller-text{font-size:14px; line-height:1.55; color:var(--text);}
  /* Cycle Constat → Explication → Décision (vocabulaire NEXUS, demande de
     Frédéric le 23/07/2026) — même traitement que NEXUS-Rayon-v1.html. */
  .cycle-step{margin-bottom:5px;}
  .cycle-step:last-child{margin-bottom:0;}
  .cycle-tag{font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-right:6px;}
  .cycle-tag.tag-decision{color:var(--amber);}

  footer{margin-top:auto; padding:16px 0 24px; font-family:var(--sans); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}

/* ===== Refonte visuelle phase 1 (presentation uniquement) ===== */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-0.2em;}

/* Bandeau (charte Campagne) */
.header{position:relative; margin:12px 0 0; border-radius:14px; overflow:hidden; border:1px solid var(--t-line); min-height:190px; display:flex; align-items:flex-end; background:#0D202E;}
.header picture{position:absolute; inset:0; display:block;}
.header img.entete{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--banniere-cadrage);}
.header::after{content:''; position:absolute; inset:0; background:linear-gradient(0deg, rgba(7,19,30,.86) 0%, rgba(7,19,30,.55) 45%, rgba(7,19,30,.15) 100%);}
:root[data-theme="jour"] .header::after{background:linear-gradient(0deg, rgba(7,19,30,.78) 0%, rgba(7,19,30,.45) 45%, rgba(7,19,30,.08) 100%);}
@media (max-width:599px){.header{min-height:210px;} .header::after, :root[data-theme="jour"] .header::after{background:linear-gradient(0deg, rgba(7,19,30,.94) 0%, rgba(7,19,30,.82) 50%, rgba(7,19,30,.5) 100%);}}
.header-texte{position:relative; z-index:1; padding:18px; width:100%; color:#EDF1F5;}
.eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#7FE9F0;}
.title{font-size:26px; font-weight:600; margin-top:4px;}
.subtitle{font-size:14px; color:#C9D3DC; margin-top:4px;}
.menu-btn{position:absolute; z-index:2; top:12px; left:12px; text-decoration:none; font-size:12px; padding:9px 13px; min-height:44px; display:inline-flex; align-items:center; gap:6px; border-radius:20px; background:rgba(7,19,30,.72); color:#EDF1F5; border:1px solid rgba(255,255,255,.25);}
.selecteurs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;}
.pastille{display:inline-block;padding:4px 10px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(7,19,30,.6);font-size:11px;color:#EDF1F5;}
.pastille[hidden]{display:none;}
.pastille:empty{display:none;}

/* Cartes, Conseiller et champ (charte Campagne) */
.carte{background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:18px;}
.conseiller{border-color:var(--t-cyan); margin-top:18px; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start;}
.conseiller>.obs-bloc{flex:1 1 100%;min-width:0;}
.conseiller-avatar{width:80px;height:80px;border-radius:50%;flex:none;object-fit:cover;filter:none;}
.conseiller-sous{font-size:18px;font-weight:600;line-height:1.3;color:var(--t-text);margin-bottom:6px;}
@media (min-width:768px){.conseiller{gap:22px;align-items:center;} .conseiller-avatar{width:120px;height:120px;}}
.conseiller-corps{min-width:0;flex:1;}
.conseiller-titre{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-cyan); margin-bottom:6px;}
.conseiller p{font-size:14.5px; line-height:1.6; margin-top:4px; overflow-wrap:anywhere;}
details.comprendre{margin-top:10px;}
details.comprendre>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;font-weight:600;color:var(--t-cyan);}
details.comprendre>summary::-webkit-details-marker{display:none;}
details.comprendre>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--t-mid);border-bottom:2px solid var(--t-mid);transform:rotate(45deg);transition:transform .15s;}
details.comprendre[open]>summary::after{transform:rotate(-135deg);}
.champ{margin:18px 0 0;}
.champ label{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--t-mid); margin-bottom:8px;}
.champ input[type=text]{width:100%; background:var(--t-raised); border:1px solid var(--t-line); border-radius:8px; padding:10px 11px; min-height:44px; color:var(--t-text); font-family:var(--t-sans); font-size:16px;}
.champ input::placeholder{color:var(--t-mid);}
.champ input:focus-visible{outline:2px solid var(--t-cyan); outline-offset:1px;}

/* Recherche (combobox) */
.suggestions[hidden]{display:none;}
button.suggestion-item{width:100%;text-align:left;font:inherit;font-size:13px;color:inherit;min-height:44px;}
.suggestion-item.is-active,.suggestion-item:focus-visible{border-color:var(--cyan);background:var(--panel-raised);outline:2px solid var(--cyan);outline-offset:-2px;}


/* Disposition fiche */
.top-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.identite-card{display:grid;grid-template-columns:112px 1fr;grid-template-areas:"photo texte" "info info";gap:10px 14px;align-items:center;}
.identite-card #photoCardZone{display:contents;}
.identite-card .photo-box{grid-area:photo;width:112px;height:112px;aspect-ratio:auto;margin:0;border-radius:12px;background:#fff;border:1px solid var(--hairline);}
.identite-card .photo-box img{width:100%;height:100%;object-fit:contain;background:#fff;}
.identite-card .photo-info{grid-area:info;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;}
.identite-card .photo-info .photo-meta{margin:0;}
.identite-texte{grid-area:texte;min-width:0;}
.identite-texte .hero-nom{margin:0;overflow-wrap:anywhere;}
.identite-texte .hero-cat{margin:4px 0 8px;}
.photo-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;}
:root[data-theme="jour"] .photo-btn{background:#fff;border-color:var(--cyan);color:var(--cyan);}
.statut-repli{display:inline-block;padding:4px 10px;border:1px solid var(--hairline);border-radius:999px;font-size:12px;color:var(--text);}
.conseiller-pied{margin-top:10px;}
.conseiller-pied .periode-tendance,.cycle-step .periode-tendance{display:block;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--text-mid);}
.avert-tendance{display:block;margin-top:8px;font-size:12px;line-height:1.5;color:var(--amber);}
:root[data-theme="jour"] .hero-action{background:var(--panel-raised);border-color:var(--hairline);}
:root[data-theme="jour"] .conseiller-avatar{filter:none;}

/* Indicateurs */
.ind-niveau{display:grid;gap:8px;}
.ind-principal{grid-template-columns:1fr 1fr;margin-bottom:8px;}
.ind-principal .ind-tile:first-child{grid-column:1 / -1;}
.ind-secondaire{grid-template-columns:1fr 1fr;}
.ind-tile{background:var(--t-raised);border:1px solid var(--t-line);border-radius:12px;padding:14px;min-width:0;}
.ind-principal .ind-tile{padding:16px 18px;border-radius:12px;container-type:inline-size;}
.ind-label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t-mid);}
.ind-principal .ind-label{font-size:12px;}
.ind-val{font-family:var(--t-sans);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;margin-top:6px;white-space:nowrap;}

function svgIco(d) { return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>'; }
const ICO = {
  camera: svgIco('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  search: svgIco('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  ca: svgIco('<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>'),
  unites: svgIco('<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>'),

nexusRequireAuth().then(async employee => {
  if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
  if (employee.role !== 'manager' && employee.role !== 'gerant') {

  // Cockpit/CIN/Scanner des que products a depasse 1000 lignes).
  async function fetchAllRows(builderFactory, pageSize = 1000) {
    let toutes = [];
    let from = 0;
    while (true) {
      const { data, error } = await builderFactory().range(from, from + pageSize - 1);
      if (error) return { data: null, error };
      toutes = toutes.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }

  // NexusConseiller.DUREE_RELEVE_STOCK_JOURS jours, un seul par article.
  // LECTURES compte les lignes réellement lues (mesure, exposée à la recette).
  // Limite connue : deux périodes de même début mais de fin différente ne sont
  // pas distinguées lors du parcours des dates.
  // ------------------------------------------------------------
  const LECTURES = { products: 0, stock_releves: 0, periodes: 0 };
  window.NEXUS_LECTURES_PRODUITS = LECTURES;
  const COLONNES_PRODUCTS = 'categorie, article, ca, marge, prix_achat, prix_vente, tva, quantite, periode_debut, periode_fin, code_barres';
  const NB_PERIODES_MAX = 6;
  let AUJOURDHUI_STATION = null;
  let PERIODE_DONNEES = null;

  function jourDeLaStation(fuseau) {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: fuseau || 'America/Martinique' }).format(new Date()); }
    catch (_) { return new Date().toISOString().slice(0, 10); }
  }
  function fmtJourFr(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso || '');
  }
  function libellePeriode(per) { return `du ${fmtJourFr(per.debut)} au ${fmtJourFr(per.fin)}`; }

  // Recherche : minuscules, sans accents, espaces réduits (« crème » = « creme »).
  function normaliserRecherche(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  }

  let CACHE_LISTE = null;
  function listerPeriodes() {
    if (!CACHE_LISTE) CACHE_LISTE = listerPeriodesBrutes();
    return CACHE_LISTE;
  }
  async function listerPeriodesBrutes() {
    const periodes = [];
    let borne = null;
    for (let i = 0; i < NB_PERIODES_MAX; i++) {
      let q = nexusClient.from('products').select('periode_debut, periode_fin')
        .eq('site', SITE_ACTUEL).order('periode_debut', { ascending: false }).limit(1);
      if (borne) q = q.lt('periode_debut', borne);
      const { data, error } = await q;
      if (error) { console.error('Liste des périodes products:', error); return null; }
      if (!data || !data.length) break;
      LECTURES.periodes += data.length;
      periodes.push(data[0]);
      borne = data[0].periode_debut;
    }
    return periodes;
  }

  const CACHE_PERIODES = new Map();
  function lirePeriode(per) {
    const cle = per.debut + '|' + per.fin;
    if (!CACHE_PERIODES.has(cle)) CACHE_PERIODES.set(cle, lirePeriodeBrute(per));
    return CACHE_PERIODES.get(cle);
  }
  async function lirePeriodeBrute(per) {
    const { data, error } = await fetchAllRows(() => nexusClient.from('products').select(COLONNES_PRODUCTS)
      .eq('site', SITE_ACTUEL).eq('periode_debut', per.debut).eq('periode_fin', per.fin)
      .order('article', { ascending: true }));
    if (error) { console.error('Chargement products (période):', error); return null; }
    LECTURES.products += (data || []).length;
    return data || [];
  }

  // Dernier relevé de stock par article (nom exact), limité aux relevés récents.
  let CACHE_STOCK = null;
  function lireStockRecent(aujourdhui) {
    if (!CACHE_STOCK) CACHE_STOCK = lireStockRecentBrut(aujourdhui);
    return CACHE_STOCK;
  }
  async function lireStockRecentBrut(aujourdhui) {
    const dMs = Date.parse(aujourdhui + 'T00:00:00Z') - NexusConseiller.DUREE_RELEVE_STOCK_JOURS * 86400000;
    const depuis = new Date(dMs).toISOString().slice(0, 10);
    const { data, error } = await fetchAllRows(() => nexusClient.from('stock_releves')
      .select('categorie, article, code_barres, quantite_theorique, quantite_reelle, releve_le')
      .eq('site', SITE_ACTUEL).gte('releve_le', depuis)
      .order('releve_le', { ascending: false }).order('article', { ascending: true }));
    if (error) { console.error('Chargement stock_releves (récent):', error); return {}; }
    LECTURES.stock_releves += (data || []).length;
    const parArticle = {};
    (data || []).forEach(r => { if (!parArticle[r.article]) parArticle[r.article] = r; });
    return parArticle;
  }

  async function construireProduitsLive() {
    // Fuseau du site : fraîcheur de la paire et période « en cours » mesurées dans le jour de la station.
    const FUSEAU_TENDANCE = (typeof nexusFuseauSite === 'function') ? await nexusFuseauSite(SITE_ACTUEL) : null;
    AUJOURDHUI_STATION = jourDeLaStation(FUSEAU_TENDANCE);
    const periodesBrutes = await listerPeriodes();
    if (!periodesBrutes || !periodesBrutes.length) { console.error('Aucune période dans products.'); return []; }

    // Le moteur partagé nexus-periodes.js sépare « période affichée » (la plus récente,
    // même en cours) de « paire comparable » (évolution T1→T2 seulement). Il n'a besoin
    // que des dates : on lui passe les dates, puis on ne lit que les lignes utiles.
    const analyseDates = NexusPeriodes.analyserPeriodes(periodesBrutes, { appariement: 'dernieres', fuseau: FUSEAU_TENDANCE });
    const { periodesTriees, periodeAffichage, paire, periodeEnCours } = analyseDates;
    if (!periodeAffichage) { console.error('Aucune période exploitable dans products.'); return []; }
    PERIODE_DONNEES = periodeAffichage;

    const completes = periodesTriees.slice(periodeEnCours ? 1 : 0);
    const aCharger = [periodeAffichage];
    const ajouter = per => { if (per && !aCharger.some(x => x.debut === per.debut && x.fin === per.fin)) aCharger.push(per); };
    if (paire) { ajouter(paire.actuelle); ajouter(paire.precedente); }
    completes.slice(0, NexusConseiller.DUREE_DORMANT_PERIODES).forEach(ajouter);

    const lots = await Promise.all(aCharger.map(lirePeriode));
    if (lots.some(l => l === null)) return [];
    const parPeriode = {};
    aCharger.forEach((per, i) => { parPeriode[per.debut + '|' + per.fin] = lots[i]; });
    const rowsDe = per => (per && parPeriode[per.debut + '|' + per.fin]) || [];
    const rowsAffichage = rowsDe(periodeAffichage);
    const rowsPaireActuelle = paire ? rowsDe(paire.actuelle) : [];
    const rowsPairePrecedente = paire ? rowsDe(paire.precedente) : [];

    const stockParArticle = await lireStockRecent(AUJOURDHUI_STATION);

    const precedentParArticle = {};
    rowsPairePrecedente.forEach(r => {
      const cle = r.categorie + '|' + r.article;
      precedentParArticle[cle] = precedentParArticle[cle] || r;
    });
    const actuelParArticlePaire = {};
    rowsPaireActuelle.forEach(r => {
      const cle = r.categorie + '|' + r.article;
      actuelParArticlePaire[cle] = actuelParArticlePaire[cle] || r;
    });

    const caTotalParRayon = {};
    rowsAffichage.forEach(r => { caTotalParRayon[r.categorie] = (caTotalParRayon[r.categorie] || 0) + (r.ca || 0); });

    // Périodes complètes lues (récentes d'abord) : sert au compte de périodes sans vente.
    // Limite connue (arbitrée) : deux imports de même début mais de fin différente ne sont pas
    // distingués ; on ne retient qu'une période par début.
    const completesLues = completes.slice(0, NexusConseiller.DUREE_DORMANT_PERIODES);
    const ventesParPeriode = completesLues.map(per => {
      const s = new Set();
      rowsDe(per).forEach(r => { if ((r.ca || 0) > 0) s.add(r.categorie + '|' + r.article); });
      return s;
    });
    function periodesSansVente(cle) {
      let n = 0;
      for (const s of ventesParPeriode) { if (s.has(cle)) break; n++; }
      return n;
    }
    const periodeTendance = paire ? libellePeriode(paire.actuelle) : null;
    const stockDe = nom => {
      const r = stockParArticle[nom];
      if (!r) return null;
      const q = r.quantite_reelle != null ? r.quantite_reelle : r.quantite_theorique;
      return { quantite: q, releve_le: r.releve_le };
    };

    const produits = rowsAffichage.map(p => {
      const cle = p.categorie + '|' + p.article;
      const caRayon = caTotalParRayon[p.categorie] || 0;
      const pct_contrib = caRayon > 0 ? p.ca / caRayon : null;

      const pairPrec = paire ? (precedentParArticle[cle] || null) : null;
      const pairAct = paire ? (actuelParArticlePaire[cle] || null) : null;

      // Tendance commune (lot 1 Produits, PR B) : ventes moyennes par jour,
      // paire fraîche (21 j), plancher de volume. Sinon : pas de recommandation.
      // Le statut affiché vient de statutProduit() (source unique) ; l'ancien
      // calcul du statut par article (jamais affiché) est retiré.
      const tendance = (pairPrec && pairAct)
        ? NexusPeriodes.tendanceArticle(
            { caT1: pairPrec.ca, quantiteT1: pairPrec.quantite, caT2: pairAct.ca, quantiteT2: pairAct.quantite },
            paire, { seuilCA: NexusConseiller.SEUIL_VOLUME_CA_EUR, fuseau: FUSEAU_TENDANCE })
        : null;

      return {
        article: p.article, categorie: p.categorie, code_barres: p.code_barres || null,
        pu_ht: p.prix_vente, pma: p.prix_achat,
        marge_pct: p.ca > 0 ? (p.marge || 0) / p.ca : 0, marge_totale: p.marge || 0,
        // ca_t2/qte_t2 : toujours la période affichée (la plus récente, même en cours).
        ca_t2: p.ca, qte_t2: p.quantite || 0,
        // ca_t1/qte_t1 (T1) et ca_t2_pair/qte_t2_pair (T2 de la comparaison) :
        // toujours la dernière paire comparable, indépendamment de la période affichée.
        ca_t1: pairPrec ? pairPrec.ca : 0, qte_t1: pairPrec ? (pairPrec.quantite || 0) : 0,
        ca_t2_pair: pairAct ? pairAct.ca : 0, qte_t2_pair: pairAct ? (pairAct.quantite || 0) : 0,
        ca_s1: (pairPrec ? pairPrec.ca : 0) + (pairAct ? pairAct.ca : 0),
        pairDisponible: !!paire,
        pairEstPeriodeAffichee: !!(paire && !periodeEnCours),
        pairDates: paire ? { debutT1: paire.precedente.debut, finT1: paire.precedente.fin, debutT2: paire.actuelle.debut, finT2: paire.actuelle.fin } : null,
        periode_debut: p.periode_debut, periode_fin: p.periode_fin,
        pct_contrib, tendance, tendance_statut: tendance ? tendance.statut : null, tendance_message: tendance ? tendance.message : null,
        periodesSansVente: (p.ca || 0) > 0 ? 0 : periodesSansVente(cle), connuParVentes: true,
        stock: stockDe(p.article), periodeTendance, source: null,
      };
    });

    // Articles connus hors période affichée : périodes complètes déjà lues, puis stock récent.
    // Jamais de fusion de deux noms : correspondance sur le nom exact uniquement.
    const connus = new Set(produits.map(p => p.categorie + '|' + p.article));
    const nomsConnus = new Set(produits.map(p => p.article));
    completesLues.forEach(per => {
      rowsDe(per).forEach(r => {
        const cle = r.categorie + '|' + r.article;
        if (connus.has(cle)) return;
        connus.add(cle); nomsConnus.add(r.article);
        produits.push({
          article: r.article, categorie: r.categorie, code_barres: r.code_barres || null,
          pu_ht: r.prix_vente, pma: r.prix_achat, marge_pct: 0, marge_totale: 0,
          ca_t2: 0, qte_t2: 0, ca_t1: 0, qte_t1: 0, ca_t2_pair: 0, qte_t2_pair: 0, ca_s1: 0,
          pairDisponible: !!paire, pairEstPeriodeAffichee: false, pairDates: null,
          periode_debut: periodeAffichage.debut, periode_fin: periodeAffichage.fin,
          pct_contrib: null, tendance: null, tendance_statut: null, tendance_message: null,
          periodesSansVente: periodesSansVente(cle), connuParVentes: true, stock: stockDe(r.article), periodeTendance, source: `période ${libellePeriode(per)}`,
        });
      });
    });
    Object.keys(stockParArticle).forEach(nom => {
      if (nomsConnus.has(nom)) return;
      const r = stockParArticle[nom];
      nomsConnus.add(nom);
      produits.push({
        article: r.article, categorie: r.categorie || 'Stock', code_barres: r.code_barres || null,
        pu_ht: null, pma: null, marge_pct: 0, marge_totale: 0,
        ca_t2: 0, qte_t2: 0, ca_t1: 0, qte_t1: 0, ca_t2_pair: 0, qte_t2_pair: 0, ca_s1: 0,
        pairDisponible: !!paire, pairEstPeriodeAffichee: false, pairDates: null,
        periode_debut: periodeAffichage.debut, periode_fin: periodeAffichage.fin,
        pct_contrib: null, tendance: null, tendance_statut: null, tendance_message: null,
        // Connu seulement par le stock : par construction (nom exact absent des périodes lues),
        // aucune vente sur l'ensemble des périodes complètes chargées.
        periodesSansVente: completesLues.length, connuParVentes: false, stock: stockDe(r.article), periodeTendance, source: `stock du ${fmtJourFr(r.releve_le)}`,
      });
    });
    return produits;
  }

  // CORRECTIF 08/08/2026 (retour de Frédéric, Article 11 de la Constitution
  // NEXUS — "une seule vérité") : cette page avait sa propre copie de
  // typeActionPourCategorie/LANGAGE_ACTION, avec le même symptôme que celle
  // trouvée et corrigée le même jour dans le Centre d'Intelligence — le
  // texte avait dérivé de celui du Cockpit ("Vérifiez et renforcez..." au
  // lieu de "Je recommande de vérifier et renforcer..."). Utilise
  // désormais NexusConseiller.typeActionPourCategorie / .LANGAGE_ACTION,
  // la même source que le Cockpit, le CIN et l'accueil.

  // Statut du produit en 8 états (lot 2, 11/11/2026) : Stratégique, En progression,
  // À surveiller, Tendance à confirmer, Aucune vente récente, Dormant, Rupture
  // probable, Sans signal particulier. La règle vit dans NexusConseiller.statutProduit
  // (seuils et durées exportés, jamais copiés ici). l'ancien statut « performant » n'existe plus.
  // Une référence exclue des indicateurs commerciaux (opération de caisse, par règle ou par
  // déclaration) n'a ni statut stratégique, ni part de rayon, ni classement.
  const TEXTE_HORS_INDICATEURS = 'Hors indicateurs commerciaux : aucune recommandation.';
  function horsIndicateurs(p) {
    return !!(p && p.mesure && p.mesure.exclue_indicateurs);
  }
  function calculerStatutSimplifie(p) {
    if (p && p.mesure && p.mesure.exclue_indicateurs) return { cle: 'operation-caisse', label: 'Opération de caisse', niveau: null, action: null };
    // Règle unique : NexusConseiller.statutProduit (lot 2, 11/11/2026). La page ne
    // décide plus rien ; elle échappe seulement le texte d'action avant affichage.
    const st = NexusConseiller.statutProduit(p, AUJOURDHUI_STATION);
    return { cle: st.cle, label: st.label, niveau: st.niveau, action: st.action == null ? null : esc(st.action) };
  }

  // Rang du produit dans son rayon, par CA de la période actuelle — calcul
  // immédiat à partir de PRODUCTS déjà chargé, aucune requête supplémentaire.
  function calculerRangRayon(p) {
    const memeRayon = PRODUCTS.filter(x => x.categorie === p.categorie).slice().sort((a, b) => b.ca_t2 - a.ca_t2);
    const rang = memeRayon.findIndex(x => x.article === p.article) + 1;
    return { rang, total: memeRayon.length };
  }

  // Photos produits (source Open Food Facts, accord de Frédéric le
  // 22/07/2026) — table séparée de `products` (voir migration
  // migration-product-photos-v1.sql pour le pourquoi), lue une fois ici
  // et indexée par le même couple categorie|article que PRODUCTS.
  async function chargerPhotosProduits() {
    const { data, error } = await nexusClient
      .from('product_photos')
      .select('categorie, article, photo_url, source, verifie_le')
      .eq('site', SITE_ACTUEL);
    if (error) { console.error('Chargement product_photos:', error); return {}; }
    const map = {};
    (data || []).forEach(row => { map[row.categorie + '|' + row.article] = row; });
    return map;
  }

  // P1-A : mesures factuelles (NexusProduitsMesure) attachées à chaque produit de la période affichée.
  // Lecture seule ; les périodes et le stock sont ceux déjà lus par construireProduitsLive (cache).
  async function attacherMesures(produits) {
    try {
      if (!PERIODE_DONNEES) return produits;
      const per = PERIODE_DONNEES;
      const rows = await lirePeriode(per);
      if (!rows || !rows.length) return produits;
      const periodes = await listerPeriodes();
      const i = (periodes || []).findIndex(x => x.periode_debut === per.debut && x.periode_fin === per.fin);
      const prec = i >= 0 && periodes[i + 1] ? { debut: periodes[i + 1].periode_debut, fin: periodes[i + 1].periode_fin } : null;
      const rowsPrec = prec ? await lirePeriode(prec) : null;
      LIGNES_PRECEDENTES = rowsPrec || [];
      const stock = await lireStockRecent(AUJOURDHUI_STATION);
      // P1-B : déclarations d'un responsable (nature, TVA confirmée, justification). Lecture seule ici ;
      // une table absente ou refusée ne bloque jamais la fiche, les mesures restent celles de l'import.
      const decl = {};
      for (const t of ['produits_nature_reference', 'produits_justifications_marge', 'produits_tva_confirmations']) {
        try {
          const r = await nexusClient.from(t).select('*').eq('site', SITE_ACTUEL);
          decl[t] = r.error ? [] : (r.data || []);
        } catch (e) { decl[t] = []; }
      }
      DECLARATIONS_PRODUITS = decl;
      // S2 : Marge+ R5 en lecture seule (produits d'appel, exceptions, décisions). Table absente ou refusée = liste vide.
      const margeLect = {};
      for (const t of ['produits_appel', 'marge_exceptions', 'journal_decisions']) {
        try {
          const r = await nexusClient.from(t).select('*').eq('site', SITE_ACTUEL);
          margeLect[t] = r.error ? [] : (r.data || []);
        } catch (e) { margeLect[t] = []; }
      }
      LECTURES_MARGE = margeLect;
      // P1-D : dernier comptage physique d'Inventaire (lecture seule, tolérante : table absente ou refusée = aucun comptage).
      COMPTAGES_PRODUITS = await lireComptagesInventaire();
      // P1-E : promotions de Campagne (lecture seule, tolérante : table absente ou refusée = aucune promotion).
      PROMOTIONS_BRUTES = await lirePromotionsCampagne();
      const res = NexusProduitsMesure.mesurer({
        products: rows, site: SITE_ACTUEL, periodeDebut: per.debut, periodeFin: per.fin,
        precedent: rowsPrec && rowsPrec.length ? { rows: rowsPrec, debut: prec.debut, fin: prec.fin } : null,
        stockReleves: Object.keys(stock || {}).map(k => stock[k]), dateReference: AUJOURDHUI_STATION,
        natures: decl.produits_nature_reference, tvaConfirmations: decl.produits_tva_confirmations, justifications: decl.produits_justifications_marge,
      });
      SYNTHESE_PRODUITS = res.resume.synthese; RESUME_PRODUITS = res.resume;
      SYNTHESE_STOCK_DATE = Object.keys(stock || {}).map(k => stock[k] && stock[k].releve_le).filter(Boolean).sort().pop() || null;
      MESURES_PRODUITS = res.mesures.map((m, k) => ({ m, row: rows[k] }));
      produits.forEach(p => { p.mesure = res.index.get(NexusProduitsMesure.normaliserNom(p.article)) || null; });
    } catch (e) { console.error('Mesures produits (P1-A/P1-B):', e); }
    return produits;
  }
  async function lireComptagesInventaire() {
    const out = new Map();
    try {
      const z = await fetchAllRows(() => nexusClient.from('inventaire_zone_produit').select('id,designation').eq('site', SITE_ACTUEL).order('id'));
      if (z.error || !z.data || !z.data.length) return out;
      const nomDe = new Map(z.data.map(x => [x.id, x.designation]));
      const c = await fetchAllRows(() => nexusClient.from('inventaire_comptages').select('id,produit_id,quantite,compte_le').eq('site', SITE_ACTUEL).eq('statut', 'valide').order('id'));
      if (c.error || !c.data) return out;
      c.data.forEach(r => {
        const nom = nomDe.get(r.produit_id); if (!nom || r.quantite === null || r.quantite === undefined) return;
        const k = NexusProduitsMesure.normaliserNom(nom), cur = out.get(k);
        if (!cur || String(r.compte_le) > String(cur.compte_le)) out.set(k, { quantite: Number(r.quantite), compte_le: r.compte_le });
      });
    } catch (e) { return new Map(); }
    return out;
  }
  // P1-E : lecture seule des promotions de Campagne, filtrée par site. Aucun calcul de Campagne n'est refait :
  // les statuts viennent de NexusCampagneOutils / NexusCampagneVentes, chargés tels quels.
  async function lirePromotionsCampagne() {
    try {
      if (!window.NexusCampagneOutils || !window.NexusCampagneVentes || !window.NexusProduitsVues) return null;
      const c = await nexusClient.from('campagnes_nexus').select('id, nom, date_debut, date_fin, produits_concernes').eq('site', SITE_ACTUEL).order('date_debut', { ascending: false });
      if (c.error || !c.data || !c.data.length) return null;
      const objectifs = new Map(), points = new Map();
      for (const camp of c.data) {
        const o = await nexusClient.from('campagne_objectifs_produits').select('article, version, seuil_unites, objectif_valide_jour, pa_promo_ht').eq('campagne_id', camp.id).eq('site', SITE_ACTUEL).order('version', { ascending: true });
        objectifs.set(camp.id, o.error ? [] : (o.data || []));
        const v = await nexusClient.from('campagne_ventes_points').select('batch_id, article, date_fin, importe_le, quantite, ca_ht, ca_estime, absent_du_fichier').eq('campagne_id', camp.id).eq('site', SITE_ACTUEL).order('importe_le', { ascending: false });
        points.set(camp.id, v.error ? [] : (v.data || []));
      }
      const an = await nexusClient.from('campagne_ventes_annulations').select('batch_id, motif').eq('site', SITE_ACTUEL);
      // Lectures brutes seulement : le rapprochement avec les produits du site se fait à l'usage (promotionsCourantes),
      // car PRODUCTS n'est pas encore chargé à ce stade.
      return { campagnes: c.data, objectifs, points, annulations: an.error ? [] : (an.data || []) };
    } catch (e) { return null; }
  }
  function promotionsCourantes() {
    const b = PROMOTIONS_BRUTES;
    if (!b || !window.NexusProduitsVues || !window.NexusCampagneOutils || !window.NexusCampagneVentes) return [];
    try {
      return NexusProduitsVues.promotions({ ...b, auj: AUJOURDHUI_STATION, articlesSite: PRODUCTS_NOMS_SITE(),
        outils: NexusCampagneOutils, ventes: NexusCampagneVentes, normaliserNom: NexusProduitsMesure.normaliserNom });
    } catch (e) { return []; }
  }
  const PRODUCTS_NOMS_SITE = () => (typeof PRODUCTS !== 'undefined' && PRODUCTS ? PRODUCTS : []).map(p => p.article);
  let PROMOTIONS_BRUTES = null;

  function fmtN(v, d) { return v === null || v === undefined ? 'n.d.' : Number(v).toFixed(d).replace('.', ','); }

  function fmtPct(v) { return (v*100).toFixed(1).replace('.', ',') + '\u00a0%'; }

  // Date et heure dans le fuseau de la station (jamais UTC ni le fuseau du navigateur).

  function fmtDate(d) {
    if (!d) return 'n.d.';

  // ---- Apercu de recette (?apercu_produit=1, site nexus-station-test uniquement) ----
  // Donnees fictives en memoire. Aucune ecriture, aucun appel reseau.
  function clientApercu() {
    const DEMO = {
      stock_releves: [{ quantite_theorique: 24, quantite_reelle: 20, releve_le: '2026-08-20' }],
      product_locations: [{ emplacement: 'Allée 3 · Rayon frais', source: 'auto_categorie', article: 'APERCU' }]
    };
    const refus = { data: null, error: { message: 'Aperçu : écriture désactivée' } };
    function chaine(table) {
      let ecriture = false;
      const q = {};
      ['select','eq','neq','in','is','not','gte','lte','gt','lt','like','ilike','order','limit','range','match','or','filter','contains'].forEach(m => { q[m] = () => q; });
      ['insert','update','upsert','delete'].forEach(m => { q[m] = () => { ecriture = true; return q; }; });
      const lignes = () => DEMO[table] || [];
      q.maybeSingle = () => Promise.resolve(ecriture ? refus : { data: lignes()[0] || null, error: null });
      q.single = q.maybeSingle;
      q.then = (ok, ko) => Promise.resolve(ecriture ? refus : { data: lignes(), error: null }).then(ok, ko);
      return q;
    }
    return {
      from: chaine,
      rpc: () => Promise.resolve(refus),
      storage: { from: () => ({ upload: () => Promise.resolve(refus), createSignedUrl: () => Promise.resolve(refus), getPublicUrl: () => ({ data: { publicUrl: '' } }) }) },
      functions: { invoke: () => Promise.resolve(refus) },
      auth: { getSession: () => Promise.resolve({ data: { session: null }, error: null }) }
    };
  }

  function showProduct(articleName) {

    const tend = p.tendance || null;

    const evolQte = tendQualifiee ? tend.evolutionQuantite : 0;
    const evolCa = tendQualifiee ? tend.evolutionCA : 0;
    const msgTendance = !tend ? null
      : tend.statut === 'insuffisante' ? tend.message
      : tend.statut === 'perimee' ? 'Comparaison périmée : la dernière période comparée est trop ancienne pour établir une tendance actuelle.'
      : null;
    const avertsTendance = (tend && tendQualifiee && tend.avertissements.length)

    // Durées et CA total réels de chaque période (arbitrage 6780846054) : l'évolution
    // ci-dessous porte sur les ventes moyennes par jour, jamais sur le CA total.
    const periodesTendance = (tend && tend.periodes)
      ? (() => {

        })() : '';
    // Histogramme en unités moyennes par jour (jamais en totaux bruts de durées différentes).
    const tp = (tend && tend.periodes) ? tend.periodes : null;
    const fmtJ = n => Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 1 });
    const barre = (t, brut) => tp
      ? { v: Number(t.quantite_moyenne_jour) || 0, txt: `${fmtJ(t.quantite_moyenne_jour || 0)} u./j (${esc(t.quantite)} u. sur ${esc(t.duree)} j)` }
      : { v: Number(brut) || 0, txt: `${esc(brut)} u.` };
    const bT1 = barre(tp && tp.t1, p.qte_t1), bT2 = barre(tp && tp.t2, p.qte_t2_pair);
    const maxQte = Math.max(bT1.v, bT2.v, 1e-9);

    // Statut simplifié + rang rayon : voir calculerStatutSimplifie() et
    // calculerRangRayon() — remplace l'ancien bloc "Décisions prioritaires"

    const statutSimplifie = calculerStatutSimplifie(p);
    const rangRayon = calculerRangRayon(p);
    const horsInd = horsIndicateurs(p);

    // ------------------------------------------------------------
    // Refonte visuelle phase 1 : aucune formule, aucun seuil, aucun statut
    // metier modifie. Les valeurs viennent de p, calculerStatutSimplifie() et

    // ------------------------------------------------------------

    // Periode de la paire comparable (T1 contre T2) : lue dans pairDates,
    // jamais codee en dur. Toute tendance affichee la porte.
    const periodePaire = (p.pairDisponible && p.pairDates)
      ? `période précédente ${fmtDate(p.pairDates.debutT1)} → ${fmtDate(p.pairDates.finT1)} contre dernière période ${fmtDate(p.pairDates.debutT2)} → ${fmtDate(p.pairDates.finT2)}`

    } else {

    }

    const histoHtml = p.pairDisponible ? `
      <div class="histo-row">
        <span class="histo-label">Précédente</span>
        <div class="histo-bar-track"><div class="histo-bar" style="width:${Number(bT1.v/maxQte*100) || 0}%; background:var(--text-dim);"></div></div>

        <span class="histo-label">Dernière</span>

      <div class="kpi-grid">

      </div>
      ${!p.pairEstPeriodeAffichee ? `<div class="histo-empty" style="margin-top:10px;">La période affichée en tête de fiche (${esc(p.periode_debut)} → ${esc(p.periode_fin)}) est encore trop récente pour être comparée équitablement : cette évolution porte donc sur les deux dernières périodes importées.</div>` : ''}` : `

    const phraseMesure = mes ? NexusProduitsMesure.phrase(mes) : '';

    const datePmp = mes && mes.pmp.date_export ? fmtDate(mes.pmp.date_export) : null;

          ${ligneMes('Marge unitaire', mes.marge_unitaire.valeur !== null ? `${fmtN(mes.marge_unitaire.valeur, 2)} €` : 'n.d.')}
          ${ligneMes('Marge totale', mes.marge_totale.valeur !== null ? `${fmtN(mes.marge_totale.valeur, 2)} € (estimée au PMP Decenium du ${esc(fmtDate(mes.pmp.date_export))})` : 'n.d.')}
          ${ligneMes('Taux de marque', mes.taux_marque.valeur !== null ? `${fmtN(mes.taux_marque.valeur, 2)} %` : 'n.d.')}
          ${ligneMes('Part de la marge du rayon', mes.part_marge_rayon.valeur !== null ? `${fmtN(mes.part_marge_rayon.valeur, 2)} %` : 'n.d.')}
          ${ligneMes('Part du CA du rayon', mes.part_ca_rayon.valeur !== null ? `${fmtN(mes.part_ca_rayon.valeur, 2)} %` : 'n.d.')}` : '';

    // Observation factuelle sous le statut du Conseiller : jamais une tendance confirmee.
    const obs = mes && mes.observation ? mes.observation : null;
    const sousSeuil = obs && obs.ca_precedent !== null && obs.ca_precedent !== undefined && obs.ca_precedent < NexusConseiller.SEUIL_VOLUME_CA_EUR;
    const observationHtml = obs ? `
            <div class="obs-bloc">
              <div class="obs-titre">${esc(obs.libelle)}</div>
              <div class="obs-boites">
                <div class="obs-boite">${fmtN(obs.ventes_jour_precedent, 2)} → ${fmtN(obs.ventes_jour_actuel, 2)} u./jour</div>
                <div class="obs-boite">${obs.variation_pct >= 0 ? '+' : ''}${Math.round(obs.variation_pct)} % observé</div>
              </div>
              ${sousSeuil ? `<div class="obs-mention">observation, pas une tendance confirmée (CA de la période précédente sous le seuil de ${NexusConseiller.SEUIL_VOLUME_CA_EUR} €)</div>` : ''}
            </div>` : '';

    const scTxt = scannerTexteFiche(p.article);
    const scMarge = scannerTexteMarge(p.article);
    const scNorm = scannerNormalise(p.article);
    const scannerHtml = (scTxt || scMarge) ? `<div class="obs-bloc"${scNorm ? ` data-regle="${esc(scNorm.ruleId)}"` : ''}><div class="obs-titre">Scanner tarifaire</div>${scTxt ? `<div class="obs-mention">${esc(scTxt)}</div>` : ''}${scMarge ? `<div class="obs-mention">${esc(scMarge)}</div>` : ''}</div>` : '';
    const rangTxt = mes && mes.rang.valeur !== null ? `Rang ${mes.rang.valeur} sur ${mes.rang.sur} en marge de la boutique${mes.qualification ? ' · ' + esc(mes.qualification) : ''}` : '';
    const signaux = [];
    if (mes && mes.a_identifier) signaux.push('Référence à identifier : prix de vente proche de 1 € HT pour une quantité élevée (opération de caisse ou service possible). Non exclue des indicateurs tant qu\'elle n\'est pas déclarée.');
    if (mes && mes.quantite_possiblement_en_euros) signaux.push('Quantité possiblement exprimée en euros (service commercial dont le prix de vente est proche de 1 €).');
    const sourcesHtml = mes ? `
          ${ligneMes('Période affichée', `${esc(fmtDate(mes.pmp.periode_debut))} → ${esc(fmtDate(mes.pmp.periode_fin))}`)}
          ${ligneMes('PMP Decenium', datePmp ? `export du ${esc(datePmp)}` : 'n.d.')}` : '';

    resultSection.innerHTML = `
      <button type="button" class="lien-accueil" id="lienAccueil">← Accueil Produits</button>
      <div class="top-grid">
        <section class="card identite-card" aria-label="Identité du produit">
          <div id="photoCardZone"></div>
          <div class="identite-texte">
            <h2 class="hero-nom">${esc(p.article)}</h2>
            <div class="hero-cat">${esc(p.categorie)}</div>
            <div class="statut-ligne">${badgeStatut}</div>
            ${badgePromotion(p)}
          </div>
        </section>

        <section class="carte conseiller" aria-label="Conseiller NEXUS">
          <img class="conseiller-avatar" src="assets/avatar/nexus-avatar-128.png" srcset="assets/avatar/nexus-avatar-64.png 64w, assets/avatar/nexus-avatar-96.png 96w, assets/avatar/nexus-avatar-128.png 128w, assets/avatar/nexus-avatar-256.png 256w" sizes="80px" alt="" width="80" height="80" onerror="this.style.display='none'">
          <div class="conseiller-corps">
            <div class="conseiller-titre">Conseiller NEXUS</div>
            <div class="conseiller-sous">${esc(horsInd ? TEXTE_HORS_INDICATEURS : (phraseMesure || statutSimplifie.label))}</div>
            <details class="comprendre">
              <summary>Comprendre cette analyse</summary>
              <div class="conseiller-bubble"><div class="conseiller-text" id="conseillerProduitMsg"></div></div>
              <div class="conseiller-pied" id="conseillerPaire"></div>
            </details>
          </div>
          ${observationHtml}
          ${scannerHtml}
        </section>
      </div>

      <section class="card indic-card" aria-label="Indicateurs">
        <div class="ind-niveau ind-principal">
          ${tuile(ICO.ca, 'CA HT (période)', fmtEur(p.ca_t2))}
          ${mes
            ? tuile(ICO.marge, 'Marge générée HT', mes.marge_totale.valeur !== null ? fmtEur(mes.marge_totale.valeur) : 'n.d.', datePmp ? 'estimée au PMP du ' + esc(datePmp) : null)
            : tuile(ICO.marge, 'Marge', fmtPct(p.marge_pct))}
          ${tuile(ICO.part, 'Taux de marque', mes ? (mes.taux_marque.valeur !== null ? fmtN(mes.taux_marque.valeur, 2) + ' %' : 'n.d.') : fmtPct(p.marge_pct))}
        </div>
        <div class="ind-niveau ind-secondaire">
          ${tuile(ICO.unites, 'Unités vendues', p.qte_t2 + ' u.')}
          ${tuile(ICO.prix, 'Marge unitaire', mes && mes.marge_unitaire.valeur !== null ? fmtN(mes.marge_unitaire.valeur, 2) + ' €' : 'n.d.')}
          ${tuile(ICO.rotation, 'Ventes par jour', ventesJour !== null ? fmtN(ventesJour, 2) + ' u./jour' : 'n.d.')}
        </div>
        <div class="ind-niveau ind-secondaire">
          ${tuile(ICO.prix, 'Prix HT', p.pu_ht !== null ? fmtEur(p.pu_ht) : 'n.d.')}
          ${tuile(ICO.pma, 'PMP Decenium HT', p.pma !== null ? fmtEur(p.pma) : 'n.d.')}
          ${tuile(ICO.part, 'Part du rayon', horsInd ? 'sans objet' : (p.pct_contrib != null ? fmtPct(p.pct_contrib) : 'n.d.'))}
          ${tuile(ICO.rang, 'Classement CA dans le rayon', horsInd ? 'sans objet' : `#${rangRayon.rang} / ${rangRayon.total}`)}
          ${tuile(ICO.stock, 'Stock théorique (valeur)', '…', 'vérification…', { val: 'heroStockVal', sub: 'heroStockSub' })}
          ${tuile(ICO.rotation, 'Couverture estimée', '…', 'vérification…', { val: 'heroRotationVal', sub: 'heroRotationSub' })}
        </div>
      </section>

      <details class="card sec" id="secPerf">
        <summary>${ICO.ca}<span>Performance commerciale</span></summary>
        <div class="sec-corps">
          ${rangTxt ? `<div class="sec-sous" style="margin-top:0;">${rangTxt}</div>` : ''}
          ${mesuresHtml}
          <div id="justifZone"></div>
        </div>
      </details>

      <details class="card sec" id="secHisto">
        <summary>${ICO.histo}<span>Historique des deux périodes</span></summary>
        <div class="sec-corps">${histoHtml}</div>
      </details>

      <details class="card sec" id="secStock">
        <summary>${ICO.stock}<span>Stock et implantation</span></summary>
        <div class="sec-corps">
          <div class="gap-row"><span class="gap-label">Stock</span><span class="gap-status" id="gapStockStatus">Vérification du dernier relevé…</span></div>
          <div class="gap-row"><span class="gap-label">Couverture estimée</span><span class="gap-status" id="gapRotationStatus">Vérification…</span></div>
          <div class="gap-row"><span class="gap-label">Emplacement</span><span class="gap-status" id="gapEmplacementStatus">Vérification…</span></div>
          <div class="gap-row"><span class="gap-label">Facing actuel</span><span class="gap-status">Non disponible : pas de saisie des facings actuellement</span></div>
          <button type="button" class="btn-decl" id="btnConfirmerEmplacement">Confirmer ou corriger</button>
          <div id="emplacementPickerZone"></div>
        </div>
      </details>

      <details class="card sec" id="secPhoto">
        <summary>${ICO.info}<span>Photo du rayon</span></summary>
        <div class="sec-corps"><div id="photoTerrainZone">Vérification…</div></div>
      </details>

      <details class="card sec" id="secFiab">
        <summary>${ICO.info}<span>Fiabilité et sources</span></summary>
        <div class="sec-corps">
          ${signaux.map(t => `<div class="histo-empty" style="margin-top:6px;">${esc(t)}</div>`).join('')}
          <div class="sec-sous">Nature de la référence</div>
          <div id="natureZone"></div>
          <div class="sec-sous">TVA</div>
          <div id="tvaZone"></div>
          <div class="sec-sous">Sources</div>
          ${sourcesHtml}
        </div>
      </details>
    `;

    // Sections repliees sur mobile, ouvertes sur grand ecran ; les elements
    // restent dans le DOM dans tous les cas (les actions ne cassent pas).
    const grandEcran = (window.matchMedia && window.matchMedia('(min-width:768px)').matches) || document.body.classList.contains('nexus-desktop');
    if (grandEcran) resultSection.querySelectorAll('details.sec').forEach(d => { if (d.id !== 'secHisto' && d.id !== 'secFiab') d.open = true; });

    // Conseiller : cycle Constat -> Explication -> Decision (logique inchangee),
    // ecrit apres la creation du DOM. La periode de comparaison accompagne la tendance.
    const conseillerMsg = document.getElementById('conseillerProduitMsg');
    if (conseillerMsg && horsInd) {
      conseillerMsg.textContent = TEXTE_HORS_INDICATEURS;
      const piedHors = document.getElementById('conseillerPaire');
      if (piedHors) piedHors.innerHTML = '';
    } else if (conseillerMsg) {
      const periodeAff = `${fmtDate(p.periode_debut)} → ${fmtDate(p.periode_fin)}`;
      const stockFait = p.stock ? `quantité en stock ${p.stock.quantite} au relevé du ${fmtDate(p.stock.releve_le)}` : null;
      const constatP = p.ca_t2 === 0
        ? `${esc(p.article)} n'a aucune vente sur la période affichée (${esc(periodeAff)})${stockFait ? ' ; ' + esc(stockFait) : ''}${p.source ? ' (connu par : ' + esc(p.source) + ')' : ''}.`
        : p.pct_contrib !== null
        ? `${esc(p.article)} pèse ${fmtPct(p.pct_contrib)} du CA de son rayon (${fmtEur(p.ca_t2)}), marge ${fmtPct(p.marge_pct)}.`
        : `${esc(p.article)} a généré ${fmtEur(p.ca_t2)} sur la période, marge ${fmtPct(p.marge_pct)}.`;

      let explicationP;
      if (p.ca_t2 === 0) {
        explicationP = statutSimplifie.cle === 'dormant'
          ? `Aucune vente sur ${p.periodesSansVente} périodes complètes et du stock au dernier relevé : le produit peut être sorti du rayon ou ne plus se vendre.`
          : statutSimplifie.cle === 'rupture-probable'
            ? 'Aucune vente récente et un stock à zéro (ou négatif) au dernier relevé : une rupture est probable.'
            : 'Aucune vente sur la période affichée. NEXUS ne tire pas de conclusion sans relevé de stock récent.';
      } else {
        const tendanceTxt = tendQualifiee ? (NexusVocab.tendance(evolCa) + ' (ventes moyennes par jour)' + (tend.fiable ? '' : ' : ' + tend.avertissements.map(esc).join(' · ') + '.')) : msgTendance;
        explicationP = [tendanceTxt].filter(Boolean).join(' ')
          || 'Pas assez de recul pour conclure.';
        if (!tend || tend.statut === 'indisponible') explicationP += ' Je n\'ai pas encore de période précédente pour elle.';
      }
      const explicationTendance = (p.ca_t2 !== 0 && !!tend && tend.statut !== 'indisponible');

      const decisionP = statutSimplifie.action;

      conseillerMsg.innerHTML = `
        <div class="cycle-step"><span class="cycle-tag">Constat</span>${constatP}</div>
        <div class="cycle-step"><span class="cycle-tag">Explication</span>${explicationP}</div>
        ${mes ? `<div class="cycle-step"><span class="cycle-tag">Mesure</span>${mes.explication.map(esc).join(' ')}</div>` : ''}
        ${decisionP ? `<div class="cycle-step"><span class="cycle-tag tag-decision">Décision</span>${decisionP}</div>` : ''}
      `;
      // Une seule ligne de comparaison et un seul avertissement, au pied de la carte, quand un message s'appuie sur la paire T1/T2.
      const piedPaire = document.getElementById('conseillerPaire');
      if (piedPaire) piedPaire.innerHTML = (explicationTendance || actionDependTendance) ? mentionPaire + avertPaire : '';
    }

    renderPhotoCard(p);
    francisationAffichage(['heroRotationVal','gapRotationStatus']);
    chargerStockGap(p);
    chargerEmplacementProduit(p);
    chargerPhotoTerrain(p);
    const btnConf = document.getElementById('btnConfirmerEmplacement');
    if (btnConf) btnConf.addEventListener('click', () => afficherPickerEmplacement(p));
    rendreZonesDeclaratives(p);
  }

  // ---- P1-B : declarations (nature, TVA, justification de destockage) ----
  // Lignes ajoutees seulement ; l'auteur et la date viennent de la base (auth.uid()), jamais de la page.
  // Une correction ajoute une ligne qui remplace l'ancienne ; une annulation exige un motif.
  const PERIODE_AFFICHEE = p => ({ debut: p.periode_debut, fin: p.periode_fin });

  function formulaireDecl(zone, cfg) {
    const champs = cfg.champs.map(c => {
      const id = 'fd_' + c.id;
      const ctl = c.type === 'select'
        ? `<select id="${id}">${c.options.map(o => `<option value="${esc(o[0])}"${o[0] === c.valeur ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
        : c.type === 'number'
          ? `<input id="${id}" type="number" inputmode="decimal" step="0.1" min="0" max="100" value="${esc(c.valeur === undefined || c.valeur === null ? '' : c.valeur)}">`
          : `<textarea id="${id}" rows="2">${esc(c.valeur || '')}</textarea>`;
      return `<label for="${id}">${esc(c.label)}${c.requis ? ' (obligatoire)' : ''}</label>${ctl}`;
    }).join('');
    zone.innerHTML = `<div class="form-decl"><strong>${esc(cfg.titre)}</strong>${champs}<div class="form-err" role="alert" id="fd_err"></div>
      <div class="form-actions"><button type="button" class="btn-decl plein" id="fd_ok">${esc(cfg.bouton)}</button><button type="button" class="btn-decl" id="fd_ko">Annuler</button></div></div>`;
    const err = zone.querySelector('#fd_err');
    zone.querySelector('#fd_ko').addEventListener('click', () => { zone.innerHTML = ''; if (cfg.fermer) cfg.fermer(); });
    zone.querySelector('#fd_ok').addEventListener('click', async () => {
      const v = {};
      for (const c of cfg.champs) {
        const el = zone.querySelector('#fd_' + c.id);
        v[c.id] = el ? String(el.value).trim() : '';
        if (c.requis && !v[c.id]) { err.textContent = c.label + ' : champ obligatoire.'; return; }
      }
      const e = cfg.valider ? cfg.valider(v) : null;
      if (e) { err.textContent = e; return; }
      err.textContent = 'Enregistrement…';
      const msg = await cfg.enregistrer(v);
      if (msg) { err.textContent = msg; return; }
      zone.innerHTML = '';
      await apresEcriture(cfg.produit);
    });
  }

  async function insererDecl(table, ligne) {
    try {
      const { error } = await nexusClient.from(table).insert(ligne);
      return error ? 'Écriture refusée : ' + error.message : null;
    } catch (e) { return 'Écriture impossible : ' + (e && e.message ? e.message : e); }
  }
  async function annulerDecl(table, id, motif) {
    try {
      const { data, error } = await nexusClient.from(table).update({ annule_le: new Date().toISOString(), annule_par: employee.id, motif_annulation: motif }).eq('id', id).is('annule_le', null).select('id');
      if (error) return 'Annulation refusée : ' + error.message;
      if (!data || !data.length) return 'Annulation refusée : aucune ligne modifiée.';
      return null;
    } catch (e) { return 'Annulation impossible : ' + (e && e.message ? e.message : e); }
  }
  // Recharge les declarations, recalcule les mesures, redessine la fiche (Fiabilite rouverte) et l'accueil.
  async function apresEcriture(p) {
    const fiabOuverte = !!(document.getElementById('secFiab') && document.getElementById('secFiab').open);
    const perfOuverte = !!(document.getElementById('secPerf') && document.getElementById('secPerf').open);
    await attacherMesures(PRODUCTS);
    showProduct(p.article);
    const f = document.getElementById('secFiab'); if (f) f.open = fiabOuverte;
    const q = document.getElementById('secPerf'); if (q) q.open = perfOuverte;
  }
  function cible(p) { return { site: SITE_ACTUEL, article: p.article, code_barres: p.code_barres || null }; }

  function rendreZonesDeclaratives(p) {
    const mes = p.mesure;
    const zN = document.getElementById('natureZone'), zT = document.getElementById('tvaZone'), zJ = document.getElementById('justifZone');
    if (!mes) { if (zN) zN.textContent = 'Non disponible pour cette référence (aucune vente sur la période affichée).'; if (zT) zT.textContent = 'Non disponible.'; return; }
    const bouton = (id, txt) => `<button type="button" class="btn-decl" id="${id}" style="margin-right:8px;margin-top:6px;">${esc(txt)}</button>`;
    const quand = d => d ? fmtDate(String(d).slice(0, 10)) : '';

    // Nature
    const n = mes.nature;
    zN.innerHTML = `<div class="gap-row"><span class="gap-label">Nature</span><span class="gap-status">${esc(n.libelle)}${n.declaree ? ` · déclarée le ${esc(quand(n.declare_le))}` : (n.source === 'règle NEXUS' ? ' · source : règle NEXUS' : ' · par défaut (non déclarée)')}${n.commentaire ? ' · ' + esc(n.commentaire) : ''}</span></div>
      <div id="natureForm"></div>${bouton('btnNature', n.declaree ? 'Corriger la nature' : 'Déclarer la nature')}${n.declaree ? bouton('btnNatureAnnuler', 'Annuler la déclaration') : ''}`;
    zN.querySelector('#btnNature').addEventListener('click', () => formulaireDecl(zN.querySelector('#natureForm'), {
      produit: p, titre: 'Nature de la référence', bouton: 'Enregistrer',
      champs: [
        { id: 'nature', label: 'Nature', type: 'select', options: Object.entries(NexusProduitsMesure.NATURES), valeur: n.cle },
        { id: 'commentaire', label: 'Commentaire', type: 'text', valeur: '' },
      ],
      enregistrer: v => insererDecl('produits_nature_reference', Object.assign(cible(p), { nature: v.nature, commentaire: v.commentaire || null }, n.declaree ? { remplace_id: n.id } : {})),
    }));
    const bNA = zN.querySelector('#btnNatureAnnuler');
    if (bNA) bNA.addEventListener('click', () => formulaireDecl(zN.querySelector('#natureForm'), {
      produit: p, titre: 'Annuler la déclaration de nature', bouton: 'Annuler la déclaration',
      champs: [{ id: 'motif', label: 'Motif', type: 'text', requis: true }],
      enregistrer: v => annulerDecl('produits_nature_reference', n.id, v.motif),
    }));

    // TVA : confirmer, corriger, annuler
    const t = mes.tva;
    const etatTxt = t.etat === 'confirmee'
      ? `TVA confirmée : ${fmtN(t.taux_retenu, 1)} % (le ${esc(quand(t.confirmation && t.confirmation.confirme_le))})${t.confirmation && t.confirmation.commentaire ? ' · ' + esc(t.confirmation.commentaire) : ''}`
      : t.etat === 'importee'
        ? `TVA importée de Decenium : ${fmtN(t.taux_importe, 1)} %, non confirmée`
        : `TVA incohérente : importée ${fmtN(t.taux_importe, 1)} %${t.raison ? ' · ' + esc(t.raison) : ''}`;
    const conf = t.confirmation || null;
    zT.innerHTML = `<div class="gap-row"><span class="gap-label">État</span><span class="gap-status">${etatTxt}</span></div>
      <div id="tvaForm"></div>${bouton('btnTva', conf ? 'Corriger la TVA' : 'Confirmer la TVA')}${conf ? bouton('btnTvaAnnuler', 'Annuler la confirmation') : ''}`;
    zT.querySelector('#btnTva').addEventListener('click', () => {
      const propose = t.taux_importe;
      formulaireDecl(zT.querySelector('#tvaForm'), {
        produit: p, titre: 'Confirmer la TVA', bouton: 'Confirmer',
        champs: [
          { id: 'taux', label: 'Taux de TVA en % (proposé : taux importé de la période affichée)', type: 'number', valeur: conf ? conf.taux : (propose === null || propose === undefined ? '' : propose), requis: true },
          { id: 'commentaire', label: 'Commentaire (obligatoire si le taux diffère du taux importé)', type: 'text', valeur: '' },
        ],
        valider: v => {
          const x = Number(String(v.taux).replace(',', '.'));
          if (!isFinite(x) || x < 0 || x > 100) return 'Taux de TVA : un nombre entre 0 et 100.';
          if (propose !== null && propose !== undefined && Math.abs(x - propose) > 1e-9 && !v.commentaire) return 'Un taux différent du taux importé exige un commentaire.';
          return null;
        },
        enregistrer: v => insererDecl('produits_tva_confirmations', Object.assign(cible(p), { taux_confirme: Number(String(v.taux).replace(',', '.')), commentaire: v.commentaire || null }, conf ? { remplace_id: conf.id } : {})),
      });
    });
    const bTA = zT.querySelector('#btnTvaAnnuler');
    if (bTA) bTA.addEventListener('click', () => formulaireDecl(zT.querySelector('#tvaForm'), {
      produit: p, titre: 'Annuler la confirmation de TVA', bouton: 'Annuler la confirmation',
      champs: [{ id: 'motif', label: 'Motif', type: 'text', requis: true }],
      enregistrer: v => annulerDecl('produits_tva_confirmations', conf.id, v.motif),
    }));

    // Justification de destockage : seulement pour une marge negative de la periode affichee
    if (zJ && mes.marge_negative) {
      const j = mes.justification;
      const per = PERIODE_AFFICHEE(p);
      zJ.innerHTML = `<div class="sec-sous">Marge négative sur la période</div>
        ${j ? `<div class="gap-row"><span class="gap-label">Justification</span><span class="gap-status">${esc(j.libelle)}${j.commentaire ? ' · ' + esc(j.commentaire) : ''} · le ${esc(quand(j.valide_le))}</span></div>` : '<div class="histo-empty">Déstockage non justifié. La marge et le CA affichés ne changent pas.</div>'}
        <div id="justifForm"></div>${bouton('btnJustif', j ? 'Corriger la justification' : 'Justifier ce déstockage')}${j ? bouton('btnJustifAnnuler', 'Annuler la justification') : ''}`;
      zJ.querySelector('#btnJustif').addEventListener('click', () => formulaireDecl(zJ.querySelector('#justifForm'), {
        produit: p, titre: 'Justifier ce déstockage (valable pour la période affichée)', bouton: 'Enregistrer',
        champs: [
          { id: 'motif', label: 'Motif', type: 'select', options: Object.entries(NexusProduitsMesure.MOTIFS_JUSTIFICATION), valeur: j ? j.motif : 'dlc' },
          { id: 'commentaire', label: 'Commentaire (obligatoire pour « Autre motif »)', type: 'text', valeur: '' },
        ],
        valider: v => v.motif === 'autre' && !v.commentaire ? 'Un commentaire est obligatoire pour « Autre motif ».' : null,
        enregistrer: v => insererDecl('produits_justifications_marge', Object.assign(cible(p), { periode_debut: per.debut, periode_fin: per.fin, motif: v.motif, commentaire: v.commentaire || null }, j ? { remplace_id: j.id } : {})),

    const t = x => Date.UTC(+jourDuMois(x).slice(0, 4), +jourDuMois(x).slice(5, 7) - 1, +jourDuMois(x).slice(8, 10));
    return Math.round((t(PERIODE_DONNEES.fin) - t(PERIODE_DONNEES.debut)) / 86400000) + 1;
  }
  function indicateursAccueil() {
    const sy = SYNTHESE_PRODUITS;
    if (!sy) return null;
    const nbVendus = MESURES_PRODUITS.filter(x => !(x.m && x.m.exclue_indicateurs)).length;
    let ca = Number(sy.ca_analytique) || 0, marge = 0;
    const refs = nbVendus;
    if (vuesDisponibles()) {
      const v = window.NexusProduitsVues.produits(entreesVues(), {});
      ca = v.ca; marge = v.marge;
    }
    const jours = nbJoursPeriode();
    const dormants = PRODUCTS.filter(x => calculerStatutSimplifie(x).cle === 'dormant');
    let R = null, A = null, nbTva = 0;
    if (vuesDisponibles()) {
      nbTva = window.NexusProduitsVues.aRevoir(entreesVues()).nbTvaAVerifier || 0;
      try {
        const res = scannerResultat();
        if (res) { R = res.resume; A = NexusScannerTarifaire.affichage(res); }
      } catch (e) { R = null; A = null; }
    }
    return { sy, ca, marge, refs, jours, parJour: jours > 0 ? ca / jours : null, dormants, R, A, nbTva, nbIdent: sy.references_a_identifier || 0 };
  }
  function pointsVigilance(I) {
    const pl = (n, u, ps) => `${n} ${n > 1 ? (ps || u + 's') : u}`;
    const L = [];
    if (I.dormants.length > 0) L.push({ id: 'dormants', n: I.dormants.length, titre: 'Produits dormants', sous: pl(I.dormants.length, 'référence'), ton: 'info' });
    if (I.nbIdent > 0) L.push({ id: 'identifier', n: I.nbIdent, titre: 'Références à identifier', sous: pl(I.nbIdent, 'référence'), ton: 'ambre' });
    if (I.R && I.R.perte.non_justifiees > 0) L.push({ id: 'pertes', n: I.R.perte.non_justifiees, titre: 'Ventes à perte non justifiées', sous: pl(I.R.perte.non_justifiees, 'référence'), ton: 'rouge' });
    if (I.nbTva > 0) L.push({ id: 'tva', n: I.nbTva, titre: 'TVA à vérifier', sous: pl(I.nbTva, 'référence'), ton: 'ambre' });
    return L;
  }
  // Synthèse du Conseiller de l'accueil : uniquement des résultats déjà calculés, sans tendance ni urgence.
  function texteConseillerAccueil(I, L) {
    if (!L.length) return 'Aucun point de vigilance sur cette période.';
    const ph = [`${majN(motN(L.length))} point${L.length > 1 ? 's' : ''} de vigilance sur cette période.`];
    const fe = v => fmtEur(Number(v) || 0);
    const pertes = I.A ? I.A.pertes.filter(x => !x.perte.justifiee).slice().sort((a, b) => b.perte.montant - a.perte.montant) : [];
    const s = I.A && I.A.suspects[0];
    if (pertes.length) ph.push(`La vente à perte non justifiée la plus importante est ${pertes[0].article}, avec une marge négative de ${fe(pertes[0].perte.montant)}.`);
    else if (s) ph.push(`Le coût à vérifier en priorité est celui de ${s.article}.`);
    const prem = L[0];
    ph.push(pertes.length ? 'Commencez par la carte Ventes à perte non justifiées.' : s ? 'Commencez par le Scanner tarifaire.' : `Commencez par la carte ${prem.titre}.`);
    return ph.join(' ');
  }

  // Photo rayon (terrain) — prise par un employé via la mission "Photo de

  async function envoyerPhotoTerrainManager(p, file) {
    const msg = document.getElementById('photoTerrainMsg');

    if (btn) { btn.disabled = true; btn.textContent = 'Envoi de la photo…'; }
    if (msg) msg.textContent = '';

      const ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop().toLowerCase() : 'jpg';
      const chemin = `${employee.id}/photo-verification-rayon-${Date.now()}.${ext}`;
      const { error: erreurUpload } = await nexusClient.storage
        .from('preuves-missions')
        .upload(chemin, file, { contentType: file.type || 'image/jpeg' });
      if (erreurUpload) throw erreurUpload;

      const DIX_ANS = 315360000;
      const { data: signee, error: erreurSignee } = await nexusClient.storage
        .from('preuves-missions')
        .createSignedUrl(chemin, DIX_ANS);
      if (erreurSignee) throw erreurSignee;

      // Complétion normale de la mission "photo-verification-rayon" (voir
      // migration-mission-photo-produit-v1.sql) — points = 5 (base
      // catalogue) + 2 (bonus preuve photo), même barème que côté Missions.
      // Fuseau lu (await) puis UN SEUL calcul : date et heure viennent du même instant.
      let fuseauStation = null;
      try { fuseauStation = await nexusFuseauSite(employee.site_id); } catch (e) { fuseauStation = null; }
      const maintenant = dateHeureStation(fuseauStation);
      const { error: erreurInsert } = await nexusClient
        .from('mission_completions')
        .insert({
          employee_id: employee.id, mission_id: 'photo-verification-rayon',
          titre: 'Photo de vérification rayon',
          date: maintenant.date, heure: maintenant.heure,
          photo_fournie: true, photo_url: signee.signedUrl, points: 7,
          article_cible: p.article, categorie_cible: p.categorie, site_id: SITE_ACTUEL,
        });
      if (erreurInsert) throw erreurInsert;

      chargerPhotoTerrain(p);
    } catch (e) {
      console.error('Envoi photo terrain (manager):', e);
      if (msg) { msg.style.color = 'var(--red)'; msg.textContent = "Erreur lors de l'envoi : réessayez."; }
      if (btn) { btn.disabled = false; btn.innerHTML = ICO.camera + ' Prendre une photo'; }
