<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Inventaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-desktop.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  /* heure-live / date-live (02/08/2026, demande de Frédéric — "mettre la
     date et l'heure") : même convention visuelle que NEXUS-Pointage-v1.html,
     horloge vivante mise à jour chaque seconde. */
  .heure-live{font-family:var(--mono); font-size:26px; font-weight:600; margin-top:10px; color:var(--text);}
  .date-live{font-size:12px; color:var(--text-mid); margin-top:2px; text-transform:capitalize;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  /* Accueil : 2 gros boutons Prise de poste / Clôture */
  .choix-grid{display:flex; flex-direction:column; gap:12px;}
  .choix-card{
    position:relative; background:linear-gradient(145deg, var(--panel), var(--panel-raised));
    border:1.5px solid var(--hairline); border-radius:16px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25); transition:transform .15s;
  }
  .choix-card:active{transform:scale(0.98);}
  .choix-card.disabled{opacity:0.4; pointer-events:none;}
  .choix-icone{width:52px; height:52px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px;}
  .choix-icone.ouverture{background:radial-gradient(circle at 32% 28%, rgba(79,195,217,0.30), var(--panel-raised) 72%); box-shadow:inset 0 0 0 1px rgba(79,195,217,0.25);}
  .choix-icone.cloture{background:radial-gradient(circle at 32% 28%, rgba(212,175,55,0.30), var(--panel-raised) 72%); box-shadow:inset 0 0 0 1px rgba(212,175,55,0.3);}
  .choix-titre{font-size:15.5px; font-weight:700;}
  .choix-sub{font-size:11.5px; color:var(--text-mid); margin-top:3px; line-height:1.4;}
  .choix-statut{font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; margin-top:5px;}
  .choix-statut.fait{color:var(--green);}
  .choix-statut.attente{color:var(--amber);}

  .etat-banner{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .etat-banner b{color:var(--text);}

  .zone-choix{display:flex; gap:10px; margin-bottom:16px;}
  .zone-pill{flex:1; text-align:center; padding:14px; border-radius:12px; border:1.5px solid var(--hairline); background:var(--panel); font-size:13.5px; font-weight:600; cursor:pointer;}
  .zone-pill.active{border-color:var(--cyan); background:rgba(79,195,217,0.1); color:var(--cyan);}

  /* Quart matin/soir bien visible (02/08/2026, demande de Frédéric —
     "mets de façon visible matin et soir et en surbrillance le quart
     actif"). Non cliquable : le quart est détecté automatiquement (voir
     quartDuMoment()), ceci ne fait que l'afficher clairement. */
  .quart-visuel{display:flex; gap:10px; margin-bottom:16px;}
  .quart-visuel-item{flex:1; text-align:center; padding:11px; border-radius:12px; border:1.5px solid var(--hairline); background:var(--panel); font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer;}
  .quart-visuel-item:active{background:var(--panel-raised);}
  .quart-visuel-item.actif{border-color:var(--cyan); background:rgba(79,195,217,0.14); color:var(--cyan); box-shadow:0 0 0 1px rgba(79,195,217,0.25);}

  .cat-block{margin-bottom:16px;}
  .cat-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;}
  .cat-nom{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}
  .cat-conforme{font-family:var(--mono); font-size:9.5px; color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3); border-radius:14px; padding:4px 9px; cursor:pointer;}
  .cat-conforme:active{background:rgba(79,195,217,0.2);}
  .cat-block.desactive{opacity:0.45;}
  .cat-desactive-tag{font-family:var(--mono); font-size:9px; color:var(--text-dim); background:var(--panel-raised); border-radius:14px; padding:3px 8px; white-space:nowrap;}
  .produit-input:disabled{cursor:not-allowed;}

  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .produit-row{padding:12px 14px;}
  .produit-row + .produit-row{border-top:1px solid var(--hairline);}
  .produit-nom-ligne{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .produit-nom{font-size:13.5px; font-weight:600; flex:1;}
  .badge-sensible{font-family:var(--mono); font-size:8.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--red); background:var(--red-dim); border-radius:6px; padding:2px 6px;}
  .produit-transmis{font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}
  .produit-controls{display:flex; align-items:center; gap:8px;}
  .produit-input{
    flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:9px;
    padding:10px 12px; color:var(--text); font-family:var(--mono); font-size:15px; text-align:right;
  }
  .produit-input:focus{outline:none; border-color:var(--cyan);}
  .btn-identique{font-family:var(--mono); font-size:9.5px; color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; cursor:pointer; white-space:nowrap;}
  .btn-identique:active{background:var(--hairline);}
  .ecart-tag{font-family:var(--mono); font-size:10.5px; margin-top:6px; text-align:right;}
  .ecart-ok{color:var(--green);}
  .ecart-warn{color:var(--amber);}
  .ecart-bad{color:var(--red);}
  .justif-input{
    width:100%; margin-top:8px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px;
    padding:8px 10px; color:var(--text); font-size:12px; font-family:var(--sans);
  }
  .justif-input::placeholder{color:var(--text-dim);}
  .produit-masque{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); font-style:italic;}

  /* Écrans catégories / carrousel (02/08/2026, demande de Frédéric —
     "une succession de petites actions simples" plutôt qu'une longue
     liste vue d'un coup). Voir renderCategoriesOuverture() / renderCarrousel(). */
  .progression-bloc{margin-bottom:16px;}
  .progression-haut{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--text-mid); margin-bottom:6px;}
  .progression-temps{font-family:var(--mono); font-size:10.5px; color:var(--cyan);}
  .progression-barre{height:6px; border-radius:4px; background:var(--panel-raised); overflow:hidden;}
  .progression-remplie{height:100%; background:var(--cyan); border-radius:4px; transition:width .25s;}

  .cats-titre{font-family:var(--mono); font-size:11px; color:var(--text-mid); margin-bottom:10px;}
  .categorie-row{display:flex; justify-content:space-between; align-items:center; padding:14px; cursor:pointer;}
  .categorie-row + .categorie-row{border-top:1px solid var(--hairline);}
  .categorie-row:active{background:var(--panel-raised);}
  .categorie-nom{font-size:14px; font-weight:600;}
  .categorie-count{font-size:11.5px; color:var(--text-mid); margin-top:2px;}
  .categorie-etat{font-family:var(--mono); font-size:10px; font-weight:700; padding:4px 9px; border-radius:12px; white-space:nowrap; text-transform:uppercase;}
  .categorie-etat.a-faire{background:var(--panel-raised); color:var(--text-dim);}
  .categorie-etat.en-cours{background:rgba(79,195,217,0.12); color:var(--cyan);}
  .categorie-etat.termine{background:var(--green-dim); color:var(--green);}
  .categorie-etat.prioritaire{background:var(--red-dim); color:var(--red);}
  .categorie-etat.desactivee{background:var(--panel-raised); color:var(--text-dim);}
  .categorie-row.desactive{opacity:0.45; cursor:not-allowed; pointer-events:none;}

  .carrousel-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:22px 18px; text-align:center; margin-bottom:14px;}
  .carrousel-nom{font-size:17px; font-weight:700; margin-bottom:14px;}
  .carrousel-transmis{font-size:11.5px; color:var(--text-mid);}
  .carrousel-valeur{font-family:var(--mono); font-size:34px; font-weight:700; color:var(--text-dim); margin:6px 0 18px;}
  .carrousel-unite{font-size:14px; font-weight:400; color:var(--text-dim);}
  .carrousel-actions{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .carrousel-input{text-align:center; font-size:22px; margin-top:14px; width:100%;}
  .carrousel-footer{text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:8px;}

  .mouv-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px; margin-bottom:14px;}
  .mouv-titre{font-size:13px; font-weight:700; margin-bottom:10px;}
  .mouv-row{display:flex; gap:8px; margin-bottom:8px;}
  .mouv-select, .mouv-qte{background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12.5px; font-family:var(--sans);}
  .mouv-select{flex:1.4;}
  .mouv-qte{flex:1; font-family:var(--mono); text-align:right;}
  .mouv-justif{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12px; margin-bottom:8px;}
  .mouv-liste{margin-top:4px;}
  .mouv-item{display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:var(--panel-raised); border-radius:8px; margin-bottom:6px; font-size:12px;}
  .mouv-item .rm{color:var(--red); cursor:pointer; font-family:var(--mono); font-size:11px;}

  .btn-primary{width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{width:100%; padding:12px; border:1px solid var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:13px; cursor:pointer; margin-top:8px;}
  .btn-text{width:100%; padding:12px; border:none; background:none; color:var(--text-dim); font-size:12.5px; cursor:pointer; margin-top:4px;}

  .resume-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:20px; margin-top:4px;}
  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0;}
  .stat-row + .stat-row{border-top:1px solid var(--hairline);}
  .stat-label{font-size:13px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:15px; font-weight:700;}
  .stat-value.amber{color:var(--amber);}
  .stat-value.cyan{color:var(--cyan);}
  .stat-value.red{color:var(--red);}
  .checkmark{width:56px; height:56px; border-radius:50%; background:var(--green-dim); color:var(--green); font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .final-greet{font-size:19px; font-weight:700; text-align:center;}

  .ecoulement-note{font-size:11px; color:var(--text-dim); line-height:1.5; margin-top:10px; padding-top:10px; border-top:1px solid var(--hairline);}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Inventaire</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="heure-live" id="heureLive">--:--:--</div>
    <div class="date-live" id="dateLive"></div>
    <div class="sub" id="sousTitre"></div>
  </div>
  <div class="divider"></div>

  <!-- desktop-grid (02/08/2026) : mise en colonnes en vue bureau (voir
       nexus-desktop.js) — purement additif, aucun effet en mobile. -->
  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>

  <footer>NEXUS Inventaire v1 · Registre numérique des comptages de quart · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS Inventaire v1 (02/08/2026) — construit avec Frédéric à partir
  // d'une feuille papier réelle (11 catégories : jaugeage carburant, gaz,
  // glaçons, journaux, pains/sandwichs, viennoiserie, cigarettes, boissons
  // chaudes/bières, huiles, lave-glace/liquide refroidissement, CBD).
  //
  // Principe central (voir schéma inventaire_* en base) : les employés
  // comptent et transmettent, NEXUS sécurise et structure les données
  // (comptages en événements immuables, jamais d'écrasement silencieux),
  // le manager rapproche avec Decenium plus tard (V2/V3 — hors scope ici).
  //
  // Vocabulaire imposé par Frédéric : jamais "ventes" ni "stock théorique"
  // dans cette page — uniquement "stock transmis", "stock compté",
  // "écoulement physique constaté". NEXUS Inventaire ne prétend pas
  // connaître les ventes réelles de caisse.
  // ------------------------------------------------------------

  let employeeCourant = null;
  let roleDuJour = null;
  let zonesAutorisees = [];      // ['piste'] | ['boutique'] | ['piste','boutique']
  let zoneActive = null;         // zone choisie pour la session en cours
  let quartActuel = null;        // 'matin' | 'soir'
  let quartRow = null;           // ligne inventaire_quarts
  let quartEmployeRow = null;    // ligne inventaire_quart_employes de CET employé
  let produitsZone = [];         // catalogue inventaire_zone_produit filtré
  let dernierStock = {};         // produit_id -> { quantite, comptage_id } | null
  let modesAveugle = [];         // règles inventaire_modes_controle actives (mode='aveugle')
  let modeJaugeageActif = false; // inventaire_modes_controle actif (mode='jaugeage_actif') — voir chargerModeJaugeageActif()
  let comptagesSaisie = {};      // produit_id -> { compte, justification }
  let mouvementsSaisie = [];     // { produit_id, type_mouvement, quantite, justification }
  let zonesMap = {};             // code ('piste'/'boutique') -> id (inventaire_zones)

  // Écrans catégories / carrousel de l'ouverture (02/08/2026, demande de
  // Frédéric — "une succession de petites actions simples" plutôt qu'une
  // longue liste vue d'un coup). Au-delà de CARROUSEL_SEUIL produits, une
  // catégorie s'affiche en mode "produit suivant" plutôt qu'en liste.
  const CARROUSEL_SEUIL = 6;
  const SECONDES_PAR_PRODUIT = 4.5; // base du temps restant estimé, indicatif seulement

  // Jaugeage carburant (02/08/2026, demande de Frédéric) : "mets le
  // jaugeage a la fin du quart en grisé par defaut à ne pas remplir, ça
  // doit etre une option prise par le manager." Grisé/non requis sur les
  // deux quarts par défaut ; un manager l'active depuis
  // NEXUS-Inventaire-Manager-v1.html (inventaire_modes_controle,
  // mode='jaugeage_actif' — même mécanisme que le mode aveugle).
  const JAUGEAGE_NOM = 'Jaugeage Carburant';
  let categorieActive = null;       // nom de la catégorie affichée en détail
  let carrouselIndex = 0;           // index courant dans la catégorie en mode carrousel
  let carrouselModeCorrection = false; // true dès que l'employé a tapé "Corriger" sur le produit courant

  // Horloge en direct (02/08/2026, demande de Frédéric — "tu devrais mettre
  // la date et l'heure") : même convention que NEXUS-Pointage-v1.html
  // (heureLive/dateLive mis à jour chaque seconde).
  function heureLocale() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function demarrerHorloge() {
    const majHeure = () => {
      document.getElementById('heureLive').textContent = heureLocale();
      document.getElementById('dateLive').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    };
    majHeure();
    setInterval(majHeure, 1000);
  }

  // Quart par défaut dérivé des vrais horaires de la station (02/08/2026,
  // demande de Frédéric — "te referencer aux parametres station pour mettre
  // par défaut le quart") : remplace l'ancien seuil fixe "13h" par l'heure
  // de démarrage normale du quart 2, configurée dans NEXUS Paramètres
  // Station (station_config.horaires.quart2.normal, ex: "12:40" — même
  // valeur par défaut que NEXUS-Parametres-Station-v1.html si rien n'a
  // encore été enregistré pour ce site). Avant cette heure : quart du matin,
  // à partir de cette heure : quart du soir.
  const HORAIRE_DEFAUT_DEBUT_QUART2 = '12:40';
  async function quartDuMoment(siteId) {
    let debutQuart2 = HORAIRE_DEFAUT_DEBUT_QUART2;
    const { data, error } = await nexusClient
      .from('station_config').select('horaires').eq('site', siteId || 'vito-sainte-marie').maybeSingle();
    if (error) console.error('Chargement horaires station (quart par défaut):', error);
    else if (data && data.horaires && data.horaires.quart2 && data.horaires.quart2.normal) {
      debutQuart2 = data.horaires.quart2.normal;
    }
    const maintenant = new Date();
    const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
    const [hQ2, mQ2] = debutQuart2.split(':').map(Number);
    const minutesQ2 = hQ2 * 60 + (mQ2 || 0);
    return minutesMaintenant < minutesQ2 ? 'matin' : 'soir';
  }
  function dateISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtNum(n) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  }

  // Le rôle du quart en cours (shifts.role) prime sur employees.role : un
  // "renfort" ou "vacataire" peut être affecté piste ou boutique selon le
  // jour, employees.role ne suffit pas à trancher.
  async function chargerRoleDuJour() {
    const debutJourISO = `${dateISO()}T00:00:00`;
    const { data, error } = await nexusClient
      .from('shifts').select('role').eq('employee_id', employeeCourant.id)
      .gte('heure_debut', debutJourISO).order('heure_debut', { ascending: false }).limit(1).maybeSingle();
    if (error) { console.error('Rôle du jour:', error); return employeeCourant.role; }
    return (data && data.role) || employeeCourant.role;
  }

  function zonesPourRole(role) {
    if (role === 'pompiste') return ['piste'];
    if (role === 'caissier' || role === 'caissiere') return ['boutique'];
    return ['piste', 'boutique']; // manager, gerant, renfort, vacataire : zone à choisir
  }

  async function obtenirOuCreerQuart() {
    const site = employeeCourant.site_id || 'vito-sainte-marie';
    const { data: existant, error: e1 } = await nexusClient
      .from('inventaire_quarts').select('*').eq('site', site).eq('date', dateISO()).eq('quart', quartActuel).maybeSingle();
    if (e1) { console.error('Lecture quart:', e1); }
    if (existant) return existant;

    const { data: cree, error: e2 } = await nexusClient
      .from('inventaire_quarts').insert({ site, date: dateISO(), quart: quartActuel, statut: 'ouverture_en_cours', ouvert_le: new Date().toISOString() })
      .select().single();
    if (e2) { console.error('Création quart:', e2); return null; }
    return cree;
  }

  async function obtenirOuCreerQuartEmploye() {
    const { data: existant, error: e1 } = await nexusClient
      .from('inventaire_quart_employes').select('*').eq('quart_id', quartRow.id).eq('employee_id', employeeCourant.id).maybeSingle();
    if (e1) { console.error('Lecture quart-employé:', e1); }
    if (existant) return existant;

    const { data: cree, error: e2 } = await nexusClient
      .from('inventaire_quart_employes').insert({
        quart_id: quartRow.id, employee_id: employeeCourant.id, role: roleDuJour,
        heure_arrivee: new Date().toISOString(),
      }).select().single();
    if (e2) { console.error('Création quart-employé:', e2); return null; }
    return cree;
  }

  async function chargerProduitsZone(zone) {
    // Corrigé (02/08/2026, signalé par Frédéric — "mets les cigarettes
    // dans le sens que je t'ai envoyé, c'est le sens de comptage en
    // boutique") : le tri ne portait que sur `sensible`, jamais sur
    // `ordre_affichage` — à l'intérieur d'une catégorie, l'ordre des
    // produits était donc livré au hasard par Postgres plutôt que de
    // suivre le sens physique du parcours en boutique déjà enregistré en
    // base (colonne ordre_affichage, renseignée lors du seed initial).
    const { data, error } = await nexusClient
      .from('inventaire_zone_produit').select('*, inventaire_categories(nom, ordre_affichage), inventaire_zones!inner(code)')
      .eq('inventaire_zones.code', zone).eq('actif', true)
      .order('sensible', { ascending: false })
      .order('ordre_affichage', { ascending: true });
    if (error) { console.error('Chargement produits:', error); return []; }
    return data || [];
  }

  // Dernier stock connu = le dernier comptage de clôture validé pour ce
  // produit, tous quarts confondus (l'historique reste une chaîne continue
  // d'un quart au suivant, pas remise à zéro à chaque ouverture).
  async function chargerDerniersStocks(produitIds) {
    if (!produitIds.length) return {};
    const { data, error } = await nexusClient
      .from('inventaire_comptages').select('id, produit_id, quantite, compte_le')
      .in('produit_id', produitIds).eq('type_comptage', 'cloture').eq('statut', 'valide')
      .order('compte_le', { ascending: false });
    if (error) { console.error('Derniers stocks:', error); return {}; }
    const map = {};
    for (const row of (data || [])) {
      if (!(row.produit_id in map)) map[row.produit_id] = { quantite: row.quantite, comptage_id: row.id };
    }
    return map;
  }

  async function chargerModesAveugle() {
    const site = employeeCourant.site_id || 'vito-sainte-marie';
    const { data, error } = await nexusClient
      .from('inventaire_modes_controle').select('*').eq('site', site).eq('mode', 'aveugle').eq('actif', true);
    if (error) { console.error('Modes de contrôle:', error); return []; }
    return data || [];
  }

  async function chargerModeJaugeageActif() {
    const site = employeeCourant.site_id || 'vito-sainte-marie';
    const { data, error } = await nexusClient
      .from('inventaire_modes_controle').select('id').eq('site', site).eq('mode', 'jaugeage_actif').eq('actif', true).maybeSingle();
    if (error) { console.error('Chargement mode jaugeage:', error); return false; }
    return !!data;
  }

  // Exclut le jaugeage carburant du calcul de progression/complétion quand
  // il n'a pas été activé par le manager — jamais bloquant pour valider un
  // inventaire, jamais compté dans "X/Y catégories terminées".
  function produitsRequis(liste) {
    if (modeJaugeageActif) return liste;
    return liste.filter(p => !p.inventaire_categories || p.inventaire_categories.nom !== JAUGEAGE_NOM);
  }

  function estMasquePourProduit(produit) {
    const today = dateISO();
    return modesAveugle.some(m => {
      if (m.employee_id && m.employee_id !== employeeCourant.id) return false;
      if (m.categorie_id && m.categorie_id !== produit.categorie_id) return false;
      if (m.produit_id && m.produit_id !== produit.id) return false;
      if (m.date_debut && m.date_debut > today) return false;
      if (m.date_fin && m.date_fin < today) return false;
      return true;
    });
  }

  function grouperParCategorie(produits) {
    const groupes = {};
    for (const p of produits) {
      const nom = p.inventaire_categories ? p.inventaire_categories.nom : 'Autres';
      if (!groupes[nom]) groupes[nom] = { nom, ordre: p.inventaire_categories ? p.inventaire_categories.ordre_affichage : 99, items: [] };
      groupes[nom].items.push(p);
    }
    return Object.values(groupes).sort((a, b) => a.ordre - b.ordre);
  }

  // ------------------------------------------------------------
  // ÉCRAN D'ACCUEIL
  // ------------------------------------------------------------
  async function renderAccueil() {
    document.getElementById('titre').textContent = `Bonjour ${employeeCourant.nom}`;
    document.getElementById('sousTitre').textContent = '';

    const ouvertureFaite = quartEmployeRow && quartEmployeRow.a_valide_ouverture;
    const clotureFaite = quartEmployeRow && quartEmployeRow.a_valide_cloture;

    document.getElementById('content').innerHTML = `
      ${renderQuartVisuel()}
      ${zonesAutorisees.length > 1 ? `<div class="etat-banner">Zone suivie actuellement : <b>${zoneActive === 'piste' ? 'Piste' : 'Boutique'}</b>. <span id="lienChangerZone" style="color:var(--cyan); cursor:pointer;">Changer</span></div>` : ''}
      <div class="choix-grid">
        <div class="choix-card ${clotureFaite ? 'disabled' : ''}" id="carteOuverture">
          <div class="choix-icone ouverture">🟢</div>
          <div style="flex:1;">
            <div class="choix-titre">Commencer mon inventaire</div>
            <div class="choix-sub">Comptage d'ouverture — stock transmis, comptage réel, écart éventuel.</div>
            ${ouvertureFaite ? '<div class="choix-statut fait">✓ Fait pour ce quart</div>' : '<div class="choix-statut attente">À faire</div>'}
          </div>
        </div>
        <div class="choix-card ${!ouvertureFaite || clotureFaite ? 'disabled' : ''}" id="carteCloture">
          <div class="choix-icone cloture">🔴</div>
          <div style="flex:1;">
            <div class="choix-titre">Clôturer mon inventaire</div>
            <div class="choix-sub">Mouvements du quart + stock final avant de passer la main.</div>
            ${clotureFaite ? '<div class="choix-statut fait">✓ Fait pour ce quart</div>' : ''}
            ${!ouvertureFaite && !clotureFaite ? '<div class="choix-statut attente">Commencez d\'abord votre inventaire</div>' : ''}
          </div>
        </div>
      </div>
    `;

    wireQuartVisuel();
    const lienZone = document.getElementById('lienChangerZone');
    if (lienZone) lienZone.addEventListener('click', renderChoixZone);

    if (!clotureFaite) document.getElementById('carteOuverture').addEventListener('click', demarrerOuverture);
    if (ouvertureFaite && !clotureFaite) document.getElementById('carteCloture').addEventListener('click', demarrerCloture);
  }

  function renderChoixZone() {
    document.getElementById('titre').textContent = 'Quelle zone comptez-vous ?';
    document.getElementById('sousTitre').textContent = 'Piste (carburant, gaz, glaçons, huiles, lave-glace) ou Boutique (le reste).';
    document.getElementById('content').innerHTML = `
      <div class="zone-choix">
        <div class="zone-pill ${zoneActive==='piste'?'active':''}" data-zone="piste">🚗 Piste</div>
        <div class="zone-pill ${zoneActive==='boutique'?'active':''}" data-zone="boutique">🏪 Boutique</div>
      </div>
      <button class="btn-primary" id="btnValiderZone">Continuer</button>
    `;
    document.querySelectorAll('.zone-pill').forEach(el => el.addEventListener('click', () => {
      zoneActive = el.dataset.zone;
      renderChoixZone();
    }));
    document.getElementById('btnValiderZone').addEventListener('click', async () => {
      const zoneId = zonesMap[zoneActive];
      if (zoneId && quartEmployeRow) {
        const { error } = await nexusClient.from('inventaire_quart_employes').update({ zone_id: zoneId }).eq('id', quartEmployeRow.id);
        if (error) console.error('Enregistrement zone:', error);
        quartEmployeRow.zone_id = zoneId;
      }
      renderAccueil();
    });
  }

  // ------------------------------------------------------------
  // OUVERTURE (prise de poste)
  // ------------------------------------------------------------
  async function demarrerOuverture() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement des produits…</div>';
    produitsZone = await chargerProduitsZone(zoneActive);
    const ids = produitsZone.map(p => p.id);
    dernierStock = await chargerDerniersStocks(ids);
    modesAveugle = await chargerModesAveugle();
    modeJaugeageActif = await chargerModeJaugeageActif();
    comptagesSaisie = {};
    renderCategoriesOuverture();
  }

  // ------------------------------------------------------------
  // Progression (02/08/2026, demande de Frédéric) — helpers partagés par
  // l'écran catégories et l'écran carrousel.
  // ------------------------------------------------------------
  function produitEstCompte(p) {
    const s = comptagesSaisie[p.id];
    return !!s && s.compte !== undefined;
  }
  function categorieEstTerminee(items) { return items.every(produitEstCompte); }
  function categorieEstCommencee(items) { return items.some(produitEstCompte); }
  function categorieEstPrioritaire(items) { return items.some(p => p.sensible); }

  function estimationTempsTexte(nbRestants) {
    if (nbRestants <= 0) return null;
    const minutes = Math.round((nbRestants * SECONDES_PAR_PRODUIT) / 60);
    if (minutes < 1) return "Moins d'une minute restante";
    return `Environ ${minutes} minute${minutes > 1 ? 's' : ''} restante${minutes > 1 ? 's' : ''}`;
  }

  // Affichage visible du quart (02/08/2026, demande de Frédéric — "le
  // quart actif est par défaut en fonction de l'horodateur mais permet à
  // l'employé ou au manager de cliquer pour choisir son quart") : le quart
  // détecté automatiquement (quartDuMoment()) reste la valeur par défaut,
  // mais cliquer sur Matin/Soir permet de la corriger manuellement — utile
  // par exemple pour un vacataire qui termine un quart matin après l'heure
  // de bascule. Utilisé sur l'accueil, l'écran catégories et la clôture.
  function renderQuartVisuel() {
    return `
      <div class="quart-visuel">
        <div class="quart-visuel-item ${quartActuel === 'matin' ? 'actif' : ''}" data-quart="matin">☀️ Matin</div>
        <div class="quart-visuel-item ${quartActuel === 'soir' ? 'actif' : ''}" data-quart="soir">🌙 Soir</div>
      </div>
    `;
  }
  function wireQuartVisuel() {
    document.querySelectorAll('.quart-visuel-item').forEach(el => {
      el.addEventListener('click', () => changerQuart(el.dataset.quart));
    });
  }

  // Changement manuel de quart : abandonne toute saisie non enregistrée en
  // cours (avec confirmation), recharge/crée le quart+quart-employé
  // correspondant, et revient à l'accueil (ou au choix de zone si cette
  // zone n'a pas encore été choisie pour ce quart-ci).
  async function changerQuart(nouveauQuart) {
    if (nouveauQuart === quartActuel) return;
    const enCours = Object.values(comptagesSaisie).some(s => s && s.compte !== undefined) || mouvementsSaisie.length > 0;
    if (enCours && !confirm('Changer de quart maintenant abandonnera la saisie en cours (non enregistrée). Continuer ?')) return;

    quartActuel = nouveauQuart;
    comptagesSaisie = {};
    mouvementsSaisie = [];
    document.getElementById('content').innerHTML = '<div class="loading">Changement de quart…</div>';

    quartRow = await obtenirOuCreerQuart();
    if (!quartRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger ce quart. Réessayez.</div>'; return; }
    quartEmployeRow = await obtenirOuCreerQuartEmploye();

    if (quartEmployeRow && quartEmployeRow.zone_id) {
      const codeConnu = Object.keys(zonesMap).find(code => zonesMap[code] === quartEmployeRow.zone_id);
      if (codeConnu) zoneActive = codeConnu;
    }

    if (zonesAutorisees.length > 1 && !quartEmployeRow.zone_id) {
      renderChoixZone();
    } else {
      renderAccueil();
    }
  }

  function renderBarreProgression() {
    const cible = produitsRequis(produitsZone);
    const total = cible.length;
    const comptes = cible.filter(produitEstCompte).length;
    const pct = total ? Math.round((comptes / total) * 100) : 0;
    const tempsTexte = estimationTempsTexte(total - comptes);
    return `
      <div class="progression-bloc">
        <div class="progression-haut">
          <span>${comptes} produit${comptes > 1 ? 's' : ''} sur ${total} contrôlé${comptes > 1 ? 's' : ''}</span>
          <span class="progression-temps">${tempsTexte || 'Inventaire terminé ✓'}</span>
        </div>
        <div class="progression-barre"><div class="progression-remplie" style="width:${pct}%"></div></div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // ÉCRAN CATÉGORIES — remplace l'ancienne liste plate de tous les
  // produits d'un coup : l'employé touche une catégorie, la termine, puis
  // revient automatiquement ici (renderCategoriesOuverture()).
  // ------------------------------------------------------------
  function renderCategoriesOuverture() {
    categorieActive = null;
    document.getElementById('titre').textContent = "Inventaire d'ouverture";
    document.getElementById('sousTitre').textContent = 'Vérifiez les quantités transmises. Corrigez uniquement les différences.';

    const groupes = grouperParCategorie(produitsZone);
    const groupesRequis = groupes.filter(g => modeJaugeageActif || g.nom !== JAUGEAGE_NOM);
    const nbCatTerminees = groupesRequis.filter(g => categorieEstTerminee(g.items)).length;
    const toutTermine = nbCatTerminees === groupesRequis.length;
    const nbRestantes = groupesRequis.length - nbCatTerminees;

    const html = groupes.map(g => {
      // Jaugeage carburant (02/08/2026) : grisé et non cliquable tant que
      // le manager ne l'a pas activé — jamais compté dans la progression
      // ni requis pour valider l'inventaire.
      const desactive = g.nom === JAUGEAGE_NOM && !modeJaugeageActif;
      if (desactive) {
        return `
          <div class="categorie-row desactive" data-cat="${g.nom}">
            <div>
              <div class="categorie-nom">${g.nom}</div>
              <div class="categorie-count">${g.items.length} produit${g.items.length > 1 ? 's' : ''} · non requis pour ce quart</div>
            </div>
            <div class="categorie-etat desactivee">Désactivé</div>
          </div>
        `;
      }
      const termine = categorieEstTerminee(g.items);
      const commence = categorieEstCommencee(g.items);
      const prioritaire = categorieEstPrioritaire(g.items) && !termine;
      let etatTexte = 'À faire', etatClasse = 'a-faire';
      if (termine) { etatTexte = '✓ Terminé'; etatClasse = 'termine'; }
      else if (commence) { etatTexte = 'En cours'; etatClasse = 'en-cours'; }
      else if (prioritaire) { etatTexte = 'Prioritaire'; etatClasse = 'prioritaire'; }
      return `
        <div class="categorie-row" data-cat="${g.nom}">
          <div>
            <div class="categorie-nom">${g.nom}</div>
            <div class="categorie-count">${g.items.length} produit${g.items.length > 1 ? 's' : ''}</div>
          </div>
          <div class="categorie-etat ${etatClasse}">${etatTexte}</div>
        </div>
      `;
    }).join('');

    document.getElementById('content').innerHTML = `
      ${renderQuartVisuel()}
      ${renderBarreProgression()}
      <div class="cats-titre">${nbCatTerminees}/${groupesRequis.length} catégories terminées</div>
      <div class="card">${html}</div>
      <button class="btn-primary" id="btnTerminerOuverture" ${!toutTermine ? 'disabled' : ''}>
        ${toutTermine ? "Valider mon inventaire d'ouverture" : `Terminez toutes les catégories (${nbRestantes} restante${nbRestantes > 1 ? 's' : ''})`}
      </button>
      <button class="btn-text" id="btnAnnulerOuverture">← Retour</button>
    `;

    wireQuartVisuel();
    document.querySelectorAll('.categorie-row:not(.desactive)').forEach(el => {
      el.addEventListener('click', () => ouvrirCategorie(groupes.find(g => g.nom === el.dataset.cat)));
    });
    document.getElementById('btnTerminerOuverture').addEventListener('click', validerOuverture);
    document.getElementById('btnAnnulerOuverture').addEventListener('click', renderAccueil);
  }

  function ouvrirCategorie(groupe) {
    categorieActive = groupe.nom;
    carrouselModeCorrection = false;
    if (groupe.items.length > CARROUSEL_SEUIL) {
      carrouselIndex = groupe.items.findIndex(p => !produitEstCompte(p));
      if (carrouselIndex === -1) carrouselIndex = 0; // déjà terminée : on repasse en revue depuis le début
      renderCarrousel(groupe);
    } else {
      renderCategorieListe(groupe);
    }
  }

  // ------------------------------------------------------------
  // MODE LISTE — catégories courtes (≤ ${CARROUSEL_SEUIL} produits, ex :
  // Gaz). Renommé "Valider cette catégorie conforme" (demande de Frédéric :
  // "Tout conforme" encourageait une validation trop rapide) avec une
  // confirmation explicite avant d'appliquer le stock transmis partout.
  // ------------------------------------------------------------
  // Avance le focus au produit suivant de la même catégorie — utilisé
  // après "Identique" ou la touche Entrée (voir renderCategorieListe).
  function focusProchainProduit(produitId, groupe) {
    const idx = groupe.items.findIndex(p => p.id === produitId);
    if (idx === -1 || idx === groupe.items.length - 1) return; // dernier produit : rien à enchaîner
    const suivant = groupe.items[idx + 1];
    const inputSuivant = document.querySelector(`.produit-input[data-produit="${suivant.id}"]`);
    if (inputSuivant) { inputSuivant.focus(); inputSuivant.select(); }
  }

  function renderCategorieListe(groupe) {
    document.getElementById('titre').textContent = groupe.nom;
    document.getElementById('sousTitre').textContent = 'Le stock transmis est celui laissé par le quart précédent — comptez le vôtre, corrigez si besoin.';

    document.getElementById('content').innerHTML = `
      ${renderBarreProgression()}
      <div class="card">
        ${groupe.items.map(p => renderLigneOuverture(p)).join('')}
      </div>
      <button class="btn-primary" id="btnCategorieConforme">Valider cette catégorie conforme</button>
      <button class="btn-text" id="btnRetourCategories">← Retour aux catégories</button>
    `;

    document.querySelectorAll('.produit-input').forEach(el => {
      el.addEventListener('input', () => majLigneCategorie(el.dataset.produit));
      // Entrée = passer au produit suivant (02/08/2026, demande de Frédéric
      // — "insère tout de suite le curseur dans votre comptage pour aller
      // plus vite"). Volontairement pas sur chaque frappe (input) : tant
      // qu'on tape un nombre à plusieurs chiffres, un saut prématuré serait
      // pire qu'utile — seule une action explicite (Entrée, ou Identique
      // ci-dessous) déclenche l'avancée.
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); focusProchainProduit(el.dataset.produit, groupe); }
      });
    });
    document.querySelectorAll('.btn-identique').forEach(el => {
      el.addEventListener('click', () => {
        const input = document.querySelector(`.produit-input[data-produit="${el.dataset.produit}"]`);
        const transmis = dernierStock[el.dataset.produit];
        input.value = transmis ? transmis.quantite : 0;
        majLigneCategorie(el.dataset.produit);
        focusProchainProduit(el.dataset.produit, groupe);
      });
    });
    document.getElementById('btnCategorieConforme').addEventListener('click', () => {
      if (!confirm(`Vous confirmez avoir compté les ${groupe.items.length} produit${groupe.items.length > 1 ? 's' : ''} de cette catégorie ?`)) return;
      groupe.items.forEach(p => {
        const transmis = dernierStock[p.id];
        comptagesSaisie[p.id] = { compte: transmis ? transmis.quantite : 0, ecartNonNul: false, justification: '' };
      });
      renderCategoriesOuverture();
    });
    document.getElementById('btnRetourCategories').addEventListener('click', renderCategoriesOuverture);
  }

  // Corrigé (02/08/2026, signalé par Frédéric — "je dois ressaisir pour
  // mettre deux chiffres" sur Gaz) : cette fonction reconstruisait AVANT
  // tout le HTML de la catégorie à chaque frappe dès qu'un écart
  // apparaissait (pour révéler le champ justification) — ça faisait
  // perdre le focus et la position du curseur au beau milieu de la saisie
  // d'un nombre à plusieurs chiffres, obligeant à retaper. Le champ
  // justification existe maintenant en permanence dans le DOM (comme
  // justifCarrousel côté carrousel) : on se contente de l'afficher ou le
  // masquer, sans jamais reconstruire la ligne.
  function majLigneCategorie(produitId) {
    const input = document.querySelector(`.produit-input[data-produit="${produitId}"]`);
    const val = input.value === '' ? null : parseFloat(input.value);
    const transmis = dernierStock[produitId] ? dernierStock[produitId].quantite : 0;
    const ecartDiv = document.getElementById(`ecart-${produitId}`);
    const justifInput = document.querySelector(`.justif-input[data-produit="${produitId}"]`);
    if (val === null || isNaN(val)) {
      ecartDiv.className = 'ecart-tag'; ecartDiv.textContent = '';
      if (justifInput) justifInput.style.display = 'none';
      comptagesSaisie[produitId] = undefined;
      return;
    }
    const ecart = val - transmis;
    const ecartNonNul = Math.abs(ecart) > 0.001;
    ecartDiv.className = 'ecart-tag ' + (ecart === 0 ? 'ecart-ok' : (Math.abs(ecart) <= 2 ? 'ecart-warn' : 'ecart-bad'));
    ecartDiv.textContent = ecart === 0 ? 'Conforme' : `Écart d'ouverture : ${ecart > 0 ? '+' : ''}${fmtNum(ecart)}`;
    if (justifInput) justifInput.style.display = ecartNonNul ? '' : 'none';
    comptagesSaisie[produitId] = { compte: val, ecartNonNul, justification: justifInput ? justifInput.value : (comptagesSaisie[produitId] ? comptagesSaisie[produitId].justification : '') };
  }

  // ------------------------------------------------------------
  // MODE CARROUSEL — catégories longues (> ${CARROUSEL_SEUIL} produits,
  // ex : Cigarettes). Un seul produit à la fois : la valeur transmise est
  // affichée en grisé, "✓ Identique" valide en un geste, "Corriger" ouvre
  // la saisie pré-remplie avec cette même valeur — l'employé ne saisit
  // donc que les différences.
  // ------------------------------------------------------------
  function renderCarrousel(groupe) {
    const items = groupe.items;
    const p = items[carrouselIndex];
    document.getElementById('titre').textContent = groupe.nom;
    document.getElementById('sousTitre').textContent = '';

    const transmis = dernierStock[p.id];
    const masque = estMasquePourProduit(p);
    const valeurTransmise = transmis ? transmis.quantite : 0;
    const pasDHistorique = transmis === undefined;
    // Retour au produit précédent (02/08/2026, demande de Frédéric —
    // "permet de revenir à l'article précédent si l'employé fait une
    // erreur de saisie") : si ce produit a déjà une valeur enregistrée
    // (parce qu'on y revient après l'avoir déjà validé) ET que cette
    // valeur diffère du transmis, on affiche directement la saisie déjà
    // faite plutôt que les boutons Conforme/Corriger — pour la corriger
    // sur place sans devoir re-choisir "Corriger" à l'aveugle.
    const dejaSaisi = comptagesSaisie[p.id];
    const dejaCorrige = !!(dejaSaisi && dejaSaisi.compte !== undefined && Math.abs(dejaSaisi.compte - valeurTransmise) > 0.001);
    const afficherChoixRapide = !masque && !pasDHistorique && !carrouselModeCorrection && !dejaCorrige;
    const valeurDepart = (dejaSaisi && dejaSaisi.compte !== undefined) ? dejaSaisi.compte : (masque || pasDHistorique ? '' : valeurTransmise);

    document.getElementById('content').innerHTML = `
      ${renderBarreProgression()}
      <div class="carrousel-card">
        <div class="carrousel-nom">${p.designation}${p.sensible ? '<span class="badge-sensible" style="margin-left:8px;">Sensible</span>' : ''}</div>
        ${masque
          ? `<div class="carrousel-transmis">Comptage à l'aveugle — saisissez votre chiffre</div>`
          : (pasDHistorique
              ? `<div class="carrousel-transmis">Premier comptage — pas d'historique</div>`
              : `<div class="carrousel-transmis">Stock transmis par le quart précédent</div>
                 <div class="carrousel-valeur">${fmtNum(valeurTransmise)} <span class="carrousel-unite">${p.unite}</span></div>`)
        }
        ${afficherChoixRapide ? `
          <div class="carrousel-actions">
            <button class="btn-primary" id="btnConforme">✓ Identique — valider</button>
            <button class="btn-ghost" id="btnCorriger">Corriger</button>
          </div>
        ` : `
          <input type="number" inputmode="decimal" step="0.01" class="produit-input carrousel-input" id="carrouselInput"
                 placeholder="Votre comptage" value="${valeurDepart}" onfocus="this.select()">
          <div class="ecart-tag" id="ecartCarrousel"></div>
          <input type="text" class="justif-input" id="justifCarrousel" placeholder="Justification de l'écart (facultatif)" value="${dejaSaisi && dejaSaisi.justification ? dejaSaisi.justification : ''}" style="${dejaSaisi && dejaSaisi.ecartNonNul ? '' : 'display:none;'}">
          <button class="btn-primary" id="btnValiderProduit">Valider ce produit</button>
          ${!masque && !pasDHistorique ? `<button class="btn-text" id="btnAnnulerCorrection">← Revenir à « Identique »</button>` : ''}
        `}
      </div>
      <div class="carrousel-footer">Produit ${carrouselIndex + 1} sur ${items.length}</div>
      ${carrouselIndex > 0 ? `<button class="btn-text" id="btnProduitPrecedent">← Revenir au produit précédent</button>` : ''}
      <button class="btn-text" id="btnRetourCategoriesCarrousel">← Retour aux catégories</button>
    `;

    const btnConforme = document.getElementById('btnConforme');
    if (btnConforme) btnConforme.addEventListener('click', () => {
      comptagesSaisie[p.id] = { compte: valeurTransmise, ecartNonNul: false, justification: '' };
      avancerCarrousel(groupe);
    });
    const btnCorriger = document.getElementById('btnCorriger');
    if (btnCorriger) btnCorriger.addEventListener('click', () => {
      carrouselModeCorrection = true;
      renderCarrousel(groupe);
    });
    const carrouselInput = document.getElementById('carrouselInput');
    if (carrouselInput) {
      carrouselInput.addEventListener('input', () => majCarrousel(valeurTransmise));
      // Curseur posé tout de suite (02/08/2026, demande de Frédéric —
      // "insère tout de suite le curseur dans votre comptage pour aller
      // plus vite") : dès que la saisie manuelle est affichée (aveugle,
      // premier comptage, ou après "Corriger"), le focus y est déjà —
      // plus besoin de taper la case au préalable. Entrée valide direct.
      carrouselInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); const btn = document.getElementById('btnValiderProduit'); if (btn) btn.click(); }
      });
      setTimeout(() => { carrouselInput.focus(); carrouselInput.select(); }, 0);
      // Affiche tout de suite l'écart si une valeur était déjà enregistrée
      // (retour sur un produit déjà répondu) — sinon la pastille resterait
      // vide tant qu'on n'a pas retapé quelque chose.
      if (carrouselInput.value !== '') majCarrousel(valeurTransmise);
    }
    const btnValiderProduit = document.getElementById('btnValiderProduit');
    if (btnValiderProduit) btnValiderProduit.addEventListener('click', () => {
      const input = document.getElementById('carrouselInput');
      let val = input.value === '' ? null : parseFloat(input.value);
      // Corrigé (02/08/2026, demande de Frédéric — "si je valide sans
      // mettre de chiffre, considère que c'est zéro mais envoie un message
      // d'alerte pour m'avertir que c'est correct") : on ne bloque plus la
      // validation d'une case vide, on demande confirmation avant de
      // l'enregistrer à 0 — annuler la confirmation laisse la case ouverte
      // pour corriger une saisie oubliée par erreur.
      if (val === null || isNaN(val)) {
        if (!confirm(`Aucun chiffre saisi pour ${p.designation} — on enregistre 0. Confirmer ?`)) return;
        val = 0;
      }
      const ecart = val - valeurTransmise;
      const ecartNonNul = Math.abs(ecart) > 0.001;
      const justifInput = document.getElementById('justifCarrousel');
      comptagesSaisie[p.id] = { compte: val, ecartNonNul, justification: justifInput ? justifInput.value : '' };
      avancerCarrousel(groupe);
    });
    const btnAnnulerCorrection = document.getElementById('btnAnnulerCorrection');
    if (btnAnnulerCorrection) btnAnnulerCorrection.addEventListener('click', () => {
      // Remet aussi la valeur enregistrée à l'identique du transmis (pas
      // seulement l'affichage) — sinon, en revenant sur un produit déjà
      // corrigé, ce bouton n'aurait visuellement aucun effet.
      comptagesSaisie[p.id] = { compte: valeurTransmise, ecartNonNul: false, justification: '' };
      carrouselModeCorrection = false;
      renderCarrousel(groupe);
    });
    const btnProduitPrecedent = document.getElementById('btnProduitPrecedent');
    if (btnProduitPrecedent) btnProduitPrecedent.addEventListener('click', () => reculerCarrousel(groupe));
    document.getElementById('btnRetourCategoriesCarrousel').addEventListener('click', renderCategoriesOuverture);
  }

  function majCarrousel(valeurTransmise) {
    const input = document.getElementById('carrouselInput');
    const ecartDiv = document.getElementById('ecartCarrousel');
    const justifInput = document.getElementById('justifCarrousel');
    if (!input || !ecartDiv) return;
    const val = input.value === '' ? null : parseFloat(input.value);
    if (val === null || isNaN(val)) { ecartDiv.textContent = ''; if (justifInput) justifInput.style.display = 'none'; return; }
    const ecart = val - valeurTransmise;
    const ecartNonNul = Math.abs(ecart) > 0.001;
    ecartDiv.className = 'ecart-tag ' + (ecart === 0 ? 'ecart-ok' : (Math.abs(ecart) <= 2 ? 'ecart-warn' : 'ecart-bad'));
    ecartDiv.textContent = ecart === 0 ? 'Conforme' : `Écart d'ouverture : ${ecart > 0 ? '+' : ''}${fmtNum(ecart)}`;
    if (justifInput) justifInput.style.display = ecartNonNul ? '' : 'none';
  }

  function avancerCarrousel(groupe) {
    carrouselModeCorrection = false;
    if (carrouselIndex < groupe.items.length - 1) {
      carrouselIndex++;
      renderCarrousel(groupe);
    } else {
      renderCategoriesOuverture();
    }
  }

  // Retour au produit précédent (02/08/2026, demande de Frédéric — "permet
  // de revenir à l'article précédent si l'employé fait une erreur de
  // saisie"). Le produit précédent réaffiche alors sa valeur déjà
  // enregistrée, prête à corriger (voir dejaSaisi dans renderCarrousel()).
  function reculerCarrousel(groupe) {
    if (carrouselIndex <= 0) return;
    carrouselIndex--;
    carrouselModeCorrection = false;
    renderCarrousel(groupe);
  }

  function renderLigneOuverture(p) {
    const transmis = dernierStock[p.id];
    const masque = estMasquePourProduit(p);
    const saisie = comptagesSaisie[p.id];
    const transmisTexte = transmis === undefined ? 'Premier comptage — pas d\'historique' : (masque ? 'masqué (mode à l\'aveugle)' : `Transmis : ${fmtNum(transmis ? transmis.quantite : 0)} ${p.unite}`);
    // Corrigé (02/08/2026, signalé par Frédéric — "le chiffre disparaît, je
    // dois le retaper") : quand un écart apparaît, majLigneCategorie()
    // ré-affiche cette ligne pour révéler le champ justification, mais
    // l'input ne restaurait jamais la valeur déjà saisie (ni l'écart déjà
    // calculé) — d'où la fausse impression que la saisie s'était effacée.
    let ecartClasse = 'ecart-tag', ecartTexte = '';
    if (saisie && saisie.compte !== undefined) {
      const valeurTransmise = transmis ? transmis.quantite : 0;
      const ecart = saisie.compte - valeurTransmise;
      ecartClasse = 'ecart-tag ' + (ecart === 0 ? 'ecart-ok' : (Math.abs(ecart) <= 2 ? 'ecart-warn' : 'ecart-bad'));
      ecartTexte = ecart === 0 ? 'Conforme' : `Écart d'ouverture : ${ecart > 0 ? '+' : ''}${fmtNum(ecart)}`;
    }
    return `
      <div class="produit-row" id="ligne-${p.id}">
        <div class="produit-nom-ligne">
          <span class="produit-nom">${p.designation}</span>
          ${p.sensible ? '<span class="badge-sensible">Sensible</span>' : ''}
        </div>
        <div class="produit-transmis">${transmisTexte}</div>
        <div class="produit-controls" style="margin-top:8px;">
          <input type="number" inputmode="decimal" step="0.01" class="produit-input" data-produit="${p.id}"
                 placeholder="Votre comptage" value="${saisie && saisie.compte !== undefined ? saisie.compte : ''}" onfocus="this.select()">
          <button class="btn-identique" data-produit="${p.id}" ${masque ? 'disabled' : ''}>Identique</button>
        </div>
        <div class="${ecartClasse}" id="ecart-${p.id}">${ecartTexte}</div>
        <input type="text" class="justif-input" data-produit="${p.id}" placeholder="Justification de l'écart (facultatif)" value="${saisie && saisie.justification ? saisie.justification : ''}" style="${saisie && saisie.ecartNonNul ? '' : 'display:none;'}">
      </div>
    `;
  }

  async function validerOuverture() {
    // capture les justifications avant de désactiver le bouton
    document.querySelectorAll('.justif-input').forEach(el => {
      if (comptagesSaisie[el.dataset.produit]) comptagesSaisie[el.dataset.produit].justification = el.value;
    });

    const btn = document.getElementById('btnTerminerOuverture');
    if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }

    let nbComptes = 0, nbEcarts = 0;
    for (const p of produitsZone) {
      const saisie = comptagesSaisie[p.id];
      if (!saisie || saisie.compte === undefined) continue;
      nbComptes++;
      const transmis = dernierStock[p.id];
      const valeurTransmise = transmis ? transmis.quantite : 0;

      // Matérialise le stock transmis comme événement séparé, avec sa
      // source explicite (jamais une valeur saisie librement).
      const { data: evtTransmis, error: e1 } = await nexusClient.from('inventaire_comptages').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: p.id,
        type_comptage: 'transmis', quantite: valeurTransmise,
        comptage_source_id: transmis ? transmis.comptage_id : null, quantite_transmise: valeurTransmise,
        source: 'auto',
      }).select().single();
      if (e1) console.error('Comptage transmis:', e1);

      const { error: e2 } = await nexusClient.from('inventaire_comptages').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: p.id,
        type_comptage: 'ouverture', quantite: saisie.compte, employee_id: employeeCourant.id,
        comptage_source_id: evtTransmis ? evtTransmis.id : null, quantite_transmise: valeurTransmise,
        source: 'manuel', commentaire: saisie.justification || null,
      });
      if (e2) console.error('Comptage ouverture:', e2);

      if (saisie.ecartNonNul) {
        nbEcarts++;
        await nexusClient.from('inventaire_alertes').insert({
          site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: p.id,
          type_alerte: 'ecart_ouverture', gravite: Math.abs(saisie.compte - valeurTransmise) > 2 ? 'critique' : 'attention',
          valeur_attendue: valeurTransmise, valeur_constatee: saisie.compte,
          resolution: saisie.justification ? `Justifié par l'employé : ${saisie.justification}` : null,
        });
      }
    }

    await nexusClient.from('inventaire_quart_employes').update({ a_valide_ouverture: true, heure_arrivee: quartEmployeRow.heure_arrivee || new Date().toISOString() }).eq('id', quartEmployeRow.id);
    await nexusClient.from('inventaire_quarts').update({ statut: 'ouvert' }).eq('id', quartRow.id).eq('statut', 'ouverture_en_cours');
    quartEmployeRow.a_valide_ouverture = true;

    renderFinalOuverture(nbComptes, nbEcarts);
  }

  function renderFinalOuverture(nbComptes, nbEcarts) {
    document.getElementById('titre').textContent = 'Inventaire d\'ouverture validé';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="resume-card">
        <div class="checkmark">✓</div>
        <div class="final-greet">Merci ${employeeCourant.nom}</div>
        <div class="stat-row"><span class="stat-label">Produits comptés</span><span class="stat-value">${nbComptes}</span></div>
        <div class="stat-row"><span class="stat-label">Écarts de passage de quart</span><span class="stat-value ${nbEcarts ? 'amber' : ''}">${nbEcarts}</span></div>
      </div>
      <button class="btn-primary" id="btnRetourAccueil">Retour</button>
    `;
    document.getElementById('btnRetourAccueil').addEventListener('click', renderAccueil);
  }

  // ------------------------------------------------------------
  // CLÔTURE (fin de poste)
  // ------------------------------------------------------------
  const TYPES_MOUVEMENT = [
    { value: 'reassort', label: 'Réassort réserve' },
    { value: 'livraison', label: 'Livraison' },
    { value: 'casse', label: 'Casse' },
    { value: 'retrait', label: 'Retrait' },
    { value: 'retour', label: 'Retour' },
    { value: 'transfert', label: 'Transfert' },
    { value: 'autre', label: 'Autre' },
  ];

  async function demarrerCloture() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!produitsZone.length) produitsZone = await chargerProduitsZone(zoneActive);
    modeJaugeageActif = await chargerModeJaugeageActif();
    mouvementsSaisie = [];
    comptagesSaisie = {};
    renderCloture();
  }

  function renderCloture() {
    document.getElementById('titre').textContent = 'Clôture de mon inventaire';
    document.getElementById('sousTitre').textContent = 'Déclarez les mouvements connus, puis le stock physique final.';

    const optionsProduits = produitsZone.map(p => `<option value="${p.id}">${p.designation}</option>`).join('');

    document.getElementById('content').innerHTML = `
      ${renderQuartVisuel()}
      <div class="mouv-card">
        <div class="mouv-titre">Mouvements pendant le quart</div>
        <select class="mouv-select" id="mouvProduit" style="width:100%; margin-bottom:8px;">${optionsProduits}</select>
        <div class="mouv-row">
          <select class="mouv-select" id="mouvType">${TYPES_MOUVEMENT.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}</select>
          <input type="number" inputmode="decimal" class="mouv-qte" id="mouvQte" placeholder="Qté" onfocus="this.select()">
        </div>
        <input type="text" class="mouv-justif" id="mouvJustif" placeholder="Justification (ex : livraison Pitou Gaz du 02/08)">
        <button class="btn-ghost" id="btnAjouterMouvement" style="margin-top:0;">+ Ajouter ce mouvement</button>
        <div class="mouv-liste" id="listeMouvements"></div>
      </div>

      ${grouperParCategorie(produitsZone).map(g => {
        const desactive = g.nom === JAUGEAGE_NOM && !modeJaugeageActif;
        return `
        <div class="cat-block ${desactive ? 'desactive' : ''}">
          <div class="cat-head">
            <div class="cat-nom">${g.nom} (${g.items.length})</div>
            ${desactive ? '<span class="cat-desactive-tag">Non requis — activation manager</span>' : ''}
          </div>
          <div class="card">
            ${g.items.map(p => renderLigneCloture(p, desactive)).join('')}
          </div>
        </div>
      `;
      }).join('')}

      <button class="btn-primary" id="btnValiderCloture">Clôturer mon inventaire</button>
      <button class="btn-text" id="btnAnnulerCloture">← Retour</button>
    `;

    wireQuartVisuel();
    document.getElementById('btnAjouterMouvement').addEventListener('click', ajouterMouvement);
    renderListeMouvements();

    document.querySelectorAll('.produit-input').forEach(el => {
      el.addEventListener('input', () => { comptagesSaisie[el.dataset.produit] = { compte: el.value === '' ? undefined : parseFloat(el.value) }; });
    });
    document.getElementById('btnValiderCloture').addEventListener('click', validerCloture);
    document.getElementById('btnAnnulerCloture').addEventListener('click', renderAccueil);
  }

  function renderLigneCloture(p, desactive) {
    return `
      <div class="produit-row">
        <div class="produit-nom-ligne">
          <span class="produit-nom">${p.designation}</span>
          ${p.sensible ? '<span class="badge-sensible">Sensible</span>' : ''}
        </div>
        <div class="produit-controls">
          <input type="number" inputmode="decimal" step="0.01" class="produit-input" data-produit="${p.id}"
                 placeholder="Stock final" onfocus="this.select()" ${desactive ? 'disabled' : ''}>
        </div>
      </div>
    `;
  }

  function ajouterMouvement() {
    const produitId = document.getElementById('mouvProduit').value;
    const type = document.getElementById('mouvType').value;
    const qte = parseFloat(document.getElementById('mouvQte').value);
    const justif = document.getElementById('mouvJustif').value;
    if (!produitId || isNaN(qte)) { alert('Choisissez un produit et une quantité.'); return; }
    const produit = produitsZone.find(p => p.id === produitId);
    mouvementsSaisie.push({ produit_id: produitId, designation: produit ? produit.designation : '', type_mouvement: type, quantite: qte, justification: justif });
    document.getElementById('mouvQte').value = '';
    document.getElementById('mouvJustif').value = '';
    renderListeMouvements();
  }

  function renderListeMouvements() {
    const el = document.getElementById('listeMouvements');
    if (!el) return;
    el.innerHTML = mouvementsSaisie.map((m, i) => `
      <div class="mouv-item">
        <span>${TYPES_MOUVEMENT.find(t=>t.value===m.type_mouvement).label} · ${m.designation} · ${m.quantite > 0 ? '+' : ''}${fmtNum(m.quantite)}</span>
        <span class="rm" data-idx="${i}">✕</span>
      </div>
    `).join('');
    el.querySelectorAll('.rm').forEach(rm => rm.addEventListener('click', () => {
      mouvementsSaisie.splice(parseInt(rm.dataset.idx), 1);
      renderListeMouvements();
    }));
  }

  async function validerCloture() {
    const manquants = produitsRequis(produitsZone).filter(p => !comptagesSaisie[p.id] || comptagesSaisie[p.id].compte === undefined);
    if (manquants.length) {
      if (!confirm(`${manquants.length} produit(s) sans stock final saisi. Clôturer quand même ?`)) return;
    }

    const btn = document.getElementById('btnValiderCloture');
    btn.disabled = true; btn.textContent = 'Enregistrement…';

    // Mouvements déclarés
    for (const m of mouvementsSaisie) {
      const { error } = await nexusClient.from('inventaire_mouvements').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: m.produit_id,
        type_mouvement: m.type_mouvement, quantite: m.quantite, employee_id: employeeCourant.id, justification: m.justification || null,
      });
      if (error) console.error('Mouvement:', error);
    }

    let nbClotures = 0;
    for (const p of produitsZone) {
      const saisie = comptagesSaisie[p.id];
      if (!saisie || saisie.compte === undefined) continue;
      nbClotures++;
      const { error } = await nexusClient.from('inventaire_comptages').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: p.id,
        type_comptage: 'cloture', quantite: saisie.compte, employee_id: employeeCourant.id, source: 'manuel', statut: 'valide',
      });
      if (error) console.error('Comptage clôture:', error);
    }

    await nexusClient.from('inventaire_quart_employes').update({ a_valide_cloture: true, heure_depart: new Date().toISOString() }).eq('id', quartEmployeRow.id);
    await nexusClient.from('inventaire_quarts').update({ statut: 'cloture', cloture_le: new Date().toISOString() }).eq('id', quartRow.id);
    quartEmployeRow.a_valide_cloture = true;

    renderFinalCloture(nbClotures);
  }

  function renderFinalCloture(nbClotures) {
    document.getElementById('titre').textContent = 'Inventaire de clôture validé';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="resume-card">
        <div class="checkmark">✓</div>
        <div class="final-greet">Merci ${employeeCourant.nom}</div>
        <div class="stat-row"><span class="stat-label">Produits clôturés</span><span class="stat-value">${nbClotures}</span></div>
        <div class="stat-row"><span class="stat-label">Mouvements déclarés</span><span class="stat-value">${mouvementsSaisie.length}</span></div>
        <div class="ecoulement-note">Votre stock final devient le stock transmis du prochain quart. Le manager pourra rapprocher ces chiffres avec les ventes de caisse dès que l'export sera importé — ce n'est pas encore fait automatiquement.</div>
      </div>
      <button class="btn-primary" id="btnRetourAccueil">Retour</button>
    `;
    document.getElementById('btnRetourAccueil').addEventListener('click', renderAccueil);
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    employeeCourant = employee;
    demarrerHorloge();
    quartActuel = await quartDuMoment(employee.site_id);
    roleDuJour = await chargerRoleDuJour();
    zonesAutorisees = zonesPourRole(roleDuJour);
    zoneActive = zonesAutorisees[0];

    const { data: zonas } = await nexusClient.from('inventaire_zones').select('id, code');
    if (zonas) zonesMap = Object.fromEntries(zonas.map(z => [z.code, z.id]));

    quartRow = await obtenirOuCreerQuart();
    if (!quartRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger l\'inventaire du quart. Réessayez.</div>'; return; }
    quartEmployeRow = await obtenirOuCreerQuartEmploye();

    if (quartEmployeRow && quartEmployeRow.zone_id) {
      const codeConnu = Object.keys(zonesMap).find(code => zonesMap[code] === quartEmployeRow.zone_id);
      if (codeConnu) zoneActive = codeConnu;
    }

    if (zonesAutorisees.length > 1 && !quartEmployeRow.zone_id) {
      renderChoixZone();
    } else {
      renderAccueil();
    }
  });
</script>
</body>
</html>
