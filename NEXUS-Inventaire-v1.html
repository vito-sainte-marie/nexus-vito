<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Inventaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-desktop.js"></script>
<script src="nexus-inventaire-moteur.js"></script>
<script src="nexus-inventaire-plan-donnees.js"></script>
<script src="nexus-inventaire-production-donnees.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  /* Horodateur discret (02/08/2026, demande de Frédéric — "l'heure prend
     beaucoup de place, elle concurrence le nom de la catégorie et la
     progression") : une seule ligne secondaire "Dimanche 2 août · 17:17",
     remplace l'ancien gros chiffre HH:MM:SS. L'espace gagné sert à la
     catégorie et à la progression, pas à l'horloge. */
  .horodateur-discret{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:8px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  /* Accueil : 2 gros boutons Prise de poste / Clôture */
  .choix-grid{display:flex; flex-direction:column; gap:12px;}
  .choix-card{
    position:relative; background:linear-gradient(145deg, var(--panel), var(--panel-raised));
    border:1.5px solid var(--hairline); border-radius:16px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25); transition:transform .15s;
  }
  .choix-card:active{transform:scale(0.98);}
  .choix-card.disabled{opacity:0.4; pointer-events:none;}
  .choix-icone{width:52px; height:52px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px;}
  .choix-icone.ouverture{background:radial-gradient(circle at 32% 28%, rgba(79,195,217,0.30), var(--panel-raised) 72%); box-shadow:inset 0 0 0 1px rgba(79,195,217,0.25);}
  .choix-icone.cloture{background:radial-gradient(circle at 32% 28%, rgba(212,175,55,0.30), var(--panel-raised) 72%); box-shadow:inset 0 0 0 1px rgba(212,175,55,0.3);}
  .choix-titre{font-size:15.5px; font-weight:700;}
  .choix-sub{font-size:11.5px; color:var(--text-mid); margin-top:3px; line-height:1.4;}
  .choix-statut{font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; margin-top:5px;}
  .choix-statut.fait{color:var(--green);}
  .choix-statut.attente{color:var(--amber);}

  .etat-banner{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .etat-banner b{color:var(--text);}

  .zone-choix{display:flex; gap:10px; margin-bottom:16px;}
  .zone-pill{flex:1; text-align:center; padding:14px; border-radius:12px; border:1.5px solid var(--hairline); background:var(--panel); font-size:13.5px; font-weight:600; cursor:pointer;}
  .zone-pill.active{border-color:var(--cyan); background:rgba(79,195,217,0.1); color:var(--cyan);}

  /* Quart matin/soir bien visible (02/08/2026, demande de Frédéric —
     "mets de façon visible matin et soir et en surbrillance le quart
     actif"). Non cliquable : le quart est détecté automatiquement (voir
     quartDuMoment()), ceci ne fait que l'afficher clairement. */
  .quart-visuel{display:flex; gap:10px; margin-bottom:16px;}
  .quart-visuel-item{flex:1; text-align:center; padding:11px; border-radius:12px; border:1.5px solid var(--hairline); background:var(--panel); font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer;}
  .quart-visuel-item:active{background:var(--panel-raised);}
  .quart-visuel-item.actif{border-color:var(--cyan); background:rgba(79,195,217,0.14); color:var(--cyan); box-shadow:0 0 0 1px rgba(79,195,217,0.25);}

  .cat-block{margin-bottom:16px;}
  .cat-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;}
  .cat-nom{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}
  .cat-conforme{font-family:var(--mono); font-size:9.5px; color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3); border-radius:14px; padding:4px 9px; cursor:pointer;}
  .cat-conforme:active{background:rgba(79,195,217,0.2);}
  .cat-block.desactive{opacity:0.45;}
  .cat-desactive-tag{font-family:var(--mono); font-size:9px; color:var(--text-dim); background:var(--panel-raised); border-radius:14px; padding:3px 8px; white-space:nowrap;}
  .produit-input:disabled{cursor:not-allowed;}

  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .produit-row{padding:12px 14px;}
  .produit-row + .produit-row{border-top:1px solid var(--hairline);}
  .produit-nom-ligne{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .produit-nom{font-size:13.5px; font-weight:600; flex:1;}
  .badge-sensible{font-family:var(--mono); font-size:8.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--red); background:var(--red-dim); border-radius:6px; padding:2px 6px;}
  .produit-transmis{font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}
  .produit-controls{display:flex; align-items:center; gap:8px;}
  .produit-input{
    flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:9px;
    padding:10px 12px; color:var(--text); font-family:var(--mono); font-size:16px; text-align:right;
  }
  .produit-input:focus{outline:none; border-color:var(--cyan);}
  .btn-identique{font-family:var(--mono); font-size:9.5px; color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; cursor:pointer; white-space:nowrap;}
  .btn-identique:active{background:var(--hairline);}
  /* Comptage en deux lieux (05/08/2026, demande de Frédéric — boissons,
     huiles, lave-glace/liquide de refroidissement comptés au dépôt PUIS en
     boutique) : l'employé reste physiquement à un endroit jusqu'à avoir
     fini — une seule case à la fois (jamais les deux en même temps), la
     boutique étant rattrapée automatiquement en fin d'inventaire (voir
     renderFinalisationDoubleLieu). Ce badge signale juste qu'une deuxième
     saisie suivra plus tard. */
  .badge-double-lieu{display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:0.02em; color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3); border-radius:8px; padding:3px 7px; margin-left:6px; white-space:nowrap;}
  .ecart-tag{font-family:var(--mono); font-size:10.5px; margin-top:6px; text-align:right; display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
  .ecart-ok{color:var(--green);}
  .ecart-warn{color:var(--amber);}
  .ecart-bad{color:var(--red);}
  .btn-declarer-livraison{font-family:var(--sans); font-size:10.5px; font-weight:600; color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.35); border-radius:14px; padding:4px 10px; cursor:pointer; white-space:nowrap;}
  .btn-declarer-livraison:active{background:rgba(79,195,217,0.22);}
  .livraison-declaree{font-family:var(--sans); font-size:10.5px; color:var(--green); white-space:nowrap;}
  .justif-input{
    width:100%; margin-top:8px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px;
    padding:8px 10px; color:var(--text); font-size:16px; font-family:var(--sans);
  }
  .justif-input::placeholder{color:var(--text-dim);}
  .produit-masque{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); font-style:italic;}

  /* Écrans catégories / carrousel (02/08/2026, demande de Frédéric —
     "une succession de petites actions simples" plutôt qu'une longue
     liste vue d'un coup). Voir renderCategoriesOuverture() / renderCarrousel(). */
  .progression-bloc{margin-bottom:16px;}
  .progression-haut{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--text-mid); margin-bottom:6px;}
  .progression-temps{font-family:var(--mono); font-size:10.5px; color:var(--cyan);}
  .progression-barre{height:6px; border-radius:4px; background:var(--panel-raised); overflow:hidden;}
  .progression-globale{font-size:10.5px; color:var(--text-dim); margin-top:6px;}
  .toast-validation{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translate(-50%, 12px); opacity:0;
    background:var(--green-dim); color:var(--green); border:1px solid var(--green); border-radius:12px;
    padding:12px 20px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:200; transition:opacity .18s ease, transform .18s ease;
    pointer-events:none; max-width:88vw; text-align:center;}
  .toast-validation.toast-visible{opacity:1; transform:translate(-50%, 0);}
  .toast-check{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
    border-radius:50%; background:var(--green); color:var(--bg, #0b0f0d); font-size:13px; flex:none;}
  .progression-remplie{height:100%; background:var(--cyan); border-radius:4px; transition:width .25s;}

  .cats-titre{font-family:var(--mono); font-size:11px; color:var(--text-mid); margin-bottom:10px;}
  .categorie-row{display:flex; justify-content:space-between; align-items:center; padding:14px; cursor:pointer;}
  .categorie-row + .categorie-row{border-top:1px solid var(--hairline);}
  .categorie-row:active{background:var(--panel-raised);}
  .categorie-nom{font-size:14px; font-weight:600;}
  .categorie-count{font-size:11.5px; color:var(--text-mid); margin-top:2px;}
  .categorie-etat{font-family:var(--mono); font-size:10px; font-weight:700; padding:4px 9px; border-radius:12px; white-space:nowrap; text-transform:uppercase;}
  .categorie-etat.a-faire{background:var(--panel-raised); color:var(--text-dim);}
  .categorie-etat.en-cours{background:rgba(79,195,217,0.12); color:var(--cyan);}
  .categorie-etat.termine{background:var(--green-dim); color:var(--green);}
  .categorie-etat.prioritaire{background:var(--red-dim); color:var(--red);}
  .categorie-etat.desactivee{background:var(--panel-raised); color:var(--text-dim);}
  .categorie-row.desactive{opacity:0.45; cursor:not-allowed; pointer-events:none;}

  .carrousel-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:22px 18px; text-align:center; margin-bottom:14px;}
  .carrousel-nom{font-size:17px; font-weight:700; margin-bottom:14px;}
  .carrousel-transmis{font-size:11.5px; color:var(--text-mid);}
  .carrousel-valeur{font-family:var(--mono); font-size:34px; font-weight:700; color:var(--text-dim); margin:6px 0 18px;}
  .carrousel-unite{font-size:14px; font-weight:400; color:var(--text-dim);}
  .carrousel-actions{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .carrousel-input{text-align:center; font-size:22px; margin-top:14px; width:100%;}
  .carrousel-footer{text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:8px;}

  .mouv-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px; margin-bottom:14px;}
  .mouv-titre{font-size:13px; font-weight:700; margin-bottom:10px;}
  .mouv-row{display:flex; gap:8px; margin-bottom:8px;}
  .mouv-select, .mouv-qte{background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12.5px; font-family:var(--sans);}
  .mouv-select{flex:1.4;}
  .mouv-qte{flex:1; font-family:var(--mono); text-align:right;}
  .mouv-justif{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12px; margin-bottom:8px;}
  .mouv-liste{margin-top:4px;}
  .mouv-item{display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:var(--panel-raised); border-radius:8px; margin-bottom:6px; font-size:12px;}
  .mouv-item .rm{color:var(--red); cursor:pointer; font-family:var(--mono); font-size:11px;}

  .btn-primary{width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}

  /* Points animés pendant l'enregistrement (02/08/2026, demande de
     Frédéric) : remplace le texte statique "Enregistrement…" sur les
     boutons de validation — currentColor pour s'adapter à la couleur de
     texte du bouton, quel qu'il soit. */
  .btn-loading-dots{display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle;}
  .btn-loading-dots i{width:4px; height:4px; border-radius:50%; background:currentColor; display:inline-block; font-style:normal; animation:btnDotsBounce 1.2s infinite ease-in-out;}
  .btn-loading-dots i:nth-child(2){animation-delay:0.15s;}
  .btn-loading-dots i:nth-child(3){animation-delay:0.3s;}
  @keyframes btnDotsBounce{
    0%, 80%, 100%{opacity:0.25; transform:translateY(0);}
    40%{opacity:1; transform:translateY(-2px);}
  }
  .btn-ghost{width:100%; padding:12px; border:1px solid var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:13px; cursor:pointer; margin-top:8px;}
  .btn-text{width:100%; padding:12px; border:none; background:none; color:var(--text-dim); font-size:12.5px; cursor:pointer; margin-top:4px;}

  .resume-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:20px; margin-top:4px;}
  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0;}
  .stat-row + .stat-row{border-top:1px solid var(--hairline);}
  .stat-label{font-size:13px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:15px; font-weight:700;}
  .stat-value.amber{color:var(--amber);}
  .stat-value.cyan{color:var(--cyan);}
  .stat-value.red{color:var(--red);}
  .checkmark{width:56px; height:56px; border-radius:50%; background:var(--green-dim); color:var(--green); font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .final-greet{font-size:19px; font-weight:700; text-align:center;}

  .ecoulement-note{font-size:11px; color:var(--text-dim); line-height:1.5; margin-top:10px; padding-top:10px; border-top:1px solid var(--hairline);}

  /* Message pré-comptage (10/08/2026, demande de Frédéric) : affiché une
     seule fois par session de comptage, juste avant le premier comptage —
     jamais un rappel répété qu'on finit par ignorer. Voir demarrerOuverture(). */
  .precomptage-card{background:var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:26px 22px; margin-top:8px; text-align:center;}
  .precomptage-emoji{font-size:30px; margin-bottom:12px;}
  .precomptage-titre{font-size:16.5px; font-weight:700; line-height:1.4; margin-bottom:10px;}
  .precomptage-texte{font-size:13px; color:var(--text-mid); line-height:1.6; margin-bottom:14px;}
  .precomptage-regle{font-size:13.5px; font-weight:600; color:var(--cyan); line-height:1.5; padding:12px; background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.25); border-radius:10px; margin-bottom:18px;}

  /* Calculatrice de comptage (16/08/2026, demande de Frédéric) — voir
     evaluerAdditionChainee() et ouvrirCalculatricePopup(). */
  .champ-comptage{display:flex; flex-direction:column; gap:6px; flex:1;}
  .calc-barre{display:flex; align-items:center; gap:6px;}
  .calc-op-btn{font-family:var(--mono); font-size:16px; font-weight:700; color:var(--cyan); background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; width:32px; height:28px; cursor:pointer; flex-shrink:0; line-height:1;}
  .calc-op-btn:active{background:rgba(79,195,217,0.18);}
  .calc-pop-btn{font-size:14px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; width:32px; height:28px; cursor:pointer; flex-shrink:0; margin-left:auto; line-height:1;}
  .calc-pop-btn:active{background:var(--hairline);}
  .calc-apercu{font-family:var(--mono); font-size:11.5px; color:var(--cyan); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .calc-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:300;}
  .calc-modal{width:100%; max-width:460px; background:var(--panel); border:1px solid var(--hairline); border-top-left-radius:18px; border-top-right-radius:18px; padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
  .calc-display{font-family:var(--mono); font-size:30px; font-weight:700; text-align:right; padding:10px 8px; margin-bottom:14px; background:var(--panel-raised); border-radius:10px; border:1px solid var(--hairline); overflow-x:auto; white-space:nowrap;}
  .calc-keys{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;}
  .calc-key{font-family:var(--mono); font-size:19px; font-weight:600; color:var(--text); background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px; padding:16px 0; cursor:pointer;}
  .calc-key:active{background:var(--hairline);}
  .calc-key-op{color:var(--cyan);}
  .calc-key-fn{color:var(--amber);}
  .calc-key-eq{background:var(--cyan); color:#04141a; border-color:var(--cyan);}
  .calc-key-eq:active{background:#3cb3c9;}
  .calc-actions{display:flex; gap:10px; margin-top:14px;}
  .calc-actions .btn-ghost, .calc-actions .btn-primary{margin-top:0;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Inventaire</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="horodateur-discret" id="horodateurDiscret">--</div>
    <div class="sub" id="sousTitre"></div>
  </div>
  <div class="divider"></div>

  <!-- desktop-grid (02/08/2026) : mise en colonnes en vue bureau (voir
       nexus-desktop.js) — purement additif, aucun effet en mobile. -->
  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>

  <footer>NEXUS Inventaire v1 · Registre numérique des comptages de quart · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS Inventaire v1 (02/08/2026) — construit avec Frédéric à partir
  // d'une feuille papier réelle (11 catégories : jaugeage carburant, gaz,
  // glaçons, journaux, pains/sandwichs, viennoiserie, cigarettes, boissons
  // chaudes/bières, huiles, lave-glace/liquide refroidissement, CBD).
  //
  // Principe central (voir schéma inventaire_* en base) : les employés
  // comptent et transmettent, NEXUS sécurise et structure les données
  // (comptages en événements immuables, jamais d'écrasement silencieux),
  // le manager rapproche avec Decenium plus tard (V2/V3 — hors scope ici).
  //
  // Vocabulaire imposé par Frédéric : jamais "ventes" ni "stock théorique"
  // dans cette page — uniquement "stock transmis", "stock compté",
  // "écoulement physique constaté". NEXUS Inventaire ne prétend pas
  // connaître les ventes réelles de caisse.
  // ------------------------------------------------------------

  let employeeCourant = null;
  let roleDuJour = null;
  let zonesAutorisees = [];      // ['piste'] | ['boutique'] | ['piste','boutique']
  let zoneActive = null;         // zone choisie pour la session en cours
  let quartActuel = null;        // 'matin' | 'soir'
  let quartRow = null;           // ligne inventaire_quarts
  let quartEmployeRow = null;    // ligne inventaire_quart_employes de CET employé
  let produitsZone = [];         // catalogue inventaire_zone_produit filtré
  let dernierStock = {};         // produit_id -> { quantite, comptage_id } | null
  let modesAveugle = [];         // règles inventaire_modes_controle actives (mode='aveugle')
  let modeJaugeageActif = false; // inventaire_modes_controle actif (mode='jaugeage_actif') — voir chargerModeJaugeageActif()
  // Inventaire 2.0 P0 (17/08/2026, Sprint 1+2 — "NEXUS décide quoi
  // compter"). planQuartActif = { plan, items } tel que retourné par
  // NexusInventairePlanDonnees.chargerOuGenererPlan — persisté une seule
  // fois par (site, date, quart), jamais recalculé au rechargement.
  let planQuartActif = null;
  let produitsPlanIds = new Set();       // produit_id sélectionnés par NEXUS pour ce quart — vérité physique aveugle
  let planItemIdParProduit = {};         // produit_id -> inventaire_plan_items.id (pour marquerItemPlanCompte)
  let comptagesSaisie = {};      // produit_id -> { compte, justification }
  let mouvementsSaisie = [];     // { produit_id, type_mouvement, quantite, justification }
  let zonesMap = {};             // code ('piste'/'boutique') -> id (inventaire_zones)
  // Production journalière (18/08/2026, M2 — cahier "Audit Inventaire -
  // Production, mouvements & réceptions" §3/§4) : profilParProduit vient de
  // inventaire_regles_produit.profil (même requête que quartsParProduit,
  // Article 11 — jamais une deuxième requête pour la même table), peuplé
  // par chargerProduitsZone(). recommandationsParProduit ne concerne que le
  // quart matin (obtenue via NexusInventaireProductionDonnees, voir
  // chargerRecommandationsProduction()) et pilote l'écran renderCarrouselProduction/
  // la ligne grille dédiée — jamais recalculée une fois affichée (§4.3).
  let profilParProduit = {};
  let recommandationsParProduit = {};
  // "+ Ajouter un mouvement" pendant le quart (18/08/2026, M3) : catalogue
  // propre à cet écran (jamais restreint au plan tournant, voir
  // demarrerAjoutMouvementRapide) — distinct de produitsZone pour ne
  // jamais interférer avec l'état ouverture/clôture en cours.
  let mouvementRapideProduits = [];
  // Position de navigation courante (17/08/2026, Sprint 4 "UX Flash" —
  // cahier Inventaire 2.0, INV2-16 "après interruption, l'employé reprend au
  // bon produit") : { categorieNom, carrouselIndex } | null. Persistée dans
  // le brouillon local à chaque changement d'étape/produit — voir
  // sauvegarderPositionCourante(). Contrairement à comptagesSaisie, ce n'est
  // qu'un raccourci de navigation, jamais une vérité métier : si elle est
  // absente ou incohérente (catégorie déjà terminée, etc.), le parcours
  // retombe simplement sur l'écran catégories, jamais une erreur bloquante.
  let positionCourante = null;

  // Compteurs de mesures d'adoption (18/08/2026, Sprint 8 — cahier §16,
  // INV2-19 "Les mesures de temps/taps sont enregistrées sans action
  // supplémentaire") : accumulés en mémoire à des points de geste déjà
  // existants (jamais un nouvel événement inventé pour l'occasion — voir
  // ecrireOuvertureImmediat pour les taps, demarrerOuvertureComptage pour
  // les interruptions, la boucle de clôture pour ses propres taps), puis
  // flushés vers inventaire_quarts.nexus_taps_total/nexus_interruptions_total
  // via flusherMesuresAdoption() — best-effort, jamais visible ni bloquant
  // pour l'employé. Le temps NEXUS lui-même n'a pas besoin de compteur : il
  // se dérive d'ouvert_le/cloture_le (déjà existants) côté moteur
  // (dureeSessionAutomatiqueMinutes, Article 11).
  let compteurTapsSession = 0;
  let compteurInterruptionsSession = 0;

  // ------------------------------------------------------------
  // BROUILLON LOCAL (02/08/2026, demande de Frédéric — "si un employé fait
  // exprès [sans faire exprès] retourne en arrière, garder en mémoire les
  // valeurs déjà notées au lieu de recommencer à zéro") : comptagesSaisie et
  // mouvementsSaisie ne vivaient qu'en mémoire JS — un retour arrière
  // accidentel, un rafraîchissement de page ou une fermeture d'onglet
  // effaçait tout, sans qu'aucune donnée n'ait encore été envoyée au
  // serveur. Ce brouillon est stocké en local (jamais transmis à NEXUS tant
  // que Valider n'est pas cliqué) et sert uniquement de filet de sécurité
  // contre une perte de saisie — il n'a aucune valeur officielle et est
  // effacé dès que la validation réelle (validerOuverture/validerCloture)
  // aboutit.
  // ------------------------------------------------------------
  function cleDraft(phase) {
    if (!employeeCourant || !quartRow) return null;
    return `nexus_inventaire_draft_${employeeCourant.id}_${quartRow.id}_${phase}`;
  }
  function sauvegarderDraft(phase) {
    const cle = cleDraft(phase);
    if (!cle) return;
    // positionCourante (Sprint 4, INV2-16) : seulement pour 'ouverture', la
    // seule phase où existe une navigation catégorie/carrousel à reprendre
    // — la clôture reste une liste continue sans notion d'étape.
    const payload = phase === 'ouverture' ? { comptagesSaisie, mouvementsSaisie, positionCourante } : { comptagesSaisie, mouvementsSaisie };
    try { localStorage.setItem(cle, JSON.stringify(payload)); }
    catch (e) { console.error('Sauvegarde brouillon inventaire:', e); }
  }
  function chargerDraft(phase) {
    const cle = cleDraft(phase);
    if (!cle) return null;
    try {
      const brut = localStorage.getItem(cle);
      return brut ? JSON.parse(brut) : null;
    } catch (e) { console.error('Lecture brouillon inventaire:', e); return null; }
  }
  function effacerDraft(phase) {
    const cle = cleDraft(phase);
    if (!cle) return;
    try { localStorage.removeItem(cle); } catch (e) {}
  }

  // ------------------------------------------------------------
  // SYNCHRONISATION IMMÉDIATE PAR PRODUIT + FILE D'ATTENTE HORS-LIGNE
  // (18/08/2026, Sprint 4bis — cahier Inventaire 2.0 §10 "Réseau : sauvegarde
  // locale immédiate + synchro en arrière-plan", réarchitecture complète
  // choisie explicitement par Frédéric en suite du Sprint 4 "UX Flash").
  //
  // Avant ce lot : un comptage produit ne vivait qu'en mémoire
  // (comptagesSaisie) + brouillon local jusqu'à la validation finale
  // (validerOuverture), qui écrivait alors TOUT en une seule boucle. Un
  // employé perdant son réseau (ou son appareil) avant "Terminer" pouvait
  // perdre des comptages déjà physiquement faits et validés à l'écran, sans
  // qu'aucune trace n'existe côté serveur.
  //
  // Maintenant (écran ouverture uniquement — voir note dans validerCloture
  // pour pourquoi la clôture garde son modèle en lot) : chaque geste de
  // validation d'un produit tente une écriture Supabase immédiate. En cas
  // d'échec réseau, l'écriture part dans une file d'attente locale, retentée
  // en arrière-plan (retour réseau, ouverture d'une nouvelle catégorie,
  // minuterie) et surtout de façon BLOQUANTE juste avant "Terminer" — on ne
  // finalise jamais un inventaire avec des comptages encore uniquement
  // locaux sans en avertir l'employé.
  //
  // Idempotence sans jamais UPDATE (la table inventaire_comptages reste
  // append-only : aucune policy RLS UPDATE n'existe, volontairement) :
  // chaque écriture porte une clé déterministe = hash(quart|produit|type|
  // valeur). Deux tentatives de la MÊME valeur (vraie retentative réseau,
  // double tape, rejeu de la file) partagent la même clé -> la deuxième est
  // ignorée par la base (ON CONFLICT DO NOTHING), jamais un doublon. Une
  // VRAIE correction (l'employé revient en arrière et change son chiffre) a
  // une valeur différente -> une clé différente -> une nouvelle ligne —
  // exactement la même philosophie "historique append-only, le plus récent
  // gagne" déjà utilisée partout ailleurs dans NEXUS (voir
  // chargerDerniersStocks : lecture triée par compte_le décroissant, premier
  // rencontré par produit gagne — même lecture côté NEXUS-Inventaire-
  // Manager-v1.html).
  // ------------------------------------------------------------

  // Hash déterministe simple (djb2, déjà utilisé pour le PRNG du plan
  // tournant — Sprint 2) : pas un usage cryptographique, seulement un
  // identifiant stable et bien réparti pour la déduplication. Quatre passes
  // à graines différentes donnent 32 hex chiffres, reformatés en UUID valide
  // pour la colonne `uuid`.
  function djb2InventaireHash(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return h >>> 0;
  }
  function cleIdempotenceComptage(quartId, produitId, typeComptage, valeur) {
    const base = `${quartId}|${produitId}|${typeComptage}|${valeur}`;
    const hex = [base, base + '|s2', base + '|s3', base + '|s4']
      .map(s => djb2InventaireHash(s).toString(16).padStart(8, '0')).join('').slice(0, 32);
    return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20,32)}`;
  }

  function cleFileSync() {
    if (!employeeCourant || !quartRow) return null;
    return `nexus_inventaire_filesync_${employeeCourant.id}_${quartRow.id}`;
  }
  function chargerFileSync() {
    const cle = cleFileSync();
    if (!cle) return [];
    try { return JSON.parse(localStorage.getItem(cle) || '[]'); }
    catch (e) { return []; }
  }
  function sauvegarderFileSync(file) {
    const cle = cleFileSync();
    if (!cle) return;
    try { localStorage.setItem(cle, JSON.stringify(file)); }
    catch (e) { console.error('Sauvegarde file de synchro inventaire:', e); }
  }
  function ajouterFileSync(item) {
    // Remplace toute entrée en attente portant la même clé d'idempotence —
    // une resaisie du même produit avant que la première tentative n'ait pu
    // partir ne doit pas empiler deux entrées à retenter, une seule suffit.
    const sansAncienne = chargerFileSync().filter(x => x.idempotencyKey !== item.idempotencyKey);
    sansAncienne.push(item);
    sauvegarderFileSync(sansAncienne);
  }
  function retirerFileSync(idempotencyKey) {
    sauvegarderFileSync(chargerFileSync().filter(x => x.idempotencyKey !== idempotencyKey));
  }

  // Tente une écriture immédiate d'un événement inventaire_comptages. Ne
  // bloque jamais l'employé : en cas d'échec réseau, l'événement part dans
  // la file d'attente locale pour être retenté plus tard — la saisie reste
  // acquise dans comptagesSaisie/le brouillon local quoi qu'il arrive (déjà
  // le cas avant ce lot, inchangé).
  async function ecrireComptageImmediat(payload) {
    const idempotencyKey = cleIdempotenceComptage(payload.quart_id, payload.produit_id, payload.type_comptage, payload.quantite);
    try {
      const { data, error } = await nexusClient
        .from('inventaire_comptages')
        .upsert({ ...payload, idempotency_key: idempotencyKey }, { onConflict: 'idempotency_key', ignoreDuplicates: true })
        .select()
        .maybeSingle();
      if (error) throw error;
      retirerFileSync(idempotencyKey);
      // data est null si la ligne existait déjà (vraie retentative d'une
      // écriture déjà réussie plus tôt) — rien de neuf à exploiter côté
      // appelant dans ce cas (ex. le marquage du plan a déjà eu lieu alors).
      return data || null;
    } catch (e) {
      console.error('Écriture immédiate comptage (mise en file d\'attente):', e);
      ajouterFileSync({ idempotencyKey, payload, ajouteLe: new Date().toISOString() });
      return null;
    }
  }

  // Vidage de la file d'attente (best-effort, jamais bloquant en usage
  // opportuniste). Appelé au retour réseau, à l'ouverture d'une nouvelle
  // catégorie, sur une minuterie, et de façon attendue/bloquante juste avant
  // la validation finale (voir validerOuverture) — renvoie false s'il reste
  // au moins un élément non synchronisé après la tentative.
  async function tenterSynchronisationFileAttente() {
    const file = chargerFileSync();
    if (!file.length) return true;
    let toutSynchronise = true;
    for (const item of file) {
      try {
        // Table générique (18/08/2026, M2 — la file servait uniquement
        // inventaire_comptages jusqu'ici ; production_initiale écrit dans
        // inventaire_mouvements). item.table absent = comportement
        // historique inchangé pour toute entrée déjà en file avant ce lot.
        const table = item.table || 'inventaire_comptages';
        const { error } = await nexusClient
          .from(table)
          .upsert({ ...item.payload, idempotency_key: item.idempotencyKey }, { onConflict: 'idempotency_key', ignoreDuplicates: true });
        if (error) throw error;
        retirerFileSync(item.idempotencyKey);
      } catch (e) {
        toutSynchronise = false;
      }
    }
    return toutSynchronise;
  }

  // Flush best-effort des compteurs d'adoption (18/08/2026, Sprint 8, cahier
  // §16, INV2-19) — additionne les compteurs en mémoire aux totaux déjà
  // persistés sur inventaire_quarts (jamais un UPDATE en incrément SQL, ce
  // client ne fait qu'une lecture-puis-écriture simple : un seul employé
  // travaille un quart donné à la fois dans l'usage réel de NEXUS, même
  // hypothèse de concurrence que le reste de cet écran). N'est jamais
  // bloquant ni visible pour l'employé — une mesure indicative de pilote
  // (cahier §16), pas une donnée financière ou de stock : en cas d'échec
  // réseau, les compteurs locaux ne sont PAS remis à zéro et seront
  // simplement inclus dans la prochaine tentative (prochaine catégorie
  // ouverte ou validation finale), plutôt que perdus silencieusement.
  async function flusherMesuresAdoption() {
    if (!quartRow || (compteurTapsSession === 0 && compteurInterruptionsSession === 0)) return;
    try {
      const nouveauxTaps = (quartRow.nexus_taps_total || 0) + compteurTapsSession;
      const nouvellesInterruptions = (quartRow.nexus_interruptions_total || 0) + compteurInterruptionsSession;
      const { error } = await nexusClient.from('inventaire_quarts')
        .update({ nexus_taps_total: nouveauxTaps, nexus_interruptions_total: nouvellesInterruptions })
        .eq('id', quartRow.id);
      if (error) throw error;
      quartRow.nexus_taps_total = nouveauxTaps;
      quartRow.nexus_interruptions_total = nouvellesInterruptions;
      compteurTapsSession = 0;
      compteurInterruptionsSession = 0;
    } catch (e) {
      console.error('Flush mesures adoption (best-effort, non bloquant):', e);
    }
  }

  // Écrit (au besoin) l'événement "transmis" — valeur constante pour un
  // produit+quart donné, donc sa clé d'idempotence est naturellement stable
  // d'une tentative à l'autre : au plus une seule ligne "transmis" existera
  // jamais pour ce couple produit+quart, quel que soit le nombre de
  // tentatives (réseau ou resaisies).
  async function ecrireTransmisImmediat(p) {
    const transmis = dernierStock[p.id];
    const valeurTransmise = transmis ? transmis.quantite : 0;
    return ecrireComptageImmediat({
      site: employeeCourant.site_id, quart_id: quartRow.id, produit_id: p.id,
      type_comptage: 'transmis', quantite: valeurTransmise,
      comptage_source_id: transmis ? transmis.comptage_id : null, quantite_transmise: valeurTransmise,
      source: 'auto',
    });
  }

  // Écrit l'événement "ouverture" pour CE produit avec la valeur
  // actuellement dans comptagesSaisie — appelée à chaque geste de
  // validation employé (jamais à chaque frappe). Ne fait rien tant que
  // `.compte` n'est pas encore connu (ex. produit en deux lieux dont seul le
  // dépôt est saisi — la vraie écriture attend la finalisation boutique, où
  // le total devient connu). Marque aussi le plan tournant comme fait,
  // best-effort/non-bloquant, comme avant ce lot.
  async function ecrireOuvertureImmediat(p) {
    const saisie = comptagesSaisie[p.id];
    if (!saisie || saisie.compte === undefined) return;
    compteurTapsSession++; // Sprint 8, INV2-19 : geste réel de validation produit, jamais une action ajoutée pour l'employé
    const transmis = dernierStock[p.id];
    const valeurTransmise = transmis ? transmis.quantite : 0;
    const evtTransmis = await ecrireTransmisImmediat(p);
    const evtOuverture = await ecrireComptageImmediat({
      site: employeeCourant.site_id, quart_id: quartRow.id, produit_id: p.id,
      type_comptage: 'ouverture', quantite: saisie.compte, employee_id: employeeCourant.id,
      comptage_source_id: evtTransmis ? evtTransmis.id : null, quantite_transmise: valeurTransmise,
      source: 'manuel', commentaire: saisie.justification || null,
      quantite_depot: saisie.compteDepot !== undefined ? saisie.compteDepot : null,
      quantite_boutique: saisie.compteBoutique !== undefined ? saisie.compteBoutique : null,
    });
    const planItemId = planItemIdParProduit[p.id];
    if (planItemId && evtOuverture && typeof NexusInventairePlanDonnees !== 'undefined') {
      NexusInventairePlanDonnees.marquerItemPlanCompte(nexusClient, planItemId, evtOuverture.id);
    }
  }

  // Variante pour le mode liste, où seul l'id du produit est disponible côté
  // appelant — ne tente l'écriture que si le produit est bien considéré
  // "compté" (voir produitEstCompte), jamais sur une saisie partielle.
  function tenterEcritureProduit(produitId) {
    const p = produitsZone.find(x => x.id === produitId);
    if (p && produitEstCompte(p)) ecrireSaisieImmediat(p);
  }

  // ------------------------------------------------------------
  // PRODUCTION JOURNALIÈRE — écriture (18/08/2026, M2/M5/M6 — cahier §3,
  // §6, §11). Q1 pour un produit à profil production_journaliere n'écrit
  // JAMAIS un comptage 'ouverture' (ce n'est pas un stock constaté, c'est
  // une quantité préparée — comparer ce chiffre au dernier comptage de
  // clôture d'hier produirait un "écart" qui n'a aucun sens métier). On
  // écrit un mouvement 'production_initiale' dans inventaire_mouvements à
  // la place, avec la même discipline d'idempotence + file d'attente
  // hors-ligne que ecrireComptageImmediat (Article 11 : même mécanisme,
  // seulement généralisé à une deuxième table — voir tenterSynchronisation
  // FileAttente ci-dessus).
  // ------------------------------------------------------------
  function cleIdempotenceMouvement(quartId, produitId, typeMouvement, quantite) {
    // Même algorithme que cleIdempotenceComptage (djb2, quatre graines) —
    // délègue plutôt que de dupliquer le hash pour une deuxième table.
    return cleIdempotenceComptage(quartId, produitId, typeMouvement, quantite);
  }

  async function ecrireMouvementImmediat(payload) {
    const idempotencyKey = cleIdempotenceMouvement(payload.quart_id, payload.produit_id, payload.type_mouvement, payload.quantite);
    try {
      const { data, error } = await nexusClient
        .from('inventaire_mouvements')
        .upsert({ ...payload, idempotency_key: idempotencyKey }, { onConflict: 'idempotency_key', ignoreDuplicates: true })
        .select()
        .maybeSingle();
      if (error) throw error;
      retirerFileSync(idempotencyKey);
      return data || null;
    } catch (e) {
      console.error('Écriture immédiate mouvement (mise en file d\'attente):', e);
      ajouterFileSync({ idempotencyKey, payload, table: 'inventaire_mouvements', ajouteLe: new Date().toISOString() });
      return null;
    }
  }

  // Écrit "quantité réellement mise au four" pour CE produit, à l'ouverture
  // du quart matin uniquement (§3.2) — jamais copiée automatiquement sans
  // ce geste explicite de validation (même si le champ était pré-rempli
  // avec la recommandation, voir renderCarrouselProduction).
  async function ecrireProductionInitialeImmediat(p) {
    const saisie = comptagesSaisie[p.id];
    if (!saisie || saisie.compte === undefined) return;
    compteurTapsSession++; // Sprint 8, INV2-19 : même geste réel qu'un comptage classique
    return ecrireMouvementImmediat({
      site: employeeCourant.site_id, quart_id: quartRow.id, produit_id: p.id,
      type_mouvement: 'production_initiale', quantite: saisie.compte, employee_id: employeeCourant.id,
      justification: saisie.justification || null, reason_code: 'production_initiale', statut_validation: 'valide',
    });
  }

  // Aiguillage unique (18/08/2026, M2) : tous les points de validation
  // (carrousel, grille, filet de sécurité de validerOuverture) passent par
  // cette seule fonction plutôt que de tester profilParProduit à chaque
  // site d'appel — un seul endroit qui décide "comptage ou mouvement de
  // production", jamais une divergence possible entre deux copies du test.
  function ecrireSaisieImmediat(p) {
    if (quartActuel === 'matin' && profilParProduit[p.id] === 'production_journaliere') {
      return ecrireProductionInitialeImmediat(p);
    }
    return ecrireOuvertureImmediat(p);
  }

  // Écrans catégories / carrousel de l'ouverture (02/08/2026, demande de
  // Frédéric — "une succession de petites actions simples" plutôt qu'une
  // longue liste vue d'un coup). Au-delà de CARROUSEL_SEUIL produits, une
  // catégorie s'affiche en mode "produit suivant" plutôt qu'en liste.
  const CARROUSEL_SEUIL = 6;
  const SECONDES_PAR_PRODUIT = 4.5; // base du temps restant estimé, indicatif seulement

  // Jaugeage carburant (02/08/2026, demande de Frédéric) : "mets le
  // jaugeage a la fin du quart en grisé par defaut à ne pas remplir, ça
  // doit etre une option prise par le manager." Grisé/non requis sur les
  // deux quarts par défaut ; un manager l'active depuis
  // NEXUS-Inventaire-Manager-v1.html (inventaire_modes_controle,
  // mode='jaugeage_actif' — même mécanisme que le mode aveugle).
  const JAUGEAGE_NOM = 'Jaugeage Carburant';
  let categorieActive = null;       // nom de la catégorie affichée en détail
  let carrouselIndex = 0;           // index courant dans la catégorie en mode carrousel
  let carrouselModeCorrection = false; // true dès que l'employé a tapé "Corriger" sur le produit courant
  // Parcours dépôt → boutique → reste (15/08/2026, demande de Frédéric —
  // "une fois que le comptage dépôt est terminé, passe par le comptage
  // boutique et en fin le comptage du reste des produits comme predefini") :
  // dès que le dépôt est entièrement compté, l'écran "Comptage boutique"
  // (renderFinalisationDoubleLieu) se propose automatiquement plutôt que
  // d'attendre la validation finale — mais reste souple (l'employé peut
  // revenir aux catégories s'il préfère). `true` dès qu'il a explicitement
  // choisi de la reporter à plus tard, pour ne pas la lui re-proposer en
  // boucle à chaque retour sur l'écran catégories (le filet de sécurité à
  // la validation finale, lui, reste actif quoi qu'il arrive).
  let boutiqueRattrapageIgnore = false;

  // Horodateur discret (02/08/2026, demande de Frédéric) : plus de secondes
  // affichées, donc plus besoin d'une mise à jour chaque seconde — toutes
  // les 15s suffit pour rester à la minute près.
  function heureLocale() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }
  function demarrerHorloge() {
    const majHeure = () => {
      const el = document.getElementById('horodateurDiscret');
      if (!el) return;
      const jour = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      el.textContent = `${jour.charAt(0).toUpperCase()}${jour.slice(1)} · ${heureLocale()}`;
    };
    majHeure();
    setInterval(majHeure, 15000);
  }

  // Quart par défaut dérivé des vrais horaires de la station (02/08/2026,
  // demande de Frédéric — "te referencer aux parametres station pour mettre
  // par défaut le quart") : remplace l'ancien seuil fixe "13h" par l'heure
  // de démarrage normale du quart 2, configurée dans NEXUS Paramètres
  // Station (station_config.horaires.quart2.normal, ex: "12:40" — même
  // valeur par défaut que NEXUS-Parametres-Station-v1.html si rien n'a
  // encore été enregistré pour ce site). Avant cette heure : quart du matin,
  // à partir de cette heure : quart du soir.
  const HORAIRE_DEFAUT_DEBUT_QUART2 = '12:40';
  async function quartDuMoment(siteId) {
    let debutQuart2 = HORAIRE_DEFAUT_DEBUT_QUART2;
    const { data, error } = await nexusClient
      .from('station_config').select('horaires').eq('site', siteId).maybeSingle();
    if (error) console.error('Chargement horaires station (quart par défaut):', error);
    else if (data && data.horaires && data.horaires.quart2 && data.horaires.quart2.normal) {
      debutQuart2 = data.horaires.quart2.normal;
    }
    const maintenant = new Date();
    const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
    const [hQ2, mQ2] = debutQuart2.split(':').map(Number);
    const minutesQ2 = hQ2 * 60 + (mQ2 || 0);
    return minutesMaintenant < minutesQ2 ? 'matin' : 'soir';
  }
  function dateISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtNum(n) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  }

  // Calculatrice de comptage (16/08/2026, demande de Frédéric — "possible
  // d'intégrer une calculatrice ?", écran carrousel "Comptage dépôt"),
  // étendue le 17/08/2026 (Sprint 4 "UX Flash", cahier Inventaire 2.0 §10.1
  // — "3 cartons x 24 + 5 -> 77 injecté directement") : deux façons
  // complémentaires de calculer un total sans sortir du champ.
  // 1) Expression en chaîne : le champ accepte directement une suite de
  // nombres séparés par +, -, x (multiplication) ou / (division), saisie
  // via les boutons [+]/[−]/[×]/[÷] sous le champ (le clavier numérique
  // natif ne propose pas ces symboles). × et ÷ sont TOUJOURS prioritaires
  // sur + et − (ordre des opérations standard, jamais un simple cumul
  // gauche-à-droite) — sans cette priorité "3 x 24 + 5" donnerait 87
  // (3 x 29) au lieu des 77 attendus par le cahier. evaluerAdditionChainee()
  // remplace parseFloat() partout où un comptage est lu — un nombre seul
  // ("24") reste interprété exactement comme avant, c'est le comportement
  // très large majoritaire, rien ne change pour lui. Retourne NaN (jamais
  // une exception) pour une chaîne invalide ou incomplète (ex: "6+" en
  // cours de frappe) — traité par le code appelant exactement comme un
  // champ vide, la saisie n'est jamais bloquée. Jamais un eval() de chaîne
  // (Article 5) : deux passes explicites, comme la calculatrice popup.
  function evaluerAdditionChainee(brut) {
    if (brut === null || brut === undefined) return NaN;
    let nettoye = String(brut).trim().replace(/,/g, '.').replace(/\s+/g, '');
    // Un employé sans boutons dédiés (clavier externe) peut taper "x"/"X"/"×"
    // pour multiplier ou ":"/"÷" pour diviser — normalisés ici vers les
    // symboles canoniques '*'/'/' utilisés par le tokenizer ci-dessous.
    nettoye = nettoye.replace(/[×xX]/g, '*').replace(/[÷:]/g, '/');
    if (nettoye === '') return NaN;
    if (!/^-?\d+(\.\d+)?([+\-*/]\d+(\.\d+)?)*$/.test(nettoye)) return NaN;
    const tokens = nettoye.match(/^-?\d+(\.\d+)?|[+\-*/]\d+(\.\d+)?/g);
    if (!tokens || !tokens.length) return NaN;
    // Passe 1 : résout × et ÷ au fil de l'eau dans le terme courant (priorité
    // sur + et −). Passe 2 (implicite, `termes.reduce`) : additionne les
    // termes ainsi obtenus, chacun déjà signé.
    let termeCourant = Number(tokens[0]);
    if (isNaN(termeCourant)) return NaN;
    const termes = [];
    for (let i = 1; i < tokens.length; i++) {
      const op = tokens[i][0];
      const val = Number(tokens[i].slice(1));
      if (op === '*') termeCourant *= val;
      else if (op === '/') { if (val === 0) return NaN; termeCourant /= val; }
      else { termes.push(termeCourant); termeCourant = (op === '-') ? -val : val; }
    }
    termes.push(termeCourant);
    return termes.reduce((somme, t) => somme + t, 0);
  }

  // Le rôle du quart en cours (shifts.role) prime sur employees.role : un
  // "renfort" ou "vacataire" peut être affecté piste ou boutique selon le
  // jour, employees.role ne suffit pas à trancher.
  async function chargerRoleDuJour() {
    const debutJourISO = `${dateISO()}T00:00:00`;
    const { data, error } = await nexusClient
      .from('shifts').select('role').eq('employee_id', employeeCourant.id)
      .gte('heure_debut', debutJourISO).order('heure_debut', { ascending: false }).limit(1).maybeSingle();
    if (error) { console.error('Rôle du jour:', error); return employeeCourant.role; }
    return (data && data.role) || employeeCourant.role;
  }

  function zonesPourRole(role) {
    if (role === 'pompiste') return ['piste'];
    if (role === 'caissier' || role === 'caissiere') return ['boutique'];
    return ['piste', 'boutique']; // manager, gerant, renfort, vacataire : zone à choisir
  }

  async function obtenirOuCreerQuart() {
    const site = employeeCourant.site_id;
    const { data: existant, error: e1 } = await nexusClient
      .from('inventaire_quarts').select('*').eq('site', site).eq('date', dateISO()).eq('quart', quartActuel).maybeSingle();
    if (e1) { console.error('Lecture quart:', e1); }
    if (existant) return existant;

    const { data: cree, error: e2 } = await nexusClient
      .from('inventaire_quarts').insert({ site, date: dateISO(), quart: quartActuel, statut: 'ouverture_en_cours', ouvert_le: new Date().toISOString() })
      .select().single();
    if (e2) { console.error('Création quart:', e2); return null; }
    return cree;
  }

  async function obtenirOuCreerQuartEmploye() {
    const { data: existant, error: e1 } = await nexusClient
      .from('inventaire_quart_employes').select('*').eq('quart_id', quartRow.id).eq('employee_id', employeeCourant.id).maybeSingle();
    if (e1) { console.error('Lecture quart-employé:', e1); }
    if (existant) return existant;

    const { data: cree, error: e2 } = await nexusClient
      .from('inventaire_quart_employes').insert({
        quart_id: quartRow.id, employee_id: employeeCourant.id, role: roleDuJour,
        heure_arrivee: new Date().toISOString(),
      }).select().single();
    if (e2) { console.error('Création quart-employé:', e2); return null; }
    return cree;
  }

  async function chargerProduitsZone(zone) {
    // Corrigé (02/08/2026, signalé par Frédéric — "mets les cigarettes
    // dans le sens que je t'ai envoyé, c'est le sens de comptage en
    // boutique") : le tri ne portait que sur `sensible`, jamais sur
    // `ordre_affichage` — à l'intérieur d'une catégorie, l'ordre des
    // produits était donc livré au hasard par Postgres plutôt que de
    // suivre le sens physique du parcours en boutique déjà enregistré en
    // base (colonne ordre_affichage, renseignée lors du seed initial).
    const { data, error } = await nexusClient
      .from('inventaire_zone_produit').select('*, inventaire_categories(nom, ordre_affichage, jours_rotation), inventaire_zones!inner(code)')
      .eq('inventaire_zones.code', zone).eq('actif', true)
      .order('sensible', { ascending: false })
      .order('ordre_affichage', { ascending: true });
    if (error) { console.error('Chargement produits:', error); return []; }
    // Inventaires tournants (04/08/2026, Paramètres Inventaire → Parcours
    // d'inventaire, demande de Frédéric) : une catégorie dont jours_rotation
    // ne contient pas le jour ISO actuel n'est simplement pas demandée
    // aujourd'hui. jours_rotation NULL = tous les jours = comportement
    // historique inchangé pour toutes les catégories non configurées.
    const jourIso = new Date().getDay() === 0 ? 7 : new Date().getDay();
    let liste = (data || []).filter(p => {
      const jours = p.inventaire_categories ? p.inventaire_categories.jours_rotation : null;
      return !jours || jours.includes(jourIso);
    });

    // Comptage matin/soir par produit (05/08/2026, Paramètres Inventaire →
    // Règles des produits, demande de Frédéric — ex. viennoiserie comptée
    // le matin seulement). quarts_comptage NULL = matin et soir = comportement
    // historique inchangé pour tout produit non configuré.
    if (liste.length && quartActuel) {
      const site = employeeCourant.site_id;
      // profil ajouté à la sélection (18/08/2026, M2) — même requête que
      // quarts_comptage, jamais une deuxième requête sur cette table
      // (Article 11) : alimente profilParProduit pour tout l'écran.
      const { data: regles, error: e2 } = await nexusClient.from('inventaire_regles_produit')
        .select('produit_id, quarts_comptage, profil').eq('site', site).in('produit_id', liste.map(p => p.id));
      if (e2) { console.error('Chargement quarts de comptage par produit:', e2); }
      else {
        const quartsParProduit = {};
        regles.forEach(r => {
          quartsParProduit[r.produit_id] = r.quarts_comptage;
          if (r.profil) profilParProduit[r.produit_id] = r.profil;
        });
        liste = liste.filter(p => {
          const quarts = quartsParProduit[p.id];
          return !quarts || quarts.includes(quartActuel);
        });
      }
    }
    return liste;
  }

  // Dernier stock connu = le dernier comptage de clôture validé pour ce
  // produit, tous quarts confondus (l'historique reste une chaîne continue
  // d'un quart au suivant, pas remise à zéro à chaque ouverture).
  async function chargerDerniersStocks(produitIds) {
    if (!produitIds.length) return {};
    const { data, error } = await nexusClient
      .from('inventaire_comptages').select('id, produit_id, quantite, compte_le')
      .in('produit_id', produitIds).eq('type_comptage', 'cloture').eq('statut', 'valide')
      .order('compte_le', { ascending: false });
    if (error) { console.error('Derniers stocks:', error); return {}; }
    const map = {};
    for (const row of (data || [])) {
      if (!(row.produit_id in map)) map[row.produit_id] = { quantite: row.quantite, comptage_id: row.id };
    }
    return map;
  }

  async function chargerModesAveugle() {
    const site = employeeCourant.site_id;
    const { data, error } = await nexusClient
      .from('inventaire_modes_controle').select('*').eq('site', site).eq('mode', 'aveugle').eq('actif', true);
    if (error) { console.error('Modes de contrôle:', error); return []; }
    return data || [];
  }

  async function chargerModeJaugeageActif() {
    const site = employeeCourant.site_id;
    const { data, error } = await nexusClient
      .from('inventaire_modes_controle').select('id').eq('site', site).eq('mode', 'jaugeage_actif').eq('actif', true).maybeSingle();
    if (error) { console.error('Chargement mode jaugeage:', error); return false; }
    return !!data;
  }

  // Recommandations de préparation (18/08/2026, M2 — cahier §4) : une par
  // produit à profil production_journaliere, uniquement au quart matin (Q1
  // est le seul moment où la question "combien préparer aujourd'hui" a un
  // sens — Q2 hérite automatiquement du reste Q1, aucun écran). Séquentiel
  // (au plus 7-8 produits réels par site) plutôt qu'un Promise.all : ce
  // chargeur peut aussi écrire une photo de recommandation (§4.3), inutile
  // de paralléliser des inserts sur un aussi petit volume.
  async function chargerRecommandationsProduction() {
    recommandationsParProduit = {};
    if (quartActuel !== 'matin') return;
    const P = typeof NexusInventaireProductionDonnees !== 'undefined' ? NexusInventaireProductionDonnees : null;
    if (!P) { console.error('NexusInventaireProductionDonnees non chargé — recommandations indisponibles.'); return; }
    const cibles = produitsZone.filter(p => profilParProduit[p.id] === 'production_journaliere');
    for (const p of cibles) {
      const r = await P.obtenirOuCalculerRecommandation(nexusClient, employeeCourant.site_id, p.id, dateISO(), quartActuel, quartRow ? quartRow.id : null);
      if (r) recommandationsParProduit[p.id] = r;
    }
  }

  // Périmètre de l'ÉCRAN D'OUVERTURE uniquement (18/08/2026, M2) : au quart
  // soir, un produit production_journaliere n'a plus rien à faire dans les
  // catégories d'ouverture — son reste Q1 est hérité automatiquement (voir
  // ecrireTransmisImmediat, mécanisme 'transmis' déjà existant), aucun écran
  // à afficher. Jamais appliqué à produitsZone lui-même : la clôture (même
  // quart ou l'autre) doit toujours pouvoir compter physiquement le reste de
  // CES MÊMES produits — voir renderCloture/validerCloture, qui lisent
  // produitsZone directement, jamais ce filtre-ci (Article 11 : une seule
  // vérité pour "quel catalogue", mais deux usages légitimement différents).
  function produitsZoneOuverturePourQuart() {
    if (quartActuel !== 'soir') return produitsZone;
    return produitsZone.filter(p => profilParProduit[p.id] !== 'production_journaliere');
  }

  // Plan de comptage tournant (17/08/2026, Sprint 2 — cahier Inventaire 2.0
  // §5.2) : NEXUS décide quoi compter aujourd'hui pour ce (site, date,
  // quart), généré une seule fois puis persisté (INV2-04 — un rechargement
  // ne change jamais la sélection). Le jaugeage carburant reste hors de ce
  // mécanisme : c'est un relevé physique différent, avec son propre
  // parcours déjà établi (chargerModeJaugeageActif ci-dessus), pas un
  // produit que NEXUS "sélectionne" pour comptage tournant.
  async function chargerEtAppliquerPlanQuart() {
    // typeof (jamais une référence nue à `window`) : ce fichier tourne aussi
    // dans des tests Node/vm sans DOM ni `window` global (voir test_inventaire_*),
    // une référence nue lèverait un ReferenceError avant même le if.
    const P = typeof NexusInventairePlanDonnees !== 'undefined' ? NexusInventairePlanDonnees : null;
    if (!P) { console.error('NexusInventairePlanDonnees non chargé — plan de comptage indisponible.'); planQuartActif = null; produitsPlanIds = new Set(); planItemIdParProduit = {}; return; }
    const site = employeeCourant.site_id;
    planQuartActif = await P.chargerOuGenererPlan(nexusClient, site, dateISO(), quartActuel, {});
    const items = (planQuartActif && planQuartActif.items) || [];
    produitsPlanIds = new Set(items.map(it => it.produit_id));
    planItemIdParProduit = {};
    items.forEach(it => { planItemIdParProduit[it.produit_id] = it.id; });
  }

  // Restreint un catalogue au périmètre choisi par NEXUS pour ce quart. Si
  // le plan n'a pas pu être chargé (échec réseau, moteur absent) on retombe
  // sur le catalogue complet plutôt que de bloquer l'inventaire — même
  // préférence que le reste de NEXUS : une donnée manquante ne doit jamais
  // empêcher l'employé de travailler, quitte à perdre le bénéfice du plan
  // pour ce passage-là.
  function restreindreAuPlanQuart(liste) {
    if (!planQuartActif) return liste;
    return liste.filter(p => produitsPlanIds.has(p.id) || (p.inventaire_categories && p.inventaire_categories.nom === JAUGEAGE_NOM));
  }

  // Exclut le jaugeage carburant du calcul de progression/complétion quand
  // il n'a pas été activé par le manager, OU qu'on n'est pas à l'ouverture
  // du quart matin (03/08/2026 — jaugeage de début uniquement) — jamais
  // bloquant pour valider un inventaire, jamais compté dans "X/Y catégories
  // terminées" en dehors de ce seul créneau. `options.excludeJaugeage`
  // force l'exclusion même le matin — utilisé par validerCloture(), où le
  // jaugeage n'est de toute façon jamais saisissable (voir renderCloture).
  function produitsRequis(liste, options) {
    const forcerExclusion = options && options.excludeJaugeage;
    if (!forcerExclusion && modeJaugeageActif && quartActuel === 'matin') return liste;
    return liste.filter(p => !p.inventaire_categories || p.inventaire_categories.nom !== JAUGEAGE_NOM);
  }

  function estMasquePourProduit(produit) {
    // Comptage aveugle par défaut (17/08/2026, Sprint 1 — cahier Inventaire
    // 2.0, INV2-01) : tout produit sélectionné par NEXUS pour le plan du
    // quart est masqué par construction, sans qu'un manager ait besoin de
    // le paramétrer explicitement via inventaire_modes_controle. Le
    // jaugeage carburant n'entre jamais dans produitsPlanIds (voir
    // chargerEtAppliquerPlanQuart) donc son parcours reste inchangé.
    if (produitsPlanIds.has(produit.id)) return true;
    const today = dateISO();
    return modesAveugle.some(m => {
      if (m.employee_id && m.employee_id !== employeeCourant.id) return false;
      if (m.categorie_id && m.categorie_id !== produit.categorie_id) return false;
      if (m.produit_id && m.produit_id !== produit.id) return false;
      if (m.date_debut && m.date_debut > today) return false;
      if (m.date_fin && m.date_fin < today) return false;
      return true;
    });
  }

  // Scission des catégories mixtes (16/08/2026, demande de Frédéric — "je
  // voudrais que le café n'apparaisse qu'après les bières, pas mélangé au
  // même écran que la phase dépôt"). Une catégorie MIXTE (des produits
  // comptage_deux_lieux et d'autres non — ex. Boissons chaudes/Bières =
  // bières en deux lieux + café/chocolat en un seul lieu) affichait jusqu'ici
  // TOUS ses produits sur un seul écran, y compris ceux qui n'ont rien à
  // faire au dépôt : l'employé devait saisir le café en même temps que les
  // bières, avant même d'avoir terminé la phase dépôt. On la scinde donc ici
  // en deux GROUPES D'AFFICHAGE distincts, jamais deux catégories réelles en
  // base (`inventaire_categories` et `categorie_id` des produits ne sont
  // jamais touchés — Article 11, la catégorie reste la vérité produit) :
  //   - un groupe "dépôt" ne contenant QUE les produits comptage_deux_lieux
  //     de la catégorie (classé en tête par ordonnerParcoursDepotBoutiqueReste,
  //     exactement comme avant) ;
  //   - un groupe "— reste" ne contenant que les autres produits, classé
  //     avec les catégories normales, après le rattrapage boutique.
  // Une catégorie homogène (100% en deux lieux, comme Huiles/Lave-glace, ou
  // 100% normale) n'est jamais scindée : comportement strictement identique
  // à avant, zéro régression. Le +0.5 sur l'ordre du groupe "reste" garantit
  // qu'il se classe toujours juste après son groupe "dépôt" (jamais avant),
  // quel que soit l'ordre_affichage respectif des produits eux-mêmes à
  // l'intérieur de la catégorie — le manager continue de tout régler via les
  // réglages déjà existants (case "Compté en deux lieux" par produit, ordre
  // des catégories, ordre_affichage), sans nouvel écran de paramétrage.
  function grouperParCategorie(produits) {
    const parCategorie = {};
    for (const p of produits) {
      const nomBase = p.inventaire_categories ? p.inventaire_categories.nom : 'Autres';
      const ordreBase = p.inventaire_categories ? p.inventaire_categories.ordre_affichage : 99;
      if (!parCategorie[nomBase]) parCategorie[nomBase] = { nomBase, ordreBase, doubles: [], simples: [] };
      (p.comptage_deux_lieux ? parCategorie[nomBase].doubles : parCategorie[nomBase].simples).push(p);
    }
    const groupes = [];
    Object.values(parCategorie).forEach(c => {
      const mixte = c.doubles.length > 0 && c.simples.length > 0;
      if (!mixte) {
        groupes.push({ nom: c.nomBase, ordre: c.ordreBase, items: [...c.doubles, ...c.simples] });
        return;
      }
      groupes.push({ nom: c.nomBase, ordre: c.ordreBase, items: c.doubles });
      groupes.push({ nom: `${c.nomBase} — reste`, ordre: c.ordreBase + 0.5, items: c.simples });
    });
    return groupes.sort((a, b) => a.ordre - b.ordre);
  }

  // Parcours dépôt → boutique → reste (15/08/2026, demande de Frédéric).
  // Une catégorie "dépôt" est une catégorie dont les produits sont comptés
  // en deux lieux (`comptage_deux_lieux` — Boissons chaudes/Bières, Huiles,
  // Lave-glace sur le site pilote) : l'employé les compte au dépôt d'abord,
  // la boutique étant rattrapée séparément (voir renderFinalisationDoubleLieu).
  // Réordonne l'ensemble des catégories pour que ces catégories "dépôt"
  // apparaissent EN PREMIER, et TOUT le reste (viennoiserie, journaux, pain,
  // CBD, cigarettes, petits articles… — les catégories "prédéfinies"
  // normales, sans dépôt) EN DERNIER — tri stable, l'ordre relatif interne
  // (ordre_affichage) de chaque groupe est conservé.
  function ordonnerParcoursDepotBoutiqueReste(groupes) {
    const depot = groupes.filter(g => g.items.some(p => p.comptage_deux_lieux));
    const reste = groupes.filter(g => !g.items.some(p => p.comptage_deux_lieux));
    return [...depot, ...reste];
  }

  // Vrai dès que toutes les catégories "dépôt" (voir ci-dessus) sont
  // terminées — `categorieEstTerminee` ne regarde que `compteDepot` pour un
  // produit en deux lieux (voir produitEstCompte), donc cette fonction ne
  // regarde bien que la phase dépôt, jamais la boutique. `false` s'il n'y a
  // aucune catégorie dépôt sur cette zone (rien à rattraper).
  function depotEntierementTermine(groupes) {
    const groupesDepot = groupes.filter(g => g.items.some(p => p.comptage_deux_lieux));
    if (!groupesDepot.length) return false;
    return groupesDepot.every(g => categorieEstTerminee(g.items));
  }

  async function demarrerAjoutMouvementRapide() {

    mouvementRapideProduits = await chargerProduitsZone(zoneActive);

    function repeuplerTypes() {

    document.getElementById('btnMrEnregistrer').addEventListener('click', async () => {

      conf.innerHTML = `<div class="mouv-item"><span>✓ ${libelle} · ${produit ? produit.designation : ''} · ${qte > 0 ? '+' : ''}${fmtNum(qte)} enregistré${resultat ? '' : ' (hors-ligne — en attente de connexion)'}</span></div>` + conf.innerHTML;
    });
  }

  // ------------------------------------------------------------
  // OUVERTURE (prise de poste)
  // ------------------------------------------------------------
  // Message pré-comptage (10/08/2026, demande de Frédéric) : "le bon moment
  // serait juste avant le premier comptage, une seule fois par inventaire"
  // — jamais une notification répétitive qu'on finit par ignorer. Gardé
  // volontairement fixe pour l'instant (le message adaptatif selon les
  // anomalies récentes est un lot séparé, à venir). Règle non négociable
  // rappelée par Frédéric : aucun chiffre financier inventé — ce texte ne
  // parle donc que de conséquence (écarts, contrôles, temps), jamais d'un
  // montant en euros que NEXUS ne peut pas démontrer.
  //
  // "Une fois par inventaire" = une fois par ligne inventaire_quart_employes
  // (l'unité de session déjà utilisée par a_valide_ouverture/a_valide_cloture
  // pour cet écran), mémorisé en localStorage (device), même convention que
  // nexus_pointage_tentative_en_cours dans NEXUS-Pointage-v1.html.
  function clePrecomptageVu() { return `nexus_inventaire_precomptage_vu_${quartEmployeRow.id}`; }
  function precomptageDejaVu() {
    try { return localStorage.getItem(clePrecomptageVu()) === '1'; } catch (e) { return false; }
  }
  function marquerPrecomptageVu() {
    try { localStorage.setItem(clePrecomptageVu(), '1'); } catch (e) {}
  }
  function demarrerOuverture() {
    if (precomptageDejaVu()) { demarrerOuvertureComptage(); return; }
    document.getElementById('content').innerHTML = `
      <div class="precomptage-card">
        <div class="precomptage-emoji">🎯</div>
        <div class="precomptage-titre">Un comptage juste fait gagner du temps à toute l'équipe.</div>
        <div class="precomptage-texte">Une erreur fausse les écarts, déclenche des contrôles inutiles et peut masquer une perte réelle.</div>
        <div class="precomptage-regle">Comptez le réel, ne recopiez jamais le stock précédent.</div>
        <button class="btn-primary" id="btnCommencerPrecomptage">✓ Je commence mon inventaire</button>
      </div>
    `;
    document.getElementById('btnCommencerPrecomptage').addEventListener('click', () => {
      marquerPrecomptageVu();

    });
  }
  async function demarrerOuvertureComptage() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement des produits…</div>';
    await chargerEtAppliquerPlanQuart();
    produitsZone = restreindreAuPlanQuart(await chargerProduitsZone(zoneActive));
    const ids = produitsZone.map(p => p.id);
    dernierStock = await chargerDerniersStocks(ids);
    // Masquage réel, pas seulement visuel (17/08/2026, Sprint 1 — point de
    // vigilance noté lors du cadrage) : les produits sélectionnés par le
    // plan du jour ne doivent JAMAIS transporter leur stock/vente transmis
    // jusqu'au navigateur de l'employé, pas uniquement être masqués à
    // l'affichage. On retire donc ces entrées de dernierStock lui-même —
    // estMasquePourProduit continue de piloter l'affichage (calcBarreHtml,
    // bouton "Identique") mais n'a plus de valeur réelle à révéler par erreur
    // pour ces produits-là.
    Object.keys(dernierStock).forEach(produitId => {
      if (produitsPlanIds.has(produitId)) delete dernierStock[produitId];
    });
    modesAveugle = await chargerModesAveugle();
    modeJaugeageActif = await chargerModeJaugeageActif();
    await chargerRecommandationsProduction();
    // Restaure un brouillon local s'il en existe un pour ce quart (02/08/2026,
    // demande de Frédéric) — reprend la saisie déjà notée plutôt que de
    // repartir de zéro après un retour arrière accidentel ou un rechargement.
    const draft = chargerDraft('ouverture');
    comptagesSaisie = (draft && draft.comptagesSaisie) ? draft.comptagesSaisie : {};
    boutiqueRattrapageIgnore = false;

    // Reprise exacte après interruption (17/08/2026, Sprint 4, INV2-16 —
    // cahier §10 "Reprise exacte après interruption client") : si le
    // brouillon indique une position en cours dans une catégorie pas
    // encore terminée, on y saute directement plutôt que de repasser par
    // la grille de choix manuel. Dégradation gracieuse : toute position
    // introuvable, périmée (catégorie déjà finie, plan changé) ou absente
    // retombe simplement sur la grille des catégories — jamais d'erreur
    // bloquante pour l'employé.
    const position = draft && draft.positionCourante;
    if (position && position.categorieNom) {
      const { groupesPourParcours } = groupesParcoursOuverture();
      const groupe = groupesPourParcours.find(g => g.nom === position.categorieNom);
      if (groupe && !categorieEstTerminee(groupe.items)) {
        compteurInterruptionsSession++; // Sprint 8, INV2-19 : reprise réelle détectée automatiquement (même mécanisme que la reprise INV2-16 ci-dessus)
        categorieActive = groupe.nom;
        carrouselModeCorrection = false;
        if (groupe.items.length > CARROUSEL_SEUIL) {
          carrouselIndex = (typeof position.carrouselIndex === 'number' && position.carrouselIndex >= 0 && position.carrouselIndex < groupe.items.length)
            ? position.carrouselIndex
            : groupe.items.findIndex(p => !produitEstCompte(p));
          if (carrouselIndex === -1) carrouselIndex = 0;
          renderCarrousel(groupe);
        } else {
          renderCategorieListe(groupe);
        }
        return;
      }
    }
    renderCategoriesOuverture();
  }

  // ------------------------------------------------------------
  // Progression (02/08/2026, demande de Frédéric) — helpers partagés par
  // l'écran catégories et l'écran carrousel.
  // ------------------------------------------------------------
  // Message d'écart d'ouverture (03/08/2026, demande de Frédéric — "ce
  // n'est pas totalement juste car il y a les ventes à prendre en compte
  // après inventaire") : le stock transmis (dernier comptage connu) et le
  // stock compté à l'ouverture peuvent légitimement différer sans qu'il y
  // ait une vraie anomalie — des ventes ont pu avoir lieu depuis le dernier
  // comptage, ou une livraison est arrivée entre-temps. On nomme donc
  // l'hypothèse la plus probable plutôt qu'un simple "écart" alarmant : un
  // manque devient "Ventes potentielles", un surplus devient "Réassort
  // potentiel" — toujours présenté comme une hypothèse, jamais un fait
  // (même discipline de langage que le reste de NEXUS). Les seuils de
  // couleur (conforme / à surveiller / à vérifier) restent inchangés, seul
  // le libellé change — un écart important reste visuellement signalé.
  function classeEcartOuverture(ecart) {
    return 'ecart-tag ' + (ecart === 0 ? 'ecart-ok' : (Math.abs(ecart) <= 2 ? 'ecart-warn' : 'ecart-bad'));
  }
  // Qualification simple de l'écart (04/08/2026, audit fonctionnel §5) : dès
  // qu'un écart est saisi, NEXUS demande "pourquoi" avec une liste courte
  // plutôt qu'un champ libre — le texte reste possible en complément
  // facultatif, jamais à la place. Stocké dans comptagesSaisie[id].motifEcart,
  // reporté sur inventaire_alertes.resolution à la validation.
  const MOTIFS_ECART = [
    { value: '', label: 'Choisir un motif…' },
    { value: 'erreur_quart_precedent', label: 'Erreur probable du quart précédent' },
    { value: 'produit_deplace', label: 'Produit déplacé ou retrouvé ailleurs' },
    { value: 'entree_non_enregistree', label: 'Entrée non enregistrée' },
    { value: 'reassort_non_enregistre', label: 'Réassort non enregistré' },
    { value: 'casse', label: 'Casse' },
    { value: 'produit_abime', label: 'Produit abîmé' },
    { value: 'perime', label: 'Produit périmé' },
    { value: 'retour_fournisseur', label: 'Retour fournisseur' },
    { value: 'retrait_interne', label: 'Retrait interne' },
    { value: 'transfert_zones', label: 'Transfert entre zones' },
    { value: 'ne_sais_pas', label: 'Je ne sais pas' },
    { value: 'autre', label: 'Autre raison' },
  ];
  function libelleMotifEcart(value) {
    const m = MOTIFS_ECART.find(x => x.value === value);
    return m ? m.label : null;
  }
  function renderSelectMotif(produitId, valeurActuelle, visible) {
    return `<select class="justif-input motif-ecart-select" data-produit-motif="${produitId}" style="${visible ? '' : 'display:none;'} -webkit-appearance:none; appearance:none;">
      ${MOTIFS_ECART.map(m => `<option value="${m.value}" ${m.value === valeurActuelle ? 'selected' : ''}>${m.label}</option>`).join('')}
    </select>`;
  }
  function texteEcartOuverture(ecart) {
    if (ecart === 0) return 'Conforme';
    if (ecart < 0) return `Ventes potentielles ${fmtNum(ecart)}`;
    return `Réassort potentiel +${fmtNum(ecart)}`;
  }

  // Déclaration rapide d'une livraison (03/08/2026, demande de Frédéric —
  // "comment il peut l'intégrer facilement et rapidement ?") : un surplus
  // détecté à l'ouverture ("Réassort potentiel +20") peut être confirmé en
  // UN geste, sans aucune saisie supplémentaire — NEXUS connaît déjà le
  // produit et la quantité. Ça pousse un vrai mouvement structuré
  // (type='livraison') dans mouvementsSaisie, exactement comme le formulaire
  // "Mouvements pendant le quart" de la clôture, pour que le manager en
  // profite dans ses rapprochements (écoulement Decenium, écoulement
  // journalier) — jamais juste une note texte qui reste invisible pour ces
  // calculs. Ré-déclarable si l'employé corrige son comptage ensuite (on
  // retire l'ancienne déclaration marquée `origineOuvertureRapide` avant
  // d'ajouter la nouvelle, jamais de doublon).
  function livraisonRapideDeclaree(produitId, quantite) {
    return mouvementsSaisie.some(m => m.produit_id === produitId && m.origineOuvertureRapide && Math.abs(m.quantite - quantite) < 0.001);
  }
  function declarerLivraisonRapide(produitId, quantite) {
    const produit = produitsZone.find(p => p.id === produitId);
    mouvementsSaisie = mouvementsSaisie.filter(m => !(m.produit_id === produitId && m.origineOuvertureRapide));
    mouvementsSaisie.push({
      produit_id: produitId, designation: produit ? produit.designation : '', type_mouvement: 'livraison',
      quantite: quantite, justification: 'Réassort déclaré directement depuis le comptage d\'ouverture.',
      origineOuvertureRapide: true,
    });
    sauvegarderDraft('ouverture');
  }
  // Bloc HTML de la pastille d'écart, réutilisé partout où elle s'affiche
  // (liste, carrousel) — inclut le bouton de déclaration rapide quand
  // pertinent (ecart > 0 uniquement : une vente potentielle ne se
  // "déclare" pas, elle est déjà tracée côté caisse/Decenium).
  function rendreContenuEcart(produitId, ecart) {
    if (ecart === 0) return 'Conforme';
    if (ecart < 0) return texteEcartOuverture(ecart);
    if (livraisonRapideDeclaree(produitId, ecart)) {
      return `${texteEcartOuverture(ecart)} <span class="livraison-declaree">✓ Livraison déclarée</span>`;
    }
    return `${texteEcartOuverture(ecart)} <button type="button" class="btn-declarer-livraison" data-produit="${produitId}" data-qte="${ecart}">Déclarer cette livraison</button>`;
  }

  function produitEstCompte(p) {
    const s = comptagesSaisie[p.id];
    if (!s) return false;
    // Comptage en deux lieux (05/08/2026, retour de Frédéric — l'employé
    // reste au dépôt jusqu'à avoir fini, puis se déplace en boutique ; il
    // ne peut pas remplir les deux cases au même instant) : la phase 1
    // (dépôt) suffit à considérer le produit "compté" pour la progression
    // de l'inventaire — la phase 2 (boutique) est rattrapée automatiquement
    // à la toute fin, voir renderFinalisationDoubleLieu.
    if (p.comptage_deux_lieux) return s.compteDepot !== undefined && s.compteDepot !== null;
    return s.compte !== undefined;
  }
  function categorieEstTerminee(items) { return items.every(produitEstCompte); }
  function categorieEstCommencee(items) { return items.some(produitEstCompte); }
  function categorieEstPrioritaire(items) { return items.some(p => p.sensible); }

  function estimationTempsTexte(nbRestants) {
