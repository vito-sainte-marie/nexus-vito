  // ------------------------------------------------------------
  // OUVERTURE (prise de poste)
  // ------------------------------------------------------------
  async function demarrerOuverture() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement des produits…</div>';
    produitsZone = await chargerProduitsZone(zoneActive);
    const ids = produitsZone.map(p => p.id);
    dernierStock = await chargerDerniersStocks(ids);
    modesAveugle = await chargerModesAveugle();
    modeJaugeageActif = await chargerModeJaugeageActif();
    // Restaure un brouillon local s'il en existe un pour ce quart (02/08/2026,
    // demande de Frédéric) — reprend la saisie déjà notée plutôt que de
    // repartir de zéro après un retour arrière accidentel ou un rechargement.
    const draft = chargerDraft('ouverture');
    comptagesSaisie = (draft && draft.comptagesSaisie) ? draft.comptagesSaisie : {};
    renderCategoriesOuverture();
  }

  // ------------------------------------------------------------
  // Progression (02/08/2026, demande de Frédéric) — helpers partagés par
  // l'écran catégories et l'écran carrousel.
  // ------------------------------------------------------------
  // Message d'écart d'ouverture (03/08/2026, demande de Frédéric — "ce
  // n'est pas totalement juste car il y a les ventes à prendre en compte
  // après inventaire") : le stock transmis (dernier comptage connu) et le
  // stock compté à l'ouverture peuvent légitimement différer sans qu'il y
  // ait une vraie anomalie — des ventes ont pu avoir lieu depuis le dernier
  // comptage, ou une livraison est arrivée entre-temps. On nomme donc
  // l'hypothèse la plus probable plutôt qu'un simple "écart" alarmant : un
  // manque devient "Ventes potentielles", un surplus devient "Réassort
  // potentiel" — toujours présenté comme une hypothèse, jamais un fait
  // (même discipline de langage que le reste de NEXUS). Les seuils de
  // couleur (conforme / à surveiller / à vérifier) restent inchangés, seul
  // le libellé change — un écart important reste visuellement signalé.
  function classeEcartOuverture(ecart) {
    return 'ecart-tag ' + (ecart === 0 ? 'ecart-ok' : (Math.abs(ecart) <= 2 ? 'ecart-warn' : 'ecart-bad'));
  }
  // Qualification simple de l'écart (04/08/2026, audit fonctionnel §5) : dès
  // qu'un écart est saisi, NEXUS demande "pourquoi" avec une liste courte
  // plutôt qu'un champ libre — le texte reste possible en complément
  // facultatif, jamais à la place. Stocké dans comptagesSaisie[id].motifEcart,
  // reporté sur inventaire_alertes.resolution à la validation.
  const MOTIFS_ECART = [
    { value: '', label: 'Choisir un motif…' },
    { value: 'erreur_quart_precedent', label: 'Erreur probable du quart précédent' },
    { value: 'produit_deplace', label: 'Produit déplacé ou retrouvé ailleurs' },
    { value: 'entree_non_enregistree', label: 'Entrée non enregistrée' },
    { value: 'reassort_non_enregistre', label: 'Réassort non enregistré' },
    { value: 'casse', label: 'Casse' },
    { value: 'produit_abime', label: 'Produit abîmé' },
    { value: 'perime', label: 'Produit périmé' },
    { value: 'retour_fournisseur', label: 'Retour fournisseur' },
    { value: 'retrait_interne', label: 'Retrait interne' },
    { value: 'transfert_zones', label: 'Transfert entre zones' },
    { value: 'ne_sais_pas', label: 'Je ne sais pas' },
    { value: 'autre', label: 'Autre raison' },
  ];
  function libelleMotifEcart(value) {
    const m = MOTIFS_ECART.find(x => x.value === value);
    return m ? m.label : null;
  }
  function renderSelectMotif(produitId, valeurActuelle, visible) {
    return `<select class="justif-input motif-ecart-select" data-produit-motif="${produitId}" style="${visible ? '' : 'display:none;'} -webkit-appearance:none; appearance:none;">
      ${MOTIFS_ECART.map(m => `<option value="${m.value}" ${m.value === valeurActuelle ? 'selected' : ''}>${m.label}</option>`).join('')}
    </select>`;
  }
  function texteEcartOuverture(ecart) {
    if (ecart === 0) return 'Conforme';
    if (ecart < 0) return `Ventes potentielles ${fmtNum(ecart)}`;
    return `Réassort potentiel +${fmtNum(ecart)}`;
  }

  // Déclaration rapide d'une livraison (03/08/2026, demande de Frédéric —
  // "comment il peut l'intégrer facilement et rapidement ?") : un surplus
  // détecté à l'ouverture ("Réassort potentiel +20") peut être confirmé en
  // UN geste, sans aucune saisie supplémentaire — NEXUS connaît déjà le
  // produit et la quantité. Ça pousse un vrai mouvement structuré
  // (type='livraison') dans mouvementsSaisie, exactement comme le formulaire
  // "Mouvements pendant le quart" de la clôture, pour que le manager en
  // profite dans ses rapprochements (écoulement Decenium, écoulement
  // journalier) — jamais juste une note texte qui reste invisible pour ces
  // calculs. Ré-déclarable si l'employé corrige son comptage ensuite (on
  // retire l'ancienne déclaration marquée `origineOuvertureRapide` avant
  // d'ajouter la nouvelle, jamais de doublon).
  function livraisonRapideDeclaree(produitId, quantite) {
    return mouvementsSaisie.some(m => m.produit_id === produitId && m.origineOuvertureRapide && Math.abs(m.quantite - quantite) < 0.001);
  }
  function declarerLivraisonRapide(produitId, quantite) {
    const produit = produitsZone.find(p => p.id === produitId);
    mouvementsSaisie = mouvementsSaisie.filter(m => !(m.produit_id === produitId && m.origineOuvertureRapide));
    mouvementsSaisie.push({
      produit_id: produitId, designation: produit ? produit.designation : '', type_mouvement: 'livraison',
      quantite: quantite, justification: 'Réassort déclaré directement depuis le comptage d\'ouverture.',
      origineOuvertureRapide: true,
    });
    sauvegarderDraft('ouverture');
  }
  // Bloc HTML de la pastille d'écart, réutilisé partout où elle s'affiche
  // (liste, carrousel) — inclut le bouton de déclaration rapide quand
  // pertinent (ecart > 0 uniquement : une vente potentielle ne se
  // "déclare" pas, elle est déjà tracée côté caisse/Decenium).
  function rendreContenuEcart(produitId, ecart) {
    if (ecart === 0) return 'Conforme';
    if (ecart < 0) return texteEcartOuverture(ecart);
    if (livraisonRapideDeclaree(produitId, ecart)) {
      return `${texteEcartOuverture(ecart)} <span class="livraison-declaree">✓ Livraison déclarée</span>`;
    }
    return `${texteEcartOuverture(ecart)} <button type="button" class="btn-declarer-livraison" data-produit="${produitId}" data-qte="${ecart}">Déclarer cette livraison</button>`;
  }

  function produitEstCompte(p) {
    const s = comptagesSaisie[p.id];
    if (!s) return false;
    // Comptage en deux lieux (05/08/2026, retour de Frédéric — l'employé
    // reste au dépôt jusqu'à avoir fini, puis se déplace en boutique ; il
    // ne peut pas remplir les deux cases au même instant) : la phase 1
    // (dépôt) suffit à considérer le produit "compté" pour la progression
    // de l'inventaire — la phase 2 (boutique) est rattrapée automatiquement
    // à la toute fin, voir renderFinalisationDoubleLieu.
    if (p.comptage_deux_lieux) return s.compteDepot !== undefined && s.compteDepot !== null;
    return s.compte !== undefined;
  }
  function categorieEstTerminee(items) { return items.every(produitEstCompte); }
  function categorieEstCommencee(items) { return items.some(produitEstCompte); }
  function categorieEstPrioritaire(items) { return items.some(p => p.sensible); }

  function estimationTempsTexte(nbRestants) {
    if (nbRestants <= 0) return null;
    const minutes = Math.round((nbRestants * SECONDES_PAR_PRODUIT) / 60);
    if (minutes < 1) return "Moins d'une minute restante";
    return `Environ ${minutes} minute${minutes > 1 ? 's' : ''} restante${minutes > 1 ? 's' : ''}`;
  }

  // Feedback immédiat après validation d'un produit (02/08/2026, demande de
  // Frédéric — "Pain Choco validé — 10 produits restants") : un simple toast
  // discret, pas de gamification excessive. Le compteur de "restants" est
  // local à la catégorie en cours, cohérent avec le compteur de progression.
  let toastValidationTimer = null;
  function afficherFeedbackValidation(nomProduit, restants) {
    let toast = document.getElementById('toastValidation');
    if (toast) toast.remove();
    if (toastValidationTimer) clearTimeout(toastValidationTimer);
    toast = document.createElement('div');
    toast.id = 'toastValidation';
    toast.className = 'toast-validation';
    const suite = restants > 0
      ? `${restants} produit${restants > 1 ? 's' : ''} restant${restants > 1 ? 's' : ''}`
      : 'catégorie terminée';
    toast.innerHTML = `<span class="toast-check">✓</span><span>${nomProduit} validé — ${suite}</span>`;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('toast-visible'));
    toastValidationTimer = setTimeout(() => {
      toast.classList.remove('toast-visible');
      setTimeout(() => toast.remove(), 200);
    }, 900);
  }

  // Affichage visible du quart (02/08/2026, demande de Frédéric — "le
  // quart actif est par défaut en fonction de l'horodateur mais permet à
  // l'employé ou au manager de cliquer pour choisir son quart") : le quart
  // détecté automatiquement (quartDuMoment()) reste la valeur par défaut,
  // mais cliquer sur Matin/Soir permet de la corriger manuellement — utile
  // par exemple pour un vacataire qui termine un quart matin après l'heure
  // de bascule. Utilisé sur l'accueil, l'écran catégories et la clôture.
  function renderQuartVisuel() {
    return `
      <div class="quart-visuel">
        <div class="quart-visuel-item ${quartActuel === 'matin' ? 'actif' : ''}" data-quart="matin">☀️ Matin</div>
        <div class="quart-visuel-item ${quartActuel === 'soir' ? 'actif' : ''}" data-quart="soir">🌙 Soir</div>
      </div>
    `;
  }
  function wireQuartVisuel() {
    document.querySelectorAll('.quart-visuel-item').forEach(el => {
      el.addEventListener('click', () => changerQuart(el.dataset.quart));
    });
  }

  // Changement manuel de quart : abandonne toute saisie non enregistrée en
  // cours (avec confirmation), recharge/crée le quart+quart-employé
  // correspondant, et revient à l'accueil (ou au choix de zone si cette
  // zone n'a pas encore été choisie pour ce quart-ci).
  async function changerQuart(nouveauQuart) {
    if (nouveauQuart === quartActuel) return;
    const enCours = Object.values(comptagesSaisie).some(s => s && s.compte !== undefined) || mouvementsSaisie.length > 0;
    if (enCours && !confirm('Changer de quart maintenant abandonnera la saisie en cours (non enregistrée). Continuer ?')) return;

    quartActuel = nouveauQuart;
    comptagesSaisie = {};
    mouvementsSaisie = [];
    document.getElementById('content').innerHTML = '<div class="loading">Changement de quart…</div>';

    quartRow = await obtenirOuCreerQuart();
    if (!quartRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger ce quart. Réessayez.</div>'; return; }
    quartEmployeRow = await obtenirOuCreerQuartEmploye();

    if (quartEmployeRow && quartEmployeRow.zone_id) {
      const codeConnu = Object.keys(zonesMap).find(code => zonesMap[code] === quartEmployeRow.zone_id);
      if (codeConnu) zoneActive = codeConnu;
    }

    if (zonesAutorisees.length > 1 && !quartEmployeRow.zone_id) {
      renderChoixZone();
    } else {
      renderAccueil();
    }
  }

  // Compteur local à la catégorie (02/08/2026, demande de Frédéric —
  // "0 produit sur 87 n'aide pas, l'utilisateur doit surtout voir qu'il n'a
  // que 11 produits à terminer dans cette étape") : à l'intérieur d'une
  // catégorie (liste ou carrousel), la progression AFFICHÉE EN AVANT porte
  // sur cette seule catégorie ; le total général reste visible mais en
  // petit, en dessous. Sans argument `groupe` (écran des catégories), le
  // comportement global d'origine est inchangé.
  function renderBarreProgression(groupe) {
    const cibleGlobale = produitsRequis(produitsZone);
    const totalGlobal = cibleGlobale.length;
    const comptesGlobal = cibleGlobale.filter(produitEstCompte).length;

    if (groupe) {
      const cibleLocale = produitsRequis(groupe.items);
      const totalLocal = cibleLocale.length;
      const comptesLocal = cibleLocale.filter(produitEstCompte).length;
      const pctLocal = totalLocal ? Math.round((comptesLocal / totalLocal) * 100) : 100;
      const tempsTexteLocal = estimationTempsTexte(totalLocal - comptesLocal);
      return `
        <div class="progression-bloc">
          <div class="progression-haut">
            <span><b>${groupe.nom}</b> — ${comptesLocal} sur ${totalLocal}</span>
            <span class="progression-temps">${tempsTexteLocal || 'Catégorie terminée ✓'}</span>
          </div>
          <div class="progression-barre"><div class="progression-remplie" style="width:${pctLocal}%"></div></div>
          <div class="progression-globale">Inventaire global : ${comptesGlobal} sur ${totalGlobal}</div>
        </div>
      `;
    }

    const pct = totalGlobal ? Math.round((comptesGlobal / totalGlobal) * 100) : 0;
    const tempsTexte = estimationTempsTexte(totalGlobal - comptesGlobal);
    return `
      <div class="progression-bloc">
        <div class="progression-haut">
          <span>${comptesGlobal} produit${comptesGlobal > 1 ? 's' : ''} sur ${totalGlobal} contrôlé${comptesGlobal > 1 ? 's' : ''}</span>
          <span class="progression-temps">${tempsTexte || 'Inventaire terminé ✓'}</span>
        </div>
        <div class="progression-barre"><div class="progression-remplie" style="width:${pct}%"></div></div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // ÉCRAN CATÉGORIES — remplace l'ancienne liste plate de tous les
  // produits d'un coup : l'employé touche une catégorie, la termine, puis
  // revient automatiquement ici (renderCategoriesOuverture()).
  // ------------------------------------------------------------
  function renderCategoriesOuverture() {
    categorieActive = null;
    document.getElementById('titre').textContent = "Inventaire d'ouverture";
    document.getElementById('sousTitre').textContent = 'Vérifiez les quantités transmises. Corrigez uniquement les différences.';

    const groupes = grouperParCategorie(produitsZone);
    // Le jaugeage ne compte comme "requis" que s'il est à la fois activé
    // par le manager ET qu'on est à l'ouverture du quart matin (voir
    // "desactive" ci-dessous, même condition) — sinon une catégorie grisée
    // resterait comptée dans "toutes les catégories terminées" sans jamais
    // pouvoir être remplie.
    const groupesRequis = groupes.filter(g => (modeJaugeageActif && quartActuel === 'matin') || g.nom !== JAUGEAGE_NOM);
    const nbCatTerminees = groupesRequis.filter(g => categorieEstTerminee(g.items)).length;
    const toutTermine = nbCatTerminees === groupesRequis.length;
    const nbRestantes = groupesRequis.length - nbCatTerminees;

    const html = groupes.map(g => {
      // Jaugeage carburant (02/08/2026, restreint le 03/08/2026, demande de
      // Frédéric — "les pompistes puissent mettre le jaugeage de début
      // uniquement le matin quart 1") : grisé et non cliquable tant que le
      // manager ne l'a pas activé OU si on n'est pas à l'ouverture du quart
      // matin — le jaugeage de début n'a de sens qu'une fois par jour, à la
      // prise de poste du matin. Jamais compté dans la progression ni requis
      // pour valider l'inventaire.
      const desactive = g.nom === JAUGEAGE_NOM && (!modeJaugeageActif || quartActuel !== 'matin');
      if (desactive) {
        const raison = (g.nom === JAUGEAGE_NOM && modeJaugeageActif && quartActuel !== 'matin')
          ? 'non requis ce quart · jaugeage de début uniquement le matin'
          : 'non requis pour ce quart';
        return `
          <div class="categorie-row desactive" data-cat="${g.nom}">
            <div>
              <div class="categorie-nom">${g.nom}</div>
              <div class="categorie-count">${g.items.length} produit${g.items.length > 1 ? 's' : ''} · ${raison}</div>
            </div>
            <div class="categorie-etat desactivee">Désactivé</div>
          </div>
        `;
      }
      const termine = categorieEstTerminee(g.items);
      const commence = categorieEstCommencee(g.items);
      const prioritaire = categorieEstPrioritaire(g.items) && !termine;
      let etatTexte = 'À faire', etatClasse = 'a-faire';
      if (termine) { etatTexte = '✓ Terminé'; etatClasse = 'termine'; }
      else if (commence) { etatTexte = 'En cours'; etatClasse = 'en-cours'; }
      else if (prioritaire) { etatTexte = 'Prioritaire'; etatClasse = 'prioritaire'; }
      return `
        <div class="categorie-row" data-cat="${g.nom}">
          <div>
            <div class="categorie-nom">${g.nom}</div>
            <div class="categorie-count">${g.items.length} produit${g.items.length > 1 ? 's' : ''}</div>
          </div>
          <div class="categorie-etat ${etatClasse}">${etatTexte}</div>
        </div>
      `;
    }).join('');

    document.getElementById('content').innerHTML = `
      ${renderQuartVisuel()}
      ${renderBarreProgression()}
      <div class="cats-titre">${nbCatTerminees}/${groupesRequis.length} catégories terminées</div>
      <div class="card">${html}</div>
      <button class="btn-primary" id="btnTerminerOuverture" ${!toutTermine ? 'disabled' : ''}>
        ${toutTermine ? "Valider mon inventaire d'ouverture" : `Terminez toutes les catégories (${nbRestantes} restante${nbRestantes > 1 ? 's' : ''})`}
      </button>
      <button class="btn-text" id="btnAnnulerOuverture">← Retour</button>
    `;

    wireQuartVisuel();
    document.querySelectorAll('.categorie-row:not(.desactive)').forEach(el => {
      el.addEventListener('click', () => ouvrirCategorie(groupes.find(g => g.nom === el.dataset.cat)));
    });
    document.getElementById('btnTerminerOuverture').addEventListener('click', () => {
      // Comptage en deux lieux (05/08/2026) : avant de valider, on
      // vérifie s'il reste des produits dont seul le dépôt a été saisi —
      // l'employé est censé être passé en boutique entre-temps, on lui
      // demande donc de finir ceux-là avant de clôturer l'ouverture.
      if (produitsDoubleLieuEnAttenteBoutique().length) { renderFinalisationDoubleLieu('ouverture'); return; }
      validerOuverture();
    });
    document.getElementById('btnAnnulerOuverture').addEventListener('click', renderAccueil);
  }

  function ouvrirCategorie(groupe) {
    categorieActive = groupe.nom;
    carrouselModeCorrection = false;
    if (groupe.items.length > CARROUSEL_SEUIL) {
      carrouselIndex = groupe.items.findIndex(p => !produitEstCompte(p));
      if (carrouselIndex === -1) carrouselIndex = 0; // déjà terminée : on repasse en revue depuis le début
      renderCarrousel(groupe);
    } else {
      renderCategorieListe(groupe);
    }
  }

  // ------------------------------------------------------------
  // MODE LISTE — catégories courtes (≤ ${CARROUSEL_SEUIL} produits, ex :
  // Gaz). Renommé "Valider cette catégorie conforme" (demande de Frédéric :
  // "Tout conforme" encourageait une validation trop rapide) avec une
  // confirmation explicite avant d'appliquer le stock transmis partout.
  // ------------------------------------------------------------
  // Avance le focus au produit suivant de la même catégorie — utilisé
  // après "Identique" ou la touche Entrée (voir renderCategorieListe).
  function focusProchainProduit(produitId, groupe) {
    const idx = groupe.items.findIndex(p => p.id === produitId);
    if (idx === -1) return;
    // Feedback immédiat (02/08/2026, demande de Frédéric — "Pain Choco
    // validé — 10 produits restants") : uniquement si le produit est
    // effectivement compté à cet instant — une touche Entrée sur une case
    // vide ne doit pas afficher de fausse confirmation.
    if (produitEstCompte(groupe.items[idx])) {
      const cible = produitsRequis(groupe.items);
      const restants = cible.filter(pr => !produitEstCompte(pr)).length;
      afficherFeedbackValidation(groupe.items[idx].designation, restants);
    }
    if (idx === groupe.items.length - 1) return; // dernier produit : rien à enchaîner
    const suivant = groupe.items[idx + 1];
    const inputSuivant = document.querySelector(`.produit-input[data-produit="${suivant.id}"]`);
    if (inputSuivant) { inputSuivant.focus(); inputSuivant.select(); }
  }

  function renderCategorieListe(groupe) {
    document.getElementById('titre').textContent = groupe.nom;
    document.getElementById('sousTitre').textContent = 'Le stock transmis est celui laissé par le quart précédent — comptez le vôtre, corrigez si besoin.';

    document.getElementById('content').innerHTML = `
      ${renderBarreProgression(groupe)}
      <div class="card">
        ${groupe.items.map(p => renderLigneOuverture(p)).join('')}
      </div>
      <button class="btn-primary" id="btnCategorieConforme">Valider cette catégorie conforme</button>
      <button class="btn-text" id="btnRetourCategories">← Retour aux catégories</button>
    `;

    document.querySelectorAll('.produit-input').forEach(el => {
      el.addEventListener('input', () => majLigneCategorie(el.dataset.produit));
      // Entrée = passer au produit suivant (02/08/2026, demande de Frédéric
      // — "insère tout de suite le curseur dans votre comptage pour aller
      // plus vite"). Volontairement pas sur chaque frappe (input) : tant
      // qu'on tape un nombre à plusieurs chiffres, un saut prématuré serait
      // pire qu'utile — seule une action explicite (Entrée, ou Identique
      // ci-dessous) déclenche l'avancée.
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); focusProchainProduit(el.dataset.produit, groupe); }
      });
    });
    document.querySelectorAll('.btn-identique').forEach(el => {
      el.addEventListener('click', () => {
        const input = document.querySelector(`.produit-input[data-produit="${el.dataset.produit}"]`);
        const transmis = dernierStock[el.dataset.produit];
        input.value = transmis ? transmis.quantite : 0;
        majLigneCategorie(el.dataset.produit);
        focusProchainProduit(el.dataset.produit, groupe);
      });
    });
    document.querySelectorAll('[data-produit-motif]').forEach(el => {
      el.addEventListener('change', () => {
        const id = el.dataset.produitMotif;
        if (comptagesSaisie[id]) comptagesSaisie[id].motifEcart = el.value;
        sauvegarderDraft('ouverture');
      });
    });
    document.getElementById('btnCategorieConforme').addEventListener('click', () => {
      // Comptage en deux lieux (05/08/2026) : ces produits doivent toujours
      // être physiquement comptés au dépôt ET en boutique — jamais présumés
      // "identiques" en un clic comme les autres, même via ce raccourci.
      const simples = groupe.items.filter(p => !p.comptage_deux_lieux);
      const doubles = groupe.items.filter(p => p.comptage_deux_lieux);
      if (!simples.length) { alert('Les produits de cette catégorie sont comptés en deux lieux (dépôt + boutique) — saisissez-les individuellement ci-dessus.'); return; }
      const message = doubles.length
        ? `Vous confirmez avoir compté les ${simples.length} produit${simples.length > 1 ? 's' : ''} restants de cette catégorie ? (${doubles.length} produit${doubles.length > 1 ? 's' : ''} compté${doubles.length > 1 ? 's' : ''} en deux lieux à saisir individuellement ci-dessus)`
        : `Vous confirmez avoir compté les ${simples.length} produit${simples.length > 1 ? 's' : ''} de cette catégorie ?`;
      if (!confirm(message)) return;
      simples.forEach(p => {
        const transmis = dernierStock[p.id];
        comptagesSaisie[p.id] = { compte: transmis ? transmis.quantite : 0, ecartNonNul: false, justification: '' };
      });
      sauvegarderDraft('ouverture');
      renderCategoriesOuverture();
    });
    document.getElementById('btnRetourCategories').addEventListener('click', renderCategoriesOuverture);
  }

  // Corrigé (02/08/2026, signalé par Frédéric — "je dois ressaisir pour
  // mettre deux chiffres" sur Gaz) : cette fonction reconstruisait AVANT
  // tout le HTML de la catégorie à chaque frappe dès qu'un écart
  // apparaissait (pour révéler le champ justification) — ça faisait
  // perdre le focus et la position du curseur au beau milieu de la saisie
  // d'un nombre à plusieurs chiffres, obligeant à retaper. Le champ
  // justification existe maintenant en permanence dans le DOM (comme
  // justifCarrousel côté carrousel) : on se contente de l'afficher ou le
  // masquer, sans jamais reconstruire la ligne.
  function majLigneCategorie(produitId) {
    const input = document.querySelector(`.produit-input[data-produit="${produitId}"]`);
    const val = input.value === '' ? null : parseFloat(input.value);
    const p = produitsZone.find(x => x.id === produitId);

    // Comptage en deux lieux (05/08/2026) : phase "Dépôt" uniquement ici —
    // pas d'écart tant que le total (dépôt + boutique) n'est pas connu, la
    // boutique étant rattrapée à la fin de l'inventaire. Cette ligne n'a ni
    // pastille d'écart ni champ justification (voir renderLigneOuverture).
    if (p && p.comptage_deux_lieux) {
      comptagesSaisie[produitId] = (val === null || isNaN(val)) ? undefined : { compteDepot: val };
      sauvegarderDraft('ouverture');
      return;
    }

    const transmis = dernierStock[produitId] ? dernierStock[produitId].quantite : 0;
    const ecartDiv = document.getElementById(`ecart-${produitId}`);
    const justifInput = document.querySelector(`.justif-input[data-produit="${produitId}"]`);
    const motifSelect = document.querySelector(`[data-produit-motif="${produitId}"]`);
    if (val === null || isNaN(val)) {
      ecartDiv.className = 'ecart-tag'; ecartDiv.textContent = '';
      if (justifInput) justifInput.style.display = 'none';
      if (motifSelect) motifSelect.style.display = 'none';
      comptagesSaisie[produitId] = undefined;
      sauvegarderDraft('ouverture');
      return;
    }
    const ecart = val - transmis;
    const ecartNonNul = Math.abs(ecart) > 0.001;
    ecartDiv.className = classeEcartOuverture(ecart);
    ecartDiv.innerHTML = rendreContenuEcart(produitId, ecart);
    if (justifInput) justifInput.style.display = ecartNonNul ? '' : 'none';
    if (motifSelect) motifSelect.style.display = ecartNonNul ? '' : 'none';
    comptagesSaisie[produitId] = {
      compte: val, ecartNonNul,
      justification: justifInput ? justifInput.value : (comptagesSaisie[produitId] ? comptagesSaisie[produitId].justification : ''),
      motifEcart: motifSelect ? motifSelect.value : (comptagesSaisie[produitId] ? comptagesSaisie[produitId].motifEcart : ''),
    };
    sauvegarderDraft('ouverture');
  }

  // ------------------------------------------------------------
  // MODE CARROUSEL — catégories longues (> ${CARROUSEL_SEUIL} produits,
  // ex : Cigarettes). Un seul produit à la fois : la valeur transmise est
  // affichée en grisé, "✓ Identique" valide en un geste, "Corriger" ouvre
  // la saisie pré-remplie avec cette même valeur — l'employé ne saisit
  // donc que les différences.
  // ------------------------------------------------------------
  function renderCarrousel(groupe) {
    const items = groupe.items;
    const p = items[carrouselIndex];
    document.getElementById('titre').textContent = groupe.nom;
    document.getElementById('sousTitre').textContent = '';

    const transmis = dernierStock[p.id];
    const masque = estMasquePourProduit(p);
    const valeurTransmise = transmis ? transmis.quantite : 0;
    const pasDHistorique = transmis === undefined;
    // Retour au produit précédent (02/08/2026, demande de Frédéric —
    // "permet de revenir à l'article précédent si l'employé fait une
    // erreur de saisie") : si ce produit a déjà une valeur enregistrée
    // (parce qu'on y revient après l'avoir déjà validé) ET que cette
    // valeur diffère du transmis, on affiche directement la saisie déjà
    // faite plutôt que les boutons Conforme/Corriger — pour la corriger
    // sur place sans devoir re-choisir "Corriger" à l'aveugle.
    const dejaSaisi = comptagesSaisie[p.id];
    const dejaCorrige = !!(dejaSaisi && dejaSaisi.compte !== undefined && Math.abs(dejaSaisi.compte - valeurTransmise) > 0.001);
    // Comptage en deux lieux (05/08/2026) : jamais de raccourci "✓
    // Identique" — le transmis est un total unique, on ne sait pas quelle
    // part revenait au dépôt et quelle part à la boutique. L'employé passe
    // toujours par la saisie manuelle des deux cases.
    const afficherChoixRapide = !masque && !pasDHistorique && !carrouselModeCorrection && !dejaCorrige && !p.comptage_deux_lieux;
    const valeurDepart = (dejaSaisi && dejaSaisi.compte !== undefined) ? dejaSaisi.compte : (masque || pasDHistorique ? '' : valeurTransmise);

    document.getElementById('content').innerHTML = `
      ${renderBarreProgression(groupe)}
      <div class="carrousel-card">
        <div class="carrousel-nom">${p.designation}${p.sensible ? '<span class="badge-sensible" style="margin-left:8px;">Sensible</span>' : ''}</div>
        ${masque
          ? `<div class="carrousel-transmis">Comptage à l'aveugle — saisissez votre chiffre</div>`
          : (pasDHistorique
              ? `<div class="carrousel-transmis">Premier comptage — pas d'historique</div>`
              : `<div class="carrousel-transmis">Stock transmis par le quart précédent</div>
                 <div class="carrousel-valeur">${fmtNum(valeurTransmise)} <span class="carrousel-unite">${p.unite}</span></div>`)
        }
        ${afficherChoixRapide ? `
          <div class="carrousel-actions">
            <button class="btn-primary" id="btnConforme">✓ Identique — valider</button>
            <button class="btn-ghost" id="btnCorriger">Corriger</button>
          </div>
        ` : p.comptage_deux_lieux ? `
          <div class="badge-double-lieu">📍 Dépôt — boutique demandée en fin d'inventaire</div>
          <input type="number" inputmode="decimal" step="0.01" class="produit-input carrousel-input" id="carrouselInput"
                 placeholder="Comptage dépôt" value="${dejaSaisi && dejaSaisi.compteDepot !== undefined && dejaSaisi.compteDepot !== null ? dejaSaisi.compteDepot : ''}" onfocus="this.select()">
          <button class="btn-primary" id="btnValiderProduit">Valider ce produit</button>
        ` : `
          <input type="number" inputmode="decimal" step="0.01" class="produit-input carrousel-input" id="carrouselInput"
                 placeholder="Votre comptage" value="${valeurDepart}" onfocus="this.select()">
          <div class="ecart-tag" id="ecartCarrousel"></div>
          ${renderSelectMotif('Carrousel', dejaSaisi && dejaSaisi.motifEcart ? dejaSaisi.motifEcart : '', dejaSaisi && dejaSaisi.ecartNonNul).replace('data-produit-motif="Carrousel"', 'id="motifCarrousel"')}
          <input type="text" class="justif-input" id="justifCarrousel" placeholder="Commentaire (facultatif)" value="${dejaSaisi && dejaSaisi.justification ? dejaSaisi.justification : ''}" style="${dejaSaisi && dejaSaisi.ecartNonNul ? '' : 'display:none;'}">
          <button class="btn-primary" id="btnValiderProduit">Valider ce produit</button>
          ${!masque && !pasDHistorique ? `<button class="btn-text" id="btnAnnulerCorrection">← Revenir à « Identique »</button>` : ''}
        `}
      </div>
      <div class="carrousel-footer">Produit ${carrouselIndex + 1} sur ${items.length}</div>
      ${carrouselIndex > 0 ? `<button class="btn-text" id="btnProduitPrecedent">← Revenir au produit précédent</button>` : ''}
      <button class="btn-text" id="btnRetourCategoriesCarrousel">← Retour aux catégories</button>
    `;

    const btnConforme = document.getElementById('btnConforme');
    if (btnConforme) btnConforme.addEventListener('click', () => {
      comptagesSaisie[p.id] = { compte: valeurTransmise, ecartNonNul: false, justification: '' };
      sauvegarderDraft('ouverture');
      avancerCarrousel(groupe, p.designation);
    });
    const btnCorriger = document.getElementById('btnCorriger');
    if (btnCorriger) btnCorriger.addEventListener('click', () => {
      carrouselModeCorrection = true;
      renderCarrousel(groupe);
    });
    const carrouselInput = document.getElementById('carrouselInput');
    if (carrouselInput) {
      carrouselInput.addEventListener('input', () => majCarrousel(valeurTransmise, p.id));
      // Curseur posé tout de suite (02/08/2026, demande de Frédéric —
      // "insère tout de suite le curseur dans votre comptage pour aller
      // plus vite") : dès que la saisie manuelle est affichée (aveugle,
      // premier comptage, ou après "Corriger"), le focus y est déjà —
      // plus besoin de taper la case au préalable. Entrée valide direct.
      carrouselInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); const btn = document.getElementById('btnValiderProduit'); if (btn) btn.click(); }
      });
      // Focus synchrone, sans setTimeout (05/08/2026, retour de Frédéric —
      // "Corriger" ne faisait qu'apparaître le chiffre en surligné, sans
      // ouvrir le clavier numérique) : sur mobile (surtout iOS Safari), le
      // clavier ne s'ouvre automatiquement que si .focus() est appelé de
      // façon synchrone, dans le même geste utilisateur que le tapotement
      // sur le bouton — un setTimeout, même à 0ms, casse cette chaîne et le
      // navigateur se contente de sélectionner le texte sans afficher le
      // clavier.
      carrouselInput.focus();
      carrouselInput.select();
      // Affiche tout de suite l'écart si une valeur était déjà enregistrée
      // (retour sur un produit déjà répondu) — sinon la pastille resterait
      // vide tant qu'on n'a pas retapé quelque chose.
      if (carrouselInput.value !== '') majCarrousel(valeurTransmise, p.id);
    }
    const btnValiderProduit = document.getElementById('btnValiderProduit');
    if (btnValiderProduit) btnValiderProduit.addEventListener('click', () => {
      // Comptage en deux lieux (05/08/2026, retour de Frédéric — l'employé
      // reste au dépôt jusqu'à avoir fini) : on n'enregistre ici que la
      // phase "Dépôt" ; la boutique est rattrapée à la toute fin de
      // l'inventaire (voir renderFinalisationDoubleLieu). Pas de calcul
      // d'écart tant que le total réel n'est pas connu.
      if (p.comptage_deux_lieux) {
        const input = document.getElementById('carrouselInput');
        let vDepot = input.value === '' ? null : parseFloat(input.value);
        if (vDepot === null || isNaN(vDepot)) {
          if (!confirm(`Aucun chiffre saisi pour le dépôt sur ${p.designation} — on enregistre 0. Confirmer ?`)) return;
          vDepot = 0;
        }
        comptagesSaisie[p.id] = { compteDepot: vDepot };
        sauvegarderDraft('ouverture');
        avancerCarrousel(groupe, p.designation);
        return;
      }
      const input = document.getElementById('carrouselInput');
      let val = input.value === '' ? null : parseFloat(input.value);
      // Corrigé (02/08/2026, demande de Frédéric — "si je valide sans
      // mettre de chiffre, considère que c'est zéro mais envoie un message
      // d'alerte pour m'avertir que c'est correct") : on ne bloque plus la
      // validation d'une case vide, on demande confirmation avant de
      // l'enregistrer à 0 — annuler la confirmation laisse la case ouverte
      // pour corriger une saisie oubliée par erreur.
      if (val === null || isNaN(val)) {
        if (!confirm(`Aucun chiffre saisi pour ${p.designation} — on enregistre 0. Confirmer ?`)) return;
        val = 0;
      }
      const ecart = val - valeurTransmise;
      const ecartNonNul = Math.abs(ecart) > 0.001;
      const justifInput = document.getElementById('justifCarrousel');
      const motifSelect = document.getElementById('motifCarrousel');
      comptagesSaisie[p.id] = { compte: val, ecartNonNul, justification: justifInput ? justifInput.value : '', motifEcart: motifSelect ? motifSelect.value : '' };
      sauvegarderDraft('ouverture');
      avancerCarrousel(groupe, p.designation);
    });
    const btnAnnulerCorrection = document.getElementById('btnAnnulerCorrection');
    if (btnAnnulerCorrection) btnAnnulerCorrection.addEventListener('click', () => {
      // Remet aussi la valeur enregistrée à l'identique du transmis (pas
      // seulement l'affichage) — sinon, en revenant sur un produit déjà
      // corrigé, ce bouton n'aurait visuellement aucun effet.
      comptagesSaisie[p.id] = { compte: valeurTransmise, ecartNonNul: false, justification: '' };
      sauvegarderDraft('ouverture');
      carrouselModeCorrection = false;
      renderCarrousel(groupe);
    });
    const btnProduitPrecedent = document.getElementById('btnProduitPrecedent');
    if (btnProduitPrecedent) btnProduitPrecedent.addEventListener('click', () => reculerCarrousel(groupe));
    document.getElementById('btnRetourCategoriesCarrousel').addEventListener('click', renderCategoriesOuverture);
  }

  function majCarrousel(valeurTransmise, produitId) {
    const input = document.getElementById('carrouselInput');
    const ecartDiv = document.getElementById('ecartCarrousel');
    const justifInput = document.getElementById('justifCarrousel');
    const motifSelect = document.getElementById('motifCarrousel');
    if (!input || !ecartDiv) return;
    const val = input.value === '' ? null : parseFloat(input.value);
    if (val === null || isNaN(val)) { ecartDiv.textContent = ''; if (justifInput) justifInput.style.display = 'none'; if (motifSelect) motifSelect.style.display = 'none'; return; }
    const ecart = val - valeurTransmise;
    const ecartNonNul = Math.abs(ecart) > 0.001;
    ecartDiv.className = classeEcartOuverture(ecart);
    ecartDiv.innerHTML = rendreContenuEcart(produitId, ecart);
    if (justifInput) justifInput.style.display = ecartNonNul ? '' : 'none';
    if (motifSelect) motifSelect.style.display = ecartNonNul ? '' : 'none';
  }

  // Équivalent de majCarrousel pour un produit compté en deux lieux
  // (05/08/2026) : le total (et donc l'écart) ne s'affiche que lorsque
  // Dépôt ET Boutique sont tous les deux remplis — jamais un total à
  // moitié inventé avec un champ vide traité comme zéro.
  function avancerCarrousel(groupe, nomValide) {
    carrouselModeCorrection = false;
    if (nomValide) {
      const cible = produitsRequis(groupe.items);
      const restants = cible.filter(pr => !produitEstCompte(pr)).length;
      afficherFeedbackValidation(nomValide, restants);
    }
    // Petit délai (02/08/2026, demande de Frédéric — "Puis passage
    // automatique au suivant") pour laisser le toast de confirmation
    // visible un instant avant l'écran suivant — sans nomValide (retour
    // "Corriger" par ex.), l'avancée reste instantanée.
    setTimeout(() => {
      if (carrouselIndex < groupe.items.length - 1) {
        carrouselIndex++;
        renderCarrousel(groupe);
      } else {
        renderCategoriesOuverture();
      }
    }, nomValide ? 500 : 0);
  }

  // Retour au produit précédent (02/08/2026, demande de Frédéric — "permet
  // de revenir à l'article précédent si l'employé fait une erreur de
  // saisie"). Le produit précédent réaffiche alors sa valeur déjà
  // enregistrée, prête à corriger (voir dejaSaisi dans renderCarrousel()).
  function reculerCarrousel(groupe) {
    if (carrouselIndex <= 0) return;
    carrouselIndex--;
    carrouselModeCorrection = false;
    renderCarrousel(groupe);
  }

  function renderLigneOuverture(p) {
    const transmis = dernierStock[p.id];
    const masque = estMasquePourProduit(p);
    const saisie = comptagesSaisie[p.id];
    const transmisTexte = transmis === undefined ? 'Premier comptage — pas d\'historique' : (masque ? 'masqué (mode à l\'aveugle)' : `Transmis : ${fmtNum(transmis ? transmis.quantite : 0)} ${p.unite}`);
    // Corrigé (02/08/2026, signalé par Frédéric — "le chiffre disparaît, je
    // dois le retaper") : quand un écart apparaît, majLigneCategorie()
    // ré-affiche cette ligne pour révéler le champ justification, mais
    // l'input ne restaurait jamais la valeur déjà saisie (ni l'écart déjà
    // calculé) — d'où la fausse impression que la saisie s'était effacée.
    let ecartClasse = 'ecart-tag', ecartTexte = '';
    if (saisie && saisie.compte !== undefined) {
      const valeurTransmise = transmis ? transmis.quantite : 0;
      const ecart = saisie.compte - valeurTransmise;
      ecartClasse = classeEcartOuverture(ecart);
      ecartTexte = rendreContenuEcart(p.id, ecart);
    }
    // Comptage en deux lieux (05/08/2026, retour de Frédéric — l'employé
    // reste au dépôt jusqu'à avoir fini, il ne peut pas remplir Dépôt et
    // Boutique au même instant) : une seule case ici, toujours "Dépôt" —
    // la boutique est rattrapée automatiquement à la toute fin de
    // l'inventaire (voir renderFinalisationDoubleLieu). Pas d'écart ni de
    // bouton "Identique" tant que le total réel n'est pas connu.
    const valeurAffichee = p.comptage_deux_lieux
      ? (saisie && saisie.compteDepot !== undefined && saisie.compteDepot !== null ? saisie.compteDepot : '')
      : (saisie && saisie.compte !== undefined ? saisie.compte : '');
    return `
      <div class="produit-row" id="ligne-${p.id}">
        <div class="produit-nom-ligne">
          <span class="produit-nom">${p.designation}</span>
          ${p.sensible ? '<span class="badge-sensible">Sensible</span>' : ''}
          ${p.comptage_deux_lieux ? '<span class="badge-double-lieu">📍 Dépôt — boutique en fin d\'inventaire</span>' : ''}
        </div>
        <div class="produit-transmis">${transmisTexte}</div>
        <div class="produit-controls" style="margin-top:8px;">
          <input type="number" inputmode="decimal" step="0.01" class="produit-input" data-produit="${p.id}"
                 placeholder="${p.comptage_deux_lieux ? 'Comptage dépôt' : 'Votre comptage'}" value="${valeurAffichee}" onfocus="this.select()">
          ${p.comptage_deux_lieux ? '' : `<button class="btn-identique" data-produit="${p.id}" ${masque ? 'disabled' : ''}>Identique</button>`}
        </div>
        ${p.comptage_deux_lieux ? '' : `
        <div class="${ecartClasse}" id="ecart-${p.id}">${ecartTexte}</div>
        ${renderSelectMotif(p.id, saisie && saisie.motifEcart ? saisie.motifEcart : '', saisie && saisie.ecartNonNul)}
        <input type="text" class="justif-input" data-produit="${p.id}" placeholder="Commentaire (facultatif)" value="${saisie && saisie.justification ? saisie.justification : ''}" style="${saisie && saisie.ecartNonNul ? '' : 'display:none;'}">`}
      </div>
    `;
  }

  async function validerOuverture() {
    // Confirmation systématique avant validation (02/08/2026, demande de
    // Frédéric) — quel que soit le compte connecté, l'action est
    // irréversible une fois enregistrée en base.
    if (!confirm('Êtes-vous sûr de valider cet inventaire d\'ouverture ? Cette action est irréversible.')) return;

    // capture les justifications avant de désactiver le bouton
    document.querySelectorAll('.justif-input').forEach(el => {
      if (comptagesSaisie[el.dataset.produit]) comptagesSaisie[el.dataset.produit].justification = el.value;
    });

    const btn = document.getElementById('btnTerminerOuverture');
    if (btn) { btn.disabled = true; btn.innerHTML = 'Nous traitons vos informations<span class="btn-loading-dots"><i></i><i></i><i></i></span>'; }

    // Livraisons déclarées en un geste (03/08/2026) — mêmes colonnes que le
    // formulaire "Mouvements pendant le quart" de la clôture, pour que le
    // manager les retrouve exactement pareil dans ses rapprochements
    // (écoulement Decenium, écoulement journalier Pains/Sandwichs ·
    // Viennoiserie).
    for (const m of mouvementsSaisie) {
      const { error } = await nexusClient.from('inventaire_mouvements').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: m.produit_id,
        type_mouvement: m.type_mouvement, quantite: m.quantite, employee_id: employeeCourant.id, justification: m.justification || null,
        reason_code: m.type_mouvement, zone_source_id: m.zone_source_id || null, zone_destination_id: m.zone_destination_id || null,
      });
      if (error) console.error('Mouvement (ouverture):', error);
    }
    const nbLivraisonsDeclarees = mouvementsSaisie.length;

    let nbComptes = 0, nbEcarts = 0;
    for (const p of produitsZone) {
      const saisie = comptagesSaisie[p.id];
      if (!saisie || saisie.compte === undefined) continue;
      nbComptes++;
      const transmis = dernierStock[p.id];
      const valeurTransmise = transmis ? transmis.quantite : 0;

      // Matérialise le stock transmis comme événement séparé, avec sa
      // source explicite (jamais une valeur saisie librement).
      const { data: evtTransmis, error: e1 } = await nexusClient.from('inventaire_comptages').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: p.id,
        type_comptage: 'transmis', quantite: valeurTransmise,
        comptage_source_id: transmis ? transmis.comptage_id : null, quantite_transmise: valeurTransmise,
        source: 'auto',
      }).select().single();
      if (e1) console.error('Comptage transmis:', e1);

      const { error: e2 } = await nexusClient.from('inventaire_comptages').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: p.id,
        type_comptage: 'ouverture', quantite: saisie.compte, employee_id: employeeCourant.id,
        comptage_source_id: evtTransmis ? evtTransmis.id : null, quantite_transmise: valeurTransmise,
        source: 'manuel', commentaire: saisie.justification || null,
        // Comptage en deux lieux (05/08/2026) : conservé séparément pour
        // pouvoir expliquer un écart plus tard (dépôt ou boutique ?) —
        // quantite reste le total, aucun changement de la logique d'écart.
        quantite_depot: saisie.compteDepot !== undefined ? saisie.compteDepot : null,
        quantite_boutique: saisie.compteBoutique !== undefined ? saisie.compteBoutique : null,
      });
      if (e2) console.error('Comptage ouverture:', e2);

      if (saisie.ecartNonNul) {
        nbEcarts++;
        const ecartVal = saisie.compte - valeurTransmise;
        // Une livraison déclarée en un geste sur ce produit prévaut comme
        // explication — plus fiable qu'un texte libre puisqu'elle est
        // reliée à un vrai mouvement structuré (voir mouvementsSaisie
        // ci-dessus). Sinon, on retombe sur la justification texte si elle
        // existe, sinon rien (jamais une explication inventée).
        const livraisonDeclaree = mouvementsSaisie.find(m => m.produit_id === p.id && m.origineOuvertureRapide && Math.abs(m.quantite - ecartVal) < 0.001);
        // Qualification simple choisie par l'employé (04/08/2026, audit §5) —
        // prime sur le commentaire libre quand elle est renseignée, jamais
        // les deux mélangés dans la même phrase.
        const motifLibelle = libelleMotifEcart(saisie.motifEcart);
        let resolution = null;
        if (livraisonDeclaree) {
          resolution = `Réassort de ${fmtNum(livraisonDeclaree.quantite)} déclaré comme livraison par l'employé à l'ouverture.`;
        } else if (motifLibelle && saisie.motifEcart !== 'autre' && saisie.motifEcart !== 'ne_sais_pas') {
          resolution = `Motif déclaré par l'employé : ${motifLibelle}.${saisie.justification ? ' ' + saisie.justification : ''}`;
        } else if (saisie.justification) {
          resolution = `Justifié par l'employé : ${saisie.justification}`;
        } else if (motifLibelle) {
          resolution = `Motif déclaré par l'employé : ${motifLibelle}.`;
        }
        await nexusClient.from('inventaire_alertes').insert({
          site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: p.id,
          type_alerte: 'ecart_ouverture', gravite: Math.abs(ecartVal) > 2 ? 'critique' : 'attention',
          valeur_attendue: valeurTransmise, valeur_constatee: saisie.compte,
          resolution, categorie_anomalie: 'saisie',
        });
      }
    }

    await nexusClient.from('inventaire_quart_employes').update({ a_valide_ouverture: true, heure_arrivee: quartEmployeRow.heure_arrivee || new Date().toISOString() }).eq('id', quartEmployeRow.id);
    await nexusClient.from('inventaire_quarts').update({ statut: 'ouvert' }).eq('id', quartRow.id).eq('statut', 'ouverture_en_cours');
    quartEmployeRow.a_valide_ouverture = true;
    mouvementsSaisie = [];
    effacerDraft('ouverture');

    renderFinalOuverture(nbComptes, nbEcarts, nbLivraisonsDeclarees);
  }

  function renderFinalOuverture(nbComptes, nbEcarts, nbLivraisonsDeclarees) {
    document.getElementById('titre').textContent = 'Inventaire d\'ouverture validé';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="resume-card">
        <div class="checkmark">✓</div>
        <div class="final-greet">Merci ${employeeCourant.nom}</div>
        <div class="stat-row"><span class="stat-label">Produits comptés</span><span class="stat-value">${nbComptes}</span></div>
        <div class="stat-row"><span class="stat-label">Écarts de passage de quart</span><span class="stat-value ${nbEcarts ? 'amber' : ''}">${nbEcarts}</span></div>
        ${nbLivraisonsDeclarees ? `<div class="stat-row"><span class="stat-label">Livraisons déclarées</span><span class="stat-value">${nbLivraisonsDeclarees}</span></div>` : ''}
      </div>
      <button class="btn-primary" id="btnRetourAccueil">Retour</button>
    `;
    document.getElementById('btnRetourAccueil').addEventListener('click', renderAccueil);
  }

  // ------------------------------------------------------------
  // CLÔTURE (fin de poste)
  // ------------------------------------------------------------
  // Taxonomie complète entrants/sortants (04/08/2026, audit fonctionnel de
  // Frédéric §6 — "l'employé ne doit jamais modifier directement un stock
  // initial ou final pour intégrer une opération") : remplace l'ancienne
  // liste simplifiée à 7 valeurs. `sens` détermine automatiquement le signe
  // de la quantité enregistrée (l'employé saisit toujours une quantité
  // positive, jamais un signe à deviner) — voir ajouterMouvement().
  const TYPES_MOUVEMENT = [
    { value: 'livraison', label: 'Livraison fournisseur', sens: 'entrant' },
    { value: 'reassort', label: 'Réassort depuis la réserve', sens: 'entrant' },
    { value: 'transfert_recu', label: 'Transfert reçu (autre zone)', sens: 'entrant' },
    { value: 'retour_recu', label: 'Retour d\'un produit sorti', sens: 'entrant' },
    { value: 'casse', label: 'Casse', sens: 'sortant' },
    { value: 'produit_abime', label: 'Produit abîmé', sens: 'sortant' },
    { value: 'perime', label: 'Produit périmé', sens: 'sortant' },
    { value: 'retour_fournisseur', label: 'Retour fournisseur', sens: 'sortant' },
    { value: 'transfert_sortant', label: 'Transfert vers une autre zone', sens: 'sortant' },
    { value: 'retrait_interne', label: 'Retrait interne', sens: 'sortant' },
    { value: 'consommation_interne', label: 'Consommation interne', sens: 'sortant' },
    { value: 'perte_identifiee', label: 'Perte identifiée', sens: 'sortant' },
    { value: 'destruction', label: 'Destruction', sens: 'sortant' },
    { value: 'autre', label: 'Autre', sens: 'sortant' },
  ];

  async function demarrerCloture() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!produitsZone.length) produitsZone = await chargerProduitsZone(zoneActive);
    modeJaugeageActif = await chargerModeJaugeageActif();
    // Restaure un brouillon local s'il en existe un pour ce quart (02/08/2026,
    // demande de Frédéric) — reprend mouvements + comptages déjà saisis plutôt
    // que de repartir de zéro après un retour arrière accidentel.
    const draft = chargerDraft('cloture');
    mouvementsSaisie = (draft && draft.mouvementsSaisie) ? draft.mouvementsSaisie : [];
    comptagesSaisie = (draft && draft.comptagesSaisie) ? draft.comptagesSaisie : {};
    renderCloture();
  }

  function renderCloture() {
    document.getElementById('titre').textContent = 'Clôture de mon inventaire';
    document.getElementById('sousTitre').textContent = 'Déclarez les mouvements connus, puis le stock physique final.';

    const optionsProduits = produitsZone.map(p => `<option value="${p.id}">${p.designation}</option>`).join('');

    document.getElementById('content').innerHTML = `
      ${renderQuartVisuel()}
      <div class="mouv-card">
        <div class="mouv-titre">Mouvements pendant le quart</div>
        <select class="mouv-select" id="mouvProduit" style="width:100%; margin-bottom:8px;">${optionsProduits}</select>
        <div class="mouv-row">
          <select class="mouv-select" id="mouvType">${TYPES_MOUVEMENT.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}</select>
          <input type="number" inputmode="decimal" class="mouv-qte" id="mouvQte" placeholder="Qté" onfocus="this.select()">
        </div>
        <input type="text" class="mouv-justif" id="mouvJustif" placeholder="Justification (ex : livraison Pitou Gaz du 02/08)">
        <button class="btn-ghost" id="btnAjouterMouvement" style="margin-top:0;">+ Ajouter ce mouvement</button>
        <div class="mouv-liste" id="listeMouvements"></div>
      </div>

      ${grouperParCategorie(produitsZone).map(g => {
        // Jaugeage de début (03/08/2026, demande de Frédéric) : uniquement à
        // l'ouverture du quart matin (voir renderCategoriesOuverture) —
        // jamais à la clôture, quel que soit le quart ou le toggle manager.
        const desactive = g.nom === JAUGEAGE_NOM;
        return `
        <div class="cat-block ${desactive ? 'desactive' : ''}">
          <div class="cat-head">
            <div class="cat-nom">${g.nom} (${g.items.length})</div>
            ${desactive ? '<span class="cat-desactive-tag">Jaugeage de début uniquement — le matin, à l\'ouverture</span>' : ''}
          </div>
          <div class="card">
            ${g.items.map(p => renderLigneCloture(p, desactive)).join('')}
          </div>
        </div>
      `;
      }).join('')}

      <button class="btn-primary" id="btnValiderCloture">Clôturer mon inventaire</button>
      <button class="btn-text" id="btnAnnulerCloture">← Retour</button>
    `;

    wireQuartVisuel();
    document.getElementById('btnAjouterMouvement').addEventListener('click', ajouterMouvement);
    renderListeMouvements();

    document.querySelectorAll('.produit-input').forEach(el => {
      el.addEventListener('input', () => {
        const p = produitsZone.find(x => x.id === el.dataset.produit);
        const v = el.value === '' ? null : parseFloat(el.value);
        // Comptage en deux lieux (05/08/2026, retour de Frédéric — l'employé
        // reste au dépôt jusqu'à avoir fini) : phase "Dépôt" uniquement ici,
        // la boutique est rattrapée à la fin (voir renderFinalisationDoubleLieu).
        if (p && p.comptage_deux_lieux) {
          comptagesSaisie[el.dataset.produit] = (v === null || isNaN(v)) ? undefined : { compteDepot: v };
        } else {
          comptagesSaisie[el.dataset.produit] = { compte: v === null ? undefined : v };
        }
        sauvegarderDraft('cloture');
      });
    });
    document.getElementById('btnValiderCloture').addEventListener('click', () => {
      // Comptage en deux lieux (05/08/2026) : même principe qu'à
      // l'ouverture — on rattrape la boutique avant de clôturer.
      if (produitsDoubleLieuEnAttenteBoutique().length) { renderFinalisationDoubleLieu('cloture'); return; }
      validerCloture();
    });
    document.getElementById('btnAnnulerCloture').addEventListener('click', renderAccueil);
  }

  function renderLigneCloture(p, desactive) {
    const saisie = comptagesSaisie[p.id];
    const valeurAffichee = p.comptage_deux_lieux && saisie && saisie.compteDepot !== undefined && saisie.compteDepot !== null ? saisie.compteDepot : '';
    return `
      <div class="produit-row">
        <div class="produit-nom-ligne">
          <span class="produit-nom">${p.designation}</span>
          ${p.sensible ? '<span class="badge-sensible">Sensible</span>' : ''}
          ${p.comptage_deux_lieux ? '<span class="badge-double-lieu">📍 Dépôt — boutique en fin d\'inventaire</span>' : ''}
        </div>
        <div class="produit-controls">
          <input type="number" inputmode="decimal" step="0.01" class="produit-input" data-produit="${p.id}"
                 placeholder="${p.comptage_deux_lieux ? 'Comptage dépôt' : 'Stock final'}" value="${valeurAffichee}" onfocus="this.select()" ${desactive ? 'disabled' : ''}>
        </div>
      </div>
    `;
  }

  // Comptage en deux lieux (05/08/2026, retour de Frédéric — "l'employé,
  // une fois qu'il est dans un lieu, y reste jusqu'à ce qu'il ait fini,
  // puis change de lieu") : liste des produits dont le dépôt a été saisi
  // pendant le parcours normal, mais dont la boutique reste à faire —
  // rattrapée en un seul écran dédié juste avant la validation finale,
  // qu'il s'agisse de l'ouverture ou de la clôture.
  function produitsDoubleLieuEnAttenteBoutique() {
    return produitsZone.filter(p => {
      const s = comptagesSaisie[p.id];
      return p.comptage_deux_lieux && s && s.compteDepot !== undefined && s.compteDepot !== null && s.compte === undefined;
    });
  }

  function renderFinalisationDoubleLieu(typeFlux) {
    const enAttente = produitsDoubleLieuEnAttenteBoutique();
    document.getElementById('titre').textContent = 'Comptage boutique';
    document.getElementById('sousTitre').textContent = "Vous êtes maintenant en boutique — complétez le comptage des produits déjà comptés au dépôt.";
    document.getElementById('content').innerHTML = `
      <div class="card">
        ${enAttente.map(p => `
          <div class="produit-row" id="ligne-${p.id}">
            <div class="produit-nom-ligne"><span class="produit-nom">${p.designation}</span></div>
            <div class="produit-transmis">Dépôt déjà saisi : ${fmtNum(comptagesSaisie[p.id].compteDepot)} ${p.unite}</div>
            <div class="produit-controls" style="margin-top:8px;">
              <input type="number" inputmode="decimal" step="0.01" class="produit-input-finalisation" data-produit="${p.id}"
                     placeholder="Comptage boutique" value="" onfocus="this.select()">
            </div>
          </div>
        `).join('')}
      </div>
      <button class="btn-primary" id="btnValiderFinalisationDoubleLieu">${typeFlux === 'cloture' ? "Terminer et clôturer mon inventaire" : "Terminer et valider mon inventaire d'ouverture"}</button>
    `;
    const premier = document.querySelector('.produit-input-finalisation');
    if (premier) { premier.focus(); premier.select(); }
    document.getElementById('btnValiderFinalisationDoubleLieu').addEventListener('click', () => {
      const champs = Array.from(document.querySelectorAll('.produit-input-finalisation'));
      for (const el of champs) {
        const produitId = el.dataset.produit;
        const p = produitsZone.find(x => x.id === produitId);
        let vBoutique = el.value === '' ? null : parseFloat(el.value);
        if (vBoutique === null || isNaN(vBoutique)) {
          if (!confirm(`Aucun chiffre saisi pour la boutique sur ${p.designation} — on enregistre 0. Confirmer ?`)) return; // reste sur l'écran, rien n'est perdu
          vBoutique = 0;
        }
        const s = comptagesSaisie[produitId];
        s.compteBoutique = vBoutique;
        s.compte = s.compteDepot + vBoutique;
        if (typeFlux !== 'cloture') {
          // L'écart n'a de sens que côté ouverture (comparaison avec le
          // stock transmis par le quart précédent) — la clôture n'a jamais
          // calculé d'écart, on ne commence pas à en inventer un ici.
          const transmis = dernierStock[produitId] ? dernierStock[produitId].quantite : 0;
          s.ecartNonNul = Math.abs(s.compte - transmis) > 0.001;
        }
      }
      sauvegarderDraft(typeFlux);
      if (typeFlux === 'cloture') validerCloture(); else validerOuverture();
    });
  }

  // L'employé saisit toujours une quantité positive (une magnitude, jamais
  // un signe à deviner) — le sens entrant/sortant du type choisi détermine
  // automatiquement si elle s'ajoute ou se retranche (audit §6). Pour un
  // transfert, la zone source/destination est déduite automatiquement de la
  // zone suivie par l'employé (l'autre zone de la station, piste ↔ boutique)
  // — pas de sélecteur de zone supplémentaire à faire saisir.
  function ajouterMouvement() {
    const produitId = document.getElementById('mouvProduit').value;
    const type = document.getElementById('mouvType').value;
    const qteSaisie = parseFloat(document.getElementById('mouvQte').value);
    const justif = document.getElementById('mouvJustif').value;
    if (!produitId || isNaN(qteSaisie) || qteSaisie < 0) { alert('Choisissez un produit et une quantité positive.'); return; }
    const produit = produitsZone.find(p => p.id === produitId);
    const infoType = TYPES_MOUVEMENT.find(t => t.value === type);
    const qte = infoType.sens === 'sortant' ? -Math.abs(qteSaisie) : Math.abs(qteSaisie);
    const autreZone = zoneActive === 'piste' ? 'boutique' : 'piste';
    const mouvement = { produit_id: produitId, designation: produit ? produit.designation : '', type_mouvement: type, quantite: qte, justification: justif };
    if (type === 'transfert_recu') mouvement.zone_source_id = zonesMap[autreZone] || null;
    if (type === 'transfert_sortant') mouvement.zone_destination_id = zonesMap[autreZone] || null;
    mouvementsSaisie.push(mouvement);
    document.getElementById('mouvQte').value = '';
    document.getElementById('mouvJustif').value = '';
    sauvegarderDraft('cloture');
    renderListeMouvements();
  }

  function renderListeMouvements() {
    const el = document.getElementById('listeMouvements');
    if (!el) return;
    el.innerHTML = mouvementsSaisie.map((m, i) => `
      <div class="mouv-item">
        <span>${TYPES_MOUVEMENT.find(t=>t.value===m.type_mouvement).label} · ${m.designation} · ${m.quantite > 0 ? '+' : ''}${fmtNum(m.quantite)}</span>
        <span class="rm" data-idx="${i}">✕</span>
      </div>
    `).join('');
    el.querySelectorAll('.rm').forEach(rm => rm.addEventListener('click', () => {
      mouvementsSaisie.splice(parseInt(rm.dataset.idx), 1);
      sauvegarderDraft('cloture');
      renderListeMouvements();
    }));
  }

  async function validerCloture() {
    const requis = produitsRequis(produitsZone, { excludeJaugeage: true });
    const manquants = requis.filter(p => !comptagesSaisie[p.id] || comptagesSaisie[p.id].compte === undefined);
    // Avertissement renforcé (02/08/2026, demande de Frédéric — suite à un
    // quart clôturé alors que 87 produits sur 117 n'avaient pas été
    // comptés) : le message indique maintenant la proportion réelle, pas
    // seulement un nombre brut. Au-delà de la moitié manquante, la clôture
    // reste possible (l'employé doit garder son autonomie en fin de
    // service) mais devient "incomplète" : une alerte critique est
    // enregistrée pour le manager, visible dans À contrôler sur l'écran
    // Contrôle inventaire, avec un rappel explicite qu'elle verrouille
    // l'inventaire jusqu'à ce qu'un manager le rouvre.
    // Confirmation systématique avant validation (02/08/2026, demande de
    // Frédéric) — une seule boîte de dialogue, fusionnée avec l'avertissement
    // sur les comptages manquants s'il y en a, pour éviter d'empiler deux
    // popups successives.
    let clotureIncomplete = false;
    if (manquants.length) {
      const total = requis.length;
      const pct = total ? Math.round((manquants.length / total) * 100) : 0;
      const base = `${manquants.length} produit${manquants.length > 1 ? 's' : ''} sur ${total} sans stock final saisi (${pct}%).`;
      if (total > 0 && manquants.length / total > 0.5) {
        clotureIncomplete = true;
        if (!confirm(`${base}\n\nLa majorité des produits n'ont pas été comptés. Clôturer maintenant verrouillera l'inventaire jusqu'à ce qu'un manager le rouvre, et le manager en sera averti.\n\nÊtes-vous sûr de valider cette clôture ? Cette action est irréversible.`)) return;
      } else {
        if (!confirm(`${base}\n\nÊtes-vous sûr de valider cette clôture ? Cette action est irréversible.`)) return;
      }
    } else {
      if (!confirm('Êtes-vous sûr de valider cette clôture d\'inventaire ? Cette action est irréversible.')) return;
    }

    const btn = document.getElementById('btnValiderCloture');
    btn.disabled = true; btn.innerHTML = 'Nous traitons vos informations<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    // Mouvements déclarés
    for (const m of mouvementsSaisie) {
      const { error } = await nexusClient.from('inventaire_mouvements').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: m.produit_id,
        type_mouvement: m.type_mouvement, quantite: m.quantite, employee_id: employeeCourant.id, justification: m.justification || null,
        reason_code: m.type_mouvement, zone_source_id: m.zone_source_id || null, zone_destination_id: m.zone_destination_id || null,
      });
      if (error) console.error('Mouvement:', error);
    }

    let nbClotures = 0;
    for (const p of produitsZone) {
      const saisie = comptagesSaisie[p.id];
      if (!saisie || saisie.compte === undefined) continue;
      nbClotures++;
      const { error } = await nexusClient.from('inventaire_comptages').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, produit_id: p.id,
        type_comptage: 'cloture', quantite: saisie.compte, employee_id: employeeCourant.id, source: 'manuel', statut: 'valide',
        quantite_depot: saisie.compteDepot !== undefined ? saisie.compteDepot : null,
        quantite_boutique: saisie.compteBoutique !== undefined ? saisie.compteBoutique : null,
      });
      if (error) console.error('Comptage clôture:', error);
    }

    await nexusClient.from('inventaire_quart_employes').update({ a_valide_cloture: true, heure_depart: new Date().toISOString() }).eq('id', quartEmployeRow.id);
    await nexusClient.from('inventaire_quarts').update({ statut: 'cloture', cloture_le: new Date().toISOString() }).eq('id', quartRow.id);
    quartEmployeRow.a_valide_cloture = true;
    effacerDraft('cloture');

    // Alerte critique si la clôture a été validée très incomplète
    // (02/08/2026, demande de Frédéric) : jamais silencieux — le manager la
    // voit dans À contrôler sur Contrôle inventaire, avec le nombre réel de
    // produits manquants, et peut rouvrir la clôture depuis État du quart.
    if (clotureIncomplete) {
      await nexusClient.from('inventaire_alertes').insert({
        site: employeeCourant.site_id || 'vito-sainte-marie', quart_id: quartRow.id, type_alerte: 'cloture_incomplete',
        gravite: 'critique', valeur_attendue: requis.length, valeur_constatee: nbClotures,
        resolution: `Clôture validée par ${employeeCourant.nom} avec ${manquants.length} produit(s) sur ${requis.length} non comptés.`,
      });
    }

    renderFinalCloture(nbClotures);
  }

  function renderFinalCloture(nbClotures) {
    document.getElementById('titre').textContent = 'Inventaire de clôture validé';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="resume-card">
        <div class="checkmark">✓</div>
        <div class="final-greet">Merci ${employeeCourant.nom}</div>
        <div class="stat-row"><span class="stat-label">Produits clôturés</span><span class="stat-value">${nbClotures}</span></div>
        <div class="stat-row"><span class="stat-label">Mouvements déclarés</span><span class="stat-value">${mouvementsSaisie.length}</span></div>
        <div class="ecoulement-note">Votre stock final devient le stock transmis du prochain quart. Le manager pourra rapprocher ces chiffres avec les ventes de caisse dès que l'export sera importé — ce n'est pas encore fait automatiquement.</div>
      </div>
      <button class="btn-primary" id="btnRetourAccueil">Retour</button>
    `;
    document.getElementById('btnRetourAccueil').addEventListener('click', renderAccueil);
  }

  // Écoute déléguée globale (03/08/2026) pour le bouton "Déclarer cette
  // livraison" — posée une seule fois ici plutôt que ré-attachée à chaque
  // frappe : la pastille d'écart (ecartDiv/ecartCarrousel) est recréée en
  // continu pendant la saisie, un addEventListener direct dessus serait
  // perdu à chaque re-rendu. document.addEventListener survit à tous les
  // changements d'écran (contrairement à un listener posé sur #content).
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-declarer-livraison');
    if (!btn) return;
    const produitId = btn.dataset.produit;
    const qte = parseFloat(btn.dataset.qte);
    if (!produitId || isNaN(qte)) return;
    declarerLivraisonRapide(produitId, qte);
    const conteneur = btn.closest('.ecart-tag');
    if (conteneur) conteneur.innerHTML = rendreContenuEcart(produitId, qte);
  });

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    employeeCourant = employee;
    demarrerHorloge();
    quartActuel = await quartDuMoment(employee.site_id);
    roleDuJour = await chargerRoleDuJour();
    zonesAutorisees = zonesPourRole(roleDuJour);
    zoneActive = zonesAutorisees[0];

    const { data: zonas } = await nexusClient.from('inventaire_zones').select('id, code');
    if (zonas) zonesMap = Object.fromEntries(zonas.map(z => [z.code, z.id]));

    quartRow = await obtenirOuCreerQuart();
    if (!quartRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger l\'inventaire du quart. Réessayez.</div>'; return; }
    quartEmployeRow = await obtenirOuCreerQuartEmploye();

    if (quartEmployeRow && quartEmployeRow.zone_id) {
      const codeConnu = Object.keys(zonesMap).find(code => zonesMap[code] === quartEmployeRow.zone_id);
      if (codeConnu) zoneActive = codeConnu;
    }

    if (zonesAutorisees.length > 1 && !quartEmployeRow.zone_id) {
      renderChoixZone();
    } else {
      renderAccueil();
    }
  });
</script>
</body>
</html>
