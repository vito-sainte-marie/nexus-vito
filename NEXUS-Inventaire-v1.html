        if (!confirm(`${base}\n\nÊtes-vous sûr de valider cette clôture ? Cette action est irréversible.`)) return;
      }
    } else {
      if (!confirm('Êtes-vous sûr de valider cette clôture d\'inventaire ? Cette action est irréversible.')) return;
    }

    const btn = document.getElementById('btnValiderCloture');
    btn.disabled = true; btn.innerHTML = 'Nous traitons vos informations<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    // Mouvements déclarés. type_mouvement écrit en base = valeur ramenée à
    // l'ensemble reconnu par le CHECK (typeMouvementValideEnBase) -- voir le
    // commentaire au-dessus de cette fonction, la nuance du libellé choisi
    // par l'employé est conservée dans la justification si elle a changé.
    for (const m of mouvementsSaisie) {
      const typeValide = typeMouvementValideEnBase(m.type_mouvement);
      const nuancePerdue = typeValide !== m.type_mouvement;
      const libelleOriginal = TYPES_MOUVEMENT.find(t => t.value === m.type_mouvement);
      const justificationFinale = nuancePerdue
        ? `${m.justification || ''}${m.justification ? ' ' : ''}[${libelleOriginal ? libelleOriginal.label : m.type_mouvement}]`.trim()
        : (m.justification || null);
      const { error } = await nexusClient.from('inventaire_mouvements').insert({
        site: employeeCourant.site_id, quart_id: quartRow.id, produit_id: m.produit_id,
        type_mouvement: typeValide, quantite: m.quantite, employee_id: employeeCourant.id, justification: justificationFinale,
        reason_code: m.type_mouvement, zone_source_id: m.zone_source_id || null, zone_destination_id: m.zone_destination_id || null,
      });
      if (error) console.error('Mouvement:', error);
    }

    let nbClotures = 0;
    for (const p of produitsZone) {
      const saisie = comptagesSaisie[p.id];
      if (!saisie || saisie.compte === undefined) continue;
      nbClotures++;
      compteurTapsSession++; // Sprint 8, INV2-19 : geste réel de validation produit (clôture), même logique que l'ouverture
      const { error } = await nexusClient.from('inventaire_comptages').insert({
        site: employeeCourant.site_id, quart_id: quartRow.id, produit_id: p.id,
        type_comptage: 'cloture', quantite: saisie.compte, employee_id: employeeCourant.id, source: 'manuel', statut: 'valide',
        quantite_depot: saisie.compteDepot !== undefined ? saisie.compteDepot : null,
        quantite_boutique: saisie.compteBoutique !== undefined ? saisie.compteBoutique : null,
      });
      if (error) console.error('Comptage clôture:', error);
    }

    await nexusClient.from('inventaire_quart_employes').update({ a_valide_cloture: true, heure_depart: new Date().toISOString() }).eq('id', quartEmployeRow.id);
    await nexusClient.from('inventaire_quarts').update({ statut: 'cloture', cloture_le: new Date().toISOString() }).eq('id', quartRow.id);
    // Flush final des mesures d'adoption (18/08/2026, Sprint 8, INV2-19) —
    // même logique que validerOuverture ci-dessus.
    await flusherMesuresAdoption();
    quartEmployeRow.a_valide_cloture = true;
    effacerDraft('cloture');

    // Alerte critique si la clôture a été validée très incomplète
    // (02/08/2026, demande de Frédéric) : jamais silencieux — le manager la
    // voit dans À contrôler sur Contrôle inventaire, avec le nombre réel de
    // produits manquants, et peut rouvrir la clôture depuis État du quart.
    if (clotureIncomplete) {
      await nexusClient.from('inventaire_alertes').insert({
        site: employeeCourant.site_id, quart_id: quartRow.id, type_alerte: 'cloture_incomplete',
        gravite: 'critique', valeur_attendue: requis.length, valeur_constatee: nbClotures,
        resolution: `Clôture validée par ${employeeCourant.nom} avec ${manquants.length} produit(s) sur ${requis.length} non comptés.`,
      });
    }

    renderFinalCloture(nbClotures);
  }

  function renderFinalCloture(nbClotures) {
    document.getElementById('titre').textContent = 'Inventaire de clôture validé';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="resume-card">
        <div class="checkmark">✓</div>
        <div class="final-greet">Merci ${employeeCourant.nom}</div>
        <div class="stat-row"><span class="stat-label">Produits clôturés</span><span class="stat-value">${nbClotures}</span></div>
        <div class="stat-row"><span class="stat-label">Mouvements déclarés</span><span class="stat-value">${mouvementsSaisie.length}</span></div>
        <div class="ecoulement-note">Votre stock final devient le stock transmis du prochain quart. Le manager pourra rapprocher ces chiffres avec les ventes de caisse dès que l'export sera importé — ce n'est pas encore fait automatiquement.</div>
      </div>
      <button class="btn-primary" id="btnRetourAccueil">Retour</button>
    `;
    document.getElementById('btnRetourAccueil').addEventListener('click', renderAccueil);
  }

  // ------------------------------------------------------------
  // CALCULATRICE DE COMPTAGE (16/08/2026, demande de Frédéric — "possible
  // d'intégrer une calculatrice ?"). Deux briques, toutes deux branchées
  // sur l'écoute déléguée globale ci-dessous (mêmes raisons que pour
  // "Déclarer cette livraison" : ces boutons vivent dans du HTML recréé en
  // continu pendant la saisie, un addEventListener direct dessus serait
  // perdu à chaque re-rendu) :
  //  1) Addition en chaîne — boutons [+]/[−] sous le champ, qui ajoutent
  //     l'opérateur au texte déjà saisi (evaluerAdditionChainee calcule le
  //     total à la volée, voir plus haut).
  //  2) Calculatrice complète (+ − × ÷) — icône 🖩, ouvre un clavier en
  //     recouvrement ; "Utiliser ce résultat" remplace le contenu du champ
  //     par le résultat final.
  // ------------------------------------------------------------
  function calcBarreHtml() {
    return `
      <div class="calc-barre">
        <button type="button" class="calc-op-btn" data-calc-op="+">+</button>
        <button type="button" class="calc-op-btn" data-calc-op="-">−</button>
        <button type="button" class="calc-op-btn" data-calc-op="*">×</button>
        <button type="button" class="calc-op-btn" data-calc-op="/">÷</button>
        <span class="calc-apercu"></span>
        <button type="button" class="calc-pop-btn" title="Calculatrice">🖩</button>
      </div>
    `;
  }

  // Ajoute un opérateur à la fin du champ ciblé (jamais en tête, jamais deux
  // opérateurs à la suite) puis redéclenche un événement 'input' — c'est ce
  // même événement que les écrans (majLigneCategorie, majCarrousel, etc.)
  // écoutent déjà pour recalculer écart/aperçu, aucune duplication de
  // logique n'est nécessaire ici.
  function ajouterOperateurChamp(input, op) {
    if (!input) return;
    const brut = input.value;
    if (brut.trim() === '') return; // rien à additionner à une case vide
    const nouveauBrut = /[+\-*/]\s*$/.test(brut) ? brut.replace(/[+\-*/]\s*$/, op) : brut + op;
    input.value = nouveauBrut;
    input.focus();
    // Corrigé (16/08/2026, signalé par Frédéric sur iPhone — "je tape 6, ça
    // efface 120+ et met juste 6") : chaque champ de comptage porte
    // `onfocus="this.select()"` (pour pouvoir retaper vite par-dessus un
    // chiffre déjà saisi) — .focus() redéclenche donc CE onfocus et
    // sélectionne tout le texte, y compris l'opérateur qu'on vient
    // d'ajouter. Le prochain chiffre tapé remplaçait alors "120+" en
    // entier au lieu de s'ajouter après. On repositionne le curseur en fin
    // de champ juste après, pour annuler cette sélection involontaire —
    // aucun impact sur le comportement normal de onfocus (un tap manuel
    // sur le champ, lui, doit toujours tout sélectionner).
    input.setSelectionRange(input.value.length, input.value.length);
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // Aperçu "= 24" affiché sous le champ dès que l'expression contient au
  // moins deux termes — jamais pour un nombre seul ("24" reste juste "24"),
  // pour ne pas alourdir l'écran dans le cas très majoritaire.
  function majApercuChamp(input) {
    const conteneur = input.closest && input.closest('.champ-comptage');
    if (!conteneur) return;
    const apercu = conteneur.querySelector('.calc-apercu');
    if (!apercu) return;
    const brut = String(input.value || '').trim();
    const plusieursTermesRegex = /^-?\d+(\.\d+|,\d+)?\s*[+\-*/]/;
    if (!plusieursTermesRegex.test(brut)) { apercu.textContent = ''; return; }
    const val = evaluerAdditionChainee(brut);
    apercu.textContent = isNaN(val) ? '' : `= ${fmtNum(val)}`;
  }

  // Calculatrice complète (+ − × ÷), moteur "à quatre opérations" classique
  // (jamais un eval() de chaîne — plus sûr, et gère nativement la virgule
  // française) : un accumulateur, l'opérateur en attente, et l'affichage en
  // cours de frappe.
  let calcEtat = null;
  let calcPopupCibleInput = null;
  function calcApplique(a, b, op) {
    if (op === '+') return a + b;
    if (op === '-') return a - b;
    if (op === '*') return a * b;
    if (op === '/') return b === 0 ? NaN : a / b;
    return b;
  }
  function majAffichageCalc() {
    const disp = document.getElementById('calcDisplay');
    if (disp && calcEtat) disp.textContent = calcEtat.affichage;
  }
  function calcAppuiChiffre(chiffre) {
    if (!calcEtat) return;
    if (calcEtat.effacerAuProchainChiffre || calcEtat.affichage === '0') {
      calcEtat.affichage = chiffre === ',' ? '0,' : chiffre;
      calcEtat.effacerAuProchainChiffre = false;
    } else {
      if (chiffre === ',' && calcEtat.affichage.includes(',')) return;
      calcEtat.affichage += chiffre;
    }
    majAffichageCalc();
  }
  function calcAppuiOperateur(op) {
    if (!calcEtat) return;
    const valActuelle = Number(calcEtat.affichage.replace(',', '.'));
    if (calcEtat.accumulateur !== null && calcEtat.operateurEnAttente && !calcEtat.effacerAuProchainChiffre) {
      calcEtat.accumulateur = calcApplique(calcEtat.accumulateur, valActuelle, calcEtat.operateurEnAttente);
      calcEtat.affichage = String(calcEtat.accumulateur).replace('.', ',');
    } else {
      calcEtat.accumulateur = valActuelle;
    }
    calcEtat.operateurEnAttente = op;
    calcEtat.effacerAuProchainChiffre = true;
    majAffichageCalc();
  }
  function calcAppuiEgal() {
    if (!calcEtat || calcEtat.operateurEnAttente === null) return;
    const valActuelle = Number(calcEtat.affichage.replace(',', '.'));
    const resultat = calcApplique(calcEtat.accumulateur, valActuelle, calcEtat.operateurEnAttente);
    calcEtat.affichage = isNaN(resultat) ? 'Erreur' : String(Math.round(resultat * 1000) / 1000).replace('.', ',');
    calcEtat.accumulateur = null;
    calcEtat.operateurEnAttente = null;
    calcEtat.effacerAuProchainChiffre = true;
    majAffichageCalc();
  }
  function calcEffacer() {
    calcEtat = { affichage: '0', accumulateur: null, operateurEnAttente: null, effacerAuProchainChiffre: false };
    majAffichageCalc();
  }
  function calcRetourArriere() {
    if (!calcEtat) return;
    if (calcEtat.affichage.length <= 1 || calcEtat.affichage === 'Erreur') { calcEtat.affichage = '0'; }
    else {
      calcEtat.affichage = calcEtat.affichage.slice(0, -1);
      if (calcEtat.affichage === '' || calcEtat.affichage === '-') calcEtat.affichage = '0';
    }
    majAffichageCalc();
  }
  function ouvrirCalculatricePopup(input) {
    if (!input) return;
    calcPopupCibleInput = input;
    const ancien = document.getElementById('calcOverlay');
    if (ancien) ancien.remove();
    const overlay = document.createElement('div');
    overlay.id = 'calcOverlay';
    overlay.className = 'calc-overlay';
    overlay.innerHTML = `
      <div class="calc-modal">
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-keys">
          <button type="button" class="calc-key calc-key-fn" data-calc-key="C">C</button>
          <button type="button" class="calc-key calc-key-fn" data-calc-key="back">⌫</button>
          <button type="button" class="calc-key calc-key-op" data-calc-key="/">÷</button>
          <button type="button" class="calc-key calc-key-op" data-calc-key="*">×</button>
          <button type="button" class="calc-key" data-calc-key="7">7</button>
          <button type="button" class="calc-key" data-calc-key="8">8</button>
          <button type="button" class="calc-key" data-calc-key="9">9</button>
          <button type="button" class="calc-key calc-key-op" data-calc-key="-">−</button>
          <button type="button" class="calc-key" data-calc-key="4">4</button>
          <button type="button" class="calc-key" data-calc-key="5">5</button>
          <button type="button" class="calc-key" data-calc-key="6">6</button>
          <button type="button" class="calc-key calc-key-op" data-calc-key="+">+</button>
          <button type="button" class="calc-key" data-calc-key="1">1</button>
          <button type="button" class="calc-key" data-calc-key="2">2</button>
          <button type="button" class="calc-key" data-calc-key="3">3</button>
          <button type="button" class="calc-key calc-key-eq" data-calc-key="=" style="grid-row: span 2;">=</button>
          <button type="button" class="calc-key" data-calc-key="0" style="grid-column: span 2;">0</button>
          <button type="button" class="calc-key" data-calc-key=",">,</button>
        </div>
        <div class="calc-actions">
          <button type="button" class="btn-ghost" id="btnCalcAnnuler">Annuler</button>
          <button type="button" class="btn-primary" id="btnCalcUtiliser">Utiliser ce résultat</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const valeurExistante = input.value === '' ? NaN : evaluerAdditionChainee(input.value);
    calcEtat = { affichage: !isNaN(valeurExistante) ? String(valeurExistante).replace('.', ',') : '0', accumulateur: null, operateurEnAttente: null, effacerAuProchainChiffre: true };
    majAffichageCalc();
    document.getElementById('btnCalcAnnuler').addEventListener('click', fermerCalculatricePopup);
    document.getElementById('btnCalcUtiliser').addEventListener('click', () => {
      const val = Number((calcEtat.affichage || '0').replace(',', '.'));
      if (!isNaN(val) && calcPopupCibleInput) {
        calcPopupCibleInput.value = String(val);
        calcPopupCibleInput.dispatchEvent(new Event('input', { bubbles: true }));
      }
      fermerCalculatricePopup();
    });
  }
  function fermerCalculatricePopup() {
    const overlay = document.getElementById('calcOverlay');
    if (overlay) overlay.remove();
    calcPopupCibleInput = null;
    calcEtat = null;
  }

  // Écoute déléguée globale (03/08/2026, étendue 16/08/2026 pour la
  // calculatrice) pour tous les boutons qui vivent dans du HTML recréé en
  // continu pendant la saisie — un addEventListener direct dessus serait
  // perdu à chaque re-rendu. document.addEventListener survit à tous les
  // changements d'écran (contrairement à un listener posé sur #content).
  document.addEventListener('click', (e) => {
    const opBtn = e.target.closest('.calc-op-btn');
    if (opBtn) {
      const conteneur = opBtn.closest('.champ-comptage');
      const input = conteneur ? conteneur.querySelector('input') : null;
      ajouterOperateurChamp(input, opBtn.dataset.calcOp);
      return;
    }
    const popBtn = e.target.closest('.calc-pop-btn');
    if (popBtn) {
      const conteneur = popBtn.closest('.champ-comptage');
      const input = conteneur ? conteneur.querySelector('input') : null;
      ouvrirCalculatricePopup(input);
      return;
    }
    const calcKey = e.target.closest('.calc-key');
    if (calcKey) {
      const k = calcKey.dataset.calcKey;
      if (k === 'C') calcEffacer();
      else if (k === 'back') calcRetourArriere();
      else if (k === '=') calcAppuiEgal();
      else if (k === '+' || k === '-' || k === '*' || k === '/') calcAppuiOperateur(k);
      else calcAppuiChiffre(k);
      return;
    }
    if (e.target.id === 'calcOverlay') { fermerCalculatricePopup(); return; }

    const btn = e.target.closest('.btn-declarer-livraison');
    if (!btn) return;
    const produitId = btn.dataset.produit;
    const qte = parseFloat(btn.dataset.qte);
    if (!produitId || isNaN(qte)) return;
    declarerLivraisonRapide(produitId, qte);
    const conteneur = btn.closest('.ecart-tag');
    if (conteneur) conteneur.innerHTML = rendreContenuEcart(produitId, qte);
  });

  // Aperçu "= X" (voir majApercuChamp) tenu à jour à chaque frappe, qu'elle
  // vienne du clavier natif ou des boutons [+]/[−] — une seule écoute
  // déléguée plutôt qu'une réattachée à chaque re-rendu de champ.
  document.addEventListener('input', (e) => {
    if (e.target.closest && e.target.closest('.champ-comptage')) majApercuChamp(e.target);
  });

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    employeeCourant = employee;
    demarrerHorloge();
    quartActuel = await quartDuMoment(employee.site_id);
    roleDuJour = await chargerRoleDuJour();
    zonesAutorisees = zonesPourRole(roleDuJour);
    zoneActive = zonesAutorisees[0];

    const { data: zonas } = await nexusClient.from('inventaire_zones').select('id, code');
    if (zonas) zonesMap = Object.fromEntries(zonas.map(z => [z.code, z.id]));

    quartRow = await obtenirOuCreerQuart();
    if (!quartRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger l\'inventaire du quart. Réessayez.</div>'; return; }
    quartEmployeRow = await obtenirOuCreerQuartEmploye();

    if (quartEmployeRow && quartEmployeRow.zone_id) {
      const codeConnu = Object.keys(zonesMap).find(code => zonesMap[code] === quartEmployeRow.zone_id);
      if (codeConnu) zoneActive = codeConnu;
    }

    if (zonesAutorisees.length > 1 && !quartEmployeRow.zone_id) {
      renderChoixZone();
    } else {
      renderAccueil();
    }
  });
</script>
</body>
</html>
