# Essai de faisabilité ISOLÉ : base PostgreSQL/Supabase locale et jetable
# (GO de Frédéric du 17/10/2026, voie 2).
#
# Ce que ce workflow fait : démarrer l'image Supabase Postgres DANS le runner,
# y rejouer les migrations du dépôt dans l'ordre officiel, y prouver des
# autorisations et des refus RLS sous des identités distinctes, inventorier le
# schéma reconstruit, puis tout jeter avec le runner.
#
# Ce qu'il ne fait pas, par construction :
#   - aucun secret : la seule connexion est celle du conteneur local ;
#   - aucune base distante : le script de rejeu refuse tout PGHOST non local ;
#   - aucune écriture sur le dépôt : jeton en lecture seule ;
#   - aucun lien avec tests.yml, le rail Handoff ou la boucle : il ne tourne que
#     sur les branches essai/base-jetable-*, jamais sur le rail.
name: Essai base jetable (isolé)

on:
  push:
    branches: ['essai/base-jetable-*']

permissions:
  contents: read

concurrency:
  group: essai-base-jetable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  essai:
    # Deux historiques, deux jeux de preuves : la branche (le rail, d'où elle
    # part) et production. Le rail n'a pas les 21 migrations livrées en
    # production depuis le 05/10 ; Test a reçu les deux. Rejouer l'un sans
    # l'autre donnerait une fausse image de Test.
    strategy:
      fail-fast: false
      matrix:
        # « brut » : l'image Postgres seule, telle quelle.
        # « socle » : la même, plus ce que Test possède HORS migrations et que
        # l'essai a mesuré : les tables du service Storage (créées par
        # storage-api, pas par nos migrations) et le rôle nexus_ci_recette
        # (créé à la main sur Test). Variante séparée et nommée : le résultat
        # brut reste visible, rien n'est masqué.
        source: [branche, production]
        socle: [brut]
        include:
          - source: branche
            socle: socle
    name: essai (${{ matrix.source }}, ${{ matrix.socle }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: localhost
      PGPORT: '54322'
      PGUSER: postgres
      # Mot de passe d'un conteneur jetable, local au runner : ce n'est pas un
      # secret, il ne protège rien qui survive au job.
      PGPASSWORD: postgres-essai-jetable
      PGDATABASE: postgres
      IMAGE_CIBLE: supabase/postgres:17.6.1.166
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Récupérer les migrations de production (lecture seule)
        if: matrix.source == 'production'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          path: source-production
          persist-credentials: false
          sparse-checkout: supabase/migrations

      - name: Désigner le dossier de migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.source }}" = production ]; then d=source-production/supabase/migrations; else d=supabase/migrations; fi
          echo "MIGRATIONS=$d" >> "$GITHUB_ENV"
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Source::$d — $(ls "$d"/*.sql | wc -l) fichiers, commit $(git -C "$(dirname "$(dirname "$d")")" rev-parse --short HEAD)"

      - name: Choisir l'image (version de Test d'abord)
        id: image
        shell: bash
        run: |
          set -euo pipefail
          # Test tourne sur 17.6.1.166 (list_projects, 17/10/2026). Si cette
          # étiquette n'est pas publiée, on prend la plus haute 17.6.1.x et on
          # le DIT : c'est une limite de fidélité, pas un détail.
          if docker pull -q "$IMAGE_CIBLE" >/dev/null 2>&1; then
            image="$IMAGE_CIBLE"; fidelite="identique à Test"
          else
            tag=$(curl -fsS 'https://hub.docker.com/v2/repositories/supabase/postgres/tags?page_size=100&name=17.6.1' \
                  | jq -r '.results[].name' | grep -E '^17\.6\.1\.[0-9]+$' | sort -t. -k4,4n | tail -n 1)
            [ -n "$tag" ] || { echo "::error::Aucune image supabase/postgres 17.6.1.x publiée"; exit 1; }
            image="supabase/postgres:$tag"; fidelite="DIFFÉRENTE de Test (17.6.1.166 non publiée)"
            docker pull -q "$image" >/dev/null
          fi
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Image::$image ($fidelite) — $digest"

      - name: Démarrer la base jetable
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name base-jetable -e POSTGRES_PASSWORD="$PGPASSWORD" \
            -p 127.0.0.1:${PGPORT}:5432 "${{ steps.image.outputs.image }}" >/dev/null
          debut=$(date +%s)
          # Prête = connexion acceptée ET rôles Supabase présents (l'image
          # redémarre une fois après ses scripts d'initialisation).
          for i in $(seq 1 90); do
            if n=$(psql -X -tA -c "select count(*) from pg_roles where rolname in ('anon','authenticated','service_role')" 2>/dev/null) && [ "$n" = 3 ]; then
              break
            fi
            sleep 2
          done
          [ "${n:-0}" = 3 ] || { docker logs base-jetable | tail -n 40; echo "::error::Base jetable non prête"; exit 1; }
          etat=$(psql -X -tA -c "select json_build_object(
            'serveur', current_setting('server_version'),
            'superutilisateur_postgres', (select rolsuper from pg_roles where rolname = current_user),
            'schemas', (select json_agg(nspname order by nspname) from pg_namespace where nspname in ('auth','storage','extensions','cron','net','vault','supabase_migrations')),
            'auth_uid', to_regprocedure('auth.uid()') is not null,
            'extensions_disponibles', (select json_agg(name order by name) from pg_available_extensions where name in ('pg_cron','pg_net','pgcrypto','uuid-ossp','pg_stat_statements')),
            'demarrage_s', $(( $(date +%s) - debut )))")
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Base jetable prête::$etat"

      - name: Installer le socle hors migrations (variante « socle » seulement)
        if: matrix.socle == 'socle'
        shell: bash
        run: |
          set -euo pipefail
          # 1. Rôle nexus_ci_recette : sur Test il a été créé à la main ; ici
          #    NOLOGIN, sans mot de passe, pour que ses GRANT s'appliquent.
          psql -X -q -c "do \$\$ begin if not exists (select 1 from pg_roles where rolname = 'nexus_ci_recette') then create role nexus_ci_recette nologin; end if; end \$\$;"
          # 2. Service Storage : ses tables (storage.objects, storage.buckets…)
          #    sont créées par storage-api au démarrage, pas par l'image Postgres.
          docker exec base-jetable psql -X -q -U supabase_admin -d postgres \
            -c "alter role supabase_storage_admin with login password '$PGPASSWORD'" \
            || { echo "::error::Impossible de préparer supabase_storage_admin"; exit 1; }
          tag=$(curl -fsS 'https://hub.docker.com/v2/repositories/supabase/storage-api/tags?page_size=100&ordering=last_updated' \
                | jq -r '.results[].name' | grep -E '^v1\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          [ -n "$tag" ] || { echo "::error::Aucune image supabase/storage-api v1.x"; exit 1; }
          secret=essai-jetable-secret-local-non-sensible-0123456789
          jwt() { h=$(printf '{"alg":"HS256","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=');
                  p=$(printf '{"role":"%s","iss":"essai","exp":4102444800}' "$1" | base64 -w0 | tr '+/' '-_' | tr -d '=');
                  s=$(printf '%s.%s' "$h" "$p" | openssl dgst -sha256 -hmac "$secret" -binary | base64 -w0 | tr '+/' '-_' | tr -d '=');
                  printf '%s.%s.%s' "$h" "$p" "$s"; }
          docker run -d --name storage-jetable --network host \
            -e ANON_KEY="$(jwt anon)" -e SERVICE_KEY="$(jwt service_role)" \
            -e PGRST_JWT_SECRET="$secret" -e AUTH_JWT_SECRET="$secret" \
            -e POSTGREST_URL=http://127.0.0.1:3000 \
            -e DATABASE_URL="postgres://supabase_storage_admin:${PGPASSWORD}@127.0.0.1:${PGPORT}/postgres" \
            -e STORAGE_BACKEND=file -e FILE_STORAGE_BACKEND_PATH=/tmp/storage -e FILE_SIZE_LIMIT=52428800 \
            -e TENANT_ID=essai -e REGION=local -e GLOBAL_S3_BUCKET=essai -e SERVER_PORT=5000 \
            "supabase/storage-api:$tag" >/dev/null
          for i in $(seq 1 60); do
            [ "$(psql -X -tA -c "select to_regclass('storage.objects') is not null and to_regclass('storage.buckets') is not null")" = t ] && break
            sleep 2
          done
          [ "$(psql -X -tA -c "select to_regclass('storage.objects') is not null")" = t ] \
            || { docker logs storage-jetable 2>&1 | tail -n 40; echo "::error::storage-api n'a pas créé ses tables"; exit 1; }
          docker rm -f storage-jetable >/dev/null
          echo "::notice title=[${{ matrix.source }}/socle] Socle installé::nexus_ci_recette (NOLOGIN) + tables Storage par supabase/storage-api:$tag — $(psql -X -tA -c "select count(*) from pg_tables where schemaname='storage'") tables storage"

      - name: Rejouer les migrations dans l'ordre officiel
        shell: bash
        run: |
          set -euo pipefail
          debut=$(date +%s)
          bash outils/essai-base-jetable/rejouer-migrations.sh "$MIGRATIONS" "$RUNNER_TEMP/migrations.jsonl" \
            | tail -n 40
          duree=$(( $(date +%s) - debut ))
          J="$RUNNER_TEMP/migrations.jsonl"
          bilan=$(jq -sc --argjson duree "$duree" '{total: length, ok: ([.[]|select(.statut=="ok")]|length),
                   echecs: ([.[]|select(.statut=="echec")]|length), duree_s: $duree,
                   premier_echec: ([.[]|select(.statut=="echec")][0] // null)}' "$J")
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Bilan des migrations::$bilan"
          liste=$(jq -sc '[.[]|select(.statut=="echec")|{rang, fichier, cascade, erreur: (.erreur|split("\n")[0])}]' "$J")
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Échecs (tous)::$liste"
          lentes=$(jq -sc 'sort_by(-.duree_ms)[:5]|map({fichier, duree_ms})' "$J")
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Migrations les plus lentes::$lentes"

      # Une seule variante suffit à la preuve RLS ; la branche porte le script.
      - name: Prouver autorisations et refus RLS sous identités distinctes
        if: matrix.source == 'branche'
        shell: bash
        run: |
          set -uo pipefail
          if sortie=$(psql -X -v ON_ERROR_STOP=1 -f outils/essai-base-jetable/preuve-rls.sql 2>&1); then statut=ok; else statut=echec; fi
          printf '%s\n' "$sortie"
          lignes=$(printf '%s\n' "$sortie" | grep -E '^ *[0-9]+ \||PREUVE RLS|ERROR' | head -n 20 | tr '\n' ';')
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Preuve RLS ($statut)::$lignes"

      - name: Inventorier le schéma reconstruit
        shell: bash
        run: |
          set -euo pipefail
          psql -X -tA -f outils/essai-base-jetable/inventaire-schema.sql > "$RUNNER_TEMP/inventaire.json"
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Inventaire (comptes)::$(jq -c 'del(.liste_tables, .liste_politiques, .liste_fonctions)' "$RUNNER_TEMP/inventaire.json")"

      # Une annotation est tronquée à 4 096 caractères : la liste part en
      # morceaux numérotés (au plus 10 par étape), chacun sous 3 800 caractères.
      - name: Publier la liste des tables
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.liste_tables[]' "$RUNNER_TEMP/inventaire.json" > "$RUNNER_TEMP/tables.txt"
          total=$(wc -l < "$RUNNER_TEMP/tables.txt")
          awk -v max=3800 '{ if (len + length($0) + 1 > max) { n++; len = 0 } print > (ENVIRON["RUNNER_TEMP"] "/tables." sprintf("%02d", n)); len += length($0) + 1 }' n=1 "$RUNNER_TEMP/tables.txt"
          morceaux=$(ls "$RUNNER_TEMP"/tables.[0-9][0-9] | wc -l)
          [ "$morceaux" -le 10 ] || { echo "::error::tables : $morceaux morceaux, plus que 10 annotations"; exit 1; }
          k=0
          for f in "$RUNNER_TEMP"/tables.[0-9][0-9]; do
            k=$((k + 1))
            echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Inventaire (tables) $k/$morceaux, $total au total::$(paste -sd '|' "$f")"
          done

      # Une annotation est tronquée à 4 096 caractères : la liste part en
      # morceaux numérotés (au plus 10 par étape), chacun sous 3 800 caractères.
      - name: Publier la liste des politiques
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.liste_politiques[]' "$RUNNER_TEMP/inventaire.json" > "$RUNNER_TEMP/politiques.txt"
          total=$(wc -l < "$RUNNER_TEMP/politiques.txt")
          awk -v max=3800 '{ if (len + length($0) + 1 > max) { n++; len = 0 } print > (ENVIRON["RUNNER_TEMP"] "/politiques." sprintf("%02d", n)); len += length($0) + 1 }' n=1 "$RUNNER_TEMP/politiques.txt"
          morceaux=$(ls "$RUNNER_TEMP"/politiques.[0-9][0-9] | wc -l)
          [ "$morceaux" -le 10 ] || { echo "::error::politiques : $morceaux morceaux, plus que 10 annotations"; exit 1; }
          k=0
          for f in "$RUNNER_TEMP"/politiques.[0-9][0-9]; do
            k=$((k + 1))
            echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Inventaire (politiques) $k/$morceaux, $total au total::$(paste -sd '|' "$f")"
          done

      # Une annotation est tronquée à 4 096 caractères : la liste part en
      # morceaux numérotés (au plus 10 par étape), chacun sous 3 800 caractères.
      - name: Publier la liste des fonctions
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.liste_fonctions[]' "$RUNNER_TEMP/inventaire.json" > "$RUNNER_TEMP/fonctions.txt"
          total=$(wc -l < "$RUNNER_TEMP/fonctions.txt")
          awk -v max=3800 '{ if (len + length($0) + 1 > max) { n++; len = 0 } print > (ENVIRON["RUNNER_TEMP"] "/fonctions." sprintf("%02d", n)); len += length($0) + 1 }' n=1 "$RUNNER_TEMP/fonctions.txt"
          morceaux=$(ls "$RUNNER_TEMP"/fonctions.[0-9][0-9] | wc -l)
          [ "$morceaux" -le 10 ] || { echo "::error::fonctions : $morceaux morceaux, plus que 10 annotations"; exit 1; }
          k=0
          for f in "$RUNNER_TEMP"/fonctions.[0-9][0-9]; do
            k=$((k + 1))
            echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Inventaire (fonctions) $k/$morceaux, $total au total::$(paste -sd '|' "$f")"
          done

      # --- Arbitrage du 17/10/2026, décision 4 : helpers d'identité partagés ---
      - name: Analyser les helpers d'identité partagés
        shell: bash
        run: |
          set -uo pipefail
          A=outils/essai-base-jetable
          psql -X -tA -f $A/helpers/dependants-helpers.sql > "$RUNNER_TEMP/dependants.json"
          jq -c 'del(.autres_definer_meme_forme, .sql_dynamique_appelable_client, .par_module)' "$RUNNER_TEMP/dependants.json" > "$RUNNER_TEMP/dep-resume.txt"
          bash $A/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Helpers : dépendants" "$RUNNER_TEMP/dep-resume.txt" 2
          jq -r '.par_module | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/dependants.json" > "$RUNNER_TEMP/dep-modules.txt"
          bash $A/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Helpers : tables dépendantes par module" "$RUNNER_TEMP/dep-modules.txt" 2
          jq -r '(.autres_definer_meme_forme // [])[]' "$RUNNER_TEMP/dependants.json" > "$RUNNER_TEMP/dep-autres.txt"
          bash $A/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Helpers : autres DEFINER de même forme (repérage)" "$RUNNER_TEMP/dep-autres.txt" 2
          jq -r '(.sql_dynamique_appelable_client // [])[] | "\(.fonction) definer=\(.definer)"' "$RUNNER_TEMP/dependants.json" > "$RUNNER_TEMP/dep-dyn.txt"
          bash $A/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Helpers : SQL dynamique appelable par un client" "$RUNNER_TEMP/dep-dyn.txt" 2
          if psql -X -f $A/helpers/usurpation-helpers.sql > "$RUNNER_TEMP/usurpation.txt" 2>&1; then statut=ok; else statut=echec; fi
          grep -E '^ *[0-9]+ \||HELPERS :|ERROR' "$RUNNER_TEMP/usurpation.txt" | sed 's/  */ /g' > "$RUNNER_TEMP/usurp-lignes.txt" || true
          bash $A/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Helpers : usurpation par table temporaire ($statut)" "$RUNNER_TEMP/usurp-lignes.txt" 2

      - name: Éprouver le correctif minimal des helpers (transaction annulée)
        shell: bash
        run: |
          set +e
          A=outils/essai-base-jetable
          cat $A/helpers/correctif-minimal-helpers.sql $A/helpers/usurpation-helpers.sql | psql -X -v ON_ERROR_STOP=1 > "$RUNNER_TEMP/correctif-usurp.txt" 2>&1
          grep -E '^ *[0-9]+ \||HELPERS :|ERROR' "$RUNNER_TEMP/correctif-usurp.txt" | sed 's/  */ /g' > "$RUNNER_TEMP/correctif-usurp-l.txt"
          bash $A/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Helpers corrigés : usurpation" "$RUNNER_TEMP/correctif-usurp-l.txt" 2
          cat $A/helpers/correctif-minimal-helpers.sql $A/preuve-rls.sql | psql -X -v ON_ERROR_STOP=1 > "$RUNNER_TEMP/correctif-rls.txt" 2>&1
          grep -E 'PREUVE RLS|ERROR|ÉCHEC' "$RUNNER_TEMP/correctif-rls.txt" | sed 's/  */ /g' > "$RUNNER_TEMP/correctif-rls-l.txt"
          bash $A/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Helpers corrigés : non-régression RLS" "$RUNNER_TEMP/correctif-rls-l.txt" 1
          propre=$(psql -X -tA -c "select array_to_string(proconfig, ',') from pg_proc where proname = 'current_employee_site_id'")
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Helpers corrigés : état après annulation::current_employee_site_id $propre"
          exit 0

      # --- Arbitrage du 17/10/2026, décision 1 : Journal Piste request-3 ---
      # Les mutants passent AVANT l'application réelle : chacun est joué dans
      # une transaction annulée, sur la base telle que l'historique l'a laissée.
      - name: "Journal Piste, mutants de la migration candidate"
        shell: bash
        run: |
          set -uo pipefail
          J=outils/essai-base-jetable/journal-piste
          python3 $J/mutants.py $J/migration-request-3.sql "$RUNNER_TEMP/mutants" $J/migration-request-2.sql
          bash $J/corriger-preuve.sh $J/preuve-request-3.sql "$RUNNER_TEMP/preuve-corrigee.sql"
          # Deux preuves : l'originale de request-3, puis sa variante corrigée
          # (LIKE échappé). Chacune est jugée contre son propre témoin.
          for variante in originale corrigee; do
            if [ $variante = originale ]; then P=$J/preuve-request-3.sql; else P="$RUNNER_TEMP/preuve-corrigee.sql"; fi
            bash $J/jouer-mutants.sh "$RUNNER_TEMP/mutants" "$P" "$RUNNER_TEMP/mutants-$variante.jsonl" > /dev/null
            jq -r '"\(.nom) => \(.verdict) [\(.cas)]"' "$RUNNER_TEMP/mutants-$variante.jsonl" > "$RUNNER_TEMP/mutants-$variante.txt"
            bilan=$(jq -sc 'group_by(.verdict) | map({(.[0].verdict): length}) | add' "$RUNNER_TEMP/mutants-$variante.jsonl")
            echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : bilan des mutants (preuve $variante)::$bilan"
            bash outils/essai-base-jetable/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : mutants (preuve $variante)" "$RUNNER_TEMP/mutants-$variante.txt" 4
          done

      - name: "Journal Piste, migration candidate et preuve (avant, application, après)"
        shell: bash
        run: |
          set -uo pipefail
          J=outils/essai-base-jetable/journal-piste
          S="$RUNNER_TEMP/candidat"
          bilan=$(bash $J/rejouer-candidat.sh $J/migration-request-3.sql $J/preuve-request-3.sql "$S")
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : bilan request-3::$bilan"
          bash outils/essai-base-jetable/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : cas KO" "$S/cas-ko.txt" 2
          bash outils/essai-base-jetable/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : droits ajoutés" "$S/droits-ajoutes.txt" 5
          bash outils/essai-base-jetable/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : droits retirés" "$S/droits-retires.txt" 1
          # Postconditions de planification, mesurées et non supposées.
          cron=$(psql -X -tA -c "select json_build_object(
            'jobs_journal_piste', (select count(*) from cron.job where jobname = 'nexus-journal-piste'),
            'utilisateur', (select username from cron.job where jobname = 'nexus-journal-piste'),
            'actif', (select active from cron.job where jobname = 'nexus-journal-piste'),
            'authenticated_usage_cron', has_schema_privilege('authenticated', 'cron', 'usage'),
            'anon_usage_cron', has_schema_privilege('anon', 'cron', 'usage'))" 2>&1)
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : planification::$cron"
          grep -q '"migration":"appliquee"' <<<"$bilan" || echo "::warning title=[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste::migration non appliquée, voir le bilan"
          # Même base, preuve corrigée (LIKE échappé). Le shell d'Actions tourne
          # avec -e : une preuve KO (code non nul) ne doit pas couper l'étape
          # avant que son résultat soit publié.
          set +e
          bash $J/corriger-preuve.sh $J/preuve-request-3.sql "$RUNNER_TEMP/preuve-corrigee.sql" > /dev/null
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/preuve-corrigee.sql" > "$S/preuve-corrigee.txt" 2>&1; code=$?
          ok=$(grep -cE '\| OK$' "$S/preuve-corrigee.txt"); ko=$(grep -E '\| KO$' "$S/preuve-corrigee.txt" | sed 's/  */ /g' | paste -sd ';' -)
          echo "::notice title=[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : preuve corrigée après application::code=$code cas_ok=$ok cas_ko=[$ko]"
          grep -E 'ERROR' "$S/preuve-corrigee.txt" | head -n 3 > "$S/preuve-corrigee-erreurs.txt"
          bash outils/essai-base-jetable/annoter.sh "[${{ matrix.source }}/${{ matrix.socle }}] Journal Piste : erreurs de la preuve corrigée" "$S/preuve-corrigee-erreurs.txt" 1
          exit 0

      - name: Jeter la base
        if: always()
