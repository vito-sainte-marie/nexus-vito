# NEXUS — suite de non-régression (04/09/2026).
#
# CE WORKFLOW NE DÉPLOIE RIEN. Il exécute uniquement les tests, à chaque
# push et sur chaque pull request. C'est la première marche de
# l'architecture Test/Production : avoir un filet AVANT d'automatiser quoi
# que ce soit.
#
# Contexte : jusqu'ici il n'existait aucun workflow, et GitHub Pages servait
# `main` directement — pousser revenait donc à déployer en production sans
# qu'aucun test n'ait été exécuté ailleurs que sur le poste du développeur.
#
# Attention en lisant le résultat : 8 tests échouent déjà indépendamment de
# toute modification (inventaire ×4, réception ×2, pilotage ×1). Ils sont
# listés ci-dessous et tolérés tant qu'ils ne sont pas repris.
# Le workflow échoue si un AUTRE test casse, ou si l'un de ces 8 est réparé
# sans mettre la liste à jour — un garde-fou volontairement strict, pour que
# la dette reste visible plutôt que de s'installer.
#
# ─── DEUX RÉSULTATS, PAS UN SEUL (15/09/2026) ──────────────────────────────
# Les deux épreuves du rail de déploiement vivent sous `.github/deploiement/`
# et NON à la racine. Elles ne sont donc pas ramassées par `run-tests.js`, qui
# n'inspecte que la racine — c'est voulu, et c'est ce qui rend son compte
# comparable à celui de `production` : même ensemble de fichiers, même base.
#
# Elles sont lancées ici comme deux étapes DÉDIÉES et BLOQUANTES. Deux raisons
# de ne pas les fondre dans la suite métier :
#   · un échec d'infrastructure ne doit pas se lire comme une régression
#     métier, ni se cacher derrière la liste des 8 échecs tolérés ;
#   · la suite métier tourne en `continue-on-error` — un échec d'infrastructure
#     noyé dedans ne ferait rien échouer du tout. Ici, il arrête la CI.
# Aucune tolérance, aucun échec connu : ces deux épreuves sont vertes ou la
# branche ne passe pas.
name: Tests

# Aucun secret n'est référencé, et le jeton n'a que la lecture du dépôt :
# ce workflow ne peut ni écrire dans le dépôt, ni publier, ni atteindre quoi
# que ce soit hors de la machine de build. Les tests sont purement locaux —
# aucun n'ouvre de connexion réseau ni ne parle à Supabase (vérifié).
permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  non-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Cohérence des épingles de cache
        env:
          NEXUS_ENV: test
          NEXUS_SUPABASE_URL: https://udljdqxerrbbbajxubfn.supabase.co
          NEXUS_SUPABASE_ANON_KEY: sb_publishable_essai0000000000
        run: bash outils/build.sh

      - name: Suite de non-régression
        id: suite
        run: node run-tests.js | tee /tmp/sortie.txt
        continue-on-error: true

      - name: Comparer aux échecs connus
        run: |
          set -euo pipefail
          CONNUS="test_inventaire_categorie_mixte_deux_lieux.js
          test_inventaire_production_journaliere_q1.js
          test_inventaire_sprint4_ux_flash.js
          test_inventaire_sprint4bis_ecriture_immediate.js
          test_pilotage_qualite_receptions.js
          test_reception_moteur.js
          test_reception_v1_dom.js"
          ACTUELS=$(grep -oE 'test_[a-z0-9_]+\.js' /tmp/sortie.txt | sort -u || true)
          ATTENDUS=$(echo "$CONNUS" | sed 's/^ *//' | sort -u)
          NOUVEAUX=$(comm -13 <(echo "$ATTENDUS") <(echo "$ACTUELS") || true)
          REPARES=$(comm -23 <(echo "$ATTENDUS") <(echo "$ACTUELS") || true)
          if [ -n "$NOUVEAUX" ]; then
            echo "::error::Nouveaux tests en échec :"; echo "$NOUVEAUX"; exit 1
          fi
          if [ -n "$REPARES" ]; then
            echo "::error::Ces tests ne sont plus en échec — retirez-les de la liste des échecs connus :"; echo "$REPARES"; exit 1
          fi
          echo "Aucune régression : seuls les $(echo "$ATTENDUS" | wc -l | tr -d ' ') échecs connus subsistent."

      - name: Simulations métier
        run: npm run simulations --silent

      # ─── Épreuves d'infrastructure — résultat séparé, bloquant ───────────
      # Pas de `continue-on-error` : ces trois étapes échouent la CI d'emblée.
      - name: 'Infrastructure — empreinte de l''artefact'
        run: node .github/deploiement/test_empreinte_artefact_20260915.js

      - name: 'Infrastructure — garde de l''artefact Pages'
        run: node .github/deploiement/test_verifier_artefact_pages_20260915.js

      # Le workflow de Production se déclenche aussi sur `pull_request`, pour
      # que l'artefact soit mesuré avant la fusion. Cette épreuve relit le YAML
      # réel et calcule que la condition du job `deployer` ne peut pas être
      # satisfaite par un tel événement.
      - name: 'Infrastructure — un `pull_request` ne peut pas déployer'
        run: node .github/deploiement/test_garde_deployer_20260915.js

      # ─── Guardian Philosophie NEXUS — RAPPORT, jamais une barrière ────────
      # `decision-1.md` du lot NEXUS-ORCHESTRATION-GUARDIANS-1-20260907 (Q75)
      # l'a arbitré CONSULTATIF : jamais bloquant tant qu'il dépend d'un
      # jugement de modèle. Le `|| true` n'est donc pas une tolérance concédée
      # faute de mieux, c'est sa doctrine qui l'impose.
      #
      # Il ne note personne : il nomme les sections titrées dont la
      # disparition est ambiguë — « vérifié, rien à signaler » ou « pas
      # vérifié » ? — et rappelle les neuf critères au relecteur.
      #
      # Son épreuve propre n'a PAS d'étape ici, et c'est délibéré :
      # `test_guardian_philosophie_20260908.js` est à la racine, donc
      # `run-tests.js` la ramasse, et « Comparer aux échecs connus » est
      # stricte dans les deux sens — si elle cassait, elle sortirait en
      # NOUVEAUX et arrêterait la CI. Une seconde étape ne la rendrait pas
      # plus bloquante, elle ferait un deuxième endroit à maintenir.
      - name: Guardian Philosophie NEXUS — rapport
        run: node outils/guardian-philosophie.js || true
