# NEXUS — suite de non-régression (04/09/2026).
#
# CE WORKFLOW NE DÉPLOIE RIEN. Il exécute uniquement les tests, à chaque
# push et sur chaque pull request. C'est la première marche de
# l'architecture Test/Production : avoir un filet AVANT d'automatiser quoi
# que ce soit.
#
# Contexte : jusqu'ici il n'existait aucun workflow, et GitHub Pages servait
# `main` directement — pousser revenait donc à déployer en production sans
# qu'aucun test n'ait été exécuté ailleurs que sur le poste du développeur.
#
# Attention en lisant le résultat : 9 tests échouent déjà indépendamment de
# toute modification (inventaire ×5, réception ×2, carburant ×1, pilotage
# ×1). Ils sont listés ci-dessous et tolérés tant qu'ils ne sont pas repris.
# Le workflow échoue si un AUTRE test casse, ou si l'un de ces 9 est réparé
# sans mettre la liste à jour — un garde-fou volontairement strict, pour que
# la dette reste visible plutôt que de s'installer.
name: Tests

# Aucun secret n'est référencé. Les tests sont purement locaux — aucun n'ouvre
# de connexion réseau ni ne parle à Supabase (vérifié).
#
# Les trois permissions ci-dessous sont le périmètre EXACT du jeton. Chacune a
# été accordée nommément par un humain, à une date, pour un usage écrit en
# toutes lettres, et aucune n'ouvre : pousser sur `main` ou `production`,
# déployer, atteindre Supabase, ni lire un secret.
# `actions: read` AUTORISÉ PAR FRÉDÉRIC BRAGANCE LE 08/09/2026, à sa demande
# explicite. C'est un élargissement de la surface du jeton du workflow, donc un
# geste humain (CLAUDE.md) : Claude ne pouvait pas se l'accorder.
#
# Ce qu'il ouvre exactement : la LECTURE des métadonnées de runs GitHub Actions
# de ce dépôt. Aucune écriture, aucun accès à un secret. Le dépôt étant public,
# ces métadonnées sont déjà lisibles publiquement ; ce que la permission change
# est que le jeton du workflow peut les demander, ce qu'il ne pouvait pas faire.
#
# Pourquoi elle est nécessaire : `evenementsAgentGithub` interroge les runs du
# workflow `claude.yml` pour combler l'angle mort entre le déclenchement de
# Claude depuis une issue et son apparition dans le Handoff. Sans ce droit,
# `gh run list` échoue et la fonction se tait — comportement volontaire, mais
# NEXUS Live restait aveugle pendant cet intervalle, parfois des heures.
# `issues: write` AUTORISÉ PAR FRÉDÉRIC BRAGANCE LE 26/09/2026, à sa demande
# explicite (« GO pour `issues: write` dans tests.yml »). C'est un élargissement
# de la surface du jeton, donc un geste humain (CLAUDE.md) : Claude ne pouvait
# pas se l'accorder — il en avait pourtant la capacité technique, le scope
# `workflow` suffisant à éditer ce fichier. Il ne se l'est pas accordé.
#
# Ce qu'elle ouvre exactement : ÉCRIRE un commentaire sur une issue de ce dépôt.
# Aucune écriture dans le dépôt, aucun accès à un secret, aucun droit sur `main`
# ni `production`, aucun déploiement.
#
# Pourquoi elle est nécessaire : le résumé de job PRÉPARE le réveil, il ne le
# porte pas — il faut que quelqu'un aille l'y lire. Le sens Claude →
# Orchestrateur restait donc suspendu à un geste humain, quand le sens inverse
# était automatique depuis le 06/09. C'est cette asymétrie que la permission
# supprime, et rien d'autre.
#
# `contents: write` AUTORISÉ PAR FRÉDÉRIC BRAGANCE LE 30/09/2026, à sa demande
# explicite (« GO pour armer uniquement le transport déterministe Claude → rail
# […] Autorisation limitée à contents: write strictement nécessaire au
# rapatriement vers handoff-continuite-20260920, avec NEXUS_RAPATRIEMENT_ARME=oui »).
# Troisième élargissement de la surface du jeton, donc un geste humain
# (CLAUDE.md) : Claude ne pouvait pas se l'accorder — il en avait la capacité
# technique pour les trois, et ne s'en est accordé aucune.
#
# Ce qu'elle ouvre exactement : un `git push` depuis la CI vers une branche de
# ce dépôt. Rien d'autre — aucun secret, aucun déploiement, aucun Supabase.
#
# CE QU'ELLE N'AUTORISE PAS, dans les mots mêmes de l'autorisation : « ni
# push/merge Production, ni déploiement Production, ni écriture Supabase
# Production, ni affaiblissement d'une garde. » Ces interdits ne tiennent pas à
# la permission — GitHub, lui, laisserait passer — mais à l'outil qui s'en sert :
# `outils/transport-autorise.js` ne reconnaît qu'un rail DÉSIGNÉ par Frédéric
# dans le commentaire déclencheur, `outils/qualifier-rapatriement.js` refuse
# `main`, `production`, tout diff qui touche Production et tout diff qui
# affaiblit une garde, et le transport n'a lieu que si la variable de dépôt
# `NEXUS_RAPATRIEMENT_ARME` vaut `oui`. UNE CAPACITÉ CONSTATÉE N'EST JAMAIS UNE
# AUTORISATION : cette ligne donne la capacité, l'autorité reste ailleurs, et
# elle doit y rester même si une permission technique s'élargit encore.
#
# Pourquoi elle est nécessaire : sans elle, le dernier maillon de la chaîne
# Handoff s'arrêtait en `HUMAN_DECISION_REQUIRED / TRANSPORT_NON_ARME`. Le
# travail de Claude restait sur sa branche de run et attendait que Frédéric
# fasse le fast-forward à la main — c'est la rupture silencieuse que la mission
# du 30/09/2026 nomme. Cette permission ferme ce maillon, et lui seul.
#
# Second usage de `contents: write`, stade (a) de l'arbitrage autonome :
# AUTORISÉ PAR FRÉDÉRIC BRAGANCE LE 09/10/2026 (« autorise le stade (a) »).
# Aucune permission nouvelle. L'étape « matérialisation de la décision »
# pousse la décision de l'arbitre sur le rail Handoff du lot — `handoff-*`
# seulement, jamais `main` ni `production`, sans force — derrière la variable
# `NEXUS_MATERIALISATION_CI=arme`, que seul Frédéric pose.
permissions:
  contents: write
  actions: read
  issues: write

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  non-regression:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` récupère tout l'historique, branche `production`
      # comprise : le contrôle d'immuabilité des migrations la compare à la
      # branche courante. Sans elle, il ne peut pas savoir quelles migrations
      # sont déjà appliquées en production — et il échoue plutôt que de se
      # taire.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0


      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # Aucune résolution de rail ici, volontairement. Une étape « Résoudre le
      # rail Handoff de ce run » devinait le rail depuis la ref du run et
      # l'écrivait dans $GITHUB_ENV, parce que `outils/handoff.js` lisait
      # alors le rail dans l'environnement. C'était un colmatage : il ne
      # pouvait avoir raison que lorsque le run tournait déjà SUR le rail, et
      # retombait silencieusement sur `config-par-environnement` partout
      # ailleurs — y compris sur les branches de PR, où la suite rejetait
      # ensuite les enveloppes du rail qu'elle venait de quitter.
      #
      # Depuis le 21/09/2026, le rail de chaque lot est déclaré dans
      # docs/handoff/STATE.json (`lots[LOT].rail`) et lu là. Le verdict du
      # validateur ne dépend donc plus de la branche sur laquelle ce workflow
      # s'exécute : il est le même ici, en local et dans un worktree. Ne pas
      # réintroduire de variable de rail dans ce fichier ; le rail se change
      # par `node outils/handoff.js declarer-rail <LOT_ID> <rail>`, qui
      # l'inscrit au registre.

      # LE MÊME DÉFAUT, UN CRAN PLUS BAS — ET CELUI-CI NE ROUGISSAIT PAS.
      #
      # 22/09/2026. Cinq étapes de ce workflow — connexion PostgreSQL Test,
      # semis Carburants, journal Live, installation Playwright, recette
      # navigateur — étaient conditionnées à
      # `github.ref == 'refs/heads/config-par-environnement'`, c'est-à-dire au
      # nom gelé écrit en dur. Le jour où le travail a changé de rail, elles
      # ont cessé de s'exécuter. Aucune alerte : `skipped` n'est pas `failure`,
      # et un run où les cinq preuves les plus profondes sont sautées se
      # termine vert. Mesure du 22/09 sur le run 35729983375 (b9ffd78, rail,
      # succès) : les cinq étapes y sont `skipped`.
      #
      # La condition ne nomme plus une branche : elle demande au registre quel
      # est le rail, et compare. `NEXUS_REF_EST_LE_RAIL` est un booléen, pas un
      # nom de branche — il ne peut pas être confondu avec une désignation de
      # rail ni servir à en fabriquer une, ce que la note ci-dessus interdit.
      # La comparaison porte sur `GITHUB_REF` et non sur `head_ref`, pour
      # conserver exactement le périmètre d'avant : ces étapes écrivent sur
      # Supabase Test, elles s'exécutent sur le push du rail, jamais sur une PR.
      - name: Situer ce run par rapport au rail déclaré au registre
        shell: bash
        run: |
          set -uo pipefail
          rail="$(node outils/handoff.js rail 2>/dev/null || true)"
          if [[ -z "$rail" ]]; then
            echo "::warning::Rail Handoff illisible au registre — les étapes réservées au rail sont ignorées. Ce n'est pas un repli sur une branche devinée : sans désignation lisible, on ne prétend pas savoir."
            echo "NEXUS_REF_EST_LE_RAIL=0" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$GITHUB_REF" == "refs/heads/$rail" ]]; then
            echo "NEXUS_REF_EST_LE_RAIL=1" >> "$GITHUB_ENV"
            echo "Ce run pousse le rail déclaré ($rail) : les étapes qui lui sont réservées s'exécutent."
          else
            echo "NEXUS_REF_EST_LE_RAIL=0" >> "$GITHUB_ENV"
            echo "Rail déclaré : $rail — ref de ce run : $GITHUB_REF. Étapes réservées au rail ignorées."
          fi

      # `nexus-build.js` n'est plus versionné : le vérifier sur le dépôt brut
      # n'aurait plus de sens. Ce test exécute la VRAIE chaîne de build dans
      # une copie jetable, puis éprouve chaque condition d'échec — commit
      # indéterminable, épingle falsifiée, actif modifié après le build. Il
      # échoue si le build accepte de publier une version non identifiable.
      # Barrière avant promotion : une migration appliquée en production est
      # immuable dans son identité. Ce contrôle ne dépend d'aucun secret — il
      # compare la branche `production` à la branche courante — et il aurait
      # arrêté le renommage du 04/09 (commit 95cc92a) avant le push.
      - name: Immuabilité des migrations déjà en production
        run: node test_migrations_immuables_20260905.js

      - name: Traçabilité de la génération (chaîne de build complète)
        run: node test_build_tracabilite_20260905.js

      # UNE SEULE EXÉCUTION, UN SEUL PROPRIÉTAIRE. La liste des échecs tolérés
      # était figée ici, en dur, ET reconstruite à la main hors du dépôt à
      # chaque session locale. Deux copies d'une même vérité, dont une
      # invisible depuis le poste de travail : c'est toujours celle qu'on
      # oublie qui se met à mentir. Elle vit désormais dans
      # `docs/qa/ECHECS-CONNUS.json`, et `run-tests.js` en est le seul lecteur.
      #
      # Le verdict est rendu par le lanceur lui-même, dans la même exécution
      # que la suite : il distingue une RÉGRESSION, une épreuve GUÉRIE qu'il
      # faut retirer de la liste, une entrée qui ne correspond plus à aucun
      # fichier, et une référence illisible — cas où il refuse de conclure
      # plutôt que d'annoncer « aucune régression ».
      - name: Suite de non-régression et verdict
        run: node run-tests.js

      # La parallélisation a fait passer la suite de 60 s à 25 s. Le gain ne
      # vaut que si les deux modes disent la même chose : cette épreuve le
      # vérifie sur un sous-ensemble rapide, plutôt que de rejouer la suite
      # entière deux fois — une garde trop chère finit par être retirée.
      - name: Le lanceur parallèle rend-il le même verdict ?
        run: node test_lanceur_parallele_20260908.js

      # Le protocole de handoff est le dernier contrat du dispositif qui ne
      # tenait que par la discipline de ses acteurs. Il est désormais validé
      # ici, comme le reste. `fetch-depth: 0` ci-dessus rend `origin/main` et
      # `origin/production` lisibles : sans elles, l'invariant de protection
      # des refs serait invérifiable, ce que le validateur traite comme un
      # échec et non comme une tolérance.
      # ENV-001 — « Claude doit partir du HEAD canonique attendu de
      # config-par-environnement ». Le 07/09/2026, trois runs ont terminé « avec
      # succès » sur des branches racinées sur main, et rien ne l'a dit. La cause
      # est corrigée (base_branch sur claude-code-action) ; cette étape surveille
      # que la correction tienne, comme l'audit du 07/09 le demande au §12.1.
      #
      # Exclue sur main et production : ces branches ne descendent pas du canon
      # et ne sont pas censées le faire. Un contrôle qui échouerait là serait un
      # faux positif permanent, donc une étape qu'on finirait par retirer.
      #
      # `--tolerer-retard` : un travail dépassé par le canon pendant son
      # exécution est signalé, pas bloqué. La racine sur la branche par défaut,
      # elle, bloque toujours — c'est le défaut que cette garde existe pour voir.
      - name: ENV-001 — la branche part-elle du HEAD canonique
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production'
        run: node outils/garde-env-001.js --tolerer-retard

      - name: Épreuves mutationnelles de la garde ENV-001
        run: node test_garde_env_001_20260907.js

      - name: Protocole Handoff v2
        env:
          NEXUS_SORTIE_SUITE: /tmp/sortie.txt
        run: node outils/handoff.js verifier

      - name: Épreuves mutationnelles du validateur Handoff
        run: node test_handoff_v2_20260905.js

      # 25/09/2026 — LE TRANSPORT DU RÉVEIL, sens Claude → Orchestrateur.
      # Trois maillons sur quatre existaient : la demande se dépose, le réveil
      # la détecte, et il sait désormais l'adresser. Le quatrième — quelque
      # chose qui PORTE le réveil hors du dépôt — n'existait pas, et l'outil le
      # disait lui-même en tête de fichier. Le publier en commentaire d'issue
      # exigerait `issues: write`, c'est-à-dire un élargissement de la surface
      # du jeton : un geste humain que je ne peux pas m'accorder (CLAUDE.md).
      # Le résumé de job, lui, est une simple écriture de fichier — AUCUNE
      # permission supplémentaire — et c'est l'endroit où l'on regarde déjà
      # quand un run se termine.
      #
      # Ce n'est donc PAS un réveil automatique, et il ne doit être présenté
      # nulle part comme tel : c'est le geste humain rendu court et exact, le
      # corps à coller étant déjà rédigé et déjà adressé. Aucun destinataire
      # n'est écrit ici : `wake_to` se déclare dans le rail, jamais dans du
      # code (PROTOCOL.md), et NEXUS_HANDOFF_WAKE_TO n'a rien à faire dans un
      # workflow. Si le lot n'a pas d'adresse, le corps le dit et refuse de
      # nommer quelqu'un au hasard.
      #
      # `always()` parce qu'un rail rouge est précisément le moment où un
      # arbitrage manque le plus : le réveil ne doit pas disparaître avec la
      # première étape qui échoue.
      - name: Réveil Orchestrateur — corps à coller (résumé de job)
        if: always()
        run: |
          {
            echo "## Réveil Handoff — sens Claude → Orchestrateur"
            echo
            echo "À coller tel quel au destinataire nommé ci-dessous. Rien ne le publie : NEXUS prépare le message, le facteur le transmet."
            echo
            echo '````text'
            node outils/reveil-orchestrateur.js --message
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      # 26/09/2026 — LA PUBLICATION DU RÉVEIL, avec `issues: write`.
      #
      # Quatre refus AVANT d'écrire, parce qu'une permission d'écriture sans
      # conditions est une permission qui écrit n'importe quand. Ce workflow
      # tourne sur TOUTES les branches (`push: branches: ['**']`) : sans ces
      # refus, chaque push de chaque branche posterait un commentaire.
      #
      #   1. rien à réveiller → on se tait ;
      #   2. la ref courante ne PORTE pas la demande à réveiller → une branche
      #      étrangère au lot ne réveille personne ;
      #   3. l'adresse n'est pas déclarée PAR LE RAIL → on ne poste jamais « au
      #      hasard ». Aucun destinataire n'est écrit ici : `wake_to` se déclare
      #      dans le rail, jamais dans du code (PROTOCOL.md) ;
      #   4. le même réveil est déjà publié → un réveil identique répété à
      #      chaque push n'est plus un réveil, c'est du bruit.
      #
      # Et une garde de BOUCLE, qui elle fait ÉCHOUER l'étape au lieu de se
      # taire : `claude.yml` se déclenche sur tout commentaire portant la
      # mention `@`+`claude`, sans filtre d'auteur. Un réveil publié qui la
      # porterait relancerait Claude → push → CI → nouveau réveil → sans fin.
      # Seule une propriété de plateforme l'empêche aujourd'hui (GitHub
      # n'enchaîne pas les workflows déclenchés par `github.token`) : invisible,
      # et qui tombe le jour où quelqu'un pose un PAT. On ne s'y adosse pas.
      #
      # 30/09/2026 — POURQUOI LE REFUS 2 NE DIT PLUS « sois le rail ».
      #
      # Il l'a dit du 26 au 30/09, et pendant ces quatre jours le sens
      # Claude → Orchestrateur n'est jamais parti seul. Mesure : les quatre
      # réveils publiés sur l'issue suivent chacun une poussée du rail faite à
      # la main, à la minute près. Les runs de `claude.yml`, eux, poussent
      # `claude/issue-28-<date>-<heure>`, que personne ne rapatrie. Le journal
      # du run 36726151526 le dit mot pour mot : « Pas de publication :
      # exécution sur 'claude/issue-28-20260930-1349', rail déclaré
      # 'handoff-continuite-20260920'. » Le dernier maillon de la boucle était
      # accroché à une ref que le seul agent censé le franchir n'écrit jamais :
      # elle ne pouvait se refermer que par un geste humain. C'est l'état que
      # Frédéric a constaté le 30/09 — zéro workflow en vol, et personne pour
      # dire pourquoi.
      #
      # Le refus ne s'ouvre pas pour autant, il change de question : non plus
      # « t'appelles-tu le rail ? », mais « portes-tu les octets de la demande
      # que ce réveil annonce ? ». C'est `refs_reelles.memes`, que l'outil
      # calcule déjà en comparant les BLOBS, jamais les noms. Une ref qui ne
      # porte pas le document du tout n'y figure pas, et se tait : mesuré le
      # 30/09, `main`, `production` et `rebuild/carburants-65-20260922` n'ont
      # pas `request-18.md`. Les branches de run des autres lots non plus.
      #
      # Ce que ce refus ne fait PAS, et qu'il ne faut pas lui prêter : trier
      # entre deux versions du document. L'empreinte est prise sur la copie du
      # CHECKOUT ; la ref courante s'y compare donc à elle-même et ne peut pas
      # être son propre homonyme. `homonymes` classe les AUTRES refs, pour
      # l'avertissement du corps. Une branche qui porterait une demande
      # divergente réveillerait donc bien — en annonçant sa propre version, et
      # le corps nomme la branche où la lire. C'est le comportement voulu : le
      # réveil dit « il y a ceci à lire, ici », il n'arbitre pas.
      #
      # Et si l'empreinte n'est pas calculable, `memes` ne distingue plus rien :
      # on se tait aussi.
      #
      # Ce que ce refus ne prétend PAS être : un rapatriement. Les branches de
      # run continuent de s'accumuler sans être fusionnées — c'est une dette de
      # gouvernance identifiée, elle appartient à Frédéric. On répare le canal
      # de réveil, pas la politique de fusion.
      - name: Réveil Orchestrateur — publication au destinataire déclaré
        id: publication_reveil
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # §4 — AUCUN REFUS SILENCIEUX. Jusqu'ici ce refus écrivait une phrase
          # au journal et sortait en 0 : le run restait vert, et personne ne
          # pouvait savoir, sans ouvrir le journal d'une étape parmi soixante,
          # que le réveil n'était pas parti. Quatre jours d'arrêt se sont logés
          # exactement là.
          #
          # Deux régimes, et la différence porte tout :
          #   refus  -> NO_WORK  : il n'y a légitimement rien à faire. Ce run
          #                        n'est pas sur la branche porteuse, ou le
          #                        réveil est déjà publié. Ce n'est pas un
          #                        incident, et en faire un rouge apprendrait
          #                        à l'équipe à ignorer le rouge.
          #   arret  -> BLOCKED  : quelque chose attend et n'avancera pas seul.
          #                        Exige les six champs : condition, sha,
          #                        branche, lot, maillon, prochaine action.
          # Les deux sortent en 0. La couleur n'est pas le signal — l'état l'est.
          M=reveil-orchestrateur
          refus() { node outils/etat-maillon.js NO_WORK "$1" --maillon "$M" --motif "$2"; exit 0; }
          arret() {
            node outils/etat-maillon.js BLOCKED "$1" --maillon "$M" \
              --condition "$2" --prochaine-action "$3" \
              --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "${GITHUB_REF_NAME:-(branche non lisible)}" \
              --lot "${LOT:-(lot non lisible)}"
            exit 0
          }

          J=$(node outils/reveil-orchestrateur.js --json)
          LOT=$(jq -r '.lots[0].lot // .lot // empty' <<<"$J")
          [ "$(jq -r '.reveil' <<<"$J")" = "true" ] \
            || refus RIEN_A_REVEILLER "aucune demande en vol : le rail est au repos."

          RAIL=$(jq -r '.lots[0].branche // empty' <<<"$J")
          [ -n "$RAIL" ] || arret LOT_SANS_BRANCHE \
            "le lot déclare la branche où le lire" \
            "déclarer la branche du lot au registre du Handoff"

          # Sans empreinte, tout ce qui porte le NOM du fichier entre dans
          # `memes` : un homonyme parlerait pour le lot. On se tait.
          [ "$(jq -r '.lots[0].refs_reelles.identifiable' <<<"$J")" = "true" ] \
            || arret DEMANDE_NON_IDENTIFIABLE \
                 "la demande est identifiable par empreinte, pas seulement par nom" \
                 "lever l'homonymie : deux fichiers portent ce nom avec des contenus différents"

          # La ref courante doit figurer parmi celles qui PORTENT la demande.
          # `origin/<ref>` compte : c'est sous ce nom que la ref poussée est
          # vue depuis le checkout.
          PORTEUSE=$(jq -r --arg ref "$GITHUB_REF_NAME" \
            '[.lots[0].refs_reelles.memes[]? | select(. == $ref or . == "origin/" + $ref)] | length' \
            <<<"$J")
          [ "$PORTEUSE" != "0" ] \
            || refus REF_NON_PORTEUSE \
                 "'$GITHUB_REF_NAME' ne porte pas la demande du lot (rail déclaré : '$RAIL')."

          ADRESSE=$(jq -r '.lots[0].adresse // empty' <<<"$J")
          [ -n "$ADRESSE" ] || arret RAIL_SANS_ADRESSE \
            "le rail déclare l'adresse où publier le réveil" \
            "déclarer l'adresse du destinataire au registre du Handoff"
          case "$ADRESSE" in
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/"[0-9]*) : ;;
            *) arret ADRESSE_HORS_DEPOT \
                 "l'adresse déclarée appartient à ce dépôt" \
                 "corriger l'adresse au registre : « $ADRESSE » sort de $GITHUB_REPOSITORY" ;;
          esac
          NUM=${ADRESSE##*/}

          CORPS=$(node outils/reveil-orchestrateur.js --message --sans-mention)
          # Le seul rouge de cette étape, et il le mérite : publier ce corps
          # relancerait Claude sur son propre réveil. C'est une boucle, pas un
          # arrêt — elle ne se signale pas, elle s'empêche.
          if printf '%s' "$CORPS" | grep -q '@claude'; then
            node outils/etat-maillon.js FAILED MENTION_REDECLENCHANTE --maillon "$M" \
              --condition "le corps du réveil ne porte pas la mention qui relance Claude" \
              --prochaine-action "retirer la mention du gabarit de réveil" \
              --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "${GITHUB_REF_NAME:-(branche non lisible)}" --lot "${LOT:-(lot non lisible)}"
            exit 1
          fi

          # L'historique du canal se lit UNE fois : les deux gardes qui suivent
          # s'y répondent toutes deux, et une page d'API de moins est une panne
          # de moins.
          HISTORIQUE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" --jq '.[].body')

          MARQUE="<!-- nexus-reveil: $(printf '%s' "$CORPS" | sha256sum | cut -c1-16) -->"
          DEJA=$(printf '%s' "$HISTORIQUE" | grep -cF "$MARQUE" || true)
          # `numero` n'est écrit que lorsque le réveil EST sur l'issue : déjà
          # publié, ou publié à l'instant. Le relais vers l'arbitre en dépend ;
          # un réveil non publié ne se relaie pas.
          [ "$DEJA" = "0" ] || echo "numero=$NUM" >> "$GITHUB_OUTPUT"
          [ "$DEJA" = "0" ] || refus REVEIL_DEJA_PUBLIE "ce réveil exact est déjà publié sur $ADRESSE."

          # §11 — UN RÉVEIL NE SE RÉPÈTE PAS SANS PROGRÈS.
          #
          # L'empreinte ci-dessus porte sur le TEXTE : elle ne mord que sur un
          # corps identique au caractère près. Or ce corps liste les refs qui
          # portent la demande. Une ref de plus — une branche de travail créée,
          # par exemple — et le corps est neuf, l'empreinte autre, le même
          # réveil repart : le Handoff, lui, n'a pas bougé d'un octet.
          #
          # L'empreinte de progression porte sur l'ÉTAT. Elle mécanise la règle
          # 11 du skill Fast Track et son PROGRESS_FINGERPRINT, qui n'étaient
          # jusqu'ici que de la prose : aucune fonction, aucune garde, aucune
          # épreuve ne les portait, et GOV-001 dit déjà ce que vaut une règle
          # qui repose sur l'attention de celui qui la lit.
          #
          # `head` est le dernier commit du DOMAINE du handoff, non le SHA du
          # push. Pris au push, il changerait à chaque commit, l'empreinte
          # aussi, et la garde ne mordrait jamais : un commit sur un écran Paye
          # suffirait à feindre un progrès du Handoff. C'est exactement la
          # portée par domaine que PROOF_CACHE applique déjà aux preuves.
          HEAD_HANDOFF=$(git log -1 --format=%H -- docs/handoff || true)
          # ACTION_NEXT, pour un réveil, c'est QUI doit agir et SUR QUOI : le
          # rôle adressé et l'état d'enveloppe attendu. Dès que l'un des deux
          # bouge, l'empreinte bouge — et le réveil repart légitimement.
          EMP=$(printf '%s' "$HISTORIQUE" | node outils/empreinte-progression.js --json \
                  --lot "$LOT" \
                  --request "$(jq -r '.lots[0].demande // empty' <<<"$J")" \
                  --head "${HEAD_HANDOFF:-}" \
                  --gate-state "$(jq -r '.lots[0].statut_registre // empty' <<<"$J")" \
                  --blocker "$(jq -r '.lots[0].motif // empty' <<<"$J")" \
                  --action-next "$(jq -r '.lots[0].adresse_role // empty' <<<"$J") -> $(jq -r '.lots[0].statut_enveloppe // empty' <<<"$J")" \
                  --marques -)
          MARQUE_ETAT=$(jq -r '.marque' <<<"$EMP")
          if [ "$(jq -r '.etat' <<<"$EMP")" = "FAST_TRACK_STALL" ]; then
            # Ici, délibérément, PAS de `numero` : l'écrire relancerait le
            # relais vers l'arbitre sur une question déjà posée dans les mêmes
            # termes. Un STALL arrête la boucle, il ne la nourrit pas.
            arret FAST_TRACK_STALL \
              "un réveil ne se répète pas sans progrès du Handoff" \
              "diagnostiquer la cause technique avant toute relance : empreinte $(jq -r '.empreinte' <<<"$EMP") déjà présente $(jq -r '.anterieures' <<<"$EMP") fois sur $ADRESSE"
          fi

          printf '%s\n\n%s\n%s\n' "$CORPS" "$MARQUE" "$MARQUE_ETAT" \
            | gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file -
          echo "numero=$NUM" >> "$GITHUB_OUTPUT"
          node outils/etat-maillon.js EXECUTE REVEIL_PUBLIE --maillon "$M" \
            --motif "réveil publié sur $ADRESSE" \
            --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "${GITHUB_REF_NAME:-(branche non lisible)}" --lot "${LOT:-(lot non lisible)}"

      # Relais du réveil vers l'arbitre ChatGPT, par l'API OpenAI — câblé le
      # 07/10/2026 sur GO de Frédéric (« GO câblage »), NON ARMÉ.
      #
      # Pourquoi une étape et pas un workflow `issue_comment` : un commentaire
      # posté avec GITHUB_TOKEN ne déclenche aucun autre workflow. Le relais
      # vit donc dans le même job que la publication, juste après elle, et ne
      # tourne que si le réveil est sur l'issue (`numero`).
      #
      # Deux verrous, tous deux humains, aucun posé par Claude :
      #   - secrets.OPENAI_API_KEY          (SECRET_PERMISSION_SURFACE_SECURITE)
      #   - vars.NEXUS_RELAIS_OPENAI=arme   (ARMEMENT_BOUCLE_AU_NOM_DE_FREDERIC)
      # Sans la variable, l'étape est sautée ; sans le secret, le script se tait
      # (« non armé ») et la voie manuelle reste ouverte.
      #
      # Stade (b) : le relais POSTE la réponse, il ne dépose aucune décision.
      # Le stade (a) — AUTORISÉ PAR FRÉDÉRIC BRAGANCE LE 09/10/2026 — est
      # l'étape suivante : elle matérialise la décision quand le contrat est
      # valide. Le relais lui passe deux sorties, `contrat_valide` et
      # `commentaire` (l'URL du commentaire posté), et rien de plus.
      - name: Réveil Orchestrateur — relais vers l'arbitre (API OpenAI)
        id: relais_arbitre
        if: always() && vars.NEXUS_RELAIS_OPENAI == 'arme' && steps.publication_reveil.outputs.numero != ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXUS_RELAIS_OPENAI: ${{ vars.NEXUS_RELAIS_OPENAI }}
          NEXUS_RELAIS_MODELE: ${{ vars.NEXUS_RELAIS_MODELE }}
          NUM: ${{ steps.publication_reveil.outputs.numero }}
        run: |
          set -euo pipefail
          # §4 — aucun refus silencieux, ici non plus : chaque sortie publie
          # son état. NO_WORK quand il n'y a rien à relayer, FAILED (six
          # champs) quand le relais n'a pas pu rendre une réponse exploitable,
          # EXECUTE quand la réponse est postée.
          M=relais-arbitre
          rien() { node outils/etat-maillon.js NO_WORK "$1" --maillon "$M" --motif "$2"; exit 0; }
          echec() {
            node outils/etat-maillon.js FAILED "$1" --maillon "$M" \
              --condition "$2" --prochaine-action "$3" \
              --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "${GITHUB_REF_NAME:-(branche non lisible)}" \
              --lot "${LOT:-(lot non lisible)}"
            exit 1
          }
          LOT=$(node outils/reveil-orchestrateur.js --json | jq -r '.lots[0].lot // .lot // empty')
          # Le corps INTÉGRAL (08/10/2026) : la publication ne poste qu'un
          # pointeur vers le rail, que l'API ne peut pas suivre — elle ne lit
          # pas le dépôt. Déterministe : une marque par corps intégral.
          CORPS=$(node outils/reveil-orchestrateur.js --message --sans-mention --integral)
          # Une seule consultation de l'arbitre par corps de réveil : le coût
          # est borné par le nombre de réveils distincts, pas par les runs.
          MARQUE="<!-- nexus-arbitrage: $(printf '%s' "$CORPS" | sha256sum | cut -c1-16) -->"
          DEJA=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" \
                   --jq '.[].body' | grep -cF "$MARQUE" || true)
          [ "$DEJA" = "0" ] || rien ARBITRAGE_DEJA_RELAYE "ce réveil a déjà été soumis à l'arbitre (issue #$NUM)."
          # Le script lit un texte venu de l'extérieur : il ne tient pas le
          # jeton GitHub. Seule l'étape, après validation, écrit sur l'issue.
          set +e
          printf '%s' "$CORPS" | env -u GH_TOKEN node outils/relais-arbitre-openai.js > reponse.txt
          CODE=$?
          set -e
          [ "$CODE" != "1" ] || echec RELAIS_EN_PANNE \
            "l'API OpenAI rend une réponse à partir du corps du réveil" \
            "lire le journal du run $GITHUB_RUN_ID ; la voie manuelle (coller le réveil dans ChatGPT) reste ouverte"
          # Non armé (secret absent) : rien envoyé, rien à poster.
          [ -s reponse.txt ] || rien RELAIS_NON_ARME "secret OPENAI_API_KEY absent : rien envoyé à l'arbitre."
          # Garde redondante, même règle que la publication du réveil : jamais
          # de mention qui relancerait Claude.
          if grep -qi '@claude' reponse.txt; then
            node outils/etat-maillon.js FAILED MENTION_REDECLENCHANTE --maillon "$M" \
              --condition "la réponse de l'arbitre ne porte pas la mention qui relance Claude" \
              --prochaine-action "recopier la réponse à la main sans la mention, ou relancer l'arbitre" \
              --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "${GITHUB_REF_NAME:-(branche non lisible)}" --lot "${LOT:-(lot non lisible)}"
            exit 1
          fi
          if [ "$CODE" = "2" ]; then
            ENTETE="⚠️ Réponse de l'arbitre NON CONFORME au NEXT_ACTION_CONTRACT : rien ne sera matérialisé. Voir le journal du run $GITHUB_RUN_ID."
          else
            ENTETE="Réponse de l'arbitre (ChatGPT, via l'API, run $GITHUB_RUN_ID). Contrat validé par le relais ; matérialisation par la CI si NEXUS_MATERIALISATION_CI=arme, sinon par Claude."
          fi
          URL_COMMENTAIRE=$(printf '%s\n\n%s\n\n%s\n' "$ENTETE" "$(cat reponse.txt)" "$MARQUE" \
            | gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file -)
          [ "$CODE" = "0" ] || echec CONTRAT_NON_CONFORME \
            "la réponse de l'arbitre porte un NEXT_ACTION_CONTRACT valide" \
            "faire réarbitrer la demande ; la réponse non conforme est postée sur #$NUM, marquée « rien ne sera matérialisé »"
          node outils/etat-maillon.js EXECUTE ARBITRAGE_RELAYE --maillon "$M" \
            --motif "réponse de l'arbitre postée sur l'issue #$NUM" \
            --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "${GITHUB_REF_NAME:-(branche non lisible)}" --lot "${LOT:-(lot non lisible)}"
          { echo "contrat_valide=1"; echo "commentaire=$URL_COMMENTAIRE"; } >> "$GITHUB_OUTPUT"

      # Stade (a) de l'arbitrage autonome — AUTORISÉ PAR FRÉDÉRIC BRAGANCE LE
      # 09/10/2026 (« autorise le stade (a) »). Mesuré sur
      # FAST-TRACK-ROUTAGE-CAPACITES-1 : verdict rendu à 17:57, déposé à la
      # main à 22:44. Le commentaire du relais, posté avec GITHUB_TOKEN, ne
      # réveille personne ; cette étape dépose donc la décision elle-même.
      #
      # Aucune permission nouvelle : c'est un second usage de `contents:
      # write` (30/09/2026), borné de la même façon — un rail `handoff-*`
      # seulement, celui du lot AU REGISTRE et celui du run, jamais `main` ni
      # `production`, push sans force. Un rail qui a avancé pendant le run
      # fait refuser le push : FAILED, et la réponse reste sur l'issue.
      #
      # L'étape ne tient ni GH_TOKEN, ni secret, ni `gh` : le texte venu
      # d'OpenAI n'est lu que par `outils/materialiser-decision-ci.js`, qui
      # n'a aucune voie réseau. Le push passe par les identifiants que
      # `actions/checkout` a laissés dans la configuration git.
      #
      # Ce qu'elle ne fait PAS : vérifier les CONDITIONS du verdict (elles
      # lient l'exécutant suivant, et le corps de la décision le dit), et
      # relancer quoi que ce soit — un push fait avec GITHUB_TOKEN ne
      # déclenche ni la CI ni Claude. Un verdict `closes: false` est déposé
      # sans être consommé : sa consommation revient à l'exécutant.
      #
      # Verrou humain, aucun posé par Claude : vars.NEXUS_MATERIALISATION_CI=arme.
      - name: Réveil Orchestrateur — matérialisation de la décision (stade a)
        id: materialisation
        if: always() && vars.NEXUS_MATERIALISATION_CI == 'arme' && env.NEXUS_REF_EST_LE_RAIL == '1' && steps.relais_arbitre.outputs.contrat_valide == '1'
        timeout-minutes: 5
        env:
          COMMENTAIRE: ${{ steps.relais_arbitre.outputs.commentaire }}
        run: |
          set +e
          set -uo pipefail
          M=materialisation-decision
          B="${GITHUB_REF_NAME:-(branche non lisible)}"
          LOT="(lot non lisible)"
          rien() { node outils/etat-maillon.js NO_WORK "$1" --maillon "$M" --motif "$2"; exit 0; }
          echec() {
            node outils/etat-maillon.js FAILED "$1" --maillon "$M" \
              --condition "$2" --prochaine-action "$3" \
              --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "$B" --lot "$LOT"
            exit 1
          }
          # Un verdict qui revient à un humain n'est pas une panne : la chaîne
          # s'arrête, le texte de l'arbitre reste posté, et la CI ne rougit pas.
          palier() {
            node outils/etat-maillon.js HUMAN_DECISION_REQUIRED "$1" --maillon "$M" \
              --motif "$2" --condition "$3" --prochaine-action "$4" \
              --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "$B" --lot "$LOT"
            exit 0
          }
          A_LA_MAIN="matérialiser à la main la réponse postée sur $COMMENTAIRE (handoff.js decision --auteur ChatGPT)"
          REPONSE="$GITHUB_WORKSPACE/reponse.txt"
          CORPS_DECISION="$RUNNER_TEMP/corps-decision.md"
          WT="$RUNNER_TEMP/rail-materialisation"
          # La tête du rail, pas le SHA du run : le registre a pu avancer. Dans
          # `origin/$B` et non FETCH_HEAD, parce que handoff.js résout le rail
          # par ce nom ; `main` et `production`, qu'il résout aussi, sont déjà
          # là (checkout en fetch-depth 0).
          git fetch --quiet origin "+refs/heads/$B:refs/remotes/origin/$B" \
            || echec RAIL_ILLISIBLE "la tête du rail $B se lit depuis origin" "$A_LA_MAIN"
          git worktree add --quiet --detach "$WT" "refs/remotes/origin/$B" \
            || echec RAIL_ILLISIBLE "la tête du rail $B s'extrait dans un worktree" "$A_LA_MAIN"
          cd "$WT"
          # La tête du rail à cet instant. Vide si git a échoué : l'outil se
          # ferme alors au lieu de laisser passer (une garde privée de sa
          # donnée ne garde rien), et le refus le nomme.
          TETE_RAIL=$(git rev-parse HEAD)
          JUGEMENT=$(node outils/materialiser-decision-ci.js --reponse "$REPONSE" --sortie "$CORPS_DECISION" \
            --rail-du-run "$B" --sha-du-run "${GITHUB_SHA:-}" --sha-du-rail "$TETE_RAIL" \
            --run "$GITHUB_RUN_ID" --commentaire "$COMMENTAIRE")
          CODE=$?
          [ "$CODE" != "3" ] || rien DECISION_DEJA_MATERIALISEE "$JUGEMENT"
          # Code 4 : `DECISION: BLOCKED`, `OWNER_NEXT: Frédéric` ou un
          # `STOP_REQUIRED` renseigné. `request-1.md` du lot
          # ARMEMENT-ARBITRAGE-AUTONOME-1-20261008 l'écrivait — « ces décisions
          # restent à un humain, elles sont seulement postées » — et rien ne le
          # codait. Le lot vient du jugement : un arrêt qui ne nomme pas son lot
          # n'est pas actionnable.
          if [ "$CODE" = "4" ]; then
            LOT=$(jq -r '.lot // "(lot non lisible)"' <<<"$JUGEMENT")
            palier DECISION_RESERVEE_A_UN_HUMAIN "$JUGEMENT" \
              "la décision de l'arbitre ne franchit aucun palier humain" \
              "Frédéric tranche, puis matérialise à la main : $A_LA_MAIN"
          fi
          [ "$CODE" = "0" ] || echec CONTRAT_NON_MATERIALISABLE \
            "la réponse vise la demande que le registre attend, sur le rail du run, et prouve la lecture du rail : $JUGEMENT" "$A_LA_MAIN"
          LOT=$(jq -r .lot <<<"$JUGEMENT"); REQUEST=$(jq -r .request <<<"$JUGEMENT")
          DECISION=$(jq -r .decision <<<"$JUGEMENT"); CLOSES=$(jq -r .closes <<<"$JUGEMENT")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node outils/handoff.js decision "$LOT" "$CORPS_DECISION" --decision "$DECISION" \
              --closes "$CLOSES" --en-reponse-a "$REQUEST" --auteur ChatGPT \
            && node outils/handoff.js miroirs \
            && git add -A docs/handoff \
            && git commit --quiet -m "handoff($LOT): décision de l'arbitre sur $REQUEST — $DECISION (matérialisée par la CI, stade a, run $GITHUB_RUN_ID)" \
            || echec DEPOT_REFUSE "handoff.js accepte la décision et la commite" "$A_LA_MAIN"
          DEPOSEE=$(git diff-tree --no-commit-id --name-only -r HEAD -- "docs/handoff/lots/$LOT" \
            | grep -oE 'decision-[0-9]+\.md$' | head -n 1)
          # La CI ne consomme PAS, même quand la décision clôt le lot.
          # `decision-1.md:54` du lot ARMEMENT-ARBITRAGE-AUTONOME-1-20261008
          # retient « aucune consommation automatique » comme condition de son
          # avis favorable, et `request-1.md:124` l'écrit : « personne ne
          # consomme : la décision attend Claude au prochain passage. C'est
          # voulu (pas de boucle vers Claude), mais c'est un arrêt. »
          # Un arrêt voulu se dit, il ne se tait pas.
          if [ "$CLOSES" = "true" ]; then
            echo "::notice::$LOT — la décision clôt le lot, mais la CI ne la consomme pas :" \
              "elle attend Claude au prochain passage (condition retenue, decision-1.md:54)"
          fi
          node outils/handoff.js verifier \
            || echec REGISTRE_INVALIDE "le registre valide après le dépôt" "$A_LA_MAIN"
          git push --quiet origin "HEAD:refs/heads/$B" \
            || echec PUSH_REFUSE "le rail $B n'a pas avancé pendant le run (push sans force)" "$A_LA_MAIN"
          # Ce que l'étape suivante (boucle autonome) relit. Des identifiants
          # seulement : le texte de l'arbitre reste dans le fichier déposé.
          {
            echo "depose=1"; echo "lot=$LOT"; echo "decision=$DEPOSEE"; echo "rail=$B"
            echo "sha=$(git rev-parse HEAD)"; echo "wt=$WT"
          } >> "$GITHUB_OUTPUT"
          node outils/etat-maillon.js EXECUTE DECISION_MATERIALISEE --maillon "$M" \
            --motif "$LOT : décision $DECISION sur $REQUEST déposée sur $B ($(git rev-parse --short HEAD)), closes=$CLOSES" \
            --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "$B" --lot "$LOT"

      # Boucle autonome — PRÉPARÉE LE 10/10/2026, NON ARMÉE. À autoriser par
      # Frédéric (vars.NEXUS_BOUCLE_AUTONOME = arme).
      #
      # Après une décision déposée par le stade (a), relance Claude par
      # `repository_dispatch` (type nexus-boucle-claude, reçu par claude.yml
      # sur main) si et seulement si outils/relancer-claude-ci.js l'admet. Les
      # gardes communes (interrupteur, STOP du palier Frédéric, décision déjà
      # traitée, verdict répété, CI verte, plafonds 3 par lot et 10 par jour)
      # sont celles d'outils/garde-boucle-autonome.js, sur un journal relu dans
      # l'historique git du rail ; le juge y ajoute BLOCKED, STOP de l'arbitre,
      # canal capable, lot clos et conditions antérieures prouvées. Deux verrous : ce `if:` et la même variable relue
      # par l'outil. Aucune permission nouvelle : POST /dispatches n'exige que
      # `contents: write`, déjà accordé. La charge utile est le fichier rendu
      # par l'outil, cinq identifiants à motif fermé, jamais le texte de
      # l'arbitre. Un arrêt qui demande Frédéric (palier Frédéric, BLOCKED,
      # plafond, verdict répété, conditions non prouvées) rend
      # HUMAN_DECISION_REQUIRED : la boucle s'arrête, elle ne prévient pas
      # encore Frédéric par un canal dont la réception est prouvée.
      - name: Boucle autonome — relancer Claude (repository_dispatch)
        if: always() && vars.NEXUS_BOUCLE_AUTONOME == 'arme' && steps.materialisation.outputs.depose == '1'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_BOUCLE_AUTONOME: ${{ vars.NEXUS_BOUCLE_AUTONOME }}
          CI_DU_JOB: ${{ job.status }}
          LOT: ${{ steps.materialisation.outputs.lot }}
          DECISION: ${{ steps.materialisation.outputs.decision }}
          RAIL: ${{ steps.materialisation.outputs.rail }}
          SHA_RAIL: ${{ steps.materialisation.outputs.sha }}
          WT: ${{ steps.materialisation.outputs.wt }}
        run: |
          set +e
          set -uo pipefail
          M=boucle-autonome
          CHARGE="$RUNNER_TEMP/charge-boucle.json"
          # Chaque publication est écrite en entier, état littéral et six champs
          # sur une ligne : test_cablage_maillons_20260930.js les lit ainsi.
          cd "$WT" || { node outils/etat-maillon.js FAILED RAIL_ILLISIBLE --maillon "$M" --motif "worktree du stade (a) absent" --condition "worktree du stade (a) absent" --sha "$SHA_RAIL" --branche "$RAIL" --lot "$LOT" --prochaine-action "relancer Claude à la main"; exit 1; }
          JUGE=$(node outils/relancer-claude-ci.js --lot "$LOT" --decision "$DECISION" --rail "$RAIL" \
            --sha "$SHA_RAIL" --ci "$CI_DU_JOB" --sortie "$CHARGE")
          [ $? = 0 ] || { node outils/etat-maillon.js FAILED JUGE_ILLISIBLE --maillon "$M" --motif "relancer-claude-ci.js a échoué : rien n'est parti" --condition "juge illisible" --sha "$SHA_RAIL" --branche "$RAIL" --lot "$LOT" --prochaine-action "relancer Claude à la main"; exit 1; }
          relancer=$(jq -r .relancer <<<"$JUGE"); verdict=$(jq -r .verdict <<<"$JUGE")
          motif=$(jq -r .motif <<<"$JUGE"); notifier=$(jq -r .notifier <<<"$JUGE")
          if [ "$relancer" = true ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input "$CHARGE" \
              || { node outils/etat-maillon.js FAILED DISPATCH_REFUSE --maillon "$M" --motif "$verdict : $motif — envoi refusé" --condition "dispatch refusé" --sha "$SHA_RAIL" --branche "$RAIL" --lot "$LOT" --prochaine-action "relancer Claude à la main"; exit 1; }
            node outils/etat-maillon.js EXECUTE CLAUDE_RELANCE --maillon "$M" --motif "$motif" --sha "$SHA_RAIL" --branche "$RAIL" --lot "$LOT"
          elif [ "$notifier" = true ]; then
            node outils/etat-maillon.js HUMAN_DECISION_REQUIRED BOUCLE_ARRETEE --maillon "$M" --motif "$verdict : $motif" --condition "$verdict" --sha "$SHA_RAIL" --branche "$RAIL" --lot "$LOT" --prochaine-action "Frédéric tranche ; la boucle reste arrêtée"
          else
            node outils/etat-maillon.js NO_WORK BOUCLE_AU_REPOS --maillon "$M" --motif "$verdict : $motif" --sha "$SHA_RAIL" --branche "$RAIL" --lot "$LOT"
          fi

      # ADR-0001 — garde de portée site. NON BLOQUANTE pour l'instant :
      # l'arbitrage conditionne son activation à la revue de ses résultats par
      # Architecture, Security et QA. Elle rapporte donc sans arrêter la CI,
      # et son test propre (ci-dessus, dans la suite) reste bloquant : la
      # garde peut se taire, elle ne peut pas mentir sans qu'on le voie.
      - name: Garde de portée site (ADR-0001) — rapport
        run: node outils/garde-portee-site.js || true

      # ── Guardians backend (ORCH-002) ───────────────────────────────────
      # Deux contrôles, deux régimes, et la différence n'est pas cosmétique.
      #
      # `verifier-apprentissage.js` est BLOQUANT : il ne juge que l'intégrité
      # de RULES.json / EXPERIENCE.jsonl, qui est verte sur le canon et le
      # reste tant que personne ne casse le registre. Un rouge y est donc
      # toujours une régression réelle, jamais une dette héritée.
      #
      # `guardians-router.js` RAPPORTE sans arrêter la CI. Après calibration
      # il ne rend plus qu'un seul finding sur le canon — la collision
      # `NexusStock` entre nexus-stock.js et nexus-stock-moteur.js — et c'est
      # une dette PRÉ-EXISTANTE que l'audit du 07/09 (§12.5) demande de
      # trancher avant toute suppression ou renommage. Le rendre bloquant
      # aujourd'hui mettrait la CI au rouge dès le premier run pour une chose
      # que ce lot n'a pas le droit de corriger, et la leçon de Q71 est
      # explicite : une garde dont le premier verdict est rouge se fait
      # retirer, et emporte avec elle les findings qu'elle aurait trouvés
      # ensuite. Même régime que la garde de portée site, pour la même raison.
      #
      # Ses épreuves, elles, restent bloquantes : le garde peut se taire, il
      # ne peut pas mentir sans qu'on le voie.
      - name: Vérification de l'apprentissage (RULES.json / EXPERIENCE.jsonl)
        run: node outils/verifier-apprentissage.js

      - name: Guardians backend — rapport
        env:
          NEXUS_GUARDIANS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          NEXUS_GUARDIANS_HEAD_REF: HEAD
        run: node outils/guardians-router.js || true

      # Guardian QA — BLOQUANT, et c'est le seul des trois qui peut l'être :
      # il rend 0 finding sur les 212 fichiers d'épreuves du canon. Tout rouge
      # y sera donc une régression réelle, jamais une dette héritée. Il cherche
      # les épreuves qui ne peuvent pas échouer — motif trop permissif, capture
      # de flux partielle, assertion avalée par un catch — la famille de défaut
      # qui a produit trois faux « vert » dans la seule journée du 07/09.
      - name: Guardian QA — épreuves qui ne peuvent pas échouer
        run: node outils/guardian-qa.js

      # Les deux suivants RAPPORTENT sans arrêter la CI : leurs findings sont
      # des dettes pré-existantes qu'aucun de ces lots n'a le droit de corriger.
      # Bloquer aujourd'hui mettrait la CI au rouge pour de l'histoire, et une
      # garde rouge au premier run se fait retirer — avec tout ce qu'elle aurait
      # trouvé ensuite.
      - name: Guardian Business Rules — rapport
        run: node outils/guardian-regles-metier.js || true

      - name: Guardian Bible — chiffres inventés — rapport
        run: node outils/guardian-bible.js || true

      # Branches en rade — RAPPORT, et ce choix est délibéré.
      #
      # Une branche non rapatriée n'est pas un défaut du commit qu'on teste :
      # rendre la CI rouge pour elle punirait le mauvais changement, et la
      # première réaction serait de désactiver la garde. Elle nomme donc, sans
      # arrêter. Son épreuve propre, elle, reste bloquante : la garde peut se
      # taire, elle ne peut pas mentir sans qu'on le voie.
      # Répétition de la recette Carburants — BLOQUANTE, et sans base.
      #
      # Elle rejoue le scénario à travers la vraie chaîne du moteur en lisant
      # ses hypothèses dans l'instantané de la station Test, sur les SEPT jours
      # de la semaine. Elle répond en 0,2 seconde à la question qui coûtait un
      # cycle de CI de six minutes — c'est elle qu'il faut lancer AVANT de
      # pousser. Ici elle sert de filet : si elle échoue, inutile d'aller plus
      # loin, la recette navigateur trouverait la même chose bien plus tard.
      - name: Répétition de la recette Carburants (7 jours)
        run: node outils/repetition-recette-carburants.js

      - name: Épreuves de la répétition
        run: node test_repetition_recette_carburants_20260908.js

      # Guardian Philosophie NEXUS — RAPPORT, et c'est sa doctrine qui le veut.
      # `decision-1.md` (Q75) l'a arbitré consultatif : jamais bloquant tant
      # qu'il dépend d'un jugement de modèle. Il ne note personne — il nomme
      # les silences ambigus et rappelle les neuf critères au relecteur. Son
      # épreuve propre, elle, reste bloquante : il peut se taire, il ne peut
      # pas mentir sans qu'on le voie.
      - name: Guardian Philosophie NEXUS — rapport
        run: node outils/guardian-philosophie.js || true

      - name: Épreuves du Guardian Philosophie
        run: node test_guardian_philosophie_20260908.js

      # §4 — CE CAPTEUR ÉTAIT LE SEUL À VOIR LA RUPTURE, ET IL ÉTAIT BÂILLONNÉ.
      # `|| true` avalait son code 1 depuis le premier jour. Il voyait 64
      # branches portant du travail absent du rail, et le run restait vert :
      # l'unique instrument capable de dire « la chaîne est cassée » était
      # précisément celui qu'on avait rendu muet.
      #
      # On ne le rend pas bloquant pour autant, et ce n'est pas une facilité.
      # Son premier verdict est rouge — 64 branches héritées que ce lot n'a
      # pas le droit de trancher seul. La leçon de Q71 est explicite : une
      # garde dont le premier verdict est rouge se fait retirer, et emporte
      # avec elle les découvertes qu'elle aurait faites ensuite.
      #
      # On ne change donc pas la COULEUR, on change le SIGNAL. L'arrêt cesse
      # d'être une phrase perdue dans le journal d'une étape parmi soixante :
      # il devient un état machine, annoté au niveau du run, résumé, et
      # lisible par l'outil d'aval.
      - name: Branches de travail en rade — état de maillon
        run: |
          set -uo pipefail
          # `set +e` INDISPENSABLE, et ce n'est pas une redite de `-uo` :
          # GitHub lance `shell: bash` avec `-e`, que `set -uo pipefail` ne
          # désactive pas. Sans lui, l'affectation ci-dessous tue le step dès
          # que la garde trouve quelque chose — c'est-à-dire exactement dans le
          # cas qu'elle existe pour nommer. Mesuré en vol le 30/09 sur la
          # branche de preuve : rouge nu, rapport jamais imprimé, état de
          # maillon jamais publié. Un refus silencieux, dans l'étape même qui
          # existe pour qu'il n'y en ait plus.
          set +e
          RAPPORT=$(node outils/garde-branches-en-rade.js 2>&1); CODE=$?
          printf '%s\n' "$RAPPORT"
          if [ "$CODE" = "0" ]; then
            node outils/etat-maillon.js NO_WORK AUCUNE_BRANCHE_EN_RADE \
              --maillon branches-en-rade \
              --motif "toute branche porteuse est rapatriée vers son rail ou classée au registre."
          else
            N=$(printf '%s' "$RAPPORT" | sed -n 's/^\([0-9][0-9]*\) branche(s) en rade.*/\1/p' | tail -1)
            node outils/etat-maillon.js BLOCKED RAPATRIEMENT_EN_ATTENTE \
              --maillon branches-en-rade \
              --motif "${N:-plusieurs} branche(s) portent du travail absent de leur rail." \
              --condition "toute branche porteuse est rapatriée vers son rail, ou son sort est inscrit au registre" \
              --prochaine-action "qualifier puis rapatrier (outils/qualifier-rapatriement.js), ou inscrire le sort dans docs/handoff/BRANCHES-CLASSEES.json" \
              --sha "${GITHUB_SHA:-(sha non lisible)}" --branche "${GITHUB_REF_NAME:-(branche non lisible)}" \
              --lot "(transverse — ce maillon n'est rattaché à aucun lot)"
          fi

      - name: Épreuves de la garde des branches en rade
        run: node test_garde_branches_en_rade_20260908.js

      - name: Épreuves du transport autorisé
        run: node test_transport_autorise_20260928.js

      - name: Épreuves du préflight de capacités
        run: node test_preflight_capacites_20260928.js

      # BLOQUANTE, contrairement aux Guardians consultatifs. La règle est
      # arbitrée (portée 1, décision de Frédéric du 08/09/2026) et la garde est
      # calibrée : 0 signalement sur le dépôt en l'état. Une garde qui ne crie
      # pas peut se permettre d'arrêter la chaîne — c'est celle qui hurle au
      # premier run qu'on désactive (QA-002).
      - name: LANG-003 — le tiret cadratin dans ce que NEXUS dit
        run: node outils/garde-langage-nexus.js

      - name: Épreuves de la garde LANG-003
        run: node test_garde_langage_nexus_20260908.js

      # Une ligne de Bible que rien ne mécanise est une décoration : elle se met
      # à mentir le jour où le code s'en écarte, sans que personne ne le voie.
      - name: Les principes de la Bible sont-ils TENUS ?
        run: node test_bible_principes_mecanises_20260908.js

      # Une doctrine qui recopie une vérité vivant ailleurs devient une seconde
      # source, et c'est toujours la copie qu'on oublie de mettre à jour.
      - name: La doctrine du langage tient-elle ses promesses ?
        run: node test_doctrine_langage_20260908.js

      # Une permission accordée une fois a tendance à s'élargir ensuite, et
      # personne ne relit un YAML pour vérifier une ligne qui n'a pas bougé.
      - name: La surface du jeton de CI est-elle restée celle autorisée ?
        run: node test_permissions_workflow_20260908.js

      # Les agents portent leur nom devant l'utilisateur ; les commentaires
      # datés gardent le leur, parce qu'ils datent une demande.
      - name: LANG-004 — le nom des agents NEXUS
        run: node test_vocabulaire_agents_20260908.js

      # Une gravité d'écart de caisse, un seul propriétaire (ARCH-003).
      - name: Épreuves de la classification unique des écarts
        run: node test_classification_ecart_unique_20260908.js

      # « Je n'ai pas pu demander » n'est ni une faute ni une conformité.
      - name: La protection Production a-t-elle bien TROIS états ?
        run: node test_barriere_production_trois_etats_20260908.js

      # La répétition PREPROD-équivalente fait `drop schema public cascade`.
      # Elle ne doit jamais emporter une décision humaine avec elle.
      - name: La répétition préserve-t-elle le journal Live ?
        run: node test_repetition_preserve_journal_20260909.js

      # Un droit accordé en base doit exister dans le dépôt, sinon une
      # reconstruction le perd sans que rien ne le dise.
      - name: Les droits CI vivent-ils dans une migration ?
        run: node test_droits_ci_dans_migrations_20260909.js

      # L'hôte direct de Supabase ne publie qu'une adresse IPv6. Une
      # reconstruction ne doit pas dépendre de sa disponibilité.
      - name: La reconstruction survit-elle à une IPv6 absente ?
        run: node test_connexion_test_repli_20260909.js

      # Un PREPROD contient les identités d'une vraie équipe. La preuve qui
      # autorise l'accès à cet environnement est la pièce la plus sensible.
      - name: La preuve d'absence de donnée personnelle cherche-t-elle partout ?
        run: node test_preuve_absence_donnee_personnelle_20260909.js

      # Un PREPROD est détruit après sa release (arbitrage du 09/09/2026).
      # BLOQUANTE : une copie de production oubliée est l'endroit où les
      # fuites se logent.
      - name: Un PREPROD survit-il à sa release ?
        run: node outils/garde-preprod-ephemere.js

      - name: Épreuves de la garde PREPROD éphémère
        run: node test_garde_preprod_ephemere_20260909.js

      - name: Épreuves de la garde du mode d'environnement
        run: node test_garde_mode_environnement_20260909.js

      # Le jeu de répétition porte les FORMES de Production, jamais ses données.
      - name: Le jeu PREPROD reproduit-il les cas mesurés ?
        run: node test_jeu_preprod_cas_production_20260909.js

      # Un manifeste qui vieillit en silence promeut ce qu'il ignore.
      - name: Toute migration de la promotion est-elle classée ?
        run: node test_manifeste_migrations_complet_20260909.js

      - name: Épreuves du routeur Guardians
        run: node test_guardians_router_20260907.js

      - name: Épreuves de la vérification d'apprentissage
        run: node test_verifier_apprentissage_20260907.js

      - name: Simulations métier
        run: npm run simulations --silent

      - name: Épreuves du réveil automatique
        run: node test_reveil_handoff_20260907.js

      - name: Épreuves du jugement de la recette navigateur
        run: node test_recette_navigateur_test_20260907.js

      # ------------------------------------------------------------------
      # Recette navigateur NEXUS Test — la preuve UI, sans saisie humaine.
      #
      # Uniquement sur la branche canonique : c'est la seule dont NEXUS Test
      # sert le contenu. Lancer la recette depuis une branche de travail
      # testerait une version déployée qui n'est pas la sienne, et rendrait un
      # vert ou un rouge également faux.
      # ------------------------------------------------------------------

      # Semis du jeu de données de recette. Idempotent (`on conflict`) et non
      # destructeur : il ne met à jour que les litrages, et laisse intacts les
      # montants et statuts des lignes appartenant à d'autres recettes.
      # Sans le secret d'écriture, l'étape se déclare indisponible et passe —
      # c'est la recette suivante qui dira alors, elle, que la preuve manque.
      - name: Préparer la connexion PostgreSQL Test en écriture
        if: env.NEXUS_REF_EST_LE_RAIL == '1'
        env:
          NEXUS_TEST_DB_URL_WRITE: ${{ secrets.SUPABASE_TEST_DB_URL_WRITE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TEST_DB_URL_WRITE:-}" ]; then
            echo "::notice::SUPABASE_TEST_DB_URL_WRITE absent — jeu de données de recette non semé (ENV-003, non bloquant)."
            echo "NEXUS_SEMIS_DISPONIBLE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "NEXUS_SEMIS_DISPONIBLE=1" >> "$GITHUB_ENV"
          # Même décomposition que .github/workflows/claude.yml : le mot de
          # passe est masqué AVANT d'exister ailleurs, et `psql` se lance sans
          # aucun argument de connexion — donc jamais de secret sur une ligne
          # de commande, visible dans la liste des processus.
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse, unquote

          u = urlparse(os.environ['NEXUS_TEST_DB_URL_WRITE'])
          if u.scheme not in ('postgresql', 'postgres'):
              raise SystemExit('Schéma d\'URL PostgreSQL invalide')
          if not all((u.hostname, u.username, u.password, u.path)):
              raise SystemExit('URL PostgreSQL Test incomplète')

          values = {
              'PGHOST': u.hostname,
              'PGPORT': str(u.port or 5432),
              'PGDATABASE': u.path.lstrip('/') or 'postgres',
              'PGUSER': unquote(u.username),
              'PGPASSWORD': unquote(u.password),
              'PGSSLMODE': 'require',
          }
          print(f"::add-mask::{values['PGPASSWORD']}")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              for cle, valeur in values.items():
                  f.write(f'{cle}={valeur}\n')
          PY

      # Étape distincte, et non la suite de la précédente : les variables
      # écrites dans $GITHUB_ENV ne prennent effet qu'au step SUIVANT. Les
      # laisser dans le même step aurait lancé `psql` sans aucune connexion —
      # le genre d'erreur qui rend un rouge incompréhensible.
      # Une base INJOIGNABLE et une base qui REFUSE ne sont pas le même fait, et
      # les confondre coûte les deux fois. Le 08/09/2026, l'hôte direct de
      # Supabase (`db.<ref>.supabase.co`) ne publie plus qu'une adresse IPv6 ;
      # les runners GitHub n'ont pas d'IPv6. Le semis est donc devenu rouge le
      # jour même où le secret d'écriture a enfin été créé — et ce rouge a
      # emporté avec lui la recette navigateur, seule preuve que l'écran
      # Carburants et NEXUS Live fonctionnent réellement. Une capacité Test
      # absente ne doit jamais faire perdre les preuves qui, elles, tiennent.
      #
      # La tolérance est donc STRICTEMENT limitée à l'injoignabilité réseau.
      # Un refus d'authentification, un droit manquant, une erreur SQL : tout
      # cela reste bloquant. C'est la différence entre « je n'ai pas pu
      # demander » et « on m'a répondu non » — la seconde est un vrai défaut.
      # Épreuve transactionnelle request-20 — station_config / 23502.
      # Exécute le véhicule canonique tel quel sur nexus-test ; aucune duplication SQL.
      - name: Épreuve station_config 23502 (request-20) — INSERT et ON CONFLICT sous ROLLBACK
        if: env.NEXUS_REF_EST_LE_RAIL == '1' && env.NEXUS_SEMIS_DISPONIBLE == '1'
        shell: bash
        run: |
          set -uo pipefail
          FICHIER_EPREUVE="outils/epreuve-station-config-upsert-fuseau-horaire-23502-20261002.sql"
          if [ ! -f "$FICHIER_EPREUVE" ]; then
            echo "ÉCHEC — fichier canonique absent : $FICHIER_EPREUVE"
            exit 1
          fi
          if ! sonde=$(psql -v ON_ERROR_STOP=1 -c 'select 1' 2>&1 >/dev/null); then
            if grep -qiE 'network is unreachable|could not translate host name|connection timed out|no route to host' <<<"$sonde"; then
              echo "::warning::ENV-003 — base Test INJOIGNABLE depuis le runner : $sonde"
              echo "::warning::Épreuve 23502 (request-20) NON exécutée — la preuve comportementale reste ouverte, non fabriquée."
              echo "NEXUS_EPREUVE_23502_FAITE=0" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "La base Test a RÉPONDU, et elle a refusé — ce n'est pas une indisponibilité :"
            echo "$sonde"
            exit 1
          fi
          if ! sortie=$(psql -v ON_ERROR_STOP=1 -f "$FICHIER_EPREUVE" 2>&1); then
            printf '%s\n' "$sortie"
            echo "ÉCHEC — l'épreuve SQL request-20 n'a pas passé ON_ERROR_STOP. Le SQLSTATE exact est dans la sortie ci-dessus."
            echo "NEXUS_EPREUVE_23502_FAITE=0" >> "$GITHUB_ENV"
            exit 1
          fi
          printf '%s\n' "$sortie"
          # DEUX VERSANTS, ET C'EST LA CORRECTION D'UN DÉFAUT MESURÉ LE 03/10/2026.
          #
          # Le contrôle précédent était `grep -qi '23502'` sur la sortie entière.
          # Il n'avait AUCUN chemin vert, et il était simultanément aveugle au
          # défaut qu'il cherche :
          #
          #   1. FAUX POSITIF GARANTI. Les deux identifiants synthétiques de
          #      l'épreuve s'appellent `nexus-test-repro-23502-neuf` et
          #      `nexus-test-repro-23502-existant`, sa PARTIE C les RELIT et les
          #      imprime, et le nom du fichier lui-même porte « 23502 » — donc
          #      chaque message psql préfixé du chemin en contient un. Mesuré sur
          #      une exécution réussie : 3 occurrences de la chaîne nue. Le garde
          #      matchait sa propre fixture : une épreuve parfaitement réussie
          #      était déclarée ÉCHEC.
          #   2. FAUX NÉGATIF GARANTI. À la verbosité psql par défaut, une vraie
          #      violation de non-nullité s'imprime SANS son SQLSTATE
          #      (`ERROR:  null value in column "horaires" …`). La chaîne
          #      « 23502 » n'y figure pas. L'épreuve porte donc désormais
          #      `\set VERBOSITY verbose`, et c'est une clause du contrat de ce
          #      garde, pas un confort.
          #
          # Versant NÉGATIF : le code d'erreur, ancré sur la forme que psql
          # imprime réellement (`ERROR:  23502: …`, éventuellement préfixé
          # `psql:<fichier>:<ligne>: `), et non la chaîne nue n'importe où.
          if printf '%s\n' "$sortie" | grep -qiE '^(psql:[^ ]*:[0-9]+: )?ERROR: +23502:'; then
            echo "ÉCHEC — SQLSTATE 23502 levé par l'épreuve malgré un exit 0."
            echo "NEXUS_EPREUVE_23502_FAITE=0" >> "$GITHUB_ENV"
            exit 1
          fi
          # Versant POSITIF, indispensable : une sortie VIDE ne contient aucun
          # code d'erreur non plus. Sans ce contrôle, une épreuve qui n'aurait
          # rien exécuté du tout serait déclarée verte. Avec `ON_ERROR_STOP=1`,
          # ce marqueur terminal ne peut être atteint que si les deux `insert`,
          # l'`on conflict`, les trois `rollback` ET le contrôle d'innocuité
          # (PARTIE D : aucune ligne synthétique résiduelle) ont tous réussi.
          if ! printf '%s\n' "$sortie" | grep -qF 'REQUEST-20 : ÉPREUVE MENÉE À TERME'; then
            echo "ÉCHEC — épreuve request-20 NON menée à terme : marqueur terminal absent de la sortie."
            echo "NEXUS_EPREUVE_23502_FAITE=0" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "NEXUS_EPREUVE_23502_FAITE=1" >> "$GITHUB_ENV"
          echo "Épreuve station_config 23502 (request-20) : SUCCESS — INSERT et ON CONFLICT réussissent sans 23502, sous ROLLBACK."

      # ÉPREUVE DE BORNAGE SEC-023 — ET POURQUOI ELLE NE PEUT VIVRE QU'ICI.
      #
      # La migration `20261003170000` accorde au rôle `nexus_ci_recette` une
      # écriture sur `public.station_config`, bornée sur DEUX axes à la fois :
      # en colonnes par le GRANT, en lignes par trois politiques RLS limitées
      # aux deux identifiants synthétiques de l'épreuve ci-dessus. C'est ce
      # bornage que cette étape mesure — pas la réussite de l'épreuve, le
      # REFUS de tout le reste.
      #
      # Elle est ici et pas sur un poste parce que le bornage ne s'observe que
      # SOUS `nexus_ci_recette`. Mesuré le 03/10/2026 depuis un poste :
      # `pg_has_role('nexus_ci_recette','MEMBER')` rend `t`, et pourtant
      # `set role nexus_ci_recette;` rend
      # `ERROR: permission denied to set role "nexus_ci_recette"` — PostgreSQL 16
      # sépare l'appartenance (MEMBER) du droit de l'endosser (USAGE, mesuré `f`).
      # Et sous `postgres`, qui porte `rolbypassrls`, CHAQUE écriture passerait :
      # le vert signifierait l'inverse de ce qu'il affirme. L'épreuve refuse donc
      # de conclure sous une autre identité (`BORNAGE-000`) — contre-témoin pris
      # avant tout usage : lancée sous `postgres`, elle sort en code 3.
      #
      # Le RUNNER est le seul maillon qui se connecte nativement comme
      # `nexus_ci_recette` (cf. le step de connexion ci-dessus, qui décompose
      # SUPABASE_TEST_DB_URL_WRITE). Un garde non câblé ne prouve rien.
      - name: Bornage de l'écriture de recette sur station_config (SEC-023)
        if: env.NEXUS_REF_EST_LE_RAIL == '1' && env.NEXUS_SEMIS_DISPONIBLE == '1'
        shell: bash
        run: |
          set -uo pipefail
          FICHIER_BORNAGE="outils/epreuve-bornage-ecriture-recette-station-config-20261003.sql"
          if [ ! -f "$FICHIER_BORNAGE" ]; then
            echo "ÉCHEC — fichier canonique absent : $FICHIER_BORNAGE"
            exit 1
          fi
          if ! sonde=$(psql -v ON_ERROR_STOP=1 -c 'select 1' 2>&1 >/dev/null); then
            if grep -qiE 'network is unreachable|could not translate host name|connection timed out|no route to host' <<<"$sonde"; then
              echo "::warning::ENV-003 — base Test INJOIGNABLE depuis le runner : $sonde"
              echo "::warning::Bornage SEC-023 NON mesuré — la preuve reste ouverte, non fabriquée."
              echo "NEXUS_BORNAGE_SEC021_FAIT=0" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "La base Test a RÉPONDU, et elle a refusé — ce n'est pas une indisponibilité :"
            echo "$sonde"
            exit 1
          fi
          if ! sortie=$(psql -v ON_ERROR_STOP=1 -f "$FICHIER_BORNAGE" 2>&1); then
            printf '%s\n' "$sortie"
            echo "ÉCHEC — le bornage SEC-023 n'est pas prouvé. Le code BORNAGE-00x exact est dans la sortie ci-dessus."
            echo "NEXUS_BORNAGE_SEC021_FAIT=0" >> "$GITHUB_ENV"
            exit 1
          fi
          printf '%s\n' "$sortie"
          # Même raison qu'à l'étape précédente : une sortie vide ne porte aucun
          # échec. Le marqueur terminal de l'épreuve est son seul versant positif.
          if ! printf '%s\n' "$sortie" | grep -qF 'ÉPREUVE DE BORNAGE SEC-023 : toutes les parties ont passé.'; then
            echo "ÉCHEC — bornage SEC-023 non mené à terme : marqueur terminal absent."
            echo "NEXUS_BORNAGE_SEC021_FAIT=0" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "NEXUS_BORNAGE_SEC021_FAIT=1" >> "$GITHUB_ENV"
          echo "Bornage SEC-023 : SUCCESS — l'écriture de recette sur station_config est refusée partout sauf sur les deux identifiants synthétiques."

      # CONDITION P0 DE LA DETTE TRUNCATE (audit Handoff du 03/10/2026).
      #
      # `anon` et `authenticated` détiennent TRUNCATE sur 144 tables `public`
      # (défaut Supabase), et TRUNCATE ignore la RLS. Qualifiée P2 le
      # 03/10/2026 parce qu'aucun chemin ne permet de l'émettre sous ces rôles.
      # Le seul chemin qui reste est une fonction `public` exécutable par l'un
      # d'eux qui porte `EXECUTE` (SQL dynamique) ou `TRUNCATE`. Cette étape
      # refuse qu'elle existe : un rouge ici n'est pas une dette à classer,
      # c'est le passage en P0 (STOP).
      #
      # Lecture du catalogue seulement ; témoin (`realtime`) et contre-témoin
      # (fonction fautive dans pg_temp, annulée) dans le même fichier, pour
      # qu'un vert ne puisse pas venir d'un instrument aveugle.
      - name: Aucune fonction public exécutable par anon/authenticated ne fait de SQL dynamique (P0 TRUNCATE)
        if: env.NEXUS_REF_EST_LE_RAIL == '1' && env.NEXUS_SEMIS_DISPONIBLE == '1'
        shell: bash
        run: |
          set -uo pipefail
          FICHIER_SQLDYN="outils/epreuve-sql-dynamique-public-20261003.sql"
          if [ ! -f "$FICHIER_SQLDYN" ]; then
            echo "ÉCHEC — fichier canonique absent : $FICHIER_SQLDYN"
            exit 1
          fi
          if ! sonde=$(psql -v ON_ERROR_STOP=1 -c 'select 1' 2>&1 >/dev/null); then
            if grep -qiE 'network is unreachable|could not translate host name|connection timed out|no route to host' <<<"$sonde"; then
              echo "::warning::ENV-003 — base Test INJOIGNABLE depuis le runner : $sonde"
              echo "::warning::Condition P0 TRUNCATE NON mesurée — la preuve reste ouverte, non fabriquée."
              exit 0
            fi
            echo "La base Test a RÉPONDU, et elle a refusé — ce n'est pas une indisponibilité :"
            echo "$sonde"
            exit 1
          fi
          if ! sortie=$(psql -v ON_ERROR_STOP=1 -f "$FICHIER_SQLDYN" 2>&1); then
            printf '%s\n' "$sortie"
            echo "ÉCHEC — condition P0 TRUNCATE : le code SQLDYN-00x exact est dans la sortie ci-dessus."
            exit 1
          fi
          printf '%s\n' "$sortie"
          if ! printf '%s\n' "$sortie" | grep -qF 'ÉPREUVE SQL DYNAMIQUE PUBLIC : toutes les parties ont passé.'; then
            echo "ÉCHEC — épreuve SQL dynamique non menée à terme : marqueur terminal absent."
            exit 1
          fi
          echo "Condition P0 TRUNCATE : SUCCESS — aucune fonction public exécutable par anon/authenticated ne porte EXECUTE ni TRUNCATE."

      - name: Semer le scénario Carburants sur Supabase Test
        if: env.NEXUS_REF_EST_LE_RAIL == '1' && env.NEXUS_SEMIS_DISPONIBLE == '1'
        shell: bash
        run: |
          set -uo pipefail
          if ! sonde=$(psql -v ON_ERROR_STOP=1 -c 'select 1' 2>&1 >/dev/null); then
            if grep -qiE 'network is unreachable|could not translate host name|connection timed out|no route to host' <<<"$sonde"; then
              echo "::warning::ENV-003 — base Test INJOIGNABLE depuis le runner : $sonde"
              echo "::warning::Le jeu de recette n'a PAS été semé. La recette navigateur juge des données déjà présentes ; si elles ont dérivé, elle échouera — elle ne rendra pas un vert de complaisance."
              echo "::warning::Cause connue : l'hôte direct Supabase ne publie qu'une adresse IPv6, absente des runners GitHub. Correctif = pointer SUPABASE_TEST_DB_URL_WRITE sur le pooler de session (IPv4). Geste humain : c'est un secret."
              echo "NEXUS_SEMIS_FAIT=0" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "La base Test a RÉPONDU, et elle a refusé — ce n'est pas une indisponibilité :"
            echo "$sonde"
            exit 1
          fi
          # `set -e` est absent (la sonde ci-dessus doit pouvoir échouer sans
          # tuer le step) : l'échec du semis se vérifie donc À LA MAIN. Un
          # premier jet l'a oublié et une erreur SQL sortait en vert — le
          # défaut même que ce bloc existe pour empêcher, retrouvé par l'essai
          # à faux `psql` plutôt qu'en production.
          # DEUX FOIS, délibérément. Le fichier promet l'idempotence dans son
          # en-tête depuis le début, et ne la tenait pas : son second insert
          # n'avait pas de `on conflict`. Le défaut est resté invisible tant
          # que le semis n'avait jamais réussi à s'exécuter deux fois. Une
          # promesse que rien n'exerce n'est pas une garantie, c'est une
          # intention — alors on l'exerce à chaque passage.
          for passage in 1 2; do
            if ! psql -v ON_ERROR_STOP=1 -f outils/recette-carburants-test.sql; then
              echo "Le semis a échoué au passage $passage alors que la base RÉPONDAIT — défaut réel, pas une indisponibilité."
              [ "$passage" = 2 ] && echo "Un échec au SECOND passage seulement est une rupture d'idempotence."
              exit 1
            fi
          done
          # LA MOITIÉ NÉGATIVE. Le rôle CI vient d'obtenir une politique RLS
          # bornée au site de recette (migration 20260908033743). Vérifier
          # seulement qu'il écrit là où il doit ne prouve pas qu'il est borné :
          # un rôle en BYPASSRLS passerait exactement la même épreuve. On exige
          # donc aussi qu'il ÉCHOUE ailleurs.
          #
          # `begin; … ; rollback;` : si l'écriture est refusée, psql sort non
          # nul et on l'attend ; si elle est acceptée, le rollback garantit que
          # rien n'est écrit sur l'autre site — la fuite est détectée sans
          # jamais être commise.
          if psql -v ON_ERROR_STOP=1 -c "begin; insert into public.audits_caisse (site, date, quart, litrage_sp95, litrage_gazole, litrage_gnr) values ('site-fantome-test','2026-09-08','9',1,1,null); rollback;" >/dev/null 2>&1; then
            echo "FUITE D'ISOLATION : le rôle CI a écrit sur site-fantome-test. La politique RLS ne borne pas ce qu'elle prétend borner."
            exit 1
          fi
          # Le droit de LECTURE sur `sites` ne doit rien montrer. Il n'existe que
          # pour laisser s'évaluer la sous-requête d'une politique `TO PUBLIC`
          # de `carburant_releves` ; RLS est active sur `sites` et toutes ses
          # politiques visent `authenticated`, dont ce rôle n'est pas membre.
          # Cette affirmation ne reste pas un commentaire : si une politique
          # `TO PUBLIC` était un jour ajoutée sur `sites`, la lecture cesserait
          # d'être vide et on l'apprendrait le jour même, pas à l'incident.
          # `|| true` INDISPENSABLE : GitHub lance `shell: bash` avec `-e`, que
          # `set -uo pipefail` ne désactive pas. Sans lui, une affectation dont
          # la commande échoue tue le step AVANT le moindre message — et les
          # trois issues distinguées plus bas (vide / fuite / invérifiable)
          # deviennent inatteignables précisément dans le cas qu'elles
          # existent pour nommer.
          lignes=$(psql -tAc "select count(*) from public.sites" 2>&1) || true
          # Un compte non numérique n'est pas une fuite, c'est une erreur : les
          # confondre nommerait un fait pour un autre, et enverrait chercher le
          # défaut au mauvais endroit. Les deux bloquent, mais pas sous le même
          # nom.
          case "$lignes" in
            0) : ;;
            ''|*[!0-9]*) echo "LECTURE INVÉRIFIABLE sur sites — ne rien conclure : $lignes"; exit 1 ;;
            *) echo "FUITE DE LECTURE : le rôle CI voit $lignes ligne(s) dans sites, il ne doit en voir aucune."; exit 1 ;;
          esac
          echo "Isolation vérifiée : le rôle CI est refusé hors du site de recette, et ne voit aucune ligne de sites."
          # L'instantané contre lequel le scénario est calibré doit correspondre
          # à la station Test. S'il dérive, la recette cherchera un défaut
          # imaginaire dans le moteur — c'est exactement ce qui est arrivé le
          # 07/09, avec un scénario calculé pour les cuves d'une autre station.
          #
          # SEC-018 ACCORDÉ par Frédéric Bragance le 08/09/2026 : la politique
          # `lecture_recette_station_test` ouvre au rôle CI la seule ligne
          # `nexus-station-test`, et le `grant` ne porte que sur les colonnes
          # comparées. Aucune station cliente n'entre dans cette portée, aucune
          # écriture n'est accordée.
          #
          # CONSÉQUENCE : un « permission denied » n'est PLUS une limite
          # d'environnement, c'est une RÉGRESSION — le droit existe, donc son
          # refus veut dire qu'on l'a retiré. Il devient bloquant. Les autres
          # échecs de lecture restent tolérés (ENV-003) et DÉCLARÉS, jamais
          # transformés en « instantané conforme » : ne pas savoir n'est pas
          # une conformité.
          #
          # Le filet reste réel par ailleurs : une dérive ferait échouer la
          # recette navigateur, qui est bloquante. Cette comparaison est celle
          # qui NOMME la cause au lieu de laisser chercher.
          # `|| true`, même raison : sans lui, `-e` a tué ce step en silence au
          # run 34227764396 — aucun message, seulement « exit code 1 ».
          vivant=$(psql -tAc "select jsonb_build_object('fuseau_horaire', fuseau_horaire, 'cuves_carburants', cuves_carburants, 'carburant_commande_config', carburant_commande_config) from station_config where site='nexus-station-test'" 2>&1) || true
          if printf '%s' "$vivant" | grep -qiE 'permission denied|permission refus'; then
            echo "Le rôle CI ne peut plus lire station_config alors que SEC-018 le lui accorde depuis le 08/09/2026."
            echo "Le droit a donc été retiré ou la politique supprimée — ce n'est pas une limite d'environnement."
            printf '%s\n' "$vivant"
            exit 1
          elif [ -z "${vivant// /}" ] || printf '%s' "$vivant" | grep -qiE 'error'; then
            echo "::warning::ENV-003 — instantané de la station NON vérifié : la configuration vivante n'est pas lisible ($vivant). Une dérive resterait invisible ici ; elle ferait échouer la recette navigateur, sans en nommer la cause."
          elif ! printf '%s' "$vivant" | node outils/repetition-recette-carburants.js --comparer; then
            exit 1
          fi
          # DEUX SOURCES, UNE SEULE VÉRITÉ. La base porte le mode
          # d'environnement, le dépôt porte le cycle PREPROD : leur désaccord
          # est l'information. Une recette exécutée pendant une répétition
          # jugerait des données structurées pour reproduire des cas
          # Production, pas le jeu de recette normal — et resterait verte.
          mode=$(psql -tAc "select mode from public.nexus_environnement_mode" 2>/dev/null | tr -d '[:space:]') || true
          node outils/garde-mode-environnement.js "$mode"
          echo "NEXUS_SEMIS_FAIT=1" >> "$GITHUB_ENV"
          echo "Scénario de recette Carburants semé sur Supabase Test."

      # PUBLICATION DU JOURNAL LIVE.
      #
      # Le producteur et l'écran existaient depuis le 07/09 sans rien entre
      # eux : NEXUS Live affichait un instantané figé de treize heures, et rien
      # ne le disait. Un tableau de bord qui n'est pas alimenté n'est pas un
      # tableau de bord, c'est une capture d'écran.
      #
      # `|| true` sur les affectations : GitHub lance `shell: bash` avec `-e`,
      # et sans lui une commande qui échoue tue le step avant tout message
      # (leçon QA-005, apprise deux fois aujourd'hui).
      #
      # ENV-003 : tant que le rôle CI n'a pas le droit d'insérer dans
      # `nexus_live_events`, l'absence de publication est DÉCLARÉE. Elle n'est
      # jamais transformée en succès silencieux — sinon l'écran continuerait
      # d'afficher du vieux en donnant l'impression d'être alimenté.
      # PUBLICATION DU JOURNAL LIVE.
      #
      # Le producteur et l'écran existaient depuis le 07/09 sans rien entre
      # eux : NEXUS Live affichait un instantané figé de treize heures, et rien
      # ne le disait. Un tableau de bord qui n'est pas alimenté n'est pas un
      # tableau de bord, c'est une capture d'écran.
      #
      # PUBLICATION LIGNE PAR LIGNE, SANS `on conflict` — choix de sécurité.
      # Sous RLS, `on conflict` exige de pouvoir LIRE la table pour arbitrer le
      # conflit ; le rôle CI a le droit d'écrire mais aucune policy de lecture.
      # Plutôt que d'ouvrir le journal d'exécution du Créateur à un rôle
      # technique pour la commodité d'une clause SQL, on garde ce rôle en
      # ÉCRITURE SEULE et on traite le doublon pour ce qu'il est : un fait
      # attendu lors d'une republication, reconnaissable à son erreur propre.
      #
      # `|| true` sur les affectations : GitHub lance `shell: bash` avec `-e`,
      # et sans lui une commande qui échoue tue le step avant tout message
      # (leçon QA-005, apprise deux fois le 08/09).
      - name: Publier le journal NEXUS Live
        if: env.NEXUS_REF_EST_LE_RAIL == '1' && env.NEXUS_SEMIS_DISPONIBLE == '1'
        shell: bash
        # GH_TOKEN n'est donné qu'ICI, la seule étape qui exécute le producteur.
        # Le poser au niveau du job l'exposerait à toutes les autres, dont celles
        # qui lancent du code d'épreuve : une permission accordée sert ce qui en
        # a besoin, pas tout ce qui passe.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          sql=$(node outils/producteur-evenements-live.js --sql-unitaire 2>&1) || true
          if [ -z "${sql// /}" ] || ! printf '%s' "$sql" | grep -q 'insert into public.nexus_live_events'; then
            echo "::warning::ENV-003 — aucun événement Live produit : $sql"
            exit 0
          fi
          retour=$(printf '%s' "$sql" | psql -v ON_ERROR_STOP=0 2>&1) || true
          publies=$(printf '%s' "$retour" | grep -c '^INSERT 0 1' || true)
          deja=$(printf '%s' "$retour" | grep -c 'nexus_live_events_event_id_key' || true)
          # Tout ce qui n'est ni une publication ni un doublon attendu est un
          # défaut réel : on ne l'avale pas.
          autres=$(printf '%s' "$retour" | grep -E '^ERROR' | grep -vc 'nexus_live_events_event_id_key' || true)
          if [ "$autres" != "0" ]; then
            echo "Publication du journal Live REFUSÉE pour une raison autre qu'un doublon :"
            printf '%s\n' "$retour" | grep -E '^(EVENEMENT|ERROR)' | tail -20
            exit 1
          fi
          echo "Journal NEXUS Live : $publies événement(s) publié(s), $deja déjà présent(s)."

      - name: Installer Playwright
        if: env.NEXUS_REF_EST_LE_RAIL == '1'
        # 07/10 : run 37683039287 a pendu 1 h 38 ici (téléchargement apt/CDN
        # muet). Sans borne, le job attend les 6 h de GitHub et bloque le rail.
        timeout-minutes: 15
        run: npm install --no-save --silent playwright && npx --yes playwright install --with-deps chromium

      # Bloquante quand les secrets sont là : une preuve qui s'excuse ne prouve
      # rien. Non bloquante quand ils manquent (ENV-003) — et elle le DIT,
      # plutôt que de laisser croire que la preuve UI existe.
      - name: Recette navigateur NEXUS Test
        if: env.NEXUS_REF_EST_LE_RAIL == '1'
        env:
          # PAS de NEXUS_TEST_URL ici — retirée le 22/09/2026. Elle figeait
          # l'adresse sur l'alias de PRODUCTION du projet Pages, lequel sert la
          # branche inscrite au tableau de bord Cloudflare : `config-par-
          # environnement`, le candidat GELÉ du 14/09. La recette attendait donc
          # le SHA du rail à une adresse qui ne pouvait pas le servir, et se
          # déclarait « non exécutée » run après run. C'était la cinquième
          # désignation de rail recopiée hors du registre.
          #
          # Cloudflare Pages construit chaque branche poussée : l'outil dérive
          # maintenant l'adresse du rail déclaré au registre, via la même
          # commande que les étapes ci-dessus (`handoff.js rail`). Ne pas la
          # réintroduire : une épreuve versionnée refuse tout workflow qui la
          # fixe.
          # Le NOM, pas le username : nexus_identifiant_de_connexion résout sur
          # employees.nom. 'manager-test' rend NULL, 'Manager Test' rend le compte.
          NEXUS_TEST_MANAGER_NOM: Manager Test
          # Le compte Créateur de recette, pour la preuve d'accès POSITIVE à
          # NEXUS Live. Le MVP n'avait qu'une recette négative — la moitié
          # rassurante et la moins utile : un écran cassé qui refuse tout le
          # monde la passerait aussi.
          NEXUS_TEST_CREATEUR_NOM: Créateur Test
          # Un PIN par profil depuis le 08/09/2026. Partager un seul secret entre
          # le Créateur et le Manager donnait au compte le moins autorisé la clé
          # du plus autorisé : la recette ne pouvait plus prouver une séparation
          # qu'elle-même n'observait pas. Les secrets Employé A/B existent mais ne
          # sont pas déclarés ici : aucun scénario ne les exerce, et un secret
          # injecté sans usage fabrique une preuve vide.
          NEXUS_TEST_MANAGER_PIN: ${{ secrets.NEXUS_TEST_MANAGER_PIN }}
          NEXUS_TEST_CREATEUR_PIN: ${{ secrets.NEXUS_TEST_CREATEUR_PIN }}
          # Compte EMPLOYÉ, injecté depuis le 09/09/2026 à la demande de
          # Frédéric. Le secret existait déjà et dormait : la règle « un secret
          # injecté sans usage fabrique une preuve vide » interdisait de le
          # câbler tant qu'aucun scénario ne l'exerçait. Le scénario existe
          # maintenant — prise de poste, puis prise de poste AVEC un quart déjà
          # ouvert, le cas ordinaire de l'équipe que l'index d'unicité de la
          # release pourrait refuser.
          #
          # Son absence ne fait PAS tomber la recette : ces deux variables sont
          # hors de SECRETS_REQUIS, et le scénario employé dégrade seul.
          NEXUS_TEST_EMPLOYEE_A_NOM: Employé Test A
          NEXUS_TEST_EMPLOYEE_A_PIN: ${{ secrets.NEXUS_TEST_EMPLOYEE_A_PIN }}
          # Attend que NEXUS Test serve RÉELLEMENT le commit testé avant de
          # juger quoi que ce soit. Cloudflare déploie de façon asynchrone, et
          # une recette lancée trop tôt prouverait la version précédente —
          # ce que decision-2.md du lot CARB-004 interdit explicitement.
          NEXUS_COMMIT_ATTENDU: ${{ github.sha }}
        run: node outils/recette-navigateur-test.js

      # ══════════════════════════════════════════════════════════════════════
      # M7 — RAMENER LE TRAVAIL SUR SON RAIL.
      #
      # Le maillon qui manquait. Jusqu'ici la chaîne s'arrêtait ici : Claude
      # produisait un commit sur `claude/issue-*`, la CI le jugeait, et plus
      # rien. Le rail ne le voyait jamais. Personne n'était en faute — aucune
      # étape n'avait ce travail pour mission. 64 branches sur 137 dorment
      # ainsi.
      #
      # Trois principes gouvernent cette étape, et expliquent sa longueur :
      #
      # 1. ELLE NE SE SAUTE PAS. Un `if:` de step qui écarte les branches
      #    ordinaires rendrait `skipped`, et `skipped` n'est ni vert ni rouge :
      #    c'est l'invisible. Le tri se fait donc DANS l'étape, et une branche
      #    qui n'a rien à rapatrier le DIT (`NO_WORK`).
      #
      # 2. ELLE NE JUGE PAS SON PROPRE RUN. Cette étape est elle-même une
      #    vérification de ce commit ; s'interroger sur son propre verdict
      #    reviendrait à se demander si l'on a fini de parler. Le verdict des
      #    étapes précédentes est donc lu dans `job.status`, et l'outil écarte
      #    des vérifications GitHub celle qui porte `GITHUB_RUN_ID`.
      #
      # 3. ELLE NE S'AUTORISE RIEN — et le 30/09/2026 n'y change rien. Le
      #    transport effectif exige `contents: write` ; ce droit est désormais
      #    accordé, par Frédéric, nommément, à cette date, et inscrit en tête de
      #    ce fichier. Claude ne se l'est pas accordé, et la capacité qu'il donne
      #    n'est toujours pas l'autorisation : l'étape ne transporte que vers un
      #    rail DÉSIGNÉ dans le commentaire déclencheur, après les conditions de
      #    `qualifier-rapatriement.js`, et seulement si la variable de dépôt
      #    `NEXUS_RAPATRIEMENT_ARME` vaut `oui`. Si l'une de ces trois choses
      #    manque, l'étape QUALIFIE et publie `HUMAN_DECISION_REQUIRED` en
      #    nommant exactement ce qui manque — plutôt que de se taire, ou de
      #    faire croire que le maillon fonctionne.
      # ══════════════════════════════════════════════════════════════════════
      - name: Rapatriement vers le rail — qualifier, et ne transporter que si c'est prouvé
        # `!cancelled()` et non `success()` : sur un run rouge, `success()`
        # sauterait l'étape, et le maillon bloqué deviendrait invisible au
        # moment précis où il importe le plus de le voir.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_ETAT_FICHIER: ${{ runner.temp }}/rapatriement.json
          # Variable de dépôt, absente par défaut. Elle n'accorde aucun droit :
          # elle exprime l'intention, et se retire sans toucher à ce fichier.
          # `contents: write` dit que GitHub laissera passer ; cette variable dit
          # que Frédéric le veut. Les deux sont nécessaires, et aucune ne
          # remplace la désignation du rail. Si elle est armée alors que le droit
          # manque, le push échoue VISIBLEMENT (`TRANSPORT_REFUSE_PAR_ORIGIN`),
          # ce qui reste préférable à un refus muet.
          NEXUS_RAPATRIEMENT_ARME: ${{ vars.NEXUS_RAPATRIEMENT_ARME }}
          ETAT_DU_JOB: ${{ job.status }}
        run: |
          set -uo pipefail
          MAILLON=rapatriement-claude-vers-rail
          SHA="${GITHUB_SHA:-(sha non lisible)}"
          BR="${GITHUB_REF_NAME:-(branche non lisible)}"

          # ── Le tri, dit à voix haute ───────────────────────────────────────
          case "$BR" in
            claude/issue-*) : ;;
            *)
              node outils/etat-maillon.js NO_WORK PAS_UNE_BRANCHE_DE_RUN \
                --maillon "$MAILLON" \
                --motif "« $BR » n'est pas une branche de run Claude : il n'y a rien à rapatrier depuis ici."
              exit 0
              ;;
          esac

          # ── Le verdict des étapes précédentes ──────────────────────────────
          if [ "$ETAT_DU_JOB" != "success" ]; then
            node outils/etat-maillon.js BLOCKED CI_NON_VERTE \
              --maillon "$MAILLON" \
              --motif "Une étape de ce run a échoué. Un travail dont les épreuves ne passent pas ne remonte pas sur le rail, quelle que soit la qualité du reste." \
              --condition "tests déterministes requis verts" \
              --prochaine-action "corriger le rouge sur « $BR », pousser, et laisser ce workflow rejuger" \
              --sha "$SHA" --branche "$BR" \
              --lot "(lot non déterminé — la qualification n'a pas été lancée)"
            exit 0
          fi

          # ── Le geste, ou sa qualification ─────────────────────────────────
          # Même cause qu'à l'étape des branches en rade : sous le `-e` de
          # GitHub, un `CODE=$?` placé après une commande qui échoue n'est
          # jamais atteint. Il ne pouvait donc valoir que 0 — une lecture
          # morte, et le FAILED de l'outil sortait sans que l'étape relise son
          # dossier pour nommer la frontière.
          set +e
          if [ "${NEXUS_RAPATRIEMENT_ARME:-}" = "oui" ]; then
            node outils/rapatrier-vers-rail.js \
              --branche "$BR" --depot "${GITHUB_REPOSITORY:-}" --transporter
            exit $?
          fi

          node outils/rapatrier-vers-rail.js --branche "$BR" --depot "${GITHUB_REPOSITORY:-}"
          CODE=$?

          # Un refus de qualification se suffit à lui-même : il a déjà nommé sa
          # condition. Seul le cas « tout est prouvé, et pourtant rien ne part »
          # a besoin d'être expliqué, sans quoi il ressemblerait à un succès.
          LU=$(node -e "try{const r=JSON.parse(require('fs').readFileSync(process.env.NEXUS_ETAT_FICHIER,'utf8'));process.stdout.write((r.etat||'')+'|'+(r.code||'')+'|'+(r.lot||(r.details&&r.details.lot)||''))}catch(e){process.stdout.write('||')}")
          ETAT=${LU%%|*}; RESTE=${LU#*|}; LOT=${RESTE#*|}
          if [ "$ETAT" = "EXECUTE" ]; then
            node outils/etat-maillon.js HUMAN_DECISION_REQUIRED TRANSPORT_NON_ARME \
              --maillon "$MAILLON" \
              --motif "Le travail de « $BR » remplit toutes les conditions de rapatriement, et il reste pourtant sur place : ce workflow n'a pas le droit d'écrire dans le dépôt." \
              --condition "permissions.contents: write dans .github/workflows/tests.yml, et variable de dépôt NEXUS_RAPATRIEMENT_ARME = oui" \
              --prochaine-action "geste humain réservé à Frédéric (élargissement de la surface du jeton, CLAUDE.md) — à défaut, rapatrier à la main : git push origin $SHA:refs/heads/<rail>" \
              --sha "$SHA" --branche "$BR" \
              --lot "${LOT:-(lot non publié par la qualification)}"
          fi
          exit $CODE
