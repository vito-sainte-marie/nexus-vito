# NEXUS — activation de Claude Code sur les issues et pull requests (06/09/2026).
#
# CE WORKFLOW NE DÉPLOIE RIEN et n'écrit rien dans le dépôt. Il réagit
# uniquement à une mention explicite `@claude` dans une issue, un commentaire
# ou une revue, et laisse Claude répondre dans le fil de discussion.
#
# Portée volontairement étroite, en cohérence avec les interdits NEXUS :
#
#   - `contents: read` — Claude peut LIRE le dépôt ; il ne peut ni pousser un
#     commit, ni créer une branche, ni toucher `main` ou `production`. Les
#     gates humaines du protocole de handoff restent donc entières. Élargir à
#     `contents: write` est une décision humaine, pas un réglage de confort.
#
#   - la source de travail est explicitement `config-par-environnement` : le
#     workflow vit sur `main` parce que GitHub y écoute les évènements, mais
#     Claude lit le rail Test/Handoff, jamais `main` comme source métier.
#
#   - aucun secret applicatif n'est exposé : ni Supabase, ni clé de service.
#     Le seul secret référencé est le jeton d'authentification de Claude.
#
#   - le déclenchement exige la chaîne `@claude`. Un push, une ouverture de PR
#     ou une exécution planifiée ne réveillent jamais ce workflow. GitHub Pages
#     sert la branche `production` : rien ici ne peut atteindre app.nexusconseil.net.
#
# Secret attendu : `CLAUDE_CODE_OAUTH_TOKEN` (abonnement Claude, obtenu par
# `claude setup-token`). Pour une clé API à la place, remplacer la ligne
# `claude_code_oauth_token` par `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
# Tant que le secret est absent, l'étape Claude échoue visiblement — elle ne
# se tait pas.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Deuxième garde, après le filtre d'évènements : la mention doit être
    # présente dans le corps concerné. Sinon le job ne démarre pas — aucun
    # runner consommé, aucun jeton émis.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write

    steps:
      # Le workflow est chargé depuis `main`, branche par défaut requise par
      # GitHub pour les évènements d'issues. Le contenu réellement présenté à
      # Claude vient explicitement du rail Test canonique.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: config-par-environnement
          fetch-depth: 1

      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
