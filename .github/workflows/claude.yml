# NEXUS — activation de Claude Code sur les issues et pull requests (06/09/2026).
#
# Ce workflow ne déploie rien. Il réagit uniquement à une mention explicite
# `@claude` dans une issue, un commentaire ou une revue.
#
# La branche de travail présentée à Claude reste explicitement
# `config-par-environnement`. Le workflow vit sur `main` uniquement parce que
# GitHub écoute les événements d'issues/commentaires depuis la branche par défaut.
#
# Décision humaine du 06/09/2026 : le canal Claude peut désormais écrire sur la
# branche de PR Test afin d'implémenter un lot autorisé, exécuter les tests Node
# et consommer le Handoff. Les gates NEXUS restent inchangées : aucun commentaire
# n'autorise une action à lui seul ; STATE + Handoff + décision canonique restent
# obligatoires et aucune promotion Production n'est permise implicitement.
#
# Aucun secret applicatif n'est exposé : ni Supabase, ni service_role. Le seul
# secret référencé est le jeton d'authentification Claude.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: config-par-environnement
          fetch-depth: 1

      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Read,Write,Edit,Glob,Grep,Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rev-parse:*),Bash(git log:*),Bash(git fetch:*)
