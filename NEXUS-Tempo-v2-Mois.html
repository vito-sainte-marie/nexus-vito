<!-- Thème Jour / Nuit : mécanisme existant (data-theme posé sur <html> avant le premier rendu). -->
<script src="nexus-theme.js"></script>
<script src="nexus-banniere-station.js"></script>
<style>
/* Lot V1 « visuel » — Tempo V2. Cette page ne lit aucune donnée métier :
   chaque carte affiche son état vide. Jetons propres à la page (préfixe --t-),
   pour ne pas entrer en collision avec ceux que nexus-theme.js redéfinit. */
:root{
  --t-bg:#07131E; --t-panel:#0D202E; --t-raised:#0F2433; --t-line:#254354;
  --t-text:#EDF1F5; --t-mid:#9AA8B6; --t-cyan:#24D8E3; --t-green:#29C98A; --t-amber:#F5A12A; --t-bar2:#5B7A8E;
  --piste:#22C7B8; --boutique:#C47A55; --fdj:#A18BF2;
  --piste-rgb:34,199,184; --boutique-rgb:196,122,85; --fdj-rgb:161,139,242;
  --a-ico:.14;
  --t-mono:'IBM Plex Mono',monospace; --t-sans:'IBM Plex Sans',sans-serif;
}
:root[data-theme="jour"]{
  --t-bg:#F4F6F8; --t-panel:#FFFFFF; --t-raised:#EEF2F5; --t-line:#D5DCE3;
  --t-text:#0F172A; --t-mid:#475569; --t-cyan:#0B7285; --t-green:#047857; --t-amber:#B45309; --t-bar2:#94A3B8;
  --piste:#0F766E; --boutique:#7A4A3A; --fdj:#6246C9;
  --piste-rgb:15,118,110; --boutique-rgb:122,74,58; --fdj-rgb:98,70,201;
  --a-ico:.10;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--t-bg); color:var(--t-text); font-family:var(--t-sans); min-height:100vh;}
body{display:flex; justify-content:center;}
a{color:inherit;}
.lien-cockpit{color:var(--t-cyan); text-decoration:none; display:inline-block; padding:10px 2px; margin:-10px 0;}
.lien-cockpit:hover{text-decoration:underline;}
.lien-cockpit:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px; border-radius:2px;}
.app{width:100%; max-width:1100px; min-height:100vh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 16px 40px;}

.header{--bg:var(--t-bg); --panel:var(--t-panel); --line:var(--t-line); --cyan:var(--t-cyan); --text:var(--t-text); --banniere-cadrage:60% 45%; --banniere-cadrage-tel:85% 50%; }
.header .pills{position:relative;}
.eyebrow{font-family:var(--t-sans); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--t-cyan);}
.title{font-size:26px; font-weight:600; margin-top:4px;}
.subtitle{font-size:14px; color:var(--t-mid); margin-top:4px;}
.pills{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.pill{font-family:var(--t-sans); font-size:11.5px; padding:6px 12px; border-radius:20px; border:1px solid var(--t-line); background:var(--t-panel); color:var(--t-mid);}
.pill.ambre{color:var(--t-amber); border-color:var(--t-amber); background:color-mix(in srgb, var(--t-amber) 12%, transparent);}
.pill[hidden]{display:none;}

.carte{background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:18px;}
.titre-section{font-family:var(--t-sans); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-mid); margin:28px 0 12px; display:flex; align-items:center; gap:10px;}
.titre-section::after{content:''; flex:1; height:1px; background:var(--t-line);}

.enbref{border-color:var(--t-cyan); margin-top:18px;}
.enbref p{font-size:14.5px; line-height:1.6;}

.niveau{display:inline-block; font-family:var(--t-sans); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:20px; font-weight:600;}
.niveau.mesure{color:var(--t-green); background:color-mix(in srgb, var(--t-green) 13%, transparent);}
.niveau.relation{color:var(--t-cyan); background:color-mix(in srgb, var(--t-cyan) 13%, transparent);}
.niveau.vide-niveau{color:var(--t-mid); background:var(--t-raised); border:1px dashed var(--t-line);}
.niveau.hypothese{color:var(--t-amber); background:transparent; border:1px dotted var(--t-amber);}

/* Lot « signature visuelle » : une couleur par activité, réservée à l'identité de l'activité.
   Jamais sur un niveau, un statut, une évolution ou une attente (ceux-ci gardent leurs couleurs officielles). */
.a-piste{--c-rgb:var(--piste-rgb);}
.a-boutique{--c-rgb:var(--boutique-rgb);}
.a-fdj{--c-rgb:var(--fdj-rgb);}
/* Charte V4 : cadre plein de 1,5 px à 85 % ; ni liseré haut, ni halo, ni fond teinté. */
.act, .colonne.act, .tuile.act{position:relative; border:1.5px solid rgba(var(--c-rgb), .85); background:var(--fond, var(--t-panel));}
.colonne.act{--fond:var(--t-raised);}
.attente-g5::before{content:"◷ ";}
/* valeur mesurée en grand ; états vides (Donnée absente, Historique insuffisant) gardent 15 px */
.valeur .nb{font-family:var(--t-sans); font-size:30px; font-weight:600; color:var(--t-text); line-height:1.15;}
.valeur .unite{font-family:var(--t-sans); font-size:12.5px; font-weight:400; color:var(--t-mid); margin-left:6px;}
.tete-act{display:flex; align-items:center; gap:10px; margin:10px 0 12px;}
.tete-act h3{margin:0;}
.ico{flex:0 0 auto; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
  color:rgb(var(--c-rgb));}
.ico svg{width:22px; height:22px;}
.colonne .ico{width:22px; height:22px;}
.act .q1{background:rgb(var(--c-rgb));}
.act .q2{background:rgba(var(--c-rgb), .45);}
.pastilles{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.pastille{display:inline-flex; align-items:center; gap:5px; font-family:var(--t-sans); font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px 3px 6px; border-radius:20px;
  color:rgb(var(--c-rgb)); background:transparent; border:1px solid rgba(var(--c-rgb), .5);}
.pastille svg{width:14px; height:14px;}
/* Carte croisée : cadre neutre, pastilles d'activité côte à côte, aucun liseré partagé. */
.tuile.croisee{border-color:var(--t-line);}
.attente-ico{margin-right:4px;}
/* Découvertes : le mécanisme existe (classe act + a-… sur la carte, ou plusieurs .pastille côte à côte), mais les trois emplacements restent neutres tant qu'ils sont vides. */

.indicateurs{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:stretch;}
.indicateur h3{font-size:13.5px; font-weight:600; margin:0;}
.indicateur .tete-act{margin:8px 0 8px;}
.periode{font-family:var(--t-sans); font-size:12.5px; color:var(--t-mid); margin-top:6px;}
.valeur{font-family:var(--t-sans); font-size:15px; color:var(--t-mid); line-height:1.4;}
.colonne > .valeur{font-family:var(--t-sans); font-size:13px; color:var(--t-mid);}
.total, .evol{font-family:var(--t-sans); font-size:12.5px; color:var(--t-mid); margin-top:6px;}
.evol{color:var(--t-text); font-weight:500;}
.arbitrage{font-size:12px; line-height:1.5; color:var(--t-amber); margin-top:8px;}

details.compar{margin-top:14px; background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px;}
details.compar summary{list-style:none; cursor:pointer; min-height:44px; padding:12px 18px; display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600;}
details.compar summary::-webkit-details-marker{display:none;}
details.compar summary::after{content:'▾'; margin-left:auto; color:var(--t-mid); transition:transform .2s;}
details.compar[open] summary::after{transform:rotate(180deg);}
.compar-corps{padding:0 18px 18px;}
.colonnes4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.colonne{background:var(--t-raised); border:1px solid var(--t-line); border-radius:12px; padding:14px;}
.colonne h4{font-size:12.5px; font-weight:600; margin-bottom:8px;}

.colonnes3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:stretch;}
.indicateur, .colonnes3 > .colonne{display:flex; flex-direction:column;}
.indicateur > :last-child, .colonnes3 > .colonne > :last-child{margin-top:auto;}
.quarts h3{font-size:13.5px; font-weight:600; margin:0 0 4px;}
.barre{margin-top:12px;}
.barre-etiquette{display:flex; justify-content:space-between; font-family:var(--t-sans); font-size:12px; color:var(--t-mid); margin-bottom:5px;}
.barre-piste{height:10px; border-radius:6px; background:var(--t-raised); border:1px solid var(--t-line); overflow:hidden;}
.barre-remplie{height:100%; width:0; border-radius:6px;}
.q1{background:var(--t-cyan);}
.q2{background:var(--t-bar2);}
.pied-bloc{margin-top:16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px;}
.pied-bloc p{font-size:13px; color:var(--t-mid); flex:1 1 280px;}
.lien-inactif{display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border:1px solid var(--t-line); border-radius:10px; font-size:13px; color:var(--t-mid); opacity:.7; cursor:default;}

.decouvertes{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.decouverte.vide{display:none;}
.decouvertes-attente{display:none; grid-column:1 / -1; font-size:13px; color:var(--t-mid); margin:0;}
.decouvertes:not(:has(.decouverte:not(.vide))) .decouvertes-attente{display:block;}
.decouvertes:not(:has(.decouverte:not(.vide))){display:block;}
.decouverte h3{font-size:14px; font-weight:600; margin:10px 0 6px;}
.decouverte .texte{font-size:13px; line-height:1.55; color:var(--t-mid);}
.source{font-family:var(--t-sans); font-size:12px; color:var(--t-mid); margin-top:10px;}
.preuves{display:inline-flex; align-items:center; min-height:44px; margin-top:6px; font-size:13px; color:var(--t-mid); opacity:.7; cursor:default;}

.analyses{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.analyses-wrap{position:relative;}
.fleche{display:none;}
.tuile .t-titre{display:block;}
.tuile .t-sous{display:block; margin-top:6px; font-size:12px; font-weight:400; color:var(--t-mid); line-height:1.4;}
.tuile{min-height:44px; background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:16px; font-size:13.5px; font-weight:500; line-height:1.4; cursor:default;}

.tuile .prep{display:inline-block; margin-top:10px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:500; color:var(--t-mid); background:var(--t-raised);}
/* Interaction : réservée aux tuiles disponibles (lien réel). Aucune des six ne l'est encore. */
.tuile.disponible{position:relative; display:block; color:inherit; text-decoration:none; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
.tuile.disponible::after{content:"\203A"; position:absolute; right:14px; bottom:10px; font-size:22px; line-height:1; color:var(--t-mid); opacity:.8;}
.tuile.disponible:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.tuile.disponible:active{transform:scale(.99); filter:brightness(.95);}
@media (hover: hover) and (pointer: fine){
  .tuile.disponible:hover{transform:translateY(-3px) scale(1.015); box-shadow:0 6px 14px rgba(0,0,0,.18); border-color:var(--t-cyan);}
  .tuile.disponible.act:hover{border-color:rgb(var(--c-rgb));}
  .tuile.disponible:hover::after{opacity:1; color:var(--t-text);}
}
@media (prefers-reduced-motion: reduce){
  .tuile.disponible{transition:none;}
  .tuile.disponible:hover, .tuile.disponible:active{transform:none;}
}

footer{margin-top:32px; padding-top:18px; border-top:1px solid var(--t-line);}
footer .regle{font-size:13.5px; color:var(--t-text);}
footer .regle b{font-weight:600;}
footer .sources{font-family:var(--t-sans); font-size:11px; color:var(--t-mid); margin-top:8px;}

.reserve{padding:60px 20px; text-align:center; color:var(--t-mid);}

@media (max-width:767px){
  .indicateurs, .colonnes3, .decouvertes, .colonnes4{grid-template-columns:1fr;}
  .analyses{display:flex; overflow-x:auto; gap:10px; padding-bottom:6px; -webkit-overflow-scrolling:touch;}
  .tuile{flex:0 0 220px;}
  .fleche{position:absolute; top:0; right:0; bottom:6px; width:44px; min-height:44px; display:flex; align-items:center; justify-content:flex-end; padding:0 8px 0 0; border:0; border-radius:0 14px 14px 0; background:linear-gradient(to right, transparent, var(--t-bg) 70%); color:var(--t-cyan); font-size:30px; line-height:1; cursor:pointer;}
  .fleche.masquee{display:none;}
  .title{font-size:22px;}
}

.retour{display:inline-flex; align-items:center; min-height:44px; font-size:13.5px; color:var(--t-mid); text-decoration:none; margin-top:8px;}
.retour:hover{color:var(--t-text);}
.retour:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.reponse{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;}
.reponse p{flex:1 1 320px; font-size:15px; line-height:1.55;}
.tableau{width:100%; border-collapse:collapse; font-size:13.5px;}
.tableau th{font-family:var(--t-sans); font-size:12px; letter-spacing:.02em; font-weight:600; color:var(--t-mid); text-align:right; padding:8px 10px; border-bottom:1px solid var(--t-line);}
.tableau th:first-child, .tableau td:first-child{text-align:left;}
.tableau td{padding:10px; border-bottom:1px solid var(--t-line); text-align:right; font-family:var(--t-sans); font-weight:600; font-variant-numeric:tabular-nums;}
.tableau td:first-child{font-family:var(--t-sans); font-weight:500;}
.tableau tr:last-child td{border-bottom:0;}
.tableau td.faible{color:var(--t-mid); opacity:.6;}
.tableau .nb-quarts{display:block; font-size:10.5px; color:var(--t-mid);}
.defilement{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.phrase{font-size:13.5px; line-height:1.55; color:var(--t-mid); margin-top:12px;}
.sens li{font-size:13.5px; line-height:1.55; color:var(--t-mid); margin:6px 0 0 18px;}
.indispo{display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border:1px solid var(--t-line); border-radius:10px; font-size:13px; color:var(--t-mid); opacity:.7; cursor:not-allowed; background:transparent; font-family:inherit;}
.mention{font-size:12px; color:var(--t-mid); margin-top:6px;}
.barre{display:block; height:6px; border-radius:3px; margin-top:4px; background:rgb(var(--c-rgb,var(--piste-rgb))); min-width:2px;}
.barre.q2{opacity:.45;}
.exc{display:block; font-size:10.5px; color:var(--t-amber);}
.sous-titre{font-size:12.5px; font-weight:600; margin:16px 0 6px; color:var(--t-text);}
.preuves-liste{font-size:12.5px; line-height:1.55; color:var(--t-mid); margin:8px 0 0 18px;}
.notes{font-size:12px; line-height:1.5; color:var(--t-amber); margin-top:8px;}
.graphique{position:relative; margin-top:10px;}
.graphique .defilement{padding-bottom:4px;}
.graphique svg.barres{display:block; height:auto; min-width:100%;}
.graphique svg text{font-family:var(--t-sans); fill:var(--t-mid); font-size:11px;}
.graphique svg text.valeur-barre{fill:var(--t-text); font-weight:600; font-size:11px;}
.graphique svg .base{stroke:var(--t-line); stroke-width:1;}
.graphique svg .barre-mois{fill:rgb(var(--c-rgb));}
.graphique svg .non-retenu-fond{stroke:rgb(var(--c-rgb)); stroke-opacity:.5; stroke-width:1; stroke-dasharray:3 3; fill:none;}
.graphique svg .marque{fill:var(--t-text); stroke:var(--t-panel); stroke-width:1.5;}
.graphique svg g.mois-groupe{cursor:default; outline:none;}
.graphique svg g.mois-groupe:focus-visible .zone, .graphique svg g.mois-groupe:hover .zone{fill:rgb(var(--c-rgb)); fill-opacity:.1;}
.graphique svg .zone{fill:transparent;}
.infobulle{position:absolute; z-index:5; display:none; max-width:260px; padding:10px 12px; background:var(--t-raised); border:1px solid var(--t-line); border-radius:10px; font-size:12.5px; line-height:1.45; color:var(--t-text); box-shadow:0 6px 14px rgba(0,0,0,.18); pointer-events:none;}
.infobulle div + div{margin-top:3px; color:var(--t-mid);}
.infobulle div:first-child{font-weight:600; color:var(--t-text);}
.legende{font-size:12px; color:var(--t-mid); margin-top:8px;}
details.valeurs{margin-top:12px;}
details.valeurs summary{cursor:pointer; min-height:44px; display:flex; align-items:center; font-size:13px; color:var(--t-mid);}
details.valeurs .tableau td, details.valeurs .tableau th{white-space:nowrap;}
</style>

    <div class="entete-texte">
      <a class="retour" href="NEXUS-Tempo-v2.html">‹ Tempo</a>
      <div class="eyebrow">NEXUS · Comprendre</div>

      <div class="subtitle" id="sousTitrePage"></div>
      <div class="pills">
        <span class="pill" id="pillSite">Station</span>
        <span class="pill a-piste" id="pillPiste">Piste</span>
        <span class="pill a-boutique" id="pillBoutique">Boutique</span>
        <span class="pill a-fdj" id="pillFdj">FDJ</span>
      </div>
    </div>
  </header>

  <div id="contenu">
    <section class="carte act a-piste" id="blocPiste">
      <div class="tete-act"><span class="ico" aria-hidden="true"><svg aria-hidden="true"><use href="#i-piste"/></svg></span><h3 id="titrePiste"></h3></div>
      <p class="mention" id="uniteLignePiste"></p>
      <div class="graphique" id="graphPiste"></div>
      <p class="legende" id="legendePiste"></p>
      <details class="valeurs" id="valeursPiste"><summary id="resumePiste"></summary><div class="defilement" id="tablePiste"></div></details>
    </section>

    <section class="carte act a-fdj" id="blocFdj" style="margin-top:18px">
      <div class="tete-act"><span class="ico" aria-hidden="true"><svg aria-hidden="true"><use href="#i-fdj"/></svg></span><h3 id="titreFdj"></h3></div>
      <p class="mention" id="uniteLigneFdj"></p>
      <div class="graphique" id="graphFdj"></div>
      <p class="legende" id="legendeFdj"></p>
      <details class="valeurs" id="valeursFdj"><summary id="resumeFdj"></summary><div class="defilement" id="tableFdj"></div></details>
    </section>

    <section class="carte act a-boutique" id="blocBoutique" style="margin-top:18px">
      <div class="tete-act"><span class="ico" aria-hidden="true"><svg aria-hidden="true"><use href="#i-boutique"/></svg></span><h3 id="titreBoutique"></h3></div>
      <p class="phrase" id="phraseBoutique"></p>
      <p class="mention" id="periodesBoutique"></p>
    </section>

    <p class="mention" id="anneePrecedente" style="margin-top:18px"></p>
  </div>

  <footer>
    <div class="regle"><b>Tempo analyse et explique.</b> Les décisions se prennent dans le <a class="lien-cockpit" href="NEXUS-Cockpit-v2.html" aria-label="Ouvrir le Cockpit">Cockpit</a>.</div>
    <div class="sources" id="piedSources"></div>
  </footer>
</div>
<script>
(function () {
  const M = window.NexusVocab && window.NexusVocab.mois;
  async function fetchAllRows(builderFactory, pageSize = 1000) {
    const out = [];
    for (let from = 0; ; from += pageSize) {
      const { data, error } = await builderFactory().range(from, from + pageSize - 1);
      if (error) return { data: null, error };
      out.push(...data);
      if (data.length < pageSize) break;
    }
    return { data: out, error: null };
  }
  const fmtNb = n => Math.round(n).toLocaleString('fr-FR');
  const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '';
  const signePct = pct => { const v = Math.round(pct * 10) / 10; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %'; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => document.getElementById(id);

  function remplirTextes() {
    document.title = M.titreOnglet;
    $('titrePage').textContent = M.titre;
    $('sousTitrePage').textContent = M.sousTitre;
    $('titrePiste').textContent = M.piste.titre;
    $('uniteLignePiste').textContent = M.piste.unite + '. ' + M.piste.depuis;
    $('legendePiste').textContent = M.legendeManquant + ' ' + M.legendeNonRetenu;
    $('resumePiste').textContent = M.tableau;
    $('titreFdj').textContent = M.fdj.titre;
    $('uniteLigneFdj').textContent = M.fdj.unite + '. ' + M.fdj.depuis;
    $('legendeFdj').textContent = M.legendeManquant + ' ' + M.legendeNonRetenu;
    $('resumeFdj').textContent = M.tableau;
    $('titreBoutique').textContent = M.boutique.titre;
    $('phraseBoutique').textContent = M.boutique.phrase;
    $('anneePrecedente').textContent = M.anneePrecedente;
  }

  // Graphique en barres, SVG inline : une barre par mois écoulé, hauteur = moyenne par jour complet.
  function dessiner(idZone, idTable, barres, suffixe, uid) {
    const zone = $(idZone);
    if (!barres.length) { zone.innerHTML = '<p class="mention">' + esc(M.aucuneDonnee) + '</p>'; return; }
    const LARG = 56, GAUCHE = 20, HAUT = 230, BASE = 190, MAXB = 150;
    const largeur = GAUCHE * 2 + LARG * barres.length;
    const maxi = Math.max.apply(null, barres.filter(b => b.retenu).map(b => b.hauteur).concat([1]));
    let svg = '<svg class="barres" role="img" aria-label="' + esc(M.titre) + '" viewBox="0 0 ' + largeur + ' ' + HAUT + '" width="' + largeur + '" height="' + HAUT + '">';
    svg += '<line class="base" x1="' + GAUCHE + '" y1="' + BASE + '" x2="' + (largeur - GAUCHE) + '" y2="' + BASE + '"/>';
    barres.forEach((b, i) => {
      const x = GAUCHE + i * LARG, cx = x + LARG / 2;
      const etiquette = b.lignes.join('. ');
      svg += '<g class="mois-groupe" tabindex="0" data-i="' + i + '" data-cle="' + esc(b.cle) + '" aria-label="' + esc(etiquette) + '"><title>' + esc(b.lignes.join('\n')) + '</title>';
      svg += '<rect class="zone" x="' + x + '" y="8" width="' + LARG + '" height="' + (HAUT - 8) + '"/>';
      if (b.retenu) {
        const h = Math.max(2, Math.round(b.hauteur / maxi * MAXB));
        svg += '<rect class="barre-mois" data-hauteur="' + b.hauteur + '" x="' + (x + 10) + '" y="' + (BASE - h) + '" width="' + (LARG - 20) + '" height="' + h + '" rx="3"/>';
        svg += '<text class="valeur-barre" x="' + cx + '" y="' + (BASE - h - 8) + '" text-anchor="middle">' + fmtNb(b.hauteur) + '</text>';
        if (b.marqueManquant) svg += '<circle class="marque" cx="' + cx + '" cy="' + (BASE - h - 22) + '" r="4"/>';
      } else {
        svg += '<rect class="non-retenu-fond" x="' + (x + 10) + '" y="' + (BASE - MAXB) + '" width="' + (LARG - 20) + '" height="' + MAXB + '" rx="3"/>';
        svg += '<text x="' + cx + '" y="' + (BASE - MAXB / 2) + '" text-anchor="middle" font-size="9">' + esc(M.nonRetenu) + '</text>';
      }
      svg += '<text x="' + cx + '" y="208" text-anchor="middle">' + esc(b.court) + '</text>';
      if (i === 0 || b.court === M.courts[0]) svg += '<text x="' + cx + '" y="222" text-anchor="middle">' + esc(b.annee) + '</text>';
      svg += '</g>';
    });
    svg += '</svg>';
    zone.innerHTML = '<div class="defilement">' + svg + '</div><div class="infobulle" role="tooltip"></div>';
    const bulle = zone.querySelector('.infobulle');
    const montrer = g => {
      const b = barres[Number(g.getAttribute('data-i'))];
      bulle.innerHTML = b.lignes.map(l => '<div>' + esc(l) + '</div>').join('');
      bulle.style.display = 'block';
      const r = g.getBoundingClientRect(), z = zone.getBoundingClientRect();
      let gauche = r.left - z.left + r.width / 2 - bulle.offsetWidth / 2;
      gauche = Math.max(0, Math.min(gauche, z.width - bulle.offsetWidth));
      bulle.style.left = gauche + 'px';
      bulle.style.top = '0px';
    };
    zone.querySelectorAll('g.mois-groupe').forEach(g => {
      g.addEventListener('mouseenter', () => montrer(g));
      g.addEventListener('focus', () => montrer(g));
      g.addEventListener('click', () => montrer(g));
      g.addEventListener('mouseleave', () => { bulle.style.display = 'none'; });
      g.addEventListener('blur', () => { bulle.style.display = 'none'; });
    });
    // Tableau repliable : les mêmes valeurs que le graphique.
    const E = M.entetes;
    let tab = '<table class="tableau"><thead><tr><th>' + esc(E.mois) + '</th><th>' + esc(E.moyenne) + '</th><th>' + esc(E.jours) + '</th><th>' + esc(E.evolution) + '</th><th>' + esc(E.remarque) + '</th></tr></thead><tbody>';
    barres.forEach(b => {
      const evo = b.retenu && b.evolution ? b.evolution + (b.pct != null ? ' (' + signePct(b.pct) + ')' : '') : '';
      const rem = !b.retenu ? M.nonRetenu : (b.manquants ? M.mentionManquants(b.manquants) : '');
      tab += '<tr data-cle="' + esc(b.cle) + '"><td>' + esc(b.libelle) + '</td><td>' + (b.retenu ? esc(fmtNb(b.hauteur) + suffixe) : esc(M.nonRetenu)) + '</td><td>' + esc(b.nbJours) + '</td><td>' + esc(evo) + '</td><td>' + esc(rem) + '</td></tr>';
    });
    tab += '</tbody></table>';
    $(idTable).innerHTML = tab;
  }

  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (!nexusEstManager(employee)) { $('app').innerHTML = '<div class="reserve">Cet écran est réservé aux managers.</div>'; return; }
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-Tempo-v2-Mois.html', employee.site_id))) return;
    try {
      if (NexusBanniereStation.siteAvecBanniere(employee.site_id, NexusBanniereStation.apercuDemande())) {
        const b = 'assets/tempo/tempo-mois';
        document.getElementById('enTete').insertAdjacentHTML('afterbegin', `<div class="am-banniere" data-photo-jour="${b}-1200.webp" data-photo-nuit="${b}-1200.webp"><img src="${b}-1200.webp" srcset="${b}-800.webp 800w, ${b}-1200.webp 1200w, ${b}-1600.webp 1600w" sizes="(max-width:820px) 100vw, 900px" width="800" height="267" alt="" decoding="async" onerror="this.parentNode.remove()"></div>`);
      }
      NexusBanniereStation.suivreTheme();
    } catch (e) {}
    if (!M) { $('contenu').innerHTML = '<div class="reserve">Le lexique n’est pas chargé.</div>'; return; }
    remplirTextes();
    const siteId = employee.site_id;
    const T = window.NexusTempo;
    const bornes = T.bornesPeriodeIndicateurs();
    const [rSite, rAud, rFdj, rCal, rProd] = await Promise.all([
      nexusClient.from('sites').select('nom_entreprise').eq('site_id', siteId).maybeSingle(),
      fetchAllRows(() => nexusClient.from('audits_caisse')
        .select('date, quart, litrage_gazole, litrage_sp95, litrage_gnr, vente_piste, vente_boutique')
        .eq('site', siteId).gte('date', T.DEBUT_MOIS_PISTE).lte('date', bornes.fin).order('date', { ascending: true })),
      fetchAllRows(() => nexusClient.from('view_fdj_daily_summary')
        .select('date, nb_quarts_controles, ca_grattage, caisse_tirages')
        .eq('site', siteId).gte('date', T.DEBUT_MOIS_FDJ).lte('date', bornes.fin).order('date', { ascending: true })),
      nexusClient.from('inventaire_calendrier_site').select('date, type, libelle').eq('site', siteId)
        .in('type', ['vacances', 'ferie']).gte('date', T.DEBUT_MOIS_FDJ).lte('date', bornes.fin).order('date', { ascending: true }),
      fetchAllRows(() => nexusClient.from('products').select('categorie, article, ca, marge, periode_debut, periode_fin').eq('site', siteId))
    ]);
    if (rSite && rSite.data && rSite.data.nom_entreprise) $('pillSite').textContent = rSite.data.nom_entreprise;
    if (!rCal.error) T.definirVacances(rCal.data);
    const feries = rCal.error ? [] : rCal.data;
    if (rAud.error) { $('graphPiste').innerHTML = '<p class="mention">' + esc(M.aucuneDonnee) + '</p>'; }
    else {
      const mois = T.moisParMois(T.joursLitresCompletsPiste(rAud.data), T.DEBUT_MOIS_PISTE, bornes.exclu, feries);
      dessiner('graphPiste', 'tablePiste', T.barresMois(mois, 'piste'), M.piste.suffixe, 'p');
    }
    if (rFdj.error) { $('graphFdj').innerHTML = '<p class="mention">' + esc(M.aucuneDonnee) + '</p>'; }
    else {
      const mois = T.moisParMois(T.joursCaFdjComplets(rFdj.data), T.DEBUT_MOIS_FDJ, bornes.exclu, feries);
      dessiner('graphFdj', 'tableFdj', T.barresMois(mois, 'fdj', rFdj.data), M.fdj.suffixe, 'f');
    }
    // Boutique : aucune valeur mois par mois, seulement les périodes d'import.
    let periodes = [];
    if (!rProd.error) {
      const vus = {};
      rProd.data.forEach(r => { if (r.periode_debut && r.periode_fin) vus[r.periode_debut + '|' + r.periode_fin] = [r.periode_debut, r.periode_fin]; });
      periodes = Object.keys(vus).sort().map(k => fmtDate(vus[k][0]) + ' au ' + fmtDate(vus[k][1]));
    }
    $('periodesBoutique').textContent = M.boutique.periodes(periodes);
    $('piedSources').textContent = 'Sources : audits_caisse · view_fdj_daily_summary · inventaire_calendrier_site · products · sites · lecture seule · calculé le : ' +
      new Intl.DateTimeFormat('fr-FR', { timeZone: 'America/Martinique', dateStyle: 'short', timeStyle: 'short' }).format(new Date()) + ' (heure de la station)';
  });
})();
</script>
</body>
</html>
