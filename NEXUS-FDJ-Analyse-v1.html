  // ------------------------------------------------------------
  // RAPPORTS / EXPORT — audit Coach x FDJ Pilotage §23, §27 étape 14 —
  // revu le 10/08/2026 à la demande de Frédéric : NEXUS ne dépend plus
  // de window.print() (limites documentées des PWA iOS en mode
  // standalone : aperçu d'impression non fonctionnel). Le moteur PDF
  // (nexus-pdf-moteur.js, générique, partagé par tout NEXUS) reçoit
  // directement les DONNÉES déjà calculées par cette page et compose
  // un vrai fichier PDF — jamais une "photo" de l'écran. "Sélection par
  // dates ou numéro de semaine, hebdomadaire / mensuel / annuel" (§23)
  // : déjà couverte par le sélecteur de période universel de la page
  // (§8), pas de second sélecteur à construire.
  //
  // assemblerDonneesRapportFdj() réutilise EXACTEMENT les mêmes
  // fonctions/agrégations que le reste de la page (chargerDonneesPeriode,
  // candidatsFdjPeriode, chargerSyntheseCoachEquipe/calculerSyntheseCoach,
  // calculerEtatStock, etatLigneStock) — jamais une troisième version
  // des mêmes règles (Article 11, "une seule vérité"). Les seules
  // agrégations nouvelles ici (Top jeux, Top vendeurs, répartition par
  // palier) reprennent le calcul déjà fait ailleurs sur la page
  // (onglets Jeux/Équipe/Vue d'ensemble), pas une nouvelle formule.
  // ------------------------------------------------------------
  // Granularité du rapport 1 page (10/08/2026, demande de Frédéric) :
  // « Pour les rapports mensuels et annuels, je conserverais également 1
  // page A4. Mais NEXUS change les informations affichées. Hebdomadaire :
  // jours, quarts, jeux, écarts. Mensuel : semaines, tendances,
  // progression, employés, mix jeux. Annuel : mois, saisonnalité,
  // progression annuelle, catégories, principaux constats. » Concrètement :
  // un graphique et un "jour le plus fort / à booster" à la journée n'ont
  // aucun sens sur un an (365 points illisibles sur un petit graphique) —
  // ce classificateur détermine à quelle granularité regrouper la courbe
  // CA et le point de synthèse "meilleure/pire unité", tout le reste du
  // rapport (KPI, Top jeux, palier, équipe, stock, décisions) restant
  // valide à n'importe quelle échelle de temps.
  function classifierTypePeriode(type, debut, fin) {
    if (type === 'annee' || type === 'annee_precedente') return 'annuel';
    if (type === 'mois' || type === 'mois_precedent') return 'mensuel';
    if (type === 'personnalise' && debut && fin) {
      const jours = Math.round((fin - debut) / 86400000) + 1;
      if (jours > 64) return 'annuel';
      if (jours > 10) return 'mensuel';
    }
    return 'hebdomadaire';
  }

  // Regroupe des lignes quotidiennes (avec .date et .ca_grattage) par
  // semaine ISO — même numérotation que numeroSemaineISO() utilisée
  // ailleurs sur la page (Article 11, une seule définition de "semaine").
  function regrouperParSemaine(lignes) {
    const parSemaine = {};
    lignes.forEach(l => {
      if (l.ca_grattage === null) return;
      const d = new Date(l.date + 'T00:00:00');
      const sem = numeroSemaineISO(d);
      const cle = `${d.getFullYear()}-S${String(sem).padStart(2, '0')}`;
      if (!parSemaine[cle]) parSemaine[cle] = { cle, label: `Semaine ${sem}`, ca: 0, premiereDate: l.date };
      parSemaine[cle].ca += Number(l.ca_grattage);
    });
    return Object.values(parSemaine).sort((a, b) => a.premiereDate.localeCompare(b.premiereDate));
  }

  // Regroupe des lignes quotidiennes par mois calendaire.
  function regrouperParMois(lignes) {
    const parMois = {};
    lignes.forEach(l => {
      if (l.ca_grattage === null) return;
      const cle = l.date.slice(0, 7);
      if (!parMois[cle]) parMois[cle] = { cle, label: new Date(cle + '-01T00:00:00').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }), ca: 0 };
      parMois[cle].ca += Number(l.ca_grattage);
    });
    return Object.values(parMois).sort((a, b) => a.cle.localeCompare(b.cle));
  }

  async function assemblerDonneesRapportFdj() {
    const d = await chargerDonneesPeriode();
    const actuel = sommerChamps(d.daily.actuel, CHAMPS_SUMMARY);
    const comp = sommerChamps(d.daily.comp, CHAMPS_SUMMARY);
    const compDisponible = comp.nb_quarts_controles > 0;
    const evolCa = compDisponible ? evolution(actuel.ca_grattage, comp.ca_grattage) : null;
    const tauxConformite = actuel.nb_quarts_controles > 0 ? actuel.nb_quarts_conformes / actuel.nb_quarts_controles : null;
    const nbNonControles = actuel.nb_quarts - actuel.nb_quarts_controles;

    // Top jeux — même agrégation que l'onglet Jeux.
    const parJeuActuel = {};
    d.gameDaily.actuel.forEach(l => {
      if (!parJeuActuel[l.game_id]) parJeuActuel[l.game_id] = { ca: 0, tickets: 0 };
      if (l.ca) parJeuActuel[l.game_id].ca += Number(l.ca);
      if (l.tickets_vendus) parJeuActuel[l.game_id].tickets += Number(l.tickets_vendus);
    });
    const topJeux = jeux
      .map(j => ({ jeu: j, ca: (parJeuActuel[j.id] || {}).ca || 0, tickets: (parJeuActuel[j.id] || {}).tickets || 0 }))
      .filter(l => l.ca > 0).sort((a, b) => b.ca - a.ca);
    // Pas de plafond ici : le rapport 1 page (construireRapportPdf) et
    // les autres consommateurs de cette liste décident eux-mêmes
    // combien afficher (Article 11 — la donnée reste complète, seule la
    // présentation plafonne).
    const jeuMoteur = topJeux[0] ? topJeux[0].jeu : null;

    // Répartition du CA par palier (1/2/3/5/10/15 €) — même agrégation que la Vue d'ensemble.
    const palierCa = {};
    d.gameDaily.actuel.forEach(l => { if (l.ca) { const j = jeux.find(x => x.id === l.game_id); if (j) palierCa[j.prix] = (palierCa[j.prix] || 0) + Number(l.ca); } });
    const repartitionPalier = Object.entries(palierCa).map(([prix, ca]) => ({ prix: Number(prix), ca })).sort((a, b) => a.prix - b.prix);
    let palierMoteur = null, caPalierMoteur = 0;
    repartitionPalier.forEach(p => { if (p.ca > caPalierMoteur) { caPalierMoteur = p.ca; palierMoteur = p.prix; } });

    // Granularité du rapport — voir classifierTypePeriode() : détermine si
    // "meilleure/pire unité" et la courbe CA se lisent au jour (rapport
    // hebdomadaire ou plus court), à la semaine (mensuel) ou au mois
    // (annuel). Jamais la même courbe journalière compressée pour toutes
    // les échelles (10/08/2026, retour de Frédéric).
    const typePeriode = classifierTypePeriode(periodeActuelle.type, periodeResolue.debut, periodeResolue.fin);
    const labelUnite = typePeriode === 'annuel' ? 'mois' : (typePeriode === 'mensuel' ? 'semaine' : 'jour');

    let meilleureUnite = null, pireUnite = null, labelsCa = [], valeursCa = [];
    if (typePeriode === 'annuel') {
      const mois = regrouperParMois(d.daily.actuel);
      if (mois.length) {
        const tries = [...mois].sort((a, b) => b.ca - a.ca);
        meilleureUnite = { label: tries[0].label, ca: tries[0].ca };
        pireUnite = tries.length > 1 ? { label: tries[tries.length - 1].label, ca: tries[tries.length - 1].ca } : null;
      }
      labelsCa = mois.map(m => new Date(m.cle + '-01T00:00:00').toLocaleDateString('fr-FR', { month: 'short' }));
      valeursCa = mois.map(m => m.ca);
    } else if (typePeriode === 'mensuel') {
      const semaines = regrouperParSemaine(d.daily.actuel);
      if (semaines.length) {
        const tries = [...semaines].sort((a, b) => b.ca - a.ca);
        meilleureUnite = { label: tries[0].label, ca: tries[0].ca };
        pireUnite = tries.length > 1 ? { label: tries[tries.length - 1].label, ca: tries[tries.length - 1].ca } : null;
      }
      labelsCa = semaines.map(s => s.label.replace('Semaine ', 'S'));
      valeursCa = semaines.map(s => s.ca);
    } else {
      const joursTries = [...d.daily.actuel].filter(l => l.ca_grattage !== null).sort((a, b) => Number(b.ca_grattage) - Number(a.ca_grattage));
      if (joursTries[0]) meilleureUnite = { label: new Date(joursTries[0].date + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }), ca: Number(joursTries[0].ca_grattage) };
      if (joursTries.length > 1) { const p = joursTries[joursTries.length - 1]; pireUnite = { label: new Date(p.date + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }), ca: Number(p.ca_grattage) }; }
      const lignesTriees = d.daily.actuel.slice().sort((a, b) => a.date.localeCompare(b.date));
      labelsCa = lignesTriees.map(l => new Date(l.date + 'T00:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }));
      valeursCa = lignesTriees.map(l => l.ca_grattage !== null ? Number(l.ca_grattage) : 0);
    }

    // Top vendeurs — même agrégation que l'onglet Équipe (même seuil minimum de quarts pour le CA moyen).
    const SEUIL_MIN_QUARTS = (await chargerParametresFdjSite()).seuil_min_quarts_moyenne ?? 3;
    const parEmployeActuel = {};
    d.employeeDaily.actuel.forEach(l => {
      if (!parEmployeActuel[l.employee_id]) parEmployeActuel[l.employee_id] = { ca: 0, quarts: 0, quartsControles: 0, quartsConformes: 0 };
      const e = parEmployeActuel[l.employee_id];
      e.ca += Number(l.ca_grattage || 0); e.quarts += Number(l.nb_quarts || 0);
      e.quartsControles += Number(l.nb_quarts_controles || 0); e.quartsConformes += Number(l.nb_quarts_conformes || 0);
    });
    const topVendeurs = Object.entries(parEmployeActuel).map(([id, e]) => ({
      nom: nomEmploye(id), ca: e.ca, quarts: e.quarts,
      caMoyen: e.quartsControles >= SEUIL_MIN_QUARTS ? e.ca / e.quartsControles : null,
    })).sort((a, b) => b.ca - a.ca).slice(0, 8);

    // Stock & activations — état actuel (comme l'onglet Stock, indépendant de la période) + activations sur la période sélectionnée.
    const { soldes } = await calculerEtatStock();
    const enRupture = jeux.filter(j => etatLigneStock(soldes[j.id] || {}).texte.includes('Rupture'));
    const enVigilance = jeux.filter(j => etatLigneStock(soldes[j.id] || {}).texte.includes('Vigilance'));
    const activationsPeriode = d.gameDaily.actuel.reduce((s, l) => s + Number(l.nb_activations || 0), 0);

    // Signaux, décisions et Coach FDJ — moteurs partagés, jamais recalculés ici.
    const [candidatsBrut, coachData] = await Promise.all([candidatsFdjPeriode(), chargerSyntheseCoachEquipe()]);
    const decisions = candidatsBrut.map(NexusConseiller.normaliserFdj).sort((a, b) => a.rang - b.rang).slice(0, 6);
    const syntheseCoach = calculerSyntheseCoach(coachData.actuel, coachData.comp);

    return {
      site: siteId, periodeLabel: periodeResolue.label,
      periodeSousLabel: `${periodeResolue.debut.toLocaleDateString('fr-FR')} → ${periodeResolue.fin.toLocaleDateString('fr-FR')}`,
      labelComp: periodeResolue.labelComp, genereLe: new Date(),
      donneesProvisoires: nbNonControles > 0, nbNonControles, totalQuarts: actuel.nb_quarts,
      ca: actuel.ca_grattage, caisseTirages: actuel.caisse_tirages, caisseReelleTotale: actuel.caisse_reelle_totale, evolCa, tauxConformite,
      quartsControles: actuel.nb_quarts_controles, quartsConformes: actuel.nb_quarts_conformes,
      ecartTotal: actuel.ecart_total, nbEcartsNonNuls: actuel.nb_ecarts_non_nuls,
      jeuMoteur, palierMoteur, typePeriode, labelUnite, meilleureUnite, pireUnite, labelsCa, valeursCa,
      topJeux, repartitionPalier, topVendeurs,
      enRupture, enVigilance, activationsPeriode,
      decisions, syntheseCoach,
    };
  }

  // Graphique CA — rendu sur un canvas JAMAIS attaché au DOM (dimensions
  // fixes, responsive:false), uniquement pour produire une image PNG à
  // intégrer au PDF via chart.toBase64Image(). Détruit aussitôt après :
  // pas d'instance Chart.js fantôme qui traînerait en mémoire.
  //
  // Capture différée via animation.onComplete (jamais un appel
  // synchrone juste après `new Chart(...)`) : Chart.js dessine son
  // premier rendu via requestAnimationFrame, pas forcément terminé au
  // moment où le constructeur retourne — un appel immédiat à
  // toBase64Image() capturerait parfois un canvas encore vide.
  //
  // Bug corrigé le 10/08/2026 (retour de Frédéric, erreur "Cannot access
  // 'chart' before initialization") : avec `duration: 0`, Chart.js peut
  // appeler onComplete de façon SYNCHRONE, pendant l'exécution même de
  // `new Chart(...)` — donc avant que l'affectation `const chart = ...`
  // soit terminée (zone morte temporelle de `const`). Passer par
  // l'objet reçu par le callback (`animation.chart`, documenté par
  // Chart.js pour cet usage précis) plutôt que par la variable fermée
  // `chart` évite complètement le problème.
  // Canvas volontairement très large et bas (aspect ~4,6:1) : dans le
  // rapport 1 page, la zone "graphique" ne dispose que d'environ 45mm
  // de hauteur (contre le pleine hauteur d'un rapport détaillé) — un
  // canvas proche du ratio final évite qu'une image "carrée" soit
  // redimensionnée en une bande étroite au centre de la page (retour de
  // Frédéric du 10/08/2026 : « le graphique actuel est beaucoup trop
  // haut… avec environ 1/3 de sa hauteur actuelle »).
  function genererImageGraphiqueCa(labels, valeurs) {
    return new Promise(resolve => {
      const canvas = document.createElement('canvas');
      canvas.width = 1200; canvas.height = 260;
      new Chart(canvas, {
        type: 'line',
        data: { labels, datasets: [{ data: valeurs, borderColor: '#0a6b78', backgroundColor: 'rgba(10,107,120,0.15)', fill: true, tension: 0.25, pointRadius: 3, borderWidth: 2 }] },
        options: {
          responsive: false,
          animation: {
            duration: 0,
            onComplete: (animation) => {
              const chartInstance = animation.chart;
              const dataUrl = chartInstance.toBase64Image('image/png', 1);
              chartInstance.destroy();
              resolve(dataUrl);
            },
          },
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#333', font: { size: 13 } }, grid: { color: '#e2e2e2' } },
            y: { ticks: { color: '#333', font: { size: 13 } }, grid: { color: '#e2e2e2' }, beginAtZero: true },
          },
        },
      });
    });
  }

  // Compose un texte "Conseil NEXUS" court (≤ 250 caractères, plafond
  // appliqué aussi défensivement par le moteur) à partir des VRAIES
  // données de la période — jamais un texte générique ou inventé — puis
  // ajoute le thème Coach dominant seulement si la place le permet.
  // Reste dans la page (Article 11) : composition métier, pas dans le
  // moteur PDF générique.
  function construireTexteConseilRapport(donnees) {
    let texte;
    if (donnees.palierMoteur && donnees.topJeux.length) {
      const nomsTop = donnees.topJeux.slice(0, 2).map(l => l.jeu.nom).join(' et ');
      texte = `Le palier ${donnees.palierMoteur} € porte l'essentiel du CA (${nomsTop}). Maintenez leur disponibilité en priorité.`;
    } else {
      texte = 'Pas assez de données sur cette période pour dégager une dynamique de vente claire.';
    }
    if (donnees.syntheseCoach && donnees.syntheseCoach.dominant) {
      const suffixe = ` Thème Coach dominant : ${labelRegleCoach(donnees.syntheseCoach.dominant)}.`;
      if ((texte + suffixe).length <= 250) texte += suffixe;
    }
    return texte;
  }

  // Un seul vendeur "référence" (échantillon suffisant, cf. Équipe) mis
  // en avant, les autres affichés sans classement — "vérité avant
  // certitude" (retour de Frédéric du 10/08/2026) : comparer des
  // employés sur un échantillon de 1 ou 2 quarts donnerait un classement
  // trompeur.
  function choisirReferenceEquipe(topVendeurs) {
    const eligibles = topVendeurs.filter(v => v.caMoyen != null);
    if (!eligibles.length) return { reference: null, autres: topVendeurs.slice(0, 4) };
    const reference = eligibles.reduce((meilleur, v) => (v.caMoyen > meilleur.caMoyen ? v : meilleur), eligibles[0]);
    const autres = topVendeurs.filter(v => v !== reference).slice(0, 3);
    return { reference, autres };
  }

  // Jeux "en vigilance" réellement prioritaires : ceux qui vendent bien
  // (présents dans le Top jeux) ET dont le stock caisse est bas — une
  // rotation forte + un stock bas est plus urgent qu'un jeu qui ne se
  // vend pas. Repli sur les premiers de la liste si aucune intersection.
  function choisirJeuxPrioritaires(enVigilance, topJeux) {
    const idsTop = new Set(topJeux.map(l => l.jeu.id));
    const prioritaires = enVigilance.filter(j => idsTop.has(j.id)).slice(0, 4);
    return prioritaires.length ? prioritaires : enVigilance.slice(0, 4);
  }

  // Construit le PDF avec nexus-pdf-moteur.js (générique) à partir des
  // données assemblées ci-dessus et renvoie { bytes, nomFichier, titre,
  // texte } — NE diffuse rien elle-même (voir lancerGenerationRapport/
  // afficherActionsRapportPret plus bas : construire le PDF et le
  // partager sont deux étapes séparées, §4 retour de Frédéric du
  // 10/08/2026 — "Partager" doit rester un geste direct de l'utilisateur
  // sur un fichier déjà prêt, jamais enchaîné automatiquement après une
  // construction qui peut prendre une seconde ou deux).
  // Rapport 1 page A4 — refonte du 10/08/2026 à la demande de Frédéric :
  // « Le moteur PDF ne doit pas essayer d'imprimer l'intégralité des
  // données disponibles : il doit sélectionner et hiérarchiser les
  // informations réellement utiles au pilotage. » Mise en page à zones
  // fixes (ZONES_1P, moteur commun) : chaque bloc a un budget de
  // hauteur immuable, jamais de deuxième page. Le détail complet reste
  // consultable dans FDJ Pilotage — le PDF est une synthèse
  // décisionnelle, pas une reproduction de l'application.
  async function construireRapportPdf() {
    const donnees = await assemblerDonneesRapportFdj();
    const imageCaPng = await genererImageGraphiqueCa(donnees.labelsCa, donnees.valeursCa);
    const { COULEUR, ZONES_1P, MM: MM1P } = NexusPdfMoteur;

    const c = await NexusPdfMoteur.creerRapportUnePage({
      titre: `NEXUS FDJ — Rapport ${donnees.periodeLabel}`,
      sujet: 'Rapport FDJ Pilotage',
    });

    // --- En-tête compact ---
    const zEntete = c.allouerZone(ZONES_1P.entete);
    c.entete(zEntete, {
      app: 'NEXUS FDJ · PILOTAGE',
      ligne1: `Rapport ${donnees.periodeLabel}`,
      ligne2: `${donnees.periodeSousLabel} · ${donnees.site}${donnees.donneesProvisoires ? ' · données provisoires' : ''}`,
    });

    // --- KPI (5 chiffres clés) ---
    const zKpi = c.allouerZone(ZONES_1P.kpi);
    const ecartSigne = donnees.ecartTotal > 0 ? '+' : '';
    c.ligneKpi(zKpi, [
      { label: 'CA FDJ', valeur: fmtEuro(donnees.ca + (donnees.caisseTirages || 0)) },
      {
        // "Comparaison indisponible" est trop long pour tenir dans la carte
        // KPI (police 15 grasse) — la valeur principale reste courte, le
        // détail (police 7.5, plus de place) porte l'explication.
        label: 'Évolution',
        valeur: donnees.evolCa === null ? '—' : fmtEvolution(donnees.evolCa),
        detail: donnees.evolCa === null ? 'Comparaison indisponible' : undefined,
        couleurValeur: donnees.evolCa > 0 ? COULEUR.vert : (donnees.evolCa < 0 ? COULEUR.rouge : COULEUR.texte),
      },
      {
        label: 'Quarts conformes',
        valeur: donnees.quartsControles > 0 ? `${donnees.quartsConformes}/${donnees.quartsControles} · ${fmtPct(donnees.tauxConformite)}` : '—',
      },
      { label: 'Écart caisse', valeur: `${ecartSigne}${fmtEuro(donnees.ecartTotal)}`, couleurValeur: donnees.ecartTotal < 0 ? COULEUR.rouge : COULEUR.texte },
      {
        // Demande explicite de Frédéric (10/08/2026) : c'est ce montant
        // physiquement compté (pas le CA théorique) qu'il compare au dépôt
        // réel pour déduire les commissions FDJ — doit toujours apparaître,
        // jamais seulement dans "Ce qu'il faut savoir" où il pourrait être
        // coupé par le plafond de points. Couleur cyan dédiée (seule carte
        // colorée par défaut, indépendamment du signe) pour qu'il saute aux
        // yeux au milieu des 4 autres KPI, comme sur l'écran (encadré cyan
        // de l'onglet Ventes) — même demande, même traitement visuel.
        label: 'Caisse réelle',
        valeur: fmtEuro(donnees.caisseReelleTotale),
        couleurValeur: COULEUR.cyan,
      },
    ]);

    // --- Ce qu'il faut savoir (5 points maximum) ---
    // Le libellé et la granularité de "meilleure/pire unité" s'adaptent au
    // type de période (hebdomadaire → jour, mensuel → semaine, annuel →
    // mois) — voir classifierTypePeriode() dans assemblerDonneesRapportFdj.
    const LABELS_UNITE_FORTE = { jour: 'Jour le plus fort', semaine: 'Semaine la plus forte', mois: 'Mois le plus fort' };
    const LABELS_UNITE_BOOSTER = { jour: 'Jour à booster', semaine: 'Semaine à booster', mois: 'Mois à booster' };
    const zSynthese = c.allouerZone(ZONES_1P.synthese);
    c.listePoints(zSynthese, {
      points: [
        { label: 'Jeu moteur', valeur: donnees.jeuMoteur ? `${donnees.jeuMoteur.nom} — ${fmtEuro(donnees.topJeux[0].ca)}` : '—' },
        { label: 'Palier moteur', valeur: donnees.palierMoteur ? `${donnees.palierMoteur} € — ${fmtEuro(Math.max(...donnees.repartitionPalier.map(p => p.ca), 0))}` : '—' },
        { label: LABELS_UNITE_FORTE[donnees.labelUnite], valeur: donnees.meilleureUnite ? `${donnees.meilleureUnite.label} — ${fmtEuro(donnees.meilleureUnite.ca)}` : '—' },
        { label: LABELS_UNITE_BOOSTER[donnees.labelUnite], valeur: donnees.pireUnite ? `${donnees.pireUnite.label} — ${fmtEuro(donnees.pireUnite.ca)}` : '—' },
        { label: 'Point de vigilance', valeur: donnees.enRupture.length ? `${donnees.enRupture[0].nom} en rupture` : (donnees.enVigilance.length ? `${donnees.enVigilance.length} jeu${donnees.enVigilance.length > 1 ? 'x' : ''} à surveiller` : 'Rien à signaler') },
      ],
      max: 5,
    });

    // --- Graphique CA (réduit) — agrégé au jour/semaine/mois selon le type de période ---
    const zGraph = c.allouerZone(ZONES_1P.graphique);
    const legendeGraphique = donnees.typePeriode === 'annuel' ? 'CA grattage — évolution par mois'
      : donnees.typePeriode === 'mensuel' ? 'CA grattage — évolution par semaine'
      : 'CA grattage — évolution quotidienne';
    await c.graphique(zGraph, imageCaPng, { legende: legendeGraphique });

    // --- Ventes / Mix produits : Top jeux (gauche) + répartition par palier (droite) ---
    const zVentes = c.allouerZone(ZONES_1P.ventes);
    const colsVentes = c.diviserColonnes(zVentes);
    c.tableauCompact(colsVentes.gauche, {
      titre: 'TOP JEUX',
      max: 5,
      texteRenvoi: 'voir FDJ Pilotage',
      colonnes: [{ label: 'Jeu', cle: 'nom', largeur: 0.68 }, { label: 'CA', cle: 'ca', largeur: 0.32, align: 'droite' }],
      lignes: donnees.topJeux.map(l => ({ nom: l.jeu.nom, ca: fmtEuro(l.ca) })),
    });
    const maxPalier = Math.max(...donnees.repartitionPalier.map(p => p.ca), 1);
    c.barresHorizontales(colsVentes.droite, {
      titre: 'RÉPARTITION PAR PALIER',
      max: 6,
      items: donnees.repartitionPalier.map(p => ({ label: `${p.prix} €`, valeur: fmtEuro(p.ca), part: p.ca / maxPalier })),
    });

    // --- Équipe (gauche) + Stock & activations (droite) ---
    const zEquipeStock = c.allouerZone(ZONES_1P.equipe);
    const colsEquipeStock = c.diviserColonnes(zEquipeStock);
    const { reference, autres } = choisirReferenceEquipe(donnees.topVendeurs);
    c.listeEquipe(colsEquipeStock.gauche, {
      titre: 'ÉQUIPE',
      reference: reference ? { nom: reference.nom, valeurParUnite: `${fmtEuro(reference.caMoyen)}/quart`, quantite: `${reference.quarts} quart${reference.quarts > 1 ? 's' : ''}` } : null,
      autres: autres.map(v => ({ nom: v.nom, detail: `${v.quarts} quart${v.quarts > 1 ? 's' : ''} · ${fmtEuro(v.ca)}` })),
      texteInsuffisant: autres.length ? 'Données insuffisantes pour comparaison fiable.' : null,
      texteAucuneDonnee: 'Aucun quart contrôlé sur cette période.',
    });
    const jeuxPrioritaires = choisirJeuxPrioritaires(donnees.enVigilance, donnees.topJeux);
    c.stockCondense(colsEquipeStock.droite, {
      titre: 'STOCK & ACTIVATIONS',
      ruptures: donnees.enRupture,
      nbSurveillance: donnees.enVigilance.length,
      prioritaires: jeuxPrioritaires,
      texteRenvoi: donnees.enVigilance.length ? 'Liste complète dans FDJ Pilotage.' : '',
    });

    // --- Conseil NEXUS + Décisions recommandées (zone partagée) ---
    const zBas = c.allouerZone(ZONES_1P.decisions);
    const [zConseil, zDecisions] = c.diviserLignes(zBas, [16 * MM1P, 34 * MM1P]);
    c.conseil(zConseil, { texte: construireTexteConseilRapport(donnees), max: 250 });
    c.decisions(zDecisions, {
      max: 3,
      texteAucune: 'Rien qui mérite l’attention du manager sur cette période — aucun signal déterministe déclenché.',
      items: donnees.decisions.map(dec => ({
        urgence: dec.rang <= 1 ? 'critique' : (dec.rang === 2 ? 'important' : 'observation'),
        titre: dec.decision || dec.article,
        detail: dec.pourquoi,
      })),
    });

    // --- Pied de page ---
    const zPied = c.allouerZone(ZONES_1P.piedDePage);
    c.piedDePage(
      zPied,
      donnees.donneesProvisoires
        ? `${donnees.nbNonControles} quart${donnees.nbNonControles > 1 ? 's' : ''} sur ${donnees.totalQuarts} pas encore contrôlé${donnees.nbNonControles > 1 ? 's' : ''} — chiffres provisoires.`
        : 'NEXUS FDJ · Rapport généré automatiquement — vérité avant certitude, jamais une prédiction.',
      `Généré le ${donnees.genereLe.toLocaleDateString('fr-FR')} à ${donnees.genereLe.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`,
    );

    const bytes = await NexusPdfMoteur.finaliser(c);
    const nomFichier = `NEXUS-FDJ-Rapport-${dateISO(periodeResolue.debut)}-${dateISO(periodeResolue.fin)}.pdf`;
    return {
      bytes, nomFichier,
      titre: `NEXUS FDJ — Rapport ${donnees.periodeLabel}`,
      texte: `Rapport FDJ Pilotage — ${donnees.site}`,
    };
  }

  // Étape 1/2 : construit le PDF (peut prendre une seconde ou deux —
  // requêtes réseau + composition), affiche l'état d'avancement, puis
  // bascule vers les actions de diffusion (étape 2/2,
  // afficherActionsRapportPret). En cas d'erreur, log complet en
  // console (retour de Frédéric du 10/08/2026 : « il faut au minimum
  // console.error » pour pouvoir diagnostiquer sans deviner) + message
  // utilisateur qui reste lisible, avec le détail technique en petit
  // pour ne pas avoir à redemander la console à chaque panne.
  async function lancerGenerationRapport() {
    const zoneActions = document.getElementById('zoneActionsRapport');
    zoneActions.innerHTML = `
      <button class="btn-rapport-pdf" disabled type="button">Génération en cours…</button>
      <div class="statut-rapport">Cela peut prendre quelques secondes.</div>
    `;
    try {
      dernierRapportPdf = await construireRapportPdf();
      afficherActionsRapportPret();
    } catch (e) {
      console.error('NEXUS FDJ — génération du rapport PDF :', e);
      zoneActions.innerHTML = `
        <button class="btn-rapport-pdf" id="btnGenererRapport" type="button">Générer mon rapport</button>
        <div class="statut-rapport statut-erreur">Erreur lors de la génération du rapport — réessayez.<br><span class="statut-detail">${(e && e.message) ? e.message : 'Erreur inconnue — voir la console du navigateur.'}</span></div>
      `;
      document.getElementById('btnGenererRapport').addEventListener('click', lancerGenerationRapport);
    }
  }

  // Étape 2/2 : le PDF est prêt (dernierRapportPdf) — deux actions
  // distinctes plutôt qu'un enchaînement automatique (retour de
  // Frédéric du 10/08/2026) : « Partager » n'apparaît que si la Web
  // Share API existe sur cet appareil, et reste un geste direct de
  // l'utilisateur (jamais après une attente asynchrone) pour rester
  // fiable sur Safari. « Ouvrir » télécharge / ouvre le PDF directement.
  function afficherActionsRapportPret() {
    const zoneActions = document.getElementById('zoneActionsRapport');
    const partageOk = NexusPdfMoteur.webShareDisponible();
    zoneActions.innerHTML = `
      <div class="statut-rapport statut-pret">Rapport prêt.</div>
      <div class="rapport-actions">
        ${partageOk ? `<button class="btn-rapport-pdf" id="btnPartagerRapport" type="button">Partager le PDF</button>` : ''}
        <button class="btn-rapport-pdf${partageOk ? ' secondaire' : ''}" id="btnOuvrirRapport" type="button">${partageOk ? 'Ouvrir le PDF' : 'Ouvrir / enregistrer le PDF'}</button>
      </div>
      <button class="btn-lien" id="btnRegenererRapport" type="button">Régénérer (autre période ?)</button>
    `;
    if (partageOk) {
      document.getElementById('btnPartagerRapport').addEventListener('click', async () => {
        const r = await NexusPdfMoteur.partagerPdf(dernierRapportPdf.bytes, dernierRapportPdf.nomFichier, { titre: dernierRapportPdf.titre, texte: dernierRapportPdf.texte });
        const s = zoneActions.querySelector('.statut-rapport');
        if (r === 'echec' || r === 'indisponible') { if (s) s.textContent = 'Partage impossible sur cet appareil — utilisez « Ouvrir le PDF ».'; }
        else if (r === 'partage') { if (s) s.textContent = 'Rapport partagé.'; }
      });
    }
    document.getElementById('btnOuvrirRapport').addEventListener('click', async () => {
      await NexusPdfMoteur.telechargerPdf(dernierRapportPdf.bytes, dernierRapportPdf.nomFichier);
      const s = zoneActions.querySelector('.statut-rapport');
      if (s) s.textContent = 'Rapport ouvert.';
    });
    document.getElementById('btnRegenererRapport').addEventListener('click', lancerGenerationRapport);
  }

  async function renderRapports(zone) {
    dernierRapportPdf = null; // un rapport déjà généré ne vaut plus rien si on change de période
    const d = await chargerDonneesPeriode();
    const actuel = sommerChamps(d.daily.actuel, CHAMPS_SUMMARY);
    const comp = sommerChamps(d.daily.comp, CHAMPS_SUMMARY);
    const compDisponible = comp.nb_quarts_controles > 0;
    const evolCa = compDisponible ? evolution(actuel.ca_grattage, comp.ca_grattage) : null;
    const tauxConformite = actuel.nb_quarts_controles > 0 ? actuel.nb_quarts_conformes / actuel.nb_quarts_controles : null;
    const nbNonControles = actuel.nb_quarts - actuel.nb_quarts_controles;
    const donneesProvisoires = nbNonControles > 0;
    // Couverture du contrôle (quarts contrôlés / total) et qualité du
    // résultat (quarts conformes / quarts contrôlés) sont deux
    // informations différentes — les séparer clairement plutôt qu'un
    // seul pourcentage à côté de "6/6" qui prêtait à confusion (retour
    // de Frédéric, 10/08/2026 : "pourquoi 33,3 % alors qu'il y a 6/6 ?").
    const texteConformite = actuel.nb_quarts_controles > 0
      ? `${actuel.nb_quarts_conformes} / ${actuel.nb_quarts_controles} — ${fmtPct(tauxConformite)}`
      : '—';

    zone.innerHTML = `
      <div class="rapport-entete">
        <div class="rapport-titre">Rapport FDJ — ${periodeResolue.label}</div>
        <div class="rapport-sous">${periodeResolue.debut.toLocaleDateString('fr-FR')} → ${periodeResolue.fin.toLocaleDateString('fr-FR')}</div>
        ${donneesProvisoires ? `<div class="rapport-provisoire">${nbNonControles} quart${nbNonControles > 1 ? 's' : ''} sur ${actuel.nb_quarts} pas encore contrôlé${nbNonControles > 1 ? 's' : ''} par un manager — le rapport généré sera provisoire.</div>` : ''}
      </div>

      <div class="resume-card">
        <div class="stat-row total"><div class="stat-label">CA FDJ (${periodeResolue.label.toLowerCase()})</div><div class="stat-value cyan">${fmtEuro(actuel.ca_grattage + (actuel.caisse_tirages || 0))}</div></div>
        <div class="stat-row"><div class="stat-label">Évolution vs ${periodeResolue.labelComp.toLowerCase()}</div><div class="stat-value ${classeEvolution(evolCa)}">${fmtEvolution(evolCa)}</div></div>
        <div class="stat-row"><div class="stat-label">Quarts conformes</div><div class="stat-value ${tauxConformite === null ? '' : (tauxConformite >= 0.9 ? 'green' : (tauxConformite >= 0.7 ? 'amber' : 'red'))}">${texteConformite}</div></div>
        <div class="stat-sub">${actuel.nb_quarts_controles} / ${actuel.nb_quarts} quarts contrôlés</div>
      </div>

      <div id="zoneActionsRapport">
        <button class="btn-rapport-pdf" id="btnGenererRapport" type="button">Générer mon rapport</button>
      </div>
      <div class="champ-note">Une seule page A4 : l'essentiel à retenir, l'évolution des ventes, le top jeux et la répartition par palier, l'équipe, le stock, un conseil NEXUS et jusqu'à 3 décisions recommandées. Le détail complet reste consultable dans FDJ Pilotage. Changez de période au-dessus pour un rapport hebdomadaire, mensuel ou annuel.</div>
    `;

    document.getElementById('btnGenererRapport').addEventListener('click', lancerGenerationRapport);
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    managerCourant = employee;
    siteId = employee.site_id;
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-FDJ-Analyse-v1.html', siteId))) return;
    [jeux, employesSite, emplacements] = await Promise.all([chargerJeux(), chargerEmployesSite(), chargerEmplacements()]);
    await renderPage();
  });
</script>
</body>
</html>
