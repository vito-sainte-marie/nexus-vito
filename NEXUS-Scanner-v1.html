<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Scanner NEXUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
  --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
  --green:#34D399; --green-dim:#153629;
  --amber:#F5A623; --amber-dim:#3A2E14;
  --cyan:#4FC3D9; --cyan-dim:#123138;
  --violet:#8B7FE8; --violet-dim:#241F3D;
  --red:#F0575A; --red-dim:#3A1D1F;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); font-family:var(--sans); color:var(--text); min-height:100vh;}
body{display:flex; justify-content:center; background-image:radial-gradient(circle at 50% 0%, rgba(79,195,217,0.07), transparent 45%);}
a{color:inherit; text-decoration:none;}
.app{width:100%; max-width:520px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); position:relative;}
.header{padding:20px 20px 14px; position:relative;}
.menu-btn{
  position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
  color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
  border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
}
.menu-btn:active{background:rgba(79,195,217,0.2);}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
.title{font-size:20px; font-weight:600; margin-top:4px;}
.role-jour{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.divider{height:1px; background:var(--hairline); margin:0 20px;}
.section{padding:0 20px;}
.section-label{
  font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim);
  display:flex; align-items:center; gap:10px; margin:26px 0 12px;
}
.section-label::after{content:''; flex:1; height:1px; background:var(--hairline);}
.section-label .link{color:var(--cyan); text-transform:none; letter-spacing:0; font-size:12px; margin-left:auto; flex:none;}
.capital-panel{
  background:var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:22px 22px 20px; margin:0 20px;
  position:relative; overflow:hidden;
}
.capital-eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.14em; color:var(--green); text-transform:uppercase; display:flex; align-items:center; gap:6px;}
.capital-info{margin-left:auto; width:20px; height:20px; border-radius:50%; border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-dim);}
.capital-row-top{display:flex; align-items:center;}
.capital-amount{font-family:var(--sans); font-size:40px; font-weight:700; color:var(--green); margin-top:10px; letter-spacing:-0.01em;}
.capital-sub{font-size:14px; font-weight:600; margin-top:2px;}
.capital-desc{font-size:12px; color:var(--text-mid); margin-top:8px; line-height:1.5; max-width:78%;}
.capital-badge{
  display:inline-flex; align-items:center; gap:6px; margin-top:16px; font-family:var(--mono); font-size:11.5px;
  background:var(--green-dim); color:var(--green); padding:6px 12px; border-radius:20px; font-weight:600;
}
.data-tag{
  display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-family:var(--mono); font-size:10px;
  background:var(--panel-raised); color:var(--text-dim); padding:4px 10px; border-radius:20px; font-weight:600;
  border:1px solid var(--hairline);
}
.levers-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.lever-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; cursor:pointer; transition:border-color .15s;}
.lever-card:active{border-color:rgba(79,195,217,0.4);}
.lever-toggle{font-family:var(--mono); font-size:9.5px; color:var(--cyan); opacity:0.75; margin-top:8px; display:flex; align-items:center; gap:4px;}
.lever-toggle .chev{transition:transform .15s; display:inline-block;}
.lever-card.open .lever-toggle .chev, .mini-panel.open .lever-toggle .chev{transform:rotate(90deg);}
.lever-detail{display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--hairline);}
.lever-card.open .lever-detail, .mini-panel.open .lever-detail{display:block;}
.detail-row{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; font-size:11px; gap:8px;}
.detail-row .dn{color:var(--text-mid); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.detail-row .dv{font-family:var(--mono); color:var(--text); flex-shrink:0;}
.detail-empty{font-size:11px; color:var(--text-dim); font-style:italic; padding:4px 0;}
.lever-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:12px; font-family:var(--mono); font-weight:700;}
.lever-title{font-size:12.5px; color:var(--text-mid); line-height:1.35; margin-bottom:10px; min-height:34px;}
.lever-amount{font-family:var(--sans); font-size:19px; font-weight:700;}
.lever-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:3px;}
.roi-panel{background:var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:24px 18px; display:flex; align-items:center; justify-content:space-between;}
.roi-col{text-align:center; flex:1;}
.roi-label{font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-mid); margin-bottom:8px;}
.roi-value{font-size:18px; font-weight:700;}
.roi-value.green{color:var(--green);}
.roi-meta{font-size:10.5px; color:var(--text-dim); margin-top:3px;}
.roi-donut{position:relative; width:104px; height:104px; flex:none;}
.roi-donut .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.roi-donut .center .roi-tag{font-family:var(--mono); font-size:9px; color:var(--text-mid); letter-spacing:0.08em; text-transform:uppercase;}
.roi-donut .center .roi-pct{font-size:22px; font-weight:700; color:var(--green); margin-top:2px;}
.decision-item{display:flex; align-items:center; gap:14px; padding:14px; background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px;}
.decision-rank{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:700; flex-shrink:0;}
.rank-1{background:var(--amber-dim); color:var(--amber);}
.rank-2{background:var(--panel-raised); color:var(--text-mid);}
.rank-3{background:var(--red-dim); color:#D98A85;}
.rank-4{background:var(--cyan-dim); color:var(--cyan);}
.rank-5{background:var(--violet-dim); color:var(--violet);}
.decision-body{flex:1; min-width:0;}
.decision-title{font-size:13.5px; font-weight:600;}
.decision-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:2px;}
.decision-amount{font-size:14.5px; font-weight:700; color:var(--green); flex-shrink:0; text-align:right;}
/* Top 5 CA / Top 5 marge regroupés en onglets (retour du 24/07/2026 : "moins
   scroller") — un seul classement de 5 lignes affiché à la fois au lieu de
   deux piles de 5 lignes en permanence. */
.top5-tabs{display:flex; gap:8px; margin-bottom:12px;}
.top5-tab{flex:1; padding:10px; border-radius:12px; border:1px solid var(--hairline); background:var(--panel); color:var(--text-mid); font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer;}
.top5-tab.active{background:var(--amber-dim); color:var(--amber); border-color:rgba(245,166,35,0.3);}
.top5-desc{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin:-2px 0 12px;}
.top5-hidden{display:none;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.mini-panel{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px;}
.mini-panel.clickable{cursor:pointer; transition:border-color .15s;}
.mini-panel.clickable:active{border-color:rgba(79,195,217,0.4);}
.mini-label{font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-mid); margin-bottom:10px;}
.mini-label.amber{color:var(--amber);}
.opp-number{font-size:30px; font-weight:700; color:var(--amber);}
.opp-desc{font-size:11px; color:var(--text-mid); margin-top:4px; line-height:1.4;}
.opp-potential{font-size:13px; font-weight:600; color:var(--amber); margin-top:10px;}
.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-family:var(--mono); font-size:10px;}
.bar-row .bar-label{width:14px; color:var(--text-mid); flex-shrink:0;}
.bar-track{flex:1; height:8px; border-radius:4px; background:var(--hairline); overflow:hidden;}
.bar-fill{height:100%; border-radius:4px;}
.bar-row .bar-val{width:34px; text-align:right; color:var(--text-mid); flex-shrink:0;}
.advisor-panel{display:flex; gap:14px; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:18px;}
.advisor-avatar{width:44px; height:44px; border-radius:50%; background:var(--panel-raised); border:1.5px solid rgba(79,195,217,0.4); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
.advisor-avatar img{width:100%; height:100%; object-fit:cover;}
.advisor-body .advisor-title{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--cyan); margin-bottom:8px;}
.advisor-body p{font-size:13px; line-height:1.55; color:var(--text);}
.marge-hero{background:var(--panel); border:1px solid rgba(245,166,35,0.3); border-radius:16px; padding:20px 22px; margin:0 20px 14px; text-align:center;}
.marge-hero-label{font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber);}
.marge-hero-amount{font-size:34px; font-weight:700; color:var(--amber); margin-top:8px;}
.marge-hero-sub{font-size:12.5px; color:var(--text-mid); margin-top:6px;}
.marge-groupe{margin:0 20px 10px;}
.marge-groupe-head{display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; cursor:pointer;}
.marge-groupe.open .marge-groupe-head{border-radius:14px 14px 0 0; border-bottom:none;}
.marge-groupe-titre{font-size:13px; font-weight:600; flex:1;}
.marge-groupe-meta{font-family:var(--mono); font-size:11px; color:var(--text-mid); white-space:nowrap;}
.marge-groupe-head .chev{color:var(--text-dim); font-size:14px; transition:transform .15s; display:inline-block;}
.marge-groupe.open .marge-groupe-head .chev{transform:rotate(90deg);}
.marge-groupe-body{display:none; padding:10px; background:var(--panel-raised); border:1px solid var(--hairline); border-top:none; border-radius:0 0 14px 14px;}
.marge-groupe.open .marge-groupe-body{display:block;}
.marge-groupe-body .marge-card{margin:0 0 10px;}
.marge-groupe-body .marge-card:last-child{margin-bottom:0;}
.marge-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; margin:0 20px 10px; overflow:hidden;}
.marge-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:16px 16px 0; cursor:pointer;}
.marge-card.open .marge-card-head{padding-bottom:12px;}
.marge-badge{font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--amber); background:var(--amber-dim); padding:4px 10px; border-radius:20px; font-weight:600;}
.marge-article{font-size:13.5px; font-weight:600;}
.marge-meta{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:3px;}
.marge-priorite-badge{font-family:var(--mono); font-size:9.5px; padding:3px 9px; border-radius:20px; font-weight:700; white-space:nowrap;}
.marge-priorite-haute{background:var(--red-dim); color:var(--red);}
.marge-priorite-moyenne{background:var(--amber-dim); color:var(--amber);}
.marge-priorite-basse{background:var(--green-dim); color:var(--green);}
.marge-gain{font-family:var(--sans); font-size:15px; font-weight:700; color:var(--amber); margin-top:5px; text-align:right;}
.marge-card .lever-toggle{padding:0 16px 12px;}
.marge-card.open .lever-toggle .chev{transform:rotate(90deg);}
.marge-card .lever-detail{display:none; padding:0 16px 16px; border-top:1px solid var(--hairline); padding-top:14px;}
.marge-card.open .lever-detail{display:block;}
.marge-step{font-size:12.5px; line-height:1.5; color:var(--text); margin-bottom:8px;}
.marge-step .marge-tag{font-family:var(--mono); font-size:9px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); display:block; margin-bottom:2px;}
.marge-impact{font-size:12.5px; font-weight:600; color:var(--amber); margin:10px 0 12px;}
.marge-roi{display:flex; gap:8px; margin:12px 0;}
.roi-mini{flex:1; background:var(--panel-raised); border-radius:8px; padding:9px 8px; text-align:center;}
.roi-mini span{display:block; font-family:var(--mono); font-size:8.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-dim); margin-bottom:4px;}
.roi-mini b{font-size:11.5px; color:var(--text);}
.marge-synthese{margin:14px 20px 0; padding:14px 16px; background:var(--panel-raised); border-radius:10px; font-size:12px; color:var(--text-mid); line-height:1.55; text-align:center;}
.btn-valider{width:100%; background:var(--amber-dim); color:var(--amber); border:1px solid rgba(245,166,35,0.35); border-radius:10px; padding:11px; font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer;}
.btn-valider:disabled{opacity:0.5; cursor:default;}
.marge-empty{font-size:12px; color:var(--text-mid); margin:0 20px; line-height:1.5;}
.empty-panel{background:var(--panel); border:1px dashed var(--hairline); border-radius:14px; padding:22px 20px; text-align:center;}
.empty-panel .ei{font-size:22px; margin-bottom:10px;}
.empty-panel .ei img{width:36px; height:36px; border-radius:10px; object-fit:cover; vertical-align:middle;}
.empty-panel .et{font-size:13.5px; font-weight:600;}
.empty-panel .ed{font-size:12px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
.empty-panel .btn-link{display:inline-block; margin-top:14px; font-family:var(--mono); font-size:11.5px; color:var(--cyan); padding:8px 14px; border:1px solid rgba(79,195,217,0.35); border-radius:8px;}
.disclaimer{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; line-height:1.6; padding:20px 20px 8px;}
.loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-forfait.js"></script>
<script src="nexus-periodes.js"></script>
<script src="nexus-marge.js"></script>
</head>
<body>
<div class="app">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Scanner</div>
    <div class="title">Scanner NEXUS</div>
    <div class="role-jour" id="scanSubtitle">Chargement…</div>
  </div>
  <div class="divider"></div>
  <div id="root">
    <div class="loading">Analyse des données en cours…</div>
  </div>
</div>
<script>
  // Meme moteur que Cockpit et le CIN : donnees reelles de la table products,
  // exclusion des produits d'appel, periode la plus recente uniquement (cette
  // page decrit l'etat du magasin a un instant T, pas une evolution). La
  // periode la plus recente elle-meme est desormais determinee par le moteur
  // partage nexus-periodes.js (23/07/2026, harmonisation demandee par
  // Frédéric : "un système, pas une succession de pages") plutôt que par un
  // tri local sur periode_debut seul, qui ignorait periode_fin.
  async function chargerProduitsAppel() {
    const { data, error } = await nexusClient.from('produits_appel').select('article').eq('site', SITE_ACTUEL);
    if (error) { console.error(error); return new Set(); }
    return new Set((data || []).map(r => r.article));
  }
  // Supabase plafonne chaque requete a 1000 lignes par defaut, sans erreur —
  // au-dela, le reste est silencieusement absent. Ce helper boucle par pages
  // de 1000 jusqu'a tout recuperer (trouve le 15/07/2026 : un import T2
  // reussi restait invisible partout des que products a depasse 1000 lignes).
  async function fetchAllRows(builderFactory, pageSize = 1000) {
    let toutes = [];
    let from = 0;
    while (true) {
      const { data, error } = await builderFactory().range(from, from + pageSize - 1);
      if (error) return { data: null, error };
      toutes = toutes.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    return { data: toutes, error: null };
  }
  // ------------------------------------------------------------
  // Optimisation de marge (R5-MARGE-ECART) — demande de Frédéric le
  // 24/07/2026 : repérer les produits dont la marge pourrait être
  // réajustée par rapport à des produits comparables, sans jamais mélanger
  // des produits qui n'ont pas la même contrainte de prix (voir
  // nexus-marge.js — l'exemple donné : un paquet de cigarettes, à marge
  // fixée par le fabricant, n'est pas comparable à une feuille à rouler).
  // Passe par le même circuit que les autres recommandations NEXUS
  // (journal_decisions) pour rester validable, mémorisée et mesurable —
  // pas un chiffre isolé dans Scanner qui ne se relie à rien.
  // ------------------------------------------------------------
  let EMPLOYEE_COURANT_ID = null;
  let VALIDEES_MARGE = new Set();
  let EXCLUSIONS_MARGE = new Set();
  async function chargerValideesMarge() {
    const { data, error } = await nexusClient
      .from('journal_decisions')
      .select('candidate_id')
      .eq('site', SITE_ACTUEL)
      .eq('rule_id', 'R5-MARGE-ECART');
    if (error) { console.error('Chargement décisions marge:', error); return; }
    VALIDEES_MARGE = new Set((data || []).map(d => d.candidate_id));
  }
  // Articles exclus manuellement par un manager depuis Paramétrage Station
  // (table marge_exceptions, migration-marge-exceptions-v1.sql) — vient
  // s'ajouter aux exceptions codées en dur dans nexus-marge.js, sans les
  // remplacer.
  async function chargerExclusionsMarge() {
    const { data, error } = await nexusClient
      .from('marge_exceptions')
      .select('article')
      .eq('site', SITE_ACTUEL);
    if (error) { console.error('Chargement marge_exceptions:', error); return; }
    EXCLUSIONS_MARGE = new Set((data || []).map(d => d.article));
  }
  async function enregistrerDecisionMarge(candidat) {
    const { error } = await nexusClient.from('journal_decisions').insert({
      site: SITE_ACTUEL,
      candidate_id: candidat.candidate_id, rule_id: 'R5-MARGE-ECART', etat: candidat.etat,
      recommandation: candidat.recommandation, impact_eur: candidat.impact_eur,
      article: candidat.article, categorie: candidat.categorie,
      date: new Date().toISOString().slice(0,10), heure: new Date().toTimeString().slice(0,5),
      employee_id: EMPLOYEE_COURANT_ID,
      ca_reference: candidat.ca_reference, periode_reference_debut: candidat.periode_reference_debut,
      periode_reference_fin: candidat.periode_reference_fin,
    });
    if (error) { console.error('Écriture décision marge:', error); return false; }
    VALIDEES_MARGE.add(candidat.candidate_id);
    return true;
  }
  // Tercile relatif (pas un seuil en euros absolu, qui n'aurait aucun sens
  // d'un magasin à l'autre) — calculé sur le classement déjà trié par
  // gainPotentiel décroissant renvoyé par NexusMarge.detecterEcartsMarge.
  // Demande de Frédéric le 24/07/2026 : "le manager sait par quoi commencer".
  function niveauPriorite(index, total) {
    if (total <= 1) return { classe: 'haute', label: '🔴 Priorité élevée' };
    const rang = index / total;
    if (rang < 1/3) return { classe: 'haute', label: '🔴 Priorité élevée' };
    if (rang < 2/3) return { classe: 'moyenne', label: '🟠 Priorité moyenne' };
    return { classe: 'basse', label: '🟢 Faible priorité' };
  }
  // "Retour sur temps" qualitatif, dérivé du gain potentiel en euros — pas
  // un vrai calcul de ROI (NEXUS ne connaît pas le temps réel passé), mais
  // une indication honnête de l'ordre de grandeur.
  function retourSurTemps(impactEur) {
    if (impactEur >= 100) return 'Très élevé';
    if (impactEur >= 30) return 'Élevé';
    return 'Modéré';
  }
  // Construit les candidats à partir des écarts détectés par NexusMarge —
  // même schéma Constat/Explication/Décision que les règles R2/R3/R4 du

  // - niveau : classement relatif, pas un seuil absolu.
  // - confiance : dérivée uniquement de la taille du groupe de comparaison

  // - effort : estimation par défaut, non mesurée (NEXUS ne peut pas

  function construireCandidatsMarge(rowsPropres, periodeDebut, periodeFin) {

      .map((e, i) => {

          article: e.article, categorie: e.categorie, impact_eur: e.gainPotentiel,

          ca_reference: e.ca, periode_reference_debut: periodeDebut, periode_reference_fin: periodeFin,

  async function chargerDonneesScanner() {
    const [{ data, error }, produitsAppel] = await Promise.all([

    const { periodeAffichage, rowsAffichage } = NexusPeriodes.analyserPeriodes(rowsBrut);
    if (!periodeAffichage) { console.error('Aucune période exploitable dans products.'); return null; }
    return { rows: rowsAffichage, periodeDebut: periodeAffichage.debut, periodeFin: periodeAffichage.fin };

  // Regroupe par categorie, classe en A/B/C par methode Pareto standard
  // (A jusqu'a 80% du CA cumule, B jusqu'a 95%, C le reste) — meme logique
  // que la classification ABC deja utilisee sur NEXUS Pilot.
  function construireStats(rows) {
    // Anomalie = ligne dont le CA ou la marge n'a pas de sens economique
    // (marge negative, marge superieure au CA, ou CA nul/negatif). Detectee
    // AVANT les agregats et exclue de tous les calculs qui suivent — sinon
    // une seule ligne aberrante peut fausser le pourcentage de toute une
    // categorie (corrige le 15/07/2026 : "Tabac 53,7%" venait de la, pas
    // d'une vraie marge).
    const anomalies = rows.filter(r => (r.ca||0) <= 0 || (r.marge||0) < 0 || (r.marge||0) > (r.ca||0));
    const rowsPropres = rows.filter(r => !anomalies.includes(r));
    const caTotal = rowsPropres.reduce((s,r) => s + (r.ca || 0), 0);
    const margeTotal = rowsPropres.reduce((s,r) => s + (r.marge || 0), 0);
    const nbRefs = rows.length;
    const parCategorie = {};
    rowsPropres.forEach(r => {
      if (!parCategorie[r.categorie]) parCategorie[r.categorie] = { categorie: r.categorie, ca: 0, marge: 0 };
      parCategorie[r.categorie].ca += (r.ca || 0);
      parCategorie[r.categorie].marge += (r.marge || 0);
    });
    const catArr = Object.values(parCategorie);
    const nbCategories = catArr.length;
    const parCA = [...catArr].sort((a,b) => b.ca - a.ca);
    let cumul = 0;
    const classes = { A: { n:0, ca:0 }, B: { n:0, ca:0 }, C: { n:0, ca:0 } };
    parCA.forEach(c => {
      cumul += c.ca;
      const pctCumul = caTotal > 0 ? cumul / caTotal : 0;
      const classe = pctCumul <= 0.80 ? 'A' : (pctCumul <= 0.95 ? 'B' : 'C');
      c.classe = classe;
      classes[classe].n += 1;
      classes[classe].ca += c.ca;
    });
    const top5CA = [...catArr].sort((a,b) => b.ca - a.ca).slice(0,5);
    const top5Marge = [...catArr].sort((a,b) => b.marge - a.marge).slice(0,5);
    return { caTotal, margeTotal, nbRefs, nbCategories, classes, top5CA, top5Marge, anomalies, catArr, rowsPropres };
  }

            <div class="lever-title">Marge moyenne du magasin</div>
            <div class="lever-amount" style="color:var(--violet);">${fmtPct(margePctGlobal)}</div>
            <div class="lever-meta">${fmtEur(stats.margeTotal)} de marge totale</div>
            <div class="lever-toggle"><span class="chev">›</span> Voir le détail</div>
            <div class="lever-detail">${renderDetailListe(stats.catArr, 'margePct')}</div>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="roi-panel" style="justify-content:center;">
          <div class="roi-donut">
            <svg viewBox="0 0 104 104" width="104" height="104">
              <circle cx="52" cy="52" r="45" fill="none" stroke="#242E38" stroke-width="9"/>
              <circle cx="52" cy="52" r="45" fill="none" stroke="#34D399" stroke-width="9"
                stroke-linecap="round" stroke-dasharray="${circonference}" stroke-dashoffset="${dashoffset.toFixed(1)}"
                transform="rotate(-90 52 52)"/>
            </svg>
            <div class="center">
              <div class="roi-tag">Marge</div>
              <div class="roi-pct">${fmtPct(margePctGlobal)}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-label">Top 5 catégories</div>
        <div class="top5-tabs">
          <button class="top5-tab active" id="top5-tab-ca" onclick="toggleTop5('ca')">🏆 Chiffre d'affaires</button>
          <button class="top5-tab" id="top5-tab-marge" onclick="toggleTop5('marge')">💰 Marge</button>
        </div>
        <div class="top5-desc" id="top5-desc-ca">Classées par CA généré — le taux de marge est indiqué à titre d'information</div>
        <div class="top5-desc top5-hidden" id="top5-desc-marge">Classées par marge générée en euros, pas par taux — un fort volume à faible taux peut dépasser un petit volume à fort taux</div>
        <div id="top5-list-ca">${renderTop5(stats.top5CA, 'ca')}</div>
        <div id="top5-list-marge" class="top5-hidden">${renderTop5(stats.top5Marge, 'marge')}</div>
      </div>
      <div class="section">
        <div class="section-label">NEXUS Marge+</div>
        <div style="font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin:-6px 0 12px;">Optimisation intelligente de la rentabilité</div>
      </div>
      <div id="margeSection"><div class="marge-empty">Analyse en cours…</div></div>
      <div class="section">
        <div class="mini-panel${stats.anomalies.length>0?' clickable':''}" ${stats.anomalies.length>0?'onclick="toggleCard(this)"':''}>
          <div class="mini-label amber">Anomalies détectées</div>
          <div class="opp-number">${stats.anomalies.length}</div>
          <div class="opp-desc">ligne${stats.anomalies.length>1?'s':''} sur ${stats.nbRefs.toLocaleString('fr-FR')} à corriger (CA ou marge invalides)</div>
          <div class="opp-potential">${fmtPct(pctExploitable)} des lignes exploitables</div>
          ${stats.anomalies.length>0 ? `<div class="lever-toggle"><span class="chev">›</span> Voir le détail</div><div class="lever-detail">${renderDetailAnomalies(stats.anomalies)}</div>` : ''}
        </div>
      </div>
      <div class="section">
        <div class="advisor-panel">
          <div class="advisor-avatar"><img src="assets/nexus-avatar.png" alt="Conseiller NEXUS"></div>
          <div class="advisor-body">
            <div class="advisor-title">Lecture des données</div>
            <p>${texteLecture(stats)}</p>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-label">Voir plus loin</div>
        <div class="empty-panel">
          <div class="ei"><img src="assets/icons/icon-centre-intelligence.png" alt="Centre d'Intelligence NEXUS"></div>
          <div class="et">Comprendre le pourquoi et suivre les décisions</div>
          <div class="ed">Cette page décrit l'état du magasin à un instant T. Pour comprendre pourquoi et suivre les décisions, direction le Centre d'Intelligence NEXUS.</div>
          <a class="btn-link" href="NEXUS-Centre-Intelligence-v1.html">Voir le Centre d'Intelligence NEXUS →</a>
        </div>
      </div>
      <div class="disclaimer">Cette page décrit l'état du magasin à un instant T (chiffre d'affaires, marge, catégories) — ce n'est pas encore la mesure de l'impact des décisions NEXUS. Cette mesure viendra avec le suivi des actions dans le temps.</div>
    `;
    window.CANDIDATS_MARGE = construireCandidatsMarge(stats.rowsPropres, donnees.periodeDebut, donnees.periodeFin);
    renderMarge(window.CANDIDATS_MARGE);
  }
  let SITE_ACTUEL = 'vito-sainte-marie'; // ecrase par employee.site_id une fois connecte
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div style="padding:60px 20px; text-align:center; color:#8A96A5; font-family:sans-serif; background:#0B0F14; min-height:100vh;">Cet écran est réservé aux managers.</div>';
      return;
    }
    SITE_ACTUEL = employee.site_id || 'vito-sainte-marie';
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-Scanner-v1.html', SITE_ACTUEL))) return;
    EMPLOYEE_COURANT_ID = employee.id;
    const [donnees] = await Promise.all([chargerDonneesScanner(), chargerValideesMarge(), chargerExclusionsMarge()]);
    renderRoot(donnees);
  });
</script>
</body>
</html>
