  // Résumé en langage clair sous chaque produit — jamais le nom technique
  // du profil dérivé (05/08/2026, demande de Frédéric).
  function libelleReglesProduit(regle) {
    if (!regle) return 'Stock continu (par défaut)';
    if (regle.profil === 'production_journaliere') return '🥐 Suivi de production journalière — voir onglet Production';
    const parties = [];
    if (regle.profil === 'cycle_journalier') parties.push('Remis à zéro le matin');
    if (regle.duree_max_vente_jours) parties.push(`Vente ${regle.duree_max_vente_jours} j`);
    if (regle.quarts_comptage && regle.quarts_comptage.length === 1) parties.push(regle.quarts_comptage[0] === 'matin' ? 'Compté le matin' : 'Compté le soir');
    if (regle.seuil_minimal) parties.push(`Seuil ${regle.seuil_minimal}`);
    return parties.length ? parties.join(' · ') : 'Stock continu (par défaut)';
  }
  // ------------------------------------------------------------
  // FICHE PRODUIT — carte d'origine (Sprint 3, 20/08/2026, demande de
  // Frédéric : "Paramétrage hérité : Bières / Dernière modification :
  // 20/08/2026 / [Modifier pour toute la catégorie] [Créer une
  // exception]"). S'affiche à l'ouverture d'une ligne produit, AVANT le
  // formulaire complet — le manager voit d'abord d'où vient la règle
  // appliquée, choisit ensuite explicitement de la personnaliser ou d'aller
  // régler toute la catégorie.
  // ------------------------------------------------------------
  function renderCarteHeritageProduit(p, regle, categorieRegle) {
    const catActive = categorieRegle && categorieRegle.regle_active;
    if (regle) {
      // Exception propre au produit.
      return `
        <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--hairline);">
          <div style="font-size:12.5px; color:var(--amber); font-weight:600;">⚠ Exception active pour ce produit</div>
          <div class="categorie-count" style="margin-top:2px;">${libelleReglesProduit(regle)}</div>
          <div class="categorie-count" style="margin-top:2px;">Dernière modification : ${fmtDateFr(regle.updated_at)}</div>
          <button class="btn-primary" style="margin-top:10px;" data-modifier-exception="${p.id}">Modifier cette exception</button>
          <button class="btn-ghost" data-revenir-categorie="${p.id}">Revenir à ${catActive ? `la règle de « ${categorieRegle.nom} »` : 'la règle par défaut'}</button>
        </div>
      `;
    }
    if (catActive) {
      // Hérite d'une règle de catégorie active.
      return `
        <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--hairline);">
          <div style="font-size:12.5px; color:var(--cyan); font-weight:600;">Paramétrage hérité : ${categorieRegle.nom}</div>
          <div class="categorie-count" style="margin-top:2px;">${libelleReglesProduit(categorieRegle)}</div>
          <div class="categorie-count" style="margin-top:2px;">Dernière modification : ${fmtDateFr(categorieRegle.updated_at)}</div>
          <button class="btn-primary" style="margin-top:10px;" data-modifier-categorie="${categorieRegle.id}">Modifier pour toute la catégorie</button>
          <button class="btn-ghost" data-creer-exception="${p.id}">Créer une exception pour ce produit</button>
        </div>
      `;
    }
    // Ni exception, ni règle de catégorie active : comportement par défaut.
    return `
      <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--hairline);">
        <div class="categorie-count">${categorieRegle ? `Aucune règle commune pour « ${categorieRegle.nom} »` : 'Aucune catégorie'} — ce produit suit le comportement par défaut (stock continu).</div>
        ${categorieRegle ? `<button class="btn-ghost" data-modifier-categorie="${categorieRegle.id}">Définir une règle pour toute la catégorie</button>` : ''}
        <button class="btn-primary" style="margin-top:10px;" data-creer-exception="${p.id}">Créer une exception pour ce produit</button>
      </div>
    `;
  }

  function renderLigneProfilProduit(p) {
    const regle = reglesProduitMap[p.id];
    // 20/08/2026 (Sprint "Catégorie porte les règles") : le libellé affiché
    // doit refléter la règle EFFECTIVE (produit, sinon catégorie héritée),
    // sinon un produit sans ligne propre continuerait d'afficher "Stock
    // continu (par défaut)" alors qu'il hérite en réalité d'une règle de
    // catégorie active — même cascade que partout ailleurs dans NEXUS
    // (NexusInventaireMoteur.regleEffectiveProduit, jamais réécrite ici).
    // "personnalise" (pastille verte de la ligne) reste basé sur la ligne
    // PROPRE du produit uniquement — c'est elle qui distingue une exception
    // d'un simple héritage.
    const categorieRegle = p.categorie_id ? categoriesSite.find(c => c.id === p.categorie_id) : null;
    const regleEffective = NexusInventaireMoteur.regleEffectiveProduit(regle, (categorieRegle && categorieRegle.regle_active) ? categorieRegle : null);
    let libelle = libelleReglesProduit(regleEffective);
    if (regleEffective && regleEffective.origineRegle === 'categorie' && categorieRegle) libelle += ` (hérité de ${categorieRegle.nom})`;
    // Correctif 30/08/2026 (remontée de Frédéric, Article 5 — l'écran ne
    // doit jamais suggérer une exception qui n'existe pas) : le comptage en
    // deux lieux (dépôt + boutique) est une propriété PHYSIQUE du produit
    // (produits_inventaire.comptage_deux_lieux), jamais une règle héritable
    // de catégorie (voir commentaire en tête de section "RÈGLES PAR
    // CATÉGORIE" et Data Dictionary v2.193) — elle ne doit donc jamais
    // teinter ni le libellé de la règle, ni l'indicateur d'exception
    // ci-dessous. Affichée séparément, sur sa propre ligne (📍), qu'il y ait
    // ou non une exception de règle par ailleurs.
    const ouvert = profilProduitOuvert === p.id;
    const personnalise = !!regle && libelleReglesProduit(regle) !== 'Stock continu (par défaut)';
    return `
      <div class="categorie-row" data-profil-produit="${p.id}">
        <div>
          <div class="categorie-nom" style="font-size:13px;">${p.designation}</div>
          <div class="categorie-count">${libelle}</div>
          ${p.comptage_deux_lieux ? `<div class="categorie-count" style="margin-top:1px;">📍 Dépôt + Boutique</div>` : ''}
        </div>
        <div class="categorie-etat ${personnalise ? 'en-cours' : 'a-faire'}">${ouvert ? '▾' : '▸'}</div>
      </div>
      ${ouvert && profilFormulaireActif && profilEnEdition ? renderFormulaireProfil() : ''}
      ${ouvert && !profilFormulaireActif ? renderCarteHeritageProduit(p, regle, categorieRegle) : ''}
    `;
  }

  // ==============================================================
  // RÈGLES PAR CATÉGORIE (20/08/2026, Sprint 2 — demande de Frédéric :
  // "règle de catégorie par défaut + exceptions produit", écran "Règles par
  // catégorie" de sa proposition). S'appuie entièrement sur le Sprint 1
  // (migration inventaire_categories_regles_heritees, cascade
  // NexusInventaireMoteur.regleEffectiveProduit) : cet écran ne fait
  // qu'ÉDITER les colonnes de règle déjà ajoutées à inventaire_categories —
  // aucune nouvelle table, aucune nouvelle logique de résolution. Le
  // formulaire réutilise EXACTEMENT les mêmes champs que
  // renderFormulaireProfil (Article 11 : une seule vision de "qu'est-ce
  // qu'une règle d'inventaire", que ce soit au niveau produit ou catégorie)
  // — seul comptage_deux_lieux en est absent : c'est une propriété physique
  // du produit (inventaire_zone_produit), jamais une règle héritable de
  // catégorie (voir Data Dictionary v2.193).
  // ==============================================================

  // Nb de produits actifs de la catégorie qui ont leur PROPRE ligne
  // inventaire_regles_produit — ce sont les exceptions : une modification
  // de la règle de catégorie ne les touche jamais (cascade Sprint 1).
  function produitsCategorie(categorieId) {
    return produitsInventaire.filter(p => p.actif && p.categorie_id === categorieId);
  }
  function compterExceptionsCategorie(categorieId) {
    return produitsCategorie(categorieId).filter(p => !!reglesProduitMap[p.id]).length;
  }

  function ouvrirEditionRegleCategorie(categorieId) {
    if (categorieReglesOuverte === categorieId) { categorieReglesOuverte = null; categorieRegleEnEdition = null; render(); return; }
    categorieReglesOuverte = categorieId;
    const cat = categoriesSite.find(c => c.id === categorieId);
    categorieRegleEnEdition = {
      categorie_id: categorieId,
      regle_active: !!(cat && cat.regle_active),
      production_journaliere: cat ? cat.profil === 'production_journaliere' : false,
      remise_a_zero_matin: cat ? cat.profil === 'cycle_journalier' : false,
      duree_max_vente_jours: (cat && cat.duree_max_vente_jours) || null,
      retour_fournisseur_autorise: !!(cat && cat.action_echeance === 'retour_fournisseur_obligatoire'),
      quarts_comptage: (cat && cat.quarts_comptage) || null,
      reapprovisionnable: cat ? cat.reapprovisionnable !== false : true,
      seuil_minimal: (cat && cat.seuil_minimal) || null,
      validation_manager_requise: !!(cat && cat.validation_manager_requise),
      comptage_masque: !!(cat && cat.comptage_masque),
      controle_aleatoire: !!(cat && cat.controle_aleatoire),
      photo_obligatoire: !!(cat && cat.photo_obligatoire),
      frequence_controle: (cat && cat.frequence_controle) || 'standard',
      delai_max_jours_sans_controle: (cat && cat.delai_max_jours_sans_controle != null) ? cat.delai_max_jours_sans_controle : null,
      // Sprint 5 (20/08/2026) — dérogations de seuil d'écart, indépendantes
      // de regle_active (voir commentaire sur seuilsEcartParCategorie).
      seuil_ecart_quantite: (seuilsEcartParCategorie[categorieId] && seuilsEcartParCategorie[categorieId].quantite_alerte != null) ? seuilsEcartParCategorie[categorieId].quantite_alerte : null,
      seuil_ecart_valeur: (seuilsEcartParCategorie[categorieId] && seuilsEcartParCategorie[categorieId].valeur_alerte != null) ? seuilsEcartParCategorie[categorieId].valeur_alerte : null,
    };
    render();
  }

  // Annonce d'impact avant validation (demande explicite de Frédéric :
  // "quand le manager modifie la catégorie, NEXUS doit annoncer l'impact
  // avant validation — ça évite les mauvaises surprises"). Un seul
  // confirm() combiné, même philosophie que le reste de NEXUS (jamais une
  // popup par produit).
  async function enregistrerRegleCategorie() {
    const e = categorieRegleEnEdition;
    const cat = categoriesSite.find(c => c.id === e.categorie_id);
    const total = produitsCategorie(e.categorie_id).length;
    const exceptions = compterExceptionsCategorie(e.categorie_id);
    const impactes = total - exceptions;
    const messageImpact = e.regle_active
      ? `Cette modification sera appliquée à ${impactes} produit${impactes > 1 ? 's' : ''} de la catégorie « ${cat ? cat.nom : ''} ».${exceptions > 0 ? `\n${exceptions} produit${exceptions > 1 ? 's' : ''} possède${exceptions > 1 ? 'nt' : ''} déjà une exception et ne ${exceptions > 1 ? 'seront' : 'sera'} pas modifié${exceptions > 1 ? 's' : ''}.` : ''}\n\nConfirmer ?`
      : `Désactiver la règle commune de « ${cat ? cat.nom : ''} » : les ${impactes} produit${impactes > 1 ? 's' : ''} qui en héritaient repassent au comportement par défaut (stock continu).${exceptions > 0 ? ` ${exceptions} produit${exceptions > 1 ? 's' : ''} en exception ne ${exceptions > 1 ? 'sont' : 'est'} pas concerné${exceptions > 1 ? 's' : ''}.` : ''}\n\nConfirmer ?`;
    if (!confirm(messageImpact)) return;

    const btn = document.getElementById('btnEnregistrerRegleCategorie');
    if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
    const profilDerive = calculerProfilDepuisReglage(e);
    const dureeActive = !e.production_journaliere && !!e.duree_max_vente_jours;
    const remiseAZeroActive = !e.production_journaliere && e.remise_a_zero_matin;
    const seuilActif = !e.production_journaliere && e.seuil_minimal;
    const payload = {
      regle_active: !!e.regle_active,
      profil: profilDerive,
      cycle_frequence: remiseAZeroActive ? 'quotidien' : null,
      report_veille_autorise: !remiseAZeroActive,
      duree_max_vente_jours: dureeActive ? e.duree_max_vente_jours : null,
      action_echeance: dureeActive ? (e.retour_fournisseur_autorise ? 'retour_fournisseur_obligatoire' : 'alerte_manager') : null,
      mode_agregation_ventes: 'aucun',
      quarts_comptage: e.quarts_comptage || null,
      reapprovisionnable: e.reapprovisionnable !== false,
      validation_manager_requise: !!e.validation_manager_requise,
      comptage_masque: !!e.comptage_masque,
      seuil_minimal: seuilActif ? e.seuil_minimal : null,
      controle_aleatoire: !!e.controle_aleatoire,
      photo_obligatoire: !!e.photo_obligatoire,
      frequence_controle: e.frequence_controle || 'standard',
      delai_max_jours_sans_controle: (e.delai_max_jours_sans_controle !== '' && e.delai_max_jours_sans_controle != null) ? e.delai_max_jours_sans_controle : null,
      updated_at: new Date().toISOString(), // Sprint 3 — voir enregistrerProfilProduit, même discipline
    };
    const { data, error } = await nexusClient.from('inventaire_categories').update(payload).eq('id', e.categorie_id).select().single();
    if (error) { console.error('Enregistrement règle catégorie:', error); alert('Erreur — réessayez.'); if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer pour toute la catégorie'; } return; }
    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, entite_type: 'inventaire_categories', entite_id: e.categorie_id,
      action: 'configuration_regle_categorie', nouvelle_valeur: payload, acteur_id: managerCourant.id,
    });
    const idx = categoriesSite.findIndex(c => c.id === e.categorie_id);
    if (idx !== -1) categoriesSite[idx] = data;

    // Sprint 5 (20/08/2026) — réconciliation des seuils d'écart dans
    // inventaire_seuils, indépendante de regle_active ci-dessus : upsert si
    // une valeur est réglée, suppression de la ligne si le champ est vidé.
    // S'appuie sur la contrainte unique (site, categorie_id, cle) posée par
    // la migration inventaire_seuils_unique_site_categorie_cle.
    const seuilsAReconcilier = [
      { cle: 'quantite_alerte', valeur: (e.seuil_ecart_quantite !== '' && e.seuil_ecart_quantite != null) ? e.seuil_ecart_quantite : null },
      { cle: 'valeur_alerte', valeur: (e.seuil_ecart_valeur !== '' && e.seuil_ecart_valeur != null) ? e.seuil_ecart_valeur : null },
    ];
    for (const s of seuilsAReconcilier) {
      if (s.valeur != null) {
        const { error: errSeuil } = await nexusClient.from('inventaire_seuils')
          .upsert({ site: siteId, categorie_id: e.categorie_id, cle: s.cle, valeur: s.valeur }, { onConflict: 'site,categorie_id,cle' });
        if (errSeuil) console.error('Enregistrement seuil écart catégorie:', errSeuil);
      } else {
        const { error: errSeuil } = await nexusClient.from('inventaire_seuils')
          .delete().eq('site', siteId).eq('categorie_id', e.categorie_id).eq('cle', s.cle);
        if (errSeuil) console.error('Suppression seuil écart catégorie:', errSeuil);
      }
    }
    if (!seuilsEcartParCategorie[e.categorie_id]) seuilsEcartParCategorie[e.categorie_id] = {};
    seuilsEcartParCategorie[e.categorie_id].quantite_alerte = seuilsAReconcilier[0].valeur;
    seuilsEcartParCategorie[e.categorie_id].valeur_alerte = seuilsAReconcilier[1].valeur;

    categorieReglesOuverte = null; categorieRegleEnEdition = null;
    render();
  }

  // Résumé en langage clair — même logique que libelleReglesProduit, sur les
  // colonnes de la catégorie plutôt que celles du produit (Article 11 :
  // libelleReglesProduit accepte déjà n'importe quel objet "règle", peu
  // importe sa provenance, donc pas de deuxième fonction de libellé).
  function libelleReglesCategorie(cat) {
    if (!cat || !cat.regle_active) return 'Pas de règle commune — chaque produit reste indépendant';
    return libelleReglesProduit(cat);
  }

  function renderCarteCategorieRegle(cat) {
    const total = produitsCategorie(cat.id).length;
    if (!total) return ''; // catégorie sans produit actif : rien à régler ici
    const exceptions = compterExceptionsCategorie(cat.id);
    const ouvert = categorieReglesOuverte === cat.id;
    return `
      <div class="card" style="margin-bottom:10px; padding:12px 14px;">
        <div class="categorie-row" data-categorie-regle="${cat.id}" style="padding:0;">
          <div>
            <div class="categorie-nom" style="font-size:13.5px; font-weight:600;">${cat.nom}</div>
            <div class="categorie-count">${total} produit${total > 1 ? 's' : ''}</div>
          </div>
          <div class="categorie-etat ${cat.regle_active ? 'en-cours' : 'a-faire'}">${ouvert ? '▾' : '▸'}</div>
        </div>
        <div style="margin-top:8px; font-size:12.5px; color:${cat.regle_active ? 'var(--green)' : 'var(--text-dim)'};">
          ${cat.regle_active ? '☑ Règle commune activée' : '☐ Règle commune désactivée'}
        </div>
        <div class="categorie-count" style="margin-top:2px;">${libelleReglesCategorie(cat)}</div>
        ${exceptions > 0 ? `<div class="categorie-count" style="margin-top:2px;">${exceptions} produit${exceptions > 1 ? 's' : ''} en exception (non concerné${exceptions > 1 ? 's' : ''} par cette règle)</div>` : ''}
        ${seuilsEcartParCategorie[cat.id] && (seuilsEcartParCategorie[cat.id].quantite_alerte != null || seuilsEcartParCategorie[cat.id].valeur_alerte != null) ? `<div class="categorie-count" style="margin-top:2px;">⚠️ Seuil d'écart dérogé (${[seuilsEcartParCategorie[cat.id].quantite_alerte != null ? seuilsEcartParCategorie[cat.id].quantite_alerte + ' qté' : null, seuilsEcartParCategorie[cat.id].valeur_alerte != null ? seuilsEcartParCategorie[cat.id].valeur_alerte + ' €' : null].filter(Boolean).join(' / ')})</div>` : ''}
        ${ouvert && categorieRegleEnEdition ? renderFormulaireRegleCategorie() : ''}
      </div>
    `;
  }

  // Formulaire — mêmes champs que renderFormulaireProfil (voir commentaire
  // en tête de bloc), ids préfixés catRegle*/catProfil* pour ne jamais
  // entrer en collision avec le formulaire produit si les deux venaient à
  // exister dans le DOM en même temps.
  function renderFormulaireRegleCategorie() {
    const e = categorieRegleEnEdition;
    const dureeActive = e.duree_max_vente_jours != null && e.duree_max_vente_jours !== '';
    const comptageValeur = !e.quarts_comptage ? 'deux' : (e.quarts_comptage.includes('matin') ? 'matin' : 'soir');
    return `
      <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--hairline);">
        <label class="regle-check-row">
          <input type="checkbox" id="catRegleActive" ${e.regle_active ? 'checked' : ''}>
          <span><b>Règle commune pour la catégorie</b> — appliquée par défaut à tous les produits sans exception propre</span>
        </label>
        <div class="note" style="margin:0 0 10px;">${e.regle_active ? 'Les réglages ci-dessous s\'appliquent à tous les produits de cette catégorie qui n\'ont pas leur propre exception.' : 'Case décochée : les réglages ci-dessous restent enregistrés mais ne s\'appliquent à aucun produit — comportement par défaut inchangé.'}</div>

        <label class="regle-check-row">
          <input type="checkbox" id="catRegleProductionJournaliere" ${e.production_journaliere ? 'checked' : ''}>
          <span>🥐 Suivi de production journalière (préparation recommandée le matin, viennoiserie type)</span>
        </label>
        ${e.production_journaliere ? `
          <div class="note" style="margin:0 0 10px;">Les produits qui héritent de cette catégorie apparaissent dans l'onglet <b>🥐 Production</b>. Incompatible avec "Remis à zéro"/"Durée de vente"/"Seuil d'alerte" ci-dessous — masqués tant que cette case est cochée.</div>
        ` : ''}

        ${!e.production_journaliere ? `
        <label class="regle-check-row">
          <input type="checkbox" id="catRegleRemiseAZero" ${e.remise_a_zero_matin ? 'checked' : ''}>
          <span>🔄 Stock remis à zéro chaque matin</span>
        </label>

        <div class="regle-champ-row">
          <span>📅 Durée maximale de vente (jours)</span>
          <input type="number" min="1" class="mouv-qte" id="catRegleDureeMax" placeholder="Illimitée" value="${e.duree_max_vente_jours || ''}" style="width:74px; flex:none;">
        </div>
        ` : ''}

        ${!e.production_journaliere && dureeActive ? `
          <label class="regle-check-row">
            <input type="checkbox" id="catRegleRetourFournisseur" ${e.retour_fournisseur_autorise ? 'checked' : ''}>
            <span>↩️ Retour fournisseur autorisé à l'échéance</span>
          </label>
        ` : ''}

        <div class="regle-champ-row" style="flex-direction:column; align-items:stretch;">
          <span style="margin-bottom:6px;">🕒 Comptage</span>
          <select class="mouv-select" id="catRegleComptage">
            <option value="deux" ${comptageValeur === 'deux' ? 'selected' : ''}>Matin et soir</option>
            <option value="matin" ${comptageValeur === 'matin' ? 'selected' : ''}>Matin seulement</option>
            <option value="soir" ${comptageValeur === 'soir' ? 'selected' : ''}>Soir seulement</option>
          </select>
        </div>

        <label class="regle-check-row">
          <input type="checkbox" id="catRegleReapprovisionnable" ${e.reapprovisionnable !== false ? 'checked' : ''}>
          <span>📦 Produits réapprovisionnables en cours de quart</span>
        </label>

        ${!e.production_journaliere ? `
        <div class="regle-champ-row">
          <span>⚠️ Seuil d'alerte (quantité)</span>
          <input type="number" min="0" class="mouv-qte" id="catRegleSeuilAlerte" placeholder="Aucun" value="${e.seuil_minimal || ''}" style="width:74px; flex:none;">
        </div>
        ` : ''}

        <div class="regle-champ-row">
          <span>🎲 Criticité (plan de comptage tournant)</span>
          <select id="catRegleFrequenceControle" class="mouv-select" style="width:auto;">
            <option value="critique" ${e.frequence_controle === 'critique' ? 'selected' : ''}>Critique — compté chaque quart</option>
            <option value="standard" ${e.frequence_controle === 'standard' || !e.frequence_controle ? 'selected' : ''}>Standard — délai 7 jours</option>
            <option value="faible_rotation" ${e.frequence_controle === 'faible_rotation' ? 'selected' : ''}>Faible rotation — délai 21 jours</option>
          </select>
        </div>
        <div class="regle-champ-row">
          <span>Délai max sans contrôle (jours, override)</span>
          <input type="number" min="0" class="mouv-qte" id="catRegleDelaiMaxJours" placeholder="Défaut de la criticité" value="${e.delai_max_jours_sans_controle != null ? e.delai_max_jours_sans_controle : ''}" style="width:74px; flex:none;">
        </div>
        <label class="regle-check-row">
          <input type="checkbox" id="catProfilControleAleatoire" ${e.controle_aleatoire ? 'checked' : ''}>
          <span>Contrôle aléatoire (peut être tiré au sort par le Conseiller NEXUS)</span>
        </label>
        <!-- 30/08/2026 (chantier "réglages fantômes") : "Validation manager requise avant de compter", "Comptage à l'aveugle" et
             "Photo obligatoire" retirés — voir la note équivalente dans le formulaire produit pour la justification complète
             (Article 5/11 : aucun consommateur, aucune ligne réglée sur un vrai produit, comptage à l'aveugle déjà couvert par
             défaut sur tout le plan V2). -->
        <div class="note" style="margin:8px 0;">L'emplacement de comptage (dépôt/boutique) reste réglé produit par produit — ce n'est pas une règle de catégorie (onglet 📦 Produits).</div>

        <!-- 30/08/2026 (chantier convergence Inventaire V2, demande de Frédéric — "le libellé actuel « seuil d'écart — à partir de quand
             alerter le manager » est devenu trompeur avec Inventaire V2") : ce seuil ne déclenche jamais directement une alerte manager.
             Il détermine à partir de quand un écart devient significatif pour NEXUS et entre dans le cycle d'observation (détecté ->
             sous observation -> second contrôle -> manager seulement si l'écart persiste) — voir NexusInventaireMoteur.ecartQuantiteSignificatif
             et qualifierObservationEcart. -->
        <div class="note" style="margin:12px 0 4px; font-weight:600; color:var(--text);">Seuils d'écart (indépendants de la règle de comptage ci-dessus — à partir de quand un écart entre dans le cycle d'observation NEXUS)</div>
        <div class="regle-champ-row">
          <span>⚠️ Seuil d'écart — quantité</span>
          <input type="number" min="0" step="1" class="mouv-qte" id="catRegleSeuilEcartQte" placeholder="Défaut site (${parametresInventaire.quantityAlertThreshold ?? 1})" value="${e.seuil_ecart_quantite != null ? e.seuil_ecart_quantite : ''}" style="width:74px; flex:none;">
        </div>
        <div class="regle-champ-row">
          <span>💶 Seuil d'écart — valeur (€)</span>
          <input type="number" min="0" step="0.01" class="mouv-qte" id="catRegleSeuilEcartValeur" placeholder="${parametresInventaire.valueAlertThreshold != null ? 'Défaut site (' + parametresInventaire.valueAlertThreshold + ')' : 'Aucun défaut site'}" value="${e.seuil_ecart_valeur != null ? e.seuil_ecart_valeur : ''}" style="width:74px; flex:none;">
        </div>

        <button class="btn-primary" id="btnEnregistrerRegleCategorie" style="margin-top:0;">Enregistrer pour toute la catégorie</button>
        <button class="btn-text" id="btnAnnulerRegleCategorie">Annuler</button>
      </div>
    `;
  }

  function renderBlocReglesCategories() {
    const categoriesAvecProduits = categoriesSite.filter(c => produitsCategorie(c.id).length > 0);
    if (!categoriesAvecProduits.length) return '';
    return `
      <div class="question-titre">Règles par catégorie</div>
      <div class="ventes-desc" style="margin:6px 2px 12px;">Définissez une fois comment compter les produits d'une même famille — chaque produit sans exception propre hérite automatiquement de la règle de sa catégorie.</div>
      ${categoriesAvecProduits.map(renderCarteCategorieRegle).join('')}
    `;
  }

  function renderOngletRegles() {
    if (!produitsInventaire.length) return '<div class="loading">Chargement des produits…</div>';
    const filtre = rechercheReglesTexte.trim().toLowerCase();
    const actifs = produitsInventaire.filter(p => p.actif && (!filtre || p.designation.toLowerCase().includes(filtre)));
    const groupes = actifs.reduce((acc, p) => {
      const cat = p.inventaire_categories ? p.inventaire_categories.nom : 'Autres';
      (acc[cat] = acc[cat] || []).push(p);
      return acc;
    }, {});
    return `
      <a href="#" class="retour-accueil" data-retour-accueil>← Accueil</a>
      <div class="question-titre">Comment souhaitez-vous les compter ?</div>
      ${renderBlocReglesCategories()}
      <div class="section-titre" style="margin-top:20px;">Exceptions produit</div>
      <div class="ventes-desc" style="margin:6px 2px 12px;">Modifiez uniquement les produits qui ne suivent pas la règle de leur catégorie. Par défaut, un produit hérite de sa catégorie (ou garde son stock d'un quart à l'autre si sa catégorie n'a pas de règle commune).</div>
      <input type="text" class="champ-recherche" id="rechercheRegles" placeholder="🔍 Rechercher un produit suivi…" value="${rechercheReglesTexte}" style="margin-bottom:12px;">
      ${actifs.length === 0 ? '<div class="empty">Aucun produit ne correspond.</div>' : Object.entries(groupes).map(([cat, items]) => `
        <div class="cat-block">
          <div class="cat-head"><div class="cat-nom">${cat} (${items.length})</div></div>
          <div class="card">${items.map(p => renderLigneProfilProduit(p)).join('')}</div>
        </div>
      `).join('')}
    `;
  }

  // ==============================================================
  // ONGLET MISSIONS DE CONTRÔLE — Inventaire V2 Sprint 1 "Configuration
  // multi-site" (29/08/2026, doctrine "NEXUS Inventaire V2" de Frédéric).
  // "Qui compte quoi, quand, avec quel repli" — configuration durable, table
  // inventaire_mission_rules. Portée explicitement scopée par Frédéric pour
  // ce sprint : "lecture/édition minimale", jamais l'aperçu avant
  // activation ni le générateur de missions (Sprint 2). Toute la logique de
  // RÉSOLUTION (une règle s'applique-t-elle, quel rôle est affecté) vit
  // dans NexusInventaireMoteur (Article 11) — cet onglet ne fait qu'afficher
  // la configuration et écrire les changements via
  // nexus-inventaire-mission-rules-donnees.js.
  // ==============================================================
  function libelleRoleAffichage(roleCode) {
    const LABELS = { pompiste: 'Piste', caissier: 'Caisse', renfort: 'Renfort', manager: 'Manager', gerant: 'Gérant', vacataire: 'Vacataire' };
    return LABELS[roleCode] || roleCode;
  }
  function libelleQuartAffichage(quart) {
    if (!quart) return 'Les deux quarts';
    return quart === 'matin' ? 'Matin (Q1)' : quart === 'soir' ? 'Soir (Q2)' : quart;
  }
  function nomsCategories(ids) {
    if (!ids || !ids.length) return 'Toutes catégories';
    const map = {}; categoriesSite.forEach(c => { map[c.id] = c.nom; });
    return ids.map(id => map[id] || '(catégorie supprimée)').join(', ');
  }

  function renderCarteMissionRule(r) {
    const M = typeof NexusInventaireMoteur !== 'undefined' ? NexusInventaireMoteur : null;
    const libelleMomentAff = M ? M.libelleMoment(r.moment_code) : r.moment_code;
    return `
      <div class="card" style="margin-bottom:10px; padding:12px 14px; ${r.actif ? '' : 'opacity:0.55;'}">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div style="font-size:13.5px; font-weight:600;">${r.nom}</div>
          <div class="toggle-switch ${r.actif ? 'on' : ''}" data-mission-toggle="${r.id}" data-actif="${r.actif ? '1' : '0'}"><div class="toggle-knob"></div></div>
        </div>
        <div class="categorie-count" style="margin-top:6px;">
          👤 ${libelleRoleAffichage(r.role_code)}${r.role_repli ? ` (repli : ${libelleRoleAffichage(r.role_repli)})` : ''}
          &nbsp;·&nbsp; 🕐 ${libelleQuartAffichage(r.quart)} — ${libelleMomentAff}
          &nbsp;·&nbsp; ${r.priorite === 'sensible' ? '⚠️ Sensible' : 'Normale'}
        </div>
        <div class="categorie-count" style="margin-top:2px;">📦 ${nomsCategories(r.categorie_ids)}</div>
        <div class="categorie-count" style="margin-top:2px;">
          Mode : ${r.mode_selection === 'tournant' ? `Rotation (${r.nombre_references || '?'} référence(s))` : r.mode_selection === 'cible' ? 'Ciblé' : 'Complet'}
          ${r.strategie_repli ? ` · Si absent : ${ (M ? M.libelleStrategieRepli(r.strategie_repli) : r.strategie_repli).toLowerCase() }` : ''}
        </div>
      </div>
    `;
  }

  function renderFormulaireNouvelleMission() {
    const f = missionRuleNouveauForm;
    const M = typeof NexusInventaireMoteur !== 'undefined' ? NexusInventaireMoteur : null;
    const moments = M ? M.MOMENTS_QUART : [{ cle: 'debut', label: 'Début de quart' }, { cle: 'pendant', label: 'Pendant le quart' }, { cle: 'fin', label: 'Fin de quart (transmission)' }];
    const strategies = M ? M.STRATEGIES_REPLI : [];
    return `
      <div class="card" style="margin:0 0 10px; padding:12px 14px;">
        <div class="param-ligne"><label>Nom de la mission</label><input type="text" class="param-input" id="missionNouveauNom" placeholder="ex. Caisse · Début de quart" value="${f.nom}"></div>
        <div class="param-ligne"><label>Rôle affecté</label><select class="param-input" id="missionNouveauRole">${ROLES_EMPLOYE_CONNUS.map(r => `<option value="${r}" ${f.role_code === r ? 'selected' : ''}>${libelleRoleAffichage(r)}</option>`).join('')}</select></div>
        <div class="param-ligne"><label>Rôle de repli (si absent)</label><select class="param-input" id="missionNouveauRoleRepli"><option value="">Aucun</option>${ROLES_EMPLOYE_CONNUS.map(r => `<option value="${r}" ${f.role_repli === r ? 'selected' : ''}>${libelleRoleAffichage(r)}</option>`).join('')}</select></div>
        <div class="param-ligne"><label>Quart concerné</label><select class="param-input" id="missionNouveauQuart"><option value="" ${f.quart === '' ? 'selected' : ''}>Les deux quarts</option><option value="matin" ${f.quart === 'matin' ? 'selected' : ''}>Matin (Q1)</option><option value="soir" ${f.quart === 'soir' ? 'selected' : ''}>Soir (Q2)</option></select></div>
        <div class="param-ligne"><label>Moment du quart</label><select class="param-input" id="missionNouveauMoment">${moments.map(m => `<option value="${m.cle}" ${f.moment_code === m.cle ? 'selected' : ''}>${m.label}</option>`).join('')}</select></div>
        <div class="param-ligne"><label>Mode de sélection</label><select class="param-input" id="missionNouveauMode"><option value="complet" ${f.mode_selection === 'complet' ? 'selected' : ''}>Complet (tout le périmètre)</option><option value="tournant" ${f.mode_selection === 'tournant' ? 'selected' : ''}>Rotation (N références tournantes)</option><option value="cible" ${f.mode_selection === 'cible' ? 'selected' : ''}>Ciblé</option></select></div>
        ${f.mode_selection === 'tournant' ? `<div class="param-ligne"><label>Nombre de références</label><input type="number" min="1" step="1" class="param-input" id="missionNouveauNbRef" value="${f.nombre_references}"></div>` : ''}
        <div class="param-ligne"><label>Priorité</label><select class="param-input" id="missionNouveauPriorite"><option value="normale" ${f.priorite === 'normale' ? 'selected' : ''}>Normale</option><option value="sensible" ${f.priorite === 'sensible' ? 'selected' : ''}>Sensible</option></select></div>
        <div class="param-ligne"><label>Stratégie de repli (si le rôle est absent et sans rôle de repli)</label><select class="param-input" id="missionNouveauStrategie">${strategies.map(s => `<option value="${s.cle}" ${f.strategie_repli === s.cle ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>

        <div class="param-checklist">
          ${categoriesSite.length === 0 ? '<div class="empty">Aucune catégorie active.</div>' : categoriesSite.map(c => {
            const actif = (f.categorie_ids || []).includes(c.id);
            return `<label class="param-check-item ${actif ? 'actif' : ''}"><input type="checkbox" class="mission-cat-check" data-cat="${c.id}" ${actif ? 'checked' : ''}>${c.nom}</label>`;

          <button class="btn-ghost" id="btnAnnulerMission" style="opacity:0.7;">Annuler</button>
        </div>
      </div>
    `;

  function renderOngletMissions() {
    const actives = missionRules.filter(r => r.actif);
    const inactives = missionRules.filter(r => !r.actif);
    return `
      <a href="#" class="retour-accueil" data-retour-accueil>← Accueil</a>
      <div class="question-titre">Qui compte quoi, et quand ?</div>
      <div class="ventes-desc" style="margin:6px 2px 16px;">Chaque mission affecte un rôle (jamais une personne nommée) à un périmètre de catégories, à un moment précis du quart. NEXUS utilise ces règles pour construire automatiquement les missions de contrôle de chaque quart — cet écran ne fait que définir la configuration.</div>

      ${missionRuleNouveauOuvert ? renderFormulaireNouvelleMission() : `<button class="btn-ghost" id="btnOuvrirNouvelleMission" style="margin-bottom:14px;">+ Nouvelle mission</button>`}

      <div class="section-titre">Missions actives (${actives.length})</div>
      ${actives.length === 0 ? '<div class="empty">Aucune mission configurée.</div>' : actives.map(renderCarteMissionRule).join('')}

      ${inactives.length > 0 ? `
      <div class="section-titre" style="margin-top:18px;">Missions désactivées (${inactives.length})</div>
      ${inactives.map(renderCarteMissionRule).join('')}
      ` : ''}
    `;
  }

  async function creerNouvelleMission() {
    const f = missionRuleNouveauForm;
    if (!f.nom.trim()) return;
    const btn = document.getElementById('btnEnregistrerMission');
    if (btn) { btn.disabled = true; btn.textContent = 'Création…'; }
    const ordreMax = missionRules.reduce((max, r) => Math.max(max, r.ordre_affichage || 0), 0);
    const payload = {
      nom: f.nom.trim(), actif: true, role_code: f.role_code, role_repli: f.role_repli || null,
      quart: f.quart || null, moment_code: f.moment_code, categorie_ids: f.categorie_ids,
      mode_selection: f.mode_selection, nombre_references: f.mode_selection === 'tournant' ? (parseInt(f.nombre_references, 10) || null) : null,
      strategie_repli: f.strategie_repli || null, priorite: f.priorite, ordre_affichage: ordreMax + 10,
    };
    const cree = await NexusInventaireMissionRulesDonnees.creerMissionRule(nexusClient, siteId, payload);
    if (btn) { btn.disabled = false; btn.textContent = 'Créer la mission'; }
    if (!cree) { alert('Erreur — réessayez.'); return; }
    missionRules = [...missionRules, cree].sort((a, b) => (a.ordre_affichage || 0) - (b.ordre_affichage || 0));
    missionRuleNouveauOuvert = false;
    missionRuleNouveauForm = { ...MISSION_RULE_NOUVEAU_DEFAUT };
    render();
  }

  async function basculerActiveMission(id, actifActuel) {
    const fn = actifActuel ? NexusInventaireMissionRulesDonnees.desactiverMissionRule : NexusInventaireMissionRulesDonnees.reactiverMissionRule;
    const maj = await fn(nexusClient, id);
    if (!maj) { alert('Erreur — réessayez.'); return; }
    missionRules = missionRules.map(r => r.id === id ? maj : r);
    render();
  }

  // ==============================================================
  // ONGLET PRODUCTION — quantités recommandées, calendrier, valeurs
  // spéciales (19/08/2026, tâche #518). Trois blocs indépendants sur les 3
  // tables de configuration lues par le moteur de recommandation (M2,
  // nexus-inventaire-moteur.js::calculerRecommandationPreparation) —
  // aucune logique de calcul ici, uniquement de l'écriture de configuration.
  // ==============================================================
  async function chargerProduitsProduction(site) {
    if (typeof NexusInventaireProductionDonnees === 'undefined') {
      console.error('NexusInventaireProductionDonnees non chargé — liste des produits Production indisponible.');
      return [];
    }
    return await NexusInventaireProductionDonnees.chargerProduitsProfilProductionJournaliere(nexusClient, site);
  }
  async function chargerReglesProduction(site) {
    const { data, error } = await nexusClient.from('inventaire_production_regles').select('*').eq('site', site);
    if (error) { console.error('Chargement règles production:', error); return {}; }
    const map = {};
    (data || []).forEach(r => { map[r.produit_id] = r; });
    return map;
  }
  async function chargerCalendrierSite(site) {
    const { data, error } = await nexusClient.from('inventaire_calendrier_site').select('*').eq('site', site).order('date');
    if (error) { console.error('Chargement calendrier site:', error); return []; }
    return data || [];
  }
  async function chargerValeursSpecialesProduction(site) {
    const { data, error } = await nexusClient.from('inventaire_production_valeurs_speciales')
      .select('*, inventaire_zone_produit(designation)').eq('site', site).order('date');
    if (error) { console.error('Chargement valeurs spéciales production:', error); return []; }
    return data || [];
  }

  function ouvrirEditionRegleProduction(produitId) {
    if (productionRegleOuverte === produitId) { productionRegleOuverte = null; productionRegleEnEdition = null; render(); return; }
    productionRegleOuverte = produitId;
    const existant = reglesProductionMap[produitId];
    productionRegleEnEdition = existant ? {
      produit_id: produitId,
      valeur_semaine: existant.valeur_semaine, valeur_samedi: existant.valeur_samedi,
      valeur_dimanche: existant.valeur_dimanche, valeur_vacances: existant.valeur_vacances,
      autoriser_nouvelle_fournee: existant.autoriser_nouvelle_fournee !== false,
      seuil_reste_surveiller: existant.seuil_reste_surveiller,
    } : {
      produit_id: produitId, valeur_semaine: null, valeur_samedi: null, valeur_dimanche: null, valeur_vacances: null,
      autoriser_nouvelle_fournee: true, seuil_reste_surveiller: null,
    };
    render();
  }
  async function enregistrerRegleProduction() {
    const p = productionRegleEnEdition;
    const btn = document.getElementById('btnEnregistrerRegleProduction');
    if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
    const payload = {
      site: siteId, produit_id: p.produit_id,
      valeur_semaine: p.valeur_semaine, valeur_samedi: p.valeur_samedi,
      valeur_dimanche: p.valeur_dimanche, valeur_vacances: p.valeur_vacances,
      autoriser_nouvelle_fournee: p.autoriser_nouvelle_fournee !== false,
      seuil_reste_surveiller: p.seuil_reste_surveiller,
    };
    const { data, error } = await nexusClient.from('inventaire_production_regles').upsert(payload, { onConflict: 'site,produit_id' }).select().single();
    if (error) { console.error('Enregistrement règle production:', error); alert('Erreur — réessayez.'); if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer ces quantités'; } return; }
    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, entite_type: 'inventaire_production_regles', entite_id: data.id,
      action: 'configuration_regle_production', nouvelle_valeur: payload, acteur_id: managerCourant.id,
    });
    reglesProductionMap[p.produit_id] = data;
    productionRegleOuverte = null; productionRegleEnEdition = null;
    render();
  }

  async function ajouterEntreeCalendrier() {
    const f = calendrierForm;
    if (!f.date) return;
    const btn = document.getElementById('btnAjouterCalendrier');
    if (btn) { btn.disabled = true; btn.textContent = 'Ajout…'; }
    const { data, error } = await nexusClient.from('inventaire_calendrier_site').insert({
      site: siteId, date: f.date, type: f.type, libelle: f.libelle || null, created_by: managerCourant.id,
    }).select().single();
    if (error) {
      console.error('Ajout calendrier site:', error);
      alert(error.code === '23505' ? 'Une date existe déjà pour ce site — supprimez-la d\'abord si vous voulez la remplacer.' : 'Erreur — réessayez.');
      if (btn) { btn.disabled = false; btn.textContent = 'Ajouter'; }
      return;
    }
    calendrierSite = [...calendrierSite, data].sort((a, b) => a.date < b.date ? -1 : 1);
    calendrierForm = { date: '', type: 'vacances', libelle: '' };
    render();
  }
  async function supprimerEntreeCalendrier(id) {
    const { error } = await nexusClient.from('inventaire_calendrier_site').delete().eq('id', id);
    if (error) { console.error('Suppression calendrier site:', error); alert('Erreur — réessayez.'); return; }
    calendrierSite = calendrierSite.filter(c => c.id !== id);
    render();
  }

  async function ajouterValeurSpeciale() {
    const f = valeurSpecialeForm;
    if (!f.produitId || !f.date || f.valeur === '' || f.valeur == null) return;
    const btn = document.getElementById('btnAjouterValeurSpeciale');
    if (btn) { btn.disabled = true; btn.textContent = 'Ajout…'; }
    const { data, error } = await nexusClient.from('inventaire_production_valeurs_speciales').insert({
      site: siteId, produit_id: f.produitId, date: f.date, valeur: parseFloat(f.valeur), libelle: f.libelle || null, created_by: managerCourant.id,
    }).select('*, inventaire_zone_produit(designation)').single();
    if (error) {
      console.error('Ajout valeur spéciale production:', error);
      alert(error.code === '23505' ? 'Une valeur spéciale existe déjà pour ce produit à cette date — supprimez-la d\'abord si vous voulez la remplacer.' : 'Erreur — réessayez.');
      if (btn) { btn.disabled = false; btn.textContent = 'Ajouter'; }
      return;
    }
    valeursSpecialesProduction = [...valeursSpecialesProduction, data].sort((a, b) => a.date < b.date ? -1 : 1);
    valeurSpecialeForm = { produitId: '', date: '', valeur: '', libelle: '' };
    render();
  }
  async function supprimerValeurSpeciale(id) {
    const { error } = await nexusClient.from('inventaire_production_valeurs_speciales').delete().eq('id', id);
    if (error) { console.error('Suppression valeur spéciale production:', error); alert('Erreur — réessayez.'); return; }
    valeursSpecialesProduction = valeursSpecialesProduction.filter(v => v.id !== id);
    render();
  }

  function renderFormulaireRegleProduction() {
    const e = productionRegleEnEdition;
    return `
      <div class="card" style="margin:0 0 10px; padding:12px 14px;">
        <div class="regle-champ-row">
          <span>📅 Quantité conseillée — jour de semaine</span>
          <input type="number" min="0" step="1" class="mouv-qte" id="prodValeurSemaine" placeholder="—" value="${e.valeur_semaine != null ? e.valeur_semaine : ''}" style="width:74px; flex:none;">
        </div>
        <div class="regle-champ-row">
          <span>📅 Quantité conseillée — samedi</span>
          <input type="number" min="0" step="1" class="mouv-qte" id="prodValeurSamedi" placeholder="—" value="${e.valeur_samedi != null ? e.valeur_samedi : ''}" style="width:74px; flex:none;">
        </div>
        <div class="regle-champ-row">
          <span>📅 Quantité conseillée — dimanche</span>
          <input type="number" min="0" step="1" class="mouv-qte" id="prodValeurDimanche" placeholder="—" value="${e.valeur_dimanche != null ? e.valeur_dimanche : ''}" style="width:74px; flex:none;">
        </div>
        <div class="regle-champ-row">
          <span>🏖️ Quantité conseillée — vacances/fériés</span>
          <input type="number" min="0" step="1" class="mouv-qte" id="prodValeurVacances" placeholder="—" value="${e.valeur_vacances != null ? e.valeur_vacances : ''}" style="width:74px; flex:none;">
        </div>
        <div class="note" style="margin:10px 0 8px;">Laissez un champ vide si aucune quantité n'est encore décidée pour ce cas — NEXUS affichera "pas de recommandation" à l'employé plutôt qu'un chiffre inventé (jamais un zéro par défaut).</div>

        <label class="regle-check-row">
          <input type="checkbox" id="prodAutoriserFournee" ${e.autoriser_nouvelle_fournee !== false ? 'checked' : ''}>
          <span>🔥 Autoriser une nouvelle fournée en cours de quart (au-delà de la quantité initiale)</span>
        </label>

        <div class="regle-champ-row">
          <span>⚠️ Seuil de reste à surveiller (unités)</span>
          <input type="number" min="0" step="1" class="mouv-qte" id="prodSeuilReste" placeholder="Aucun" value="${e.seuil_reste_surveiller != null ? e.seuil_reste_surveiller : ''}" style="width:74px; flex:none;">
        </div>

        <button class="btn-primary" id="btnEnregistrerRegleProduction" style="margin-top:0;">Enregistrer ces quantités</button>
        <button class="btn-text" id="btnAnnulerRegleProduction">Annuler</button>
      </div>
    `;
  }
  function libelleRegleProduction(regle) {
    if (!regle) return 'Aucune quantité configurée';
    const parties = [];
    if (regle.valeur_semaine != null) parties.push(`Semaine ${regle.valeur_semaine}`);
    if (regle.valeur_samedi != null) parties.push(`Sam. ${regle.valeur_samedi}`);
    if (regle.valeur_dimanche != null) parties.push(`Dim. ${regle.valeur_dimanche}`);
    if (regle.valeur_vacances != null) parties.push(`Vacances ${regle.valeur_vacances}`);
    return parties.length ? parties.join(' · ') : 'Aucune quantité configurée';
  }
  function renderLigneRegleProduction(p) {
    const regle = reglesProductionMap[p.id];
    const libelle = libelleRegleProduction(regle);
    const ouvert = productionRegleOuverte === p.id;
    const configure = libelle !== 'Aucune quantité configurée';
    return `
      <div class="categorie-row" data-regle-production="${p.id}">
        <div>
          <div class="categorie-nom" style="font-size:13px;">${p.designation}</div>
          <div class="categorie-count">${libelle}</div>
        </div>
        <div class="categorie-etat ${configure ? 'en-cours' : 'a-faire'}">${ouvert ? '▾' : '▸'}</div>
      </div>
      ${ouvert && productionRegleEnEdition ? renderFormulaireRegleProduction() : ''}
    `;
  }

  function libelleTypeCalendrier(type) { return type === 'ferie' ? 'Férié' : 'Vacances'; }
  function renderBlocCalendrier() {

      <div class="ventes-desc" style="margin:2px 2px 10px;">Partagé par tous les produits en suivi de production — un jour marqué ici prend le pas sur le calcul semaine/week-end habituel (priorité juste après une éventuelle valeur spéciale du jour). Les vacances scolaires de Martinique sont déjà reconnues automatiquement (calendrier NEXUS Tempo) : inutile de les ressaisir ici — cette liste sert aux jours fériés et aux fermetures exceptionnelles propres à ce site.</div>
      <div class="card" style="margin-bottom:10px;">
        ${calendrierSite.length === 0 ? '<div class="empty">Aucune date configurée.</div>' : calendrierSite.map(c => `

          <select class="mouv-select" id="calendrierType">
            <option value="vacances" ${f.type === 'vacances' ? 'selected' : ''}>Vacances scolaires</option>

      </div>

          <div class="categorie-row">

        <div class="regle-champ-row"><span>Quantité</span><input type="number" min="0" step="1" class="mouv-qte" id="valeurSpecialeValeur" placeholder="—" value="${f.valeur}" style="width:74px; flex:none;"></div>

  function renderOngletProduction() {
    return `

  // ONGLET 4 — ALERTES (relocalisé + nouveaux seuils)

  let modesAveugleActifs = [];
  let jaugeageActif = false;

  async function chargerParametresInventaire(site) {
    const { data, error } = await nexusClient.from('station_config').select('parametres_inventaire').eq('site', site).maybeSingle();
    if (error) { console.error('Chargement paramètres inventaire:', error); return { ...DEFAULTS_PARAMETRES_INVENTAIRE }; }
    return { ...DEFAULTS_PARAMETRES_INVENTAIRE, ...(data && data.parametres_inventaire ? data.parametres_inventaire : {}) };
  }
  async function sauvegarderParametresInventaire(patch) {
    parametresInventaire = { ...parametresInventaire, ...patch };
    const { error } = await nexusClient.from('station_config').update({ parametres_inventaire: parametresInventaire }).eq('site', siteId);
    if (error) { console.error('Sauvegarde paramètres inventaire:', error); alert('Erreur d\'enregistrement — réessayez.'); return false; }
    const badge = document.getElementById('paramEnregistre');
    if (badge) { badge.classList.add('visible'); setTimeout(() => badge.classList.remove('visible'), 1600); }
    return true;
  }
  async function chargerModesAveugleActifs(site) {
    const { data, error } = await nexusClient.from('inventaire_modes_controle').select('*').eq('site', site).eq('mode', 'aveugle').eq('actif', true).is('categorie_id', null).is('produit_id', null);
    if (error) { console.error('Chargement modes aveugle:', error); return []; }
    return data || [];
  }
  async function chargerModeJaugeageActif(site) {
    const { data, error } = await nexusClient.from('inventaire_modes_controle').select('id').eq('site', site).eq('mode', 'jaugeage_actif').eq('actif', true).maybeSingle();
    if (error) { console.error('Chargement mode jaugeage:', error); return false; }
    return !!data;
  }
  async function toggleModeAveugle(employeeId, activer) {
    if (activer) {
      const { error } = await nexusClient.from('inventaire_modes_controle').insert({ site: siteId, employee_id: employeeId, mode: 'aveugle', actif: true, motif: "Activé depuis Paramètres Inventaire", cree_par: managerCourant.id });
      if (error) { console.error('Activation mode aveugle:', error); alert('Erreur — réessayez.'); }
    } else {
      const { error } = await nexusClient.from('inventaire_modes_controle').update({ actif: false }).eq('site', siteId).eq('employee_id', employeeId).eq('mode', 'aveugle').eq('actif', true).is('categorie_id', null).is('produit_id', null);
      if (error) { console.error('Désactivation mode aveugle:', error); alert('Erreur — réessayez.'); }
    }
    modesAveugleActifs = await chargerModesAveugleActifs(siteId);
    render();

  async function toggleJaugeage(activer) {
    if (activer) {
      const { error } = await nexusClient.from('inventaire_modes_controle').insert({ site: siteId, mode: 'jaugeage_actif', actif: true, motif: "Jaugeage carburant activé depuis Paramètres Inventaire", cree_par: managerCourant.id });
      if (error) { console.error('Activation jaugeage:', error); alert('Erreur — réessayez.'); }
    } else {
      const { error } = await nexusClient.from('inventaire_modes_controle').update({ actif: false }).eq('site', siteId).eq('mode', 'jaugeage_actif').eq('actif', true).is('categorie_id', null).is('produit_id', null).is('employee_id', null);
      if (error) { console.error('Désactivation jaugeage:', error); alert('Erreur — réessayez.'); }
    }
    jaugeageActif = await chargerModeJaugeageActif(siteId);
    render();
  }
  function renderEmployeToggle(e, actif) {
    return `<div class="employe-toggle-row"><div><div style="font-size:13px;">${e.nom}</div><div class="employe-role">${e.role}</div></div><div class="toggle-switch ${actif ? 'on' : ''}" data-employe="${e.id}" data-actif="${actif ? '1' : '0'}"><div class="toggle-knob"></div></div></div>`;
  }
  function renderToggleJaugeage(actif) {
    return `<div class="employe-toggle-row"><div><div style="font-size:13px;">Jaugeage carburant</div><div class="employe-role" style="text-transform:none;">Grisé et non requis par défaut, sur les deux quarts</div></div><div class="toggle-switch ${actif ? 'on' : ''}" data-mode="jaugeage" data-actif="${actif ? '1' : '0'}"><div class="toggle-knob"></div></div></div>`;
  }
  // Niveau de surveillance (21/08/2026, cahier UX de Frédéric — "L'écran
  // actuel présente directement fréquence, seuil quantité... C'est trop
  // technique pour un réglage courant"). Les 3 seuils "durs" ci-dessous sont
  // documentés ici même plutôt que laissés à deviner : Standard = valeurs
  // NEXUS historiques (celles de DEFAULTS_PARAMETRES_INVENTAIRE, inchangées
  // depuis toujours) ; Renforcé = préréglage concret et assumé (seuils
  // quantité/valeur divisés par 2, délai de clôture ramené au palier le
  // plus bas) — jamais une intention vague. 'Personnalisé' n'applique
  // aucune valeur : il déplie simplement le formulaire détaillé existant,
  // comportement strictement identique à avant ce lot.
  const PALIERS_DELAI_CLOTURE = [15, 30, 45, 60, 90, 120];
  const PRESET_RENFORCE = { quantityAlertThreshold: 0.5, valueAlertThreshold: 10, closureDelayMinutes: 15 };
  async function appliquerNiveauSurveillance(niveau) {
    if (niveau === parametresInventaire.niveauSurveillance) return;
    if (niveau === 'personnalise') {
      // Non destructif : ne touche à aucune valeur, révèle juste le détail.
      parametresInventaire.niveauSurveillance = 'personnalise';
      render();
      return;
    }
    const cible = niveau === 'renforce'
      ? { ...PRESET_RENFORCE, niveauSurveillance: 'renforce' }
      : { quantityAlertThreshold: DEFAULTS_PARAMETRES_INVENTAIRE.quantityAlertThreshold, valueAlertThreshold: DEFAULTS_PARAMETRES_INVENTAIRE.valueAlertThreshold, closureDelayMinutes: DEFAULTS_PARAMETRES_INVENTAIRE.closureDelayMinutes, niveauSurveillance: 'standard' };
    const libelle = niveau === 'renforce' ? 'Renforcé' : 'Standard NEXUS';
    if (!confirm(`Passer en niveau « ${libelle} » applique : seuil quantité ${cible.quantityAlertThreshold}, seuil valeur ${cible.valueAlertThreshold != null ? cible.valueAlertThreshold + ' €' : 'non défini'}, délai de clôture ${cible.closureDelayMinutes} min. Vos réglages personnalisés actuels seront remplacés par ce préréglage. Continuer ?`)) {
      render(); // annulé : remet le <select> sur la valeur réelle actuelle, pas celle juste choisie par le navigateur
      return;
    }
    await sauvegarderParametresInventaire(cible);
    render();
  }
  function renderOngletAlertes() {

    const niveau = p.niveauSurveillance || 'standard';
    return `
      <!-- 30/08/2026 (chantier convergence Inventaire V2) : reformulé — ce réglage ne fixe pas un déclenchement d'alerte manager
           direct, mais le seuil à partir duquel un écart entre dans le cycle d'observation NEXUS (détecté -> sous observation ->
           second contrôle -> manager si persistance). Voir la note de l'onglet Règles par catégorie pour le même principe. -->
      <div class="question-titre">À partir de quand un écart doit-il entrer dans le cycle d'observation ?</div>

      <div class="section-titre" style="margin-top:14px;">Niveau de surveillance</div>

        <select class="mouv-select" id="selNiveauSurveillance" style="width:100%;">

        </select>
        <div class="note" style="margin:8px 0 0;">${niveau === 'personnalise' ? 'Les valeurs détaillées ci-dessous sont modifiables librement.' : niveau === 'renforce' ? `Seuils préréglés : quantité ${p.quantityAlertThreshold}, valeur ${p.valueAlertThreshold != null ? p.valueAlertThreshold + ' €' : '—'}, clôture ${p.closureDelayMinutes} min.` : `Seuils NEXUS par défaut : quantité ${p.quantityAlertThreshold}, valeur ${p.valueAlertThreshold != null ? p.valueAlertThreshold + ' €' : 'non défini'}, clôture ${p.closureDelayMinutes} min.`}</div>
      </div>

      ${niveau === 'personnalise' ? `
      <div class="section-titre">Seuils d'entrée dans le cycle d'observation</div>
      <div class="card" style="margin-bottom:10px;">
        <div class="param-ligne"><label for="paramFrequence">Fréquence de supervision</label><select class="param-input" id="paramFrequence">${optionsFrequence}</select></div>
        <div class="param-ligne"><label for="paramSeuilQte">Seuil d'écart en quantité</label><input type="number" min="0" step="0.5" class="param-input" id="paramSeuilQte" value="${p.quantityAlertThreshold}"></div>
        <div class="param-ligne"><label for="paramSeuilValeur">Seuil d'écart en valeur (€)</label><input type="number" min="0" step="1" class="param-input" id="paramSeuilValeur" placeholder="Non défini" value="${p.valueAlertThreshold != null ? p.valueAlertThreshold : ''}"></div>
        <div class="param-ligne"><label for="paramDelaiCloture">Délai maximal de clôture</label><select class="param-input" id="paramDelaiCloture">${PALIERS_DELAI_CLOTURE.map(m => `<option value="${m}" ${p.closureDelayMinutes === m ? 'selected' : ''}>${m} min</option>`).join('')}</select></div>
        <div class="param-ligne"><label for="paramSeuilDemarque">Seuil de démarque (%)</label><input type="number" min="0" step="0.5" class="param-input" id="paramSeuilDemarque" placeholder="Non défini" value="${p.seuilDemarquePct != null ? p.seuilDemarquePct : ''}"></div>
        <div class="param-ligne"><label for="paramSeuilCasse">Seuil de casse (unités/mois)</label><input type="number" min="0" step="1" class="param-input" id="paramSeuilCasse" placeholder="Non défini" value="${p.seuilCasseUnites != null ? p.seuilCasseUnites : ''}"></div>
        <div class="param-ligne"><label for="paramSeuilPeremption">Alerte péremption (jours avant)</label><input type="number" min="0" step="1" class="param-input" id="paramSeuilPeremption" value="${p.seuilPeremptionJours != null ? p.seuilPeremptionJours : 2}"></div>
        <div class="param-ligne"><label>Rappel de retour fournisseur</label><div class="toggle-switch ${p.rappelRetourFournisseurActif ? 'on' : ''}" data-mode="rappel-retour" data-actif="${p.rappelRetourFournisseurActif ? '1' : '0'}"><div class="toggle-knob"></div></div></div>
        <div class="param-ligne"><label>Alertes immédiates</label><div class="toggle-switch ${p.immediateAlertsEnabled ? 'on' : ''}" data-mode="alertes-immediates" data-actif="${p.immediateAlertsEnabled ? '1' : '0'}"><div class="toggle-knob"></div></div></div>
        <span class="param-enregistre" id="paramEnregistre">✓ Enregistré</span>
      </div>
      <div class="param-note">Le seuil de démarque et le seuil de casse ne sont pas encore utilisés par un moteur de calcul dédié — ils sont enregistrés ici pour préparer les futures alertes automatiques, sans encore rien déclencher tout seuls (seuls les seuils de quantité/valeur/péremption sont déjà actifs).</div>
      ` : ''}

      <!-- Photo Decenium (30/08/2026, Snapshot Étape 2) : visible quel que
           soit le niveau de surveillance choisi ci-dessus — ce seuil ne
           concerne pas les alertes d'écart, mais la fiabilité temporelle
           de la Photo Decenium elle-même (Contrôle inventaire). -->
      <div class="section-titre">Photo Decenium</div>
      <div class="card" style="margin-bottom:16px;">
        <div class="param-ligne"><label for="paramSeuilDelaiSnapshot">Délai maximal entre les 2 exports (Ventes/Stock)</label><input type="number" min="1" step="1" class="param-input" id="paramSeuilDelaiSnapshot" value="${p.snapshotMaxDelayMinutes != null ? p.snapshotMaxDelayMinutes : 5}"> min</div>
        <div class="note" style="margin-top:6px;">Au-delà de ce délai, NEXUS avertit le manager avant de créer la Photo Decenium (Contrôle inventaire) et lui demande de confirmer s'il souhaite poursuivre malgré la réserve.</div>
      </div>

      <div class="section-titre">Catégories nécessitant une alerte immédiate</div>
      <div class="card" style="margin-bottom:16px;">
        ${categoriesSite.length === 0 ? '<div class="empty">Aucune catégorie active.</div>' : `
        <div class="param-checklist">
          ${categoriesSite.map(c => {
            const actif = (p.immediateAlertCategoryIds || []).includes(c.id);
            return `<label class="param-check-item ${actif ? 'actif' : ''}"><input type="checkbox" class="param-cat-check" data-cat="${c.id}" ${actif ? 'checked' : ''}>${c.nom}</label>`;
          }).join('')}
        </div>`}
      </div>

      <div class="section-titre">Mode de comptage à l'aveugle</div>
      <div class="card" style="margin-bottom:16px;">
        ${employesSite.length === 0 ? '<div class="empty">Aucun employé actif trouvé pour ce site.</div>' : employesSite.map(e => renderEmployeToggle(e, !!modesAveugleActifs.find(m => m.employee_id === e.id))).join('')}
      </div>
      <div class="section-titre">Jaugeage carburant</div>
      <div class="card">${renderToggleJaugeage(jaugeageActif)}</div>
    `;
  }

  function renderOngletTracabilite() {

      <div class="question-titre">Certains produits ont-ils une durée de vie à suivre ?</div>

        <div class="raccourci-titre">🔄 NEXUS Traçabilité</div>

  // ==============================================================
  // ONGLET 6 — SIMULATION (relocalisé depuis NEXUS-Inventaire-Manager-v1.html)
  // ==============================================================
  let sectionSimulationChargee = false;
  // Pliée par défaut (21/08/2026, réorganisation UX) : la comparaison papier
  // reste disponible en phase pilote mais n'est plus le cœur de l'écran —
  // "Tester ma configuration" ouvre d'abord sur le verdict de cohérence.
  let comparaisonPapierOuverte = false;
  let simulationForm = { date: '', quart: 'matin', employeId: '', phase: 'ouverture' };
  let simulationQuart = null;
  let simulationSaisie = {};
  let simulationChrono = null;
  let produitsPourSimulation = [];
  let statsSimulation = null;

  async function chargerTousProduitsActifsSite(site) {
    const { data, error } = await nexusClient.from('inventaire_zone_produit').select('id, designation, categorie_id, inventaire_categories(nom), inventaire_zones(code)').eq('site', site).eq('actif', true);
    if (error) { console.error('Chargement produits actifs:', error); return []; }
    return data || [];
  }
  async function chargerOuCreerQuartSimulation() {
    const { data: existant, error: e1 } = await nexusClient.from('inventaire_quarts').select('*').eq('site', siteId).eq('date', simulationForm.date).eq('quart', simulationForm.quart).eq('is_simulation', true).maybeSingle();
    if (e1) { console.error('Lecture quart simulation:', e1); return null; }
    if (existant) return existant;
    const { data: cree, error: e2 } = await nexusClient.from('inventaire_quarts').insert({
      site: siteId, date: simulationForm.date, quart: simulationForm.quart, statut: 'ouverture_en_cours',
      is_simulation: true, represented_employee_id: simulationForm.employeId || null, entered_by_user_id: managerCourant.id, ouvert_le: new Date().toISOString(),
    }).select().single();
    if (e2) { console.error('Création quart simulation:', e2); return null; }
    return cree;
  }
  async function chargerComptagesSimulation(quartId, phase) {
    const { data, error } = await nexusClient.from('inventaire_comptages').select('produit_id, quantite').eq('quart_id', quartId).eq('type_comptage', phase).eq('source', 'simulation');
    if (error) { console.error('Chargement comptages simulation:', error); return {}; }
    const map = {};
    (data || []).forEach(r => { map[r.produit_id] = r.quantite; });
    return map;
  }
  // Délègue entièrement l'agrégation à NexusInventaireMoteur.moyenneSyntheseAdoption
  // (18/08/2026, Sprint 8, Article 11) — cette fonction ne fait plus que
  // charger les lignes brutes ; le calcul de moyennes vivait auparavant ici
  // même, en double avec la logique équivalente ailleurs. `nexus_taps_total`/
  // `nexus_interruptions_total`/`ouvert_le`/`cloture_le` sont chargés en plus
  // des colonnes déjà utilisées pour que le moteur puisse aussi dériver un
  // temps NEXUS automatique quand une session simulation a réellement été
  // ouverte/close comme un quart normal (voir dureeSessionAutomatiqueMinutes).
  async function chargerStatsSimulation() {
    const { data, error } = await nexusClient.from('inventaire_quarts')
      .select('id, papier_produits_comptes, papier_temps_minutes, papier_corrections, nexus_temps_minutes, nexus_taps_total, nexus_interruptions_total, ouvert_le, cloture_le')
      .eq('site', siteId).eq('is_simulation', true);
    if (error) { console.error('Stats simulation:', error); return { nb: 0 }; }
    return NexusInventaireMoteur.moyenneSyntheseAdoption(data || []);
  }
  function renderCorpsSimulation() {
    if (!produitsPourSimulation.length) return '<div class="loading">Chargement des produits…</div>';
    const groupes = produitsPourSimulation.reduce((acc, p) => { const cat = p.inventaire_categories ? p.inventaire_categories.nom : 'Autres'; (acc[cat] = acc[cat] || []).push(p); return acc; }, {});
    const listeHtml = Object.entries(groupes).map(([cat, items]) => `
      <div class="cat-block"><div class="cat-head"><div class="cat-nom">${cat} (${items.length})</div></div>
        <div class="card">${items.map(p => `<div class="produit-row"><div class="produit-nom-ligne"><span class="produit-nom">${p.designation}</span></div><input type="number" inputmode="decimal" step="0.01" class="produit-input simulation-input" data-produit="${p.id}" placeholder="Compté (papier)" value="${simulationSaisie[p.id] !== undefined ? simulationSaisie[p.id] : ''}" style="width:100%;"></div>`).join('')}</div>
      </div>`).join('');
    return `
      ${listeHtml}
      <div class="section-titre" style="margin-top:0;">Comparatif Papier / NEXUS pour cette session</div>
      <div class="mouv-row">
        <input type="number" class="mouv-qte" id="simulationPapierProduits" placeholder="Produits (papier)" style="flex:1;">
        <input type="number" class="mouv-qte" id="simulationPapierTemps" placeholder="Temps papier (min)" style="flex:1;">
        <input type="number" class="mouv-qte" id="simulationPapierCorrections" placeholder="Corrections (papier)" style="flex:1;">
      </div>
      <textarea id="simulationNotes" class="mouv-justif" placeholder="Commentaires de simulation (facultatif)" style="width:100%; min-height:60px; resize:vertical;"></textarea>
      <button class="btn-primary" id="btnEnregistrerSimulation" style="margin-top:8px;">Enregistrer cette phase (simulation)</button>
    `;
  }
  async function enregistrerSimulation() {
    const btn = document.getElementById('btnEnregistrerSimulation');
    if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
    document.querySelectorAll('.simulation-input').forEach(el => { const v = el.value === '' ? undefined : parseFloat(el.value); if (v !== undefined && !isNaN(v)) simulationSaisie[el.dataset.produit] = v; });
    let nbComptes = 0;
    for (const [produitId, quantite] of Object.entries(simulationSaisie)) {
      const { error } = await nexusClient.from('inventaire_comptages').insert({ site: siteId, quart_id: simulationQuart.id, produit_id: produitId, type_comptage: simulationForm.phase, quantite, employee_id: simulationForm.employeId || null, source: 'simulation', statut: 'valide' });
      if (error) console.error('Comptage simulation:', error); else nbComptes++;
    }
    const tempsNexusMinutes = simulationChrono ? Math.round(((Date.now() - simulationChrono) / 60000) * 10) / 10 : null;
    const papierProduitsEl = document.getElementById('simulationPapierProduits');
    const papierTempsEl = document.getElementById('simulationPapierTemps');
    const papierCorrectionsEl = document.getElementById('simulationPapierCorrections');
    const notesEl = document.getElementById('simulationNotes');
    const papierProduits = papierProduitsEl && papierProduitsEl.value !== '' ? parseInt(papierProduitsEl.value) : null;
    const papierTemps = papierTempsEl && papierTempsEl.value !== '' ? parseFloat(papierTempsEl.value) : null;
    const papierCorrections = papierCorrectionsEl && papierCorrectionsEl.value !== '' ? parseInt(papierCorrectionsEl.value) : null;
    const notes = notesEl ? notesEl.value.trim() : '';
    await nexusClient.from('inventaire_quarts').update({ papier_produits_comptes: papierProduits, papier_temps_minutes: papierTemps, papier_corrections: papierCorrections, nexus_temps_minutes: tempsNexusMinutes, simulation_notes: notes || null }).eq('id', simulationQuart.id);
    await nexusClient.from('inventaire_audit_log').insert({ site: siteId, quart_id: simulationQuart.id, entite_type: 'inventaire_quarts', entite_id: simulationQuart.id, action: 'enregistrement_simulation', nouvelle_valeur: { phase: simulationForm.phase, nb_comptes: nbComptes }, acteur_id: managerCourant.id });
    document.getElementById('simulationCorps').innerHTML = `<div class="note">✓ ${nbComptes} produit${nbComptes > 1 ? 's' : ''} enregistré${nbComptes > 1 ? 's' : ''} en simulation (${simulationForm.phase}). Temps NEXUS mesuré : ${tempsNexusMinutes !== null ? tempsNexusMinutes + ' min' : '—'}.</div>`;
    simulationQuart = null; simulationSaisie = {}; simulationChrono = null;
    statsSimulation = await chargerStatsSimulation();
    const zone = document.getElementById('simulationStatsZone');
    if (zone) zone.innerHTML = renderStatsSimulation();
  }
  // 18/08/2026, Sprint 8 : gainMoyenMinutes vient désormais du moteur
  // (NexusInventaireMoteur.moyenneSyntheseAdoption, Article 11 — même calcul
  // que gainMinutes par quart) ; deux lignes ajoutées pour les gestes/
  // interruptions automatiques (INV2-19), affichées seulement si au moins
  // une session en a mesuré (dégradation gracieuse — pas de "0" trompeur sur
  // des sessions simulation qui n'ont jamais été ouvertes/closes comme un
  // vrai quart).
  function renderStatsSimulation() {
    if (!statsSimulation || statsSimulation.nb === 0) return `<div class="empty">Aucune session de simulation enregistrée pour l'instant.</div>`;
    const s = statsSimulation;
    return `
      <div class="card" style="padding:4px 14px;">
        <div class="stat-row"><span class="stat-label">Sessions de simulation</span><span class="stat-value">${s.nb}</span></div>
        <div class="stat-row"><span class="stat-label">Temps moyen papier</span><span class="stat-value">${s.tempsMoyenPapier != null ? s.tempsMoyenPapier + ' min' : '—'}</span></div>
        <div class="stat-row"><span class="stat-label">Temps moyen NEXUS</span><span class="stat-value cyan">${s.tempsMoyenNexus != null ? s.tempsMoyenNexus + ' min' : '—'}</span></div>
        <div class="stat-row"><span class="stat-label">Corrections papier (moy.)</span><span class="stat-value">${s.correctionsMoyennes != null ? s.correctionsMoyennes : '—'}</span></div>
        ${s.tapsMoyens != null ? `<div class="stat-row"><span class="stat-label">Gestes NEXUS (moy., automatique)</span><span class="stat-value cyan">${s.tapsMoyens}</span></div>` : ''}
        ${s.interruptionsMoyennes != null ? `<div class="stat-row"><span class="stat-label">Interruptions/reprises (moy., automatique)</span><span class="stat-value">${s.interruptionsMoyennes}</span></div>` : ''}
        ${s.gainMoyenMinutes !== null ? `<div class="stat-row"><span class="stat-label">Gain de temps NEXUS</span><span class="stat-value ${s.gainMoyenMinutes >= 0 ? 'cyan' : 'amber'}">${s.gainMoyenMinutes >= 0 ? '+' : ''}${s.gainMoyenMinutes} min</span></div>` : ''}
        <div class="stat-row"><span class="stat-label">Comparatifs renseignés</span><span class="stat-value">${s.nbAvecComparatif}/${s.nb}</span></div>
      </div>
