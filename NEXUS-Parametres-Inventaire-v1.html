  // "Tester ma configuration" (21/08/2026) — verdict de cohérence RÉEL,
  // calculé par NexusInventaireMoteur.evaluerConfigurationInventaire sur les
  // données déjà chargées (Article 11 : rien recalculé ici, uniquement du
  // rendu). Ce n'est PAS une simulation complète d'un Q1/Q2 en base (ça
  // resterait un chantier séparé) — honnêteté du champ couvert plutôt que
  // de faire croire à une vérification plus large qu'elle ne l'est.
  function renderVerdictConfiguration() {
    const M = typeof NexusInventaireMoteur !== 'undefined' ? NexusInventaireMoteur : null;
    if (!M) return '';
    const { problemes, verdict } = M.evaluerConfigurationInventaire({ produits: produitsInventaire, categories: categoriesSite, produitsProduction, reglesProductionMap });
    const ok = verdict === 'exploitable';
    return `
      <div class="card" style="margin-bottom:16px; padding:14px; border-color:${ok ? 'rgba(52,211,153,0.35)' : 'rgba(245,166,35,0.35)'};">
        <div style="font-size:15px; font-weight:700; color:${ok ? 'var(--green)' : 'var(--amber)'}; margin-bottom:6px;">${ok ? '✓ Configuration exploitable' : '⚠ À corriger'}</div>
        <div class="note" style="margin-bottom:${problemes.length ? '10px' : '0'};">Vérifications automatiques sur les produits, catégories et règles de production déjà enregistrés — pas encore une simulation complète d'un quart en base.</div>
        ${problemes.map(p => `<div class="stat-row"><span class="stat-label" style="color:${p.gravite === 'a_corriger' ? 'var(--amber)' : 'var(--text-mid)'};">${p.gravite === 'a_corriger' ? '⚠️' : 'ℹ️'} ${p.message}</span></div>`).join('')}
      </div>
    `;
  }
  function renderOngletSimulation() {
    const optionsEmployes = employesSite.map(e => `<option value="${e.id}" ${e.id === simulationForm.employeId ? 'selected' : ''}>${e.nom}</option>`).join('');
    return `
      <a href="#" class="retour-accueil" data-retour-accueil>← Accueil</a>
      <div class="question-titre">Ma configuration est-elle prête à passer en production ?</div>
      <div class="ventes-desc" style="margin:6px 2px 14px;">NEXUS vérifie ici les incohérences de configuration avant déploiement — sans modifier aucun stock réel.</div>

      ${renderVerdictConfiguration()}

      <div class="categorie-row" data-toggle-comparaison-papier style="background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:${comparaisonPapierOuverte ? '0' : '16px'};">
        <div>
          <div class="categorie-nom">📊 Comparaison avec la feuille papier</div>
          <div class="categorie-count">Optionnel — utile en phase pilote, pas la référence à long terme</div>
        </div>
        <div class="categorie-etat a-faire">${comparaisonPapierOuverte ? '▾' : '▸'}</div>
      </div>
      ${comparaisonPapierOuverte ? `
      <div class="card" style="margin-bottom:10px; padding:14px; border-radius:0 0 12px 12px; border-top:none;">
        <div class="ventes-desc" style="margin-bottom:4px; color:var(--amber); font-weight:600;">Mode Simulation — cet inventaire sert à tester NEXUS. La feuille papier reste la référence officielle.</div>
        <div class="ventes-desc" style="margin-bottom:12px;">Saisissez après coup ce qu'un employé a compté sur la feuille papier. Rien ici ne modifie les stocks officiels ni ne génère d'évaluation employé.</div>
        <div class="quart-select-row">
          <input type="date" id="simulationDate" class="date-input" value="${simulationForm.date || dateISO()}">
          <div class="quart-pill ${simulationForm.quart === 'matin' ? 'active' : ''}" data-simulation-quart="matin">Matin</div>
          <div class="quart-pill ${simulationForm.quart === 'soir' ? 'active' : ''}" data-simulation-quart="soir">Soir</div>
        </div>
        <select class="mouv-select" id="simulationEmploye" style="width:100%; margin-bottom:8px;">
          <option value="">Employé représenté…</option>${optionsEmployes}
        </select>
        <select class="mouv-select" id="simulationPhase" style="width:100%; margin-bottom:8px;">
          <option value="ouverture" ${simulationForm.phase === 'ouverture' ? 'selected' : ''}>Comptage d'ouverture</option>
          <option value="cloture" ${simulationForm.phase === 'cloture' ? 'selected' : ''}>Comptage de clôture</option>
        </select>
        <button class="btn-ghost" id="btnChargerSimulation" style="margin-top:0;">Charger / créer cette session de simulation</button>
        <div id="simulationCorps" style="margin-top:10px;">${simulationQuart ? renderCorpsSimulation() : ''}</div>
        <div class="section-titre" style="margin-top:18px;">Tableau de validation de la simulation</div>
        <div id="simulationStatsZone">${statsSimulation ? renderStatsSimulation() : '<div class="loading">Chargement…</div>'}</div>
      </div>
      ` : ''}
    `;
  }

  // ==============================================================
  // NAVIGATION PAR ONGLETS + RENDU GÉNÉRAL
  // ==============================================================
  // ==============================================================
  // ONGLET RÉGLAGES AVANCÉS (21/08/2026, réorganisation UX) — fusionne
  // Alertes + Traçabilité, chacune pliée par défaut (avanceSectionOuverte).
  // Article 11 : aucune des deux fonctions de rendu d'origine
  // (renderOngletAlertes/renderOngletTracabilite) n'est dupliquée, juste
  // encapsulée dans un accordéon commun.
  // ==============================================================
  function renderOngletAvance() {
    const sections = [
      { id: 'alertes', label: '🚨 Alertes', sousTitre: 'Seuils d\'écart, catégories sensibles, comptage à l\'aveugle', rendu: renderOngletAlertes },
      { id: 'tracabilite', label: '🔄 Traçabilité', sousTitre: 'Lots, retours fournisseurs, échéances', rendu: renderOngletTracabilite },
    ];
    return `
      <a href="#" class="retour-accueil" data-retour-accueil>← Accueil</a>
      <div class="question-titre">Quels réglages rares dois-je personnaliser ?</div>
      <div class="ventes-desc" style="margin:6px 2px 14px;">Ces réglages se consultent rarement — repliés par défaut.</div>
      ${sections.map(s => {
        const ouvert = avanceSectionOuverte === s.id;
        return `
        <div class="card" style="margin-bottom:10px; padding:0; overflow:hidden;">
          <div class="categorie-row" data-toggle-avance="${s.id}">
            <div>
              <div class="categorie-nom">${s.label}</div>
              <div class="categorie-count">${s.sousTitre}</div>
            </div>
            <div class="categorie-etat a-faire">${ouvert ? '▾' : '▸'}</div>
          </div>
          ${ouvert ? `<div style="padding:0 14px 14px;">${s.rendu()}</div>` : ''}
        </div>
      `; }).join('')}
    `;
  }

  // ==============================================================
  // ÉCRAN D'ACCUEIL "Configurer mon inventaire" (21/08/2026, cahier UX de
  // Frédéric : "Afficher immédiatement un état de configuration
  // synthétique... Le but est de montrer au manager qu'il configure un
  // système cohérent, pas une accumulation de formulaires."). Remplace la
  // barre d'onglets horizontale comme point d'entrée principal — cartes
  // verticales, pas de défilement à deviner (INV-UX-01/02). Les stats sont
  // calculées ici sur les données déjà chargées, jamais un nombre inventé
  // (Article 5) ; le détail du calcul du verdict vit dans
  // NexusInventaireMoteur.evaluerConfigurationInventaire (Article 11, même
  // fonction que l'onglet "Tester ma configuration").
  // ==============================================================
  const CARTES_ACCUEIL = [
    { onglet: 'produits', icone: '📦', titre: 'Produits', sous: 'Choisir ce que la station veut suivre' },
    { onglet: 'frequence', icone: '🗓️', titre: 'Fréquence', sous: 'Décider quand chaque famille doit être comptée' },
    { onglet: 'parcours', icone: '📍', titre: 'Parcours', sous: 'Organiser le déplacement terrain' },
    { onglet: 'regles', icone: '⚙️', titre: 'Règles', sous: 'Définir comment compter par catégorie' },
    { onglet: 'production', icone: '🥐', titre: 'Production', sous: 'Gérer les produits préparés et mouvements' },
    { onglet: 'missions', icone: '🎯', titre: 'Missions de contrôle', sous: 'Qui compte quoi, à quel moment du quart' },
  ];
  // Seuil d'exceptions à partir duquel une catégorie est signalée comme "à
  // optimiser" (21/08/2026, retour de Frédéric) — voir le commentaire de
  // NexusInventaireMoteur.identifierCategoriesAOptimiser pour la justification.
  const SEUIL_EXCEPTIONS_A_OPTIMISER = 3;
  // Aperçu "Prochain inventaire" (21/08/2026) — chargés après coup (pas dans
  // le Promise.all principal, voir bootstrap) pour ne jamais courir avec le
  // chargement de parametresInventaire dont ils dépendent (socle/surprises
  // personnalisés). null = pas encore calculé ou échec de calcul — la ligne
  // correspondante reste alors absente de l'accueil (Article 5 : jamais un
  // "0 produit"/"0 min" qui laisserait croire à un résultat réel).
  let apercuProchainInventaireNb = null;
  let historiqueDureeQuarts = [];
  function renderOngletAccueil() {
    const M = typeof NexusInventaireMoteur !== 'undefined' ? NexusInventaireMoteur : null;
    const actifs = produitsInventaire.filter(p => p.actif);
    const nbCategoriesConfigurees = categoriesSite.filter(c => produitsCategorie(c.id).length > 0).length;
    const nbExceptions = actifs.filter(p => !!reglesProduitMap[p.id]).length;
    const verdict = M ? M.evaluerConfigurationInventaire({ produits: produitsInventaire, categories: categoriesSite, produitsProduction, reglesProductionMap }) : null;
    const nbACorriger = verdict ? verdict.problemes.filter(p => p.gravite === 'a_corriger').length : 0;
    const categoriesAOptimiser = M ? M.identifierCategoriesAOptimiser(categoriesSite, produitsInventaire, reglesProduitMap, SEUIL_EXCEPTIONS_A_OPTIMISER) : [];
    const totalExceptionsAOptimiser = categoriesAOptimiser.reduce((s, c) => s + c.exceptions, 0);
    const estimation = (M && apercuProchainInventaireNb != null) ? M.estimerTempsProchainInventaire(historiqueDureeQuarts, apercuProchainInventaireNb) : null;

    let etatLabel, etatClasse;
    if (nbACorriger > 0) { etatLabel = `⚠ ${nbACorriger} à corriger`; etatClasse = 'amber'; }
    else if (categoriesAOptimiser.length > 0) { etatLabel = '✓ Opérationnelle · à optimiser'; etatClasse = 'amber'; }
    else { etatLabel = '✓ Opérationnelle'; etatClasse = 'green'; }

    return `
      <div class="question-titre">Configurer mon inventaire</div>
      <div class="ventes-desc" style="margin:6px 2px 16px;">NEXUS vous aide à définir quoi compter, quand, où et comment.</div>

      <div class="card" style="margin-bottom:14px; padding:4px 14px;">
        <div class="stat-row"><span class="stat-label">Produits suivis</span><span class="stat-value">${actifs.length}</span></div>
        <div class="stat-row"><span class="stat-label">Catégories configurées</span><span class="stat-value">${nbCategoriesConfigurees}</span></div>
        <div class="stat-row"><span class="stat-label">Exceptions${categoriesAOptimiser.length > 0 ? ' à simplifier' : ''}</span><span class="stat-value">${nbExceptions}</span></div>
        ${apercuProchainInventaireNb != null ? `<div class="stat-row"><span class="stat-label">Prochain inventaire (aperçu Matin)</span><span class="stat-value">${apercuProchainInventaireNb} produit${apercuProchainInventaireNb > 1 ? 's' : ''}${estimation ? ' · ~' + estimation.minutesEstimees + ' min' : ''}</span></div>` : ''}
        <div class="stat-row"><span class="stat-label">Configuration</span><span class="stat-value ${etatClasse}">${etatLabel}</span></div>
      </div>

      <div class="card" style="margin-bottom:14px; padding:12px 14px;">
        <div style="font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-mid); margin-bottom:8px;">🧩 Réglages avancés</div>
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
          <a href="#" data-carte-accueil-avance="alertes" style="font-size:12.5px; color:var(--cyan); text-decoration:none; font-weight:600;">🚨 Alertes</a>
          <a href="#" data-carte-accueil-avance="tracabilite" style="font-size:12.5px; color:var(--cyan); text-decoration:none; font-weight:600;">🔄 Traçabilité</a>
          <a href="#" data-carte-accueil="simulation" style="font-size:12.5px; color:var(--cyan); text-decoration:none; font-weight:600;">🧪 Tester la configuration</a>
        </div>
      </div>

      ${categoriesAOptimiser.length > 0 ? `
      <div class="card" style="margin-bottom:14px; padding:14px; border-color:rgba(245,166,35,0.3);">
        <div style="font-family:var(--mono); font-size:11px; font-weight:700; color:var(--amber); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;">💡 Suggestion NEXUS</div>
        <div class="ventes-desc" style="margin-bottom:8px;">${totalExceptionsAOptimiser} produit${totalExceptionsAOptimiser > 1 ? 's' : ''} ont des règles individuelles dans ${categoriesAOptimiser.length} catégorie${categoriesAOptimiser.length > 1 ? 's' : ''} sans règle commune : ${categoriesAOptimiser.slice(0, 3).map(c => `${c.nom} (${c.exceptions})`).join(', ')}${categoriesAOptimiser.length > 3 ? '…' : ''}.</div>
        <div class="ventes-desc" style="margin-bottom:10px;">Créer une règle commune par catégorie pourrait réduire fortement le paramétrage à maintenir.</div>
        <button class="btn-ghost" style="margin:0;" data-carte-accueil="regles">Configurer les règles →</button>
      </div>
      ` : ''}

      ${CARTES_ACCUEIL.map(c => `
        <div class="card" style="margin-bottom:10px; padding:14px; cursor:pointer; display:flex; align-items:center; gap:12px;" data-carte-accueil="${c.onglet}">
          <div style="font-size:22px;">${c.icone}</div>
          <div style="flex:1;">
            <div style="font-size:14px; font-weight:600;">${c.titre}</div>
            <div class="categorie-count" style="margin-top:2px;">${c.sous}</div>
          </div>
          <div style="color:var(--text-dim);">→</div>
        </div>
      `).join('')}
    `;
  }

  const ONGLETS = [
    { value: 'accueil', label: '🏠 Accueil' },
    { value: 'produits', label: '📦 Produits' },
    { value: 'frequence', label: '🗓️ Fréquence' },
    { value: 'parcours', label: '📍 Parcours' },
    { value: 'regles', label: '⚙️ Règles' },
    { value: 'production', label: '🥐 Production' },
    { value: 'missions', label: '🎯 Missions de contrôle' },
    { value: 'simulation', label: '🧪 Tester ma config.' },
    { value: 'avance', label: '🧩 Réglages avancés' },
  ];
  // Retour de Frédéric (21/08/2026) : "le bandeau d'onglets du haut est
  // encore scrollable horizontalement... je le réduirais à Accueil +
  // éventuellement Avancé." ONGLETS (ci-dessus) reste la liste COMPLÈTE —
  // utilisée par render()/wire() pour le dispatch et par les tests pour
  // vérifier la taxonomie — mais seule cette sous-liste s'affiche dans la
  // barre : les 5 autres onglets ne sont plus atteignables QUE depuis les
  // cartes de l'accueil et les liens "← Accueil"/"Réglages avancés", jamais
  // en scrollant une rangée de pastilles.
  const ONGLETS_BARRE = ['accueil', 'avance'];

  async function ouvrirOngletSimulationSiBesoin() {
    if (!sectionSimulationChargee) {
      sectionSimulationChargee = true;
      if (!simulationForm.date) simulationForm.date = dateISO();
      statsSimulation = await chargerStatsSimulation();
    }
  }

  function renderOnglets() {
    const visibles = ONGLETS.filter(o => ONGLETS_BARRE.includes(o.value));
    document.getElementById('ongletRow').innerHTML = visibles.map(o => `<div class="onglet ${ongletActif === o.value ? 'active' : ''}" data-onglet="${o.value}">${o.label}</div>`).join('');
    document.querySelectorAll('[data-onglet]').forEach(el => el.addEventListener('click', async () => {
      ongletActif = el.dataset.onglet;
      if (ongletActif === 'simulation') await ouvrirOngletSimulationSiBesoin();
      render();
    }));
  }

  function render() {
    renderOnglets();
    const content = document.getElementById('content');
    if (ongletActif === 'accueil') content.innerHTML = renderOngletAccueil();
    else if (ongletActif === 'produits') content.innerHTML = renderOngletProduits();
    else if (ongletActif === 'frequence') content.innerHTML = renderOngletFrequence();
    else if (ongletActif === 'parcours') content.innerHTML = renderOngletParcours();
    else if (ongletActif === 'regles') content.innerHTML = renderOngletRegles();
    else if (ongletActif === 'production') content.innerHTML = renderOngletProduction();
    else if (ongletActif === 'missions') content.innerHTML = renderOngletMissions();
    else if (ongletActif === 'simulation') content.innerHTML = renderOngletSimulation();
    else if (ongletActif === 'avance') content.innerHTML = renderOngletAvance();
    wire();
  }

  function wire() {
    // --- Accueil / navigation générale (21/08/2026, réorganisation UX) ---
    document.querySelectorAll('[data-carte-accueil]').forEach(el => el.addEventListener('click', async (ev) => {
      if (el.tagName === 'A') ev.preventDefault();
      ongletActif = el.dataset.carteAccueil;
      if (ongletActif === 'simulation') await ouvrirOngletSimulationSiBesoin();
      render();
    }));
    // Liens directs vers une section précise de "Réglages avancés" depuis la
    // carte compacte de l'accueil (21/08/2026, retour de Frédéric — carte
    // "Alertes · Traçabilité · Tester la configuration").
    document.querySelectorAll('[data-carte-accueil-avance]').forEach(el => el.addEventListener('click', (ev) => {
      ev.preventDefault();
      ongletActif = 'avance';
      avanceSectionOuverte = el.dataset.carteAccueilAvance;
      render();
    }));
    document.querySelectorAll('[data-retour-accueil]').forEach(el => el.addEventListener('click', (ev) => {
      ev.preventDefault();
      ongletActif = 'accueil';
      render();
    }));
    document.querySelectorAll('[data-toggle-avance]').forEach(el => el.addEventListener('click', () => {
      avanceSectionOuverte = avanceSectionOuverte === el.dataset.toggleAvance ? null : el.dataset.toggleAvance;
      render();
    }));
    const toggleComparaisonPapier = document.querySelector('[data-toggle-comparaison-papier]');
    if (toggleComparaisonPapier) toggleComparaisonPapier.addEventListener('click', () => { comparaisonPapierOuverte = !comparaisonPapierOuverte; render(); });
    const toggleProductionAvance = document.querySelector('[data-toggle-production-avance]');
    if (toggleProductionAvance) toggleProductionAvance.addEventListener('click', () => { productionAvanceOuvert = !productionAvanceOuvert; render(); });
    const selNiveauSurveillance = document.getElementById('selNiveauSurveillance');
    if (selNiveauSurveillance) selNiveauSurveillance.addEventListener('change', () => appliquerNiveauSurveillance(selNiveauSurveillance.value));

    // --- Produits ---
    const btnToggleAjout = document.getElementById('btnToggleAjoutProduit');
    if (btnToggleAjout) btnToggleAjout.addEventListener('click', () => {
      formAjoutOuvert = !formAjoutOuvert;
      render();
      if (formAjoutOuvert) refocusRechercheCatalogue();
    });
    const inputRechercheCatalogue = document.getElementById('rechercheCatalogue');
    if (inputRechercheCatalogue) {
      inputRechercheCatalogue.addEventListener('input', () => { rechercheCatalogueTexte = inputRechercheCatalogue.value; rechercherCatalogue(); });
    }
    document.querySelectorAll('[data-choisir-catalogue]').forEach(el => el.addEventListener('click', () => {
      produitCatalogueChoisi = { article: el.dataset.choisirCatalogue, code_barres: el.dataset.codeBarres || null, manuel: false };
      render();
    }));
    document.querySelectorAll('[data-choisir-manuel]').forEach(el => el.addEventListener('click', () => {
      produitCatalogueChoisi = { article: el.dataset.choisirManuel, code_barres: null, manuel: true };
      render();
    }));
    const selAjoutCategorie = document.getElementById('ajoutCategorie');
    if (selAjoutCategorie) selAjoutCategorie.addEventListener('change', () => { ajoutForm.categorieId = selAjoutCategorie.value; });
    const selAjoutZone = document.getElementById('ajoutZone');
    if (selAjoutZone) selAjoutZone.addEventListener('change', () => { ajoutForm.zoneId = selAjoutZone.value; });
    const chkAjoutSensible = document.getElementById('ajoutSensible');
    if (chkAjoutSensible) chkAjoutSensible.addEventListener('change', () => { ajoutForm.sensible = chkAjoutSensible.checked; });
    const chkAjoutDoubleLieu = document.getElementById('ajoutDoubleLieu');
    if (chkAjoutDoubleLieu) chkAjoutDoubleLieu.addEventListener('change', () => { ajoutForm.doubleLieu = chkAjoutDoubleLieu.checked; });
    const selAjoutDupliquer = document.getElementById('ajoutDupliquer');
    if (selAjoutDupliquer) selAjoutDupliquer.addEventListener('change', () => {
      ajoutForm.dupliquerDepuisId = selAjoutDupliquer.value;
      const source = produitsInventaire.find(p => p.id === ajoutForm.dupliquerDepuisId);
      if (source) { ajoutForm.categorieId = source.categorie_id; ajoutForm.zoneId = source.zone_id; ajoutForm.sensible = source.sensible; ajoutForm.doubleLieu = !!source.comptage_deux_lieux; render(); }
    });
    const btnAjouterProduit = document.getElementById('btnAjouterProduit');
    if (btnAjouterProduit) btnAjouterProduit.addEventListener('click', ajouterProduitInventaire);
    const inputRechercheProduits = document.getElementById('rechercheProduits');
    if (inputRechercheProduits) {
      inputRechercheProduits.addEventListener('input', () => {
        rechercheProduitsTexte = inputRechercheProduits.value;
        render();
        const el = document.getElementById('rechercheProduits');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    document.querySelectorAll('[data-produit-ligne]').forEach(el => el.addEventListener('click', (e) => {
      if (e.target.closest('.toggle-switch') || e.target.closest('.etoile-sensible')) return;
      const id = el.dataset.produitLigne;
      ligneProduitOuverte = ligneProduitOuverte === id ? null : id;
      dupliquerVersOuvertPour = null;

    if (btnChargerSimulation) btnChargerSimulation.addEventListener('click', async () => {
      simulationForm.employeId = document.getElementById('simulationEmploye').value;
      simulationForm.phase = document.getElementById('simulationPhase').value;
      const corpsEl = document.getElementById('simulationCorps');
      corpsEl.innerHTML = '<div class="loading">Chargement…</div>';
      simulationQuart = await chargerOuCreerQuartSimulation();
      if (!simulationQuart) { corpsEl.innerHTML = '<div class="empty">Erreur — réessayez.</div>'; return; }
      if (!produitsPourSimulation.length) produitsPourSimulation = await chargerTousProduitsActifsSite(siteId);
      simulationSaisie = await chargerComptagesSimulation(simulationQuart.id, simulationForm.phase);
      simulationChrono = Date.now();
      corpsEl.innerHTML = renderCorpsSimulation();
      const btnEnregistrer = document.getElementById('btnEnregistrerSimulation');
      if (btnEnregistrer) btnEnregistrer.addEventListener('click', enregistrerSimulation);
    });
  }

  // ==============================================================
  // Aperçu "Prochain inventaire" (21/08/2026, retour de Frédéric sur
  // l'accueil — "c'est ce qui permettra au manager de voir immédiatement
  // l'impact réel de sa configuration"). Réutilise EXACTEMENT le moteur de
  // sélection réel (NexusInventaireMoteur.construirePlanComptage) via les
  // mêmes chargeurs que la génération d'un vrai plan
  // (NexusInventairePlanDonnees, Article 11) — jamais une deuxième version
  // approximative de cet algorithme. Lecture seule : aucun plan n'est
  // persisté, aucune surprise n'est "consommée". Estimé pour le quart Matin
  // uniquement (le plus structurant, vocabulaire déjà utilisé ailleurs dans
  // NEXUS) — affiché comme tel, jamais présenté comme "le" prochain quart
  // sans précision.
  // ==============================================================
  async function chargerApercuProchainInventaire(site) {
    if (typeof NexusInventairePlanDonnees === 'undefined' || typeof NexusInventaireMoteur === 'undefined') return null;
    try {
      const date = dateISO();
      const [ingredients, surprisesRecentes] = await Promise.all([
        NexusInventairePlanDonnees.chargerIngredientsSelection(nexusClient, site, date),
        NexusInventairePlanDonnees.chargerSurprisesRecentes(nexusClient, site, date),
      ]);
      const socle = parametresInventaire.planSocleCible || NexusInventairePlanDonnees.SOCLE_PAR_DEFAUT;
      const surprises = parametresInventaire.planSurprisesCible || NexusInventairePlanDonnees.SURPRISES_PAR_DEFAUT;
      const resultat = NexusInventaireMoteur.construirePlanComptage({
        produits: ingredients.produits, reglesParProduit: ingredients.reglesParProduit,
        dernierControleParProduit: ingredients.dernierControleParProduit,
        produitsAvecAnomalieRecente: ingredients.produitsAvecAnomalieRecente,
        anomaliesDetailParProduit: ingredients.anomaliesDetailParProduit,
        quart: 'matin', dateISO: date, socleCible: socle, surprisesCible: surprises,
        seed: `${site}|${date}|apercu-accueil`, surprisesRecentesParProduit: surprisesRecentes,
      });
      return resultat.items.length;
    } catch (e) {
      console.error('Aperçu prochain inventaire:', e);
      return null;
    }
  }

  // Historique réel des quarts déjà clôturés (pas de simulation) — matière
  // première de NexusInventaireMoteur.estimerTempsProchainInventaire. Le
  // nombre de produits réellement comptés vient de inventaire_comptages
  // (ce qui a VRAIMENT été fait), pas de la taille du plan généré (ce qui
  // était prévu) — plus honnête si l'employé n'a pas tout compté.
  async function chargerHistoriqueDureeQuarts(site) {
    const { data: quarts, error } = await nexusClient.from('inventaire_quarts')
      .select('id, ouvert_le, cloture_le')
      .eq('site', site).eq('statut', 'cloture')
      .or('is_simulation.is.null,is_simulation.eq.false')
      .order('cloture_le', { ascending: false }).limit(20);
    if (error) { console.error('Historique durée quarts:', error); return []; }
    const ids = (quarts || []).map(q => q.id);
    if (!ids.length) return [];
    const { data: comptages, error: e2 } = await nexusClient.from('inventaire_comptages')
      .select('quart_id, produit_id').in('quart_id', ids).eq('type_comptage', 'ouverture');
    if (e2) { console.error('Comptages historique quarts:', e2); return []; }
    const parQuart = {};
    (comptages || []).forEach(c => { (parQuart[c.quart_id] = parQuart[c.quart_id] || new Set()).add(c.produit_id); });
    return quarts.map(q => ({ ouvertLe: q.ouvert_le, clotureLe: q.cloture_le, nbProduitsComptes: parQuart[q.id] ? parQuart[q.id].size : 0 }));
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    managerCourant = employee;
    siteId = employee.site_id;
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-Parametres-Inventaire-v1.html', siteId))) return;
    document.getElementById('titre').textContent = 'Paramètres Inventaire';

    [produitsInventaire, zonesSite, categoriesSite, employesSite, parametresInventaire, reglesProduitMap, modesAveugleActifs, jaugeageActif, produitsProduction, reglesProductionMap, calendrierSite, valeursSpecialesProduction, seuilsEcartParCategorie, missionRules] = await Promise.all([
      chargerProduitsInventaire(siteId), chargerZonesSite(siteId), chargerCategoriesSite(siteId), chargerEmployesSite(siteId),
      chargerParametresInventaire(siteId), chargerReglesProduit(siteId), chargerModesAveugleActifs(siteId), chargerModeJaugeageActif(siteId),
      chargerProduitsProduction(siteId), chargerReglesProduction(siteId), chargerCalendrierSite(siteId), chargerValeursSpecialesProduction(siteId),
      chargerSeuilsEcartCategorie(siteId), chargerMissionRulesEcran(siteId),
    ]);
    render();

    // Aperçu "Prochain inventaire" (21/08/2026) — chargé APRÈS le render()
    // initial, jamais dans le même Promise.all : dépend de
    // parametresInventaire déjà résolu (socle/surprises personnalisés), une
    // course avec son propre chargement donnerait un aperçu construit sur
    // les valeurs par défaut au lieu des vraies valeurs du site. L'accueil
    // s'affiche donc d'abord sans cette ligne, puis se complète (même motif
    // que sectionSimulationChargee).
    const [nbApercu, historique] = await Promise.all([
      chargerApercuProchainInventaire(siteId),
      chargerHistoriqueDureeQuarts(siteId),
    ]);
    apercuProchainInventaireNb = nbApercu;
    historiqueDureeQuarts = historique;
    if (ongletActif === 'accueil') render();
  });
</script>
