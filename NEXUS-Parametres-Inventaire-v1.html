<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Paramètres Inventaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="nexus-build.js"></script>

<script src="nexus-header-nav.js?v=20260902-2341"></script>
<script src="nexus-forfait.js?v=20260902-2341"></script>
<script src="nexus-desktop.js?v=20260902-2341"></script>
<script src="nexus-inventaire-moteur.js?v=20260902-2341"></script>
<script src="nexus-inventaire-plan-donnees.js?v=20260902-2341"></script>
<script src="nexus-inventaire-production-donnees.js?v=20260902-2341"></script>
<script src="nexus-inventaire-mission-rules-donnees.js?v=20260902-2341"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
  .nexus-patience{padding:14px 4px; text-align:center; color:var(--cyan); font-size:12.5px; font-weight:600;}
  .patience-dots span{display:inline-block; opacity:0.2; animation:patience-blink 1.2s infinite;}
  .patience-dots span:nth-child(2){animation-delay:0.2s;}
  .patience-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes patience-blink{0%,80%,100%{opacity:0.2;} 40%{opacity:1;}}
  .empty{text-align:center; padding:20px; color:var(--text-dim); font-size:12.5px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; margin-bottom:10px;}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-family:var(--sans);}
  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:4px 14px;}
  .note{font-size:12px; color:var(--text-mid); line-height:1.5; margin-bottom:14px;}
  .ventes-desc{font-size:12px; color:var(--text-mid); line-height:1.5; margin-bottom:12px;}

  .onglet-row{display:flex; gap:6px; overflow-x:auto; padding:14px 20px 4px; scrollbar-width:none;}
  .onglet-row::-webkit-scrollbar{display:none;}
  .onglet{flex:0 0 auto; padding:9px 13px; border-radius:20px; font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.02em; color:var(--text-dim); background:var(--panel-raised); border:1px solid var(--hairline); cursor:pointer; white-space:nowrap;}
  .onglet.active{color:var(--cyan); border-color:rgba(79,195,217,0.4); background:rgba(79,195,217,0.1);}

  /* Réorganisation UX (21/08/2026) : lien de retour vers l'écran d'accueil,
     présent en haut de chaque onglet secondaire — remplace le besoin de
     comprendre que la barre d'onglets défile horizontalement. */
  .retour-accueil{display:inline-block; font-family:var(--mono); font-size:11px; font-weight:600; color:var(--cyan); text-decoration:none; margin-bottom:12px;}

  .section-titre{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-mid); margin:20px 0 10px;}
  .section-titre:first-child{margin-top:0;}
  .question-titre{font-family:var(--sans); font-size:18px; font-weight:700; line-height:1.3; color:var(--text); margin:4px 0 14px;}
  .question-titre:first-child{margin-top:0;}
  .section-titre-action-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 10px;}
  .section-titre-action-row .section-titre{margin:0;}
  .btn-tout-valider{font-family:var(--sans); font-size:11px; font-weight:600; padding:6px 12px; border-radius:20px; border:1px solid rgba(79,195,217,0.4); background:rgba(79,195,217,0.08); color:var(--cyan); cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .btn-tout-valider:active{background:rgba(79,195,217,0.18);}

  .quart-select-row{display:flex; gap:8px; margin-bottom:6px; align-items:center;}
  .date-input{font-family:var(--mono); font-size:16px; background:var(--panel-raised); border:1px solid var(--hairline); color:var(--text); border-radius:8px; padding:8px 10px; flex:1;}
  .quart-pill{font-family:var(--mono); font-size:11.5px; font-weight:600; padding:8px 14px; border-radius:20px; border:1px solid var(--hairline); background:var(--panel); color:var(--text-mid); cursor:pointer; white-space:nowrap;}
  .quart-pill.active{background:rgba(79,195,217,0.15); border-color:rgba(79,195,217,0.4); color:var(--cyan);}

  .mouv-row{display:flex; gap:8px; margin-bottom:8px;}
  .mouv-select, .mouv-qte{background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12.5px; font-family:var(--sans);}
  .mouv-select{flex:1.4; width:100%;}
  .mouv-qte{flex:1; font-family:var(--mono); text-align:right;}
  .mouv-justif{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12px; margin-bottom:8px; font-family:var(--sans);}
  .champ-recherche{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:10px 12px; color:var(--text); font-size:13px; font-family:var(--sans); margin-bottom:8px;}

  .btn-primary{width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{width:100%; padding:12px; border:1px solid var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:13px; cursor:pointer; margin-top:8px;}
  .btn-text{width:100%; padding:12px; border:none; background:none; color:var(--text-dim); font-size:12.5px; cursor:pointer; margin-top:4px;}

  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0;}
  .stat-row + .stat-row{border-top:1px solid var(--hairline);}
  .stat-label{font-size:13px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:15px; font-weight:700; color:var(--text);}
  .stat-value.amber{color:var(--amber);}
  .stat-value.green{color:var(--green);}
  .stat-value.cyan{color:var(--cyan);}
  .stat-value.red{color:var(--red);}

  .cat-block{margin-bottom:16px;}
  .cat-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;}
  .cat-nom{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}

  .produit-row{padding:12px 14px;}
  .produit-row + .produit-row{border-top:1px solid var(--hairline);}
  .produit-nom-ligne{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .produit-nom{font-size:13.5px; font-weight:600; flex:1;}
  .produit-input{flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:9px; padding:10px 12px; color:var(--text); font-family:var(--mono); font-size:16px; text-align:right;}
  .produit-input:focus{outline:none; border-color:var(--cyan);}

  .categorie-row{display:flex; justify-content:space-between; align-items:center; padding:14px; cursor:pointer;}
  .categorie-row + .categorie-row{border-top:1px solid var(--hairline);}
  .categorie-row:active{background:var(--panel-raised);}
  .categorie-nom{font-size:14px; font-weight:600;}
  .categorie-count{font-size:11.5px; color:var(--text-mid); margin-top:2px;}
  .categorie-etat{font-family:var(--mono); font-size:10px; font-weight:700; padding:4px 9px; border-radius:12px; white-space:nowrap; text-transform:uppercase;}
  .categorie-etat.a-faire{background:var(--panel-raised); color:var(--text-dim);}
  .categorie-etat.en-cours{background:rgba(79,195,217,0.12); color:var(--cyan);}

  /* Règles des produits en langage commerce (05/08/2026) */
  .preset-btn{font-family:var(--sans); font-size:11px; font-weight:600; padding:7px 10px; border-radius:20px; border:1px solid rgba(79,195,217,0.35); background:rgba(79,195,217,0.08); color:var(--cyan); cursor:pointer; margin-bottom:8px;}
  .preset-btn:active{background:rgba(79,195,217,0.2);}
  .regle-check-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-mid); margin-bottom:10px; cursor:pointer;}
  .regle-champ-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--text-mid); margin-bottom:10px;}
  .categorie-etat.inactif{background:var(--red-dim); color:var(--red);}

  .param-ligne{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .param-ligne:last-child{border-bottom:none;}
  .param-ligne label{color:var(--text-mid); flex-shrink:0;}
  .param-input{font-family:var(--mono); font-size:16px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:7px; color:var(--text); padding:6px 8px; text-align:right; max-width:150px;}
  .param-input:focus{outline:none; border-color:var(--cyan);}
  select.param-input{text-align:left; max-width:170px;}
  .param-checklist{display:flex; flex-wrap:wrap; gap:8px; padding:10px 0;}
  .param-check-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline); border-radius:20px; padding:5px 10px 5px 8px; cursor:pointer;}
  .param-check-item input{accent-color:var(--cyan);}
  .param-check-item.actif{color:var(--text); border-color:rgba(79,195,217,0.4);}
  .param-note{font-size:11px; color:var(--text-dim); padding:2px 0 10px;}
  .param-enregistre{font-family:var(--mono); font-size:10px; color:var(--green); opacity:0; transition:opacity .2s; margin-left:8px;}
  .param-enregistre.visible{opacity:1;}

  .employe-toggle-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--hairline);}
  .employe-toggle-row:last-child{border-bottom:none;}
  .employe-role{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:capitalize; margin-top:2px;}
  .toggle-switch{width:42px; height:24px; border-radius:12px; background:var(--panel-raised); border:1px solid var(--hairline); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
  .toggle-switch.on{background:rgba(79,195,217,0.3); border-color:var(--cyan);}
  .toggle-knob{width:18px; height:18px; border-radius:50%; background:var(--text-mid); position:absolute; top:2px; left:2px; transition:left .15s, background .15s;}
  .toggle-switch.on .toggle-knob{left:21px; background:var(--cyan);}

  /* Onglet Produits de l'inventaire */
  .produit-liste-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--hairline); cursor:pointer;}
  .produit-liste-row:last-child{border-bottom:none;}
  .produit-liste-row.inactif{opacity:0.45;}
  .produit-liste-nom{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:5px;}
  .produit-liste-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); margin-top:2px;}
  .etoile-sensible{cursor:pointer; color:var(--text-dim); font-size:13px;}
  .etoile-sensible.actif{color:var(--gold);}
  .produit-edit-panel{padding:12px 14px; background:var(--panel-raised); border-radius:0 0 10px 10px; margin-bottom:2px;}
  .catalogue-resultat{padding:10px 12px; border-radius:8px; background:var(--panel-raised); margin-bottom:6px; cursor:pointer; font-size:12.5px; display:flex; justify-content:space-between; align-items:center;}
  .catalogue-resultat:active{background:var(--hairline);}
  .catalogue-resultat-meta{font-family:var(--mono); font-size:10px; color:var(--text-dim);}
  .produit-choisi-badge{background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.35); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px;}
  /* Produit hors catalogue (13/08/2026, demande de Frédéric : "je ne trouve
     pas glace écaille 8 kg Crystal dans ajouter un produit") — la recherche
     ne porte que sur `products`, qui ne contient que les articles déjà
     VENDUS AU MOINS UNE FOIS (importés depuis les ventes réelles, jamais un
     catalogue fournisseur à part) : un produit tout juste reçu, jamais
     encore vendu, n'y figure donc pas encore, même sans faute de frappe.
     Le schéma prévoyait déjà cette situation (`source` accepte 'catalogue'
     OU 'interne' depuis l'origine de la table) sans qu'aucun écran ne le
     propose — ce lot active ce chemin resté mort. */
  .badge-manuel{display:inline-block; font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:2px 7px; border-radius:20px; margin-left:8px; vertical-align:middle; color:var(--amber); background:rgba(245,166,35,0.12); border:1px solid rgba(245,166,35,0.35);}
  .catalogue-manuel-suggestion{
    padding:10px 12px; border-radius:8px; background:rgba(245,166,35,0.06); border:1px dashed rgba(245,166,35,0.4);
    margin-bottom:10px; cursor:pointer; font-size:12.5px; color:var(--text);
  }
  .catalogue-manuel-suggestion:active{background:rgba(245,166,35,0.14);}
  .catalogue-manuel-note{font-size:11px; color:var(--text-dim); line-height:1.5; margin:-2px 0 10px;}

  /* Onglet Parcours d'inventaire */
  .parcours-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .parcours-item:last-child{border-bottom:none;}
  .parcours-nom{font-size:13px; font-weight:600;}
  .parcours-sub{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:2px;}
  .parcours-fleches{display:flex; gap:4px; flex-shrink:0;}
  .btn-fleche{width:30px; height:30px; border-radius:8px; border:1px solid var(--hairline); background:var(--panel-raised); color:var(--text-mid); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .btn-fleche:disabled{opacity:0.3; cursor:not-allowed;}
  .btn-fleche:active:not(:disabled){background:var(--hairline);}
  .jours-row{display:flex; gap:4px; margin-top:8px;}
  .jour-toggle{flex:1; text-align:center; padding:6px 0; border-radius:6px; font-family:var(--mono); font-size:10px; font-weight:600; border:1px solid var(--hairline); background:var(--panel-raised); color:var(--text-dim); cursor:pointer;}
  .jour-toggle.actif{background:rgba(79,195,217,0.15); border-color:rgba(79,195,217,0.4); color:var(--cyan);}

  /* Raccourci Traçabilité */
  .raccourci-card{background:linear-gradient(135deg, rgba(79,195,217,0.08), rgba(79,195,217,0.02)); border:1px solid rgba(79,195,217,0.25); border-radius:12px; padding:18px; text-align:center;}
  .raccourci-titre{font-size:15px; font-weight:700; margin-bottom:6px;}
  .raccourci-desc{font-size:12.5px; color:var(--text-mid); line-height:1.5; margin-bottom:14px;}
  .raccourci-btn{display:inline-block; font-family:var(--sans); font-size:12.5px; font-weight:700; padding:10px 18px; border-radius:20px; background:var(--cyan); color:#04141a; text-decoration:none;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-Inventaire-Manager-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Paramètres Inventaire</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="sub">Quoi compter, quand, où et comment — tout ce qui se configure une fois, jamais ce qui se traite au quotidien.</div>
  </div>
  <div class="divider"></div>
  <div class="onglet-row" id="ongletRow"></div>

  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>
  <footer>NEXUS Paramètres Inventaire v1 · Vito Sainte-Marie</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS Paramètres Inventaire (04/08/2026, demande de Frédéric) : tout
  // ce qui se règle une fois et se consulte rarement, organisé en onglets
  // pour rester trouvable à mesure que le catalogue grandit (aujourd'hui
  // 242 produits, "peut-être 700 demain") — plutôt qu'empilé sur l'écran
  // Contrôle inventaire qui doit rester centré sur "que dois-je traiter
  // maintenant ?".
  // ------------------------------------------------------------
  let managerCourant = null;
  let siteId = null; // jamais 'vito-sainte-marie' par defaut (de-Vito-isation, 11/08/2026) - toujours ecrase par employee.site_id apres nexusRequireAuth()
  // Réorganisation UX (21/08/2026, cahier développeur de Frédéric —
  // "le manager ne paramètre pas une succession de champs techniques ; il
  // répond à quelques questions métier simples") : 'accueil' devient l'écran
  // de démarrage, avec des cartes verticales vers chaque question métier
  // plutôt que la barre d'onglets horizontale comme point d'entrée.
  let ongletActif = 'accueil';
  // Onglet "Réglages avancés" (fusion Alertes + Traçabilité, 21/08/2026) :
  // aucune section ouverte par défaut — le manager ne doit voir ces réglages
  // rares qu's'il choisit explicitement de les dérouler.
  let avanceSectionOuverte = null;

  // Données partagées entre onglets
  let produitsInventaire = [];   // tous les produits (actifs et inactifs), pour l'onglet Produits
  let zonesSite = [];
  let categoriesSite = [];       // actives uniquement, pour les sélecteurs
  let employesSite = [];
  // Inventaire V2 Sprint 1 "Configuration multi-site" (29/08/2026, doctrine
  // "NEXUS Inventaire V2" de Frédéric) — configuration durable "qui compte
  // quoi, quand, avec quel repli" (table inventaire_mission_rules). Portée
  // volontairement minimale ici (lecture/édition de base) : le générateur
  // de missions qui CONSOMME ces règles (site+date+quart+employé) est
  // explicitement Sprint 2, pas ce lot.
  let missionRules = [];
  let missionRuleNouveauOuvert = false;
  const MISSION_RULE_NOUVEAU_DEFAUT = {
    nom: '', role_code: 'caissier', role_repli: '', quart: '', moment_code: 'debut',
    categorie_ids: [], mode_selection: 'complet', nombre_references: '',
    strategie_repli: 'aucune', priorite: 'normale',
  };
  let missionRuleNouveauForm = { ...MISSION_RULE_NOUVEAU_DEFAUT };
  // Rôles réels de NEXUS (Article 11 — même vocabulaire que employees.role,
  // jamais un second référentiel de rôles créé pour Inventaire).
  const ROLES_EMPLOYE_CONNUS = ['pompiste', 'caissier', 'renfort', 'manager', 'gerant', 'vacataire'];

  function dateISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  // Message d'attente réutilisable (05/08/2026, demande de Frédéric) pour

    return `<div class="nexus-patience">Patientez, NEXUS travaille pour vous<span class="patience-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
  }
  function fmtNum(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  }
  function fmtDateFr(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });

  // ==============================================================

  let rechercheProduitsTexte = '';

  async function chargerProduitsInventaire(site) {
    const { data, error } = await nexusClient.from('inventaire_zone_produit')
      .select('*, inventaire_categories(id, nom), inventaire_zones(id, code, nom)')
      .eq('site', site).order('designation');
    if (error) { console.error('Chargement produits inventaire:', error); return []; }
    return data || [];
  }
  async function chargerZonesSite(site) {
    const { data, error } = await nexusClient.from('inventaire_zones').select('*').eq('site', site).order('ordre_affichage');
    if (error) { console.error('Chargement zones:', error); return []; }
    return data || [];
  }
  // La zone détermine automatiquement qui compte le produit côté employé
  // (NEXUS-Inventaire-v1.html, zonesPourRole) : Piste → pompistes, Boutique
  // → caissier/caissière. Un manager/gérant/renfort voit les deux. Pas de
  // champ séparé "assigné à" : le rattachement se fait ici, via la Zone.
  function libelleZoneAvecRole(zone) {
    if (!zone) return '—';
    if (zone.code === 'piste') return `${zone.nom} (pompistes)`;
    if (zone.code === 'boutique') return `${zone.nom} (caissier/caissière)`;
    return zone.nom;
  }
  async function chargerCategoriesSite(site) {
    const { data, error } = await nexusClient.from('inventaire_categories').select('*').eq('site', site).eq('actif', true).order('ordre_affichage');
    if (error) { console.error('Chargement catégories:', error); return []; }
    return data || [];
  }

  // nexus-inventaire-mission-rules-donnees.js (Article 11 : ce fichier ne

  async function chargerMissionRulesEcran(site) {
    if (typeof NexusInventaireMissionRulesDonnees === 'undefined') {
      console.error('NexusInventaireMissionRulesDonnees non chargé — missions de contrôle indisponibles.');
      return [];

    return await NexusInventaireMissionRulesDonnees.chargerMissionRules(nexusClient, site);

  async function chargerSeuilsEcartCategorie(site) {
    const { parCategorie } = await NexusInventairePlanDonnees.chargerSeuilsEcart(nexusClient, site);
    return parCategorie;

  async function chargerEmployesSite(site) {
    const { data, error } = await nexusClient.from('employees').select('id, nom, role').eq('site_id', site).eq('actif', true).order('nom');
    if (error) { console.error('Chargement employés:', error); return []; }
    return (data || []).filter(e => e.role !== 'manager' && e.role !== 'gerant');
  }

  function refocusRechercheCatalogue() {
    const el = document.getElementById('rechercheCatalogue');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  async function rechercherCatalogue() {
    const terme = rechercheCatalogueTexte.trim();
    if (terme.length < 2) { resultatsCatalogue = []; render(); refocusRechercheCatalogue(); return; }
    const { data, error } = await nexusClient.from('products')
      .select('article, code_barres, categorie').eq('site', siteId).ilike('article', `%${terme}%`).limit(60);
    if (error) { console.error('Recherche catalogue produits:', error); resultatsCatalogue = []; render(); refocusRechercheCatalogue(); return; }
    const dejaSuivis = new Set(produitsInventaire.map(p => p.designation.toLowerCase()));
    const vus = new Set();
    resultatsCatalogue = (data || []).filter(r => {
      const cle = r.article.toLowerCase();
      if (dejaSuivis.has(cle) || vus.has(cle)) return false;
      vus.add(cle);
      return true;
    }).slice(0, 15);
    render();
    refocusRechercheCatalogue();
  }

  async function ajouterProduitInventaire() {
    if (!produitCatalogueChoisi) { alert('Recherchez et choisissez un produit.'); return; }
    if (!ajoutForm.categorieId || !ajoutForm.zoneId) { alert('Choisissez une catégorie et une zone.'); return; }
    const btn = document.getElementById('btnAjouterProduit');
    if (btn) { btn.disabled = true; btn.textContent = 'Ajout…'; }
    const { data, error } = await nexusClient.from('inventaire_zone_produit').insert({
      site: siteId, designation: produitCatalogueChoisi.article, code_barres: produitCatalogueChoisi.code_barres || null,
      categorie_id: ajoutForm.categorieId, zone_id: ajoutForm.zoneId, sensible: !!ajoutForm.sensible,
      comptage_deux_lieux: !!ajoutForm.doubleLieu,
      actif: true, source: produitCatalogueChoisi.manuel ? 'interne' : 'catalogue',
    }).select().single();
    if (error) {
      console.error('Ajout produit inventaire:', error);
      // Nom déjà suivi (contrainte UNIQUE site+designation) — plus probable
      // sur le chemin manuel, une saisie libre, que sur le chemin catalogue
      // (déjà filtré par `dejaSuivis` dans rechercherCatalogue()). Message
      // ciblé plutôt que le "Erreur — réessayez." générique, qui laisserait
      // croire à un problème réseau alors que le produit existe déjà.
      alert(error.code === '23505' ? 'Un produit avec exactement ce nom est déjà suivi en Inventaire.' : 'Erreur — réessayez.');
      if (btn) { btn.disabled = false; btn.textContent = 'Ajouter ce produit'; }
      return;
    }

    // Dupliquer les paramètres d'un produit existant (04/08/2026, demande
    // de Frédéric — "en 5 secondes, le produit est opérationnel") : copie
    // la règle d'inventaire (inventaire_regles_produit) du produit source,
    // si une règle existe. Catégorie/zone/sensible ont déjà été pré-remplis
    // manuellement dans le formulaire, jamais silencieusement écrasés.
    if (ajoutForm.dupliquerDepuisId) {
      await copierReglesProduit(ajoutForm.dupliquerDepuisId, data.id);
    }

    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, entite_type: 'inventaire_zone_produit', entite_id: data.id, action: 'ajout_produit_inventaire',
      nouvelle_valeur: { designation: data.designation }, acteur_id: managerCourant.id,
    });

    formAjoutOuvert = false;
    rechercheCatalogueTexte = ''; resultatsCatalogue = []; produitCatalogueChoisi = null;
    ajoutForm = { categorieId: '', zoneId: '', sensible: false, doubleLieu: false, dupliquerDepuisId: '' };
    produitsInventaire = await chargerProduitsInventaire(siteId);
    render();
  }

  async function copierReglesProduit(sourceId, cibleId) {
    const { data: regleSource, error } = await nexusClient.from('inventaire_regles_produit').select('*').eq('site', siteId).eq('produit_id', sourceId).maybeSingle();
    if (error) { console.error('Lecture règle source (duplication):', error); return; }
    if (!regleSource) return; // le produit source suit encore le profil par défaut (continu) — rien à copier
    const { profil, cycle_frequence, report_veille_autorise, duree_max_vente_jours, action_echeance, mode_agregation_ventes, validation_manager_requise, comptage_masque, seuil_minimal, controle_aleatoire, photo_obligatoire, frequence_controle, delai_max_jours_sans_controle } = regleSource;
    await nexusClient.from('inventaire_regles_produit').upsert({
      site: siteId, produit_id: cibleId, profil, cycle_frequence, report_veille_autorise, duree_max_vente_jours,
      action_echeance, mode_agregation_ventes, validation_manager_requise, comptage_masque, seuil_minimal, controle_aleatoire, photo_obligatoire,
      frequence_controle, delai_max_jours_sans_controle,
    }, { onConflict: 'site,produit_id' });
  }

  // Dupliquer vers les produits de la même catégorie (05/08/2026, demande
  // de Frédéric — "pose la question, voulez dupliquer ces réglages vers les
  // produits de la même catégorie" plutôt que de choisir un produit cible un
  // par un) : copie la règle d'inventaire et le statut "produit sensible".
  //
  // Correctif (07/08/2026, signalé par Frédéric — "ça ne duplique pas à
  // l'ensemble des produits" en essayant de mettre toute la catégorie Huiles
  // sous contrôle caissière) : la zone (piste/boutique, donc pompiste vs
  // caissière) n'était volontairement PAS dupliquée, en supposant qu'une
  // catégorie n'a jamais qu'une seule zone. C'était faux — l'exemple Gaz
  // (bouteilles piste + cartouches boutique dans la même catégorie à
  // l'époque) l'a prouvé. La zone est donc désormais recopiée comme le
  // reste : le manager qui déclenche cette action le fait sciemment,
  // produit par produit, en toute connaissance de cause.
  function autresProduitsMemeCategorie(p) {
    return produitsInventaire.filter(x => x.actif && x.id !== p.id && x.categorie_id === p.categorie_id);
  }
  async function dupliquerVersCategorie(sourceId) {
    const source = produitsInventaire.find(p => p.id === sourceId);
    if (!source) return;
    const pairs = autresProduitsMemeCategorie(source);
    if (!pairs.length) return;
    duplicationCategorieEnCours = sourceId;
    render();
    for (const cible of pairs) {
      await copierReglesProduit(sourceId, cible.id);
      await nexusClient.from('inventaire_zone_produit').update({ sensible: source.sensible, comptage_deux_lieux: source.comptage_deux_lieux, zone_id: source.zone_id }).eq('id', cible.id);
    }
    const catNom = source.inventaire_categories ? source.inventaire_categories.nom : 'cette catégorie';
    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, entite_type: 'inventaire_regles_produit', entite_id: source.id, action: 'duplication_reglages_categorie',
      nouvelle_valeur: { copie_depuis: source.designation, categorie: catNom, nb_produits: pairs.length, sensible: source.sensible, comptage_deux_lieux: source.comptage_deux_lieux, zone_id: source.zone_id }, acteur_id: managerCourant.id,
    });
    dupliquerVersOuvertPour = null;
    duplicationCategorieEnCours = null;
    reglesProduitMap = await chargerReglesProduit(siteId);
    produitsInventaire = await chargerProduitsInventaire(siteId);
    render();
  }

  async function toggleActifProduit(id, actif) {

    render();

  function renderConfirmationDupliquerCategorie(p) {
    if (duplicationCategorieEnCours === p.id) return renderMessagePatience();

      </div>
    `;

    const ordreA = a.ordre_affichage, ordreB = b.ordre_affichage;
    await Promise.all([
      nexusClient.from('inventaire_zones').update({ ordre_affichage: ordreB }).eq('id', a.id),
      nexusClient.from('inventaire_zones').update({ ordre_affichage: ordreA }).eq('id', b.id),
    ]);
    zonesSite = await chargerZonesSite(siteId);
    render();
  }
  async function deplacerCategorie(id, sens) {
    const idx = categoriesSite.findIndex(c => c.id === id);
    const cible = idx + sens;
    if (cible < 0 || cible >= categoriesSite.length) return;
    const a = categoriesSite[idx], b = categoriesSite[cible];
    const ordreA = a.ordre_affichage, ordreB = b.ordre_affichage;
    await Promise.all([
      nexusClient.from('inventaire_categories').update({ ordre_affichage: ordreB }).eq('id', a.id),
      nexusClient.from('inventaire_categories').update({ ordre_affichage: ordreA }).eq('id', b.id),

  async function toggleJourRotation(categorieId, jourIso) {
    const cat = categoriesSite.find(c => c.id === categorieId);
    if (!cat) return;
    let jours = cat.jours_rotation ? [...cat.jours_rotation] : [1, 2, 3, 4, 5, 6, 7];
    if (jours.includes(jourIso)) jours = jours.filter(j => j !== jourIso); else { jours.push(jourIso); jours.sort(); }
    // Cocher les 7 jours équivaut à "tous les jours" — on repasse alors à
    // NULL pour rester sur le comportement historique explicite plutôt que
    // de stocker un tableau complet qui dit la même chose autrement.
    const valeur = jours.length === 7 ? null : jours;
    const { error } = await nexusClient.from('inventaire_categories').update({ jours_rotation: valeur }).eq('id', categorieId);
    if (error) { console.error('Rotation catégorie:', error); alert('Erreur — réessayez.'); return; }
    cat.jours_rotation = valeur;
    render();
  }

  // ONGLET FRÉQUENCE — "Quand faut-il les compter ?" (21/08/2026,

  // ==============================================================
  // ONGLET 3 — RÈGLES DES PRODUITS (relocalisé + étendu : contrôle
  // aléatoire, photo obligatoire — 04/08/2026)
  // ==============================================================
  let reglesProduitMap = {};
  let profilProduitOuvert = null;
  let profilEnEdition = null;
  let rechercheReglesTexte = '';
  // Sprint 3 (20/08/2026, demande de Frédéric — "Paramétrage hérité : Bières
  // / Créer une exception") : ouvrir une ligne produit affiche d'abord une
  // carte d'ORIGINE (d'où vient la règle appliquée : catégorie, défaut, ou
  // exception propre), pas directement le formulaire complet.
  // profilFormulaireActif=true fait basculer vers renderFormulaireProfil
  // (formulaire existant, inchangé) — seulement quand le manager clique
  // explicitement "Créer une exception" / "Modifier cette exception".
  let profilFormulaireActif = false;
  // Sprint "Catégorie porte les règles" (20/08/2026, demande de Frédéric —
  // "règle de catégorie par défaut + exceptions produit") : mêmes variables
  // d'édition que profilProduitOuvert/profilEnEdition ci-dessus, mais pour
  // la règle de la CATÉGORIE elle-même (inventaire_categories, colonnes
  // ajoutées par la migration inventaire_categories_regles_heritees).
  let categorieReglesOuverte = null;   // id de la catégorie dont le formulaire est déplié
  let categorieRegleEnEdition = null;  // même forme que profilEnEdition, plus regle_active — jamais comptage_deux_lieux (propriété du produit, pas une règle héritable)
  // Sprint 5 (20/08/2026, demande de Frédéric — "seuils d'écart" par
  // catégorie) : categorie_id -> { quantite_alerte, valeur_alerte }. Table
  // inventaire_seuils, indépendante de regle_active (un seuil d'écart peut
  // être réglé même si la catégorie n'a pas de règle de comptage commune —
  // ce sont deux préoccupations différentes : "comment compter" vs "à
  // partir de quand s'inquiéter d'un écart").
  let seuilsEcartParCategorie = {};

  // ==============================================================
  // ONGLET PRODUCTION — quantités recommandées, calendrier, valeurs
  // spéciales (19/08/2026, tâche #518 "Paramètres manager : recommandations
  // sans développeur"). Jusqu'ici, `inventaire_production_regles` (M2) ne
  // pouvait être renseignée que par SQL direct — cet onglet est le SEUL
  // ajout : aucune logique de calcul dupliquée (le moteur de recommandation
  // reste entièrement dans nexus-inventaire-moteur.js, Article 11), cet
  // écran ne fait qu'écrire les 3 tables de configuration que ce moteur lit
  // déjà (inventaire_production_regles, inventaire_production_valeurs_speciales,
  // inventaire_calendrier_site).
  // ==============================================================
  let produitsProduction = [];
  let reglesProductionMap = {};
  let calendrierSite = [];
  let valeursSpecialesProduction = [];
  let productionRegleOuverte = null;
  let productionRegleEnEdition = null;
  let calendrierForm = { date: '', type: 'vacances', libelle: '' };
  let valeurSpecialeForm = { produitId: '', date: '', valeur: '', libelle: '' };
  // Repliés par défaut (21/08/2026, réorganisation UX — "ce que le manager
  // ne va pas manipuler tout le temps") : le calendrier des jours spéciaux
  // et les valeurs spéciales par produit se modifient quelques fois par an,
  // contrairement aux quantités conseillées par produit qui restent visibles.
  let productionAvanceOuvert = false;

  async function chargerReglesProduit(site) {
    const { data, error } = await nexusClient.from('inventaire_regles_produit').select('*').eq('site', site);
    if (error) { console.error('Chargement règles produit:', error); return {}; }
    const map = {};
    (data || []).forEach(r => { map[r.produit_id] = r; });
    return map;
  }
  // Langage commerce plutôt que logistique (05/08/2026, demande de
  // Frédéric — "un outil qui parle le langage du commerce, pas celui d'un
  // ERP") : le manager ne choisit plus un "profil" technique (Stock
  // continu / Cycle journalier / Lot glissant / Presse / Consommable)
  // dans une liste — il coche des réglages indépendants et compréhensibles
  // (stock remis à zéro le matin, durée de vente, retour fournisseur,
  // comptage matin/soir, réapprovisionnable, seuil d'alerte). `profil`
  // reste calculé automatiquement à partir de ces réglages : NEXUS
  // Traçabilité et le reste du code n'ont pas besoin de changer.
  function calculerProfilDepuisReglage(e) {
    // Production journalière (19/08/2026, tâche #518) : prioritaire sur les
    // autres réglages dérivés — un produit "préparation recommandée le
    // matin" (viennoiserie) ne peut pas être en même temps cycle_journalier/
    // lot_glissant/consommable, ce sont des logiques de comptage mutuellement
    // exclusives (un seul champ `profil` en base).
    if (e.production_journaliere) return 'production_journaliere';
    if (e.remise_a_zero_matin) return 'cycle_journalier';
    if (e.duree_max_vente_jours) return 'lot_glissant';
    if (e.seuil_minimal) return 'consommable';
    return 'continu';
  }
  // Préréglages (05/08/2026, exemples réels donnés par Frédéric) : pré-
  // remplissent les réglages ci-dessous, le manager peut toujours ajuster
  // avant d'enregistrer — jamais appliqués sans confirmation explicite.
  const PREREGLAGES_REGLE = {
    viennoiserie: { remise_a_zero_matin: true, duree_max_vente_jours: 1, retour_fournisseur_autorise: false, quarts_comptage: ['matin'], reapprovisionnable: true },
    presse: { remise_a_zero_matin: true, duree_max_vente_jours: 1, retour_fournisseur_autorise: true, quarts_comptage: null, reapprovisionnable: false },
    sdd: { remise_a_zero_matin: false, duree_max_vente_jours: 3, retour_fournisseur_autorise: true, quarts_comptage: null, reapprovisionnable: true },
  };
  // Sprint 3 (20/08/2026) : construit l'objet d'édition du formulaire à
  // partir de N'IMPORTE QUELLE source de règle (la ligne propre du produit,
  // la règle effective héritée de sa catégorie, ou rien du tout = valeurs
  // par défaut) — une seule fonction de construction, jamais une deuxième
  // copie de cette liste de champs (Article 11 : avant ce sprint, cette
  // logique n'existait qu'inline dans ouvrirEditionProfil).
  function construireProfilEnEdition(produitId, source) {
    const produit = produitsInventaire.find(p => p.id === produitId);
    const doubleLieuActuel = !!(produit && produit.comptage_deux_lieux);
    return source ? {
      produit_id: produitId,
      production_journaliere: source.profil === 'production_journaliere',
      remise_a_zero_matin: source.profil === 'cycle_journalier',
      duree_max_vente_jours: source.duree_max_vente_jours || null,
      retour_fournisseur_autorise: source.action_echeance === 'retour_fournisseur_obligatoire',
      quarts_comptage: source.quarts_comptage || null,
      reapprovisionnable: source.reapprovisionnable !== false,
      seuil_minimal: source.seuil_minimal || null,
      validation_manager_requise: !!source.validation_manager_requise,
      comptage_masque: !!source.comptage_masque,
      controle_aleatoire: !!source.controle_aleatoire,
      photo_obligatoire: !!source.photo_obligatoire,
      comptage_deux_lieux: doubleLieuActuel,
      frequence_controle: source.frequence_controle || 'standard',
      delai_max_jours_sans_controle: source.delai_max_jours_sans_controle != null ? source.delai_max_jours_sans_controle : null,
    } : {
      produit_id: produitId, production_journaliere: false, remise_a_zero_matin: false, duree_max_vente_jours: null, retour_fournisseur_autorise: false,
      quarts_comptage: null, reapprovisionnable: true, seuil_minimal: null,
      validation_manager_requise: false, comptage_masque: false, controle_aleatoire: false, photo_obligatoire: false,
      comptage_deux_lieux: doubleLieuActuel,
      frequence_controle: 'standard', delai_max_jours_sans_controle: null,
    };
  }

  // Ouvre/ferme la FICHE produit (carte d'origine — Sprint 3). Remplace
  // l'ancien comportement d'ouvrirEditionProfil, qui sautait directement au
  // formulaire complet : le manager voit d'abord d'où vient la règle
  // appliquée, avant de choisir de la modifier.
  function toggleFicheProduit(produitId) {
    if (profilProduitOuvert === produitId) { profilProduitOuvert = null; profilEnEdition = null; profilFormulaireActif = false; render(); return; }
    profilProduitOuvert = produitId;
    profilEnEdition = null;
    profilFormulaireActif = false;
    render();
  }

  // Bascule vers le formulaire complet (renderFormulaireProfil, inchangé).
  // `prefillDepuisCategorie` : quand le manager clique "Créer une exception"
  // sur un produit qui héritait jusque-là d'une catégorie active, le
  // formulaire démarre pré-rempli avec les valeurs héritées (point de
  // départ cohérent) plutôt que vide — il ajuste ensuite ce qui doit
  // vraiment différer, au lieu de tout retaper.
  function ouvrirFormulaireProfil(produitId, prefillDepuisCategorie) {
    profilProduitOuvert = produitId;
    const existant = reglesProduitMap[produitId];
    let source = existant || null;
    if (!source && prefillDepuisCategorie) {
      const produit = produitsInventaire.find(p => p.id === produitId);
      const cat = produit && produit.categorie_id ? categoriesSite.find(c => c.id === produit.categorie_id) : null;
      if (cat && cat.regle_active) source = cat;
    }
    profilEnEdition = construireProfilEnEdition(produitId, source);
    profilFormulaireActif = true;
    render();
  }

  // "Revenir à la règle de la catégorie" — supprime l'exception propre du
  // produit (sa ligne inventaire_regles_produit). Le produit retombe
  // immédiatement sur la cascade Sprint 1 (catégorie active, ou défaut) —
  // aucune autre écriture nécessaire, la résolution est déjà dynamique.
  async function revenirReglecategorie(produitId) {
    const produit = produitsInventaire.find(p => p.id === produitId);
    const cat = produit && produit.categorie_id ? categoriesSite.find(c => c.id === produit.categorie_id) : null;
    const destination = (cat && cat.regle_active) ? `la règle de la catégorie « ${cat.nom} »` : 'au comportement par défaut (stock continu)';
    if (!confirm(`Ce produit reviendra à ${destination}. Son exception actuelle sera supprimée. Continuer ?`)) return;
    const existant = reglesProduitMap[produitId];
    if (!existant) { profilFormulaireActif = false; render(); return; }
    const { error } = await nexusClient.from('inventaire_regles_produit').delete().eq('id', existant.id);
    if (error) { console.error('Suppression exception produit:', error); alert('Erreur — réessayez.'); return; }
    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, entite_type: 'inventaire_regles_produit', entite_id: existant.id,
      action: 'suppression_exception_produit', ancienne_valeur: existant, acteur_id: managerCourant.id,
    });
    delete reglesProduitMap[produitId];
    profilEnEdition = null;
    profilFormulaireActif = false;
    render();
  }

  // "Modifier pour toute la catégorie" (bouton de la carte d'origine,
  // Sprint 3) — ferme la fiche produit et ouvre le formulaire de catégorie
  // (ouvrirEditionRegleCategorie, Sprint 2), sans dupliquer sa logique.
  function irVersReglageCategorie(categorieId) {
    profilProduitOuvert = null; profilEnEdition = null; profilFormulaireActif = false;
    if (categorieReglesOuverte === categorieId) { render(); return; }
    ouvrirEditionRegleCategorie(categorieId);
  }

  function appliquerPreregleProfil(nomPreregle) {
    const preset = PREREGLAGES_REGLE[nomPreregle];
    if (!preset || !profilEnEdition) return;
    profilEnEdition = { ...profilEnEdition, ...preset };
    render();
  }
  async function enregistrerProfilProduit() {
    const p = profilEnEdition;
    const btn = document.getElementById('btnEnregistrerProfil');
    if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
    const profilDerive = calculerProfilDepuisReglage(p);
    // Production journalière (19/08/2026) : les champs "Remis à zéro"/"Durée
    // de vente"/"Seuil d'alerte" sont masqués dans le formulaire dès que
    // cette case est cochée (voir renderFormulaireProfil) mais restent en
    // mémoire dans `p` (état non réinitialisé) — on les neutralise
    // explicitement ici pour ne jamais écrire une combinaison incohérente
    // (ex. profil=production_journaliere ET cycle_frequence=quotidien).
    const dureeActive = !p.production_journaliere && !!p.duree_max_vente_jours;
    const remiseAZeroActive = !p.production_journaliere && p.remise_a_zero_matin;
    const seuilActif = !p.production_journaliere && p.seuil_minimal;
    const payload = {
      site: siteId, produit_id: p.produit_id, profil: profilDerive,
      cycle_frequence: remiseAZeroActive ? 'quotidien' : null,
      report_veille_autorise: !remiseAZeroActive,
      duree_max_vente_jours: dureeActive ? p.duree_max_vente_jours : null,
      action_echeance: dureeActive ? (p.retour_fournisseur_autorise ? 'retour_fournisseur_obligatoire' : 'alerte_manager') : null,
      mode_agregation_ventes: 'aucun',
      quarts_comptage: p.quarts_comptage || null,
      reapprovisionnable: p.reapprovisionnable !== false,
      validation_manager_requise: !!p.validation_manager_requise,
      comptage_masque: !!p.comptage_masque,
      seuil_minimal: seuilActif ? p.seuil_minimal : null,
      controle_aleatoire: !!p.controle_aleatoire,
      photo_obligatoire: !!p.photo_obligatoire,
      // Plan de comptage tournant (19/08/2026) : consommé par
      // nexus-inventaire-plan-donnees.js::chargerIngredientsSelection puis
      // nexus-inventaire-moteur.js::delaiMaxJours/construirePlanComptage.
      // delai_max_jours_sans_controle reste un override optionnel — vide =
      // NEXUS applique le défaut de la famille choisie (0/7/21 jours),
      // jamais un 0 fabriqué ici (Article 5).
      frequence_controle: p.frequence_controle || 'standard',
      delai_max_jours_sans_controle: (p.delai_max_jours_sans_controle !== '' && p.delai_max_jours_sans_controle != null) ? p.delai_max_jours_sans_controle : null,
      // Sprint 3 (20/08/2026) : horodatage explicite, jamais un trigger
      // caché — c'est ce que la fiche produit affiche mot pour mot
      // ("Dernière modification : ..."), donc l'écriture doit être ici,
      // visible, plutôt que déléguée à un mécanisme invisible côté base.
      updated_at: new Date().toISOString(),
    };
    const { data, error } = await nexusClient.from('inventaire_regles_produit').upsert(payload, { onConflict: 'site,produit_id' }).select().single();
    if (error) { console.error('Enregistrement règle produit:', error); alert('Erreur — réessayez.'); if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer ces réglages'; } return; }
    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, entite_type: 'inventaire_regles_produit', entite_id: data.id,
      action: 'configuration_regle_produit', nouvelle_valeur: payload, acteur_id: managerCourant.id,
    });
    reglesProduitMap[p.produit_id] = data;

    // Compté en deux lieux (05/08/2026) : propriété du produit
    // (inventaire_zone_produit), pas de la règle — écriture séparée, même
    // schéma que "sensible".
    const { error: erreurDoubleLieu } = await nexusClient.from('inventaire_zone_produit')
      .update({ comptage_deux_lieux: !!p.comptage_deux_lieux }).eq('id', p.produit_id);
    if (erreurDoubleLieu) console.error('Enregistrement comptage_deux_lieux:', erreurDoubleLieu);
    else {
      const idx = produitsInventaire.findIndex(pr => pr.id === p.produit_id);
      if (idx !== -1) produitsInventaire[idx] = { ...produitsInventaire[idx], comptage_deux_lieux: !!p.comptage_deux_lieux };
    }

    // Onglet Production (19/08/2026, tâche #518) : garder produitsProduction
    // synchronisé sans recharger toute la page si le manager vient de
    // basculer ce produit vers/hors du profil production_journaliere ici.
    const dejaDansProduction = produitsProduction.some(pp => pp.id === p.produit_id);
    if (profilDerive === 'production_journaliere' && !dejaDansProduction) {
      const source = produitsInventaire.find(pr => pr.id === p.produit_id);
      if (source) produitsProduction.push(source);
    } else if (profilDerive !== 'production_journaliere' && dejaDansProduction) {
      produitsProduction = produitsProduction.filter(pp => pp.id !== p.produit_id);
    }

    // Sprint 3 : retour à la carte d'origine (fiche laissée ouverte) plutôt
    // que tout refermer — confirme visuellement ce qui vient d'être
    // enregistré (désormais "⚠ Exception active", Dernière modification à
    // l'instant).
    profilEnEdition = null; profilFormulaireActif = false;
    render();
  }
  function renderFormulaireProfil() {
    const e = profilEnEdition;
    const dureeActive = e.duree_max_vente_jours != null && e.duree_max_vente_jours !== '';
    const comptageValeur = !e.quarts_comptage ? 'deux' : (e.quarts_comptage.includes('matin') ? 'matin' : 'soir');
    return `
      <div class="card" style="margin:0 0 10px; padding:12px 14px;">

        ${!e.production_journaliere && dureeActive ? `

        <div class="regle-champ-row" style="flex-direction:column; align-items:stretch;">

            <option value="soir" ${comptageValeur === 'soir' ? 'selected' : ''}>Soir seulement</option>
          </select>
        </div>

        <label class="regle-check-row">
          <input type="checkbox" id="regleReapprovisionnable" ${e.reapprovisionnable !== false ? 'checked' : ''}>
          <span>📦 Produit réapprovisionnable en cours de quart</span>
        </label>

        ${!e.production_journaliere ? `
        <div class="regle-champ-row">
          <span>⚠️ Seuil d'alerte (quantité)</span>
          <input type="number" min="0" class="mouv-qte" id="regleSeuilAlerte" placeholder="Aucun" value="${e.seuil_minimal || ''}" style="width:74px; flex:none;">
        </div>
        ` : ''}

        <div class="regle-champ-row">
          <span>🎲 Criticité (plan de comptage tournant)</span>
          <select id="regleFrequenceControle" class="mouv-select" style="width:auto;">
            <option value="critique" ${e.frequence_controle === 'critique' ? 'selected' : ''}>Critique — compté chaque quart</option>
            <option value="standard" ${e.frequence_controle === 'standard' || !e.frequence_controle ? 'selected' : ''}>Standard — délai 7 jours</option>
            <option value="faible_rotation" ${e.frequence_controle === 'faible_rotation' ? 'selected' : ''}>Faible rotation — délai 21 jours</option>

        <div class="regle-champ-row">

        </div>
        <div class="note" style="margin:0 0 8px;">Détermine si NEXUS inclut ce produit dans le plan de comptage réduit du quart (§5.2) : un produit "critique" est demandé chaque quart, "faible rotation" seulement s'il n'a pas été vu depuis 21 jours (ou la valeur ci-dessus si réglée).</div>
        <label class="regle-check-row">
          <input type="checkbox" id="profilControleAleatoire" ${e.controle_aleatoire ? 'checked' : ''}>
          <span>Contrôle aléatoire (peut être tiré au sort par le Conseiller NEXUS)</span>
        </label>
        <label class="regle-check-row">
          <input type="checkbox" id="profilDoubleLieu" ${e.comptage_deux_lieux ? 'checked' : ''}>
          <span>📍 Compté en deux lieux (dépôt + boutique) — l'employé saisit les deux, NEXUS additionne</span>
        </label>
        <!-- 30/08/2026 (chantier "réglages fantômes") : "Validation manager requise avant de compter", "Comptage à l'aveugle" et
             "Photo obligatoire" retirés de cet écran (Frédéric : "soit on le branche réellement à un moteur, soit on le retire").
             Aucun consommateur trouvé nulle part dans le code, jamais réglés sur aucun produit en base, et aucun mécanisme cible
             réaliste : le comptage à l'aveugle est de toute façon déjà le comportement par défaut de tout produit du plan V2
             (voir estMasquePourProduit, Sprint 1 INV2-01) et la photo obligatoire nécessiterait une fonctionnalité de capture
             photo qui n'existe pas dans l'app (à ne pas confondre avec "Photo Decenium", un instantané de données, pas une
             image). Les valeurs historiques restent en base (colonnes conservées), simplement plus modifiables ici. -->
        <div class="note" style="margin:0 0 8px;">« Réapprovisionnable » restreint désormais les mouvements "Marchandise reçue"/"Réassort" proposés à ce produit. « Contrôle aléatoire » restreint le tirage des surprises du plan de comptage aux produits cochés (si aucun ne l'est sur le site, le tirage reste inchangé, sur tous les éligibles).</div>

        <button class="btn-primary" id="btnEnregistrerProfil" style="margin-top:0;">Enregistrer ces réglages</button>
        <button class="btn-text" id="btnAnnulerProfil">Annuler</button>
      </div>
    `;
