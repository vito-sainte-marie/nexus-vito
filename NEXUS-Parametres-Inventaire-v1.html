<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Paramètres Inventaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-forfait.js"></script>
<script src="nexus-desktop.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
  .nexus-patience{padding:14px 4px; text-align:center; color:var(--cyan); font-size:12.5px; font-weight:600;}
  .patience-dots span{display:inline-block; opacity:0.2; animation:patience-blink 1.2s infinite;}
  .patience-dots span:nth-child(2){animation-delay:0.2s;}
  .patience-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes patience-blink{0%,80%,100%{opacity:0.2;} 40%{opacity:1;}}
  .empty{text-align:center; padding:20px; color:var(--text-dim); font-size:12.5px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; margin-bottom:10px;}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-family:var(--sans);}
  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:4px 14px;}
  .note{font-size:12px; color:var(--text-mid); line-height:1.5; margin-bottom:14px;}
  .ventes-desc{font-size:12px; color:var(--text-mid); line-height:1.5; margin-bottom:12px;}

  .onglet-row{display:flex; gap:6px; overflow-x:auto; padding:14px 20px 4px; scrollbar-width:none;}
  .onglet-row::-webkit-scrollbar{display:none;}
  .onglet{flex:0 0 auto; padding:9px 13px; border-radius:20px; font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.02em; color:var(--text-dim); background:var(--panel-raised); border:1px solid var(--hairline); cursor:pointer; white-space:nowrap;}
  .onglet.active{color:var(--cyan); border-color:rgba(79,195,217,0.4); background:rgba(79,195,217,0.1);}

  .section-titre{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-mid); margin:20px 0 10px;}
  .section-titre:first-child{margin-top:0;}
  .question-titre{font-family:var(--sans); font-size:18px; font-weight:700; line-height:1.3; color:var(--text); margin:4px 0 14px;}
  .question-titre:first-child{margin-top:0;}
  .section-titre-action-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 10px;}
  .section-titre-action-row .section-titre{margin:0;}
  .btn-tout-valider{font-family:var(--sans); font-size:11px; font-weight:600; padding:6px 12px; border-radius:20px; border:1px solid rgba(79,195,217,0.4); background:rgba(79,195,217,0.08); color:var(--cyan); cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .btn-tout-valider:active{background:rgba(79,195,217,0.18);}

  .quart-select-row{display:flex; gap:8px; margin-bottom:6px; align-items:center;}
  .date-input{font-family:var(--mono); font-size:12.5px; background:var(--panel-raised); border:1px solid var(--hairline); color:var(--text); border-radius:8px; padding:8px 10px; flex:1;}
  .quart-pill{font-family:var(--mono); font-size:11.5px; font-weight:600; padding:8px 14px; border-radius:20px; border:1px solid var(--hairline); background:var(--panel); color:var(--text-mid); cursor:pointer; white-space:nowrap;}
  .quart-pill.active{background:rgba(79,195,217,0.15); border-color:rgba(79,195,217,0.4); color:var(--cyan);}

  .mouv-row{display:flex; gap:8px; margin-bottom:8px;}
  .mouv-select, .mouv-qte{background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12.5px; font-family:var(--sans);}
  .mouv-select{flex:1.4; width:100%;}
  .mouv-qte{flex:1; font-family:var(--mono); text-align:right;}
  .mouv-justif{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; color:var(--text); font-size:12px; margin-bottom:8px; font-family:var(--sans);}
  .champ-recherche{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:10px 12px; color:var(--text); font-size:13px; font-family:var(--sans); margin-bottom:8px;}

  .btn-primary{width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{width:100%; padding:12px; border:1px solid var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:13px; cursor:pointer; margin-top:8px;}
  .btn-text{width:100%; padding:12px; border:none; background:none; color:var(--text-dim); font-size:12.5px; cursor:pointer; margin-top:4px;}

  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0;}
  .stat-row + .stat-row{border-top:1px solid var(--hairline);}
  .stat-label{font-size:13px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:15px; font-weight:700; color:var(--text);}
  .stat-value.amber{color:var(--amber);}
  .stat-value.green{color:var(--green);}
  .stat-value.cyan{color:var(--cyan);}
  .stat-value.red{color:var(--red);}

  .cat-block{margin-bottom:16px;}
  .cat-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;}
  .cat-nom{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}

  .produit-row{padding:12px 14px;}
  .produit-row + .produit-row{border-top:1px solid var(--hairline);}
  .produit-nom-ligne{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .produit-nom{font-size:13.5px; font-weight:600; flex:1;}
  .produit-input{flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:9px; padding:10px 12px; color:var(--text); font-family:var(--mono); font-size:15px; text-align:right;}
  .produit-input:focus{outline:none; border-color:var(--cyan);}

  .categorie-row{display:flex; justify-content:space-between; align-items:center; padding:14px; cursor:pointer;}
  .categorie-row + .categorie-row{border-top:1px solid var(--hairline);}
  .categorie-row:active{background:var(--panel-raised);}
  .categorie-nom{font-size:14px; font-weight:600;}
  .categorie-count{font-size:11.5px; color:var(--text-mid); margin-top:2px;}
  .categorie-etat{font-family:var(--mono); font-size:10px; font-weight:700; padding:4px 9px; border-radius:12px; white-space:nowrap; text-transform:uppercase;}
  .categorie-etat.a-faire{background:var(--panel-raised); color:var(--text-dim);}
  .categorie-etat.en-cours{background:rgba(79,195,217,0.12); color:var(--cyan);}

  /* Règles des produits en langage commerce (05/08/2026) */
  .preset-btn{font-family:var(--sans); font-size:11px; font-weight:600; padding:7px 10px; border-radius:20px; border:1px solid rgba(79,195,217,0.35); background:rgba(79,195,217,0.08); color:var(--cyan); cursor:pointer; margin-bottom:8px;}
  .preset-btn:active{background:rgba(79,195,217,0.2);}
  .regle-check-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-mid); margin-bottom:10px; cursor:pointer;}
  .regle-champ-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--text-mid); margin-bottom:10px;}
  .categorie-etat.inactif{background:var(--red-dim); color:var(--red);}

  .param-ligne{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .param-ligne:last-child{border-bottom:none;}
  .param-ligne label{color:var(--text-mid); flex-shrink:0;}
  .param-input{font-family:var(--mono); font-size:12.5px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:7px; color:var(--text); padding:6px 8px; text-align:right; max-width:150px;}
  .param-input:focus{outline:none; border-color:var(--cyan);}
  select.param-input{text-align:left; max-width:170px;}
  .param-checklist{display:flex; flex-wrap:wrap; gap:8px; padding:10px 0;}
  .param-check-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline); border-radius:20px; padding:5px 10px 5px 8px; cursor:pointer;}
  .param-check-item input{accent-color:var(--cyan);}
  .param-check-item.actif{color:var(--text); border-color:rgba(79,195,217,0.4);}
  .param-note{font-size:11px; color:var(--text-dim); padding:2px 0 10px;}
  .param-enregistre{font-family:var(--mono); font-size:10px; color:var(--green); opacity:0; transition:opacity .2s; margin-left:8px;}
  .param-enregistre.visible{opacity:1;}

  .employe-toggle-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--hairline);}
  .employe-toggle-row:last-child{border-bottom:none;}
  .employe-role{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:capitalize; margin-top:2px;}
  .toggle-switch{width:42px; height:24px; border-radius:12px; background:var(--panel-raised); border:1px solid var(--hairline); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
  .toggle-switch.on{background:rgba(79,195,217,0.3); border-color:var(--cyan);}
  .toggle-knob{width:18px; height:18px; border-radius:50%; background:var(--text-mid); position:absolute; top:2px; left:2px; transition:left .15s, background .15s;}
  .toggle-switch.on .toggle-knob{left:21px; background:var(--cyan);}

  /* Onglet Produits de l'inventaire */
  .produit-liste-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--hairline); cursor:pointer;}
  .produit-liste-row:last-child{border-bottom:none;}
  .produit-liste-row.inactif{opacity:0.45;}
  .produit-liste-nom{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:5px;}
  .produit-liste-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); margin-top:2px;}
  .etoile-sensible{cursor:pointer; color:var(--text-dim); font-size:13px;}
  .etoile-sensible.actif{color:var(--gold);}
  .produit-edit-panel{padding:12px 14px; background:var(--panel-raised); border-radius:0 0 10px 10px; margin-bottom:2px;}
  .catalogue-resultat{padding:10px 12px; border-radius:8px; background:var(--panel-raised); margin-bottom:6px; cursor:pointer; font-size:12.5px; display:flex; justify-content:space-between; align-items:center;}
  .catalogue-resultat:active{background:var(--hairline);}
  .catalogue-resultat-meta{font-family:var(--mono); font-size:10px; color:var(--text-dim);}
  .produit-choisi-badge{background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.35); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px;}

  /* Onglet Parcours d'inventaire */
  .parcours-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .parcours-item:last-child{border-bottom:none;}
  .parcours-nom{font-size:13px; font-weight:600;}
  .parcours-sub{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:2px;}
  .parcours-fleches{display:flex; gap:4px; flex-shrink:0;}
  .btn-fleche{width:30px; height:30px; border-radius:8px; border:1px solid var(--hairline); background:var(--panel-raised); color:var(--text-mid); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .btn-fleche:disabled{opacity:0.3; cursor:not-allowed;}
  .btn-fleche:active:not(:disabled){background:var(--hairline);}
  .jours-row{display:flex; gap:4px; margin-top:8px;}
  .jour-toggle{flex:1; text-align:center; padding:6px 0; border-radius:6px; font-family:var(--mono); font-size:10px; font-weight:600; border:1px solid var(--hairline); background:var(--panel-raised); color:var(--text-dim); cursor:pointer;}
  .jour-toggle.actif{background:rgba(79,195,217,0.15); border-color:rgba(79,195,217,0.4); color:var(--cyan);}

  /* Raccourci Traçabilité */
  .raccourci-card{background:linear-gradient(135deg, rgba(79,195,217,0.08), rgba(79,195,217,0.02)); border:1px solid rgba(79,195,217,0.25); border-radius:12px; padding:18px; text-align:center;}
  .raccourci-titre{font-size:15px; font-weight:700; margin-bottom:6px;}
  .raccourci-desc{font-size:12.5px; color:var(--text-mid); line-height:1.5; margin-bottom:14px;}
  .raccourci-btn{display:inline-block; font-family:var(--sans); font-size:12.5px; font-weight:700; padding:10px 18px; border-radius:20px; background:var(--cyan); color:#04141a; text-decoration:none;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-Inventaire-Manager-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Paramètres Inventaire</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="sub">Produits suivis, parcours de comptage, règles, alertes, traçabilité et simulation — tout ce qui se configure, jamais ce qui se traite au quotidien.</div>
  </div>
  <div class="divider"></div>
  <div class="onglet-row" id="ongletRow"></div>

  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>
  <footer>NEXUS Paramètres Inventaire v1 · Vito Sainte-Marie</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS Paramètres Inventaire (04/08/2026, demande de Frédéric) : tout
  // ce qui se règle une fois et se consulte rarement, organisé en onglets
  // pour rester trouvable à mesure que le catalogue grandit (aujourd'hui
  // 242 produits, "peut-être 700 demain") — plutôt qu'empilé sur l'écran
  // Contrôle inventaire qui doit rester centré sur "que dois-je traiter
  // maintenant ?".
  // ------------------------------------------------------------
  let managerCourant = null;
  let siteId = 'vito-sainte-marie';
  let ongletActif = 'produits';

  // Données partagées entre onglets
  let produitsInventaire = [];   // tous les produits (actifs et inactifs), pour l'onglet Produits
  let zonesSite = [];
  let categoriesSite = [];       // actives uniquement, pour les sélecteurs
  let employesSite = [];

  const JOURS_SEMAINE = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
  const LABELS_FREQUENCE = { daily: 'Tous les jours', weekly: 'Une fois par semaine', monthly: 'Une fois par mois', exception_only: 'Uniquement par exception' };
  const DEFAULTS_PARAMETRES_INVENTAIRE = {
    reviewFrequency: 'daily', weeklyReviewDay: 1, monthlyReviewDay: 1, reviewTime: '20:00',
    quantityAlertThreshold: 1, valueAlertThreshold: null, immediateAlertCategoryIds: [],
    closureDelayMinutes: 30, immediateAlertsEnabled: true,
    // Nouveaux seuils (04/08/2026, demande de Frédéric) : purement
    // additifs dans le même objet JSON station_config.parametres_inventaire
    // — aucune migration nécessaire pour ceux-là.
    seuilDemarquePct: null, seuilCasseUnites: null, seuilPeremptionJours: 2, rappelRetourFournisseurActif: true,
    sensComptage: 'piste_boutique',
  };
  let parametresInventaire = { ...DEFAULTS_PARAMETRES_INVENTAIRE };

  const PROFILS_PRODUIT = [
    { value: 'continu', label: 'Stock continu', desc: 'Le stock final du quart précédent devient le stock transmis (comportement par défaut).' },
    { value: 'cycle_journalier', label: 'Cycle journalier réinitialisé', desc: 'Chaque matin, NEXUS ferme le cycle précédent et en ouvre un nouveau. Les ventes des quarts peuvent être cumulées.' },
    { value: 'lot_glissant', label: 'Durée de vie glissante (SDD)', desc: 'Chaque réception crée un lot daté ; le retour fournisseur devient obligatoire à échéance.' },
    { value: 'presse', label: 'Presse et éditions', desc: 'Suivi par édition ou date de parution — deux éditions ne sont jamais mélangées.' },
    { value: 'consommable', label: 'Consommable interne', desc: 'Suivi par quantité et seuil minimal d\'alerte, pas par quart.' },
  ];

  function dateISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  // Message d'attente réutilisable (05/08/2026, demande de Frédéric) pour
  // toute action qui implique un ou plusieurs appels réseau avant de
  // pouvoir se rafraîchir — évite l'impression que "rien ne se passe".
  function renderMessagePatience() {
    return `<div class="nexus-patience">Patientez, NEXUS travaille pour vous<span class="patience-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
  }
  function fmtNum(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  }

  // ==============================================================
  // ONGLET 1 — PRODUITS DE L'INVENTAIRE
  // ==============================================================
  let rechercheProduitsTexte = '';
  let ligneProduitOuverte = null;
  let formAjoutOuvert = false;
  let rechercheCatalogueTexte = '';
  let resultatsCatalogue = [];
  let produitCatalogueChoisi = null; // { article, code_barres, categorie }
  let ajoutForm = { categorieId: '', zoneId: '', sensible: false, dupliquerDepuisId: '' };
  let dupliquerVersOuvertPour = null; // id du produit source dont "Dupliquer vers…" est déplié
  let duplicationCategorieEnCours = null; // id du produit source en cours de duplication (affiche le message de patience)

  async function chargerProduitsInventaire(site) {
    const { data, error } = await nexusClient.from('inventaire_zone_produit')
      .select('*, inventaire_categories(id, nom), inventaire_zones(id, code, nom)')
      .eq('site', site).order('designation');
    if (error) { console.error('Chargement produits inventaire:', error); return []; }
    return data || [];
  }
  async function chargerZonesSite(site) {
    const { data, error } = await nexusClient.from('inventaire_zones').select('*').eq('site', site).order('ordre_affichage');
    if (error) { console.error('Chargement zones:', error); return []; }
    return data || [];
  }
  // La zone détermine automatiquement qui compte le produit côté employé
  // (NEXUS-Inventaire-v1.html, zonesPourRole) : Piste → pompistes, Boutique
  // → caissier/caissière. Un manager/gérant/renfort voit les deux. Pas de
  // champ séparé "assigné à" : le rattachement se fait ici, via la Zone.
  function libelleZoneAvecRole(zone) {
    if (!zone) return '—';
    if (zone.code === 'piste') return `${zone.nom} (pompistes)`;
    if (zone.code === 'boutique') return `${zone.nom} (caissier/caissière)`;
    return zone.nom;
  }
  async function chargerCategoriesSite(site) {
    const { data, error } = await nexusClient.from('inventaire_categories').select('*').eq('site', site).eq('actif', true).order('ordre_affichage');
    if (error) { console.error('Chargement catégories:', error); return []; }
    return data || [];
  }
  async function chargerEmployesSite(site) {
    const { data, error } = await nexusClient.from('employees').select('id, nom, role').eq('site_id', site).eq('actif', true).order('nom');
    if (error) { console.error('Chargement employés:', error); return []; }
    return (data || []).filter(e => e.role !== 'manager' && e.role !== 'gerant');

  function refocusRechercheCatalogue() {
    const el = document.getElementById('rechercheCatalogue');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  async function rechercherCatalogue() {
    const terme = rechercheCatalogueTexte.trim();
    if (terme.length < 2) { resultatsCatalogue = []; render(); refocusRechercheCatalogue(); return; }
    const { data, error } = await nexusClient.from('products')
      .select('article, code_barres, categorie').eq('site', siteId).ilike('article', `%${terme}%`).limit(60);
    if (error) { console.error('Recherche catalogue produits:', error); resultatsCatalogue = []; render(); refocusRechercheCatalogue(); return; }
    const dejaSuivis = new Set(produitsInventaire.map(p => p.designation.toLowerCase()));
    const vus = new Set();
    resultatsCatalogue = (data || []).filter(r => {
      const cle = r.article.toLowerCase();
      if (dejaSuivis.has(cle) || vus.has(cle)) return false;
      vus.add(cle);
      return true;
    }).slice(0, 15);
    render();
    refocusRechercheCatalogue();
  }

    if (!produitCatalogueChoisi) { alert('Recherchez et choisissez un produit.'); return; }
    if (!ajoutForm.categorieId || !ajoutForm.zoneId) { alert('Choisissez une catégorie et une zone.'); return; }
    const btn = document.getElementById('btnAjouterProduit');
    if (btn) { btn.disabled = true; btn.textContent = 'Ajout…'; }
    const { data, error } = await nexusClient.from('inventaire_zone_produit').insert({
      site: siteId, designation: produitCatalogueChoisi.article, code_barres: produitCatalogueChoisi.code_barres || null,
      categorie_id: ajoutForm.categorieId, zone_id: ajoutForm.zoneId, sensible: !!ajoutForm.sensible,
      actif: true, source: 'catalogue',
    }).select().single();
    if (error) { console.error('Ajout produit inventaire:', error); alert('Erreur — réessayez.'); if (btn) { btn.disabled = false; btn.textContent = 'Ajouter ce produit'; } return; }

    // Dupliquer les paramètres d'un produit existant (04/08/2026, demande
    // de Frédéric — "en 5 secondes, le produit est opérationnel") : copie
    // la règle d'inventaire (inventaire_regles_produit) du produit source,
    // si une règle existe. Catégorie/zone/sensible ont déjà été pré-remplis
    // manuellement dans le formulaire, jamais silencieusement écrasés.
    if (ajoutForm.dupliquerDepuisId) {
      await copierReglesProduit(ajoutForm.dupliquerDepuisId, data.id);
    }

    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, entite_type: 'inventaire_zone_produit', entite_id: data.id, action: 'ajout_produit_inventaire',
      nouvelle_valeur: { designation: data.designation }, acteur_id: managerCourant.id,
    });

    formAjoutOuvert = false;
    rechercheCatalogueTexte = ''; resultatsCatalogue = []; produitCatalogueChoisi = null;
    ajoutForm = { categorieId: '', zoneId: '', sensible: false, dupliquerDepuisId: '' };
    produitsInventaire = await chargerProduitsInventaire(siteId);

  async function copierReglesProduit(sourceId, cibleId) {
    const { data: regleSource, error } = await nexusClient.from('inventaire_regles_produit').select('*').eq('site', siteId).eq('produit_id', sourceId).maybeSingle();
    if (error) { console.error('Lecture règle source (duplication):', error); return; }
    if (!regleSource) return; // le produit source suit encore le profil par défaut (continu) — rien à copier
    const { profil, cycle_frequence, report_veille_autorise, duree_max_vente_jours, action_echeance, mode_agregation_ventes, validation_manager_requise, comptage_masque, seuil_minimal, controle_aleatoire, photo_obligatoire } = regleSource;
    await nexusClient.from('inventaire_regles_produit').upsert({
      site: siteId, produit_id: cibleId, profil, cycle_frequence, report_veille_autorise, duree_max_vente_jours,
      action_echeance, mode_agregation_ventes, validation_manager_requise, comptage_masque, seuil_minimal, controle_aleatoire, photo_obligatoire,
    }, { onConflict: 'site,produit_id' });
  }

  // Dupliquer vers les produits de la même catégorie (05/08/2026, demande
  // de Frédéric — "pose la question, voulez dupliquer ces réglages vers les
  // produits de la même catégorie" plutôt que de choisir un produit cible un
  // par un) : copie la règle d'inventaire et le statut "produit sensible"
  // (jamais la zone, déjà partagée par construction).
  function autresProduitsMemeCategorie(p) {
    return produitsInventaire.filter(x => x.actif && x.id !== p.id && x.categorie_id === p.categorie_id);
  }
  async function dupliquerVersCategorie(sourceId) {
    const source = produitsInventaire.find(p => p.id === sourceId);
    if (!source) return;
    const pairs = autresProduitsMemeCategorie(source);
    if (!pairs.length) return;
    duplicationCategorieEnCours = sourceId;
    render();
    for (const cible of pairs) {
      await copierReglesProduit(sourceId, cible.id);
      await nexusClient.from('inventaire_zone_produit').update({ sensible: source.sensible }).eq('id', cible.id);
    }
    const catNom = source.inventaire_categories ? source.inventaire_categories.nom : 'cette catégorie';
    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, entite_type: 'inventaire_regles_produit', entite_id: source.id, action: 'duplication_reglages_categorie',
      nouvelle_valeur: { copie_depuis: source.designation, categorie: catNom, nb_produits: pairs.length, sensible: source.sensible }, acteur_id: managerCourant.id,
    });
    dupliquerVersOuvertPour = null;
    duplicationCategorieEnCours = null;
    reglesProduitMap = await chargerReglesProduit(siteId);
    produitsInventaire = await chargerProduitsInventaire(siteId);
    render();
  }

  async function deplacerZone(id, sens) {
    const idx = zonesSite.findIndex(z => z.id === id);
    const cible = idx + sens;
    if (cible < 0 || cible >= zonesSite.length) return;
    const a = zonesSite[idx], b = zonesSite[cible];
    const ordreA = a.ordre_affichage, ordreB = b.ordre_affichage;
    await Promise.all([
      nexusClient.from('inventaire_zones').update({ ordre_affichage: ordreB }).eq('id', a.id),
      nexusClient.from('inventaire_zones').update({ ordre_affichage: ordreA }).eq('id', b.id),
    ]);
    zonesSite = await chargerZonesSite(siteId);
    render();
  }
  async function deplacerCategorie(id, sens) {
    const idx = categoriesSite.findIndex(c => c.id === id);
    const cible = idx + sens;
    if (cible < 0 || cible >= categoriesSite.length) return;
    const a = categoriesSite[idx], b = categoriesSite[cible];
    const ordreA = a.ordre_affichage, ordreB = b.ordre_affichage;
    await Promise.all([
      nexusClient.from('inventaire_categories').update({ ordre_affichage: ordreB }).eq('id', a.id),
      nexusClient.from('inventaire_categories').update({ ordre_affichage: ordreA }).eq('id', b.id),
    ]);
    categoriesSite = await chargerCategoriesSite(siteId);
    render();
  }
  async function toggleJourRotation(categorieId, jourIso) {
    const cat = categoriesSite.find(c => c.id === categorieId);
    if (!cat) return;
    let jours = cat.jours_rotation ? [...cat.jours_rotation] : [1, 2, 3, 4, 5, 6, 7];
    if (jours.includes(jourIso)) jours = jours.filter(j => j !== jourIso); else { jours.push(jourIso); jours.sort(); }
    // Cocher les 7 jours équivaut à "tous les jours" — on repasse alors à
    // NULL pour rester sur le comportement historique explicite plutôt que
    // de stocker un tableau complet qui dit la même chose autrement.
    const valeur = jours.length === 7 ? null : jours;
    const { error } = await nexusClient.from('inventaire_categories').update({ jours_rotation: valeur }).eq('id', categorieId);
    if (error) { console.error('Rotation catégorie:', error); alert('Erreur — réessayez.'); return; }
    cat.jours_rotation = valeur;
    render();
  }

  // ==============================================================
  // ONGLET 3 — RÈGLES DES PRODUITS (relocalisé + étendu : contrôle
  // aléatoire, photo obligatoire — 04/08/2026)
  // ==============================================================
  let reglesProduitMap = {};
  let profilProduitOuvert = null;
  let profilEnEdition = null;
  let rechercheReglesTexte = '';

  async function chargerReglesProduit(site) {
    const { data, error } = await nexusClient.from('inventaire_regles_produit').select('*').eq('site', site);
    if (error) { console.error('Chargement règles produit:', error); return {}; }
    const map = {};
    (data || []).forEach(r => { map[r.produit_id] = r; });
    return map;
  }
  // Langage commerce plutôt que logistique (05/08/2026, demande de
  // Frédéric — "un outil qui parle le langage du commerce, pas celui d'un
  // ERP") : le manager ne choisit plus un "profil" technique (Stock
  // continu / Cycle journalier / Lot glissant / Presse / Consommable)
  // dans une liste — il coche des réglages indépendants et compréhensibles
  // (stock remis à zéro le matin, durée de vente, retour fournisseur,
  // comptage matin/soir, réapprovisionnable, seuil d'alerte). `profil`
  // reste calculé automatiquement à partir de ces réglages : NEXUS
  // Traçabilité et le reste du code n'ont pas besoin de changer.
  function calculerProfilDepuisReglage(e) {
    if (e.remise_a_zero_matin) return 'cycle_journalier';
    if (e.duree_max_vente_jours) return 'lot_glissant';
    if (e.seuil_minimal) return 'consommable';
    return 'continu';
  }
  // Préréglages (05/08/2026, exemples réels donnés par Frédéric) : pré-
  // remplissent les réglages ci-dessous, le manager peut toujours ajuster
  // avant d'enregistrer — jamais appliqués sans confirmation explicite.
  const PREREGLAGES_REGLE = {
    viennoiserie: { remise_a_zero_matin: true, duree_max_vente_jours: 1, retour_fournisseur_autorise: false, quarts_comptage: ['matin'], reapprovisionnable: true },
    presse: { remise_a_zero_matin: true, duree_max_vente_jours: 1, retour_fournisseur_autorise: true, quarts_comptage: null, reapprovisionnable: false },
    sdd: { remise_a_zero_matin: false, duree_max_vente_jours: 3, retour_fournisseur_autorise: true, quarts_comptage: null, reapprovisionnable: true },
  };
  function ouvrirEditionProfil(produitId) {
    if (profilProduitOuvert === produitId) { profilProduitOuvert = null; profilEnEdition = null; render(); return; }
    profilProduitOuvert = produitId;
    const existant = reglesProduitMap[produitId];
    profilEnEdition = existant ? {
      produit_id: produitId,
      remise_a_zero_matin: existant.profil === 'cycle_journalier',
      duree_max_vente_jours: existant.duree_max_vente_jours || null,
      retour_fournisseur_autorise: existant.action_echeance === 'retour_fournisseur_obligatoire',
      quarts_comptage: existant.quarts_comptage || null,
      reapprovisionnable: existant.reapprovisionnable !== false,
      seuil_minimal: existant.seuil_minimal || null,
      validation_manager_requise: !!existant.validation_manager_requise,
      comptage_masque: !!existant.comptage_masque,
      controle_aleatoire: !!existant.controle_aleatoire,
      photo_obligatoire: !!existant.photo_obligatoire,
    } : {

    const rows = data || [];

    return {
      nb: rows.length, tempsMoyenPapier: moyenne(rows.map(r => r.papier_temps_minutes).filter(v => v != null)),

    const listeHtml = Object.entries(groupes).map(([cat, items]) => `
      <div class="cat-block"><div class="cat-head"><div class="cat-nom">${cat} (${items.length})</div></div>
        <div class="card">${items.map(p => `<div class="produit-row"><div class="produit-nom-ligne"><span class="produit-nom">${p.designation}</span></div><input type="number" inputmode="decimal" step="0.01" class="produit-input simulation-input" data-produit="${p.id}" placeholder="Compté (papier)" value="${simulationSaisie[p.id] !== undefined ? simulationSaisie[p.id] : ''}" style="width:100%;"></div>`).join('')}</div>
      </div>`).join('');
    return `
      ${listeHtml}
      <div class="section-titre" style="margin-top:0;">Comparatif Papier / NEXUS pour cette session</div>
      <div class="mouv-row">
        <input type="number" class="mouv-qte" id="simulationPapierProduits" placeholder="Produits (papier)" style="flex:1;">
        <input type="number" class="mouv-qte" id="simulationPapierTemps" placeholder="Temps papier (min)" style="flex:1;">
        <input type="number" class="mouv-qte" id="simulationPapierCorrections" placeholder="Corrections (papier)" style="flex:1;">
      </div>
      <textarea id="simulationNotes" class="mouv-justif" placeholder="Commentaires de simulation (facultatif)" style="width:100%; min-height:60px; resize:vertical;"></textarea>
      <button class="btn-primary" id="btnEnregistrerSimulation" style="margin-top:8px;">Enregistrer cette phase (simulation)</button>
    `;
  }
  async function enregistrerSimulation() {
    const btn = document.getElementById('btnEnregistrerSimulation');
    if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
    document.querySelectorAll('.simulation-input').forEach(el => { const v = el.value === '' ? undefined : parseFloat(el.value); if (v !== undefined && !isNaN(v)) simulationSaisie[el.dataset.produit] = v; });
    let nbComptes = 0;
    for (const [produitId, quantite] of Object.entries(simulationSaisie)) {
      const { error } = await nexusClient.from('inventaire_comptages').insert({ site: siteId, quart_id: simulationQuart.id, produit_id: produitId, type_comptage: simulationForm.phase, quantite, employee_id: simulationForm.employeId || null, source: 'simulation', statut: 'valide' });
      if (error) console.error('Comptage simulation:', error); else nbComptes++;
    }
    const tempsNexusMinutes = simulationChrono ? Math.round(((Date.now() - simulationChrono) / 60000) * 10) / 10 : null;
    const papierProduitsEl = document.getElementById('simulationPapierProduits');
    const papierTempsEl = document.getElementById('simulationPapierTemps');
    const papierCorrectionsEl = document.getElementById('simulationPapierCorrections');
    const notesEl = document.getElementById('simulationNotes');
    const papierProduits = papierProduitsEl && papierProduitsEl.value !== '' ? parseInt(papierProduitsEl.value) : null;
    const papierTemps = papierTempsEl && papierTempsEl.value !== '' ? parseFloat(papierTempsEl.value) : null;
    const papierCorrections = papierCorrectionsEl && papierCorrectionsEl.value !== '' ? parseInt(papierCorrectionsEl.value) : null;
    const notes = notesEl ? notesEl.value.trim() : '';
    await nexusClient.from('inventaire_quarts').update({ papier_produits_comptes: papierProduits, papier_temps_minutes: papierTemps, papier_corrections: papierCorrections, nexus_temps_minutes: tempsNexusMinutes, simulation_notes: notes || null }).eq('id', simulationQuart.id);
    await nexusClient.from('inventaire_audit_log').insert({ site: siteId, quart_id: simulationQuart.id, entite_type: 'inventaire_quarts', entite_id: simulationQuart.id, action: 'enregistrement_simulation', nouvelle_valeur: { phase: simulationForm.phase, nb_comptes: nbComptes }, acteur_id: managerCourant.id });
    document.getElementById('simulationCorps').innerHTML = `<div class="note">✓ ${nbComptes} produit${nbComptes > 1 ? 's' : ''} enregistré${nbComptes > 1 ? 's' : ''} en simulation (${simulationForm.phase}). Temps NEXUS mesuré : ${tempsNexusMinutes !== null ? tempsNexusMinutes + ' min' : '—'}.</div>`;
    simulationQuart = null; simulationSaisie = {}; simulationChrono = null;
    statsSimulation = await chargerStatsSimulation();
    const zone = document.getElementById('simulationStatsZone');
    if (zone) zone.innerHTML = renderStatsSimulation();
  }
  function renderStatsSimulation() {
    if (!statsSimulation || statsSimulation.nb === 0) return `<div class="empty">Aucune session de simulation enregistrée pour l'instant.</div>`;
    const s = statsSimulation;
    const gain = (s.tempsMoyenPapier != null && s.tempsMoyenNexus != null) ? Math.round((s.tempsMoyenPapier - s.tempsMoyenNexus) * 10) / 10 : null;
    return `
      <div class="card" style="padding:4px 14px;">
        <div class="stat-row"><span class="stat-label">Sessions de simulation</span><span class="stat-value">${s.nb}</span></div>
        <div class="stat-row"><span class="stat-label">Temps moyen papier</span><span class="stat-value">${s.tempsMoyenPapier != null ? s.tempsMoyenPapier + ' min' : '—'}</span></div>
        <div class="stat-row"><span class="stat-label">Temps moyen NEXUS</span><span class="stat-value cyan">${s.tempsMoyenNexus != null ? s.tempsMoyenNexus + ' min' : '—'}</span></div>
        <div class="stat-row"><span class="stat-label">Corrections papier (moy.)</span><span class="stat-value">${s.correctionsMoyennes != null ? s.correctionsMoyennes : '—'}</span></div>
        ${gain !== null ? `<div class="stat-row"><span class="stat-label">Gain de temps NEXUS</span><span class="stat-value ${gain >= 0 ? 'cyan' : 'amber'}">${gain >= 0 ? '+' : ''}${gain} min</span></div>` : ''}
        <div class="stat-row"><span class="stat-label">Comparatifs renseignés</span><span class="stat-value">${s.nbAvecComparatif}/${s.nb}</span></div>
      </div>
    `;
  }
  function renderOngletSimulation() {
    const optionsEmployes = employesSite.map(e => `<option value="${e.id}" ${e.id === simulationForm.employeId ? 'selected' : ''}>${e.nom}</option>`).join('');
    return `
      <div class="question-titre">Comment se compare NEXUS à la feuille papier ?</div>
      <div class="card" style="margin-bottom:10px; padding:14px; margin-top:14px;">
        <div class="ventes-desc" style="margin-bottom:4px; color:var(--amber); font-weight:600;">Mode Simulation — cet inventaire sert à tester NEXUS. La feuille papier reste la référence officielle.</div>
        <div class="ventes-desc" style="margin-bottom:12px;">Saisissez après coup ce qu'un employé a compté sur la feuille papier. Rien ici ne modifie les stocks officiels ni ne génère d'évaluation employé.</div>
        <div class="quart-select-row">
          <input type="date" id="simulationDate" class="date-input" value="${simulationForm.date || dateISO()}">
          <div class="quart-pill ${simulationForm.quart === 'matin' ? 'active' : ''}" data-simulation-quart="matin">Matin</div>
          <div class="quart-pill ${simulationForm.quart === 'soir' ? 'active' : ''}" data-simulation-quart="soir">Soir</div>
        </div>
        <select class="mouv-select" id="simulationEmploye" style="width:100%; margin-bottom:8px;">
          <option value="">Employé représenté…</option>${optionsEmployes}
        </select>
        <select class="mouv-select" id="simulationPhase" style="width:100%; margin-bottom:8px;">
          <option value="ouverture" ${simulationForm.phase === 'ouverture' ? 'selected' : ''}>Comptage d'ouverture</option>
          <option value="cloture" ${simulationForm.phase === 'cloture' ? 'selected' : ''}>Comptage de clôture</option>
        </select>
        <button class="btn-ghost" id="btnChargerSimulation" style="margin-top:0;">Charger / créer cette session de simulation</button>
        <div id="simulationCorps" style="margin-top:10px;">${simulationQuart ? renderCorpsSimulation() : ''}</div>
        <div class="section-titre" style="margin-top:18px;">Tableau de validation de la simulation</div>
        <div id="simulationStatsZone">${statsSimulation ? renderStatsSimulation() : '<div class="loading">Chargement…</div>'}</div>
      </div>
    `;
  }

  // ==============================================================
  // NAVIGATION PAR ONGLETS + RENDU GÉNÉRAL
  // ==============================================================
  const ONGLETS = [
    { value: 'produits', label: '📦 Produits' },
    { value: 'parcours', label: '📋 Parcours' },
    { value: 'regles', label: '⚙️ Règles' },
    { value: 'alertes', label: '🚨 Alertes' },
    { value: 'tracabilite', label: '🔄 Traçabilité' },
    { value: 'simulation', label: '📊 Simulation' },
  ];

  function renderOnglets() {
    document.getElementById('ongletRow').innerHTML = ONGLETS.map(o => `<div class="onglet ${ongletActif === o.value ? 'active' : ''}" data-onglet="${o.value}">${o.label}</div>`).join('');
    document.querySelectorAll('[data-onglet]').forEach(el => el.addEventListener('click', async () => {
      ongletActif = el.dataset.onglet;
      if (ongletActif === 'simulation' && !sectionSimulationChargee) {
        sectionSimulationChargee = true;
        if (!simulationForm.date) simulationForm.date = dateISO();
        statsSimulation = await chargerStatsSimulation();
      }
      render();
    }));
  }

  function render() {
    renderOnglets();
    const content = document.getElementById('content');
    if (ongletActif === 'produits') content.innerHTML = renderOngletProduits();
    else if (ongletActif === 'parcours') content.innerHTML = renderOngletParcours();
    else if (ongletActif === 'regles') content.innerHTML = renderOngletRegles();
    else if (ongletActif === 'alertes') content.innerHTML = renderOngletAlertes();
    else if (ongletActif === 'tracabilite') content.innerHTML = renderOngletTracabilite();
    else if (ongletActif === 'simulation') content.innerHTML = renderOngletSimulation();
    wire();
  }

  function wire() {
    // --- Produits ---
    const btnToggleAjout = document.getElementById('btnToggleAjoutProduit');
    if (btnToggleAjout) btnToggleAjout.addEventListener('click', () => {
      formAjoutOuvert = !formAjoutOuvert;
      render();
      if (formAjoutOuvert) refocusRechercheCatalogue();
    });
    const inputRechercheCatalogue = document.getElementById('rechercheCatalogue');
    if (inputRechercheCatalogue) {
      inputRechercheCatalogue.addEventListener('input', () => { rechercheCatalogueTexte = inputRechercheCatalogue.value; rechercherCatalogue(); });
    }
    document.querySelectorAll('[data-choisir-catalogue]').forEach(el => el.addEventListener('click', () => {
      produitCatalogueChoisi = { article: el.dataset.choisirCatalogue, code_barres: el.dataset.codeBarres || null };
      render();
    }));
    const selAjoutCategorie = document.getElementById('ajoutCategorie');
    if (selAjoutCategorie) selAjoutCategorie.addEventListener('change', () => { ajoutForm.categorieId = selAjoutCategorie.value; });
    const selAjoutZone = document.getElementById('ajoutZone');
    if (selAjoutZone) selAjoutZone.addEventListener('change', () => { ajoutForm.zoneId = selAjoutZone.value; });
    const chkAjoutSensible = document.getElementById('ajoutSensible');
    if (chkAjoutSensible) chkAjoutSensible.addEventListener('change', () => { ajoutForm.sensible = chkAjoutSensible.checked; });
    const selAjoutDupliquer = document.getElementById('ajoutDupliquer');
    if (selAjoutDupliquer) selAjoutDupliquer.addEventListener('change', () => {
      ajoutForm.dupliquerDepuisId = selAjoutDupliquer.value;
      const source = produitsInventaire.find(p => p.id === ajoutForm.dupliquerDepuisId);
      if (source) { ajoutForm.categorieId = source.categorie_id; ajoutForm.zoneId = source.zone_id; ajoutForm.sensible = source.sensible; render(); }
    });
    const btnAjouterProduit = document.getElementById('btnAjouterProduit');
    if (btnAjouterProduit) btnAjouterProduit.addEventListener('click', ajouterProduitInventaire);
    const inputRechercheProduits = document.getElementById('rechercheProduits');
    if (inputRechercheProduits) {
      inputRechercheProduits.addEventListener('input', () => {
        rechercheProduitsTexte = inputRechercheProduits.value;
        render();
        const el = document.getElementById('rechercheProduits');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    document.querySelectorAll('[data-produit-ligne]').forEach(el => el.addEventListener('click', (e) => {
      if (e.target.closest('.toggle-switch') || e.target.closest('.etoile-sensible')) return;
      const id = el.dataset.produitLigne;
      ligneProduitOuverte = ligneProduitOuverte === id ? null : id;
      dupliquerVersOuvertPour = null;
      render();
    }));
    document.querySelectorAll('[data-toggle-actif]').forEach(el => el.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleActifProduit(el.dataset.toggleActif, el.dataset.actif !== '1');
    }));
    document.querySelectorAll('[data-etoile]').forEach(el => el.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = produitsInventaire.find(x => x.id === el.dataset.etoile);
      toggleSensibleProduit(el.dataset.etoile, !(p && p.sensible));
    }));
    document.querySelectorAll('[data-select-categorie]').forEach(el => el.addEventListener('change', () => changerCategorieProduit(el.dataset.selectCategorie, el.value)));
    document.querySelectorAll('[data-select-zone]').forEach(el => el.addEventListener('change', () => changerZoneProduit(el.dataset.selectZone, el.value)));
    document.querySelectorAll('[data-dupliquer-toggle]').forEach(el => el.addEventListener('click', () => {
      dupliquerVersOuvertPour = dupliquerVersOuvertPour === el.dataset.dupliquerToggle ? null : el.dataset.dupliquerToggle;
      render();
    }));
    document.querySelectorAll('[data-confirmer-duplication-categorie]').forEach(el => el.addEventListener('click', () => dupliquerVersCategorie(el.dataset.confirmerDuplicationCategorie)));
    document.querySelectorAll('[data-annuler-duplication-categorie]').forEach(el => el.addEventListener('click', () => { dupliquerVersOuvertPour = null; render(); }));

    // --- Parcours ---
    document.querySelectorAll('[data-sens-comptage]').forEach(el => el.addEventListener('click', () => changerSensComptage(el.dataset.sensComptage)));
    document.querySelectorAll('[data-zone-monter]').forEach(el => el.addEventListener('click', () => deplacerZone(el.dataset.zoneMonter, -1)));
    document.querySelectorAll('[data-zone-descendre]').forEach(el => el.addEventListener('click', () => deplacerZone(el.dataset.zoneDescendre, 1)));
    document.querySelectorAll('[data-cat-monter]').forEach(el => el.addEventListener('click', () => deplacerCategorie(el.dataset.catMonter, -1)));
    document.querySelectorAll('[data-cat-descendre]').forEach(el => el.addEventListener('click', () => deplacerCategorie(el.dataset.catDescendre, 1)));
    document.querySelectorAll('[data-jour-rotation]').forEach(el => el.addEventListener('click', () => toggleJourRotation(el.dataset.jourRotation, parseInt(el.dataset.jourIso))));

    // --- Règles ---
    const inputRechercheRegles = document.getElementById('rechercheRegles');
    if (inputRechercheRegles) {
      inputRechercheRegles.addEventListener('input', () => {
        rechercheReglesTexte = inputRechercheRegles.value;
        render();
        const el = document.getElementById('rechercheRegles');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    document.querySelectorAll('[data-profil-produit]').forEach(el => el.addEventListener('click', () => ouvrirEditionProfil(el.dataset.profilProduit)));
    document.querySelectorAll('[data-preset]').forEach(el => el.addEventListener('click', () => appliquerPreregleProfil(el.dataset.preset)));
    const regleRemiseAZeroEl = document.getElementById('regleRemiseAZero');
    if (regleRemiseAZeroEl) regleRemiseAZeroEl.addEventListener('change', (e) => { profilEnEdition.remise_a_zero_matin = e.target.checked; });
    const regleDureeMaxEl = document.getElementById('regleDureeMax');
    if (regleDureeMaxEl) regleDureeMaxEl.addEventListener('change', (e) => { profilEnEdition.duree_max_vente_jours = e.target.value ? parseInt(e.target.value) : null; render(); });
    const regleRetourFournisseurEl = document.getElementById('regleRetourFournisseur');
    if (regleRetourFournisseurEl) regleRetourFournisseurEl.addEventListener('change', (e) => { profilEnEdition.retour_fournisseur_autorise = e.target.checked; });
    const regleComptageEl = document.getElementById('regleComptage');
    if (regleComptageEl) regleComptageEl.addEventListener('change', (e) => {
      profilEnEdition.quarts_comptage = e.target.value === 'deux' ? null : [e.target.value];
    });
    const regleReapprovisionnableEl = document.getElementById('regleReapprovisionnable');
    if (regleReapprovisionnableEl) regleReapprovisionnableEl.addEventListener('change', (e) => { profilEnEdition.reapprovisionnable = e.target.checked; });
    const regleSeuilAlerteEl = document.getElementById('regleSeuilAlerte');
    if (regleSeuilAlerteEl) regleSeuilAlerteEl.addEventListener('change', (e) => { profilEnEdition.seuil_minimal = e.target.value ? parseFloat(e.target.value) : null; });
    const profilValidationManagerEl = document.getElementById('profilValidationManager');
    if (profilValidationManagerEl) profilValidationManagerEl.addEventListener('change', (e) => { profilEnEdition.validation_manager_requise = e.target.checked; });
    const profilComptageMasqueEl = document.getElementById('profilComptageMasque');
    if (profilComptageMasqueEl) profilComptageMasqueEl.addEventListener('change', (e) => { profilEnEdition.comptage_masque = e.target.checked; });
    const profilControleAleatoireEl = document.getElementById('profilControleAleatoire');
    if (profilControleAleatoireEl) profilControleAleatoireEl.addEventListener('change', (e) => { profilEnEdition.controle_aleatoire = e.target.checked; });
    const profilPhotoObligatoireEl = document.getElementById('profilPhotoObligatoire');
    if (profilPhotoObligatoireEl) profilPhotoObligatoireEl.addEventListener('change', (e) => { profilEnEdition.photo_obligatoire = e.target.checked; });
    const btnEnregistrerProfil = document.getElementById('btnEnregistrerProfil');
    if (btnEnregistrerProfil) btnEnregistrerProfil.addEventListener('click', enregistrerProfilProduit);
    const btnAnnulerProfil = document.getElementById('btnAnnulerProfil');
    if (btnAnnulerProfil) btnAnnulerProfil.addEventListener('click', () => { profilProduitOuvert = null; profilEnEdition = null; render(); });

    // --- Alertes ---
    async function enregistrerParametre(cle, valeur) { await sauvegarderParametresInventaire({ [cle]: valeur }); }
    const selFrequence = document.getElementById('paramFrequence');
    if (selFrequence) selFrequence.addEventListener('change', () => enregistrerParametre('reviewFrequency', selFrequence.value));
    const inputSeuilQte = document.getElementById('paramSeuilQte');
    if (inputSeuilQte) inputSeuilQte.addEventListener('change', () => { const v = parseFloat(inputSeuilQte.value); enregistrerParametre('quantityAlertThreshold', isNaN(v) ? DEFAULTS_PARAMETRES_INVENTAIRE.quantityAlertThreshold : v); });
    const inputSeuilValeur = document.getElementById('paramSeuilValeur');
    if (inputSeuilValeur) inputSeuilValeur.addEventListener('change', () => { const v = parseFloat(inputSeuilValeur.value); enregistrerParametre('valueAlertThreshold', inputSeuilValeur.value === '' || isNaN(v) ? null : v); });
    const selDelaiCloture = document.getElementById('paramDelaiCloture');
    if (selDelaiCloture) selDelaiCloture.addEventListener('change', () => enregistrerParametre('closureDelayMinutes', parseInt(selDelaiCloture.value)));
    const inputSeuilDemarque = document.getElementById('paramSeuilDemarque');
    if (inputSeuilDemarque) inputSeuilDemarque.addEventListener('change', () => { const v = parseFloat(inputSeuilDemarque.value); enregistrerParametre('seuilDemarquePct', inputSeuilDemarque.value === '' || isNaN(v) ? null : v); });
    const inputSeuilCasse = document.getElementById('paramSeuilCasse');
    if (inputSeuilCasse) inputSeuilCasse.addEventListener('change', () => { const v = parseFloat(inputSeuilCasse.value); enregistrerParametre('seuilCasseUnites', inputSeuilCasse.value === '' || isNaN(v) ? null : v); });
    const inputSeuilPeremption = document.getElementById('paramSeuilPeremption');
    if (inputSeuilPeremption) inputSeuilPeremption.addEventListener('change', () => { const v = parseInt(inputSeuilPeremption.value); enregistrerParametre('seuilPeremptionJours', isNaN(v) ? 2 : v); });
    document.querySelectorAll('.param-cat-check').forEach(el => el.addEventListener('change', () => {
      const actuels = new Set(parametresInventaire.immediateAlertCategoryIds || []);
      if (el.checked) actuels.add(el.dataset.cat); else actuels.delete(el.dataset.cat);
      enregistrerParametre('immediateAlertCategoryIds', Array.from(actuels));
    }));
    document.querySelectorAll('.toggle-switch').forEach(el => el.addEventListener('click', async () => {
      const actif = el.dataset.actif === '1';
      el.style.pointerEvents = 'none';
      if (el.dataset.mode === 'jaugeage') await toggleJaugeage(!actif);
      else if (el.dataset.mode === 'alertes-immediates') { await sauvegarderParametresInventaire({ immediateAlertsEnabled: !actif }); render(); }
      else if (el.dataset.mode === 'rappel-retour') { await sauvegarderParametresInventaire({ rappelRetourFournisseurActif: !actif }); render(); }
      else if (el.dataset.employe) await toggleModeAveugle(el.dataset.employe, !actif);
    }));

    // --- Simulation ---
    const simulationDateEl = document.getElementById('simulationDate');
    if (simulationDateEl) simulationDateEl.addEventListener('change', (e) => { simulationForm.date = e.target.value; });
    document.querySelectorAll('[data-simulation-quart]').forEach(el => el.addEventListener('click', () => { simulationForm.quart = el.dataset.simulationQuart; render(); }));
    const btnChargerSimulation = document.getElementById('btnChargerSimulation');
    if (btnChargerSimulation) btnChargerSimulation.addEventListener('click', async () => {
      simulationForm.employeId = document.getElementById('simulationEmploye').value;
      simulationForm.phase = document.getElementById('simulationPhase').value;
      const corpsEl = document.getElementById('simulationCorps');
      corpsEl.innerHTML = '<div class="loading">Chargement…</div>';
      simulationQuart = await chargerOuCreerQuartSimulation();
      if (!simulationQuart) { corpsEl.innerHTML = '<div class="empty">Erreur — réessayez.</div>'; return; }
      if (!produitsPourSimulation.length) produitsPourSimulation = await chargerTousProduitsActifsSite(siteId);
      simulationSaisie = await chargerComptagesSimulation(simulationQuart.id, simulationForm.phase);
      simulationChrono = Date.now();
      corpsEl.innerHTML = renderCorpsSimulation();
      const btnEnregistrer = document.getElementById('btnEnregistrerSimulation');
      if (btnEnregistrer) btnEnregistrer.addEventListener('click', enregistrerSimulation);
    });
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    managerCourant = employee;
    siteId = employee.site_id || 'vito-sainte-marie';
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-Parametres-Inventaire-v1.html', siteId))) return;
    document.getElementById('titre').textContent = 'Paramètres Inventaire';

    [produitsInventaire, zonesSite, categoriesSite, employesSite, parametresInventaire, reglesProduitMap, modesAveugleActifs, jaugeageActif] = await Promise.all([
      chargerProduitsInventaire(siteId), chargerZonesSite(siteId), chargerCategoriesSite(siteId), chargerEmployesSite(siteId),
      chargerParametresInventaire(siteId), chargerReglesProduit(siteId), chargerModesAveugleActifs(siteId), chargerModeJaugeageActif(siteId),
    ]);
    render();
  });
</script>
</body>
</html>
