<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07131E">
<title>NEXUS · Actualiser mes ventes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="nexus-theme.js"></script>
<style>
:root{
  --t-bg:#07131E; --t-panel:#0D202E; --t-raised:#0F2433; --t-line:#254354;
  --t-text:#EDF1F5; --t-mid:#9AA8B6; --t-cyan:#24D8E3; --t-green:#29C98A; --t-amber:#F5A12A; --t-red:#F0707A;
  --boutique:#C47A55; --boutique-rgb:196,122,85; --piste:#3F6E94; --piste-rgb:63,110,148;
  --t-mono:'IBM Plex Mono',ui-monospace,monospace; --t-sans:'IBM Plex Sans',system-ui,sans-serif;
  --banniere-cadrage:70% 50%;
}
:root[data-theme="jour"]{
  --t-bg:#F4F6F8; --t-panel:#FFFFFF; --t-raised:#EEF2F5; --t-line:#D5DCE3;
  --t-text:#0F172A; --t-mid:#475569; --t-cyan:#0B7285; --t-green:#047857; --t-amber:#B45309; --t-red:#B91C1C;
  --boutique:#7A4A3A; --boutique-rgb:122,74,58; --piste:#8DB4D4; --piste-rgb:141,180,212;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--t-bg); color:var(--t-text); font-family:var(--t-sans); min-height:100vh;}
body{display:flex; justify-content:center;}
a{color:inherit;}
.app{width:100%; max-width:1100px; min-height:100vh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 16px 40px; overflow-x:hidden;}

/* En-tête avec image */
.header{position:relative; margin:12px 0 0; border-radius:14px; overflow:hidden; border:1px solid var(--t-line); min-height:190px; display:flex; align-items:flex-end; background:var(--t-panel);}
.header img.entete{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--banniere-cadrage);}
.header::after{content:''; position:absolute; inset:0; background:linear-gradient(0deg, rgba(7,19,30,.86) 0%, rgba(7,19,30,.55) 45%, rgba(7,19,30,.15) 100%);}
:root[data-theme="jour"] .header::after{background:linear-gradient(0deg, rgba(7,19,30,.78) 0%, rgba(7,19,30,.45) 45%, rgba(7,19,30,.08) 100%);}
@media (max-width:599px){
  .header{min-height:210px;}
  .header::after, :root[data-theme="jour"] .header::after{background:linear-gradient(0deg, rgba(7,19,30,.94) 0%, rgba(7,19,30,.82) 50%, rgba(7,19,30,.5) 100%);}
}
.header-texte{position:relative; z-index:1; padding:18px; width:100%; color:#EDF1F5;}
.eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#7FE9F0;}
.title{font-size:26px; font-weight:600; margin-top:4px;}
.subtitle{font-size:14px; color:#C9D3DC; margin-top:4px;}
.menu-btn{position:absolute; z-index:2; top:12px; left:12px; text-decoration:none; font-size:12px; padding:9px 13px; min-height:44px; display:inline-flex; align-items:center; border-radius:20px; background:rgba(7,19,30,.72); color:#EDF1F5; border:1px solid rgba(255,255,255,.25);}
.menu-btn:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}

.carte{background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:18px;}
.titre-section{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-mid); margin:28px 0 12px; display:flex; align-items:center; gap:10px;}
.titre-section::after{content:''; flex:1; height:1px; background:var(--t-line);}

/* Conseiller */
.conseiller{border-color:var(--t-cyan); margin-top:18px; display:flex; gap:14px; align-items:flex-start;}
.conseiller-avatar{width:80px;height:80px;border-radius:50%;flex:none;object-fit:cover;}
.conseiller-sous{font-size:18px;font-weight:600;line-height:1.3;color:var(--t-text);margin-bottom:6px;}
@media (min-width:768px){.conseiller{gap:22px;align-items:center;} .conseiller-avatar{width:120px;height:120px;}}
.conseiller-corps{min-width:0;}
.conseiller-titre{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-cyan); margin-bottom:6px;}
.conseiller p{font-size:14.5px; line-height:1.6; margin-top:4px; overflow-wrap:anywhere;}

.btn{font-family:var(--t-sans); font-size:14px; font-weight:600; min-height:44px; padding:10px 18px; border-radius:10px; border:1px solid rgba(var(--boutique-rgb),.7); background:rgba(var(--boutique-rgb),.14); color:var(--t-text); cursor:pointer; margin-top:18px;}
.btn:hover{background:rgba(var(--boutique-rgb),.24);}
.btn:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.btn[disabled]{opacity:.6; cursor:default;}

/* Formulaire */
.promo-form{display:none; margin-top:14px;}
.promo-form.open{display:block;}
.champ{margin-bottom:16px;}
.champ:last-child{margin-bottom:0;}
.champ label{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--t-mid); margin-bottom:8px;}
.champ input[type=text], .champ input[type=date]{width:100%; background:var(--t-raised); border:1px solid var(--t-line); border-radius:8px; padding:10px 11px; min-height:44px; color:var(--t-text); font-family:var(--t-sans); font-size:14px;}
.champ input:focus-visible{outline:2px solid var(--t-cyan); outline-offset:1px;}
.dates{display:flex; gap:10px; flex-wrap:wrap;}
.dates > div{flex:1 1 140px; min-width:0;}
.groupe{display:flex; flex-wrap:wrap; gap:8px;}
.pill{font-family:var(--t-sans); font-size:12.5px; padding:10px 14px; min-height:44px; border-radius:22px; border:1px solid var(--t-line); background:var(--t-raised); color:var(--t-mid); cursor:pointer;}
.pill.active{border-color:var(--t-cyan); color:var(--t-cyan); font-weight:600; background:color-mix(in srgb, var(--t-cyan) 12%, transparent);}
.pill:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.ligne-ajout{display:flex; gap:8px;}
.ligne-ajout input{flex:1; min-width:0;}
.sugg{display:none; margin-top:6px; border:1px solid var(--t-line); border-radius:8px; background:var(--t-raised); overflow:hidden;}
.sugg.open{display:block;}
.sugg-liste{max-height:264px; overflow-y:auto;}
.champ .sugg-ligne{display:flex; letter-spacing:normal; text-transform:none; margin-bottom:0; align-items:center; gap:10px; width:100%; box-sizing:border-box; border-bottom:1px solid var(--t-line); padding:0 12px; height:44px; color:var(--t-text); font-family:var(--t-sans); font-size:13.5px; cursor:pointer;}
.sugg-ligne input{width:20px; height:20px; flex:none; margin:0;}
.sugg-ligne span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sugg-ligne.actif, .sugg-ligne:hover{background:color-mix(in srgb, var(--t-cyan) 12%, transparent);}
.sugg-pied{padding:8px 12px;}
.sugg-total{display:block; font-size:12px; color:var(--t-muted, var(--t-text)); margin-bottom:6px;}
.sugg-pied .btn{margin-top:0;}
.sugg-pied .btn:disabled{opacity:.5; cursor:default;}
.reprise{display:none; margin-top:10px;}
.reprise.open{display:block;}
.reprise .groupe{margin-top:10px;}
.reprise .pill{min-height:44px;}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chips .vide{font-size:12px; color:var(--t-mid);}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:6px 6px 6px 12px; border-radius:18px; background:var(--t-raised); border:1px solid var(--t-line); overflow-wrap:anywhere;}
.chip button{background:none; border:0; color:var(--t-mid); cursor:pointer; min-width:32px; min-height:32px; font-size:14px;}
.msg-erreur{margin-top:10px; padding:9px 11px; background:color-mix(in srgb, var(--t-red) 14%, transparent); color:var(--t-red); border-radius:8px; font-size:12.5px;}
.msg-ok{margin-top:10px; padding:9px 11px; background:color-mix(in srgb, var(--t-green) 14%, transparent); color:var(--t-green); border-radius:8px; font-size:12.5px; text-align:center;}

/* Promotions */
.promo{background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:16px; margin-bottom:10px;}
.promo-haut{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.promo-nom{font-size:15px; font-weight:600; overflow-wrap:anywhere; min-width:0;}
.promo-dates{font-family:var(--t-mono); font-size:11.5px; color:var(--t-mid); margin-top:3px;}
.statut{font-size:11px; padding:4px 10px; border-radius:20px; border:1px solid var(--t-line); color:var(--t-mid); white-space:nowrap;}
.statut.encours{color:var(--t-green); border-color:var(--t-green);}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
.badge{font-size:11px; padding:4px 10px; border-radius:20px; background:var(--t-raised); color:var(--t-mid); overflow-wrap:anywhere;}
.promo-produits{font-size:12.5px; color:var(--t-mid); line-height:1.5; margin-bottom:8px; overflow-wrap:anywhere;}
.promo-produits b{color:var(--t-text);}
.ligne{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:7px 0; border-top:1px solid var(--t-line);}
.ligne .cle{color:var(--t-mid);}
.ligne .val{font-family:var(--t-mono); font-weight:500; text-align:right;}
.note{font-size:12.5px; color:var(--t-mid); line-height:1.5; padding-top:8px; border-top:1px solid var(--t-line);}
.sous-titre{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--t-mid); margin:10px 0 2px;}
.vide{padding:24px 8px; text-align:center; color:var(--t-mid); font-size:13px;}
/* Bilan visuel */
.ico-p{display:inline-block; width:28px; height:28px; flex:none; object-fit:contain; vertical-align:middle;}
.ico-t{width:22px; height:22px;}
.conseiller-titre{display:flex; align-items:center; gap:8px;}
.bilan{background:var(--t-panel); border:1px solid var(--t-amber); border-radius:14px; padding:18px; margin-top:12px;}
.b-entete{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.b-eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-amber);}
.b-nom{font-size:20px; font-weight:600; margin-top:4px; overflow-wrap:anywhere;}
.b-meta{font-size:13px; color:var(--t-mid); margin-top:4px; line-height:1.5;}
.b-meta span{display:inline-flex; align-items:center; gap:6px; margin-right:12px;}
.b-grille{display:grid; grid-template-columns:1fr; gap:16px; margin-top:16px;}
.b-tuiles{display:grid; grid-template-columns:1fr; gap:10px;}
.b-tuile{background:var(--t-raised); border:1px solid var(--t-line); border-radius:12px; padding:14px; min-width:0;}
.b-tuile-haut{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--t-mid);}
.b-val{font-family:var(--t-sans); font-size:21px; font-weight:600; margin-top:8px; overflow-wrap:anywhere;}
.b-sous{font-size:12.5px; color:var(--t-mid); line-height:1.45; margin-top:4px; overflow-wrap:anywhere;}
.b-g5{font-size:12.5px; font-weight:600; margin-top:6px; color:var(--t-text);}
.b-g5.hausse{color:var(--t-green);}
.b-g5.baisse{color:var(--t-red);}
.b-lateral{display:flex; flex-direction:column; gap:12px; min-width:0;}
.b-bloc{background:var(--t-raised); border:1px solid var(--t-line); border-radius:12px; padding:14px;}
.b-bloc h3{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--t-mid); margin-bottom:10px;}
.b-etat{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px;}
.b-etat img{width:24px; height:24px;}
.b-bloc ul{list-style:none; display:flex; flex-direction:column; gap:8px; font-size:13.5px; line-height:1.5;}
.b-bloc li{overflow-wrap:anywhere;}
.b-graphe{margin-top:16px;}
.b-barres{display:flex; align-items:flex-end; justify-content:space-around; gap:12px; height:170px; padding-top:8px; border-bottom:1px solid var(--t-line);}
.b-col{flex:1; max-width:120px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0;}
.b-barre{width:100%; border-radius:6px 6px 0 0; background:rgba(var(--boutique-rgb),.45); min-height:3px;}
.b-col.pendant .b-barre{background:var(--boutique);}
.t-carburant .b-barre{background:rgba(var(--piste-rgb),.45);}
.t-carburant .b-col.pendant .b-barre{background:var(--piste);}
.t-mixte .b-barre{background:linear-gradient(to top,rgba(var(--boutique-rgb),.45),rgba(var(--piste-rgb),.45));}
.t-mixte .b-col.pendant .b-barre{background:linear-gradient(to top,var(--boutique),var(--piste));}
.b-barre-val{font-family:var(--t-sans); font-weight:600; font-size:13px; margin-bottom:4px; white-space:nowrap;}
.b-legendes{display:flex; justify-content:space-around; gap:12px;}
.b-legende{flex:1; max-width:120px; text-align:center; font-size:12px; color:var(--t-mid); padding-top:6px; min-width:0;}
.b-legende b{display:block; color:var(--t-text); font-weight:600;}
.b-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
.b-actions .btn{margin-top:10px;}
.b-detail{margin-top:16px; border-top:1px solid var(--t-line); padding-top:4px;}
.b-detail[hidden]{display:none;}
.c-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.c-actions .btn{flex:1 1 140px; margin-top:0;}
.b-carte-wrap{display:flex; flex-direction:column; gap:8px;}
.form-titre{font-size:15px; font-weight:600; margin-bottom:12px;}
.form-titre[hidden], #formNote[hidden], .fiche[hidden]{display:none;}
.fiche .promo-nom{font-size:16px;}
.b-cartes{display:grid; grid-template-columns:1fr; gap:10px;}
.b-carte{display:block; width:100%; text-align:left; font-family:var(--t-sans); color:var(--t-text); background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:14px 16px; min-height:44px; cursor:pointer;}
.b-carte:hover{border-color:rgba(var(--boutique-rgb),.7);}
.b-carte:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.b-carte .promo-nom{margin-bottom:2px;}
.b-carte .ligne:first-of-type{margin-top:8px;}
.b-carte-lien{display:block; margin-top:8px; font-size:12.5px; font-weight:600; color:var(--t-cyan);}
@media (min-width:768px){
  .b-grille{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);}
  .b-tuiles{grid-template-columns:1fr 1fr;}
  .b-cartes{grid-template-columns:1fr 1fr;}
}
.intro-historique{font-size:13px; color:var(--t-mid); margin-bottom:12px; line-height:1.5;}
.intro-historique b{color:var(--t-text);}

/* Six cartes : une colonne en mobile, deux ensuite, jamais de défilement horizontal */
.tuiles{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:600px){.tuiles{grid-template-columns:1fr 1fr;}}
@media (min-width:900px){.tuiles{grid-template-columns:repeat(3,1fr);}}
.tuile{min-height:44px; background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:16px; font-size:13.5px; cursor:default; min-width:0;}
.picto-p{display:block; width:56px; height:56px; margin-bottom:8px;}
.t-titre{display:block; font-weight:600; font-size:14.5px; overflow-wrap:anywhere;}
.t-sous{display:block; font-size:12px; color:var(--t-mid); margin-top:4px; line-height:1.5;}
.prep{display:inline-block; margin-top:10px; font-size:11px; padding:3px 10px; border-radius:20px; background:var(--t-raised); color:var(--t-mid);}

/* Planche de démonstration des états */
.etats{display:flex; flex-wrap:wrap; gap:10px;}
.etat{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 14px; border-radius:22px; border:1px solid var(--t-line); background:var(--t-raised); color:var(--t-text);}
.etat img, .etat svg{width:24px; height:24px; flex:none;}
.etat.e-insuffisante{border-color:var(--t-red);}
.etat.e-a-ameliorer{border-color:var(--t-amber);}
.etat.e-encourageante{border-color:var(--t-cyan);}
.etat.e-a-renouveler{border-color:var(--t-green);}
.etat.e-non-mesurable{border-color:var(--t-mid); border-style:dashed;}
.reserve{margin:40px auto; padding:24px; text-align:center; color:var(--t-mid);}

/* Simulateur de promotion */
.tuile.disponible{position:relative; display:block; width:100%; text-align:left; font-family:var(--t-sans); color:var(--t-text); text-decoration:none; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
.tuile.disponible::after{content:"\203A"; position:absolute; right:14px; bottom:10px; font-size:22px; line-height:1; color:var(--t-mid); opacity:.8;}
.tuile.disponible:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.tuile.disponible:active{transform:scale(.99); filter:brightness(.95);}
.tuile.prioritaire{border-color:var(--t-cyan);}
@media (hover: hover) and (pointer: fine){
  .tuile.disponible:hover{transform:translateY(-3px) scale(1.015); box-shadow:0 6px 14px rgba(0,0,0,.18); border-color:var(--t-cyan);}
  .tuile.disponible:hover::after{opacity:1; color:var(--t-text);}
}
@media (prefers-reduced-motion: reduce){
  .tuile.disponible{transition:none;}
  .tuile.disponible:hover, .tuile.disponible:active{transform:none;}
}
/* Promotion en cours */
.ec{background:var(--t-panel); border:1px solid var(--t-line); border-radius:18px; padding:24px; margin-top:12px;}
.ec-haut{display:flex; gap:20px; align-items:center;}
.ec-vignette{width:120px; height:120px; border-radius:18px; flex:none; object-fit:cover; background:var(--t-raised);}
.ec-surtitre{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-cyan);}
.ec-nom{font-size:28px; font-weight:600; line-height:1.2; margin:4px 0; overflow-wrap:anywhere;}
.ec-dates{font-size:14px; color:var(--t-text);}
.ec-ligne{font-size:13.5px; color:rgb(var(--boutique-rgb)); margin-top:4px;}
.ec-statut{margin-left:auto; align-self:flex-start;}
.ec-avance{margin-top:22px;}
.ec-avance-haut{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:8px;}
.ec-piste{height:10px; border-radius:6px; background:var(--t-raised); overflow:hidden;}
.ec-piste > div{height:100%; background:rgb(var(--boutique-rgb)); border-radius:6px;}
.ec-note{font-size:12px; color:var(--t-mid); margin-top:6px;}
.ec-tuiles{display:grid; grid-template-columns:1fr; gap:10px; margin-top:20px;}
.ec-tuile{background:var(--t-raised); border:1px solid var(--t-line); border-radius:14px; padding:14px; min-width:0;}
.ec-tuile-haut{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--t-mid);}
.ec-tuile-haut img{width:28px; height:28px; flex:none;}
.ec-val{font-family:var(--t-sans); font-weight:600; font-size:20px; margin-top:8px; overflow-wrap:anywhere;}
.ec-actions{display:flex; gap:10px; margin-top:20px; padding-top:18px; border-top:1px solid var(--t-line); flex-wrap:wrap;}
.ec-actions .btn{margin-top:0; min-height:44px;}
.ec-actions .ec-suivre{flex:1 1 60%;}
.ec-actions .ec-modifier{background:transparent; display:inline-flex; align-items:center; justify-content:center; gap:8px;}
.ec-actions svg{width:16px; height:16px;}
@media (min-width:768px){ .ec-tuiles{grid-template-columns:repeat(3,1fr);} .b-tuiles{grid-template-columns:1fr 1fr;} }
@media (max-width:767px){ .ec{padding:16px;} .ec-vignette{width:64px; height:64px; border-radius:14px;} .ec-nom{font-size:22px;} .ec-haut{align-items:flex-start;} }
/* Dernier bilan */
.b-retenir{background:var(--t-raised); border:1px solid var(--t-line); border-radius:14px; padding:14px; margin-top:14px; display:flex; gap:12px; align-items:flex-start;}
.b-retenir h3{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-cyan); margin-bottom:4px;}
.b-retenir p{font-size:14px; line-height:1.55;}
.b-pied{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:16px;}
.b-lien{background:none; border:0; padding:8px 0; min-height:44px; font:inherit; font-size:14px; cursor:pointer; color:var(--t-cyan);}
.b-lien.discret{color:var(--t-mid);}
.b-sous-titre-graphe{font-size:12px; color:var(--t-mid); margin:-4px 0 8px;}

@media (min-width:600px){.sim-grille{grid-template-columns:1fr 1fr;}}

.sim-grille input, .sim-produit input{display:block; width:100%; min-width:0; min-height:44px; margin-top:4px; box-sizing:border-box; background:var(--t-raised); border:1px solid var(--t-line); border-radius:8px; color:var(--t-text); padding:8px 10px; font-family:var(--t-sans); font-size:14px;}

.sim-alerte{font-size:12.5px; margin-top:6px; color:var(--t-amber); overflow-wrap:anywhere;}
.sim-aide{margin-top:10px; font-size:12.5px;}
.sim-aide summary{cursor:pointer; min-height:44px; display:flex; align-items:center;}
.sim-res{margin-top:12px; font-size:13.5px; overflow-wrap:anywhere;}
.sim-res .ligne-res{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--t-line);}

.retour:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
details.compar{margin-top:14px; background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px;}

.obj-ligne .obj-haut{display:grid; grid-template-columns:1fr; gap:10px; align-items:end;}
@media (min-width:768px){.obj-ligne .obj-haut{grid-template-columns:minmax(120px,1.3fr) 104px 104px minmax(110px,1fr) minmax(110px,1fr) minmax(120px,1fr);}}

@media (min-width:768px){.obj-ligne .obj-duo{display:contents;}}
.obj-grille{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
@media (max-width:480px){.obj-grille{grid-template-columns:1fr 1fr;}}
.obj-ligne label{display:block; font-size:12px; color:var(--t-mid); min-width:0;}
.obj-ligne input{display:block; width:100%; min-width:0; min-height:44px; margin-top:4px; box-sizing:border-box; background:var(--t-raised); border:1px solid var(--t-line); border-radius:8px; color:var(--t-text); padding:8px 10px; font-family:var(--t-sans); font-size:14px;}
.obj-cel{font-family:var(--t-sans); font-size:13px; color:var(--t-mid); min-width:0; overflow-wrap:anywhere;}
.obj-cel b{display:block; font-family:var(--t-sans); font-size:15px; color:var(--t-text); font-weight:600;}
details.obj-hab{margin-top:8px;}

details.obj-hab summary::-webkit-details-marker{display:none;}
details.obj-hab summary::after{content:'▾'; transition:transform .2s;}

.sim-choix{display:block; font-size:12.5px; color:var(--t-mid); margin-top:6px;}
.sim-choix select{display:block; width:100%; min-height:44px; margin-top:4px; box-sizing:border-box; background:var(--t-raised); color:var(--t-text); border:1px solid var(--t-line); border-radius:8px; padding:8px 10px; font-family:var(--t-sans); font-size:14px; color-scheme:dark;}
.obj-res{margin-top:10px; font-size:13.5px; overflow-wrap:anywhere;}
.obj-chiffre{font-family:var(--t-mono); font-size:22px; font-weight:600; color:var(--t-text);}
.obj-barre{height:8px; border-radius:6px; background:var(--t-raised); margin-top:8px; overflow:hidden;}

<script>
const V = window.NexusVocab.campagne, P = V.ventesPage;
const M = NexusImportMoteur, D = NexusImportDonnees, CV = NexusCampagneVentes;
let EMPLOYEE = null, SITE_ID = null, CAMPAGNES = [], CAMPAGNE = null, OBJECTIFS = [], POINTS = [], ANNULATIONS = [];
let FICHIER = null, HEADERS = [], ROWS = [], MAPPING = null, MAPPING_AUTO = null, ANALYSE = null;
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jma(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(iso || ''); }
function aujourdhui(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmt(v, d){ return Number(v).toLocaleString('fr-FR', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}); }
function msg(id, texte, alerte){ const e = $(id); e.textContent = texte || ''; e.className = 'vt-msg' + (alerte ? ' vt-alerte' : ''); }

function parserTableHTML(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const t = doc.querySelector('table'); if (!t) return [];
  const lignes = Array.from(t.querySelectorAll('tr')); if (!lignes.length) return [];
  const heads = Array.from(lignes[0].querySelectorAll('th,td')).map(c => c.textContent.trim());
  return lignes.slice(1).map(tr => { const cells = Array.from(tr.querySelectorAll('td,th')).map(c => c.textContent.trim()); const o = {}; heads.forEach((h, i) => { o[h] = cells[i] == null ? '' : cells[i]; }); return o; })
    .filter(o => Object.values(o).some(v => String(v).trim() !== ''));
}
function lireFichier(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(fr.error);
    fr.onload = e => {
      try {
        const data = e.target.result;
        const debut = new TextDecoder('utf-8').decode(new Uint8Array(data).slice(0, 512)).toLowerCase();
        if (debut.includes('<html') || debut.includes('<table')) { resolve(parserTableHTML(new TextDecoder('utf-8').decode(new Uint8Array(data)))); return; }
        const wb = XLSX.read(data, {type: 'array'});
        resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: ''}));
      } catch (err) { reject(err); }
    };
    fr.readAsArrayBuffer(file);
  });
}
function detecterColonneCa(entetes){
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  return (entetes || []).find(e => { const n = norm(e); return !/ttc/.test(n) && (/^ca( ht)?$/.test(n) || /chiffre d affaires?/.test(n) || /^ca ht /.test(n)); }) || null;
}
function articlesPromo(){ return OBJECTIFS.map(o => o.article); }
function derniersObjectifs(rows){
  const m = new Map();
  rows.forEach(r => { const a = m.get(r.article); if (!a || r.version > a.version) m.set(r.article, r); });
  return Array.from(m.values());
}
async function chargerCampagne(){
  const [o, p, a] = await Promise.all([
    nexusClient.from('campagne_objectifs_produits').select('article, version, seuil_unites, objectif_valide_jour, pa_promo_ht').eq('campagne_id', CAMPAGNE.id).eq('site', SITE_ID).order('version', {ascending: true}),
    nexusClient.from('campagne_ventes_points').select('batch_id, article, date_fin, importe_le, quantite, ca_ht, absent_du_fichier').eq('campagne_id', CAMPAGNE.id).eq('site', SITE_ID).order('importe_le', {ascending: false}),
    nexusClient.from('campagne_ventes_annulations').select('batch_id, motif').eq('site', SITE_ID),
  ]);
  if (o.error) console.error(o.error); if (p.error) console.error(p.error); if (a.error) console.error(a.error);
  OBJECTIFS = derniersObjectifs(o.data || []); POINTS = p.data || []; ANNULATIONS = a.data || [];
  peindreSuivi(); peindreHisto();
  $('vtRapport').hidden = true; ANALYSE = null;
}
function libStatut(s){ return s === 'moteur' ? P.moteur : s === 'a_revoir' ? P.aRevoir : P.nonMesurable; }
function libEffort(e){ if (!e) return ''; if (e.etat === 'atteint') return P.atteint; if (e.etat === 'termine') return P.termine; return P.parJour(fmt(e.parJour)); }
function peindreSuivi(){
  const pt = CV.pointCourant(POINTS, ANNULATIONS);
  const s = CV.suivre({point: pt, objectifs: OBJECTIFS, campagneDebut: CAMPAGNE.date_debut, campagneFin: CAMPAGNE.date_fin});
  if (s.vide){ $('vtSuivi').innerHTML = '<div>' + esc(P.vide) + '</div>'; return; }
  const lignes = s.lignes.map(l => '<tr><td>' + esc(l.article) + (l.absent_du_fichier ? '<br><small>' + esc(P.absentMarque) + '</small>' : '') + '</td>'
    + '<td class="n">' + fmt(l.vendu) + '</td><td class="n">' + (l.seuil == null ? '' : fmt(l.seuil)) + '</td>'
    + '<td>' + esc(libEffort(l.effort)) + '</td><td class="n">' + (l.marge_ht == null ? esc(P.margeInconnue) : fmt(l.marge_ht, 2) + ' €') + '</td>'
    + '<td>' + esc(libStatut(l.statut)) + '</td></tr>').join('');
  $('vtSuivi').innerHTML = '<div>' + esc(P.pointDu(jma(s.date_fin))) + '</div><table class="vt-table"><thead><tr><th>' + esc(P.colArticle) + '</th><th>' + esc(P.colVendu) + '</th><th>' + esc(P.colSeuil) + '</th><th>' + esc(P.colEffort) + '</th><th>' + esc(P.colMarge) + '</th><th>' + esc(P.colStatut) + '</th></tr></thead><tbody>' + lignes + '</tbody></table>';
}
function peindreHisto(){
  const h = CV.historique(POINTS, ANNULATIONS);
  $('vtHisto').hidden = !h.length;
  $('vtHistoCorps').innerHTML = h.map(x => '<div class="obj-histo">' + esc(jma(x.date_fin)) + ' · ' + esc(String(x.importe_le || '').slice(0, 10).split('-').reverse().join('/'))
    + (x.annule ? ' · ' + esc(P.annule) + ' (' + esc(P.motif) + ' : ' + esc(x.motif) + ')'
      : ' · <button type="button" class="btn-lien" data-annuler="' + esc(x.batch_id) + '">' + esc(P.annulerImport) + '</button>'
        + '<span class="vt-annul" data-zone="' + esc(x.batch_id) + '" hidden> <input type="text" data-motif="' + esc(x.batch_id) + '" placeholder="' + esc(P.motifDemande) + '"> '
        + '<button type="button" data-confirmer="' + esc(x.batch_id) + '">' + esc(P.confirmerAnnulation) + '</button> <button type="button" data-renoncer="' + esc(x.batch_id) + '">' + esc(P.annuler) + '</button></span>')
    + '</div>').join('');
  $('vtHistoCorps').querySelectorAll('[data-annuler]').forEach(b => b.addEventListener('click', () => {
    const z = $('vtHistoCorps').querySelector('[data-zone="' + b.getAttribute('data-annuler') + '"]'); if (z) z.hidden = false; }));
  $('vtHistoCorps').querySelectorAll('[data-renoncer]').forEach(b => b.addEventListener('click', () => {
    const z = $('vtHistoCorps').querySelector('[data-zone="' + b.getAttribute('data-renoncer') + '"]'); if (z) z.hidden = true; }));
  $('vtHistoCorps').querySelectorAll('[data-confirmer]').forEach(b => b.addEventListener('click', () => annulerImport(b.getAttribute('data-confirmer'))));
}
async function annulerImport(batchId){
  const champ = $('vtHistoCorps').querySelector('[data-motif="' + batchId + '"]');
  const motif = champ ? champ.value.trim() : '';
  if (!motif){ msg('vtPublierMsg', P.motifRequis, true); return; }
  if (EMPLOYEE.role !== 'manager' && EMPLOYEE.role !== 'gerant'){ msg('vtPublierMsg', P.annulationEchec, true); return; }
  const r = await nexusClient.from('campagne_ventes_annulations').insert({site: SITE_ID, batch_id: batchId, motif, annule_par: EMPLOYEE.id});
  if (r.error){ console.error(r.error); msg('vtPublierMsg', P.annulationEchec, true); return; }
  await D.journaliser(nexusClient, {batchId, site: SITE_ID, action: 'annulation', employeId: EMPLOYEE.id, details: {motif, source: 'campagne-v2-ventes'}});
  msg('vtPublierMsg', P.annulationFaite);
  await chargerCampagne();
}
function dernierImportFin(){ const pt = CV.pointCourant(POINTS, ANNULATIONS); return pt ? pt.date_fin : null; }

async function analyser(){
  msg('vtAnalyseMsg', ''); $('vtRapport').hidden = true; ANALYSE = null;
  const dateFin = $('vtDateFin').value;
  const refus = CV.verifierDateFin(dateFin, {aujourdhui: aujourdhui(), campagneDebut: CAMPAGNE.date_debut, campagneFin: CAMPAGNE.date_fin, dernierImportFin: dernierImportFin()});
  if (refus){ msg('vtAnalyseMsg', refus, true); return; }
  if (!FICHIER || !ROWS.length){ msg('vtAnalyseMsg', 'Choisissez d’abord un fichier de ventes.', true); return; }
  const k = MAPPING;
  if (!k.article || !k.quantite || !k.prix_vente){
    const man = [!k.article && 'Article', !k.quantite && 'Quantité', !k.prix_vente && 'Prix de vente HT'].filter(Boolean).join(', ');
    msg('vtAnalyseMsg', P.colonnesManquantes(man), true); return;
  }
  const aliases = await D.chargerAliasProduits(nexusClient, SITE_ID, 'campagne');
  const promo = new Set(articlesPromo().map(a => String(a).trim().toLowerCase()));
  const vus = new Set(), ignores = [];
  const colCa = detecterColonneCa(HEADERS);
  const lignes = ROWS.map(r => {
    const brut = String(r[k.article] || '');
    if (!brut) return {invalide: true, raisonInvalide: 'Article manquant.', valeurs: null};
    const q = M.toNumber(r[k.quantite]), pv = M.toNumber(r[k.prix_vente]);
    const caF = colCa ? M.toNumber(r[colCa]) : NaN;
    const article = M.resoudreAlias(brut, aliases) || brut;
    const cle = article.trim().toLowerCase();
    if (promo.has(cle)) vus.add(cle); else ignores.push(article);
    return {valeurs: {periodeDebut: CAMPAGNE.date_debut, periodeFin: dateFin, categorie: k.categorie ? M.corrigerCategorie(String(r[k.categorie] || 'Non classé'), article) : 'Non classé', article,
      quantite: isNaN(q) ? null : q, prix_vente: isNaN(pv) ? null : pv, ca_fichier: isNaN(caF) ? null : caF, prix_achat: null, tva: null, code_barres: null,
      ca: (!isNaN(q) && !isNaN(pv)) ? Math.round(q * pv * 100) / 100 : 0, marge: 0}};
  });
  const resultats = M.classifierLignesImport({intention: 'campagne', lignes, connuesParCle: new Map()});
  const absents = articlesPromo().filter(a => !vus.has(String(a).trim().toLowerCase()));
  const rapport = M.construireQualityReport({lignesTotal: resultats.length, resultats, referencesInconnues: [], joursManquants: []});
  ANALYSE = {dateFin, caColonne: colCa, resultats, rapport, ignores: Array.from(new Set(ignores)), absents};
  $('vtRapportCorps').innerHTML = '<div>' + esc(P.fichierLu(ROWS.length)) + '</div>'
    + '<div class="vt-msg">' + esc(colCa ? P.caFichier + ' : ' + colCa : P.caEstime) + '</div>'
    + '<div class="vt-msg">' + esc(ANALYSE.ignores.length ? P.ignores(ANALYSE.ignores.length) : '') + '</div>'
    + (ANALYSE.ignores.length ? '<div class="obj-histo">' + esc(ANALYSE.ignores.join(', ')) + '</div>' : '')
    + '<div class="vt-msg">' + esc(absents.length ? P.absents(absents.length) : P.toutPresent) + '</div>'
    + (absents.length ? '<div class="obj-histo">' + esc(absents.join(', ')) + '</div>' : '');
  $('vtRapport').hidden = false;
}
async function publier(){
  if (!ANALYSE) return;
  msg('vtPublierMsg', ''); $('vtPublier').disabled = true;
  let batch = null;
  try {
    const hash = FICHIER ? await D.calculerHashFichier(await FICHIER.arrayBuffer()) : null;
    batch = await D.creerBatch(nexusClient, {site: SITE_ID, intention: 'campagne', fichierNom: FICHIER.name, fichierTailleOctets: FICHIER.size, fichierHash: hash,
      periodeDebut: CAMPAGNE.date_debut, periodeFin: ANALYSE.dateFin, campagneId: CAMPAGNE.id, phase: 'pendant', auteurId: EMPLOYEE.id});
    if (!batch) throw new Error('batch');
    await D.journaliser(nexusClient, {batchId: batch.id, site: SITE_ID, action: 'depot_fichier', employeId: EMPLOYEE.id, details: {fichier: FICHIER.name, source: 'campagne-v2-ventes'}});
    await D.enregistrerLignesBrutes(nexusClient, batch.id, ROWS);
    await D.enregistrerMapping(nexusClient, batch.id, SITE_ID, 'campagne', MAPPING, MAPPING_AUTO, EMPLOYEE.id);
    await D.enregistrerResultats(nexusClient, batch.id, ANALYSE.resultats);
    await D.enregistrerQualityReport(nexusClient, batch.id, ANALYSE.rapport);
    await D.marquerBatchStatut(nexusClient, batch.id, 'ready', {analyse_le: new Date().toISOString()});
    const r = await nexusClient.rpc('campagne_ventes_publier', {p_batch_id: batch.id, p_date_fin: ANALYSE.dateFin});
    if (r.error) throw r.error;
    const n = Array.isArray(r.data) ? (r.data[0] ? r.data[0].lignes_publiees : 0) : (r.data ? r.data.lignes_publiees : 0);
    msg('vtPublierMsg', P.fait(n));
    await chargerCampagne();
  } catch (err) {
    console.error(err);
    const raison = String((err && err.message) || err || 'erreur inconnue');
    if (batch){
      try {
        await D.marquerBatchStatut(nexusClient, batch.id, 'failed', {echoue_le: new Date().toISOString(), motif: raison});
        await D.journaliser(nexusClient, {batchId: batch.id, site: SITE_ID, action: 'echec_publication', employeId: EMPLOYEE.id, details: {motif: raison, source: 'campagne-v2-ventes'}});
      } catch (e2){ console.error(e2); }
    }
    msg('vtPublierMsg', batch ? P.echecPublication(raison) : P.erreur, true);
  } finally { $('vtPublier').disabled = false; }
}
async function choisir(id){ CAMPAGNE = CAMPAGNES.find(c => c.id === id) || null; if (CAMPAGNE) await chargerCampagne(); }
function brancher(){
  $('vtCampagne').addEventListener('change', ev => choisir(ev.target.value));
  $('vtFichier').addEventListener('change', async ev => {
    FICHIER = ev.target.files[0] || null; ROWS = []; ANALYSE = null; $('vtRapport').hidden = true; msg('vtFichierMsg', '');
    if (!FICHIER) return;
    try {
      ROWS = await lireFichier(FICHIER);
      if (!ROWS.length){ msg('vtFichierMsg', 'Le fichier ne contient aucune ligne.', true); return; }
      HEADERS = Object.keys(ROWS[0]);
      const det = M.detectMapping(HEADERS, M.fieldDefsPourIntention('campagne'), []);
      MAPPING = det.mapping; MAPPING_AUTO = det.auto;
      msg('vtFichierMsg', P.fichierLu(ROWS.length));
    } catch (err) { console.error(err); msg('vtFichierMsg', 'Ce fichier n’a pas pu être lu.', true); }
  });
  $('vtAnalyser').addEventListener('click', analyser);
  $('vtPublier').addEventListener('click', publier);
}
async function demarrer(){
  $('hEyebrow').textContent = P.eyebrow; $('hTitre').textContent = P.titre; $('hSous').textContent = P.sous;
  $('lienMenu').textContent = V.menu || '☰ Menu'; $('lienRetour').textContent = P.retour;
  $('vtChoisirLib').textContent = P.choisir; $('vtE1').textContent = P.etape1; $('vtE2').textContent = P.etape2; $('vtE3').textContent = P.etape3;
  $('vtDateAide').textContent = P.dateAide; $('vtAnalyser').textContent = P.analyser; $('vtPublier').textContent = P.publier; $('vtHistoTitre').textContent = P.historique;
  const c = await nexusClient.from('campagnes_nexus').select('id, nom, date_debut, date_fin, produits_concernes').eq('site', SITE_ID).order('date_debut', {ascending: false});
  if (c.error) console.error('campagnes_nexus', c.error);
  CAMPAGNES = c.data || [];
  if (!CAMPAGNES.length){ $('vtVide').textContent = P.aucuneCampagne; $('vtVide').hidden = false; return; }
  $('vtCampagne').innerHTML = CAMPAGNES.map(x => '<option value="' + esc(x.id) + '">' + esc(x.nom) + '</option>').join('');
  const demande = new URLSearchParams(location.search).get('campagne');
  const id = CAMPAGNES.some(x => x.id === demande) ? demande : CAMPAGNES[0].id;
  $('vtCampagne').value = id;
  brancher();
  $('vtCorps').hidden = false;
  await choisir(id);
}
nexusRequireAuth().then(async employee => {
  if (!employee) return;
  if (employee.role !== 'manager' && employee.role !== 'gerant'){
    $('app').innerHTML = '<div class="reserve">' + esc(V.reserve) + '</div>'; return; }
  EMPLOYEE = employee; SITE_ID = employee.site_id;
  if (!(await NexusForfait.nexusRequireProfessional('NEXUS-Campagne-v2-Ventes.html', SITE_ID))) return;
  await demarrer();
});
</script>
