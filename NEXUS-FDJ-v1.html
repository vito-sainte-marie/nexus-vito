<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — FDJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-forfait.js"></script>
<script src="nexus-desktop.js"></script>
<script src="nexus-fdj-moteur.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .horodateur-discret{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:8px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  .choix-grid{display:flex; flex-direction:column; gap:12px;}
  .choix-card{
    position:relative; background:linear-gradient(145deg, var(--panel), var(--panel-raised));
    border:1.5px solid var(--hairline); border-radius:16px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25); transition:transform .15s;
  }
  .choix-card:active{transform:scale(0.98);}
  .choix-card.disabled{opacity:0.55; pointer-events:none;}
  .choix-icone{width:52px; height:52px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; background:radial-gradient(circle at 32% 28%, rgba(79,195,217,0.30), var(--panel-raised) 72%); box-shadow:inset 0 0 0 1px rgba(79,195,217,0.25);}
  .choix-titre{font-size:15.5px; font-weight:700;}
  .choix-sub{font-size:11.5px; color:var(--text-mid); margin-top:3px; line-height:1.4;}
  .choix-statut{font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; margin-top:5px;}
  .choix-statut.fait{color:var(--green);}
  .choix-statut.attente{color:var(--amber);}

  .etat-banner{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .etat-banner b{color:var(--text);}

  .quart-visuel{display:flex; gap:10px; margin-bottom:16px;}
  .quart-visuel-item{flex:1; text-align:center; padding:11px; border-radius:12px; border:1.5px solid var(--hairline); background:var(--panel); font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer;}
  .quart-visuel-item:active{background:var(--panel-raised);}
  .quart-visuel-item.actif{border-color:var(--cyan); background:rgba(79,195,217,0.14); color:var(--cyan); box-shadow:0 0 0 1px rgba(79,195,217,0.25);}

  .stepper{display:flex; gap:6px; margin-bottom:16px;}
  .stepper-item{flex:1; height:5px; border-radius:3px; background:var(--panel-raised);}
  .stepper-item.fait{background:var(--cyan);}
  .stepper-item.actif{background:var(--cyan); opacity:0.6;}
  .stepper-label{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; margin-bottom:14px; letter-spacing:0.03em; text-transform:uppercase;}

  .palier-block{margin-bottom:16px;}
  .palier-head{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); padding:0 2px 8px;}
  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .jeu-row{padding:12px 14px;}
  .jeu-row + .jeu-row{border-top:1px solid var(--hairline);}
  .jeu-nom-ligne{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .jeu-nom{font-size:13.5px; font-weight:600;}
  .jeu-ventes{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .jeu-ventes.calc{color:var(--cyan);}
  .jeu-inputs{display:flex; gap:6px;}
  .jeu-input-wrap{flex:1;}
  .jeu-input-label{font-family:var(--mono); font-size:8.5px; color:var(--text-dim); text-transform:uppercase; margin-bottom:3px; text-align:center;}
  .jeu-input{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:9px;
    padding:9px 6px; color:var(--text); font-family:var(--mono); font-size:14px; text-align:center;
  }
  .jeu-input:focus{outline:none; border-color:var(--cyan);}
  .jeu-input.prefilled{color:var(--text-mid);}

  .champ-label{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); margin-bottom:6px; letter-spacing:0.03em;}
  .champ-input{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    padding:12px 14px; color:var(--text); font-family:var(--mono); font-size:18px; text-align:right; margin-bottom:14px;
  }
  .champ-input:focus{outline:none; border-color:var(--cyan);}
  .champ-note{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:14px; margin-top:-8px;}
  .champ-sep{height:1px; background:var(--hairline); margin:16px 0;}

  .resume-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:18px; margin-bottom:14px;}
  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0;}
  .stat-row + .stat-row{border-top:1px solid var(--hairline);}
  .stat-label{font-size:13px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:15px; font-weight:700;}
  .stat-value.amber{color:var(--amber);}
  .stat-value.cyan{color:var(--cyan);}
  .stat-value.red{color:var(--red);}
  .stat-value.green{color:var(--green);}
  .stat-row.total{margin-top:6px; padding-top:14px; border-top:1.5px solid var(--hairline);}
  .stat-row.total .stat-label{font-weight:700; color:var(--text);}
  .stat-row.total .stat-value{font-size:19px;}

  .justif-input{
    width:100%; margin-bottom:14px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px;
    padding:10px 12px; color:var(--text); font-size:15px; font-family:var(--sans); -webkit-appearance:none; appearance:none;
  }

  .btn-primary{width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{width:100%; padding:12px; border:1px solid var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:13px; cursor:pointer; margin-top:8px;}
  .btn-loading-dots{display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle;}
  .btn-loading-dots i{width:4px; height:4px; border-radius:50%; background:currentColor; display:inline-block; font-style:normal; animation:btnDotsBounce 1.2s infinite ease-in-out;}
  .btn-loading-dots i:nth-child(2){animation-delay:0.15s;}
  .btn-loading-dots i:nth-child(3){animation-delay:0.3s;}
  @keyframes btnDotsBounce{0%,80%,100%{opacity:0.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);}}

  .checkmark{width:56px; height:56px; border-radius:50%; background:var(--green-dim); color:var(--green); font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .final-greet{font-size:19px; font-weight:700; text-align:center; margin-bottom:6px;}
  .final-sub{font-size:12.5px; color:var(--text-mid); text-align:center; margin-bottom:20px;}

  .locked{padding:80px 24px; text-align:center; color:var(--text-mid); font-size:14px;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · FDJ</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="horodateur-discret" id="horodateurDiscret">--</div>
    <div class="sub" id="sousTitre"></div>
  </div>
  <div class="divider"></div>

  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>

  <footer>NEXUS FDJ v1 · Contrôle quotidien grattage &amp; tirages · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS FDJ v1 (09/08/2026) — construit avec Frédéric à partir de
  // NEXUS_FDJ_Audit_Complet_Developpeur.pdf et du fichier réel
  // "CAISSE JOURNIALIERE FDJ 2026.xlsx" (feuille CONTROLE CAISSE).
  //
  // Principe directeur (Article "principe du pont" + discipline Inventaire) :
  // l'employé compte, NEXUS calcule — jamais l'inverse. Les ventes (qté et
  // valeur) et l'écart de caisse ne sont JAMAIS saisis à la main, toujours
  // recalculés ici à partir des comptages bruts. Formules validées contre le
  // fichier réel du 07/08/2026 (quart 1) : ventes_valeur totale 576€, lots
  // payés 385€ → caisse grattage 191€, + caisse tirages 85,70€ → caisse
  // attendue 276,70€, caisse réelle comptée 276,80€ → écart +0,10€.
  //
  // Vocabulaire imposé par l'audit (§57, "Une seule vérité" / "Vérité avant
  // certitude") : jamais un rapport recopié en entier, jamais un écart
  // saisi — uniquement expliqué.
  // ------------------------------------------------------------

  let employeeCourant = null;
  let siteId = 'vito-sainte-marie';
  let quartActuel = null;      // '1' | '2'
  let shiftRow = null;         // ligne fdj_shifts
  let jeux = [];                // catalogue fdj_games actif, trié ordre_affichage
  let dernierStockFinal = {};   // game_id -> stock_final du quart précédent validé
  let countsSaisie = {};        // game_id -> { stock_initial, appro, stock_final }
  let reportJournalier = { lots_payes_grattage: null };
  let reportTempsReel = { caisse_tirages: null };
  let regularisations = 0;
  let caisseReelle = null;
  let motifEcart = '';
  let phase = 'accueil';        // 'accueil' | 'grattage' | 'tirages' | 'caisse' | 'resume'

  const MOTIFS_ECART_FDJ = [
    { value: '', label: 'Choisir un motif…' },
    { value: 'erreur_saisie', label: 'Erreur de saisie' },
    { value: 'erreur_comptage', label: 'Erreur de comptage' },
    { value: 'carnet_non_declare', label: 'Carnet non déclaré' },
    { value: 'mouvement_oublie', label: 'Réapprovisionnement non enregistré' },
    { value: 'erreur_rapport', label: 'Erreur sur le rapport FDJ' },
    { value: 'autre', label: 'Autre raison' },
    { value: 'non_explique', label: 'Je ne sais pas' },
  ];

  function heureLocale() { return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function demarrerHorloge() {
    const maj = () => {
      const el = document.getElementById('horodateurDiscret');
      if (!el) return;
      const jour = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      el.textContent = `${jour.charAt(0).toUpperCase()}${jour.slice(1)} · ${heureLocale()}`;
    };
    maj(); setInterval(maj, 15000);
  }
  function dateISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtNum(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 }); }
  function fmtEuro(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : `${Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`; }

  // Quart du moment dérivé des horaires réels de la station (même logique
  // que NEXUS Inventaire — station_config.horaires.quart2.normal), converti
  // en '1'/'2' pour coller au vocabulaire des feuilles FDJ papier réelles
  // ("Quart : 1" / "Quart : 2").
  const HORAIRE_DEFAUT_DEBUT_QUART2 = '12:40';
  async function quartDuMoment() {
    let debutQuart2 = HORAIRE_DEFAUT_DEBUT_QUART2;
    const { data, error } = await nexusClient.from('station_config').select('horaires').eq('site', siteId).maybeSingle();
    if (error) console.error('Chargement horaires station (quart FDJ par défaut):', error);
    else if (data && data.horaires && data.horaires.quart2 && data.horaires.quart2.normal) debutQuart2 = data.horaires.quart2.normal;
    const maintenant = new Date();
    const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
    const [hQ2, mQ2] = debutQuart2.split(':').map(Number);
    const minutesQ2 = hQ2 * 60 + (mQ2 || 0);
    return minutesMaintenant < minutesQ2 ? '1' : '2';
  }

  // ------------------------------------------------------------
  // BROUILLON LOCAL — même filet de sécurité que NEXUS Inventaire : la
  // saisie n'a aucune valeur officielle tant que "Valider mon quart FDJ"
  // n'a pas été cliqué, mais un retour arrière ou un rechargement accidentel
  // ne doit pas faire tout reperdre.
  // ------------------------------------------------------------
  function cleDraft() {
    if (!employeeCourant || !shiftRow) return null;
    return `nexus_fdj_draft_${employeeCourant.id}_${shiftRow.id}`;
  }
  function sauvegarderDraft() {
    const cle = cleDraft();
    if (!cle) return;
    try { localStorage.setItem(cle, JSON.stringify({ countsSaisie, reportJournalier, reportTempsReel, regularisations, caisseReelle, motifEcart })); }
    catch (e) { console.error('Sauvegarde brouillon FDJ:', e); }
  }
  function chargerDraft() {
    const cle = cleDraft();
    if (!cle) return null;
    try { const brut = localStorage.getItem(cle); return brut ? JSON.parse(brut) : null; }
    catch (e) { console.error('Lecture brouillon FDJ:', e); return null; }
  }
  function effacerDraft() {
    const cle = cleDraft();
    if (!cle) return;
    try { localStorage.removeItem(cle); } catch (e) {}
  }

  async function chargerJeux() {
    const { data, error } = await nexusClient.from('fdj_games').select('*').eq('site', siteId).eq('actif', true).order('ordre_affichage', { ascending: true });
    if (error) { console.error('Chargement jeux FDJ:', error); return []; }
    return data || [];
  }

  // Stock initial = stock final du dernier quart FDJ validé (chaîne
  // continue, comme Inventaire) — jamais remis à zéro à chaque quart.
  async function chargerDernierStockFinal() {
    const { data: prevShift, error: e1 } = await nexusClient.from('fdj_shifts')
      .select('id, date, quart').eq('site', siteId).eq('statut', 'valide')
      .or(`date.lt.${shiftRow.date},and(date.eq.${shiftRow.date},quart.lt.${shiftRow.quart})`)
      .order('date', { ascending: false }).order('quart', { ascending: false }).limit(1).maybeSingle();
    if (e1) { console.error('Dernier quart FDJ validé:', e1); return {}; }
    if (!prevShift) return {};
    const { data: counts, error: e2 } = await nexusClient.from('fdj_shift_counts').select('game_id, stock_final').eq('shift_id', prevShift.id);
    if (e2) { console.error('Comptage précédent FDJ:', e2); return {}; }
    const map = {};
    (counts || []).forEach(c => { if (c.stock_final !== null) map[c.game_id] = c.stock_final; });
    return map;
  }

  async function obtenirOuCreerShift() {
    const { data: existant, error: e1 } = await nexusClient.from('fdj_shifts').select('*').eq('site', siteId).eq('date', dateISO()).eq('quart', quartActuel).maybeSingle();
    if (e1) console.error('Lecture quart FDJ:', e1);
    if (existant) return existant;
    const { data: cree, error: e2 } = await nexusClient.from('fdj_shifts')
      .insert({ site: siteId, date: dateISO(), quart: quartActuel, employee_id: employeeCourant.id, statut: 'brouillon', ouvert_le: new Date().toISOString() })
      .select().single();
    if (e2) { console.error('Création quart FDJ:', e2); return null; }
    return cree;
  }

  // ------------------------------------------------------------
  // CALCULS — délégués à nexus-fdj-moteur.js (Article 11, "une seule
  // vérité") : jamais saisis, toujours recalculés (règle non négociable,
  // audit §19 et §57), et jamais dupliqués entre cet écran et
  // NEXUS-FDJ-Manager-v1.html.
  // ------------------------------------------------------------
  function calculerVentes(gameId) {
    const jeu = jeux.find(j => j.id === gameId);
    if (!jeu) return { qte: null, valeur: null };
    return NexusFdjMoteur.calculerVentesJeu(countsSaisie[gameId], jeu.prix);
  }
  function ventesGrattageTotal() { return NexusFdjMoteur.ventesGrattageTotal(jeux, countsSaisie); }
  function caisseGrattage() { return NexusFdjMoteur.caisseGrattage(ventesGrattageTotal(), reportJournalier.lots_payes_grattage); }
  function caisseAttendue() { return NexusFdjMoteur.caisseAttendue(caisseGrattage(), reportTempsReel.caisse_tirages, regularisations); }
  function ecartCaisse() { return NexusFdjMoteur.ecartCaisse(caisseReelle, caisseAttendue()); }
  function jeuEstCompte(jeu) {
    const s = countsSaisie[jeu.id];
    return !!s && s.stock_initial !== null && s.stock_initial !== undefined && s.stock_final !== null && s.stock_final !== undefined;
  }
  // Jeux "à moitié comptés" (stock initial connu, stock final jamais tapé)
  // — candidats à la confirmation "plus de stock" avant de continuer.
  function jeuxSansStockFinal() {
    return jeux.filter(j => {
      const s = countsSaisie[j.id];
      return s && s.stock_initial !== null && s.stock_initial !== undefined && (s.stock_final === null || s.stock_final === undefined);
    });
  }

  // ------------------------------------------------------------
  // ACCUEIL
  // ------------------------------------------------------------
  function renderAccueil() {
    document.getElementById('titre').textContent = `Bonjour ${employeeCourant.nom}`;
    document.getElementById('sousTitre').textContent = '';
    const dejaValide = shiftRow && shiftRow.statut === 'valide';
    document.getElementById('content').innerHTML = `
      ${renderQuartVisuel()}
      <div class="choix-grid">
        <div class="choix-card ${dejaValide ? 'disabled' : ''}" id="carteComptage">
          <div class="choix-icone">🎟️</div>
          <div style="flex:1;">
            <div class="choix-titre">Compter mon quart FDJ</div>
            <div class="choix-sub">Grattage, tirages, caisse réelle — l'écart se calcule tout seul.</div>
            ${dejaValide ? '<div class="choix-statut fait">✓ Quart validé</div>' : '<div class="choix-statut attente">À faire</div>'}
          </div>
        </div>
      </div>
      ${dejaValide ? '<div class="etat-banner">Ce quart a déjà été validé. Une correction ne peut se faire que depuis Contrôle FDJ (manager).</div>' : ''}
    `;
    wireQuartVisuel();
    if (!dejaValide) document.getElementById('carteComptage').addEventListener('click', demarrerComptage);
  }

  function renderQuartVisuel() {
    return `
      <div class="quart-visuel">
        <div class="quart-visuel-item ${quartActuel === '1' ? 'actif' : ''}" data-quart="1">☀️ Quart 1</div>
        <div class="quart-visuel-item ${quartActuel === '2' ? 'actif' : ''}" data-quart="2">🌙 Quart 2</div>
      </div>
    `;
  }
  function wireQuartVisuel() {
    document.querySelectorAll('.quart-visuel-item').forEach(el => el.addEventListener('click', () => changerQuart(el.dataset.quart)));
  }
  async function changerQuart(nouveauQuart) {
    if (nouveauQuart === quartActuel) return;
    const enCours = Object.keys(countsSaisie).length > 0 || caisseReelle !== null;
    if (enCours && !confirm('Changer de quart maintenant abandonnera la saisie en cours (non enregistrée). Continuer ?')) return;
    quartActuel = nouveauQuart;
    countsSaisie = {}; reportJournalier = { lots_payes_grattage: null }; reportTempsReel = { caisse_tirages: null };
    regularisations = 0; caisseReelle = null; motifEcart = ''; phase = 'accueil';
    document.getElementById('content').innerHTML = '<div class="loading">Changement de quart…</div>';
    shiftRow = await obtenirOuCreerShift();
    if (!shiftRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger ce quart. Réessayez.</div>'; return; }
    renderAccueil();
  }

  async function demarrerComptage() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement des jeux…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    dernierStockFinal = await chargerDernierStockFinal();
    const { data: existants } = await nexusClient.from('fdj_shift_counts').select('*').eq('shift_id', shiftRow.id);
    (existants || []).forEach(c => { countsSaisie[c.game_id] = { stock_initial: c.stock_initial, appro: c.appro, stock_final: c.stock_final }; });
    const draft = chargerDraft();
    if (draft) {
      countsSaisie = { ...countsSaisie, ...draft.countsSaisie };
      reportJournalier = draft.reportJournalier || reportJournalier;
      reportTempsReel = draft.reportTempsReel || reportTempsReel;
      regularisations = draft.regularisations || 0;
      caisseReelle = draft.caisseReelle !== undefined ? draft.caisseReelle : null;
      motifEcart = draft.motifEcart || '';
    }
    jeux.forEach(j => { if (!countsSaisie[j.id]) countsSaisie[j.id] = { stock_initial: dernierStockFinal[j.id] ?? null, appro: 0, stock_final: null }; });
    phase = 'grattage';
    renderGrattage();
  }

  // ------------------------------------------------------------
  // PHASE 1 — GRATTAGE (reproduit CONTROLE CAISSE : Stock initial / Appro /
  // Stock final par jeu, groupés par palier de prix comme la feuille papier).
  // ------------------------------------------------------------
  function renderStepper(etape) {
    const etapes = ['Grattage', 'Tirages', 'Caisse', 'Résumé'];
    const idx = etapes.indexOf(etape);
    return `
      <div class="stepper">${etapes.map((e,i) => `<div class="stepper-item ${i < idx ? 'fait' : (i === idx ? 'actif' : '')}"></div>`).join('')}</div>
      <div class="stepper-label">Étape ${idx+1} sur ${etapes.length} — ${etape}</div>
    `;
  }

  function grouperParPalier(liste) {
    const groupes = {};
    for (const j of liste) {
      const cle = j.prix;
      if (!groupes[cle]) groupes[cle] = { prix: cle, items: [] };
      groupes[cle].items.push(j);
    }
    return Object.values(groupes).sort((a,b) => a.prix - b.prix);
  }

  function renderGrattage() {
    document.getElementById('titre').textContent = 'Grattage';
    document.getElementById('sousTitre').textContent = 'Stock initial (prérempli), appro reçu, stock final compté. Les ventes se calculent toutes seules.';
    const comptes = jeux.filter(jeuEstCompte).length;
    const groupes = grouperParPalier(jeux);
    document.getElementById('content').innerHTML = `
      ${renderStepper('Grattage')}
      <div class="etat-banner">${comptes} / ${jeux.length} jeux comptés</div>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">
            ${g.items.map(j => renderJeuRow(j)).join('')}
          </div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnSuiteGrattage">Continuer — Tirages</button>
      <button class="btn-ghost" id="btnRetourAccueil1">Retour</button>
    `;
    wireJeuInputs();
    document.getElementById('btnSuiteGrattage').addEventListener('click', () => {
      // Case vide ≠ zéro deviné (09/08/2026, demande de Frédéric) : un stock
      // final laissé vide peut aussi bien vouloir dire "je n'ai pas encore
      // compté ce jeu" que "il n'en reste plus, j'ai oublié de taper 0" —
      // les deux se ressemblent sur la feuille papier réelle. NEXUS ne
      // tranche jamais seul : il demande, une seule fois, pour tous les
      // jeux concernés d'un coup plutôt qu'une popup par jeu.
      const manquants = jeuxSansStockFinal();
      if (manquants.length) {
        const message = manquants.length === 1
          ? `${manquants[0].nom} : aucun stock final renseigné. Confirmez-vous qu'il n'y a plus aucun carnet en stock (0) ?`
          : `${manquants.length} jeux sans stock final renseigné :\n${manquants.map(j => `• ${j.nom}`).join('\n')}\n\nConfirmez-vous qu'il n'y a plus de stock (0) pour ces jeux ?`;
        if (!confirm(message)) return; // reste sur l'écran, l'employé va vérifier ces jeux
        manquants.forEach(j => { countsSaisie[j.id].stock_final = 0; });
        sauvegarderDraft();
      }
      phase = 'tirages'; renderTirages();
    });
    document.getElementById('btnRetourAccueil1').addEventListener('click', renderAccueil);
  }

  function renderJeuRow(jeu) {
    const s = countsSaisie[jeu.id] || { stock_initial: null, appro: 0, stock_final: null };
    const v = calculerVentes(jeu.id);
    return `
      <div class="jeu-row" data-jeu="${jeu.id}">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${v.valeur !== null ? 'calc' : ''}">${v.qte !== null ? `Ventes : ${fmtNum(v.qte)} · ${fmtEuro(v.valeur)}` : 'Ventes : —'}</div>
        </div>
        <div class="jeu-inputs">
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Initial</div>
            <input type="number" inputmode="decimal" class="jeu-input champ-stock-initial ${s.stock_initial !== null && dernierStockFinal[jeu.id] === s.stock_initial ? 'prefilled' : ''}" data-jeu="${jeu.id}" data-champ="stock_initial" value="${s.stock_initial ?? ''}">
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Appro</div>
            <input type="number" inputmode="decimal" class="jeu-input champ-appro" data-jeu="${jeu.id}" data-champ="appro" value="${s.appro ?? 0}">
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Final</div>
            <input type="number" inputmode="decimal" class="jeu-input champ-stock-final" data-jeu="${jeu.id}" data-champ="stock_final" value="${s.stock_final ?? ''}">
          </div>
        </div>
      </div>
    `;
  }
  function wireJeuInputs() {
    document.querySelectorAll('.jeu-input').forEach(input => {
      input.addEventListener('input', () => {
        const gameId = input.dataset.jeu, champ = input.dataset.champ;
        const val = input.value === '' ? null : Number(input.value);
        if (!countsSaisie[gameId]) countsSaisie[gameId] = { stock_initial: null, appro: 0, stock_final: null };
        countsSaisie[gameId][champ] = val;
        sauvegarderDraft();
        const row = input.closest('.jeu-row');
        const venteEl = row.querySelector('.jeu-ventes');
        const v = calculerVentes(gameId);
        venteEl.className = `jeu-ventes ${v.valeur !== null ? 'calc' : ''}`;
        venteEl.textContent = v.qte !== null ? `Ventes : ${fmtNum(v.qte)} · ${fmtEuro(v.valeur)}` : 'Ventes : —';
        const banniere = document.querySelector('.etat-banner');
        if (banniere) banniere.textContent = `${jeux.filter(jeuEstCompte).length} / ${jeux.length} jeux comptés`;
      });
    });
  }

  // ------------------------------------------------------------
  // PHASE 2 — TIRAGES (les deux seules valeurs indispensables des rapports
  // FDJ réels, jamais le rapport recopié en entier — audit §17).
  // ------------------------------------------------------------
  function renderTirages() {
    document.getElementById('titre').textContent = 'Tirages';
    document.getElementById('sousTitre').textContent = "Deux valeurs prises sur les rapports FDJ imprimés en caisse — gardez les tickets agrafés à la feuille papier si vous en imprimez encore une.";
    document.getElementById('content').innerHTML = `
      ${renderStepper('Tirages')}
      <div class="champ-label">Total des lots payés — grattage (RAPPORT JOURNALIER)</div>
      <input type="number" inputmode="decimal" class="champ-input" id="champLotsPayes" value="${reportJournalier.lots_payes_grattage ?? ''}" placeholder="0,00">
      <div class="champ-note">Ligne "Total des lots payés" en bas du RAPPORT JOURNALIER.</div>

      <div class="champ-label">Caisse tirages (RAPPORT JOURNALIER TEMPS RÉEL)</div>
      <input type="number" inputmode="decimal" class="champ-input" id="champCaisseTirages" value="${reportTempsReel.caisse_tirages ?? ''}" placeholder="0,00">
      <div class="champ-note">Ligne "CAISSE" du RAPPORT JOURNALIER TEMPS RÉEL ON-LINE (Loto, Keno, Amigo…).</div>

      <div class="etat-banner">Caisse grattage calculée : <b>${fmtEuro(caisseGrattage())}</b> (ventes grattage ${fmtEuro(ventesGrattageTotal())} − lots payés ${fmtEuro(reportJournalier.lots_payes_grattage)})</div>

      <button class="btn-primary" id="btnSuiteTirages">Continuer — Caisse</button>
      <button class="btn-ghost" id="btnRetourGrattage">Retour</button>
    `;
    document.getElementById('champLotsPayes').addEventListener('input', e => { reportJournalier.lots_payes_grattage = e.target.value === '' ? null : Number(e.target.value); sauvegarderDraft(); majBanniereTirages(); });
    document.getElementById('champCaisseTirages').addEventListener('input', e => { reportTempsReel.caisse_tirages = e.target.value === '' ? null : Number(e.target.value); sauvegarderDraft(); });
    document.getElementById('btnSuiteTirages').addEventListener('click', () => { phase = 'caisse'; renderCaisse(); });
    document.getElementById('btnRetourGrattage').addEventListener('click', () => { phase = 'grattage'; renderGrattage(); });
  }
  function majBanniereTirages() {
    const b = document.querySelector('.etat-banner');
    if (b) b.innerHTML = `Caisse grattage calculée : <b>${fmtEuro(caisseGrattage())}</b> (ventes grattage ${fmtEuro(ventesGrattageTotal())} − lots payés ${fmtEuro(reportJournalier.lots_payes_grattage)})`;
  }

  // ------------------------------------------------------------
  // PHASE 3 — CAISSE (attendue calculée, réelle comptée, écart calculé —
  // jamais l'inverse. Motif demandé dès qu'un écart existe, audit §19-20).
  // ------------------------------------------------------------
  function renderCaisse() {
    document.getElementById('titre').textContent = 'Caisse FDJ';
    document.getElementById('sousTitre').textContent = 'La caisse attendue se calcule seule. Comptez la caisse réelle et notez-la ici.';
    const attendue = caisseAttendue();
    const ecart = ecartCaisse();
    document.getElementById('content').innerHTML = `
      ${renderStepper('Caisse')}
      <div class="champ-label">Régularisations (si besoin, +/-)</div>
      <input type="number" inputmode="decimal" class="champ-input" id="champRegul" value="${regularisations ?? 0}" placeholder="0,00">

      <div class="resume-card" style="margin-bottom:14px;">
        <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(caisseGrattage())}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse tirages</div><div class="stat-value">${fmtEuro(reportTempsReel.caisse_tirages)}</div></div>
        <div class="stat-row"><div class="stat-label">Régularisations</div><div class="stat-value">${fmtEuro(regularisations)}</div></div>
        <div class="stat-row total"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(attendue)}</div></div>
      </div>

      <div class="champ-label">Caisse réelle comptée</div>
      <input type="number" inputmode="decimal" class="champ-input" id="champCaisseReelle" value="${caisseReelle ?? ''}" placeholder="0,00">

      <div id="blocEcart">${renderBlocEcart(ecart)}</div>

      <button class="btn-primary" id="btnSuiteCaisse" ${caisseReelle === null || attendue === null ? 'disabled' : ''}>Continuer — Résumé</button>
      <button class="btn-ghost" id="btnRetourTirages">Retour</button>
    `;
    document.getElementById('champRegul').addEventListener('input', e => {
      regularisations = e.target.value === '' ? 0 : Number(e.target.value);
      sauvegarderDraft();
      renderCaisse();
    });
    document.getElementById('champCaisseReelle').addEventListener('input', e => {
      caisseReelle = e.target.value === '' ? null : Number(e.target.value);
      sauvegarderDraft();
      const nouvelEcart = ecartCaisse();
      document.getElementById('blocEcart').innerHTML = renderBlocEcart(nouvelEcart);
      wireMotifEcart();
      document.getElementById('btnSuiteCaisse').disabled = (caisseReelle === null || caisseAttendue() === null);
    });
    wireMotifEcart();
    document.getElementById('btnSuiteCaisse').addEventListener('click', () => { phase = 'resume'; renderResume(); });
    document.getElementById('btnRetourTirages').addEventListener('click', () => { phase = 'tirages'; renderTirages(); });
  }
  function renderBlocEcart(ecart) {
    if (ecart === null) return '';
    const classe = ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red');
    return `
      <div class="etat-banner">
        <div class="stat-row" style="border:none; padding:0;">
          <div class="stat-label">Écart (réel − attendu)</div>
          <div class="stat-value ${classe}">${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}</div>
        </div>
        ${ecart !== 0 ? `<div style="margin-top:10px;"><select class="justif-input" id="selectMotifEcart" style="margin-bottom:0;">${MOTIFS_ECART_FDJ.map(m => `<option value="${m.value}" ${m.value===motifEcart?'selected':''}>${m.label}</option>`).join('')}</select></div>` : ''}
      </div>
    `;
  }
  function wireMotifEcart() {
    const sel = document.getElementById('selectMotifEcart');
    if (sel) sel.addEventListener('change', e => { motifEcart = e.target.value; sauvegarderDraft(); });
  }

  // ------------------------------------------------------------
  // PHASE 4 — RÉSUMÉ + VALIDATION
  // ------------------------------------------------------------
  function renderResume() {
    document.getElementById('titre').textContent = 'Résumé du quart';
    document.getElementById('sousTitre').textContent = '';
    const attendue = caisseAttendue();
    const ecart = ecartCaisse();
    const classe = ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red');
    document.getElementById('content').innerHTML = `
      ${renderStepper('Résumé')}
      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Ventes grattage</div><div class="stat-value">${fmtEuro(ventesGrattageTotal())}</div></div>
        <div class="stat-row"><div class="stat-label">Lots payés</div><div class="stat-value">${fmtEuro(reportJournalier.lots_payes_grattage)}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(caisseGrattage())}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse tirages</div><div class="stat-value">${fmtEuro(reportTempsReel.caisse_tirages)}</div></div>
        <div class="stat-row"><div class="stat-label">Régularisations</div><div class="stat-value">${fmtEuro(regularisations)}</div></div>
        <div class="stat-row total"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(attendue)}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse réelle</div><div class="stat-value">${fmtEuro(caisseReelle)}</div></div>
        <div class="stat-row total"><div class="stat-label">Écart</div><div class="stat-value ${classe}">${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}</div></div>
      </div>
      <button class="btn-primary" id="btnValider">Valider mon quart FDJ</button>
      <button class="btn-ghost" id="btnRetourCaisse">Retour</button>
    `;
    document.getElementById('btnValider').addEventListener('click', validerQuart);
    document.getElementById('btnRetourCaisse').addEventListener('click', () => { phase = 'caisse'; renderCaisse(); });
  }

  async function validerQuart() {
    const btn = document.getElementById('btnValider');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    // 1) Comptages grattage — upsert par (shift_id, game_id).
    const lignes = jeux.filter(jeuEstCompte).map(j => {
      const s = countsSaisie[j.id];
      const v = calculerVentes(j.id);
      return { site: siteId, shift_id: shiftRow.id, game_id: j.id, stock_initial: s.stock_initial, appro: s.appro || 0, stock_final: s.stock_final, ventes_qte: v.qte, ventes_valeur: v.valeur, updated_at: new Date().toISOString() };
    });
    if (lignes.length) {
      const { error: eCounts } = await nexusClient.from('fdj_shift_counts').upsert(lignes, { onConflict: 'shift_id,game_id' });
      if (eCounts) { console.error('Enregistrement comptages FDJ:', eCounts); btn.disabled = false; btn.textContent = 'Valider mon quart FDJ'; alert("Erreur d'enregistrement du grattage. Réessayez."); return; }
    }

    // 2) Rapports (journalier + temps réel) — upsert par (shift_id, type_rapport).
    const { error: eRep } = await nexusClient.from('fdj_reports').upsert([
      { site: siteId, shift_id: shiftRow.id, type_rapport: 'journalier', lots_payes_grattage: reportJournalier.lots_payes_grattage, saisi_par: employeeCourant.id },
      { site: siteId, shift_id: shiftRow.id, type_rapport: 'temps_reel', caisse_tirages: reportTempsReel.caisse_tirages, saisi_par: employeeCourant.id },
    ], { onConflict: 'shift_id,type_rapport' });
    if (eRep) { console.error('Enregistrement rapports FDJ:', eRep); btn.disabled = false; btn.textContent = 'Valider mon quart FDJ'; alert("Erreur d'enregistrement des rapports. Réessayez."); return; }

    // 3) Rapprochement caisse — upsert unique par shift_id. statut reste
    // "provisoire" tant qu'un manager ne l'a pas validé (jamais utilisé par
    // Ma Progression avant ça — règle audit §22).
    const ecart = ecartCaisse();
    const { error: eCash } = await nexusClient.from('fdj_cash_controls').upsert({
      site: siteId, shift_id: shiftRow.id,
      ventes_grattage_valeur: ventesGrattageTotal(), lots_payes_grattage: reportJournalier.lots_payes_grattage,
      caisse_grattage: caisseGrattage(), caisse_tirages: reportTempsReel.caisse_tirages,
      regularisations: regularisations || 0, caisse_attendue: caisseAttendue(), caisse_reelle: caisseReelle,
      ecart, motif_ecart: motifEcart || null, statut: 'provisoire', updated_at: new Date().toISOString(),
    }, { onConflict: 'shift_id' });
    if (eCash) { console.error('Enregistrement caisse FDJ:', eCash); btn.disabled = false; btn.textContent = 'Valider mon quart FDJ'; alert("Erreur d'enregistrement de la caisse. Réessayez."); return; }

    // 4) Quart passé en "valide" + trace d'audit immuable.
    const { error: eShift } = await nexusClient.from('fdj_shifts').update({ statut: 'valide', valide_le: new Date().toISOString() }).eq('id', shiftRow.id);
    if (eShift) console.error('Validation quart FDJ:', eShift);
    shiftRow.statut = 'valide';

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: shiftRow.id, entite_type: 'fdj_shift', entite_id: shiftRow.id,
      action: 'quart_valide', acteur_id: employeeCourant.id,
      nouvelle_valeur: { caisse_attendue: caisseAttendue(), caisse_reelle: caisseReelle, ecart },
    });

    effacerDraft();
    renderConfirmation(ecart);
  }

  function renderConfirmation(ecart) {
    document.getElementById('titre').textContent = 'Quart FDJ enregistré';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="checkmark">✓</div>
      <div class="final-greet">Merci ${employeeCourant.nom} !</div>
      <div class="final-sub">${ecart === 0 ? 'Caisse conforme.' : `Écart de ${ecart > 0 ? '+' : ''}${fmtEuro(ecart)} transmis au manager.`}</div>
      <button class="btn-primary" id="btnRetourAccueilFinal">Retour à l'accueil</button>
    `;
    document.getElementById('btnRetourAccueilFinal').addEventListener('click', () => { phase = 'accueil'; renderAccueil(); });
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    employeeCourant = employee;
    siteId = employee.site_id || 'vito-sainte-marie';
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-FDJ-v1.html', siteId))) return;
    demarrerHorloge();
    quartActuel = await quartDuMoment();
    jeux = await chargerJeux();
    shiftRow = await obtenirOuCreerShift();
    if (!shiftRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger le quart FDJ. Réessayez.</div>'; return; }
    renderAccueil();
  });
</script>
</body>
</html>
