<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — FDJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-build.js"></script>
<script src="nexus-auth.js?v=20260902-1823"></script>
<script src="nexus-header-nav.js?v=20260902-1823"></script>
<script src="nexus-forfait.js?v=20260902-1823"></script>
<script src="nexus-desktop.js?v=20260902-1823"></script>
<script src="nexus-fdj-moteur.js?v=20260902-1823"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .horodateur-discret{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:8px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  .choix-grid{display:flex; flex-direction:column; gap:12px;}
  .choix-card{
    position:relative; background:linear-gradient(145deg, var(--panel), var(--panel-raised));
    border:1.5px solid var(--hairline); border-radius:16px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25); transition:transform .15s;
  }
  .choix-card:active{transform:scale(0.98);}
  .choix-card.disabled{opacity:0.55; pointer-events:none;}
  .choix-icone{width:52px; height:52px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; background:radial-gradient(circle at 32% 28%, rgba(79,195,217,0.30), var(--panel-raised) 72%); box-shadow:inset 0 0 0 1px rgba(79,195,217,0.25);}
  .choix-titre{font-size:15.5px; font-weight:700;}
  .choix-sub{font-size:11.5px; color:var(--text-mid); margin-top:3px; line-height:1.4;}
  .choix-statut{font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; margin-top:5px;}
  .choix-statut.fait{color:var(--green);}
  .choix-statut.attente{color:var(--amber);}

  .etat-banner{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .etat-banner b{color:var(--text);}

  /* Carte "écart de caisse" (16/08/2026, demande de Frédéric : même
     présentation visuelle que la caisse boutique/piste de NEXUS-Verify-v1.html
     — voir renderCarteEcart) — simple, intuitive, un coup d'œil suffit. */
  .ecart-bloc{background:var(--panel-raised); border:1px solid var(--hairline); border-radius:14px; padding:16px 18px; margin-bottom:14px;}
  .ecart-bloc-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .ecart-bloc-label{font-family:var(--mono); font-size:11px; color:var(--text-mid); text-transform:uppercase; letter-spacing:0.06em;}
  .ecart-montant{font-family:var(--mono); font-size:30px; font-weight:700; line-height:1; margin-bottom:8px;}
  .ecart-phrase{font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .statut-badge{display:inline-block; font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:4px 10px; border-radius:20px;}
  .statut-badge.provisoire{background:var(--panel); color:var(--text-mid); border:1px solid var(--hairline);}
  .statut-badge.a_controler,.statut-badge.en_attente{background:var(--amber-dim); color:var(--amber);}
  .statut-badge.expliquee,.statut-badge.regularise,.statut-badge.valide_avec_ecart{background:rgba(79,195,217,0.14); color:var(--cyan);}
  .statut-badge.conforme{background:var(--green-dim); color:var(--green);}

  .quart-visuel{display:flex; gap:10px; margin-bottom:16px;}
  .quart-visuel-item{flex:1; text-align:center; padding:11px; border-radius:12px; border:1.5px solid var(--hairline); background:var(--panel); font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer;}
  .quart-visuel-item:active{background:var(--panel-raised);}
  .quart-visuel-item.actif{border-color:var(--cyan); background:rgba(79,195,217,0.14); color:var(--cyan); box-shadow:0 0 0 1px rgba(79,195,217,0.25);}
  /* 13/08/2026 — Règle d'accès aux quarts FDJ V1 : quart hors fenêtre horaire
     ou verrouillé sur l'autre quart après engagement réel. Grisé mais reste
     cliquable (le clic déclenche un message explicite, jamais un no-op muet
     — voir changerQuart()). */
  .quart-visuel-item.verrouille{opacity:0.55; cursor:not-allowed;}
  .quart-visuel-item.verrouille.actif{opacity:0.85;}
  .quart-visuel-sub{font-size:10.5px; font-weight:500; margin-top:3px; opacity:0.85;}

  .stepper{display:flex; gap:6px; margin-bottom:16px;}
  .stepper-item{flex:1; height:5px; border-radius:3px; background:var(--panel-raised);}
  .stepper-item.fait{background:var(--cyan);}
  .stepper-item.actif{background:var(--cyan); opacity:0.6;}
  .stepper-label{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; margin-bottom:14px; letter-spacing:0.03em; text-transform:uppercase;}

  .palier-block{margin-bottom:16px;}
  .palier-head{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); padding:0 2px 8px;}
  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .jeu-row{padding:12px 14px;}
  .jeu-row + .jeu-row{border-top:1px solid var(--hairline);}
  .jeu-nom-ligne{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .jeu-nom{font-size:13.5px; font-weight:600;}
  .jeu-ventes{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
  .jeu-ventes.calc{color:var(--cyan);}
  .jeu-ventes.anomalie{color:var(--red); font-weight:700;}
  .jeu-row.anomalie{background:rgba(240,87,90,0.08); box-shadow:inset 3px 0 0 var(--red);}
  .jeu-inputs{display:flex; gap:6px;}
  .jeu-input-wrap{flex:1;}
  .jeu-input-label{font-family:var(--mono); font-size:8.5px; color:var(--text-dim); text-transform:uppercase; margin-bottom:3px; text-align:center;}
  .jeu-input{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:9px;
    padding:9px 6px; color:var(--text); font-family:var(--mono); font-size:14px; text-align:center;
  }
  .jeu-input:focus{outline:none; border-color:var(--cyan);}
  .jeu-input.prefilled{color:var(--text-mid);}
  .jeu-input-readonly{
    width:100%; background:var(--panel); border:1px solid var(--hairline); border-radius:9px;
    padding:9px 6px; color:var(--text-mid); font-family:var(--mono); font-size:14px; text-align:center;
  }

  .champ-label{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); margin-bottom:6px; letter-spacing:0.03em;}
  .champ-input{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    padding:12px 14px; color:var(--text); font-family:var(--mono); font-size:18px; text-align:right; margin-bottom:14px;
  }
  .champ-input:focus{outline:none; border-color:var(--cyan);}
  .champ-note{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:14px; margin-top:-8px;}
  .champ-sep{height:1px; background:var(--hairline); margin:16px 0;}

  /* Bouton de signe pour "Caisse tirages" (10/08/2026, demande de
     Frédéric : "il faut que tu me donne la possibilité de mettre le
     symbole -, car parfois la caisse tirage peut être négative"). Le
     champ était déjà techniquement capable de stocker une valeur
     négative (aucun plancher côté moteur), mais le clavier numérique
     mobile déclenché par inputmode="decimal" n'affiche pas toujours la
     touche "-" — un bouton dédié garantit que le signe reste accessible
     sur tous les téléphones, sans dépendre du clavier virtuel. */
  .champ-input-signe-row{display:flex; gap:8px; margin-bottom:14px;}
  .champ-input-signe-row .champ-input{margin-bottom:0; flex:1;}
  .btn-signe{
    flex-shrink:0; width:46px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    color:var(--text-mid); font-family:var(--mono); font-size:19px; font-weight:700; cursor:pointer;
  }
  .btn-signe.actif{color:var(--red); border-color:rgba(240,87,90,0.45); background:var(--red-dim);}

  .resume-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:18px; margin-bottom:14px;}
  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0;}
  .stat-row + .stat-row{border-top:1px solid var(--hairline);}
  .stat-label{font-size:13px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:15px; font-weight:700;}
  .stat-value.amber{color:var(--amber);}
  .stat-value.cyan{color:var(--cyan);}
  .stat-value.red{color:var(--red);}
  .stat-value.green{color:var(--green);}
  .stat-row.total{margin-top:6px; padding-top:14px; border-top:1.5px solid var(--hairline);}
  .stat-row.total .stat-label{font-weight:700; color:var(--text);}
  .stat-row.total .stat-value{font-size:19px;}

  .justif-input{
    width:100%; margin-bottom:14px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px;
    padding:10px 12px; color:var(--text); font-size:15px; font-family:var(--sans); -webkit-appearance:none; appearance:none;
  }

  .btn-primary{width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{width:100%; padding:12px; border:1px solid var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:13px; cursor:pointer; margin-top:8px;}
  .btn-loading-dots{display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle;}
  .btn-loading-dots i{width:4px; height:4px; border-radius:50%; background:currentColor; display:inline-block; font-style:normal; animation:btnDotsBounce 1.2s infinite ease-in-out;}
  .btn-loading-dots i:nth-child(2){animation-delay:0.15s;}
  .btn-loading-dots i:nth-child(3){animation-delay:0.3s;}
  @keyframes btnDotsBounce{0%,80%,100%{opacity:0.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);}}

  .checkmark{width:56px; height:56px; border-radius:50%; background:var(--green-dim); color:var(--green); font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .final-greet{font-size:19px; font-weight:700; text-align:center; margin-bottom:6px;}
  .final-sub{font-size:12.5px; color:var(--text-mid); text-align:center; margin-bottom:20px;}

  .locked{padding:80px 24px; text-align:center; color:var(--text-mid); font-size:14px;}

  .motif-grid{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .motif-item{
    background:var(--panel); border:1.5px solid var(--hairline); border-radius:12px; padding:14px 16px;
    cursor:pointer; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px;
  }
  .motif-item .pastille{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--hairline); flex-shrink:0;}
  .motif-item.selectionne{border-color:var(--amber); background:rgba(245,166,35,0.08);}
  .motif-item.selectionne .pastille{background:var(--amber); border-color:var(--amber);}

  /* Message pré-comptage (10/08/2026, demande de Frédéric) — même
     composant que NEXUS-Inventaire-v1.html, affiché une seule fois par
     quart avant la validation du stock de départ. */
  .precomptage-card{background:var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:26px 22px; margin-top:8px; text-align:center;}
  .precomptage-emoji{font-size:30px; margin-bottom:12px;}
  .precomptage-titre{font-size:16.5px; font-weight:700; line-height:1.4; margin-bottom:10px;}
  .precomptage-texte{font-size:13px; color:var(--text-mid); line-height:1.6; margin-bottom:14px;}
  .precomptage-regle{font-size:13.5px; font-weight:600; color:var(--cyan); line-height:1.5; padding:12px; background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.25); border-radius:10px; margin-bottom:18px;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}

  /* Modale de validation définitive du quart (16/08/2026, demande de
     Frédéric : "je ne garderais pas longtemps les popups navigateur [...]
     je ferais une vraie modale cohérente avec l'interface") — même
     structure bottom-sheet que .calc-overlay/.calc-modal (NEXUS-Inventaire-v1.html),
     jamais un confirm() natif du navigateur pour un geste aussi engageant. */
  .cloture-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:300;}
  .cloture-modal{width:100%; max-width:460px; background:var(--panel); border:1px solid var(--hairline); border-top-left-radius:18px; border-top-right-radius:18px; padding:22px 20px calc(22px + env(safe-area-inset-bottom));}
  .cloture-titre{font-size:16.5px; font-weight:700; margin-bottom:14px;}
  .cloture-ecart-ligne{display:flex; justify-content:space-between; align-items:center; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px;}
  .cloture-ecart-valeur{font-family:var(--mono); font-weight:700; font-size:15px;}
  .cloture-ecart-valeur.green{color:var(--green);}
  .cloture-ecart-valeur.amber{color:var(--amber);}
  .cloture-texte{font-size:13px; color:var(--text-mid); line-height:1.6; margin-bottom:14px;}
  .cloture-avertissement{font-size:12.5px; color:var(--amber); background:var(--amber-dim); border:1px solid rgba(245,166,35,0.3); border-radius:10px; padding:10px 12px; margin-bottom:14px; line-height:1.5;}
  .cloture-actions .btn-ghost, .cloture-actions .btn-primary{margin-top:8px;}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · FDJ</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="horodateur-discret" id="horodateurDiscret">--</div>
    <div class="sub" id="sousTitre"></div>
  </div>
  <div class="divider"></div>

  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>

  <footer>NEXUS FDJ v1 · Contrôle quotidien grattage &amp; tirages · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS FDJ v1 (09/08/2026) — construit avec Frédéric à partir de
  // NEXUS_FDJ_Audit_Complet_Developpeur.pdf et du fichier réel
  // "CAISSE JOURNIALIERE FDJ 2026.xlsx" (feuille CONTROLE CAISSE).
  //
  // Principe directeur (Article "principe du pont" + discipline Inventaire) :
  // l'employé compte, NEXUS calcule — jamais l'inverse. Les ventes (qté et
  // valeur) et l'écart de caisse ne sont JAMAIS saisis à la main, toujours
  // recalculés ici à partir des comptages bruts. Formules validées contre le
  // fichier réel du 07/08/2026 (quart 1) : ventes_valeur totale 576€, lots
  // payés 385€ → caisse grattage 191€, + caisse tirages 85,70€ → caisse
  // attendue 276,70€, caisse réelle comptée 276,80€ → écart +0,10€.
  //
  // Vocabulaire imposé par l'audit (§57, "Une seule vérité" / "Vérité avant
  // certitude") : jamais un rapport recopié en entier, jamais un écart
  // saisi — uniquement expliqué.
  // ------------------------------------------------------------

  let employeeCourant = null;
  let siteId = null; // jamais 'vito-sainte-marie' par defaut (de-Vito-isation, 11/08/2026) - toujours ecrase par employee.site_id apres nexusRequireAuth()
  let quartActuel = null;      // '1' | '2'
  let shiftRow = null;         // ligne fdj_shifts
  // 13/08/2026 — "Règle d'accès aux quarts FDJ V1" (demande de Frédéric) :
  // horairesQuartsSite = { quart1: '05:45', quart2: '12:40' } (station_config.horaires,
  // déjà paramétrable par site — aucune nouvelle table), verrouJour = la ligne
  // fdj_employee_shift_locks du jour pour cet employé si elle existe (dès qu'il a
  // validé son stock de départ, ce quart devient le seul accessible pour la
  // journée). Les deux sont chargés à l'initialisation, AVANT que quartActuel
  // soit fixé, pour qu'un verrou existant prime sur la détection par l'heure —
  // voir NexusFdjMoteur.evaluerAccesQuart et NEXUS-Data-Dictionary-v2, v2.72.
  let horairesQuartsSite = {};
  let verrouJour = null;
  let fenetreAccesQuartMin = 30; // FDJ Fiabilisation Étape 7 (18/08/2026) : était une constante 30 codée en dur dans accesQuart(), maintenant fdj_site_settings.fenetre_acces_quart_min (repli 30 = comportement historique inchangé) — chargé à l'initialisation, avant renderAccueil(), même schéma que horairesQuartsSite/verrouJour ci-dessus.
  let jeux = [];                // catalogue fdj_games actif, trié ordre_affichage
  let emplacements = [];        // catalogue fdj_locations du site (Bureau, Caisse…)
  let dernierStockFinal = {};   // game_id -> stock_final du quart précédent validé
  let dernierShiftPrecedentId = null; // id du quart précédent (pour l'alerte si le stock initial hérité est modifié)
  let chaineRompue = { rompue: false, manquants: [] }; // 13/08/2026 : le quart précédent retrouvé n'est pas le quart immédiatement précédent (quarts manquants entre les deux) — voir NexusFdjMoteur.chaineContinuite
  let countsSaisie = {};        // game_id -> { stock_initial, appro, stock_final }
  let reportJournalier = { lots_payes_grattage: null };
  let reportTempsReel = { caisse_tirages: null };
  let regularisations = 0;
  let caisseReelle = null;
  let carnetsDeclaresCeQuart = 0; // compteur d'affichage seulement (session en cours), pas persisté
  let soldesCarnets = {};       // game_id -> { bureau, confies, actives, nonActives } — voir NexusFdjMoteur.soldesCarnetsAvecReference
  let activationsEnCours = new Set(); // FDJ Fiabilisation Étape 5 : game_id en cours d'activation — garde-fou anti double-tap dans executerActivationCarnet
  let derniereReference = null; // dernière "Inventaire de référence" validée (point zéro physique) — voir chargerDerniereReference
  let exceptionCarnetEnCours = null; // game_id en attente d'un motif (voir demarrerExceptionCarnet)
  let motifExceptionChoisi = null;
  // Réconciliation appro ↔ activation à la clôture (20/08/2026, demande de
  // Frédéric : "une quantité saisie en appro doit toujours être rattachée à
  // une activation existante ou provoquer la création d'une activation
  // manquante") — voir chargerActivationsQuart, calculerAnomaliesApproActivation,
  // verifierReconciliationApproActivation, creerActivationImplicite.
  let activationsCarnetQuart = {}; // game_id -> carnets activés PENDANT ce quart (distinct de soldesCarnets, site-wide/tout historique)
  let queueExceptionCloture = [];  // [{gameId, manque}] jeux sans stock non-activé suffisant pour couvrir l'appro saisi — voir demarrerExceptionsCloture
  let indexExceptionCloture = 0;
  let motifExceptionClotureChoisi = null;
  // 'accueil' | 'ouverture' | 'carnet' | 'carnet-exception' | 'grattage' | 'cloture-exception' | 'tirages' | 'caisse' | 'resume'
  //
  // 09/08/2026 (demande de Frédéric) — le quart FDJ employé se scinde
  // maintenant en deux moments distincts, comme NEXUS Inventaire :
  //   OUVERTURE (à l'arrivée) : l'employé valide ou corrige le stock de
  //   départ hérité du quart précédent. C'est CE moment-là qui déclenche
  //   l'alerte manager en cas de correction — plus la clôture.
  //   CLÔTURE (en fin de quart) : stock final, tirages, caisse réelle.
  //   Le stock initial n'est alors plus modifiable (déjà validé à
  //   l'ouverture) — seuls appro et stock final restent saisissables.
  // Entre les deux, "Déclarer un carnet ouvert" peut être utilisé à tout
  // moment du quart, sans dépendre d'aucune des deux phases.
  // 28/08/2026, demande de Frédéric — RENVERSE la décision du 16/08/2026
  // ci-dessous (barrée), qui rendait l'écart visible en permanence.
  // Constat de Frédéric : "si l'employé voit son écart avant d'avoir figé
  // sa déclaration, il peut rechercher la valeur attendue, modifier ses
  // quantités jusqu'à obtenir un résultat satisfaisant, puis valider —
  // NEXUS enregistrerait alors une caisse apparemment parfaite sans
  // connaître la première déclaration." Nouvelle règle : l'employé saisit
  // son réel SANS jamais voir la valeur attendue ni l'écart (seules des
  // erreurs de saisie pures — champ manquant, quantité impossible — sont
  // signalées). Il clôture ("CLÔTURER MA CAISSE"), ce qui fige un "Point de
  // clôture" immuable (employé, caisse, date/heure, stock déclaré, montants
  // déclarés, résultat calculé) — voir finaliserQuart(), qui pose la
  // version 1, insert-only, dans fdj_releves_cloture. SEULEMENT APRÈS cette
  // clôture, NEXUS révèle le résultat (voir renderConfirmationCloture,
  // "Point de clôture"). Ancien historique conservé ci-dessous pour
  // traçabilité de la décision (Article 5 — jamais un renversement
  // silencieux) :
  //
  // ~~16/08/2026, demande de Frédéric — règle de permission sur l'écart de
  // caisse FDJ, remplace la décision du 09/08 ci-dessus (qui masquait
  // l'écart à l'employé) : "Voir : oui. Corriger avant validation : oui,
  // avec traçabilité. Modifier après validation : non. Régulariser après
  // validation : manager uniquement, sans effacer le constat d'origine."
  // Concrètement : l'employé voit désormais toujours son écart (en direct
  // pendant la saisie, puis sur l'accueil, avant ET après la validation
  // manager).~~
  //
  // Ce qui reste inchangé des deux décisions : tant que SON quart n'est pas
  // encore transmis ("clôturé"), il corrige librement ses champs (rien
  // n'est en base avant la transmission). Une fois transmis, il ne modifie
  // plus rien directement : il peut seulement "demander une correction"
  // (voir demarrerDemandeCorrection), une alerte tracée qui prévient le
  // manager — seul habilité à régulariser, sans jamais effacer ce constat
  // initial (voir caisse_reelle_origine/ecart_origine, posées une seule
  // fois ici et plus jamais réécrites, y compris par une régularisation
  // manager). Voir NexusFdjMoteur.permissionsEcartCaisseEmploye (source
  // unique) — `voir` reflète désormais "clôture effectuée", pas "toujours".
  let phase = 'accueil';
  let demandeCorrectionMotifChoisi = null; // voir demarrerDemandeCorrection

  function heureLocale() { return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function demarrerHorloge() {
    const maj = () => {
      const el = document.getElementById('horodateurDiscret');
      if (!el) return;
      const jour = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      el.textContent = `${jour.charAt(0).toUpperCase()}${jour.slice(1)} · ${heureLocale()}`;
    };
    maj(); setInterval(maj, 15000);
  }
  function dateISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtNum(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 }); }
  function fmtEuro(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : `${Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`; }

  // ------------------------------------------------------------
  // CARTE "ÉCART DE CAISSE" — 16/08/2026, demande de Frédéric : présenter
  // l'écart FDJ "comme la caisse boutique ou piste" (NEXUS-Verify-v1.html)
  // — une carte unique, un montant net en gros caractères, un badge de
  // statut coloré, une phrase de lecture, plutôt qu'une ligne de texte
  // brute. Seul générateur de cette carte dans ce fichier (Article 11) :
  // consommée à l'identique par l'accueil (écart déjà transmis), le résumé
  // avant transmission (aperçu, badge neutre) et l'aperçu en direct pendant
  // la saisie (voir renderCarteEcart appelé depuis renderAccueil,
  // renderResume et renderApercuEcart).
  // Statuts repris tels quels de NEXUS-FDJ-Manager-v1.html (STATUTS_CAISSE)
  // — un seul jeu de libellés dans tout NEXUS FDJ, jamais deux traductions
  // différentes du même statut.
  const LIBELLES_STATUT_CAISSE = {
    provisoire: 'En attente de validation',
    a_controler: 'À contrôler',
    en_attente: 'En attente',
    expliquee: 'Expliquée',
    regularise: 'Régularisé',
    valide_avec_ecart: 'Validé avec écart',
    conforme: 'Conforme',
  };
  function renderCarteEcart(ecart, statut, options) {
    const opts = options || {};
    const label = opts.label || 'Caisse FDJ';
    // Couleur posée en style inline plutôt que via une classe partagée avec
    // .stat-value (16/08/2026) : .stat-value{font-size:15px} est déclarée
    // plus bas dans la feuille de style que .ecart-montant{font-size:30px}
    // — à spécificité CSS égale, la déclaration la plus tardive gagne, ce
    // qui aurait discrètement écrasé la grande taille du montant. Éviter la
    // collision plutôt que jouer sur l'ordre des règles.
    const couleurMontant = ecart === null || ecart === undefined ? 'var(--text)' : (ecart === 0 ? 'var(--green)' : (Math.abs(ecart) <= 1 ? 'var(--amber)' : 'var(--red)'));
    const montantTxt = ecart === null || ecart === undefined ? '—' : `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}`;
    const badgeStatut = statut ? `<span class="statut-badge ${statut}">${LIBELLES_STATUT_CAISSE[statut] || statut}</span>` : '';
    const phrase = opts.phrase || phraseEcartCaisse(ecart, statut);
    return `
      <div class="ecart-bloc">
        <div class="ecart-bloc-top">
          <span class="ecart-bloc-label">${label}</span>
          ${badgeStatut}
        </div>
        <div class="ecart-montant" style="color:${couleurMontant};">${montantTxt}</div>
        ${phrase ? `<div class="ecart-phrase">${phrase}</div>` : ''}
      </div>
    `;
  }
  function phraseEcartCaisse(ecart, statut) {
    if (ecart === null || ecart === undefined) return 'Comptez la caisse réelle pour voir l\'écart.';
    if (ecart === 0) return 'Caisse exacte, à l\'euro près.';
    const sens = ecart > 0 ? 'excédent' : 'manque';
    const base = `${sens.charAt(0).toUpperCase()}${sens.slice(1)} de ${fmtEuro(Math.abs(ecart))} par rapport à la caisse attendue.`;
    if (!statut || statut === 'provisoire') return `${base} En attente de vérification par le manager.`;
    return base;
  }

  // ------------------------------------------------------------
  // "POINT DE CLÔTURE" — 28/08/2026, demande de Frédéric : le résultat
  // (attendu, déclaré, écart) n'est révélé qu'APRÈS la clôture, jamais
  // avant (voir commentaire d'en-tête du fichier). Un seul rendu pour les
  // deux endroits qui le montrent (Article 11) : juste après la clôture
  // (renderConfirmationCloture, données encore en mémoire) et en revenant
  // plus tard sur l'accueil (renderAccueil, données rechargées depuis
  // fdj_cash_controls) — chacun construit le même objet normalisé
  // { heureLabel, attendue, reelle, ecart, ventesGrattage, lotsPayes,
  // caisseTirages, regularisations } avant d'appeler pointDeClotureHTML.
  // Un seul exemplaire du panneau "Comprendre mon écart" à la fois dans le
  // DOM (les deux écrans ne coexistent jamais) — id statique, pas de clé.
  // ------------------------------------------------------------
  function pointDeClotureHTML(d, opts) {
    const o = opts || {};
    const ecart = d.ecart;
    const conforme = ecart === 0;
    const classe = ecart === null || ecart === undefined ? '' : (conforme ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const ecartTxt = ecart === null || ecart === undefined ? '—' : `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}`;
    const badge = ecart === null || ecart === undefined ? '' : (conforme ? '✅ Conforme' : '⚠️ Écart détecté');
    return `
      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Caisse clôturée à</div><div class="stat-value">${d.heureLabel || '—'}</div></div>
        ${badge ? `<div class="stat-row"><div class="stat-label">Résultat FDJ</div><div class="stat-value ${classe}">${badge}</div></div>` : ''}
        <div class="stat-row"><div class="stat-label">Attendu</div><div class="stat-value cyan">${fmtEuro(d.attendue)}</div></div>
        <div class="stat-row"><div class="stat-label">Déclaré</div><div class="stat-value">${fmtEuro(d.reelle)}</div></div>
        <div class="stat-row" style="margin-bottom:0;"><div class="stat-label">Écart</div><div class="stat-value ${classe}">${ecartTxt}</div></div>
      </div>
      <div id="detailEcartCaisse" style="display:none;">${detailEcartCaisseHTML(d)}</div>
      <button type="button" class="btn-ghost" id="btnComprendreEcart">Comprendre mon écart</button>
      ${!conforme && !o.masquerCorrection ? `<button type="button" class="btn-ghost" id="btnDemanderCorrectionPDC">Recompter et corriger ma caisse</button>` : ''}
    `;
  }
  function detailEcartCaisseHTML(d) {
    return `
      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Ventes grattage (calculées)</div><div class="stat-value">${fmtEuro(d.ventesGrattage)}</div></div>
        <div class="stat-row"><div class="stat-label">Lots payés</div><div class="stat-value">${fmtEuro(d.lotsPayes)}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse tirages</div><div class="stat-value">${fmtEuro(d.caisseTirages)}</div></div>
        <div class="stat-row" style="margin-bottom:0;"><div class="stat-label">Régularisations</div><div class="stat-value">${fmtEuro(d.regularisations)}</div></div>
      </div>
    `;
  }
  // Câblage commun du point de clôture et de la correction tracée.
  function wirePointDeCloture() {
    const btnComprendre = document.getElementById('btnComprendreEcart');
    if (btnComprendre) {
      btnComprendre.addEventListener('click', () => {
        const detail = document.getElementById('detailEcartCaisse');
        if (!detail) return;
        const ouvert = detail.style.display !== 'none';
        detail.style.display = ouvert ? 'none' : 'block';
        btnComprendre.textContent = ouvert ? 'Comprendre mon écart' : 'Masquer le détail';
      });
    }
    const btnCorrection = document.getElementById('btnDemanderCorrectionPDC');
    if (btnCorrection) btnCorrection.addEventListener('click', demarrerCorrectionCaisse);
  }

  // Paramétrage FDJ du site (10/08/2026, audit "Paramétrage autonome &
  // multi-site" — fondations) : fdj_site_settings remplace les constantes
  // JS qui étaient jusque-là identiques quel que soit le site. Une ligne
  // absente retombe sur les mêmes valeurs par défaut que les anciennes
  // constantes (aucun changement de comportement tant que le manager ne
  // configure rien) — voir NEXUS-Data-Dictionary-v2 pour le détail.
  let parametresFdjSiteCache = undefined;
  async function chargerParametresFdjSite() {
    if (parametresFdjSiteCache !== undefined) return parametresFdjSiteCache;
    const { data, error } = await nexusClient.from('fdj_site_settings').select('*').eq('site', siteId).maybeSingle();
    if (error) console.error('Chargement paramètres FDJ site:', error);
    parametresFdjSiteCache = data || { horaire_bascule_quart2_repli: '12:40', fenetre_acces_quart_min: 30 };
    return parametresFdjSiteCache;
  }

  // Quart du moment dérivé des horaires réels de la station (même logique
  // que NEXUS Inventaire — station_config.horaires.quart2.normal), converti
  // en '1'/'2' pour coller au vocabulaire des feuilles FDJ papier réelles
  // ("Quart : 1" / "Quart : 2"). Repli FDJ (si station_config est vide) lu
  // depuis fdj_site_settings.horaire_bascule_quart2_repli, plus jamais une
  // constante JS figée pour tous les sites.
  async function quartDuMoment() {
    const parametresSite = await chargerParametresFdjSite();
    let debutQuart2 = parametresSite.horaire_bascule_quart2_repli || '12:40';
    const { data, error } = await nexusClient.from('station_config').select('horaires').eq('site', siteId).maybeSingle();
    if (error) console.error('Chargement horaires station (quart FDJ par défaut):', error);
    else if (data && data.horaires && data.horaires.quart2 && data.horaires.quart2.normal) debutQuart2 = data.horaires.quart2.normal;
    const maintenant = new Date();
    const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
    const [hQ2, mQ2] = debutQuart2.split(':').map(Number);
    const minutesQ2 = hQ2 * 60 + (mQ2 || 0);
    return minutesMaintenant < minutesQ2 ? '1' : '2';
  }

  // 13/08/2026 — "Règle d'accès aux quarts FDJ V1" : horaires de DÉBUT des
  // deux quarts, pour la fenêtre d'accès de 30 min (NexusFdjMoteur.evaluerAccesQuart).
  // Contrairement à quartDuMoment() (qui n'a besoin que de l'heure de bascule
  // Q1→Q2), ici il faut les deux heures de début. Horaire absent pour un
  // quart = undefined, jamais 0 par défaut — quartDansFenetreAcces() ne
  // bloque alors jamais ce quart (vérité avant certitude, Article 5).
  async function chargerHorairesQuartsSite() {
    const { data, error } = await nexusClient.from('station_config').select('horaires').eq('site', siteId).maybeSingle();
    if (error) { console.error('Chargement horaires quarts station (accès FDJ):', error); return {}; }
    const h = data && data.horaires;
    return {
      quart1: h && h.quart1 && h.quart1.normal,
      quart2: h && h.quart2 && h.quart2.normal,
    };
  }

  // Verrou du jour pour cet employé (s'il existe déjà) — dès qu'il a validé
  // son stock de départ sur un quart, cette ligne fixe pour la journée quel
  // quart lui reste accessible (source_lock='validation_stock_depart'), sauf
  // dérogation manager tracée qui la remplace (source_lock='override_manager').
  async function chargerVerrouJour() {
    const { data, error } = await nexusClient.from('fdj_employee_shift_locks').select('*')
      .eq('employee_id', employeeCourant.id).eq('date_service', dateISO()).maybeSingle();
    if (error) { console.error('Chargement verrou quart FDJ du jour:', error); return null; }
    return data;
  }

  // ------------------------------------------------------------
  // BROUILLON LOCAL — même filet de sécurité que NEXUS Inventaire : la
  // saisie n'a aucune valeur officielle tant que "Valider mon quart FDJ"
  // n'a pas été cliqué, mais un retour arrière ou un rechargement accidentel
  // ne doit pas faire tout reperdre.
  // ------------------------------------------------------------
  function cleDraft() {
    if (!employeeCourant || !shiftRow) return null;
    return `nexus_fdj_draft_${employeeCourant.id}_${shiftRow.id}`;
  }
  // Le brouillon est étiqueté avec le "groupe" de phase en cours (ouverture
  // ou clôture) pour ne jamais mélanger une saisie d'ouverture (stock de
  // départ seul) avec une saisie de clôture (appro/stock final/caisse) —
  // chargerDraft(groupe) ignore silencieusement un brouillon d'un autre
  // groupe plutôt que de l'appliquer à tort.
  function groupeDraftActuel() {
    if (phase === 'ouverture') return 'ouverture';
    if (phase === 'grattage' || phase === 'tirages' || phase === 'caisse' || phase === 'resume') return 'cloture';
    return null;
  }
  function sauvegarderDraft() {
    const cle = cleDraft();
    const groupe = groupeDraftActuel();
    if (!cle || !groupe) return;
    try { localStorage.setItem(cle, JSON.stringify({ groupe, countsSaisie, reportJournalier, reportTempsReel, regularisations, caisseReelle })); }
    catch (e) { console.error('Sauvegarde brouillon FDJ:', e); }
  }
  function chargerDraft(groupeAttendu) {
    const cle = cleDraft();
    if (!cle) return null;
    try {
      const brut = localStorage.getItem(cle);
      if (!brut) return null;
      const draft = JSON.parse(brut);
      if (groupeAttendu && draft.groupe !== groupeAttendu) return null;
      return draft;
    } catch (e) { console.error('Lecture brouillon FDJ:', e); return null; }
  }
  function effacerDraft() {
    const cle = cleDraft();
    if (!cle) return;
    try { localStorage.removeItem(cle); } catch (e) {}
  }

  async function chargerJeux() {
    const { data, error } = await nexusClient.from('fdj_games').select('*').eq('site', siteId).eq('actif', true).order('ordre_affichage', { ascending: true });
    if (error) { console.error('Chargement jeux FDJ:', error); return []; }
    return data || [];
  }

  async function chargerEmplacements() {
    const { data, error } = await nexusClient.from('fdj_locations').select('*').eq('site', siteId).eq('actif', true);
    if (error) { console.error('Chargement emplacements FDJ:', error); return []; }
    return data || [];
  }
  function emplacementParType(type) {
    return emplacements.find(e => e.type === type) || null;
  }

  // Solde confiés/activés/non-activés (09/08/2026, précision de Frédéric :
  // un transfert Bureau → Caisse n'est jamais une activation) — calculé via
  // NexusFdjMoteur.soldesCarnetsParJeu, jamais dupliqué avec l'écran
  // manager ("Réapprovisionner la caisse").
  async function chargerMouvementsStock() {
    const { data, error } = await nexusClient.from('fdj_stock_movements').select('type_mouvement, quantite, game_id, location_source_id, location_destination_id, created_at').eq('site', siteId);
    if (error) { console.error('Chargement mouvements stock FDJ:', error); return []; }
    return data || [];
  }

  // Carnets activés PENDANT ce quart précis, par jeu — 20/08/2026, demande
  // de Frédéric (réconciliation appro ↔ activation). Distinct de
  // chargerMouvementsStock (site-wide, tout l'historique, sert à calculer
  // soldesCarnets) : ici on ne compte que les lignes fdj_stock_movements
  // type_mouvement='activation' rattachées à shift_id=CE quart, pour
  // comparer au nombre de carnets impliqué par l'appro saisi à la clôture.
  async function chargerActivationsQuart(shiftId) {
    const { data, error } = await nexusClient.from('fdj_stock_movements').select('game_id, quantite').eq('shift_id', shiftId).eq('type_mouvement', 'activation');
    if (error) { console.error('Chargement activations du quart FDJ:', error); return {}; }
    const totaux = {};
    (data || []).forEach(m => { totaux[m.game_id] = (totaux[m.game_id] || 0) + (Number(m.quantite) || 0); });
    return totaux;
  }

  // Dernière "Inventaire de référence" validée (09/08/2026, demande de
  // Frédéric) — point zéro du stock physique Bureau/Caisse. Tant qu'aucun
  // contrôle physique n'a été fait, reference vaut null et
  // NexusFdjMoteur.soldesCarnetsAvecReference se comporte comme l'ancien
  // calcul (bureau non fiable, caisse depuis zéro).
  async function chargerDerniereReference() {
    const { data: ref, error: e1 } = await nexusClient.from('fdj_stock_references').select('*').eq('site', siteId).eq('statut', 'valide').order('date', { ascending: false }).order('created_at', { ascending: false }).limit(1).maybeSingle();
    if (e1) { console.error('Chargement référence stock FDJ:', e1); return null; }
    if (!ref) return null;
    const { data: lignes, error: e2 } = await nexusClient.from('fdj_stock_reference_lignes').select('game_id, bureau_reel, caisse_reel').eq('reference_id', ref.id);
    if (e2) { console.error('Chargement lignes référence stock FDJ:', e2); return null; }
    const map = {};
    (lignes || []).forEach(l => { map[l.game_id] = { bureau: l.bureau_reel, caisse: l.caisse_reel }; });
    return { creeLe: ref.created_at, date: ref.date, lignes: map };
  }

  // Ajoute automatiquement les tickets d'un carnet à l'appro du quart en
  // cours — 09/08/2026, demande de Frédéric, à partir du fichier réel
  // "Inventaire Grattage – Gamme Intégrale_0.xlsx" (colonne "Nb de tickets
  // par livret") : l'employé n'a plus besoin de connaître ou retaper ce
  // chiffre à la clôture, ce qui évite les erreurs de saisie.
  //
  // FDJ Fiabilisation Étape 5 (18/08/2026) — l'ancien lire-puis-écrire
  // (select appro courant → +quantiteTickets en JS → upsert) perdait un
  // incrément quand deux activations du même jeu/quart étaient concurrentes
  // (deux onglets, ou l'exception tracée + une activation normale) : les
  // deux lectures voyaient la même valeur de départ, le deuxième upsert
  // écrasait le premier au lieu de s'additionner. L'incrément se fait
  // désormais atomiquement côté base (fdj_incrementer_appro_shift_count,
  // ON CONFLICT DO UPDATE SET appro = appro + delta dans la même
  // transaction) — jamais de perte, quel que soit le nombre d'activations
  // simultanées. Ne touche jamais stock_initial/stock_final (Article 5 :
  // jamais écraser une valeur posée par un autre chemin).
  async function incrementerApproAutomatique(gameId, quantiteTickets) {
    const { data: nouvelAppro, error } = await nexusClient.rpc('fdj_incrementer_appro_shift_count', {
      p_site: siteId, p_shift_id: shiftRow.id, p_game_id: gameId, p_delta: quantiteTickets,
    });
    if (error) { console.error('Incrément appro automatique FDJ:', error); return null; }
    // Répercute en mémoire tout de suite si la clôture est déjà chargée.
    if (countsSaisie[gameId]) countsSaisie[gameId].appro = nouvelAppro;
    else countsSaisie[gameId] = { stock_initial: null, appro: nouvelAppro, stock_final: null };
    return nouvelAppro;
  }

  // Stock initial = stock final du dernier quart FDJ validé (chaîne
  // continue, comme Inventaire) — jamais remis à zéro à chaque quart.
  // Garde aussi l'id de ce quart précédent (dernierShiftPrecedentId) : s'il
  // est modifié plus bas par l'employé, c'est ce quart-là qui est remis en
  // cause et qui doit être signalé au manager (09/08/2026, demande de
  // Frédéric).
  async function chargerDernierStockFinal() {
    const { data: prevShift, error: e1 } = await nexusClient.from('fdj_shifts')
      .select('id, date, quart').eq('site', siteId).eq('statut', 'valide')
      .or(`date.lt.${shiftRow.date},and(date.eq.${shiftRow.date},quart.lt.${shiftRow.quart})`)
      .order('date', { ascending: false }).order('quart', { ascending: false }).limit(1).maybeSingle();
    if (e1) { console.error('Dernier quart FDJ validé:', e1); dernierShiftPrecedentId = null; chaineRompue = { rompue: false, manquants: [] }; return {}; }
    if (!prevShift) { dernierShiftPrecedentId = null; chaineRompue = { rompue: false, manquants: [] }; return {}; }
    dernierShiftPrecedentId = prevShift.id;
    // 13/08/2026 : le dernier quart validé retrouvé n'est pas forcément le
    // quart immédiatement précédent (quarts manquants entre les deux, non
    // comptés) — vérifie la continuité avant toute comparaison par jeu.
    chaineRompue = NexusFdjMoteur.chaineContinuite(
      { date: prevShift.date, quart: prevShift.quart },
      { date: shiftRow.date, quart: shiftRow.quart }
    );
    // Fiabilisation FDJ Étape 1 (13/08/2026, audit de cadrage) : persiste le
    // lien explicite previous_shift_id sur ce quart dès qu'il est résolu de
    // façon fiable — uniquement si la chaîne n'est PAS rompue (sinon on
    // laisserait croire à une continuité qui n'existe pas ; NULL reste la
    // valeur honnête tant que le vrai quart précédent n'a pas été comblé,
    // voir Étape 6 "Gestion des quarts manquants" de l'audit). N'écrit
    // qu'une fois (shiftRow.previous_shift_id encore vide) pour ne jamais
    // écraser un lien déjà posé par un replay futur (Étape 4).
    if (!chaineRompue.rompue && shiftRow.previous_shift_id == null) {
      const { error: eLien } = await nexusClient.from('fdj_shifts')
        .update({ previous_shift_id: prevShift.id }).eq('id', shiftRow.id);
      if (eLien) console.error('Lien previous_shift_id FDJ:', eLien);
      else shiftRow.previous_shift_id = prevShift.id;
    }
    const { data: counts, error: e2 } = await nexusClient.from('fdj_shift_counts').select('game_id, stock_final').eq('shift_id', prevShift.id);
    if (e2) { console.error('Comptage précédent FDJ:', e2); return {}; }
    const map = {};
    (counts || []).forEach(c => { if (c.stock_final !== null) map[c.game_id] = c.stock_final; });
    return map;
  }

  // Jeux dont le stock initial saisi s'écarte de la valeur héritée du
  // quart précédent — chaque écart remet en cause, avec effet rétroactif,
  // le stock final enregistré à ce quart-là.
  function jeuxAvecStockInitialModifie() {
    if (!dernierShiftPrecedentId) return [];
    return jeux.filter(j => {
      const herite = dernierStockFinal[j.id];
      const s = countsSaisie[j.id];
      if (herite === undefined || herite === null || !s || s.stock_initial === null || s.stock_initial === undefined) return false;
      return Number(s.stock_initial) !== Number(herite);
    });
  }

  async function obtenirOuCreerShift() {
    const { data: existant, error: e1 } = await nexusClient.from('fdj_shifts').select('*').eq('site', siteId).eq('date', dateISO()).eq('quart', quartActuel).maybeSingle();
    if (e1) console.error('Lecture quart FDJ:', e1);
    if (existant) return existant;
    const { data: cree, error: e2 } = await nexusClient.from('fdj_shifts')
      .insert({ site: siteId, date: dateISO(), quart: quartActuel, employee_id: employeeCourant.id, statut: 'brouillon', ouvert_le: new Date().toISOString() })
      .select().single();
    if (e2) { console.error('Création quart FDJ:', e2); return null; }
    return cree;
  }

  // ------------------------------------------------------------
  // CALCULS — délégués à nexus-fdj-moteur.js (Article 11, "une seule
  // vérité") : jamais saisis, toujours recalculés (règle non négociable,
  // audit §19 et §57), et jamais dupliqués entre cet écran et
  // NEXUS-FDJ-Manager-v1.html.
  // ------------------------------------------------------------
  function calculerVentes(gameId) {
    const jeu = jeux.find(j => j.id === gameId);
    if (!jeu) return { qte: null, valeur: null };
    return NexusFdjMoteur.calculerVentesJeu(countsSaisie[gameId], jeu.prix);
  }
  function ventesGrattageTotal() { return NexusFdjMoteur.ventesGrattageTotal(jeux, countsSaisie); }
  function caisseGrattage() { return NexusFdjMoteur.caisseGrattage(ventesGrattageTotal(), reportJournalier.lots_payes_grattage); }
  function caisseAttendue() { return NexusFdjMoteur.caisseAttendue(caisseGrattage(), reportTempsReel.caisse_tirages, regularisations); }
  function ecartCaisse() { return NexusFdjMoteur.ecartCaisse(caisseReelle, caisseAttendue()); }
  function jeuEstCompte(jeu) {
    const s = countsSaisie[jeu.id];
    return !!s && s.stock_initial !== null && s.stock_initial !== undefined && s.stock_final !== null && s.stock_final !== undefined;
  }
  // Jeux "à moitié comptés" (stock initial connu, stock final jamais tapé)
  // — candidats à la confirmation "plus de stock" avant de continuer.
  // Ventes négatives = anomalie (09/08/2026, demande de Frédéric) : un jeu
  // ne peut jamais "vendre" un nombre négatif de tickets — si stock_final
  // dépasse stock_initial + appro, quelque chose est mal saisi (appro
  // oublié, stock initial faux, erreur de comptage). NEXUS ne corrige
  // jamais tout seul, il montre l'anomalie clairement.
  function jeuxAvecVentesNegatives() {
    return jeux.filter(j => { const v = calculerVentes(j.id); return v.qte !== null && v.qte < 0; });
  }
  function jeuxSansStockFinal() {
    return jeux.filter(j => {
      const s = countsSaisie[j.id];
      return s && s.stock_initial !== null && s.stock_initial !== undefined && (s.stock_final === null || s.stock_final === undefined);
    });
  }

  // ------------------------------------------------------------
  // ACCUEIL — 3 actions distinctes, comme NEXUS Inventaire :
  // Ouverture (arrivée) / Carnet ouvert (à tout moment) / Clôture (fin de
  // quart). 09/08/2026, demande de Frédéric.
  // ------------------------------------------------------------
  async function chargerCashControlDuQuart(shiftId) {
    const { data, error } = await nexusClient.from('fdj_cash_controls').select('*').eq('shift_id', shiftId).maybeSingle();
    if (error) { console.error('Chargement caisse FDJ (accueil):', error); return null; }
    return data;
  }

  // 16/08/2026 — évite de reproposer "Signaler une erreur" en boucle si une
  // demande est déjà en attente d'un manager pour ce quart (voir
  // demarrerDemandeCorrection). 'vue=true' = déjà traitée par le manager,
  // redevient normalement invisible ici (le bouton réapparaît).
  async function chargerDemandeCorrectionEnCours(shiftId) {
    const { data, error } = await nexusClient.from('fdj_alertes').select('*')
      .eq('shift_id', shiftId).eq('type', 'correction_caisse_demandee').eq('vue', false).order('created_at', { ascending: false }).limit(1).maybeSingle();
    if (error) { console.error('Chargement demande de correction FDJ en cours:', error); return null; }
    return data;
  }

  // ------------------------------------------------------------
  // CORRECTION DE CAISSE APRÈS CLÔTURE — la caissière peut rectifier une
  // erreur de monnaie ou de comptage. Elle ne saisit jamais l'écart : NEXUS
  // le recalcule. Le constat initial reste protégé et le RPC crée une
  // nouvelle version immuable du relevé avec avant/après, motif et auteur.
  // ------------------------------------------------------------
  const MOTIFS_CORRECTION_CAISSE = [
    { value: 'erreur_comptage', label: 'Erreur de comptage' },
    { value: 'erreur_monnaie', label: 'Erreur de monnaie rendue' },
    { value: 'autre', label: 'Autre' },
  ];

  function demarrerCorrectionCaisse() {
    demandeCorrectionMotifChoisi = null;
    phase = 'demande-correction';
    renderDemandeCorrection();
  }

  function renderDemandeCorrection() {
    document.getElementById('titre').textContent = 'Signaler une erreur';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="etat-banner">⚠️ Vous pouvez corriger votre caisse si vous soupçonnez une erreur de monnaie ou de comptage. <strong>Votre première déclaration restera conservée.</strong> Ce changement, son motif, la date et l'heure seront notés et transmis sur votre relevé de clôture.</div>
      <label class="champ-label">Nouvelle caisse réellement comptée (€)</label>
      <input class="champ-input" id="champNouvelleCaisse" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00">
      <div class="aide-champ">L'écart sera recalculé automatiquement. Vous ne pouvez pas le modifier directement.</div>
      <label class="champ-label">Pourquoi corrigez-vous ?</label>
      <div class="motif-grid" id="grilleMotifsCorrection">
        ${MOTIFS_CORRECTION_CAISSE.map(m => `
          <div class="motif-item" data-motif="${m.value}">
            <div class="pastille"></div>
            <div>${m.label}</div>
          </div>
        `).join('')}
      </div>
      <label class="champ-label">Précisez (optionnel)</label>
      <textarea class="champ-input" id="champDetailCorrection" rows="3" style="text-align:left; font-family:var(--sans); font-size:14px; resize:vertical;" placeholder="Ex : j'ai compté 320€ et non 302€, erreur de lecture au comptage."></textarea>
      <button class="btn-primary" id="btnEnvoyerDemandeCorrection" disabled style="margin-top:12px;">Corriger et inscrire sur mon relevé</button>
      <button class="btn-ghost" id="btnAnnulerDemandeCorrection">Annuler</button>
    `;
    document.querySelectorAll('#grilleMotifsCorrection .motif-item').forEach(el => {
      el.addEventListener('click', () => {
        demandeCorrectionMotifChoisi = el.dataset.motif;
        document.querySelectorAll('#grilleMotifsCorrection .motif-item').forEach(x => x.classList.toggle('selectionne', x.dataset.motif === demandeCorrectionMotifChoisi));
        document.getElementById('btnEnvoyerDemandeCorrection').disabled = false;
      });
    });
    document.getElementById('btnEnvoyerDemandeCorrection').addEventListener('click', soumettreCorrectionCaisse);
    document.getElementById('btnAnnulerDemandeCorrection').addEventListener('click', () => { phase = 'accueil'; renderAccueil(); });
  }

  async function soumettreCorrectionCaisse() {
    const btn = document.getElementById('btnEnvoyerDemandeCorrection');
    btn.disabled = true;
    btn.innerHTML = 'Envoi<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const detail = (document.getElementById('champDetailCorrection').value || '').trim();
    const nouvelleCaisse = Number(document.getElementById('champNouvelleCaisse').value);
    if (!Number.isFinite(nouvelleCaisse) || nouvelleCaisse < 0) {
      btn.disabled = false; btn.textContent = 'Corriger et inscrire sur mon relevé';
      alert('Saisissez un montant de caisse valide.'); return;
    }
    const cash = await chargerCashControlDuQuart(shiftRow.id);
    if (!cash || Number(cash.caisse_reelle) === nouvelleCaisse) {
      btn.disabled = false; btn.textContent = 'Corriger et inscrire sur mon relevé';
      alert('Le nouveau montant doit être différent de la caisse déjà déclarée.'); return;
    }
    const { error } = await nexusClient.rpc('fdj_corriger_caisse_employe', {
      p_shift_id: shiftRow.id, p_nouvelle_caisse: nouvelleCaisse,
      p_motif: demandeCorrectionMotifChoisi, p_commentaire: detail || null,
    });
    if (error) {
      console.error('Correction caisse FDJ employée:', error);
      btn.disabled = false; btn.textContent = 'Corriger et inscrire sur mon relevé';
      alert("La correction n'a pas pu être enregistrée. Réessayez.");
      return;
    }
    alert('Correction enregistrée. La première déclaration est conservée et ce changement figure maintenant sur votre relevé de clôture.');
    phase = 'accueil';
    renderAccueil();
  }

  async function renderAccueil() {
    document.getElementById('titre').textContent = `Bonjour ${employeeCourant.nom}`;
    document.getElementById('sousTitre').textContent = '';
    const ouvertureFaite = !!(shiftRow && shiftRow.ouverture_validee);
    const clotureFaite = !!(shiftRow && shiftRow.statut === 'valide');
    // Raccourci manager (09/08/2026, demande de Frédéric) : cet écran reste
    // ouvert à tout le monde (voir commentaire plus haut), un manager peut
    // donc y atterrir directement — ce lien évite de le laisser chercher
    // "Contrôle FDJ" (historique, correction, changement de date) tout seul.
    const estManager = employeeCourant.role === 'manager' || employeeCourant.role === 'gerant';

    // 16/08/2026 : l'écart n'est plus jamais masqué à l'employé (voir
    // commentaire au sommet du fichier) — seul le libellé de statut change
    // selon que le manager a déjà validé la caisse ou non. 16/08/2026
    // (suite, même jour) — demande de Frédéric : reprendre la présentation
    // visuelle de "caisse boutique/piste" (NEXUS-Verify-v1.html, carte
    // .ecart-bloc + badge de statut coloré) plutôt qu'un simple bandeau de
    // texte, pour que ce soit "simple, intuitif et graphiquement agréable"
    // — voir renderCarteEcart, seul générateur de cette carte (accueil,
    // résumé avant transmission et aperçu en direct la consomment tous les
    // trois, Article 11).
    // 28/08/2026, demande de Frédéric : même "Point de clôture" qu'à la
    // sortie de renderConfirmationCloture (Article 11) — un employé qui
    // revient plus tard sur l'accueil doit voir exactement la même chose,
    // reconstruite ici depuis fdj_cash_controls (heure = valide_le).
    let blocCaisse = '';
    if (clotureFaite) {
      const cash = await chargerCashControlDuQuart(shiftRow.id);
      if (cash) {
        const heureLabel = cash.valide_le ? new Date(cash.valide_le).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '—';
        blocCaisse = pointDeClotureHTML({
          heureLabel, attendue: cash.caisse_attendue, reelle: cash.caisse_reelle, ecart: cash.ecart,
          ventesGrattage: cash.ventes_grattage_valeur, lotsPayes: cash.lots_payes_grattage,
          caisseTirages: cash.caisse_tirages, regularisations: cash.regularisations,
        }, { masquerCorrection: true }); // action de correction affichée juste sous le relevé
      }
    }

    document.getElementById('content').innerHTML = `
      ${estManager ? '<a href="NEXUS-FDJ-Manager-v1.html" class="etat-banner" style="display:block; color:var(--cyan); text-decoration:none; margin-bottom:14px;">Vous êtes manager ? Aller à FDJ Opérations →</a>' : ''}
      ${renderQuartVisuel()}
      <div class="choix-grid">
        <div class="choix-card ${ouvertureFaite ? 'disabled' : ''}" id="carteOuverture">
          <div class="choix-icone">🟢</div>
          <div style="flex:1;">
            <div class="choix-titre">Valider mon stock de départ</div>
            <div class="choix-sub">Confirmez ou corrigez le stock hérité du quart précédent.</div>
            ${ouvertureFaite ? '<div class="choix-statut fait">✓ Validé</div>' : '<div class="choix-statut attente">À faire à l\'arrivée</div>'}
          </div>
        </div>
        <div class="choix-card" id="carteCarnet">
          <div class="choix-icone">🔓</div>
          <div style="flex:1;">
            <div class="choix-titre">Activer un carnet</div>
            <div class="choix-sub">Quand vous entamez un nouveau carnet confié par le manager.</div>
          </div>
        </div>
        <div class="choix-card ${(!ouvertureFaite || clotureFaite) ? 'disabled' : ''}" id="carteCloture">
          <div class="choix-icone">🔴</div>
          <div style="flex:1;">
            <div class="choix-titre">Clôturer mon quart FDJ</div>
            <div class="choix-sub">Stock final, tirages, caisse réelle.</div>
            ${clotureFaite ? '<div class="choix-statut fait">✓ Transmis</div>' : (!ouvertureFaite ? '<div class="choix-statut attente">Validez d\'abord le stock de départ</div>' : '<div class="choix-statut attente">À faire en fin de quart</div>')}
          </div>
        </div>
      </div>
      ${blocCaisse}
      ${clotureFaite ? `<div class="etat-banner">Votre clôture est transmise. Si votre recomptage révèle une erreur, vous pouvez corriger la caisse : la déclaration d'origine restera conservée et le changement sera inscrit sur votre relevé.</div>
        <button type="button" class="btn-ghost" id="btnDemanderCorrection" style="margin-top:0;">Recompter et corriger ma caisse</button>` : ''}
    `;
    wireQuartVisuel();
    if (!ouvertureFaite) document.getElementById('carteOuverture').addEventListener('click', demarrerOuverture);
    document.getElementById('carteCarnet').addEventListener('click', demarrerCarnet);
    if (ouvertureFaite && !clotureFaite) document.getElementById('carteCloture').addEventListener('click', demarrerCloture);
    if (clotureFaite) wirePointDeCloture(); // bouton "Comprendre mon écart" du bloc pointDeClotureHTML ci-dessus
    const btnDemanderCorrection = document.getElementById('btnDemanderCorrection');
    if (btnDemanderCorrection) btnDemanderCorrection.addEventListener('click', demarrerCorrectionCaisse);
  }

  // 13/08/2026 — décision d'accès pour un quart donné, déléguée au moteur
  // partagé (Article 11) : jamais recalculée différemment ici et côté
  // Manager. Voir NexusFdjMoteur.evaluerAccesQuart pour les 3 branches
  // (verrouillé sur l'autre quart / verrouillé sur celui-ci / pas de verrou
  // encore, dépend juste de la fenêtre horaire).
  function accesQuart(quart) {
    const maintenant = new Date();
    const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
    const horaire = horairesQuartsSite['quart' + quart];
    // FDJ Fiabilisation Étape 7 (18/08/2026) : fenêtre configurable par site
    // (fdj_site_settings.fenetre_acces_quart_min, repli 30) au lieu d'une
    // constante 30 codée en dur — cahier §18 "la fenêtre de 30 minutes est
    // configurable par station".
    return NexusFdjMoteur.evaluerAccesQuart(quart, minutesMaintenant, horaire, fenetreAccesQuartMin, verrouJour);
  }
  function renderQuartVisuel() {
    const acces1 = accesQuart('1');
    const acces2 = accesQuart('2');
    const sousTitre = (quart, acces) => {
      if (acces.accessible) return '';
      if (acces.motif === 'verrouille_autre_quart') return '<div class="quart-visuel-sub">🔒 Verrouillé — voir votre manager</div>';
      if (acces.motif === 'hors_fenetre') {
        const h = horairesQuartsSite['quart' + quart];
        return h ? `<div class="quart-visuel-sub">Accessible à partir de ${h}</div>` : '';
      }
      return '';
    };
    return `
      <div class="quart-visuel">
        <div class="quart-visuel-item ${quartActuel === '1' ? 'actif' : ''} ${!acces1.accessible ? 'verrouille' : ''}" data-quart="1" data-accessible="${acces1.accessible}">☀️ Quart 1${sousTitre('1', acces1)}</div>
        <div class="quart-visuel-item ${quartActuel === '2' ? 'actif' : ''} ${!acces2.accessible ? 'verrouille' : ''}" data-quart="2" data-accessible="${acces2.accessible}">🌙 Quart 2${sousTitre('2', acces2)}</div>
      </div>
    `;
  }
  function wireQuartVisuel() {
    document.querySelectorAll('.quart-visuel-item').forEach(el => el.addEventListener('click', () => changerQuart(el.dataset.quart)));
  }
  async function changerQuart(nouveauQuart) {
    if (nouveauQuart === quartActuel) return;
    // 13/08/2026 — "Règle d'accès aux quarts FDJ V1" : refuser le changement
    // (pas seulement griser le bouton) si le quart demandé n'est pas
    // accessible — hors fenêtre horaire, ou verrouillé sur l'autre quart
    // suite à un engagement réel. Message explicite, jamais un simple no-op.
    const acces = accesQuart(nouveauQuart);
    if (!acces.accessible) {
      if (acces.motif === 'verrouille_autre_quart') {
        alert(`Vous êtes verrouillé sur le Quart ${verrouJour.quart} pour aujourd'hui (stock de départ déjà validé). Le changement de quart nécessite une dérogation manager.`);
      } else if (acces.motif === 'hors_fenetre') {
        const h = horairesQuartsSite['quart' + nouveauQuart];
        alert(h ? `Le Quart ${nouveauQuart} n'est pas encore accessible — il ouvre à ${h} (${fenetreAccesQuartMin} minutes avant l'heure officielle).` : `Le Quart ${nouveauQuart} n'est pas encore accessible.`);
      }
      return;
    }
    const enCours = Object.keys(countsSaisie).length > 0 || caisseReelle !== null;
    if (enCours && !confirm('Changer de quart maintenant abandonnera la saisie en cours (non enregistrée). Continuer ?')) return;
    quartActuel = nouveauQuart;
    countsSaisie = {}; reportJournalier = { lots_payes_grattage: null }; reportTempsReel = { caisse_tirages: null };
    regularisations = 0; caisseReelle = null; carnetsDeclaresCeQuart = 0; phase = 'accueil';
    document.getElementById('content').innerHTML = '<div class="loading">Changement de quart…</div>';
    shiftRow = await obtenirOuCreerShift();
    if (!shiftRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger ce quart. Réessayez.</div>'; return; }
    renderAccueil();
  }

  // ------------------------------------------------------------
  // OUVERTURE — à l'arrivée, l'employé valide ou corrige le stock de
  // départ hérité du quart précédent. Une fois validé, ce stock devient
  // en lecture seule pour la clôture (09/08/2026, demande de Frédéric).
  // ------------------------------------------------------------
  // Message pré-comptage (10/08/2026, demande de Frédéric) : même principe
  // et même composant que NEXUS-Inventaire-v1.html (voir son commentaire
  // pour le contexte complet) — une seule fois par quart, juste avant le
  // premier comptage (ici : la validation du stock de départ), jamais un
  // rappel répété. Fixe pour l'instant, le message adaptatif selon les
  // anomalies récentes est un lot séparé à venir. "Une fois par quart" =
  // mémorisé en localStorage par shiftRow.id (device), même convention que
  // nexus_pointage_tentative_en_cours.
  function clePrecomptageVuFdj() { return `nexus_fdj_precomptage_vu_${shiftRow.id}`; }
  function precomptageDejaVuFdj() {
    try { return localStorage.getItem(clePrecomptageVuFdj()) === '1'; } catch (e) { return false; }
  }
  function marquerPrecomptageVuFdj() {
    try { localStorage.setItem(clePrecomptageVuFdj(), '1'); } catch (e) {}
  }
  function demarrerOuverture() {
    if (precomptageDejaVuFdj()) { demarrerOuvertureComptage(); return; }
    document.getElementById('content').innerHTML = `
      <div class="precomptage-card">
        <div class="precomptage-emoji">🎯</div>
        <div class="precomptage-titre">Un comptage juste fait gagner du temps à toute l'équipe.</div>
        <div class="precomptage-texte">Une erreur fausse les écarts, déclenche des contrôles inutiles et peut masquer une perte réelle.</div>
        <div class="precomptage-regle">Comptez le réel, ne recopiez jamais le stock précédent.</div>
        <button class="btn-primary" id="btnCommencerPrecomptage">✓ Je commence mon inventaire</button>
      </div>
    `;
    document.getElementById('btnCommencerPrecomptage').addEventListener('click', () => {
      marquerPrecomptageVuFdj();
      demarrerOuvertureComptage();
    });
  }
  async function demarrerOuvertureComptage() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement des jeux…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    dernierStockFinal = await chargerDernierStockFinal();
    const { data: existants } = await nexusClient.from('fdj_shift_counts').select('*').eq('shift_id', shiftRow.id);
    (existants || []).forEach(c => { countsSaisie[c.game_id] = { stock_initial: c.stock_initial, appro: c.appro, stock_final: c.stock_final, stock_initial_auto: c.stock_initial_auto }; });
    phase = 'ouverture';
    const draft = chargerDraft('ouverture');
    if (draft) countsSaisie = { ...countsSaisie, ...draft.countsSaisie };
    // 16/08/2026 : stock_initial_auto=true tant qu'aucun humain n'a jamais
    // touché ce champ — permet à NEXUS de le corriger tout seul si le quart
    // précédent est recalculé après rétablissement de la chaîne (voir
    // reconcilierAlertesChaine, NEXUS-FDJ-Manager-v1.html). Passe à false
    // dès la première frappe (voir wireOuvertureInputs ci-dessous).
    jeux.forEach(j => { if (!countsSaisie[j.id]) countsSaisie[j.id] = { stock_initial: dernierStockFinal[j.id] ?? null, appro: 0, stock_final: null, stock_initial_auto: true }; });
    renderOuverture();
  }

  function renderOuverture() {
    document.getElementById('titre').textContent = 'Stock de départ';
    document.getElementById('sousTitre').textContent = 'Vérifiez le stock hérité du quart précédent — corrigez si un chiffre est faux.';
    const groupes = grouperParPalier(jeux);
    document.getElementById('content').innerHTML = `
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuOuvertureRow(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnValiderOuverture">Valider mon stock de départ</button>
      <button class="btn-ghost" id="btnRetourAccueilOuverture">Retour</button>
    `;
    wireOuvertureInputs();
    document.getElementById('btnValiderOuverture').addEventListener('click', validerOuverture);
    document.getElementById('btnRetourAccueilOuverture').addEventListener('click', () => { phase = 'accueil'; renderAccueil(); });
  }

  function renderJeuOuvertureRow(jeu) {
    const s = countsSaisie[jeu.id] || { stock_initial: null };
    const herite = dernierStockFinal[jeu.id];
    const preremplie = herite !== undefined && s.stock_initial !== null && Number(s.stock_initial) === Number(herite);
    return `
      <div class="jeu-row" data-jeu="${jeu.id}">
        <div class="jeu-nom-ligne"><div class="jeu-nom">${jeu.nom}</div></div>
        <div class="jeu-inputs">
          <div class="jeu-input-wrap" style="flex:1;">
            <div class="jeu-input-label">Stock de départ</div>
            <input type="number" inputmode="decimal" class="jeu-input champ-stock-initial-ouverture ${preremplie ? 'prefilled' : ''}" data-jeu="${jeu.id}" value="${s.stock_initial ?? ''}">
          </div>
        </div>
      </div>
    `;
  }
  // Entrée/Retour passe au champ de stock suivant (16/08/2026, demande de
  // Frédéric : "en vue bureau [...] en inscrivant le stock initial ou
  // final, passer à la ligne suivante en cliquant sur la touche return ou
  // entrée"). Uniquement en vue bureau — voir nexus-desktop.js/nexusEst
  // VueBureau() — pour ne jamais interférer avec le clavier numérique
  // mobile, dont "suivant"/"terminé" reste géré nativement par le système.
  // Se base sur l'ordre DOM réel de `.jeu-input` (un seul écran de saisie
  // affiché à la fois : ouverture OU clôture, jamais les deux en même
  // temps), donc "champ suivant" correspond toujours au prochain champ
  // visuellement rencontré, palier par palier, y compris en colonnes
  // (vue bureau réordonne visuellement via CSS, jamais le DOM).
  function jeuInputToucheEntree(e) {
    if (e.key !== 'Enter') return;
    if (typeof nexusEstVueBureau !== 'function' || !nexusEstVueBureau()) return;
    e.preventDefault();
    const champs = Array.from(document.querySelectorAll('.jeu-input'));
    const i = champs.indexOf(e.target);
    if (i === -1) return;
    const suivant = champs[i + 1];
    if (suivant) { suivant.focus(); if (suivant.select) suivant.select(); }
  }
  function wireOuvertureInputs() {
    document.querySelectorAll('.champ-stock-initial-ouverture').forEach(input => {
      input.addEventListener('input', () => {
        const gameId = input.dataset.jeu;
        const val = input.value === '' ? null : Number(input.value);
        if (!countsSaisie[gameId]) countsSaisie[gameId] = { stock_initial: null, appro: 0, stock_final: null };
        countsSaisie[gameId].stock_initial = val;
        // Dès qu'un humain touche lui-même le stock de départ, ce n'est
        // plus une valeur héritée automatiquement — NEXUS ne la réécrira
        // plus jamais tout seul (voir migration stock_initial_auto).
        countsSaisie[gameId].stock_initial_auto = false;
        sauvegarderDraft();
      });
      input.addEventListener('keydown', jeuInputToucheEntree);
    });
  }

  async function validerOuverture() {
    const btn = document.getElementById('btnValiderOuverture');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    // Signale, dès l'ouverture, tout écart avec le stock hérité — c'est
    // ici (et non plus à la clôture) que la correction remet en cause le
    // quart précédent (09/08/2026, demande de Frédéric). 13/08/2026 : si la
    // chaîne est interrompue (quarts manquants entre le quart précédent
    // retrouvé et celui-ci), la comparaison par jeu n'a plus de sens — elle
    // compare des jours qui ne se suivent pas. On suspend alors les N
    // alertes par jeu au profit d'une seule alerte racine (voir plus bas).
    const jeuxModifies = chaineRompue.rompue ? [] : jeuxAvecStockInitialModifie();

    const lignes = jeux
      .filter(j => countsSaisie[j.id] && countsSaisie[j.id].stock_initial !== null && countsSaisie[j.id].stock_initial !== undefined)
      .map(j => ({
        site: siteId, shift_id: shiftRow.id, game_id: j.id,
        stock_initial: countsSaisie[j.id].stock_initial, appro: countsSaisie[j.id].appro || 0,
        stock_final: countsSaisie[j.id].stock_final ?? null, updated_at: new Date().toISOString(),
        // 16/08/2026 : défaut prudent à false si l'information manque (ex.
        // brouillon local sauvegardé avant ce lot) — ne jamais présumer
        // qu'une valeur est sans risque à réécrire automatiquement.
        stock_initial_auto: countsSaisie[j.id].stock_initial_auto === true,
      }));
    if (lignes.length) {
      const { error } = await nexusClient.from('fdj_shift_counts').upsert(lignes, { onConflict: 'shift_id,game_id' });
      if (error) { console.error('Enregistrement stock de départ FDJ:', error); btn.disabled = false; btn.textContent = 'Valider mon stock de départ'; alert("Erreur d'enregistrement. Réessayez."); return; }
    }

    const { error: eShift } = await nexusClient.from('fdj_shifts').update({ ouverture_validee: true, ouverture_validee_le: new Date().toISOString() }).eq('id', shiftRow.id);
    if (eShift) console.error('Validation ouverture FDJ:', eShift);
    shiftRow.ouverture_validee = true;

    if (jeuxModifies.length) {
      const alertes = jeuxModifies.map(j => ({
        site: siteId, type: 'stock_initial_modifie', shift_id: shiftRow.id, shift_precedent_id: dernierShiftPrecedentId,
        game_id: j.id, valeur_quart_precedent: dernierStockFinal[j.id], valeur_saisie: countsSaisie[j.id].stock_initial,
        employee_id: employeeCourant.id,
      }));
      const { error: eAlerte } = await nexusClient.from('fdj_alertes').insert(alertes);
      if (eAlerte) console.error('Enregistrement alertes stock initial FDJ:', eAlerte); // non bloquant
    } else if (chaineRompue.rompue) {
      // Une seule alerte racine plutôt que N alertes par jeu — 13/08/2026.
      const { error: eAlerteChaine } = await nexusClient.from('fdj_alertes').insert({
        site: siteId, type: 'chaine_interrompue', shift_id: shiftRow.id, shift_precedent_id: dernierShiftPrecedentId,
        game_id: null, employee_id: employeeCourant.id, quarts_manquants: chaineRompue.manquants,
      });
      if (eAlerteChaine) console.error('Enregistrement alerte chaîne interrompue FDJ:', eAlerteChaine); // non bloquant
    }

    // 13/08/2026 — "Règle d'accès aux quarts FDJ V1" (demande de Frédéric) :
    // c'est CE moment — la validation du stock de départ — qui constitue le
    // "premier engagement réel" dans le quart. On pose le verrou du jour ici.
    // Non bloquant si l'insert échoue (log seul) : la contrainte
    // UNIQUE(employee_id, date_service) côté base reste le vrai filet de
    // sécurité, pas cette ligne applicative — voir migration
    // fdj_employee_shift_locks et NEXUS-Data-Dictionary-v2, v2.72. Si un
    // verrou existe déjà pour aujourd'hui (rechargement de page après un
    // premier passage, ou re-validation du même quart), on ne le recrée pas.
    if (!verrouJour) {
      const { data: verrouCree, error: eVerrou } = await nexusClient.from('fdj_employee_shift_locks').insert({
        site: siteId, employee_id: employeeCourant.id, date_service: dateISO(), quart: quartActuel,
        source_lock: 'validation_stock_depart',
      }).select().single();
      if (eVerrou) console.error('Pose du verrou de quart FDJ:', eVerrou); // non bloquant
      else verrouJour = verrouCree;
    }

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: shiftRow.id, entite_type: 'fdj_shift', entite_id: shiftRow.id,
      action: 'ouverture_validee', acteur_id: employeeCourant.id,
      nouvelle_valeur: { jeux_modifies: jeuxModifies.map(j => j.id) },
    });

    effacerDraft();
    renderConfirmationOuverture(jeuxModifies);
  }

  function renderConfirmationOuverture(jeuxModifies) {
    document.getElementById('titre').textContent = 'Stock de départ validé';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="checkmark">✓</div>
      <div class="final-greet">Merci ${employeeCourant.nom} !</div>
      <div class="final-sub">Votre stock de départ est enregistré. Bon quart !</div>
      ${jeuxModifies.length ? `<div class="etat-banner" style="margin-top:14px; text-align:left;">⚠️ Stock corrigé pour ${jeuxModifies.length === 1 ? jeuxModifies[0].nom : `${jeuxModifies.length} jeux`} par rapport au quart précédent — le manager en a été averti.</div>` : ''}
      <div class="etat-banner" style="margin-top:14px;">Quart ${quartActuel} confirmé pour aujourd'hui.<br>Le changement de quart nécessite une validation manager.</div>
      <button class="btn-primary" id="btnRetourAccueilOuv2">Retour à l'accueil</button>
    `;
    document.getElementById('btnRetourAccueilOuv2').addEventListener('click', () => { phase = 'accueil'; renderAccueil(); });
  }

  // ------------------------------------------------------------
  // ACTIVER UN CARNET — utilisable à tout moment du quart, indépendant de
  // l'ouverture/clôture. 09/08/2026, précision de Frédéric : un transfert
  // Bureau → Caisse (fait par le manager, voir NEXUS-FDJ-Manager-v1.html
  // "Réapprovisionner la caisse") n'est PAS une activation — le carnet
  // reste non engagé financièrement tant qu'il n'est pas activé ici, en
  // caisse. C'est SEULEMENT cette action qui ajoute les tickets à l'appro
  // et qui doit s'écrire type_mouvement='activation'.
  // ------------------------------------------------------------
  async function demarrerCarnet() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement des jeux…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    if (!emplacements.length) emplacements = await chargerEmplacements();
    const [mouvements, reference] = await Promise.all([chargerMouvementsStock(), chargerDerniereReference()]);
    derniereReference = reference;
    const caisse = emplacementParType('caisse');
    const bureau = emplacementParType('bureau');
    const bloque = emplacementParType('bloque');
