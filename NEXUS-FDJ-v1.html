    soldesCarnets = NexusFdjMoteur.soldesCarnetsAvecReference(mouvements, { caisse: caisse ? caisse.id : null, bureau: bureau ? bureau.id : null, bloque: bloque ? bloque.id : null }, derniereReference);
    phase = 'carnet';
    renderCarnet();
  }

  function renderCarnet() {
    document.getElementById('titre').textContent = 'Activer un carnet';
    document.getElementById('sousTitre').textContent = 'Touchez un jeu quand vous entamez un carnet confié par le manager — les carnets non activés ne comptent pas encore comme engagés.';
    const groupes = grouperParPalier(jeux);
    document.getElementById('content').innerHTML = `
      <div class="etat-banner" id="compteurCarnets">${carnetsDeclaresCeQuart} carnet${carnetsDeclaresCeQuart > 1 ? 's' : ''} activé${carnetsDeclaresCeQuart > 1 ? 's' : ''} depuis l'ouverture de cette page.</div>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuActivation(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-ghost" id="btnRetourAccueilCarnet">Retour à l'accueil</button>
    `;
    document.querySelectorAll('[data-carnet-jeu]').forEach(row => row.addEventListener('click', () => activerCarnet(row.dataset.carnetJeu)));
    document.getElementById('btnRetourAccueilCarnet').addEventListener('click', () => { phase = 'accueil'; renderAccueil(); });
  }

  function renderJeuActivation(jeu) {
    const solde = soldesCarnets[jeu.id] || { confies: 0, actives: 0, nonActives: 0 };
    const sansStock = solde.nonActives <= 0;
    return `
      <div class="jeu-row" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;" data-carnet-jeu="${jeu.id}">
        <div>
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${sansStock ? 'anomalie' : ''}" style="margin-top:2px;" data-carnet-solde="${jeu.id}">${solde.nonActives} non activé${Math.abs(solde.nonActives) > 1 ? 's' : ''} en caisse${jeu.tickets_par_carnet ? ` · ${fmtNum(jeu.tickets_par_carnet)} tickets/carnet` : ''}</div>
        </div>
        <div class="jeu-ventes calc" data-carnet-label="${jeu.id}" style="white-space:nowrap; margin-left:10px;">Activer</div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // EXCEPTION TRACÉE — 09/08/2026, demande de Frédéric : "Je
  // transformerais ce cas en exception tracée [...] la caissière peut
  // travailler, mais NEXUS crée automatiquement une alerte." Remplace le
  // confirm() générique : quand aucun carnet non activé n'est confié en
  // caisse selon NEXUS, l'employé doit choisir un motif avant de continuer
  // — l'activation se fait quand même, mais une alerte manager est créée
  // automatiquement (fdj_alertes, type='activation_sans_carnet_confie').
  // ------------------------------------------------------------
  const MOTIFS_EXCEPTION_CARNET = [
    { value: 'reappro_non_enregistre', label: 'Réapprovisionnement non enregistré' },
    { value: 'carnet_avant_nexus', label: 'Carnet déjà présent avant NEXUS' },
    { value: 'erreur_stock', label: 'Erreur de stock' },
    { value: 'autre', label: 'Autre' },
  ];

  function demarrerExceptionCarnet(gameId) {
    exceptionCarnetEnCours = gameId;
    motifExceptionChoisi = null;
    phase = 'carnet-exception';
    renderExceptionCarnet();
  }

  function renderExceptionCarnet() {
    const jeu = jeux.find(j => j.id === exceptionCarnetEnCours);
    const solde = soldesCarnets[exceptionCarnetEnCours] || { confies: 0, actives: 0, nonActives: 0 };
    document.getElementById('titre').textContent = 'Aucun carnet confié trouvé';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="etat-banner" style="border-color:var(--amber); color:var(--amber);">⚠️ NEXUS ne trouve aucun carnet ${jeu ? jeu.nom : ''} non activé confié à la caisse (solde actuel : ${solde.nonActives}). Avant de continuer, indiquez pourquoi.</div>
      <div class="motif-grid" id="grilleMotifs">
        ${MOTIFS_EXCEPTION_CARNET.map(m => `
          <div class="motif-item" data-motif="${m.value}">
            <div class="pastille"></div>
            <div>${m.label}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn-primary" id="btnContinuerException" disabled>Continuer et signaler au manager</button>
      <button class="btn-ghost" id="btnAnnulerException">Annuler</button>
    `;
    document.querySelectorAll('#grilleMotifs .motif-item').forEach(el => {
      el.addEventListener('click', () => {
        motifExceptionChoisi = el.dataset.motif;
        document.querySelectorAll('#grilleMotifs .motif-item').forEach(x => x.classList.toggle('selectionne', x.dataset.motif === motifExceptionChoisi));
        document.getElementById('btnContinuerException').disabled = false;
      });
    });
    document.getElementById('btnContinuerException').addEventListener('click', () => {
      const gameId = exceptionCarnetEnCours;
      const motif = motifExceptionChoisi;
      phase = 'carnet';
      renderCarnet();
      executerActivationCarnet(gameId, motif);
    });
    document.getElementById('btnAnnulerException').addEventListener('click', () => {
      exceptionCarnetEnCours = null; motifExceptionChoisi = null;
      phase = 'carnet'; renderCarnet();
    });
  }

  // ------------------------------------------------------------
  // RÉCONCILIATION APPRO ↔ ACTIVATION — 20/08/2026, demande de Frédéric :
  // "une quantité saisie en appro doit toujours être rattachée à une
  // activation existante ou provoquer la création d'une activation
  // manquante". Contrairement à l'exception carnet ci-dessus (déclenchée en
  // DIRECT quand on active un carnet sans stock confié), cette réconciliation
  // se déclenche à la CLÔTURE (Grattage → Tirages) en comparant, jeu par
  // jeu, l'appro (tickets) saisi par l'employé aux activations réellement
  // enregistrées PENDANT ce quart (activationsCarnetQuart) via la fonction
  // pure NexusFdjMoteur.reconciliationApproActivation. Article 5 : si le
  // conditionnement (tickets_par_carnet) est inconnu pour un jeu, NEXUS
  // n'invente jamais d'activation — l'état 'conditionnement_inconnu' est
  // filtré et ignoré silencieusement.
  // ------------------------------------------------------------
  function calculerAnomaliesApproActivation() {
    return jeux
      .map(j => {
        const appro = (countsSaisie[j.id] && countsSaisie[j.id].appro) || 0;
        const activesQuart = activationsCarnetQuart[j.id] || 0;
        const reconciliation = NexusFdjMoteur.reconciliationApproActivation(appro, activesQuart, j.tickets_par_carnet);
        return { jeu: j, reconciliation };
      })
      .filter(r => r.reconciliation.etat !== 'aucun_ecart' && r.reconciliation.etat !== 'conditionnement_inconnu');
  }

  // Activation implicite déduite de l'appro (20/08/2026). À la différence
  // d'executerActivationCarnetInterne (activation EN DIRECT pendant le
  // quart, qui ajoute ses tickets à l'appro via incrementerApproAutomatique),
  // ici l'appro est déjà celui saisi par l'employé à la clôture —
  // l'incrémenter une seconde fois créerait exactement le double comptage
  // que cette fonctionnalité doit éviter, donc cette fonction n'y touche
  // jamais. methode_identification='implicite_appro' (migration du
  // 20/08/2026) distingue ces lignes des activations en direct dans le
  // Journal et pour tout futur rapprochement. Trace systématique dans
  // fdj_audit_log ("avec trace dans le Journal", demande de Frédéric).
  async function creerActivationImplicite(gameId, quantiteCarnets, motifException) {
    const caisse = emplacementParType('caisse');
    const idempotencyKey = genererIdempotencyKey();
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: gameId, shift_id: shiftRow.id, type_mouvement: 'activation', quantite: quantiteCarnets,
      location_source_id: caisse ? caisse.id : null, location_destination_id: caisse ? caisse.id : null,
      methode_identification: 'implicite_appro', booklet_id: null, employee_id: employeeCourant.id,
      idempotency_key: idempotencyKey,
      justification: `Activation déduite automatiquement de l'appro saisi à la clôture (${shiftRow.date} · Quart ${shiftRow.quart}) — aucune activation correspondante enregistrée pendant le quart.${motifException ? ` Anomalie signalée : ${MOTIFS_EXCEPTION_CARNET.find(m => m.value === motifException)?.label || motifException}.` : ''}`,
    });
    if (error && error.code === '23505') return; // rejeu réseau idempotent — même lecture que les autres écritures FDJ (voir executerActivationCarnetInterne)
    if (error) { console.error('Activation implicite depuis appro FDJ:', error); alert("Erreur d'enregistrement d'une activation détectée automatiquement à partir de l'appro. Réessayez."); return; }

    if (motifException) {
      // Même type d'alerte que l'exception carnet en direct
      // (activation_sans_carnet_confie) — un seul panneau manager pour les
      // deux origines, Article 11.
      const { error: eAlerte } = await nexusClient.from('fdj_alertes').insert({
        site: siteId, type: 'activation_sans_carnet_confie', shift_id: shiftRow.id, shift_precedent_id: null,
        game_id: gameId, valeur_quart_precedent: null, valeur_saisie: 0,
        employee_id: employeeCourant.id, motif: motifException,
      });
      if (eAlerte) console.error('Enregistrement alerte activation implicite sans stock FDJ:', eAlerte); // non bloquant
    }

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: shiftRow.id, entite_type: 'fdj_stock_movement', entite_id: null,
      action: 'fdj_activation_implicite_appro', acteur_id: employeeCourant.id, motif: motifException || null,
      nouvelle_valeur: { game_id: gameId, quantite_carnets: quantiteCarnets, methode_identification: 'implicite_appro' },
    });
  }

  // Écran séquentiel (un jeu à la fois) pour les activations implicites SANS
  // stock non-activé suffisant en caisse — 20/08/2026, demande de Frédéric :
  // "Aucun carnet non activé n'est actuellement enregistré en caisse. D'où
  // provient ce carnet ?" Réutilise le motif-grid et la liste
  // MOTIFS_EXCEPTION_CARNET déjà utilisés par renderExceptionCarnet
  // (Article 11 : même liste de motifs pour les deux origines d'exception,
  // au lieu d'en dupliquer une seconde quasi identique).
  function demarrerExceptionsCloture(queue) {
    queueExceptionCloture = queue;
    indexExceptionCloture = 0;
    motifExceptionClotureChoisi = null;
    phase = 'cloture-exception';
    renderExceptionCloture();
  }

  function renderExceptionCloture() {
    const item = queueExceptionCloture[indexExceptionCloture];
    if (!item) { phase = 'tirages'; renderTirages(); return; }
    const jeu = jeux.find(j => j.id === item.gameId);
    document.getElementById('titre').textContent = 'Aucun carnet non activé en caisse';
    document.getElementById('sousTitre').textContent = `${indexExceptionCloture + 1} / ${queueExceptionCloture.length}`;
    document.getElementById('content').innerHTML = `
      <div class="etat-banner" style="border-color:var(--amber); color:var(--amber);">⚠️ Aucun carnet non activé n'est actuellement enregistré en caisse pour ${jeu ? jeu.nom : ''}, mais l'appro saisi correspond à ${item.manque} carnet${item.manque > 1 ? 's' : ''} de plus que ce que NEXUS a retrouvé. D'où provient ${item.manque > 1 ? 'ces carnets' : 'ce carnet'} ?</div>
      <div class="motif-grid" id="grilleMotifsCloture">
        ${MOTIFS_EXCEPTION_CARNET.map(m => `
          <div class="motif-item" data-motif="${m.value}">
            <div class="pastille"></div>
            <div>${m.label}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn-primary" id="btnContinuerExceptionCloture" disabled>Confirmer</button>
    `;
    document.querySelectorAll('#grilleMotifsCloture .motif-item').forEach(el => {
      el.addEventListener('click', () => {
        motifExceptionClotureChoisi = el.dataset.motif;
        document.querySelectorAll('#grilleMotifsCloture .motif-item').forEach(x => x.classList.toggle('selectionne', x.dataset.motif === motifExceptionClotureChoisi));
        document.getElementById('btnContinuerExceptionCloture').disabled = false;
      });
    });
    document.getElementById('btnContinuerExceptionCloture').addEventListener('click', async () => {
      const btn = document.getElementById('btnContinuerExceptionCloture');
      btn.disabled = true; btn.textContent = 'Enregistrement…';
      await creerActivationImplicite(item.gameId, item.manque, motifExceptionClotureChoisi);
      indexExceptionCloture++;
      motifExceptionClotureChoisi = null;
      renderExceptionCloture();
    });
  }

  // Point d'entrée appelé par btnSuiteGrattage — retourne 'continuer' (rien
  // à faire ou déjà traité), 'annule' (l'employé a choisi "Corriger l'appro",
  // reste sur Grattage) ou 'exception' (redirigé vers
  // demarrerExceptionsCloture, qui ramènera lui-même à Tirages une fois la
  // queue vidée). Même philosophie que le contrôle "stock final manquant"
  // juste au-dessus dans btnSuiteGrattage : un seul confirm() combiné pour
  // tous les jeux concernés, jamais une popup par jeu.
  async function verifierReconciliationApproActivation() {
    const anomalies = calculerAnomaliesApproActivation();
    const nonCouverts = anomalies.filter(a => a.reconciliation.etat === 'appro_non_couvert');
    const enExces = anomalies.filter(a => a.reconciliation.etat === 'appro_en_exces');
    const nonMultiples = anomalies.filter(a => a.reconciliation.etat === 'appro_non_multiple');

    if (enExces.length || nonMultiples.length) {
      const lignes = [];
      nonMultiples.forEach(a => lignes.push(`• ${a.jeu.nom} : l'appro saisi (${a.reconciliation.appro} tickets) ne correspond pas au conditionnement d'un carnet complet (${a.jeu.tickets_par_carnet} tickets/carnet). Vérifiez la quantité.`));
      enExces.forEach(a => lignes.push(`• ${a.jeu.nom} : ${a.reconciliation.carnetsActives} carnet(s) activé(s) ce quart pour seulement ${a.reconciliation.appro} tickets d'appro saisis — écart à vérifier.`));
      alert(`À vérifier avant de continuer :\n${lignes.join('\n')}`);
    }

    if (!nonCouverts.length) return 'continuer';

    const lignes = nonCouverts.map(a => `• ${a.jeu.nom} : ${a.reconciliation.appro} tickets en appro = ${a.reconciliation.carnetsImpliques} carnet${a.reconciliation.carnetsImpliques > 1 ? 's' : ''} non retrouvé(s) en activation.`);
    const message = `Activation non enregistrée détectée pour ${nonCouverts.length} jeu${nonCouverts.length > 1 ? 'x' : ''} :\n${lignes.join('\n')}\n\nNEXUS n'a trouvé aucune activation correspondante pendant ce quart.\n\nConfirmer l'activation de ${nonCouverts.length > 1 ? 'ces carnets' : 'ce carnet'} ?`;
    if (!confirm(message)) return 'annule';

    const enAttenteExceptions = [];
    for (const a of nonCouverts) {
      const solde = soldesCarnets[a.jeu.id] || { nonActives: 0 };
      const manque = a.reconciliation.carnetsImpliques;
      const disponible = Math.max(solde.nonActives, 0);
      const couvert = Math.min(manque, disponible);
      const nonCouvert = manque - couvert;
      if (couvert > 0) {
        await creerActivationImplicite(a.jeu.id, couvert, null);
        solde.nonActives = disponible - couvert;
        soldesCarnets[a.jeu.id] = solde;
      }
      if (nonCouvert > 0) enAttenteExceptions.push({ gameId: a.jeu.id, manque: nonCouvert });
    }
    if (enAttenteExceptions.length) { demarrerExceptionsCloture(enAttenteExceptions); return 'exception'; }
    return 'continuer';
  }

  // V1 sans scanner ni numéro de carnet saisi → methode_identification =
  // 'quantite', booklet_id reste null (aucun carnet précis identifié).
  // L'activation se fait "sur place" en caisse : source et destination
  // sont toutes les deux Caisse — ce n'est pas un déplacement physique,
  // seul l'état du carnet change (non activé → activé).
  // Si aucun carnet non activé n'est confié (solde.nonActives <= 0), passe
  // par l'exception tracée (renderExceptionCarnet) avant de continuer ici.
  async function activerCarnet(gameId) {
    const solde = soldesCarnets[gameId] || { confies: 0, actives: 0, nonActives: 0 };
    if (solde.nonActives <= 0) { demarrerExceptionCarnet(gameId); return; }
    await executerActivationCarnet(gameId, null);
  }

  // FDJ Fiabilisation Étape 5 (18/08/2026, cahier §9/§12/§13 "Idempotence des
  // activations et appro tickets", P0) — même convention que
  // NEXUS-Carburant-Reception-v1.html/genererIdempotencyKey : une clé
  // générée UNE SEULE FOIS par tentative d'écriture, envoyée avec l'insert,
  // rattachée à un index unique côté base (fdj_stock_movements_idempotency_
  // key_uniq). Un rejeu réseau de la même tentative porte la même clé et se
  // heurte au conflit 23505, traité comme un succès idempotent — jamais
  // comme une vraie erreur.
  function genererIdempotencyKey() {
    return (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  async function executerActivationCarnet(gameId, motifException) {
    // Garde-fou anti double-tap : un tap sur une ligne déjà en cours
    // d'activation est ignoré silencieusement plutôt que de relancer un
    // deuxième insert avant que le premier n'ait répondu — c'est le point
    // d'écriture FDJ qui n'avait aucune protection avant cette étape
    // (contrairement aux boutons manager, tous désactivés pendant l'écriture).
    if (activationsEnCours.has(gameId)) return;
    activationsEnCours.add(gameId);
    try {
      await executerActivationCarnetInterne(gameId, motifException);
    } finally {
      activationsEnCours.delete(gameId);
    }
  }

  async function executerActivationCarnetInterne(gameId, motifException) {
    const jeu = jeux.find(j => j.id === gameId);
    const solde = soldesCarnets[gameId] || { confies: 0, actives: 0, nonActives: 0 };
    const label = document.querySelector(`[data-carnet-label="${gameId}"]`);
    const ticketsParCarnet = (jeu && jeu.tickets_par_carnet !== null && jeu.tickets_par_carnet !== undefined) ? Number(jeu.tickets_par_carnet) : null;
    if (label) label.textContent = '…';
    const caisse = emplacementParType('caisse');
    const idempotencyKey = genererIdempotencyKey();
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: gameId, shift_id: shiftRow.id, type_mouvement: 'activation', quantite: 1,
      location_source_id: caisse ? caisse.id : null, location_destination_id: caisse ? caisse.id : null,
      methode_identification: 'quantite', booklet_id: null, employee_id: employeeCourant.id,
      idempotency_key: idempotencyKey,
      justification: `Carnet activé en cours de quart (${shiftRow.date} · Quart ${shiftRow.quart}).${ticketsParCarnet ? ` +${ticketsParCarnet} tickets ajoutés automatiquement à l'appro (Nb de tickets par livret).` : ' Quantité par carnet inconnue pour ce jeu — appro à saisir à la main à la clôture.'}${motifException ? ` Exception tracée : ${MOTIFS_EXCEPTION_CARNET.find(m => m.value === motifException)?.label || motifException}.` : ''}`,
    });
    if (error && error.code === '23505') {
      // Rejeu réseau de cette même tentative (clé déjà posée) : l'écriture a
      // déjà eu lieu au premier passage, y compris l'incrément d'appro —
      // rien à refaire ici, ce n'est jamais une vraie erreur (même lecture
      // du code 23505 que fdj_releves_cloture, voir plus bas dans ce fichier).
      if (label) { label.textContent = 'Activer'; }
      return;
    }
    if (error) {
      console.error('Activation carnet FDJ:', error);
      if (label) label.textContent = 'Activer';
      alert("Erreur d'enregistrement. Réessayez.");
      return;
    }

    // Exception tracée (09/08/2026, demande de Frédéric) — l'activation
    // s'est faite sans carnet confié enregistré : signale automatiquement
    // au manager plutôt que de laisser un confirm() local et silencieux.
    if (motifException) {
      const { error: eAlerte } = await nexusClient.from('fdj_alertes').insert({
        site: siteId, type: 'activation_sans_carnet_confie', shift_id: shiftRow.id, shift_precedent_id: null,
        game_id: gameId, valeur_quart_precedent: null, valeur_saisie: solde.nonActives,
        employee_id: employeeCourant.id, motif: motifException,
      });
      if (eAlerte) console.error('Enregistrement alerte activation sans carnet FDJ:', eAlerte); // non bloquant
    }

    // Ajoute automatiquement les tickets du carnet à l'appro du quart —
    // évite à l'employé de devoir connaître/retaper ce chiffre à la
    // clôture (09/08/2026, demande de Frédéric, à partir du fichier réel
    // "Inventaire Grattage – Gamme Intégrale_0.xlsx"). C'est bien
    // uniquement ICI, à l'activation, que l'appro bouge — jamais au
    // transfert Bureau → Caisse.
    if (ticketsParCarnet) await incrementerApproAutomatique(gameId, ticketsParCarnet);

    solde.actives += 1;
    solde.nonActives = solde.confies - solde.actives;
    soldesCarnets[gameId] = solde;
    const soldeEl = document.querySelector(`[data-carnet-solde="${gameId}"]`);
    if (soldeEl) {
      soldeEl.textContent = `${solde.nonActives} non activé${Math.abs(solde.nonActives) > 1 ? 's' : ''} en caisse${jeu && jeu.tickets_par_carnet ? ` · ${fmtNum(jeu.tickets_par_carnet)} tickets/carnet` : ''}`;
      soldeEl.classList.toggle('anomalie', solde.nonActives <= 0);
    }

    carnetsDeclaresCeQuart++;
    const compteur = document.getElementById('compteurCarnets');
    if (compteur) compteur.textContent = `${carnetsDeclaresCeQuart} carnet${carnetsDeclaresCeQuart > 1 ? 's' : ''} activé${carnetsDeclaresCeQuart > 1 ? 's' : ''} depuis l'ouverture de cette page.`;
    if (label) {
      label.textContent = ticketsParCarnet ? `✓ +${ticketsParCarnet} tickets` : '✓ Activé (manuel)';
      label.style.color = 'var(--green)';
      setTimeout(() => { if (label) { label.textContent = 'Activer'; label.style.color = ''; } }, 1400);
    }
  }

  // ------------------------------------------------------------
  // CLÔTURE — en fin de quart. Le stock de départ est déjà validé à
  // l'ouverture (lecture seule ici) ; seuls appro et stock final restent
  // saisissables (09/08/2026, demande de Frédéric).
  // ------------------------------------------------------------
  async function demarrerCloture() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement des jeux…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    if (!emplacements.length) emplacements = await chargerEmplacements();
    const { data: existants } = await nexusClient.from('fdj_shift_counts').select('*').eq('shift_id', shiftRow.id);
    (existants || []).forEach(c => { countsSaisie[c.game_id] = { stock_initial: c.stock_initial, appro: c.appro, stock_final: c.stock_final }; });
    // Réconciliation appro ↔ activation (20/08/2026) : besoin des activations
    // DE CE QUART (activationsCarnetQuart) et du solde non-activé COURANT
    // (soldesCarnets, même calcul que "Activer un carnet") pour distinguer,
    // à btnSuiteGrattage, une activation manquante couverte par du stock
    // confié en caisse d'une activation manquante sans aucun stock (voir
    // verifierReconciliationApproActivation / demarrerExceptionsCloture).
    const [mouvementsCloture, referenceCloture, activationsQuart] = await Promise.all([
      chargerMouvementsStock(), chargerDerniereReference(), chargerActivationsQuart(shiftRow.id),
    ]);
    derniereReference = referenceCloture;
    activationsCarnetQuart = activationsQuart;
    const caisseCloture = emplacementParType('caisse');
    const bureauCloture = emplacementParType('bureau');
    const bloqueCloture = emplacementParType('bloque');
    soldesCarnets = NexusFdjMoteur.soldesCarnetsAvecReference(mouvementsCloture, { caisse: caisseCloture ? caisseCloture.id : null, bureau: bureauCloture ? bureauCloture.id : null, bloque: bloqueCloture ? bloqueCloture.id : null }, derniereReference);
    // Reprise d'un brouillon déjà enregistré côté serveur (20/08/2026,
    // cahier "FDJ - Audit de consolidation", FDJ-02 : "L'employé qui revient
    // sur le même quart retrouve ses valeurs"). Avant ce jour, seuls les
    // comptages (fdj_shift_counts, ligne au-dessus) pouvaient exister sans
    // validation — rapports et caisse n'étaient écrits qu'à la toute fin.
    // Depuis "Laisser en brouillon" (enregistrerCaisseQuart), ces deux
    // tables peuvent elles aussi porter des valeurs pour un quart encore
    // 'brouillon' : le serveur fait foi en premier, le brouillon local ne
    // sert plus que de filet pour ce qui a été tapé après le dernier
    // enregistrement serveur — même hiérarchie que pour stock_final ci-dessous.
    const [{ data: reportsExistants }, { data: cashExistant }] = await Promise.all([
      nexusClient.from('fdj_reports').select('*').eq('shift_id', shiftRow.id),
      nexusClient.from('fdj_cash_controls').select('*').eq('shift_id', shiftRow.id).maybeSingle(),
    ]);
    (reportsExistants || []).forEach(r => {
      if (r.type_rapport === 'journalier') reportJournalier = { lots_payes_grattage: r.lots_payes_grattage };
      else if (r.type_rapport === 'temps_reel') reportTempsReel = { caisse_tirages: r.caisse_tirages };
    });
    if (cashExistant) {
      regularisations = cashExistant.regularisations || 0;
      caisseReelle = cashExistant.caisse_reelle != null ? Number(cashExistant.caisse_reelle) : null;
    }
    phase = 'grattage';
    const draft = chargerDraft('cloture');
    if (draft) {
      // Le stock de départ reste celui validé à l'ouverture. L'appro n'est
      // PAS repris du brouillon local : depuis qu'un carnet ouvert peut
      // l'incrémenter automatiquement en base pendant que l'employé est
      // sorti de cet écran (09/08/2026), seule la valeur fraîche de la
      // base fait foi pour l'appro — sinon un brouillon local périmé
      // écraserait silencieusement les tickets ajoutés entre-temps. Seul
      // le stock final (jamais touché ailleurs) se reprend du brouillon.
      Object.keys(draft.countsSaisie || {}).forEach(gid => {
        if (!countsSaisie[gid]) countsSaisie[gid] = { stock_initial: null, appro: 0, stock_final: null };
        countsSaisie[gid].stock_final = draft.countsSaisie[gid].stock_final;
      });
      reportJournalier = draft.reportJournalier || reportJournalier;
      reportTempsReel = draft.reportTempsReel || reportTempsReel;
      regularisations = draft.regularisations || 0;
      caisseReelle = draft.caisseReelle !== undefined ? draft.caisseReelle : null;
    }
    jeux.forEach(j => { if (!countsSaisie[j.id]) countsSaisie[j.id] = { stock_initial: null, appro: 0, stock_final: null }; });
    renderGrattage();
  }

  // ------------------------------------------------------------
  // PHASE 1 — GRATTAGE (reproduit CONTROLE CAISSE : Stock initial / Appro /
  // Stock final par jeu, groupés par palier de prix comme la feuille papier).
  // ------------------------------------------------------------
  function renderStepper(etape) {
    const etapes = ['Grattage', 'Tirages', 'Caisse', 'Résumé'];
    const idx = etapes.indexOf(etape);
    return `
      <div class="stepper">${etapes.map((e,i) => `<div class="stepper-item ${i < idx ? 'fait' : (i === idx ? 'actif' : '')}"></div>`).join('')}</div>
      <div class="stepper-label">Étape ${idx+1} sur ${etapes.length} — ${etape}</div>
    `;
  }

  function grouperParPalier(liste) {
    const groupes = {};
    for (const j of liste) {
      const cle = j.prix;
      if (!groupes[cle]) groupes[cle] = { prix: cle, items: [] };
      groupes[cle].items.push(j);
    }
    return Object.values(groupes).sort((a,b) => a.prix - b.prix);
  }

  function renderGrattage() {
    document.getElementById('titre').textContent = 'Grattage';
    document.getElementById('sousTitre').textContent = 'Stock de départ déjà validé à l\'ouverture. Saisissez l\'appro reçu et le stock final compté — les ventes se calculent toutes seules.';
    const comptes = jeux.filter(jeuEstCompte).length;
    const groupes = grouperParPalier(jeux);
    const anomalies = jeuxAvecVentesNegatives();
    document.getElementById('content').innerHTML = `
      ${renderStepper('Grattage')}
      <div class="etat-banner">${comptes} / ${jeux.length} jeux comptés</div>
      <div class="etat-banner" id="banniereAnomalies" style="${anomalies.length ? '' : 'display:none;'} border-color:var(--red); color:var(--red);">⚠️ ${anomalies.length} jeu${anomalies.length > 1 ? 'x' : ''} avec des ventes négatives — vérifiez le stock saisi.</div>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">
            ${g.items.map(j => renderJeuRow(j)).join('')}
          </div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnSuiteGrattage">Continuer — Tirages</button>
      <button class="btn-ghost" id="btnRetourAccueil1">Retour</button>
    `;
    wireJeuInputs();
    document.getElementById('btnSuiteGrattage').addEventListener('click', async () => {
      // Case vide ≠ zéro deviné (09/08/2026, demande de Frédéric) : un stock
      // final laissé vide peut aussi bien vouloir dire "je n'ai pas encore
      // compté ce jeu" que "il n'en reste plus, j'ai oublié de taper 0" —
      // les deux se ressemblent sur la feuille papier réelle. NEXUS ne
      // tranche jamais seul : il demande, une seule fois, pour tous les
      // jeux concernés d'un coup plutôt qu'une popup par jeu.
      const manquants = jeuxSansStockFinal();
      if (manquants.length) {
        const message = manquants.length === 1
          ? `${manquants[0].nom} : aucun stock final renseigné. Confirmez-vous qu'il n'y a plus aucun carnet en stock (0) ?`
          : `${manquants.length} jeux sans stock final renseigné :\n${manquants.map(j => `• ${j.nom}`).join('\n')}\n\nConfirmez-vous qu'il n'y a plus de stock (0) pour ces jeux ?`;
        if (!confirm(message)) return; // reste sur l'écran, l'employé va vérifier ces jeux
        manquants.forEach(j => { countsSaisie[j.id].stock_final = 0; });
        sauvegarderDraft();
      }
      // Réconciliation appro ↔ activation (20/08/2026, demande de Frédéric)
      // — même logique "un seul prompt combiné" que ci-dessus, voir
      // verifierReconciliationApproActivation.
      const btnSuite = document.getElementById('btnSuiteGrattage');
      btnSuite.disabled = true;
      const resultat = await verifierReconciliationApproActivation();
      if (btnSuite) btnSuite.disabled = false;
      if (resultat === 'annule') return; // reste sur Grattage, l'employé corrige l'appro
      if (resultat === 'exception') return; // demarrerExceptionsCloture a déjà changé d'écran
      phase = 'tirages'; renderTirages();
    });
    document.getElementById('btnRetourAccueil1').addEventListener('click', () => { phase = 'accueil'; renderAccueil(); });
  }

  function renderJeuRow(jeu) {
    const s = countsSaisie[jeu.id] || { stock_initial: null, appro: 0, stock_final: null };
    const v = calculerVentes(jeu.id);
    const anomalie = v.qte !== null && v.qte < 0;
    return `
      <div class="jeu-row ${anomalie ? 'anomalie' : ''}" data-jeu="${jeu.id}">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${anomalie ? 'anomalie' : (v.valeur !== null ? 'calc' : '')}">${anomalie ? `⚠️ Anomalie : ${fmtNum(v.qte)}` : (v.qte !== null ? `Ventes : ${fmtNum(v.qte)} · ${fmtEuro(v.valeur)}` : 'Ventes : —')}</div>
        </div>
        <div class="jeu-inputs">
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Départ</div>
            <div class="jeu-input-readonly" title="Déjà validé à l'ouverture du quart">${fmtNum(s.stock_initial)}</div>
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Appro</div>
            <input type="number" inputmode="decimal" class="jeu-input champ-appro" data-jeu="${jeu.id}" data-champ="appro" value="${s.appro ?? 0}">
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Final</div>
            <input type="number" inputmode="decimal" class="jeu-input champ-stock-final" data-jeu="${jeu.id}" data-champ="stock_final" value="${s.stock_final ?? ''}">
          </div>
        </div>
      </div>
    `;
  }
  function wireJeuInputs() {
    document.querySelectorAll('.jeu-input').forEach(input => {
      input.addEventListener('input', () => {
        const gameId = input.dataset.jeu, champ = input.dataset.champ;
        const val = input.value === '' ? null : Number(input.value);
        if (!countsSaisie[gameId]) countsSaisie[gameId] = { stock_initial: null, appro: 0, stock_final: null };
        countsSaisie[gameId][champ] = val;
        sauvegarderDraft();
        const row = input.closest('.jeu-row');
        const venteEl = row.querySelector('.jeu-ventes');
        const v = calculerVentes(gameId);
        const anomalie = v.qte !== null && v.qte < 0;
        row.classList.toggle('anomalie', anomalie);
        venteEl.className = `jeu-ventes ${anomalie ? 'anomalie' : (v.valeur !== null ? 'calc' : '')}`;
        venteEl.textContent = anomalie ? `⚠️ Anomalie : ${fmtNum(v.qte)}` : (v.qte !== null ? `Ventes : ${fmtNum(v.qte)} · ${fmtEuro(v.valeur)}` : 'Ventes : —');
        const banniere = document.getElementById('content').querySelector('.etat-banner');
        if (banniere) banniere.textContent = `${jeux.filter(jeuEstCompte).length} / ${jeux.length} jeux comptés`;
        const anomalies = jeuxAvecVentesNegatives();
        const banniereAnomalies = document.getElementById('banniereAnomalies');
        if (banniereAnomalies) {
          banniereAnomalies.style.display = anomalies.length ? '' : 'none';
          banniereAnomalies.textContent = `⚠️ ${anomalies.length} jeu${anomalies.length > 1 ? 'x' : ''} avec des ventes négatives — vérifiez le stock saisi.`;
        }
      });
      input.addEventListener('keydown', jeuInputToucheEntree);
    });
  }

  // ------------------------------------------------------------
  // PHASE 2 — TIRAGES (les deux seules valeurs indispensables des rapports
  // FDJ réels, jamais le rapport recopié en entier — audit §17).
  // ------------------------------------------------------------
  function renderTirages() {
    document.getElementById('titre').textContent = 'Tirages';
    document.getElementById('sousTitre').textContent = "Deux valeurs prises sur les rapports FDJ imprimés en caisse — gardez les tickets agrafés à la feuille papier si vous en imprimez encore une.";
    document.getElementById('content').innerHTML = `
      ${renderStepper('Tirages')}
      <div class="champ-label">Total des lots payés — grattage (RAPPORT JOURNALIER)</div>
      <input type="number" inputmode="decimal" class="champ-input" id="champLotsPayes" value="${reportJournalier.lots_payes_grattage ?? ''}" placeholder="0,00">
      <div class="champ-note">Ligne "Total des lots payés" en bas du RAPPORT JOURNALIER.</div>

      <div class="champ-label">Caisse tirages (RAPPORT JOURNALIER TEMPS RÉEL)</div>
      <div class="champ-input-signe-row">
        <button type="button" class="btn-signe ${(reportTempsReel.caisse_tirages ?? 0) < 0 ? 'actif' : ''}" id="btnSigneCaisseTirages" aria-label="Rendre négatif / positif">±</button>
        <input type="number" inputmode="decimal" class="champ-input" id="champCaisseTirages" value="${reportTempsReel.caisse_tirages ?? ''}" placeholder="0,00">
      </div>
      <div class="champ-note">Ligne "CAISSE" du RAPPORT JOURNALIER TEMPS RÉEL ON-LINE (Loto, Keno, Amigo…). Peut être négative (bouton ± à gauche) si le rapport l'indique.</div>

      <div class="etat-banner">Caisse grattage calculée : <b>${fmtEuro(caisseGrattage())}</b> (ventes grattage ${fmtEuro(ventesGrattageTotal())} − lots payés ${fmtEuro(reportJournalier.lots_payes_grattage)})</div>

      <button class="btn-primary" id="btnSuiteTirages">Continuer — Caisse</button>
      <button class="btn-ghost" id="btnRetourGrattage">Retour</button>
    `;
    document.getElementById('champLotsPayes').addEventListener('input', e => { reportJournalier.lots_payes_grattage = e.target.value === '' ? null : Number(e.target.value); sauvegarderDraft(); majBanniereTirages(); });
    document.getElementById('champCaisseTirages').addEventListener('input', e => {
      reportTempsReel.caisse_tirages = e.target.value === '' ? null : Number(e.target.value);
      document.getElementById('btnSigneCaisseTirages').classList.toggle('actif', (reportTempsReel.caisse_tirages ?? 0) < 0);
      sauvegarderDraft();
    });
    // Bouton ± (10/08/2026) : inverse le signe de la valeur déjà saisie,
    // garantit un moyen d'entrer une caisse tirages négative même quand le
    // clavier numérique mobile n'affiche pas la touche "-".
    document.getElementById('btnSigneCaisseTirages').addEventListener('click', () => {
      const input = document.getElementById('champCaisseTirages');
      const valeur = input.value === '' ? 0 : Number(input.value);
      const inversee = -valeur;
      input.value = inversee === 0 ? '' : inversee;
      reportTempsReel.caisse_tirages = input.value === '' ? null : inversee;
      document.getElementById('btnSigneCaisseTirages').classList.toggle('actif', inversee < 0);
      sauvegarderDraft();
      input.focus();
    });
    document.getElementById('btnSuiteTirages').addEventListener('click', () => { phase = 'caisse'; renderCaisse(); });
    document.getElementById('btnRetourGrattage').addEventListener('click', () => { phase = 'grattage'; renderGrattage(); });
  }
  function majBanniereTirages() {
    const b = document.querySelector('.etat-banner');
    if (b) b.innerHTML = `Caisse grattage calculée : <b>${fmtEuro(caisseGrattage())}</b> (ventes grattage ${fmtEuro(ventesGrattageTotal())} − lots payés ${fmtEuro(reportJournalier.lots_payes_grattage)})`;
  }

  // ------------------------------------------------------------
  // PHASE 3 — CAISSE (attendue calculée en interne, réelle comptée par
  // l'employé). 28/08/2026, demande de Frédéric ("l'employé ne doit jamais
  // pouvoir rechercher la valeur attendue") : ni la caisse attendue ni
  // l'écart ne sont affichés ici — seulement une confirmation que la
  // saisie est complète. NEXUS calcule et enregistre l'écart exactement de
  // la même façon en coulisses ; seul l'affichage disparaît avant clôture.
  // Remplace la décision du 16/08/2026 qui l'affichait en direct (voir
  // commentaire d'en-tête du fichier).
  // ------------------------------------------------------------
  function renderCaisse() {
    document.getElementById('titre').textContent = 'Caisse FDJ';
    document.getElementById('sousTitre').textContent = 'Comptez la caisse réelle et notez-la ici.';
    document.getElementById('content').innerHTML = `
      ${renderStepper('Caisse')}
      <div class="champ-label">Régularisations (si besoin, +/-)</div>
      <input type="number" inputmode="decimal" class="champ-input" id="champRegul" value="${regularisations ?? 0}" placeholder="0,00">

      <div class="champ-label">Caisse réelle comptée</div>
      <input type="number" inputmode="decimal" class="champ-input" id="champCaisseReelle" value="${caisseReelle ?? ''}" placeholder="0,00">

      <div class="champ-note">Le résultat (attendu, déclaré, écart) vous sera présenté juste après la clôture de votre caisse — pas avant.</div>

      <button class="btn-primary" id="btnSuiteCaisse" ${caisseReelle === null ? 'disabled' : ''}>Continuer — Résumé</button>
      <button class="btn-ghost" id="btnRetourTirages">Retour</button>
    `;
    document.getElementById('champRegul').addEventListener('input', e => {
      regularisations = e.target.value === '' ? 0 : Number(e.target.value);
      sauvegarderDraft();
    });
    document.getElementById('champCaisseReelle').addEventListener('input', e => {
      caisseReelle = e.target.value === '' ? null : Number(e.target.value);
      sauvegarderDraft();
      document.getElementById('btnSuiteCaisse').disabled = (caisseReelle === null);
    });
    document.getElementById('btnSuiteCaisse').addEventListener('click', () => { phase = 'resume'; renderResume(); });
    document.getElementById('btnRetourTirages').addEventListener('click', () => { phase = 'tirages'; renderTirages(); });
  }

  // ------------------------------------------------------------
  // PHASE 4 — RÉSUMÉ + CLÔTURE. 28/08/2026, demande de Frédéric : ni la
  // carte "écart de caisse" ni "Caisse attendue" ne sont montrées ici —
  // les deux permettraient à l'employé de déduire l'écart (Attendu −
  // Déclaré) avant même de clôturer, exactement ce que la nouvelle règle
  // interdit. Seuls les éléments que l'employé a lui-même saisis sont
  // récapitulés — dernière chance de les vérifier/corriger avant clôture,
  // puisqu'après ce bouton l'employé ne pourra plus les modifier
  // directement (voir demarrerDemandeCorrection). Remplace la décision du
  // 16/08/2026 (voir commentaire d'en-tête du fichier).
  // ------------------------------------------------------------
  function renderResume() {
    document.getElementById('titre').textContent = 'Résumé de votre saisie';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      ${renderStepper('Résumé')}
      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Ventes grattage (calculées)</div><div class="stat-value">${fmtEuro(ventesGrattageTotal())}</div></div>
        <div class="stat-row"><div class="stat-label">Lots payés</div><div class="stat-value">${fmtEuro(reportJournalier.lots_payes_grattage)}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse tirages</div><div class="stat-value">${fmtEuro(reportTempsReel.caisse_tirages)}</div></div>
        <div class="stat-row"><div class="stat-label">Régularisations</div><div class="stat-value">${fmtEuro(regularisations)}</div></div>
        <div class="stat-row" style="margin-bottom:0;"><div class="stat-label">Caisse réelle comptée</div><div class="stat-value">${fmtEuro(caisseReelle)}</div></div>
      </div>
      <div class="champ-note">En clôturant, vous confirmez que ces informations correspondent à votre contrôle de fin de quart. Cette déclaration sera figée — vous ne pourrez plus la modifier vous-même, seulement demander une correction au manager. Le résultat (attendu, déclaré, écart) vous sera présenté juste après.</div>
      <button class="btn-primary" id="btnValider">CLÔTURER MA CAISSE</button>
      <button class="btn-ghost" id="btnRetourCaisse">Retour</button>
    `;
    document.getElementById('btnValider').addEventListener('click', orchestrerSortieCaisse);
    document.getElementById('btnRetourCaisse').addEventListener('click', () => { phase = 'caisse'; renderCaisse(); });
  }

  // Modale de sortie de caisse (16/08/2026, demande de Frédéric — remplace
  // le confirm() natif du navigateur, "beaucoup plus pédagogique et
  // beaucoup moins brutal qu'une boîte système"). Étendue le 20/08/2026
  // (cahier "FDJ - Audit de consolidation", §2, Nouveauté P0) : brouillon vs
  // clôture définitive. 28/08/2026, demande de Frédéric : ne révèle plus
  // l'écart ("Écart constaté" et l'avertissement ambre retirés) — la
  // clôture doit rester une déclaration à l'aveugle, jamais une occasion de
  // rechercher/ajuster vers le bon résultat avant de valider. Retourne une
  // chaîne : 'valider' | 'brouillon' | null (fermeture/annulation).
  const messageConfirmationCloture = "Cette action fige définitivement votre déclaration (stock, montants, caisse réelle) — vous ne pourrez plus la modifier vous-même. Le résultat (attendu, déclaré, écart) vous sera présenté juste après.";
  function demanderConfirmationCloture() {
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.className = 'cloture-overlay';
      overlay.innerHTML = `
        <div class="cloture-modal">
          <div class="cloture-titre">Vous avez terminé la saisie de cette caisse. Que souhaitez-vous faire ?</div>
          <div class="cloture-texte">${messageConfirmationCloture}</div>
          <div class="cloture-actions">
            <button type="button" class="btn-primary" id="btnClotureValider">Clôturer ma caisse</button>
            <button type="button" class="btn-ghost" id="btnClotureBrouillon">Laisser en brouillon</button>
            <button type="button" class="btn-ghost" id="btnClotureRetour">Retourner au contrôle</button>
          </div>
          <div class="champ-note" style="margin-top:8px;">Un brouillon reste enregistré et modifiable — il n'entre ni dans les rapports ni dans les statistiques tant qu'il n'est pas clôturé. Vous pourrez le reprendre plus tard, depuis n'importe quel poste.</div>
        </div>
      `;
      document.body.appendChild(overlay);
      const fermer = (resultat) => { overlay.remove(); resolve(resultat); };
      document.getElementById('btnClotureValider').addEventListener('click', () => fermer('valider'));
      document.getElementById('btnClotureBrouillon').addEventListener('click', () => fermer('brouillon'));
      document.getElementById('btnClotureRetour').addEventListener('click', () => fermer(null));
      overlay.addEventListener('click', e => { if (e.target === overlay) fermer(null); });
    });
  }

  // Orchestrateur (20/08/2026) : affiche le choix, puis délègue à
  // enregistrerCaisseQuart() (écriture commune aux deux issues) suivi soit
  // de finaliserQuart() (transmission définitive), soit de
  // confirmerBrouillonQuart() (enregistrement sans transmission). Le
  // verrouillage du bouton se fait ICI, avant tout appel réseau, pour les
  // deux chemins — même discipline anti-double-clic que l'ancien
  // validerQuart() (FDJ-04 : un double clic ne doit produire qu'une seule
  // soumission, jamais deux écritures concurrentes).
  async function orchestrerSortieCaisse() {
    const choix = await demanderConfirmationCloture();
    if (choix !== 'valider' && choix !== 'brouillon') return; // fermeture/annulation : reste sur l'écran, rien n'est écrit

    const btn = document.getElementById('btnValider');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    const ecrit = await enregistrerCaisseQuart();
    if (!ecrit) { btn.disabled = false; btn.textContent = 'CLÔTURER MA CAISSE'; return; } // message d'erreur déjà affiché par enregistrerCaisseQuart()

    if (choix === 'valider') await finaliserQuart();
    else await confirmerBrouillonQuart();
  }

  // Écriture commune aux deux issues (Valider / Laisser en brouillon) —
  // comptages, rapports, rapprochement de caisse. Ne touche JAMAIS
  // fdj_shifts.statut (ni la fiche de clôture immuable, réservée à
  // finaliserQuart()) : une caisse enregistrée ici en brouillon reste par
  // construction exclue de toutes les vues agrégées FDJ, qui filtrent déjà
  // `statut_caisse <> 'provisoire'` (view_fdj_shift_facts et dérivées) — le
  // statut 'provisoire' posé plus bas est le même, que la caisse soit
  // transmise et en attente de contrôle manager, ou encore en brouillon :
  // aucune vue agrégée ni Ma Progression (nexus-progression.js) ne
  // distinguait ces deux cas avant ce jour, d'où le filtre supplémentaire
  // ajouté côté Ma Progression sur fdj_shifts.statut === 'valide' (Article
  // 11 — réutilise un signal déjà chargé, n'invente pas un second statut).
  async function enregistrerCaisseQuart() {
    // 1) Comptages grattage — upsert par (shift_id, game_id).
    const lignes = jeux.filter(jeuEstCompte).map(j => {
      const s = countsSaisie[j.id];
      const v = calculerVentes(j.id);
      return { site: siteId, shift_id: shiftRow.id, game_id: j.id, stock_initial: s.stock_initial, appro: s.appro || 0, stock_final: s.stock_final, ventes_qte: v.qte, ventes_valeur: v.valeur, updated_at: new Date().toISOString() };
    });
    if (lignes.length) {
      const { error: eCounts } = await nexusClient.from('fdj_shift_counts').upsert(lignes, { onConflict: 'shift_id,game_id' });
      if (eCounts) { console.error('Enregistrement comptages FDJ:', eCounts); alert("Erreur d'enregistrement du grattage. Réessayez."); return false; }
    }

    // 2) Rapports (journalier + temps réel) — upsert par (shift_id, type_rapport).
    const { error: eRep } = await nexusClient.from('fdj_reports').upsert([
      { site: siteId, shift_id: shiftRow.id, type_rapport: 'journalier', lots_payes_grattage: reportJournalier.lots_payes_grattage, saisi_par: employeeCourant.id },
      { site: siteId, shift_id: shiftRow.id, type_rapport: 'temps_reel', caisse_tirages: reportTempsReel.caisse_tirages, saisi_par: employeeCourant.id },
    ], { onConflict: 'shift_id,type_rapport' });
    if (eRep) { console.error('Enregistrement rapports FDJ:', eRep); alert("Erreur d'enregistrement des rapports. Réessayez."); return false; }

    // 3) Rapprochement caisse — upsert unique par shift_id. statut reste
    // "provisoire" tant qu'un manager ne l'a pas validé (jamais utilisé par
    // Ma Progression avant ça — règle audit §22).
    // 16/08/2026 : caisse_reelle_origine/ecart_origine sont posées ICI, la
    // toute première fois que ce quart passe en caisse — jamais réécrites
    // ensuite, y compris par une régularisation manager (voir
    // NEXUS-FDJ-Manager-v1.html::enregistrerEdition, qui ne les inclut
    // jamais dans son upsert). C'est le "constat d'origine" que la règle de
    // Frédéric interdit d'effacer.
    const ecart = ecartCaisse();
    const { error: eCash } = await nexusClient.from('fdj_cash_controls').upsert({
      site: siteId, shift_id: shiftRow.id,
      ventes_grattage_valeur: ventesGrattageTotal(), lots_payes_grattage: reportJournalier.lots_payes_grattage,
      caisse_grattage: caisseGrattage(), caisse_tirages: reportTempsReel.caisse_tirages,
      regularisations: regularisations || 0, caisse_attendue: caisseAttendue(), caisse_reelle: caisseReelle,
      caisse_reelle_origine: caisseReelle, ecart_origine: ecart,
      ecart, motif_ecart: null, statut: 'provisoire', updated_at: new Date().toISOString(),
    }, { onConflict: 'shift_id' });
    if (eCash) { console.error('Enregistrement caisse FDJ:', eCash); alert("Erreur d'enregistrement de la caisse. Réessayez."); return false; }

    return true;
  }

  // Issue "Laisser en brouillon" (20/08/2026) : les données sont déjà
  // enregistrées par enregistrerCaisseQuart() ci-dessus — il ne reste qu'à
  // tracer le geste (jamais un simple silence) et à sortir sur un écran
  // honnête, distinct de "Quart transmis" (FDJ-02 : un brouillon reste
  // récupérable, mais n'est PAS une transmission). fdj_shifts.statut n'est
  // jamais touché ici — il reste 'brouillon', valeur déjà posée à
  // l'ouverture du quart (voir l'insert plus haut).
  async function confirmerBrouillonQuart() {
    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: shiftRow.id, entite_type: 'fdj_shift', entite_id: shiftRow.id,
      action: 'quart_brouillon_enregistre', acteur_id: employeeCourant.id,
      nouvelle_valeur: { caisse_attendue: caisseAttendue(), caisse_reelle: caisseReelle, ecart: ecartCaisse() },
    });
    effacerDraft(); // le serveur fait foi désormais — voir demarrerCloture(), qui relit fdj_reports/fdj_cash_controls avant le brouillon local
    renderConfirmationBrouillon();
  }

  function renderConfirmationBrouillon() {
    document.getElementById('titre').textContent = 'Brouillon enregistré';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="checkmark">📝</div>
      <div class="final-greet">C'est noté, ${employeeCourant.nom}.</div>
      <div class="final-sub">Votre saisie est enregistrée en brouillon — reprenez-la quand vous voulez, depuis n'importe quel poste. Elle n'apparaît pas encore dans les rapports.</div>
      <button class="btn-primary" id="btnRetourAccueilBrouillon">Retour à l'accueil</button>
    `;
    document.getElementById('btnRetourAccueilBrouillon').addEventListener('click', () => { phase = 'accueil'; renderAccueil(); });
  }

  // Issue "Valider cette caisse" — transmission définitive (steps 4-5,
  // inchangés par rapport à l'ancien validerQuart() : statut du quart,
  // trace d'audit immuable, relevé de clôture). N'est appelée qu'après le
  // succès de enregistrerCaisseQuart() — voir orchestrerSortieCaisse().
  async function finaliserQuart() {
    const ecart = ecartCaisse();

    // 4) Quart passé en "valide" + trace d'audit immuable. (La détection
    // "stock initial modifié" est désormais faite à l'ouverture, pas ici —
    // voir validerOuverture().)
    const { error: eShift } = await nexusClient.from('fdj_shifts').update({ statut: 'valide', valide_le: new Date().toISOString() }).eq('id', shiftRow.id);
    if (eShift) console.error('Validation quart FDJ:', eShift);
    shiftRow.statut = 'valide';

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: shiftRow.id, entite_type: 'fdj_shift', entite_id: shiftRow.id,
      action: 'quart_valide', acteur_id: employeeCourant.id,
      nouvelle_valeur: { caisse_attendue: caisseAttendue(), caisse_reelle: caisseReelle, ecart },
    });

    // 5) Relevé de clôture FDJ / Trace de contrôle FDJ (16/08/2026, demande
    // de Frédéric) : version 1, IMMUABLE — "Situation au moment où l'employé
    // valide". Snapshot complet, jamais une référence vers des lignes qui
    // pourraient changer après coup ; jamais réécrit ensuite, même par une
    // régularisation manager (voir NEXUS-FDJ-Manager-v1.html, version 2+
    // dans la même table). "NEXUS conserve le fait" — pas un jugement, un
    // constat daté et signé.
    const stockInitialParJeu = {}, approParJeu = {}, stockFinalParJeu = {}, ventesParJeu = {};
    jeux.filter(jeuEstCompte).forEach(j => {
      const s = countsSaisie[j.id] || {};
      const v = calculerVentes(j.id);
      stockInitialParJeu[j.id] = s.stock_initial ?? null;
      approParJeu[j.id] = s.appro || 0;
      stockFinalParJeu[j.id] = s.stock_final ?? null;
      ventesParJeu[j.id] = { qte: v.qte, valeur: v.valeur };
    });
    // 16/08/2026, sécurisation structurelle demandée par Frédéric, point 1 :
    // le statut dépend désormais de QUI produit la version ('validation_employe'
    // ici), jamais seulement de version_num. Point 2 : la chaîne interrompue
    // et la continuité de stock à vérifier sont deux anomalies distinctes —
    // à la validation employé, seule la chaîne est connue (aucune alerte
    // continuite_stock_a_verifier n'existe encore à ce stade, elle n'est
    // créée qu'a posteriori par la réconciliation manager), donc l'autre
    // dimension est explicitement `false`, jamais fusionnée.
    const statutReleve = NexusFdjMoteur.statutRelevecloture(1, ecart, 'validation_employe');
    const caractereReleve = NexusFdjMoteur.caractereRelevecloture({ chaineInterrompue: chaineRompue.rompue, continuiteStockAVerifier: false });
    const signature = {
      utilisateur_id: employeeCourant.id, nom: employeeCourant.nom, role: employeeCourant.role || 'employe',
      date_heure: new Date().toISOString(), version_donnees: shiftRow.version || 1,
      session_id: (typeof navigator !== 'undefined' && navigator.userAgent) || null,
      quart_id: shiftRow.id, message_confirmation: messageConfirmationCloture,
      heure_ouverture_quart: shiftRow.ouvert_le || null,
    };
    const { error: eReleve } = await nexusClient.from('fdj_releves_cloture').insert({
      site: siteId, shift_id: shiftRow.id, date: shiftRow.date, quart: shiftRow.quart, employee_id: employeeCourant.id,
      version_num: 1, type_version: 'validation_employe', cree_par: employeeCourant.id,
      stock_initial_par_jeu: stockInitialParJeu, appro_par_jeu: approParJeu, stock_final_par_jeu: stockFinalParJeu, ventes_par_jeu: ventesParJeu,
      ventes_grattage_valeur: ventesGrattageTotal(), lots_payes_grattage: reportJournalier.lots_payes_grattage,
      caisse_tirages: reportTempsReel.caisse_tirages, regularisations: regularisations || 0,
      caisse_attendue: caisseAttendue(), caisse_reelle: caisseReelle, ecart,
      // 16/08/2026, demande de Frédéric : "si un quart précédent manque, je
      // ne veux pas qu'un relevé soit présenté comme totalement définitif
      // [...] Chaîne interrompue / donnée manquante → Relevé provisoire —
      // continuité à régulariser." Recalculé automatiquement en 'definitif'
      // dès que la chaîne se rétablit (voir
      // NEXUS-FDJ-Manager-v1.html::synchroniserRelevesApresRetablissementChaine),
      // sans jamais réécrire cette version 1 — une nouvelle version est
      // posée à la place. Les deux causes possibles de provisoire restent
      // deux champs distincts, jamais une seule anomalie fusionnée
      // (sécurisation structurelle, point 2) — `continuite_stock_a_verifier`
      // n'est pas encore observable à cet instant, donc explicitement `false`.
      anomalie_chaine: { chaine_interrompue: chaineRompue.rompue, manquants: chaineRompue.manquants || [], continuite_stock_a_verifier: false },
      caractere: caractereReleve,
      statut: statutReleve, signature,
    });
    // 16/08/2026, sécurisation structurelle demandée par Frédéric, point 4 :
    // "Éviter qu'un quart puisse être validé sans son relevé de clôture
    // [...] prévoir un mécanisme pending/error/retry." Le quart est déjà
    // validé à ce stade (étape non bloquante côté employé — la fiche de
    // clôture reste une preuve, pas un à-côté facultatif, donc jamais
    // silencieuse) ; `fdj_shifts.releve_cloture_statut` trace explicitement
    // le résultat pour que le manager puisse détecter et réparer un échec
    // (voir NEXUS-FDJ-Manager-v1.html, panneau "Relevés de clôture à
    // régulariser" + reessayerReleveClotureManquant()). Point 5 :
    // l'idempotence est garantie côté base par un index unique partiel —
    // le code Postgres 23505 signifie ici qu'une validation employé existe
    // déjà pour ce quart (rejeu réseau, double-clic déjà absorbé côté UI
    // par la désactivation du bouton) : ce n'est jamais une vraie erreur.
    if (eReleve) {
      if (eReleve.code === '23505') {
        await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'ok' }).eq('id', shiftRow.id);
      } else {
        console.error('Relevé de clôture FDJ (version employé):', eReleve);
        await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'erreur' }).eq('id', shiftRow.id);
      }
    } else {
      await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'ok' }).eq('id', shiftRow.id);
    }

    effacerDraft();
    renderConfirmationCloture();
  }

  // 28/08/2026, demande de Frédéric : c'est ICI, juste après la clôture,
  // que le "Point de clôture" est révélé pour la première fois — jamais
  // avant (voir pointDeClotureHTML). Les valeurs viennent encore de la
  // saisie en mémoire (même session), donc pas de rechargement réseau
  // nécessaire pour les afficher.
  function renderConfirmationCloture() {
    const donnees = {
      heureLabel: heureLocale(),
      attendue: caisseAttendue(), reelle: caisseReelle, ecart: ecartCaisse(),
      ventesGrattage: ventesGrattageTotal(), lotsPayes: reportJournalier.lots_payes_grattage,
      caisseTirages: reportTempsReel.caisse_tirages, regularisations,
    };
    document.getElementById('titre').textContent = 'Caisse clôturée';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="checkmark">✓</div>
      <div class="final-greet">Merci ${employeeCourant.nom} !</div>
      ${pointDeClotureHTML(donnees)}
      <div class="final-sub">⏳ En attente de contrôle par le manager.</div>
      <button class="btn-primary" id="btnRetourAccueilFinal">Retour à l'accueil</button>
    `;
    wirePointDeCloture();
    document.getElementById('btnRetourAccueilFinal').addEventListener('click', () => { phase = 'accueil'; renderAccueil(); });
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    employeeCourant = employee;
    siteId = employee.site_id;
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-FDJ-v1.html', siteId))) return;
    demarrerHorloge();
    // 13/08/2026 — Règle d'accès aux quarts FDJ V1 : le verrou du jour (s'il
    // existe) doit primer sur la détection par l'heure, sinon un employé
    // verrouillé sur Q1 le matin se retrouverait sur Q2 par défaut l'après-midi.
    // FDJ Fiabilisation Étape 7 (18/08/2026) — fenetreAccesQuartMin doit être
    // résolu ici aussi, jamais seulement à l'intérieur de quartDuMoment() :
    // quand un verrouJour existe déjà, quartDuMoment() (et donc
    // chargerParametresFdjSite()) n'est jamais appelée, et accesQuart()
    // tournerait avec la valeur par défaut au lieu du paramétrage du site.
    let parametresFdjSiteInit;
    [horairesQuartsSite, verrouJour, parametresFdjSiteInit] = await Promise.all([chargerHorairesQuartsSite(), chargerVerrouJour(), chargerParametresFdjSite()]);
    fenetreAccesQuartMin = (parametresFdjSiteInit && parametresFdjSiteInit.fenetre_acces_quart_min !== null && parametresFdjSiteInit.fenetre_acces_quart_min !== undefined) ? Number(parametresFdjSiteInit.fenetre_acces_quart_min) : 30;
    quartActuel = verrouJour ? verrouJour.quart : await quartDuMoment();
    jeux = await chargerJeux();
    shiftRow = await obtenirOuCreerShift();
    if (!shiftRow) { document.getElementById('content').innerHTML = '<div class="loading">Impossible de charger le quart FDJ. Réessayez.</div>'; return; }
    renderAccueil();
  });
</script>
</body>
</html>
