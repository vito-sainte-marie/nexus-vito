<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Ma Progression</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-build.js"></script>
<script src="nexus-auth.js?v=20260902-1823"></script>
<script src="nexus-header-nav.js?v=20260902-1823"></script>
<script src="nexus-desktop.js?v=20260902-1823"></script>
<!-- v2.286 : nexus-progression.js délègue désormais à
     NexusEcartsMoteur.deriverStatutEcart (statutCaisseJour/statutActivite)
     — doit être chargé AVANT nexus-progression.js. -->
<script src="nexus-ecarts-moteur.js?v=20260902-1823"></script>
<script src="nexus-progression.js?v=20260902-1823"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --cyan-dim:rgba(79,195,217,0.12);
    --gold:#D4AF37;
    /* Mes résultats — Boutique/Piste/FDJ (16/08/2026) : une couleur dédiée
       par activité, distincte des couleurs de statut (vert/ambre/rouge)
       pour ne jamais confondre "quelle activité" et "quel résultat". */
    --type-boutique:#8C9EFF; --type-boutique-dim:rgba(140,158,255,0.14);
    --type-piste:#4FC3D9; --type-piste-dim:rgba(79,195,217,0.14);
    --type-fdj:#F0A84E; --type-fdj-dim:rgba(240,168,78,0.14);
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:20px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:20px; font-weight:600; margin-top:4px;}
  .vue-manager-note{font-family:var(--mono); font-size:10px; color:var(--amber); margin-top:6px; background:var(--amber-dim); display:inline-block; padding:4px 10px; border-radius:20px;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}

  .section{padding:16px 20px;}
  .section-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .section-label::after{content:''; flex:1; height:1px; background:var(--hairline);}

  .coach-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:18px; margin-bottom:14px;}
  .coach-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .coach-avatar{width:38px; height:38px; border-radius:50%; object-fit:cover; flex-shrink:0; background:var(--panel-raised);}
  .coach-nom{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--cyan);}
  .coach-sous-nom{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .coach-text{font-size:13.5px; line-height:1.65; color:var(--text);}
  .coach-text b{color:var(--gold);}
  .coach-text + .coach-text{margin-top:10px;}
  .coach-sub{font-size:12.5px; line-height:1.6; color:var(--text-mid); margin-top:8px;}
  .apprentissage-link{display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.03em; color:var(--cyan); text-decoration:none;}
  .nouveaute-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,0.2);}

  .fort-list{list-style:none; padding:0; margin:0;}
  .fort-item{font-size:13px; line-height:1.6; padding:7px 0; display:flex; gap:8px;}
  .fort-item span.dot{flex-shrink:0;}

  .axe-badge{display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--cyan); background:var(--cyan-dim); padding:4px 10px; border-radius:20px; margin-bottom:10px;}
  .axe-cause{font-size:12px; color:var(--text-mid); line-height:1.55; margin-top:8px; font-style:italic;}
  .reco-box{background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.3); border-radius:10px; padding:12px 14px; margin-top:12px; font-size:13px; line-height:1.55; color:var(--cyan);}

  .encourage-card{background:var(--green-dim); border:1px solid rgba(52,211,153,0.35); border-radius:14px; padding:16px; margin-bottom:14px; font-size:13.5px; line-height:1.6; color:var(--green);}

  .niveau-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:18px;}
  .niveau-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .niveau-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim);}
  .niveau-nom{font-size:17px; font-weight:700; color:var(--gold);}
  .niveau-detail{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-bottom:14px;}
  .niveau-bar-track{height:6px; background:var(--panel-raised, #1A222C); border-radius:3px; overflow:hidden; margin:10px 0 14px;}
  .niveau-bar-fill{height:100%; background:var(--gold); border-radius:3px;}
  .niveau-bar-legende{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); margin-top:-10px; margin-bottom:14px;}

  .badges-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .badge-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px; text-align:center;}
  .badge-card.obtenu{border-color:rgba(212,175,55,0.45); background:rgba(212,175,55,0.07);}
  .badge-icone{font-size:20px; margin-bottom:6px; opacity:0.35;}
  .badge-card.obtenu .badge-icone{opacity:1;}
  .badge-label{font-size:11px; line-height:1.4; color:var(--text-mid);}
  .badge-card.obtenu .badge-label{color:var(--text);}
  .badge-progress{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); margin-top:5px;}

  /* Mes séries — badges Série Caisse + points (19/08/2026) */
  .serie-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:18px; margin-bottom:14px;}
  .serie-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .serie-nom{font-size:13.5px; font-weight:600;}
  .serie-valeur{font-family:var(--mono); font-size:13px; color:var(--gold);}
  .serie-sub{font-size:11.5px; color:var(--text-mid); margin-bottom:10px;}
  .serie-bar-track{height:6px; background:var(--panel-raised); border-radius:3px; overflow:hidden; margin:4px 0 8px;}
  .serie-bar-fill{height:100%; background:var(--gold); border-radius:3px;}
  .serie-record{font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}
  .deblocage-card{background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.4); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:13px; line-height:1.55; color:var(--text);}
  .deblocage-card b{color:var(--gold);}
  .deblocage-pts{font-family:var(--mono); font-size:12px; color:var(--gold); margin-top:4px;}

  .comp-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px solid var(--hairline);}
  .comp-row:first-of-type{border-top:none;}
  .comp-nom{font-size:13px; font-weight:500;}
  .comp-statut{font-family:var(--mono); font-size:10.5px; text-align:right;}
  .comp-detail{display:block; font-size:9.5px; color:var(--text-dim); margin-top:2px; font-weight:400;}

  .empty-note{padding:40px 20px; text-align:center; color:var(--text-dim); font-size:13px; line-height:1.6;}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  /* Mes Caisses (03/08/2026) */
  .caisses-sub{font-size:12.5px; line-height:1.6; color:var(--text-mid); margin-bottom:14px;}
  .caisses-stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:4px;}
  .stat-item{background:var(--panel-raised); border-radius:10px; padding:10px 12px;}
  .stat-value{font-size:16px; font-weight:700;}
  .stat-label{font-family:var(--mono); font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; margin-top:3px; line-height:1.4;}
  .protection-note{font-size:11px; line-height:1.55; color:var(--text-dim); margin-top:14px; padding-top:12px; border-top:1px solid var(--hairline);}
  .info-dot{cursor:help; color:var(--cyan); border-bottom:1px dotted var(--cyan);}
  .fiabilite-line{font-family:var(--mono); font-size:10.5px; color:var(--gold); margin-top:12px;}
  .statut-badge-caisse{font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; padding:4px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0;}
  .statut-badge-caisse.provisoire{color:var(--amber); background:var(--amber-dim);}
  .statut-badge-caisse.validee_conforme{color:var(--green); background:var(--green-dim);}
  .statut-badge-caisse.validee_ecart{color:var(--red); background:var(--red-dim);}
  .caisse-jour-item{border-top:1px solid var(--hairline); padding:12px 0; cursor:pointer;}
  .caisse-jour-item:first-child{border-top:none;}
  .caisse-jour-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .caisse-jour-date{font-size:13px; font-weight:500;}
  .caisse-jour-quart{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-left:6px;}
  .caisse-jour-montant{font-family:var(--mono); font-size:11.5px; margin-top:5px; color:var(--text-mid);}
  .caisse-jour-detail{display:none; margin-top:10px; font-size:12.5px; line-height:1.6; color:var(--text-mid);}
  .caisse-jour-detail.open{display:block;}
  .causes-list{margin:8px 0 0; padding-left:18px; color:var(--text-dim); font-size:11.5px; line-height:1.7;}
  .caisses-empty{padding:20px 0; text-align:center; color:var(--text-dim); font-size:12.5px;}
  .caisse-jour-montant.vide{color:var(--text-dim); font-size:10.5px; font-family:var(--sans);}

  /* Mes résultats — Boutique/Piste/FDJ (16/08/2026, demande de Frédéric) —
     mêmes couleurs dédiées par activité utilisées partout dans ce bloc
     (mini-cartes Niveau 1, badges Niveau 3, filtres) : jamais une couleur
     réinventée pour la même activité à deux endroits différents. */
  .activite-cards-stack{display:flex; flex-direction:column; gap:10px;}
  .activite-card{background:var(--panel-raised); border:1px solid var(--hairline); border-left:3px solid var(--hairline); border-radius:10px; padding:12px 14px;}
  .activite-card.boutique{border-left-color:var(--type-boutique);}
  .activite-card.piste{border-left-color:var(--type-piste);}
  .activite-card.fdj{border-left-color:var(--type-fdj);}
  .activite-card-ligne{font-size:12.5px; color:var(--text-mid); margin-top:8px;}
  .activite-card-cumul{font-family:var(--mono); font-size:13px; font-weight:600; margin-top:3px;}
  .activite-card-alerte{font-family:var(--mono); font-size:10.5px; color:var(--red); margin-top:4px;}
  .activite-card-vide{font-size:12px; color:var(--text-dim); margin-top:8px;}
  .activite-badge{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:0.03em; padding:3px 9px; border-radius:20px;}
  .activite-badge.small{font-size:9px; padding:2px 8px; margin-top:6px;}
  .activite-badge.boutique{color:var(--type-boutique); background:var(--type-boutique-dim);}
  .activite-badge.piste{color:var(--type-piste); background:var(--type-piste-dim);}
  .activite-badge.fdj{color:var(--type-fdj); background:var(--type-fdj-dim);}

  .filtre-activite{display:flex; gap:6px; flex-wrap:wrap; padding-bottom:12px;}
  .filtre-pill{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.02em; color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline); border-radius:20px; padding:6px 12px; cursor:pointer;}
  .filtre-pill.active{color:var(--bg); background:var(--cyan); border-color:var(--cyan);}

  .fdj-detail-grid{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .fdj-detail-label{display:block; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-dim);}
  .fdj-detail-val{display:block; font-family:var(--mono); font-size:13px; font-weight:600; margin-top:1px;}

  /* Score missions (03/08/2026, demande de Frédéric) — même grille de
     statistiques que Mes Caisses, vocabulaire dédié aux missions. */
  .attente-line{font-family:var(--mono); font-size:10.5px; color:var(--amber); margin-top:12px;}
  .histo-mission-row{display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid var(--hairline); padding:9px 0;}
  .histo-mission-row:first-child{border-top:none;}
  .histo-mission-titre{font-size:12.5px;}
  .histo-mission-date{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); margin-top:2px;}
  .histo-mission-droite{text-align:right; flex-shrink:0;}
  .histo-mission-pts{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--green);}
  .statut-badge-mission{display:block; font-family:var(--mono); font-size:8.5px; text-transform:uppercase; letter-spacing:0.03em; margin-top:2px;}
  .statut-badge-mission.en_attente{color:var(--amber);}
  .statut-badge-mission.valide{color:var(--text-dim);}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Ma Progression</div>
    <div class="title" id="pageTitle">Chargement…</div>
    <div id="vueManagerNote"></div>
  </div>
  <div class="divider"></div>
  <!-- desktop-grid (02/08/2026) : mise en colonnes en vue bureau (voir
       nexus-desktop.js) — purement additif, aucun effet en mobile. -->
  <div class="section desktop-grid" id="app">
    <div class="empty-note">Analyse en cours…</div>
  </div>
  <footer>NEXUS Progression v1 · Coach personnel · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ============================================================
  // NEXUS Progression — "Ma Progression" (27/07/2026, demande de
  // Frédéric) : transforme le Conseiller NEXUS en coach personnel pour
  // chaque employé. Trois questions guident toute cette page : pourquoi
  // un écart arrive probablement, comment l'éviter demain, quels progrès
  // ont été faits — jamais un simple chiffre nu. Toute la logique de
  // calcul (attribution solo des écarts, compétences, niveau NEXUS,
  // encouragements) vit dans nexus-progression.js, réutilisable ailleurs.
  //
  // Accès (décision de Frédéric, 27/07/2026) : l'employé voit toujours sa
  // propre page. Un manager/gérant peut aussi consulter la page d'un
  // employé de son site via ?employe=ID (pour préparer un entretien) —
  // jamais un employé sur la page d'un collègue.
  // ============================================================

  async function fetchAllRows(builderFactory, pageSize = 1000) {
    let toutes = [];
    let from = 0;
    while (true) {
      const { data, error } = await builderFactory().range(from, from + pageSize - 1);
      if (error) return { data: null, error };
      toutes = toutes.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    return { data: toutes, error: null };
  }

  const COULEUR_STATUT = {
    'Sous contrôle': 'var(--green)', 'À surveiller': 'var(--amber)',
    'À corriger': 'var(--red)', 'Données insuffisantes': 'var(--text-dim)',
  };

  // Vocabulaire coach (27/07/2026, demande de Frédéric — "le Coach ne parle
  // jamais de problèmes, il parle de progression") : purement un habillage
  // d'affichage pour cette page. La valeur réelle de resultat.statut n'est
  // jamais modifiée — elle continue d'alimenter la couleur ci-dessus et
  // reste identique à celle utilisée par les vues manager (État Global,
  // etc.) qui, elles, gardent le vocabulaire d'origine.
  const LIBELLE_STATUT_COACH = {
    'Sous contrôle': 'Maîtrisé', 'À surveiller': 'Point d\'attention',
    'À corriger': 'Axe de progression', 'Données insuffisantes': 'En cours d\'observation',
  };

  function ligneCompetence(nom, resultat) {
    const c = COULEUR_STATUT[resultat.statut] || 'var(--text-dim)';
    const libelle = LIBELLE_STATUT_COACH[resultat.statut] || resultat.statut;
    return `<div class="comp-row">
      <span class="comp-nom">${nom}</span>
      <span class="comp-statut" style="color:${c};">${libelle}${resultat.detail ? `<span class="comp-detail">${resultat.detail}</span>` : ''}</span>
    </div>`;
  }

  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html

    const estNiveauManager = employee.role === 'manager' || employee.role === 'gerant';
    const params = new URLSearchParams(window.location.search);
    const employeParamId = params.get('employe');
    const siteId = employee.site_id;

    let cibleId = employee.id;
    let vueManager = false;
    if (employeParamId && employeParamId !== employee.id) {
      if (!estNiveauManager) {
        document.getElementById('app').innerHTML = '<div class="locked">Cette page de progression appartient à un autre employé — vous n\'y avez pas accès.</div>';
        document.getElementById('pageTitle').textContent = 'Accès refusé';
        return;
      }
      cibleId = employeParamId;
      vueManager = true;
    }

    const { data: cible, error: erreurCible } = await nexusClient
      .from('employees').select('id, nom, role, site_id, actif').eq('id', cibleId).maybeSingle();
    if (erreurCible || !cible || cible.site_id !== siteId) {
      document.getElementById('app').innerHTML = '<div class="locked">Employé introuvable pour ce site.</div>';
      document.getElementById('pageTitle').textContent = 'Introuvable';
      return;
    }

    document.getElementById('pageTitle').textContent = vueManager ? `Progression — ${cible.nom}` : 'Ma Progression';
    if (vueManager) {
      document.getElementById('vueManagerNote').innerHTML = '<span class="vue-manager-note">Vue manager — lecture seule</span>';
    }

    const [
      { data: auditsRows, error: e1 },
      { data: pointagesRows, error: e2 },
      { data: assignationsRows, error: e3 },
      { data: controlesRows, error: e4 },
      { data: evaluationsRows, error: e5 },
      { data: completionsRows, error: e6 },
      { data: catalogueRows, error: e7 },
      { data: inventaireRows, error: e8 },
      { data: fdjShiftsRows, error: e9 },
      { data: badgeAwardsRows, error: e10 },
      { data: pointsLedgerRows, error: e11 },
      { data: quartEmployeRows, error: e12 },
      { data: correctionsInventaireRows, error: e13 },
      { data: reglesSeriesRow, error: e14 },
    ] = await Promise.all([
      // id/valide_le/ecart_*_valide/commentaire_validation ajoutés le
      // 03/08/2026 pour "Mes Caisses" — distinguer un écart provisoire d'un
      // écart validé par un manager (voir nexus-progression.js, section 10).
      // ecart_*_origine/cause_code_* ajoutés le 29/08/2026 (v2.286) :
      // nécessaires à NexusProgression.statutActivite/statutCaisseJour pour
      // déléguer à NexusEcartsMoteur.deriverStatutEcart (même calcul que
      // "Analyse des écarts" manager) au lieu d'un seuil local.
      fetchAllRows(() => nexusClient.from('audits_caisse')
        .select('id, date, quart, ecart_piste, ecart_boutique, employes_piste, employes_boutique, valide_le, ecart_piste_valide, ecart_boutique_valide, commentaire_validation, ecart_piste_origine, ecart_boutique_origine, cause_code_piste, cause_code_boutique')
        .eq('site', siteId).order('date', { ascending: false })),
      // date ajoutée (27/07/2026) pour calculer la série de ponctualité
      // (NexusProgression.calculerSeriePonctualite) — un simple total ne
      // suffit pas pour un badge "N jours sans retard d'affilée".
      nexusClient.from('pointages').select('date, retard_min').eq('type', 'arrivee').eq('employee_id', cible.id),
      nexusClient.from('mission_assignments').select('status, due_at, updated_at').eq('site_id', siteId).eq('assigned_to_employee_id', cible.id),
      nexusClient.from('controles_tenue').select('conforme').eq('site', siteId).eq('employee_id', cible.id),
      nexusClient.from('evaluations_employes').select('type, criteres').eq('site', siteId).eq('employee_id', cible.id),
      // date/heure/mission_id/photo_fournie (27/07/2026, détection "Nouveau
      // constat") : nécessaires pour analyserQualites/analyserHabitudes,
      // pas seulement un total comme avant. titre/points/points_ajustement/
      // statut_validation ajoutés le 03/08/2026 pour le nouveau "Score
      // missions" (cumul semaine/mois + historique détaillé — voir plus bas).
      nexusClient.from('mission_completions').select('date, heure, titre, mission_id, photo_fournie, points, points_ajustement, statut_validation').eq('employee_id', cible.id),
      nexusClient.from('mission_catalog').select('mission_id, proof_required').eq('site_id', siteId),
      // Mes Caisses (03/08/2026) : sert uniquement à vérifier la condition
      // "inventaire obligatoire terminé" du point de fiabilité — jamais
      // utilisé pour rien d'autre ici.
      nexusClient.from('inventaire_quarts').select('date, quart, statut').eq('site', siteId),
      // FDJ dans Ma Progression (16/08/2026, demande de Frédéric) : même
      // forme que NEXUS-FDJ-Manager-v1.html::chargerShiftsAvecCaisse,
      // filtrée site + employé. Un quart sans caisse enregistrée (pas
      // encore transmis) n'a rien à montrer ici — voir
      // NexusProgression.construireServicesCaisseFdj.
      fetchAllRows(() => nexusClient.from('fdj_shifts').select('*, fdj_cash_controls(*)')
        .eq('site', siteId).eq('employee_id', cible.id).order('date', { ascending: false })),
      // Mes séries — badges Série Caisse (19/08/2026) : badges déjà acquis et
      // ledger de points de CET employé — jamais recalculés, uniquement lus
      // (la seule écriture possible est un INSERT idempotent plus bas).
      nexusClient.from('progression_badge_awards').select('*').eq('employee_id', cible.id),
      nexusClient.from('progression_points_ledger').select('*').eq('employee_id', cible.id),
      // Série Inventaire (20/08/2026) : uniquement les quarts dont l'employé
      // était responsable du comptage (responsable_comptage) — même règle
      // d'attribution solo que la Caisse (section 1 du moteur). Jointure
      // inventaire_quarts(*) pour disposer de date/quart/cloture_le/
      // is_simulation sans requête séparée.
      fetchAllRows(() => nexusClient.from('inventaire_quart_employes')
        .select('*, inventaire_quarts(*)').eq('employee_id', cible.id)),
      // Corrections manager (Sprint 3) — filtrées site uniquement : une
      // correction rétroactive peut viser un quart ancien de n'importe quel
      // employé, la qualification (nexus-progression.js) les met en
      // correspondance elle-même via (date|quart).
      fetchAllRows(() => nexusClient.from('inventaire_corrections').select('*').eq('site', siteId)),
      // Mes séries — Paramètres manager (20/08/2026, P8) : une ligne par
      // site, résolue via NexusProgression.resoudreReglesProgressionSite
      // plus bas (jamais un second calcul de fallback ici). Absente tant
      // qu'aucun manager n'a rien enregistré dans Paramètres Station —
      // dans ce cas resoudreReglesProgressionSite retombe sur les mêmes
      // valeurs par défaut qu'avant ce lot (Article 5 : jamais une erreur).
      nexusClient.from('progression_site_settings').select('*').eq('site', siteId).maybeSingle(),
    ]);
    if (e1) console.error('Chargement audits_caisse (progression):', e1);
    if (e2) console.error('Chargement pointages (progression):', e2);
    if (e3) console.error('Chargement mission_assignments (progression):', e3);
    if (e4) console.error('Chargement controles_tenue (progression):', e4);
    if (e5) console.error('Chargement evaluations_employes (progression):', e5);
    if (e6) console.error('Chargement mission_completions (progression):', e6);
    if (e7) console.error('Chargement mission_catalog (progression):', e7);
    if (e8) console.error('Chargement inventaire_quarts (progression):', e8);
    if (e9) console.error('Chargement fdj_shifts (progression):', e9);
    if (e10) console.error('Chargement progression_badge_awards:', e10);
    if (e11) console.error('Chargement progression_points_ledger:', e11);
    if (e12) console.error('Chargement inventaire_quart_employes (progression):', e12);
    if (e13) console.error('Chargement inventaire_corrections (progression):', e13);
    if (e14) console.error('Chargement progression_site_settings (progression):', e14);

    const N = NexusProgression;
    // Mes séries — Paramètres manager (20/08/2026, P8) : résolution unique,
    // en tête de fonction, consommée par tout ce qui suit (paliers, délai de
    // grâce, activation par domaine) — jamais un second calcul de fallback
    // ailleurs dans ce fichier (Article 11).
    const reglesSeries = N.resoudreReglesProgressionSite(e14 ? null : reglesSeriesRow);
    const services = N.construireServicesCaisse(auditsRows || [], cible.id);
    const ecarts = N.ecartsAttribuables(services);
    // Ma Progression multi-activité (16/08/2026) : FDJ + historique unifié
    // Boutique/Piste/FDJ — voir nexus-progression.js section 11.
    const servicesFdj = N.construireServicesCaisseFdj(fdjShiftsRows || []);
    const lignesUnifiees = N.construireHistoriqueUnifie(services, servicesFdj);
    const statutCaisseVal = N.statutCaisse(services);
    const statutPonctualiteVal = N.statutPonctualite(pointagesRows || []);
    const statutMissionsVal = N.statutMissions(assignationsRows || []);
    const statutTenueVal = N.statutTenue(controlesRows || []);
    const statutRelationClientVal = N.statutRelationClient(evaluationsRows || []);

    // Système de reconnaissance (27/07/2026, demande de Frédéric — voir
    // Proposition_evolution_NEXUS_Employe.pdf) : niveau nommé + badges,
    // à partir de l'expérience réelle (services + missions + pointages).
    const nbMissionsCompletees = (completionsRows || []).length;
    const seriePonctualite = N.calculerSeriePonctualite(pointagesRows || []);
    const serieCaisse = N.meilleureSerieConforme(services);
    const experience = N.calculerExperience({
      nbServices: services.length, nbMissionsCompletees, nbPointages: (pointagesRows || []).length,
    });
    const niveau = N.calculerNiveauNomme(experience, {
      caisse: statutCaisseVal, ponctualite: statutPonctualiteVal,
      missions: statutMissionsVal, tenue: statutTenueVal, relation: statutRelationClientVal,
    });
    const badges = N.calculerBadges({ seriesCaisse: serieCaisse, seriePonctualite, nbMissionsCompletees });

    // "Nouveau constat" (27/07/2026, demande de Frédéric) : détection d'une
    // vraie nouveauté depuis la dernière visite, jamais une comparaison
    // entre collègues. Uniquement en vue employé (soi-même) — jamais
    // déclenché ni acquitté par la simple consultation d'un manager, et la
    // page NEXUS-Apprentissage-v1.html reste seule responsable d'acquitter
    // le flag (elle est l'écran qui "révèle" la découverte).
    let nouveauteEnAttente = false;
    if (!vueManager) {
      const catalogueParId = {};
      (catalogueRows || []).forEach(c => { catalogueParId[c.mission_id] = c; });
      const qualites = N.analyserQualites({ statutCaisseVal, statutPonctualiteVal, statutMissionsVal, statutTenueVal, statutRelationClientVal });
      const habitudes = N.analyserHabitudes({ services, completionsEmploye: completionsRows || [], catalogueParId });

      const { data: snapshotExistant, error: eSnap } = await nexusClient
        .from('apprentissage_snapshots').select('*').eq('employee_id', cible.id).maybeSingle();
      if (eSnap) console.error('Chargement apprentissage_snapshots (progression):', eSnap);

      const detection = N.detecterNouveaute({ qualitesActuelles: qualites, habitudesActuelles: habitudes, niveauActuel: niveau, badgesActuels: badges, snapshot: snapshotExistant });
      nouveauteEnAttente = detection.nouveau || (snapshotExistant ? !!snapshotExistant.nouveaute_en_attente : false);
      const detailAEnregistrer = detection.nouveau ? detection.detail : (snapshotExistant ? snapshotExistant.nouveaute_detail : null);

      const { error: eUpsert } = await nexusClient.from('apprentissage_snapshots').upsert({
        employee_id: cible.id, site_id: siteId,
        qualites: detection.instantane.qualites, habitudes: detection.instantane.habitudes,
        niveau_id: detection.instantane.niveau_id, badges_obtenus: detection.instantane.badges_obtenus,
        nouveaute_en_attente: nouveauteEnAttente, nouveaute_detail: detailAEnregistrer,
        updated_at: new Date().toISOString(),
      }, { onConflict: 'employee_id' });
      if (eUpsert) console.error('Écriture apprentissage_snapshots (progression):', eUpsert);
    }

    const forts = N.pointsForts({ services, statutPonctualiteVal, statutTenueVal, statutRelationClientVal });
    const axe = N.identifierAxeProgression({ services, statutCaisseVal, statutPonctualiteVal, statutMissionsVal, statutTenueVal, ecartsAttribuablesVal: ecarts });
    const encouragement = N.genererEncouragement({ services, ecartsAttribuablesVal: ecarts });

    // ------------------------------------------------------------
    // Mes Caisses (03/08/2026, demande de Frédéric) — voir nexus-progression.js
    // section 10 pour toute la logique. Ici : uniquement l'assemblage des
    // données pour l'affichage, jamais un second calcul divergent.
    // ------------------------------------------------------------
    const moisRef = new Date().toISOString().slice(0, 7);
    const serieConformeVal = N.serieValideeConforme(services);
    const bonusRegulariteVal = N.bonusRegulariteCaisse(serieConformeVal);

    // "Mes résultats" multi-activité (16/08/2026, demande de Frédéric —
    // remplace l'ancien bloc "Mes Caisses" boutique/piste seul par une
    // lecture à 3 niveaux couvrant Boutique/Piste/FDJ : voir
    // nexus-progression.js section 11 pour toute la logique. Ici,
    // uniquement l'assemblage pour l'affichage — jamais un second calcul
    // divergent.
    const moisPrecedentRef = N.moisPrecedent(moisRef);
    const syntheseCombActuelle = N.syntheseCombinee(lignesUnifiees, moisRef);
    const syntheseCombPrecedente = N.syntheseCombinee(lignesUnifiees, moisPrecedentRef);
    const tendanceComb = N.tendanceMoisCaisse(syntheseCombActuelle, syntheseCombPrecedente);
    const serieUnifiee = N.serieValideeConformeUnifiee(lignesUnifiees);

    // ------------------------------------------------------------
    // Mes séries — badges + points, Caisse ET Inventaire (19-20/08/2026,
    // cadrage NEXUS_Ma_Progression_Series_Recompenses_Cadrage_Developpeur.pdf).
    //
    // Le badge se fonde sur le RECORD (meilleure série jamais atteinte),
    // jamais sur l'expérience ni un chiffre recalculé ailleurs (Article 11 :
    // une seule vérité de série par domaine, calculée juste avant l'appel).
    // Crédit idempotent : la contrainte unique (employee_id, badge_code) /
    // (employee_id, source_type, source_id) empêche tout double crédit même
    // en cas de double appel — jamais besoin d'un verrou applicatif.
    // Déclenché UNIQUEMENT en vue employé (jamais quand un manager consulte
    // la page d'un collègue), même règle que "Nouveau constat" plus haut.
    // Factorisé en une seule fonction pour ne jamais faire diverger la
    // logique de crédit entre les deux domaines.
    // ------------------------------------------------------------
    async function crediterPaliersFranchis(domain, sourceType, catalogue, record, badgesDejaConnus, pointsDejaConnus, actif) {
      let badgesObtenus = badgesDejaConnus;
      let pointsLedger = pointsDejaConnus;
      const nouveauxDeblocages = [];
      // actif=false (réglage manager, Paramètres Station) : plus aucun
      // NOUVEAU badge/point crédité pour ce domaine tant qu'il reste
      // désactivé — mais badgesObtenus/pointsLedger déjà acquis restent
      // intacts et comptent toujours dans le total (cadrage §12 : jamais un
      // retrait silencieux, même en désactivant la série).
      if (!vueManager && actif !== false) {
        const codesDejaAcquis = badgesObtenus.filter(b => b.domain === domain).map(b => b.badge_code);
        const nouveauxPaliers = N.paliersFranchis(catalogue, record, codesDejaAcquis);
        for (const palier of nouveauxPaliers) {
          const { data: awardCree, error: eAward } = await nexusClient.from('progression_badge_awards')
            .insert({ employee_id: cible.id, site_id: siteId, domain, badge_code: palier.code, streak_value_at_award: record })
            .select().maybeSingle();
          // Code 23505 = contrainte unique déjà là (double exécution/course) —
          // comportement normal et attendu, jamais une erreur à signaler.
          if (eAward && eAward.code !== '23505') { console.error(`Écriture progression_badge_awards (${domain}):`, eAward); continue; }
          if (!awardCree) continue; // déjà acquis entre-temps (course perdue) — rien de plus à faire ici
          const { data: creditCree, error: eCredit } = await nexusClient.from('progression_points_ledger')
            .insert({ employee_id: cible.id, site_id: siteId, source_type: sourceType, source_id: palier.code, points: palier.points, reason: palier.label })
            .select().maybeSingle();
          if (eCredit && eCredit.code !== '23505') console.error(`Écriture progression_points_ledger (${domain}):`, eCredit);
          badgesObtenus = badgesObtenus.concat([awardCree]);
          if (creditCree) pointsLedger = pointsLedger.concat([creditCree]);
          nouveauxDeblocages.push(palier);
        }
      }
      const codesAcquisFinal = badgesObtenus.filter(b => b.domain === domain).map(b => b.badge_code);
      const prochainPalierVal = N.prochainPalier(catalogue, record, codesAcquisFinal);
      const totalPoints = pointsLedger.filter(l => l.source_type === sourceType).reduce((s, l) => s + (l.points || 0), 0);
      return { badgesObtenus, pointsLedger, codesAcquisFinal, prochainPalierVal, totalPoints, nouveauxDeblocages };
    }

    const resultatSerieCaisse = await crediterPaliersFranchis('caisse', 'badge_caisse', reglesSeries.caissePaliers, serieUnifiee.record, badgeAwardsRows || [], pointsLedgerRows || [], reglesSeries.caisseActif);

    // Série Inventaire (20/08/2026) — qualification quart par quart depuis
    // inventaire_quart_employes (responsabilité du comptage) +
    // inventaire_corrections (erreur_saisie/mouvement_oublie disqualifient,
    // le reste jamais — voir nexus-progression.js section 13 pour la
    // doctrine complète). Délai de grâce et paliers viennent de reglesSeries
    // (Paramètres Station si enregistrés, sinon les mêmes défauts qu'avant
    // ce lot — voir NexusProgression.resoudreReglesProgressionSite).
    const evenementsInventaire = N.qualifierQuartsInventaireEmploye(quartEmployeRows || [], correctionsInventaireRows || [], new Date().toISOString(), reglesSeries.inventaireDelaiGraceJours);
    const serieInventaire = N.calculerSerieDepuisEvenements(evenementsInventaire);
    const resultatSerieInventaire = await crediterPaliersFranchis('inventaire', 'badge_inventaire', reglesSeries.inventairePaliers, serieInventaire.record, resultatSerieCaisse.badgesObtenus, resultatSerieCaisse.pointsLedger, reglesSeries.inventaireActif);

    const lignesBoutique = lignesUnifiees.filter(l => l.activite === 'boutique');
    const lignesPiste = lignesUnifiees.filter(l => l.activite === 'piste');
    const lignesFdj = lignesUnifiees.filter(l => l.activite === 'fdj');
    const syntheseBoutique = N.syntheseActivite(lignesBoutique, moisRef);
    const synthesePiste = N.syntheseActivite(lignesPiste, moisRef);
    const syntheseFdj = N.syntheseActivite(lignesFdj, moisRef);

    // Écarts VALIDÉS attribuables — même logique que ecartsAttribuables
    // (section 1) mais construite sur les montants définitifs, jamais les
    // montants provisoires, pour ne jamais mélanger les deux dans la
    // détection d'amélioration du Coach.
    const ecartsValidesAttribuables = [];
    services.forEach(s => {
      if (N.statutCaisseJour(s) !== 'validee_ecart') return;
      if (s.soloPiste && s.ecartPisteValide != null && !N.estConforme(s.ecartPisteValide)) {
        ecartsValidesAttribuables.push({ date: s.date, quart: s.quart, poste: 'piste', montant: s.ecartPisteValide });
      }
      if (s.soloBoutique && s.ecartBoutiqueValide != null && !N.estConforme(s.ecartBoutiqueValide)) {
        ecartsValidesAttribuables.push({ date: s.date, quart: s.quart, poste: 'boutique', montant: s.ecartBoutiqueValide });
      }
    });
    const tendanceValidee = N.tendanceEcartMoyen(ecartsValidesAttribuables);
    const ameliorationDetectee = !!(tendanceValidee && tendanceValidee.ameliore);

    // Points de fiabilité (03/08/2026) — cumulés sur tout l'historique
    // connu, jamais stockés (toujours recalculés à partir des données
    // source, même principe que les badges et niveaux de ce moteur).
    const inventaireCloturePar = {};
    (inventaireRows || []).forEach(iv => {
      inventaireCloturePar[`${iv.date}|${iv.quart}`] = iv.statut === 'cloture';
    });
    let pointsFiabiliteTotal = 0;
    services.forEach(s => {
      const cloture = inventaireCloturePar[`${s.date}|${s.quart}`] === true;
      if (N.pointFiabiliteEligible(s, cloture).eligible) pointsFiabiliteTotal += 1;
    });
    pointsFiabiliteTotal += bonusRegulariteVal.points;

    // ------------------------------------------------------------
    // Score missions (03/08/2026, demande de Frédéric — "un système simple
    // et compréhensible" avec cumul semaine/mois et historique détaillé).
    // Règle centrale : seuls les points VALIDÉS entrent dans les cumuls —
    // une mission à preuve photo pas encore confirmée par un manager reste
    // à part, dans "en attente", jamais mélangée au score officiel. Le
    // bonus de régularité affiché ici est le même que celui de Mes Caisses
    // (décision de Frédéric : pas de second mécanisme de bonus spécifique
    // aux missions) — jamais recalculé différemment.
    // ------------------------------------------------------------
    function pointsEffectifsCompletion(c) { return (c.points || 0) + (c.points_ajustement || 0); }
    function completionValidee(c) { return (c.statut_validation || 'valide') === 'valide'; }
    const completionsMissions = completionsRows || [];
    const lundiCourantISO = (() => {
      const n = new Date(); const j = (n.getDay() + 6) % 7;
      const l = new Date(n); l.setDate(n.getDate() - j);
      return l.toISOString().slice(0, 10);
    })();
    const moisRefMissions = new Date().toISOString().slice(0, 7);
    const cumulSemaineMissions = completionsMissions
      .filter(c => completionValidee(c) && c.date >= lundiCourantISO)
      .reduce((s, c) => s + pointsEffectifsCompletion(c), 0);
    const cumulMoisMissions = completionsMissions
      .filter(c => completionValidee(c) && c.date && c.date.slice(0, 7) === moisRefMissions)
      .reduce((s, c) => s + pointsEffectifsCompletion(c), 0);
    const pointsEnAttenteMissions = completionsMissions
      .filter(c => !completionValidee(c))
      .reduce((s, c) => s + pointsEffectifsCompletion(c), 0);
    const historiqueMissions = [...completionsMissions]
      .sort((a, b) => (b.date + (b.heure || '')).localeCompare(a.date + (a.heure || '')))
      .slice(0, 20);

    const MOIS_LABELS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const labelMois = `${MOIS_LABELS[parseInt(moisRef.slice(5,7),10)-1]} ${moisRef.slice(0,4)}`;

    const prenom = vueManager ? cible.nom : cible.nom.split(' ')[0];
    // Message d'accueil et messages d'attente (27/07/2026, ton plus humain
    // demandé par Frédéric — voir Proposition_evolution_NEXUS_Employe.pdf,
    // "Nous commençons à apprendre votre manière de travailler...") : un
    // employé tout juste arrivé ne doit jamais lire un message technique
    // ou froid, seulement une promesse d'accompagnement qui grandit avec
    // le temps.
    // Ton coach (27/07/2026, demande de Frédéric) : "Aujourd'hui, je serai à
    // vos côtés pour vous accompagner dans vos missions et vous aider à
    // progresser" — jamais un simple compte-rendu de chiffres.
    const accueil = services.length > 0
      ? `Bonjour ${prenom}. ${vueManager ? 'Le Coach NEXUS accompagne cet employé au quotidien dans ses missions et sa progression.' : 'Aujourd\'hui, je serai à vos côtés pour vous accompagner dans vos missions et vous aider à progresser.'} J'ai analysé ${vueManager ? 'ses' : 'vos'} ${services.length} dernier${services.length > 1 ? 's' : ''} service${services.length > 1 ? 's' : ''} de caisse pour ${vueManager ? 'mieux comprendre ses' : 'mieux comprendre vos'} points forts.`
      : `Bonjour ${prenom}. ${vueManager ? 'Le Coach NEXUS commence tout juste à apprendre la manière de travailler de cet employé' : 'Aujourd\'hui, je serai à vos côtés pour vous accompagner dans vos missions et vous aider à progresser'} — chaque service ${vueManager ? 'qu\'il enregistre m\'aide à mieux le' : 'que vous enregistrez m\'aide à mieux vous'} comprendre.`;

    // ------------------------------------------------------------
    // Rendu "Mes résultats" — Boutique / Piste / FDJ (16/08/2026)
    //
    // Spécification de Frédéric, suivie au plus près : 3 niveaux de
    // lecture (mini-cartes par activité → KPI mensuels combinés (max 6) →
    // historique unifié filtrable, une ligne = une activité = un
    // statut = un montant), jamais plus de 6 tuiles, jamais deux activités
    // mélangées dans une même ligne d'historique.
    // ------------------------------------------------------------
    const TENDANCE_LABEL = { ameliore: '📈 En amélioration', degrade: '📉 En hausse', stable: '➡️ Stable' };
    const tendanceTexte = tendanceComb ? TENDANCE_LABEL[tendanceComb.evolution] : 'Données insuffisantes';

    const statItem = (valeur, label) => `<div class="stat-item"><div class="stat-value">${valeur}</div><div class="stat-label">${label}</div></div>`;

    // Niveau 1 — mini-cartes par activité.
    const ACTIVITE_LABEL = { boutique: 'Boutique', piste: 'Piste', fdj: 'FDJ' };
    const ACTIVITE_ICONE = { boutique: '🏪', piste: '⛽', fdj: '🎟️' };
    const miniCarteActivite = (activite, synth) => {
      const cumulTxt = `${synth.cumulValide >= 0 ? '+' : ''}${synth.cumulValide.toFixed(2)} €`;
      return `
      <div class="activite-card ${activite}">
        <span class="activite-badge ${activite}">${ACTIVITE_ICONE[activite]} ${ACTIVITE_LABEL[activite]}</span>
        ${synth.nbControles > 0 ? `
          <div class="activite-card-ligne">${synth.nbControles} contrôle${synth.nbControles > 1 ? 's' : ''} · ${synth.conformes} conforme${synth.conformes > 1 ? 's' : ''}</div>
          <div class="activite-card-cumul">Cumul validé : ${cumulTxt}</div>
          ${synth.aRegulariser > 0 ? `<div class="activite-card-alerte">${synth.aRegulariser} à régulariser</div>` : ''}
        ` : `<div class="activite-card-vide">Aucun contrôle ce mois-ci.</div>`}
      </div>`;
    };
    const miniCartesHtml = [
      miniCarteActivite('boutique', syntheseBoutique),
      miniCarteActivite('piste', synthesePiste),
      miniCarteActivite('fdj', syntheseFdj),
    ].join('');

    // Niveau 2 — KPI mensuels combinés, 6 tuiles maximum.
    const statsGridHtml = [
      statItem(syntheseCombActuelle.caissesConformes, 'Contrôles conformes'),
      statItem(syntheseCombActuelle.caissesEcartValide, 'Écarts validés'),
      statItem(`${syntheseCombActuelle.ecartValideCumule >= 0 ? '+' : ''}${syntheseCombActuelle.ecartValideCumule.toFixed(2)} €`, 'Cumul validé du mois'),
      statItem(serieUnifiee.enCours, 'Validations conformes d\'affilée'),
      statItem(pointsFiabiliteTotal, 'Points de fiabilité'),
      statItem(tendanceTexte, 'Vs mois précédent'),
    ].join('');

    // Niveau 3 — historique unifié, une ligne = une activité, filtrable.
    // Le détail Boutique/Piste réutilise le message Coach + les causes
    // possibles déjà établis (section 10) — jamais un second discours
    // divergent pour la même donnée. Le détail FDJ reste volontairement
    // limité aux montants de caisse déjà transmis dans cette page (caisse
    // attendue/écart constaté/régularisation/motif) : le détail jeu par jeu
    // (stock grattage/tirages) n'est pas rechargé ici pour ne pas alourdir
    // "Ma Progression" d'une requête supplémentaire — il reste consultable
    // en détail dans Contrôle FDJ, lien fourni dans la fiche.
    const MOTIF_ECART_FDJ_LABEL = {
      erreur_saisie: 'Erreur de saisie', erreur_comptage: 'Erreur de comptage',
      carnet_non_declare: 'Carnet non déclaré', mouvement_oublie: 'Réapprovisionnement non enregistré',
      erreur_rapport: 'Erreur sur le rapport FDJ', autre: 'Autre raison', non_explique: 'Non expliqué',
    };
    const fmtEuroSigne = v => v == null ? '—' : `${v >= 0 ? '+' : ''}${v.toFixed(2)} €`;

    const detailBoutiquePisteHtml = (l) => {
      const messageCoach = N.messageCoachCaisseJour({ statut: l.statut, montantEcart: l.montant, serieValideeConformeVal: serieConformeVal, ameliorationDetectee });
      const causesHtml = l.statut === 'validee_ecart'
        ? `<div class="causes-list-wrap"><b>Ce qui peut expliquer cet écart (hypothèses à vérifier, jamais des certitudes) :</b>
            <ul class="causes-list">${N.CAUSES_POSSIBLES_CAISSE.map(c => `<li>${c}</li>`).join('')}</ul>
           </div>`
        : '';
      return `
        ${l.statut === 'provisoire' ? `<div class="protection-note" style="margin-top:0; padding-top:0; border-top:none;">${N.MENTION_PROTECTION_COURTE}</div>` : ''}
        <div style="margin-top:8px;">${messageCoach}</div>
        ${causesHtml}`;
    };

    const detailFdjHtml = (s) => {
      const regularise = s.ecart != null && s.ecartOrigine != null && s.ecart !== s.ecartOrigine;
      return `
        <div class="fdj-detail-grid">
          <div><span class="fdj-detail-label">Caisse attendue</span><span class="fdj-detail-val">${fmtEuroSigne(s.caisseAttendue)}</span></div>
          <div><span class="fdj-detail-label">Écart constaté à la clôture</span><span class="fdj-detail-val">${fmtEuroSigne(s.ecartOrigine)}</span></div>
          ${regularise ? `<div><span class="fdj-detail-label">Après régularisation manager</span><span class="fdj-detail-val">${fmtEuroSigne(s.ecart)}</span></div>` : ''}
          ${s.motifEcart ? `<div><span class="fdj-detail-label">Motif</span><span class="fdj-detail-val">${MOTIF_ECART_FDJ_LABEL[s.motifEcart] || s.motifEcart}</span></div>` : ''}
        </div>
        <div style="margin-top:8px; font-size:11.5px; color:var(--text-dim);">Détail complet du quart (jeux, tirages, stock) disponible dans FDJ Opérations.</div>`;
    };

    const ligneHistoriqueItemHtml = (l, i) => {
      const dateLabel = new Date(l.date + 'T00:00:00').toLocaleDateString('fr-FR');
      // Le quart est une valeur libre saisie côté Verify (ex: "1", "2") —
      // pas un enum matin/soir garanti. On l'affiche tel quel.
      const quartLabel = `Quart ${l.quart}`;
      const detailHtml = l.activite === 'fdj' ? detailFdjHtml(l.source) : detailBoutiquePisteHtml(l);
      const montantHtml = l.montant != null
        ? `<div class="caisse-jour-montant">${l.montant >= 0 ? '+' : ''}${l.montant.toFixed(2)} €</div>`
        : (!l.attribuable ? `<div class="caisse-jour-montant vide">Poste partagé — écart non attribuable individuellement</div>` : '');
      return `
      <div class="caisse-jour-item" data-activite="${l.activite}" data-idx="${i}">
        <div class="caisse-jour-top">
          <div>
            <div><span class="caisse-jour-date">${dateLabel}</span><span class="caisse-jour-quart">· ${quartLabel}</span></div>
            <span class="activite-badge small ${l.activite}">${ACTIVITE_ICONE[l.activite]} ${ACTIVITE_LABEL[l.activite]}</span>
          </div>
          <span class="statut-badge-caisse ${l.statut}" title="${l.statut === 'provisoire' ? N.MENTION_PROTECTION_COURTE : ''}">${N.LIBELLE_STATUT_CAISSE_JOUR[l.statut]}</span>
        </div>
        ${montantHtml}
        <div class="caisse-jour-detail" id="histDetail-${i}">${detailHtml}</div>
      </div>`;
    };

    const historiqueListeHtml = lignesUnifiees.length
      ? lignesUnifiees.map((l, i) => ligneHistoriqueItemHtml(l, i)).join('')
      : `<div class="caisses-empty">Aucun contrôle de caisse enregistré pour l\'instant.</div>`;

    const mesResultatsHtml = `
      <div class="section-label">Mes résultats — ${labelMois}</div>
      <div class="coach-card">
        <div class="caisses-sub">Suivez vos résultats par activité et votre régularité dans le temps.</div>
        <div class="activite-cards-stack">${miniCartesHtml}</div>
      </div>
      <div class="coach-card">
        <div class="caisses-stats-grid">${statsGridHtml}</div>
        ${bonusRegulariteVal.paliersAtteints > 0 ? `<div class="fiabilite-line">🏅 dont +${bonusRegulariteVal.points} de régularité (${serieConformeVal.enCours} validées conformes d'affilée, Boutique/Piste)</div>` : ''}
        <div class="protection-note">${N.MENTION_PROTECTION_COURTE} <span class="info-dot" title="${N.MENTION_PROTECTION_LONGUE}">ⓘ en savoir plus</span></div>
      </div>
      <div class="coach-card" style="padding-bottom:6px;">
        <div class="filtre-activite" id="filtreActivite">
          <button class="filtre-pill active" data-filtre="tous" type="button">Tous</button>
          <button class="filtre-pill" data-filtre="boutique" type="button">Boutique</button>
          <button class="filtre-pill" data-filtre="piste" type="button">Piste</button>
          <button class="filtre-pill" data-filtre="fdj" type="button">FDJ</button>
        </div>
      </div>
      <div class="coach-card" id="historiqueListeCard">${historiqueListeHtml}</div>
    `;

    // ------------------------------------------------------------
    // Rendu "Score missions"
    // ------------------------------------------------------------
    const histoMissionItemHtml = c => {
      const dateLabel = new Date(c.date + 'T00:00:00').toLocaleDateString('fr-FR');
      const valide = completionValidee(c);
      const pts = pointsEffectifsCompletion(c);
      return `<div class="histo-mission-row">
        <div>
          <div class="histo-mission-titre">${c.titre || c.mission_id}</div>
          <div class="histo-mission-date">${dateLabel}${c.heure ? ' · ' + c.heure.slice(0, 5) : ''}</div>
        </div>
        <div class="histo-mission-droite">
          <span class="histo-mission-pts">+${pts} pt${pts > 1 ? 's' : ''}</span>
          <span class="statut-badge-mission ${valide ? 'valide' : 'en_attente'}">${valide ? 'Validé' : '⏳ En attente'}</span>
        </div>
      </div>`;
    };
    const historiqueMissionsHtml = historiqueMissions.length
      ? historiqueMissions.map(histoMissionItemHtml).join('')
      : `<div class="caisses-empty">Aucune mission enregistrée pour l'instant.</div>`;

    const scoreMissionsHtml = `
      <div class="section-label">Score missions</div>
      <div class="coach-card">
        <div class="caisses-sub">Progression mensuelle — cumul des points de missions ${vueManager ? 'de ' + cible.nom.split(' ')[0] : 'gagnés'}, validés uniquement.</div>
        <div class="caisses-stats-grid">
          ${statItem(cumulSemaineMissions, 'Cumul de la semaine')}
          ${statItem(cumulMoisMissions, `Cumul de ${labelMois}`)}
        </div>
        ${pointsEnAttenteMissions > 0 ? `<div class="attente-line">⏳ ${pointsEnAttenteMissions} point${pointsEnAttenteMissions > 1 ? 's' : ''} en attente de validation manager (missions à preuve photo)</div>` : ''}
        ${bonusRegulariteVal.paliersAtteints > 0 || pointsFiabiliteTotal > 0 ? `<div class="fiabilite-line">🏅 Bonus de régularité : ${pointsFiabiliteTotal} point${pointsFiabiliteTotal > 1 ? 's' : ''} de fiabilité cumulé${pointsFiabiliteTotal > 1 ? 's' : ''}${bonusRegulariteVal.paliersAtteints > 0 ? ` · dont +${bonusRegulariteVal.points} de régularité (${serieConformeVal.enCours} validées conformes d'affilée)` : ''}</div>` : ''}
      </div>
      <div class="coach-card">
        <div class="caisses-sub" style="margin-bottom:6px;">Historique détaillé par mission et bonus.</div>
        ${historiqueMissionsHtml}
      </div>
    `;

    // ------------------------------------------------------------
    // Rendu "Mes séries" (19-20/08/2026) — voir moteur ci-dessus. Vocabulaire
    // cadrage §14 respecté : jamais "série perdue", jamais "comptage
    // parfait" ; "record personnel" plutôt qu'un classement. Une seule
    // fonction de rendu pour Caisse et Inventaire — jamais deux gabarits
    // divergents pour la même mécanique (Article 11).
    // ------------------------------------------------------------
    function renderSerieCard({ icone, nomSerie, catalogue, serie, resultat }) {
      const paliersHtml = catalogue.map(p => {
        const obtenu = resultat.codesAcquisFinal.includes(p.code);
        return `<div class="badge-card ${obtenu ? 'obtenu' : ''}">
          <div class="badge-icone">${icone}</div>
          <div class="badge-label">${p.label}</div>
          ${!obtenu ? `<div class="badge-progress">Encore ${Math.max(0, p.seuil - serie.record)} pour débloquer</div>` : ''}
        </div>`;
      }).join('');
      return `
        <div class="serie-card">
          <div class="serie-row"><span class="serie-nom">${icone} ${nomSerie}</span><span class="serie-valeur">${serie.enCours}</span></div>
          ${resultat.prochainPalierVal ? `
            <div class="serie-sub">Encore ${resultat.prochainPalierVal.manque} pour débloquer « ${resultat.prochainPalierVal.label} »</div>
            <div class="serie-bar-track"><div class="serie-bar-fill" style="width:${Math.min(100, Math.round(serie.record / resultat.prochainPalierVal.seuil * 100))}%;"></div></div>
          ` : `<div class="serie-sub">Tous les paliers sont débloqués — merci pour votre régularité.</div>`}
          <div class="serie-record">Record personnel : ${serie.record}${resultat.totalPoints > 0 ? ` · ${resultat.totalPoints} point${resultat.totalPoints > 1 ? 's' : ''} de série` : ''}</div>
          <div class="badges-grid" style="margin-top:14px;">${paliersHtml}</div>
        </div>`;
    }

    // Paramètres manager (P8, 20/08/2026) : une série désactivée dans
    // Paramètres Station n'affiche plus sa carte (mais rien n'est retiré de
    // l'historique déjà acquis — voir crediterPaliersFranchis plus haut).
    // Si les deux domaines sont désactivés, le bloc "Mes séries" disparaît
    // entièrement plutôt que d'afficher un titre sans contenu.
    const cartesSeriesHtml = [
      reglesSeries.caisseActif ? renderSerieCard({ icone: '🔥', nomSerie: 'Caisse — validations conformes d\'affilée', catalogue: reglesSeries.caissePaliers, serie: serieUnifiee, resultat: resultatSerieCaisse }) : '',
      reglesSeries.inventaireActif ? renderSerieCard({ icone: '📦', nomSerie: 'Inventaire — sessions sans correction confirmée', catalogue: reglesSeries.inventairePaliers, serie: serieInventaire, resultat: resultatSerieInventaire }) : '',
    ].join('');
    const serieCardHtml = cartesSeriesHtml ? `
      <div class="section-label">Mes séries</div>
      ${cartesSeriesHtml}
    ` : '';

    // Micro-récompense de déblocage (cadrage §7.2) — non bloquante, affichée
    // une seule fois au moment réel du déblocage (nouveauxDeblocages n'est
    // jamais rempli une deuxième fois pour le même badge, grâce à
    // l'idempotence de l'INSERT ci-dessus). Les deux domaines partagent la
    // même notification, simplement concaténés — jamais plus d'une carte par
    // badge réellement débloqué à l'instant du chargement.
    const tousLesDeblocages = resultatSerieCaisse.nouveauxDeblocages.concat(resultatSerieInventaire.nouveauxDeblocages);
    const deblocageHtml = tousLesDeblocages.length
      ? tousLesDeblocages.map(p => `
        <div class="deblocage-card">🏅 Badge débloqué : <b>${p.label}</b><br>
          Vous venez d'atteindre ce palier de régularité.
          <div class="deblocage-pts">+${p.points} points</div>
        </div>`).join('')
      : '';

    const fortsHtml = forts.length
      ? `<ul class="fort-list">${forts.map(f => `<li class="fort-item"><span class="dot">🟢</span>${f}</li>`).join('')}</ul>`
      : `<div class="coach-sub">${vueManager ? 'NEXUS n\'a pas encore assez de recul pour dégager ses points forts.' : 'Je n\'ai pas encore assez de recul pour dégager vos points forts.'} ${vueManager ? 'Chaque service qu\'il enregistre affine l\'analyse.' : 'Chaque service que vous enregistrez affine mon analyse.'}</div>`;

    const axeHtml = axe
      ? `<div class="axe-badge">${axe.domaine}</div>
         <div class="coach-text">${axe.constat}</div>
         ${axe.causeProbable ? `<div class="axe-cause">${axe.causeProbable}</div>` : ''}
         <div class="reco-box"><b>Prochaine étape —</b> ${axe.recommandation}</div>`
      : `<div class="coach-sub">Aucun axe de progression prioritaire ne se dégage actuellement sur les compétences suivies — ${vueManager ? 'continuez ainsi' : 'continuez ainsi'}. ✅</div>`;

    document.getElementById('app').innerHTML = `
      <div class="coach-card">
        <div class="coach-head">
          <img class="coach-avatar" src="assets/nexus-avatar.png" alt="Coach NEXUS">
          <div>
            <div class="coach-nom">COACH NEXUS</div>
            <div class="coach-sous-nom">${vueManager ? 'Coach personnel de ' + cible.nom : 'Votre coach personnel'}</div>
          </div>
        </div>
        <div class="coach-text">${accueil}</div>
        <a class="apprentissage-link" href="NEXUS-Apprentissage-v1.html${vueManager ? '?employe=' + cible.id : ''}">${nouveauteEnAttente ? '<span class="nouveaute-dot"></span> ' : ''}Ce que NEXUS a appris sur ${vueManager ? cible.nom.split(' ')[0] : 'moi'} →</a>
      </div>

      ${deblocageHtml}

      ${serieCardHtml}

      <div class="section-label">${vueManager ? 'Ses points forts' : 'Vos points forts'}</div>
      <div class="coach-card">${fortsHtml}</div>

      <div class="section-label">${vueManager ? 'Son principal axe de progression' : 'Votre principal axe de progression'}</div>
      <div class="coach-card">${axeHtml}</div>

      <div class="section-label">Encouragement</div>
      <div class="encourage-card">${encouragement}</div>

      <div class="section-label">Niveau NEXUS</div>
      <div class="niveau-card">
        <div class="niveau-top">
          <span class="niveau-label">Niveau</span>
          <span class="niveau-nom">${niveau.nom}</span>
        </div>
        ${niveau.progression ? `
          <div class="niveau-bar-track"><div class="niveau-bar-fill" style="width:${Math.min(100, Math.round(niveau.experience / niveau.progression.seuilSuivant * 100))}%;"></div></div>
          <div class="niveau-bar-legende">Encore ${niveau.progression.manque} pour atteindre « ${niveau.progression.nomSuivant} »</div>
        ` : `<div class="niveau-detail">Niveau maximum atteint — merci pour votre régularité.</div>`}
        ${ligneCompetence('Caisse', statutCaisseVal)}
        ${ligneCompetence('Ponctualité', statutPonctualiteVal)}
        ${ligneCompetence('Missions', statutMissionsVal)}
        ${ligneCompetence('Tenue', statutTenueVal)}
        ${ligneCompetence('Relation client', statutRelationClientVal)}
      </div>

      ${scoreMissionsHtml}

      ${mesResultatsHtml}

      <div class="section-label">${vueManager ? 'Ses réussites' : 'Vos réussites'}</div>
      <div class="badges-grid">
        ${badges.map(b => `
          <div class="badge-card ${b.obtenu ? 'obtenu' : ''}">
            <div class="badge-icone">🏅</div>
            <div class="badge-label">${b.label}</div>
            ${!b.obtenu ? `<div class="badge-progress">Prochaine étape · encore ${b.seuil - b.valeurActuelle}</div>` : ''}
          </div>
        `).join('')}
      </div>
    `;

    // Ouvrir/fermer le détail d'une ligne d'historique (clic sur la ligne)
    // — même mécanisme que l'historique de NEXUS-Verify-v1.html.
    document.querySelectorAll('.caisse-jour-item').forEach(item => {
      item.addEventListener('click', () => {
        const detail = document.getElementById(`histDetail-${item.dataset.idx}`);
        if (detail) detail.classList.toggle('open');
      });
    });

    // Filtres rapides "Tous | Boutique | Piste | FDJ" (16/08/2026, demande
    // de Frédéric) — purement client (aucun rechargement Supabase), simple
    // affichage/masquage des lignes déjà rendues, pour rester réactif.
    const filtreBar = document.getElementById('filtreActivite');
    if (filtreBar) {
      filtreBar.addEventListener('click', (ev) => {
        const btn = ev.target.closest('.filtre-pill');
        if (!btn) return;
        filtreBar.querySelectorAll('.filtre-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const filtre = btn.dataset.filtre;
        document.querySelectorAll('#historiqueListeCard .caisse-jour-item').forEach(item => {
          item.style.display = (filtre === 'tous' || item.dataset.activite === filtre) ? '' : 'none';
        });
      });
    }
  });
</script>
</body>
</html>
