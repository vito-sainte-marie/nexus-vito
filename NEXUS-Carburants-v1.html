<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .horodateur-discret{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:8px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  .note{font-size:11.5px; color:var(--text-dim); line-height:1.55; margin-bottom:14px;}

  /* Rattrapage (13/08/2026) — bannière posée en tête de contenu quand la
     date éditée n'est pas aujourd'hui, pour qu'on ne puisse jamais
     confondre visuellement cet écran avec le relevé du jour. */
  .rattrapage-banniere{display:flex; gap:10px; padding:12px 14px; border-radius:12px; background:rgba(245,166,35,0.08); border:1px solid rgba(245,166,35,0.3); margin-bottom:14px;}
  .rattrapage-banniere-icon{font-size:16px; flex-shrink:0;}
  .rattrapage-banniere-titre{font-size:12.5px; font-weight:700; color:var(--amber); margin-bottom:3px;}
  .rattrapage-banniere-texte{font-size:11.5px; color:var(--text-mid); line-height:1.5;}

  .carb-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin-bottom:14px;}
  .carb-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:2px;}
  .carb-nom{font-size:15px; font-weight:700;}
  .carb-cuve{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em;}

  .champ-label{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); margin:12px 0 6px; letter-spacing:0.03em;}
  .champ-input{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    padding:11px 13px; color:var(--text); font-family:var(--mono); font-size:16px; text-align:right;
  }
  .champ-input:focus{outline:none; border-color:var(--cyan);}
  .champ-row{display:flex; gap:8px;}
  .champ-row .champ-input-wrap{flex:1;}
  .champ-input-sub{font-family:var(--mono); font-size:8.5px; color:var(--text-dim); text-align:center; margin-top:4px; text-transform:uppercase;}
  .champ-motif{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    padding:10px 12px; color:var(--text); font-family:var(--sans); font-size:13px; margin-top:8px;
  }
  .champ-motif:focus{outline:none; border-color:var(--cyan);}

  .ventes-banner{margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--panel-raised); font-size:11.5px; color:var(--text-mid); line-height:1.5;}
  .ventes-banner b{color:var(--text);}
  .ventes-banner.vide{color:var(--text-dim); font-style:italic;}
  /* 13/08/2026, demande de Frédéric : "rendre ceci cliquable afin que je
     retrouve la caisse où il n'y a pas de litrage" — la bannière "vide"
     devient un déclencheur vers le détail quart par quart. */
  .ventes-banner-clic{cursor:pointer; font-style:normal;}
  .ventes-banner-lien{display:block; margin-top:4px; color:var(--amber); font-weight:600; font-style:normal;}
  .ventes-detail{margin-top:6px; padding:8px 10px; border-radius:8px; background:var(--panel); border:1px solid var(--hairline);}
  .ventes-detail-note{font-size:11px; color:var(--text-dim); line-height:1.5;}
  .ventes-detail-ligne{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--hairline); font-size:11px; flex-wrap:wrap;}
  .ventes-detail-ligne:last-child{border-bottom:none;}
  .ventes-detail-ligne.manquant span:nth-child(2){color:var(--amber); font-weight:600;}
  .ventes-detail-lien{color:var(--amber); text-decoration:none; font-weight:600; font-size:10.5px;}
  .ventes-detail-lien:hover{text-decoration:underline;}

  .resultat-panel{margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline);}
  .resultat-row{display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:12.5px;}
  .resultat-label{color:var(--text-mid);}
  .resultat-valeur{font-family:var(--mono); font-weight:700;}
  .resultat-statut{display:inline-block; font-family:var(--mono); font-size:10px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; margin-top:8px;}

  .btn-enregistrer{
    display:block; width:100%; margin-top:6px; padding:15px; border:none; border-radius:12px;
    background:var(--cyan); color:#04141a; font-family:var(--sans); font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn-enregistrer:disabled{opacity:0.5;}
  .btn-enregistrer:active{opacity:0.85;}
  .confirmation{display:none; margin-top:10px; padding:10px; background:var(--green-dim); color:var(--green); border-radius:10px; text-align:center; font-size:12.5px;}
  .confirmation.visible{display:block;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}

  /* Vue bureau (cohérente avec les autres écrans manager NEXUS) */
  body.nexus-desktop .phone{max-width:640px; border:none;}
  body.nexus-desktop .desktop-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start;}
  body.nexus-desktop .desktop-grid > *{grid-column:span 2;}
</style>

<script>
  // ------------------------------------------------------------
  // NEXUS Carburants v1 (10/08/2026) — demande de Frédéric, née d'une
  // observation très concrète : "mon problème n'est pas d'avoir trop peu de
  // données, c'est l'inverse : je dois ressaisir, recouper, comparer d'un
  // tableau à l'autre." Sur les 4 étapes de sa routine matinale
  // (Carburants, FDJ, Caisse veille, Inventaire), Carburants était le seul
  // domaine sans aucune trace dans NEXUS — ce fichier comble ce manque.
  //
  // Principe non négociable : le litrage vendu par carburant existe déjà,
  // quart par quart, dans audits_caisse (litrage_gazole/sp95/gnr, saisi une
  // seule fois dans NEXUS Verify). Cet écran ne le redemande JAMAIS — il ne
  // capture que ce qui n'existe nulle part ailleurs : le stock réel mesuré
  // physiquement (jaugeage), et les mouvements qui ne sont pas des ventes
  // (livraison, correction exceptionnelle).
  //
  // Structure fidèle au fichier réel de Frédéric ("Variation carburant
  // 2026.xlsx") : Gasoil sur deux cuves physiques distinctes (20000 L +
  // 10000 L, jaugées séparément puis additionnées), SP95 et GNR sur une
  // seule cuve chacun.
  //
  // Formule théorique volontairement corrigée par rapport au fichier Excel
  // — voir nexus-carburant-moteur.js pour le détail complet et la preuve
  // chiffrée sur le fichier réel qui a motivé ce choix (décision de
  // Frédéric, 10/08/2026).
  // ------------------------------------------------------------

  let SITE_ID = null; // jamais 'vito-sainte-marie' par defaut (de-Vito-isation, 11/08/2026) - toujours ecrase par employee.site_id apres nexusRequireAuth()
  let MANAGER_COURANT = null;
  // Rattrapage (13/08/2026, demande de Frédéric : "ça fait 2-3 jours que le
  // jaugeage n'a pas été indiqué") — cet écran n'est plus figé sur
  // aujourd'hui. `DATE_CIBLE` vient de `?date=YYYY-MM-DD` (lien envoyé
  // depuis Carburants Pilotage) et retombe sur aujourd'hui si absent/
  // invalide/futur — comportement strictement identique à avant pour tout
  // lien existant qui n'a jamais eu ce paramètre.
  let DATE_CIBLE = null;
  let EST_AUJOURDHUI = true;
  let DERNIER_RELEVE = null;   // dernier relevé RÉEL avant DATE_CIBLE (ancre du calcul théorique)
  let RELEVE_CIBLE = null;     // relevé déjà enregistré pour DATE_CIBLE, si le manager revient corriger
  let PROCHAIN_RELEVE = null;  // relevé RÉEL le plus proche APRÈS DATE_CIBLE (rattrapage seulement — jamais recalculé, juste informatif)
  let VENTES_DEPUIS = { go: null, sp95: null, gnr: null };
  // Point zéro carburants (14/08/2026, demande de Frédéric : "Créer un point
  // zéro carburants" — contrôle physique certifié qui devient la nouvelle
  // référence de calcul, exactement comme pour le stock FDJ). S'il est plus
  // récent que DERNIER_RELEVE, il devient l'ancre à sa place — voir
  // ANCRE_EST_POINT_ZERO/DATE_ANCRE ci-dessous. Si DATE_CIBLE est antérieure
  // ou égale à sa date, la saisie reste possible (correction d'un jour
  // passé) mais l'aperçu théorique affiche "historique non fiable" plutôt
  // qu'un écart calculé sur une ancre déjà disqualifiée (Article 5).
  // CORRECTIF 14/08/2026 (retour de Frédéric le jour même de la première
  // certification, "remettre l'écart historique à zéro ne doit surtout pas
  // faire disparaître les jauges") : le jour EXACT de la certification
  // (DATE_CIBLE === POINT_ZERO.date) n'est PAS un historique non fiable —
  // c'est REFERENCE_CERTIFIEE_CE_JOUR, où théorique = physique certifié et
  // écart = 0, jamais un panneau vide. HISTORIQUE_NON_FIABLE ne couvre plus
  // que les jours strictement antérieurs au point zéro.
  let POINT_ZERO = null;
  let ANCRE_EST_POINT_ZERO = false;
  let DATE_ANCRE = null;
  let HISTORIQUE_NON_FIABLE = false;
  let REFERENCE_CERTIFIEE_CE_JOUR = false;
  let ENREGISTREMENT_EN_COURS = false;
  // 13/08/2026, demande de Frédéric : "rendre cliquable [le message 'ventes
  // non disponibles'] afin que je retrouve la caisse où il n'y a pas de
  // litrage" — lignes brutes (date, quart, litrage_*) de la même période que
  // VENTES_DEPUIS, gardées pour construire le détail au clic sans requête
  // supplémentaire (même source, jamais une deuxième vérité).
  let LIGNES_PERIODE_VENTES = [];
  const CHAMP_LITRAGE = { go: 'litrage_gazole', sp95: 'litrage_sp95', gnr: 'litrage_gnr' };

  const CARBURANTS = [
    { cle: 'sp95', nom: 'Sans plomb (SP95)', cuve: 'Cuve 30 000 L', champsReel: ['stock_reel_sp95'] },
    { cle: 'go', nom: 'Gasoil (GO)', cuve: 'Cuve 20 000 L (1) + Cuve 10 000 L (2)', champsReel: ['stock_reel_go_cuve1', 'stock_reel_go_cuve2'] },
    { cle: 'gnr', nom: 'Gasoil non routier (GNR)', cuve: 'Cuve 30 000 L', champsReel: ['stock_reel_gnr'] },
  ];

  const COULEUR_STATUT = {
    'Sous contrôle': 'var(--green)', 'À surveiller': 'var(--amber)',
    'À corriger': 'var(--red)', 'Données insuffisantes': 'var(--text-dim)',
    'Référence certifiée': 'var(--green)',
  };
  const FOND_STATUT = {
    'Sous contrôle': 'var(--green-dim)', 'À surveiller': 'var(--amber-dim)',
    'À corriger': 'var(--red-dim)', 'Données insuffisantes': 'var(--panel-raised)',
    'Référence certifiée': 'var(--green-dim)',
  };

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function formaterDateFr(iso) {
    if (!iso) return null;
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }
  function numFR(v) {
    if (v == null || v === '') return null;
    const n = Number(String(v).replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  }
  function fmtL(v) {
    return v == null ? '—' : `${Math.round(v).toLocaleString('fr-FR')} L`;
  }
  // Date de rattrapage demandée dans l'URL (lien envoyé par Carburants
  // Pilotage) — validée strictement (format + jamais dans le futur, saisir
  // un jaugeage qui n'a pas encore eu lieu n'a pas de sens) avant d'être
  // utilisée. Toute valeur absente/invalide retombe silencieusement sur
  // aujourd'hui, jamais une erreur qui bloquerait l'écran.
  function dateCibleDepuisURL() {
    try {
      const p = new URLSearchParams(window.location.search).get('date');
      if (p && /^\d{4}-\d{2}-\d{2}$/.test(p) && p <= todayISO()) return p;
    } catch (e) {}
    return null;
  }

  async function chargerDernierReleve(siteId, avantDateExclusive) {
    const { data, error } = await nexusClient.from('carburant_releves').select('*')
      .eq('site', siteId).lt('date', avantDateExclusive).order('date', { ascending: false }).limit(1).maybeSingle();
    if (error) { console.error('Chargement dernier relevé carburant:', error); return null; }
    return data;
  }
  // Dernier point zéro certifié à date <= dateLimite (14/08/2026) — même
  // requête que NexusCarburantDonnees.chargerDernierPointZero, dupliquée ici
  // car cette page n'inclut que nexus-carburant-moteur.js (jamais
  // nexus-carburant-donnees.js) : une seule vérité de CALCUL (le moteur),
  // mais chaque écran garde ses propres chargeurs Supabase (Article 11).
  // CORRECTIF 14/08/2026 (retour de Frédéric, "recomptage ne doit pas créer
  // un deuxième point zéro automatiquement") : seules les certifications
  // 'initialisation' comptent comme ancre — même règle que
  // NexusCarburantDonnees.chargerDernierPointZero, voir son commentaire.
  async function chargerDernierPointZero(siteId, dateLimite) {
    const { data: ref, error: e1 } = await nexusClient.from('carburant_stock_references')
      .select('*').eq('site', siteId).eq('statut', 'valide').eq('type', 'initialisation').lte('date', dateLimite)
      .order('date', { ascending: false }).order('created_at', { ascending: false })
      .limit(1).maybeSingle();
    if (e1) { console.error('Chargement point zéro carburants:', e1); return null; }
    if (!ref) return null;
    const { data: lignes, error: e2 } = await nexusClient.from('carburant_stock_reference_lignes')
      .select('carburant,stock_reel').eq('reference_id', ref.id);
    if (e2) { console.error('Chargement lignes point zéro carburants:', e2); return null; }
    const parCarburant = { go: null, sp95: null, gnr: null };
    (lignes || []).forEach(l => { parCarburant[l.carburant] = Number(l.stock_reel); });
    return { ...ref, lignes: parCarburant };
  }
  // Relevé RÉEL le plus proche APRÈS une date donnée — utilisé uniquement
  // en mode rattrapage, pour informer le manager qu'un jour plus récent est
  // déjà rempli (jamais modifié ni recalculé par cette page : la formule du
  // moteur se recale d'elle-même sur le relevé le plus proche en amont à
  // chaque calcul, voir nexus-carburant-moteur.js).
  async function chargerProchainReleve(siteId, apresDateExclusive) {
    const { data, error } = await nexusClient.from('carburant_releves').select('date')
      .eq('site', siteId).gt('date', apresDateExclusive).order('date', { ascending: true }).limit(1).maybeSingle();
    if (error) { console.error('Chargement prochain relevé carburant:', error); return null; }
    return data;
  }
  async function chargerReleveDuJour(siteId, date) {
    const { data, error } = await nexusClient.from('carburant_releves').select('*')
      .eq('site', siteId).eq('date', date).maybeSingle();
    if (error) { console.error('Chargement relevé carburant du jour:', error); return null; }
    return data;
  }
  // Ventes déjà captées dans NEXUS Verify (litrage_gazole/sp95/gnr) entre le
  // dernier relevé (INCLUS) et la date cible (exclue) — jamais ressaisies ici.
  //
  // Convention temporelle formalisée par Frédéric le 14/08/2026 (voir
  // l'en-tête "CONVENTION TEMPORELLE" de nexus-carburant-moteur.js) : un
  // relevé représente le stock à l'OUVERTURE du jour. Les ventes du jour du
  // dernier relevé ont donc eu lieu APRÈS SA PROPRE ouverture — elles
  // comptent. Les ventes de la date cible (ce relevé-ci) n'ont, elles, pas
  // encore eu lieu au moment de cette ouverture — elles ne comptent PAS ici
  // et compteront dans le théorique du PROCHAIN relevé.
  // Historique de ce point précis, pour ne pas répéter l'erreur : la toute
  // première version (avant le 14/08) excluait les DEUX bornes — toujours
  // vide en cadence quotidienne, théorique jamais calculable. Une première
  // correction le 14/08 avait ensuite à tort INCLUS la date cible — comptait
  // des ventes non encore advenues au moment du jaugeage d'ouverture.
  // Corrigé ici en bornes [dernier relevé inclus, date cible exclue).
  async function chargerVentesDepuisDernierReleve(siteId, depuisDateIncluse, jusquADateExclusive) {
    LIGNES_PERIODE_VENTES = [];
    if (!depuisDateIncluse) return { go: null, sp95: null, gnr: null };
    const { data, error } = await nexusClient.from('audits_caisse')
      .select('date,quart,litrage_gazole,litrage_sp95,litrage_gnr')
      .eq('site', siteId).gte('date', depuisDateIncluse).lt('date', jusquADateExclusive)
      .order('date', { ascending: true }).order('quart', { ascending: true });
    if (error) { console.error('Chargement ventes carburant (audits_caisse):', error); return { go: null, sp95: null, gnr: null }; }
    LIGNES_PERIODE_VENTES = data || [];
    return NexusCarburantMoteur.sommerVentesPeriode(data);
  }

  // Détail quart par quart de la période "depuis le dernier relevé", pour le
  // clic sur la bannière "ventes non disponibles" (13/08/2026). Ne recalcule
  // rien : relit juste LIGNES_PERIODE_VENTES déjà chargée, et signale
  // honnêtement l'absence totale de quart plutôt que de laisser un panneau
  // vide sans explication (Article 11, non-invention).
  function renderDetailVentesManquantes(carbCle) {
    const el = document.getElementById(`ventesDetail_${carbCle}`);
    if (!el) return;
    const champ = CHAMP_LITRAGE[carbCle];
    if (!LIGNES_PERIODE_VENTES.length) {
      const depuisTxt = DATE_ANCRE ? formaterDateFr(DATE_ANCRE) : '—';
      const jusquaTxt = formaterDateFr(DATE_CIBLE);
      el.innerHTML = `<div class="ventes-detail-note">Aucun quart de caisse trouvé dans NEXUS Verify entre le ${depuisTxt} (inclus) et le ${jusquaTxt} (exclu) — ce n'est pas nécessairement une anomalie si aucun quart n'a encore eu lieu sur cette période.</div>`;
      return;
    }
    el.innerHTML = LIGNES_PERIODE_VENTES.map(l => {
      const manquant = l[champ] == null;
      return `
        <div class="ventes-detail-ligne ${manquant ? 'manquant' : ''}">
          <span>${formaterDateFr(l.date)} · Quart ${l.quart}</span>
          <span>${manquant ? '⚠ Litrage manquant' : `${Number(l[champ]).toLocaleString('fr-FR')} L`}</span>
          ${manquant ? `<a href="NEXUS-Verify-v1.html?ouvrir_date=${l.date}&ouvrir_quart=${l.quart}" class="ventes-detail-lien">Corriger dans Verify →</a>` : ''}
        </div>`;
    }).join('');
  }

  function valeurChamp(id) {
    const el = document.getElementById(id);
    return el ? numFR(el.value) : null;
  }

  // Recalcule et affiche le panneau résultat d'un carburant à partir des
  // champs actuellement saisis à l'écran (réactif à chaque frappe).
  function recalculerCarburant(carb) {
    const panel = document.getElementById(`resultat_${carb.cle}`);
    if (!panel) return;

    // Point zéro (14/08/2026) : aucun théorique/écart affiché pour une date
    // antérieure ou égale au point zéro — la saisie du stock réel reste
    // possible (correction d'un jour passé), mais NEXUS ne qualifie pas un
    // écart construit sur une ancre déjà disqualifiée (Article 5).
    if (HISTORIQUE_NON_FIABLE) {
      panel.innerHTML = `
        <div class="resultat-row"><span class="resultat-label">Théorique</span><span class="resultat-valeur">—</span></div>
        <span class="resultat-statut" style="color:var(--text-dim); background:var(--panel-raised);">Rapprochement historique non fiable — période précédant le point zéro du ${formaterDateFr(POINT_ZERO.date)}</span>
      `;
      return;
    }

    const reelDuJour = carb.cle === 'go'
      ? (valeurChamp('champ_go_cuve1') != null && valeurChamp('champ_go_cuve2') != null
          ? valeurChamp('champ_go_cuve1') + valeurChamp('champ_go_cuve2') : null)
      : valeurChamp(`champ_${carb.cle}`);
    // Ancre du calcul : le point zéro s'il est plus récent que
    // DERNIER_RELEVE (ou si aucun relevé réel n'existe), sinon le dernier
    // relevé réel comme avant — voir ANCRE_EST_POINT_ZERO ci-dessus. Un
    // point zéro certifie UNE valeur totale par carburant (pas de détail
    // par cuve), d'où la lecture directe de POINT_ZERO.lignes sans passer
    // par stockReelGoTotal.
    const dernierReel = ANCRE_EST_POINT_ZERO
      ? (POINT_ZERO.lignes ? POINT_ZERO.lignes[carb.cle] : null)
      : (carb.cle === 'go' ? NexusCarburantMoteur.stockReelGoTotal(DERNIER_RELEVE) : (DERNIER_RELEVE ? DERNIER_RELEVE[`stock_reel_${carb.cle}`] : null));
    // CORRECTIF 14/08/2026 : le jour de la certification, si le manager n'a
    // pas ressaisi le jaugeage dans ce champ (rien à ressaisir, il vient de
    // le certifier), le stock du jour retombe sur la valeur physique
    // certifiée elle-même — jamais null/vide (Frédéric : "les jauges
    // doivent continuer à afficher normalement").
    let reelDuJourEffectif = reelDuJour;
    if (REFERENCE_CERTIFIEE_CE_JOUR && reelDuJourEffectif == null) reelDuJourEffectif = dernierReel;
    // CORRECTIF 14/08/2026 (retour de Frédéric, "BUG CRITIQUE POINT ZÉRO") :
    // le jour même de la certification, toute livraison/mouvement saisi ici
    // est présumé déjà incorporé dans le stock physique certifié — l'ajouter
    // en plus double-compterait un mouvement antérieur au point zéro (cas
    // réel : livraison de 15 000 L GO déjà reflétée dans le relevé Insite360
    // de 02:00, réinjectée dans le théorique si ce champ n'est pas ignoré ce
    // jour-là). Les valeurs saisies restent enregistrées sur le relevé pour
    // trace, seul le calcul les ignore (voir note affichée sous ces champs).
    const livraison = REFERENCE_CERTIFIEE_CE_JOUR ? 0 : (valeurChamp(`champ_${carb.cle}_livraison`) || 0);
    const mouvement = REFERENCE_CERTIFIEE_CE_JOUR ? 0 : (valeurChamp(`champ_${carb.cle}_mouvement`) || 0);
    const ventes = VENTES_DEPUIS[carb.cle];

    const resultat = NexusCarburantMoteur.calculerCarburant({ dernierReel, reelDuJour: reelDuJourEffectif, livraison, mouvement, ventes });
    if (REFERENCE_CERTIFIEE_CE_JOUR) resultat.statut = 'Référence certifiée';

    const ecartPct = resultat.ecartRatio != null ? `${resultat.ecartRatio >= 0 ? '+' : ''}${(resultat.ecartRatio * 100).toFixed(1)} %` : '—';
    panel.innerHTML = `
      <div class="resultat-row"><span class="resultat-label">Théorique</span><span class="resultat-valeur">${fmtL(resultat.theorique)}</span></div>
      <div class="resultat-row"><span class="resultat-label">Écart (réel − théorique)</span><span class="resultat-valeur" style="color:${resultat.ecart != null && resultat.ecart < 0 ? 'var(--red)' : (resultat.ecart != null && resultat.ecart > 0 ? 'var(--green)' : 'var(--text)')};">${resultat.ecart != null ? `${resultat.ecart >= 0 ? '+' : ''}${Math.round(resultat.ecart).toLocaleString('fr-FR')} L` : '—'}</span></div>
      <div class="resultat-row"><span class="resultat-label">Écart en % des ventes</span><span class="resultat-valeur">${ecartPct}</span></div>
      <span class="resultat-statut" style="color:${COULEUR_STATUT[resultat.statut]}; background:${FOND_STATUT[resultat.statut]};">${resultat.statut}</span>
    `;
  }
  function recalculerTout() { CARBURANTS.forEach(recalculerCarburant); }

  function render() {
    const content = document.getElementById('content');
    const dateTxt = formaterDateFr(DATE_CIBLE);
    if (EST_AUJOURDHUI) {
      document.getElementById('sousTitre').textContent = RELEVE_CIBLE
        ? "Relevé déjà enregistré aujourd'hui — vous pouvez le corriger ci-dessous."
        : "Jaugeage à l'ouverture — les ventes de la veille sont déjà reprises depuis NEXUS Verify, rien à ressaisir.";
    } else {
      document.getElementById('sousTitre').textContent = RELEVE_CIBLE
        ? `Relevé du ${dateTxt} déjà enregistré — vous pouvez le corriger ci-dessous.`
        : `Vous complétez un jour passé — les ventes de la période concernée sont déjà reprises depuis NEXUS Verify, rien à ressaisir.`;
    }

    // Bannière de rattrapage (13/08/2026) — visible uniquement quand
    // DATE_CIBLE n'est pas aujourd'hui : pose le contexte avant les
    // champs de saisie (jamais une page qui ressemble à s'y méprendre au
    // relevé du jour, ce qui serait une source d'erreur — saisir le
    // jaugeage d'hier dans la case d'aujourd'hui par inattention).
    const banniereRattrapage = !EST_AUJOURDHUI ? `
      <div class="rattrapage-banniere">
        <span class="rattrapage-banniere-icon">⏱</span>
        <div>
          <div class="rattrapage-banniere-titre">Rattrapage — ${dateTxt}</div>
          <div class="rattrapage-banniere-texte">Ce relevé sera enregistré à cette date précise, pas à aujourd'hui. Les écarts des jours suivants se recalculent automatiquement dès l'enregistrement.${PROCHAIN_RELEVE ? ` Un relevé plus récent existe déjà (${formaterDateFr(PROCHAIN_RELEVE.date)}) — il n'est pas modifié par cette saisie.` : ''}</div>
        </div>
      </div>` : '';

    const blocs = CARBURANTS.map(carb => {
      const libelleAncre = ANCRE_EST_POINT_ZERO ? `point zéro du ${formaterDateFr(DATE_ANCRE)}` : `dernier relevé (${formaterDateFr(DATE_ANCRE)})`;
      // CORRECTIF 14/08/2026 : le jour EXACT de la certification n'est plus
      // traité comme un historique non fiable — un message positif dédié
      // remplace l'ancien bandeau bloquant (Frédéric : "Nouvelle référence
      // carburants certifiée..."), le HISTORIQUE_NON_FIABLE générique ne
      // couvrant plus que les jours strictement antérieurs.
      const ventesTxt = REFERENCE_CERTIFIEE_CE_JOUR
        ? `<div class="ventes-banner">Nouvelle référence carburants certifiée le ${formaterDateFr(POINT_ZERO.date)}. Les écarts antérieurs ne sont plus propagés — les prochains écarts seront calculés à partir de cette référence.</div>`
        : HISTORIQUE_NON_FIABLE
        ? `<div class="ventes-banner vide">Rapprochement historique non fiable — période précédant le point zéro du ${formaterDateFr(POINT_ZERO.date)}. Le stock réel saisi ici reste enregistré, mais aucun théorique n'est calculé sur cette période.</div>`
        : (VENTES_DEPUIS[carb.cle] != null
            ? `<div class="ventes-banner"><b>${Math.round(VENTES_DEPUIS[carb.cle]).toLocaleString('fr-FR')} L</b> vendus depuis le ${libelleAncre} — déjà repris depuis NEXUS Verify, aucune saisie nécessaire.</div>`
            : (DATE_ANCRE
                ? `<div class="ventes-banner vide ventes-banner-clic" data-carb="${carb.cle}" role="button" tabindex="0">Ventes non disponibles pour cette période (litrage non saisi dans Verify sur au moins un quart) — théorique non calculable.<span class="ventes-banner-lien">Voir le détail des quarts →</span></div>
                   <div class="ventes-detail" id="ventesDetail_${carb.cle}" style="display:none;"></div>`
                : `<div class="ventes-banner vide">Premier relevé enregistré pour ce site — pas encore de comparaison possible, seul le stock réel sera mémorisé${EST_AUJOURDHUI ? " aujourd'hui" : ` pour le ${dateTxt}`}.</div>`));

      const champsReel = carb.cle === 'go'
        ? `<div class="champ-row">
            <div class="champ-input-wrap">
              <input type="text" inputmode="decimal" class="champ-input" id="champ_go_cuve1" placeholder="0" value="${RELEVE_CIBLE && RELEVE_CIBLE.stock_reel_go_cuve1 != null ? String(RELEVE_CIBLE.stock_reel_go_cuve1) : ''}">
              <div class="champ-input-sub">Cuve 20 000 L (1)</div>
            </div>
            <div class="champ-input-wrap">
              <input type="text" inputmode="decimal" class="champ-input" id="champ_go_cuve2" placeholder="0" value="${RELEVE_CIBLE && RELEVE_CIBLE.stock_reel_go_cuve2 != null ? String(RELEVE_CIBLE.stock_reel_go_cuve2) : ''}">
              <div class="champ-input-sub">Cuve 10 000 L (2)</div>
            </div>
          </div>`
        : `<input type="text" inputmode="decimal" class="champ-input" id="champ_${carb.cle}" placeholder="0" value="${RELEVE_CIBLE && RELEVE_CIBLE[`stock_reel_${carb.cle}`] != null ? String(RELEVE_CIBLE[`stock_reel_${carb.cle}`]) : ''}">`;

      return `
        <div class="carb-card">
          <div class="carb-head"><span class="carb-nom">${carb.nom}</span></div>
          <div class="carb-cuve">${carb.cuve}</div>
          <div class="champ-label">Stock réel mesuré (jaugeage) — litres</div>
          ${champsReel}
          ${ventesTxt}
          <div class="champ-label">Livraison depuis le dernier relevé (optionnel) — litres</div>
          <input type="text" inputmode="decimal" class="champ-input" id="champ_${carb.cle}_livraison" placeholder="0" value="${RELEVE_CIBLE && RELEVE_CIBLE[`livraison_${carb.cle}`] ? String(RELEVE_CIBLE[`livraison_${carb.cle}`]) : ''}">
          <div class="champ-label">Mouvement exceptionnel (optionnel) — litres, + ou -</div>
          <input type="text" inputmode="decimal" class="champ-input" id="champ_${carb.cle}_mouvement" placeholder="0" value="${RELEVE_CIBLE && RELEVE_CIBLE[`mouvement_${carb.cle}`] ? String(RELEVE_CIBLE[`mouvement_${carb.cle}`]) : ''}">
          ${REFERENCE_CERTIFIEE_CE_JOUR ? `<div class="ventes-banner vide" style="margin-top:8px;">Ces deux champs sont enregistrés pour trace mais ignorés dans le calcul du jour de la certification — tout mouvement de cette date est présumé déjà reflété dans le stock certifié (correctif 14/08/2026, évite le double comptage).</div>` : ''}
          <div class="resultat-panel" id="resultat_${carb.cle}"></div>
        </div>`;
    }).join('');

    const noteTxt = EST_AUJOURDHUI
      ? "La date, le litrage vendu et les employés du quart ne se saisissent jamais ici — ils viennent déjà de NEXUS Verify. Cet écran ne capture que ce qui n'existe nulle part ailleurs."
      : "Le litrage vendu et les employés du quart ne se saisissent jamais ici — ils viennent déjà de NEXUS Verify pour la période concernée. Cet écran ne capture que ce qui n'existe nulle part ailleurs.";
    const libelleBouton = libelleBoutonEnregistrer();

    content.innerHTML = `
      ${banniereRattrapage}
      <div class="note">${noteTxt}</div>
      <div class="desktop-grid">${blocs}</div>
      <div class="champ-label" style="margin-top:0;">Commentaire (optionnel)</div>
      <textarea class="champ-motif" id="champCommentaire" rows="2" placeholder="Motif d'un mouvement exceptionnel, remarque…">${RELEVE_CIBLE && RELEVE_CIBLE.commentaire ? RELEVE_CIBLE.commentaire : ''}</textarea>
      ${RELEVE_CIBLE ? `
        <div class="champ-label">Motif de la correction (obligatoire)</div>
        <textarea class="champ-motif" id="champMotifCorrection" rows="2" placeholder="Pourquoi ce relevé est corrigé — la valeur initialement saisie reste conservée et consultable."></textarea>
      ` : ''}
      <button class="btn-enregistrer" id="btnEnregistrer" style="margin-top:16px;">${libelleBouton}</button>
      <div class="confirmation" id="confirmation">✓ Relevé${EST_AUJOURDHUI ? '' : ` du ${dateTxt}`} enregistré.</div>
    `;

    document.querySelectorAll('#content input').forEach(el => el.addEventListener('input', recalculerTout));
    document.getElementById('btnEnregistrer').addEventListener('click', enregistrerReleve);
    // 13/08/2026 : clic sur la bannière "ventes non disponibles" — ouvre/
    // ferme le détail quart par quart, rempli à la première ouverture.
    document.querySelectorAll('.ventes-banner-clic').forEach(banniere => {
      const ouvrir = () => {
        const carbCle = banniere.dataset.carb;
        const detail = document.getElementById(`ventesDetail_${carbCle}`);
        if (!detail) return;
        const visible = detail.style.display !== 'none';
        if (visible) { detail.style.display = 'none'; return; }
        if (!detail.innerHTML) renderDetailVentesManquantes(carbCle);
        detail.style.display = 'block';
      };
      banniere.addEventListener('click', ouvrir);
      banniere.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrir(); } });
    });
    recalculerTout();
  }

  // 17/08/2026, Sprint C1 "Preuve" de l'audit Carburants (NEXUS_Audit_
  // Carburants_Chaine_Preuve_Developpeur.pdf) : "Un relevé physique est un
  // fait : il ne doit jamais être réécrit silencieusement" (principe 1).
  // Chaque écriture — première saisie OU correction — pose D'ABORD sa
  // preuve dans carburant_releve_versions (append-only, jamais réécrite ni
  // supprimée) AVANT de toucher carburant_releves (la vue "courante",
  // équivalent de fdj_cash_controls). Si la preuve échoue, rien n'est
  // modifié. Même discipline que la Trace de contrôle FDJ (v2.116-v2.119).
  // 17/08/2026, Sprint C2 "Contrôle" de l'audit Carburants (§5.3 + §6) :
  // pose, pour chacun des 3 carburants, un contrôle versionné entre l'ancre
  // (dernier relevé ou point zéro) et le relevé qui vient d'être écrit —
  // avec sa qualité (fiable/provisoire/non_comparable) et sa cause
  // explicite si dégradée. Reprend EXACTEMENT la même logique que l'écran
  // (recalculerCarburant, plus haut) pour ne jamais qualifier différemment
  // ce qui est affiché et ce qui est prouvé (Article 11). N'écrit jamais
  // dans carburant_releves ni ne modifie l'historique — purement additif.
  // Limite assumée de ce sprint : une correction sur un relevé ANTÉRIEUR
  // ne recalcule pas encore les contrôles des jours suivants — c'est
  // explicitement le sujet du Sprint C3 "Recalcul en cascade".
  async function enregistrerControlesCarburant(versionNum) {
    const referenceType = ANCRE_EST_POINT_ZERO ? 'point_zero' : 'releve';
    const referenceDate = ANCRE_EST_POINT_ZERO ? (POINT_ZERO ? POINT_ZERO.date : null) : (DERNIER_RELEVE ? DERNIER_RELEVE.date : null);
    const referenceExiste = ANCRE_EST_POINT_ZERO ? !!POINT_ZERO : !!DERNIER_RELEVE;
    const commentaireActuel = RELEVE_CIBLE && RELEVE_CIBLE.commentaire ? RELEVE_CIBLE.commentaire : null;

    for (const carb of CARBURANTS) {
      const dernierReel = ANCRE_EST_POINT_ZERO
        ? (POINT_ZERO && POINT_ZERO.lignes ? POINT_ZERO.lignes[carb.cle] : null)
        : (carb.cle === 'go' ? NexusCarburantMoteur.stockReelGoTotal(DERNIER_RELEVE) : (DERNIER_RELEVE ? DERNIER_RELEVE[`stock_reel_${carb.cle}`] : null));
      let reelDuJour = carb.cle === 'go' ? NexusCarburantMoteur.stockReelGoTotal(RELEVE_CIBLE) : RELEVE_CIBLE[`stock_reel_${carb.cle}`];
      if (reelDuJour === undefined) reelDuJour = null;
      if (REFERENCE_CERTIFIEE_CE_JOUR && reelDuJour == null) reelDuJour = dernierReel;
      const livraison = REFERENCE_CERTIFIEE_CE_JOUR ? 0 : (Number(RELEVE_CIBLE[`livraison_${carb.cle}`]) || 0);
      const mouvement = REFERENCE_CERTIFIEE_CE_JOUR ? 0 : (Number(RELEVE_CIBLE[`mouvement_${carb.cle}`]) || 0);
      const ventes = VENTES_DEPUIS[carb.cle];

      let qualite, cause, theorique = null, ecart = null;
      if (HISTORIQUE_NON_FIABLE) {
        qualite = 'non_comparable';
        cause = 'anterieur_au_point_zero';
      } else {
        const q = NexusCarburantMoteur.qualiteChaineCarburant({
          referenceExiste, dernierReel, referenceCertifieeCeJour: REFERENCE_CERTIFIEE_CE_JOUR,
          reelDuJour, ventes, mouvement, commentaire: commentaireActuel,
        });
        qualite = q.qualite;
        cause = q.cause;
        if (qualite !== 'non_comparable') {
          theorique = NexusCarburantMoteur.calculerTheorique(dernierReel, livraison, mouvement, ventes);
          ecart = NexusCarburantMoteur.calculerEcart(reelDuJour, theorique);
        }
      }

      const { error } = await nexusClient.from('carburant_controles').insert({
        site: SITE_ID, date: DATE_CIBLE, carburant: carb.cle, version_num: versionNum,
        reference_date: referenceDate, reference_type: referenceType,
        theorique, physique: reelDuJour, ecart, ventes, livraison, mouvement, qualite, cause,
      });
      // 23505 = ce contrôle (site,date,carburant,version_num) existe déjà —
      // même idempotence que le relevé lui-même. Toute autre erreur est
      // journalisée : le relevé (la preuve principale, Sprint C1) est déjà
      // écrit et intact à ce stade, seule cette interprétation dérivée
      // manquerait — jamais bloquant pour le manager, mais jamais silencieux
      // non plus côté développeur.
      if (error && error.code !== '23505') {
        console.error(`Contrôle carburant carburant_controles (${carb.cle}) :`, error);
      }
    }
  }

  function libelleBoutonEnregistrer() {
    const dateTxt = formaterDateFr(DATE_CIBLE);
    return RELEVE_CIBLE
      ? `Mettre à jour le relevé${EST_AUJOURDHUI ? '' : ` du ${dateTxt}`}`
      : (EST_AUJOURDHUI ? 'Enregistrer le relevé du jour' : `Enregistrer le relevé du ${dateTxt}`);
  }

  async function enregistrerReleve() {
    if (ENREGISTREMENT_EN_COURS) return;
    ENREGISTREMENT_EN_COURS = true;
    const btn = document.getElementById('btnEnregistrer');
    btn.disabled = true;
    btn.textContent = 'Enregistrement…';

    // Toute correction d'un relevé déjà existant doit être motivée — audit
    // §7 : "Chaque correction doit porter : auteur, date/heure, motif...".
    // Aucun motif exigé pour une première saisie (rien à expliquer, c'est
    // la baseline).
    const motifCorrectionEl = document.getElementById('champMotifCorrection');
    const motifCorrection = motifCorrectionEl ? motifCorrectionEl.value.trim() : '';
    if (RELEVE_CIBLE && !motifCorrection) {
      ENREGISTREMENT_EN_COURS = false;
      btn.disabled = false;
      btn.textContent = libelleBoutonEnregistrer();
      alert('Motif de la correction obligatoire — expliquez brièvement pourquoi ce relevé est corrigé.');
      motifCorrectionEl.focus();
      return;
    }

    const nouveauSnapshot = {
      stock_reel_go_cuve1: valeurChamp('champ_go_cuve1'),
      stock_reel_go_cuve2: valeurChamp('champ_go_cuve2'),
      stock_reel_sp95: valeurChamp('champ_sp95'),
      stock_reel_gnr: valeurChamp('champ_gnr'),
      livraison_go: valeurChamp('champ_go_livraison') || 0,
      livraison_sp95: valeurChamp('champ_sp95_livraison') || 0,
      livraison_gnr: valeurChamp('champ_gnr_livraison') || 0,
      mouvement_go: valeurChamp('champ_go_mouvement') || 0,
      mouvement_sp95: valeurChamp('champ_sp95_mouvement') || 0,
      mouvement_gnr: valeurChamp('champ_gnr_mouvement') || 0,
      motif_mouvement: RELEVE_CIBLE && RELEVE_CIBLE.motif_mouvement ? RELEVE_CIBLE.motif_mouvement : null,
      commentaire: document.getElementById('champCommentaire').value.trim() || null,
    };

    const { versionNum, typeVersion } = NexusCarburantMoteur.prochaineVersionReleveCarburant(RELEVE_CIBLE);
    const diff = NexusCarburantMoteur.diffReleveCarburant(RELEVE_CIBLE, nouveauSnapshot);

    // Plan de tests de l'audit, scénario C09 : "Correction sans changement
    // de valeur → Pas de nouvelle version inutile" — si rien n'a réellement
    // changé, ne pas poser de version ni toucher la vue courante.
    if (RELEVE_CIBLE && !diff) {
      ENREGISTREMENT_EN_COURS = false;
      btn.disabled = false;
      btn.textContent = libelleBoutonEnregistrer();
      alert('Aucune valeur modifiée — rien à enregistrer.');
      return;
    }

    const { error: eVersion } = await nexusClient.from('carburant_releve_versions').insert({
      site: SITE_ID, date: DATE_CIBLE, version_num: versionNum, type_version: typeVersion,
      ...nouveauSnapshot,
      motif_correction: typeVersion === 'correction_manager' ? motifCorrection : null,
      diff_vs_precedent: diff,
      auteur: MANAGER_COURANT.id,
    });
    if (eVersion && eVersion.code !== '23505') {
      // 23505 = conflit d'unicité (site,date,version_num) — double clic ou
      // retry réseau, traité comme un succès bénin, jamais une erreur
      // (même discipline d'idempotence que fdj_releves_cloture).
      console.error('Preuve relevé carburant (carburant_releve_versions):', eVersion);
      ENREGISTREMENT_EN_COURS = false;
      btn.disabled = false;
      btn.textContent = libelleBoutonEnregistrer();
      alert("Erreur d'enregistrement — la preuve de version n'a pas pu être créée, rien n'a été modifié. Réessayez.");
      return;
    }

    const ligne = {
      site: SITE_ID, date: DATE_CIBLE, version_num: versionNum,
      ...nouveauSnapshot,
      saisi_par: MANAGER_COURANT.id,
    };

    const { data, error } = await nexusClient.from('carburant_releves')
      .upsert(ligne, { onConflict: 'site,date' }).select().maybeSingle();

    ENREGISTREMENT_EN_COURS = false;
    btn.disabled = false;
    if (error) {
      console.error('Enregistrement relevé carburant (vue courante):', error);
      btn.textContent = libelleBoutonEnregistrer();
      alert("La preuve de cette version a bien été enregistrée, mais la mise à jour du relevé affiché a échoué — réessayez, l'historique reste intact.");
      return;
    }
    RELEVE_CIBLE = data;
    await enregistrerControlesCarburant(versionNum);
    if (motifCorrectionEl) motifCorrectionEl.value = '';
    btn.textContent = `Mettre à jour le relevé${EST_AUJOURDHUI ? '' : ` du ${formaterDateFr(DATE_CIBLE)}`}`;
    const conf = document.getElementById('confirmation');
    conf.classList.add('visible');
    setTimeout(() => conf.classList.remove('visible'), 3000);
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    MANAGER_COURANT = employee;
    SITE_ID = employee.site_id;

    DATE_CIBLE = dateCibleDepuisURL() || todayISO();
    EST_AUJOURDHUI = DATE_CIBLE === todayISO();

    const eyebrowEl = document.getElementById('eyebrowTitre');
    const titreEl = document.getElementById('titrePrincipal');
    const lienPilotageEl = document.getElementById('lienPilotage');
    if (EST_AUJOURDHUI) {
      eyebrowEl.textContent = 'NEXUS · CARBURANTS';
      titreEl.textContent = 'Relevé du jour';
      document.getElementById('horodateurDiscret').textContent = `Aujourd'hui — ${formaterDateFr(DATE_CIBLE)}`;
    } else {
      eyebrowEl.textContent = 'NEXUS · CARBURANTS · RATTRAPAGE';
      eyebrowEl.style.color = 'var(--amber)';
      titreEl.textContent = 'Rattrapage du jaugeage';
      document.getElementById('horodateurDiscret').textContent = `Jour choisi — ${formaterDateFr(DATE_CIBLE)}`;
      if (lienPilotageEl) lienPilotageEl.textContent = '← Retour à Carburants Pilotage';
    }

    [RELEVE_CIBLE, DERNIER_RELEVE, PROCHAIN_RELEVE, POINT_ZERO] = await Promise.all([
      chargerReleveDuJour(SITE_ID, DATE_CIBLE),
      chargerDernierReleve(SITE_ID, DATE_CIBLE),
      EST_AUJOURDHUI ? Promise.resolve(null) : chargerProchainReleve(SITE_ID, DATE_CIBLE),
      chargerDernierPointZero(SITE_ID, DATE_CIBLE),
    ]);

    // Point zéro (14/08/2026) : historique non fiable si DATE_CIBLE est
    // antérieure ou égale à sa date — la saisie reste possible (correction
    // d'un jour passé) mais aucun théorique n'est calculé sur cette
    // période. Sinon, le point zéro devient l'ancre s'il est plus récent
    // que DERNIER_RELEVE (ou si aucun relevé réel n'existe) — plancher,
    // pas ancre permanente : un relevé réel postérieur au point zéro
    // redevient une ancre normale pour les dates encore plus tardives.
    HISTORIQUE_NON_FIABLE = !!POINT_ZERO && DATE_CIBLE < POINT_ZERO.date;
    ANCRE_EST_POINT_ZERO = !!POINT_ZERO && !HISTORIQUE_NON_FIABLE && (!DERNIER_RELEVE || POINT_ZERO.date >= DERNIER_RELEVE.date);
    DATE_ANCRE = ANCRE_EST_POINT_ZERO ? POINT_ZERO.date : (DERNIER_RELEVE ? DERNIER_RELEVE.date : null);
    REFERENCE_CERTIFIEE_CE_JOUR = ANCRE_EST_POINT_ZERO && DATE_ANCRE === DATE_CIBLE;

    VENTES_DEPUIS = HISTORIQUE_NON_FIABLE
      ? { go: null, sp95: null, gnr: null }
      : (REFERENCE_CERTIFIEE_CE_JOUR
          ? { go: 0, sp95: 0, gnr: 0 }
          : await chargerVentesDepuisDernierReleve(SITE_ID, DATE_ANCRE, DATE_CIBLE));

    render();
  });
</script>
