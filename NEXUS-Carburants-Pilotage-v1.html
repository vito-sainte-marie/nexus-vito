<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  .lien-relever{display:block; margin:0 20px 14px; padding:11px 14px; border-radius:12px; background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.25); color:var(--cyan); text-decoration:none; font-family:var(--mono); font-size:11.5px; font-weight:600; text-align:center;}

  /* Sélecteur de période */
  .periode-bar{display:flex; gap:6px; flex-wrap:wrap; padding:0 20px 14px;}
  .periode-btn{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.02em;
    padding:8px 12px; border-radius:20px; border:1px solid var(--hairline); background:var(--panel);
    color:var(--text-mid); cursor:pointer;
  }
  .periode-btn.actif{color:var(--cyan); border-color:rgba(79,195,217,0.5); background:rgba(79,195,217,0.1);}
  .libre-bar{display:none; gap:8px; padding:0 20px 14px;}
  .libre-bar.visible{display:flex;}
  .libre-bar input{flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:8px 10px; color:var(--text); font-family:var(--mono); font-size:12.5px;}
  .libre-btn{font-family:var(--sans); font-size:12px; font-weight:700; color:#04141a; background:var(--cyan); border:none; border-radius:8px; padding:8px 14px; cursor:pointer;}
  .periode-label{padding:0 20px 6px; font-family:var(--mono); font-size:11px; color:var(--text-dim);}

  .section-titre{font-size:15px; font-weight:700; margin:16px 20px 8px;}
  .section-note{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin:0 20px 10px;}

  .badge{display:inline-block; font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:0.03em; padding:2px 7px; border-radius:20px; text-transform:uppercase; margin-left:6px; vertical-align:middle;}

  .controle-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 20px;}
  .controle-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:12px 10px; text-align:center;}
  .controle-nom{font-size:11.5px; font-weight:700;}
  .controle-ecart{font-family:var(--mono); font-size:13px; font-weight:700; margin-top:6px;}
  .controle-statut{display:inline-block; margin-top:6px; font-family:var(--mono); font-size:8.5px; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase;}
  .controle-vide{padding:16px 20px; text-align:center; color:var(--text-dim); font-size:12px; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; margin:0 20px; line-height:1.5;}

  .kpi-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin:0 20px 12px;}
  .kpi-row{display:flex; align-items:baseline; justify-content:space-between; padding:7px 0;}
  .kpi-row + .kpi-row{border-top:1px solid var(--hairline);}
  .kpi-label{font-size:12.5px; color:var(--text-mid);}
  .kpi-valeur{font-family:var(--mono); font-weight:700; font-size:14px;}
  .kpi-evol{font-family:var(--mono); font-size:11px; margin-left:6px;}
  .kpi-evol.hausse{color:var(--green);}
  .kpi-evol.baisse{color:var(--red);}
  .kpi-evol.stable{color:var(--text-dim);}

  .mix-bar-wrap{margin-bottom:10px;}
  .mix-bar-tete{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
  .mix-bar-piste{height:8px; border-radius:5px; background:var(--panel-raised); overflow:hidden;}
  .mix-bar-remplissage{height:100%; border-radius:5px;}

  .synthese-texte{font-size:13.5px; line-height:1.6; color:var(--text); background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin:0 20px 12px;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}

  /* Vue bureau (cohérente avec les autres écrans manager NEXUS) */
  body.nexus-desktop .phone{max-width:640px; border:none;}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · CARBURANTS · PILOTAGE</div>
    <div class="title">Carburants Pilotage</div>
    <div class="sub" id="sousTitre">Chargement…</div>
  </div>
  <div class="divider"></div>

  <a class="lien-relever" href="NEXUS-Carburants-v1.html">📋 Aller au Relevé du jour (saisie du jaugeage)</a>

  <div class="section-titre" style="margin-top:0;">Contrôle du jour</div>
  <div id="controleZone"><div class="loading">Chargement…</div></div>

  <div class="periode-bar" id="periodeBar"></div>
  <div class="libre-bar" id="libreBar">
    <input type="date" id="libreDebut">
    <input type="date" id="libreFin">
    <button class="libre-btn" id="btnLibreValider">Valider</button>
  </div>
  <div class="periode-label" id="periodeLabel"></div>

  <div class="section" id="content" style="padding-top:0;">
    <div class="loading">Chargement…</div>
  </div>

  <footer>NEXUS Carburants Pilotage v1 (Phase 1) · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS Carburants Pilotage v1 (11/08/2026) — Phase 1 de la montée en
  // puissance de NEXUS Carburants, à la demande de Frédéric (vision
  // détaillée en 6 familles d'intelligence, construites sur le SEUL
  // moteur existant, sans nouvelle saisie manager). Distinct de
  // NEXUS-Carburants-v1.html ("Relevé du jour", écran opérationnel de
  // saisie/contrôle) : cet écran est la couche dirigeant — il ne capture
  // rien, il explique. Relevé collecte les faits, le moteur calcule,
  // Pilotage comprend — même logique que FDJ Pilotage.
  //
  // Contenu de cette Phase 1 (les deux autres familles — autonomie de
  // stock/livraisons et couche économique — sont des phases séparées,
  // choisies et validées par Frédéric le 11/08/2026) :
  //  - Contrôle du jour : reprend le statut par carburant déjà calculé
  //    par nexus-carburant-moteur.js (jamais une deuxième formule) pour
  //    aujourd'hui, en lecture seule.
  //  - Volumes & performance : litres vendus sur la période sélectionnée
  //    (déjà captés par NEXUS Verify, jamais ressaisis) et évolution vs
  //    référence résolue par nexus-periodes.js (même moteur que Rapport
  //    NEXUS — une seule façon de choisir "la bonne période de
  //    comparaison" dans tout NEXUS).
  //  - Mix carburant : répartition des volumes entre GO/SP95/GNR.
  //  - Moteur & progression : le carburant qui pèse le plus dans les
  //    volumes (produit moteur) n'est pas forcément celui qui explique le
  //    mouvement de la période (moteur d'évolution) — les deux sont
  //    distingués, avec une phrase de synthèse qui décompose l'évolution
  //    carburant par carburant (nexus-carburant-moteur.js,
  //    decomposerEvolution/identifierMoteurEvolution).
  //
  // Toute la logique de calcul vit dans nexus-carburant-moteur.js (pur).
  // Ce fichier ne fait que charger (nexus-carburant-donnees.js) et
  // mettre en forme — jamais un calcul recopié localement (Article 11).
  // ------------------------------------------------------------

  let SITE_ID = 'vito-sainte-marie';
  let TYPE_PERIODE = 'semaine';

  const TYPES = [
    { cle: 'semaine', label: 'Semaine' },
    { cle: 'mois', label: 'Mois' },
    { cle: 'trimestre', label: 'Trimestre' },
    { cle: 'annee', label: 'Année' },
    { cle: 'libre', label: 'Dates libres' },
  ];

  const NOM_CARBURANT = { go: 'Gasoil (GO)', sp95: 'Sans plomb (SP95)', gnr: 'Gasoil non routier (GNR)' };
  const COURT_CARBURANT = { go: 'GO', sp95: 'SP95', gnr: 'GNR' };
  const COULEUR_CARBURANT = { go: 'var(--cyan)', sp95: 'var(--gold)', gnr: 'var(--amber)' };
  const COULEUR_STATUT = {
    'Sous contrôle': { c: 'var(--green)', f: 'var(--green-dim)' },
    'À surveiller': { c: 'var(--amber)', f: 'var(--amber-dim)' },
    'À corriger': { c: 'var(--red)', f: 'var(--red-dim)' },
    'Données insuffisantes': { c: 'var(--text-dim)', f: 'var(--panel-raised)' },
  };

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function fmtL(v) { return v == null ? '—' : `${Math.round(v).toLocaleString('fr-FR')} L`; }
  function fmtEvol(evol) {
    if (evol == null) return '<span class="kpi-evol stable">—</span>';
    const cls = evol > 0.02 ? 'hausse' : evol < -0.02 ? 'baisse' : 'stable';
    return `<span class="kpi-evol ${cls}">${evol >= 0 ? '+' : ''}${(evol * 100).toFixed(1)} %</span>`;
  }

  // ------------------------------------------------------------
  // Contrôle du jour — indépendant de la période sélectionnée (toujours
  // "aujourd'hui"), chargé une seule fois à l'initialisation.
  // ------------------------------------------------------------
  async function chargerEtRendreControle() {
    const zone = document.getElementById('controleZone');
    const { parCarburant, aucunReleve, dateDernierReleve } = await NexusCarburantDonnees.chargerControleJour(nexusClient, SITE_ID, todayISO());

    if (aucunReleve) {
      zone.innerHTML = `<div class="controle-vide">Aucun relevé enregistré pour ce site pour l'instant — le contrôle quotidien s'activera dès le premier jaugeage saisi dans le Relevé du jour.</div>`;
      return;
    }

    const cartes = Object.keys(NOM_CARBURANT).map(cle => {
      const r = parCarburant[cle];
      const couleur = COULEUR_STATUT[r.statut] || COULEUR_STATUT['Données insuffisantes'];
      const ecartTxt = r.ecart != null ? `${r.ecart >= 0 ? '+' : ''}${Math.round(r.ecart).toLocaleString('fr-FR')} L` : '—';
      return `
        <div class="controle-card">
          <div class="controle-nom">${COURT_CARBURANT[cle]}</div>
          <div class="controle-ecart" style="color:${r.ecart != null && r.ecart < 0 ? 'var(--red)' : (r.ecart != null && r.ecart > 0 ? 'var(--green)' : 'var(--text)')};">${ecartTxt}</div>
          <span class="controle-statut" style="color:${couleur.c}; background:${couleur.f};">${r.statut}</span>
        </div>`;
    }).join('');

    zone.innerHTML = `
      <div class="controle-grid">${cartes}</div>
      ${dateDernierReleve ? `<div class="section-note">Écart calculé depuis le dernier relevé du ${dateDernierReleve.split('-').reverse().join('/')}.</div>` : ''}
    `;
  }

  // ------------------------------------------------------------
  // Volumes / mix / moteur — dépendent de la période sélectionnée.
  // ------------------------------------------------------------
  function renderBarrePeriodes() {
    const bar = document.getElementById('periodeBar');
    bar.innerHTML = TYPES.map(t => `<button class="periode-btn ${t.cle === TYPE_PERIODE ? 'actif' : ''}" data-type="${t.cle}">${t.label}</button>`).join('');
    bar.querySelectorAll('.periode-btn').forEach(btn => btn.addEventListener('click', () => {
      TYPE_PERIODE = btn.dataset.type;
      renderBarrePeriodes();
      const libreBar = document.getElementById('libreBar');
      if (TYPE_PERIODE === 'libre') { libreBar.classList.add('visible'); return; }
      libreBar.classList.remove('visible');
      chargerEtRendrePeriode();
    }));
    document.getElementById('libreBar').classList.toggle('visible', TYPE_PERIODE === 'libre');
  }

  // Essaie chaque période de référence candidate dans l'ordre (résolues
  // par NexusPeriodes.resoudrePeriodesReference) et s'arrête à la première
  // qui a au moins un quart avec litrage — jamais une moyenne bricolée
  // entre plusieurs références, jamais une référence choisie au hasard.
  async function chargerVentesReferenceAvecRepli(candidates) {
    for (const c of candidates) {
      const resultat = await NexusCarburantDonnees.chargerVentesPeriode(nexusClient, SITE_ID, c.debut, c.fin);
      if (resultat.nbQuartsAvecLitrage > 0) return { ...resultat, periodeUtilisee: c };
    }
    return { ventes: { go: null, sp95: null, gnr: null }, nbQuartsTotal: 0, nbQuartsAvecLitrage: 0, periodeUtilisee: null };
  }

  function construireSyntheseEvolution(mix, decomposition, moteurEvolution, deltaTotal) {
    if (!mix || deltaTotal == null) return "Pas encore assez de données pour comparer cette période à une référence.";
    if (Math.abs(deltaTotal) < 1) return "Les volumes de la période sont stables par rapport à la référence.";
    const sens = deltaTotal > 0 ? 'hausse' : 'baisse';
    if (!moteurEvolution) return `Les volumes de la période sont en ${sens} (${deltaTotal >= 0 ? '+' : ''}${Math.round(deltaTotal).toLocaleString('fr-FR')} L), sans carburant identifié comme principal moteur de ce mouvement.`;
    let phrase = `La ${sens} de la période provient principalement du ${NOM_CARBURANT[moteurEvolution.cle]}.`;
    const compensateurs = Object.keys(NOM_CARBURANT).filter(c => c !== moteurEvolution.cle && decomposition.parCarburant[c] && decomposition.parCarburant[c].delta !== 0 && Math.sign(decomposition.parCarburant[c].delta) !== Math.sign(deltaTotal));
    if (compensateurs.length === 1) {
      phrase += ` Le ${NOM_CARBURANT[compensateurs[0]]} compense partiellement le mouvement.`;
    } else if (compensateurs.length > 1) {
      phrase += ` ${compensateurs.map(c => NOM_CARBURANT[c]).join(' et ')} compensent partiellement le mouvement.`;
    }
    return phrase;
  }

  async function chargerEtRendrePeriode(bornesLibres) {
    document.getElementById('content').innerHTML = '<div class="loading">Calcul en cours…</div>';

    const periode = NexusPeriodes.resoudrePeriodeCalendaire(TYPE_PERIODE, todayISO(), bornesLibres);
    const enCours = periode.fin > todayISO();
    document.getElementById('periodeLabel').textContent = `Période : ${periode.label} (${periode.debut} → ${periode.fin})${enCours ? ' — en cours' : ''}`;
    const referencesCandidates = NexusPeriodes.resoudrePeriodesReference(periode);

    const [actuel, reference] = await Promise.all([
      NexusCarburantDonnees.chargerVentesPeriode(nexusClient, SITE_ID, periode.debut, periode.fin),
      chargerVentesReferenceAvecRepli(referencesCandidates),
    ]);

    const M = NexusCarburantMoteur;
    const mix = M.calculerMixCarburant(actuel.ventes);
    const produitMoteur = M.identifierProduitMoteur(actuel.ventes);
    const decomposition = M.decomposerEvolution(actuel.ventes, reference.ventes);
    const moteurEvolution = M.identifierMoteurEvolution(decomposition);
    const mixRef = M.calculerMixCarburant(reference.ventes);
    const evolutionTotale = mix && mixRef ? M.calculerEvolutionVolume(mix.total, mixRef.total) : null;

    document.getElementById('sousTitre').textContent = 'Volumes, mix et moteurs de performance sur la période sélectionnée.';

    // Couverture honnête (Article 5) : combien de quarts de la période ont
    // réellement un litrage renseigné, jamais présenté comme 100 % par défaut.
    const couvertureTxt = actuel.nbQuartsTotal > 0
      ? `Couverture : ${actuel.nbQuartsAvecLitrage}/${actuel.nbQuartsTotal} quart${actuel.nbQuartsTotal > 1 ? 's' : ''} avec litrage renseigné sur la période.`
      : "Aucun quart enregistré sur cette période.";
    // Honnêteté sur une période en cours (Article 5) : comparer un
    // "mois" entamé à 3 jours contre un mois de référence complet
    // fabriquerait une évolution trompeuse — jamais masquée, mais
    // signalée explicitement plutôt que présentée comme un chiffre stable.
    const caveatEnCours = enCours ? ' Cette période n\'est pas terminée — la comparaison ci-dessous porte donc sur une période partielle face à une référence complète.' : '';

    // --- Volumes & performance ---
    let volumesHTML;
    if (!mix) {
      volumesHTML = `<div class="controle-vide">Données insuffisantes pour cette période — aucun litrage renseigné dans NEXUS Verify.</div>`;
    } else {
      const lignes = Object.keys(NOM_CARBURANT).map(cle => {
        const v = mix[cle];
        const refV = reference.ventes ? reference.ventes[cle] : null;
        const evol = v != null ? M.calculerEvolutionVolume(v.litres, refV) : null;
        return `<div class="kpi-row"><span class="kpi-label">${NOM_CARBURANT[cle]}</span><span><span class="kpi-valeur">${v != null ? fmtL(v.litres) : '—'}</span>${fmtEvol(evol)}</span></div>`;
      }).join('');
      volumesHTML = `
        <div class="kpi-card">
          <div class="kpi-row"><span class="kpi-label"><b>Total station</b></span><span><span class="kpi-valeur">${fmtL(mix.total)}</span>${fmtEvol(evolutionTotale)}</span></div>
          ${lignes}
        </div>
        <div class="section-note">${couvertureTxt}${reference.periodeUtilisee ? ` Comparé à : ${reference.periodeUtilisee.label}.` : ' Aucune période de référence avec des données disponibles.'}${caveatEnCours}</div>
      `;
    }

    // --- Mix carburant ---
    let mixHTML = '';
    if (mix) {
      mixHTML = `<div class="kpi-card">` + Object.keys(NOM_CARBURANT).map(cle => {
        const v = mix[cle];
        const pct = v ? Math.round(v.pct * 100) : 0;
        return `
          <div class="mix-bar-wrap">
            <div class="mix-bar-tete"><span>${COURT_CARBURANT[cle]}</span><span style="font-family:var(--mono);">${v != null ? pct + ' %' : '—'}</span></div>
            <div class="mix-bar-piste"><div class="mix-bar-remplissage" style="width:${pct}%; background:${COULEUR_CARBURANT[cle]};"></div></div>
          </div>`;
      }).join('') + `</div>`;
    }

    // --- Moteur & progression ---
    let moteurHTML = '';
    if (mix) {
      const syntheseTexte = construireSyntheseEvolution(mix, decomposition, moteurEvolution, decomposition ? decomposition.deltaTotal : null);
      moteurHTML = `
        <div class="synthese-texte">${syntheseTexte}</div>
        <div class="kpi-card">
          <div class="kpi-row"><span class="kpi-label">Produit moteur (plus gros volume)</span><span class="kpi-valeur">${produitMoteur ? `${NOM_CARBURANT[produitMoteur.cle]} — ${Math.round(produitMoteur.pct * 100)} %` : '—'}</span></div>
          <div class="kpi-row"><span class="kpi-label">Moteur de progression (explique le plus le mouvement)</span><span class="kpi-valeur">${moteurEvolution ? NOM_CARBURANT[moteurEvolution.cle] : '—'}</span></div>
        </div>
      `;
    }

    document.getElementById('content').innerHTML = `
      <div class="section-titre" style="margin-top:0;">Volumes & performance</div>
      ${volumesHTML}

      ${mix ? `<div class="section-titre">Mix carburant</div>${mixHTML}` : ''}

      ${mix ? `<div class="section-titre">Moteur & progression</div>${moteurHTML}` : ''}
    `;
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    SITE_ID = employee.site_id || 'vito-sainte-marie';

    renderBarrePeriodes();
    document.getElementById('btnLibreValider').addEventListener('click', () => {
      const debut = document.getElementById('libreDebut').value;
      const fin = document.getElementById('libreFin').value;
      if (!debut || !fin || fin < debut) { alert('Choisissez une date de début et une date de fin valides.'); return; }
      chargerEtRendrePeriode({ debut, fin });
    });

    await Promise.all([chargerEtRendreControle(), chargerEtRendrePeriode()]);
  });
</script>
</body>
</html>
