<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-theme.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --cyan:#4FC3D9; --red:#F0575A; --red-dim:#3A1D1F;
    --on-cyan:#04141a; --cyan-rgb:79,195,217;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text); min-height:100vh;}
  body{display:flex; flex-direction:column; justify-content:center; align-items:center;}
  .card{width:100%; max-width:380px; padding:20px;}
  .mark{display:block; text-align:center; font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:0.16em; color:var(--cyan); margin-bottom:8px;}
  .title{text-align:center; font-size:22px; font-weight:600; margin-bottom:28px;}

  .field{margin-bottom:16px;}
  .field label{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:6px;}
  .field input{
    width:100%; background:var(--panel); border:1px solid var(--hairline); border-radius:10px;
    padding:14px; color:var(--text); font-family:var(--sans); font-size:15px;
  }
  .field input:focus{outline:none; border-color:var(--cyan);}
  #pin{font-family:var(--mono); letter-spacing:8px; font-size:20px; text-align:center;}

  .btn{
    width:100%; background:var(--cyan); color:var(--on-cyan); border:none; border-radius:10px;
    padding:14px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px;
  }
  .btn:disabled{opacity:0.5; cursor:default;}
  .error{
    display:none; background:var(--red-dim); color:var(--red); border-radius:8px; padding:10px 14px;
    font-size:12.5px; margin-top:14px; text-align:center;
  }
  [hidden]{display:none !important;}
  .intro{font-size:13px; color:var(--text-mid); text-align:center; line-height:1.5; margin:-14px 0 20px;}
  .voir{background:none; border:none; color:var(--cyan); font-size:12.5px; cursor:pointer; padding:4px 0; margin-top:-8px; margin-bottom:8px;}
  #nouveau,#confirmation{font-family:var(--mono); letter-spacing:8px; font-size:20px; text-align:center;}
  .note{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; margin-top:24px; line-height:1.6;}

  .logo-footer{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin-top:36px; padding-top:24px; border-top:1px solid var(--hairline);
  }
  .logo-footer img{width:56px; height:56px; opacity:0.92;}
  .logo-footer .logo-caption{font-family:var(--sans); font-size:12px; color:var(--text-dim); line-height:1.5; text-align:center; max-width:280px;}
  .hero-avatar{
    display:block; margin:0 auto 12px; max-width:200px; width:60%; height:auto;
    filter: drop-shadow(0 0 18px rgba(var(--cyan-rgb),0.45)) drop-shadow(0 0 40px rgba(var(--cyan-rgb),0.22));
  }
  /* Écran de changement de code : identité compacte (sous-page), pour que le bouton reste au-dessus du pli à 375 x 812. */
  body.changement .hero-avatar{width:56px; max-width:56px; margin-bottom:6px;}
  body.changement .title{font-size:20px; margin-bottom:16px;}
  body.changement .intro{margin:-6px 0 14px;}
  body.changement .logo-footer{display:none;}
  body.changement .note{margin-top:14px;}
</style>
</head>
<body>
<div class="card">

  <img class="hero-avatar" src="assets/nexus-avatar.png" alt="NEXUS">

  <span class="mark">NEXUS</span>
  <div class="title" id="titreEcran">Connexion</div>

  <div id="ecranConnexion">
  <div class="field">
    <label for="prenom">Prénom</label>
    <input type="text" id="prenom" placeholder="Thomas" autocomplete="off">
  </div>

  <div class="field">
    <label for="pin">Code PIN</label>
    <input type="password" id="pin" maxlength="6" inputmode="numeric" placeholder="••••">
  </div>

  <button class="btn" id="connexion">Se connecter</button>
  </div>

  <div id="ecranChangement" hidden>
    <p class="intro">Votre code est temporaire. Choisissez un nouveau code de 6 chiffres que vous seul connaissez.</p>
    <div class="field">
      <label for="nouveau">Nouveau code</label>
      <input type="password" id="nouveau" maxlength="6" inputmode="numeric" autocomplete="new-password" placeholder="••••••">
    </div>
    <div class="field">
      <label for="confirmation">Confirmer le code</label>
      <input type="password" id="confirmation" maxlength="6" inputmode="numeric" autocomplete="new-password" placeholder="••••••">
    </div>
    <button type="button" class="voir" id="voirCodes" aria-pressed="false">Afficher</button>
    <button class="btn" id="changer">Enregistrer le nouveau code</button>
  </div>

  <div class="error" id="errorConnexion"></div>

  <div class="logo-footer">
    <img src="assets/nexus-logo-cyan.png" alt="NEXUS">
    <div class="logo-caption" id="logoCaption">Votre commerce vous parle en permanence. NEXUS vous aide à le comprendre, à décider et à progresser chaque jour.</div>
  </div>

  <div class="note">Connexion sécurisée</div>
</div>

<script>
  // L'écran de connexion partage la configuration commune (04/09/2026). Il
  // redéclarait auparavant sa propre URL et sa propre clé : rien n'empêchait
  // alors la page de connexion de viser un projet Supabase différent du
  // reste de l'application — une recette authentifiée sur la production, par
  // exemple. Il n'existe plus qu'une seule source.
  if (!window.NEXUS_CONFIG || !window.NEXUS_CONFIG.supabaseUrl || !window.NEXUS_CONFIG.supabaseCle) {
    document.body.innerHTML = '<div style="max-width:640px;margin:14vh auto;padding:22px;'
      + 'font:14px/1.6 system-ui,sans-serif;color:#EDF1F5;background:#141B22;'
      + 'border:1px solid #F0546B;border-radius:12px">'
      + '<strong style="color:#F0546B">Configuration absente</strong><br><br>'
      + 'NEXUS ne peut pas démarrer : nexus-config.js n’a pas été chargé ou est incomplet. '
      + 'Ce fichier est produit au moment du build ; sans lui, l’application ignore à quelle '
      + 'base elle doit parler et refuse de deviner.</div>';
    throw new Error('nexus-config.js absent ou incomplet');
  }
  const SUPABASE_URL = window.NEXUS_CONFIG.supabaseUrl;
  const SUPABASE_ANON_KEY = window.NEXUS_CONFIG.supabaseCle;
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Si déjà connecté, on saute directement l'écran de login
  client.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = "NEXUS-App-v1.html";
  });

  // Connexion par la fonction `connexion` (étape 3, lot Connexion sécurité).
  // Le navigateur n'appelle plus ni la recherche d'identifiant ni Auth : la
  // fonction répond 401 neutre à tout refus, 503 ou 5xx si elle est
  // indisponible, et rend une session seulement quand le compte est prêt.
  const ENDPOINT = SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/connexion";
  const REFUS = "Prénom ou code PIN incorrect.";
  const INDISPONIBLE = "Connexion indisponible pour le moment. Réessayez dans un instant.";
  const RESEAU = "Connexion au serveur impossible. Vérifiez votre connexion et réessayez.";

  const prenomInput = document.getElementById("prenom");
  const pinInput = document.getElementById("pin");
  const btn = document.getElementById("connexion");
  const errBox = document.getElementById("errorConnexion");
  const ecranConnexion = document.getElementById("ecranConnexion");
  const ecranChangement = document.getElementById("ecranChangement");
  const nouveauInput = document.getElementById("nouveau");
  const confirmInput = document.getElementById("confirmation");
  const btnChanger = document.getElementById("changer");
  const btnVoir = document.getElementById("voirCodes");

  // Le code temporaire et le prénom restent en mémoire de page seulement.
  let codeTemporaire = null;
  let prenomEnCours = null;

  function afficherErreur(msg) { errBox.textContent = msg; errBox.style.display = "block"; }
  function masquerErreur() { errBox.style.display = "none"; }
  function repos() {
    btn.disabled = false; btn.textContent = "Se connecter";
    btnChanger.disabled = false; btnChanger.textContent = "Enregistrer le nouveau code";
  }

  // Un code est faible s'il compte six chiffres identiques ou forme une suite
  // croissante ou décroissante. Même règle que la fonction côté serveur.
  function codeFaible(n) {
    if (!/^\d{6}$/.test(n)) return true;
    if (/^(\d)\1{5}$/.test(n)) return true;
    let crois = true, decrois = true;
    for (let i = 1; i < 6; i++) {
      const d = Number(n[i]) - Number(n[i - 1]);
      if (d !== 1) crois = false;
      if (d !== -1) decrois = false;
    }
    return crois || decrois;
  }

  // POST vers la fonction. Un 5xx (dont 546) déclenche UNE seule reprise
  // après 1 à 3 s tirées au hasard ; aucune autre boucle.
  async function appeler(corps) {
    async function une() {
      const r = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(corps)
      });
      let json = null;
      try { json = await r.json(); } catch (e) { /* corps absent */ }
      return { status: r.status, json };
    }
    let rep = await une();
    if (rep.status >= 500) {
      await new Promise(ok => setTimeout(ok, 1000 + Math.random() * 2000));
      rep = await une();
    }
    return rep;
  }

  async function poserSession(session) {
    const { error } = await client.auth.setSession({
      access_token: session.access_token,
      refresh_token: session.refresh_token
    });
    if (error) throw error;
    window.location.href = "NEXUS-App-v1.html";
  }

  async function tryLogin() {
    const prenom = prenomInput.value.trim();
    const pin = pinInput.value.trim();
    masquerErreur();
    if (!prenom || !pin) { afficherErreur("Entrez votre prénom et votre code PIN."); return; }

    btn.disabled = true; btn.textContent = "Connexion...";
    let rep;
    try { rep = await appeler({ prenom, code: pin }); }
    catch (e) { afficherErreur(RESEAU); repos(); return; }

    if (rep.status === 200 && rep.json && rep.json.ok) {
      if (rep.json.changer_code) {
        prenomEnCours = prenom; codeTemporaire = pin;
        pinInput.value = "";
        ecranConnexion.hidden = true; ecranChangement.hidden = false;
        document.body.classList.add("changement");
        document.getElementById("titreEcran").textContent = "Choisissez votre code";
        nouveauInput.focus();
        repos();
        return;
      }
      if (rep.json.session) {
        try { await poserSession(rep.json.session); return; }
        catch (e) { afficherErreur(RESEAU); repos(); return; }
      }
    }
    if (rep.status >= 500) afficherErreur(INDISPONIBLE);
    else { afficherErreur(REFUS); pinInput.value = ""; }
    repos();
  }

  async function changerCode() {
    masquerErreur();
    const nouveau = nouveauInput.value.trim();
    if (!/^\d{6}$/.test(nouveau)) { afficherErreur("Le code doit compter exactement 6 chiffres."); return; }
    if (nouveau !== confirmInput.value.trim()) { afficherErreur("Les deux codes ne sont pas identiques."); return; }
    if (nouveau === codeTemporaire) { afficherErreur("Choisissez un code différent du code temporaire."); return; }
    if (codeFaible(nouveau)) { afficherErreur("Ce code est trop simple. Évitez les chiffres identiques et les suites."); return; }

    btnChanger.disabled = true; btnChanger.textContent = "Enregistrement...";
    let rep;
    try {
      rep = await appeler({ action: "changer_code", prenom: prenomEnCours, code_actuel: codeTemporaire, nouveau_code: nouveau });
    } catch (e) { afficherErreur(RESEAU); repos(); return; }

    if (rep.status === 200 && rep.json && rep.json.ok && rep.json.session) {
      codeTemporaire = null;
      try { await poserSession(rep.json.session); return; }
      catch (e) { afficherErreur(RESEAU); repos(); return; }
    }
    if (rep.status >= 500) afficherErreur(INDISPONIBLE);
    else afficherErreur("Le code n'a pas pu être changé. Reprenez depuis l'écran de connexion ou demandez un nouveau code temporaire à votre manager.");
    repos();
  }

  btnVoir.addEventListener("click", () => {
    const visible = nouveauInput.type === "password";
    nouveauInput.type = confirmInput.type = visible ? "text" : "password";
    btnVoir.textContent = visible ? "Masquer" : "Afficher";
    btnVoir.setAttribute("aria-pressed", visible ? "true" : "false");
  });
  btn.addEventListener("click", tryLogin);
  btnChanger.addEventListener("click", changerCode);
  pinInput.addEventListener("keypress", (e) => { if (e.key === "Enter") tryLogin(); });
  confirmInput.addEventListener("keypress", (e) => { if (e.key === "Enter") changerCode(); });
</script>
</body>
</html>
