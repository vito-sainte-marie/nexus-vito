<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Inventaire · Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-desktop.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .heure-live{font-family:var(--mono); font-size:26px; font-weight:600; margin-top:10px; color:var(--text);}
  .date-live{font-size:12px; color:var(--text-mid); margin-top:2px; text-transform:capitalize;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
  .empty{text-align:center; padding:20px; color:var(--text-dim); font-size:12.5px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; margin-bottom:10px;}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-family:var(--sans);}
  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:4px 14px;}

  .section-titre{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-mid); margin:22px 0 10px;}
  .section-titre-action-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:22px 0 10px;}
  .section-titre-action-row .section-titre{margin:0;}
  /* Tout valider (02/08/2026, demande de Frédéric) : valide en une fois
     toutes les alertes ouvertes du quart affiché, avec le même circuit que
     "Valider" alerte par alerte (décision + trace d'audit) — jamais une
     suppression silencieuse groupée. */
  .btn-tout-valider{font-family:var(--sans); font-size:11px; font-weight:600; padding:6px 12px; border-radius:20px; border:1px solid rgba(52,211,153,0.4); background:rgba(52,211,153,0.08); color:var(--green); cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .btn-tout-valider:active{background:rgba(52,211,153,0.18);}
  .btn-tout-valider:disabled{opacity:0.4; pointer-events:none;}
  .section-titre:first-of-type{margin-top:0;}

  /* Sélecteur date / quart */
  .quart-select-row{display:flex; gap:8px; margin-bottom:6px; align-items:center;}
  .date-input{
    font-family:var(--mono); font-size:12.5px; background:var(--panel); border:1px solid var(--hairline);
    color:var(--text); border-radius:8px; padding:8px 10px; flex:1;
  }
  .quart-pill{
    font-family:var(--mono); font-size:11.5px; font-weight:600; padding:8px 14px; border-radius:20px;
    border:1px solid var(--hairline); background:var(--panel); color:var(--text-mid); cursor:pointer; white-space:nowrap;
  }
  .quart-pill.active{background:rgba(79,195,217,0.15); border-color:rgba(79,195,217,0.4); color:var(--cyan);}
  .quart-statut{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-bottom:16px;}

  /* Comparaison ventes Decenium (02/08/2026, demande de Frédéric) : compare
     l'écoulement physique constaté (ouverture − clôture + mouvements) à ce
     que Decenium dit avoir vendu, pour le quart actuellement sélectionné
     ci-dessus — jamais un chiffre inventé, toujours la ligne brute du
     fichier conservée même si le produit n'a pas pu être identifié. */
  .ventes-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:16px; margin-bottom:18px;}
  .ventes-desc{font-size:12px; color:var(--text-mid); line-height:1.5; margin-bottom:12px;}
  .ventes-file-row{display:flex; align-items:center; gap:10px;}
  .ventes-file-label{
    flex:1; display:flex; align-items:center; gap:10px; font-family:var(--sans); font-size:12.5px; color:var(--text-mid);
    background:var(--panel-raised); border:1px dashed var(--hairline); border-radius:8px;
    padding:9px 12px; cursor:pointer; overflow:hidden; transition:border-color .15s, background .15s;
  }
  .ventes-file-label:active{background:rgba(79,195,217,0.06);}
  .ventes-file-label.choisi{color:var(--text); border-style:solid; border-color:rgba(79,195,217,0.35);}
  /* Icône Excel premium (02/08/2026, demande de Frédéric) : SVG vectoriel
     inline plutôt qu'un fichier image — reste net à toute résolution, se
     colore selon la charte Excel officielle (vert dégradé) et n'ajoute
     aucune requête réseau supplémentaire. */
  .ventes-file-icon{width:24px; height:24px; flex-shrink:0;}
  .ventes-file-text{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left;}
  .btn-comparer{
    font-family:var(--sans); font-size:11.5px; font-weight:700; padding:10px 12px; border-radius:8px;
    border:none; background:var(--cyan); color:#04141a; cursor:pointer; flex-shrink:0; max-width:120px; line-height:1.3;
  }
  .btn-comparer:disabled{opacity:0.35; cursor:not-allowed;}
  .ventes-resume{margin-top:12px; padding:12px; background:var(--panel-raised); border-radius:8px; font-size:12px; color:var(--text-mid); line-height:1.6;}
  .ventes-resume b{color:var(--text);}
  .ventes-resume .amber{color:var(--amber); font-weight:700;}

  /* Statistiques mini */
  /* Section repliable (02/08/2026, demande de Frédéric — replier le mode
     aveugle par défaut, pour ne pas surcharger l'écran d'une longue liste
     d'employés dès l'arrivée sur la page). */
  .section-titre.section-repliable{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .repli-compte{font-family:var(--mono); font-size:10px; color:var(--cyan); margin-left:auto;}
  .repli-chevron{display:inline-block; color:var(--text-dim); transition:transform .15s; font-size:11px;}
  .repli-chevron.open{transform:rotate(90deg);}

  .stats-row{display:flex; gap:10px; margin-bottom:18px;}
  .stat-mini{flex:1; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:10px 8px; text-align:center;}
  .stat-mini-value{font-family:var(--mono); font-size:20px; font-weight:700;}
  .stat-mini-value.amber{color:var(--amber);}
  .stat-mini-label{font-size:9.5px; color:var(--text-mid); margin-top:3px; line-height:1.3;}

  /* État du quart (02/08/2026, demande de Frédéric) : message contextualisé
     selon l'heure réelle par rapport à l'heure normale de clôture — distingue
     "pas encore commencé" (normal, tôt dans le quart) de "en retard" (une
     vraie alerte), plutôt qu'un chiffre brut qui pourrait alarmer inutilement
     un manager en tout début de quart. Jamais d'heure limite inventée : la
     référence vient de station_config.horaires (fin_normal), réellement
     configurée dans Paramètres Station. */
  .etat-quart-card{border-radius:12px; padding:12px 16px; margin-bottom:14px; font-size:12.5px; line-height:1.5; border:1px solid var(--hairline); background:var(--panel);}
  .etat-quart-titre{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-mid); margin-bottom:4px;}
  .etat-quart-card.proche{border-color:rgba(245,166,35,0.35); background:var(--amber-dim);}
  .etat-quart-card.proche .etat-quart-texte{color:var(--amber);}
  .etat-quart-card.retard{border-color:rgba(240,87,90,0.4); background:var(--red-dim);}
  .etat-quart-card.retard .etat-quart-texte{color:var(--red); font-weight:600;}

  /* Synthèse du quart (02/08/2026, demande de Frédéric — remplace l'ancien
     stats-row à 3 cases) : vue d'ensemble chiffrée, jamais un chiffre
     inventé — tout vient de inventaire_comptages / inventaire_alertes /
     inventaire_zone_produit réellement chargés pour ce quart. */
  .synthese-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px 16px; margin-bottom:18px;}
  .synthese-titre{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-mid); margin-bottom:10px;}
  .synthese-ligne{display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .synthese-ligne:last-child{border-bottom:none;}
  .synthese-valeur{font-family:var(--mono); font-weight:700; color:var(--text);}
  .synthese-valeur.amber{color:var(--amber);}
  .synthese-valeur.green{color:var(--green);}
  .synthese-cloture{margin-top:12px; padding:9px 10px; border-radius:8px; font-size:11.5px; font-family:var(--mono); text-align:center;}
  .synthese-cloture.impossible{background:var(--amber-dim); color:var(--amber);}
  .synthese-cloture.possible{background:var(--green-dim); color:var(--green);}
  /* Bannière neutre (02/08/2026, demande de Frédéric) : tôt dans le quart,
     des comptages manquants sont normaux — pas une alerte. Même logique
     d'urgence (normal/proche/retard) que la carte État du quart, pour
     éviter que les deux bandeaux se contredisent. */
  .synthese-cloture.attente{background:var(--panel-raised); color:var(--text-mid);}
  .synthese-cloture.retard{background:var(--red-dim); color:var(--red); font-weight:600;}
  /* Barre de progression visuelle (02/08/2026, demande de Frédéric) : "0%
     du comptage terminé" en un coup d'œil, même principe que la barre côté
     employé (NEXUS-Inventaire-v1.html). */
  .synthese-pct-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .synthese-pct{font-family:var(--mono); font-size:18px; font-weight:700; color:var(--text);}
  .synthese-pct-label{font-size:11px; color:var(--text-mid);}
  .synthese-barre{height:6px; border-radius:4px; background:var(--panel-raised); overflow:hidden; margin-bottom:14px;}
  .synthese-remplie{height:100%; background:var(--cyan); transition:width .2s;}

  /* À terminer — catégories avec comptages manquants, regroupées (plus
     lisible qu'une longue liste produit par produit) et cliquables
     (02/08/2026, demande de Frédéric) : chaque ligne s'ouvre pour montrer la
     zone concernée, le statut et les produits manquants, sans jamais
     inventer un "responsable" — seule la zone réelle (Boutique/Piste) des
     produits de la catégorie est affichée. */
  .categorie-manquante{padding:10px 0; border-bottom:1px solid var(--hairline); font-size:13px; cursor:pointer;}
  .categorie-manquante:last-child{border-bottom:none;}
  .categorie-manquante-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .categorie-manquante-valeur{font-family:var(--mono); font-weight:700; color:var(--amber);}
  .categorie-manquante-chevron{display:inline-block; color:var(--text-dim); font-size:11px; margin-left:8px; transition:transform .15s;}
  .categorie-manquante-chevron.open{transform:rotate(90deg);}
  .categorie-manquante-detail{margin-top:8px; font-size:11.5px; color:var(--text-mid); line-height:1.7;}
  .categorie-manquante-detail b{color:var(--text);}
  .categorie-manquante-liste{margin-top:4px; color:var(--text-dim);}

  /* Conseiller NEXUS — bouton d'action visible (02/08/2026, demande de
     Frédéric : "le bouton doit être clairement présenté comme une action"),
     pas un simple lien inline, même si l'action derrière (envoi de rappel,
     assignation) n'existe pas encore. */
  .btn-conseiller-action{margin-top:8px; display:inline-flex; align-items:center; gap:6px; font-family:var(--sans); font-size:11.5px; font-weight:700; padding:8px 14px; border-radius:20px; border:1px solid rgba(79,195,217,0.4); background:rgba(79,195,217,0.12); color:var(--cyan); cursor:pointer;}
  .btn-conseiller-action:active{background:rgba(79,195,217,0.22);}

  /* Décisions prises — validations groupées par date/quart pour éviter une
     liste répétitive de "Valider — Écart validé — aucune action", tout en
     laissant les décisions importantes (recomptage, correction, démarque à
     surveiller) individuellement visibles via renderHistoriqueItem. */
  .decision-groupe{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .decision-groupe-top{display:flex; justify-content:space-between; gap:10px; font-size:12.5px;}
  .decision-groupe-date{font-family:var(--mono); font-size:10px; color:var(--text-dim); white-space:nowrap;}
  .decision-groupe-desc{margin-top:4px; color:var(--text-mid);}
  .decision-groupe-liste{margin-top:8px; font-size:11.5px; color:var(--text-mid); line-height:1.6;}
  .btn-inline-lien{margin-top:8px; font-family:var(--sans); font-size:11px; font-weight:600; color:var(--cyan); background:none; border:none; cursor:pointer; padding:0; display:inline-block;}

  /* Conseiller NEXUS — même habillage que NEXUS-Verify-v1.html (01/08/2026)
     pour rester cohérent visuellement dans toute l'app. Remarques calculées
     uniquement à partir de données réelles (alertes, comptages, historique) —
     jamais un chiffre inventé (Article 5 de la Constitution NEXUS). */
  .conseiller-card{margin-bottom:18px; background:linear-gradient(135deg, rgba(79,195,217,0.08), rgba(79,195,217,0.02)); border:1px solid rgba(79,195,217,0.25); border-radius:12px; padding:16px;}
  .conseiller-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .conseiller-avatar{width:38px; height:38px; border-radius:50%; object-fit:cover; flex-shrink:0; background:var(--panel-raised); filter:drop-shadow(0 0 8px rgba(79,195,217,0.45));}
  .conseiller-name{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--cyan); letter-spacing:0.03em;}
  .conseiller-sub{font-family:var(--mono); font-size:9px; color:var(--text-dim);}
  .conseiller-remarque{font-size:12.5px; line-height:1.6; color:var(--text); margin-bottom:8px;}
  .conseiller-remarque:last-child{margin-bottom:0;}
  .conseiller-remarque b{color:var(--cyan);}

  /* Alertes */
  .alerte-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px; margin-bottom:10px;}
  .alerte-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .alerte-produit{font-size:14px; font-weight:600;}
  .alerte-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:2px;}
  .badge-gravite{font-family:var(--mono); font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:10px; text-transform:uppercase; white-space:nowrap;}
  .badge-gravite.critique{background:var(--red-dim); color:var(--red);}
  .badge-gravite.attention{background:var(--amber-dim); color:var(--amber);}
  .alerte-valeurs{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--mono); font-size:12px; color:var(--text-mid); margin:8px 0;}
  .alerte-valeurs b{color:var(--text);}
  .alerte-note{font-size:11.5px; color:var(--text-mid); font-style:italic; margin:6px 0; line-height:1.5;}
  .alerte-commentaire-input{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px;
    padding:8px 10px; color:var(--text); font-size:12px; margin:8px 0; font-family:var(--sans);
  }
  .decision-row{display:flex; flex-wrap:wrap; gap:6px;}
  .btn-decision{
    font-family:var(--sans); font-size:11px; font-weight:600; padding:7px 10px; border-radius:8px;
    border:1px solid var(--hairline); background:var(--panel-raised); color:var(--text); cursor:pointer;
  }
  .btn-decision:active{transform:scale(0.97);}
  .btn-decision:disabled{opacity:0.4; pointer-events:none;}
  .btn-decision.valider{border-color:rgba(52,211,153,0.4); color:var(--green);}
  .btn-decision.recomptage{border-color:rgba(79,195,217,0.4); color:var(--cyan);}
  .btn-decision.demarque{border-color:rgba(240,87,90,0.4); color:var(--red);}

  /* Produits sensibles non comptés */
  .sensible-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .sensible-item:last-child{border-bottom:none;}
  .sensible-tags{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .tag-manquant{font-family:var(--mono); font-size:9.5px; color:var(--amber); background:var(--amber-dim); padding:3px 7px; border-radius:6px; white-space:nowrap;}

  /* Mode aveugle par employé */
  .employe-toggle-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--hairline);}
  .employe-toggle-row:last-child{border-bottom:none;}
  .employe-role{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:capitalize; margin-top:2px;}
  .toggle-switch{width:42px; height:24px; border-radius:12px; background:var(--panel-raised); border:1px solid var(--hairline); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
  .toggle-switch.on{background:rgba(79,195,217,0.3); border-color:var(--cyan);}
  .toggle-knob{width:18px; height:18px; border-radius:50%; background:var(--text-mid); position:absolute; top:2px; left:2px; transition:left .15s, background .15s;}
  .toggle-switch.on .toggle-knob{left:21px; background:var(--cyan);}

  /* Historique des décisions */
  .histo-item{padding:12px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .histo-item:last-child{border-bottom:none;}
  .histo-top{display:flex; justify-content:space-between; gap:10px;}
  .histo-quart{font-family:var(--mono); font-size:10px; color:var(--text-dim); white-space:nowrap;}
  .histo-decision{color:var(--text-mid); margin-top:4px; line-height:1.5;}
  .histo-date{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); margin-top:4px;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Inventaire — Manager</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="heure-live" id="heureLive">--:--:--</div>
    <div class="date-live" id="dateLive"></div>
    <div class="sub">Écarts, comptages manquants et décisions du jour</div>
  </div>
  <div class="divider"></div>

  <!-- desktop-grid (02/08/2026) : mise en colonnes en vue bureau (voir
       nexus-desktop.js) — purement additif, aucun effet en mobile. -->
  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>
  <footer>NEXUS Inventaire · Manager v1 · Vito Sainte-Marie</footer>
</div>

<script>
  let managerCourant = null;
  let siteId = 'vito-sainte-marie';
  let dateSelectionnee = '';
  let quartSelectionne = 'matin';
  let quartRow = null;
  // Repli de "Paramètres de contrôle" — mode aveugle + jaugeage carburant
  // (02/08/2026, demande de Frédéric : "la page principale doit rester
  // centrée sur : Que dois-je contrôler maintenant ?") : replié par défaut,
  // sorti du flux principal des alertes — dernierCtx permet de
  // replier/déplier ou d'ouvrir un groupe de décisions sans recharger
  // toutes les données.
  let sectionParametresOuverte = false;
  let detailDecisionsOuvert = false; // "Décisions du quart" — détail déplié (02/08/2026)
  let categoriesOuvertes = new Set(); // "À terminer" — catégories dépliées (02/08/2026)
  let rouvertureFormOuvert = false; // "Rouvrir la clôture" — formulaire de motif déplié (02/08/2026)
  let dernierCtx = null;

  // Catégories de décision manager sur une alerte (02/08/2026, demande de
  // Frédéric — vision initiale NEXUS Inventaire) : chaque décision ferme
  // l'alerte avec une trace explicite (qui, quand, pourquoi), jamais une
  // simple suppression silencieuse.
  const DECISIONS = [
    { value: 'validee', label: 'Valider', cls: 'valider', texte: 'Écart validé — aucune action nécessaire.' },
    { value: 'recomptage', label: 'Recomptage', cls: 'recomptage', texte: 'Recomptage demandé au prochain quart.' },
    { value: 'explication', label: 'Explication reçue', cls: 'explication', texte: "Explication reçue de l'employé." },
    { value: 'erreur_saisie', label: 'Erreur de saisie', cls: 'erreur', texte: 'Erreur de saisie confirmée — écart non réel.' },
    { value: 'demarque', label: 'Démarque à surveiller', cls: 'demarque', texte: 'Démarque à surveiller — signalé pour suivi.' },
  ];

  function heureLocale() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function demarrerHorloge() {
    const majHeure = () => {
      document.getElementById('heureLive').textContent = heureLocale();
      document.getElementById('dateLive').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    };
    majHeure();
    setInterval(majHeure, 1000);
  }
  function dateISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtNum(n) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  }

  // Même règle que NEXUS-Inventaire-v1.html (02/08/2026) : le quart par
  // défaut se base sur les horaires réels configurés dans Paramètres
  // Station, pas sur un seuil fixe codé en dur.
  const HORAIRE_DEFAUT_DEBUT_QUART2 = '12:40';
  async function quartDuMoment(site) {
    let debutQuart2 = HORAIRE_DEFAUT_DEBUT_QUART2;
    const { data, error } = await nexusClient
      .from('station_config').select('horaires').eq('site', site || 'vito-sainte-marie').maybeSingle();
    if (error) console.error('Chargement horaires station (quart par défaut):', error);
    else if (data && data.horaires && data.horaires.quart2 && data.horaires.quart2.normal) {
      debutQuart2 = data.horaires.quart2.normal;
    }
    const maintenant = new Date();
    const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
    const [hQ2, mQ2] = debutQuart2.split(':').map(Number);
    const minutesQ2 = hQ2 * 60 + (mQ2 || 0);
    return minutesMaintenant < minutesQ2 ? 'matin' : 'soir';
  }

  function libelleStatutQuart(q) {
    const map = { brouillon: 'Brouillon', ouverture_en_cours: 'Ouverture en cours', ouvert: 'Ouvert', cloture: 'Clôturé' };
    let base = map[q.statut] || q.statut;
    if (q.statut === 'cloture' && q.cloture_le) base += ` · ${new Date(q.cloture_le).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
    else if (q.ouvert_le) base += ` · depuis ${new Date(q.ouvert_le).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
    return base;
  }

  // Mapping quart NEXUS Inventaire ('matin'/'soir') -> clé horaires Station
  // ('quart1'/'quart2') — même correspondance que Paramètres Station
  // (quart1 finit en début d'après-midi, quart2 en soirée).
  const QUART_VERS_CLE_HORAIRE = { matin: 'quart1', soir: 'quart2' };

  // Contextualise l'état du quart selon l'heure réelle par rapport à
  // l'heure normale de clôture (02/08/2026, demande de Frédéric) : ne
  // s'applique que pendant la phase de clôture (l'ouverture, elle, ne peut
  // pas être "en avance" puisqu'un quart n'existe qu'une fois commencé).
  // Seuil "à proximité de la fin" fixé à 60 minutes — heuristique
  // raisonnable, pas une donnée réelle, donc jamais présentée comme telle.
  function libelleEtatQuart(quart, synthese, horaires) {
    const base = libelleStatutQuart(quart);
    if (synthese.phase !== 'clotures' || synthese.manquants === 0) return { texte: base, urgence: 'normal' };

    const cleHoraire = QUART_VERS_CLE_HORAIRE[quartSelectionne];
    const finNormale = horaires && cleHoraire && horaires[cleHoraire] ? horaires[cleHoraire].fin_normal : null;
    if (!finNormale) return { texte: base, urgence: 'normal' };

    const maintenant = new Date();
    const minutesMaintenant = maintenant.getHours() * 60 + maintenant.getMinutes();
    const [h, m] = finNormale.split(':').map(Number);
    const minutesFin = h * 60 + (m || 0);
    const minutesAvantFin = minutesFin - minutesMaintenant;
    const n = synthese.manquants;

    if (minutesAvantFin > 60) {
      return { texte: `${base} — le comptage de clôture n'a pas encore commencé.`, urgence: 'normal' };
    } else if (minutesAvantFin >= 0) {
      return { texte: `${base} — ${n} produit${n > 1 ? 's' : ''} restent à compter avant la clôture.`, urgence: 'proche' };
    }
    return { texte: `${base} — Clôture en retard : ${n} produit${n > 1 ? 's' : ''} non compté${n > 1 ? 's' : ''}.`, urgence: 'retard' };
  }

  // ------------------------------------------------------------
  // CHARGEMENT DES DONNÉES
  // ------------------------------------------------------------
  async function chargerQuart(site, date, quart) {
    const { data, error } = await nexusClient.from('inventaire_quarts').select('*').eq('site', site).eq('date', date).eq('quart', quart).maybeSingle();
    if (error) { console.error('Chargement quart:', error); return null; }
    return data;
  }

  async function chargerAlertesOuvertesQuart(site, quartId) {
    const { data, error } = await nexusClient.from('inventaire_alertes')
      .select('*, inventaire_zone_produit(designation)')
      .eq('site', site).eq('quart_id', quartId).eq('statut', 'ouverte')
      .order('cree_le', { ascending: false });
    if (error) { console.error('Chargement alertes ouvertes:', error); return []; }
    return data || [];
  }

  async function chargerComptagesQuart(quartId) {
    const { data, error } = await nexusClient.from('inventaire_comptages')
      .select('produit_id, type_comptage').eq('quart_id', quartId).in('type_comptage', ['ouverture', 'cloture']);
    if (error) { console.error('Chargement comptages du quart:', error); return { ouverts: new Set(), clotures: new Set() }; }
    const ouverts = new Set(), clotures = new Set();
    for (const row of (data || [])) {
      if (row.type_comptage === 'ouverture') ouverts.add(row.produit_id);
      if (row.type_comptage === 'cloture') clotures.add(row.produit_id);

    return { ouverts, clotures };
  }

  // ------------------------------------------------------------
  // ACTIONS MANAGER
  // ------------------------------------------------------------
  // Cœur commun à la résolution d'une alerte, sans rechargement — permet de
  // réutiliser exactement le même circuit (décision + trace d'audit) que ce
  // soit pour une alerte seule (resoudreAlerte) ou en masse
  // (validerToutesAlertes), jamais une suppression silencieuse groupée.
  async function resoudreAlerteSansRecharger(alerteId, decision, commentaireLibre) {
    const commentaire = [decision.texte, commentaireLibre].filter(Boolean).join(' — ');
    const { error } = await nexusClient.from('inventaire_alertes').update({
      statut: 'resolue', resolution: decision.value, commentaire_manager: commentaire,
      assignee_a: managerCourant.id, resolue_le: new Date().toISOString(),
    }).eq('id', alerteId);
    if (error) { console.error('Résolution alerte:', error); return false; }

    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, quart_id: quartRow ? quartRow.id : null, entite_type: 'inventaire_alertes', entite_id: alerteId,
      action: 'resolution_alerte', ancienne_valeur: { statut: 'ouverte' }, nouvelle_valeur: { statut: 'resolue', resolution: decision.value },
      acteur_id: managerCourant.id, motif: commentaireLibre || null,
    });
    return true;
  }

  async function resoudreAlerte(alerteId, decision, commentaireLibre) {
    const ok = await resoudreAlerteSansRecharger(alerteId, decision, commentaireLibre);
    if (!ok) alert('Erreur — réessayez.');
    await chargerEtAfficherTout();
  }

  // Tout valider (02/08/2026, demande de Frédéric) : résout chaque alerte
  // ouverte du quart avec la décision "Valider" — même trace d'audit que si
  // le manager avait cliqué "Valider" alerte par alerte.
  async function validerToutesAlertes(alertes) {
    const decision = DECISIONS.find(d => d.value === 'validee');
    let erreurs = 0;
    for (const a of alertes) {
      const ok = await resoudreAlerteSansRecharger(a.id, decision, '');
      if (!ok) erreurs++;
    }
    if (erreurs > 0) alert(`${erreurs} alerte(s) n'ont pas pu être validée(s) — réessayez si besoin.`);
    await chargerEtAfficherTout();
  }

  // Rouvrir la clôture d'un quart (02/08/2026, demande de Frédéric — suite à
  // un quart clôturé alors que la grande majorité des produits n'avaient pas
  // été comptés, verrouillant l'écran employé sans recours) : remet le quart
  // en statut 'ouvert' pour permettre de reprendre la clôture, réinitialise
  // la validation de clôture de TOUS les employés rattachés à ce quart (pour
  // que l'écran employé affiche à nouveau "Clôturer mon inventaire" comme
  // non fait, quel que soit le compte connecté), et trace l'action dans
  // inventaire_audit_log — jamais un déverrouillage silencieux.
  async function rouvrirClotureQuart(quartId, motif) {
    const { error: e1 } = await nexusClient.from('inventaire_quarts')
      .update({ statut: 'ouvert', cloture_le: null }).eq('id', quartId);
    if (e1) { console.error('Réouverture quart:', e1); alert('Erreur — réessayez.'); return false; }

    const { error: e2 } = await nexusClient.from('inventaire_quart_employes')
      .update({ a_valide_cloture: false, heure_depart: null }).eq('quart_id', quartId);
    if (e2) console.error('Reset validation clôture employés:', e2);

    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, quart_id: quartId, entite_type: 'inventaire_quarts', entite_id: quartId,
      action: 'reouverture_cloture', ancienne_valeur: { statut: 'cloture' }, nouvelle_valeur: { statut: 'ouvert' },
      acteur_id: managerCourant.id, motif: motif || null,
    });
    return true;
  }

  // ------------------------------------------------------------
  // COMPARAISON VENTES DECENIUM (02/08/2026, demande de Frédéric) : compare
  // l'écoulement physique constaté sur le quart (ouverture − clôture +
  // mouvements, déjà tracés dans inventaire_comptages/inventaire_mouvements)
  // à ce que le fichier de ventes Decenium du quart dit avoir vendu. Un
  // écart significatif = démarque potentielle. Principes non négociables :
  // la ligne brute du fichier est TOUJOURS conservée (même non identifiée),
  // et le rapprochement sans code-barres passe par une liste d'alias
  // vérifiée à la main (jamais un rapprochement flou qui pourrait confondre
  // deux produits différents).
  // ------------------------------------------------------------
  const SEUIL_DEMARQUE = 1; // tolérance : petites erreurs de comptage normales en dessous de ce seuil

  // ------------------------------------------------------------
  // SYNTHÈSE DU QUART (02/08/2026, demande de Frédéric) : distingue les
  // comptages manquants (pas encore une anomalie) des écarts confirmés
  // (alertes ouvertes) — jamais un chiffre inventé, tout dérive de
  // inventaire_comptages / inventaire_alertes / inventaire_zone_produit
  // réellement chargés. Même exclusion du jaugeage carburant que côté
  // employé (produitsRequis() dans NEXUS-Inventaire-v1.html).
  // ------------------------------------------------------------
  const JAUGEAGE_NOM = 'Jaugeage Carburant';

  function construireSynthese(produitsActifs, comptages, jaugeageActif, quart, alertesOuvertes) {
    const requis = jaugeageActif ? produitsActifs : produitsActifs.filter(p => !p.inventaire_categories || p.inventaire_categories.nom !== JAUGEAGE_NOM);
    // Une fois l'ouverture terminée, c'est la clôture qui est la phase de
    // comptage active pour ce quart — sinon "produits comptés" resterait
    // bloqué à 100% dès l'ouverture close alors que la clôture reste à faire.
    const phase = (quart && (quart.statut === 'ouvert' || quart.statut === 'cloture')) ? 'clotures' : 'ouverts';
    const parCategorie = {};
    requis.forEach(p => {
      const nom = p.inventaire_categories ? p.inventaire_categories.nom : 'Autres';
      if (!parCategorie[nom]) parCategorie[nom] = { nom, total: 0, comptes: 0, zones: new Set(), produitsManquants: [] };
      const cat = parCategorie[nom];
      cat.total++;
      const zoneCode = p.inventaire_zones ? p.inventaire_zones.code : null;
      if (zoneCode) cat.zones.add(zoneCode);
      if (comptages[phase].has(p.id)) cat.comptes++;
      else cat.produitsManquants.push(p.designation || 'Produit');
    });
    const categories = Object.values(parCategorie)
      .map(c => ({
        ...c,
        zoneLabel: c.zones.size === 0 ? '—' : c.zones.size > 1 ? 'Boutique + Piste' : (c.zones.has('piste') ? 'Piste' : 'Boutique'),
        statutLabel: c.comptes === 0 ? 'Non commencé' : (c.comptes < c.total ? 'En cours' : 'Terminé'),
      }))
      .sort((a, b) => (b.total - b.comptes) - (a.total - a.comptes));
    const total = requis.length;
    const comptes = requis.filter(p => comptages[phase].has(p.id)).length;
    return {
      phase, total, comptes, manquants: total - comptes,
      pourcentage: total > 0 ? Math.round((comptes / total) * 100) : 100,
      categoriesTotal: categories.length,
      categoriesTerminees: categories.filter(c => c.comptes === c.total).length,
      categoriesIncompletes: categories.filter(c => c.comptes < c.total),
      ecartsAControler: alertesOuvertes.length,
      clotureImpossible: total > 0 && comptes < total,
    };
  }

  // Rapprochement par nom pour les produits sans code-barres des deux côtés
  // (pain, viennoiserie, gaz en bouteille, glaçons) — vérifié manuellement
  // le 02/08/2026 sur un vrai export Decenium (0208quart1.xlsx). À compléter
  // si de nouveaux produits sans code-barres apparaissent dans un futur
  // export non reconnu.
  const ALIAS_VENTES_SANS_CODE_BARRES = {
    'baguette': 'Baguette',
    'croissant': 'Croissant',
    'pomme cannelle': 'Pomme Cannelle',
    'carre aux pommes 110g': 'Carré Pomme',
    'pain chocolat': 'Pain Choco',
    'maxi pain choco': 'Maxi Pain Choco',
    'feuillete jamb/from 110g': 'Feuilleté',
    'feuillete': 'Feuilleté',
    'gaz bleu 3 kg': 'Gaz 3KG',
    'glacons crystal 5 kg': 'Glaçons Crystal 5kg',
  };

  function normaliserCodeBarresVentes(v) {
    if (v === null || v === undefined) return null;
    const s = String(v).replace(/[\s ]/g, '').replace(/^0+/, '');
    return s || null;
  }

  // Enlève accents, ponctuation, casse, et les suffixes de conditionnement
  // Decenium (ex: "-24P", "110g -30P") pour retrouver l'alias — jamais
  // utilisé pour un rapprochement automatique entre deux désignations
  // quelconques, uniquement pour chercher une clé dans ALIAS_VENTES_SANS_CODE_BARRES.
  function normaliserTexteVentes(v) {
    // Ne retire QUE le suffixe de conditionnement Decenium ("-24P", "-30P"…) —
    // jamais le poids/volume (ex: "3 KG"), qui distingue de vraies variantes
    // différentes (bouteilles de gaz de tailles différentes, par exemple).
    return String(v || '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/-\s*\d+p\b/g, '')
      .replace(/[^a-z0-9/]+/g, ' ')
      .trim().replace(/\s+/g, ' ');
  }

  async function chargerCatalogueProduitsPourVentes(site) {
    const { data, error } = await nexusClient.from('inventaire_zone_produit')
      .select('id, designation, code_barres').eq('site', site).eq('actif', true);
    if (error) { console.error('Chargement catalogue produits (ventes):', error); return []; }
    return data || [];
  }

  function parserFichierVentesDecenium(fichier) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type: 'array' });
          const feuille = wb.Sheets[wb.SheetNames[0]];
          const lignes = XLSX.utils.sheet_to_json(feuille, { defval: null });
          resolve(lignes);
        } catch (err) { reject(err); }
      };
      reader.onerror = () => reject(new Error('Lecture du fichier impossible.'));
      reader.readAsArrayBuffer(fichier);
    });
  }

  // Rapproche chaque ligne du fichier avec un produit du catalogue —
  // code-barres d'abord (le plus fiable), alias manuel ensuite pour les
  // produits sans code-barres des deux côtés. Ne devine jamais : une ligne
  // non reconnue reste produit_id = null, jamais rattachée au hasard.
  function rapprocherLignesVentes(lignesFichier, produits) {
    const parCodeBarres = new Map();
    const parDesignationExacte = new Map();
    produits.forEach(p => {
      const cb = normaliserCodeBarresVentes(p.code_barres);
      if (cb) parCodeBarres.set(cb, p);
      parDesignationExacte.set(p.designation.trim().toLowerCase(), p);
    });

    return lignesFichier.map(ligne => {
      const designationBrute = ligne['lib article'] || ligne['Lib Article'] || ligne['LIB ARTICLE'] || '';
      const categorieBrute = ligne['Categ'] || ligne['categ'] || null;
      const codeBarresBrut = ligne['Code Barres'] || ligne['code barres'] || ligne['CODE BARRES'] || null;
      const quantite = Number(ligne['QTE'] ?? ligne['Qte'] ?? ligne['qte'] ?? 0);

      let produit = null;
      const cb = normaliserCodeBarresVentes(codeBarresBrut);
      if (cb && parCodeBarres.has(cb)) {
        produit = parCodeBarres.get(cb);
      } else {
        const cle = normaliserTexteVentes(designationBrute);
        const nomCible = ALIAS_VENTES_SANS_CODE_BARRES[cle];
        if (nomCible) produit = parDesignationExacte.get(nomCible.trim().toLowerCase()) || null;
      }

      return {
        designation_brute: String(designationBrute || '').trim(),
        code_barres_brut: codeBarresBrut ? String(codeBarresBrut).replace(/[\s ]/g, '') : null,
        categorie_brute: categorieBrute,
        quantite_vendue: isNaN(quantite) ? 0 : quantite,
        prix_achat_ht: Number(ligne['PA HT']) || null,
        prix_vente_ht: Number(ligne['PV HT']) || null,
        produit_id: produit ? produit.id : null,
        designation_matchee: produit ? produit.designation : null,
      };
    });
  }

  // Écoulement physique constaté sur le quart pour un produit : stock
  // d'ouverture moins stock de clôture, plus la somme signée des mouvements
  // déjà tracés (une livraison est saisie en positif, une casse en négatif —
  // voir NEXUS-Inventaire-v1.html). Si l'ouverture ou la clôture n'a pas été
  // comptée, l'écoulement ne peut pas être calculé pour ce produit (retourne
  // null plutôt qu'un chiffre approximatif).
  async function calculerEcoulementPhysiqueQuart(quartId, produitIds) {
    const [{ data: comptages, error: e1 }, { data: mouvements, error: e2 }] = await Promise.all([
      // Trié par compte_le décroissant (02/08/2026, demande de Frédéric —
      // un quart rouvert par un manager peut recevoir un second comptage de
      // clôture pour le même produit après correction) : sans ce tri, deux
      // lignes pour le même produit/type sur ce quart donnaient un résultat
      // non déterministe — on ne garde maintenant que la plus RÉCENTE, même
      // principe que chargerDerniersStocks() côté employé.
      nexusClient.from('inventaire_comptages').select('produit_id, type_comptage, quantite, compte_le')
        .eq('quart_id', quartId).in('produit_id', produitIds).in('type_comptage', ['ouverture', 'cloture'])
        .order('compte_le', { ascending: false }),
      nexusClient.from('inventaire_mouvements').select('produit_id, quantite').eq('quart_id', quartId).in('produit_id', produitIds),
    ]);
    if (e1) console.error('Chargement comptages (comparaison ventes):', e1);
    if (e2) console.error('Chargement mouvements (comparaison ventes):', e2);

    const ouverture = {}, cloture = {}, sommeMouvements = {};
    (comptages || []).forEach(c => {
      if (c.type_comptage === 'ouverture' && !(c.produit_id in ouverture)) ouverture[c.produit_id] = c.quantite;
      if (c.type_comptage === 'cloture' && !(c.produit_id in cloture)) cloture[c.produit_id] = c.quantite;
    });
    (mouvements || []).forEach(m => { sommeMouvements[m.produit_id] = (sommeMouvements[m.produit_id] || 0) + Number(m.quantite); });

    const resultat = {};
    for (const id of produitIds) {
      if (ouverture[id] === undefined || cloture[id] === undefined) { resultat[id] = null; continue; }
      resultat[id] = ouverture[id] - cloture[id] + (sommeMouvements[id] || 0);
    }
    return resultat;
  }

  async function comparerVentesQuart(fichier) {
    const resumeEl = document.getElementById('ventesResume');
    const btn = document.getElementById('btnComparerVentes');
    try {
      const lignesBrutes = await parserFichierVentesDecenium(fichier);
      const produits = await chargerCatalogueProduitsPourVentes(siteId);
      const lignesRapprochees = rapprocherLignesVentes(lignesBrutes, produits);

      // Ré-import idempotent : on remplace les lignes de ce quart plutôt que
      // de les accumuler à chaque nouvel essai.
      await nexusClient.from('inventaire_ventes_import').delete().eq('quart_id', quartRow.id);

      const { error: eInsert } = await nexusClient.from('inventaire_ventes_import').insert(
        lignesRapprochees.map(l => ({
          site: siteId, quart_id: quartRow.id, produit_id: l.produit_id,
          designation_brute: l.designation_brute, code_barres_brut: l.code_barres_brut,
          categorie_brute: l.categorie_brute, quantite_vendue: l.quantite_vendue,
          prix_achat_ht: l.prix_achat_ht, prix_vente_ht: l.prix_vente_ht, importe_par: managerCourant.id,
        }))
      );
      if (eInsert) { console.error('Insertion ventes import:', eInsert); resumeEl.innerHTML = '<div style="color:var(--red);">Erreur d\'enregistrement — réessayez.</div>'; btn.disabled = false; btn.textContent = 'Importer les ventes Decenium'; return; }

      // Agrège la quantité vendue par produit rapproché (une même référence
      // peut apparaître sur plusieurs lignes) et garde un prix de vente HT
      // réel par produit (issu du fichier) pour estimer la valeur des écarts
      // — jamais un prix inventé, celui du fichier Decenium lui-même.
      const venteParProduit = {};
      const prixVenteParProduit = {};
      let nbNonIdentifiees = 0;
      lignesRapprochees.forEach(l => {
        if (l.produit_id) {
          venteParProduit[l.produit_id] = (venteParProduit[l.produit_id] || 0) + l.quantite_vendue;
          if (l.prix_vente_ht != null) prixVenteParProduit[l.produit_id] = l.prix_vente_ht;
        } else nbNonIdentifiees++;
      });
      const produitIds = Object.keys(venteParProduit);
      const ecoulements = await calculerEcoulementPhysiqueQuart(quartRow.id, produitIds);

      // Retire les anciennes alertes démarque encore ouvertes pour ce quart
      // avant d'insérer les nouvelles — jamais les alertes déjà résolues
      // (trace d'une décision manager, on n'efface pas ça).
      await nexusClient.from('inventaire_alertes').delete()
        .eq('quart_id', quartRow.id).eq('type_alerte', 'demarque_ventes').eq('statut', 'ouverte');

      let nbEcarts = 0, nbSansComptage = 0, valeurEstimee = 0;
      const nouvellesAlertes = [];
      for (const produitId of produitIds) {
        const ecoulement = ecoulements[produitId];
        if (ecoulement === null) { nbSansComptage++; continue; }
        const venteDecenium = venteParProduit[produitId];
        const ecart = ecoulement - venteDecenium;
        if (Math.abs(ecart) > SEUIL_DEMARQUE) {
          nbEcarts++;
          const prixUnitaire = prixVenteParProduit[produitId];
          if (prixUnitaire != null) valeurEstimee += Math.abs(ecart) * prixUnitaire;
          nouvellesAlertes.push({
            site: siteId, quart_id: quartRow.id, produit_id: produitId, type_alerte: 'demarque_ventes',
            gravite: Math.abs(ecart) > 3 ? 'critique' : 'attention',
            valeur_attendue: venteDecenium, valeur_constatee: ecoulement,
          });
        }
      }
      if (nouvellesAlertes.length) {
        const { error: eAlertes } = await nexusClient.from('inventaire_alertes').insert(nouvellesAlertes);
        if (eAlertes) console.error('Insertion alertes démarque:', eAlertes);
      }

      // Rapprochement "terminé" seulement si toutes les lignes du fichier
      // ont été identifiées ET que tous les produits identifiés avaient un
      // comptage d'ouverture et de clôture pour calculer l'écoulement.
      const rapprochementComplet = nbNonIdentifiees === 0 && nbSansComptage === 0;
      const resumeHtml = `
        <div class="synthese-ligne"><span>Références reconnues</span><span class="synthese-valeur green">${produitIds.length}</span></div>
        <div class="synthese-ligne"><span>Références non reconnues</span><span class="synthese-valeur ${nbNonIdentifiees ? 'amber' : 'green'}">${nbNonIdentifiees}</span></div>
        <div class="synthese-ligne"><span>Écarts détectés</span><span class="synthese-valeur ${nbEcarts ? 'amber' : 'green'}">${nbEcarts}</span></div>
        <div class="synthese-ligne"><span>Valeur estimée</span><span class="synthese-valeur ${valeurEstimee ? 'amber' : 'green'}">${fmtNum(valeurEstimee)} €</span></div>
        ${nbSansComptage ? `<div class="synthese-ligne"><span>Sans comptage (écoulement non calculable)</span><span class="synthese-valeur amber">${nbSansComptage}</span></div>` : ''}
        <div class="synthese-cloture ${rapprochementComplet ? 'possible' : 'impossible'}">${rapprochementComplet ? 'Rapprochement terminé' : 'Rapprochement incomplet'}</div>
        ${nbEcarts ? '<div style="margin-top:8px; font-size:11.5px; color:var(--text-mid);">Voir la section À contrôler ci-dessous.</div>' : ''}
      `;
      // Bug corrigé (02/08/2026, signalé par Frédéric — "ça charge puis ça
      // revient comme s'il n'y avait pas de fichier") : chargerEtAfficherTout()
      // reconstruit tout #content, y compris un #ventesResume vide flambant
      // neuf — écrire le résumé AVANT ce rechargement le faisait effacer
      // instantanément. On recharge d'abord, puis on écrit le résumé dans
      // l'élément fraîchement rendu, pour qu'il reste visible.
      await chargerEtAfficherTout();
      const resumeElApres = document.getElementById('ventesResume');
      if (resumeElApres) resumeElApres.innerHTML = resumeHtml;
    } catch (err) {
      console.error('Comparaison ventes Decenium:', err);
      resumeEl.innerHTML = `<div style="color:var(--red);">Erreur pendant la lecture du fichier : ${err.message}</div>`;
      btn.disabled = false; btn.textContent = 'Importer les ventes Decenium';
    }
  }

  // ------------------------------------------------------------
  // CONSEILLER NEXUS — remarques calculées uniquement à partir de données
  // réelles (alertes ouvertes, produits sensibles non comptés, récurrence
  // sur 14 jours, mode aveugle actif). Jamais un chiffre inventé, même
  // principe que sur NEXUS-Verify-v1.html.
  // ------------------------------------------------------------
  async function genererRemarquesConseiller(alertesOuvertes, sensiblesNonComptesDetail, modesAveugleActifs, synthese) {
    const corps = document.getElementById('conseillerCorps');
    if (!corps) return;
    const remarques = [];

    // Prescriptif plutôt que descriptif (02/08/2026, demande de Frédéric) :
    // le Conseiller nomme les catégories concrètes et recommande une
    // priorité, plutôt que de se contenter de constater un chiffre. Jamais
    // d'horaire limite inventé — NEXUS n'a pas de donnée d'heure de clôture
    // cible, seulement l'état réel des comptages.
    if (!quartRow) {
      remarques.push(`Aucun inventaire n'a encore été démarré pour ce quart.`);
    } else if (alertesOuvertes.length === 0 && synthese.manquants === 0) {
      remarques.push(`Rien à signaler sur ce quart — tous les comptages requis ont été effectués et aucun écart n'est resté ouvert.`);
    } else {
      if (synthese.clotureImpossible) {
        const quartLabel = quartSelectionne === 'soir' ? 'soir' : 'matin';
        const detailCategories = synthese.categoriesIncompletes.slice(0, 3)
          .map(c => `${c.total - c.comptes} ${c.nom.toLowerCase()}`).join(', ');
        remarques.push(`Le quart du <b>${quartLabel}</b> n'est pas clôturable : <b>${synthese.manquants} produit(s)</b> restent à compter${detailCategories ? `, dont ${detailCategories}` : ''}.`);
        if (synthese.categoriesIncompletes.length) {
          const prioritaires = synthese.categoriesIncompletes.slice(0, 2).map(c => c.nom).join(' et ');
          remarques.push(`Priorité recommandée : terminer <b>${prioritaires}</b> en premier.<br><button class="btn-conseiller-action" id="btnVoirCategoriesIncompletes">Voir les catégories incomplètes</button>`);
        }
      }
      if (alertesOuvertes.length) {
        const nbCritiques = alertesOuvertes.filter(a => a.gravite === 'critique').length;
        remarques.push(`<b>${alertesOuvertes.length} écart(s) à contrôler</b> sur ce quart${nbCritiques ? `, dont <b>${nbCritiques} critique(s)</b>` : ''}.`);
      }
    }

    try {
      const historiqueRecent = await chargerHistoriqueEcartsRecents(siteId);
      const compte = {};
      for (const h of historiqueRecent) compte[h.produit_id] = (compte[h.produit_id] || 0) + 1;
      const recurrents = alertesOuvertes.filter(a => (compte[a.produit_id] || 0) >= 2);
      if (recurrents.length) {
        const noms = [...new Set(recurrents.map(a => a.inventaire_zone_produit ? a.inventaire_zone_produit.designation : 'ce produit'))];
        remarques.push(`Écart <b>récurrent sur les 14 derniers jours</b> pour : ${noms.join(', ')} — à surveiller de près.`);
      }
    } catch (e) {
      console.error('Conseiller NEXUS Inventaire — récurrence:', e);
    }

    if (modesAveugleActifs.length) {
      remarques.push(`Mode de comptage à l'aveugle actif pour <b>${modesAveugleActifs.length} employé(s)</b>.`);
    }

    corps.innerHTML = remarques.map(r => `<div class="conseiller-remarque">${r}</div>`).join('');
    const btnVoirCategories = document.getElementById('btnVoirCategoriesIncompletes');
    if (btnVoirCategories) btnVoirCategories.addEventListener('click', () => {
      const el = document.getElementById('sectionATerminer');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // Progression du quart (02/08/2026, demande de Frédéric — remplace
  // "Synthèse du quart") : pourcentage + barre visuelle en tête, pour que le
  // manager comprenne l'avancement sans lire toutes les lignes.
  // Bannière de clôture cohérente avec l'état temporel (02/08/2026, demande
  // de Frédéric) : avant, "Clôture impossible..." en amber dès qu'il restait
  // des comptages manquants, même à 18h06 pour une clôture normale à 19h40 —
  // contredisait la carte État du quart, déjà nuancée. Les deux suivent
  // maintenant la même logique d'urgence (normal/proche/retard).
  function renderSyntheseQuart(s, etat) {
    const phaseLabel = s.phase === 'clotures' ? 'comptés (clôture)' : 'comptés';
    const urgence = etat ? etat.urgence : 'normal';
    let clotureClasse, clotureTexte;
    if (s.manquants === 0) {
      clotureClasse = 'possible'; clotureTexte = 'Clôture possible';
    } else if (s.phase !== 'clotures' || urgence === 'normal') {
      clotureClasse = 'attente';
      clotureTexte = s.phase === 'clotures'
        ? "Le comptage de clôture n'a pas encore commencé."
        : "Clôture impossible tant que l'inventaire d'ouverture n'est pas terminé.";
    } else if (urgence === 'proche') {
      clotureClasse = 'impossible';
      clotureTexte = 'Clôture impossible tant que les comptages manquants ne sont pas terminés';
    } else {
      clotureClasse = 'retard';
      clotureTexte = `Clôture en retard — ${s.manquants} produit${s.manquants > 1 ? 's' : ''} non compté${s.manquants > 1 ? 's' : ''}.`;
    }
    return `
      <div class="synthese-card">
        <div class="synthese-titre">Progression</div>
        <div class="synthese-pct-row">
          <span class="synthese-pct">${s.pourcentage}%</span>
          <span class="synthese-pct-label">du comptage ${s.phase === 'clotures' ? 'de clôture' : "d'ouverture"} terminé</span>
        </div>
        <div class="synthese-barre"><div class="synthese-remplie" style="width:${s.pourcentage}%"></div></div>
        <div class="synthese-ligne"><span>Produits ${phaseLabel}</span><span class="synthese-valeur ${s.manquants ? 'amber' : 'green'}">${s.comptes} / ${s.total}</span></div>
        <div class="synthese-ligne"><span>Catégories terminées</span><span class="synthese-valeur ${s.categoriesTerminees < s.categoriesTotal ? 'amber' : 'green'}">${s.categoriesTerminees} / ${s.categoriesTotal}</span></div>
        <div class="synthese-ligne"><span>Écarts à contrôler</span><span class="synthese-valeur ${s.ecartsAControler ? 'amber' : 'green'}">${s.ecartsAControler}</span></div>
        <div class="synthese-ligne"><span>Comptages manquants</span><span class="synthese-valeur ${s.manquants ? 'amber' : 'green'}">${s.manquants}</span></div>
        <div class="synthese-cloture ${clotureClasse}">${clotureTexte}</div>
      </div>
    `;
  }

  // Catégories manquantes cliquables (02/08/2026, demande de Frédéric) :
  // déplie la zone concernée (dérivée des vraies données produit, jamais un
  // "responsable" inventé), le statut et la liste des produits manquants.
  function renderCategorieManquante(c) {
    const ouvert = categoriesOuvertes.has(c.nom);
    return `
      <div class="categorie-manquante" data-cat="${c.nom}">
        <div class="categorie-manquante-top">
          <span>${c.nom}<span class="categorie-manquante-chevron ${ouvert ? 'open' : ''}">›</span></span>
          <span class="categorie-manquante-valeur">${c.total - c.comptes}</span>
        </div>
        ${ouvert ? `
          <div class="categorie-manquante-detail">
            <div>Zone : <b>${c.zoneLabel}</b></div>
            <div>Statut : <b>${c.statutLabel}</b></div>
            <div class="categorie-manquante-liste">${c.produitsManquants.slice(0, 8).join(' · ')}${c.produitsManquants.length > 8 ? '…' : ''}</div>
          </div>
        ` : ''}
      </div>
    `;
  }

  // Décisions du quart (02/08/2026, demande de Frédéric — remplace le
  // doublon "Décisions du quart" / "Décisions prises" qui affichait deux
  // chiffres différents, 70 vs 30, parce qu'ils portaient sur des
  // périmètres différents) : une seule source de vérité, scopée au quart
  // sélectionné, avec un détail dépliable plutôt qu'un second bloc séparé.
  // L'audit multi-quarts existe déjà sur NEXUS-Journal-v1.html.
  function renderResumeDecisionsQuart(decisionsQuart) {
    const compte = { validee: 0, recomptage: 0, erreur_saisie: 0, demarque: 0, explication: 0 };
    decisionsQuart.forEach(d => { if (compte[d.resolution] !== undefined) compte[d.resolution]++; });
    const total = decisionsQuart.length;
    const individuels = decisionsQuart.filter(d => d.resolution !== 'validee');
    const valideeNoms = decisionsQuart.filter(d => d.resolution === 'validee')
      .map(d => d.inventaire_zone_produit ? d.inventaire_zone_produit.designation : 'Produit');
    return `
      <div class="synthese-card">
        <div class="synthese-titre">Décisions du quart</div>
        <div class="synthese-ligne"><span>Écarts validés sans action</span><span class="synthese-valeur">${compte.validee}</span></div>
        <div class="synthese-ligne"><span>Recomptages demandés</span><span class="synthese-valeur ${compte.recomptage ? 'amber' : ''}">${compte.recomptage}</span></div>
        <div class="synthese-ligne"><span>Corrections acceptées</span><span class="synthese-valeur">${compte.erreur_saisie}</span></div>
        <div class="synthese-ligne"><span>Alertes maintenues</span><span class="synthese-valeur ${compte.demarque ? 'amber' : ''}">${compte.demarque}</span></div>
        ${total > 0 ? `<button class="btn-inline-lien" id="btnDetailDecisions">${detailDecisionsOuvert ? 'Masquer le détail' : `Voir le détail des ${total} décision${total > 1 ? 's' : ''}`}</button>` : ''}
        ${detailDecisionsOuvert ? `
          <div style="margin-top:10px;">
            ${individuels.map(h => renderDetailDecisionItem(h)).join('')}
            ${valideeNoms.length ? `<div class="decision-groupe-liste">${compte.validee} validé${compte.validee > 1 ? 's' : ''} sans action : ${valideeNoms.join(' · ')}</div>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }

  function renderTout(ctx) {
    dernierCtx = ctx;
    const { alertesOuvertes, sensiblesNonComptesDetail, employesSite, modesAveugleActifs, jaugeageActif, synthese, etat, produitsSensiblesTotal, decisionsQuart } = ctx;
    const modesMap = Object.fromEntries(modesAveugleActifs.map(m => [m.employee_id, m]));

    document.getElementById('content').innerHTML = `
      <div class="quart-select-row">
        <input type="date" id="selDate" class="date-input" value="${dateSelectionnee}">
        <div class="quart-pill ${quartSelectionne === 'matin' ? 'active' : ''}" data-quart="matin">Matin</div>
        <div class="quart-pill ${quartSelectionne === 'soir' ? 'active' : ''}" data-quart="soir">Soir</div>
      </div>
      ${quartRow ? renderEtatQuartCard(etat) : '<div class="quart-statut">Aucun inventaire n\'a encore été démarré pour ce quart.</div>'}

      ${quartRow ? renderSyntheseQuart(synthese, etat) : ''}

      <div class="conseiller-card" id="conseillerCard">
        <div class="conseiller-head">
          <img class="conseiller-avatar" src="nexus-avatar.png" alt="Conseiller NEXUS">
          <div>
            <div class="conseiller-name">CONSEILLER NEXUS</div>
            <div class="conseiller-sub">Ce que je remarque sur ce quart</div>
          </div>
        </div>
        <div id="conseillerCorps"></div>
      </div>

      ${quartRow ? `
        <div class="section-titre">Comparaison Decenium</div>
        <div class="ventes-card">
          <div class="ventes-desc">Importez l'export Excel des ventes de <b>ce quart</b> (à la connexion du caissier suivant) — NEXUS rapproche les quantités vendues avec les stocks de début, les réassorts et les stocks de fin, et signale les écarts.</div>
          <div class="ventes-file-row">
            <label class="ventes-file-label" id="ventesFileLabel" for="ventesFileInput">
              <svg class="ventes-file-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                  <linearGradient id="ventesExcelGrad" x1="6" y1="2" x2="26" y2="32" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#21A366"/>
                    <stop offset="1" stop-color="#0F7A3E"/>
                  </linearGradient>
                </defs>
                <path d="M8 2h12l6 6v20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="url(#ventesExcelGrad)"/>
                <path d="M20 2v6h6z" fill="#8CE0B4" opacity="0.65"/>
                <path d="M11.6 13.5h2.7l1.9 3.1 1.9-3.1h2.7l-3.2 5 3.3 5.2h-2.8l-2-3.3-2 3.3h-2.7l3.3-5.2z" fill="#fff"/>
              </svg>
              <span class="ventes-file-text" id="ventesFileText">Choisir le fichier Excel…</span>
            </label>
            <input type="file" id="ventesFileInput" accept=".xlsx,.xls" style="display:none;">
            <button class="btn-comparer" id="btnComparerVentes" disabled>Importer les ventes Decenium</button>
          </div>
          <div id="ventesResume"></div>
        </div>

        <div class="section-titre" id="sectionATerminer">À terminer</div>
        ${synthese.categoriesIncompletes.length === 0
          ? '<div class="empty">Tous les comptages requis ont été effectués.</div>'
          : `<div class="card">${synthese.categoriesIncompletes.map(c => renderCategorieManquante(c)).join('')}</div>`}

        <div class="section-titre-action-row">
          <div class="section-titre">À contrôler</div>
          ${alertesOuvertes.length > 0 ? '<button class="btn-tout-valider" id="btnToutValider">Tout valider</button>' : ''}
        </div>
        ${alertesOuvertes.length === 0 ? '<div class="empty">Aucun écart ouvert.</div>' : alertesOuvertes.map(a => renderAlerteCard(a)).join('')}
      ` : ''}

      ${quartRow && decisionsQuart ? renderResumeDecisionsQuart(decisionsQuart) : (quartRow ? '<div class="section-titre">Décisions du quart</div><div class="empty">Aucune décision enregistrée pour ce quart.</div>' : '')}

      <div class="section-titre section-repliable" id="toggleSectionParametres">
        <span>Paramètres du contrôle</span>
        <span class="repli-compte">${modesAveugleActifs.length ? `Aveugle : ${modesAveugleActifs.length} actif${modesAveugleActifs.length > 1 ? 's' : ''}` : 'Aveugle : désactivé'} · Jaugeage : ${jaugeageActif ? 'actif' : 'facultatif'}</span>
        <span class="repli-chevron ${sectionParametresOuverte ? 'open' : ''}">›</span>
      </div>
      ${sectionParametresOuverte ? `
        <div class="card" style="margin-bottom:10px;">
          <div class="synthese-ligne"><span>Seuil d'alerte</span><span class="synthese-valeur">${SEUIL_DEMARQUE} unité${SEUIL_DEMARQUE > 1 ? 's' : ''}</span></div>
          <div class="synthese-ligne"><span>Produits sensibles suivis</span><span class="synthese-valeur">${produitsSensiblesTotal}</span></div>
        </div>
        <div class="section-titre" style="margin-top:0;">Mode de comptage à l'aveugle</div>
        <div class="card">
          ${employesSite.length === 0 ? '<div class="empty">Aucun employé actif trouvé pour ce site.</div>' : employesSite.map(e => renderEmployeToggle(e, !!modesMap[e.id])).join('')}
        </div>
        <div class="section-titre">Jaugeage carburant</div>
        <div class="card">${renderToggleJaugeage(jaugeageActif)}</div>
      ` : ''}
    `;

    document.getElementById('selDate').addEventListener('change', async (e) => {
      dateSelectionnee = e.target.value;
      await chargerEtAfficherTout();
    });
    document.querySelectorAll('.quart-pill').forEach(el => el.addEventListener('click', async () => {
      quartSelectionne = el.dataset.quart;
      await chargerEtAfficherTout();
    }));
    const ventesFileInput = document.getElementById('ventesFileInput');
    const btnComparerVentes = document.getElementById('btnComparerVentes');
    if (ventesFileInput && btnComparerVentes) {
      ventesFileInput.addEventListener('change', () => {
        const fichier = ventesFileInput.files[0];
        const label = document.getElementById('ventesFileLabel');
        const texte = document.getElementById('ventesFileText');
        if (fichier) {
          texte.textContent = fichier.name;
          label.classList.add('choisi');
          btnComparerVentes.disabled = false;
        } else {
          texte.textContent = 'Choisir le fichier Excel…';
          label.classList.remove('choisi');
          btnComparerVentes.disabled = true;
        }
      });
      btnComparerVentes.addEventListener('click', async () => {
        const fichier = ventesFileInput.files[0];
        if (!fichier || !quartRow) return;
        btnComparerVentes.disabled = true;
        btnComparerVentes.textContent = 'Import en cours…';
        await comparerVentesQuart(fichier);
      });
    }
    document.querySelectorAll('.btn-decision').forEach(btn => btn.addEventListener('click', async () => {
      const decision = DECISIONS.find(d => d.value === btn.dataset.decision);
      const commentaireEl = document.getElementById(`commentaire-${btn.dataset.id}`);
      const commentaireLibre = commentaireEl ? commentaireEl.value.trim() : '';
      document.querySelectorAll(`.alerte-card[data-id="${btn.dataset.id}"] .btn-decision`).forEach(b => b.disabled = true);
      await resoudreAlerte(btn.dataset.id, decision, commentaireLibre);
    }));
    const btnToutValider = document.getElementById('btnToutValider');
    if (btnToutValider) btnToutValider.addEventListener('click', async () => {
      if (!confirm(`Valider les ${alertesOuvertes.length} alerte(s) ouverte(s) de ce quart ? Cette action ne peut pas être annulée.`)) return;
      btnToutValider.disabled = true;
      btnToutValider.textContent = 'Validation en cours…';
      await validerToutesAlertes(alertesOuvertes);
    });
    document.querySelectorAll('.toggle-switch').forEach(el => el.addEventListener('click', async () => {
      const actif = el.dataset.actif === '1';
      el.style.pointerEvents = 'none';
      if (el.dataset.mode === 'jaugeage') await toggleJaugeage(!actif);
      else await toggleModeAveugle(el.dataset.employe, !actif);
    }));
    const toggleSection = document.getElementById('toggleSectionParametres');
    if (toggleSection) toggleSection.addEventListener('click', () => {
      sectionParametresOuverte = !sectionParametresOuverte;
      renderTout(dernierCtx); // pas de rechargement réseau, juste replier/déplier
    });
    const btnDetailDecisions = document.getElementById('btnDetailDecisions');
    if (btnDetailDecisions) btnDetailDecisions.addEventListener('click', () => {
      detailDecisionsOuvert = !detailDecisionsOuvert;
      renderTout(dernierCtx); // pas de rechargement réseau, juste replier/déplier
    });
    document.querySelectorAll('.categorie-manquante').forEach(el => el.addEventListener('click', () => {
      const cat = el.dataset.cat;
      if (categoriesOuvertes.has(cat)) categoriesOuvertes.delete(cat); else categoriesOuvertes.add(cat);
      renderTout(dernierCtx); // pas de rechargement réseau, juste replier/déplier
    }));
    const btnRouvrirCloture = document.getElementById('btnRouvrirCloture');
    if (btnRouvrirCloture) btnRouvrirCloture.addEventListener('click', () => {
      rouvertureFormOuvert = true;
      renderTout(dernierCtx); // pas de rechargement réseau, juste déplier le formulaire
    });
    const btnAnnulerRouverture = document.getElementById('btnAnnulerRouverture');
    if (btnAnnulerRouverture) btnAnnulerRouverture.addEventListener('click', () => {
      rouvertureFormOuvert = false;
      renderTout(dernierCtx);
    });
    const btnConfirmerRouverture = document.getElementById('btnConfirmerRouverture');
    if (btnConfirmerRouverture) btnConfirmerRouverture.addEventListener('click', async () => {
      const motifEl = document.getElementById('motifRouverture');
      const motif = motifEl ? motifEl.value.trim() : '';
      if (!confirm("Rouvrir ce quart va permettre de reprendre et corriger les comptages de clôture — le quart redevient « Ouvert ». Cette action est tracée. Confirmer ?")) return;
      btnConfirmerRouverture.disabled = true;
      btnConfirmerRouverture.textContent = 'Réouverture en cours…';
      const ok = await rouvrirClotureQuart(quartRow.id, motif);
      rouvertureFormOuvert = false;
      if (!ok) return;
      await chargerEtAfficherTout();
    });
  }

  async function chargerEtAfficherTout() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';

    quartRow = await chargerQuart(siteId, dateSelectionnee, quartSelectionne);

    const [produitsSensibles, produitsActifsSite, employesSite, modesAveugleActifs, jaugeageActif, horaires] = await Promise.all([
      chargerProduitsSensibles(siteId),
      chargerTousProduitsActifsSite(siteId),
      chargerEmployesSite(siteId),
      chargerModesAveugleActifs(siteId),
      chargerModeJaugeageActif(siteId),
      chargerHorairesStation(siteId),
    ]);

    let alertesOuvertes = [];
    let comptages = { ouverts: new Set(), clotures: new Set() };
    let decisionsQuart = [];
    if (quartRow) {
      alertesOuvertes = await chargerAlertesOuvertesQuart(siteId, quartRow.id);
      comptages = await chargerComptagesQuart(quartRow.id);
      decisionsQuart = await chargerDecisionsQuart(quartRow.id);
    }

    // Ne signale les produits sensibles manquants que si un inventaire a
    // réellement démarré pour ce quart — sinon "tout manque" ne voudrait
    // rien dire (rien n'a encore pu être compté).
    const sensiblesNonComptesDetail = quartRow
      ? produitsSensibles.map(p => ({
          produit: p,
          manqueOuverture: !comptages.ouverts.has(p.id),
          manqueCloture: !comptages.clotures.has(p.id),
        })).filter(x => x.manqueOuverture || x.manqueCloture)
      : [];

    const synthese = construireSynthese(produitsActifsSite, comptages, jaugeageActif, quartRow, alertesOuvertes);
    const etat = quartRow ? libelleEtatQuart(quartRow, synthese, horaires) : null;

    renderTout({
      alertesOuvertes, sensiblesNonComptesDetail, employesSite, modesAveugleActifs, jaugeageActif, synthese,
      etat, produitsSensiblesTotal: produitsSensibles.length, decisionsQuart,
    });
    await genererRemarquesConseiller(alertesOuvertes, sensiblesNonComptesDetail, modesAveugleActifs, synthese);
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    managerCourant = employee;
    siteId = employee.site_id || 'vito-sainte-marie';
    demarrerHorloge();
    document.getElementById('titre').textContent = 'Contrôle inventaire';

    dateSelectionnee = dateISO();
    quartSelectionne = await quartDuMoment(siteId);

    await chargerEtAfficherTout();
  });
</script>
</body>
</html>
