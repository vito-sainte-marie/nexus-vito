  // Impact de premier ordre uniquement (04/08/2026) — jamais un chiffre
  // inventé sur une chaîne complète qu'on ne garantit pas avoir parcourue :
  // on compte les comptages qui référencent DIRECTEMENT celui-ci comme
  // comptage_source_id, on ne prétend pas recalculer toute la suite.
  async function chargerImpactCorrection(comptageId) {
    const { count, error } = await nexusClient.from('inventaire_comptages')
      .select('id', { count: 'exact', head: true }).eq('comptage_source_id', comptageId);
    if (error) { console.error('Chargement impact correction:', error); return 0; }
    return count || 0;
  }

  async function chargerEtAfficherCorrection() {
    const resultatEl = document.getElementById('correctionResultat');
    if (!resultatEl) return;
    resultatEl.innerHTML = '<div class="loading">Chargement…</div>';
    const quart = await chargerQuart(siteId, correctionForm.date, correctionForm.quart);
    if (!quart) { resultatEl.innerHTML = '<div class="empty">Aucun inventaire trouvé pour cette date et ce quart.</div>'; correctionChargee = null; return; }

    if (correctionForm.correctionType === 'mouvement_oublie') {
      correctionChargee = { quart, comptage: null, impact: 0 };
      resultatEl.innerHTML = renderFormulaireCorrectionCorps();
      wirerFormulaireCorrection();
      return;
    }
    if (!correctionForm.produitId) { resultatEl.innerHTML = '<div class="empty">Choisissez un produit.</div>'; correctionChargee = null; return; }
    const comptage = await chargerComptageActuel(correctionForm.produitId, quart.id, correctionForm.typeComptage);
    if (!comptage) { resultatEl.innerHTML = '<div class="empty">Aucun comptage enregistré pour ce produit à cette date, ce quart et cette phase.</div>'; correctionChargee = null; return; }
    const impact = await chargerImpactCorrection(comptage.id);
    correctionChargee = { quart, comptage, impact };
    resultatEl.innerHTML = renderFormulaireCorrectionCorps();
    wirerFormulaireCorrection();
  }

  function renderChampsCommunsCorrection() {
    return `
      <input type="text" id="correctionCommentaire" class="mouv-justif" placeholder="Motif (ex : erreur de saisie constatée lors du contrôle papier)">
      ${correctionForm.correctionType !== 'mouvement_oublie' ? `
      <div style="font-size:11.5px; color:var(--text-mid); margin:2px 0 10px;">
        <label style="display:flex; align-items:center; gap:6px; margin-bottom:4px; cursor:pointer;"><input type="radio" name="correctionPropagation" value="session_seule" checked> Corriger uniquement cette session</label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="radio" name="correctionPropagation" value="cascade"> Corriger et signaler les sessions suivantes pour recomptage</label>
      </div>` : ''}
      <button class="btn-primary" id="btnConfirmerCorrection" style="margin-top:0;">Confirmer la correction</button>
    `;
  }

  function renderFormulaireCorrectionCorps() {
    if (!correctionChargee) return '';
    if (correctionForm.correctionType === 'mouvement_oublie') {
      return `
        <div class="mouv-row">
          <select class="mouv-select" id="correctionTypeMouvement">${TYPES_MOUVEMENT_MANAGER.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}</select>
          <input type="number" inputmode="decimal" class="mouv-qte" id="correctionQuantiteMouvement" placeholder="Qté">
        </div>
        ${renderChampsCommunsCorrection()}
      `;
    }
    const c = correctionChargee.comptage;
    return `
      <div class="alerte-valeurs" style="margin-bottom:10px;"><span>Valeur initiale : <b>${fmtNum(c.quantite)}</b></span></div>
      <input type="number" inputmode="decimal" step="0.01" class="produit-input" id="correctionNouvelleValeur" placeholder="Nouvelle valeur" style="width:100%; margin-bottom:8px; text-align:left;">
      ${correctionChargee.impact > 0
        ? `<div class="mission-photo" style="color:var(--amber); margin-bottom:8px;">⚠️ ${correctionChargee.impact} comptage${correctionChargee.impact > 1 ? 's' : ''} ultérieur${correctionChargee.impact > 1 ? 's' : ''} référence${correctionChargee.impact > 1 ? 'nt' : ''} directement cette valeur.</div>`
        : `<div class="mission-photo" style="color:var(--text-dim); margin-bottom:8px;">Aucun comptage ultérieur ne dépend directement de cette valeur.</div>`}
      ${renderChampsCommunsCorrection()}
    `;
  }

  function renderSectionCorrectionRetroactive() {
    const optionsProduits = produitsPourCorrection.length
      ? Object.entries(produitsPourCorrection.reduce((acc, p) => {
          const cat = p.inventaire_categories ? p.inventaire_categories.nom : 'Autres';
          (acc[cat] = acc[cat] || []).push(p);
          return acc;
        }, {})).map(([cat, items]) => `<optgroup label="${cat}">${items.map(p => `<option value="${p.id}" ${p.id === correctionForm.produitId ? 'selected' : ''}>${p.designation}</option>`).join('')}</optgroup>`).join('')
      : `<option value="">Chargement des produits…</option>`;

    return `
      <div id="sectionCorrectionRetroactive" class="card" style="margin-bottom:10px; padding:14px;">
        <div class="ventes-desc" style="margin-bottom:12px;">Corrigez un produit sur une date et un quart précis, même après clôture. La valeur initiale n'est jamais supprimée — une nouvelle valeur est ajoutée à côté, avec le motif.</div>
        <div class="quart-select-row">
          <input type="date" id="correctionDate" class="date-input" value="${correctionForm.date || dateISO()}">
          <div class="quart-pill ${correctionForm.quart === 'matin' ? 'active' : ''}" data-correction-quart="matin">Matin</div>
          <div class="quart-pill ${correctionForm.quart === 'soir' ? 'active' : ''}" data-correction-quart="soir">Soir</div>
        </div>
        <select class="mouv-select" id="correctionType" style="width:100%; margin-bottom:8px;">
          <option value="erreur_saisie" ${correctionForm.correctionType === 'erreur_saisie' ? 'selected' : ''}>Corriger une erreur de saisie</option>
          <option value="stock_retenu" ${correctionForm.correctionType === 'stock_retenu' ? 'selected' : ''}>Modifier le stock retenu</option>
          <option value="mouvement_oublie" ${correctionForm.correctionType === 'mouvement_oublie' ? 'selected' : ''}>Ajouter un mouvement oublié</option>
        </select>
        ${correctionForm.correctionType !== 'mouvement_oublie' ? `
        <select class="mouv-select" id="correctionTypeComptage" style="width:100%; margin-bottom:8px;">
          <option value="ouverture" ${correctionForm.typeComptage === 'ouverture' ? 'selected' : ''}>Comptage d'ouverture</option>
          <option value="cloture" ${correctionForm.typeComptage === 'cloture' ? 'selected' : ''}>Comptage de clôture</option>
        </select>` : ''}
        <select class="mouv-select" id="correctionProduit" style="width:100%; margin-bottom:8px;">${optionsProduits}</select>
        <button class="btn-ghost" id="btnChargerCorrection" style="margin-top:0;">Charger</button>
        <div id="correctionResultat" style="margin-top:10px;">${correctionChargee ? renderFormulaireCorrectionCorps() : ''}</div>
      </div>
    `;
  }

  function wirerFormulaireCorrection() {
    const btnConfirmer = document.getElementById('btnConfirmerCorrection');
    if (btnConfirmer) btnConfirmer.addEventListener('click', appliquerCorrectionRetroactive);
  }

  async function appliquerCorrectionRetroactive() {
    const commentaireEl = document.getElementById('correctionCommentaire');
    const commentaire = commentaireEl ? commentaireEl.value.trim() : '';
    const propagationEl = document.querySelector('input[name="correctionPropagation"]:checked');
    const propagation = propagationEl ? propagationEl.value : 'session_seule';
    const btnConfirmer = document.getElementById('btnConfirmerCorrection');

    if (correctionForm.correctionType === 'mouvement_oublie') {
      const typeMouvEl = document.getElementById('correctionTypeMouvement');
      const qteEl = document.getElementById('correctionQuantiteMouvement');
      const qteSaisie = parseFloat(qteEl.value);
      if (!correctionForm.produitId) { alert('Choisissez un produit.'); return; }
      if (isNaN(qteSaisie) || qteSaisie < 0) { alert('Saisissez une quantité positive.'); return; }
      const infoType = TYPES_MOUVEMENT_MANAGER.find(t => t.value === typeMouvEl.value);
      const qte = infoType.sens === 'sortant' ? -Math.abs(qteSaisie) : Math.abs(qteSaisie);
      if (btnConfirmer) { btnConfirmer.disabled = true; btnConfirmer.textContent = 'Enregistrement…'; }
      const { error } = await nexusClient.from('inventaire_mouvements').insert({
        site: siteId, quart_id: correctionChargee.quart.id, produit_id: correctionForm.produitId,
        type_mouvement: typeMouvEl.value, quantite: qte, employee_id: managerCourant.id,
        justification: commentaire || null, reason_code: typeMouvEl.value, statut_validation: 'valide',
      });
      if (error) { console.error('Mouvement oublié:', error); alert('Erreur — réessayez.'); if (btnConfirmer) { btnConfirmer.disabled = false; btnConfirmer.textContent = 'Confirmer la correction'; } return; }
      await nexusClient.from('inventaire_corrections').insert({
        site: siteId, quart_id: correctionChargee.quart.id, produit_id: correctionForm.produitId,
        correction_type: 'mouvement_oublie', commentaire, operational_date: correctionForm.date, quart: correctionForm.quart,
        created_by: managerCourant.id, propagation_mode: 'session_seule', affected_sessions_count: 0, status: 'appliquee',
      });
      await nexusClient.from('inventaire_audit_log').insert({
        site: siteId, quart_id: correctionChargee.quart.id, entite_type: 'inventaire_mouvements', entite_id: null,
        action: 'ajout_mouvement_oublie', nouvelle_valeur: { type_mouvement: typeMouvEl.value, quantite: qte },
        acteur_id: managerCourant.id, motif: commentaire || null,
      });
      document.getElementById('correctionResultat').innerHTML = `<div class="alerte-note">✓ Mouvement ajouté rétroactivement (${infoType.label}, ${qte > 0 ? '+' : ''}${fmtNum(qte)}).</div>`;
      correctionChargee = null;
      return;
    }

    const nouvelleValeurEl = document.getElementById('correctionNouvelleValeur');
    const nouvelleValeur = parseFloat(nouvelleValeurEl.value);
    if (isNaN(nouvelleValeur)) { alert('Saisissez la nouvelle valeur.'); return; }
    const ancien = correctionChargee.comptage;
    if (btnConfirmer) { btnConfirmer.disabled = true; btnConfirmer.textContent = 'Enregistrement…'; }

    const { error: e1 } = await nexusClient.from('inventaire_comptages').insert({
      site: siteId, quart_id: ancien.quart_id, produit_id: ancien.produit_id, type_comptage: ancien.type_comptage,
      quantite: nouvelleValeur, comptage_source_id: ancien.id, quantite_transmise: ancien.quantite_transmise,
      employee_id: managerCourant.id, source: 'correction_manager', commentaire: commentaire || null, statut: 'valide',
    });
    if (e1) { console.error('Comptage corrigé:', e1); alert('Erreur — réessayez.'); if (btnConfirmer) { btnConfirmer.disabled = false; btnConfirmer.textContent = 'Confirmer la correction'; } return; }

    await nexusClient.from('inventaire_corrections').insert({
      site: siteId, quart_id: ancien.quart_id, produit_id: ancien.produit_id,
      correction_type: correctionForm.correctionType, old_value: ancien.quantite, new_value: nouvelleValeur,
      commentaire, operational_date: correctionForm.date, quart: correctionForm.quart,
      created_by: managerCourant.id, propagation_mode: propagation, affected_sessions_count: correctionChargee.impact,
      status: 'validee',
    });

    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, quart_id: ancien.quart_id, entite_type: 'inventaire_comptages', entite_id: ancien.id,
      action: 'correction_retroactive', ancienne_valeur: { quantite: ancien.quantite }, nouvelle_valeur: { quantite: nouvelleValeur },
      acteur_id: managerCourant.id, motif: commentaire || null,
    });

    // Cascade (04/08/2026, audit §26) : signale pour recomptage les
    // comptages directement dépendants plutôt que de prétendre les
    // recalculer automatiquement — honnête sur ce que NEXUS sait vraiment.
    if (propagation === 'cascade' && correctionChargee.impact > 0) {
      const { data: dependants } = await nexusClient.from('inventaire_comptages')
        .select('id, quart_id').eq('comptage_source_id', ancien.id);
      for (const dep of (dependants || [])) {
        await nexusClient.from('inventaire_alertes').insert({
          site: siteId, quart_id: dep.quart_id, produit_id: ancien.produit_id, type_alerte: 'ecart_ouverture',
          gravite: 'attention', valeur_attendue: nouvelleValeur, valeur_constatee: null,
          resolution: 'Recomptage nécessaire suite à une correction rétroactive du stock transmis.',
          categorie_anomalie: 'continuite',
        });
      }
    }

    document.getElementById('correctionResultat').innerHTML = `
      <div class="alerte-note">✓ Correction appliquée. Valeur initiale conservée : <b>${fmtNum(ancien.quantite)}</b> → nouvelle valeur : <b>${fmtNum(nouvelleValeur)}</b>.</div>
    `;
    correctionChargee = null;
  }

  // ------------------------------------------------------------
  // MODE SIMULATION TERRAIN (04/08/2026, audit §23-24, 29-32) — jamais
  // officiel : "le papier reste la référence opérationnelle" tant que la
  // simulation n'a pas été validée. Chaque session simulation vit dans
  // inventaire_quarts avec is_simulation=true (jamais confondue avec un
  // vrai quart, chargée via une requête filtrée sur ce champ).
  // ------------------------------------------------------------
  async function chargerOuCreerQuartSimulation() {
    const { data: existant, error: e1 } = await nexusClient.from('inventaire_quarts')
      .select('*').eq('site', siteId).eq('date', simulationForm.date).eq('quart', simulationForm.quart).eq('is_simulation', true).maybeSingle();
    if (e1) { console.error('Lecture quart simulation:', e1); return null; }
    if (existant) return existant;
    const { data: cree, error: e2 } = await nexusClient.from('inventaire_quarts').insert({
      site: siteId, date: simulationForm.date, quart: simulationForm.quart, statut: 'ouverture_en_cours',
      is_simulation: true, represented_employee_id: simulationForm.employeId || null, entered_by_user_id: managerCourant.id,
      ouvert_le: new Date().toISOString(),
    }).select().single();
    if (e2) { console.error('Création quart simulation:', e2); return null; }
    return cree;
  }

  async function chargerComptagesSimulation(quartId, phase) {
    const { data, error } = await nexusClient.from('inventaire_comptages')
      .select('produit_id, quantite').eq('quart_id', quartId).eq('type_comptage', phase).eq('source', 'simulation');
    if (error) { console.error('Chargement comptages simulation:', error); return {}; }
    const map = {};
    (data || []).forEach(r => { map[r.produit_id] = r.quantite; });
    return map;
  }

  // Agrégat pour le tableau de validation (audit §30) — uniquement des
  // moyennes sur des valeurs réellement saisies par le manager (papier_*) ou
  // réellement chronométrées (nexus_temps_minutes) : une session sans ces
  // champs renseignés n'entre simplement pas dans la moyenne, jamais
  // remplacée par une estimation.
  async function chargerStatsSimulation() {
    const { data, error } = await nexusClient.from('inventaire_quarts')
      .select('id, papier_produits_comptes, papier_temps_minutes, papier_corrections, nexus_temps_minutes')
      .eq('site', siteId).eq('is_simulation', true);
    if (error) { console.error('Stats simulation:', error); return { nb: 0 }; }
    const rows = data || [];
    const moyenne = (arr) => arr.length ? Math.round((arr.reduce((s, v) => s + v, 0) / arr.length) * 10) / 10 : null;
    return {
      nb: rows.length,
      tempsMoyenPapier: moyenne(rows.map(r => r.papier_temps_minutes).filter(v => v != null)),
      tempsMoyenNexus: moyenne(rows.map(r => r.nexus_temps_minutes).filter(v => v != null)),
      correctionsMoyennes: moyenne(rows.map(r => r.papier_corrections).filter(v => v != null)),
      nbAvecComparatif: rows.filter(r => r.papier_temps_minutes != null).length,
    };
  }

  function renderCorpsSimulation() {
    if (!produitsPourSimulation.length) return '<div class="loading">Chargement des produits…</div>';
    const groupes = produitsPourSimulation.reduce((acc, p) => {
      const cat = p.inventaire_categories ? p.inventaire_categories.nom : 'Autres';
      (acc[cat] = acc[cat] || []).push(p);
      return acc;
    }, {});
    const listeHtml = Object.entries(groupes).map(([cat, items]) => `
      <div class="cat-block">
        <div class="cat-head"><div class="cat-nom">${cat} (${items.length})</div></div>
        <div class="card">
          ${items.map(p => `
            <div class="produit-row">
              <div class="produit-nom-ligne"><span class="produit-nom">${p.designation}</span></div>
              <input type="number" inputmode="decimal" step="0.01" class="produit-input simulation-input" data-produit="${p.id}"
                     placeholder="Compté (papier)" value="${simulationSaisie[p.id] !== undefined ? simulationSaisie[p.id] : ''}" style="width:100%;">
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

    return `
      ${listeHtml}
      <div class="section-titre" style="margin-top:0;">Comparatif Papier / NEXUS pour cette session</div>
      <div class="mouv-row">
        <input type="number" class="mouv-qte" id="simulationPapierProduits" placeholder="Produits (papier)" style="flex:1;">
        <input type="number" class="mouv-qte" id="simulationPapierTemps" placeholder="Temps papier (min)" style="flex:1;">
        <input type="number" class="mouv-qte" id="simulationPapierCorrections" placeholder="Corrections (papier)" style="flex:1;">
      </div>
      <textarea id="simulationNotes" class="mouv-justif" placeholder="Commentaires de simulation (facultatif)" style="width:100%; min-height:60px; resize:vertical;"></textarea>
      <button class="btn-primary" id="btnEnregistrerSimulation" style="margin-top:8px;">Enregistrer cette phase (simulation)</button>
    `;
  }

  async function enregistrerSimulation() {
    const btn = document.getElementById('btnEnregistrerSimulation');
    if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
    document.querySelectorAll('.simulation-input').forEach(el => {
      const v = el.value === '' ? undefined : parseFloat(el.value);
      if (v !== undefined && !isNaN(v)) simulationSaisie[el.dataset.produit] = v;
    });
    let nbComptes = 0;
    for (const [produitId, quantite] of Object.entries(simulationSaisie)) {
      const { error } = await nexusClient.from('inventaire_comptages').insert({
        site: siteId, quart_id: simulationQuart.id, produit_id: produitId, type_comptage: simulationForm.phase,
        quantite, employee_id: simulationForm.employeId || null, source: 'simulation', statut: 'valide',
      });
      if (error) console.error('Comptage simulation:', error); else nbComptes++;
    }

    // Temps NEXUS réellement chronométré depuis l'ouverture de la session
    // (audit §29) — jamais une estimation, un vrai Date.now() de départ.
    const tempsNexusMinutes = simulationChrono ? Math.round(((Date.now() - simulationChrono) / 60000) * 10) / 10 : null;
    const papierProduitsEl = document.getElementById('simulationPapierProduits');
    const papierTempsEl = document.getElementById('simulationPapierTemps');
    const papierCorrectionsEl = document.getElementById('simulationPapierCorrections');
    const notesEl = document.getElementById('simulationNotes');
    const papierProduits = papierProduitsEl && papierProduitsEl.value !== '' ? parseInt(papierProduitsEl.value) : null;
    const papierTemps = papierTempsEl && papierTempsEl.value !== '' ? parseFloat(papierTempsEl.value) : null;
    const papierCorrections = papierCorrectionsEl && papierCorrectionsEl.value !== '' ? parseInt(papierCorrectionsEl.value) : null;
    const notes = notesEl ? notesEl.value.trim() : '';

    await nexusClient.from('inventaire_quarts').update({
      papier_produits_comptes: papierProduits, papier_temps_minutes: papierTemps, papier_corrections: papierCorrections,
      nexus_temps_minutes: tempsNexusMinutes, simulation_notes: notes || null,
    }).eq('id', simulationQuart.id);

    await nexusClient.from('inventaire_audit_log').insert({
      site: siteId, quart_id: simulationQuart.id, entite_type: 'inventaire_quarts', entite_id: simulationQuart.id,
      action: 'enregistrement_simulation', nouvelle_valeur: { phase: simulationForm.phase, nb_comptes: nbComptes },
      acteur_id: managerCourant.id,
    });

    document.getElementById('simulationCorps').innerHTML = `<div class="alerte-note">✓ ${nbComptes} produit${nbComptes > 1 ? 's' : ''} enregistré${nbComptes > 1 ? 's' : ''} en simulation (${simulationForm.phase}). Temps NEXUS mesuré : ${tempsNexusMinutes !== null ? tempsNexusMinutes + ' min' : '—'}.</div>`;
    simulationQuart = null; simulationSaisie = {}; simulationChrono = null;
    statsSimulation = await chargerStatsSimulation();
    const statsZone = document.getElementById('simulationStatsZone');
    if (statsZone) statsZone.innerHTML = renderStatsSimulation();
  }

  // Tableau de validation de la simulation (audit §30) — agrégat honnête :
  // n'affiche une moyenne que si au moins une session a réellement renseigné
  // ce champ, sinon affiche "—" plutôt qu'un zéro trompeur.
  function renderStatsSimulation() {
    if (!statsSimulation || statsSimulation.nb === 0) {
      return `<div class="empty">Aucune session de simulation enregistrée pour l'instant.</div>`;
    }
    const s = statsSimulation;
    const gain = (s.tempsMoyenPapier != null && s.tempsMoyenNexus != null) ? Math.round((s.tempsMoyenPapier - s.tempsMoyenNexus) * 10) / 10 : null;
    return `
      <div class="card" style="padding:4px 14px;">
        <div class="stat-row"><span class="stat-label">Sessions de simulation</span><span class="stat-value">${s.nb}</span></div>
        <div class="stat-row"><span class="stat-label">Temps moyen papier</span><span class="stat-value">${s.tempsMoyenPapier != null ? s.tempsMoyenPapier + ' min' : '—'}</span></div>
        <div class="stat-row"><span class="stat-label">Temps moyen NEXUS</span><span class="stat-value cyan">${s.tempsMoyenNexus != null ? s.tempsMoyenNexus + ' min' : '—'}</span></div>
        <div class="stat-row"><span class="stat-label">Corrections papier (moy.)</span><span class="stat-value">${s.correctionsMoyennes != null ? s.correctionsMoyennes : '—'}</span></div>
        ${gain !== null ? `<div class="stat-row"><span class="stat-label">Gain de temps NEXUS</span><span class="stat-value ${gain >= 0 ? 'cyan' : 'amber'}">${gain >= 0 ? '+' : ''}${gain} min</span></div>` : ''}
        <div class="stat-row"><span class="stat-label">Comparatifs renseignés</span><span class="stat-value">${s.nbAvecComparatif}/${s.nb}</span></div>
      </div>
    `;
  }

  function renderSectionSimulation() {
    const employes = (dernierCtx && dernierCtx.employesSite) ? dernierCtx.employesSite : [];
    const optionsEmployes = employes.map(e => `<option value="${e.id}" ${e.id === simulationForm.employeId ? 'selected' : ''}>${e.nom}</option>`).join('');
    return `
      <div id="sectionSimulationTerrain" class="card" style="margin-bottom:10px; padding:14px;">
        <div class="ventes-desc" style="margin-bottom:4px; color:var(--amber); font-weight:600;">Mode Simulation — cet inventaire sert à tester NEXUS. La feuille papier reste la référence officielle.</div>
        <div class="ventes-desc" style="margin-bottom:12px;">Saisissez après coup ce qu'un employé a compté sur la feuille papier. Rien ici ne modifie les stocks officiels ni ne génère d'évaluation employé.</div>
        <div class="quart-select-row">
          <input type="date" id="simulationDate" class="date-input" value="${simulationForm.date || dateISO()}">
          <div class="quart-pill ${simulationForm.quart === 'matin' ? 'active' : ''}" data-simulation-quart="matin">Matin</div>
          <div class="quart-pill ${simulationForm.quart === 'soir' ? 'active' : ''}" data-simulation-quart="soir">Soir</div>
        </div>
        <select class="mouv-select" id="simulationEmploye" style="width:100%; margin-bottom:8px;">
          <option value="">Employé représenté…</option>
          ${optionsEmployes}
        </select>
        <select class="mouv-select" id="simulationPhase" style="width:100%; margin-bottom:8px;">
          <option value="ouverture" ${simulationForm.phase === 'ouverture' ? 'selected' : ''}>Comptage d'ouverture</option>
          <option value="cloture" ${simulationForm.phase === 'cloture' ? 'selected' : ''}>Comptage de clôture</option>
        </select>
        <button class="btn-ghost" id="btnChargerSimulation" style="margin-top:0;">Charger / créer cette session de simulation</button>
        <div id="simulationCorps" style="margin-top:10px;">${simulationQuart ? renderCorpsSimulation() : ''}</div>
        <div class="section-titre" style="margin-top:18px;">Tableau de validation de la simulation</div>
        <div id="simulationStatsZone">${statsSimulation ? renderStatsSimulation() : '<div class="loading">Chargement…</div>'}</div>
      </div>
    `;
  }

  // Paramètres de contrôle inventaire (02/08/2026, évolution "Supervision
  // configurable des inventaires") : fréquence à laquelle CE manager
  // souhaite consulter une synthèse (quotidien/hebdo/mensuel/exception),
  // distincte de la fréquence de comptage terrain qui ne bouge jamais.
  // Chaque contrôle enregistre son changement séparément ('change', pas
  // 'input') pour ne pas écrire à chaque frappe.
  function renderParametresSupervision() {
    const p = parametresInventaire;
    const optionsFrequence = Object.entries(LABELS_FREQUENCE)
      .map(([val, label]) => `<option value="${val}" ${p.reviewFrequency === val ? 'selected' : ''}>${label}</option>`).join('');
    const optionsJourSemaine = JOURS_SEMAINE
      .map((j, i) => `<option value="${i}" ${p.weeklyReviewDay === i ? 'selected' : ''}>${j}</option>`).join('');
    const optionsJourMois = Array.from({ length: 28 }, (_, i) => i + 1)
      .map(j => `<option value="${j}" ${p.monthlyReviewDay === j ? 'selected' : ''}>${j}</option>`).join('');
    return `
      <div class="card" style="margin-bottom:10px;">
        <div class="param-ligne">
          <label for="paramFrequence">Fréquence de supervision</label>
          <select class="param-input" id="paramFrequence">${optionsFrequence}</select>
        </div>
        ${p.reviewFrequency === 'weekly' ? `
        <div class="param-ligne">
          <label for="paramJourSemaine">Jour de synthèse hebdomadaire</label>
          <select class="param-input" id="paramJourSemaine">${optionsJourSemaine}</select>
        </div>` : ''}
        ${p.reviewFrequency === 'monthly' ? `
        <div class="param-ligne">
          <label for="paramJourMois">Jour de synthèse mensuelle</label>
          <select class="param-input" id="paramJourMois">${optionsJourMois}</select>
        </div>` : ''}
        ${p.reviewFrequency !== 'exception_only' ? `
        <div class="param-ligne">
          <label for="paramHeure">Heure souhaitée de synthèse</label>
          <input type="time" class="param-input" id="paramHeure" value="${p.reviewTime || '20:00'}">
        </div>` : ''}
        <div class="param-ligne">
          <label for="paramSeuilQte">Seuil d'écart en quantité</label>
          <input type="number" min="0" step="0.5" class="param-input" id="paramSeuilQte" value="${p.quantityAlertThreshold}">
        </div>
        <div class="param-ligne">
          <label for="paramSeuilValeur">Seuil d'écart en valeur (€)</label>
          <input type="number" min="0" step="1" class="param-input" id="paramSeuilValeur" placeholder="Non défini" value="${p.valueAlertThreshold != null ? p.valueAlertThreshold : ''}">
        </div>
        <div class="param-ligne">
          <label for="paramDelaiCloture">Délai maximal de clôture</label>
          <select class="param-input" id="paramDelaiCloture">
            ${[15, 30, 45, 60, 90, 120].map(m => `<option value="${m}" ${p.closureDelayMinutes === m ? 'selected' : ''}>${m} min</option>`).join('')}
          </select>
        </div>
        <div class="param-ligne">
          <label>Alertes immédiates</label>
          <div class="toggle-switch ${p.immediateAlertsEnabled ? 'on' : ''}" data-mode="alertes-immediates" data-actif="${p.immediateAlertsEnabled ? '1' : '0'}">
            <div class="toggle-knob"></div>
          </div>
        </div>
        <span class="param-enregistre" id="paramEnregistre">✓ Enregistré</span>
      </div>
      <div class="param-note">Ces seuils déclenchent une alerte quel que soit le rythme de supervision choisi ci-dessus (voir "Catégories nécessitant une alerte immédiate" ci-dessous).</div>
      <div class="section-titre" style="margin-top:0;">Catégories nécessitant une alerte immédiate</div>
      <div class="card">
        ${categoriesSite.length === 0 ? '<div class="empty">Aucune catégorie active.</div>' : `
        <div class="param-checklist">
          ${categoriesSite.map(c => {
            const actif = (p.immediateAlertCategoryIds || []).includes(c.id);
            return `<label class="param-check-item ${actif ? 'actif' : ''}"><input type="checkbox" class="param-cat-check" data-cat="${c.id}" ${actif ? 'checked' : ''}>${c.nom}</label>`;
          }).join('')}
        </div>`}
      </div>
    `;
  }

  // Détail d'une décision individuelle du quart sélectionné (02/08/2026,
  // demande de Frédéric) — plus de badge date/quart : tout appartient déjà
  // au même quart affiché, ça n'a plus besoin d'être répété ligne par ligne.
  function renderDetailDecisionItem(h) {
    const produit = h.inventaire_zone_produit ? h.inventaire_zone_produit.designation : 'Produit';
    const decision = DECISIONS.find(d => d.value === h.resolution);
    const heure = h.resolue_le ? new Date(h.resolue_le).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
    return `
      <div class="histo-item">
        <div class="histo-top">
          <b>${produit}</b>
          <span class="histo-quart">${heure}</span>
        </div>
        <div class="histo-decision">${decision ? decision.label : (h.resolution || '—')}${h.commentaire_manager ? ' — ' + h.commentaire_manager : ''}</div>
      </div>
    `;
  }

  // État du quart (02/08/2026, demande de Frédéric) : bandeau contextualisé
  // séparé de la Progression chiffrée — répond à "où en est ce quart, là,
  // maintenant" avant de détailler les chiffres.
  function renderEtatQuartCard(etat) {
    // Rouvrir la clôture (02/08/2026, demande de Frédéric) : uniquement
    // proposé quand le quart est effectivement clôturé — le manager doit
    // toujours pouvoir débloquer un inventaire déjà validé, même par erreur
    // ou par une clôture prématurée.
    const peutRouvrir = quartRow && quartRow.statut === 'cloture';
    return `
      <div class="etat-quart-card ${etat.urgence !== 'normal' ? etat.urgence : ''}">
        <div class="etat-quart-titre">État du quart</div>
        <div class="etat-quart-texte">${etat.texte}</div>
        ${peutRouvrir ? (rouvertureFormOuvert ? `
          <div style="margin-top:10px;">
            <input type="text" id="motifRouverture" class="alerte-commentaire-input" placeholder="Motif de la réouverture (ex : comptages incomplets à corriger)">
            <div class="decision-row">
              <button class="btn-decision valider" id="btnConfirmerRouverture">Confirmer la réouverture</button>
              <button class="btn-decision" id="btnAnnulerRouverture">Annuler</button>
            </div>
          </div>
        ` : `<button class="btn-inline-lien" id="btnRouvrirCloture" style="margin-top:8px;">Rouvrir la clôture pour corriger les comptages</button>`) : ''}
      </div>
    `;
  }

  // Sélecteur de période (02/08/2026, supervision configurable) : permet à
  // un manager qui contrôle chaque semaine ou chaque mois — pas seulement
  // au quotidien — de choisir son propre rythme d'analyse, sans jamais
  // toucher à la fréquence de comptage terrain (toujours par quart).
  function renderSelecteurPeriode() {
    const options = ['jour', 'semaine', 'mois', 'personnalisee'];
    return `
      <div class="periode-select-row">
        ${options.map(o => `<div class="periode-pill ${periodeSelectionnee === o ? 'active' : ''}" data-periode="${o}">${LABELS_PERIODE[o]}</div>`).join('')}
      </div>
      ${periodeSelectionnee === 'personnalisee' ? `
      <div class="periode-perso-row">
        <input type="date" id="periodeDebutInput" class="date-input" value="${periodePersoDebut || dateSelectionnee}">
        <span class="periode-perso-sep">→</span>
        <input type="date" id="periodeFinInput" class="date-input" value="${periodePersoFin || dateSelectionnee}">
      </div>` : ''}
    `;
  }

  // "État de la période" (bloc 1/4 en vue semaine/mois/personnalisée) —
  // recalculé à chaque fois par generate_inventory_review, jamais une
  // valeur figée : si un manager rouvre une clôture ou change une décision
  // après coup, la synthèse suivante reflète l'état réel des données.
  function renderEtatPeriodeCard(review, bornes) {
    const debutFmt = new Date(bornes.debut + 'T00:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
    const finFmt = new Date(bornes.fin + 'T00:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
    return `
      <div class="synthese-card">
        <div class="synthese-titre">État de la période</div>
        <div class="param-note" style="padding-top:0;">${debutFmt} → ${finFmt}</div>
        <div class="synthese-ligne"><span>Comptages enregistrés</span><span class="synthese-valeur">${review.totalCounts}</span></div>
        <div class="synthese-ligne"><span>Catégories terminées</span><span class="synthese-valeur ${review.completedCategories ? 'green' : ''}">${review.completedCategories}</span></div>
        <div class="synthese-ligne"><span>Comptages manquants</span><span class="synthese-valeur ${review.missingCounts ? 'amber' : 'green'}">${review.missingCounts}</span></div>
        <div class="synthese-ligne"><span>Écarts détectés</span><span class="synthese-valeur ${review.totalDiscrepancies ? 'amber' : 'green'}">${review.totalDiscrepancies}</span></div>
        <div class="synthese-ligne"><span>Écarts encore ouverts</span><span class="synthese-valeur ${review.openDiscrepancies ? 'amber' : 'green'}">${review.openDiscrepancies}</span></div>
        <div class="synthese-ligne"><span>Décisions prises</span><span class="synthese-valeur">${review.resolvedDiscrepancies}</span></div>
        <div class="synthese-ligne"><span>Démarque potentielle estimée</span><span class="synthese-valeur ${review.estimatedValue ? 'amber' : ''}">${fmtEuros(review.estimatedValue)}</span></div>
      </div>
    `;
  }

  // "À terminer" en vue période : catégories qui ont encore des écarts
  // ouverts ou n'ont pas atteint leur nombre de comptages attendu sur la
  // période — pas une liste produit par produit (déjà disponible au jour).
  function renderCategoriesPeriode(categorySummary) {
    const concernees = (categorySummary || []).filter(c => c.discrepancies > 0 || c.openAlerts > 0);
    if (concernees.length === 0) return '<div class="empty">Aucune catégorie instable sur cette période.</div>';
    return `<div class="card">${concernees.map(c => `
      <div class="synthese-ligne">
        <span>${c.categoryName}</span>
        <span class="synthese-valeur ${c.openAlerts ? 'amber' : ''}">${c.discrepancies} écart${c.discrepancies > 1 ? 's' : ''}${c.openAlerts ? ` · ${c.openAlerts} ouvert${c.openAlerts > 1 ? 's' : ''}` : ''}</span>
      </div>
    `).join('')}</div>`;
  }

  // Produits récurrents (repeatedProducts) — utile dès la vue hebdomadaire
  // pour repérer un produit qui décale à chaque contrôle, pas seulement une
  // fois isolée.
  function renderProduitsRecurrents(repeatedProducts) {
    if (!repeatedProducts || repeatedProducts.length === 0) return '';
    return `
      <div class="section-titre">Produits récurrents sur la période</div>
      <div class="card">
        ${repeatedProducts.map(p => `
          <div class="synthese-ligne">
            <span>${p.productName}</span>
            <span class="synthese-valeur amber">${p.occurrenceCount}× · ${p.estimatedValue ? fmtEuros(p.estimatedValue) : fmtNum(p.totalDifference) + ' u.'}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Progression du quart (02/08/2026, demande de Frédéric — remplace
  // "Synthèse du quart") : pourcentage + barre visuelle en tête, pour que le
  // manager comprenne l'avancement sans lire toutes les lignes.
  // Bannière de clôture cohérente avec l'état temporel (02/08/2026, demande
  // de Frédéric) : avant, "Clôture impossible..." en amber dès qu'il restait
  // des comptages manquants, même à 18h06 pour une clôture normale à 19h40 —
  // contredisait la carte État du quart, déjà nuancée. Les deux suivent
  // maintenant la même logique d'urgence (normal/proche/retard).
  // Brief Inventaire (04/08/2026, audit §21) : "le manager ne relit plus
  // toute la feuille, il ouvre uniquement les cartes d'anomalies" — un
  // condensé des 5 informations listées dans l'audit, calculé uniquement à
  // partir de synthese/alertesOuvertes/decisionsQuart déjà chargés (jamais
  // un second calcul divergent de renderSyntheseQuart en dessous).
  function renderBriefInventaire(synthese, alertesOuvertes, decisionsQuart, importDeceniumFait) {
    const anomaliesDetectees = alertesOuvertes.length + decisionsQuart.length;
    return `
      <div class="section-titre">Brief Inventaire</div>
      <div class="synthese-card">
        <div class="synthese-ligne"><span>Catégories terminées</span><span class="synthese-valeur ${synthese.categoriesTerminees < synthese.categoriesTotal ? 'amber' : 'green'}">${synthese.categoriesTerminees} / ${synthese.categoriesTotal}</span></div>
        <div class="synthese-ligne"><span>Produits contrôlés</span><span class="synthese-valeur">${decisionsQuart.length}</span></div>
        <div class="synthese-ligne"><span>Anomalies détectées</span><span class="synthese-valeur ${anomaliesDetectees ? 'amber' : 'green'}">${anomaliesDetectees}</span></div>
        <div class="synthese-ligne"><span>Anomalies expliquées</span><span class="synthese-valeur ${decisionsQuart.length ? 'green' : ''}">${decisionsQuart.length}</span></div>
        <div class="synthese-ligne"><span>Décisions nécessaires</span><span class="synthese-valeur ${alertesOuvertes.length ? 'amber' : 'green'}">${alertesOuvertes.length}</span></div>
        <div class="synthese-ligne"><span>Import Decenium</span><span class="synthese-valeur ${importDeceniumFait ? 'green' : 'amber'}">${importDeceniumFait ? 'Fait' : 'Manquant'}</span></div>
      </div>
      ${alertesOuvertes.length > 0
        ? `<div style="font-size:11px; color:var(--text-dim); margin:6px 2px 14px;">Ouvrez uniquement les cartes d'anomalies dans « À contrôler » — le reste est déjà à jour.</div>`
        : `<div style="font-size:11px; color:var(--text-dim); margin:6px 2px 14px;">Aucune anomalie à traiter pour l'instant.</div>`}
    `;
  }

  function renderSyntheseQuart(s, etat) {
    const phaseLabel = s.phase === 'clotures' ? 'comptés (clôture)' : 'comptés';
    const urgence = etat ? etat.urgence : 'normal';
    let clotureClasse, clotureTexte;
    if (s.manquants === 0) {
      clotureClasse = 'possible'; clotureTexte = 'Clôture possible';
    } else if (s.phase !== 'clotures' || urgence === 'normal') {
      clotureClasse = 'attente';
      clotureTexte = s.phase === 'clotures'
        ? "Le comptage de clôture n'a pas encore commencé."
        : "Clôture impossible tant que l'inventaire d'ouverture n'est pas terminé.";
    } else if (urgence === 'proche') {
      clotureClasse = 'impossible';
      clotureTexte = 'Clôture impossible tant que les comptages manquants ne sont pas terminés';
    } else {
      clotureClasse = 'retard';
      clotureTexte = `Clôture en retard — ${s.manquants} produit${s.manquants > 1 ? 's' : ''} non compté${s.manquants > 1 ? 's' : ''}.`;
    }
    return `
      <div class="synthese-card">
        <div class="synthese-titre">Progression</div>
        <div class="synthese-pct-row">
          <span class="synthese-pct">${s.pourcentage}%</span>
          <span class="synthese-pct-label">du comptage ${s.phase === 'clotures' ? 'de clôture' : "d'ouverture"} terminé</span>
        </div>
        <div class="synthese-barre"><div class="synthese-remplie" style="width:${s.pourcentage}%"></div></div>
        <div class="synthese-ligne"><span>Produits ${phaseLabel}</span><span class="synthese-valeur ${s.manquants ? 'amber' : 'green'}">${s.comptes} / ${s.total}</span></div>
        <div class="synthese-ligne"><span>Catégories terminées</span><span class="synthese-valeur ${s.categoriesTerminees < s.categoriesTotal ? 'amber' : 'green'}">${s.categoriesTerminees} / ${s.categoriesTotal}</span></div>
        <div class="synthese-ligne"><span>Écarts à contrôler</span><span class="synthese-valeur ${s.ecartsAControler ? 'amber' : 'green'}">${s.ecartsAControler}</span></div>
        <div class="synthese-ligne"><span>Comptages manquants</span><span class="synthese-valeur ${s.manquants ? 'amber' : 'green'}">${s.manquants}</span></div>
        <div class="synthese-cloture ${clotureClasse}">${clotureTexte}</div>
      </div>
    `;
  }

  // Catégories manquantes cliquables (02/08/2026, demande de Frédéric) :
  // déplie la zone concernée (dérivée des vraies données produit, jamais un
  // "responsable" inventé), le statut et la liste des produits manquants.
  function renderCategorieManquante(c) {
    const ouvert = categoriesOuvertes.has(c.nom);
    return `
      <div class="categorie-manquante" data-cat="${c.nom}">
        <div class="categorie-manquante-top">
          <span>${c.nom}<span class="categorie-manquante-chevron ${ouvert ? 'open' : ''}">›</span></span>
          <span class="categorie-manquante-valeur">${c.total - c.comptes}</span>
        </div>
        ${ouvert ? `
          <div class="categorie-manquante-detail">
            <div>Zone : <b>${c.zoneLabel}</b></div>
            <div>Statut : <b>${c.statutLabel}</b></div>
            <div class="categorie-manquante-liste">${c.produitsManquants.slice(0, 8).join(' · ')}${c.produitsManquants.length > 8 ? '…' : ''}</div>
          </div>
        ` : ''}
      </div>
    `;
  }

  // Décisions du quart (02/08/2026, demande de Frédéric — remplace le
  // doublon "Décisions du quart" / "Décisions prises" qui affichait deux
  // chiffres différents, 70 vs 30, parce qu'ils portaient sur des
  // périmètres différents) : une seule source de vérité, scopée au quart
  // sélectionné, avec un détail dépliable plutôt qu'un second bloc séparé.
  // L'audit multi-quarts existe déjà sur NEXUS-Journal-v1.html.
  function renderResumeDecisionsQuart(decisionsQuart, titre) {
    const compte = { validee: 0, recomptage: 0, erreur_saisie: 0, demarque: 0, explication: 0 };
    decisionsQuart.forEach(d => { if (compte[d.resolution] !== undefined) compte[d.resolution]++; });
    const total = decisionsQuart.length;
    const individuels = decisionsQuart.filter(d => d.resolution !== 'validee');
    const valideeNoms = decisionsQuart.filter(d => d.resolution === 'validee')
      .map(d => d.inventaire_zone_produit ? d.inventaire_zone_produit.designation : 'Produit');
    return `
      <div class="synthese-card">
        <div class="synthese-titre">${titre || 'Décisions du quart'}</div>
        <div class="synthese-ligne"><span>Écarts validés sans action</span><span class="synthese-valeur">${compte.validee}</span></div>
        <div class="synthese-ligne"><span>Recomptages demandés</span><span class="synthese-valeur ${compte.recomptage ? 'amber' : ''}">${compte.recomptage}</span></div>
        <div class="synthese-ligne"><span>Corrections acceptées</span><span class="synthese-valeur">${compte.erreur_saisie}</span></div>
        <div class="synthese-ligne"><span>Alertes maintenues</span><span class="synthese-valeur ${compte.demarque ? 'amber' : ''}">${compte.demarque}</span></div>
        ${total > 0 ? `<button class="btn-inline-lien" id="btnDetailDecisions">${detailDecisionsOuvert ? 'Masquer le détail' : `Voir le détail des ${total} décision${total > 1 ? 's' : ''}`}</button>` : ''}
        ${detailDecisionsOuvert ? `
          <div style="margin-top:10px;">
            ${individuels.map(h => renderDetailDecisionItem(h)).join('')}
            ${valideeNoms.length ? `<div class="decision-groupe-liste">${compte.validee} validé${compte.validee > 1 ? 's' : ''} sans action : ${valideeNoms.join(' · ')}</div>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }

  function renderTout(ctx) {
    dernierCtx = ctx;
    const { alertesOuvertes, sensiblesNonComptesDetail, employesSite, modesAveugleActifs, jaugeageActif, synthese, etat, produitsSensiblesTotal, decisionsQuart, review, bornes, alertesPeriode, decisionsPeriode } = ctx;
    const modesMap = Object.fromEntries(modesAveugleActifs.map(m => [m.employee_id, m]));

    // Vue par exception (02/08/2026, section 4 du cahier des charges) :
    // ne montre, dans le bloc "À contrôler" d'une période, que les écarts
    // qui dépassent réellement les seuils configurés ou qui touchent une
    // catégorie classée "alerte immédiate" — activée par défaut si le
    // manager a choisi ce rythme de supervision, mais reste un filtre
    // manuel qu'il peut basculer à tout moment.
    function depasseSeuilException(a) {
      const ecartAbs = (a.valeur_constatee != null && a.valeur_attendue != null) ? Math.abs(a.valeur_constatee - a.valeur_attendue) : null;
      const depasseQte = ecartAbs != null && ecartAbs > (parametresInventaire.quantityAlertThreshold ?? 1);
      const depasseValeur = parametresInventaire.valueAlertThreshold != null && a.valeur_estimee != null && a.valeur_estimee > parametresInventaire.valueAlertThreshold;
      const categorieSensible = a.inventaire_zone_produit && a.inventaire_zone_produit.categorie_id
        && (parametresInventaire.immediateAlertCategoryIds || []).includes(a.inventaire_zone_produit.categorie_id);
      return depasseQte || depasseValeur || categorieSensible || a.gravite === 'critique';
    }
    const alertesPeriodeAffichees = periodeSelectionnee !== 'jour' && filtreExceptionActif
      ? (alertesPeriode || []).filter(depasseSeuilException)

  async function chargerEtAfficherTout() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';

    quartRow = await chargerQuart(siteId, dateSelectionnee, quartSelectionne);

    const [produitsSensibles, produitsActifsSite, employesSite, modesAveugleActifs, jaugeageActif, horaires, parametresChargés, categories] = await Promise.all([
      chargerProduitsSensibles(siteId),
      chargerTousProduitsActifsSite(siteId),
      chargerEmployesSite(siteId),
      chargerModesAveugleActifs(siteId),
      chargerModeJaugeageActif(siteId),
      chargerHorairesStation(siteId),
      chargerParametresInventaire(siteId),
      chargerCategoriesSite(siteId),
    ]);
    parametresInventaire = parametresChargés;
    categoriesSite = categories;
    SEUIL_DEMARQUE = parametresInventaire.quantityAlertThreshold || DEFAULTS_PARAMETRES_INVENTAIRE.quantityAlertThreshold;
    if (!filtreExceptionInitialise) {
      filtreExceptionActif = parametresInventaire.reviewFrequency === 'exception_only';
      filtreExceptionInitialise = true;
    }

    let alertesOuvertes = [];
    let comptages = { ouverts: new Set(), clotures: new Set() };
    let decisionsQuart = [];
    if (quartRow) {
      alertesOuvertes = await chargerAlertesOuvertesQuart(siteId, quartRow.id);
      comptages = await chargerComptagesQuart(quartRow.id);
      decisionsQuart = await chargerDecisionsQuart(quartRow.id);
    }

    // Ne signale les produits sensibles manquants que si un inventaire a
    // réellement démarré pour ce quart — sinon "tout manque" ne voudrait
    // rien dire (rien n'a encore pu être compté).
    const sensiblesNonComptesDetail = quartRow
      ? produitsSensibles.map(p => ({
          produit: p,
          manqueOuverture: !comptages.ouverts.has(p.id),
          manqueCloture: !comptages.clotures.has(p.id),
        })).filter(x => x.manqueOuverture || x.manqueCloture)
      : [];

    const synthese = construireSynthese(produitsActifsSite, comptages, jaugeageActif, quartRow, alertesOuvertes);
    const etat = quartRow ? libelleEtatQuart(quartRow, synthese, horaires) : null;

    // Vues semaine/mois/personnalisée (02/08/2026, supervision configurable) :
    // synthèse recalculée à partir des données sources par
    // generate_inventory_review, jamais stockée comme seule vérité côté
    // client. Le contrôle quotidien (par quart) ci-dessus reste inchangé.
    let review = null, bornes = null, alertesPeriode = [], decisionsPeriode = [];
    if (periodeSelectionnee !== 'jour') {
      bornes = bornesPeriode();
      const typeRevue = periodeSelectionnee === 'semaine' ? 'weekly' : periodeSelectionnee === 'mois' ? 'monthly' : 'daily';
      [review, alertesPeriode, decisionsPeriode] = await Promise.all([
        chargerReviewPeriode(siteId, bornes.debut, bornes.fin, filtreExceptionActif ? 'exception_only' : typeRevue),
        chargerAlertesOuvertesPeriode(siteId, bornes.debut, bornes.fin),
        chargerDecisionsPeriode(siteId, bornes.debut, bornes.fin),
      ]);
    }

    // Import Decenium manquant (04/08/2026, audit §21 — Brief Inventaire du
    // manager) : un vrai comptage de lignes importées pour CE quart, jamais
    // une supposition — voir inventaire_ventes_import, déjà alimentée par
    // comparerVentesQuart().
    let importDeceniumFait = false;
    if (quartRow) {
      const { count, error: eImport } = await nexusClient.from('inventaire_ventes_import')
        .select('id', { count: 'exact', head: true }).eq('quart_id', quartRow.id);
      if (eImport) console.error('Statut import Decenium:', eImport);
      importDeceniumFait = (count || 0) > 0;
    }

    renderTout({
      alertesOuvertes, sensiblesNonComptesDetail, employesSite, modesAveugleActifs, jaugeageActif, synthese,
      etat, produitsSensiblesTotal: produitsSensibles.length, decisionsQuart, review, bornes, alertesPeriode, decisionsPeriode,
      importDeceniumFait,
    });
    if (periodeSelectionnee === 'jour') await genererRemarquesConseiller(alertesOuvertes, sensiblesNonComptesDetail, modesAveugleActifs, synthese);
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    managerCourant = employee;
    siteId = employee.site_id || 'vito-sainte-marie';
    demarrerHorloge();
    document.getElementById('titre').textContent = 'Contrôle inventaire';

    dateSelectionnee = dateISO();
    quartSelectionne = await quartDuMoment(siteId);

    await chargerEtAfficherTout();
  });
</script>
</body>
</html>
