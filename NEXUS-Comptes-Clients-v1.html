<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Comptes Clients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --cyan-dim:rgba(79,195,217,0.1);
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:20px 20px 14px; position:relative;}
  .back-btn{
    position:absolute; top:18px; left:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5; cursor:pointer;
  }
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:20px; font-weight:600; margin-top:4px;}
  .soustitre{font-size:12.5px; color:var(--text-mid); margin-top:4px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .content{flex:1; padding-bottom:40px;}
  .section{padding:0 20px 20px;}

  /* KPI */
  .kpi-scroll{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; padding:16px 20px 4px;}
  .kpi-box{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px 10px;}
  .kpi-box .kl{font-family:var(--mono); font-size:8.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; line-height:1.3;}
  .kpi-box .kv{font-family:var(--mono); font-size:22px; font-weight:700; margin-top:6px;}
  .kpi-box.kb-vert .kv{color:var(--green);}
  .kpi-box.kb-orange .kv{color:var(--amber);}
  .kpi-box.kb-rouge .kv{color:var(--red);}
  .kpi-box.kb-gris .kv{color:var(--text-mid);}

  /* Recherche + filtres */
  .search-wrap{padding:16px 20px 0;}
  .search-box{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:12px 14px;}
  .search-box input{flex:1; background:none; border:none; outline:none; color:var(--text); font-family:var(--sans); font-size:16px;}
  .search-box input::placeholder{color:var(--text-dim);}
  .filtres-scroll{display:flex; gap:8px; overflow-x:auto; padding:12px 20px 4px; -webkit-overflow-scrolling:touch;}
  .filtres-scroll::-webkit-scrollbar{display:none;}
  .filtre-chip{
    flex:none; font-family:var(--mono); font-size:11px; font-weight:600; padding:8px 13px; border-radius:20px;
    background:var(--panel); border:1px solid var(--hairline); color:var(--text-mid); white-space:nowrap; cursor:pointer;
  }
  .filtre-chip.actif{background:var(--cyan-dim); border-color:rgba(79,195,217,0.4); color:var(--cyan);}

  /* Cartes client */
  .carte-client{background:var(--panel); border:1px solid var(--hairline); border-left:3px solid var(--text-dim); border-radius:12px; padding:16px; margin-top:12px; cursor:pointer;}
  .carte-client.st-vert{border-left-color:var(--green);}
  .carte-client.st-orange{border-left-color:var(--amber);}
  .carte-client.st-rouge{border-left-color:var(--red);}
  .carte-client.st-gris{border-left-color:var(--text-dim);}
  .cc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .cc-nom{font-size:15.5px; font-weight:700; line-height:1.3;}
  .cc-code{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:2px;}
  .cc-statut{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; font-weight:700; padding:4px 9px; border-radius:12px; white-space:nowrap;}
  .cc-statut.st-vert{background:var(--green-dim); color:var(--green);}
  .cc-statut.st-orange{background:var(--amber-dim); color:var(--amber);}
  .cc-statut.st-rouge{background:var(--red-dim); color:var(--red);}
  .cc-statut.st-gris{background:var(--panel-raised); color:var(--text-mid);}
  .cc-contact{font-size:12.5px; color:var(--text-mid); margin-top:10px;}
  .cc-email{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px;}
  .cc-ligne{font-size:12px; color:var(--text-mid); margin-top:6px; display:flex; align-items:center; gap:6px;}
  .cc-mode{margin-top:10px; font-family:var(--mono); font-size:10px; color:var(--cyan); text-transform:uppercase; letter-spacing:0.03em;}
  .cc-ouvrir{margin-top:12px; font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--cyan); text-transform:uppercase; letter-spacing:0.04em;}

  .empty-state{text-align:center; padding:50px 24px; color:var(--text-dim);}
  .empty-state .es-icon{font-size:34px; margin-bottom:14px;}
  .empty-state .es-titre{font-size:14.5px; color:var(--text-mid); font-weight:600; margin-bottom:6px;}
  .empty-state .es-desc{font-size:12.5px; line-height:1.6;}

  .fab{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    width:calc(100% - 40px); max-width:420px; background:var(--cyan); color:#062026; font-weight:700; font-size:14px;
    text-align:center; padding:15px; border-radius:14px; border:none; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:50;
  }
  .fab:active{opacity:0.85;}

  /* Fiche client */
  .fiche-hero{background:linear-gradient(180deg, var(--panel) 0%, var(--panel-raised) 100%); border:1px solid var(--hairline); border-radius:16px; padding:20px; margin:16px 20px 0;}
  .fh-nom{font-size:18px; font-weight:700;}
  .fh-code{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:4px;}
  .fh-inactif{display:inline-block; margin-top:10px; font-family:var(--mono); font-size:10px; color:var(--text-dim); background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px; padding:4px 9px;}

  .bloc{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:16px; margin-top:14px;}
  .bloc-titre{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--cyan); margin-bottom:12px;}
  .champ-ligne{margin-bottom:12px;}
  .champ-ligne:last-child{margin-bottom:0;}
  .champ-label{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;}
  .champ-valeur{font-size:14px; color:var(--text);}
  .champ-valeur.vide{color:var(--text-dim); font-style:italic;}
  /* 13/08/2026 — bloc "Historique" de la fiche client : liste des factures
     avec bouton d'envoi (voir renderFacturesBloc / envoyerFacture). */
  .facture-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .facture-row:last-child{border-bottom:none;}
  .facture-info{flex:1; min-width:0;}
  .facture-nom{font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .facture-meta{font-size:11px; color:var(--text-mid); margin-top:2px;}
  .btn-envoyer{flex-shrink:0; font-family:var(--sans); font-size:11.5px; font-weight:700; color:#062026; background:var(--cyan); border:none; border-radius:9px; padding:8px 12px; cursor:pointer;}
  .btn-envoyer:disabled{background:var(--panel-raised); color:var(--text-dim); cursor:default;}

  input[type=text], input[type=email], input[type=tel], input, select, textarea{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:9px;
    padding:11px 12px; color:var(--text); font-family:var(--sans); font-size:16px;
  }
  textarea{min-height:70px; resize:vertical; font-family:var(--sans);}
  select{-webkit-appearance:none; appearance:none;}
  label.lbl{display:block; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; margin:14px 0 6px;}
  label.lbl:first-child{margin-top:0;}

  .check-row{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .check-row:last-child{border-bottom:none;}
  .check-row input[type=checkbox]{width:20px; height:20px; flex:none; margin-top:1px; accent-color:var(--cyan);}
  .check-row .cr-texte{font-size:13px; line-height:1.4;}
  .check-row .cr-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}

  .btn-primary{width:100%; background:var(--cyan); color:#062026; font-weight:700; font-size:14px; text-align:center; padding:14px; border-radius:12px; border:none; cursor:pointer; margin-top:16px;}
  .btn-primary:disabled{opacity:0.5;}
  .btn-ghost{width:100%; background:var(--panel-raised); color:var(--text-mid); font-weight:600; font-size:13px; text-align:center; padding:13px; border-radius:12px; border:1px solid var(--hairline); cursor:pointer; margin-top:10px;}
  .btn-danger-text{width:100%; background:none; color:var(--red); font-size:12.5px; text-align:center; padding:12px; border:none; cursor:pointer; margin-top:6px;}

  .radio-grid{display:flex; flex-direction:column; gap:8px;}
  .radio-opt{display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:9px; cursor:pointer;}
  .radio-opt.actif{border-color:var(--cyan); background:rgba(79,195,217,0.08);}
  .radio-opt input{width:auto; accent-color:var(--cyan);}
  .radio-opt span{font-size:13.5px;}
  .radio-note{font-size:11px; color:var(--text-dim); margin-top:8px; line-height:1.5;}

  .apercu-msg{background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px; padding:14px; margin-top:10px; font-size:12.5px; line-height:1.6; white-space:pre-wrap;}
  .apercu-label{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}

  .histo-item{padding:12px 0; border-bottom:1px solid var(--hairline);}
  .histo-item:last-child{border-bottom:none;}
  .histo-periode{font-size:13px; font-weight:600;}
  .histo-detail{font-size:11.5px; color:var(--text-mid); margin-top:3px;}

  .badge-double-lieu{display:inline-block; font-family:var(--mono); font-size:9px; color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3); border-radius:8px; padding:3px 7px;}

  footer{padding:20px; text-align:center; font-family:var(--mono); font-size:10px; color:var(--text-dim);}
  a.footer-link{color:var(--cyan); text-decoration:none;}
</style>
</head>
<body>
<div class="phone">
  <div id="app"></div>
  <footer>NEXUS Comptes Clients v1 · <a href="#" id="logout" class="footer-link">Se déconnecter</a></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-forfait.js"></script>
<script src="nexus-desktop.js"></script>
<script>
  // ============================================================
  // NEXUS COMPTES CLIENTS — v1 (07/08/2026)
  // Phase 1 du cahier des charges de Frédéric : base clients,
  // interlocuteurs, préférences documentaires, paramétrage manager,
  // journal d'audit. La facturation mensuelle (import factures/bons,
  // rapprochement NEXUS RECONCILE, préparation des e-mails, envoi) est
  // volontairement HORS de cette v1 — c'est un moteur d'extraction/OCR
  // et d'envoi d'e-mails à part entière (Phase 2 du cahier des charges),
  // qui suppose des choix techniques (fournisseur d'e-mail, moteur OCR)
  // que Frédéric n'a pas encore tranchés. Tant que ces écrans n'existent
  // pas, les KPI qui en dépendent (à envoyer, prêts, à contrôler, remis
  // en main propre, anomalies) restent honnêtement à 0 — NEXUS n'invente
  // jamais une donnée qu'il n'a pas.
  // ============================================================

  let employeeCourant = null;
  let clientsListe = [];       // enrichi : client + contact principal + préférences
  let vueActuelle = 'accueil';
  let clientActifId = null;
  let filtreActif = 'tous';
  let rechercheTexte = '';
  let templatesDisponibles = [];

  const CIVILITES = [
    { value: 'neutre', label: 'Neutre', exemple: 'Bonjour,' },
    { value: 'monsieur', label: 'Monsieur', exemple: 'Bonjour Monsieur,' },
    { value: 'madame', label: 'Madame', exemple: 'Bonjour Madame,' },
    { value: 'prenom', label: 'Prénom uniquement', exemple: 'Bonjour {{Prénom}},' },
    { value: 'personnalisee', label: 'Personnalisée', exemple: '(formule libre)' },
  ];

  (async function init() {
    employeeCourant = await nexusRequireAuth();
    if (!employeeCourant) return;
    const estNiveauManager = employeeCourant.role === 'manager' || employeeCourant.role === 'gerant';
    if (!estNiveauManager && !employeeCourant.est_createur) {
      window.location.href = 'NEXUS-App-v1.html';
      return;
    }
    const siteId = employeeCourant.site_id;
    const ok = await NexusForfait.nexusRequireProfessional('NEXUS-Comptes-Clients-v1.html', siteId);
    if (!ok) return;

    document.getElementById('logout').addEventListener('click', (e) => { e.preventDefault(); nexusLogout(); });

    await chargerClients();
    await chargerTemplates();
    render();
  })();

  async function chargerTemplates() {
    const site = employeeCourant.site_id;
    const { data, error } = await nexusClient.from('email_templates').select('code, nom').eq('site', site).not('code', 'is', null).order('nom');
    if (error) { console.error('Chargement modèles:', error); templatesDisponibles = []; return; }
    templatesDisponibles = data || [];
  }

  async function chargerClients() {
    const site = employeeCourant.site_id;
    const { data: clients, error } = await nexusClient.from('clients').select('*').eq('site', site).order('raison_sociale', { ascending: true });
    if (error) { console.error('Chargement clients:', error); clientsListe = []; return; }
    const ids = (clients || []).map(c => c.id);
    let contacts = [], prefs = [], factures = [];
    if (ids.length) {
      const { data: c } = await nexusClient.from('client_contacts').select('*').in('client_id', ids).eq('est_contact_principal', true);
      contacts = c || [];
      const { data: p } = await nexusClient.from('client_preferences').select('*').in('client_id', ids);
      prefs = p || [];
      // 13/08/2026, demande de Frédéric : "comment envoyer les messages avec
      // leurs factures" — chargées ici en une seule fois (même convention
      // que contacts/prefs ci-dessus) et affichées dans le bloc "Historique"
      // de la fiche client (voir renderFicheClient / renderFacturesBloc).
      const { data: f } = await nexusClient.from('invoices').select('*').in('client_id', ids).order('created_at', { ascending: false });
      factures = f || [];
    }
    clientsListe = (clients || []).map(c => ({
      ...c,
      contact: contacts.find(x => x.client_id === c.id) || null,
      preferences: prefs.find(x => x.client_id === c.id) || null,
      factures: factures.filter(x => x.client_id === c.id),
    }));
  }

  async function journaliser(clientId, action, ancienneValeur, nouvelleValeur) {
    await nexusClient.from('client_comptes_audit_logs').insert({
      site: employeeCourant.site_id, client_id: clientId, entite_type: 'client',
      entite_id: clientId, action, ancienne_valeur: ancienneValeur || null, nouvelle_valeur: nouvelleValeur || null,
      acteur_id: employeeCourant.id,
    });
  }

  // ------------------------------------------------------------
  // Détermination du statut visuel — jamais la couleur seule (toujours
  // icône + libellé, demande explicite du cahier des charges §4).
  // Sans facturation ni rapprochement encore implémentés (Phase 2), un
  // client neuf est GRIS "Aucune opération pour la période" par défaut ;
  // seul un problème de configuration détectable dès aujourd'hui (mode
  // e-mail choisi sans adresse e-mail connue) le fait passer en ORANGE.
  // ------------------------------------------------------------
  function determinerStatut(c) {
    if (!c.actif) return { couleur: 'gris', icone: '○', libelle: 'Client inactif' };
    const p = c.preferences;
    if (p && p.facture_envoi_email && (!c.contact || !c.contact.email_principal)) {
      return { couleur: 'orange', icone: '!', libelle: 'E-mail manquant' };
    }
    // Import (07/08/2026) : un client dont le mode de facturation ou les
    // bons restent "à confirmer" dans le fichier source est signalé ici —
    // NEXUS ne devine jamais ce que le fichier lui-même laisse en
    // attente, mais ne le cache pas non plus au manager.
    if (p && p.preferences_particulieres && /à confirmer/i.test(p.preferences_particulieres)) {
      return { couleur: 'orange', icone: '!', libelle: 'Configuration à confirmer' };
    }
    if (!c.contact) {
      return { couleur: 'orange', icone: '!', libelle: 'Aucun interlocuteur renseigné' };
    }
    return { couleur: 'gris', icone: '○', libelle: 'Aucune opération pour la période' };
  }

  function modeDocumentaire(c) {
    const p = c.preferences;
    if (!p) return 'Non paramétré';
    const parts = [];
    if (p.facture_remise_main_propre) parts.push('Main propre');
    else if (p.facture_envoi_email) parts.push('E-mail');
    if (p.bons_joindre_email) parts.push('bons joints');
    else if (p.bons_remise_main_propre) parts.push('bons en main propre');
    else if (p.bons_ne_pas_envoyer) parts.push('sans bons');
    return parts.length ? parts.join(' + ') : 'Non paramétré';
  }

  function calculerKpis() {
    const enCompte = clientsListe.filter(c => c.actif).length;
    // Les 5 KPI suivants dépendent de la facturation mensuelle et du
    // rapprochement (Phase 2, pas encore implémentés) — ils restent à 0
    // tant qu'aucune donnée réelle ne les alimente.
    return { enCompte, aEnvoyer: 0, prets: 0, aControler: 0, remisMainPropre: 0, anomalies: 0 };
  }

  function clientsFiltres() {
    let liste = clientsListe;
    const q = normaliser(rechercheTexte);
    if (q) {
      liste = liste.filter(c => {
        const hay = normaliser([c.raison_sociale, c.nom_commercial, c.code_client, c.contact ? c.contact.prenom : '', c.contact ? c.contact.nom : '', c.contact ? c.contact.email_principal : ''].filter(Boolean).join(' '));
        return hay.includes(q);
      });
    }
    if (filtreActif === 'email') liste = liste.filter(c => c.preferences && c.preferences.facture_envoi_email);
    if (filtreActif === 'main_propre') liste = liste.filter(c => c.preferences && c.preferences.facture_remise_main_propre);
    if (filtreActif === 'documents_manquants') liste = liste.filter(c => determinerStatut(c).couleur === 'orange');
    // 'a_envoyer', 'prets', 'anomalies', 'factures_envoyees' dépendent de
    // la facturation (Phase 2) — sans données, ils renvoient une liste
    // vide plutôt qu'une liste inventée.
    if (['a_envoyer', 'prets', 'anomalies', 'factures_envoyees'].includes(filtreActif)) liste = [];
    return liste;
  }

  function normaliser(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  function render() {
    if (vueActuelle === 'accueil') renderAccueil();
    else if (vueActuelle === 'fiche') renderFicheClient(clientActifId);
    else if (vueActuelle === 'formulaire') renderFormClient(clientActifId);
  }

  // ------------------------------------------------------------
  // ACCUEIL — cockpit
  // ------------------------------------------------------------
  function renderAccueil() {
    const kpis = calculerKpis();
    const liste = clientsFiltres();
    const FILTRES = [
      { id: 'tous', label: 'Tous' }, { id: 'a_envoyer', label: 'À envoyer' }, { id: 'prets', label: 'Prêts' },
      { id: 'anomalies', label: 'Anomalies' }, { id: 'email', label: 'E-mail' }, { id: 'main_propre', label: 'Main propre' },
      { id: 'documents_manquants', label: 'Documents manquants' }, { id: 'factures_envoyees', label: 'Factures envoyées' },
    ];
    document.getElementById('app').innerHTML = `
      <div class="header">

  // ------------------------------------------------------------
  // FACTURES — bloc "Historique" de la fiche client (13/08/2026, demande de
  // Frédéric : "comment envoyer les messages avec leurs factures"). V1
  // volontairement simple : un bouton "Envoyer" par facture, pas de lot —
  // voir NEXUS-Data-Dictionary-v2 pour la portée exacte de cette V1 et ce
  // qu'elle laisse délibérément de côté (email_batches/email_messages avec
  // 7 "checks" de rapprochement, prévus en base pour une Phase 2 future).
  // ------------------------------------------------------------
  const LIBELLES_STATUT_FACTURE = {
    envoyee: { classe: 'st-vert', texte: 'Envoyée' },
    bloquee: { classe: 'st-rouge', texte: 'Bloquée' },
  };
  function statutFacture(f) {
    return LIBELLES_STATUT_FACTURE[f.statut] || { classe: 'st-orange', texte: "En attente d'envoi" };
  }
  function renderFacturesBloc(c) {
    const factures = c.factures || [];
    if (!factures.length) {
      return `
        <div class="empty-state" style="padding:20px 4px;">
          <div class="es-desc">Aucune facture pour l'instant — apparaîtra dès qu'un document sera déposé et identifié pour ce client dans la Boîte de réception.</div>
        </div>
      `;
    }
    return factures.map(f => {
      const st = statutFacture(f);
      const dateAffichee = f.date_facture ? new Date(f.date_facture + 'T00:00:00').toLocaleDateString('fr-FR') : new Date(f.created_at).toLocaleDateString('fr-FR');
      const dejaEnvoyee = f.statut === 'envoyee';
      return `
        <div class="facture-row">
          <div class="facture-info">
            <div class="facture-nom">${escHtml(f.reference || 'Facture')} — ${dateAffichee}</div>
            <div class="facture-meta">${f.montant_total !== null && f.montant_total !== undefined ? Number(f.montant_total).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €' : 'Montant non extrait'}</div>
          </div>
          <span class="cc-statut ${st.classe}">${st.texte}</span>
          <button type="button" class="btn-envoyer" data-envoyer-facture="${f.id}" ${dejaEnvoyee ? 'disabled' : ''}>${dejaEnvoyee ? 'Envoyée' : 'Envoyer'}</button>
        </div>
      `;
    }).join('');
  }

  async function envoyerFacture(invoiceId, btn) {
    if (!confirm('Envoyer cette facture par e-mail au client ?')) return;
    const texteInitial = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Envoi…';
    const { data: sessionData } = await nexusClient.auth.getSession();
    const token = sessionData && sessionData.session && sessionData.session.access_token;
    if (!token) {
      alert('Session expirée — reconnectez-vous puis réessayez.');
      btn.disabled = false; btn.textContent = texteInitial;
      return;
    }
    try {
      const resp = await fetch(`${NEXUS_SUPABASE_URL}/functions/v1/nexus-envoyer-facture`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, apikey: NEXUS_SUPABASE_ANON_KEY },
        body: JSON.stringify({ invoiceId }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        alert("Envoi impossible : " + (data.error || 'Erreur inconnue.'));
        btn.disabled = false; btn.textContent = texteInitial;
        return;
      }
      await chargerClients();
      render();
    } catch (e) {
      console.error('Envoi facture:', e);
      alert("Erreur réseau pendant l'envoi — vérifiez la connexion et réessayez.");
      btn.disabled = false; btn.textContent = texteInitial;
    }
  }

      }
    });
  }

  async function enregistrerClient(clientExistant) {
    const raisonSociale = document.getElementById('fRaisonSociale').value.trim();
    if (!raisonSociale) { alert('La raison sociale est obligatoire.'); return; }
    const site = employeeCourant.site_id;

    const payloadClient = {
      site, raison_sociale: raisonSociale,
      code_client: document.getElementById('fCodeClient').value.trim() || null,
      nom_commercial: document.getElementById('fNomCommercial').value.trim() || null,
      siret: document.getElementById('fSiret').value.trim() || null,
    };

    let clientId = clientExistant ? clientExistant.id : null;
    if (clientExistant) {
      const { error } = await nexusClient.from('clients').update(payloadClient).eq('id', clientId);
      if (error) { alert('Erreur enregistrement client : ' + error.message); return; }
      await journaliser(clientId, 'modification_identite', JSON.stringify({ raison_sociale: clientExistant.raison_sociale }), JSON.stringify(payloadClient));
    } else {
      const { data, error } = await nexusClient.from('clients').insert({ ...payloadClient, created_by: employeeCourant.id }).select().single();
      if (error) { alert('Erreur création client : ' + error.message); return; }
      clientId = data.id;
      await journaliser(clientId, 'creation', null, JSON.stringify(payloadClient));
    }

    const civiliteChoisie = (document.querySelector('input[name="civilite"]:checked') || {}).value || 'neutre';
    const payloadContact = {
      client_id: clientId,
      prenom: document.getElementById('fPrenom').value.trim() || null,
      nom: document.getElementById('fNom').value.trim() || null,
      fonction: document.getElementById('fFonction').value.trim() || null,
      telephone: document.getElementById('fTelephone').value.trim() || null,
      email_principal: document.getElementById('fEmailPrincipal').value.trim() || null,
      email_secondaire: document.getElementById('fEmailSecondaire').value.trim() || null,
      email_cc: document.getElementById('fEmailCc').value.trim() || null,
      civilite: civiliteChoisie,
      formule_personnalisee: civiliteChoisie === 'personnalisee' ? (document.getElementById('fFormulePersonnalisee').value.trim() || null) : null,
      est_contact_principal: true,
    };
    const contactExistant = clientExistant ? clientExistant.contact : null;
    if (contactExistant) {
      await nexusClient.from('client_contacts').update(payloadContact).eq('id', contactExistant.id);
    } else {
      await nexusClient.from('client_contacts').insert(payloadContact);
    }

    const modeFacture = (document.querySelector('input[name="modeFacture"]:checked') || {}).value || 'email';
    const modeBons = (document.querySelector('input[name="modeBons"]:checked') || {}).value || 'joindre';
    const payloadPrefs = {
      client_id: clientId,
      facture_envoi_email: modeFacture === 'email',
      facture_remise_main_propre: modeFacture === 'main_propre',
      bons_joindre_email: modeBons === 'joindre',
      bons_ne_pas_envoyer: modeBons === 'aucun',
      bons_remise_main_propre: modeBons === 'main_propre',
      controle_auto_bons: document.getElementById('fControleAuto').checked,
      bloquer_envoi_si_anomalie: document.getElementById('fBloquerAnomalie').checked,
      validation_manager_obligatoire: document.getElementById('fValidationManager').checked,
      preferences_particulieres: document.getElementById('fPreferencesLibres').value.trim() || null,
      modele_message_code: document.getElementById('fModeleMessage').value || null,
      updated_at: new Date().toISOString(),
    };
    const prefsExistantes = clientExistant ? clientExistant.preferences : null;
    if (prefsExistantes) {
      await nexusClient.from('client_preferences').update(payloadPrefs).eq('id', prefsExistantes.id);
    } else {
      await nexusClient.from('client_preferences').insert(payloadPrefs);
    }

    await chargerClients();
    clientActifId = clientId;
    vueActuelle = 'fiche';
    render();
  }
</script>
