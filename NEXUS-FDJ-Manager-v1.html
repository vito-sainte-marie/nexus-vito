    const p = await NexusPdfMoteur.creerRapportUnePage({
      titre: `NEXUS FDJ — Relevé de clôture — ${shift.date} Quart ${shift.quart}`,
      sujet: 'Relevé de clôture FDJ — Trace de contrôle',
      orientation: 'paysage',
    });

    const zEntete = p.allouerZone(ZONES_1P.entete);
    p.entete(zEntete, {
      app: 'NEXUS FDJ · RELEVÉ DE CLÔTURE',
      ligne1: `${dateLabel} · Quart ${shift.quart} · ${nomEmploye(shift.employee_id)}`,
      ligne2: `Identifiant ${shift.id} · Validé le ${heureValidation}`,
    });

    // Zone allouée seulement si nécessaire — un relevé définitif (cas
    // normal) rend directement cette hauteur au corps du relevé plutôt
    // que de laisser un blanc inutile.
    if (dernier.caractere === 'provisoire') {
      const zNote = p.allouerZone(MM * 7);
      p.paragraphe(zNote, {
        texte: 'Relevé PROVISOIRE — continuité de chaîne à régulariser au moment de ce constat. Recalcul automatique dès que le quart manquant sera complété.',
        taille: 7.8, interligne: 9.5, couleur: COULEUR.ambre,
      });
    }

    const zKpi = p.allouerZone(ZONES_1P.kpi);
    p.ligneKpi(zKpi, [
      { label: 'STATUT', valeur: labelStatutRelevecloture(dernier.statut) },
      { label: 'CARACTÈRE', valeur: libelleCaractereReleve(dernier.caractere), couleurValeur: dernier.caractere === 'provisoire' ? COULEUR.ambre : COULEUR.vert },
      { label: 'CAISSE ATTENDUE', valeur: fmtEuro(dernier.caisse_attendue), couleurValeur: COULEUR.cyan },
      { label: 'CAISSE RÉELLE', valeur: fmtEuro(dernier.caisse_reelle) },
      { label: 'ÉCART', valeur: ecart !== null && ecart !== undefined ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—', couleurValeur: ecart === null || ecart === undefined ? COULEUR.texte : (ecart === 0 ? COULEUR.vert : COULEUR.ambre) },
    ]);

    // Le corps prend TOUT l'espace vertical restant jusqu'au pied de page
    // (calculé, jamais une hauteur devinée) — garantit que la page ne
    // déborde jamais, que le bandeau provisoire ait été affiché ou non.
    const hauteurPied = ZONES_1P.piedDePage;
    const hauteurCorps = Math.max(0, (p.y - MARGE_1P) - hauteurPied);
    const zCorps = p.allouerZone(hauteurCorps);
    const { gauche, droite } = p.diviserColonnes(zCorps, { gouttiere: 16, ratioGauche: 0.52 });
    const [zStock, zSynthese] = p.diviserLignes(gauche, [gauche.hauteur * 0.55, gauche.hauteur * 0.45]);

    p.tableauCompact(zStock, {
      titre: 'STOCK PAR JEU',
      colonnes: [
        { label: 'Jeu', cle: 'nom', largeur: 0.32 },
        { label: 'Initial', cle: 'initial', largeur: 0.17, align: 'droite' },
        { label: 'Appro', cle: 'appro', largeur: 0.16, align: 'droite' },
        { label: 'Final', cle: 'final', largeur: 0.17, align: 'droite' },
        { label: 'Ventes', cle: 'ventes', largeur: 0.18, align: 'droite' },
      ],
      lignes: jeuxListe.map(j => {
        const v = (dernier.ventes_par_jeu || {})[j.id] || {};
        return {
          nom: j.nom,
          initial: fmtNum((dernier.stock_initial_par_jeu || {})[j.id]),
          appro: fmtNum((dernier.appro_par_jeu || {})[j.id]),
          final: fmtNum((dernier.stock_final_par_jeu || {})[j.id]),
          ventes: v.valeur !== undefined && v.valeur !== null ? fmtEuro(v.valeur) : '—',
        };
      }),
      max: 10,
      texteRenvoi: 'voir le détail dans l\'app',
    });

    const lignesSynthese = [
      { poste: 'Ventes grattage', montant: fmtEuro(dernier.ventes_grattage_valeur) },
      { poste: 'Lots payés', montant: fmtEuro(dernier.lots_payes_grattage) },
      { poste: 'Caisse tirages', montant: fmtEuro(dernier.caisse_tirages) },
      { poste: 'Régularisations', montant: fmtEuro(dernier.regularisations) },
      { poste: 'Caisse attendue', montant: fmtEuro(dernier.caisse_attendue) },
      { poste: 'Caisse réelle', montant: fmtEuro(dernier.caisse_reelle) },
      { poste: 'Écart', montant: ecart !== null && ecart !== undefined ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—' },
      ...libelleAnomalieChaine(dernier.anomalie_chaine).map(l => ({ poste: l.label, montant: l.valeur })),
    ];
    p.tableauCompact(zSynthese, {
      titre: 'SYNTHÈSE CAISSE',
      colonnes: [
        { label: 'Poste', cle: 'poste', largeur: 0.62 },
        { label: 'Montant', cle: 'montant', largeur: 0.38, align: 'droite' },
      ],
      lignes: lignesSynthese,
      max: 12,
    });

    p.listePoints(droite, {
      titre: `HISTORIQUE DES VERSIONS (${releves.length})`,
      points: releves.slice().reverse().map(r => {
        const auteur = r.signature && r.signature.nom ? r.signature.nom : (r.cree_par ? nomEmploye(r.cree_par) : '—');
        const base = `V${r.version_num} — ${libelleTypeVersionReleve(r.type_version)} — ${dateCourte(r.cree_le)} — ${auteur}`;
        return r.motif_regularisation ? `${base} — ${r.motif_regularisation}` : base;
      }),
      max: 10,
      texteRenvoi: 'voir l\'historique complet dans l\'app',
    });

    const zPied = p.allouerZone(hauteurPied);
    p.piedDePage(zPied, 'NEXUS FDJ · Relevé de clôture — trace de contrôle, jamais un jugement automatique.', dateLabel);

    const bytes = await NexusPdfMoteur.finaliser(p);
    const nomFichier = `NEXUS-FDJ-Releve-${shift.date}-Q${shift.quart}.pdf`;
    return {
      bytes, nomFichier,
      titre: `NEXUS FDJ — Relevé de clôture ${dateLabel} Quart ${shift.quart}`,
      texte: `Relevé de clôture FDJ — ${nomEmploye(shift.employee_id)} — ${dateLabel} Quart ${shift.quart}`,
    };
  }

  // ------------------------------------------------------------
  // TRACE DE CONTRÔLE FDJ — ÉCRAN "EXPORTER LA JOURNÉE COMPLÈTE" (Q1+Q2)
  // 16/08/2026, demande de Frédéric : "Exporter la journée complète".
  // ------------------------------------------------------------
  async function ouvrirExportJournee(date) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    const shiftsDuJour = await chargerShiftsAvecCaisse(date);
    const shiftsAvecReleves = await Promise.all(
      shiftsDuJour.slice().sort((a, b) => a.quart.localeCompare(b.quart)).map(async s => ({ shift: s, releves: await chargerRelevesQuart(s.id) })),
    );
    exportJournee = { date, shifts: shiftsAvecReleves, dernierPdf: null };
    vue = 'export-journee';
    renderExportJournee();
  }

  function renderExportJournee() {
    const { date, shifts } = exportJournee;
    document.getElementById('titre').textContent = 'Exporter la journée FDJ';
    document.getElementById('sousTitre').textContent = new Date(date + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourExportJournee">← Retour</button>

      ${shifts.map(({ shift, releves }) => {
        const dernier = releves.length ? releves[releves.length - 1] : null;
        const ecart = dernier ? dernier.ecart : null;
        const classe = ecart === null || ecart === undefined ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
        return `
          <div class="card" style="margin-bottom:16px;">
            <div class="stat-row"><div class="stat-label">Quart ${shift.quart}</div><div class="stat-value">${nomEmploye(shift.employee_id)}</div></div>
            ${dernier ? `
              <div class="stat-row"><div class="stat-label">Caractère</div><div class="stat-value"><span class="badge-caractere ${dernier.caractere}">${libelleCaractereReleve(dernier.caractere)}</span></div></div>
              <div class="stat-row total"><div class="stat-label">Écart</div><div class="stat-value ${classe}">${ecart !== null && ecart !== undefined ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div></div>
            ` : `<div class="empty">Aucun relevé de clôture pour ce quart.</div>`}
          </div>
        `;
      }).join('') || '<div class="card"><div class="empty">Aucun quart FDJ enregistré ce jour.</div></div>'}

      <div id="zoneActionsPdfJournee">
        <button class="btn-rapport-pdf" id="btnGenererPdfJournee" type="button" ${shifts.every(s => !s.releves.length) ? 'disabled' : ''}>📄 Exporter la journée complète (PDF)</button>
      </div>
      ${shifts.every(s => !s.releves.length) ? '<div class="champ-note">Aucun relevé de clôture disponible pour cette journée — export impossible.</div>' : ''}
    `;
    document.getElementById('btnRetourExportJournee').addEventListener('click', () => { vue = 'liste'; exportJournee = null; renderAccueil(); });
    const btnGen = document.getElementById('btnGenererPdfJournee');
    if (!btnGen.disabled) {
      btnGen.addEventListener('click', () => {
        genererEtAfficherPdf(document.getElementById('zoneActionsPdfJournee'), () => construireExportJourneePdf(date, shifts), exportJournee);
      });
    }
  }

  async function construireExportJourneePdf(date, shifts) {
    const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const { COULEUR } = NexusPdfMoteur;
    const c = await NexusPdfMoteur.creerRapport({
      titre: `NEXUS FDJ — Journée complète — ${date}`,
      sujet: 'Export journée FDJ — Trace de contrôle',
      entete: { app: 'NEXUS FDJ · JOURNÉE COMPLÈTE', sousTitre: dateLabel },
    });
    c.titre('Journée FDJ complète');
    c.sousTitre(dateLabel.charAt(0).toUpperCase() + dateLabel.slice(1));

    shifts.forEach(({ shift, releves }) => {
      c.sectionTitre(`QUART ${shift.quart} — ${nomEmploye(shift.employee_id).toUpperCase()}`);
      if (!releves.length) {
        c.paragraphe('Aucun relevé de clôture pour ce quart.', { couleur: COULEUR.texteDim });
        return;
      }
      const dernier = releves[releves.length - 1];
      const premier = releves[0];
      const jeuxListe = jeuxDuSnapshot(dernier);
      const heureValidation = premier && premier.signature && premier.signature.date_heure
        ? new Date(premier.signature.date_heure).toLocaleString('fr-FR', { hour: '2-digit', minute: '2-digit' })
        : '—';
      c.ligneCle('Heure de validation', heureValidation);
      c.ligneCle('Caractère', libelleCaractereReleve(dernier.caractere), { couleurValeur: dernier.caractere === 'provisoire' ? COULEUR.ambre : COULEUR.vert });
      c.ligneCle('Statut', labelStatutRelevecloture(dernier.statut));
      const ecart = dernier.ecart;
      c.ligneCle('Écart', ecart !== null && ecart !== undefined ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—');
      c.ligneCle('Caisse réelle', fmtEuro(dernier.caisse_reelle));
      if (releves.length > 1) c.paragraphe(`${releves.length} versions — voir le relevé de contrôle du quart pour le détail complet des régularisations.`, { taille: 8.5, couleur: COULEUR.texteDim });
      if (jeuxListe.length) {
        c.tableau(
          [
            { label: 'Jeu', cle: 'nom', largeur: 0.4 },
            { label: 'Initial', cle: 'initial', largeur: 0.2, align: 'droite' },
            { label: 'Appro', cle: 'appro', largeur: 0.2, align: 'droite' },
            { label: 'Final', cle: 'final', largeur: 0.2, align: 'droite' },
          ],
          jeuxListe.map(j => ({
            nom: j.nom,
            initial: fmtNum((dernier.stock_initial_par_jeu || {})[j.id]),
            appro: fmtNum((dernier.appro_par_jeu || {})[j.id]),
            final: fmtNum((dernier.stock_final_par_jeu || {})[j.id]),
          })),
        );
      }
    });

    c.piedDePageToutesPages('NEXUS FDJ · Export journée complète — trace de contrôle, jamais un jugement automatique.');
    const bytes = await NexusPdfMoteur.finaliser(c);
    const nomFichier = `NEXUS-FDJ-Journee-${date}.pdf`;
    return { bytes, nomFichier, titre: `NEXUS FDJ — Journée complète ${date}`, texte: `Export journée FDJ complète — ${date}` };
  }

  // ------------------------------------------------------------
  // TRACE DE CONTRÔLE FDJ — ÉCRAN "HISTORIQUE FDJ DE [EMPLOYÉ] — [MOIS]"
  // 16/08/2026, demande de Frédéric : 3e niveau de consultation, ex.
  // "Historique FDJ de Samantha — août 2026".
  // ------------------------------------------------------------
  async function ouvrirHistoriqueEmployeListe() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    vue = 'historique-employe-liste';
    document.getElementById('titre').textContent = 'Historique FDJ par employé';
    document.getElementById('sousTitre').textContent = 'Sélectionner un employé pour consulter son historique mensuel.';
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourHistoEmpListe">← Retour</button>
      <div class="card">
        ${employesSite.length ? employesSite.map(e => `<div class="jeu-row" data-employe="${e.id}" style="cursor:pointer;"><div class="jeu-nom-ligne"><div class="jeu-nom">${e.nom}</div></div></div>`).join('') : '<div class="empty">Aucun employé actif sur ce site.</div>'}
      </div>
    `;
    document.getElementById('btnRetourHistoEmpListe').addEventListener('click', () => { vue = 'liste'; renderAccueil(); });
    document.querySelectorAll('[data-employe]').forEach(el => {
      el.addEventListener('click', () => ouvrirHistoriqueEmployeMois(el.dataset.employe, dateISO().slice(0, 7)));
    });

  async function ouvrirHistoriqueEmployeMois(employeeId, moisISO) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    const shifts = await chargerShiftsEmployeMois(employeeId, moisISO);
    historiqueEmploye = { employeeId, moisISO, shifts };
    vue = 'historique-employe';
    renderHistoriqueEmploye();
  }

  const LIBELLES_MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function libelleMoisAnnee(moisISO) {
    const [annee, mois] = moisISO.split('-').map(Number);
    return `${LIBELLES_MOIS_FR[mois - 1]} ${annee}`;
  }
  function decalerMois(moisISO, delta) {
    const [annee, mois] = moisISO.split('-').map(Number);
    const d = new Date(annee, mois - 1 + delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function renderHistoriqueEmploye() {
    const { employeeId, moisISO, shifts } = historiqueEmploye;
    const nom = nomEmploye(employeeId);
    document.getElementById('titre').textContent = `Historique FDJ de ${nom}`;
    document.getElementById('sousTitre').textContent = libelleMoisAnnee(moisISO).replace(/^./, c => c.toUpperCase());

    // 20/08/2026 (F2, même correctif que les vues SQL view_fdj_*_summary,
    // "caisse_comptabilisable") : un quart encore statut='brouillon' peut
    // porter une caisse déjà notée par le manager (statut <> 'provisoire')
    // sans jamais avoir été transmis par l'employé — ne doit jamais compter
    // dans les totaux de l'historique employé, même règle qu'ailleurs.
    const shiftsComptabilisables = shifts.filter(s => s.statut === 'valide' && s.cash && s.cash.statut && s.cash.statut !== 'provisoire');
    const quartsControles = shiftsComptabilisables.length;
    const quartsConformes = shiftsComptabilisables.filter(s => s.cash.statut === 'conforme').length;
    const ecartTotal = shiftsComptabilisables.reduce((sum, s) => sum + (s.cash.ecart || 0), 0);

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourHistoEmp">← Retour</button>

      <div class="card" style="margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; padding:12px 16px;">
        <button type="button" class="btn-ghost" id="btnMoisPrec" style="width:auto; margin:0; padding:8px 14px;">‹</button>
        <div style="font-size:13px; font-weight:600; color:var(--text);">${libelleMoisAnnee(moisISO).replace(/^./, c => c.toUpperCase())}</div>
        <button type="button" class="btn-ghost" id="btnMoisSuiv" style="width:auto; margin:0; padding:8px 14px;">›</button>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="stat-row"><div class="stat-label">Quarts travaillés</div><div class="stat-value">${shifts.length}</div></div>
        <div class="stat-row"><div class="stat-label">Quarts contrôlés</div><div class="stat-value">${quartsControles} / ${shifts.length}</div></div>
        <div class="stat-row"><div class="stat-label">Quarts conformes</div><div class="stat-value">${quartsConformes} / ${quartsControles || 0}</div></div>
        <div class="stat-row total"><div class="stat-label">Écart cumulé</div><div class="stat-value ${ecartTotal === 0 ? 'green' : (Math.abs(ecartTotal) <= 3 ? 'amber' : 'red')}">${ecartTotal > 0 ? '+' : ''}${fmtEuro(ecartTotal)}</div></div>
      </div>

      <div class="section-titre">Quarts du mois</div>
      <div class="card" id="listeHistoEmp">
        ${shifts.length ? shifts.map((s, i) => {
          // Même règle de priorité que renderCarteQuartJour/renderHistoItem
          // (F1) : le statut du QUART prime toujours sur le statut de la
          // caisse pour l'étiquette — un brouillon reste "Brouillon" même
          // si le manager a déjà noté une caisse dessus.
          const estBrouillon = s.statut !== 'valide';
          const ecart = (!estBrouillon && s.cash) ? s.cash.ecart : null;
          const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
          return `
            <div class="histo-item" data-histo-emp-idx="${i}" style="cursor:pointer;">
              <div class="histo-top">
                <div><div class="histo-date">${new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR')} <span style="color:var(--text-mid); font-weight:400;">· Quart ${s.quart}</span></div></div>
                <div style="text-align:right;">
                  <div class="histo-ecart ${classe}">${ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div>
                  <div style="margin-top:4px;"><span class="statut-badge ${estBrouillon ? 'brouillon' : (s.cash ? s.cash.statut : 'provisoire')}">${estBrouillon ? 'Brouillon' : (s.cash ? labelStatutCaisse(s.cash.statut) : 'Provisoire')}</span></div>
                </div>
              </div>
            </div>
          `;
        }).join('') : '<div class="empty">Aucun quart FDJ pour ce mois.</div>'}
      </div>
    `;
    document.getElementById('btnRetourHistoEmp').addEventListener('click', () => { vue = 'liste'; historiqueEmploye = null; renderAccueil(); });
    document.getElementById('btnMoisPrec').addEventListener('click', () => ouvrirHistoriqueEmployeMois(employeeId, decalerMois(moisISO, -1)));
    document.getElementById('btnMoisSuiv').addEventListener('click', () => ouvrirHistoriqueEmployeMois(employeeId, decalerMois(moisISO, 1)));
    document.querySelectorAll('[data-histo-emp-idx]').forEach(el => {
      el.addEventListener('click', () => ouvrirReleveQuart(shifts[parseInt(el.dataset.histoEmpIdx, 10)]));
    });
  }

  // ------------------------------------------------------------
  // F2 "CAISSE RÉELLE" (semaine) — 20/08/2026, cahier "NEXUS FDJ — Audit de
  // consolidation" §4/§16 : "Le manager doit pouvoir vérifier l'argent
  // réellement compté sans reconstruire la semaine depuis les quarts."
  // Drill-down Semaine → Quart → Relevé de clôture / Preuve en réutilisant
  // ouvrirReleveQuart (déjà construit pour l'historique employé, Article
  // 11 — jamais un deuxième écran de détail de quart).
  // ------------------------------------------------------------
  const JOURS_SEMAINE_FR = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
  function ajouterJoursISO(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return dateISO(d);
  }
  function labelEtatJourCaisseReelle(etat) {
    return etat === 'controle' ? 'Contrôlé' : (etat === 'a_terminer' ? 'À terminer' : 'À venir');
  }
  function classeEtatJourCaisseReelle(etat) {
    return etat === 'controle' ? 'conforme' : (etat === 'a_terminer' ? 'a_controler' : 'provisoire');
  }
  // Texte d'une cellule Q1/Q2 — même vocabulaire que le reste de l'écran
  // (statut-badge "brouillon"/"provisoire") plutôt qu'un nouveau lexique.
  function celluleQuartCaisseReelleTexte(cellule) {
    if (cellule.etat === 'absent') return '—';
    if (cellule.etat === 'brouillon') return 'Brouillon';
    if (cellule.etat === 'en_attente') return 'En attente';
    return fmtEuro(cellule.montant);
  }

  async function ouvrirCaisseReelleSemaine(ancrageISO) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    const periode = NexusPeriodes.resoudrePeriodeCalendaire('semaine', ancrageISO || dateISO());
    const [shifts, totaux] = await Promise.all([
      chargerShiftsSemaine(periode.debut, periode.fin),
      chargerTotauxSemaine(periode.debut),
    ]);
    caisseReelleSemaine = { periode, shifts, totaux };
    vue = 'caisse-reelle-semaine';
    renderCaisseReelleSemaine();
  }

  function renderCaisseReelleSemaine() {
    const { periode, shifts, totaux } = caisseReelleSemaine;
    const aujourdhui = dateISO();

    document.getElementById('titre').textContent = 'Caisse réelle';
    document.getElementById('sousTitre').textContent = periode.label;

    // Une ligne par jour de la semaine — les quarts "attendus" sont Q1 et
    // Q2 (mêmes deux quarts que partout ailleurs dans FDJ, voir
    // horairesQuartsSite côté NEXUS-FDJ-v1.html). Un jour sans aucune
    // ligne fdj_shifts (site fermé, ou jour futur) affiche '—' sur les
    // deux quarts plutôt qu'une absence silencieuse.
    const jours = [];
    for (let i = 0; i < 7; i++) {
      const dateJour = ajouterJoursISO(periode.debut, i);
      const shiftsJour = shifts.filter(s => s.date === dateJour);
      const q1 = shiftsJour.find(s => s.quart === '1') || null;
      const q2 = shiftsJour.find(s => s.quart === '2') || null;
      const etat = NexusFdjMoteur.etatJourCaisseReelle([q1, q2], dateJour, aujourdhui);
      const total = NexusFdjMoteur.totalJourCaisseReelle([q1, q2]);
      jours.push({ dateJour, nomJour: JOURS_SEMAINE_FR[i], q1, q2, etat, total });
    }

    // Définitive uniquement si la semaine est entièrement passée ET que
    // chaque jour passé est "Contrôlé" — sinon provisoire (§4.1 du
    // cahier). NEXUS n'a aujourd'hui aucune notion de quart "exclu"
    // (fermeture exceptionnelle) : tant que cette fonctionnalité n'existe
    // pas, un jour fermé sans quart reste "À terminer" plutôt que d'être
    // faussement considéré comme définitif (Article 5).
    const semainePassee = periode.fin < aujourdhui;
    const tousJoursControles = jours.every(j => j.dateJour > aujourdhui || j.etat === 'controle');
    const definitive = semainePassee && tousJoursControles;

    const ecartTotal = totaux ? Number(totaux.ecart_total || 0) : 0;
    const classeEcart = ecartTotal === 0 ? 'green' : (Math.abs(ecartTotal) <= 3 ? 'amber' : 'red');

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourCaisseReelle">← Retour</button>

      <div class="card" style="margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; padding:12px 16px;">
        <button type="button" class="btn-ghost" id="btnSemainePrec" style="width:auto; margin:0; padding:8px 14px;">‹</button>
        <div style="font-size:13px; font-weight:600; color:var(--text);">${periode.label}</div>
        <button type="button" class="btn-ghost" id="btnSemaineSuiv" style="width:auto; margin:0; padding:8px 14px;">›</button>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="stat-row"><div class="stat-label">Caisse réelle ${definitive ? 'définitive' : 'enregistrée à date'}</div><div class="stat-value">${totaux ? fmtEuro(totaux.caisse_reelle_totale) : '—'}</div></div>
        <div class="stat-row"><div class="stat-label">Quarts contrôlés</div><div class="stat-value">${totaux ? totaux.nb_quarts_controles : 0} / ${totaux ? totaux.nb_quarts : 0}</div></div>
        <div class="stat-row"><div class="stat-label">Quarts conformes</div><div class="stat-value">${totaux ? totaux.nb_quarts_conformes : 0} / ${(totaux && totaux.nb_quarts_controles) || 0}</div></div>
        <div class="stat-row total"><div class="stat-label">Écart cumulé</div><div class="stat-value ${classeEcart}">${totaux ? `${ecartTotal > 0 ? '+' : ''}${fmtEuro(ecartTotal)}` : '—'}</div></div>
        ${!definitive ? '<div class="section-note" style="margin-top:6px;">Semaine provisoire — non close ou pas encore entièrement contrôlée.</div>' : ''}
      </div>

      <div class="section-titre">Jour par jour</div>
      <div class="card" id="listeCaisseReelleJours">
        ${jours.map((j, i) => `
          <div class="histo-item" style="cursor:default;">
            <div class="histo-top">
              <div>
                <div class="histo-date">${j.nomJour} <span style="color:var(--text-mid); font-weight:400;">${j.dateJour.split('-').reverse().join('/')}</span></div>
              </div>
              <div style="text-align:right;">
                <div class="histo-ecart">${j.total !== null ? fmtEuro(j.total) : (j.dateJour > aujourdhui ? '—' : 'Non consolidée')}</div>
                <div style="margin-top:4px;"><span class="statut-badge ${classeEtatJourCaisseReelle(j.etat)}">${labelEtatJourCaisseReelle(j.etat)}</span></div>
              </div>
            </div>
            <div class="histo-detail open" style="padding-top:0; display:flex; gap:8px;">
              <button type="button" class="btn-modifier" style="margin-top:8px; flex:1;" data-jour-idx="${i}" data-quart="1" ${j.q1 ? '' : 'disabled'}>Q1 — ${celluleQuartCaisseReelleTexte(NexusFdjMoteur.quartCaisseReelleCellule(j.q1))}</button>
              <button type="button" class="btn-modifier" style="margin-top:8px; flex:1;" data-jour-idx="${i}" data-quart="2" ${j.q2 ? '' : 'disabled'}>Q2 — ${celluleQuartCaisseReelleTexte(NexusFdjMoteur.quartCaisseReelleCellule(j.q2))}</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    document.getElementById('btnRetourCaisseReelle').addEventListener('click', () => { vue = 'liste'; caisseReelleSemaine = null; renderAccueil(); });
    document.getElementById('btnSemainePrec').addEventListener('click', () => ouvrirCaisseReelleSemaine(ajouterJoursISO(periode.debut, -7)));
    document.getElementById('btnSemaineSuiv').addEventListener('click', () => ouvrirCaisseReelleSemaine(ajouterJoursISO(periode.debut, 7)));
    document.querySelectorAll('[data-jour-idx]').forEach(el => {
      el.addEventListener('click', () => {
        const j = jours[parseInt(el.dataset.jourIdx, 10)];
        const shift = el.dataset.quart === '1' ? j.q1 : j.q2;
        if (shift) ouvrirReleveQuart(shift);
      });
    });
  }

  // ------------------------------------------------------------
  // OUVERTURE DE L'ÉDITION (nouveau ou existant)
  // ------------------------------------------------------------
  // dateOverride/quartOverride (13/08/2026, demande de Frédéric : pouvoir
  // rattraper directement un comptage FDJ manquant depuis FDJ Pilotage,
  // même principe que le rattrapage carburant déjà livré) — permettent
  // d'ouvrir directement un quart neuf sur une date/quart précis plutôt que
  // sur aujourd'hui/Quart 1 par défaut. Voir ouvrirDepuisParametresUrl().
  async function ouvrirEditionNouveau(dateOverride, quartOverride) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    edition = {
      shiftId: null, date: dateOverride || dateISO(), quart: quartOverride || '1', employeeId: employesSite[0] ? employesSite[0].id : null,
      statutShift: 'brouillon', counts: {}, stockInitialAuto: {}, lotsPayes: null, caisseTirages: null, regularisations: 0,
      caisseReelle: null, motifEcart: '', motifEcartTexte: '', resultatControle: '', statutCaisse: 'provisoire', avant: null, estNouveau: true, historiqueAudit: [],
      caisseReelleOrigine: null, ecartOrigine: null,
    };
    jeux.forEach(j => { edition.counts[j.id] = { stock_initial: null, appro: 0, stock_final: null }; });
    // Préremplissage (09/08/2026, demande de Frédéric) : un quart tout
    // neuf hérite directement du stock final du quart précédent, case vide
    // comprise (voir chargerStockInitialHerite — traité comme 0 ici, sans
    // confirmation contrairement à l'écran employé).
    await reprefillStockInitial();
    vue = 'edition';
    renderEdition();
  }

  async function chargerHistoriqueAudit(shiftId) {
    if (!shiftId) return [];
    const { data, error } = await nexusClient.from('fdj_audit_log').select('*').eq('shift_id', shiftId).order('date_action', { ascending: false });
    if (error) { console.error('Chargement historique audit FDJ:', error); return []; }
    return data || [];
  }

  async function ouvrirEditionExistant(shift) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement du quart…</div>';
    const [{ data: counts }, { data: reports }, historiqueAudit] = await Promise.all([
      nexusClient.from('fdj_shift_counts').select('*').eq('shift_id', shift.id),
      nexusClient.from('fdj_reports').select('*').eq('shift_id', shift.id),
      chargerHistoriqueAudit(shift.id),
    ]);
    const countsMap = {};
    const stockInitialAutoCharge = {};
    jeux.forEach(j => { countsMap[j.id] = { stock_initial: null, appro: 0, stock_final: null }; });
    (counts || []).forEach(c => {
      countsMap[c.game_id] = { stock_initial: c.stock_initial, appro: c.appro, stock_final: c.stock_final };
      // 16/08/2026 : recharge le vrai flag persisté plutôt que de repartir
      // de {} — sinon reprefillStockInitial ne peut jamais savoir qu'une
      // valeur déjà en base était "héritée automatiquement" et donc
      // éligible à une future réécriture automatique par
      // reconcilierAlertesChaine.
      stockInitialAutoCharge[c.game_id] = c.stock_initial_auto === true;
    });
    const repJournalier = (reports || []).find(r => r.type_rapport === 'journalier');
    const repTempsReel = (reports || []).find(r => r.type_rapport === 'temps_reel');
    const cash = shift.cash;

    edition = {
      shiftId: shift.id, date: shift.date, quart: shift.quart, employeeId: shift.employee_id,
      statutShift: shift.statut, counts: countsMap, stockInitialAuto: stockInitialAutoCharge,
      lotsPayes: repJournalier ? repJournalier.lots_payes_grattage : null,
      caisseTirages: repTempsReel ? repTempsReel.caisse_tirages : null,
      regularisations: cash ? cash.regularisations : 0,
      caisseReelle: cash ? cash.caisse_reelle : null,
      motifEcart: cash ? (cash.motif_ecart || '') : '',
      // F4 (20/08/2026, cahier §3, étape 6) : commentaire/justificatif libre,
      // distinct du code de motif — et résultat métier du contrôle (étape 8,
      // FDJ-08), colonne dédiée `resultat_controle` (migration du 20/08/2026),
      // jamais confondue avec statutCaisse/statutShift ci-dessous.
      motifEcartTexte: cash ? (cash.motif_ecart_texte || '') : '',
      resultatControle: cash ? (cash.resultat_controle || '') : '',
      statutCaisse: cash ? cash.statut : 'provisoire',
      // 16/08/2026 : constat d'origine (voir NEXUS-FDJ-v1.html::validerQuart)
      // — jamais réinjecté dans l'upsert ci-dessous (enregistrerEdition),
      // simplement affiché en lecture seule pour que "régulariser" ne fasse
      // jamais disparaître ce que l'employé a réellement transmis.
      caisseReelleOrigine: cash ? cash.caisse_reelle_origine : null,
      ecartOrigine: cash ? cash.ecart_origine : null,
      estNouveau: false,
      historiqueAudit,
    };
    // Instantané "avant" pour la trace d'audit — jamais un écrasement
    // silencieux, même en pouvoir total (Constitution NEXUS, traçabilité).
    // 09/08/2026, demande de Frédéric : "pouvoir corriger ne doit pas
    // signifier pouvoir effacer la vérité précédente" — motifEcart est
    // désormais inclus dans l'instantané (il manquait), sinon un
    // changement de motif seul ne laissait aucune trace.
    edition.avant = JSON.parse(JSON.stringify({ date: edition.date, quart: edition.quart, counts: countsMap, lotsPayes: edition.lotsPayes, caisseTirages: edition.caisseTirages, regularisations: edition.regularisations, caisseReelle: edition.caisseReelle, statutCaisse: edition.statutCaisse, motifEcart: edition.motifEcart, motifEcartTexte: edition.motifEcartTexte, resultatControle: edition.resultatControle, employeeId: edition.employeeId }));
    // Préremplissage des seules cases encore vides (09/08/2026, demande de
    // Frédéric) : "j'ai l'historique du quart 1, si je modifie le quart 2,
    // mets automatiquement le stock de fin du quart 1 au stock de départ
    // du quart 2" — un stock initial déjà saisi par un employé n'est jamais
    // touché, seules les cases jamais remplies héritent automatiquement.
    await reprefillStockInitial();
    vue = 'edition';
    renderEdition();
  }

  // Ouverture directe depuis un lien de rattrapage (13/08/2026, demande de
  // Frédéric — "revenir sur les caisses FDJ dans Pilotage car les employés
  // n'ont pas fait les inventaires") : NEXUS-FDJ-Analyse-v1.html (Pilotage)
  // pointe ici avec `?date=...&quart=...` pour un quart détecté manquant.
  // Le manager a déjà "pouvoir total" pour créer/éditer n'importe quel
  // quart (voir ouvrirEditionNouveau/ouvrirEditionExistant, existants avant
  // ce lot) — ce lot ajoute uniquement le point d'entrée direct, aucune
  // nouvelle capacité d'édition. Si un quart existe déjà à cette date (même
  // en brouillon), on l'ouvre pour complétion plutôt que d'en recréer un
  // second en doublon (contrainte UNIQUE(site,date,quart) de toute façon).
  async function ouvrirDepuisParametresUrl(dateParam, quartParam) {
    const shifts = await chargerShiftsAvecCaisse(dateParam);
    const existant = shifts.find(s => s.quart === quartParam);
    if (existant) { await ouvrirEditionExistant(existant); return; }
    await ouvrirEditionNouveau(dateParam, quartParam);
  }

  // ------------------------------------------------------------
  // CALCULS — via nexus-fdj-moteur.js, sur edition.counts.
  // ------------------------------------------------------------
  function calculerVentesEdition(gameId) {
    const jeu = jeux.find(j => j.id === gameId);
    if (!jeu) return { qte: null, valeur: null };
    return NexusFdjMoteur.calculerVentesJeu(edition.counts[gameId], jeu.prix);
  }
  function ventesGrattageTotalEdition() { return NexusFdjMoteur.ventesGrattageTotal(jeux, edition.counts); }
  function caisseGrattageEdition() { return NexusFdjMoteur.caisseGrattage(ventesGrattageTotalEdition(), edition.lotsPayes); }
  function caisseAttendueEdition() { return NexusFdjMoteur.caisseAttendue(caisseGrattageEdition(), edition.caisseTirages, edition.regularisations); }
  function ecartCaisseEdition() { return NexusFdjMoteur.ecartCaisse(edition.caisseReelle, caisseAttendueEdition()); }
  // Ventes négatives = anomalie (09/08/2026, demande de Frédéric) — même
  // règle que côté employé : jamais corrigée toute seule, juste signalée.
  function jeuxAvecVentesNegativesEdition() {
    return jeux.filter(j => { const v = calculerVentesEdition(j.id); return v.qte !== null && v.qte < 0; });
  }

  function grouperParPalier(liste) {
    const groupes = {};
    for (const j of liste) { if (!groupes[j.prix]) groupes[j.prix] = { prix: j.prix, items: [] }; groupes[j.prix].items.push(j); }
    return Object.values(groupes).sort((a,b) => a.prix - b.prix);
  }

  // ------------------------------------------------------------
  // FORMULAIRE D'ÉDITION — tout sur un seul écran (pouvoir total du
  // manager, pas d'assistant pas-à-pas comme côté employé).
  // ------------------------------------------------------------
  // 28/08/2026, demande de Frédéric : vocabulaire à trois niveaux —
  // EMPLOYÉ "Clôturer ma caisse" (déclaration initiale, irréversible),
  // MANAGER "Contrôler la clôture" (consulte écart/corrections/
  // justificatifs, analyse les anomalies), NEXUS "Certifier le contrôle"
  // (rapproche données employé + rapports FDJ + stocks, établit le résultat
  // définitif — l'acte que déclenche ce même bouton d'enregistrement).
  // "Personne ne valide sa propre caisse." Ne s'applique qu'à un quart déjà
  // clôturé par l'employé (!edition.estNouveau) — la création directe d'un
  // quart par le manager (pouvoir total, aucune clôture employé à
  // contrôler) reste "Nouveau quart FDJ" / "Enregistrer", un cas distinct.
  function renderEdition() {
    document.getElementById('titre').textContent = edition.estNouveau ? 'Nouveau quart FDJ' : 'Contrôler la clôture';
    document.getElementById('sousTitre').textContent = edition.estNouveau
      ? 'Tout est modifiable — grattage, tirages, caisse, employé assigné, statut.'
      : 'Consultez l\'écart, les corrections et les justificatifs, puis certifiez le résultat du contrôle.';
    const attendue = caisseAttendueEdition();
    const ecart = ecartCaisseEdition();
    const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const groupes = grouperParPalier(jeux);
    synchroniserVerdictAvecEcart(ecart);
    synchroniserMotifEcartAvecVerification(ecart, edition.ecartOrigine);

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourFleche">← Retour</button>
      <div id="badgesEtatQuart">${renderBadgesEtatQuart(ecart)}</div>
      <div class="champ-row">
        <div>
          <label class="champ-label">Date</label>
          <input type="date" class="champ-input" id="champDate" value="${edition.date}">
        </div>
        <div>
          <label class="champ-label">Quart</label>
          <select class="champ-select" id="champQuart">
            <option value="1" ${edition.quart==='1'?'selected':''}>Quart 1</option>
            <option value="2" ${edition.quart==='2'?'selected':''}>Quart 2</option>
          </select>
        </div>
      </div>
      ${!edition.estNouveau ? '<div class="champ-note">Changer la date ou le quart déplace ce même enregistrement — impossible si un autre quart FDJ existe déjà à cette date/quart.</div>' : ''}
      <label class="champ-label">Employé assigné</label>
      <select class="champ-select" id="champEmploye" style="margin-bottom:16px;">
        ${employesSite.map(e => `<option value="${e.id}" ${e.id===edition.employeeId?'selected':''}>${e.nom}</option>`).join('')}
      </select>

      <div class="champ-sep"></div>
      <div class="section-titre">Grattage</div>
      <div class="statut-badge provisoire" id="banniereAnomaliesEdition" style="display:${jeuxAvecVentesNegativesEdition().length ? 'block' : 'none'}; background:var(--red-dim); color:var(--red); padding:9px 12px; border-radius:8px; margin-bottom:10px; font-family:var(--sans); font-weight:600; text-transform:none;">⚠️ ${jeuxAvecVentesNegativesEdition().length} jeu${jeuxAvecVentesNegativesEdition().length > 1 ? 'x' : ''} avec des ventes négatives — vérifiez le stock saisi.</div>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuRowEdition(j)).join('')}</div>
        </div>
      `).join('')}

      <div class="champ-sep"></div>
      <div class="section-titre">Tirages</div>
      <label class="champ-label">Total des lots payés — grattage</label>
      <input type="number" inputmode="decimal" class="champ-input mono" id="champLotsPayes" value="${edition.lotsPayes ?? ''}" placeholder="0,00" style="margin-bottom:12px;">
      <label class="champ-label">Caisse tirages</label>
      <div class="champ-input-signe-row">
        <button type="button" class="btn-signe ${(edition.caisseTirages ?? 0) < 0 ? 'actif' : ''}" id="btnSigneCaisseTirages" aria-label="Rendre négatif / positif">±</button>
        <input type="number" inputmode="decimal" class="champ-input mono" id="champCaisseTirages" value="${edition.caisseTirages ?? ''}" placeholder="0,00">
      </div>

      <div class="champ-sep"></div>
      <div class="section-titre">Caisse</div>
      ${edition.caisseReelleOrigine !== null && edition.caisseReelleOrigine !== undefined ? `
        <div class="etat-banner" style="color:var(--text-mid);">
          Constat initial transmis par l'employé — caisse <b style="color:var(--text);">${fmtEuro(edition.caisseReelleOrigine)}</b>, écart <b style="color:var(--text);">${edition.ecartOrigine > 0 ? '+' : ''}${fmtEuro(edition.ecartOrigine)}</b>. Jamais effacé, même si vous régularisez ci-dessous.
        </div>
      ` : ''}
      <label class="champ-label">Régularisations</label>
      <input type="number" inputmode="decimal" class="champ-input mono" id="champRegul" value="${edition.regularisations ?? 0}" placeholder="0,00" style="margin-bottom:12px;">
      <label class="champ-label">Caisse réelle comptée</label>
      <input type="number" inputmode="decimal" class="champ-input mono" id="champCaisseReelle" value="${edition.caisseReelle ?? ''}" placeholder="0,00">

      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Ventes grattage</div><div class="stat-value">${fmtEuro(ventesGrattageTotalEdition())}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(caisseGrattageEdition())}</div></div>
        <div class="stat-row total"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(attendue)}</div></div>
        <div class="stat-row total" id="ligneEcart"><div class="stat-label">Écart</div><div class="stat-value ${classe}">${ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div></div>
      </div>

      <div id="blocMotifEcart">${renderBlocMotifEcart(ecart, edition.ecartOrigine)}</div>

      <div class="champ-sep"></div>
      <div class="section-titre">Synthèse avant validation</div>
      <div class="resume-card" id="resumeCardSynthese" style="margin-bottom:16px;">
        ${renderSyntheseAvantValidation(attendue, ecart, classe)}
      </div>

      <label class="champ-label">Verdict du contrôle</label>
      <select class="champ-select" id="champResultatControle" style="margin-bottom:16px;">
        <option value="" ${!edition.resultatControle ? 'selected' : ''}>— À choisir —</option>
        ${NexusFdjMoteur.optionsVerdictControleFdj(ecart).map(r => `<option value="${r.value}" ${r.value===edition.resultatControle?'selected':''}>${r.label}</option>`).join('')}
      </select>

      <div class="champ-sep"></div>
      <label class="champ-label">État de saisie</label>
      <select class="champ-select" id="champStatutShift" style="margin-bottom:16px;">
        <option value="brouillon" ${edition.statutShift==='brouillon'?'selected':''}>Brouillon</option>
        <option value="valide" ${edition.statutShift==='valide'?'selected':''}>Validé</option>
      </select>

      ${renderHistoriqueAuditFdj()}

      <button class="btn-primary" id="btnEnregistrer">${edition.estNouveau ? 'Enregistrer' : 'Certifier le contrôle'}</button>
      <button class="btn-ghost" id="btnAnnuler">Annuler</button>
    `;

    wireEditionInputs();
  }

  function renderJeuRowEdition(jeu) {
    const s = edition.counts[jeu.id] || { stock_initial: null, appro: 0, stock_final: null };
    const v = calculerVentesEdition(jeu.id);
    const anomalie = v.qte !== null && v.qte < 0;
    const auto = !!edition.stockInitialAuto[jeu.id];
    return `
      <div class="jeu-row ${anomalie ? 'anomalie' : ''}" data-jeu="${jeu.id}">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${anomalie ? 'anomalie' : (v.valeur !== null ? 'calc' : '')}">${anomalie ? `⚠️ Anomalie : ${fmtNum(v.qte)}` : (v.qte !== null ? `${fmtNum(v.qte)} · ${fmtEuro(v.valeur)}` : '—')}</div>
        </div>
        <div class="jeu-inputs">
          <div class="jeu-input-wrap"><div class="jeu-input-label">Initial</div><input type="number" inputmode="decimal" class="jeu-input ${auto ? 'auto' : ''}" data-jeu="${jeu.id}" data-champ="stock_initial" value="${s.stock_initial ?? ''}" title="${auto ? 'Hérité automatiquement du quart précédent' : ''}"></div>
          <div class="jeu-input-wrap"><div class="jeu-input-label">Appro</div><input type="number" inputmode="decimal" class="jeu-input" data-jeu="${jeu.id}" data-champ="appro" value="${s.appro ?? 0}"></div>
          <div class="jeu-input-wrap"><div class="jeu-input-label">Final</div><input type="number" inputmode="decimal" class="jeu-input" data-jeu="${jeu.id}" data-champ="stock_final" value="${s.stock_final ?? ''}"></div>
        </div>
      </div>
    `;
  }

  // 21/08/2026 : garde `edition.resultatControle`/`edition.statutCaisse`
  // toujours cohérents avec l'écart courant — jamais un verdict qui
  // contredit silencieusement l'écart affiché (le cas réel qui a motivé
  // ce chantier : "Conforme" choisi alors que l'écart retenu était de
  // +1,00 €). Écart nul -> verdict forcé à "Conforme" (seul choix
  // possible, rien à décider) ; écart non nul et verdict actuel devenu
  // incohérent (ex: était "Conforme" puis l'écart a changé) -> remis à
  // vide, le manager doit choisir explicitement, NEXUS ne devine jamais
  // à sa place lequel des deux verdicts s'applique.
  function synchroniserVerdictAvecEcart(ecart) {
    if (!NexusFdjMoteur.verdictCoherentAvecEcart(edition.resultatControle, ecart)) {
      edition.resultatControle = (ecart === 0) ? 'conforme' : '';
    }
    edition.statutCaisse = NexusFdjMoteur.deriverStatutCaisseDepuisVerdict(edition.resultatControle);
  }

  // 21/08/2026, demande de Frédéric suite à un cas réel où "Conforme"
  // et un écart de +1,00 € étaient affichés côte à côte sans que ce
  // soit visiblement contradictoire : trois badges de synthèse en haut
  // de l'écran, jamais un statut saisi librement. "Saisie" = état brut
  // du quart (brouillon/validé, fdj_shifts.statut) ; "Verdict" = ce que
  // le manager a tranché (ou "En attente" si rien n'est encore choisi) ;
  // "Quart" = état dérivé en lecture seule (NexusFdjMoteur.etatDuQuartFdj),
  // jamais saisi, recalculé à chaque frappe qui change l'écart.
  function renderBadgesEtatQuart(ecart) {
    const libelleSaisie = edition.statutShift === 'valide' ? 'Validé' : 'Brouillon';
    const classeSaisie = edition.statutShift === 'valide' ? 'valide' : 'brouillon';
    const libelleVerdict = edition.resultatControle ? NexusFdjMoteur.labelResultatControle(edition.resultatControle) : 'En attente';
    const etatQuart = NexusFdjMoteur.etatDuQuartFdj({ statutShift: edition.statutShift, verdictControle: edition.resultatControle, ecart });
    return `
      <div class="badges-etat-quart">
        <div class="badge-etat-cell"><div class="be-label">Saisie</div><span class="statut-badge ${classeSaisie}">${libelleSaisie}</span></div>
        <div class="badge-etat-cell"><div class="be-label">Verdict</div><span class="statut-badge ${edition.resultatControle || 'provisoire'}">${libelleVerdict}</span></div>
        <div class="badge-etat-cell"><div class="be-label">Quart</div><span class="statut-badge ${etatQuart.code}">${etatQuart.label}</span></div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // "POURQUOI CET ÉCART ?" — 28/08/2026, demande de Frédéric : restructuré
  // selon le RÉSULTAT de la vérification (voir NexusFdjMoteur.
  // situationVerificationEcart, source unique de cette décision — Article
  // 11), plutôt qu'un menu plat de 9 motifs affiché dans tous les cas.
  // 21/08/2026 (règle conservée) : masqué entièrement quand il n'y a rien
  // à expliquer.
  // ------------------------------------------------------------
  function renderBlocMotifEcart(ecart, ecartOrigine) {
    const situation = NexusFdjMoteur.situationVerificationEcart(ecart, ecartOrigine);
    if (situation === 'aucun_ecart') return '';
    if (situation === 'corrige_a_zero') return renderBlocMotifCorrige(ecartOrigine);
    return renderBlocMotifRestant(ecart);
  }

  // Branche CORRIGÉ À 0 — l'écart initialement déclaré par l'employé a
  // disparu après vérification manager : une vraie cause est exigée,
  // choisie dans le menu réduit (jamais "Correction après vérification",
  // "ce n'est pas une cause, c'est le résultat du processus de
  // vérification").
  function renderBlocMotifCorrige(ecartOrigine) {
    const options = NexusFdjMoteur.motifsEcartCorrigeDisponibles(ecartOrigine);
    return `
      <div class="etat-banner" style="color:var(--text-mid);">
        Écart initial de <b style="color:var(--text);">${ecartOrigine > 0 ? '+' : ''}${fmtEuro(ecartOrigine)}</b> — vérifié et ramené à 0,00 €. Quelle est la cause réelle ?
      </div>
      <label class="champ-label">Pourquoi cet écart ? *</label>
      <select class="champ-select" id="champMotifEcart" style="margin-bottom:${edition.motifEcart === 'autre' ? '4px' : '16px'};">
        ${options.map(m => `<option value="${m.value}" ${m.value===edition.motifEcart?'selected':''}>${m.label}</option>`).join('')}
      </select>
      ${edition.motifEcart === 'autre' ? '<div class="champ-note" id="noteMotifTexteObligatoire" style="margin:0 0 8px;">« Autre motif » nécessite le commentaire ci-dessous.</div>' : ''}
      <label class="champ-label">Commentaire / justificatif${edition.motifEcart === 'autre' ? ' *' : ' (si nécessaire)'}</label>
      <textarea class="champ-input" id="champMotifTexte" rows="2" style="margin-bottom:16px; resize:vertical;" placeholder="Précisions utiles pour retrouver ce contrôle plus tard…">${edition.motifEcartTexte || ''}</textarea>
    `;
  }

  // Branche RESTANT — l'écart persiste malgré la vérification : NEXUS ne
  // force jamais une fausse explication ("inutile de forcer le manager à
  // choisir une fausse explication"), motif automatique "Origine non
  // identifiée" (posé par synchroniserMotifEcartAvecVerification), aucun
  // menu déroulant.
  function renderBlocMotifRestant(ecart) {
    const badge = ecart > 0 ? '🟢 Excédent non expliqué' : '🔴 Manque non expliqué';
    return `
      <div class="etat-banner" style="color:var(--text-mid);">
        ${badge} : <b style="color:var(--text);">${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}</b><br>
        Origine : Non identifiée — aucune cause vérifiée ne l'explique.
      </div>
      <label class="champ-label">Commentaire / justificatif (si nécessaire)</label>
      <textarea class="champ-input" id="champMotifTexte" rows="2" style="margin-bottom:16px; resize:vertical;" placeholder="Précisions utiles pour retrouver ce contrôle plus tard…">${edition.motifEcartTexte || ''}</textarea>
    `;
  }

  // Garde edition.motifEcart cohérent avec la situation de vérification —
  // jamais un motif "corrigé à 0" qui traînerait alors que l'écart est
  // redevenu non nul, jamais un choix manuel exigé quand l'écart persiste
  // (auto "Origine non identifiée"). Même principe que
  // synchroniserVerdictAvecEcart ci-dessus — appelée aux mêmes endroits.
  function synchroniserMotifEcartAvecVerification(ecart, ecartOrigine) {
    const situation = NexusFdjMoteur.situationVerificationEcart(ecart, ecartOrigine);
    if (situation === 'restant') {
      edition.motifEcart = 'non_explique';
    } else if (situation === 'corrige_a_zero') {
      const disponibles = NexusFdjMoteur.motifsEcartCorrigeDisponibles(ecartOrigine).map(m => m.value);
      if (!disponibles.includes(edition.motifEcart)) edition.motifEcart = '';
    } else {
      edition.motifEcart = '';
      edition.motifEcartTexte = '';
    }
  }

  // F4 (20/08/2026, cahier §3, étape 7) : "Synthèse avant validation" —
  // recap en lecture seule de l'écart retenu et du motif choisi, juste
  // avant le résultat métier et la validation finale. Fonction séparée
  // (plutôt qu'inline) car appelée à la fois par renderEdition (premier
  // rendu) et majResume (frappe live dans les champs qui influent sur
  // l'écart) — une seule formule d'affichage, jamais deux qui divergent.
  // 28/08/2026, demande de Frédéric : recap enrichi selon la situation de
  // vérification (voir renderBlocMotifEcart) — reprend exactement le
  // format demandé ("Écart initial / Correction / Écart final / Motif /
  // ✅ Contrôle régularisé" ou "Écart final / Origine : Non identifiée").
  // Comportement historique conservé (Caisse attendue / Écart retenu /
  // Motif) quand il n'y a rien à régulariser.
  function renderSyntheseAvantValidation(attendue, ecart, classe) {
    const situation = NexusFdjMoteur.situationVerificationEcart(ecart, edition.ecartOrigine);
    if (situation === 'corrige_a_zero') {
      const correction = 0 - edition.ecartOrigine;
      return `
        <div class="stat-row"><div class="stat-label">Caisse attendue</div><div class="stat-value">${fmtEuro(attendue)}</div></div>
        <div class="stat-row"><div class="stat-label">Écart initial</div><div class="stat-value amber">${edition.ecartOrigine > 0 ? '+' : ''}${fmtEuro(edition.ecartOrigine)}</div></div>
        <div class="stat-row"><div class="stat-label">Correction</div><div class="stat-value">${correction > 0 ? '+' : ''}${fmtEuro(correction)}</div></div>
        <div class="stat-row"><div class="stat-label">Écart final</div><div class="stat-value green">0,00 €</div></div>
        <div class="stat-row"><div class="stat-label">Motif</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${edition.motifEcart ? labelMotifEcart(edition.motifEcart) : '—'}</div></div>
        <div class="stat-row" style="margin-bottom:0;"><div class="stat-value" style="color:var(--green); font-weight:600;">✅ Contrôle régularisé</div></div>
      `;
    }
    if (situation === 'restant') {
      return `
        <div class="stat-row"><div class="stat-label">Caisse attendue</div><div class="stat-value">${fmtEuro(attendue)}</div></div>
        <div class="stat-row total"><div class="stat-label">Écart final</div><div class="stat-value ${classe}">${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}</div></div>
        <div class="stat-row" style="margin-bottom:0;"><div class="stat-label">Origine</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">Non identifiée</div></div>
      `;
    }
    return `
      <div class="stat-row"><div class="stat-label">Caisse attendue</div><div class="stat-value">${fmtEuro(attendue)}</div></div>
      <div class="stat-row total"><div class="stat-label">Écart retenu</div><div class="stat-value ${classe}">${ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div></div>
      <div class="stat-row"><div class="stat-label">Motif</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${edition.motifEcart ? labelMotifEcart(edition.motifEcart) : '—'}</div></div>
    `;
  }

  function majResume() {
    const attendue = caisseAttendueEdition();
    const ecart = ecartCaisseEdition();
    const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    synchroniserVerdictAvecEcart(ecart);
    synchroniserMotifEcartAvecVerification(ecart, edition.ecartOrigine);
    const resume = document.querySelector('.resume-card');
    if (resume) {
      resume.innerHTML = `
        <div class="stat-row"><div class="stat-label">Ventes grattage</div><div class="stat-value">${fmtEuro(ventesGrattageTotalEdition())}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(caisseGrattageEdition())}</div></div>
        <div class="stat-row total"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(attendue)}</div></div>
        <div class="stat-row total" id="ligneEcart"><div class="stat-label">Écart</div><div class="stat-value ${classe}">${ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div></div>
      `;
    }
    const synthese = document.getElementById('resumeCardSynthese');
    if (synthese) synthese.innerHTML = renderSyntheseAvantValidation(attendue, ecart, classe);

    // 21/08/2026 — trois blocs supplémentaires dépendent de l'écart et
    // doivent être régénérés en direct (pas seulement au prochain rendu
    // complet) : le badge "Quart"/"Verdict" en haut de page, les options
    // du verdict (Conforme n'est proposable que si l'écart est nul), et
    // l'apparition/disparition du motif d'écart.
    const badges = document.getElementById('badgesEtatQuart');
    if (badges) badges.innerHTML = renderBadgesEtatQuart(ecart);

    const selectVerdict = document.getElementById('champResultatControle');
    if (selectVerdict) {
      selectVerdict.innerHTML = `
        <option value="" ${!edition.resultatControle ? 'selected' : ''}>— À choisir —</option>
        ${NexusFdjMoteur.optionsVerdictControleFdj(ecart).map(r => `<option value="${r.value}" ${r.value===edition.resultatControle?'selected':''}>${r.label}</option>`).join('')}
      `;
    }

    const blocMotif = document.getElementById('blocMotifEcart');
    if (blocMotif) {
      blocMotif.innerHTML = renderBlocMotifEcart(ecart, edition.ecartOrigine);
      const selMotif = document.getElementById('champMotifEcart');
      if (selMotif) selMotif.addEventListener('change', e => { edition.motifEcart = e.target.value; renderEdition(); });
      const txtMotif = document.getElementById('champMotifTexte');
      if (txtMotif) txtMotif.addEventListener('input', e => edition.motifEcartTexte = e.target.value);
    }
  }

  function wireEditionInputs() {
    // Retour rapide (09/08/2026, demande de Frédéric) : le formulaire est
    // long, "Annuler" tout en bas obligeait à tout redescendre. Même
    // action que le bouton "Annuler".
    document.getElementById('btnRetourFleche').addEventListener('click', () => { vue = 'liste'; edition = null; renderAccueil(); });
    // Date/quart modifiables (09/08/2026, demande de Frédéric) : chaque
    // changement recalcule le préremplissage du stock initial pour la
    // nouvelle date/quart choisie (voir reprefillStockInitial), sans jamais
    // toucher une case déjà saisie à la main.
    document.getElementById('champDate').addEventListener('change', async e => { edition.date = e.target.value; await reprefillStockInitial(); renderEdition(); });
    document.getElementById('champQuart').addEventListener('change', async e => { edition.quart = e.target.value; await reprefillStockInitial(); renderEdition(); });
    document.getElementById('champEmploye').addEventListener('change', e => edition.employeeId = e.target.value);
    // "État de saisie" (ex-"Statut du quart") conditionne "État du quart"
    // (badge dérivé) — re-rendu complet pour rester cohérent partout.
    document.getElementById('champStatutShift').addEventListener('change', e => { edition.statutShift = e.target.value; renderEdition(); });
    // F4 (20/08/2026) : re-rendu complet (comme date/quart ci-dessus) plutôt
    // qu'une simple mutation — le motif choisi conditionne à la fois la note
    // "commentaire obligatoire" et la ligne "Motif" de la synthèse, deux
    // endroits qu'une mutation silencieuse laisserait désynchronisés.
    const selMotifInit = document.getElementById('champMotifEcart');
    if (selMotifInit) selMotifInit.addEventListener('change', e => { edition.motifEcart = e.target.value; renderEdition(); });
    const txtMotifInit = document.getElementById('champMotifTexte');
    if (txtMotifInit) txtMotifInit.addEventListener('input', e => edition.motifEcartTexte = e.target.value);
    // 21/08/2026 : le verdict n'est plus une simple mutation silencieuse —
    // il détermine le statut de caisse dérivé (synchroniserVerdictAvecEcart)
    // et le badge "Quart" en haut de page, d'où le re-rendu complet.
    document.getElementById('champResultatControle').addEventListener('change', e => { edition.resultatControle = e.target.value; renderEdition(); });

    document.querySelectorAll('.jeu-input').forEach(input => {
      input.addEventListener('input', () => {
        const gameId = input.dataset.jeu, champ = input.dataset.champ;
        const val = input.value === '' ? null : Number(input.value);
        if (!edition.counts[gameId]) edition.counts[gameId] = { stock_initial: null, appro: 0, stock_final: null };
        edition.counts[gameId][champ] = val;
        // Dès que le manager touche lui-même le stock initial, ce n'est
        // plus une valeur héritée automatiquement — un futur changement de
        // date/quart ne doit plus jamais l'écraser.
        if (champ === 'stock_initial') { edition.stockInitialAuto[gameId] = false; input.classList.remove('auto'); }
        const row = input.closest('.jeu-row');
        const v = calculerVentesEdition(gameId);
        const anomalie = v.qte !== null && v.qte < 0;
        row.classList.toggle('anomalie', anomalie);
        const venteEl = row.querySelector('.jeu-ventes');
        venteEl.className = `jeu-ventes ${anomalie ? 'anomalie' : (v.valeur !== null ? 'calc' : '')}`;
        venteEl.textContent = anomalie ? `⚠️ Anomalie : ${fmtNum(v.qte)}` : (v.qte !== null ? `${fmtNum(v.qte)} · ${fmtEuro(v.valeur)}` : '—');
        const anomalies = jeuxAvecVentesNegativesEdition();
        const banniereAnomalies = document.getElementById('banniereAnomaliesEdition');
        if (banniereAnomalies) {
          banniereAnomalies.style.display = anomalies.length ? '' : 'none';
          banniereAnomalies.textContent = `⚠️ ${anomalies.length} jeu${anomalies.length > 1 ? 'x' : ''} avec des ventes négatives — vérifiez le stock saisi.`;
        }
        majResume();
      });
      input.addEventListener('keydown', jeuInputToucheEntree);
    });
    document.getElementById('champLotsPayes').addEventListener('input', e => { edition.lotsPayes = e.target.value === '' ? null : Number(e.target.value); majResume(); });
    document.getElementById('champCaisseTirages').addEventListener('input', e => {
      edition.caisseTirages = e.target.value === '' ? null : Number(e.target.value);
      document.getElementById('btnSigneCaisseTirages').classList.toggle('actif', (edition.caisseTirages ?? 0) < 0);
      majResume();
    });
    // Bouton ± (10/08/2026) : même correctif que NEXUS-FDJ-v1.html — inverse
    // le signe de la valeur déjà saisie, garantit un moyen d'entrer une
    // caisse tirages négative même quand le clavier numérique mobile
    // n'affiche pas la touche "-".
    document.getElementById('btnSigneCaisseTirages').addEventListener('click', () => {
      const input = document.getElementById('champCaisseTirages');
      const valeur = input.value === '' ? 0 : Number(input.value);
      const inversee = -valeur;
      input.value = inversee === 0 ? '' : inversee;
      edition.caisseTirages = input.value === '' ? null : inversee;
      document.getElementById('btnSigneCaisseTirages').classList.toggle('actif', inversee < 0);
      majResume();
      input.focus();
    });
    document.getElementById('champRegul').addEventListener('input', e => { edition.regularisations = e.target.value === '' ? 0 : Number(e.target.value); majResume(); });
    document.getElementById('champCaisseReelle').addEventListener('input', e => { edition.caisseReelle = e.target.value === '' ? null : Number(e.target.value); majResume(); });

    document.getElementById('btnEnregistrer').addEventListener('click', enregistrerEdition);
    document.getElementById('btnAnnuler').addEventListener('click', () => { vue = 'liste'; edition = null; renderAccueil(); });
  }

  // ------------------------------------------------------------
  // ENREGISTREMENT — pouvoir total : écrase directement, sans étape
  // d'approbation. Une trace reste dans fdj_audit_log (avant/après), sans
  // jamais bloquer l'enregistrement (traçabilité, pas contrôle d'accès).
  // ------------------------------------------------------------
  async function enregistrerEdition() {
    // 21/08/2026, refonte statuts FDJ (demande de Frédéric) : ces
    // validations empêchent d'enregistrer un état incohérent (verdict non
    // choisi, verdict qui ne correspond plus à l'écart affiché, écart non
    // justifié par un motif). Bloqué côté client avant tout appel réseau,
    // comme le reste des validations de ce formulaire (ex. contrainte
    // unique date/quart, gérée par la base plus bas).
    const ecartValidation = ecartCaisseEdition();
    if (!edition.resultatControle) {
      alert('Choisissez un verdict du contrôle (Conforme / Conforme avec écart justifié / Écart à régulariser) avant d\'enregistrer.');
      const selVerdict = document.getElementById('champResultatControle');
      if (selVerdict) selVerdict.focus();
      return;
    }
    if (!NexusFdjMoteur.verdictCoherentAvecEcart(edition.resultatControle, ecartValidation)) {
      alert('Le verdict choisi ne correspond plus à l\'écart actuel (' + fmtEuro(ecartValidation) + ') — le formulaire vient de le recalculer, vérifiez-le avant d\'enregistrer.');
      renderEdition();
      return;
    }
    if (NexusFdjMoteur.motifEcartObligatoire(ecartValidation, edition.ecartOrigine) && !edition.motifEcart) {
      alert('Un motif est nécessaire — choisissez la cause réelle de l\'écart avant d\'enregistrer.');
      const selMotif = document.getElementById('champMotifEcart');
      if (selMotif) selMotif.focus();
      return;
    }
    // F4 (20/08/2026, cahier §3, tableau des motifs) : "Autre motif — Champ
    // texte obligatoire".
    if (edition.motifEcart === 'autre' && !(edition.motifEcartTexte || '').trim()) {
      alert('« Autre motif » nécessite un commentaire — précisez la raison de la modification dans le champ Commentaire / justificatif.');
      const txtMotif = document.getElementById('champMotifTexte');
      if (txtMotif) txtMotif.focus();
      return;
    }
    const btn = document.getElementById('btnEnregistrer');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    // 28/08/2026 : libellé de repli après erreur — dépend du même
    // edition.estNouveau que le rendu initial du bouton (Article 11, une
    // seule règle de libellé, jamais un "Enregistrer" générique qui
    // contredirait le titre "Contrôler la clôture").
    const libelleBouton = edition.estNouveau ? 'Enregistrer' : 'Certifier le contrôle';

    // 1) Résoudre le quart (existant ou nouveau). Date et quart sont inclus
    // dans le même UPDATE ... WHERE id= (09/08/2026, demande de Frédéric) :
    // ça déplace la ligne existante, ça n'en crée jamais une seconde. Si la
    // date/quart choisie est déjà prise par un autre quart FDJ, la
    // contrainte unique (site,date,quart) de la base refuse l'écriture
    // (code Postgres 23505) — NEXUS l'explique plutôt que de laisser passer
    // un écrasement silencieux de l'autre quart.
    let shift;
    if (edition.shiftId) {
      const { data, error } = await nexusClient.from('fdj_shifts')
        .update({ date: edition.date, quart: edition.quart, employee_id: edition.employeeId, statut: edition.statutShift, valide_le: edition.statutShift === 'valide' ? new Date().toISOString() : null })
        .eq('id', edition.shiftId).select().single();
      if (error) {
        console.error('Mise à jour quart FDJ:', error);
        btn.disabled = false; btn.textContent = libelleBouton;
        if (error.code === '23505') alert(`Un quart FDJ existe déjà pour le ${new Date(edition.date + 'T00:00:00').toLocaleDateString('fr-FR')} — Quart ${edition.quart}. Modifiez ce quart-là directement plutôt que de déplacer celui-ci, ou choisissez une autre date/quart.`);
        else alert('Erreur de mise à jour du quart. Réessayez.');
        return;
      }
      shift = data;
    } else {
      const { data: existant } = await nexusClient.from('fdj_shifts').select('*').eq('site', siteId).eq('date', edition.date).eq('quart', edition.quart).maybeSingle();
      if (existant) {
        const { data, error } = await nexusClient.from('fdj_shifts')
          .update({ employee_id: edition.employeeId, statut: edition.statutShift })
          .eq('id', existant.id).select().single();
        if (error) { console.error('Mise à jour quart FDJ existant:', error); btn.disabled = false; btn.textContent = libelleBouton; return; }
        shift = data;
      } else {
        const { data, error } = await nexusClient.from('fdj_shifts')
          .insert({ site: siteId, date: edition.date, quart: edition.quart, employee_id: edition.employeeId, statut: edition.statutShift, ouvert_le: new Date().toISOString() })
          .select().single();
        if (error) { console.error('Création quart FDJ:', error); btn.disabled = false; btn.textContent = libelleBouton; alert('Erreur de création du quart. Réessayez.'); return; }
        shift = data;
      }
    }

    // 2) Comptages — upsert des jeux réellement touchés par le manager.
    const lignes = jeux.filter(j => {
      const s = edition.counts[j.id];
      return s && (s.stock_initial !== null || s.appro || s.stock_final !== null);
    }).map(j => {
      const s = edition.counts[j.id];
      const v = calculerVentesEdition(j.id);
      // 16/08/2026 : persiste enfin edition.stockInitialAuto (jusqu'ici
      // uniquement en mémoire) — condition nécessaire pour que
      // reconcilierAlertesChaine sache, après coup, si ce stock_initial
      // reste éligible à une réécriture automatique lors d'un futur
      // rétablissement de chaîne, ou s'il a été confirmé par un humain.
      return { site: siteId, shift_id: shift.id, game_id: j.id, stock_initial: s.stock_initial, appro: s.appro || 0, stock_final: s.stock_final, ventes_qte: v.qte, ventes_valeur: v.valeur, stock_initial_auto: !!edition.stockInitialAuto[j.id], updated_at: new Date().toISOString() };
    });
    if (lignes.length) {
      const { error } = await nexusClient.from('fdj_shift_counts').upsert(lignes, { onConflict: 'shift_id,game_id' });
      if (error) { console.error('Enregistrement comptages FDJ (manager):', error); btn.disabled = false; btn.textContent = libelleBouton; alert('Erreur sur le grattage. Réessayez.'); return; }
    }

    // 2bis) SYNCHRONISATION CONTRÔLÉE APPRO <-> ACTIVATION (27/08/2026,
    // demande explicite de Frédéric). Jusqu'ici, une correction manager de
    // l'Appro d'un quart passé (`enregistrerEdition`) ne touchait QUE
    // `fdj_shift_counts` — jamais `fdj_stock_movements` (v2.67, portée MVP
    // volontairement limitée à "détecter et signaler, jamais reconstruire").
    // Frédéric formalise maintenant la règle explicite : "Appro est la
    // donnée de vente du quart. Activation est le mouvement de stock. Les
    // deux restent conceptuellement distincts, mais NEXUS doit les
    // rapprocher automatiquement et proposer une correction explicite
    // lorsqu'ils se contredisent." Jamais automatique : chaque
    // synchronisation ou annulation reste sous confirmation explicite du
    // manager, jamais un écrasement silencieux (même discipline que le
    // pouvoir total de cet écran — "pouvoir corriger ne doit pas signifier
    // pouvoir effacer la vérité précédente").
    //
    // Ne concerne QUE les jeux dont l'Appro a réellement changé dans cette
    // édition (`edition.avant.counts` — déjà chargé, jamais une deuxième
    // lecture pour comparer) et dont le conditionnement (tickets_par_carnet)
    // est connu (sinon `reconciliationApproActivation` répond
    // 'conditionnement_inconnu', jamais une activation devinée).
    const jeuxAvecApproModifie = jeux.filter(j => {
      const s = edition.counts[j.id];
      if (!s || !j.tickets_par_carnet) return false;
      const approAvant = (edition.avant && edition.avant.counts && edition.avant.counts[j.id]) ? (edition.avant.counts[j.id].appro || 0) : 0;
      return (s.appro || 0) !== approAvant;
    });
    if (jeuxAvecApproModifie.length) {
      // Une seule requête pour tous les jeux concernés de ce quart (Article
      // 11 — jamais une requête par jeu) : mouvements 'activation'/
      // 'correction' déjà posés sur CE quart précis, qui alimentent le total
      // `carnetsActives` attendu par `reconciliationApproActivation` ainsi
      // que la distinction d'origine faite par
      // `decisionSynchronisationApproActivation`.
      const { data: mouvementsQuart, error: eMouv } = await nexusClient.from('fdj_stock_movements')
        .select('game_id, quantite, methode_identification').eq('shift_id', shift.id).eq('site', siteId)
        .in('type_mouvement', ['activation', 'correction']);
      if (eMouv) console.error('Chargement mouvements activation du quart (synchronisation Appro/Activation manager):', eMouv);
      const mouvementsParJeu = {};
      (mouvementsQuart || []).forEach(m => { (mouvementsParJeu[m.game_id] = mouvementsParJeu[m.game_id] || []).push(m); });

      for (const j of jeuxAvecApproModifie) {
        const mvts = mouvementsParJeu[j.id] || [];
        const activesQuart = mvts.reduce((somme, m) => somme + Number(m.quantite || 0), 0);
        const approApres = edition.counts[j.id].appro || 0;
        const reconciliation = NexusFdjMoteur.reconciliationApproActivation(approApres, activesQuart, j.tickets_par_carnet);
        const decision = NexusFdjMoteur.decisionSynchronisationApproActivation(reconciliation, mvts);
        const referenceQuart = `${new Date(edition.date + 'T00:00:00').toLocaleDateString('fr-FR')} — Quart ${edition.quart}`;

        if (decision.action === 'proposer_synchronisation') {
          const pluriel = decision.carnets > 1;
          const message = `NEXUS a détecté qu'${pluriel ? 'des carnets semblent' : 'un carnet semble'} avoir été activé${pluriel ? 's' : ''} pendant ce quart.\n\n${j.nom} : ${reconciliation.appro} tickets d'appro = ${decision.carnets} carnet${pluriel ? 's' : ''} non retrouvé${pluriel ? 's' : ''} en activation.\n\nSouhaitez-vous mettre à jour le stock FDJ en conséquence ?`;
          if (confirm(`${message}\n\n[OK] Oui, synchroniser\n[Annuler] Non, conserver uniquement la correction du quart`)) {
            await creerActivationReconstitueeCorrectionManager(j.id, shift, decision.carnets,
              `Activation reconstituée suite à la correction du quart du ${referenceQuart} par ${managerCourant.nom} — appro corrigé à ${approApres} tickets pour ${j.nom}, aucune activation correspondante trouvée.`);
          }
        } else if (decision.action === 'proposer_annulation') {
          const pluriel = decision.carnetsReconstitues > 1;
          const message = `Cette correction remet en cause une activation reconstituée précédemment pour ${j.nom} (${decision.carnetsReconstitues} carnet${pluriel ? 's' : ''}).\n\nSouhaitez-vous l'annuler ?`;
          if (confirm(`${message}\n\n[OK] Oui, annuler l'activation reconstituée\n[Annuler] Non, conserver telle quelle (à vérifier plus tard)`)) {
            await creerActivationReconstitueeCorrectionManager(j.id, shift, -decision.carnetsReconstitues,
              `Annulation d'une activation reconstituée suite à la correction du quart du ${referenceQuart} par ${managerCourant.nom} — appro recorrigé à ${approApres} tickets pour ${j.nom}, ne justifie plus l'activation reconstituée précédente.`);
          }
        }
        // 'signaler_ecart_direct' et 'aucune' : jamais d'action proposée ici
        // — le premier reste visible via le badge existant "⚠️ À rapprocher"
        // (approNonTraceParJeu), le second n'a simplement rien à signaler.
      }
    }

    // 3) Rapports.
    const { error: eRep } = await nexusClient.from('fdj_reports').upsert([
      { site: siteId, shift_id: shift.id, type_rapport: 'journalier', lots_payes_grattage: edition.lotsPayes, saisi_par: managerCourant.id },
      { site: siteId, shift_id: shift.id, type_rapport: 'temps_reel', caisse_tirages: edition.caisseTirages, saisi_par: managerCourant.id },
    ], { onConflict: 'shift_id,type_rapport' });
    if (eRep) { console.error('Enregistrement rapports FDJ (manager):', eRep); btn.disabled = false; btn.textContent = libelleBouton; alert('Erreur sur les tirages. Réessayez.'); return; }

    // 4) Rapprochement caisse — le manager choisit lui-même le statut
    // (pouvoir total), valide_par/valide_le posés dès qu'il enregistre ici.
    const ecart = ecartCaisseEdition();
    const { error: eCash } = await nexusClient.from('fdj_cash_controls').upsert({
      site: siteId, shift_id: shift.id,
      ventes_grattage_valeur: ventesGrattageTotalEdition(), lots_payes_grattage: edition.lotsPayes,
      caisse_grattage: caisseGrattageEdition(), caisse_tirages: edition.caisseTirages,
      regularisations: edition.regularisations || 0, caisse_attendue: caisseAttendueEdition(), caisse_reelle: edition.caisseReelle,
      ecart, motif_ecart: edition.motifEcart || null, motif_ecart_texte: edition.motifEcartTexte || null,
      resultat_controle: edition.resultatControle || null, statut: edition.statutCaisse,
      valide_par: managerCourant.id, valide_le: new Date().toISOString(), updated_at: new Date().toISOString(),
    }, { onConflict: 'shift_id' });
    if (eCash) { console.error('Enregistrement caisse FDJ (manager):', eCash); btn.disabled = false; btn.textContent = libelleBouton; alert('Erreur sur la caisse. Réessayez.'); return; }

    // 5) Trace d'audit — avant/après, jamais un écrasement silencieux même
    // en pouvoir total. 09/08/2026, demande de Frédéric : "pouvoir corriger
    // ne doit pas signifier pouvoir effacer la vérité précédente" — motif
    // désormais inclus (colonne dédiée + instantanés), sinon un changement
    // de motif seul ne laissait aucune trace.
    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: shift.id, entite_type: 'fdj_shift', entite_id: shift.id,
      action: edition.estNouveau ? 'creation_manager' : 'correction_manager', acteur_id: managerCourant.id,
      motif: edition.motifEcart || null,
      ancienne_valeur: edition.avant, nouvelle_valeur: { date: edition.date, quart: edition.quart, counts: edition.counts, lotsPayes: edition.lotsPayes, caisseTirages: edition.caisseTirages, regularisations: edition.regularisations, caisseReelle: edition.caisseReelle, statutCaisse: edition.statutCaisse, motifEcart: edition.motifEcart, motifEcartTexte: edition.motifEcartTexte, resultatControle: edition.resultatControle, employeeId: edition.employeeId, ecart },
    });

    // 6) Relevé de clôture FDJ / Trace de contrôle FDJ — version
    // régularisation manager (16/08/2026, demande de Frédéric). Chaque
    // intervention manager pose une NOUVELLE version, jamais un écrasement
    // de la précédente (immuable en base, voir RLS insert-only). Une
    // version n'est posée que si quelque chose a RÉELLEMENT changé (via
    // NexusFdjMoteur.diffClotureFdj) — jamais un doublon vide si le manager
    // rouvre puis réenregistre sans rien modifier — sauf pour la toute
    // première version d'un quart créé directement par le manager (aucune
    // version précédente à comparer, c'est la ligne de base).
    const stockInitialParJeu = {}, approParJeu = {}, stockFinalParJeu = {}, ventesParJeu = {};
    jeux.forEach(j => {
      const s = edition.counts[j.id];
      if (!s || (s.stock_initial === null && !s.appro && s.stock_final === null)) return;
      const v = calculerVentesEdition(j.id);
      stockInitialParJeu[j.id] = s.stock_initial ?? null;
      approParJeu[j.id] = s.appro || 0;
      stockFinalParJeu[j.id] = s.stock_final ?? null;
