    // (renderJeuStockEtat), jamais recalculés à deux endroits (Article 11).
    const maintenant = new Date();
    const rotationParJeu = {}, ticketsRestantsParJeu = {}, autonomieParJeu = {};
    jeux.forEach(j => {
      const rotation = NexusFdjMoteur.rotationCarnetsJeu(mouvements, j.id, maintenant, undefined, referenceCreeLe);
      const ticketsRestants = NexusFdjMoteur.ticketsRestantsCarnetEnCours(mouvements, shiftCountsStock, j.id, j.tickets_par_carnet);
      rotationParJeu[j.id] = rotation;
      ticketsRestantsParJeu[j.id] = ticketsRestants;
      autonomieParJeu[j.id] = NexusFdjMoteur.calculerAutonomieJeu({
        solde: soldes[j.id], ticketsRestants, ticketsParCarnet: j.tickets_par_carnet, rotationCarnetsJour: rotation,
      });
    });

    stockEtat = {
      soldes, reference, dernieresReceptions: derniereReceptionParJeu(mouvements),
      approNonTrace: NexusFdjMoteur.approNonTraceParJeu(shiftCountsStock, mouvements, referenceCreeLe),
      quartsConcernesParJeu, rotationParJeu, ticketsRestantsParJeu, autonomieParJeu,
    };
    // Filtre par défaut : priorité au plus urgent — "à réapprovisionner"
    // s'il y en a, sinon "à rapprocher" s'il y en a (demande de Frédéric —
    // "par défaut, côté manager, je mettrais même 'à rapprocher'", conservé
    // pour l'axe traçabilité, mais désormais après le vrai risque de
    // rupture), sinon "tous" (rien à prioriser).
    const etatsInitiaux = {};
    jeux.forEach(j => {
      etatsInitiaux[j.id] = NexusFdjMoteur.etatLigneStockV2(stockEtat.soldes[j.id], stockEtat.approNonTrace[j.id] || 0, j.tickets_par_carnet, ticketsRestantsParJeu[j.id], autonomieParJeu[j.id]);
    });
    const compteReappro = jeux.filter(j => etatsInitiaux[j.id].statut === 'reapprovisionner').length;
    const compteRapprocher = jeux.filter(j => etatsInitiaux[j.id].statut === 'rapprocher').length;
    stockEtatFiltre = compteReappro > 0 ? 'reapprovisionner' : (compteRapprocher > 0 ? 'rapprocher' : 'tous');
    vue = 'stock-etat';
    renderStockEtat();
  }

  // Classification de ligne — voir NexusFdjMoteur.etatLigneStockV2 pour le
  // détail des règles (14/08/2026, refonte lecture managériale : sépare
  // 'reapprovisionner'/'vigilance'/'ok' — l'axe STOCK — de 'rapprocher' —
  // l'axe TRAÇABILITÉ, un rapprochement en attente prime toujours car les
  // chiffres de stock ne sont alors pas fiables). Wrapper local minimal :
  // lit rotationParJeu/ticketsRestantsParJeu/autonomieParJeu déjà calculés
  // dans ouvrirStockEtat, jamais recalculés ici.
  function etatLigneStock(gameId, solde, approNonTrace, ticketsParCarnet) {
    return NexusFdjMoteur.etatLigneStockV2(solde, approNonTrace, ticketsParCarnet, stockEtat.ticketsRestantsParJeu[gameId], stockEtat.autonomieParJeu[gameId]);
  }

  const FDJ_STOCK_FILTRES = [
    { cle: 'tous', label: 'Tous' },
    { cle: 'reapprovisionner', label: '🔴 À réapprovisionner' },
    { cle: 'vigilance', label: '🟠 Vigilance' },
    { cle: 'rapprocher', label: '⚠️ À rapprocher' },
    { cle: 'ok', label: '🟢 OK' },
  ];

  function renderStockEtat() {
    document.getElementById('titre').textContent = 'État du stock FDJ';
    document.getElementById('sousTitre').textContent = 'Réserve bureau, caisse non activée et carnet en cours — jamais codé en dur.';
    const ref = stockEtat.reference;
    const bloques = jeux.map(j => ({ jeu: j, solde: stockEtat.soldes[j.id] || {} })).filter(x => (x.solde.bloques || 0) > 0);

    const etats = {};
    jeux.forEach(j => {
      etats[j.id] = etatLigneStock(j.id, stockEtat.soldes[j.id] || { bureau: 0, confies: 0, actives: 0, bloques: 0, nonActives: 0 }, stockEtat.approNonTrace[j.id] || 0, j.tickets_par_carnet);
    });
    const compte = { tous: jeux.length, reapprovisionner: 0, vigilance: 0, rapprocher: 0, ok: 0 };
    jeux.forEach(j => { compte[etats[j.id].statut]++; });

    // Synthèse globale (14/08/2026, refonte lecture managériale) —
    // "🎟️ État FDJ caisse" : totaux + recommandation d'action dérivée de
    // faits déjà connus (jamais une supposition), voir
    // NexusFdjMoteur.syntheseGlobaleFdjStock.
    const synthese = NexusFdjMoteur.syntheseGlobaleFdjStock(jeux, etats, stockEtat.soldes);

    const jeuxFiltres = jeux.filter(j => stockEtatFiltre === 'tous' || etats[j.id].statut === stockEtatFiltre);
    const groupes = grouperParPalier(jeuxFiltres);

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourStockEtat">← Retour</button>
      <div class="resume-card fdj-stock-synthese">
        <div class="titre-synthese">🎟️ État FDJ caisse</div>
        <div class="ligne-synthese">${synthese.compte.tous} jeu${synthese.compte.tous > 1 ? 'x' : ''} suivi${synthese.compte.tous > 1 ? 's' : ''} · ${fmtNum(synthese.carnetsDisponiblesCaisse)} carnet${synthese.carnetsDisponiblesCaisse > 1 ? 's' : ''} disponible${synthese.carnetsDisponiblesCaisse > 1 ? 's' : ''} en caisse</div>
        <div class="ligne-synthese">🟢 ${synthese.compte.ok} couvert${synthese.compte.ok > 1 ? 's' : ''} · 🟠 ${synthese.compte.vigilance} à surveiller · 🔴 ${synthese.compte.reapprovisionner} à réapprovisionner${synthese.compte.rapprocher ? ` · ⚠️ ${synthese.compte.rapprocher} à rapprocher` : ''}</div>
        <div class="ligne-synthese">${ref ? `Dernier point zéro : ${new Date(ref.date + 'T00:00:00').toLocaleDateString('fr-FR')}.` : 'Aucun contrôle physique enregistré — stock théorique depuis zéro, à fiabiliser via "Contrôle physique du stock".'}</div>
        ${synthese.recommandation ? `<div class="recommandation">NEXUS recommande : ${synthese.recommandation}</div>` : ''}
      </div>
      <div class="fdj-stock-filtres">
        ${FDJ_STOCK_FILTRES.map(f => `<button type="button" class="fdj-stock-filtre${stockEtatFiltre === f.cle ? ' active' : ''}" data-filtre="${f.cle}">${f.label} <span class="compte">${compte[f.cle]}</span></button>`).join('')}
      </div>
      <button class="btn-nouveau" id="btnOuvrirBlocage">🚫 Signaler un retrait / blocage</button>
      ${bloques.length ? `
        <div class="section-titre">Retraits / blocages en cours (${bloques.length})</div>
        <div class="card" style="margin-bottom:16px;">
          ${bloques.map(({ jeu, solde }) => `
            <div class="jeu-row" data-jeu-bloque="${jeu.id}">
              <div class="jeu-nom-ligne">
                <div class="jeu-nom">${jeu.nom}</div>
                <div class="jeu-ventes anomalie">${solde.bloques} bloqué${solde.bloques > 1 ? 's' : ''}</div>
              </div>
              <button type="button" class="btn-modifier" data-retourner="${jeu.id}" style="margin-top:6px; width:100%;">↩️ Retourner au bureau</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="section-titre">Par jeu</div>
      ${groupes.length ? groupes.map(g => {
        const items = g.items.map(j => ({ jeu: j, etat: etats[j.id] }));
        return `
        <div class="palier-block">
          <div class="fdj-stock-palier-head${stockEtatPaliersReplies.has(String(g.prix)) ? ' replie' : ''}" data-palier="${g.prix}">
            <span>${fmtNum(g.prix)} € — ${g.items.length} jeu${g.items.length > 1 ? 'x' : ''}</span>
            <span class="fleche">▾</span>
          </div>
          <div class="card fdj-stock-palier-corps" id="palierCorps-${String(g.prix).replace('.', '_')}" style="${stockEtatPaliersReplies.has(String(g.prix)) ? 'display:none;' : ''}">
            <div class="fdj-stock-palier-phrase">${NexusFdjMoteur.phraseFamillePalier(items)}</div>
            <div class="fdj-stock-head">
              <div class="fdj-stock-head-nom">Jeu</div>
              <div class="fdj-stock-head-metrics"><span>Réserve</span><span>Caisse</span><span>En cours</span></div>
              <div class="fdj-stock-head-statut"></div>
            </div>
            ${g.items.map(j => renderJeuStockEtat(j, etats[j.id])).join('')}
          </div>
        </div>
      `;
      }).join('') : `<div class="empty">Aucun jeu dans ce filtre.</div>`}
    `;
    document.getElementById('btnRetourStockEtat').addEventListener('click', () => { vue = 'liste'; stockEtat = null; stockEtatFiltre = 'tous'; renderAccueil(); });
    document.getElementById('btnOuvrirBlocage').addEventListener('click', () => ouvrirBlocage());
    document.querySelectorAll('[data-retourner]').forEach(btn => btn.addEventListener('click', () => retournerDepuisBloque(btn.dataset.retourner)));
    document.querySelectorAll('[data-rapprocher]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const estime = btn.dataset.estime ? Number(btn.dataset.estime) : null;
      ouvrirRapprochement(btn.dataset.rapprocher, estime);
    }));
    document.querySelectorAll('.fdj-stock-filtre').forEach(btn => btn.addEventListener('click', () => { stockEtatFiltre = btn.dataset.filtre; renderStockEtat(); }));
    document.querySelectorAll('.fdj-stock-palier-head').forEach(head => head.addEventListener('click', () => {
      const prix = head.dataset.palier;
      if (stockEtatPaliersReplies.has(prix)) stockEtatPaliersReplies.delete(prix); else stockEtatPaliersReplies.add(prix);
      head.classList.toggle('replie');
      const corps = document.getElementById(`palierCorps-${prix.replace('.', '_')}`);
      if (corps) corps.style.display = stockEtatPaliersReplies.has(prix) ? 'none' : '';
    }));
    document.querySelectorAll('.fdj-stock-row').forEach(row => row.addEventListener('click', () => {
      const detail = row.nextElementSibling;
      if (detail && detail.classList.contains('fdj-stock-detail')) detail.classList.toggle('open');
    }));
  }

  // Phrase de conclusion du détail (14/08/2026) — une ligne, cohérente
  // avec le badge de la ligne compacte, jamais un second jugement
  // concurrent. Ne s'affiche que pour l'axe stock (jamais pour
  // 'rapprocher', qui a déjà son propre bloc dédié ci-dessous).
  function conclusionStock(etat) {
    if (etat.statut === 'reapprovisionner') return { couleur: 'rouge', texte: etat.badge === '🔴 Rupture totale' ? 'Aucun réapprovisionnement possible depuis le bureau — commande à prévoir.' : 'Réapprovisionnement nécessaire : redescendez un carnet du bureau vers la caisse.' };
    if (etat.statut === 'vigilance') return { couleur: 'ambre', texte: 'À surveiller — activez un carnet en réserve ou préparez le réapprovisionnement.' };
    if (etat.statut === 'ok') return { couleur: 'vert', texte: 'Aucun réapprovisionnement nécessaire.' };
    return null;
  }

  // Niveau 1 (ligne compacte, toujours visible) + Niveau 2 (détail replié,
  // ouvert au clic sur la ligne — même mécanique que .histo-item plus haut).
  // 14/08/2026 (refonte lecture managériale) : le détail expose maintenant
  // tickets restants du carnet en cours, rotation moyenne et autonomie
  // estimée — chacun avec son propre "non calculable" explicite si les
  // données manquent (Article 5 : jamais un chiffre inventé).
  function renderJeuStockEtat(jeu, etat) {
    const solde = stockEtat.soldes[jeu.id] || { bureau: 0, confies: 0, actives: 0, bloques: 0, nonActives: 0 };
    const derniereReception = stockEtat.dernieresReceptions[jeu.id];
    const anciennete = ancienneteJours(derniereReception);
    const quartsConcernes = stockEtat.quartsConcernesParJeu[jeu.id] || [];
    const noteReception = `<div class="histo-sub">${derniereReception ? `Dernière réception : il y a ${anciennete} jour${anciennete > 1 ? 's' : ''} (${new Date(derniereReception).toLocaleDateString('fr-FR')})` : 'Aucune réception enregistrée'}</div>`;

    const ticketsRestants = stockEtat.ticketsRestantsParJeu[jeu.id];
    const rotation = stockEtat.rotationParJeu[jeu.id];
    const autonomie = stockEtat.autonomieParJeu[jeu.id];
    const mesures = !etat.rapprochement ? `
      <div class="fdj-stock-mesure-row"><span>Réserve bureau</span><b>${fmtNum(solde.bureau)} carnet${solde.bureau > 1 ? 's' : ''}</b></div>
      <div class="fdj-stock-mesure-row"><span>Caisse non activés</span><b>${fmtNum(solde.nonActives)} carnet${solde.nonActives > 1 ? 's' : ''}</b></div>
      <div class="fdj-stock-mesure-row"><span>Carnet en cours</span><b>${solde.actives > 0 ? `${fmtNum(solde.actives)} activé${solde.actives > 1 ? 's' : ''} depuis le point zéro` : 'Aucun'}</b></div>
      <div class="fdj-stock-mesure-row"><span>Tickets restants</span><b>${ticketsRestants !== null ? `${fmtNum(ticketsRestants)} / ${jeu.tickets_par_carnet}` : 'Non calculable'}</b></div>
      <div class="fdj-stock-mesure-row"><span>Rotation moyenne</span><b>${rotation > 0 ? `${fmtNum(Math.round(rotation * 100) / 100)} carnet/jour` : 'Aucune activation récente'}</b></div>
      <div class="fdj-stock-mesure-row"><span>Autonomie caisse estimée</span><b>${autonomie.jours !== null ? `${fmtNum(autonomie.jours)} jour${autonomie.jours > 1 ? 's' : ''}` : 'Non calculable'}</b></div>
    ` : '';
    const conclusion = !etat.rapprochement ? conclusionStock(etat) : null;

    return `
      <div class="fdj-stock-item">
        <div class="fdj-stock-row">
          <div class="fdj-stock-nom">${jeu.nom}</div>
          <div class="fdj-stock-metrics">
            <span>${fmtNum(solde.bureau)}</span>
            <span>${fmtNum(solde.nonActives)}</span>
            <span>${fmtNum(solde.actives)}</span>
          </div>
          <div class="fdj-stock-statut ${etat.couleur}">${etat.badge}</div>
        </div>
        <div class="fdj-stock-detail">
          ${etat.rapprochement ? `
            <div class="fdj-stock-badges">
              <span class="fdj-stock-badge amber">⚠️ ${etat.carnetsEstimes !== null ? `${etat.carnetsEstimes} carnet${etat.carnetsEstimes > 1 ? 's' : ''} estimé${etat.carnetsEstimes > 1 ? 's' : ''}` : 'carnets à rapprocher (quantité inconnue)'}</span>
              <span class="fdj-stock-badge">${fmtNum(etat.approNonTrace)} ticket${etat.approNonTrace > 1 ? 's' : ''} non tracé${etat.approNonTrace > 1 ? 's' : ''}</span>
            </div>
            ${quartsConcernes.length ? `<div class="histo-sub">Quart(s) concerné(s) : ${quartsConcernes.map(q => q.date ? `${new Date(q.date + 'T00:00:00').toLocaleDateString('fr-FR')} · Q${q.quart}` : '—').join(', ')}</div>` : ''}
            ${noteReception}
            <button type="button" class="btn-modifier" data-rapprocher="${jeu.id}" data-estime="${etat.carnetsEstimes ?? ''}" style="margin-top:10px; width:100%;">🔧 Enregistrer le(s) carnet(s) manquant(s)</button>
          ` : `${mesures}${noteReception}${conclusion ? `<div class="fdj-stock-conclusion ${conclusion.couleur}">${conclusion.texte}</div>` : ''}`}
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // RAPPROCHEMENT MANUEL — 13/08/2026, capture d'écran de Frédéric. Le
  // manager confirme lui-même qu'un carnet a réellement été activé pendant
  // un quart complété/corrigé après coup (jamais NEXUS qui déduit ou
  // invente à sa place — "vérité avant certitude"). Insère un mouvement
  // 'activation' classique (même type que executerActivationCarnet dans
  // NEXUS-FDJ-v1.html, mais methode_identification='saisie_manuelle' et
  // shift_id=null puisqu'il ne s'agit pas d'un quart précis mais d'un
  // rattrapage global sur ce jeu). Formulaire dédié plutôt qu'un prompt()
  // générique — même discipline que "Signaler un retrait/blocage" plus bas.
  // ------------------------------------------------------------
  function ouvrirRapprochement(gameId, carnetsEstimes) {
    rapprochement = { gameId, quantite: carnetsEstimes && carnetsEstimes > 0 ? carnetsEstimes : 1, justification: '' };
    vue = 'rapprochement';
    renderRapprochement();
  }

  function renderRapprochement() {
    const jeu = jeux.find(j => j.id === rapprochement.gameId);
    document.getElementById('titre').textContent = 'Enregistrer un carnet manquant';
    document.getElementById('sousTitre').textContent = "Confirme qu'un carnet a réellement été activé pendant un quart complété/corrigé après coup — NEXUS ne le déduit jamais seul.";
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourRapprochement">← Retour</button>
      <div class="champ-note" style="margin-top:-4px;">${jeu ? jeu.nom : ''}</div>
      <label class="champ-label">Nombre de carnets réellement activés</label>
      <input type="number" inputmode="numeric" min="1" step="1" class="champ-input mono" id="champQteRapprochement" value="${rapprochement.quantite}" style="margin-bottom:4px;">
      <div class="champ-note" style="margin-bottom:12px;">Estimation NEXUS à partir des tickets non tracés — à corriger si vous comptez autrement.</div>
      <label class="champ-label">Constat (pourquoi cette correction)</label>
      <input type="text" class="champ-input" id="champJustifRapprochement" value="${rapprochement.justification}" placeholder="Ex. carnet activé pendant le quart du 11/08, jamais tracé en direct" style="margin-bottom:16px;">
      <button class="btn-primary" id="btnValiderRapprochement">Confirmer l'activation</button>
    `;
    document.getElementById('btnRetourRapprochement').addEventListener('click', () => { vue = 'stock-etat'; rapprochement = null; renderStockEtat(); });
    document.getElementById('champQteRapprochement').addEventListener('input', e => { rapprochement.quantite = e.target.value === '' ? null : Number(e.target.value); });
    document.getElementById('champJustifRapprochement').addEventListener('input', e => { rapprochement.justification = e.target.value; });
    document.getElementById('btnValiderRapprochement').addEventListener('click', validerRapprochement);
  }

  async function validerRapprochement() {
    if (!rapprochement.quantite || rapprochement.quantite <= 0) { alert('Indiquez un nombre de carnets supérieur à 0.'); return; }
    const btn = document.getElementById('btnValiderRapprochement');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const caisse = emplacementParType('caisse');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: rapprochement.gameId, shift_id: null, type_mouvement: 'activation', quantite: rapprochement.quantite,
      location_source_id: caisse ? caisse.id : null, location_destination_id: caisse ? caisse.id : null,
      methode_identification: 'saisie_manuelle', employee_id: null,
      justification: `Rapprochement manuel manager — quart(s) complété(s)/corrigé(s) après coup sans mouvement tracé.${rapprochement.justification ? ` ${rapprochement.justification}` : ''}`,
    });
    if (error) {
      console.error('Rapprochement stock FDJ:', error);
      btn.disabled = false; btn.textContent = "Confirmer l'activation";
      alert("Erreur d'enregistrement. Réessayez.");
      return;
    }
    rapprochement = null;
    await ouvrirStockEtat();
  }

  // Retrait/blocage (§3, §18) : formulaire minimal, gestion par exception —
  // pas d'écran permanent, juste ce qu'il faut pour tracer "qui, quoi,
  // combien, pourquoi" sans jamais modifier un stock sans un fait déclaré.
  async function ouvrirBlocage() {
    blocage = { gameId: jeux[0] ? jeux[0].id : null, quantite: 1, emplacement: 'bureau', motif: '' };
    vue = 'blocage';
    renderBlocage();
  }

  function renderBlocage() {
    document.getElementById('titre').textContent = 'Signaler un retrait / blocage';
    document.getElementById('sousTitre').textContent = "Isole un jeu/série sans modifier le reste du stock — n'active rien, n'ajoute rien à l'appro.";
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourBlocage">← Retour</button>
      <label class="champ-label">Jeu concerné</label>
      <select class="champ-select" id="champJeuBlocage" style="margin-bottom:12px;">
        ${jeux.map(j => `<option value="${j.id}" ${j.id===blocage.gameId?'selected':''}>${j.nom}</option>`).join('')}
      </select>
      <label class="champ-label">Emplacement source</label>
      <select class="champ-select" id="champEmplacementBlocage" style="margin-bottom:12px;">
        <option value="bureau" ${blocage.emplacement==='bureau'?'selected':''}>Bureau</option>
        <option value="caisse" ${blocage.emplacement==='caisse'?'selected':''}>Caisse</option>
      </select>
      <label class="champ-label">Quantité</label>
      <input type="number" inputmode="numeric" min="1" step="1" class="champ-input mono" id="champQteBlocage" value="${blocage.quantite}" style="margin-bottom:12px;">
      <label class="champ-label">Motif</label>
      <input type="text" class="champ-input" id="champMotifBlocage" value="${blocage.motif}" placeholder="Ex. instruction FDJ, série suspecte…" style="margin-bottom:16px;">
      <button class="btn-primary" id="btnConfirmerBlocage">Signaler</button>
      <button class="btn-ghost" id="btnAnnulerBlocage">Annuler</button>
    `;
    document.getElementById('btnRetourBlocage').addEventListener('click', () => { vue = 'stock-etat'; blocage = null; renderStockEtat(); });
    document.getElementById('btnAnnulerBlocage').addEventListener('click', () => { vue = 'stock-etat'; blocage = null; renderStockEtat(); });
    document.getElementById('champJeuBlocage').addEventListener('change', e => blocage.gameId = e.target.value);
    document.getElementById('champEmplacementBlocage').addEventListener('change', e => blocage.emplacement = e.target.value);
    document.getElementById('champQteBlocage').addEventListener('input', e => blocage.quantite = e.target.value === '' ? 1 : Math.max(1, parseInt(e.target.value, 10) || 1));
    document.getElementById('champMotifBlocage').addEventListener('input', e => blocage.motif = e.target.value);
    document.getElementById('btnConfirmerBlocage').addEventListener('click', enregistrerBlocage);
  }

  async function enregistrerBlocage() {
    if (!blocage.motif.trim()) { alert('Indiquez un motif — NEXUS ne modifie jamais un stock sans un fait déclaré.'); return; }
    const btn = document.getElementById('btnConfirmerBlocage');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const source = emplacementParType(blocage.emplacement);
    const zoneBloquee = emplacementParType('bloque');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: blocage.gameId, type_mouvement: 'blocage', quantite: blocage.quantite,
      location_source_id: source ? source.id : null, location_destination_id: zoneBloquee ? zoneBloquee.id : null,
      methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
      justification: `Retrait/blocage (manager) — ${blocage.motif}`,
    });
    if (error) { console.error('Blocage FDJ:', error); btn.disabled = false; btn.textContent = 'Signaler'; alert("Erreur d'enregistrement. Réessayez."); return; }
    vue = 'stock-etat'; blocage = null;
    await ouvrirStockEtat();
  }

  async function retournerDepuisBloque(gameId) {
    const solde = stockEtat.soldes[gameId];
    if (!solde || !(solde.bloques > 0)) return;
    if (!confirm(`Retourner les ${solde.bloques} carnet(s) bloqué(s) de ce jeu au Bureau ?`)) return;
    const zoneBloquee = emplacementParType('bloque');
    const bureau = emplacementParType('bureau');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: gameId, type_mouvement: 'retour', quantite: solde.bloques,
      location_source_id: zoneBloquee ? zoneBloquee.id : null, location_destination_id: bureau ? bureau.id : null,
      methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
      justification: 'Retour au bureau depuis la zone bloquée (manager).',
    });
    if (error) { console.error('Retour depuis bloqué FDJ:', error); alert("Erreur d'enregistrement. Réessayez."); return; }
    await ouvrirStockEtat();
  }

  // ------------------------------------------------------------
  // OUVERTURE DE L'ÉDITION (nouveau ou existant)
  // ------------------------------------------------------------
  // dateOverride/quartOverride (13/08/2026, demande de Frédéric : pouvoir
  // rattraper directement un comptage FDJ manquant depuis FDJ Pilotage,
  // même principe que le rattrapage carburant déjà livré) — permettent
  // d'ouvrir directement un quart neuf sur une date/quart précis plutôt que
  // sur aujourd'hui/Quart 1 par défaut. Voir ouvrirDepuisParametresUrl().
  async function ouvrirEditionNouveau(dateOverride, quartOverride) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    edition = {
      shiftId: null, date: dateOverride || dateISO(), quart: quartOverride || '1', employeeId: employesSite[0] ? employesSite[0].id : null,
      statutShift: 'brouillon', counts: {}, stockInitialAuto: {}, lotsPayes: null, caisseTirages: null, regularisations: 0,
      caisseReelle: null, motifEcart: '', statutCaisse: 'provisoire', avant: null, estNouveau: true, historiqueAudit: [],
    };
    jeux.forEach(j => { edition.counts[j.id] = { stock_initial: null, appro: 0, stock_final: null }; });
    // Préremplissage (09/08/2026, demande de Frédéric) : un quart tout
    // neuf hérite directement du stock final du quart précédent, case vide
    // comprise (voir chargerStockInitialHerite — traité comme 0 ici, sans
    // confirmation contrairement à l'écran employé).
    await reprefillStockInitial();
    vue = 'edition';
    renderEdition();
  }

  async function chargerHistoriqueAudit(shiftId) {
    if (!shiftId) return [];
    const { data, error } = await nexusClient.from('fdj_audit_log').select('*').eq('shift_id', shiftId).order('date_action', { ascending: false });
    if (error) { console.error('Chargement historique audit FDJ:', error); return []; }
    return data || [];
  }

  async function ouvrirEditionExistant(shift) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement du quart…</div>';
    const [{ data: counts }, { data: reports }, historiqueAudit] = await Promise.all([
      nexusClient.from('fdj_shift_counts').select('*').eq('shift_id', shift.id),
      nexusClient.from('fdj_reports').select('*').eq('shift_id', shift.id),
      chargerHistoriqueAudit(shift.id),
    ]);
    const countsMap = {};
    jeux.forEach(j => { countsMap[j.id] = { stock_initial: null, appro: 0, stock_final: null }; });
    (counts || []).forEach(c => { countsMap[c.game_id] = { stock_initial: c.stock_initial, appro: c.appro, stock_final: c.stock_final }; });
    const repJournalier = (reports || []).find(r => r.type_rapport === 'journalier');
    const repTempsReel = (reports || []).find(r => r.type_rapport === 'temps_reel');
    const cash = shift.cash;

    edition = {
      shiftId: shift.id, date: shift.date, quart: shift.quart, employeeId: shift.employee_id,
      statutShift: shift.statut, counts: countsMap, stockInitialAuto: {},
      lotsPayes: repJournalier ? repJournalier.lots_payes_grattage : null,
      caisseTirages: repTempsReel ? repTempsReel.caisse_tirages : null,
      regularisations: cash ? cash.regularisations : 0,
      caisseReelle: cash ? cash.caisse_reelle : null,
      motifEcart: cash ? (cash.motif_ecart || '') : '',
      statutCaisse: cash ? cash.statut : 'provisoire',
      estNouveau: false,
      historiqueAudit,
    };
    // Instantané "avant" pour la trace d'audit — jamais un écrasement
    // silencieux, même en pouvoir total (Constitution NEXUS, traçabilité).
    // 09/08/2026, demande de Frédéric : "pouvoir corriger ne doit pas
    // signifier pouvoir effacer la vérité précédente" — motifEcart est
    // désormais inclus dans l'instantané (il manquait), sinon un
    // changement de motif seul ne laissait aucune trace.
    edition.avant = JSON.parse(JSON.stringify({ date: edition.date, quart: edition.quart, counts: countsMap, lotsPayes: edition.lotsPayes, caisseTirages: edition.caisseTirages, regularisations: edition.regularisations, caisseReelle: edition.caisseReelle, statutCaisse: edition.statutCaisse, motifEcart: edition.motifEcart, employeeId: edition.employeeId }));
    // Préremplissage des seules cases encore vides (09/08/2026, demande de
    // Frédéric) : "j'ai l'historique du quart 1, si je modifie le quart 2,
    // mets automatiquement le stock de fin du quart 1 au stock de départ
    // du quart 2" — un stock initial déjà saisi par un employé n'est jamais
    // touché, seules les cases jamais remplies héritent automatiquement.
    await reprefillStockInitial();
    vue = 'edition';
    renderEdition();
  }

  // Ouverture directe depuis un lien de rattrapage (13/08/2026, demande de
  // Frédéric — "revenir sur les caisses FDJ dans Pilotage car les employés
  // n'ont pas fait les inventaires") : NEXUS-FDJ-Analyse-v1.html (Pilotage)
  // pointe ici avec `?date=...&quart=...` pour un quart détecté manquant.
  // Le manager a déjà "pouvoir total" pour créer/éditer n'importe quel
  // quart (voir ouvrirEditionNouveau/ouvrirEditionExistant, existants avant
  // ce lot) — ce lot ajoute uniquement le point d'entrée direct, aucune
  // nouvelle capacité d'édition. Si un quart existe déjà à cette date (même
  // en brouillon), on l'ouvre pour complétion plutôt que d'en recréer un
  // second en doublon (contrainte UNIQUE(site,date,quart) de toute façon).
  async function ouvrirDepuisParametresUrl(dateParam, quartParam) {
    const shifts = await chargerShiftsAvecCaisse(dateParam);
    const existant = shifts.find(s => s.quart === quartParam);
    if (existant) { await ouvrirEditionExistant(existant); return; }
    await ouvrirEditionNouveau(dateParam, quartParam);
  }

  // ------------------------------------------------------------
  // CALCULS — via nexus-fdj-moteur.js, sur edition.counts.
  // ------------------------------------------------------------
  function calculerVentesEdition(gameId) {
    const jeu = jeux.find(j => j.id === gameId);
    if (!jeu) return { qte: null, valeur: null };
    return NexusFdjMoteur.calculerVentesJeu(edition.counts[gameId], jeu.prix);
  }
  function ventesGrattageTotalEdition() { return NexusFdjMoteur.ventesGrattageTotal(jeux, edition.counts); }
  function caisseGrattageEdition() { return NexusFdjMoteur.caisseGrattage(ventesGrattageTotalEdition(), edition.lotsPayes); }
  function caisseAttendueEdition() { return NexusFdjMoteur.caisseAttendue(caisseGrattageEdition(), edition.caisseTirages, edition.regularisations); }
  function ecartCaisseEdition() { return NexusFdjMoteur.ecartCaisse(edition.caisseReelle, caisseAttendueEdition()); }
  // Ventes négatives = anomalie (09/08/2026, demande de Frédéric) — même
  // règle que côté employé : jamais corrigée toute seule, juste signalée.
  function jeuxAvecVentesNegativesEdition() {
    return jeux.filter(j => { const v = calculerVentesEdition(j.id); return v.qte !== null && v.qte < 0; });
  }

  function grouperParPalier(liste) {
    const groupes = {};
    for (const j of liste) { if (!groupes[j.prix]) groupes[j.prix] = { prix: j.prix, items: [] }; groupes[j.prix].items.push(j); }
    return Object.values(groupes).sort((a,b) => a.prix - b.prix);
  }

  // ------------------------------------------------------------
  // FORMULAIRE D'ÉDITION — tout sur un seul écran (pouvoir total du
  // manager, pas d'assistant pas-à-pas comme côté employé).
  // ------------------------------------------------------------
  function renderEdition() {
    document.getElementById('titre').textContent = edition.estNouveau ? 'Nouveau quart FDJ' : 'Modifier ce quart FDJ';
    document.getElementById('sousTitre').textContent = 'Tout est modifiable — grattage, tirages, caisse, employé assigné, statut.';
    const attendue = caisseAttendueEdition();
    const ecart = ecartCaisseEdition();
    const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const groupes = grouperParPalier(jeux);

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourFleche">← Retour</button>
      <div class="champ-row">
        <div>
          <label class="champ-label">Date</label>
          <input type="date" class="champ-input" id="champDate" value="${edition.date}">
        </div>
        <div>
          <label class="champ-label">Quart</label>
          <select class="champ-select" id="champQuart">
            <option value="1" ${edition.quart==='1'?'selected':''}>Quart 1</option>
            <option value="2" ${edition.quart==='2'?'selected':''}>Quart 2</option>
          </select>
        </div>
      </div>
      ${!edition.estNouveau ? '<div class="champ-note">Changer la date ou le quart déplace ce même enregistrement — impossible si un autre quart FDJ existe déjà à cette date/quart.</div>' : ''}
      <label class="champ-label">Employé assigné</label>
      <select class="champ-select" id="champEmploye" style="margin-bottom:12px;">
        ${employesSite.map(e => `<option value="${e.id}" ${e.id===edition.employeeId?'selected':''}>${e.nom}</option>`).join('')}
      </select>
      <label class="champ-label">Statut du quart</label>
      <select class="champ-select" id="champStatutShift" style="margin-bottom:16px;">
        <option value="brouillon" ${edition.statutShift==='brouillon'?'selected':''}>Brouillon</option>
        <option value="valide" ${edition.statutShift==='valide'?'selected':''}>Validé</option>
      </select>

      <div class="champ-sep"></div>
      <div class="section-titre">Grattage</div>
      <div class="statut-badge provisoire" id="banniereAnomaliesEdition" style="display:${jeuxAvecVentesNegativesEdition().length ? 'block' : 'none'}; background:var(--red-dim); color:var(--red); padding:9px 12px; border-radius:8px; margin-bottom:10px; font-family:var(--sans); font-weight:600; text-transform:none;">⚠️ ${jeuxAvecVentesNegativesEdition().length} jeu${jeuxAvecVentesNegativesEdition().length > 1 ? 'x' : ''} avec des ventes négatives — vérifiez le stock saisi.</div>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuRowEdition(j)).join('')}</div>
        </div>
      `).join('')}

      <div class="champ-sep"></div>
      <div class="section-titre">Tirages</div>
      <label class="champ-label">Total des lots payés — grattage</label>
      <input type="number" inputmode="decimal" class="champ-input mono" id="champLotsPayes" value="${edition.lotsPayes ?? ''}" placeholder="0,00" style="margin-bottom:12px;">
      <label class="champ-label">Caisse tirages</label>
      <div class="champ-input-signe-row">
        <button type="button" class="btn-signe ${(edition.caisseTirages ?? 0) < 0 ? 'actif' : ''}" id="btnSigneCaisseTirages" aria-label="Rendre négatif / positif">±</button>
        <input type="number" inputmode="decimal" class="champ-input mono" id="champCaisseTirages" value="${edition.caisseTirages ?? ''}" placeholder="0,00">
      </div>

      <div class="champ-sep"></div>
      <div class="section-titre">Caisse</div>
      <label class="champ-label">Régularisations</label>
      <input type="number" inputmode="decimal" class="champ-input mono" id="champRegul" value="${edition.regularisations ?? 0}" placeholder="0,00" style="margin-bottom:12px;">
      <label class="champ-label">Caisse réelle comptée</label>
      <input type="number" inputmode="decimal" class="champ-input mono" id="champCaisseReelle" value="${edition.caisseReelle ?? ''}" placeholder="0,00">

      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Ventes grattage</div><div class="stat-value">${fmtEuro(ventesGrattageTotalEdition())}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(caisseGrattageEdition())}</div></div>
        <div class="stat-row total"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(attendue)}</div></div>
        <div class="stat-row total" id="ligneEcart"><div class="stat-label">Écart</div><div class="stat-value ${classe}">${ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div></div>
      </div>

      <label class="champ-label">Statut du contrôle</label>
      <select class="champ-select" id="champStatutCaisse" style="margin-bottom:12px;">
        ${STATUTS_CAISSE.map(s => `<option value="${s.value}" ${s.value===edition.statutCaisse?'selected':''}>${s.label}</option>`).join('')}
      </select>
      <label class="champ-label">Motif de l'écart (optionnel)</label>
      <select class="champ-select" id="champMotifEcart" style="margin-bottom:16px;">
        ${MOTIFS_ECART_FDJ.map(m => `<option value="${m.value}" ${m.value===edition.motifEcart?'selected':''}>${m.label}</option>`).join('')}
      </select>

      ${renderHistoriqueAuditFdj()}

      <button class="btn-primary" id="btnEnregistrer">Enregistrer</button>
      <button class="btn-ghost" id="btnAnnuler">Annuler</button>
    `;

    wireEditionInputs();
  }

  function renderJeuRowEdition(jeu) {
    const s = edition.counts[jeu.id] || { stock_initial: null, appro: 0, stock_final: null };
    const v = calculerVentesEdition(jeu.id);
    const anomalie = v.qte !== null && v.qte < 0;
    const auto = !!edition.stockInitialAuto[jeu.id];
    return `
      <div class="jeu-row ${anomalie ? 'anomalie' : ''}" data-jeu="${jeu.id}">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${anomalie ? 'anomalie' : (v.valeur !== null ? 'calc' : '')}">${anomalie ? `⚠️ Anomalie : ${fmtNum(v.qte)}` : (v.qte !== null ? `${fmtNum(v.qte)} · ${fmtEuro(v.valeur)}` : '—')}</div>
        </div>
        <div class="jeu-inputs">
          <div class="jeu-input-wrap"><div class="jeu-input-label">Initial</div><input type="number" inputmode="decimal" class="jeu-input ${auto ? 'auto' : ''}" data-jeu="${jeu.id}" data-champ="stock_initial" value="${s.stock_initial ?? ''}" title="${auto ? 'Hérité automatiquement du quart précédent' : ''}"></div>
          <div class="jeu-input-wrap"><div class="jeu-input-label">Appro</div><input type="number" inputmode="decimal" class="jeu-input" data-jeu="${jeu.id}" data-champ="appro" value="${s.appro ?? 0}"></div>
          <div class="jeu-input-wrap"><div class="jeu-input-label">Final</div><input type="number" inputmode="decimal" class="jeu-input" data-jeu="${jeu.id}" data-champ="stock_final" value="${s.stock_final ?? ''}"></div>
        </div>
      </div>
    `;
  }

  function majResume() {
    const attendue = caisseAttendueEdition();
    const ecart = ecartCaisseEdition();
    const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const resume = document.querySelector('.resume-card');
    if (!resume) return;
    resume.innerHTML = `
      <div class="stat-row"><div class="stat-label">Ventes grattage</div><div class="stat-value">${fmtEuro(ventesGrattageTotalEdition())}</div></div>
      <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(caisseGrattageEdition())}</div></div>
      <div class="stat-row total"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(attendue)}</div></div>
      <div class="stat-row total" id="ligneEcart"><div class="stat-label">Écart</div><div class="stat-value ${classe}">${ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div></div>
    `;
  }

  function wireEditionInputs() {
    // Retour rapide (09/08/2026, demande de Frédéric) : le formulaire est
    // long, "Annuler" tout en bas obligeait à tout redescendre. Même
    // action que le bouton "Annuler".
    document.getElementById('btnRetourFleche').addEventListener('click', () => { vue = 'liste'; edition = null; renderAccueil(); });
    // Date/quart modifiables (09/08/2026, demande de Frédéric) : chaque
    // changement recalcule le préremplissage du stock initial pour la
    // nouvelle date/quart choisie (voir reprefillStockInitial), sans jamais
    // toucher une case déjà saisie à la main.
    document.getElementById('champDate').addEventListener('change', async e => { edition.date = e.target.value; await reprefillStockInitial(); renderEdition(); });
    document.getElementById('champQuart').addEventListener('change', async e => { edition.quart = e.target.value; await reprefillStockInitial(); renderEdition(); });
    document.getElementById('champEmploye').addEventListener('change', e => edition.employeeId = e.target.value);
    document.getElementById('champStatutShift').addEventListener('change', e => edition.statutShift = e.target.value);
    document.getElementById('champStatutCaisse').addEventListener('change', e => edition.statutCaisse = e.target.value);
    document.getElementById('champMotifEcart').addEventListener('change', e => edition.motifEcart = e.target.value);

    document.querySelectorAll('.jeu-input').forEach(input => {
      input.addEventListener('input', () => {
        const gameId = input.dataset.jeu, champ = input.dataset.champ;
        const val = input.value === '' ? null : Number(input.value);
        if (!edition.counts[gameId]) edition.counts[gameId] = { stock_initial: null, appro: 0, stock_final: null };
        edition.counts[gameId][champ] = val;
        // Dès que le manager touche lui-même le stock initial, ce n'est
        // plus une valeur héritée automatiquement — un futur changement de
        // date/quart ne doit plus jamais l'écraser.
        if (champ === 'stock_initial') { edition.stockInitialAuto[gameId] = false; input.classList.remove('auto'); }
        const row = input.closest('.jeu-row');
        const v = calculerVentesEdition(gameId);
        const anomalie = v.qte !== null && v.qte < 0;
        row.classList.toggle('anomalie', anomalie);
        const venteEl = row.querySelector('.jeu-ventes');
        venteEl.className = `jeu-ventes ${anomalie ? 'anomalie' : (v.valeur !== null ? 'calc' : '')}`;
        venteEl.textContent = anomalie ? `⚠️ Anomalie : ${fmtNum(v.qte)}` : (v.qte !== null ? `${fmtNum(v.qte)} · ${fmtEuro(v.valeur)}` : '—');
        const anomalies = jeuxAvecVentesNegativesEdition();
        const banniereAnomalies = document.getElementById('banniereAnomaliesEdition');
        if (banniereAnomalies) {
          banniereAnomalies.style.display = anomalies.length ? '' : 'none';
          banniereAnomalies.textContent = `⚠️ ${anomalies.length} jeu${anomalies.length > 1 ? 'x' : ''} avec des ventes négatives — vérifiez le stock saisi.`;
        }
        majResume();
      });
    });
    document.getElementById('champLotsPayes').addEventListener('input', e => { edition.lotsPayes = e.target.value === '' ? null : Number(e.target.value); majResume(); });
    document.getElementById('champCaisseTirages').addEventListener('input', e => {
      edition.caisseTirages = e.target.value === '' ? null : Number(e.target.value);
      document.getElementById('btnSigneCaisseTirages').classList.toggle('actif', (edition.caisseTirages ?? 0) < 0);
      majResume();
    });
    // Bouton ± (10/08/2026) : même correctif que NEXUS-FDJ-v1.html — inverse
    // le signe de la valeur déjà saisie, garantit un moyen d'entrer une
    // caisse tirages négative même quand le clavier numérique mobile
    // n'affiche pas la touche "-".
    document.getElementById('btnSigneCaisseTirages').addEventListener('click', () => {
      const input = document.getElementById('champCaisseTirages');
      const valeur = input.value === '' ? 0 : Number(input.value);
      const inversee = -valeur;
      input.value = inversee === 0 ? '' : inversee;
      edition.caisseTirages = input.value === '' ? null : inversee;
      document.getElementById('btnSigneCaisseTirages').classList.toggle('actif', inversee < 0);
      majResume();
      input.focus();
    });
    document.getElementById('champRegul').addEventListener('input', e => { edition.regularisations = e.target.value === '' ? 0 : Number(e.target.value); majResume(); });
    document.getElementById('champCaisseReelle').addEventListener('input', e => { edition.caisseReelle = e.target.value === '' ? null : Number(e.target.value); majResume(); });

    document.getElementById('btnEnregistrer').addEventListener('click', enregistrerEdition);
    document.getElementById('btnAnnuler').addEventListener('click', () => { vue = 'liste'; edition = null; renderAccueil(); });
  }

  // ------------------------------------------------------------
  // ENREGISTREMENT — pouvoir total : écrase directement, sans étape
  // d'approbation. Une trace reste dans fdj_audit_log (avant/après), sans
  // jamais bloquer l'enregistrement (traçabilité, pas contrôle d'accès).
  // ------------------------------------------------------------
  async function enregistrerEdition() {
    const btn = document.getElementById('btnEnregistrer');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    // 1) Résoudre le quart (existant ou nouveau). Date et quart sont inclus
    // dans le même UPDATE ... WHERE id= (09/08/2026, demande de Frédéric) :
    // ça déplace la ligne existante, ça n'en crée jamais une seconde. Si la
    // date/quart choisie est déjà prise par un autre quart FDJ, la
    // contrainte unique (site,date,quart) de la base refuse l'écriture
    // (code Postgres 23505) — NEXUS l'explique plutôt que de laisser passer
    // un écrasement silencieux de l'autre quart.
    let shift;
    if (edition.shiftId) {
      const { data, error } = await nexusClient.from('fdj_shifts')
        .update({ date: edition.date, quart: edition.quart, employee_id: edition.employeeId, statut: edition.statutShift, valide_le: edition.statutShift === 'valide' ? new Date().toISOString() : null })
        .eq('id', edition.shiftId).select().single();
      if (error) {
        console.error('Mise à jour quart FDJ:', error);
        btn.disabled = false; btn.textContent = 'Enregistrer';
        if (error.code === '23505') alert(`Un quart FDJ existe déjà pour le ${new Date(edition.date + 'T00:00:00').toLocaleDateString('fr-FR')} — Quart ${edition.quart}. Modifiez ce quart-là directement plutôt que de déplacer celui-ci, ou choisissez une autre date/quart.`);
        else alert('Erreur de mise à jour du quart. Réessayez.');
        return;
      }
      shift = data;
    } else {
      const { data: existant } = await nexusClient.from('fdj_shifts').select('*').eq('site', siteId).eq('date', edition.date).eq('quart', edition.quart).maybeSingle();
      if (existant) {
        const { data, error } = await nexusClient.from('fdj_shifts')
          .update({ employee_id: edition.employeeId, statut: edition.statutShift })
          .eq('id', existant.id).select().single();
        if (error) { console.error('Mise à jour quart FDJ existant:', error); btn.disabled = false; btn.textContent = 'Enregistrer'; return; }
        shift = data;
      } else {
        const { data, error } = await nexusClient.from('fdj_shifts')
          .insert({ site: siteId, date: edition.date, quart: edition.quart, employee_id: edition.employeeId, statut: edition.statutShift, ouvert_le: new Date().toISOString() })
          .select().single();
        if (error) { console.error('Création quart FDJ:', error); btn.disabled = false; btn.textContent = 'Enregistrer'; alert('Erreur de création du quart. Réessayez.'); return; }
        shift = data;
      }
    }

    // 2) Comptages — upsert des jeux réellement touchés par le manager.
    const lignes = jeux.filter(j => {
      const s = edition.counts[j.id];
      return s && (s.stock_initial !== null || s.appro || s.stock_final !== null);
    }).map(j => {
      const s = edition.counts[j.id];
      const v = calculerVentesEdition(j.id);
      return { site: siteId, shift_id: shift.id, game_id: j.id, stock_initial: s.stock_initial, appro: s.appro || 0, stock_final: s.stock_final, ventes_qte: v.qte, ventes_valeur: v.valeur, updated_at: new Date().toISOString() };
    });
    if (lignes.length) {
      const { error } = await nexusClient.from('fdj_shift_counts').upsert(lignes, { onConflict: 'shift_id,game_id' });
      if (error) { console.error('Enregistrement comptages FDJ (manager):', error); btn.disabled = false; btn.textContent = 'Enregistrer'; alert('Erreur sur le grattage. Réessayez.'); return; }
    }

    // 3) Rapports.
    const { error: eRep } = await nexusClient.from('fdj_reports').upsert([
      { site: siteId, shift_id: shift.id, type_rapport: 'journalier', lots_payes_grattage: edition.lotsPayes, saisi_par: managerCourant.id },
      { site: siteId, shift_id: shift.id, type_rapport: 'temps_reel', caisse_tirages: edition.caisseTirages, saisi_par: managerCourant.id },
    ], { onConflict: 'shift_id,type_rapport' });
    if (eRep) { console.error('Enregistrement rapports FDJ (manager):', eRep); btn.disabled = false; btn.textContent = 'Enregistrer'; alert('Erreur sur les tirages. Réessayez.'); return; }

    // 4) Rapprochement caisse — le manager choisit lui-même le statut
    // (pouvoir total), valide_par/valide_le posés dès qu'il enregistre ici.
    const ecart = ecartCaisseEdition();
    const { error: eCash } = await nexusClient.from('fdj_cash_controls').upsert({
      site: siteId, shift_id: shift.id,
      ventes_grattage_valeur: ventesGrattageTotalEdition(), lots_payes_grattage: edition.lotsPayes,
      caisse_grattage: caisseGrattageEdition(), caisse_tirages: edition.caisseTirages,
      regularisations: edition.regularisations || 0, caisse_attendue: caisseAttendueEdition(), caisse_reelle: edition.caisseReelle,
      ecart, motif_ecart: edition.motifEcart || null, statut: edition.statutCaisse,
      valide_par: managerCourant.id, valide_le: new Date().toISOString(), updated_at: new Date().toISOString(),
    }, { onConflict: 'shift_id' });
    if (eCash) { console.error('Enregistrement caisse FDJ (manager):', eCash); btn.disabled = false; btn.textContent = 'Enregistrer'; alert('Erreur sur la caisse. Réessayez.'); return; }

    // 5) Trace d'audit — avant/après, jamais un écrasement silencieux même
    // en pouvoir total. 09/08/2026, demande de Frédéric : "pouvoir corriger
    // ne doit pas signifier pouvoir effacer la vérité précédente" — motif
    // désormais inclus (colonne dédiée + instantanés), sinon un changement
    // de motif seul ne laissait aucune trace.
    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: shift.id, entite_type: 'fdj_shift', entite_id: shift.id,
      action: edition.estNouveau ? 'creation_manager' : 'correction_manager', acteur_id: managerCourant.id,
      motif: edition.motifEcart || null,
      ancienne_valeur: edition.avant, nouvelle_valeur: { date: edition.date, quart: edition.quart, counts: edition.counts, lotsPayes: edition.lotsPayes, caisseTirages: edition.caisseTirages, regularisations: edition.regularisations, caisseReelle: edition.caisseReelle, statutCaisse: edition.statutCaisse, motifEcart: edition.motifEcart, employeeId: edition.employeeId, ecart },
    });

    edition = null;
    afficherChoixApresEnregistrement();
  }

  // Choix de destination après enregistrement (13/08/2026, demande directe
  // de Frédéric : "quand je suis dans modifier ce quart FDJ, quand je
  // valide j'aurais aimé avoir le choix de retourner dans FDJ pilotage ou
  // dans l'accueil du Contrôle FDJ") — avant ce lot, valider renvoyait
  // systématiquement à l'accueil (`vue='liste'`), sans jamais proposer
  // l'autre destination naturelle après une correction : la vue d'ensemble
  // FDJ Pilotage. S'applique aussi bien à "Nouveau quart FDJ" qu'à
  // "Modifier ce quart FDJ" (même fonction d'enregistrement, même choix de
  // destination utile dans les deux cas).
  function afficherChoixApresEnregistrement() {
    vue = 'apres-enregistrement';
    document.getElementById('titre').textContent = 'Quart enregistré';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="card apres-enreg-card">
        <div class="apres-enreg-icone">✅</div>
        <div class="apres-enreg-titre">Quart FDJ enregistré.</div>
        <div class="apres-enreg-sous">Où voulez-vous aller maintenant ?</div>
        <button class="btn-primary" id="btnApresAccueil">← Retour à l'accueil Contrôle FDJ</button>
        <button class="btn-ghost" id="btnApresPilotage">Aller à FDJ Pilotage →</button>
      </div>
    `;
    document.getElementById('btnApresAccueil').addEventListener('click', () => { vue = 'liste'; renderAccueil(); });
    document.getElementById('btnApresPilotage').addEventListener('click', () => { window.location.href = 'NEXUS-FDJ-Analyse-v1.html'; });
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    managerCourant = employee;
    siteId = employee.site_id;
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-FDJ-Manager-v1.html', siteId))) return;
    demarrerHorloge();
    [jeux, employesSite, emplacements] = await Promise.all([chargerJeux(), chargerEmployesSite(), chargerEmplacements()]);
    // Lien de rattrapage (13/08/2026) — `?date=YYYY-MM-DD&quart=1|2` ouvre
    // directement l'édition de ce quart au lieu de l'accueil habituel.
    // Validé strictement : tout paramètre absent/mal formé retombe
    // silencieusement sur l'accueil normal (comportement inchangé pour
    // n'importe quel lien existant, qui n'a jamais eu ces paramètres).
    const paramsUrl = new URLSearchParams(window.location.search);
    const dateParam = paramsUrl.get('date');
    const quartParam = paramsUrl.get('quart');
    const dateValide = dateParam && /^\d{4}-\d{2}-\d{2}$/.test(dateParam);
    const quartValide = quartParam === '1' || quartParam === '2';
    if (dateValide && quartValide) {
      await ouvrirDepuisParametresUrl(dateParam, quartParam);
    } else {
      renderAccueil();
    }
  });
</script>
