      nexusClient.from('fdj_reports').select('*').eq('shift_id', shiftId),
      nexusClient.from('fdj_cash_controls').select('*').eq('shift_id', shiftId).maybeSingle(),
    ]);
    const countsParJeu = {};
    (counts || []).forEach(c => { countsParJeu[c.game_id] = { stock_initial: c.stock_initial, appro: c.appro, stock_final: c.stock_final }; });

    for (const e of applicables) {
      const jeu = jeux.find(j => j.id === e.game_id);
      if (!jeu) continue;
      const v = NexusFdjMoteur.calculerVentesJeu(countsParJeu[e.game_id], jeu.prix);
      const { error } = await nexusClient.from('fdj_shift_counts')
        .update({ ventes_qte: v.qte, ventes_valeur: v.valeur, updated_at: new Date().toISOString() })
        .eq('shift_id', shiftId).eq('game_id', e.game_id);
      if (error) console.error('Recalcul ventes auto FDJ:', error);
    }

    if (!cash) return; // caisse pas encore saisie pour ce quart -> rien à réécrire côté écart

    const repJournalier = (reports || []).find(r => r.type_rapport === 'journalier');
    const repTempsReel = (reports || []).find(r => r.type_rapport === 'temps_reel');
    const ventesTotal = NexusFdjMoteur.ventesGrattageTotal(jeux, countsParJeu);
    const grattage = NexusFdjMoteur.caisseGrattage(ventesTotal, repJournalier ? repJournalier.lots_payes_grattage : null);
    const attendue = NexusFdjMoteur.caisseAttendue(grattage, repTempsReel ? repTempsReel.caisse_tirages : null, cash.regularisations);
    const nouvelEcart = NexusFdjMoteur.ecartCaisse(cash.caisse_reelle, attendue);
    const avant = { ecart: cash.ecart, caisse_attendue: cash.caisse_attendue, ventes_grattage_valeur: cash.ventes_grattage_valeur, caisse_grattage: cash.caisse_grattage };

    const { error: eCash } = await nexusClient.from('fdj_cash_controls').update({
      ventes_grattage_valeur: ventesTotal, caisse_grattage: grattage, caisse_attendue: attendue, ecart: nouvelEcart,
      updated_at: new Date().toISOString(),
    }).eq('shift_id', shiftId);
    if (eCash) { console.error('Réécriture auto écart FDJ:', eCash); return; }

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: shiftId, entite_type: 'fdj_cash_control', entite_id: shiftId,
      action: 'fdj_ecart_recalcule_apres_retablissement_chaine', acteur_id: null,
      motif: `Recalcul automatique après rétablissement de chaîne — jeux corrigés : ${applicables.map(a => a.game_id).join(', ')}`,
      ancienne_valeur: avant,
      nouvelle_valeur: { ecart: nouvelEcart, caisse_attendue: attendue, ventes_grattage_valeur: ventesTotal, caisse_grattage: grattage },
    });
  }

  // ============================================================
  // FDJ Fiabilisation — Étape 4 : needs_replay + recalcul du relevé après
  // propagation amont (cahier `NEXUS_FDJ_Audit_Fiabilisation_Chaine_Quarts.pdf`
  // §8 "Replay chronologique après correction rétroactive" : "Toute
  // création ou modification d'un quart antérieur au dernier quart intégré
  // doit invalider les états calculés postérieurs."). **Exploration
  // préalable déterminante** : la quasi-totalité de ce que le cahier
  // redoute est structurellement impossible dans ce module — les soldes
  // carnets (NexusFdjMoteur.soldesCarnetsAvecReference) et les vues
  // d'agrégation (view_fdj_*, Phase B) sont TOUJOURS recalculés à la volée
  // depuis le ledger de mouvements à chaque lecture, jamais mis en cache
  // (Article 11 — aucun "état dérivé stocké" à invalider là). Le seul état
  // réellement en cache, et donc réellement périssable, est
  // `fdj_releves_cloture` — un ledger VERSIONNÉ par construction. Un seul
  // trou concret a été trouvé en explorant ce module avant de coder : la
  // propagation automatique de l'Étape 2 (`propagationCorrectionStock`, cas
  // `applicables` de `enregistrerEdition`) corrige silencieusement
  // ventes/écart du quart suivant via `appliquerCorrectionsAutomatiquesContinuite`,
  // mais ne posait jamais de nouvelle version de `fdj_releves_cloture` — le
  // relevé affiché à l'écran et exporté en PDF restait périmé, sans aucune
  // alerte. Cette fonction comble précisément ce trou, en réutilisant le
  // même schéma de snapshot/diff que `synchroniserRelevesApresRetablissementChaine`
  // ci-dessous (Article 11 — mêmes fonctions moteur `diffClotureFdj`/
  // `statutRelevecloture`/`caractereRelevecloture`), avec son propre motif
  // d'audit : ici la cause est une correction manager amont, pas un
  // rétablissement de chaîne — deux causes distinctes, jamais confondues
  // (même discipline que `anomalie_chaine`).
  // `gameIdsCorriges` (optionnel) : seulement pour un motif d'audit
  // lisible, n'entre dans aucun calcul. Retourne `true` si une nouvelle
  // version a été posée avec succès OU si aucun recalcul n'était
  // nécessaire (rien n'a changé, ou aucun relevé encore posé pour ce quart
  // — rien à synchroniser, pas un échec). Retourne `false` uniquement si
  // l'écriture a réellement échoué — l'appelant doit alors laisser
  // `needs_replay=true` (filet de sécurité, voir Boîte d'exceptions Étape 3,
  // catégorie "replay requis").
  async function rejouerReleveApresPropagation(shiftId, gameIdsCorriges) {
    const { data: precedentes } = await nexusClient.from('fdj_releves_cloture').select('*').eq('shift_id', shiftId).order('version_num', { ascending: false }).limit(1);
    const precedent = (precedentes || [])[0] || null;
    if (!precedent) return true; // aucun relevé encore posé pour ce quart — rien à synchroniser

    const [{ data: counts }, { data: reports }, { data: cash }, { data: alertesOuvertes }] = await Promise.all([
      nexusClient.from('fdj_shift_counts').select('*').eq('shift_id', shiftId),
      nexusClient.from('fdj_reports').select('*').eq('shift_id', shiftId),
      nexusClient.from('fdj_cash_controls').select('*').eq('shift_id', shiftId).maybeSingle(),
      nexusClient.from('fdj_alertes').select('id, type').eq('shift_id', shiftId).in('type', ['chaine_interrompue', 'continuite_stock_a_verifier']).eq('resolue_automatiquement', false).eq('vue', false),
    ]);
    const stockInitialParJeu = {}, approParJeu = {}, stockFinalParJeu = {}, ventesParJeu = {};
    (counts || []).forEach(c => {
      stockInitialParJeu[c.game_id] = c.stock_initial ?? null;
      approParJeu[c.game_id] = c.appro || 0;
      stockFinalParJeu[c.game_id] = c.stock_final ?? null;
      ventesParJeu[c.game_id] = { qte: c.ventes_qte ?? null, valeur: c.ventes_valeur ?? null };
    });
    const repJournalier = (reports || []).find(r => r.type_rapport === 'journalier');
    const repTempsReel = (reports || []).find(r => r.type_rapport === 'temps_reel');
    const chaineInterrompueOuverte = (alertesOuvertes || []).some(a => a.type === 'chaine_interrompue');
    const continuiteStockAVerifierOuverte = (alertesOuvertes || []).some(a => a.type === 'continuite_stock_a_verifier');
    const versionNum = precedent.version_num + 1;
    const nouveauSnapshot = {
      stock_initial_par_jeu: stockInitialParJeu, appro_par_jeu: approParJeu, stock_final_par_jeu: stockFinalParJeu, ventes_par_jeu: ventesParJeu,
      ventes_grattage_valeur: cash ? cash.ventes_grattage_valeur : null, lots_payes_grattage: repJournalier ? repJournalier.lots_payes_grattage : null,
      caisse_tirages: repTempsReel ? repTempsReel.caisse_tirages : null, regularisations: cash ? cash.regularisations : 0,
      caisse_attendue: cash ? cash.caisse_attendue : null, caisse_reelle: cash ? cash.caisse_reelle : null, ecart: cash ? cash.ecart : null,
      statut: NexusFdjMoteur.statutRelevecloture(versionNum, cash ? cash.ecart : null, 'recalcul_automatique_chaine'),
      anomalie_chaine: { chaine_interrompue: chaineInterrompueOuverte, continuite_stock_a_verifier: continuiteStockAVerifierOuverte },
      caractere: NexusFdjMoteur.caractereRelevecloture({ chaineInterrompue: chaineInterrompueOuverte, continuiteStockAVerifier: continuiteStockAVerifierOuverte }),
    };
    const diff = NexusFdjMoteur.diffClotureFdj(precedent, nouveauSnapshot);
    if (!diff && nouveauSnapshot.caractere === precedent.caractere) return true; // rien n'a réellement changé

    const signature = {
      utilisateur_id: null, nom: 'NEXUS', role: 'system', date_heure: new Date().toISOString(), version_donnees: versionNum,
      session_id: null, quart_id: shiftId,
      message_confirmation: "Recalcul automatique après correction manager d'un quart antérieur (propagation de stock, Étape 2).",
    };
    const { error: eReleve } = await nexusClient.from('fdj_releves_cloture').insert({
      site: siteId, shift_id: shiftId, date: precedent.date, quart: precedent.quart, employee_id: precedent.employee_id,
      version_num: versionNum, type_version: 'recalcul_automatique_chaine', cree_par: null,
      ...nouveauSnapshot,
      motif_regularisation: `Recalcul automatique après propagation d'une correction du quart précédent${gameIdsCorriges && gameIdsCorriges.length ? ` — jeux concernés : ${gameIdsCorriges.join(', ')}` : ''}.`,
      diff_vs_precedent: diff,
      signature,
    });
    if (eReleve) { console.error('Relevé de clôture FDJ (recalcul après propagation):', eReleve); return false; }
    return true;
  }

  // RÉCONCILIATION DYNAMIQUE — 16/08/2026, demande de Frédéric : "Cette
  // alerte ne doit pas être persistée comme un statut définitif d'un
  // quart [...] Une fois un quart manquant complété, l'alerte doit
  // disparaître automatiquement sans action manager." Appelée à chaque
  // chargement de l'accueil manager (donc à chaque création, validation,
  // régularisation ou modification d'un quart, puisque chacune de ces
  // actions ramène ici — voir enregistrerEdition, enregistrerDerogationQuart,
  // etc.) : revérifie CHAQUE alerte 'chaine_interrompue' encore active
  // (`alertesBrutes` déjà filtrée sur resolue_automatiquement=false) contre
  // l'état réel de la chaîne. Trois issues possibles, jamais une
  // suppression :
  //  - toujours rompue -> rien ne change.
  //  - rétablie, stock cohérent -> marquée resolue_automatiquement (retirée
  //    du panneau "Alertes", reste visible au Journal).
  //  - rétablie, stock incohérent -> résolue pour la CHAÎNE (elle ne l'est
  //    plus, jamais qualifiée d'interrompue), mais une ou plusieurs
  //    nouvelles anomalies 'continuite_stock_a_verifier' sont posées (une
  //    par jeu en écart, jamais dupliquées d'un appel à l'autre).
  // Retourne true si au moins une écriture a eu lieu (l'appelant sait
  // alors qu'il doit relire les alertes avant de les afficher).
  async function reconcilierAlertesChaine(alertesBrutes, ensemble) {
    let mutations = false;
    for (const a of alertesBrutes) {
      if (a.type !== 'chaine_interrompue') continue;
      const quartActuelInfo = ensemble.find(s => s.id === a.shift_id);
      if (!quartActuelInfo) continue; // shift introuvable — prudence, on n'y touche pas
      const etat = NexusFdjMoteur.chaineInterrompueDynamique({ id: quartActuelInfo.id, date: quartActuelInfo.date, quart: quartActuelInfo.quart }, ensemble);
      if (etat.rompue) continue; // toujours rompue, rien à faire

      const maintenant = new Date().toISOString();
      const { error: eResolution } = await nexusClient.from('fdj_alertes')
        .update({ resolue_automatiquement: true, resolue_le: maintenant }).eq('id', a.id);
      if (eResolution) { console.error('Résolution auto alerte chaîne FDJ:', eResolution); continue; }
      mutations = true;
      await nexusClient.from('fdj_audit_log').insert({
        site: siteId, shift_id: a.shift_id, entite_type: 'fdj_alerte', entite_id: a.id,
        action: 'fdj_chaine_retablie_automatiquement', acteur_id: null,
        ancienne_valeur: { type: 'chaine_interrompue', resolue_automatiquement: false },
        nouvelle_valeur: { resolue_automatiquement: true, resolue_le: maintenant },
      });

      const predAttendu = NexusFdjMoteur.quartPrecedentAttendu(quartActuelInfo.date, quartActuelInfo.quart);
      const predShift = ensemble.find(s => s.date === predAttendu.date && s.quart === predAttendu.quart);
      let aRevoirEnAttente = false;
      if (predShift) {
        const { ecarts, autoMap } = await ecartsContinuiteStockQuart(predShift.id, a.shift_id);
        if (ecarts.length) {
          // 16/08/2026 : "une chaîne rétablie ne signifie pas forcément que
          // les anciens écarts calculés pendant la rupture sont
          // automatiquement valides [...] résolution de l'alerte + recalcul
          // des données doivent être indissociables." Sépare les jeux en
          // écart selon qu'une main humaine a déjà confirmé leur
          // stock_initial ou non (voir NexusFdjMoteur.ecartsContinuiteAAppliquer) :
          // les uns sont corrigés tout seuls (voir
          // appliquerCorrectionsAutomatiquesContinuite), les autres suivent
          // le flux d'alerte manuelle existant, inchangé.
          const { applicables, aRevoir } = NexusFdjMoteur.ecartsContinuiteAAppliquer(ecarts, autoMap);

          if (applicables.length) {
            await appliquerCorrectionsAutomatiquesContinuite(a.shift_id, applicables);
            mutations = true;
          }

          if (aRevoir.length) {
            aRevoirEnAttente = true;
            const { data: existantes } = await nexusClient.from('fdj_alertes').select('id, game_id')
              .eq('site', siteId).eq('type', 'continuite_stock_a_verifier').eq('shift_id', a.shift_id);
            const gamesDejaSignales = new Set((existantes || []).map(r => r.game_id));
            const nouvelles = aRevoir.filter(e => !gamesDejaSignales.has(e.game_id)).map(e => ({
              site: siteId, type: 'continuite_stock_a_verifier', shift_id: a.shift_id, shift_precedent_id: predShift.id,
              game_id: e.game_id, valeur_quart_precedent: e.stock_final_precedent, valeur_saisie: e.stock_initial_actuel,
              employee_id: quartActuelInfo.employee_id || null,
            }));
            if (nouvelles.length) {
              const { error: eInsert } = await nexusClient.from('fdj_alertes').insert(nouvelles);
              if (eInsert) console.error('Insertion anomalies continuité stock FDJ:', eInsert);
              else await nexusClient.from('fdj_audit_log').insert({
                site: siteId, shift_id: a.shift_id, entite_type: 'fdj_alerte', entite_id: a.id,
                action: 'fdj_continuite_stock_a_verifier_posee', acteur_id: null,
                ancienne_valeur: null, nouvelle_valeur: { jeux: nouvelles.map(n => n.game_id) },
              });
            }
          }
        }
      }

      // 16/08/2026, demande de Frédéric : "le relevé doit connaître la
      // qualité de la chaîne [...] Chaîne interrompue / donnée manquante →
      // Relevé provisoire — continuité à régulariser. Puis, lorsque le
      // quart manquant est complété : recalcul automatique, création d'une
      // nouvelle version, ancienne version conservée, statut final mis à
      // jour." Appelée dans TOUS les cas où la chaîne vient d'être
      // rétablie pour ce quart — y compris quand le stock ne présentait
      // déjà plus aucun écart (rien à corriger, seul le "caractère" du
      // relevé doit passer de provisoire à définitif).
      await synchroniserRelevesApresRetablissementChaine(a.shift_id, aRevoirEnAttente);
    }
    return mutations;
  }

  // RELEVÉ DE CLÔTURE — synchronisation après rétablissement de chaîne
  // (16/08/2026). Le relevé posé par l'employé (ou une régularisation
  // manager) au moment où la chaîne était rompue reste 'provisoire' à
  // jamais — cette fonction ne le réécrit JAMAIS, elle pose une NOUVELLE
  // version (type_version='recalcul_automatique_chaine', jamais une action
  // humaine directe) qui reflète l'état réel une fois la chaîne saine. Ne
  // fait rien si aucune version n'existe encore pour ce quart (rien à
  // synchroniser — pas de reconstruction rétroactive d'un historique
  // pré-existant à cette fonctionnalité).
  async function synchroniserRelevesApresRetablissementChaine(shiftId, aRevoirEnAttente) {
    const { data: precedentes } = await nexusClient.from('fdj_releves_cloture').select('*').eq('shift_id', shiftId).order('version_num', { ascending: false }).limit(1);
    const precedent = (precedentes || [])[0] || null;
    if (!precedent) return; // aucun relevé encore posé pour ce quart — rien à faire

    const [{ data: counts }, { data: reports }, { data: cash }] = await Promise.all([
      nexusClient.from('fdj_shift_counts').select('*').eq('shift_id', shiftId),
      nexusClient.from('fdj_reports').select('*').eq('shift_id', shiftId),
      nexusClient.from('fdj_cash_controls').select('*').eq('shift_id', shiftId).maybeSingle(),
    ]);
    const stockInitialParJeu = {}, approParJeu = {}, stockFinalParJeu = {}, ventesParJeu = {};
    (counts || []).forEach(c => {
      stockInitialParJeu[c.game_id] = c.stock_initial ?? null;
      approParJeu[c.game_id] = c.appro || 0;
      stockFinalParJeu[c.game_id] = c.stock_final ?? null;
      ventesParJeu[c.game_id] = { qte: c.ventes_qte ?? null, valeur: c.ventes_valeur ?? null };
    });
    const repJournalier = (reports || []).find(r => r.type_rapport === 'journalier');
    const repTempsReel = (reports || []).find(r => r.type_rapport === 'temps_reel');
    const versionNum = precedent.version_num + 1;
    const nouveauSnapshot = {
      stock_initial_par_jeu: stockInitialParJeu, appro_par_jeu: approParJeu, stock_final_par_jeu: stockFinalParJeu, ventes_par_jeu: ventesParJeu,
      ventes_grattage_valeur: cash ? cash.ventes_grattage_valeur : null, lots_payes_grattage: repJournalier ? repJournalier.lots_payes_grattage : null,
      caisse_tirages: repTempsReel ? repTempsReel.caisse_tirages : null, regularisations: cash ? cash.regularisations : 0,
      caisse_attendue: cash ? cash.caisse_attendue : null, caisse_reelle: cash ? cash.caisse_reelle : null, ecart: cash ? cash.ecart : null,
      // Sécurisation structurelle point 1 : cette fonction ne pose jamais
      // une action humaine — 'recalcul_automatique_chaine' est passé
      // explicitement pour que statutRelevecloture ne la confonde jamais
      // avec une régularisation manager.
      statut: NexusFdjMoteur.statutRelevecloture(versionNum, cash ? cash.ecart : null, 'recalcul_automatique_chaine'),
      // Sécurisation structurelle point 2 : chaîne confirmée intacte (cette
      // fonction n'est appelée qu'une fois etat.rompue===false), donc
      // chaine_interrompue est toujours false ici — mais tant qu'il reste
      // un jeu à vérifier manuellement sur CE quart, continuite_stock_a_verifier
      // reste vraie et le relevé reste 'provisoire' : la continuité
      // temporelle est rétablie, la fiabilité du chiffre ne l'est pas
      // encore complètement. Les deux causes restent distinguables.
      anomalie_chaine: { chaine_interrompue: false, continuite_stock_a_verifier: !!aRevoirEnAttente },
      caractere: NexusFdjMoteur.caractereRelevecloture({ chaineInterrompue: false, continuiteStockAVerifier: !!aRevoirEnAttente }),
    };
    const diff = NexusFdjMoteur.diffClotureFdj(precedent, nouveauSnapshot);
    // Un changement de `caractere` (provisoire -> définitif) est TOUJOURS
    // significatif même si diffClotureFdj (qui ne compare que les champs
    // chiffrés) n'y voit rien à signaler — sinon un quart dont le stock
    // était déjà juste avant la correction ne recevrait jamais sa version
    // "définitive" alors que c'est exactement ce que Frédéric a demandé.
    if (!diff && nouveauSnapshot.caractere === precedent.caractere) return;

    const signature = {
      utilisateur_id: null, nom: 'NEXUS', role: 'system', date_heure: new Date().toISOString(), version_donnees: versionNum,
      session_id: null, quart_id: shiftId,
      message_confirmation: 'Recalcul automatique après rétablissement de la chaîne de continuité FDJ.',
    };
    const { error: eReleve } = await nexusClient.from('fdj_releves_cloture').insert({
      site: siteId, shift_id: shiftId, date: precedent.date, quart: precedent.quart, employee_id: precedent.employee_id,
      version_num: versionNum, type_version: 'recalcul_automatique_chaine', cree_par: null,
      ...nouveauSnapshot,
      motif_regularisation: 'Chaîne FDJ rétablie automatiquement — stocks et écart recalculés à partir des données désormais complètes.',
      diff_vs_precedent: diff,
      signature,
    });
    if (eReleve) console.error('Relevé de clôture FDJ (version recalcul automatique):', eReleve);
  }

  // 16/08/2026, sécurisation structurelle demandée par Frédéric, point 4 :
  // réparation manager d'un quart 'valide' dont l'écriture du relevé de
  // clôture a échoué (voir chargerShiftsReleveEnErreur). Le comptage et le
  // contrôle de caisse existent déjà (fdj_shift_counts/fdj_cash_controls,
  // écrits par l'employé) — seule la ligne de PREUVE (fdj_releves_cloture)
  // manque. Cette fonction ne modifie AUCUNE donnée saisie, elle reconstruit
  // la version 1 ('validation_employe') à partir de ce qui est déjà
  // persisté, exactement ce que validerQuart() aurait dû écrire. Point 5 :
  // toujours vérifiée contre l'idempotence (index unique + code 23505)
  // avant de conclure à une erreur réelle.
  async function reessayerReleveClotureManquant(shift) {
    const { data: existant, error: eExistant } = await nexusClient.from('fdj_releves_cloture').select('id')
      .eq('shift_id', shift.id).eq('type_version', 'validation_employe').limit(1);
    if (eExistant) { console.error('Vérification relevé existant avant reprise:', eExistant); return { ok: false, motif: 'Vérification impossible — réessayez.' }; }
    if (existant && existant.length) {
      // Le relevé existe déjà (écriture finalement réussie, ou reprise
      // concurrente) — on corrige seulement le suivi, jamais de doublon.
      await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'ok' }).eq('id', shift.id);
      return { ok: true, dejaPresent: true };
    }

    const cash = shift.cash || extraireCash(shift);
    if (!cash) return { ok: false, motif: "Aucun contrôle de caisse enregistré pour ce quart — impossible de reconstruire le relevé automatiquement. Utilisez « Modifier » pour compléter le quart manuellement." };

    const [{ data: counts }, { data: reports }, { data: alertesOuvertes }] = await Promise.all([
      nexusClient.from('fdj_shift_counts').select('*').eq('shift_id', shift.id),
      nexusClient.from('fdj_reports').select('*').eq('shift_id', shift.id),
      nexusClient.from('fdj_alertes').select('id, type').eq('shift_id', shift.id).in('type', ['chaine_interrompue', 'continuite_stock_a_verifier']).eq('resolue_automatiquement', false).eq('vue', false),
    ]);
    const stockInitialParJeu = {}, approParJeu = {}, stockFinalParJeu = {}, ventesParJeu = {};
    (counts || []).forEach(c => {
      stockInitialParJeu[c.game_id] = c.stock_initial ?? null;
      approParJeu[c.game_id] = c.appro || 0;
      stockFinalParJeu[c.game_id] = c.stock_final ?? null;
      ventesParJeu[c.game_id] = { qte: c.ventes_qte ?? null, valeur: c.ventes_valeur ?? null };
    });
    const repJournalier = (reports || []).find(r => r.type_rapport === 'journalier');
    const repTempsReel = (reports || []).find(r => r.type_rapport === 'temps_reel');
    const chaineInterrompueOuverte = (alertesOuvertes || []).some(a => a.type === 'chaine_interrompue');
    const continuiteStockAVerifierOuverte = (alertesOuvertes || []).some(a => a.type === 'continuite_stock_a_verifier');
    const ecart = cash.ecart;

    const signature = {
      utilisateur_id: managerCourant.id, nom: managerCourant.nom, role: 'manager',
      date_heure: new Date().toISOString(), version_donnees: 1,
      session_id: (typeof navigator !== 'undefined' && navigator.userAgent) || null,
      quart_id: shift.id,
      // cree_par reste l'employé (comme validerQuart) : cette ligne
      // reconstruit SA constatation d'origine déjà persistée, elle n'en
      // crée pas une nouvelle — c'est la signature ci-dessus, avec le rôle
      // 'manager', qui documente honnêtement qui a déclenché la reprise.
      message_confirmation: "Reprise manager d'un relevé de clôture manquant (échec d'écriture initial). Données reconstruites depuis le comptage et le contrôle de caisse déjà enregistrés par l'employé — aucune valeur saisie n'a été modifiée.",
    };
    const { error: eReleve } = await nexusClient.from('fdj_releves_cloture').insert({
      site: siteId, shift_id: shift.id, date: shift.date, quart: shift.quart, employee_id: shift.employee_id,
      version_num: 1, type_version: 'validation_employe', cree_par: shift.employee_id,
      stock_initial_par_jeu: stockInitialParJeu, appro_par_jeu: approParJeu, stock_final_par_jeu: stockFinalParJeu, ventes_par_jeu: ventesParJeu,
      ventes_grattage_valeur: cash.ventes_grattage_valeur, lots_payes_grattage: repJournalier ? repJournalier.lots_payes_grattage : null,
      caisse_tirages: repTempsReel ? repTempsReel.caisse_tirages : null, regularisations: cash.regularisations || 0,
      caisse_attendue: cash.caisse_attendue, caisse_reelle: cash.caisse_reelle, ecart,
      anomalie_chaine: { chaine_interrompue: chaineInterrompueOuverte, continuite_stock_a_verifier: continuiteStockAVerifierOuverte },
      caractere: NexusFdjMoteur.caractereRelevecloture({ chaineInterrompue: chaineInterrompueOuverte, continuiteStockAVerifier: continuiteStockAVerifierOuverte }),
      statut: NexusFdjMoteur.statutRelevecloture(1, ecart, 'validation_employe'),
      signature,
    });
    if (eReleve) {
      if (eReleve.code === '23505') {
        // Idempotence (point 5) : une validation employé vient d'apparaître
        // entre notre vérification et cet insert — jamais une erreur.
        await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'ok' }).eq('id', shift.id);
        return { ok: true, dejaPresent: true };
      }
      console.error('Reprise relevé de clôture FDJ:', eReleve);
      await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'erreur' }).eq('id', shift.id);
      return { ok: false, motif: "L'écriture a de nouveau échoué. Réessayez, ou contactez le support si le problème persiste." };
    }
    await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'ok' }).eq('id', shift.id);
    return { ok: true };
  }

  function nomJeu(gameId) {
    const j = jeux.find(x => x.id === gameId);
    return j ? j.nom : '—';
  }
  function libelleQuart(s) {
    return s ? `${new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR')} · Quart ${s.quart}` : '—';
  }

  // 13/08/2026 — "Règle d'accès aux quarts FDJ V1" : verrous du jour posés
  // sur fdj_employee_shift_locks (dès qu'un employé a validé son stock de
  // départ, il est verrouillé sur ce quart pour la journée — voir
  // NEXUS-FDJ-v1.html::validerOuverture). Ce panneau donne au manager la
  // seule porte de sortie prévue par la règle (exigence #5) : une dérogation
  // tracée, jamais une modification silencieuse.
  async function chargerVerrousJour() {
    const { data, error } = await nexusClient.from('fdj_employee_shift_locks').select('*')
      .eq('site', siteId).eq('date_service', dateISO()).order('locked_at', { ascending: false });
    if (error) { console.error('Chargement verrous quart FDJ du jour:', error); return []; }
    return data || [];
  }
  function renderVerrouJour(v) {
    const autreQuart = v.quart === '1' ? '2' : '1';
    const origine = v.source_lock === 'override_manager'
      ? `Dérogation manager${v.override_motif ? ` — ${labelMotifDerogationQuart(v.override_motif)}` : ''}`
      : 'Validation du stock de départ';
    return `
      <div class="jeu-row" data-verrou="${v.id}" style="padding:12px 14px;">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">🔒 ${nomEmploye(v.employee_id)} — Quart ${v.quart}</div>
        </div>
        <div class="histo-sub" style="margin-bottom:8px;">
          ${origine} · ${new Date(v.locked_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn-modifier" data-deroger="${v.id}" data-autre-quart="${autreQuart}" style="margin-top:0; flex:1;">Déroger vers Quart ${autreQuart}</button>
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // DÉROGATION MANAGER — exigence #5 de la règle d'accès aux quarts : la
  // seule façon de faire passer un employé déjà verrouillé vers l'autre
  // quart. Ne touche jamais fdj_shifts/fdj_shift_counts (ce n'est pas une
  // correction de comptage, seulement un déplacement du verrou) — pour ça,
  // enregistrerEdition() reste le bon écran, et il n'est pas concerné par le
  // verrou (exigence #6, corrections historiques manager toujours autorisées).
  // ------------------------------------------------------------
  async function ouvrirDerogationQuart(verrouId, autreQuart) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    const { data: v, error } = await nexusClient.from('fdj_employee_shift_locks').select('*').eq('id', verrouId).single();
    if (error || !v) { console.error('Lecture verrou avant dérogation:', error); alert('Erreur — réessayez.'); renderAccueil(); return; }
    derogation = { verrouId: v.id, employeeId: v.employee_id, quartActuel: v.quart, autreQuart, motif: '' };
    vue = 'derogation';
    renderDerogationQuart();
  }

  function renderDerogationQuart() {
    document.getElementById('titre').textContent = 'Dérogation — changement de quart';
    document.getElementById('sousTitre').textContent = "Toute exception au verrou d'un employé doit être tracée avec un motif.";
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourDerogation">← Retour</button>
      <div class="etat-banner" style="text-align:left;">
        <b style="color:var(--text);">${nomEmploye(derogation.employeeId)}</b> est actuellement verrouillé sur le
        <b style="color:var(--text);">Quart ${derogation.quartActuel}</b> pour aujourd'hui.<br>
        Cette dérogation le fera passer sur le <b style="color:var(--cyan);">Quart ${derogation.autreQuart}</b> — le Quart ${derogation.quartActuel} lui redeviendra inaccessible sans une nouvelle dérogation.
      </div>

      <select class="champ-select" id="champMotifDerogation" style="margin-bottom:16px;">
        ${MOTIFS_DEROGATION_QUART.map(m => `<option value="${m.value}" ${m.value === derogation.motif ? 'selected' : ''}>${m.label}</option>`).join('')}
      </select>
      <button class="btn-primary" id="btnConfirmerDerogation">Confirmer la dérogation</button>
      <button class="btn-ghost" id="btnAnnulerDerogation">Annuler</button>
    `;
    document.getElementById('btnRetourDerogation').addEventListener('click', () => { vue = 'liste'; derogation = null; renderAccueil(); });
    document.getElementById('btnAnnulerDerogation').addEventListener('click', () => { vue = 'liste'; derogation = null; renderAccueil(); });
    document.getElementById('champMotifDerogation').addEventListener('change', e => { derogation.motif = e.target.value; });
    document.getElementById('btnConfirmerDerogation').addEventListener('click', enregistrerDerogationQuart);
  }

  async function enregistrerDerogationQuart() {
    if (!derogation.motif) { alert('Un motif est obligatoire pour tracer la dérogation.'); return; }
    const btn = document.getElementById('btnConfirmerDerogation');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    const { data: verrouAvant } = await nexusClient.from('fdj_employee_shift_locks').select('quart, source_lock').eq('id', derogation.verrouId).single();

    // La policy RLS "ecriture_fdj_employee_shift_locks_manager" exige
    // exactement ces 3 champs ensemble (source_lock='override_manager' +
    // override_manager_id=auth.uid()) — c'est elle, pas ce code, qui fait
    // vraiment autorité sur "seul un manager peut déroger" (voir migration
    // fdj_employee_shift_locks).
    const { error } = await nexusClient.from('fdj_employee_shift_locks').update({
      quart: derogation.autreQuart, source_lock: 'override_manager',
      override_manager_id: managerCourant.id, override_motif: derogation.motif,
      locked_at: new Date().toISOString(),
    }).eq('id', derogation.verrouId);
    if (error) {
      console.error('Dérogation quart FDJ:', error);
      btn.disabled = false; btn.textContent = 'Confirmer la dérogation';
      alert("Erreur d'enregistrement de la dérogation. Réessayez.");
      return;
    }

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, entite_type: 'fdj_employee_shift_lock', entite_id: derogation.verrouId,
      action: 'derogation_manager', acteur_id: managerCourant.id, motif: derogation.motif,
      ancienne_valeur: verrouAvant || { quart: derogation.quartActuel, source_lock: null },
      nouvelle_valeur: { quart: derogation.autreQuart, source_lock: 'override_manager', override_manager_id: managerCourant.id, override_motif: derogation.motif },
    });

    vue = 'liste'; derogation = null;
    renderAccueil();
  }

  async function renderAccueil() {
    document.getElementById('titre').textContent = 'Contrôle FDJ';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';

    if (!jeux.length) jeux = await chargerJeux();
    const aujourdhui = dateISO();
    const [duJour, historique, alertesInitiales, soldesNegatifs, verrousJour, relevesEnErreur, quartsARevoir, carnetsARapprocher, ecartsRecalculesAValider, replaysRequis] = await Promise.all([
      chargerShiftsAvecCaisse(aujourdhui), chargerShiftsAvecCaisse(null), chargerAlertesNonVues(), calculerSoldesNegatifs(), chargerVerrousJour(), chargerShiftsReleveEnErreur(),
      chargerQuartsARevoir(), chargerCarnetsARapprocher(), chargerEcartsRecalculesAValider(), chargerReplaysRequis(),
    ]);
    // Recalcul dynamique de la chaîne (16/08/2026, demande de Frédéric) : à
    // CHAQUE affichage de cet accueil — donc après toute création,
    // validation, régularisation ou modification d'un quart, puisque
    // toutes ces actions ramènent ici — on revérifie les alertes
    // "chaîne interrompue" encore actives contre l'état réel. Si l'une
    // d'elles vient d'être résolue ou remplacée, on relit les alertes pour
    // ne jamais afficher une donnée qu'on vient de réécrire sous les yeux.
    const mutationsAlertes = await reconcilierAlertesChaine(alertesInitiales, historique);
    const [alertes, journalChaine] = await Promise.all([
      mutationsAlertes ? chargerAlertesNonVues() : Promise.resolve(alertesInitiales),
      chargerJournalChaine(),
    ]);
    const quart1 = duJour.find(s => s.quart === '1');
    const quart2 = duJour.find(s => s.quart === '2');

    // Brouillons FDJ (20/08/2026, cahier "FDJ - Audit de consolidation",
    // §2.2, FDJ-03 : "Le manager voit les brouillons dans une zone 'À
    // terminer / brouillons' avec date, quart et employé.") — réutilise
    // `historique` déjà chargé ci-dessus (Article 11, jamais une deuxième
    // requête pour la même liste), simplement scindé en deux : les quarts
    // du jour (quart1/quart2, déjà affichés dans "Aujourd'hui" juste en
    // dessous) sont exclus d'ici pour ne jamais doubler le même quart à
    // deux endroits de l'écran.
    const brouillons = historique.filter(s => s.statut !== 'valide' && s.date !== aujourdhui);
    const historiqueTransmis = historique.filter(s => s.statut === 'valide');

    // FDJ Fiabilisation — Étape 3 : agrégation des signaux déjà chargés
    // ci-dessus, jamais une nouvelle détection (Article 11 — voir
    // NexusFdjMoteur.syntheseExceptionsManager).
    const exceptions = NexusFdjMoteur.syntheseExceptionsManager({
      correctionsRetroactives: [...alertes.filter(a => a.type === 'stock_initial_modifie'), ...quartsARevoir],
      quartsManquants: alertes.filter(a => a.type === 'chaine_interrompue'),
      carnetsARapprocher, ecartsRecalcules: ecartsRecalculesAValider, replaysRequis,
    });

    document.getElementById('content').innerHTML = `
      ${renderRelevesEnErreurBloc(relevesEnErreur)}

      ${renderBoiteExceptions(exceptions)}

      ${soldesNegatifs.length ? `
        <div class="section-titre">🔴 Mouvements FDJ à vérifier (${soldesNegatifs.length})</div>
        <div class="card" id="listeSoldesNegatifs" style="margin-bottom:16px;">${soldesNegatifs.map(renderSoldeNegatif).join('')}</div>
      ` : ''}

      ${alertes.length ? `
        <div class="section-titre">⚠️ Alertes stock (${alertes.length})</div>
        <div class="card" id="listeAlertes">${alertes.map(renderAlerte).join('')}</div>
      ` : ''}

      ${verrousJour.length ? `
        <div class="section-titre">🔒 Accès aux quarts — aujourd'hui (${verrousJour.length})</div>
        <div class="card" id="listeVerrous" style="margin-bottom:16px;">${verrousJour.map(renderVerrouJour).join('')}</div>
      ` : ''}

      ${renderJournalChaineBloc(journalChaine)}

      ${brouillons.length ? `
        <div class="section-titre">📝 Brouillons FDJ à terminer (${brouillons.length})</div>
        <div class="card" id="listeBrouillons" style="margin-bottom:16px;">${brouillons.map(renderBrouillonItem).join('')}</div>
      ` : ''}

      <div class="section-titre">Aujourd'hui</div>
      <div class="quart-jour-grid">
        ${renderCarteQuartJour('1', quart1, historique, alertes)}
        ${renderCarteQuartJour('2', quart2, historique, alertes)}
      </div>
      <button class="btn-nouveau" id="btnNouveauQuart">+ Nouveau quart FDJ</button>

      <div class="section-titre">Stock FDJ</div>
      <button class="btn-nouveau" id="btnEtatStock">📊 État du stock (Bureau / Caisse / Activés)</button>
      <div class="champ-note">Vue d'ensemble par jeu, dernière réception, retraits/blocages en cours.</div>
      <button class="btn-nouveau" id="btnReception">📦 Réceptionner une livraison FDJ</button>
      <div class="champ-note">Transporteur → Bureau. N'active rien, n'alimente jamais l'appro tickets.</div>
      <button class="btn-nouveau" id="btnReappro" style="color:var(--gold); border-color:rgba(212,175,55,0.4); background:rgba(212,175,55,0.06);">🔁 Réapprovisionner la caisse</button>
      <div class="champ-note">Bureau → Caisse : les carnets confiés restent non activés, aucun impact sur l'appro tant que la caissière ne les active pas.</div>
      <button class="btn-nouveau" id="btnInventaireRef">📋 Contrôle physique du stock (inventaire de référence)</button>
      <div class="champ-note">Compare le stock théorique NEXUS au comptage physique réel. Un contrôle validé devient le nouveau point zéro — seuls les mouvements qui suivent modifient le stock ensuite.</div>

      <div class="section-titre">Historique</div>
      <div class="card" id="listeHistorique">
        ${historiqueTransmis.length ? historiqueTransmis.map((s, i) => renderHistoItem(s, i, historique, alertes)).join('') : '<div class="empty">Aucun quart FDJ transmis pour l’instant.</div>'}
      </div>

      <!-- Trace de contrôle FDJ (16/08/2026) — 3e niveau de consultation
           demandé par Frédéric : "Historique FDJ de [employé] — [mois]",
           en plus du relevé par quart et de l'export journée déjà
           accessibles depuis chaque ligne de l'historique ci-dessus. -->
      <button class="btn-nouveau" id="btnHistoriqueEmploye">👤 Historique FDJ par employé</button>
      <div class="champ-note">Relevés de clôture d'un employé sur un mois donné — chaque quart reste consultable individuellement.</div>

      <!-- Paramètres FDJ (10/08/2026, audit "Paramétrage autonome & multi-
           site", étape 3) : même discipline que Contrôle inventaire — un
           seul lien vers l'écran de configuration dédié, cet écran reste
           centré sur "que dois-je traiter maintenant ?". -->
      <a href="NEXUS-FDJ-Parametres-v1.html" class="section-titre" style="display:block; text-decoration:none; margin-top:18px;">⚙️ Paramètres FDJ →</a>
    `;

    // Journal continuité replié par défaut (16/08/2026) — le manager sait
    // en un coup d'œil si la chaîne est saine ; l'historique complet ne
    // s'ouvre que sur demande explicite.
    const btnJournalToggle = document.getElementById('btnJournalChaineToggle');
    if (btnJournalToggle) {
      btnJournalToggle.addEventListener('click', () => {
        const bloc = document.getElementById('journalChaineHistorique');
        const ouvert = bloc.style.display !== 'none';
        bloc.style.display = ouvert ? 'none' : '';
        btnJournalToggle.textContent = btnJournalToggle.textContent.replace(ouvert ? '▴' : '▾', ouvert ? '▾' : '▴');
      });
    }
    document.getElementById('btnNouveauQuart').addEventListener('click', () => ouvrirEditionNouveau());
    document.getElementById('btnReappro').addEventListener('click', () => ouvrirReappro());
    document.getElementById('btnInventaireRef').addEventListener('click', () => ouvrirInventaireRef());
    document.getElementById('btnReception').addEventListener('click', () => ouvrirReception());
    document.getElementById('btnEtatStock').addEventListener('click', () => ouvrirStockEtat());
    document.getElementById('btnHistoriqueEmploye').addEventListener('click', () => ouvrirHistoriqueEmployeListe());
    // 16/08/2026, sécurisation structurelle point 4 : bouton "Réessayer"
    // du panneau "Relevés de clôture à régulariser" — désactivé pendant
    // l'opération (jamais de double-clic sur une écriture), puis on
    // recharge tout l'accueil pour refléter l'état réel (panneau vidé si
    // réparé, ou toujours présent avec un message d'échec sinon).
    const listeRelevesEnErreur = document.getElementById('listeRelevesEnErreur');
    if (listeRelevesEnErreur) {
      // 17/08/2026 — section dépliable (demande de Frédéric), même
      // mécanique que le Journal — continuité FDJ ci-dessus.
      const btnRelevesToggle = document.getElementById('btnRelevesEnErreurToggle');
      if (btnRelevesToggle) {
        btnRelevesToggle.addEventListener('click', () => {
          const bloc = document.getElementById('relevesEnErreurListe');
          const ouvert = bloc.style.display !== 'none';
          bloc.style.display = ouvert ? 'none' : '';
          btnRelevesToggle.textContent = btnRelevesToggle.textContent.replace(ouvert ? '▴' : '▾', ouvert ? '▾' : '▴');
        });
      }
      listeRelevesEnErreur.querySelectorAll('[data-reessayer-releve]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Reprise en cours…';
          const shift = relevesEnErreur.find(s => s.id === btn.dataset.reessayerReleve);
          if (!shift) { btn.disabled = false; return; }
          const resultat = await reessayerReleveClotureManquant(shift);
          if (!resultat.ok) {
            btn.disabled = false;
            btn.textContent = "🔁 Réessayer l'écriture du relevé";
            alert(resultat.motif || "L'écriture a échoué. Réessayez.");
            return;
          }
          renderAccueil();
        });
      });
    }
    if (quart1) document.getElementById(`carteQuart1`).addEventListener('click', () => ouvrirEditionExistant(quart1));
    if (quart2) document.getElementById(`carteQuart2`).addEventListener('click', () => ouvrirEditionExistant(quart2));

    document.querySelectorAll('.histo-item').forEach((item, i) => {
      item.addEventListener('click', () => document.getElementById(`detail-${i}`).classList.toggle('open'));
    });
    // 20/08/2026 : indexé sur `historiqueTransmis` (pas `historique`) depuis
    // que l'Historique n'affiche plus que les quarts transmis — voir plus
    // haut, les brouillons ont leur propre zone et leur propre indexation
    // (data-idx-brouillon).
    document.querySelectorAll('#listeHistorique .btn-modifier[data-idx]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); ouvrirEditionExistant(historiqueTransmis[parseInt(btn.dataset.idx, 10)]); });
    });
    // 16/08/2026 — Trace de contrôle FDJ : deux entrées supplémentaires
    // depuis chaque quart déplié de l'historique — "Historique FDJ →
    // sélectionner un quart → Générer le relevé de contrôle" et "Exporter
    // la journée complète" (demande explicite de Frédéric).
    document.querySelectorAll('#listeHistorique [data-releve-idx]').forEach(btn => {

    const listeAlertes = document.getElementById('listeAlertes');
    if (listeAlertes) {
      listeAlertes.querySelectorAll('[data-corriger]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const shift = await chargerShiftAvecCaisseParId(btn.dataset.corriger);
          if (!shift) return;
          await ouvrirEditionExistant(shift);
          // 16/08/2026, demande de Frédéric : "quand j'ai une alerte car un
          // stock de fin ne correspond au stock de départ et que je clique
          // sur vérifier le quart, envoie le curseur directement sur le jeu
          // [...] un petit voyant rouge qui scintille" — repère le jeu visé
          // par l'alerte 'continuite_stock_a_verifier' plutôt que de laisser
          // le manager le rechercher dans la liste (voir surlignerJeuCible).
          if (btn.dataset.jeuCible) surlignerJeuCible(btn.dataset.jeuCible);
        });
      });
      // 13/08/2026 : bouton "Compléter" de l'alerte chaîne interrompue —
      // même chemin que le rattrapage FDJ Pilotage (ouvrirDepuisParametresUrl),
      // mais en navigation directe (pas de rechargement de page).
      listeAlertes.querySelectorAll('[data-completer]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const [date, quart] = btn.dataset.completer.split('|');
          await ouvrirDepuisParametresUrl(date, quart);
        });
      });
      listeAlertes.querySelectorAll('[data-vue]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          const { error } = await nexusClient.from('fdj_alertes').update({ vue: true, vue_par: managerCourant.id, vue_le: new Date().toISOString() }).eq('id', btn.dataset.vue);
          if (error) { console.error('Marquage alerte FDJ vue:', error); btn.disabled = false; return; }
          renderAccueil();
        });

    const listeVerrous = document.getElementById('listeVerrous');
    if (listeVerrous) {
      listeVerrous.querySelectorAll('[data-deroger]').forEach(btn => {
        btn.addEventListener('click', () => ouvrirDerogationQuart(btn.dataset.deroger, btn.dataset.autreQuart));
      });
    }

    // 17/08/2026, demande de Frédéric : acquittement "Vérifié ☑" du panneau
    // "Mouvements FDJ à vérifier" (soldes non-activés négatifs) — voir
    // calculerSoldesNegatifs pour la logique de réapparition si le solde change.
    const listeSoldesNegatifs = document.getElementById('listeSoldesNegatifs');
    if (listeSoldesNegatifs) {
      listeSoldesNegatifs.querySelectorAll('[data-verifier-solde]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          const { error } = await nexusClient.from('fdj_alertes').insert({
            site: siteId, type: 'solde_negatif_verifie', game_id: btn.dataset.verifierSolde,
            valeur_saisie: btn.dataset.verifierValeur, vue: true,
            vue_par: managerCourant.id, vue_le: new Date().toISOString(),
          });
          if (error) { console.error('Acquittement solde négatif FDJ:', error); btn.disabled = false; return; }
          renderAccueil();
        });
      });
    }

    // FDJ Fiabilisation — Étape 3 : boîte d'exceptions manager.
    const btnBoiteExceptionsToggle = document.getElementById('btnBoiteExceptionsToggle');
    if (btnBoiteExceptionsToggle) {
      btnBoiteExceptionsToggle.addEventListener('click', () => {
        const bloc = document.getElementById('boiteExceptionsDetail');
        const ouvert = bloc.style.display !== 'none';
        bloc.style.display = ouvert ? 'none' : '';
        btnBoiteExceptionsToggle.textContent = btnBoiteExceptionsToggle.textContent.replace(ouvert ? '▴' : '▾', ouvert ? '▾' : '▴');
      });
    }
    const boiteExceptionsDetail = document.getElementById('boiteExceptionsDetail');
    if (boiteExceptionsDetail) {
      boiteExceptionsDetail.querySelectorAll('[data-corriger]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const shift = await chargerShiftAvecCaisseParId(btn.dataset.corriger);
          if (!shift) return;
          await ouvrirEditionExistant(shift);
        });
      });
      boiteExceptionsDetail.querySelectorAll('[data-voir-journal-exception]').forEach(btn => {
        btn.addEventListener('click', () => {
          const bloc = document.getElementById('journalChaineHistorique');
          const toggle = document.getElementById('btnJournalChaineToggle');
          if (!bloc || !toggle) return;
          bloc.style.display = '';
          toggle.textContent = toggle.textContent.replace('▾', '▴');
          toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
      boiteExceptionsDetail.querySelectorAll('[data-ouvrir-etat-stock-exception]').forEach(btn => {
        btn.addEventListener('click', () => ouvrirStockEtat());
      });
      boiteExceptionsDetail.querySelectorAll('[data-voir-releve-exception]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const shift = await chargerShiftAvecCaisseParId(btn.dataset.voirReleveException);
          if (!shift) return;
          await ouvrirReleveQuart(shift);
        });
      });
      boiteExceptionsDetail.querySelectorAll('[data-revalider-ecart]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          const ok = await revaliderEcartRecalcule(btn.dataset.revaliderEcart, btn.dataset.revaliderShift);
          if (!ok) { btn.disabled = false; return; }
          renderAccueil();
        });
      });
      // FDJ Fiabilisation — Étape 4 : recalcul manuel d'un relevé de
      // clôture resté périmé (needs_replay=true) — filet de sécurité
      // quand le recalcul automatique de rejouerReleveApresPropagation
      // avait échoué au moment de la propagation.
      boiteExceptionsDetail.querySelectorAll('[data-recalculer-replay]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          const shiftId = btn.dataset.recalculerReplay;
          const ok = await rejouerReleveApresPropagation(shiftId, null);
          await nexusClient.from('fdj_shifts').update(
            ok ? { needs_replay: false, last_replayed_at: new Date().toISOString() } : { needs_replay: true }
          ).eq('id', shiftId);
          if (!ok) { btn.disabled = false; return; }
          renderAccueil();
        });
      });
    }
  }

  // ------------------------------------------------------------
  // CONFIANCE DE LA CHAÎNE — Fiabilisation FDJ Étape 1 (13/08/2026), corrigée
  // le 16/08/2026 (demande de Frédéric — capture d'écran Samantha/Loane) :
  // "Cette alerte ne doit pas être persistée comme un statut définitif d'un
  // quart. Elle doit être calculée dynamiquement à partir de la chaîne
  // chronologique réelle." L'ancienne version lisait `previous_shift_id`,
  // une colonne écrite UNE SEULE fois par l'employé à l'ouverture de son
  // quart (jamais mise à jour ensuite) — un quart resté "rompu" à cet
  // instant-là s'affichait donc "Chaîne interrompue" pour toujours, même
  // après que le quart manquant ait été complété. Ici, plus aucune colonne
  // figée : NexusFdjMoteur.chaineInterrompueDynamique recalcule la vérité
  // à chaque appel, à partir de `ensemble` (liste de quarts déjà chargée,
  // tous statuts confondus, aucune requête supplémentaire) — donc toujours
  // à jour au prochain rendu, sans "déclencheur" à poser sur chaque action.
  // `alertesActives` (16/08/2026) : liste déjà réconciliée par
  // reconcilierAlertesChaine — permet de savoir si une anomalie
  // 'continuite_stock_a_verifier' est ouverte pour ce quart précis.
  function calculerIntegriteQuart(s, ensemble, alertesActives) {
    if (!s) return null;
    const rompue = NexusFdjMoteur.chaineInterrompueDynamique({ id: s.id, date: s.date, quart: s.quart }, ensemble || []).rompue;
    const stockAVerifier = (alertesActives || []).some(a => a.type === 'continuite_stock_a_verifier' && a.shift_id === s.id);
    const validationManagerFaite = s.statut !== 'valide' ? null : (s.cash ? s.cash.statut !== 'provisoire' : false);
    return NexusFdjMoteur.etatIntegriteFdj({ rompue, stockAVerifier, aRevoir: !!s.a_revoir, validationManagerFaite });
  }
  function badgeIntegrite(etat) {
    if (!etat || etat.integrite === 'OK') return '';
    // 16/08/2026 : la "Continuité de stock à vérifier" a son propre libellé,
    // jamais confondu avec "Chaîne interrompue" — la chaîne, elle, est
    // intacte dans ce cas précis (motif !== 'quart_manquant').
    if (etat.integrite === 'ROMPUE') return `<span class="badge-integrite stat-value red" style="font-size:9px; font-family:var(--mono); letter-spacing:0.03em;">🔴 Chaîne interrompue</span>`;
    if (etat.motif === 'continuite_stock_a_verifier') return `<span class="badge-integrite stat-value amber" style="font-size:9px; font-family:var(--mono); letter-spacing:0.03em;">🟡 Continuité de stock à vérifier</span>`;
    return `<span class="badge-integrite stat-value amber" style="font-size:9px; font-family:var(--mono); letter-spacing:0.03em;">🟠 Chaîne partielle</span>`;
  }

  function renderCarteQuartJour(quart, shift, ensemble, alertesActives) {
    if (!shift) return `<div class="quart-jour-card" id="carteQuart${quart}"><div class="quart-jour-label">Quart ${quart}</div><div class="quart-jour-statut" style="color:var(--text-dim);">Non compté</div></div>`;
    const ecart = shift.cash ? shift.cash.ecart : null;
    const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const integrite = calculerIntegriteQuart(shift, ensemble, alertesActives);
    // 20/08/2026, cahier "FDJ - Audit de consolidation", §2.2 : "Un
    // brouillon doit toujours afficher clairement 'Brouillon - exclu des
    // rapports'." Depuis que "Laisser en brouillon" peut enregistrer un
    // vrai rapprochement de caisse (statut 'provisoire' identique à une
    // caisse transmise), shift.cash peut désormais exister pour un quart
    // encore 'brouillon' — le statut du QUART (jamais celui de la caisse)
    // doit donc primer sur l'affichage de l'écart, pour ne jamais laisser
    // croire qu'un brouillon est une donnée transmise.
    const estBrouillon = shift.statut !== 'valide';
    return `
      <div class="quart-jour-card" id="carteQuart${quart}">
        <div class="quart-jour-label">Quart ${quart}</div>
        <div class="quart-jour-statut">${nomEmploye(shift.employee_id)}</div>
        <div class="quart-jour-ecart ${!estBrouillon && classe ? `stat-value ${classe}` : ''}" style="${estBrouillon ? 'color:var(--text-dim);' : ''}">${estBrouillon ? 'Brouillon' : (ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—')}</div>
        ${integrite && integrite.integrite !== 'OK' ? `<div style="margin-top:5px;">${badgeIntegrite(integrite)}</div>` : ''}
      </div>
    `;
  }

  function renderHistoItem(s, i, ensemble, alertesActives) {
    const ecart = s.cash ? s.cash.ecart : null;
    const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const integrite = calculerIntegriteQuart(s, ensemble, alertesActives);
    // Même règle que renderCarteQuartJour ci-dessus : le statut du quart
    // prime toujours sur le statut de la caisse pour l'étiquette affichée.
    const estBrouillon = s.statut !== 'valide';
    return `
      <div class="histo-item" data-idx="${i}">
        <div class="histo-top">
          <div>
            <div class="histo-date">${new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR')} <span style="color:var(--text-mid); font-weight:400;">· Quart ${s.quart}</span></div>
            <div class="histo-sub">${nomEmploye(s.employee_id)}</div>
          </div>
          <div style="text-align:right;">
            <div class="histo-ecart ${estBrouillon ? '' : classe}">${estBrouillon ? '—' : (ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—')}</div>
            <div style="margin-top:4px;"><span class="statut-badge ${estBrouillon ? 'brouillon' : (s.cash ? s.cash.statut : 'provisoire')}">${estBrouillon ? 'Brouillon' : (s.cash ? labelStatutCaisse(s.cash.statut) : 'Provisoire')}</span></div>
            ${integrite && integrite.integrite !== 'OK' ? `<div style="margin-top:4px;">${badgeIntegrite(integrite)}</div>` : ''}
          </div>
        </div>
        <div class="histo-detail" id="detail-${i}">
          ${s.cash ? `
            <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(s.cash.caisse_grattage)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse tirages</div><div class="stat-value">${fmtEuro(s.cash.caisse_tirages)}</div></div>
            <div class="stat-row"><div class="stat-label">Régularisations</div><div class="stat-value">${fmtEuro(s.cash.regularisations)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(s.cash.caisse_attendue)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse réelle</div><div class="stat-value">${fmtEuro(s.cash.caisse_reelle)}</div></div>
            ${s.cash.motif_ecart ? `<div class="stat-row"><div class="stat-label">Motif</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${s.cash.motif_ecart}</div></div>` : ''}
            ${s.cash.caisse_reelle_origine !== null && s.cash.caisse_reelle_origine !== undefined && (s.cash.caisse_reelle_origine !== s.cash.caisse_reelle || s.cash.ecart_origine !== s.cash.ecart) ? `
              <div class="stat-row" style="border-top:1px dashed var(--hairline); margin-top:4px; padding-top:8px;">
                <div class="stat-label">Constat initial (employé)</div>
                <div class="stat-value" style="font-size:11.5px; font-weight:400; color:var(--text-mid);">Caisse ${fmtEuro(s.cash.caisse_reelle_origine)} · écart ${s.cash.ecart_origine > 0 ? '+' : ''}${fmtEuro(s.cash.ecart_origine)} — régularisé depuis</div>
              </div>
            ` : ''}
          ` : '<div class="empty">Pas encore de rapprochement caisse pour ce quart.</div>'}
          <button type="button" class="btn-modifier" data-idx="${i}">✏️ Modifier ce quart</button>
          <button type="button" class="btn-modifier" data-releve-idx="${i}" style="margin-top:8px; background:rgba(79,195,217,0.1); border-color:rgba(79,195,217,0.35); color:var(--cyan);">📄 Relevé de clôture FDJ</button>
          <button type="button" class="btn-modifier" data-export-jour="${s.date}" style="margin-top:8px; background:none; border-style:dashed;">📄 Exporter la journée complète (Q1+Q2)</button>
        </div>
      </div>
    `;
  }

  // Brouillons FDJ à terminer (20/08/2026, FDJ-03) — ligne compacte,
  // volontairement plus légère que renderHistoItem (pas de dépliage détail :
  // un brouillon n'est pas encore une donnée de contrôle, juste un repère
  // "à terminer" pour le manager). `s.cash` peut exister (l'employé a
  // enregistré des valeurs en brouillon) ou non (quart ouvert, rien saisi
  // encore) — les deux cas sont légitimes, jamais présentés comme une
  // anomalie.
  function renderBrouillonItem(s, i) {
    return `
      <div class="histo-item">
        <div class="histo-top">
          <div>
            <div class="histo-date">${new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR')} <span style="color:var(--text-mid); font-weight:400;">· Quart ${s.quart}</span></div>
            <div class="histo-sub">${nomEmploye(s.employee_id)} — ${s.cash ? 'caisse déjà saisie, pas encore transmise' : 'ouvert, rien transmis'}</div>
          </div>
          <div style="text-align:right;">
            <span class="statut-badge brouillon">Brouillon</span>
          </div>
        </div>
        <div class="histo-detail open" style="padding-top:0;">
          <button type="button" class="btn-modifier" data-idx-brouillon="${i}" style="margin-top:8px;">👁️ Ouvrir ce quart</button>
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // RÉAPPROVISIONNER LA CAISSE — Bureau → Caisse, "non activé". 09/08/2026,
  // précision de Frédéric : ce transfert n'est PAS une activation. Le
  // carnet reste sous contrôle, non engagé financièrement, tant que la
  // caissière ne l'a pas activé explicitement (voir "Activer un carnet"
  // côté NEXUS-FDJ-v1.html). Donc ici : aucun impact sur l'appro, aucun
  // shift_id — juste un déplacement physique Bureau → Caisse tracé dans
  // fdj_stock_movements(type_mouvement='transfert').
  //
  // UX stepper (09/08/2026, demande de Frédéric) : remplace l'ancien champ
  // numérique libre par des boutons − / + et des raccourcis +1/+2 carnets,
  // avec affichage immédiat de la valeur — vocabulaire volontairement
  // distinct de "Valeur activée" pour ne jamais confondre exposition
  // physique (carnets confiés) et engagement financier FDJ (carnets activés,
  // toujours 0 € à ce stade puisqu'un transfert n'active jamais rien).
  // ------------------------------------------------------------
  async function ouvrirReappro() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes } = await soldesActuels();
    reappro = { soldes, quantites: {} };
    vue = 'reappro';
    renderReappro();
  }

  function renderReappro() {
    document.getElementById('titre').textContent = 'Réapprovisionner la caisse';
    document.getElementById('sousTitre').textContent = 'Bureau → Caisse. Les carnets confiés restent non activés — aucun impact sur l\'appro tant qu\'ils ne sont pas activés en caisse.';
    const groupes = grouperParPalier(jeux);
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourReappro">← Retour</button>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuReappro(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnConfirmerReappro">Confirmer le réapprovisionnement</button>
      <button class="btn-ghost" id="btnAnnulerReappro">Annuler</button>
    `;
    document.getElementById('btnRetourReappro').addEventListener('click', () => { vue = 'liste'; reappro = null; renderAccueil(); });
    document.getElementById('btnAnnulerReappro').addEventListener('click', () => { vue = 'liste'; reappro = null; renderAccueil(); });
    document.querySelectorAll('[data-moins]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.moins, -1)));
    document.querySelectorAll('[data-plus]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.plus, 1)));
    document.querySelectorAll('[data-raccourci]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.raccourci, parseInt(btn.dataset.inc, 10))));
    document.getElementById('btnConfirmerReappro').addEventListener('click', enregistrerReappro);
  }

  function renderJeuReappro(jeu) {
    const solde = (reappro.soldes[jeu.id]) || { confies: 0, actives: 0, nonActives: 0 };
    const qte = reappro.quantites[jeu.id] || 0;
    const ticketsParCarnet = (jeu.tickets_par_carnet !== null && jeu.tickets_par_carnet !== undefined) ? Number(jeu.tickets_par_carnet) : null;
    const valeurParCarnet = ticketsParCarnet ? ticketsParCarnet * Number(jeu.prix) : null;
    return `
      <div class="jeu-row">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${solde.nonActives <= 0 ? 'anomalie' : 'calc'}">${solde.nonActives} non activé${Math.abs(solde.nonActives) > 1 ? 's' : ''} en caisse</div>
        </div>
        <div class="jeu-input-label" style="text-align:center;">Carnets à transférer</div>
        <div class="stepper-qte">
          <button type="button" class="btn-stepper" data-moins="${jeu.id}">−</button>
          <div class="stepper-valeur" id="qte-${jeu.id}">${qte}</div>
          <button type="button" class="btn-stepper" data-plus="${jeu.id}">+</button>
        </div>
        <div class="raccourcis-qte">
          <button type="button" class="btn-raccourci" data-raccourci="${jeu.id}" data-inc="1">+1 carnet</button>
          <button type="button" class="btn-raccourci" data-raccourci="${jeu.id}" data-inc="2">+2 carnets</button>
        </div>
        <div class="valeur-carnets" id="valeur-${jeu.id}">${renderValeurReappro(qte, ticketsParCarnet, valeurParCarnet)}</div>
      </div>
    `;
  }

  // Vocabulaire imposé par Frédéric : "Valeur des carnets confiés" (X €,
  // exposition physique) ≠ "Valeur activée" (toujours 0 € ici — un
  // transfert Bureau → Caisse n'active jamais rien, voir plus haut).
  function renderValeurReappro(qte, ticketsParCarnet, valeurParCarnet) {
    if (!qte) return `Valeur des carnets confiés : <b>0 €</b> · <span class="activee">Valeur activée : 0 €</span>`;
    const tickets = ticketsParCarnet ? qte * ticketsParCarnet : null;
    const valeur = valeurParCarnet ? qte * valeurParCarnet : null;
    return `Valeur des carnets confiés : <b>${valeur !== null ? fmtEuro(valeur) : '—'}</b>${tickets !== null ? ` (${tickets} tickets potentiels)` : ''} · <span class="activee">Valeur activée : 0 €</span>`;
  }

  function ajusterQuantiteReappro(gameId, delta) {
    const actuel = reappro.quantites[gameId] || 0;
    const nouveau = Math.max(0, actuel + delta);
    reappro.quantites[gameId] = nouveau;
    const jeu = jeux.find(j => j.id === gameId);
    const ticketsParCarnet = (jeu && jeu.tickets_par_carnet !== null && jeu.tickets_par_carnet !== undefined) ? Number(jeu.tickets_par_carnet) : null;
    const valeurParCarnet = (jeu && ticketsParCarnet) ? ticketsParCarnet * Number(jeu.prix) : null;
    const qteEl = document.getElementById(`qte-${gameId}`);

  // ------------------------------------------------------------
  // INVENTAIRE DE RÉFÉRENCE FDJ — 09/08/2026, demande de Frédéric : "Ce
  // relevé constitue le premier état physique certifié du stock de carnets
  // non activés [...] les mouvements racontent ce qui aurait dû se passer ;
  // le contrôle physique établit ce qui existe réellement." Compare, jeu
  // par jeu, le stock théorique (issu des mouvements depuis le dernier
  // point zéro) au comptage physique réel saisi ici. Valider ce contrôle
  // crée une nouvelle ligne fdj_stock_references (type='recomptage') qui
  // devient le nouveau point zéro — les mouvements antérieurs restent dans
  // l'historique mais n'influencent plus le calcul du stock physique.
  // ------------------------------------------------------------
  async function ouvrirInventaireRef() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes, reference } = await soldesActuels();
    const saisie = {};
    jeux.forEach(j => {
      const s = soldes[j.id] || { bureau: 0, confies: 0 };
      saisie[j.id] = { bureau: s.bureau, caisse: s.confies };
    });
    inventaireRef = { derniereReference: reference, soldesTheoriques: soldes, saisie };
    vue = 'inventaire-ref';
    renderInventaireRef();
  }

  function statutInventaireLigne(theoBureau, theoCaisse, reelBureau, reelCaisse) {
    const ecartBureau = Number(reelBureau) - Number(theoBureau);
    const ecartCaisse = Number(reelCaisse) - Number(theoCaisse);
    if (ecartBureau === 0 && ecartCaisse === 0) return { classe: 'green', texte: '🟢 Conforme' };
    const n = Math.abs(ecartBureau) + Math.abs(ecartCaisse);
    return { classe: 'amber', texte: `🟠 Écart de ${n} carnet${n > 1 ? 's' : ''} à expliquer` };
  }

  function renderInventaireRef() {
    document.getElementById('titre').textContent = 'Inventaire de référence FDJ';
    document.getElementById('sousTitre').textContent = 'Comptage physique réel — Bureau et Caisse non activé. Valider ce contrôle devient le nouveau point zéro du stock.';
    const ref = inventaireRef.derniereReference;
    const groupes = grouperParPalier(jeux);
    let totalTheoBureau = 0, totalTheoCaisse = 0, totalReelBureau = 0, totalReelCaisse = 0;
    jeux.forEach(j => {
      const theo = inventaireRef.soldesTheoriques[j.id] || { bureau: 0, confies: 0 };
      const s = inventaireRef.saisie[j.id];
      totalTheoBureau += Number(theo.bureau) || 0; totalTheoCaisse += Number(theo.confies) || 0;
      totalReelBureau += Number(s.bureau) || 0; totalReelCaisse += Number(s.caisse) || 0;
    });
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourInventaireRef">← Retour</button>
      ${ref ? `<div class="champ-note" style="margin-top:-4px;">Dernier point zéro : ${new Date(ref.date + 'T00:00:00').toLocaleDateString('fr-FR')} (${ref.type === 'initialisation' ? 'initialisation' : 'recomptage'}).</div>` : `<div class="champ-note" style="margin-top:-4px;">Aucun contrôle physique enregistré pour l'instant — le stock théorique part de zéro.</div>`}
      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Théorique (Bureau + Caisse)</div><div class="stat-value">${fmtNum(totalTheoBureau)} + ${fmtNum(totalTheoCaisse)} = ${fmtNum(totalTheoBureau + totalTheoCaisse)}</div></div>
        <div class="stat-row total"><div class="stat-label">Comptage réel (Bureau + Caisse)</div><div class="stat-value cyan">${fmtNum(totalReelBureau)} + ${fmtNum(totalReelCaisse)} = ${fmtNum(totalReelBureau + totalReelCaisse)}</div></div>
      </div>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuInventaireRef(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnValiderInventaireRef">Valider ce contrôle</button>
      <button class="btn-ghost" id="btnAnnulerInventaireRef">Annuler</button>
    `;
    document.getElementById('btnRetourInventaireRef').addEventListener('click', () => { vue = 'liste'; inventaireRef = null; renderAccueil(); });
    document.getElementById('btnAnnulerInventaireRef').addEventListener('click', () => { vue = 'liste'; inventaireRef = null; renderAccueil(); });
    wireInventaireRefInputs();
    document.getElementById('btnValiderInventaireRef').addEventListener('click', validerInventaireRef);
  }

  // Entrée/Retour passe au champ de stock suivant (16/08/2026, demande de
  // Frédéric : "en vue bureau, que ce soit FDJ ou contrôle FDJ, en
  // inscrivant le stock initial ou final, passer à la ligne suivante en
  // cliquant sur la touche return ou entrée"). Uniquement en vue bureau
  // (nexus-desktop.js::nexusEstVueBureau) — jamais sur mobile, où le
  // clavier numérique gère nativement son propre bouton "suivant".
  // `.jeu-input` regroupe, selon l'écran actuellement affiché (jamais deux
  // à la fois), soit les 3 champs de "Modifier ce quart FDJ" (stock_initial/
  // appro/stock_final, renderJeuRowEdition), soit les 2 champs de
  // "Inventaire de référence FDJ" (bureau/caisse) — l'ordre DOM suit
  // toujours l'ordre visuel réel, y compris en colonnes (vue bureau
  // réordonne par CSS, jamais par DOM).
  function jeuInputToucheEntree(e) {
    if (e.key !== 'Enter') return;
    if (typeof nexusEstVueBureau !== 'function' || !nexusEstVueBureau()) return;
    e.preventDefault();
    const champs = Array.from(document.querySelectorAll('.jeu-input'));
    const i = champs.indexOf(e.target);
    if (i === -1) return;
    const suivant = champs[i + 1];
    if (suivant) { suivant.focus(); if (suivant.select) suivant.select(); }
  }

  function wireInventaireRefInputs() {
    document.querySelectorAll('.champ-invref').forEach(input => {
      input.addEventListener('input', () => {
        const gameId = input.dataset.jeu, champ = input.dataset.champ;
        const val = input.value === '' ? 0 : Number(input.value);
        inventaireRef.saisie[gameId][champ] = val;
        const theo = inventaireRef.soldesTheoriques[gameId] || { bureau: 0, confies: 0 };
        const s = inventaireRef.saisie[gameId];
        const statut = statutInventaireLigne(theo.bureau, theo.confies, s.bureau, s.caisse);
        const statutEl = document.getElementById(`statut-invref-${gameId}`);
        if (statutEl) { statutEl.textContent = statut.texte; statutEl.className = `jeu-ventes ${statut.classe === 'amber' ? 'anomalie' : 'calc'}`; }
      });
      input.addEventListener('keydown', jeuInputToucheEntree);
    });
  }

    });

    vue = 'liste'; inventaireRef = null;
    renderAccueil();
  }
