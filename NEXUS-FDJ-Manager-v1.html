            <div class="histo-sub">${nomEmploye(s.employee_id)}</div>
          </div>
          <div style="text-align:right;">
            <div class="histo-ecart ${estBrouillon ? '' : classe}">${estBrouillon ? '—' : (ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—')}</div>
            <div style="margin-top:4px;"><span class="statut-badge ${estBrouillon ? 'brouillon' : (s.cash ? s.cash.statut : 'provisoire')}">${estBrouillon ? 'Brouillon' : (s.cash ? labelStatutCaisse(s.cash.statut) : 'Provisoire')}</span></div>
            ${integrite && integrite.integrite !== 'OK' ? `<div style="margin-top:4px;">${badgeIntegrite(integrite)}</div>` : ''}
          </div>
        </div>
        <div class="histo-detail" id="detail-${i}">
          ${s.cash ? `
            <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(s.cash.caisse_grattage)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse tirages</div><div class="stat-value">${fmtEuro(s.cash.caisse_tirages)}</div></div>
            <div class="stat-row"><div class="stat-label">Régularisations</div><div class="stat-value">${fmtEuro(s.cash.regularisations)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(s.cash.caisse_attendue)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse réelle</div><div class="stat-value">${fmtEuro(s.cash.caisse_reelle)}</div></div>
            ${s.cash.motif_ecart ? `<div class="stat-row"><div class="stat-label">Motif</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${s.cash.motif_ecart}</div></div>` : ''}
            ${s.cash.caisse_reelle_origine !== null && s.cash.caisse_reelle_origine !== undefined && (s.cash.caisse_reelle_origine !== s.cash.caisse_reelle || s.cash.ecart_origine !== s.cash.ecart) ? `
              <div class="stat-row" style="border-top:1px dashed var(--hairline); margin-top:4px; padding-top:8px;">
                <div class="stat-label">Constat initial (employé)</div>
                <div class="stat-value" style="font-size:11.5px; font-weight:400; color:var(--text-mid);">Caisse ${fmtEuro(s.cash.caisse_reelle_origine)} · écart ${s.cash.ecart_origine > 0 ? '+' : ''}${fmtEuro(s.cash.ecart_origine)} — régularisé depuis</div>
              </div>
            ` : ''}
          ` : '<div class="empty">Pas encore de rapprochement caisse pour ce quart.</div>'}
          <button type="button" class="btn-modifier" data-idx="${i}">✏️ Modifier ce quart</button>
          <button type="button" class="btn-modifier" data-releve-idx="${i}" style="margin-top:8px; background:rgba(79,195,217,0.1); border-color:rgba(79,195,217,0.35); color:var(--cyan);">📄 Relevé de clôture FDJ</button>
          <button type="button" class="btn-modifier" data-export-jour="${s.date}" style="margin-top:8px; background:none; border-style:dashed;">📄 Exporter la journée complète (Q1+Q2)</button>
        </div>
      </div>
    `;
  }

  // Brouillons FDJ à terminer (20/08/2026, FDJ-03) — ligne compacte,
  // volontairement plus légère que renderHistoItem (pas de dépliage détail :
  // un brouillon n'est pas encore une donnée de contrôle, juste un repère
  // "à terminer" pour le manager). `s.cash` peut exister (l'employé a
  // enregistré des valeurs en brouillon) ou non (quart ouvert, rien saisi
  // encore) — les deux cas sont légitimes, jamais présentés comme une
  // anomalie.
  function renderBrouillonItem(s, i) {
    return `
      <div class="histo-item">
        <div class="histo-top">
          <div>
            <div class="histo-date">${new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR')} <span style="color:var(--text-mid); font-weight:400;">· Quart ${s.quart}</span></div>
            <div class="histo-sub">${nomEmploye(s.employee_id)} — ${s.cash ? 'caisse déjà saisie, pas encore transmise' : 'ouvert, rien transmis'}</div>
          </div>
          <div style="text-align:right;">
            <span class="statut-badge brouillon">Brouillon</span>
          </div>
        </div>
        <div class="histo-detail open" style="padding-top:0;">
          <button type="button" class="btn-modifier" data-idx-brouillon="${i}" style="margin-top:8px;">👁️ Ouvrir ce quart</button>
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // RÉAPPROVISIONNER LA CAISSE — Bureau → Caisse, "non activé". 09/08/2026,
  // précision de Frédéric : ce transfert n'est PAS une activation. Le
  // carnet reste sous contrôle, non engagé financièrement, tant que la
  // caissière ne l'a pas activé explicitement (voir "Activer un carnet"
  // côté NEXUS-FDJ-v1.html). Donc ici : aucun impact sur l'appro, aucun
  // shift_id — juste un déplacement physique Bureau → Caisse tracé dans
  // fdj_stock_movements(type_mouvement='transfert').
  //
  // UX stepper (09/08/2026, demande de Frédéric) : remplace l'ancien champ
  // numérique libre par des boutons − / + et des raccourcis +1/+2 carnets,
  // avec affichage immédiat de la valeur — vocabulaire volontairement
  // distinct de "Valeur activée" pour ne jamais confondre exposition
  // physique (carnets confiés) et engagement financier FDJ (carnets activés,
  // toujours 0 € à ce stade puisqu'un transfert n'active jamais rien).
  // ------------------------------------------------------------
  async function ouvrirReappro() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes } = await soldesActuels();
    reappro = { soldes, quantites: {} };
    vue = 'reappro';
    renderReappro();
  }

  function renderReappro() {
    document.getElementById('titre').textContent = 'Réapprovisionner la caisse';
    document.getElementById('sousTitre').textContent = 'Bureau → Caisse. Les carnets confiés restent non activés — aucun impact sur l\'appro tant qu\'ils ne sont pas activés en caisse.';
    const groupes = grouperParPalier(jeux);
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourReappro">← Retour</button>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuReappro(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnConfirmerReappro">Confirmer le réapprovisionnement</button>
      <button class="btn-ghost" id="btnAnnulerReappro">Annuler</button>
    `;
    document.getElementById('btnRetourReappro').addEventListener('click', () => { vue = 'liste'; reappro = null; renderAccueil(); });
    document.getElementById('btnAnnulerReappro').addEventListener('click', () => { vue = 'liste'; reappro = null; renderAccueil(); });
    document.querySelectorAll('[data-moins]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.moins, -1)));
    document.querySelectorAll('[data-plus]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.plus, 1)));
    document.querySelectorAll('[data-raccourci]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.raccourci, parseInt(btn.dataset.inc, 10))));
    document.getElementById('btnConfirmerReappro').addEventListener('click', enregistrerReappro);
  }

  function renderJeuReappro(jeu) {
    const solde = (reappro.soldes[jeu.id]) || { confies: 0, actives: 0, nonActives: 0 };
    const qte = reappro.quantites[jeu.id] || 0;
    const ticketsParCarnet = (jeu.tickets_par_carnet !== null && jeu.tickets_par_carnet !== undefined) ? Number(jeu.tickets_par_carnet) : null;
    const valeurParCarnet = ticketsParCarnet ? ticketsParCarnet * Number(jeu.prix) : null;
    return `
      <div class="jeu-row">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${solde.nonActives <= 0 ? 'anomalie' : 'calc'}">${solde.nonActives} non activé${Math.abs(solde.nonActives) > 1 ? 's' : ''} en caisse</div>
        </div>
        <div class="jeu-input-label" style="text-align:center;">Carnets à transférer</div>
        <div class="stepper-qte">
          <button type="button" class="btn-stepper" data-moins="${jeu.id}">−</button>
          <div class="stepper-valeur" id="qte-${jeu.id}">${qte}</div>
          <button type="button" class="btn-stepper" data-plus="${jeu.id}">+</button>
        </div>
        <div class="raccourcis-qte">
          <button type="button" class="btn-raccourci" data-raccourci="${jeu.id}" data-inc="1">+1 carnet</button>
          <button type="button" class="btn-raccourci" data-raccourci="${jeu.id}" data-inc="2">+2 carnets</button>
        </div>
        <div class="valeur-carnets" id="valeur-${jeu.id}">${renderValeurReappro(qte, ticketsParCarnet, valeurParCarnet)}</div>
      </div>
    `;
  }

  // Vocabulaire imposé par Frédéric : "Valeur des carnets confiés" (X €,
  // exposition physique) ≠ "Valeur activée" (toujours 0 € ici — un
  // transfert Bureau → Caisse n'active jamais rien, voir plus haut).
  function renderValeurReappro(qte, ticketsParCarnet, valeurParCarnet) {
    if (!qte) return `Valeur des carnets confiés : <b>0 €</b> · <span class="activee">Valeur activée : 0 €</span>`;
    const tickets = ticketsParCarnet ? qte * ticketsParCarnet : null;
    const valeur = valeurParCarnet ? qte * valeurParCarnet : null;
    return `Valeur des carnets confiés : <b>${valeur !== null ? fmtEuro(valeur) : '—'}</b>${tickets !== null ? ` (${tickets} tickets potentiels)` : ''} · <span class="activee">Valeur activée : 0 €</span>`;
  }

  function ajusterQuantiteReappro(gameId, delta) {
    const actuel = reappro.quantites[gameId] || 0;
    const nouveau = Math.max(0, actuel + delta);
    reappro.quantites[gameId] = nouveau;
    const jeu = jeux.find(j => j.id === gameId);
    const ticketsParCarnet = (jeu && jeu.tickets_par_carnet !== null && jeu.tickets_par_carnet !== undefined) ? Number(jeu.tickets_par_carnet) : null;
    const valeurParCarnet = (jeu && ticketsParCarnet) ? ticketsParCarnet * Number(jeu.prix) : null;
    const qteEl = document.getElementById(`qte-${gameId}`);
    if (qteEl) qteEl.textContent = nouveau;
    const valeurEl = document.getElementById(`valeur-${gameId}`);
    if (valeurEl) valeurEl.innerHTML = renderValeurReappro(nouveau, ticketsParCarnet, valeurParCarnet);
  }

  async function enregistrerReappro() {
    const btn = document.getElementById('btnConfirmerReappro');
    const bureau = emplacementParType('bureau');
    const caisse = emplacementParType('caisse');
    const lignes = Object.entries(reappro.quantites)
      .filter(([, qte]) => qte > 0)
      .map(([gameId, qte]) => ({
        site: siteId, game_id: gameId, type_mouvement: 'transfert', quantite: qte,
        location_source_id: bureau ? bureau.id : null, location_destination_id: caisse ? caisse.id : null,
        methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
        justification: `Réapprovisionnement caisse — carnets non activés (manager).`,
      }));
    if (!lignes.length) { alert('Indiquez au moins un jeu avec une quantité à transférer.'); return; }
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const { error } = await nexusClient.from('fdj_stock_movements').insert(lignes);
    if (error) { console.error('Réapprovisionnement caisse FDJ:', error); btn.disabled = false; btn.textContent = 'Confirmer le réapprovisionnement'; alert("Erreur d'enregistrement. Réessayez."); return; }
    vue = 'liste'; reappro = null;
    renderAccueil();
  }

  // ------------------------------------------------------------
  // RETIRER DES JEUX DE LA CAISSE — 20/08/2026, cahier UX "Nouvelle
  // organisation Contrôle FDJ" §9-14 : Caisse → Bureau, l'exact inverse de
  // Réapprovisionner ci-dessus (même moteur, même table, sens contraire —
  // Article 11, jamais un deuxième mécanisme de transfert). "Ce n'est pas
  // une annulation de vente, ni une désactivation automatique. C'est avant
  // tout un mouvement d'emplacement."
  //
  // Limite honnête (Article 5) : le cahier distingue 4 états par carnet
  // (non activé / activé non commencé / ouvert-en cours / bloqué), mais
  // NEXUS ne suit AUCUN carnet individuellement — `fdj_booklets` existe
  // dans le schéma (booklet_id, activation_status, current_location_id)
  // mais n'est alimenté par aucun écran, ni ici ni côté employé (vérifié :
  // 0 ligne en base, aucune référence dans le code au 20/08/2026). Seuls
  // des AGRÉGATS par jeu sont connus (NexusFdjMoteur.soldesCarnetsAvecReference
  // : confiés/activés/non-activés), et "activés" est un compteur cumulatif
  // qui ne redescend jamais — impossible de savoir combien de carnets
  // activés sont encore physiquement en caisse. Plutôt que d'inventer un
  // état par carnet que NEXUS ne peut pas garantir, ce formulaire reste au
  // grain agrégat déjà fiable : le solde "non activés en caisse" (sûr, un
  // retrait dans cette limite est un simple déplacement) et un
  // avertissement + motif obligatoire dès qu'on demande plus que ce solde
  // connu (le manager peut avoir vérifié physiquement — NEXUS l'avertit
  // sans jamais bloquer, "pouvoir total" comme le reste de cet écran).
  // ------------------------------------------------------------
  const MOTIFS_RETRAIT_CAISSE = [
    { value: '', label: 'Choisir un motif…' },
    { value: 'surstock', label: 'Surstock en caisse' },
    { value: 'fin_rotation', label: 'Fin de rotation' },
    { value: 'retrait_temporaire', label: 'Retrait temporaire' },
    { value: 'organisation_stock', label: 'Organisation du stock' },
    { value: 'changement_caisse', label: 'Changement de caisse' },
    { value: 'rappel_fdj', label: 'Jeu à retourner / rappel FDJ' },
    { value: 'autre', label: 'Autre' },
  ];
  function labelMotifRetraitCaisse(v) { const m = MOTIFS_RETRAIT_CAISSE.find(x => x.value === v); return m ? m.label : (v || '—'); }

  async function ouvrirRetraitCaisse() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes } = await soldesActuels();
    retraitCaisse = { soldes, quantites: {}, motif: '' };
    vue = 'retrait-caisse';
    renderRetraitCaisse();
  }

  function depasseStockConnuRetrait() {
    return Object.entries(retraitCaisse.quantites).some(([gameId, qte]) => {
      const solde = retraitCaisse.soldes[gameId] || { nonActives: 0 };
      return qte > Math.max(0, solde.nonActives);
    });
  }

  function renderRetraitCaisse() {
    document.getElementById('titre').textContent = 'Retirer des jeux de la caisse';
    document.getElementById('sousTitre').textContent = "Caisse → Bureau. Reprendre physiquement des carnets confiés à la caisse — un déplacement d'emplacement, jamais une annulation de vente ni une désactivation.";
    const groupes = grouperParPalier(jeux);
    const motifRequis = depasseStockConnuRetrait();
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourRetraitCaisse">← Retour</button>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuRetraitCaisse(j)).join('')}</div>
        </div>
      `).join('')}
      ${motifRequis ? `
        <label class="champ-label">Motif du retrait <span style="color:var(--red);">*</span> — au moins un jeu dépasse le stock non activé connu</label>
      ` : `<label class="champ-label">Motif du retrait (optionnel pour de simples carnets non activés)</label>`}
      <select class="champ-select" id="champMotifRetraitCaisse" style="margin-bottom:16px;">
        ${MOTIFS_RETRAIT_CAISSE.map(m => `<option value="${m.value}" ${m.value === retraitCaisse.motif ? 'selected' : ''}>${m.label}</option>`).join('')}
      </select>
      <button class="btn-primary" id="btnVerifierRetraitCaisse">Vérifier le retrait</button>
      <button class="btn-ghost" id="btnAnnulerRetraitCaisse">Annuler</button>
    `;
    document.getElementById('btnRetourRetraitCaisse').addEventListener('click', () => { vue = 'liste'; retraitCaisse = null; renderAccueil(); });
    document.getElementById('btnAnnulerRetraitCaisse').addEventListener('click', () => { vue = 'liste'; retraitCaisse = null; renderAccueil(); });
    document.querySelectorAll('[data-moins-retrait]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteRetraitCaisse(btn.dataset.moinsRetrait, -1)));
    document.querySelectorAll('[data-plus-retrait]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteRetraitCaisse(btn.dataset.plusRetrait, 1)));
    document.querySelectorAll('[data-raccourci-retrait]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteRetraitCaisse(btn.dataset.raccourciRetrait, parseInt(btn.dataset.inc, 10))));
    document.getElementById('champMotifRetraitCaisse').addEventListener('change', e => { retraitCaisse.motif = e.target.value; });
    document.getElementById('btnVerifierRetraitCaisse').addEventListener('click', () => {
      const total = Object.values(retraitCaisse.quantites).reduce((s, q) => s + q, 0);
      if (!total) { alert('Indiquez au moins un jeu avec une quantité à retirer.'); return; }
      if (depasseStockConnuRetrait() && !retraitCaisse.motif) { alert('Un motif est obligatoire : au moins un jeu dépasse le stock non activé connu en caisse.'); return; }
      vue = 'retrait-caisse-confirmation';
      renderRetraitCaisseConfirmation();
    });
  }

  function renderJeuRetraitCaisse(jeu) {
    const solde = (retraitCaisse.soldes[jeu.id]) || { confies: 0, actives: 0, nonActives: 0 };
    const qte = retraitCaisse.quantites[jeu.id] || 0;
    const nonActivesConnus = Math.max(0, solde.nonActives);
    const depasse = qte > nonActivesConnus;
    return `
      <div class="jeu-row">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${solde.nonActives <= 0 ? 'anomalie' : 'calc'}">${nonActivesConnus} non activé${Math.abs(nonActivesConnus) > 1 ? 's' : ''} en caisse</div>
        </div>
        <div class="jeu-input-label" style="text-align:center;">Carnets à retirer</div>
        <div class="stepper-qte">
          <button type="button" class="btn-stepper" data-moins-retrait="${jeu.id}">−</button>
          <div class="stepper-valeur" id="qte-retrait-${jeu.id}">${qte}</div>
          <button type="button" class="btn-stepper" data-plus-retrait="${jeu.id}">+</button>
        </div>
        <div class="raccourcis-qte">
          <button type="button" class="btn-raccourci" data-raccourci-retrait="${jeu.id}" data-inc="1">+1 carnet</button>
          <button type="button" class="btn-raccourci" data-raccourci-retrait="${jeu.id}" data-inc="2">+2 carnets</button>
        </div>
        <div id="alerte-retrait-${jeu.id}">${depasse ? `<div class="champ-note" style="color:var(--amber); margin-top:6px;">⚠️ Ce carnet est peut-être déjà activé — NEXUS ne suit pas l'état individuel des carnets au-delà du stock non activé connu. Vérifiez physiquement.</div>` : ''}</div>
      </div>
    `;
  }

  function ajusterQuantiteRetraitCaisse(gameId, delta) {
    const actuel = retraitCaisse.quantites[gameId] || 0;
    const nouveau = Math.max(0, actuel + delta);
    retraitCaisse.quantites[gameId] = nouveau;
    // Re-rendu complet (plutôt qu'un patch DOM ciblé comme ajusterQuantiteReappro) :
    // ce formulaire doit aussi mettre à jour le libellé/obligation du motif
    // global dès qu'un jeu franchit son seuil connu, pas seulement l'alerte
    // locale du jeu modifié.
    renderRetraitCaisse();
  }

  function renderRetraitCaisseConfirmation() {
    document.getElementById('titre').textContent = 'Confirmer le retrait';
    document.getElementById('sousTitre').textContent = 'Caisse → Bureau. Aucun impact sur les ventes.';
    const lignes = Object.entries(retraitCaisse.quantites).filter(([, q]) => q > 0);
    const total = lignes.reduce((s, [, q]) => s + q, 0);
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourRetraitConfirmation">← Retour</button>
      <div class="card" style="margin-bottom:16px;">
        <div class="stat-row total"><div class="stat-label">Retrait vers le bureau</div><div class="stat-value">${total} carnet${total > 1 ? 's' : ''}</div></div>
        ${lignes.map(([gameId, q]) => {
          const jeu = jeux.find(j => j.id === gameId);
          return `<div class="stat-row"><div class="stat-label">${jeu ? jeu.nom : gameId}</div><div class="stat-value">×${q}</div></div>`;
        }).join('')}
        ${retraitCaisse.motif ? `<div class="stat-row"><div class="stat-label">Motif</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${labelMotifRetraitCaisse(retraitCaisse.motif)}</div></div>` : ''}
        <div class="section-note" style="margin-top:8px;">Le stock caisse baisse de ${total}, le stock bureau augmente de ${total}. Le stock total station ne change pas.</div>
      </div>
      <button class="btn-primary" id="btnConfirmerRetraitCaisse">Confirmer le retrait</button>
      <button class="btn-ghost" id="btnAnnulerRetraitConfirmation">Annuler</button>
    `;
    document.getElementById('btnRetourRetraitConfirmation').addEventListener('click', () => { vue = 'retrait-caisse'; renderRetraitCaisse(); });
    document.getElementById('btnAnnulerRetraitConfirmation').addEventListener('click', () => { vue = 'liste'; retraitCaisse = null; renderAccueil(); });
    document.getElementById('btnConfirmerRetraitCaisse').addEventListener('click', enregistrerRetraitCaisse);
  }

  async function enregistrerRetraitCaisse() {
    const btn = document.getElementById('btnConfirmerRetraitCaisse');
    const bureau = emplacementParType('bureau');
    const caisse = emplacementParType('caisse');
    const justification = `Retrait caisse → bureau (manager)${retraitCaisse.motif ? ` — ${labelMotifRetraitCaisse(retraitCaisse.motif)}` : ''}.`;
    const lignes = Object.entries(retraitCaisse.quantites)
      .filter(([, qte]) => qte > 0)
      .map(([gameId, qte]) => ({
        site: siteId, game_id: gameId, type_mouvement: 'retour', quantite: qte,
        location_source_id: caisse ? caisse.id : null, location_destination_id: bureau ? bureau.id : null,
        methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
        justification,
      }));
    if (!lignes.length) { alert('Indiquez au moins un jeu avec une quantité à retirer.'); return; }
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const { error } = await nexusClient.from('fdj_stock_movements').insert(lignes);
    if (error) { console.error('Retrait caisse FDJ:', error); btn.disabled = false; btn.textContent = 'Confirmer le retrait'; alert("Erreur d'enregistrement. Réessayez."); return; }
    vue = 'liste'; retraitCaisse = null;
    renderAccueil();
  }

  // ------------------------------------------------------------
  // INVENTAIRE DE RÉFÉRENCE FDJ — 09/08/2026, demande de Frédéric : "Ce
  // relevé constitue le premier état physique certifié du stock de carnets
  // non activés [...] les mouvements racontent ce qui aurait dû se passer ;
  // le contrôle physique établit ce qui existe réellement." Compare, jeu
  // par jeu, le stock théorique (issu des mouvements depuis le dernier
  // point zéro) au comptage physique réel saisi ici. Valider ce contrôle
  // crée une nouvelle ligne fdj_stock_references (type='recomptage') qui
  // devient le nouveau point zéro — les mouvements antérieurs restent dans
  // l'historique mais n'influencent plus le calcul du stock physique.
  // ------------------------------------------------------------
  async function ouvrirInventaireRef() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes, reference } = await soldesActuels();
    const saisie = {};
    jeux.forEach(j => {
      const s = soldes[j.id] || { bureau: 0, confies: 0 };
      saisie[j.id] = { bureau: s.bureau, caisse: s.confies };
    });
    inventaireRef = { derniereReference: reference, soldesTheoriques: soldes, saisie, motif: '' };
    vue = 'inventaire-ref';
    renderInventaireRef();
  }

  function statutInventaireLigne(theoBureau, theoCaisse, reelBureau, reelCaisse) {
    const ecartBureau = Number(reelBureau) - Number(theoBureau);
    const ecartCaisse = Number(reelCaisse) - Number(theoCaisse);
    if (ecartBureau === 0 && ecartCaisse === 0) return { classe: 'green', texte: '🟢 Conforme' };
    const n = Math.abs(ecartBureau) + Math.abs(ecartCaisse);
    return { classe: 'amber', texte: `🟠 Écart de ${n} carnet${n > 1 ? 's' : ''} à expliquer` };
  }

  function renderInventaireRef() {
    document.getElementById('titre').textContent = 'Inventaire de référence FDJ';
    document.getElementById('sousTitre').textContent = 'Comptage physique réel — réserve bureau et carnets non activés en caisse. Valider ce contrôle devient le nouveau point zéro du stock.';
    const ref = inventaireRef.derniereReference;
    const groupes = grouperParPalier(jeux);
    let totalTheoBureau = 0, totalTheoCaisse = 0, totalReelBureau = 0, totalReelCaisse = 0;
    jeux.forEach(j => {
      const theo = inventaireRef.soldesTheoriques[j.id] || { bureau: 0, confies: 0 };
      const s = inventaireRef.saisie[j.id];
      totalTheoBureau += Number(theo.bureau) || 0; totalTheoCaisse += Number(theo.confies) || 0;
      totalReelBureau += Number(s.bureau) || 0; totalReelCaisse += Number(s.caisse) || 0;
    });
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourInventaireRef">← Retour</button>
      ${ref ? `<div class="champ-note" style="margin-top:-4px;">Dernier point zéro : ${new Date(ref.date + 'T00:00:00').toLocaleDateString('fr-FR')} (${ref.type === 'initialisation' ? 'initialisation' : ref.type === 'reconciliation' ? 'réconciliation — écart constaté' : 'recomptage'}).</div>` : `<div class="champ-note" style="margin-top:-4px;">Aucun contrôle physique enregistré pour l'instant — le stock théorique part de zéro.</div>`}
      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Théorique (Bureau + Caisse)</div><div class="stat-value">${fmtNum(totalTheoBureau)} + ${fmtNum(totalTheoCaisse)} = ${fmtNum(totalTheoBureau + totalTheoCaisse)}</div></div>
        <div class="stat-row total"><div class="stat-label">Comptage réel (Bureau + Caisse)</div><div class="stat-value cyan">${fmtNum(totalReelBureau)} + ${fmtNum(totalReelCaisse)} = ${fmtNum(totalReelBureau + totalReelCaisse)}</div></div>
      </div>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuInventaireRef(j)).join('')}</div>
        </div>
      `).join('')}
      <label class="champ-label">Motif du contrôle — obligatoire si un écart est détecté ci-dessus (optionnel si le comptage confirme exactement le théorique)</label>
      <textarea class="champ-input" id="champMotifInventaireRef" rows="2" placeholder="Ex. Carnet retrouvé mal rangé, erreur de comptage précédente, vol suspecté à signaler…" style="margin-bottom:16px;">${inventaireRef.motif || ''}</textarea>
      <button class="btn-primary" id="btnValiderInventaireRef">Valider ce contrôle</button>
      <button class="btn-ghost" id="btnAnnulerInventaireRef">Annuler</button>
    `;
    document.getElementById('btnRetourInventaireRef').addEventListener('click', () => { vue = 'liste'; inventaireRef = null; renderAccueil(); });
    document.getElementById('btnAnnulerInventaireRef').addEventListener('click', () => { vue = 'liste'; inventaireRef = null; renderAccueil(); });
    wireInventaireRefInputs();
    document.getElementById('champMotifInventaireRef').addEventListener('input', e => { inventaireRef.motif = e.target.value; });
    document.getElementById('btnValiderInventaireRef').addEventListener('click', validerInventaireRef);
  }

  function renderJeuInventaireRef(jeu) {
    const theo = inventaireRef.soldesTheoriques[jeu.id] || { bureau: 0, confies: 0 };
    const s = inventaireRef.saisie[jeu.id];
    const statut = statutInventaireLigne(theo.bureau, theo.confies, s.bureau, s.caisse);
    return `
      <div class="jeu-row" data-jeu-invref="${jeu.id}">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${statut.classe === 'amber' ? 'anomalie' : 'calc'}" id="statut-invref-${jeu.id}">${statut.texte}</div>
        </div>
        <div class="jeu-inputs">
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Théo. Bureau</div>
            <div class="champ-readonly" style="text-align:center; padding:8px 4px; font-size:13px;">${fmtNum(theo.bureau)}</div>
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Réel Bureau</div>
            <input type="number" inputmode="numeric" min="0" step="1" class="jeu-input champ-invref" data-jeu="${jeu.id}" data-champ="bureau" value="${s.bureau ?? 0}">
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Théo. Caisse</div>
            <div class="champ-readonly" style="text-align:center; padding:8px 4px; font-size:13px;">${fmtNum(theo.confies)}</div>
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Réel Caisse</div>
            <input type="number" inputmode="numeric" min="0" step="1" class="jeu-input champ-invref" data-jeu="${jeu.id}" data-champ="caisse" value="${s.caisse ?? 0}">
          </div>
        </div>
      </div>
    `;
  }

  // Entrée/Retour passe au champ de stock suivant (16/08/2026, demande de
  // Frédéric : "en vue bureau, que ce soit FDJ ou contrôle FDJ, en
  // inscrivant le stock initial ou final, passer à la ligne suivante en
  // cliquant sur la touche return ou entrée"). Uniquement en vue bureau
  // (nexus-desktop.js::nexusEstVueBureau) — jamais sur mobile, où le
  // clavier numérique gère nativement son propre bouton "suivant".
  // `.jeu-input` regroupe, selon l'écran actuellement affiché (jamais deux
  // à la fois), soit les 3 champs de "Modifier ce quart FDJ" (stock_initial/
  // appro/stock_final, renderJeuRowEdition), soit les 2 champs de
  // "Inventaire de référence FDJ" (bureau/caisse) — l'ordre DOM suit
  // toujours l'ordre visuel réel, y compris en colonnes (vue bureau
  // réordonne par CSS, jamais par DOM).
  function jeuInputToucheEntree(e) {
    if (e.key !== 'Enter') return;
    if (typeof nexusEstVueBureau !== 'function' || !nexusEstVueBureau()) return;
    e.preventDefault();
    const champs = Array.from(document.querySelectorAll('.jeu-input'));
    const i = champs.indexOf(e.target);
    if (i === -1) return;
    const suivant = champs[i + 1];
    if (suivant) { suivant.focus(); if (suivant.select) suivant.select(); }
  }

  function wireInventaireRefInputs() {
    document.querySelectorAll('.champ-invref').forEach(input => {
      input.addEventListener('input', () => {
        const gameId = input.dataset.jeu, champ = input.dataset.champ;
        const val = input.value === '' ? 0 : Number(input.value);
        inventaireRef.saisie[gameId][champ] = val;
        const theo = inventaireRef.soldesTheoriques[gameId] || { bureau: 0, confies: 0 };
        const s = inventaireRef.saisie[gameId];
        const statut = statutInventaireLigne(theo.bureau, theo.confies, s.bureau, s.caisse);
        const statutEl = document.getElementById(`statut-invref-${gameId}`);
        if (statutEl) { statutEl.textContent = statut.texte; statutEl.className = `jeu-ventes ${statut.classe === 'amber' ? 'anomalie' : 'calc'}`; }
      });
      input.addEventListener('keydown', jeuInputToucheEntree);
    });
  }

  // Réconciliation physique (24/08/2026, v2.233, demande de Frédéric —
  // "chaîne de traçabilité complète des mouvements et une fonction de
  // réconciliation physique") : cette fonction EST déjà la réconciliation
  // demandée (existait depuis le 09/08/2026 sous le nom "Inventaire de
  // référence") — elle enregistre avant (stock_theorique_*_avant)/après
  // (bureau_reel/caisse_reel), écarts (calculés, jamais saisis), auteur
  // (controle_par) et date, et ne touche JAMAIS fdj_stock_movements
  // (aucun mouvement rétroactif inventé pour expliquer un écart). Ce qui
  // manquait et qui est ajouté ici : `motif` (obligatoire dès qu'un écart
  // réel est détecté — jamais un écart qui disparaît silencieusement dans
  // la nouvelle référence sans explication), `reference_precedente_id`
  // (pointeur explicite, jamais déduit du tri par date), et un `type`
  // qui distingue vraiment une réconciliation avec écart ('reconciliation')
  // d'un recomptage de routine qui confirme le théorique ('recomptage')
  // ou de la toute première référence jamais posée sur ce site
  // ('initialisation') — les trois valeurs existaient déjà en base
  // (colonne `type`), mais le code n'écrivait jusqu'ici que 'recomptage'
  // dans tous les cas.
  async function validerInventaireRef() {
    const lignesBrutes = jeux.map(j => {
      const theo = inventaireRef.soldesTheoriques[j.id] || { bureau: 0, confies: 0 };
      const s = inventaireRef.saisie[j.id];
      return {
        site: siteId, game_id: j.id,
        bureau_reel: s.bureau || 0, caisse_reel: s.caisse || 0,
        stock_theorique_bureau_avant: theo.bureau, stock_theorique_caisse_avant: theo.confies,
      };
    });
    const { aUnEcart } = NexusFdjMoteur.ecartsReferenceLignes(lignesBrutes);
    const motif = (inventaireRef.motif || '').trim();
    if (aUnEcart && !motif) { alert('Un motif est obligatoire : au moins un jeu présente un écart entre le théorique et le comptage réel.'); return; }

    const btn = document.getElementById('btnValiderInventaireRef');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    const referencePrecedenteId = inventaireRef.derniereReference ? inventaireRef.derniereReference.id : null;
    const type = !referencePrecedenteId ? 'initialisation' : (aUnEcart ? 'reconciliation' : 'recomptage');

    const { data: ref, error: eRef } = await nexusClient.from('fdj_stock_references').insert({
      site: siteId, date: dateISO(), controle_par: managerCourant.id, type, statut: 'valide',
      motif: motif || null, reference_precedente_id: referencePrecedenteId,
    }).select().single();
    if (eRef) { console.error('Création inventaire de référence FDJ:', eRef); btn.disabled = false; btn.textContent = 'Valider ce contrôle'; alert("Erreur d'enregistrement. Réessayez."); return; }

    const lignes = lignesBrutes.map(l => ({ ...l, reference_id: ref.id }));
    const { error: eLignes } = await nexusClient.from('fdj_stock_reference_lignes').insert(lignes);
    if (eLignes) { console.error('Enregistrement lignes inventaire de référence FDJ:', eLignes); btn.disabled = false; btn.textContent = 'Valider ce contrôle'; alert("Erreur d'enregistrement des lignes. Réessayez."); return; }

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: null, entite_type: 'fdj_stock_reference', entite_id: ref.id,
      action: 'inventaire_reference_valide', acteur_id: managerCourant.id,
      nouvelle_valeur: { date: ref.date, type, motif: motif || null, reference_precedente_id: referencePrecedenteId, lignes: lignes.map(l => ({ game_id: l.game_id, bureau_reel: l.bureau_reel, caisse_reel: l.caisse_reel, ecart_bureau: l.bureau_reel - (l.stock_theorique_bureau_avant || 0), ecart_caisse: l.caisse_reel - (l.stock_theorique_caisse_avant || 0) })) },
    });

    vue = 'liste'; inventaireRef = null;
    renderAccueil();
  }

  // ------------------------------------------------------------
  // RÉCEPTIONNER UNE LIVRAISON FDJ — 09/08/2026, audit "Moteur de
  // clairvoyance manager" (§3, §43) : nouvel événement distinct du
  // réapprovisionnement caisse et de l'activation. Transporteur → Bureau,
  // toujours non activé, aucun impact sur l'appro tickets — seule
  // l'activation en caisse déclenche ça (voir NEXUS-FDJ-v1.html).
  // ------------------------------------------------------------
  async function ouvrirReception() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes } = await soldesActuels();
    reception = { soldes, quantites: {}, source: '' };
    vue = 'reception';
    renderReception();
  }

  function renderReception() {
    document.getElementById('titre').textContent = 'Réceptionner une livraison FDJ';
    document.getElementById('sousTitre').textContent = 'Transporteur → Bureau. Toujours non activé, aucun impact sur l\'appro tickets.';
    const groupes = grouperParPalier(jeux);
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourReception">← Retour</button>
      <label class="champ-label">Provenance (transporteur, n° de bon de livraison…) — optionnel</label>
      <input type="text" class="champ-input" id="champSourceReception" value="${reception.source}" placeholder="Ex. Transporteur X, BL n°12345" style="margin-bottom:16px;">
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuReception(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnConfirmerReception">Confirmer la réception</button>
      <button class="btn-ghost" id="btnAnnulerReception">Annuler</button>
    `;
    document.getElementById('btnRetourReception').addEventListener('click', () => { vue = 'liste'; reception = null; renderAccueil(); });
    document.getElementById('btnAnnulerReception').addEventListener('click', () => { vue = 'liste'; reception = null; renderAccueil(); });
    document.getElementById('champSourceReception').addEventListener('input', e => { reception.source = e.target.value; });
    document.querySelectorAll('[data-moins-r]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReception(btn.dataset.moinsR, -1)));
    document.querySelectorAll('[data-plus-r]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReception(btn.dataset.plusR, 1)));
    document.querySelectorAll('[data-raccourci-r]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReception(btn.dataset.raccourciR, parseInt(btn.dataset.inc, 10))));
    document.getElementById('btnConfirmerReception').addEventListener('click', enregistrerReception);
  }

  function renderJeuReception(jeu) {
    const theo = (reception.soldes[jeu.id] || {}).bureau || 0;
    const qte = reception.quantites[jeu.id] || 0;
    return `
      <div class="jeu-row">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes">${fmtNum(theo)} au bureau actuellement</div>
        </div>
        <div class="jeu-input-label" style="text-align:center;">Carnets reçus</div>
        <div class="stepper-qte">
          <button type="button" class="btn-stepper" data-moins-r="${jeu.id}">−</button>
          <div class="stepper-valeur" id="qte-r-${jeu.id}">${qte}</div>
          <button type="button" class="btn-stepper" data-plus-r="${jeu.id}">+</button>
        </div>
        <div class="raccourcis-qte">
          <button type="button" class="btn-raccourci" data-raccourci-r="${jeu.id}" data-inc="1">+1 carnet</button>
          <button type="button" class="btn-raccourci" data-raccourci-r="${jeu.id}" data-inc="5">+5 carnets</button>
        </div>
      </div>
    `;
  }

  function ajusterQuantiteReception(gameId, delta) {
    const nouveau = Math.max(0, (reception.quantites[gameId] || 0) + delta);
    reception.quantites[gameId] = nouveau;
    const el = document.getElementById(`qte-r-${gameId}`);
    if (el) el.textContent = nouveau;
  }

  async function enregistrerReception() {
    const btn = document.getElementById('btnConfirmerReception');
    const bureau = emplacementParType('bureau');
    const lignes = Object.entries(reception.quantites)
      .filter(([, qte]) => qte > 0)
      .map(([gameId, qte]) => ({
        site: siteId, game_id: gameId, type_mouvement: 'reception', quantite: qte,
        location_source_id: null, location_destination_id: bureau ? bureau.id : null,
        methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
        source: reception.source || null,
        justification: `Réception FDJ (manager)${reception.source ? ` — ${reception.source}` : ''}.`,
      }));
    if (!lignes.length) { alert('Indiquez au moins un jeu avec une quantité reçue.'); return; }
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const { error } = await nexusClient.from('fdj_stock_movements').insert(lignes);
    if (error) { console.error('Réception FDJ:', error); btn.disabled = false; btn.textContent = 'Confirmer la réception'; alert("Erreur d'enregistrement. Réessayez."); return; }
    vue = 'liste'; reception = null;
    renderAccueil();
  }

  // ------------------------------------------------------------
  // ÉTAT DU STOCK FDJ — 09/08/2026, audit "Moteur de clairvoyance manager"
  // (§44) : Bureau / Caisse non activé / Activés (depuis le point zéro) /
  // dernière réception / état, jeu par jeu. Les chiffres viennent
  // exclusivement des mouvements et du dernier contrôle physique — jamais
  // codés en dur. Inclut les retraits/blocages en cours (§18, gestion par
  // exception : rien à afficher tant qu'il n'y en a pas).
  // ------------------------------------------------------------
  async function ouvrirStockEtat() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const [{ soldes, reference, mouvements }, shiftCountsStock] = await Promise.all([soldesActuels(), chargerShiftCountsStock()]);
    const referenceCreeLe = reference ? reference.creeLe : null;
    // 13/08/2026 (v2, refonte) : détail par quart (pas seulement le total)
    // pour afficher "quart(s) concerné(s)" au clic — même fonction moteur
    // que le total (Article 11), juste consommée à un niveau plus fin.
    // 14/08/2026 : referenceCreeLe transmis pour exclure du rapprochement
    // tout ce qui est antérieur au dernier point zéro certifié — déjà
    // absorbé dans le stock physique recertifié, ne doit plus polluer la
    // vue opérationnelle (demande de Frédéric, capture d'écran commentée).
    const lignesNonTracees = NexusFdjMoteur.lignesApproNonTracees(shiftCountsStock, mouvements, referenceCreeLe);
    const idsShifts = [...new Set(lignesNonTracees.map(l => l.shift_id))];
    const shiftsMap = await chargerShiftsParIds(idsShifts);
    const quartsConcernesParJeu = {};
    lignesNonTracees.forEach(l => {
      const s = shiftsMap[l.shift_id];
      if (!quartsConcernesParJeu[l.game_id]) quartsConcernesParJeu[l.game_id] = [];
      quartsConcernesParJeu[l.game_id].push({ date: s ? s.date : null, quart: s ? s.quart : null });
    });
    Object.values(quartsConcernesParJeu).forEach(liste => liste.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.quart || '').localeCompare(b.quart || '')));

    // Rotation/autonomie/tickets restants — 14/08/2026 (refonte lecture
    // managériale) : calculés une fois ici par jeu, réutilisés à la fois
    // pour la classification (etatLigneStockV2) et pour le détail dépliable
    // (renderJeuStockEtat), jamais recalculés à deux endroits (Article 11).
    const maintenant = new Date();
    const rotationParJeu = {}, ticketsRestantsParJeu = {}, autonomieParJeu = {};
    jeux.forEach(j => {
      const rotation = NexusFdjMoteur.rotationCarnetsJeu(mouvements, j.id, maintenant, undefined, referenceCreeLe);
      const ticketsRestants = NexusFdjMoteur.ticketsRestantsCarnetEnCours(shiftCountsStock, j.id, j.tickets_par_carnet);
      rotationParJeu[j.id] = rotation;
      ticketsRestantsParJeu[j.id] = ticketsRestants;
      autonomieParJeu[j.id] = NexusFdjMoteur.calculerAutonomieJeu({
        solde: soldes[j.id], ticketsRestants, ticketsParCarnet: j.tickets_par_carnet, rotationCarnetsJour: rotation,
      });
    });

    stockEtat = {
      soldes, reference, dernieresReceptions: derniereReceptionParJeu(mouvements),
      approNonTrace: NexusFdjMoteur.approNonTraceParJeu(shiftCountsStock, mouvements, referenceCreeLe),
      quartsConcernesParJeu, rotationParJeu, ticketsRestantsParJeu, autonomieParJeu,
    };
    // Filtre par défaut : priorité au plus urgent — "à réapprovisionner"
    // s'il y en a, sinon "à rapprocher" s'il y en a (demande de Frédéric —
    // "par défaut, côté manager, je mettrais même 'à rapprocher'", conservé
    // pour l'axe traçabilité, mais désormais après le vrai risque de
    // rupture), sinon "tous" (rien à prioriser).
    const etatsInitiaux = {};
    jeux.forEach(j => {
      etatsInitiaux[j.id] = NexusFdjMoteur.etatLigneStockV2(stockEtat.soldes[j.id], stockEtat.approNonTrace[j.id] || 0, j.tickets_par_carnet, ticketsRestantsParJeu[j.id], autonomieParJeu[j.id]);
    });
    const compteReappro = jeux.filter(j => etatsInitiaux[j.id].statut === 'reapprovisionner').length;
    const compteRapprocher = jeux.filter(j => etatsInitiaux[j.id].statut === 'rapprocher').length;
    stockEtatFiltre = compteReappro > 0 ? 'reapprovisionner' : (compteRapprocher > 0 ? 'rapprocher' : 'tous');
    vue = 'stock-etat';
    renderStockEtat();
  }

  // Classification de ligne — voir NexusFdjMoteur.etatLigneStockV2 pour le
  // détail des règles (14/08/2026, refonte lecture managériale : sépare
  // 'reapprovisionner'/'vigilance'/'ok' — l'axe STOCK — de 'rapprocher' —
  // l'axe TRAÇABILITÉ, un rapprochement en attente prime toujours car les
  // chiffres de stock ne sont alors pas fiables). Wrapper local minimal :
  // lit rotationParJeu/ticketsRestantsParJeu/autonomieParJeu déjà calculés
  // dans ouvrirStockEtat, jamais recalculés ici.
  function etatLigneStock(gameId, solde, approNonTrace, ticketsParCarnet) {
    return NexusFdjMoteur.etatLigneStockV2(solde, approNonTrace, ticketsParCarnet, stockEtat.ticketsRestantsParJeu[gameId], stockEtat.autonomieParJeu[gameId]);
  }

  const FDJ_STOCK_FILTRES = [
    { cle: 'tous', label: 'Tous' },
    { cle: 'reapprovisionner', label: '🔴 À réapprovisionner' },
    { cle: 'vigilance', label: '🟠 Vigilance' },
    { cle: 'rapprocher', label: '⚠️ À rapprocher' },
    { cle: 'ok', label: '🟢 OK' },
  ];

  function renderStockEtat() {
    document.getElementById('titre').textContent = 'État du stock FDJ';
    document.getElementById('sousTitre').textContent = 'Visualisez où se trouvent vos carnets FDJ et leur état.';
    const ref = stockEtat.reference;
    const bloques = jeux.map(j => ({ jeu: j, solde: stockEtat.soldes[j.id] || {} })).filter(x => (x.solde.bloques || 0) > 0);

    const etats = {};
    jeux.forEach(j => {
      etats[j.id] = etatLigneStock(j.id, stockEtat.soldes[j.id] || { bureau: 0, confies: 0, actives: 0, bloques: 0, nonActives: 0 }, stockEtat.approNonTrace[j.id] || 0, j.tickets_par_carnet);
    });
    const compte = { tous: jeux.length, reapprovisionner: 0, vigilance: 0, rapprocher: 0, ok: 0 };
    jeux.forEach(j => { compte[etats[j.id].statut]++; });

    // Synthèse globale (14/08/2026, refonte lecture managériale) —
    // "🎟️ État FDJ caisse" : totaux + recommandation d'action dérivée de
    // faits déjà connus (jamais une supposition), voir
    // NexusFdjMoteur.syntheseGlobaleFdjStock.
    const synthese = NexusFdjMoteur.syntheseGlobaleFdjStock(jeux, etats, stockEtat.soldes);

    const jeuxFiltres = jeux.filter(j => stockEtatFiltre === 'tous' || etats[j.id].statut === stockEtatFiltre);
    const groupes = grouperParPalier(jeuxFiltres);

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourStockEtat">← Retour</button>
      <div class="resume-card fdj-stock-synthese">
        <div class="titre-synthese">🎟️ État FDJ caisse</div>
        <div class="ligne-synthese">${synthese.compte.tous} jeu${synthese.compte.tous > 1 ? 'x' : ''} suivi${synthese.compte.tous > 1 ? 's' : ''} · ${fmtNum(synthese.carnetsDisponiblesCaisse)} carnet${synthese.carnetsDisponiblesCaisse > 1 ? 's' : ''} disponible${synthese.carnetsDisponiblesCaisse > 1 ? 's' : ''} en caisse</div>
        <div class="ligne-synthese">🟢 ${synthese.compte.ok} couvert${synthese.compte.ok > 1 ? 's' : ''} · 🟠 ${synthese.compte.vigilance} à surveiller · 🔴 ${synthese.compte.reapprovisionner} à réapprovisionner${synthese.compte.rapprocher ? ` · ⚠️ ${synthese.compte.rapprocher} à rapprocher` : ''}</div>
        <div class="ligne-synthese">${ref ? `Dernier point zéro : ${new Date(ref.date + 'T00:00:00').toLocaleDateString('fr-FR')}.` : 'Aucun contrôle physique enregistré — stock théorique depuis zéro, à fiabiliser via "Contrôle physique du stock".'}</div>
        ${synthese.recommandation ? `<div class="recommandation">NEXUS recommande : ${synthese.recommandation}</div>` : ''}
      </div>
      <div class="fdj-stock-filtres">
        ${FDJ_STOCK_FILTRES.map(f => `<button type="button" class="fdj-stock-filtre${stockEtatFiltre === f.cle ? ' active' : ''}" data-filtre="${f.cle}">${f.label} <span class="compte">${compte[f.cle]}</span></button>`).join('')}
      </div>
      <button class="btn-nouveau" id="btnOuvrirBlocage">🚫 Signaler un retrait / blocage</button>
      ${bloques.length ? `
        <div class="section-titre">Retraits / blocages en cours (${bloques.length})</div>
        <div class="card" style="margin-bottom:16px;">
          ${bloques.map(({ jeu, solde }) => `
            <div class="jeu-row" data-jeu-bloque="${jeu.id}">
              <div class="jeu-nom-ligne">
                <div class="jeu-nom">${jeu.nom}</div>
                <div class="jeu-ventes anomalie">${solde.bloques} bloqué${solde.bloques > 1 ? 's' : ''}</div>
              </div>
              <button type="button" class="btn-modifier" data-retourner="${jeu.id}" style="margin-top:6px; width:100%;">↩️ Retourner au bureau</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="section-titre">Par jeu</div>
      ${groupes.length ? groupes.map(g => {
        const items = g.items.map(j => ({ jeu: j, etat: etats[j.id] }));
        return `
        <div class="palier-block">
          <div class="fdj-stock-palier-head${stockEtatPaliersReplies.has(String(g.prix)) ? ' replie' : ''}" data-palier="${g.prix}">
            <span>${fmtNum(g.prix)} € — ${g.items.length} jeu${g.items.length > 1 ? 'x' : ''}</span>
            <span class="fleche">▾</span>
          </div>
          <div class="card fdj-stock-palier-corps" id="palierCorps-${String(g.prix).replace('.', '_')}" style="${stockEtatPaliersReplies.has(String(g.prix)) ? 'display:none;' : ''}">
            <div class="fdj-stock-palier-phrase">${NexusFdjMoteur.phraseFamillePalier(items)}</div>
            <div class="fdj-stock-head">
              <div class="fdj-stock-head-nom">Jeu</div>
              <div class="fdj-stock-head-metrics"><span>Bureau</span><span>Caisse</span><span>En cours</span></div>
              <div class="fdj-stock-head-statut"></div>
            </div>
            ${g.items.map(j => renderJeuStockEtat(j, etats[j.id])).join('')}
          </div>
        </div>
      `;
      }).join('') : `<div class="empty">Aucun jeu dans ce filtre.</div>`}
    `;
    document.getElementById('btnRetourStockEtat').addEventListener('click', () => { vue = 'liste'; stockEtat = null; stockEtatFiltre = 'tous'; renderAccueil(); });
    document.getElementById('btnOuvrirBlocage').addEventListener('click', () => ouvrirBlocage());
    document.querySelectorAll('[data-retourner]').forEach(btn => btn.addEventListener('click', () => retournerDepuisBloque(btn.dataset.retourner)));
    document.querySelectorAll('[data-rapprocher]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const estime = btn.dataset.estime ? Number(btn.dataset.estime) : null;
      ouvrirRapprochement(btn.dataset.rapprocher, estime);
    }));
    document.querySelectorAll('.fdj-stock-filtre').forEach(btn => btn.addEventListener('click', () => { stockEtatFiltre = btn.dataset.filtre; renderStockEtat(); }));
    document.querySelectorAll('.fdj-stock-palier-head').forEach(head => head.addEventListener('click', () => {
      const prix = head.dataset.palier;
      if (stockEtatPaliersReplies.has(prix)) stockEtatPaliersReplies.delete(prix); else stockEtatPaliersReplies.add(prix);
      head.classList.toggle('replie');
      const corps = document.getElementById(`palierCorps-${prix.replace('.', '_')}`);
      if (corps) corps.style.display = stockEtatPaliersReplies.has(prix) ? 'none' : '';
    }));
    document.querySelectorAll('.fdj-stock-row').forEach(row => row.addEventListener('click', () => {
      const detail = row.nextElementSibling;
      if (detail && detail.classList.contains('fdj-stock-detail')) detail.classList.toggle('open');
    }));
  }

  // Phrase de conclusion du détail (14/08/2026) — une ligne, cohérente
  // avec le badge de la ligne compacte, jamais un second jugement
  // concurrent. Ne s'affiche que pour l'axe stock (jamais pour
  // 'rapprocher', qui a déjà son propre bloc dédié ci-dessous).
  function conclusionStock(etat) {
    if (etat.statut === 'reapprovisionner') return { couleur: 'rouge', texte: etat.badge === '🔴 Rupture totale' ? 'Aucun réapprovisionnement possible depuis le bureau — commande à prévoir.' : 'Réapprovisionnement nécessaire : redescendez un carnet du bureau vers la caisse.' };
    if (etat.statut === 'vigilance') return { couleur: 'ambre', texte: 'À surveiller — activez un carnet en réserve ou préparez le réapprovisionnement.' };
    if (etat.statut === 'ok') return { couleur: 'vert', texte: 'Aucun réapprovisionnement nécessaire.' };
    return null;
  }

  // Niveau 1 (ligne compacte, toujours visible) + Niveau 2 (détail replié,
  // ouvert au clic sur la ligne — même mécanique que .histo-item plus haut).
  // 14/08/2026 (refonte lecture managériale) : le détail expose maintenant
  // tickets restants du carnet en cours, rotation moyenne et autonomie
  // estimée — chacun avec son propre "non calculable" explicite si les
  // données manquent (Article 5 : jamais un chiffre inventé).
  function renderJeuStockEtat(jeu, etat) {
    const solde = stockEtat.soldes[jeu.id] || { bureau: 0, confies: 0, actives: 0, bloques: 0, nonActives: 0 };
    const derniereReception = stockEtat.dernieresReceptions[jeu.id];
    const anciennete = ancienneteJours(derniereReception);
    const quartsConcernes = stockEtat.quartsConcernesParJeu[jeu.id] || [];
    const noteReception = `<div class="histo-sub">${derniereReception ? `Dernière réception : il y a ${anciennete} jour${anciennete > 1 ? 's' : ''} (${new Date(derniereReception).toLocaleDateString('fr-FR')})` : 'Aucune réception enregistrée'}</div>`;

    const ticketsRestants = stockEtat.ticketsRestantsParJeu[jeu.id];
    const rotation = stockEtat.rotationParJeu[jeu.id];
    const autonomie = stockEtat.autonomieParJeu[jeu.id];
    // 15/08/2026 : "Carnet en cours" reflète désormais en priorité le
    // dernier comptage de quart réel (ticketsRestants) plutôt que le seul
    // solde de mouvements carnet (solde.actives) — même signal que
    // etatLigneStockV2 (carnetEnCoursConnu), pour ne jamais afficher "Aucun"
    // ici alors que "Tickets restants" montre un chiffre juste en dessous.
    // solde.actives ne sert de repli que si aucun comptage de quart n'existe
    // encore pour ce jeu (ticketsRestants === null).
    const carnetEnCoursTexte = ticketsRestants !== null
      ? (ticketsRestants > 0 ? '1 (déduit du dernier comptage de quart)' : 'Aucun (carnet épuisé)')
      : (solde.actives > 0 ? `${fmtNum(solde.actives)} activé${solde.actives > 1 ? 's' : ''} depuis le point zéro` : 'Aucun');
    const mesures = !etat.rapprochement ? `
      <div class="fdj-stock-mesure-row"><span>Réserve bureau</span><b>${fmtNum(solde.bureau)} carnet${solde.bureau > 1 ? 's' : ''}</b></div>
      <div class="fdj-stock-mesure-row"><span>Carnets non activés en caisse</span><b>${fmtNum(solde.nonActives)} carnet${solde.nonActives > 1 ? 's' : ''}</b></div>
      <div class="fdj-stock-mesure-row"><span>Carnet en cours</span><b>${carnetEnCoursTexte}</b></div>
      <div class="fdj-stock-mesure-row"><span>Tickets restants</span><b>${ticketsRestants !== null ? `${fmtNum(ticketsRestants)} / ${jeu.tickets_par_carnet}` : 'Non calculable'}</b></div>
      <div class="fdj-stock-mesure-row"><span>Rotation moyenne</span><b>${rotation > 0 ? `${fmtNum(Math.round(rotation * 100) / 100)} carnet/jour` : 'Aucune activation récente'}</b></div>
      <div class="fdj-stock-mesure-row"><span>Autonomie caisse estimée</span><b>${autonomie.jours !== null ? `${fmtNum(autonomie.jours)} jour${autonomie.jours > 1 ? 's' : ''}` : 'Non calculable'}</b></div>
    ` : '';
    const conclusion = !etat.rapprochement ? conclusionStock(etat) : null;

    return `
      <div class="fdj-stock-item">
        <div class="fdj-stock-row">
          <div class="fdj-stock-nom">${jeu.nom}</div>
          <div class="fdj-stock-metrics">
            <span>${fmtNum(solde.bureau)}</span>
            <span>${fmtNum(solde.nonActives)}</span>
            <span>${fmtNum(solde.actives)}</span>
          </div>
          <div class="fdj-stock-statut ${etat.couleur}">${etat.badge}</div>
        </div>
        <div class="fdj-stock-detail">
          ${etat.rapprochement ? `
            <div class="fdj-stock-badges">
              <span class="fdj-stock-badge amber">⚠️ ${etat.carnetsEstimes !== null ? `${etat.carnetsEstimes} carnet${etat.carnetsEstimes > 1 ? 's' : ''} estimé${etat.carnetsEstimes > 1 ? 's' : ''}` : 'carnets à rapprocher (quantité inconnue)'}</span>
              <span class="fdj-stock-badge">${fmtNum(etat.approNonTrace)} ticket${etat.approNonTrace > 1 ? 's' : ''} non tracé${etat.approNonTrace > 1 ? 's' : ''}</span>
            </div>
            ${quartsConcernes.length ? `<div class="histo-sub">Quart(s) concerné(s) : ${quartsConcernes.map(q => q.date ? `${new Date(q.date + 'T00:00:00').toLocaleDateString('fr-FR')} · Q${q.quart}` : '—').join(', ')}</div>` : ''}
            ${noteReception}
            <button type="button" class="btn-modifier" data-rapprocher="${jeu.id}" data-estime="${etat.carnetsEstimes ?? ''}" style="margin-top:10px; width:100%;">🔧 Enregistrer le(s) carnet(s) manquant(s)</button>
          ` : `${mesures}${noteReception}${conclusion ? `<div class="fdj-stock-conclusion ${conclusion.couleur}">${conclusion.texte}</div>` : ''}`}
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // RAPPROCHEMENT MANUEL — 13/08/2026, capture d'écran de Frédéric. Le
  // manager confirme lui-même qu'un carnet a réellement été activé pendant
  // un quart complété/corrigé après coup (jamais NEXUS qui déduit ou
  // invente à sa place — "vérité avant certitude"). Insère un mouvement
  // 'activation' classique (même type que executerActivationCarnet dans
  // NEXUS-FDJ-v1.html, mais methode_identification='saisie_manuelle' et
  // shift_id=null puisqu'il ne s'agit pas d'un quart précis mais d'un
  // rattrapage global sur ce jeu). Formulaire dédié plutôt qu'un prompt()
  // générique — même discipline que "Signaler un retrait/blocage" plus bas.
  // ------------------------------------------------------------
  function ouvrirRapprochement(gameId, carnetsEstimes) {
    rapprochement = { gameId, quantite: carnetsEstimes && carnetsEstimes > 0 ? carnetsEstimes : 1, justification: '' };
    vue = 'rapprochement';
    renderRapprochement();
  }

  function renderRapprochement() {
    const jeu = jeux.find(j => j.id === rapprochement.gameId);
    document.getElementById('titre').textContent = 'Enregistrer un carnet manquant';
    document.getElementById('sousTitre').textContent = "Confirme qu'un carnet a réellement été activé pendant un quart complété/corrigé après coup — NEXUS ne le déduit jamais seul.";
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourRapprochement">← Retour</button>
      <div class="champ-note" style="margin-top:-4px;">${jeu ? jeu.nom : ''}</div>
      <label class="champ-label">Nombre de carnets réellement activés</label>
      <input type="number" inputmode="numeric" min="1" step="1" class="champ-input mono" id="champQteRapprochement" value="${rapprochement.quantite}" style="margin-bottom:4px;">
      <div class="champ-note" style="margin-bottom:12px;">Estimation NEXUS à partir des tickets non tracés — à corriger si vous comptez autrement.</div>
      <label class="champ-label">Constat (pourquoi cette correction)</label>
      <input type="text" class="champ-input" id="champJustifRapprochement" value="${rapprochement.justification}" placeholder="Ex. carnet activé pendant le quart du 11/08, jamais tracé en direct" style="margin-bottom:16px;">
      <button class="btn-primary" id="btnValiderRapprochement">Confirmer l'activation</button>
    `;
    document.getElementById('btnRetourRapprochement').addEventListener('click', () => { vue = 'stock-etat'; rapprochement = null; renderStockEtat(); });
    document.getElementById('champQteRapprochement').addEventListener('input', e => { rapprochement.quantite = e.target.value === '' ? null : Number(e.target.value); });
    document.getElementById('champJustifRapprochement').addEventListener('input', e => { rapprochement.justification = e.target.value; });
    document.getElementById('btnValiderRapprochement').addEventListener('click', validerRapprochement);
  }

  async function validerRapprochement() {
    if (!rapprochement.quantite || rapprochement.quantite <= 0) { alert('Indiquez un nombre de carnets supérieur à 0.'); return; }
    const btn = document.getElementById('btnValiderRapprochement');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const caisse = emplacementParType('caisse');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: rapprochement.gameId, shift_id: null, type_mouvement: 'activation', quantite: rapprochement.quantite,
      location_source_id: caisse ? caisse.id : null, location_destination_id: caisse ? caisse.id : null,
      methode_identification: 'saisie_manuelle', employee_id: null,
      justification: `Rapprochement manuel manager — quart(s) complété(s)/corrigé(s) après coup sans mouvement tracé.${rapprochement.justification ? ` ${rapprochement.justification}` : ''}`,
    });
    if (error) {
      console.error('Rapprochement stock FDJ:', error);
      btn.disabled = false; btn.textContent = "Confirmer l'activation";
      alert("Erreur d'enregistrement. Réessayez.");
      return;
    }
    rapprochement = null;
    await ouvrirStockEtat();
  }

  // Retrait/blocage (§3, §18) : formulaire minimal, gestion par exception —
  // pas d'écran permanent, juste ce qu'il faut pour tracer "qui, quoi,
  // combien, pourquoi" sans jamais modifier un stock sans un fait déclaré.
  async function ouvrirBlocage() {
    blocage = { gameId: jeux[0] ? jeux[0].id : null, quantite: 1, emplacement: 'bureau', motif: '' };
    vue = 'blocage';
    renderBlocage();
  }

  function renderBlocage() {
    document.getElementById('titre').textContent = 'Signaler un retrait / blocage';
    document.getElementById('sousTitre').textContent = "Isole un jeu/série sans modifier le reste du stock — n'active rien, n'ajoute rien à l'appro.";
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourBlocage">← Retour</button>
      <label class="champ-label">Jeu concerné</label>
      <select class="champ-select" id="champJeuBlocage" style="margin-bottom:12px;">
        ${jeux.map(j => `<option value="${j.id}" ${j.id===blocage.gameId?'selected':''}>${j.nom}</option>`).join('')}
      </select>
      <label class="champ-label">Emplacement source</label>
      <select class="champ-select" id="champEmplacementBlocage" style="margin-bottom:12px;">
        <option value="bureau" ${blocage.emplacement==='bureau'?'selected':''}>Bureau</option>
        <option value="caisse" ${blocage.emplacement==='caisse'?'selected':''}>Caisse</option>
      </select>
      <label class="champ-label">Quantité</label>
      <input type="number" inputmode="numeric" min="1" step="1" class="champ-input mono" id="champQteBlocage" value="${blocage.quantite}" style="margin-bottom:12px;">
      <label class="champ-label">Motif</label>
      <input type="text" class="champ-input" id="champMotifBlocage" value="${blocage.motif}" placeholder="Ex. instruction FDJ, série suspecte…" style="margin-bottom:16px;">
      <button class="btn-primary" id="btnConfirmerBlocage">Signaler</button>
      <button class="btn-ghost" id="btnAnnulerBlocage">Annuler</button>
    `;
    document.getElementById('btnRetourBlocage').addEventListener('click', () => { vue = 'stock-etat'; blocage = null; renderStockEtat(); });
    document.getElementById('btnAnnulerBlocage').addEventListener('click', () => { vue = 'stock-etat'; blocage = null; renderStockEtat(); });
    document.getElementById('champJeuBlocage').addEventListener('change', e => blocage.gameId = e.target.value);
    document.getElementById('champEmplacementBlocage').addEventListener('change', e => blocage.emplacement = e.target.value);
    document.getElementById('champQteBlocage').addEventListener('input', e => blocage.quantite = e.target.value === '' ? 1 : Math.max(1, parseInt(e.target.value, 10) || 1));
    document.getElementById('champMotifBlocage').addEventListener('input', e => blocage.motif = e.target.value);
    document.getElementById('btnConfirmerBlocage').addEventListener('click', enregistrerBlocage);
  }

  async function enregistrerBlocage() {
    if (!blocage.motif.trim()) { alert('Indiquez un motif — NEXUS ne modifie jamais un stock sans un fait déclaré.'); return; }
    const btn = document.getElementById('btnConfirmerBlocage');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const source = emplacementParType(blocage.emplacement);
    const zoneBloquee = emplacementParType('bloque');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: blocage.gameId, type_mouvement: 'blocage', quantite: blocage.quantite,
      location_source_id: source ? source.id : null, location_destination_id: zoneBloquee ? zoneBloquee.id : null,
      methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
      justification: `Retrait/blocage (manager) — ${blocage.motif}`,
    });
    if (error) { console.error('Blocage FDJ:', error); btn.disabled = false; btn.textContent = 'Signaler'; alert("Erreur d'enregistrement. Réessayez."); return; }
    vue = 'stock-etat'; blocage = null;
    await ouvrirStockEtat();
  }

  async function retournerDepuisBloque(gameId) {
    const solde = stockEtat.soldes[gameId];
    if (!solde || !(solde.bloques > 0)) return;
    if (!confirm(`Retourner les ${solde.bloques} carnet(s) bloqué(s) de ce jeu au Bureau ?`)) return;
    const zoneBloquee = emplacementParType('bloque');
    const bureau = emplacementParType('bureau');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: gameId, type_mouvement: 'retour', quantite: solde.bloques,
      location_source_id: zoneBloquee ? zoneBloquee.id : null, location_destination_id: bureau ? bureau.id : null,
      methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
      justification: 'Retour au bureau depuis la zone bloquée (manager).',
    });
    if (error) { console.error('Retour depuis bloqué FDJ:', error); alert("Erreur d'enregistrement. Réessayez."); return; }
    await ouvrirStockEtat();
  }

  // ------------------------------------------------------------
  // TRACE DE CONTRÔLE FDJ — ÉCRAN "RELEVÉ DE CLÔTURE" (par quart)
  // 16/08/2026, demande de Frédéric : "Historique FDJ → sélectionner un
  // quart → Générer le relevé de contrôle". Le relevé n'est jamais
  // recalculé ici — il se contente d'afficher tel quel ce que
  // NexusFdjMoteur (via validerQuart/enregistrerEdition/synchroniser
  // RelevesApresRetablissementChaine) a déjà écrit dans fdj_releves_cloture.
  // "NEXUS conserve le fait" : cet écran ne fait que le lire et le mettre
  // en forme, jamais une nouvelle vérité.
  // ------------------------------------------------------------
  async function ouvrirReleveQuart(shift) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    const releves = await chargerRelevesQuart(shift.id);
    releveQuart = { shift, releves, dernierPdf: null };
    vue = 'releve';
    renderReleveQuart();
  }

  // Liste ordonnée des game_id apparaissant dans au moins une des 3 cartes
  // *_par_jeu du snapshot — dans l'ordre d'affichage habituel des jeux
  // (jeux déjà chargés triés par ordre_affichage), jamais un ordre
  // dépendant des clés JSON (non garanti).
  function jeuxDuSnapshot(snapshot) {
    const ids = new Set([
      ...Object.keys(snapshot.stock_initial_par_jeu || {}),
      ...Object.keys(snapshot.appro_par_jeu || {}),
      ...Object.keys(snapshot.stock_final_par_jeu || {}),
    ]);
    return jeux.filter(j => ids.has(j.id));
  }

  function renderReleveQuart() {
    const { shift, releves } = releveQuart;
    document.getElementById('titre').textContent = 'Relevé de clôture FDJ';
    document.getElementById('sousTitre').textContent = `${new Date(shift.date + 'T00:00:00').toLocaleDateString('fr-FR')} · Quart ${shift.quart} · ${nomEmploye(shift.employee_id)}`;

    if (!releves.length) {
      document.getElementById('content').innerHTML = `
        <button type="button" class="btn-retour-fleche" id="btnRetourReleve">← Retour</button>
        <div class="card"><div class="empty">Aucun relevé de clôture pour ce quart — probablement un quart clôturé avant la mise en place de la trace de contrôle FDJ (16/08/2026), ou pas encore validé définitivement par l'employé.</div></div>
      `;
      document.getElementById('btnRetourReleve').addEventListener('click', () => { vue = 'liste'; releveQuart = null; renderAccueil(); });
      return;
    }

    const dernier = releves[releves.length - 1];
    const premier = releves[0];
    const jeuxListe = jeuxDuSnapshot(dernier);
    const ecart = dernier.ecart;
    const classeEcart = ecart === null || ecart === undefined ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const heureValidation = premier && premier.signature && premier.signature.date_heure
      ? new Date(premier.signature.date_heure).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
      : '—';

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourReleve">← Retour</button>

      <div class="card" style="margin-bottom:16px;">
        <div class="stat-row"><div class="stat-label">Employé</div><div class="stat-value">${nomEmploye(shift.employee_id)}</div></div>
        <div class="stat-row"><div class="stat-label">Date · Quart</div><div class="stat-value">${new Date(shift.date + 'T00:00:00').toLocaleDateString('fr-FR')} · Quart ${shift.quart}</div></div>
        <div class="stat-row"><div class="stat-label">Heure de validation</div><div class="stat-value">${heureValidation}</div></div>
        <div class="stat-row"><div class="stat-label">Identifiant du relevé</div><div class="stat-value" style="font-size:10.5px; font-family:var(--mono); color:var(--text-dim);">${shift.id}</div></div>
        <div class="stat-row"><div class="stat-label">Caractère</div><div class="stat-value"><span class="badge-caractere ${dernier.caractere}">${libelleCaractereReleve(dernier.caractere)}</span></div></div>
        <div class="stat-row"><div class="stat-label">Statut</div><div class="stat-value"><span class="statut-badge ${dernier.statut}">${labelStatutRelevecloture(dernier.statut)}</span></div></div>
      </div>

      ${dernier.caractere === 'provisoire' ? `
        <div class="card" style="margin-bottom:16px; border:1px solid rgba(245,166,35,0.4); background:rgba(245,166,35,0.06);">
          <div class="histo-sub" style="color:var(--amber);">🟠 Relevé provisoire — continuité à régulariser. La chaîne de quarts était interrompue ou une continuité de stock restait à vérifier au moment de ce constat. Ce relevé sera recalculé automatiquement (nouvelle version, celle-ci restant conservée) dès que le quart manquant sera complété.</div>
        </div>
      ` : ''}

      <div class="section-titre">Stock par jeu (état retenu)</div>
      <div class="card" style="margin-bottom:16px;">
        ${jeuxListe.length ? jeuxListe.map(j => `
          <div class="jeu-row">
            <div class="jeu-nom-ligne"><div class="jeu-nom">${j.nom}</div></div>
            <div class="stat-row"><div class="stat-label">Stock initial → Appro → Stock final</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${fmtNum((dernier.stock_initial_par_jeu || {})[j.id])} → ${fmtNum((dernier.appro_par_jeu || {})[j.id])} → ${fmtNum((dernier.stock_final_par_jeu || {})[j.id])}</div></div>
            ${(dernier.ventes_par_jeu || {})[j.id] ? `<div class="stat-row"><div class="stat-label">Ventes</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${fmtNum((dernier.ventes_par_jeu[j.id] || {}).qte)} tickets · ${fmtEuro((dernier.ventes_par_jeu[j.id] || {}).valeur)}</div></div>` : ''}
          </div>
        `).join('') : '<div class="empty">Aucun jeu dans ce snapshot.</div>'}
      </div>

      <div class="section-titre">Synthèse caisse</div>
      <div class="card" style="margin-bottom:16px;">
        <div class="stat-row"><div class="stat-label">Ventes grattage</div><div class="stat-value">${fmtEuro(dernier.ventes_grattage_valeur)}</div></div>
        <div class="stat-row"><div class="stat-label">Lots payés</div><div class="stat-value">${fmtEuro(dernier.lots_payes_grattage)}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse tirages</div><div class="stat-value">${fmtEuro(dernier.caisse_tirages)}</div></div>
        <div class="stat-row"><div class="stat-label">Régularisations</div><div class="stat-value">${fmtEuro(dernier.regularisations)}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(dernier.caisse_attendue)}</div></div>
        <div class="stat-row"><div class="stat-label">Caisse réelle</div><div class="stat-value">${fmtEuro(dernier.caisse_reelle)}</div></div>
        <div class="stat-row total"><div class="stat-label">Écart</div><div class="stat-value ${classeEcart}">${ecart !== null && ecart !== undefined ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div></div>
        ${libelleAnomalieChaine(dernier.anomalie_chaine).map(l => `<div class="stat-row"><div class="stat-label">${l.label}</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${l.valeur}</div></div>`).join('')}
      </div>

      <div class="section-titre">Historique des versions (${releves.length})</div>
      ${releves.slice().reverse().map((r, idxRev) => {
        const i = releves.length - 1 - idxRev;
        const auteur = r.signature && r.signature.nom ? r.signature.nom : (r.cree_par ? nomEmploye(r.cree_par) : '—');
        const dateVersion = r.cree_le ? new Date(r.cree_le).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
        return `
          <div class="releve-version-card">
            <div class="releve-version-titre">
              <span>Version ${r.version_num} — ${libelleTypeVersionReleve(r.type_version)}</span>
              <span class="badge-caractere ${r.caractere}" style="white-space:nowrap;">${r.caractere === 'provisoire' ? 'Provisoire' : 'Définitif'}</span>
            </div>
            <div class="releve-version-meta">${dateVersion} · ${auteur}</div>
            ${r.motif_regularisation ? `<div class="releve-version-motif">${r.motif_regularisation}</div>` : ''}
            ${i > 0 ? renderDiffReleve(r.diff_vs_precedent) : ''}
          </div>
        `;
      }).join('')}

      <div id="zoneActionsPdfReleve">
        <button class="btn-rapport-pdf" id="btnGenererPdfReleve" type="button">📄 Générer le relevé de contrôle (PDF)</button>
      </div>
    `;
    document.getElementById('btnRetourReleve').addEventListener('click', () => { vue = 'liste'; releveQuart = null; renderAccueil(); });
    document.getElementById('btnGenererPdfReleve').addEventListener('click', () => {
      genererEtAfficherPdf(document.getElementById('zoneActionsPdfReleve'), () => construireReleveClotureQuartPdf(shift, releves), releveQuart);
    });
  }

  // Composition PDF du relevé d'un quart — 21/08/2026, demande de
  // Frédéric : "en A4 paysage, une seule feuille à l'impression".
  // Reconstruit sur ConstructeurRapportUnePage (déjà utilisé en
  // production par Inventaire/FDJ Analyse/Verify pour leurs synthèses
  // "toujours 1 page", nexus-pdf-moteur.js — Article 11, un seul
  // mécanisme "1 page", jamais un second réécrit ici) plutôt que
  // ConstructeurRapport (pagination libre, utilisé jusqu'ici) : un
  // relevé à N versions ne peut pas garantir 1 page avec un historique
  // de diff illimité comme avant. Chaque bloc reçoit ici un budget de
  // hauteur FIXE ; l'historique des versions est plafonné avec un
  // renvoi explicite ("+N autres — voir dans l'app") plutôt que de
  // déborder sur une 2e page ou tronquer silencieusement (Article 5).
  // Écart assumé et documenté (Data Dictionary) : le détail ligne à
  // ligne des diffs entre versions (visible à l'écran, renderReleveQuart)
  // n'apparaît plus dans ce PDF — seul un résumé par version (auteur,
  // date, motif) y figure ; le diff complet reste consultable dans l'app.
  async function construireReleveClotureQuartPdf(shift, releves) {
    const dernier = releves[releves.length - 1];
    const jeuxListe = jeuxDuSnapshot(dernier);
    const dateLabel = new Date(shift.date + 'T00:00:00').toLocaleDateString('fr-FR');
    const { COULEUR, MARGE_1P, ZONES_1P, MM } = NexusPdfMoteur;
    const ecart = dernier.ecart;
    const dateCourte = iso => iso ? new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
    const premier = releves[0];
    const heureValidation = premier && premier.signature && premier.signature.date_heure
      ? new Date(premier.signature.date_heure).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
      : '—';
