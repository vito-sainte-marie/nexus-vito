<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — FDJ · Contrôle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-forfait.js"></script>
<script src="nexus-desktop.js"></script>
<script src="nexus-fdj-moteur.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .horodateur-discret{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:8px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
  .locked{padding:80px 24px; text-align:center; color:var(--text-mid); font-size:14px;}

  .section-titre{font-family:var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin:18px 2px 10px;}
  .section-titre:first-child{margin-top:0;}

  .quart-jour-grid{display:flex; gap:10px; margin-bottom:6px;}
  .quart-jour-card{flex:1; background:var(--panel); border:1.5px solid var(--hairline); border-radius:14px; padding:14px; cursor:pointer;}
  .quart-jour-card:active{background:var(--panel-raised);}
  .quart-jour-label{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:uppercase; margin-bottom:6px;}
  .quart-jour-statut{font-size:12.5px; font-weight:600;}
  .quart-jour-ecart{font-family:var(--mono); font-size:15px; font-weight:700; margin-top:4px;}

  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .histo-item{padding:14px; cursor:pointer;}
  .histo-item + .histo-item{border-top:1px solid var(--hairline);}
  .histo-top{display:flex; justify-content:space-between; align-items:center;}
  .histo-date{font-size:13.5px; font-weight:600;}
  .histo-sub{font-size:11.5px; color:var(--text-mid); margin-top:2px;}
  .histo-ecart{font-family:var(--mono); font-size:14px; font-weight:700;}
  .histo-detail{max-height:0; overflow:hidden; transition:max-height .2s ease;}
  .histo-detail.open{max-height:900px; margin-top:12px; padding-top:12px; border-top:1px solid var(--hairline);}
  .statut-badge{font-family:var(--mono); font-size:9px; font-weight:700; padding:3px 8px; border-radius:10px; text-transform:uppercase; white-space:nowrap;}
  .statut-badge.provisoire{background:var(--panel-raised); color:var(--text-dim);}
  .statut-badge.a_controler,.statut-badge.en_attente{background:var(--amber-dim); color:var(--amber);}
  .statut-badge.expliquee,.statut-badge.regularise,.statut-badge.valide_avec_ecart{background:rgba(79,195,217,0.12); color:var(--cyan);}
  .statut-badge.conforme{background:var(--green-dim); color:var(--green);}
  .statut-badge.brouillon{background:var(--panel-raised); color:var(--text-dim);}
  .statut-badge.valide{background:var(--green-dim); color:var(--green);}

  .btn-modifier{width:auto; padding:9px 14px; margin-top:10px; background:var(--panel-raised); color:var(--amber); border:1px solid rgba(245,166,35,0.35); border-radius:8px; font-family:var(--sans); font-size:12px; font-weight:600; cursor:pointer;}
  .btn-modifier:active{background:var(--hairline);}

  .empty{padding:24px; text-align:center; color:var(--text-dim); font-size:12.5px;}

  .champ-row{display:flex; gap:8px; margin-bottom:12px;}
  .champ-row > *{flex:1;}
  .champ-label{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); margin-bottom:6px; letter-spacing:0.03em; display:block;}
  .champ-input, .champ-select{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    padding:11px 12px; color:var(--text); font-family:var(--sans); font-size:14px;
  }
  .champ-input:focus, .champ-select:focus{outline:none; border-color:var(--cyan);}
  .champ-input.mono{font-family:var(--mono); text-align:right;}
  .champ-note{font-size:11px; color:var(--text-dim); line-height:1.5; margin:-6px 0 12px;}
  .champ-readonly{padding:11px 12px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; font-family:var(--mono); font-size:14px; color:var(--text-mid);}

  /* Bouton de signe pour "Caisse tirages" (10/08/2026, demande de
     Frédéric — même correctif que NEXUS-FDJ-v1.html) : le clavier
     numérique mobile n'affiche pas toujours la touche "-", un bouton
     dédié garantit que le signe reste accessible sur tous les téléphones. */
  .champ-input-signe-row{display:flex; gap:8px; margin-bottom:12px;}
  .champ-input-signe-row .champ-input{margin-bottom:0; flex:1;}
  .btn-signe{
    flex-shrink:0; width:44px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    color:var(--text-mid); font-family:var(--mono); font-size:18px; font-weight:700; cursor:pointer;
  }
  .btn-signe.actif{color:var(--red); border-color:rgba(240,87,90,0.45); background:var(--red-dim);}

  .palier-block{margin-bottom:14px;}
  .palier-head{font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); padding:0 2px 6px;}
  .jeu-row{padding:10px 12px;}
  .jeu-row + .jeu-row{border-top:1px solid var(--hairline);}
  .jeu-nom-ligne{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px;}
  .jeu-nom{font-size:12.5px; font-weight:600;}
  .jeu-ventes{font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}
  .jeu-ventes.calc{color:var(--cyan);}
  .jeu-ventes.anomalie{color:var(--red); font-weight:700;}
  .jeu-row.anomalie{background:rgba(240,87,90,0.08); box-shadow:inset 3px 0 0 var(--red);}
  .jeu-input.auto{color:var(--text-mid);}
  .jeu-inputs{display:flex; gap:6px;}
  .jeu-input-wrap{flex:1;}
  .jeu-input-label{font-family:var(--mono); font-size:8px; color:var(--text-dim); text-transform:uppercase; margin-bottom:3px; text-align:center;}
  .jeu-input{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:8px 4px; color:var(--text); font-family:var(--mono); font-size:13px; text-align:center;}
  .jeu-input:focus{outline:none; border-color:var(--cyan);}

  /* 13/08/2026 (v2) — refonte "État du stock FDJ" en 3 niveaux de lecture
     (retour visuel de Frédéric sur la v1 : "trop dense, trop répétitif,
     pas assez hiérarchisé — montrer d'abord ce qui mérite l'attention").
     Niveau 1 : ligne compacte par jeu (.fdj-stock-row). Niveau 2 : détail
     dépliable au clic (.fdj-stock-detail), même mécanique de repli que
     .histo-item/.histo-detail plus haut — Article 11, jamais un second
     système de dépli. Niveau 3 : filtres Tous/À réapprovisionner/
     Vigilance/À rapprocher/OK.
     14/08/2026 — refonte "lecture managériale" (retour détaillé de
     Frédéric, capture d'écran commentée) : colonnes renommées (Réserve/
     Non activé/En cours), 5 filtres au lieu de 4 (l'ancien bucket
     "vigilance" mélangeait rupture réelle et simple vigilance), synthèse
     globale en tête d'écran (.fdj-stock-synthese) et phrase par palier
     (.fdj-stock-palier-phrase) — mêmes classes de badges (vert/ambre/
     rouge), juste plus de contexte autour, jamais une nouvelle page. */
  .fdj-stock-synthese{margin-bottom:14px;}
  .fdj-stock-synthese .titre-synthese{font-size:14px; font-weight:700; margin-bottom:4px;}
  .fdj-stock-synthese .ligne-synthese{font-family:var(--mono); font-size:11px; color:var(--text-mid); line-height:1.6;}
  .fdj-stock-synthese .recommandation{margin-top:8px; padding:8px 10px; background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.25); border-radius:8px; font-size:12px; color:var(--cyan); font-weight:600;}
  .fdj-stock-filtres{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .fdj-stock-filtre{padding:6px 10px; border-radius:20px; border:1px solid var(--hairline); background:var(--panel); color:var(--text-mid); font-size:11.5px; font-weight:600; cursor:pointer; font-family:var(--sans);}
  .fdj-stock-filtre.active{background:rgba(79,195,217,0.12); border-color:rgba(79,195,217,0.4); color:var(--cyan);}
  .fdj-stock-filtre .compte{font-family:var(--mono); opacity:0.7; margin-left:2px;}
  .fdj-stock-palier-head{display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:0 2px 6px; font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}
  .fdj-stock-palier-head .fleche{transition:transform .15s ease; display:inline-block;}
  .fdj-stock-palier-head.replie .fleche{transform:rotate(-90deg);}
  .fdj-stock-palier-phrase{padding:0 2px 8px; font-family:var(--sans); font-size:11.5px; color:var(--text-mid); line-height:1.5;}
  .fdj-stock-head{display:flex; align-items:center; padding:8px 12px; border-bottom:1px solid var(--hairline); font-family:var(--mono); font-size:8.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim);}
  .fdj-stock-head-nom{flex:1;}
  .fdj-stock-head-metrics{display:flex; gap:10px;}
  .fdj-stock-head-metrics span{width:40px; text-align:center;}
  .fdj-stock-head-statut{width:104px; text-align:right;}
  .fdj-stock-item + .fdj-stock-item{border-top:1px solid var(--hairline);}
  .fdj-stock-row{display:flex; align-items:center; padding:10px 12px; cursor:pointer; gap:8px;}
  .fdj-stock-row:active{background:var(--panel-raised);}
  .fdj-stock-nom{flex:1; font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fdj-stock-metrics{display:flex; gap:10px; font-family:var(--mono); font-size:12.5px;}
  .fdj-stock-metrics span{width:40px; text-align:center;}
  .fdj-stock-statut{width:104px; text-align:right; font-family:var(--mono); font-size:10px; font-weight:700; white-space:nowrap;}
  .fdj-stock-statut.vert{color:var(--cyan);}
  .fdj-stock-statut.ambre{color:var(--amber);}
  .fdj-stock-statut.rouge{color:var(--red);}
  .fdj-stock-mesure-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-mid); padding:3px 0;}
  .fdj-stock-mesure-row b{color:var(--text); font-weight:600;}
  .fdj-stock-conclusion{margin-top:8px; padding:8px 10px; border-radius:8px; font-size:11.5px; font-weight:600;}
  .fdj-stock-conclusion.vert{background:var(--green-dim); color:var(--green);}
  .fdj-stock-conclusion.ambre{background:var(--amber-dim); color:var(--amber);}
  .fdj-stock-conclusion.rouge{background:var(--red-dim); color:var(--red);}
  .fdj-stock-detail{max-height:0; overflow:hidden; transition:max-height .2s ease; padding:0 12px;}
  .fdj-stock-detail.open{max-height:420px; padding:0 12px 12px;}
  .fdj-stock-badges{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 8px;}
  .fdj-stock-badge{font-family:var(--mono); font-size:10px; font-weight:700; padding:4px 9px; border-radius:10px; background:var(--panel-raised); color:var(--text-mid); white-space:nowrap;}
  .fdj-stock-badge.amber{background:var(--amber-dim); color:var(--amber);}

  .stepper-qte{display:flex; align-items:center; justify-content:center; gap:12px; margin:6px 0 8px;}
  .btn-stepper{width:34px; height:34px; border-radius:9px; border:1px solid var(--hairline); background:var(--panel-raised); color:var(--cyan); font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;}
  .btn-stepper:active{background:var(--hairline);}
  .stepper-valeur{font-family:var(--mono); font-size:17px; font-weight:700; min-width:26px; text-align:center;}
  .raccourcis-qte{display:flex; gap:6px; margin-bottom:8px;}
  .btn-raccourci{flex:1; padding:7px; border-radius:8px; border:1px solid var(--hairline); background:transparent; color:var(--text-mid); font-size:11px; font-weight:600; cursor:pointer;}
  .btn-raccourci:active{background:var(--panel-raised);}
  .valeur-carnets{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); line-height:1.6; text-align:center;}
  .valeur-carnets b{color:var(--gold);}
  .valeur-carnets .activee{color:var(--text-dim);}

  .resume-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin:6px 0 14px;}
  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0;}
  .stat-row + .stat-row{border-top:1px solid var(--hairline);}
  .stat-label{font-size:12.5px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:14px; font-weight:700;}
  .stat-value.amber{color:var(--amber);} .stat-value.cyan{color:var(--cyan);} .stat-value.red{color:var(--red);} .stat-value.green{color:var(--green);}
  .stat-row.total{margin-top:4px; padding-top:12px; border-top:1.5px solid var(--hairline);}
  .stat-row.total .stat-label{font-weight:700; color:var(--text);}
  .stat-row.total .stat-value{font-size:17px;}

  .btn-primary{width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{width:100%; padding:12px; border:1px solid var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:13px; cursor:pointer; margin-top:8px;}
  .btn-retour-fleche{display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--cyan); font-family:var(--sans); font-size:13px; font-weight:600; padding:0 0 16px; cursor:pointer;}
  .btn-retour-fleche:active{opacity:0.7;}
  .btn-nouveau{width:100%; padding:12px; border:1.5px dashed rgba(79,195,217,0.4); border-radius:12px; background:rgba(79,195,217,0.06); color:var(--cyan); font-size:13px; font-weight:600; cursor:pointer; margin:4px 0 4px;}
  /* Choix de destination après enregistrement (13/08/2026) */
  .apres-enreg-card{padding:24px 18px; text-align:center;}
  .apres-enreg-icone{font-size:30px; margin-bottom:8px;}
  .apres-enreg-titre{font-size:14px; color:var(--text); margin-bottom:4px; font-weight:600;}
  .apres-enreg-sous{font-size:12.5px; color:var(--text-mid); margin-bottom:20px;}
  .btn-loading-dots{display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle;}
  .btn-loading-dots i{width:4px; height:4px; border-radius:50%; background:currentColor; display:inline-block; font-style:normal; animation:btnDotsBounce 1.2s infinite ease-in-out;}
  .btn-loading-dots i:nth-child(2){animation-delay:0.15s;} .btn-loading-dots i:nth-child(3){animation-delay:0.3s;}
  @keyframes btnDotsBounce{0%,80%,100%{opacity:0.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);}}

  .champ-sep{height:1px; background:var(--hairline); margin:18px 0;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · FDJ</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="horodateur-discret" id="horodateurDiscret">--</div>
    <div class="sub" id="sousTitre"></div>
  </div>
  <div class="divider"></div>

  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>

  <footer>NEXUS FDJ Manager v1 · Contrôle et corrections · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS FDJ Manager v1 (09/08/2026) — vue manager du contrôle FDJ,
  // construite avec Frédéric juste après l'écran employé.
  //
  // Demande explicite de Frédéric : "donne tout pouvoir au manager pour
  // modifier n'importe quelle caisse comme dans Verify." Reprend donc le
  // principe de NEXUS-Verify-v1.html (fonction prefillFormPourModification
  // + upsert direct sur la même ligne, pas de workflow d'approbation
  // séparé façon inventaire_corrections) plutôt que la discipline plus
  // lourde utilisée ailleurs — un manager peut ici changer n'importe quelle
  // valeur d'un quart déjà validé et l'écraser directement.
  //
  // Date et quart sont eux aussi modifiables sur un quart déjà créé
  // (09/08/2026, demande de Frédéric) : la mise à jour se fait sur la même
  // ligne (UPDATE ... WHERE id=), jamais un upsert sur (site,date,quart) —
  // pas de risque de ligne fantôme. Seul filet de sécurité : si la
  // nouvelle date/quart choisie est déjà prise par un autre quart FDJ, la
  // contrainte unique de la base refuse l'enregistrement et NEXUS l'explique
  // clairement plutôt que d'écraser l'autre quart en silence.
  //
  // Calculs délégués à nexus-fdj-moteur.js — jamais dupliqués ici (Article 11).
  // ------------------------------------------------------------

  let managerCourant = null;
  let siteId = null; // jamais 'vito-sainte-marie' par defaut (de-Vito-isation, 11/08/2026) - toujours ecrase par employee.site_id apres nexusRequireAuth()
  let jeux = [];
  let employesSite = [];
  let emplacements = [];
  let reappro = null; // état de saisie de l'écran "Réapprovisionner la caisse"
  let inventaireRef = null; // état de saisie de l'écran "Inventaire de référence FDJ" (contrôle physique)
  let reception = null; // état de saisie de l'écran "Réceptionner une livraison FDJ"
  let stockEtat = null; // état affiché de l'écran "État du stock FDJ"
  let stockEtatFiltre = 'tous'; // 13/08/2026 (v2) : 'tous' | 'rapprocher' | 'vigilance' | 'ok'
  let stockEtatPaliersReplies = new Set(); // paliers de prix repliés par l'utilisateur (clés = String(prix))
  let blocage = null; // état de saisie du formulaire "Signaler un retrait / blocage"
  let rapprochement = null; // état de saisie du formulaire "Enregistrer un carnet manquant" (13/08/2026, rapprochement appro non tracée)
  // 13/08/2026 — "Règle d'accès aux quarts FDJ V1" (demande de Frédéric,
  // exigence #5 "Toute exception nécessite une dérogation manager tracée") :
  // état de saisie du formulaire de dérogation ouvert depuis le panneau
  // "Accès aux quarts — aujourd'hui" (voir chargerVerrousJour/renderVerrouJour).
  let derogation = null; // { verrouId, employeeId, quartActuel, autreQuart, motif }
  let vue = 'liste'; // 'liste' | 'edition' | 'reappro' | 'inventaire-ref' | 'reception' | 'stock-etat' | 'blocage' | 'apres-enregistrement' | 'rapprochement' | 'derogation'

  // État du formulaire d'édition en cours (nouveau OU existant).
  let edition = null;
  /* forme : {
       shiftId: uuid|null, date, quart, employeeId, statutShift,
       counts: { [game_id]: {stock_initial, appro, stock_final} },
       lotsPayes, caisseTirages, regularisations, caisseReelle, motifEcart, statutCaisse,
       avant: <snapshot JSON pour l'audit_log>,
     } */

  function heureLocale() { return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function demarrerHorloge() {
    const maj = () => {
      const el = document.getElementById('horodateurDiscret');
      if (!el) return;
      const jour = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      el.textContent = `${jour.charAt(0).toUpperCase()}${jour.slice(1)} · ${heureLocale()}`;
    };
    maj(); setInterval(maj, 15000);
  }
  function dateISO(d) {
    d = d || new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtEuro(n) { return (n === null || n === undefined || n === '' || isNaN(n)) ? '—' : `${Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`; }
  function fmtNum(n) { return (n === null || n === undefined) ? '—' : Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 }); }

  const STATUTS_CAISSE = [
    { value: 'provisoire', label: 'Provisoire' },
    { value: 'a_controler', label: 'À contrôler' },
    { value: 'en_attente', label: 'En attente' },
    { value: 'expliquee', label: 'Expliquée' },
    { value: 'regularise', label: 'Régularisé' },
    { value: 'valide_avec_ecart', label: 'Validé avec écart' },
    { value: 'conforme', label: 'Conforme' },
  ];
  const MOTIFS_ECART_FDJ = [
    { value: '', label: 'Choisir un motif…' },
    { value: 'erreur_saisie', label: 'Erreur de saisie' },
    { value: 'erreur_comptage', label: 'Erreur de comptage' },
    { value: 'carnet_non_declare', label: 'Carnet non déclaré' },
    { value: 'mouvement_oublie', label: 'Réapprovisionnement non enregistré' },
    { value: 'erreur_rapport', label: 'Erreur sur le rapport FDJ' },
    { value: 'autre', label: 'Autre raison' },
    { value: 'non_explique', label: 'Je ne sais pas' },
  ];
  // Motifs de l'exception tracée côté employé (NEXUS-FDJ-v1.html,
  // activerCarnet/renderExceptionCarnet) — dupliqués ici uniquement pour
  // l'affichage du libellé dans le panneau d'alertes manager, jamais pour
  // recalculer quoi que ce soit (Article 11 : les CALCULS restent dans
  // nexus-fdj-moteur.js, un simple dictionnaire de libellés n'en fait pas partie).
  const MOTIFS_EXCEPTION_CARNET = [
    { value: 'reappro_non_enregistre', label: 'Réapprovisionnement non enregistré' },
    { value: 'carnet_avant_nexus', label: 'Carnet déjà présent avant NEXUS' },
    { value: 'erreur_stock', label: 'Erreur de stock' },
    { value: 'autre', label: 'Autre' },
  ];
  // 13/08/2026 — "Règle d'accès aux quarts FDJ V1", exigence #5 : motifs
  // proposés pour la dérogation manager qui déplace le verrou d'un employé
  // vers l'autre quart. Un motif est obligatoire (voir enregistrerDerogationQuart) —
  // "Toute exception nécessite une dérogation manager tracée", pas juste un clic.
  const MOTIFS_DEROGATION_QUART = [
    { value: '', label: 'Choisir un motif…' },
    { value: 'erreur_selection_employe', label: "L'employé s'est trompé de quart" },
    { value: 'remplacement_urgence', label: "Remplacement / renfort en urgence" },
    { value: 'changement_planning', label: "Changement de planning validé" },
    { value: 'autre', label: 'Autre raison' },
  ];
  function labelStatutCaisse(v) { const s = STATUTS_CAISSE.find(x => x.value === v); return s ? s.label : v; }
  function labelMotifEcart(v) { const m = MOTIFS_ECART_FDJ.find(x => x.value === v); return m ? m.label : v; }
  function labelMotifException(v) { const m = MOTIFS_EXCEPTION_CARNET.find(x => x.value === v); return m ? m.label : (v || '—'); }
  function labelMotifDerogationQuart(v) { const m = MOTIFS_DEROGATION_QUART.find(x => x.value === v); return m ? m.label : (v || '—'); }

  // ------------------------------------------------------------
  // HISTORIQUE DES CORRECTIONS — 09/08/2026, demande de Frédéric :
  // "pouvoir corriger ne doit pas signifier pouvoir effacer la vérité
  // précédente". fdj_audit_log enregistre déjà un instantané complet
  // avant/après à chaque enregistrement manager (voir enregistrerEdition) ;
  // ce qui manquait, c'est un endroit où le relire. Ces fonctions comparent
  // les deux instantanés champ par champ et n'affichent que ce qui a
  // réellement changé — le manager garde 100% de son pouvoir (écriture
  // directe, sans workflow d'approbation), NEXUS garde 100% de sa mémoire.
  // ------------------------------------------------------------
  const LABELS_AUDIT_FDJ = {
    date: 'Date', quart: 'Quart', employeeId: 'Employé assigné',
    lotsPayes: 'Lots payés', caisseTirages: 'Caisse tirages', regularisations: 'Régularisations',
    caisseReelle: 'Caisse réelle', statutCaisse: 'Statut de la caisse', motifEcart: 'Motif', ecart: 'Écart',
  };
  function formatValeurAuditFdj(champ, valeur) {
    if (valeur === null || valeur === undefined || valeur === '') return '—';
    if (champ === 'employeeId') { const e = employesSite.find(x => x.id === valeur); return e ? e.nom : valeur; }
    if (champ === 'date') { try { return new Date(valeur + 'T00:00:00').toLocaleDateString('fr-FR'); } catch (e) { return valeur; } }
    if (champ === 'quart') return `Quart ${valeur}`;
    if (champ === 'statutCaisse') return labelStatutCaisse(valeur);
    if (champ === 'motifEcart') return labelMotifEcart(valeur);
    if (['lotsPayes', 'caisseTirages', 'regularisations', 'caisseReelle', 'ecart'].includes(champ)) return fmtEuro(valeur);
    return String(valeur);
  }
  function diffAuditFdj(avant, apres) {
    const champs = ['date', 'quart', 'employeeId', 'lotsPayes', 'caisseTirages', 'regularisations', 'caisseReelle', 'statutCaisse', 'motifEcart', 'ecart'];
    const diffs = [];
    champs.forEach(c => {
      const a = avant ? avant[c] : undefined;
      const b = apres ? apres[c] : undefined;
      if (JSON.stringify(a ?? null) !== JSON.stringify(b ?? null)) diffs.push({ champ: c, avant: a, apres: b });
    });
    if (avant && apres && avant.counts && apres.counts) {
      let n = 0;
      const ids = new Set([...Object.keys(avant.counts || {}), ...Object.keys(apres.counts || {})]);
      ids.forEach(id => { if (JSON.stringify(avant.counts[id] ?? null) !== JSON.stringify(apres.counts[id] ?? null)) n++; });
      if (n > 0) diffs.push({ champ: 'counts', resume: `${n} jeu${n > 1 ? 'x' : ''} de grattage modifié${n > 1 ? 's' : ''}` });
    }
    return diffs;
  }
  function renderHistoriqueAuditFdj() {
    if (!edition.historiqueAudit || !edition.historiqueAudit.length) return '';
    return `
      <div class="champ-sep"></div>
      <div class="section-titre">Historique des corrections</div>
      <div class="card" style="margin-bottom:16px;">
        ${edition.historiqueAudit.map(a => renderEntreeAuditFdj(a)).join('')}
      </div>
    `;
  }
  function renderEntreeAuditFdj(a) {
    const acteur = employesSite.find(e => e.id === a.acteur_id);
    const diffs = diffAuditFdj(a.ancienne_valeur, a.nouvelle_valeur);
    const dateFmt = new Date(a.date_action).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const libelleAction = a.action === 'creation_manager' ? 'Création' : (a.action === 'correction_manager' ? 'Correction' : a.action);
    return `
      <div class="jeu-row">
        <div class="jeu-nom-ligne"><div class="jeu-nom">${libelleAction} — ${dateFmt}</div></div>
        <div class="jeu-ventes" style="margin-bottom:8px;">Par ${acteur ? acteur.nom : 'Manager'}</div>
        ${diffs.length
          ? diffs.map(d => `
            <div class="stat-row" style="border:none; padding:3px 0;">
              <div class="stat-label">${d.resume ? 'Grattage' : (LABELS_AUDIT_FDJ[d.champ] || d.champ)}</div>
              <div class="stat-value" style="font-size:12.5px; text-align:right;">${d.resume ? d.resume : `${formatValeurAuditFdj(d.champ, d.avant)} → ${formatValeurAuditFdj(d.champ, d.apres)}`}</div>
            </div>
          `).join('')
          : '<div class="stat-row" style="border:none; padding:3px 0; color:var(--text-dim); font-size:12px;">Aucun changement de valeur détecté.</div>'
        }
        ${a.motif ? `<div class="champ-note" style="margin:8px 0 0;">Motif : ${labelMotifEcart(a.motif)}</div>` : ''}
      </div>
    `;
  }

  async function chargerJeux() {
    const { data, error } = await nexusClient.from('fdj_games').select('*').eq('site', siteId).eq('actif', true).order('ordre_affichage', { ascending: true });
    if (error) { console.error('Chargement jeux FDJ:', error); return []; }
    return data || [];
  }
  async function chargerEmployesSite() {
    const { data, error } = await nexusClient.from('employees').select('id, nom').eq('site_id', siteId).eq('actif', true).order('nom', { ascending: true });
    if (error) { console.error('Chargement employés site:', error); return []; }
    return data || [];
  }
  function nomEmploye(id) {
    const e = employesSite.find(x => x.id === id);
    return e ? e.nom : '—';
  }
  async function chargerEmplacements() {
    const { data, error } = await nexusClient.from('fdj_locations').select('*').eq('site', siteId).eq('actif', true);
    if (error) { console.error('Chargement emplacements FDJ:', error); return []; }
    return data || [];
  }
  function emplacementParType(type) {
    return emplacements.find(e => e.type === type) || null;
  }
  // Solde confiés/activés/non-activés (09/08/2026, précision de Frédéric :
  // un transfert Bureau → Caisse n'est jamais une activation) — calculé via
  // NexusFdjMoteur.soldesCarnetsParJeu, jamais dupliqué avec l'écran
  // employé. Relit tout l'historique fdj_stock_movements du site : volume
  // faible en V1, à revoir (agrégation serveur) si ça grossit beaucoup.
  async function chargerMouvementsStock() {
    // shift_id ajouté (13/08/2026) : nécessaire à NexusFdjMoteur.approNonTraceParJeu()
    // pour savoir quel mouvement 'activation' couvre quel quart précis.
    const { data, error } = await nexusClient.from('fdj_stock_movements').select('type_mouvement, quantite, game_id, location_source_id, location_destination_id, created_at, shift_id').eq('site', siteId);
    if (error) { console.error('Chargement mouvements stock FDJ:', error); return []; }
    return data || [];
  }

  // ------------------------------------------------------------
  // INVENTAIRE DE RÉFÉRENCE — 09/08/2026, demande de Frédéric : un contrôle
  // physique certifié (Bureau + Caisse non activé) devient le nouveau point
  // zéro du stock. "À compter de cet inventaire, seuls les mouvements
  // postérieurs modifient le stock" — les mouvements déjà enregistrés
  // restent intacts pour leur valeur d'historique (appro, audit), mais le
  // calcul du stock physique confié (bureau/caisse) repart de ce contrôle.
  // ------------------------------------------------------------
  async function chargerDerniereReference() {
    const { data: ref, error: e1 } = await nexusClient.from('fdj_stock_references').select('*').eq('site', siteId).eq('statut', 'valide').order('date', { ascending: false }).order('created_at', { ascending: false }).limit(1).maybeSingle();
    if (e1) { console.error('Chargement référence stock FDJ:', e1); return null; }
    if (!ref) return null;
    const { data: lignes, error: e2 } = await nexusClient.from('fdj_stock_reference_lignes').select('game_id, bureau_reel, caisse_reel').eq('reference_id', ref.id);
    if (e2) { console.error('Chargement lignes référence stock FDJ:', e2); return null; }
    const map = {};
    (lignes || []).forEach(l => { map[l.game_id] = { bureau: l.bureau_reel, caisse: l.caisse_reel }; });
    return { id: ref.id, date: ref.date, type: ref.type, controlePar: ref.controle_par, creeLe: ref.created_at, lignes: map };
  }
  async function soldesActuels() {
    if (!emplacements.length) emplacements = await chargerEmplacements();
    const [mouvements, reference] = await Promise.all([chargerMouvementsStock(), chargerDerniereReference()]);
    const caisse = emplacementParType('caisse');
    const bureau = emplacementParType('bureau');
    const bloque = emplacementParType('bloque');
    return {
      soldes: NexusFdjMoteur.soldesCarnetsAvecReference(mouvements, { caisse: caisse ? caisse.id : null, bureau: bureau ? bureau.id : null, bloque: bloque ? bloque.id : null }, reference),
      reference, mouvements,
    };
  }

  // 13/08/2026 — appro (fdj_shift_counts, compteur TICKETS) saisie sur
  // n'importe quel quart, y compris complété/corrigé après coup sans
  // mouvement de stock correspondant. Consommé par
  // NexusFdjMoteur.approNonTraceParJeu() (filtre appro>0 en interne).
  // 14/08/2026 (refonte lecture managériale) : élargi à TOUTES les lignes
  // (plus seulement appro>0) et à ventes_qte/created_at en plus d'appro —
  // nécessaire à NexusFdjMoteur.ticketsRestantsCarnetEnCours(), qui doit
  // pouvoir sommer les ventes de tickets de n'importe quel quart depuis la
  // dernière activation d'un jeu, pas seulement ceux où de l'appro a été
  // saisie. Volume faible en V1 comme chargerMouvementsStock() — même
  // remarque, à revoir (agrégation serveur) si ça grossit beaucoup.
  async function chargerShiftCountsStock() {
    const { data, error } = await nexusClient.from('fdj_shift_counts').select('shift_id, game_id, appro, ventes_qte, created_at').eq('site', siteId);
    if (error) { console.error('Chargement compteurs de quart FDJ (état du stock):', error); return []; }
    return data || [];
  }
  // 13/08/2026 (v2, refonte État du stock) : date/quart des quarts non
  // tracés, pour afficher "quart(s) concerné(s)" dans le détail dépliable —
  // même esprit que chargerShiftAvecCaisseParId (déjà existante), mais en
  // lot plutôt qu'un id à la fois.
  async function chargerShiftsParIds(ids) {
    if (!ids.length) return {};
    const { data, error } = await nexusClient.from('fdj_shifts').select('id, date, quart').in('id', ids);
    if (error) { console.error('Chargement quarts FDJ (détail rapprochement):', error); return {}; }
    const map = {};
    (data || []).forEach(s => { map[s.id] = s; });
    return map;
  }
  // Date de dernière réception par jeu (§4 Phase A : "règles de date de
  // réception / ancienneté") — max(created_at) des mouvements
  // type='reception', jamais une prétention à connaître l'ordre physique
  // exact d'une pile sans identification individuelle du carnet (§2, §17).
  function derniereReceptionParJeu(mouvements) {
    const map = {};
    (mouvements || []).forEach(m => {
      if (m.type_mouvement !== 'reception') return;
      if (!map[m.game_id] || new Date(m.created_at) > new Date(map[m.game_id])) map[m.game_id] = m.created_at;
    });
    return map;
  }
  function ancienneteJours(dateISOStr) {
    if (!dateISOStr) return null;
    const ms = Date.now() - new Date(dateISOStr).getTime();
    return Math.max(0, Math.floor(ms / 86400000));
  }

  // Soldes négatifs EN DIRECT (09/08/2026, demande de Frédéric : "le solde
  // peut devenir négatif [...] il ne faut surtout pas faire Math.max(0,
  // stock) et cacher le problème [...] cela doit alimenter le manager").
  // Contrairement au panneau "Alertes" (instantané tracé à l'activation,
  // acquittable), cette liste est TOUJOURS recalculée depuis les mouvements
  // bruts — elle reflète l'état actuel, pas un évènement passé, et
  // n'est jamais masquée tant que le solde reste négatif.
  async function calculerSoldesNegatifs() {
    const { soldes } = await soldesActuels();
    return jeux
      .filter(j => (soldes[j.id] || {}).nonActives < 0)
      .map(j => ({ jeu: j, solde: soldes[j.id] }));
  }
  function renderSoldeNegatif({ jeu, solde }) {
    const n = Math.abs(solde.nonActives);
    return `
      <div class="jeu-row">
        <div class="jeu-nom-ligne"><div class="jeu-nom">${jeu.nom}</div></div>
        <div class="histo-sub">${n} activation${n > 1 ? 's' : ''} non reliée${n > 1 ? 's' : ''} à un carnet confié enregistré (solde actuel : <b style="color:var(--red);">${solde.nonActives}</b>).</div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // CHARGEMENT LISTES
  // ------------------------------------------------------------
  // fdj_cash_controls.shift_id porte une contrainte unique (une seule
  // caisse par quart) : PostgREST renvoie donc la ressource imbriquée comme
  // un OBJET, pas un tableau — `s.fdj_cash_controls[0]` valait toujours
  // undefined (bug trouvé le 09/08/2026, Frédéric : caisse réelle et statut
  // toujours vides à l'édition, écart toujours "—" en historique alors que
  // la donnée existait bien en base). Cette fonction gère les deux formes
  // pour rester robuste si PostgREST change de comportement.
  function extraireCash(s) {
    const c = s.fdj_cash_controls;
    if (!c) return null;
    return Array.isArray(c) ? (c[0] || null) : c;
  }
  async function chargerShiftsAvecCaisse(filtreDate) {
    let requete = nexusClient.from('fdj_shifts').select('*, fdj_cash_controls(*)').eq('site', siteId).order('date', { ascending: false }).order('quart', { ascending: false });
    if (filtreDate) requete = requete.eq('date', filtreDate); else requete = requete.limit(30);
    const { data, error } = await requete;
    if (error) { console.error('Chargement quarts FDJ:', error); return []; }
    return (data || []).map(s => ({ ...s, cash: extraireCash(s) }));
  }
  async function chargerShiftAvecCaisseParId(id) {
    const { data, error } = await nexusClient.from('fdj_shifts').select('*, fdj_cash_controls(*)').eq('id', id).maybeSingle();
    if (error) { console.error('Chargement quart FDJ par id:', error); return null; }
    return data ? { ...data, cash: extraireCash(data) } : null;
  }

  // Stock initial hérité (09/08/2026, demande de Frédéric) : même chaînage
  // que l'écran employé (stock_final du quart juste avant celui édité),
  // mais sans exiger que ce quart précédent soit "validé" — le manager
  // travaille parfois sur un quart encore en brouillon — et une case vide
  // y vaut directement 0, sans confirmation (le manager a déjà toute la
  // vue d'ensemble, contrairement à l'employé côté NEXUS-FDJ-v1.html).
  async function chargerStockInitialHerite(date, quart) {
    const { data: prevShift, error: e1 } = await nexusClient.from('fdj_shifts')
      .select('id').eq('site', siteId)
      .or(`date.lt.${date},and(date.eq.${date},quart.lt.${quart})`)
      .order('date', { ascending: false }).order('quart', { ascending: false }).limit(1).maybeSingle();
    if (e1) { console.error('Quart FDJ précédent (manager):', e1); return {}; }
    if (!prevShift) return {};
    const { data: counts, error: e2 } = await nexusClient.from('fdj_shift_counts').select('game_id, stock_final').eq('shift_id', prevShift.id);
    if (e2) { console.error('Comptage précédent FDJ (manager):', e2); return {}; }
    const parGame = {};
    (counts || []).forEach(c => { parGame[c.game_id] = c.stock_final; });
    const map = {};
    jeux.forEach(j => { map[j.id] = parGame[j.id] ?? 0; }); // case vide -> 0 automatique
    return map;
  }

  // Ne réapplique le préremplissage que sur les cases encore vides ou déjà
  // auto-remplies (edition.stockInitialAuto) — ne jamais écraser une valeur
  // que le manager a tapée lui-même, même si la date/quart change ensuite.
  async function reprefillStockInitial() {
    const herite = await chargerStockInitialHerite(edition.date, edition.quart);
    jeux.forEach(j => {
      if (!edition.counts[j.id]) edition.counts[j.id] = { stock_initial: null, appro: 0, stock_final: null };
      const vide = edition.counts[j.id].stock_initial === null || edition.counts[j.id].stock_initial === undefined;
      if (vide || edition.stockInitialAuto[j.id]) {
        edition.counts[j.id].stock_initial = herite[j.id] ?? 0;
        edition.stockInitialAuto[j.id] = true;
      }
    });
  }

  // ------------------------------------------------------------
  // ALERTES — un panneau, deux origines. "stock_initial_modifie" : un
  // employé a corrigé un stock initial hérité du quart précédent, ce qui
  // remet en cause le stock final de ce quart précédent (09/08/2026).
  // "activation_sans_carnet_confie" : un employé a activé un carnet sans
  // qu'aucun solde non-activé ne soit enregistré en caisse — exception
  // tracée avec motif choisi, jamais un simple confirm() local (09/08/2026,
  // demande de Frédéric : "NEXUS crée automatiquement une alerte"). Chaque
  // alerte disparaît des yeux du manager dès qu'il la marque comme vue —
  // ce qui éteint aussi le point rouge sur "Contrôle FDJ" en vue bureau.
  // ------------------------------------------------------------
  async function chargerAlertesNonVues() {
    const { data, error } = await nexusClient.from('fdj_alertes').select('*').eq('site', siteId).eq('vue', false).order('created_at', { ascending: false });
    if (error) { console.error('Chargement alertes FDJ:', error); return []; }
    if (!data || !data.length) return [];
    const shiftIds = [...new Set(data.flatMap(a => [a.shift_id, a.shift_precedent_id]).filter(Boolean))];
    const { data: shiftsRows, error: eShifts } = await nexusClient.from('fdj_shifts').select('id, date, quart').in('id', shiftIds);
    if (eShifts) console.error('Chargement quarts liés aux alertes FDJ:', eShifts);
    const shiftsMap = Object.fromEntries((shiftsRows || []).map(s => [s.id, s]));
    return data.map(a => ({ ...a, quartActuel: shiftsMap[a.shift_id], quartPrecedent: a.shift_precedent_id ? shiftsMap[a.shift_precedent_id] : null }));
  }
  function nomJeu(gameId) {
    const j = jeux.find(x => x.id === gameId);
    return j ? j.nom : '—';
  }
  function libelleQuart(s) {
    return s ? `${new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR')} · Quart ${s.quart}` : '—';
  }

  // 13/08/2026 — "Règle d'accès aux quarts FDJ V1" : verrous du jour posés
  // sur fdj_employee_shift_locks (dès qu'un employé a validé son stock de
  // départ, il est verrouillé sur ce quart pour la journée — voir
  // NEXUS-FDJ-v1.html::validerOuverture). Ce panneau donne au manager la
  // seule porte de sortie prévue par la règle (exigence #5) : une dérogation
  // tracée, jamais une modification silencieuse.
  async function chargerVerrousJour() {
    const { data, error } = await nexusClient.from('fdj_employee_shift_locks').select('*')
      .eq('site', siteId).eq('date_service', dateISO()).order('locked_at', { ascending: false });
    if (error) { console.error('Chargement verrous quart FDJ du jour:', error); return []; }
    return data || [];
  }
  function renderVerrouJour(v) {
    const autreQuart = v.quart === '1' ? '2' : '1';
    const origine = v.source_lock === 'override_manager'
      ? `Dérogation manager${v.override_motif ? ` — ${labelMotifDerogationQuart(v.override_motif)}` : ''}`
      : 'Validation du stock de départ';
    return `
      <div class="jeu-row" data-verrou="${v.id}" style="padding:12px 14px;">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">🔒 ${nomEmploye(v.employee_id)} — Quart ${v.quart}</div>
        </div>
        <div class="histo-sub" style="margin-bottom:8px;">
          ${origine} · ${new Date(v.locked_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn-modifier" data-deroger="${v.id}" data-autre-quart="${autreQuart}" style="margin-top:0; flex:1;">Déroger vers Quart ${autreQuart}</button>
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // DÉROGATION MANAGER — exigence #5 de la règle d'accès aux quarts : la
  // seule façon de faire passer un employé déjà verrouillé vers l'autre
  // quart. Ne touche jamais fdj_shifts/fdj_shift_counts (ce n'est pas une
  // correction de comptage, seulement un déplacement du verrou) — pour ça,
  // enregistrerEdition() reste le bon écran, et il n'est pas concerné par le
  // verrou (exigence #6, corrections historiques manager toujours autorisées).
  // ------------------------------------------------------------
  async function ouvrirDerogationQuart(verrouId, autreQuart) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    const { data: v, error } = await nexusClient.from('fdj_employee_shift_locks').select('*').eq('id', verrouId).single();
    if (error || !v) { console.error('Lecture verrou avant dérogation:', error); alert('Erreur — réessayez.'); renderAccueil(); return; }
    derogation = { verrouId: v.id, employeeId: v.employee_id, quartActuel: v.quart, autreQuart, motif: '' };
    vue = 'derogation';
    renderDerogationQuart();
  }

  function renderDerogationQuart() {
    document.getElementById('titre').textContent = 'Dérogation — changement de quart';
    document.getElementById('sousTitre').textContent = "Toute exception au verrou d'un employé doit être tracée avec un motif.";
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourDerogation">← Retour</button>
      <div class="etat-banner" style="text-align:left;">
        <b style="color:var(--text);">${nomEmploye(derogation.employeeId)}</b> est actuellement verrouillé sur le
        <b style="color:var(--text);">Quart ${derogation.quartActuel}</b> pour aujourd'hui.<br>
        Cette dérogation le fera passer sur le <b style="color:var(--cyan);">Quart ${derogation.autreQuart}</b> — le Quart ${derogation.quartActuel} lui redeviendra inaccessible sans une nouvelle dérogation.
      </div>
      <label class="champ-label">Motif de la dérogation</label>
      <select class="champ-select" id="champMotifDerogation" style="margin-bottom:16px;">
        ${MOTIFS_DEROGATION_QUART.map(m => `<option value="${m.value}" ${m.value === derogation.motif ? 'selected' : ''}>${m.label}</option>`).join('')}
      </select>
      <button class="btn-primary" id="btnConfirmerDerogation">Confirmer la dérogation</button>
      <button class="btn-ghost" id="btnAnnulerDerogation">Annuler</button>
    `;
    document.getElementById('btnRetourDerogation').addEventListener('click', () => { vue = 'liste'; derogation = null; renderAccueil(); });
    document.getElementById('btnAnnulerDerogation').addEventListener('click', () => { vue = 'liste'; derogation = null; renderAccueil(); });
    document.getElementById('champMotifDerogation').addEventListener('change', e => { derogation.motif = e.target.value; });
    document.getElementById('btnConfirmerDerogation').addEventListener('click', enregistrerDerogationQuart);
  }

  async function enregistrerDerogationQuart() {
    if (!derogation.motif) { alert('Un motif est obligatoire pour tracer la dérogation.'); return; }
    const btn = document.getElementById('btnConfirmerDerogation');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    const { data: verrouAvant } = await nexusClient.from('fdj_employee_shift_locks').select('quart, source_lock').eq('id', derogation.verrouId).single();

    // La policy RLS "ecriture_fdj_employee_shift_locks_manager" exige
    // exactement ces 3 champs ensemble (source_lock='override_manager' +
    // override_manager_id=auth.uid()) — c'est elle, pas ce code, qui fait
    // vraiment autorité sur "seul un manager peut déroger" (voir migration
    // fdj_employee_shift_locks).
    const { error } = await nexusClient.from('fdj_employee_shift_locks').update({
      quart: derogation.autreQuart, source_lock: 'override_manager',
      override_manager_id: managerCourant.id, override_motif: derogation.motif,
      locked_at: new Date().toISOString(),
    }).eq('id', derogation.verrouId);
    if (error) {
      console.error('Dérogation quart FDJ:', error);
      btn.disabled = false; btn.textContent = 'Confirmer la dérogation';
      alert("Erreur d'enregistrement de la dérogation. Réessayez.");
      return;
    }

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, entite_type: 'fdj_employee_shift_lock', entite_id: derogation.verrouId,
      action: 'derogation_manager', acteur_id: managerCourant.id, motif: derogation.motif,
      ancienne_valeur: verrouAvant || { quart: derogation.quartActuel, source_lock: null },
      nouvelle_valeur: { quart: derogation.autreQuart, source_lock: 'override_manager', override_manager_id: managerCourant.id, override_motif: derogation.motif },
    });

    vue = 'liste'; derogation = null;
    renderAccueil();
  }

  function renderAlerte(a) {
    if (a.type === 'activation_sans_carnet_confie') return renderAlerteActivationSansCarnet(a);
    if (a.type === 'chaine_interrompue') return renderAlerteChaineInterrompue(a);

  function renderAlerteStock(a) {

          <button type="button" class="btn-modifier" data-vue="${a.id}" style="margin-top:0; flex:1; color:var(--text-mid); border-color:var(--hairline);">Marquer comme vue</button>

  // ------------------------------------------------------------
  // CONFIANCE DE LA CHAÎNE — Fiabilisation FDJ Étape 1 (13/08/2026, audit de
  // cadrage "NEXUS_FDJ_Audit_Fiabilisation_Chaine_Quarts.pdf", §14). Compose
  // NexusFdjMoteur.etatIntegriteFdj à partir de ce que cet écran a déjà
  // chargé (previous_shift_id, a_revoir, statut de fdj_cash_controls) —
  // aucune nouvelle requête. `ensemble` : liste de quarts déjà chargée
  // (chargerShiftsAvecCaisse), utilisée uniquement pour reconnaître le tout
  // premier quart connu du site (previous_shift_id vide n'est alors pas une
  // rupture, juste "il n'y a rien avant").
  function premierQuartConnu(ensemble) {
    if (!ensemble || !ensemble.length) return null;
    return ensemble.reduce((plusAncien, s) => {
      if (!plusAncien) return s;
      return (s.date < plusAncien.date || (s.date === plusAncien.date && s.quart < plusAncien.quart)) ? s : plusAncien;
    }, null);
  }
  function calculerIntegriteQuart(s, ensemble) {
    if (!s) return null;
    const premier = premierQuartConnu(ensemble);
    const rompue = s.previous_shift_id == null && !(premier && premier.id === s.id);
    const validationManagerFaite = s.statut !== 'valide' ? null : (s.cash ? s.cash.statut !== 'provisoire' : false);
    return NexusFdjMoteur.etatIntegriteFdj({ rompue, aRevoir: !!s.a_revoir, validationManagerFaite });
  }
  function badgeIntegrite(etat) {
    if (!etat) return '';
    const libelles = { OK: '🟢 Chaîne fiable', PARTIELLE: '🟠 Chaîne partielle', ROMPUE: '🔴 Chaîne interrompue' };
    const classes = { OK: 'green', PARTIELLE: 'amber', ROMPUE: 'red' };
    return `<span class="badge-integrite stat-value ${classes[etat.integrite]}" style="font-size:9px; font-family:var(--mono); letter-spacing:0.03em;">${libelles[etat.integrite]}</span>`;
  }

  function renderCarteQuartJour(quart, shift, ensemble) {
    if (!shift) return `<div class="quart-jour-card" id="carteQuart${quart}"><div class="quart-jour-label">Quart ${quart}</div><div class="quart-jour-statut" style="color:var(--text-dim);">Non compté</div></div>`;
    const ecart = shift.cash ? shift.cash.ecart : null;
    const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const integrite = calculerIntegriteQuart(shift, ensemble);
    return `
      <div class="quart-jour-card" id="carteQuart${quart}">
        <div class="quart-jour-label">Quart ${quart}</div>
        <div class="quart-jour-statut">${nomEmploye(shift.employee_id)}</div>
        <div class="quart-jour-ecart ${classe ? `stat-value ${classe}` : ''}">${ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : shift.statut === 'valide' ? 'Validé' : 'Brouillon'}</div>
        ${integrite && integrite.integrite !== 'OK' ? `<div style="margin-top:5px;">${badgeIntegrite(integrite)}</div>` : ''}
      </div>
    `;
  }

  function renderHistoItem(s, i, ensemble) {
    const ecart = s.cash ? s.cash.ecart : null;
    const classe = ecart === null ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
    const integrite = calculerIntegriteQuart(s, ensemble);
    return `
      <div class="histo-item" data-idx="${i}">
        <div class="histo-top">
          <div>
            <div class="histo-date">${new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR')} <span style="color:var(--text-mid); font-weight:400;">· Quart ${s.quart}</span></div>
            <div class="histo-sub">${nomEmploye(s.employee_id)}</div>
          </div>
          <div style="text-align:right;">
            <div class="histo-ecart ${classe}">${ecart !== null ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div>
            <div style="margin-top:4px;"><span class="statut-badge ${s.cash ? s.cash.statut : s.statut}">${s.cash ? labelStatutCaisse(s.cash.statut) : (s.statut === 'valide' ? 'Validé' : 'Brouillon')}</span></div>
            ${integrite && integrite.integrite !== 'OK' ? `<div style="margin-top:4px;">${badgeIntegrite(integrite)}</div>` : ''}
          </div>
        </div>
        <div class="histo-detail" id="detail-${i}">
          ${s.cash ? `
            <div class="stat-row"><div class="stat-label">Caisse grattage</div><div class="stat-value">${fmtEuro(s.cash.caisse_grattage)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse tirages</div><div class="stat-value">${fmtEuro(s.cash.caisse_tirages)}</div></div>
            <div class="stat-row"><div class="stat-label">Régularisations</div><div class="stat-value">${fmtEuro(s.cash.regularisations)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse attendue</div><div class="stat-value cyan">${fmtEuro(s.cash.caisse_attendue)}</div></div>
            <div class="stat-row"><div class="stat-label">Caisse réelle</div><div class="stat-value">${fmtEuro(s.cash.caisse_reelle)}</div></div>
            ${s.cash.motif_ecart ? `<div class="stat-row"><div class="stat-label">Motif</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${s.cash.motif_ecart}</div></div>` : ''}
          ` : '<div class="empty">Pas encore de rapprochement caisse pour ce quart.</div>'}
          <button type="button" class="btn-modifier" data-idx="${i}">✏️ Modifier ce quart</button>
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // RÉAPPROVISIONNER LA CAISSE — Bureau → Caisse, "non activé". 09/08/2026,
  // précision de Frédéric : ce transfert n'est PAS une activation. Le
  // carnet reste sous contrôle, non engagé financièrement, tant que la
  // caissière ne l'a pas activé explicitement (voir "Activer un carnet"
  // côté NEXUS-FDJ-v1.html). Donc ici : aucun impact sur l'appro, aucun
  // shift_id — juste un déplacement physique Bureau → Caisse tracé dans
  // fdj_stock_movements(type_mouvement='transfert').
  //
  // UX stepper (09/08/2026, demande de Frédéric) : remplace l'ancien champ
  // numérique libre par des boutons − / + et des raccourcis +1/+2 carnets,
  // avec affichage immédiat de la valeur — vocabulaire volontairement
  // distinct de "Valeur activée" pour ne jamais confondre exposition
  // physique (carnets confiés) et engagement financier FDJ (carnets activés,
  // toujours 0 € à ce stade puisqu'un transfert n'active jamais rien).
  // ------------------------------------------------------------
  async function ouvrirReappro() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes } = await soldesActuels();
    reappro = { soldes, quantites: {} };
    vue = 'reappro';
    renderReappro();
  }

  function renderReappro() {
    document.getElementById('titre').textContent = 'Réapprovisionner la caisse';
    document.getElementById('sousTitre').textContent = 'Bureau → Caisse. Les carnets confiés restent non activés — aucun impact sur l\'appro tant qu\'ils ne sont pas activés en caisse.';
    const groupes = grouperParPalier(jeux);
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourReappro">← Retour</button>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuReappro(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnConfirmerReappro">Confirmer le réapprovisionnement</button>
      <button class="btn-ghost" id="btnAnnulerReappro">Annuler</button>
    `;
    document.getElementById('btnRetourReappro').addEventListener('click', () => { vue = 'liste'; reappro = null; renderAccueil(); });
    document.getElementById('btnAnnulerReappro').addEventListener('click', () => { vue = 'liste'; reappro = null; renderAccueil(); });
    document.querySelectorAll('[data-moins]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.moins, -1)));
    document.querySelectorAll('[data-plus]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.plus, 1)));
    document.querySelectorAll('[data-raccourci]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReappro(btn.dataset.raccourci, parseInt(btn.dataset.inc, 10))));
    document.getElementById('btnConfirmerReappro').addEventListener('click', enregistrerReappro);
  }

  function renderJeuReappro(jeu) {
    const solde = (reappro.soldes[jeu.id]) || { confies: 0, actives: 0, nonActives: 0 };
    const qte = reappro.quantites[jeu.id] || 0;
    const ticketsParCarnet = (jeu.tickets_par_carnet !== null && jeu.tickets_par_carnet !== undefined) ? Number(jeu.tickets_par_carnet) : null;
    const valeurParCarnet = ticketsParCarnet ? ticketsParCarnet * Number(jeu.prix) : null;
    return `
      <div class="jeu-row">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${solde.nonActives <= 0 ? 'anomalie' : 'calc'}">${solde.nonActives} non activé${Math.abs(solde.nonActives) > 1 ? 's' : ''} en caisse</div>
        </div>
        <div class="jeu-input-label" style="text-align:center;">Carnets à transférer</div>
        <div class="stepper-qte">
          <button type="button" class="btn-stepper" data-moins="${jeu.id}">−</button>
          <div class="stepper-valeur" id="qte-${jeu.id}">${qte}</div>
          <button type="button" class="btn-stepper" data-plus="${jeu.id}">+</button>
        </div>
        <div class="raccourcis-qte">
          <button type="button" class="btn-raccourci" data-raccourci="${jeu.id}" data-inc="1">+1 carnet</button>
          <button type="button" class="btn-raccourci" data-raccourci="${jeu.id}" data-inc="2">+2 carnets</button>
        </div>
        <div class="valeur-carnets" id="valeur-${jeu.id}">${renderValeurReappro(qte, ticketsParCarnet, valeurParCarnet)}</div>
      </div>
    `;
  }

  // Vocabulaire imposé par Frédéric : "Valeur des carnets confiés" (X €,
  // exposition physique) ≠ "Valeur activée" (toujours 0 € ici — un
  // transfert Bureau → Caisse n'active jamais rien, voir plus haut).
  function renderValeurReappro(qte, ticketsParCarnet, valeurParCarnet) {
    if (!qte) return `Valeur des carnets confiés : <b>0 €</b> · <span class="activee">Valeur activée : 0 €</span>`;
    const tickets = ticketsParCarnet ? qte * ticketsParCarnet : null;
    const valeur = valeurParCarnet ? qte * valeurParCarnet : null;
    return `Valeur des carnets confiés : <b>${valeur !== null ? fmtEuro(valeur) : '—'}</b>${tickets !== null ? ` (${tickets} tickets potentiels)` : ''} · <span class="activee">Valeur activée : 0 €</span>`;
  }

  function ajusterQuantiteReappro(gameId, delta) {
    const actuel = reappro.quantites[gameId] || 0;
    const nouveau = Math.max(0, actuel + delta);
    reappro.quantites[gameId] = nouveau;
    const jeu = jeux.find(j => j.id === gameId);
    const ticketsParCarnet = (jeu && jeu.tickets_par_carnet !== null && jeu.tickets_par_carnet !== undefined) ? Number(jeu.tickets_par_carnet) : null;
    const valeurParCarnet = (jeu && ticketsParCarnet) ? ticketsParCarnet * Number(jeu.prix) : null;
    const qteEl = document.getElementById(`qte-${gameId}`);
    if (qteEl) qteEl.textContent = nouveau;
    const valeurEl = document.getElementById(`valeur-${gameId}`);
    if (valeurEl) valeurEl.innerHTML = renderValeurReappro(nouveau, ticketsParCarnet, valeurParCarnet);
  }

  async function enregistrerReappro() {
    const btn = document.getElementById('btnConfirmerReappro');
    const bureau = emplacementParType('bureau');
    const caisse = emplacementParType('caisse');
    const lignes = Object.entries(reappro.quantites)
      .filter(([, qte]) => qte > 0)
      .map(([gameId, qte]) => ({
        site: siteId, game_id: gameId, type_mouvement: 'transfert', quantite: qte,
        location_source_id: bureau ? bureau.id : null, location_destination_id: caisse ? caisse.id : null,
        methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
        justification: `Réapprovisionnement caisse — carnets non activés (manager).`,
      }));
    if (!lignes.length) { alert('Indiquez au moins un jeu avec une quantité à transférer.'); return; }
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const { error } = await nexusClient.from('fdj_stock_movements').insert(lignes);
    if (error) { console.error('Réapprovisionnement caisse FDJ:', error); btn.disabled = false; btn.textContent = 'Confirmer le réapprovisionnement'; alert("Erreur d'enregistrement. Réessayez."); return; }
    vue = 'liste'; reappro = null;
    renderAccueil();
  }

  // ------------------------------------------------------------
  // INVENTAIRE DE RÉFÉRENCE FDJ — 09/08/2026, demande de Frédéric : "Ce
  // relevé constitue le premier état physique certifié du stock de carnets
  // non activés [...] les mouvements racontent ce qui aurait dû se passer ;
  // le contrôle physique établit ce qui existe réellement." Compare, jeu
  // par jeu, le stock théorique (issu des mouvements depuis le dernier
  // point zéro) au comptage physique réel saisi ici. Valider ce contrôle
  // crée une nouvelle ligne fdj_stock_references (type='recomptage') qui
  // devient le nouveau point zéro — les mouvements antérieurs restent dans
  // l'historique mais n'influencent plus le calcul du stock physique.
  // ------------------------------------------------------------
  async function ouvrirInventaireRef() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes, reference } = await soldesActuels();
    const saisie = {};
    jeux.forEach(j => {
      const s = soldes[j.id] || { bureau: 0, confies: 0 };
      saisie[j.id] = { bureau: s.bureau, caisse: s.confies };
    });
    inventaireRef = { derniereReference: reference, soldesTheoriques: soldes, saisie };
    vue = 'inventaire-ref';
    renderInventaireRef();
  }

  function statutInventaireLigne(theoBureau, theoCaisse, reelBureau, reelCaisse) {
    const ecartBureau = Number(reelBureau) - Number(theoBureau);
    const ecartCaisse = Number(reelCaisse) - Number(theoCaisse);
    if (ecartBureau === 0 && ecartCaisse === 0) return { classe: 'green', texte: '🟢 Conforme' };
    const n = Math.abs(ecartBureau) + Math.abs(ecartCaisse);
    return { classe: 'amber', texte: `🟠 Écart de ${n} carnet${n > 1 ? 's' : ''} à expliquer` };
  }

  function renderInventaireRef() {
    document.getElementById('titre').textContent = 'Inventaire de référence FDJ';
    document.getElementById('sousTitre').textContent = 'Comptage physique réel — Bureau et Caisse non activé. Valider ce contrôle devient le nouveau point zéro du stock.';
    const ref = inventaireRef.derniereReference;
    const groupes = grouperParPalier(jeux);
    let totalTheoBureau = 0, totalTheoCaisse = 0, totalReelBureau = 0, totalReelCaisse = 0;
    jeux.forEach(j => {
      const theo = inventaireRef.soldesTheoriques[j.id] || { bureau: 0, confies: 0 };
      const s = inventaireRef.saisie[j.id];
      totalTheoBureau += Number(theo.bureau) || 0; totalTheoCaisse += Number(theo.confies) || 0;
      totalReelBureau += Number(s.bureau) || 0; totalReelCaisse += Number(s.caisse) || 0;
    });
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourInventaireRef">← Retour</button>
      ${ref ? `<div class="champ-note" style="margin-top:-4px;">Dernier point zéro : ${new Date(ref.date + 'T00:00:00').toLocaleDateString('fr-FR')} (${ref.type === 'initialisation' ? 'initialisation' : 'recomptage'}).</div>` : `<div class="champ-note" style="margin-top:-4px;">Aucun contrôle physique enregistré pour l'instant — le stock théorique part de zéro.</div>`}
      <div class="resume-card">
        <div class="stat-row"><div class="stat-label">Théorique (Bureau + Caisse)</div><div class="stat-value">${fmtNum(totalTheoBureau)} + ${fmtNum(totalTheoCaisse)} = ${fmtNum(totalTheoBureau + totalTheoCaisse)}</div></div>
        <div class="stat-row total"><div class="stat-label">Comptage réel (Bureau + Caisse)</div><div class="stat-value cyan">${fmtNum(totalReelBureau)} + ${fmtNum(totalReelCaisse)} = ${fmtNum(totalReelBureau + totalReelCaisse)}</div></div>
      </div>
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuInventaireRef(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnValiderInventaireRef">Valider ce contrôle</button>
      <button class="btn-ghost" id="btnAnnulerInventaireRef">Annuler</button>
    `;
    document.getElementById('btnRetourInventaireRef').addEventListener('click', () => { vue = 'liste'; inventaireRef = null; renderAccueil(); });
    document.getElementById('btnAnnulerInventaireRef').addEventListener('click', () => { vue = 'liste'; inventaireRef = null; renderAccueil(); });
    wireInventaireRefInputs();
    document.getElementById('btnValiderInventaireRef').addEventListener('click', validerInventaireRef);
  }

  function renderJeuInventaireRef(jeu) {
    const theo = inventaireRef.soldesTheoriques[jeu.id] || { bureau: 0, confies: 0 };
    const s = inventaireRef.saisie[jeu.id];
    const statut = statutInventaireLigne(theo.bureau, theo.confies, s.bureau, s.caisse);
    return `
      <div class="jeu-row" data-jeu-invref="${jeu.id}">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes ${statut.classe === 'amber' ? 'anomalie' : 'calc'}" id="statut-invref-${jeu.id}">${statut.texte}</div>
        </div>
        <div class="jeu-inputs">
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Théo. Bureau</div>
            <div class="champ-readonly" style="text-align:center; padding:8px 4px; font-size:13px;">${fmtNum(theo.bureau)}</div>
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Réel Bureau</div>
            <input type="number" inputmode="numeric" min="0" step="1" class="jeu-input champ-invref" data-jeu="${jeu.id}" data-champ="bureau" value="${s.bureau ?? 0}">
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Théo. Caisse</div>
            <div class="champ-readonly" style="text-align:center; padding:8px 4px; font-size:13px;">${fmtNum(theo.confies)}</div>
          </div>
          <div class="jeu-input-wrap">
            <div class="jeu-input-label">Réel Caisse</div>
            <input type="number" inputmode="numeric" min="0" step="1" class="jeu-input champ-invref" data-jeu="${jeu.id}" data-champ="caisse" value="${s.caisse ?? 0}">
          </div>
        </div>
      </div>
    `;
  }

  function wireInventaireRefInputs() {
    document.querySelectorAll('.champ-invref').forEach(input => {
      input.addEventListener('input', () => {
        const gameId = input.dataset.jeu, champ = input.dataset.champ;
        const val = input.value === '' ? 0 : Number(input.value);
        inventaireRef.saisie[gameId][champ] = val;
        const theo = inventaireRef.soldesTheoriques[gameId] || { bureau: 0, confies: 0 };
        const s = inventaireRef.saisie[gameId];
        const statut = statutInventaireLigne(theo.bureau, theo.confies, s.bureau, s.caisse);
        const statutEl = document.getElementById(`statut-invref-${gameId}`);
        if (statutEl) { statutEl.textContent = statut.texte; statutEl.className = `jeu-ventes ${statut.classe === 'amber' ? 'anomalie' : 'calc'}`; }
      });
    });
  }

  async function validerInventaireRef() {
    const btn = document.getElementById('btnValiderInventaireRef');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';

    const { data: ref, error: eRef } = await nexusClient.from('fdj_stock_references').insert({
      site: siteId, date: dateISO(), controle_par: managerCourant.id, type: 'recomptage', statut: 'valide',
    }).select().single();
    if (eRef) { console.error('Création inventaire de référence FDJ:', eRef); btn.disabled = false; btn.textContent = 'Valider ce contrôle'; alert("Erreur d'enregistrement. Réessayez."); return; }

    const lignes = jeux.map(j => {
      const theo = inventaireRef.soldesTheoriques[j.id] || { bureau: 0, confies: 0 };
      const s = inventaireRef.saisie[j.id];
      return {
        site: siteId, reference_id: ref.id, game_id: j.id,
        bureau_reel: s.bureau || 0, caisse_reel: s.caisse || 0,
        stock_theorique_bureau_avant: theo.bureau, stock_theorique_caisse_avant: theo.confies,
      };
    });
    const { error: eLignes } = await nexusClient.from('fdj_stock_reference_lignes').insert(lignes);
    if (eLignes) { console.error('Enregistrement lignes inventaire de référence FDJ:', eLignes); btn.disabled = false; btn.textContent = 'Valider ce contrôle'; alert("Erreur d'enregistrement des lignes. Réessayez."); return; }

    await nexusClient.from('fdj_audit_log').insert({
      site: siteId, shift_id: null, entite_type: 'fdj_stock_reference', entite_id: ref.id,
      action: 'inventaire_reference_valide', acteur_id: managerCourant.id,
      nouvelle_valeur: { date: ref.date, lignes: lignes.map(l => ({ game_id: l.game_id, bureau_reel: l.bureau_reel, caisse_reel: l.caisse_reel, ecart_bureau: l.bureau_reel - (l.stock_theorique_bureau_avant || 0), ecart_caisse: l.caisse_reel - (l.stock_theorique_caisse_avant || 0) })) },
    });

    vue = 'liste'; inventaireRef = null;
    renderAccueil();
  }

  // ------------------------------------------------------------
  // RÉCEPTIONNER UNE LIVRAISON FDJ — 09/08/2026, audit "Moteur de
  // clairvoyance manager" (§3, §43) : nouvel événement distinct du
  // réapprovisionnement caisse et de l'activation. Transporteur → Bureau,
  // toujours non activé, aucun impact sur l'appro tickets — seule
  // l'activation en caisse déclenche ça (voir NEXUS-FDJ-v1.html).
  // ------------------------------------------------------------
  async function ouvrirReception() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const { soldes } = await soldesActuels();
    reception = { soldes, quantites: {}, source: '' };
    vue = 'reception';
    renderReception();
  }

  function renderReception() {
    document.getElementById('titre').textContent = 'Réceptionner une livraison FDJ';
    document.getElementById('sousTitre').textContent = 'Transporteur → Bureau. Toujours non activé, aucun impact sur l\'appro tickets.';
    const groupes = grouperParPalier(jeux);
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourReception">← Retour</button>
      <label class="champ-label">Provenance (transporteur, n° de bon de livraison…) — optionnel</label>
      <input type="text" class="champ-input" id="champSourceReception" value="${reception.source}" placeholder="Ex. Transporteur X, BL n°12345" style="margin-bottom:16px;">
      ${groupes.map(g => `
        <div class="palier-block">
          <div class="palier-head">${fmtNum(g.prix)} €</div>
          <div class="card">${g.items.map(j => renderJeuReception(j)).join('')}</div>
        </div>
      `).join('')}
      <button class="btn-primary" id="btnConfirmerReception">Confirmer la réception</button>
      <button class="btn-ghost" id="btnAnnulerReception">Annuler</button>
    `;
    document.getElementById('btnRetourReception').addEventListener('click', () => { vue = 'liste'; reception = null; renderAccueil(); });
    document.getElementById('btnAnnulerReception').addEventListener('click', () => { vue = 'liste'; reception = null; renderAccueil(); });
    document.getElementById('champSourceReception').addEventListener('input', e => { reception.source = e.target.value; });
    document.querySelectorAll('[data-moins-r]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReception(btn.dataset.moinsR, -1)));
    document.querySelectorAll('[data-plus-r]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReception(btn.dataset.plusR, 1)));
    document.querySelectorAll('[data-raccourci-r]').forEach(btn => btn.addEventListener('click', () => ajusterQuantiteReception(btn.dataset.raccourciR, parseInt(btn.dataset.inc, 10))));
    document.getElementById('btnConfirmerReception').addEventListener('click', enregistrerReception);
  }

  function renderJeuReception(jeu) {
    const theo = (reception.soldes[jeu.id] || {}).bureau || 0;
    const qte = reception.quantites[jeu.id] || 0;
    return `
      <div class="jeu-row">
        <div class="jeu-nom-ligne">
          <div class="jeu-nom">${jeu.nom}</div>
          <div class="jeu-ventes">${fmtNum(theo)} au bureau actuellement</div>
        </div>
        <div class="jeu-input-label" style="text-align:center;">Carnets reçus</div>
        <div class="stepper-qte">
          <button type="button" class="btn-stepper" data-moins-r="${jeu.id}">−</button>
          <div class="stepper-valeur" id="qte-r-${jeu.id}">${qte}</div>
          <button type="button" class="btn-stepper" data-plus-r="${jeu.id}">+</button>
        </div>
        <div class="raccourcis-qte">
          <button type="button" class="btn-raccourci" data-raccourci-r="${jeu.id}" data-inc="1">+1 carnet</button>
          <button type="button" class="btn-raccourci" data-raccourci-r="${jeu.id}" data-inc="5">+5 carnets</button>
        </div>
      </div>
    `;
  }

  function ajusterQuantiteReception(gameId, delta) {
    const nouveau = Math.max(0, (reception.quantites[gameId] || 0) + delta);
    reception.quantites[gameId] = nouveau;
    const el = document.getElementById(`qte-r-${gameId}`);
    if (el) el.textContent = nouveau;
  }

  async function enregistrerReception() {
    const btn = document.getElementById('btnConfirmerReception');
    const bureau = emplacementParType('bureau');
    const lignes = Object.entries(reception.quantites)
      .filter(([, qte]) => qte > 0)
      .map(([gameId, qte]) => ({
        site: siteId, game_id: gameId, type_mouvement: 'reception', quantite: qte,
        location_source_id: null, location_destination_id: bureau ? bureau.id : null,
        methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
        source: reception.source || null,
        justification: `Réception FDJ (manager)${reception.source ? ` — ${reception.source}` : ''}.`,
      }));
    if (!lignes.length) { alert('Indiquez au moins un jeu avec une quantité reçue.'); return; }
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const { error } = await nexusClient.from('fdj_stock_movements').insert(lignes);
    if (error) { console.error('Réception FDJ:', error); btn.disabled = false; btn.textContent = 'Confirmer la réception'; alert("Erreur d'enregistrement. Réessayez."); return; }
    vue = 'liste'; reception = null;
    renderAccueil();
  }

  // ------------------------------------------------------------
  // ÉTAT DU STOCK FDJ — 09/08/2026, audit "Moteur de clairvoyance manager"
  // (§44) : Bureau / Caisse non activé / Activés (depuis le point zéro) /
  // dernière réception / état, jeu par jeu. Les chiffres viennent
  // exclusivement des mouvements et du dernier contrôle physique — jamais
  // codés en dur. Inclut les retraits/blocages en cours (§18, gestion par
  // exception : rien à afficher tant qu'il n'y en a pas).
  // ------------------------------------------------------------
  async function ouvrirStockEtat() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const [{ soldes, reference, mouvements }, shiftCountsStock] = await Promise.all([soldesActuels(), chargerShiftCountsStock()]);
    const referenceCreeLe = reference ? reference.creeLe : null;
    // 13/08/2026 (v2, refonte) : détail par quart (pas seulement le total)
    // pour afficher "quart(s) concerné(s)" au clic — même fonction moteur
    // que le total (Article 11), juste consommée à un niveau plus fin.
    // 14/08/2026 : referenceCreeLe transmis pour exclure du rapprochement
    // tout ce qui est antérieur au dernier point zéro certifié — déjà
    // absorbé dans le stock physique recertifié, ne doit plus polluer la
    // vue opérationnelle (demande de Frédéric, capture d'écran commentée).
    const lignesNonTracees = NexusFdjMoteur.lignesApproNonTracees(shiftCountsStock, mouvements, referenceCreeLe);
    const idsShifts = [...new Set(lignesNonTracees.map(l => l.shift_id))];
    const shiftsMap = await chargerShiftsParIds(idsShifts);
    const quartsConcernesParJeu = {};
    lignesNonTracees.forEach(l => {
      const s = shiftsMap[l.shift_id];
      if (!quartsConcernesParJeu[l.game_id]) quartsConcernesParJeu[l.game_id] = [];
      quartsConcernesParJeu[l.game_id].push({ date: s ? s.date : null, quart: s ? s.quart : null });
    });
    Object.values(quartsConcernesParJeu).forEach(liste => liste.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.quart || '').localeCompare(b.quart || '')));

    // Rotation/autonomie/tickets restants — 14/08/2026 (refonte lecture
    // managériale) : calculés une fois ici par jeu, réutilisés à la fois
    // pour la classification (etatLigneStockV2) et pour le détail dépliable
