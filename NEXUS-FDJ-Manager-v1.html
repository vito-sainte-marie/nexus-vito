  // ------------------------------------------------------------
  // ÉTAT DU STOCK FDJ — 09/08/2026, audit "Moteur de clairvoyance manager"
  // (§44) : Bureau / Caisse non activé / Activés (depuis le point zéro) /
  // dernière réception / état, jeu par jeu. Les chiffres viennent
  // exclusivement des mouvements et du dernier contrôle physique — jamais
  // codés en dur. Inclut les retraits/blocages en cours (§18, gestion par
  // exception : rien à afficher tant qu'il n'y en a pas).
  // ------------------------------------------------------------
  async function ouvrirStockEtat() {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    const [{ soldes, reference, mouvements }, shiftCountsStock] = await Promise.all([soldesActuels(), chargerShiftCountsStock()]);
    const referenceCreeLe = reference ? reference.creeLe : null;
    // 13/08/2026 (v2, refonte) : détail par quart (pas seulement le total)
    // pour afficher "quart(s) concerné(s)" au clic — même fonction moteur
    // que le total (Article 11), juste consommée à un niveau plus fin.
    // 14/08/2026 : referenceCreeLe transmis pour exclure du rapprochement
    // tout ce qui est antérieur au dernier point zéro certifié — déjà
    // absorbé dans le stock physique recertifié, ne doit plus polluer la
    // vue opérationnelle (demande de Frédéric, capture d'écran commentée).
    const lignesNonTracees = NexusFdjMoteur.lignesApproNonTracees(shiftCountsStock, mouvements, referenceCreeLe);
    const idsShifts = [...new Set(lignesNonTracees.map(l => l.shift_id))];
    const shiftsMap = await chargerShiftsParIds(idsShifts);
    const quartsConcernesParJeu = {};
    lignesNonTracees.forEach(l => {
      const s = shiftsMap[l.shift_id];
      if (!quartsConcernesParJeu[l.game_id]) quartsConcernesParJeu[l.game_id] = [];
      quartsConcernesParJeu[l.game_id].push({ date: s ? s.date : null, quart: s ? s.quart : null });
    });
    Object.values(quartsConcernesParJeu).forEach(liste => liste.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.quart || '').localeCompare(b.quart || '')));

    // Rotation/autonomie/tickets restants — 14/08/2026 (refonte lecture
    // managériale) : calculés une fois ici par jeu, réutilisés à la fois
    // pour la classification (etatLigneStockV2) et pour le détail dépliable
    // (renderJeuStockEtat), jamais recalculés à deux endroits (Article 11).
    const maintenant = new Date();
    const rotationParJeu = {}, ticketsRestantsParJeu = {}, autonomieParJeu = {};
    jeux.forEach(j => {
      const rotation = NexusFdjMoteur.rotationCarnetsJeu(mouvements, j.id, maintenant, undefined, referenceCreeLe);
      const ticketsRestants = NexusFdjMoteur.ticketsRestantsCarnetEnCours(shiftCountsStock, j.id, j.tickets_par_carnet);
      rotationParJeu[j.id] = rotation;
      ticketsRestantsParJeu[j.id] = ticketsRestants;
      autonomieParJeu[j.id] = NexusFdjMoteur.calculerAutonomieJeu({
        solde: soldes[j.id], ticketsRestants, ticketsParCarnet: j.tickets_par_carnet, rotationCarnetsJour: rotation,
      });
    });

    stockEtat = {
      soldes, reference, dernieresReceptions: derniereReceptionParJeu(mouvements),
      approNonTrace: NexusFdjMoteur.approNonTraceParJeu(shiftCountsStock, mouvements, referenceCreeLe),
      quartsConcernesParJeu, rotationParJeu, ticketsRestantsParJeu, autonomieParJeu,
    };
    // Filtre par défaut : priorité au plus urgent — "à réapprovisionner"
    // s'il y en a, sinon "à rapprocher" s'il y en a (demande de Frédéric —
    // "par défaut, côté manager, je mettrais même 'à rapprocher'", conservé
    // pour l'axe traçabilité, mais désormais après le vrai risque de
    // rupture), sinon "tous" (rien à prioriser).
    const etatsInitiaux = {};
    jeux.forEach(j => {
      etatsInitiaux[j.id] = NexusFdjMoteur.etatLigneStockV2(stockEtat.soldes[j.id], stockEtat.approNonTrace[j.id] || 0, j.tickets_par_carnet, ticketsRestantsParJeu[j.id], autonomieParJeu[j.id]);
    });
    const compteReappro = jeux.filter(j => etatsInitiaux[j.id].statut === 'reapprovisionner').length;
    const compteRapprocher = jeux.filter(j => etatsInitiaux[j.id].statut === 'rapprocher').length;
    stockEtatFiltre = compteReappro > 0 ? 'reapprovisionner' : (compteRapprocher > 0 ? 'rapprocher' : 'tous');
    vue = 'stock-etat';
    renderStockEtat();
  }

  // Classification de ligne — voir NexusFdjMoteur.etatLigneStockV2 pour le
  // détail des règles (14/08/2026, refonte lecture managériale : sépare
  // 'reapprovisionner'/'vigilance'/'ok' — l'axe STOCK — de 'rapprocher' —
  // l'axe TRAÇABILITÉ, un rapprochement en attente prime toujours car les
  // chiffres de stock ne sont alors pas fiables). Wrapper local minimal :
  // lit rotationParJeu/ticketsRestantsParJeu/autonomieParJeu déjà calculés
  // dans ouvrirStockEtat, jamais recalculés ici.
  function etatLigneStock(gameId, solde, approNonTrace, ticketsParCarnet) {
    return NexusFdjMoteur.etatLigneStockV2(solde, approNonTrace, ticketsParCarnet, stockEtat.ticketsRestantsParJeu[gameId], stockEtat.autonomieParJeu[gameId]);
  }

  const FDJ_STOCK_FILTRES = [
    { cle: 'tous', label: 'Tous' },
    { cle: 'reapprovisionner', label: '🔴 À réapprovisionner' },
    { cle: 'vigilance', label: '🟠 Vigilance' },
    { cle: 'rapprocher', label: '⚠️ À rapprocher' },
    { cle: 'ok', label: '🟢 OK' },
  ];

  function renderStockEtat() {
    document.getElementById('titre').textContent = 'État du stock FDJ';
    document.getElementById('sousTitre').textContent = 'Réserve bureau, caisse non activée et carnet en cours — jamais codé en dur.';
    const ref = stockEtat.reference;
    const bloques = jeux.map(j => ({ jeu: j, solde: stockEtat.soldes[j.id] || {} })).filter(x => (x.solde.bloques || 0) > 0);

    const etats = {};
    jeux.forEach(j => {
      etats[j.id] = etatLigneStock(j.id, stockEtat.soldes[j.id] || { bureau: 0, confies: 0, actives: 0, bloques: 0, nonActives: 0 }, stockEtat.approNonTrace[j.id] || 0, j.tickets_par_carnet);
    });
    const compte = { tous: jeux.length, reapprovisionner: 0, vigilance: 0, rapprocher: 0, ok: 0 };
    jeux.forEach(j => { compte[etats[j.id].statut]++; });

    // Synthèse globale (14/08/2026, refonte lecture managériale) —
    // "🎟️ État FDJ caisse" : totaux + recommandation d'action dérivée de
    // faits déjà connus (jamais une supposition), voir
    // NexusFdjMoteur.syntheseGlobaleFdjStock.
    const synthese = NexusFdjMoteur.syntheseGlobaleFdjStock(jeux, etats, stockEtat.soldes);

    const jeuxFiltres = jeux.filter(j => stockEtatFiltre === 'tous' || etats[j.id].statut === stockEtatFiltre);
    const groupes = grouperParPalier(jeuxFiltres);

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourStockEtat">← Retour</button>
      <div class="resume-card fdj-stock-synthese">
        <div class="titre-synthese">🎟️ État FDJ caisse</div>
        <div class="ligne-synthese">${synthese.compte.tous} jeu${synthese.compte.tous > 1 ? 'x' : ''} suivi${synthese.compte.tous > 1 ? 's' : ''} · ${fmtNum(synthese.carnetsDisponiblesCaisse)} carnet${synthese.carnetsDisponiblesCaisse > 1 ? 's' : ''} disponible${synthese.carnetsDisponiblesCaisse > 1 ? 's' : ''} en caisse</div>
        <div class="ligne-synthese">🟢 ${synthese.compte.ok} couvert${synthese.compte.ok > 1 ? 's' : ''} · 🟠 ${synthese.compte.vigilance} à surveiller · 🔴 ${synthese.compte.reapprovisionner} à réapprovisionner${synthese.compte.rapprocher ? ` · ⚠️ ${synthese.compte.rapprocher} à rapprocher` : ''}</div>
        <div class="ligne-synthese">${ref ? `Dernier point zéro : ${new Date(ref.date + 'T00:00:00').toLocaleDateString('fr-FR')}.` : 'Aucun contrôle physique enregistré — stock théorique depuis zéro, à fiabiliser via "Contrôle physique du stock".'}</div>
        ${synthese.recommandation ? `<div class="recommandation">NEXUS recommande : ${synthese.recommandation}</div>` : ''}
      </div>
      <div class="fdj-stock-filtres">
        ${FDJ_STOCK_FILTRES.map(f => `<button type="button" class="fdj-stock-filtre${stockEtatFiltre === f.cle ? ' active' : ''}" data-filtre="${f.cle}">${f.label} <span class="compte">${compte[f.cle]}</span></button>`).join('')}
      </div>
      <button class="btn-nouveau" id="btnOuvrirBlocage">🚫 Signaler un retrait / blocage</button>
      ${bloques.length ? `
        <div class="section-titre">Retraits / blocages en cours (${bloques.length})</div>
        <div class="card" style="margin-bottom:16px;">
          ${bloques.map(({ jeu, solde }) => `
            <div class="jeu-row" data-jeu-bloque="${jeu.id}">
              <div class="jeu-nom-ligne">
                <div class="jeu-nom">${jeu.nom}</div>
                <div class="jeu-ventes anomalie">${solde.bloques} bloqué${solde.bloques > 1 ? 's' : ''}</div>
              </div>
              <button type="button" class="btn-modifier" data-retourner="${jeu.id}" style="margin-top:6px; width:100%;">↩️ Retourner au bureau</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="section-titre">Par jeu</div>
      ${groupes.length ? groupes.map(g => {
        const items = g.items.map(j => ({ jeu: j, etat: etats[j.id] }));
        return `
        <div class="palier-block">
          <div class="fdj-stock-palier-head${stockEtatPaliersReplies.has(String(g.prix)) ? ' replie' : ''}" data-palier="${g.prix}">
            <span>${fmtNum(g.prix)} € — ${g.items.length} jeu${g.items.length > 1 ? 'x' : ''}</span>
            <span class="fleche">▾</span>
          </div>
          <div class="card fdj-stock-palier-corps" id="palierCorps-${String(g.prix).replace('.', '_')}" style="${stockEtatPaliersReplies.has(String(g.prix)) ? 'display:none;' : ''}">
            <div class="fdj-stock-palier-phrase">${NexusFdjMoteur.phraseFamillePalier(items)}</div>
            <div class="fdj-stock-head">
              <div class="fdj-stock-head-nom">Jeu</div>
              <div class="fdj-stock-head-metrics"><span>Réserve</span><span>Caisse</span><span>En cours</span></div>
              <div class="fdj-stock-head-statut"></div>
            </div>
            ${g.items.map(j => renderJeuStockEtat(j, etats[j.id])).join('')}
          </div>
        </div>
      `;
      }).join('') : `<div class="empty">Aucun jeu dans ce filtre.</div>`}
    `;
    document.getElementById('btnRetourStockEtat').addEventListener('click', () => { vue = 'liste'; stockEtat = null; stockEtatFiltre = 'tous'; renderAccueil(); });
    document.getElementById('btnOuvrirBlocage').addEventListener('click', () => ouvrirBlocage());
    document.querySelectorAll('[data-retourner]').forEach(btn => btn.addEventListener('click', () => retournerDepuisBloque(btn.dataset.retourner)));
    document.querySelectorAll('[data-rapprocher]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const estime = btn.dataset.estime ? Number(btn.dataset.estime) : null;
      ouvrirRapprochement(btn.dataset.rapprocher, estime);
    }));
    document.querySelectorAll('.fdj-stock-filtre').forEach(btn => btn.addEventListener('click', () => { stockEtatFiltre = btn.dataset.filtre; renderStockEtat(); }));
    document.querySelectorAll('.fdj-stock-palier-head').forEach(head => head.addEventListener('click', () => {
      const prix = head.dataset.palier;
      if (stockEtatPaliersReplies.has(prix)) stockEtatPaliersReplies.delete(prix); else stockEtatPaliersReplies.add(prix);
      head.classList.toggle('replie');
      const corps = document.getElementById(`palierCorps-${prix.replace('.', '_')}`);
      if (corps) corps.style.display = stockEtatPaliersReplies.has(prix) ? 'none' : '';
    }));
    document.querySelectorAll('.fdj-stock-row').forEach(row => row.addEventListener('click', () => {
      const detail = row.nextElementSibling;
      if (detail && detail.classList.contains('fdj-stock-detail')) detail.classList.toggle('open');
    }));
  }

  // Phrase de conclusion du détail (14/08/2026) — une ligne, cohérente
  // avec le badge de la ligne compacte, jamais un second jugement
  // concurrent. Ne s'affiche que pour l'axe stock (jamais pour
  // 'rapprocher', qui a déjà son propre bloc dédié ci-dessous).
  function conclusionStock(etat) {
    if (etat.statut === 'reapprovisionner') return { couleur: 'rouge', texte: etat.badge === '🔴 Rupture totale' ? 'Aucun réapprovisionnement possible depuis le bureau — commande à prévoir.' : 'Réapprovisionnement nécessaire : redescendez un carnet du bureau vers la caisse.' };
    if (etat.statut === 'vigilance') return { couleur: 'ambre', texte: 'À surveiller — activez un carnet en réserve ou préparez le réapprovisionnement.' };
    if (etat.statut === 'ok') return { couleur: 'vert', texte: 'Aucun réapprovisionnement nécessaire.' };
    return null;
  }

  // Niveau 1 (ligne compacte, toujours visible) + Niveau 2 (détail replié,
  // ouvert au clic sur la ligne — même mécanique que .histo-item plus haut).
  // 14/08/2026 (refonte lecture managériale) : le détail expose maintenant
  // tickets restants du carnet en cours, rotation moyenne et autonomie
  // estimée — chacun avec son propre "non calculable" explicite si les
  // données manquent (Article 5 : jamais un chiffre inventé).
  function renderJeuStockEtat(jeu, etat) {
    const solde = stockEtat.soldes[jeu.id] || { bureau: 0, confies: 0, actives: 0, bloques: 0, nonActives: 0 };
    const derniereReception = stockEtat.dernieresReceptions[jeu.id];
    const anciennete = ancienneteJours(derniereReception);
    const quartsConcernes = stockEtat.quartsConcernesParJeu[jeu.id] || [];
    const noteReception = `<div class="histo-sub">${derniereReception ? `Dernière réception : il y a ${anciennete} jour${anciennete > 1 ? 's' : ''} (${new Date(derniereReception).toLocaleDateString('fr-FR')})` : 'Aucune réception enregistrée'}</div>`;

    const ticketsRestants = stockEtat.ticketsRestantsParJeu[jeu.id];
    const rotation = stockEtat.rotationParJeu[jeu.id];
    const autonomie = stockEtat.autonomieParJeu[jeu.id];
    // 15/08/2026 : "Carnet en cours" reflète désormais en priorité le
    // dernier comptage de quart réel (ticketsRestants) plutôt que le seul
    // solde de mouvements carnet (solde.actives) — même signal que
    // etatLigneStockV2 (carnetEnCoursConnu), pour ne jamais afficher "Aucun"
    // ici alors que "Tickets restants" montre un chiffre juste en dessous.
    // solde.actives ne sert de repli que si aucun comptage de quart n'existe
    // encore pour ce jeu (ticketsRestants === null).
    const carnetEnCoursTexte = ticketsRestants !== null
      ? (ticketsRestants > 0 ? '1 (déduit du dernier comptage de quart)' : 'Aucun (carnet épuisé)')
      : (solde.actives > 0 ? `${fmtNum(solde.actives)} activé${solde.actives > 1 ? 's' : ''} depuis le point zéro` : 'Aucun');
    const mesures = !etat.rapprochement ? `
      <div class="fdj-stock-mesure-row"><span>Réserve bureau</span><b>${fmtNum(solde.bureau)} carnet${solde.bureau > 1 ? 's' : ''}</b></div>
      <div class="fdj-stock-mesure-row"><span>Caisse non activés</span><b>${fmtNum(solde.nonActives)} carnet${solde.nonActives > 1 ? 's' : ''}</b></div>
      <div class="fdj-stock-mesure-row"><span>Carnet en cours</span><b>${carnetEnCoursTexte}</b></div>
      <div class="fdj-stock-mesure-row"><span>Tickets restants</span><b>${ticketsRestants !== null ? `${fmtNum(ticketsRestants)} / ${jeu.tickets_par_carnet}` : 'Non calculable'}</b></div>
      <div class="fdj-stock-mesure-row"><span>Rotation moyenne</span><b>${rotation > 0 ? `${fmtNum(Math.round(rotation * 100) / 100)} carnet/jour` : 'Aucune activation récente'}</b></div>
      <div class="fdj-stock-mesure-row"><span>Autonomie caisse estimée</span><b>${autonomie.jours !== null ? `${fmtNum(autonomie.jours)} jour${autonomie.jours > 1 ? 's' : ''}` : 'Non calculable'}</b></div>
    ` : '';
    const conclusion = !etat.rapprochement ? conclusionStock(etat) : null;

    return `
      <div class="fdj-stock-item">
        <div class="fdj-stock-row">
          <div class="fdj-stock-nom">${jeu.nom}</div>
          <div class="fdj-stock-metrics">
            <span>${fmtNum(solde.bureau)}</span>
            <span>${fmtNum(solde.nonActives)}</span>
            <span>${fmtNum(solde.actives)}</span>
          </div>
          <div class="fdj-stock-statut ${etat.couleur}">${etat.badge}</div>
        </div>
        <div class="fdj-stock-detail">
          ${etat.rapprochement ? `
            <div class="fdj-stock-badges">
              <span class="fdj-stock-badge amber">⚠️ ${etat.carnetsEstimes !== null ? `${etat.carnetsEstimes} carnet${etat.carnetsEstimes > 1 ? 's' : ''} estimé${etat.carnetsEstimes > 1 ? 's' : ''}` : 'carnets à rapprocher (quantité inconnue)'}</span>
              <span class="fdj-stock-badge">${fmtNum(etat.approNonTrace)} ticket${etat.approNonTrace > 1 ? 's' : ''} non tracé${etat.approNonTrace > 1 ? 's' : ''}</span>
            </div>
            ${quartsConcernes.length ? `<div class="histo-sub">Quart(s) concerné(s) : ${quartsConcernes.map(q => q.date ? `${new Date(q.date + 'T00:00:00').toLocaleDateString('fr-FR')} · Q${q.quart}` : '—').join(', ')}</div>` : ''}
            ${noteReception}
            <button type="button" class="btn-modifier" data-rapprocher="${jeu.id}" data-estime="${etat.carnetsEstimes ?? ''}" style="margin-top:10px; width:100%;">🔧 Enregistrer le(s) carnet(s) manquant(s)</button>
          ` : `${mesures}${noteReception}${conclusion ? `<div class="fdj-stock-conclusion ${conclusion.couleur}">${conclusion.texte}</div>` : ''}`}
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // RAPPROCHEMENT MANUEL — 13/08/2026, capture d'écran de Frédéric. Le
  // manager confirme lui-même qu'un carnet a réellement été activé pendant
  // un quart complété/corrigé après coup (jamais NEXUS qui déduit ou
  // invente à sa place — "vérité avant certitude"). Insère un mouvement
  // 'activation' classique (même type que executerActivationCarnet dans
  // NEXUS-FDJ-v1.html, mais methode_identification='saisie_manuelle' et
  // shift_id=null puisqu'il ne s'agit pas d'un quart précis mais d'un
  // rattrapage global sur ce jeu). Formulaire dédié plutôt qu'un prompt()
  // générique — même discipline que "Signaler un retrait/blocage" plus bas.
  // ------------------------------------------------------------
  function ouvrirRapprochement(gameId, carnetsEstimes) {
    rapprochement = { gameId, quantite: carnetsEstimes && carnetsEstimes > 0 ? carnetsEstimes : 1, justification: '' };
    vue = 'rapprochement';
    renderRapprochement();
  }

  function renderRapprochement() {
    const jeu = jeux.find(j => j.id === rapprochement.gameId);
    document.getElementById('titre').textContent = 'Enregistrer un carnet manquant';
    document.getElementById('sousTitre').textContent = "Confirme qu'un carnet a réellement été activé pendant un quart complété/corrigé après coup — NEXUS ne le déduit jamais seul.";
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourRapprochement">← Retour</button>
      <div class="champ-note" style="margin-top:-4px;">${jeu ? jeu.nom : ''}</div>
      <label class="champ-label">Nombre de carnets réellement activés</label>
      <input type="number" inputmode="numeric" min="1" step="1" class="champ-input mono" id="champQteRapprochement" value="${rapprochement.quantite}" style="margin-bottom:4px;">
      <div class="champ-note" style="margin-bottom:12px;">Estimation NEXUS à partir des tickets non tracés — à corriger si vous comptez autrement.</div>
      <label class="champ-label">Constat (pourquoi cette correction)</label>
      <input type="text" class="champ-input" id="champJustifRapprochement" value="${rapprochement.justification}" placeholder="Ex. carnet activé pendant le quart du 11/08, jamais tracé en direct" style="margin-bottom:16px;">
      <button class="btn-primary" id="btnValiderRapprochement">Confirmer l'activation</button>
    `;
    document.getElementById('btnRetourRapprochement').addEventListener('click', () => { vue = 'stock-etat'; rapprochement = null; renderStockEtat(); });
    document.getElementById('champQteRapprochement').addEventListener('input', e => { rapprochement.quantite = e.target.value === '' ? null : Number(e.target.value); });
    document.getElementById('champJustifRapprochement').addEventListener('input', e => { rapprochement.justification = e.target.value; });
    document.getElementById('btnValiderRapprochement').addEventListener('click', validerRapprochement);
  }

  async function validerRapprochement() {
    if (!rapprochement.quantite || rapprochement.quantite <= 0) { alert('Indiquez un nombre de carnets supérieur à 0.'); return; }
    const btn = document.getElementById('btnValiderRapprochement');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const caisse = emplacementParType('caisse');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: rapprochement.gameId, shift_id: null, type_mouvement: 'activation', quantite: rapprochement.quantite,
      location_source_id: caisse ? caisse.id : null, location_destination_id: caisse ? caisse.id : null,
      methode_identification: 'saisie_manuelle', employee_id: null,
      justification: `Rapprochement manuel manager — quart(s) complété(s)/corrigé(s) après coup sans mouvement tracé.${rapprochement.justification ? ` ${rapprochement.justification}` : ''}`,
    });
    if (error) {
      console.error('Rapprochement stock FDJ:', error);
      btn.disabled = false; btn.textContent = "Confirmer l'activation";
      alert("Erreur d'enregistrement. Réessayez.");
      return;
    }
    rapprochement = null;
    await ouvrirStockEtat();
  }

  // Retrait/blocage (§3, §18) : formulaire minimal, gestion par exception —
  // pas d'écran permanent, juste ce qu'il faut pour tracer "qui, quoi,
  // combien, pourquoi" sans jamais modifier un stock sans un fait déclaré.
  async function ouvrirBlocage() {
    blocage = { gameId: jeux[0] ? jeux[0].id : null, quantite: 1, emplacement: 'bureau', motif: '' };
    vue = 'blocage';
    renderBlocage();
  }

  function renderBlocage() {
    document.getElementById('titre').textContent = 'Signaler un retrait / blocage';
    document.getElementById('sousTitre').textContent = "Isole un jeu/série sans modifier le reste du stock — n'active rien, n'ajoute rien à l'appro.";
    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourBlocage">← Retour</button>
      <label class="champ-label">Jeu concerné</label>
      <select class="champ-select" id="champJeuBlocage" style="margin-bottom:12px;">
        ${jeux.map(j => `<option value="${j.id}" ${j.id===blocage.gameId?'selected':''}>${j.nom}</option>`).join('')}
      </select>
      <label class="champ-label">Emplacement source</label>
      <select class="champ-select" id="champEmplacementBlocage" style="margin-bottom:12px;">
        <option value="bureau" ${blocage.emplacement==='bureau'?'selected':''}>Bureau</option>
        <option value="caisse" ${blocage.emplacement==='caisse'?'selected':''}>Caisse</option>
      </select>
      <label class="champ-label">Quantité</label>
      <input type="number" inputmode="numeric" min="1" step="1" class="champ-input mono" id="champQteBlocage" value="${blocage.quantite}" style="margin-bottom:12px;">
      <label class="champ-label">Motif</label>
      <input type="text" class="champ-input" id="champMotifBlocage" value="${blocage.motif}" placeholder="Ex. instruction FDJ, série suspecte…" style="margin-bottom:16px;">
      <button class="btn-primary" id="btnConfirmerBlocage">Signaler</button>
      <button class="btn-ghost" id="btnAnnulerBlocage">Annuler</button>
    `;
    document.getElementById('btnRetourBlocage').addEventListener('click', () => { vue = 'stock-etat'; blocage = null; renderStockEtat(); });
    document.getElementById('btnAnnulerBlocage').addEventListener('click', () => { vue = 'stock-etat'; blocage = null; renderStockEtat(); });
    document.getElementById('champJeuBlocage').addEventListener('change', e => blocage.gameId = e.target.value);
    document.getElementById('champEmplacementBlocage').addEventListener('change', e => blocage.emplacement = e.target.value);
    document.getElementById('champQteBlocage').addEventListener('input', e => blocage.quantite = e.target.value === '' ? 1 : Math.max(1, parseInt(e.target.value, 10) || 1));
    document.getElementById('champMotifBlocage').addEventListener('input', e => blocage.motif = e.target.value);
    document.getElementById('btnConfirmerBlocage').addEventListener('click', enregistrerBlocage);
  }

  async function enregistrerBlocage() {
    if (!blocage.motif.trim()) { alert('Indiquez un motif — NEXUS ne modifie jamais un stock sans un fait déclaré.'); return; }
    const btn = document.getElementById('btnConfirmerBlocage');
    btn.disabled = true;
    btn.innerHTML = 'Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>';
    const source = emplacementParType(blocage.emplacement);
    const zoneBloquee = emplacementParType('bloque');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: blocage.gameId, type_mouvement: 'blocage', quantite: blocage.quantite,
      location_source_id: source ? source.id : null, location_destination_id: zoneBloquee ? zoneBloquee.id : null,
      methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
      justification: `Retrait/blocage (manager) — ${blocage.motif}`,
    });
    if (error) { console.error('Blocage FDJ:', error); btn.disabled = false; btn.textContent = 'Signaler'; alert("Erreur d'enregistrement. Réessayez."); return; }
    vue = 'stock-etat'; blocage = null;
    await ouvrirStockEtat();
  }

  async function retournerDepuisBloque(gameId) {
    const solde = stockEtat.soldes[gameId];
    if (!solde || !(solde.bloques > 0)) return;
    if (!confirm(`Retourner les ${solde.bloques} carnet(s) bloqué(s) de ce jeu au Bureau ?`)) return;
    const zoneBloquee = emplacementParType('bloque');
    const bureau = emplacementParType('bureau');
    const { error } = await nexusClient.from('fdj_stock_movements').insert({
      site: siteId, game_id: gameId, type_mouvement: 'retour', quantite: solde.bloques,
      location_source_id: zoneBloquee ? zoneBloquee.id : null, location_destination_id: bureau ? bureau.id : null,
      methode_identification: 'quantite', booklet_id: null, employee_id: managerCourant.id,
      justification: 'Retour au bureau depuis la zone bloquée (manager).',
    });
    if (error) { console.error('Retour depuis bloqué FDJ:', error); alert("Erreur d'enregistrement. Réessayez."); return; }
    await ouvrirStockEtat();
  }

  // ------------------------------------------------------------
  // TRACE DE CONTRÔLE FDJ — ÉCRAN "RELEVÉ DE CLÔTURE" (par quart)
  // 16/08/2026, demande de Frédéric : "Historique FDJ → sélectionner un
  // quart → Générer le relevé de contrôle". Le relevé n'est jamais
  // recalculé ici — il se contente d'afficher tel quel ce que
  // NexusFdjMoteur (via validerQuart/enregistrerEdition/synchroniser
  // RelevesApresRetablissementChaine) a déjà écrit dans fdj_releves_cloture.
  // "NEXUS conserve le fait" : cet écran ne fait que le lire et le mettre
  // en forme, jamais une nouvelle vérité.
  // ------------------------------------------------------------
  async function ouvrirReleveQuart(shift) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    const releves = await chargerRelevesQuart(shift.id);
    releveQuart = { shift, releves, dernierPdf: null };
    vue = 'releve';
    renderReleveQuart();
  }

  // Liste ordonnée des game_id apparaissant dans au moins une des 3 cartes
  // *_par_jeu du snapshot — dans l'ordre d'affichage habituel des jeux
  // (jeux déjà chargés triés par ordre_affichage), jamais un ordre
  // dépendant des clés JSON (non garanti).
  function jeuxDuSnapshot(snapshot) {
    const ids = new Set([
      ...Object.keys(snapshot.stock_initial_par_jeu || {}),
      ...Object.keys(snapshot.appro_par_jeu || {}),
      ...Object.keys(snapshot.stock_final_par_jeu || {}),
    ]);
    return jeux.filter(j => ids.has(j.id));
  }

        <div class="stat-row"><div class="stat-label">Date · Quart</div><div class="stat-value">${new Date(shift.date + 'T00:00:00').toLocaleDateString('fr-FR')} · Quart ${shift.quart}</div></div>
        <div class="stat-row"><div class="stat-label">Heure de validation</div><div class="stat-value">${heureValidation}</div></div>

        <div class="stat-row"><div class="stat-label">Caractère</div><div class="stat-value"><span class="badge-caractere ${dernier.caractere}">${libelleCaractereReleve(dernier.caractere)}</span></div></div>
        <div class="stat-row"><div class="stat-label">Statut</div><div class="stat-value"><span class="statut-badge ${dernier.statut}">${labelStatutRelevecloture(dernier.statut)}</span></div></div>
      </div>

      ${dernier.caractere === 'provisoire' ? `
        <div class="card" style="margin-bottom:16px; border:1px solid rgba(245,166,35,0.4); background:rgba(245,166,35,0.06);">
          <div class="histo-sub" style="color:var(--amber);">🟠 Relevé provisoire — continuité à régulariser. La chaîne de quarts était interrompue ou une continuité de stock restait à vérifier au moment de ce constat. Ce relevé sera recalculé automatiquement (nouvelle version, celle-ci restant conservée) dès que le quart manquant sera complété.</div>
        </div>
      ` : ''}

      <div class="section-titre">Stock par jeu (état retenu)</div>
      <div class="card" style="margin-bottom:16px;">

            <div class="stat-row"><div class="stat-label">Stock initial → Appro → Stock final</div><div class="stat-value" style="font-size:11.5px; font-weight:400;">${fmtNum((dernier.stock_initial_par_jeu || {})[j.id])} → ${fmtNum((dernier.appro_par_jeu || {})[j.id])} → ${fmtNum((dernier.stock_final_par_jeu || {})[j.id])}</div></div>

    document.getElementById('btnGenererPdfReleve').addEventListener('click', () => {

  // Composition PDF du relevé d'un quart — même moteur générique
  // (nexus-pdf-moteur.js, ConstructeurRapport multi-page, Article 11)
  // utilisé par tous les rapports NEXUS. Reproduit fidèlement ce que
  // renderReleveQuart affiche à l'écran : dernière version en synthèse,
  // historique complet des versions en dessous — "le dossier de preuve du
  // quart FDJ" (demande de Frédéric, 16/08/2026), jamais une photo de
  // l'écran mais une composition dédiée.
  async function construireReleveClotureQuartPdf(shift, releves) {
    const dernier = releves[releves.length - 1];
    const premier = releves[0];
    const jeuxListe = jeuxDuSnapshot(dernier);
    const dateLabel = new Date(shift.date + 'T00:00:00').toLocaleDateString('fr-FR');
    const { COULEUR } = NexusPdfMoteur;

    const c = await NexusPdfMoteur.creerRapport({
      titre: `NEXUS FDJ — Relevé de clôture — ${shift.date} Quart ${shift.quart}`,
      sujet: 'Relevé de clôture FDJ — Trace de contrôle',
      entete: { app: 'NEXUS FDJ · RELEVÉ DE CLÔTURE', sousTitre: `${dateLabel} · Quart ${shift.quart}` },
    });

    c.titre('Relevé de clôture FDJ');
    c.sousTitre(`${dateLabel} · Quart ${shift.quart} · ${nomEmploye(shift.employee_id)}`);
    c.sousTitre(`Identifiant du relevé : ${shift.id}`, { taille: 8.5, couleur: COULEUR.texteDim });

    if (dernier.caractere === 'provisoire') {
      c.bandeau('Relevé PROVISOIRE — continuité de chaîne à régulariser au moment de ce constat. Les chiffres pourront être recalculés automatiquement (nouvelle version) lorsque le quart manquant sera complété — celui-ci restera conservé.', { couleur: COULEUR.ambre });
    }

    const heureValidation = premier && premier.signature && premier.signature.date_heure
      ? new Date(premier.signature.date_heure).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
      : '—';
    c.sectionTitre('IDENTIFICATION');
    c.ligneCle('Heure de validation (employé)', heureValidation);
    c.ligneCle('Caractère', libelleCaractereReleve(dernier.caractere), { couleurValeur: dernier.caractere === 'provisoire' ? COULEUR.ambre : COULEUR.vert });
    c.ligneCle('Statut', labelStatutRelevecloture(dernier.statut));

    c.sectionTitre('STOCK PAR JEU');
    c.tableau(
      [
        { label: 'Jeu', cle: 'nom', largeur: 0.34 },
        { label: 'Initial', cle: 'initial', largeur: 0.16, align: 'droite' },
        { label: 'Appro', cle: 'appro', largeur: 0.14, align: 'droite' },
        { label: 'Final', cle: 'final', largeur: 0.16, align: 'droite' },
        { label: 'Ventes', cle: 'ventes', largeur: 0.20, align: 'droite' },
      ],
      jeuxListe.map(j => {
        const v = (dernier.ventes_par_jeu || {})[j.id] || {};
        return {
          nom: j.nom,
          initial: fmtNum((dernier.stock_initial_par_jeu || {})[j.id]),
          appro: fmtNum((dernier.appro_par_jeu || {})[j.id]),
          final: fmtNum((dernier.stock_final_par_jeu || {})[j.id]),
          ventes: v.valeur !== undefined && v.valeur !== null ? fmtEuro(v.valeur) : '—',
        };
      }),
    );

    c.sectionTitre('SYNTHÈSE CAISSE');
    c.ligneCle('Ventes grattage', fmtEuro(dernier.ventes_grattage_valeur));
    c.ligneCle('Lots payés', fmtEuro(dernier.lots_payes_grattage));
    c.ligneCle('Caisse tirages', fmtEuro(dernier.caisse_tirages));
    c.ligneCle('Régularisations', fmtEuro(dernier.regularisations));
    c.ligneCle('Caisse attendue', fmtEuro(dernier.caisse_attendue), { couleurValeur: COULEUR.cyan });
    c.ligneCle('Caisse réelle', fmtEuro(dernier.caisse_reelle));
    const ecart = dernier.ecart;
    c.ligneCle('Écart', ecart !== null && ecart !== undefined ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—', { couleurValeur: ecart === null || ecart === undefined ? COULEUR.texte : (ecart === 0 ? COULEUR.vert : COULEUR.ambre) });
    libelleAnomalieChaine(dernier.anomalie_chaine).forEach(l => c.ligneCle(l.label, l.valeur));

    c.sectionTitre(`HISTORIQUE DES VERSIONS (${releves.length})`);
    releves.forEach((r, i) => {
      const auteur = r.signature && r.signature.nom ? r.signature.nom : (r.cree_par ? nomEmploye(r.cree_par) : '—');
      const dateVersion = r.cree_le ? new Date(r.cree_le).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
      c.paragraphe(`Version ${r.version_num} — ${libelleTypeVersionReleve(r.type_version)} — ${dateVersion} — ${auteur}`, { taille: 9.5, couleur: COULEUR.texte });
      if (r.motif_regularisation) c.paragraphe(r.motif_regularisation, { taille: 8.5, couleur: COULEUR.texteDim });
      if (i > 0 && r.diff_vs_precedent) {
        Object.keys(LABELS_DIFF_RELEVE).forEach(champ => {
          const v = r.diff_vs_precedent[champ];
          if (v === undefined) return;
          if (champ.endsWith('_par_jeu')) {
            Object.entries(v).forEach(([gameId, chg]) => {
              c.paragraphe(`  · ${LABELS_DIFF_RELEVE[champ]} — ${nomJeu(gameId)} : ${formatValeurDiffReleve(champ, chg.avant)} → ${formatValeurDiffReleve(champ, chg.apres)}`, { taille: 8.5, couleur: COULEUR.texteDim });
            });
          } else {
            c.paragraphe(`  · ${LABELS_DIFF_RELEVE[champ] || champ} : ${formatValeurDiffReleve(champ, v.avant)} → ${formatValeurDiffReleve(champ, v.apres)}`, { taille: 8.5, couleur: COULEUR.texteDim });
          }
        });
      }
    });

    c.piedDePageToutesPages('NEXUS FDJ · Relevé de clôture — trace de contrôle, jamais un jugement automatique.');
    const bytes = await NexusPdfMoteur.finaliser(c);
    const nomFichier = `NEXUS-FDJ-Releve-${shift.date}-Q${shift.quart}.pdf`;
    return {
      bytes, nomFichier,
      titre: `NEXUS FDJ — Relevé de clôture ${dateLabel} Quart ${shift.quart}`,
      texte: `Relevé de clôture FDJ — ${nomEmploye(shift.employee_id)} — ${dateLabel} Quart ${shift.quart}`,
    };
  }

  async function ouvrirExportJournee(date) {
    document.getElementById('content').innerHTML = '<div class="loading">Chargement…</div>';
    if (!jeux.length) jeux = await chargerJeux();
    if (!employesSite.length) employesSite = await chargerEmployesSite();
    const shiftsDuJour = await chargerShiftsAvecCaisse(date);
    const shiftsAvecReleves = await Promise.all(
      shiftsDuJour.slice().sort((a, b) => a.quart.localeCompare(b.quart)).map(async s => ({ shift: s, releves: await chargerRelevesQuart(s.id) })),
    );
    exportJournee = { date, shifts: shiftsAvecReleves, dernierPdf: null };
    vue = 'export-journee';
    renderExportJournee();
  }

  function renderExportJournee() {
    const { date, shifts } = exportJournee;
    document.getElementById('titre').textContent = 'Exporter la journée FDJ';
    document.getElementById('sousTitre').textContent = new Date(date + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    document.getElementById('content').innerHTML = `
      <button type="button" class="btn-retour-fleche" id="btnRetourExportJournee">← Retour</button>

      ${shifts.map(({ shift, releves }) => {
        const dernier = releves.length ? releves[releves.length - 1] : null;
        const ecart = dernier ? dernier.ecart : null;
        const classe = ecart === null || ecart === undefined ? '' : (ecart === 0 ? 'green' : (Math.abs(ecart) <= 1 ? 'amber' : 'red'));
        return `
          <div class="card" style="margin-bottom:16px;">
            <div class="stat-row"><div class="stat-label">Quart ${shift.quart}</div><div class="stat-value">${nomEmploye(shift.employee_id)}</div></div>
            ${dernier ? `
              <div class="stat-row"><div class="stat-label">Caractère</div><div class="stat-value"><span class="badge-caractere ${dernier.caractere}">${libelleCaractereReleve(dernier.caractere)}</span></div></div>
              <div class="stat-row total"><div class="stat-label">Écart</div><div class="stat-value ${classe}">${ecart !== null && ecart !== undefined ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—'}</div></div>
            ` : `<div class="empty">Aucun relevé de clôture pour ce quart.</div>`}
          </div>
        `;
      }).join('') || '<div class="card"><div class="empty">Aucun quart FDJ enregistré ce jour.</div></div>'}

      <div id="zoneActionsPdfJournee">
        <button class="btn-rapport-pdf" id="btnGenererPdfJournee" type="button" ${shifts.every(s => !s.releves.length) ? 'disabled' : ''}>📄 Exporter la journée complète (PDF)</button>
      </div>
      ${shifts.every(s => !s.releves.length) ? '<div class="champ-note">Aucun relevé de clôture disponible pour cette journée — export impossible.</div>' : ''}
    `;
    document.getElementById('btnRetourExportJournee').addEventListener('click', () => { vue = 'liste'; exportJournee = null; renderAccueil(); });
    const btnGen = document.getElementById('btnGenererPdfJournee');
    if (!btnGen.disabled) {
      btnGen.addEventListener('click', () => {
        genererEtAfficherPdf(document.getElementById('zoneActionsPdfJournee'), () => construireExportJourneePdf(date, shifts), exportJournee);
      });
    }
  }

  async function construireExportJourneePdf(date, shifts) {
    const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const { COULEUR } = NexusPdfMoteur;
    const c = await NexusPdfMoteur.creerRapport({
      titre: `NEXUS FDJ — Journée complète — ${date}`,
      sujet: 'Export journée FDJ — Trace de contrôle',
      entete: { app: 'NEXUS FDJ · JOURNÉE COMPLÈTE', sousTitre: dateLabel },
    });
    c.titre('Journée FDJ complète');
    c.sousTitre(dateLabel.charAt(0).toUpperCase() + dateLabel.slice(1));

    shifts.forEach(({ shift, releves }) => {
      c.sectionTitre(`QUART ${shift.quart} — ${nomEmploye(shift.employee_id).toUpperCase()}`);
      if (!releves.length) {
        c.paragraphe('Aucun relevé de clôture pour ce quart.', { couleur: COULEUR.texteDim });
        return;
      }
      const dernier = releves[releves.length - 1];
      const premier = releves[0];
      const jeuxListe = jeuxDuSnapshot(dernier);
      const heureValidation = premier && premier.signature && premier.signature.date_heure
        ? new Date(premier.signature.date_heure).toLocaleString('fr-FR', { hour: '2-digit', minute: '2-digit' })
        : '—';
      c.ligneCle('Heure de validation', heureValidation);
      c.ligneCle('Caractère', libelleCaractereReleve(dernier.caractere), { couleurValeur: dernier.caractere === 'provisoire' ? COULEUR.ambre : COULEUR.vert });
      c.ligneCle('Statut', labelStatutRelevecloture(dernier.statut));
      const ecart = dernier.ecart;
      c.ligneCle('Écart', ecart !== null && ecart !== undefined ? `${ecart > 0 ? '+' : ''}${fmtEuro(ecart)}` : '—');
      c.ligneCle('Caisse réelle', fmtEuro(dernier.caisse_reelle));
      if (releves.length > 1) c.paragraphe(`${releves.length} versions — voir le relevé de contrôle du quart pour le détail complet des régularisations.`, { taille: 8.5, couleur: COULEUR.texteDim });
      if (jeuxListe.length) {
        c.tableau(
          [
            { label: 'Jeu', cle: 'nom', largeur: 0.4 },
            { label: 'Initial', cle: 'initial', largeur: 0.2, align: 'droite' },
            { label: 'Appro', cle: 'appro', largeur: 0.2, align: 'droite' },
            { label: 'Final', cle: 'final', largeur: 0.2, align: 'droite' },
          ],
          jeuxListe.map(j => ({
            nom: j.nom,
            initial: fmtNum((dernier.stock_initial_par_jeu || {})[j.id]),
            appro: fmtNum((dernier.appro_par_jeu || {})[j.id]),
            final: fmtNum((dernier.stock_final_par_jeu || {})[j.id]),
          })),
        );
      }
    });

    c.piedDePageToutesPages('NEXUS FDJ · Export journée complète — trace de contrôle, jamais un jugement automatique.');
    const bytes = await NexusPdfMoteur.finaliser(c);
    const nomFichier = `NEXUS-FDJ-Journee-${date}.pdf`;
    return { bytes, nomFichier, titre: `NEXUS FDJ — Journée complète ${date}`, texte: `Export journée FDJ complète — ${date}` };
  }
