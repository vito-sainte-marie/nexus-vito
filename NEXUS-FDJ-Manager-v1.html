      ventesParJeu[j.id] = { qte: v.qte, valeur: v.valeur };
    });
    const { data: precedentes } = await nexusClient.from('fdj_releves_cloture').select('*').eq('shift_id', shift.id).order('version_num', { ascending: false }).limit(1);
    const precedent = (precedentes || [])[0] || null;
    // 16/08/2026 : le relevé doit connaître la qualité de la chaîne au
    // moment de CETTE régularisation — une alerte chaine_interrompue ou
    // continuite_stock_a_verifier encore ouverte sur ce quart précis rend
    // le relevé 'provisoire', même si le manager vient de régulariser
    // autre chose (ex. un motif d'écart) sans toucher au stock en cause.
    // 16/08/2026, sécurisation structurelle demandée par Frédéric, point 2 :
    // "Séparer chaine_interrompue et continuite_stock_a_verifier. Les deux
    // peuvent rendre un relevé provisoire mais ne doivent pas être
    // enregistrées comme la même anomalie." Avant cette correction, les
    // deux types étaient interrogés ensemble puis réduits à UN SEUL booléen
    // (`chaineOuStockAVerifier`) avant même d'atteindre `anomalie_chaine` —
    // impossible ensuite de savoir, en relisant un relevé, LAQUELLE des
    // deux causes l'a rendu provisoire. Une seule requête reste suffisante
    // (mêmes filtres), mais chaque type est désormais distingué côté
    // application avant d'être écrit.
    const { data: alertesOuvertesShift } = await nexusClient.from('fdj_alertes').select('id, type')
      .eq('shift_id', shift.id).in('type', ['chaine_interrompue', 'continuite_stock_a_verifier']).eq('resolue_automatiquement', false).eq('vue', false);
    const chaineInterrompueOuverte = (alertesOuvertesShift || []).some(a => a.type === 'chaine_interrompue');
    const continuiteStockAVerifierOuverte = (alertesOuvertesShift || []).some(a => a.type === 'continuite_stock_a_verifier');
    const versionNum = precedent ? precedent.version_num + 1 : 1;
    const nouveauSnapshot = {
      stock_initial_par_jeu: stockInitialParJeu, appro_par_jeu: approParJeu, stock_final_par_jeu: stockFinalParJeu, ventes_par_jeu: ventesParJeu,
      ventes_grattage_valeur: ventesGrattageTotalEdition(), lots_payes_grattage: edition.lotsPayes,
      caisse_tirages: edition.caisseTirages, regularisations: edition.regularisations || 0,
      caisse_attendue: caisseAttendueEdition(), caisse_reelle: edition.caisseReelle, ecart,
      // 16/08/2026 : `statut` inclus DANS le snapshot avant le diff (et pas
      // ajouté seulement à l'insertion) — sinon diffClotureFdj comparerait
      // toujours precedent.statut à `undefined` et fabriquerait un faux
      // diff à chaque réenregistrement, même sans aucun changement réel.
      // Sécurisation structurelle point 1 : `statutRelevecloture` reçoit
      // désormais 'regularisation_manager' — cet écran ne pose jamais rien
      // d'autre, que la version soit une régularisation d'un constat
      // employé existant ou la toute première ligne créée par le manager
      // (pouvoir total) ; dans les deux cas, le fait qu'un manager ait posé
      // ce snapshot reste tracé.
      statut: NexusFdjMoteur.statutRelevecloture(versionNum, ecart, 'regularisation_manager'),
      anomalie_chaine: { chaine_interrompue: chaineInterrompueOuverte, continuite_stock_a_verifier: continuiteStockAVerifierOuverte },
      caractere: NexusFdjMoteur.caractereRelevecloture({ chaineInterrompue: chaineInterrompueOuverte, continuiteStockAVerifier: continuiteStockAVerifierOuverte }),
    };
    const diff = precedent ? NexusFdjMoteur.diffClotureFdj(precedent, nouveauSnapshot) : null;
    if (!precedent || diff) {
      const signature = {
        utilisateur_id: managerCourant.id, nom: managerCourant.nom, role: 'manager',
        date_heure: new Date().toISOString(), version_donnees: versionNum,
        session_id: (typeof navigator !== 'undefined' && navigator.userAgent) || null,
        quart_id: shift.id,
        message_confirmation: precedent ? 'Régularisation manager du quart (pouvoir total, constat d\'origine jamais effacé).' : 'Création/complétion du quart par le manager (pouvoir total).',
      };
      const { error: eReleve } = await nexusClient.from('fdj_releves_cloture').insert({
        site: siteId, shift_id: shift.id, date: edition.date, quart: edition.quart, employee_id: edition.employeeId,
        version_num: versionNum, type_version: 'regularisation_manager', cree_par: managerCourant.id,
        ...nouveauSnapshot,
        motif_regularisation: precedent ? (edition.motifEcart || null) : null,
        diff_vs_precedent: diff,
        signature,
      });
      // Non bloquant (le quart est déjà enregistré à ce stade) mais jamais
      // silencieux — la fiche de clôture est une preuve, pas un à-côté.
      // 17/08/2026, correctif demandé par Frédéric : ce site d'écriture ne
      // mettait jamais à jour fdj_shifts.releve_cloture_statut — un quart
      // créé directement par le manager (pouvoir total, !precedent) avait
      // pourtant bien son relevé écrit, mais restait affiché comme "en
      // attente" pour toujours, gonflant à tort le panneau "Relevés de
      // clôture à régulariser". Même discipline que validerQuart() côté
      // employé : 'ok' au succès (y compris 23505, idempotence point 5),
      // 'erreur' sinon, jamais silencieux.
      if (eReleve) {
        if (eReleve.code === '23505') {
          await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'ok' }).eq('id', shift.id);
        } else {
          console.error('Relevé de clôture FDJ (version manager):', eReleve);
          await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'erreur' }).eq('id', shift.id);
        }
      } else {
        await nexusClient.from('fdj_shifts').update({ releve_cloture_statut: 'ok' }).eq('id', shift.id);
      }
    }

    // 7) Propagation automatique + versionnage + repassage a_revoir +
    // alerte manager (18/08/2026, FDJ Fiabilisation Étape 2 — cahier
    // `NEXUS_FDJ_Audit_Fiabilisation_Chaine_Quarts.pdf`, désigné par
    // Frédéric dans le cadrage de l'Étape 1 comme "le vrai cœur du risque
    // signalé"). Jusqu'ici, seule une chaîne qui se RÉTABLIT après rupture
    // déclenchait une réconciliation (reconcilierAlertesChaine, Continuité
    // FDJ v2) — une régularisation manager directe sur un quart déjà lié à
    // son suivant ne propageait rien : le stock_initial du quart suivant
    // pouvait rester silencieusement incohérent avec le stock_final tout
    // juste corrigé. Ne s'applique qu'à une régularisation d'un quart
    // EXISTANT (une création n'a pas de "avant" à comparer) et seulement
    // si au moins un stock_final a réellement changé (Article 5). Même
    // sens de propagation que ecartsContinuiteAAppliquer/
    // appliquerCorrectionsAutomatiquesContinuite déjà existants — du quart
    // corrigé vers celui qui le suit immédiatement (Article 11).
    if (!edition.estNouveau && edition.avant && edition.avant.counts) {
      const corrections = [];
      jeux.forEach(j => {
        const avantFinal = edition.avant.counts[j.id] ? edition.avant.counts[j.id].stock_final : null;
        const s = edition.counts[j.id];
        const apresFinal = s ? (s.stock_final ?? null) : null;
        if (avantFinal !== apresFinal && apresFinal !== null) corrections.push({ game_id: j.id, nouvelle_valeur: apresFinal });
      });

      if (corrections.length) {
        // Versionnage (18/08/2026) : simple compteur monotone sur le quart
        // corrigé lui-même — la colonne `version` posée en Étape 1 restait
        // jusqu'ici jamais consommée. Un marqueur "ce quart a été corrigé
        // N fois", pas un second historique complet (déjà couvert par
        // fdj_audit_log + fdj_releves_cloture ci-dessus, Article 11).
        await nexusClient.from('fdj_shifts').update({ version: (shift.version || 0) + 1 }).eq('id', shift.id);

        const suivant = NexusFdjMoteur.quartSuivant(shift.date, shift.quart);
        const { data: shiftSuivant } = await nexusClient.from('fdj_shifts').select('*')
          .eq('site', siteId).eq('date', suivant.date).eq('quart', suivant.quart).maybeSingle();

        if (shiftSuivant) {
          const { data: countsSuivant } = await nexusClient.from('fdj_shift_counts')
            .select('game_id, stock_initial, stock_initial_auto').eq('shift_id', shiftSuivant.id)
            .in('game_id', corrections.map(c => c.game_id));
          const contexteSuivant = {};
          (countsSuivant || []).forEach(c => { contexteSuivant[c.game_id] = { stock_initial: c.stock_initial, stock_initial_auto: c.stock_initial_auto === true }; });

          const { applicables, aRevoir } = NexusFdjMoteur.propagationCorrectionStock(corrections, contexteSuivant);

          if (applicables.length) {
            await appliquerCorrectionsAutomatiquesContinuite(shiftSuivant.id, applicables);
            await nexusClient.from('fdj_shifts').update({ version: (shiftSuivant.version || 0) + 1 }).eq('id', shiftSuivant.id);
            await nexusClient.from('fdj_audit_log').insert({
              site: siteId, shift_id: shiftSuivant.id, entite_type: 'fdj_shift_counts', entite_id: shiftSuivant.id,
              action: 'fdj_propagation_correction_stock_amont', acteur_id: managerCourant.id,
              motif: `Propagation automatique après correction manager du quart précédent (${libelleQuart(shift)}) — stock_initial encore hérité, jamais confirmé par un humain.`,
              ancienne_valeur: null, nouvelle_valeur: { jeux: applicables.map(a => a.game_id) },
            });

            // FDJ Fiabilisation — Étape 4 : le quart suivant vient d'être
            // recalculé silencieusement (ventes/écart) — son relevé de
            // clôture, s'il existe déjà, doit refléter ce nouvel état,
            // sinon l'écran "Relevé de clôture" et son export PDF
            // resteraient périmés sans aucune alerte visible. Si l'écriture
            // échoue, needs_replay reste true — la Boîte d'exceptions
            // (catégorie "replay requis") offre alors un "Recalculer" manuel.
            const replaySucces = await rejouerReleveApresPropagation(shiftSuivant.id, applicables.map(a => a.game_id));
            await nexusClient.from('fdj_shifts').update(
              replaySucces ? { needs_replay: false, last_replayed_at: new Date().toISOString() } : { needs_replay: true }
            ).eq('id', shiftSuivant.id);
          }

          if (aRevoir.length) {
            const { data: existantes } = await nexusClient.from('fdj_alertes').select('id, game_id')
              .eq('site', siteId).eq('type', 'continuite_stock_a_verifier').eq('shift_id', shiftSuivant.id).eq('resolue_automatiquement', false);
            const gamesDejaSignales = new Set((existantes || []).map(r => r.game_id));
            const nouvelles = aRevoir.filter(e => !gamesDejaSignales.has(e.game_id)).map(e => ({
              site: siteId, type: 'continuite_stock_a_verifier', shift_id: shiftSuivant.id, shift_precedent_id: shift.id,
              game_id: e.game_id, valeur_quart_precedent: e.valeur_quart_precedent, valeur_saisie: e.valeur_saisie,
              employee_id: shiftSuivant.employee_id || null,
            }));
            if (nouvelles.length) {
              const { error: eAlerte } = await nexusClient.from('fdj_alertes').insert(nouvelles);
              if (eAlerte) console.error('Alerte propagation correction stock FDJ:', eAlerte);
            }
            // Repassage a_revoir (18/08/2026) — colonne posée en Étape 1,
            // jusqu'ici jamais écrite par aucun code : le quart suivant
            // porte désormais explicitement la trace qu'une valeur en
            // amont a changé sous ses pieds et mérite un nouveau regard
            // manager, même si son propre statut reste 'valide'
            // (orthogonal, jamais fusionné avec le statut — même
            // discipline que le reste du schéma FDJ).
            await nexusClient.from('fdj_shifts').update({
              a_revoir: true, a_revoir_motif: 'correction_amont_stock_initial_deja_confirme',
              a_revoir_depuis_le: new Date().toISOString(),
            }).eq('id', shiftSuivant.id);
          }
        }
      }
    }

    edition = null;
    afficherChoixApresEnregistrement();
  }

  // Choix de destination après enregistrement (13/08/2026, demande directe
  // de Frédéric : "quand je suis dans modifier ce quart FDJ, quand je
  // valide j'aurais aimé avoir le choix de retourner dans FDJ pilotage ou
  // dans l'accueil du Contrôle FDJ") — avant ce lot, valider renvoyait
  // systématiquement à l'accueil (`vue='liste'`), sans jamais proposer
  // l'autre destination naturelle après une correction : la vue d'ensemble
  // FDJ Pilotage. S'applique aussi bien à "Nouveau quart FDJ" qu'à
  // "Modifier ce quart FDJ" (même fonction d'enregistrement, même choix de
  // destination utile dans les deux cas).
  function afficherChoixApresEnregistrement() {
    vue = 'apres-enregistrement';
    document.getElementById('titre').textContent = 'Quart enregistré';
    document.getElementById('sousTitre').textContent = '';
    document.getElementById('content').innerHTML = `
      <div class="card apres-enreg-card">
        <div class="apres-enreg-icone">✅</div>
        <div class="apres-enreg-titre">Quart FDJ enregistré.</div>
        <div class="apres-enreg-sous">Où voulez-vous aller maintenant ?</div>
        <button class="btn-primary" id="btnApresAccueil">← Retour à l'accueil FDJ Opérations</button>
        <button class="btn-ghost" id="btnApresPilotage">Aller à FDJ Performance →</button>
      </div>
    `;
    document.getElementById('btnApresAccueil').addEventListener('click', () => { vue = 'liste'; renderAccueil(); });
    document.getElementById('btnApresPilotage').addEventListener('click', () => { window.location.href = 'NEXUS-FDJ-Analyse-v1.html'; });
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    managerCourant = employee;
    siteId = employee.site_id;
    if (!(await NexusForfait.nexusRequireProfessional('NEXUS-FDJ-Manager-v1.html', siteId))) return;
    demarrerHorloge();
    [jeux, employesSite, emplacements] = await Promise.all([chargerJeux(), chargerEmployesSite(), chargerEmplacements()]);
    // Lien de rattrapage (13/08/2026) — `?date=YYYY-MM-DD&quart=1|2` ouvre
    // directement l'édition de ce quart au lieu de l'accueil habituel.
    // Validé strictement : tout paramètre absent/mal formé retombe
    // silencieusement sur l'accueil normal (comportement inchangé pour
    // n'importe quel lien existant, qui n'a jamais eu ces paramètres).
    const paramsUrl = new URLSearchParams(window.location.search);
    const dateParam = paramsUrl.get('date');
    const quartParam = paramsUrl.get('quart');
    const dateValide = dateParam && /^\d{4}-\d{2}-\d{2}$/.test(dateParam);
    const quartValide = quartParam === '1' || quartParam === '2';
    if (dateValide && quartValide) {
      await ouvrirDepuisParametresUrl(dateParam, quartParam);
    } else {
      renderAccueil();
    }
  }).catch((e) => {
    // v2.270 — P0 : renderAccueil() est déjà protégé par son propre
    // try/catch (v2.249), mais tout ce qui se passe AVANT elle dans cette
    // chaîne (nexusRequireProfessional, chargerJeux/chargerEmployesSite/
    // chargerEmplacements, ouvrirDepuisParametresUrl) ne l'était pas — une
    // exception là rejetait silencieusement toute la promesse, écran figé
    // sur "Chargement…" sans jamais d'erreur visible (Frédéric : "je
    // n'arrive plus à ouvrir NEXUS").
    console.error('Initialisation FDJ Opérations:', e);
    const content = document.getElementById('content') || document.body;
    content.innerHTML = `<div class="loading" style="text-align:left; padding:20px;">
      <div style="font-weight:700; margin-bottom:10px;">NEXUS n'a pas pu ouvrir cette page</div>
      <div style="font-family:monospace; font-size:12px; opacity:0.75; word-break:break-word;">${(e && e.message) || e}</div>
      <a href="NEXUS-App-v1.html" style="display:inline-block; margin-top:16px;">← Retour à l'accueil</a>
    </div>`;
  });
</script>
</body>
</html>
