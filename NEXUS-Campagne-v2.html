<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07131E">
<title>NEXUS · Campagne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="nexus-theme.js"></script>
<style>
:root{
  --t-bg:#07131E; --t-panel:#0D202E; --t-raised:#0F2433; --t-line:#254354;
  --t-text:#EDF1F5; --t-mid:#9AA8B6; --t-cyan:#24D8E3; --t-green:#29C98A; --t-amber:#F5A12A; --t-red:#F0707A;
  --boutique:#C47A55; --boutique-rgb:196,122,85; --piste:#3F6E94; --piste-rgb:63,110,148;
  --t-mono:'IBM Plex Mono',ui-monospace,monospace; --t-sans:'IBM Plex Sans',system-ui,sans-serif;
  --banniere-cadrage:70% 50%;
}
:root[data-theme="jour"]{
  --t-bg:#F4F6F8; --t-panel:#FFFFFF; --t-raised:#EEF2F5; --t-line:#D5DCE3;
  --t-text:#0F172A; --t-mid:#475569; --t-cyan:#0B7285; --t-green:#047857; --t-amber:#B45309; --t-red:#B91C1C;
  --boutique:#7A4A3A; --boutique-rgb:122,74,58; --piste:#8DB4D4; --piste-rgb:141,180,212;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--t-bg); color:var(--t-text); font-family:var(--t-sans); min-height:100vh;}
body{display:flex; justify-content:center;}
a{color:inherit;}
.app{width:100%; max-width:1100px; min-height:100vh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 16px 40px; overflow-x:hidden;}

/* En-tête avec image */
.header{position:relative; margin:12px 0 0; border-radius:14px; overflow:hidden; border:1px solid var(--t-line); min-height:190px; display:flex; align-items:flex-end; background:var(--t-panel);}
.header img.entete{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--banniere-cadrage);}
.header::after{content:''; position:absolute; inset:0; background:linear-gradient(0deg, rgba(7,19,30,.86) 0%, rgba(7,19,30,.55) 45%, rgba(7,19,30,.15) 100%);}
:root[data-theme="jour"] .header::after{background:linear-gradient(0deg, rgba(7,19,30,.78) 0%, rgba(7,19,30,.45) 45%, rgba(7,19,30,.08) 100%);}
@media (max-width:599px){
  .header{min-height:210px;}
  .header::after, :root[data-theme="jour"] .header::after{background:linear-gradient(0deg, rgba(7,19,30,.94) 0%, rgba(7,19,30,.82) 50%, rgba(7,19,30,.5) 100%);}
}
.header-texte{position:relative; z-index:1; padding:18px; width:100%; color:#EDF1F5;}
.eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#7FE9F0;}
.title{font-size:26px; font-weight:600; margin-top:4px;}
.subtitle{font-size:14px; color:#C9D3DC; margin-top:4px;}
.menu-btn{position:absolute; z-index:2; top:12px; left:12px; text-decoration:none; font-size:12px; padding:9px 13px; min-height:44px; display:inline-flex; align-items:center; border-radius:20px; background:rgba(7,19,30,.72); color:#EDF1F5; border:1px solid rgba(255,255,255,.25);}
.menu-btn:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}

.carte{background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:18px;}
.titre-section{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-mid); margin:28px 0 12px; display:flex; align-items:center; gap:10px;}
.titre-section::after{content:''; flex:1; height:1px; background:var(--t-line);}

/* Conseiller */
.conseiller{border-color:var(--t-cyan); margin-top:18px; display:flex; gap:14px; align-items:flex-start;}
.conseiller-avatar{width:38px; height:38px; border-radius:50%; flex:none; object-fit:cover;}
.conseiller-corps{min-width:0;}
.conseiller-titre{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-cyan); margin-bottom:6px;}
.conseiller p{font-size:14.5px; line-height:1.6; margin-top:4px; overflow-wrap:anywhere;}

.btn{font-family:var(--t-sans); font-size:14px; font-weight:600; min-height:44px; padding:10px 18px; border-radius:10px; border:1px solid rgba(var(--boutique-rgb),.7); background:rgba(var(--boutique-rgb),.14); color:var(--t-text); cursor:pointer; margin-top:18px;}
.btn:hover{background:rgba(var(--boutique-rgb),.24);}
.btn:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.btn[disabled]{opacity:.6; cursor:default;}

/* Formulaire */
.promo-form{display:none; margin-top:14px;}
.promo-form.open{display:block;}
.champ{margin-bottom:16px;}
.champ:last-child{margin-bottom:0;}
.champ label{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--t-mid); margin-bottom:8px;}
.champ input[type=text], .champ input[type=date]{width:100%; background:var(--t-raised); border:1px solid var(--t-line); border-radius:8px; padding:10px 11px; min-height:44px; color:var(--t-text); font-family:var(--t-sans); font-size:14px;}
.champ input:focus-visible{outline:2px solid var(--t-cyan); outline-offset:1px;}
.dates{display:flex; gap:10px; flex-wrap:wrap;}
.dates > div{flex:1 1 140px; min-width:0;}
.groupe{display:flex; flex-wrap:wrap; gap:8px;}
.pill{font-family:var(--t-sans); font-size:12.5px; padding:10px 14px; min-height:44px; border-radius:22px; border:1px solid var(--t-line); background:var(--t-raised); color:var(--t-mid); cursor:pointer;}
.pill.active{border-color:var(--t-cyan); color:var(--t-cyan); font-weight:600; background:color-mix(in srgb, var(--t-cyan) 12%, transparent);}
.pill:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.ligne-ajout{display:flex; gap:8px;}
.ligne-ajout input{flex:1; min-width:0;}
.sugg{display:none; margin-top:6px; border:1px solid var(--t-line); border-radius:8px; background:var(--t-raised); overflow:hidden;}
.sugg.open{display:block;}
.sugg-liste{max-height:264px; overflow-y:auto;}
.champ .sugg-ligne{display:flex; letter-spacing:normal; text-transform:none; margin-bottom:0; align-items:center; gap:10px; width:100%; box-sizing:border-box; border-bottom:1px solid var(--t-line); padding:0 12px; height:44px; color:var(--t-text); font-family:var(--t-sans); font-size:13.5px; cursor:pointer;}
.sugg-ligne input{width:20px; height:20px; flex:none; margin:0;}
.sugg-ligne span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sugg-ligne.actif, .sugg-ligne:hover{background:color-mix(in srgb, var(--t-cyan) 12%, transparent);}
.sugg-pied{padding:8px 12px;}
.sugg-total{display:block; font-size:12px; color:var(--t-muted, var(--t-text)); margin-bottom:6px;}
.sugg-pied .btn{margin-top:0;}
.sugg-pied .btn:disabled{opacity:.5; cursor:default;}
.reprise{display:none; margin-top:10px;}
.reprise.open{display:block;}
.reprise .groupe{margin-top:10px;}
.reprise .pill{min-height:44px;}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chips .vide{font-size:12px; color:var(--t-mid);}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:6px 6px 6px 12px; border-radius:18px; background:var(--t-raised); border:1px solid var(--t-line); overflow-wrap:anywhere;}
.chip button{background:none; border:0; color:var(--t-mid); cursor:pointer; min-width:32px; min-height:32px; font-size:14px;}
.msg-erreur{margin-top:10px; padding:9px 11px; background:color-mix(in srgb, var(--t-red) 14%, transparent); color:var(--t-red); border-radius:8px; font-size:12.5px;}
.msg-ok{margin-top:10px; padding:9px 11px; background:color-mix(in srgb, var(--t-green) 14%, transparent); color:var(--t-green); border-radius:8px; font-size:12.5px; text-align:center;}

/* Promotions */
.promo{background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:16px; margin-bottom:10px;}
.promo-haut{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.promo-nom{font-size:15px; font-weight:600; overflow-wrap:anywhere; min-width:0;}
.promo-dates{font-family:var(--t-mono); font-size:11.5px; color:var(--t-mid); margin-top:3px;}
.statut{font-size:11px; padding:4px 10px; border-radius:20px; border:1px solid var(--t-line); color:var(--t-mid); white-space:nowrap;}
.statut.encours{color:var(--t-green); border-color:var(--t-green);}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
.badge{font-size:11px; padding:4px 10px; border-radius:20px; background:var(--t-raised); color:var(--t-mid); overflow-wrap:anywhere;}
.promo-produits{font-size:12.5px; color:var(--t-mid); line-height:1.5; margin-bottom:8px; overflow-wrap:anywhere;}
.promo-produits b{color:var(--t-text);}
.ligne{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:7px 0; border-top:1px solid var(--t-line);}
.ligne .cle{color:var(--t-mid);}
.ligne .val{font-family:var(--t-mono); font-weight:500; text-align:right;}
.note{font-size:12.5px; color:var(--t-mid); line-height:1.5; padding-top:8px; border-top:1px solid var(--t-line);}
.sous-titre{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--t-mid); margin:10px 0 2px;}
.vide{padding:24px 8px; text-align:center; color:var(--t-mid); font-size:13px;}
/* Bilan visuel */
.ico-p{display:inline-block; width:28px; height:28px; flex:none; object-fit:contain; vertical-align:middle;}
.ico-t{width:22px; height:22px;}
.conseiller-titre{display:flex; align-items:center; gap:8px;}
.bilan{background:var(--t-panel); border:1px solid var(--t-amber); border-radius:14px; padding:18px; margin-top:12px;}
.b-entete{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.b-eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t-amber);}
.b-nom{font-size:20px; font-weight:600; margin-top:4px; overflow-wrap:anywhere;}
.b-meta{font-size:13px; color:var(--t-mid); margin-top:4px; line-height:1.5;}
.b-meta span{display:inline-flex; align-items:center; gap:6px; margin-right:12px;}
.b-grille{display:grid; grid-template-columns:1fr; gap:16px; margin-top:16px;}
.b-tuiles{display:grid; grid-template-columns:1fr; gap:10px;}
.b-tuile{background:var(--t-raised); border:1px solid var(--t-line); border-radius:12px; padding:14px; min-width:0;}
.b-tuile-haut{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--t-mid);}
.b-val{font-family:var(--t-mono); font-size:21px; font-weight:600; margin-top:8px; overflow-wrap:anywhere;}
.b-sous{font-size:12.5px; color:var(--t-mid); line-height:1.45; margin-top:4px; overflow-wrap:anywhere;}
.b-g5{font-size:12.5px; font-weight:600; margin-top:6px; color:var(--t-text);}
.b-g5.hausse{color:var(--t-green);}
.b-g5.baisse{color:var(--t-red);}
.b-lateral{display:flex; flex-direction:column; gap:12px; min-width:0;}
.b-bloc{background:var(--t-raised); border:1px solid var(--t-line); border-radius:12px; padding:14px;}
.b-bloc h3{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--t-mid); margin-bottom:10px;}
.b-etat{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px;}
.b-etat img{width:24px; height:24px;}
.b-bloc ul{list-style:none; display:flex; flex-direction:column; gap:8px; font-size:13.5px; line-height:1.5;}
.b-bloc li{overflow-wrap:anywhere;}
.b-graphe{margin-top:16px;}
.b-barres{display:flex; align-items:flex-end; justify-content:space-around; gap:12px; height:170px; padding-top:8px; border-bottom:1px solid var(--t-line);}
.b-col{flex:1; max-width:120px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0;}
.b-barre{width:100%; border-radius:6px 6px 0 0; background:rgba(var(--boutique-rgb),.45); min-height:3px;}
.b-col.pendant .b-barre{background:var(--boutique);}
.t-carburant .b-barre{background:rgba(var(--piste-rgb),.45);}
.t-carburant .b-col.pendant .b-barre{background:var(--piste);}
.t-mixte .b-barre{background:linear-gradient(to top,rgba(var(--boutique-rgb),.45),rgba(var(--piste-rgb),.45));}
.t-mixte .b-col.pendant .b-barre{background:linear-gradient(to top,var(--boutique),var(--piste));}
.b-barre-val{font-family:var(--t-mono); font-size:12px; margin-bottom:4px; white-space:nowrap;}
.b-legendes{display:flex; justify-content:space-around; gap:12px;}
.b-legende{flex:1; max-width:120px; text-align:center; font-size:12px; color:var(--t-mid); padding-top:6px; min-width:0;}
.b-legende b{display:block; color:var(--t-text); font-weight:600;}
.b-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
.b-actions .btn{margin-top:10px;}
.b-detail{margin-top:16px; border-top:1px solid var(--t-line); padding-top:4px;}
.b-detail[hidden]{display:none;}
.c-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.c-actions .btn{flex:1 1 140px; margin-top:0;}
.b-carte-wrap{display:flex; flex-direction:column; gap:8px;}
.form-titre{font-size:15px; font-weight:600; margin-bottom:12px;}
.form-titre[hidden], #formNote[hidden], .fiche[hidden]{display:none;}
.fiche .promo-nom{font-size:16px;}
.b-cartes{display:grid; grid-template-columns:1fr; gap:10px;}
.b-carte{display:block; width:100%; text-align:left; font-family:var(--t-sans); color:var(--t-text); background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:14px 16px; min-height:44px; cursor:pointer;}
.b-carte:hover{border-color:rgba(var(--boutique-rgb),.7);}
.b-carte:focus-visible{outline:2px solid var(--t-cyan); outline-offset:2px;}
.b-carte .promo-nom{margin-bottom:2px;}
.b-carte .ligne:first-of-type{margin-top:8px;}
.b-carte-lien{display:block; margin-top:8px; font-size:12.5px; font-weight:600; color:var(--t-cyan);}
@media (min-width:768px){
  .b-grille{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);}
  .b-tuiles{grid-template-columns:1fr 1fr;}
  .b-cartes{grid-template-columns:1fr 1fr;}
}
.intro-historique{font-size:13px; color:var(--t-mid); margin-bottom:12px; line-height:1.5;}
.intro-historique b{color:var(--t-text);}

/* Six cartes : une colonne en mobile, deux ensuite, jamais de défilement horizontal */
.tuiles{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:600px){.tuiles{grid-template-columns:1fr 1fr;}}
@media (min-width:900px){.tuiles{grid-template-columns:repeat(3,1fr);}}
.tuile{min-height:44px; background:var(--t-panel); border:1px solid var(--t-line); border-radius:14px; padding:16px; font-size:13.5px; cursor:default; min-width:0;}
.picto-p{display:block; width:48px; height:48px; margin-bottom:8px;}
.t-titre{display:block; font-weight:600; overflow-wrap:anywhere;}
.t-sous{display:block; font-size:12px; color:var(--t-mid); margin-top:4px; line-height:1.5;}
.prep{display:inline-block; margin-top:10px; font-size:11px; padding:3px 10px; border-radius:20px; background:var(--t-raised); color:var(--t-mid);}

/* Planche de démonstration des états */
.etats{display:flex; flex-wrap:wrap; gap:10px;}
.etat{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 14px; border-radius:22px; border:1px solid var(--t-line); background:var(--t-raised); color:var(--t-text);}
.etat img, .etat svg{width:24px; height:24px; flex:none;}
.etat.e-insuffisante{border-color:var(--t-red);}
.etat.e-a-ameliorer{border-color:var(--t-amber);}
.etat.e-encourageante{border-color:var(--t-cyan);}
.etat.e-a-renouveler{border-color:var(--t-green);}
.etat.e-non-mesurable{border-color:var(--t-mid); border-style:dashed;}
.reserve{margin:40px auto; padding:24px; text-align:center; color:var(--t-mid);}

/* Simulateur de promotion */
button.tuile{display:block; width:100%; text-align:left; font-family:var(--t-sans); color:var(--t-text); cursor:pointer;}
button.tuile:hover, button.tuile:focus-visible{border-color:var(--t-cyan);}
.sim{margin-top:16px;}
.sim[hidden]{display:none;}
.sim-banniere{border:1px solid var(--t-amber); border-radius:12px; padding:12px 14px; background:color-mix(in srgb, var(--t-amber) 10%, transparent); margin-bottom:14px;}
.sim-banniere strong{display:block; overflow-wrap:anywhere;}
.sim-banniere span{display:block; font-size:12.5px; color:var(--t-mid); margin-top:4px; overflow-wrap:anywhere;}
.sim-produit{border:1px solid var(--t-line); border-radius:12px; padding:12px; margin-bottom:12px; background:var(--t-panel); min-width:0;}
.sim-grille{display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px;}
@media (min-width:600px){.sim-grille{grid-template-columns:1fr 1fr;}}
.sim-grille label, .sim-produit > label{display:block; font-size:12.5px; color:var(--t-mid); min-width:0; overflow-wrap:anywhere;}
.sim-grille input, .sim-produit input{display:block; width:100%; min-width:0; min-height:44px; margin-top:4px; box-sizing:border-box; background:var(--t-raised); border:1px solid var(--t-line); border-radius:8px; color:var(--t-text); padding:8px 10px; font-family:var(--t-sans); font-size:14px;}
.sim-case{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--t-text);}
.sim-produit .sim-case input[type=checkbox]{display:inline-block; width:20px; min-height:20px; height:20px; margin:0; padding:0; flex:none;}
.sim-source{font-size:12px; color:var(--t-mid); margin-top:4px; overflow-wrap:anywhere;}
.sim-alerte{font-size:12.5px; margin-top:6px; color:var(--t-amber); overflow-wrap:anywhere;}
.sim-aide{margin-top:10px; font-size:12.5px;}
.sim-aide summary{cursor:pointer; min-height:44px; display:flex; align-items:center;}
.sim-res{margin-top:12px; font-size:13.5px; overflow-wrap:anywhere;}
.sim-res .ligne-res{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--t-line);}
.sim-res .ligne-res span:first-child{min-width:0; color:var(--t-mid);}
.sim-res .ligne-res span:last-child{flex:none; text-align:right;}
.sim-table{width:100%; table-layout:fixed; border-collapse:collapse; margin-top:10px; font-size:12px;}
.sim-table th, .sim-table td{padding:6px 4px; border-bottom:1px solid var(--t-line); text-align:right; vertical-align:top; overflow-wrap:anywhere; word-break:break-word;}
.sim-table th:first-child, .sim-table td:first-child{text-align:left;}
.sim-etiquette{display:inline-block; font-size:12px; padding:3px 10px; border-radius:20px; border:1px solid var(--t-line); background:var(--t-raised); margin-bottom:6px;}
.sim-perte{color:var(--t-red);}
.sim-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px;}
.sim-actions button{min-height:44px;}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <img class="entete" id="entete"
      src="assets/campagne/campagne-entete-1200.webp"
      srcset="assets/campagne/campagne-entete-800.webp 800w, assets/campagne/campagne-entete-1200.webp 1200w, assets/campagne/campagne-entete-1600.webp 1600w"
      sizes="(min-width:1100px) 1100px, 100vw" width="1600" height="533" alt="">
    <a href="NEXUS-App-v1.html" class="menu-btn" id="lienMenu"></a>
    <div class="header-texte">
      <div class="eyebrow" id="hEyebrow"></div>
      <div class="title" id="hTitre"></div>
      <div class="subtitle" id="hSous"></div>
    </div>
  </header>

  <div class="carte conseiller" id="conseiller">
    <img class="conseiller-avatar" src="assets/avatar/nexus-avatar-128.png"
      srcset="assets/avatar/nexus-avatar-64.png 64w, assets/avatar/nexus-avatar-96.png 96w, assets/avatar/nexus-avatar-128.png 128w, assets/avatar/nexus-avatar-256.png 256w"
      sizes="38px" width="38" height="38" alt="Conseiller NEXUS">
    <div class="conseiller-corps">
      <div class="conseiller-titre" id="cTitre"></div>
      <div id="cTexte"></div>
    </div>
  </div>

  <div><button type="button" class="btn" id="btnNouvelle"></button></div>

  <section class="carte reprise" id="brouillonReprise" role="group" aria-live="polite">
    <div id="brouillonTexte"></div>

const V = window.NexusVocab.campagne;
const NC = window.NexusCampagnes;

let EMPLOYEE = null, SITE_ID = null;
let CATALOGUE_ARTICLES = [];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const $ = id => document.getElementById(id);
const fmtEur = v => Math.round(v).toLocaleString('fr-FR') + ' €';
const fmtPct = v => (v === null || v === undefined) ? V.nonDisponible : ((v >= 0 ? '+' : '') + (v * 100).toFixed(1).replace('.', ',') + ' %');
const fmtNb = v => Math.round(v).toLocaleString('fr-FR');
const fmtEur2 = v => v.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
function fmtDateCourt(iso){
  return NexusTempo.dateLocale(iso).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function aujourdhui(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function statutDe(imp){
  const t = aujourdhui();
  if (imp.dateDebut > t) return 'avenir';
  if (imp.dateFin < t) return 'terminee';
  return 'encours';
}

async function fetchAllRows(factory, pageSize){
  pageSize = pageSize || 1000;
  let from = 0, all = [];
  while (true){
    const { data, error } = await factory().range(from, from + pageSize - 1);
    if (error) return { data: null, error };
    all = all.concat(data || []);
    if (!data || data.length < pageSize) break;
    from += pageSize;
  }
  return { data: all, error: null };
}

  $('tuiles').innerHTML = V.cartes.map(c => {

      '<img class="picto-p" src="' + IC + 'premium/campagne-' + esc(c.cle) + '.svg"' +
      ' srcset="' + IC + 'premium/campagne-' + esc(c.cle) + '-48.webp 48w, ' + IC + 'premium/campagne-' + esc(c.cle) + '-96.webp 96w, ' + IC + 'premium/campagne-' + esc(c.cle) + '-144.webp 144w"' +
      ' sizes="48px" width="48" height="48" alt="">' +
      '<span class="t-titre">' + esc(c.titre) + '</span>' +
      '<span class="t-sous">' + esc(c.texte) + '</span>';
    return c.dispo
      ? '<button type="button" class="tuile" data-carte="' + esc(c.cle) + '">' + corps + '</button>'

/* ---------- Formulaire ---------- */
const etatForm = { type: null, nature: null, objectif: null };
let produitsSelectionnes = [];
let selectionSugg = {};
const nbSelection = () => Object.keys(selectionSugg).length;
let suggActif = -1, suggNaviguee = false;

/* Brouillon local : reprise d'une saisie interrompue (stockage de l'appareil, jamais la base). */
const BROUILLON_DUREE_MS = 24 * 3600 * 1000;
function brouillonCle(site, empId){ return 'nexus_campagne_brouillon_' + site + '_' + empId; }
function brouillonVide(d){
  return !(d.nom || d.dateDebut || d.dateFin || d.type || d.nature || d.objectif || d.objectifLibre || (d.produits && d.produits.length));
}
function brouillonLire(stock, cle, maintenant){
  try {
    const brut = stock.getItem(cle);
    if (!brut) return null;
    const d = JSON.parse(brut);
    if (!d || typeof d.t !== 'number' || maintenant - d.t >= BROUILLON_DUREE_MS){
      try { stock.removeItem(cle); } catch (e) {}
      return null;
    }
    return d;
  } catch (e) { return null; }
}
function brouillonEcrire(stock, cle, d, maintenant){
  try {
    if (brouillonVide(d)){ stock.removeItem(cle); return false; }
    stock.setItem(cle, JSON.stringify(Object.assign({}, d, { t: maintenant })));
    return true;
  } catch (e) { return false; }
}
function brouillonEffacer(stock, cle){ try { stock.removeItem(cle); } catch (e) {} }
function brouillonQuestion(d, textes){
  const dt = new Date(d.t), z = n => String(n).padStart(2, '0');
  const nom = d.nom ? textes.brouillonNom.replace('{nom}', d.nom) : '';
  return textes.brouillonQuestion.replace('{date}', z(dt.getDate()) + '/' + z(dt.getMonth() + 1))
    .replace('{heure}', z(dt.getHours()) + ' h ' + z(dt.getMinutes())).replace('{nom}', nom);
}
function listeSuggestions(catalogue, q, deja){
  q = String(q || '').trim().toLowerCase();
  if (!q) return [];
  const libres = catalogue.filter(a => !deja.has(a.toLowerCase()));
  const debut = libres.filter(a => a.toLowerCase().startsWith(q));
  const contient = libres.filter(a => !a.toLowerCase().startsWith(q) && a.toLowerCase().includes(q));
  return debut.concat(contient);
}
function stockage(){ try { return window.localStorage || null; } catch (e) { return null; } }
function cleBrouillonCourante(){ return brouillonCle(SITE_ID, EMPLOYEE && EMPLOYEE.id); }
function etatBrouillon(){
  return { nom: $('promoNom').value, dateDebut: $('promoDateDebut').value, dateFin: $('promoDateFin').value,
    type: etatForm.type, nature: etatForm.nature, objectif: etatForm.objectif,
    objectifLibre: $('promoObjectifLibre').value, produits: produitsSelectionnes.slice() };
}
function sauverBrouillon(){
  if (MODIF_ID) return;   // la modification d'une campagne n'écrit jamais le brouillon de « Nouvelle promotion »
  const st = stockage(); if (!st) return;
  brouillonEcrire(st, cleBrouillonCourante(), etatBrouillon(), Date.now());
}
function effacerBrouillon(){ const st = stockage(); if (st) brouillonEffacer(st, cleBrouillonCourante()); }
function remplirDepuis(d){
  $('promoNom').value = d.nom || ''; $('promoDateDebut').value = d.dateDebut || ''; $('promoDateFin').value = d.dateFin || '';
  $('promoObjectifLibre').value = d.objectifLibre || '';
  ['type', 'nature', 'objectif'].forEach(g => {
    etatForm[g] = d[g] || null;
    document.querySelectorAll('.pill[data-groupe="' + g + '"]').forEach(p => p.classList.toggle('active', p.dataset.valeur === etatForm[g]));
  });
  $('blocLibre').style.display = etatForm.objectif === 'autre' ? 'block' : 'none';
  produitsSelectionnes = Array.isArray(d.produits) ? d.produits.slice() : [];
  renderChips();
}
function ouvrirForm(){
  $('promoForm').classList.add('open'); $('btnNouvelle').textContent = V.boutonAnnuler;
}
function cacherReprise(){ $('brouillonReprise').classList.remove('open'); }
function toggleForm(){
  const f = $('promoForm');
  if (!f.classList.contains('open')){
    const st = stockage();
    const d = st ? brouillonLire(st, cleBrouillonCourante(), Date.now()) : null;
    if (d){
      $('brouillonTexte').textContent = brouillonQuestion(d, V);
      $('brouillonReprise').classList.add('open');
      return;
    }
  }
  cacherReprise();
  const ouvert = f.classList.toggle('open');
  $('btnNouvelle').textContent = ouvert ? V.boutonAnnuler : V.boutonNouvelle;
  if (!ouvert) reinitialiserForm();
}
function reprendreSaisie(){
  const st = stockage();
  const d = st ? brouillonLire(st, cleBrouillonCourante(), Date.now()) : null;
  cacherReprise(); ouvrirForm();
  if (d) remplirDepuis(d);
}
function nouvelleSaisieVierge(){
  effacerBrouillon(); cacherReprise(); reinitialiserForm(); ouvrirForm();
}
function reinitialiserForm(){
  $('promoNom').value = ''; $('promoDateDebut').value = ''; $('promoDateFin').value = '';
  $('promoObjectifLibre').value = ''; $('blocLibre').style.display = 'none';
  $('promoProduitInput').value = '';
  etatForm.type = etatForm.nature = etatForm.objectif = null;
  produitsSelectionnes = [];
  selectionSugg = {};
  document.querySelectorAll('#promoForm .pill.active').forEach(p => p.classList.remove('active'));
  masquerSuggestions(); renderChips(); $('formMessage').innerHTML = '';
  sortirModification();
}
function choisirPill(groupe, valeur, el){
  etatForm[groupe] = valeur;
  document.querySelectorAll('.pill[data-groupe="' + groupe + '"]').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  if (groupe === 'objectif') $('blocLibre').style.display = valeur === 'autre' ? 'block' : 'none';
  sauverBrouillon();
}
function ajouterUnProduit(nom){
  nom = String(nom || '').trim();
  if (!nom) return;
  if (!produitsSelectionnes.some(p => p.toLowerCase() === nom.toLowerCase())) produitsSelectionnes.push(nom);
  $('promoProduitInput').value = '';
  masquerSuggestions(); renderChips(); sauverBrouillon();
}
function ajouterSelection(){
  if (!nbSelection()) return;
  Object.keys(selectionSugg).forEach(k => { const nom = selectionSugg[k];
    if (!produitsSelectionnes.some(p => p.toLowerCase() === nom.toLowerCase())) produitsSelectionnes.push(nom);
  });
  selectionSugg = {};
  $('promoProduitInput').value = '';
  masquerSuggestions(); renderChips(); sauverBrouillon();
}
function majBoutonSelection(){
  const b = $('btnAjouterSel'); if (!b) return;
  b.disabled = !nbSelection();
  b.textContent = V.suggAjouterSelection.replace('{n}', nbSelection());
}
function lignesSugg(){ return Array.from(document.querySelectorAll('#suggestions .sugg-ligne')); }
function marquerActif(i, defiler){
  const l = lignesSugg(); if (!l.length) return;
  suggActif = Math.max(0, Math.min(l.length - 1, i));
  l.forEach((el, k) => el.classList.toggle('actif', k === suggActif));
  if (defiler && l[suggActif].scrollIntoView) l[suggActif].scrollIntoView({ block: 'nearest' });
}
function rechercherProduits(){
  const box = $('suggestions');
  const deja = new Set(produitsSelectionnes.map(p => p.toLowerCase()));
  const liste = listeSuggestions(CATALOGUE_ARTICLES, $('promoProduitInput').value, deja);
  if (!liste.length){ masquerSuggestions(); return; }
  suggActif = 0; suggNaviguee = false;
  box.innerHTML = '<div class="sugg-liste" role="listbox" aria-multiselectable="true">' +
    liste.map((a, i) => '<label class="sugg-ligne' + (i === 0 ? ' actif' : '') + '" role="option"><input type="checkbox" data-nom="' + esc(a) + '"' +
      (selectionSugg[a.toLowerCase()] ? ' checked' : '') + '><span>' + esc(a) + '</span></label>').join('') +
    '</div><div class="sugg-pied">' +
    (liste.length > 6 ? '<span class="sugg-total">' + esc(V.suggTotal.replace('{n}', liste.length)) + '</span>' : '') +
    '<button type="button" class="btn" id="btnAjouterSel"></button></div>';
  majBoutonSelection();
  box.classList.add('open');
}
function masquerSuggestions(){ $('suggestions').classList.remove('open'); $('suggestions').innerHTML = ''; suggActif = -1; suggNaviguee = false; }
function renderChips(){
  const c = $('chips');
  if (!produitsSelectionnes.length){ c.innerHTML = '<span class="vide">' + esc(V.formAucunProduit) + '</span>'; return; }
  c.innerHTML = produitsSelectionnes.map((p, i) =>
    '<span class="chip">' + esc(p) + '<button type="button" data-retirer="' + i + '" aria-label="Retirer">✕</button></span>').join('');
}
async function validerCampagne(){
  const nom = $('promoNom').value.trim();
  const dateDebut = $('promoDateDebut').value, dateFin = $('promoDateFin').value;
  const msg = $('formMessage');
  msg.innerHTML = '';
  const erreur = t => { msg.innerHTML = '<div class="msg-erreur">' + esc(t) + '</div>'; };
  if (!nom || !dateDebut || !dateFin || !etatForm.type || !etatForm.nature || !etatForm.objectif) return erreur(V.formManque);
  if (dateFin < dateDebut) return erreur(V.formDates);
  const libre = $('promoObjectifLibre').value.trim();
  if (etatForm.objectif === 'autre' && !libre) return erreur(V.formAutre);
  const btn = $('btnValider');
  btn.disabled = true; btn.textContent = V.formEnregistrement;
  if (MODIF_ID){
    // Modification : un update filtré par id (et par site), jamais un insert. Une ligne refusée par la RLS ne renvoie pas d'erreur : on vérifie la ligne rendue.
    const { data, error: errMaj } = await nexusClient.from('campagnes_nexus').update({
      nom, date_debut: dateDebut, date_fin: dateFin, type: etatForm.type,
      produits_concernes: produitsSelectionnes, nature: etatForm.nature, objectif: etatForm.objectif,
      objectif_libre: etatForm.objectif === 'autre' ? libre : null, modifie_par: EMPLOYEE.id, modifie_le: new Date().toISOString(),
    }).eq('id', MODIF_ID).eq('site', SITE_ID).select('id');
    btn.disabled = false; btn.textContent = V.modifierValider;
    if (errMaj || !data || !data.length){ console.error('campagnes_nexus update', errMaj); return erreur(V.modifierErreur); }
    msg.innerHTML = '<div class="msg-ok">' + esc(V.modifierOk) + '</div>';
    setTimeout(async () => { toggleForm(); await chargerEtAfficher(); }, 700);
    return;
  }
  const { error } = await nexusClient.from('campagnes_nexus').insert({
    site: SITE_ID, nom, date_debut: dateDebut, date_fin: dateFin, type: etatForm.type,
    produits_concernes: produitsSelectionnes, nature: etatForm.nature, objectif: etatForm.objectif,
    objectif_libre: etatForm.objectif === 'autre' ? libre : null, cree_par: EMPLOYEE.id,
  });
  btn.disabled = false; btn.textContent = V.formValider;
  if (error){ console.error('campagnes_nexus insert', error); return erreur(V.formErreur); }
  effacerBrouillon();
  msg.innerHTML = '<div class="msg-ok">' + esc(V.formOk) + '</div>';
  setTimeout(async () => { toggleForm(); await chargerEtAfficher(); }, 700);
}
function brancherFormulaire(){
  $('btnNouvelle').addEventListener('click', toggleForm);
  $('btnValider').addEventListener('click', validerCampagne);
  $('btnAjouterProduit').addEventListener('click', () => ajouterUnProduit($('promoProduitInput').value));
  $('promoForm').addEventListener('click', e => {
    const p = e.target.closest('.pill[data-groupe]');
    if (p) choisirPill(p.dataset.groupe, p.dataset.valeur, p);
    const r = e.target.closest('[data-retirer]');
    if (r){
      const [retire] = produitsSelectionnes.splice(Number(r.dataset.retirer), 1);
      renderChips(); sauverBrouillon();
      if (MODIF_ID && mesureDuProduit(retire)){ $('formNote').textContent = V.modifierMesureGardee; $('formNote').hidden = false; }
    }
  });
  $('suggestions').addEventListener('change', e => {
    const c = e.target.closest('input[data-nom]'); if (!c) return;
    const k = c.dataset.nom.toLowerCase();
    if (c.checked) selectionSugg[k] = c.dataset.nom; else delete selectionSugg[k];
    majBoutonSelection();
  });
  $('suggestions').addEventListener('click', e => { if (e.target.closest('#btnAjouterSel')) ajouterSelection(); });
  $('suggestions').addEventListener('keydown', e => {
    if (e.key === 'Enter' && nbSelection()){ e.preventDefault(); ajouterSelection(); }
    if (e.key === 'Escape'){ masquerSuggestions(); $('promoProduitInput').focus(); }
  });
  document.addEventListener('mousedown', e => {
    if (!$('suggestions').classList.contains('open')) return;
    if (e.target.closest('#suggestions') || e.target.closest('#promoProduitInput')) return;
    masquerSuggestions();
  });
  $('promoProduitInput').addEventListener('input', rechercherProduits);
  $('promoProduitInput').addEventListener('keydown', e => {
    const ouvert = $('suggestions').classList.contains('open');
    if (e.key === 'Escape'){ masquerSuggestions(); return; }
    if (ouvert && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
      e.preventDefault(); suggNaviguee = true;
      marquerActif(suggActif + (e.key === 'ArrowDown' ? 1 : -1), true); return;
    }
    if (ouvert && e.key === ' ' && suggNaviguee){
      e.preventDefault();
      const c = lignesSugg()[suggActif] && lignesSugg()[suggActif].querySelector('input');
      if (c){ c.checked = !c.checked; c.dispatchEvent(new Event('change', { bubbles: true })); }
      return;
    }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (nbSelection()){ ajouterSelection(); return; }
    const l = lignesSugg()[suggActif >= 0 ? suggActif : 0];
    const c = l && l.querySelector('input');
    ajouterUnProduit(c ? c.dataset.nom : $('promoProduitInput').value);
  });
  const enregistrerSaisie = e => {
    if (e.target.id === 'promoProduitInput' || e.target.closest('#suggestions')) return;
    sauverBrouillon();
  };
  $('promoForm').addEventListener('input', enregistrerSaisie);
  $('promoForm').addEventListener('change', enregistrerSaisie);
  $('btnReprendre').addEventListener('click', reprendreSaisie);
  $('btnVierge').addEventListener('click', nouvelleSaisieVierge);
  renderChips();
}

  document.addEventListener('click', ev => {

async function chargerMesures(){
  const [m, c] = await Promise.all([
    nexusClient.from('campagne_mesures_produits').select('*').eq('site', SITE_ID),
    nexusClient.from('campagne_couts').select('campagne_id, libelle, montant_ht').eq('site', SITE_ID),
  ]);
  [['campagne_mesures_produits', m], ['campagne_couts', c]].forEach(([n, r]) => { if (r.error) console.error(n, r.error); });
  const grouper = rows => { const g = new Map(); (rows || []).forEach(r => { if (!g.has(r.campagne_id)) g.set(r.campagne_id, []); g.get(r.campagne_id).push(r); }); return g; };
  MES_TOUS = {mesures: grouper(m.data), couts: grouper(c.data)};
  BILANS.clear();
}
async function chargerEtAfficher(){
  const [aud, camp, prod, imp, pan] = await Promise.all([
    fetchAllRows(() => nexusClient.from('audits_caisse').select('date, quart, vente_piste, vente_boutique').eq('site', SITE_ID).order('date', {ascending: true})),
    nexusClient.from('campagnes_nexus').select('id, nom, date_debut, date_fin, type, produits_concernes, nature, objectif, objectif_libre, cree_le, modifie_le').eq('site', SITE_ID).order('date_debut', {ascending: false}),
    fetchAllRows(() => nexusClient.from('products').select('article, categorie, periode_debut, periode_fin, quantite, ca, marge').eq('site', SITE_ID)),
    nexusClient.from('campagnes_nexus_imports').select('campagne_id, phase, periode_debut, periode_fin').eq('site', SITE_ID),
    fetchAllRows(() => nexusClient.from('panier_moyen_quotidien').select('date, nb_tickets, panier_moyen_ht, panier_moyen_ttc').eq('site', SITE_ID).order('date', {ascending: true})),
  ]);
  [['audits_caisse', aud], ['campagnes_nexus', camp], ['products', prod], ['campagnes_nexus_imports', imp], ['panier_moyen_quotidien', pan]]
    .forEach(([n, r]) => { if (r.error) console.error(n, r.error); });
  if (camp.error){ $('cTexte').innerHTML = '<p>' + esc(V.erreurChargement) + '</p>'; return; }

  const produitsRows = prod.data || [];
  PRODUITS_ROWS = produitsRows;
  const cat = new Map();
  produitsRows.forEach(p => { if (p.article && !cat.has(p.article)) cat.set(p.article, p.categorie); });
  CATALOGUE_ARTICLES = Array.from(cat.keys()).sort((a, b) => a.localeCompare(b, 'fr'));

  const jours = NexusTempo.filtrerJoursClos(NexusTempo.agregerParJour(aud.data || []));
  CAMP_ROWS = camp.data || []; PAN_ROWS = pan.data || []; JOURS = jours;
  await chargerMesures();
  IMPACTS = NC.analyserCampagnes(camp.data || [], jours);
  IMPACTS.forEach(i => {
    const liees = (imp.data || []).filter(x => x.campagne_id === i.campagneId);
    i.impactProduits = NC.analyserImpactProduits(i, liees, produitsRows);
    i.impactPanierMoyen = NC.analyserImpactPanierMoyen(i, pan.data || []);
  });
  afficher();
}

const nombre = v => {
  const t = String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.');

const fmtPrix = v => v.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 3}) + ' €';
const fmtDec1 = v => v.toLocaleString('fr-FR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const fmtSigne = v => (v >= 0 ? '+' : '-') + Math.abs(Math.round(v)).toLocaleString('fr-FR') + ' €';
const saisie = v => (v == null ? '' : String(Math.round(v * 1000) / 1000).replace('.', ','));

function simMajNet(i){
  const e = SIM_ETAT[i], zone = document.querySelector('[data-net="' + i + '"]');

function simMode(e){
  const v = nombre(e.ventes);
  return (v === null || v <= 0) ? 'lancement' : 'compensation';
}

function simResultatProduit(e){
  const jours = nombre(e.jours) || 30;
  const venteAvant = nombre(e.venteAvant), ventePendant = nombre(e.ventePendant);
  const achatPendant = nombre(e.achatPendant), achatAvant = nombre(e.achatAvant);
  if (simMode(e) === 'lancement'){
    const achat = achatPendant !== null ? achatPendant : achatAvant;
    if (achat === null || venteAvant === null || ventePendant === null) return { html: '', calc: null };
    const r = SIM.calculerLancement({achat, venteNormale: venteAvant, ventePromo: ventePendant, jours}, SIM_VOLUMES_LANCEMENT);
    let h = '<span class="sim-etiquette">' + esc(SV.lancement) + '</span><div class="sim-source">' + esc(SV.lancementTexte) + '</div>';
    if (r.venteAPerte) h += '<div class="sim-alerte sim-perte">' + esc(SV.venteAPerte) + '</div>';
    if (r.irrecuperable) h += '<div class="sim-alerte sim-perte">' + esc(SV.irrecuperable) + '</div>';
    const mois = [1, 2, 3];
    h += '<table class="sim-table"><thead><tr><th>' + esc(SV.lancementVolumes) + '</th><th>' + esc(SV.colCout) + '</th><th>' + esc(SV.margePromo) + '</th>' +
      mois.map(m => '<th>' + esc(SV.colMensuel(m)) + '</th>').join('') + '</tr></thead><tbody>' +
      r.lignes.map(l => '<tr><td>' + fmtNb(l.volume) + '</td><td>' + fmtEur(l.cout) + '</td><td>' + fmtEur(l.margePromo) + '</td>' +
        l.mensuel.map(m => '<td>' + (m.ventes === null ? esc(SV.irrecuperable) : fmtNb(m.ventes)) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table>';
    return { html: h, calc: null };
  }
  if ([achatAvant, achatPendant, venteAvant, ventePendant].some(v => v === null)) return { html: '', calc: null };
  const r = SIM.calculerCompensation({ventesMoisPrecedent: nombre(e.ventes), achatAvant, achatPendant, venteAvant, ventePendant, jours});
  const ligne = (a, b) => '<div class="ligne-res"><span>' + esc(a) + '</span><span>' + b + '</span></div>';
  let h = ligne(SV.margeAvant, fmtPrix(r.margeAvant)) + ligne(SV.margePendant, fmtPrix(r.margePendant));
  if (r.impossible){
    h += '<div class="sim-alerte sim-perte">' + esc(SV.impossible) + '</div>';
  } else {
    h += ligne(SV.ratio, fmtDec1(r.ratio)) +
      ligne(SV.ventesEquilibre, fmtNb(r.ventesEquilibre)) + ligne(SV.hausseEquilibre, '+' + fmtNb(r.hausseEquilibrePct) + ' %') +
      ligne(SV.ventesRenouveler, fmtNb(r.ventesRenouveler)) + ligne(SV.hausseRenouveler, '+' + fmtNb(r.hausseRenouvelerPct) + ' %');
  }
  h += '<table class="sim-table"><thead><tr><th>' + esc(SV.colHypothese) + '</th><th>' + esc(SV.colVolume) + '</th><th>' + esc(SV.colMarge) + '</th><th>' + esc(SV.colEcart) + '</th></tr></thead><tbody>' +
    r.hypotheses.map(x => '<tr><td>' + esc(SV.hyp[x.cle]) + '</td><td>' + fmtNb(x.volume) + '</td><td>' + fmtEur(x.margeTotale) + '</td><td>' + fmtSigne(x.ecart) + '</td></tr>').join('') +
    '</tbody></table>';
  return { html: h, calc: r };
}

function simCalculer(){
  const calcs = [];
  SIM_ETAT.forEach((e, i) => {
    const r = simResultatProduit(e);

/* ---------- Mesure de la compensation (écrit dans campagne_mesures_produits, campagne_couts, fournisseurs_conditions ; jamais dans products) ---------- */
const MC = window.NexusMesureCompensation;
const MV = V.mesure;
const MES_CHAMPS = ['ventes', 'joursRef', 'achatAvant', 'achatPendant', 'venteAvant', 'ventePendant', 'stockDebut', 'stockFin', 'livraisons', 'pertes'];
let MES_CAMPAGNE = null, MES_PRODUITS = [], MES_COUTS = [], MES_FICHES = [];

function mesNouveau(){
  return { article: '', nouveau: false, fournisseur: '', catalogue: '', info: null, ventes: '', joursRef: '30', achatAvant: '', achatPendant: '', venteAvant: '', ventePendant: '',
           stockDebut: '', stockFin: '', livraisons: '', pertes: '', srcDebut: null, srcFin: null, notes: [] };
}
function mesJoursCampagne(c){
  const a = NexusTempo.dateLocale(c.dateDebut), b = NexusTempo.dateLocale(c.dateFin);
  return Math.round((b - a) / 86400000) + 1;
}
function mesBornes(iso){
  const d = NexusTempo.dateLocale(iso), f = new Date(d.getTime()); f.setDate(f.getDate() + 1);
  return [d.toISOString(), f.toISOString()];
}
// Stock à une date : comptage NEXUS du jour, sinon relevé Decenium du jour exact. Retourne {comptage, decenium}.
async function mesStockADate(article, iso){
  const [d0, d1] = mesBornes(iso);
  const out = { comptage: null, decenium: null };
  try {
    const zp = await nexusClient.from('inventaire_zone_produit').select('id').eq('site', SITE_ID).eq('designation', article);
    const ids = (zp.data || []).map(x => x.id);
    if (ids.length){
      const c = await nexusClient.from('inventaire_comptages').select('produit_id, quantite, compte_le, statut')
        .in('produit_id', ids).gte('compte_le', d0).lt('compte_le', d1).order('compte_le', {ascending: false});
      const parProduit = new Map();
      (c.data || []).forEach(r => { if (r.quantite != null && !parProduit.has(r.produit_id)) parProduit.set(r.produit_id, Number(r.quantite)); });
      if (parProduit.size) out.comptage = Array.from(parProduit.values()).reduce((s, v) => s + v, 0);
    }
  } catch (e) { console.error('comptage', e); }
  try {
    const s = await nexusClient.from('stock_releves').select('quantite_reelle, releve_le').eq('site', SITE_ID).eq('article', article)
      .gte('releve_le', d0).lt('releve_le', d1).order('releve_le', {ascending: false}).limit(1);
    if (s.data && s.data.length && s.data[0].quantite_reelle != null) out.decenium = Number(s.data[0].quantite_reelle);
  } catch (e) { console.error('decenium', e); }
  return out;
}
function mesFiche(nom){ return MES_FICHES.find(f => f.fournisseur === nom) || null; }
function mesMajAchatAvant(e){
  const f = mesFiche(e.fournisseur), cat = nombre(e.catalogue);
  if (f && cat != null){
    e.achatAvant = saisie(cat * (1 - Number(f.remise_habituelle_pct) / 100));
    e.notes = [MV.achatNetNote];
  }
}
async function mesPreremplir(i, article){
  const e = MES_PRODUITS[i];
  e.article = article;
  const s = SIM.suggestions(PRODUITS_ROWS, article, new Date());
  e.info = s; e.notes = [];
  if (s){
    e.ventes = saisie(Math.round(s.ventesMoisPrecedent));
    e.venteAvant = saisie(s.venteAvant);
    e.achatAvant = saisie(s.achatAvant);
    e.notes = [MV.achatDecenium];
  }
  const [debut, fin] = await Promise.all([mesStockADate(article, MES_CAMPAGNE.dateDebut), mesStockADate(article, MES_CAMPAGNE.dateFin)]);
  const d = MC.choisirStock({comptage: debut.comptage, decenium: debut.decenium});
  const f = MC.choisirStock({comptage: fin.comptage, decenium: fin.decenium});
  if (d.valeur !== null){ e.stockDebut = saisie(d.valeur); e.srcDebut = d.source; } else { e.srcDebut = null; }
  if (f.valeur !== null){ e.stockFin = saisie(f.valeur); e.srcFin = f.source; } else { e.srcFin = null; }
  mesPeindre();
}
function mesSource(src){ return MV.sources[src] || MV.sourceAucune; }
function mesPeindreProduit(e, i){
  const champ = (cle, lib, defaut) => '<label>' + esc(lib) + '<input type="text" inputmode="decimal" autocomplete="off" data-mi="' + i + '" data-mchamp="' + cle + '" value="' + esc(e[cle]) + '">' + (defaut ? '<span class="sim-source" data-mjdef="' + i + '">' + (String(e[cle]).trim() === '' && !e.nouveau ? esc(MV.joursDefaut) : '') + '</span>' : '') + '</label>';
  const opts = '<option value=""></option>' + MES_FICHES.map(f => '<option value="' + esc(f.fournisseur) + '"' + (f.fournisseur === e.fournisseur ? ' selected' : '') + '>' + esc(f.fournisseur) + '</option>').join('');
  return '<div class="sim-produit" data-mproduit="' + i + '">' +
    '<label>' + esc(MV.produit) + '<input type="text" autocomplete="off" data-mi="' + i + '" data-mchamp="article" value="' + esc(e.article) + '"></label>' +
    '<div class="sugg" data-msugg="' + i + '"></div>' +
    '<label class="sim-case"><input type="checkbox" data-mi="' + i + '" data-mchamp="nouveau"' + (e.nouveau ? ' checked' : '') + '> ' + esc(MV.nouveauProduit) + '</label>' +
    '<div class="sim-grille">' + champ('ventes', MV.ventesMois) + champ('joursRef', MV.joursRef, true) +
      champ('venteAvant', MV.venteAvant) + champ('ventePendant', MV.ventePendant) +
      champ('achatAvant', MV.achatAvant) + champ('achatPendant', MV.achatPendant) +
      '<label>' + esc(MV.stockDebut) + '<input type="text" inputmode="decimal" autocomplete="off" data-mi="' + i + '" data-mchamp="stockDebut" value="' + esc(e.stockDebut) + '"><span class="sim-source">' + esc(mesSource(e.srcDebut)) + '</span></label>' +
      '<label>' + esc(MV.stockFin) + '<input type="text" inputmode="decimal" autocomplete="off" data-mi="' + i + '" data-mchamp="stockFin" value="' + esc(e.stockFin) + '"><span class="sim-source">' + esc(mesSource(e.srcFin)) + '</span></label>' +
      champ('livraisons', MV.livraisons) + champ('pertes', MV.pertes) + '</div>' +
    '<div class="sim-source">' + esc(MV.pertesNote) + '</div>' +
    '<details class="sim-aide"><summary>' + esc(V.sim.aideAchat) + '</summary><div class="sim-grille">' +
      '<label>' + esc(MV.fournisseurNom) + '<select data-mi="' + i + '" data-mchamp="fournisseur">' + opts + '</select></label>' +
      champ('catalogue', V.sim.prixCatalogue) + '</div></details>' +
    e.notes.map(n => '<div class="sim-source">' + esc(n) + '</div>').join('') +
    '<div data-mres="' + i + '"></div>' +
    '<div class="sim-actions"><button type="button" class="btn" data-mretirer="' + i + '">' + esc(MV.retirer) + '</button></div></div>';
}
function mesPeindreCouts(){
  $('mesCouts').innerHTML = MES_COUTS.map((c, i) =>
    '<div class="sim-grille"><label>' + esc(MV.coutLibelle) + '<input type="text" autocomplete="off" data-ci="' + i + '" data-cchamp="libelle" value="' + esc(c.libelle) + '"></label>' +
    '<label>' + esc(MV.coutMontant) + '<input type="text" inputmode="decimal" autocomplete="off" data-ci="' + i + '" data-cchamp="montant" value="' + esc(c.montant) + '"></label>' +
    '<button type="button" class="btn" data-cretirer="' + i + '">' + esc(MV.retirer) + '</button></div>').join('');
}
function mesPeindre(){
  $('mesProduits').innerHTML = MES_PRODUITS.map(mesPeindreProduit).join('');
  mesPeindreCouts();
  mesCalculer();
}
function mesEntree(e, camp){
  const cible = camp === undefined ? MES_CAMPAGNE : camp;
  const dureeCampagne = cible ? mesJoursCampagne(cible) : null;
  return { article: e.article, nouveauProduit: e.nouveau, ventesMoisPrecedent: nombre(e.ventes), joursReference: nombre(e.joursRef),
    achatAvant: nombre(e.achatAvant), achatPendant: nombre(e.achatPendant), venteAvant: nombre(e.venteAvant), ventePendant: nombre(e.ventePendant),
    jours: dureeCampagne, stockDebut: nombre(e.stockDebut), livraisons: nombre(e.livraisons) || 0, stockFin: nombre(e.stockFin), pertes: nombre(e.pertes),
    prixNormal: e.info ? e.info.prixReference : null, promotionDeclaree: true };
}
function mesBlocProduit(l){
  if (!l.mesurable){
    return '<div class="sim-res"><strong>' + esc(MV.etats.non_mesurable) + '</strong><div class="sim-source">' + esc(MV.manquants + ' ' + l.manquants.map(m => MV.champs[m] || m).join(', ')) + '</div></div>';
  }
  if (l.lancement){
    return '<div class="sim-res"><strong>' + esc(MV.etats.lancement) + '</strong><div class="sim-source">' + esc(MV.lancement + ' ' + fmtEur(l.margePendantTotale)) + '</div></div>';
  }
  let h = '<div class="sim-res"><strong>' + esc(MV.etats[l.etat]) + '</strong>';
  if (l.impossible) h += '<div class="sim-alerte">' + esc(MV.impossible) + '</div>';
  else h += '<div class="sim-source">' + esc(MV.seuil + ' : ' + fmtDec1(l.seuil)) + '</div>';
  if (l.taux !== null) h += '<div class="sim-source">' + esc(MV.taux + ' : ' + fmtDec1(l.taux * 100) + ' %') + '</div>';
  h += '<div class="sim-source">' + esc(MV.ventesJourPendant + ' : ' + fmtDec1(l.ventesJourPendant)) + '</div>';
  if (l.gain !== null) h += '<div class="sim-source">' + esc(MV.gain + ' : ' + fmtSigne(l.gain)) + '</div>';
  if (l.prixSousNormal) h += '<div class="sim-alerte">' + esc(MV.prixSousNormal) + '</div>';
  return h + '</div>';
}
function mesCalculer(){
  if (!MES_CAMPAGNE) return;
  const entrees = MES_PRODUITS.map(e => mesEntree(e));
  const couts = MES_COUTS.map(c => ({montant_ht: nombre(c.montant) || 0}));
  const camp = MC.mesurerCampagne(entrees, couts);
  camp.lignes.forEach((l, i) => { const z = document.querySelector('[data-mres="' + i + '"]'); if (z) z.innerHTML = mesBlocProduit(l); });
  let h = '<div class="titre-section">' + esc(MV.resultatTitre) + '</div><div class="sim-res"><strong>' + esc(MV.etats[camp.etat]) + '</strong>';
  h += '<div class="sim-source">' + esc(MV.etatsNote[camp.etat]) + '</div>';
  if (camp.mesurable){
    h += '<div class="sim-source">' + esc(MV.taux + ' : ' + fmtDec1(camp.taux * 100) + ' %') + '</div>';
    h += '<div class="sim-source">' + esc(MV.tauxNote) + '</div>';
    h += '<div class="sim-source">' + esc(MV.gain + ' : ' + fmtSigne(camp.gain)) + '</div>';
    h += '<div class="sim-source">' + esc(MV.couts + ' : ' + fmtEur(camp.couts)) + '</div>';
    h += '<div class="sim-source">' + esc(MV.gainApresCouts + ' : ' + fmtSigne(camp.gainApresCouts)) + '</div>';
  } else if (camp.nbProduits){
    h += '<div class="sim-alerte">' + esc(MV.pasAssez) + '</div>';
  }
  if (camp.partMesurable !== null) h += '<div class="sim-source">' + esc(MV.partMesurable(Math.round(camp.partMesurable * 100))) + '</div>';
  if (camp.nbLancements) h += '<div class="sim-source">' + esc(MV.lancement + ' ' + fmtEur(camp.margeLancement)) + '</div>';
  $('mesResultat').innerHTML = h + '</div>';
}
async function mesCharger(campagneId){
  MES_CAMPAGNE = IMPACTS.find(i => i.campagneId === campagneId) || null;
  $('mesCorps').hidden = !MES_CAMPAGNE;
  $('mesStatut').textContent = '';
  if (!MES_CAMPAGNE) return;
  const [m, c, f] = await Promise.all([
    nexusClient.from('campagne_mesures_produits').select('*').eq('site', SITE_ID).eq('campagne_id', campagneId),
    nexusClient.from('campagne_couts').select('libelle, montant_ht').eq('site', SITE_ID).eq('campagne_id', campagneId),
    nexusClient.from('fournisseurs_conditions').select('fournisseur, remise_habituelle_pct').eq('site', SITE_ID).order('fournisseur'),
  ]);
  [['campagne_mesures_produits', m], ['campagne_couts', c], ['fournisseurs_conditions', f]].forEach(([n, r]) => { if (r.error) console.error(n, r.error); });
  MES_FICHES = f.data || [];
  MES_COUTS = (c.data || []).map(x => ({libelle: x.libelle, montant: saisie(Number(x.montant_ht))}));
  MES_PRODUITS = (m.data || []).map(mesDepuisLigne);
  if (!MES_PRODUITS.length) MES_PRODUITS.push(mesNouveau());
  mesPeindre();
}
async function mesEnregistrer(){
  const st = $('mesStatut');
  st.textContent = '';
  const lignes = MES_PRODUITS.filter(e => e.article.trim()).map(e => ({
    site: SITE_ID, campagne_id: MES_CAMPAGNE.campagneId, article: e.article.trim(), nouveau_produit: !!e.nouveau,
    ventes_mois_precedent: nombre(e.ventes), jours_reference: nombre(e.joursRef) || 30,
    achat_avant_ht: nombre(e.achatAvant), achat_pendant_ht: nombre(e.achatPendant), vente_avant_ht: nombre(e.venteAvant), vente_pendant_ht: nombre(e.ventePendant),
    stock_debut: nombre(e.stockDebut), stock_debut_source: e.srcDebut || (nombre(e.stockDebut) != null ? 'saisie' : null),
    stock_fin: nombre(e.stockFin), stock_fin_source: e.srcFin || (nombre(e.stockFin) != null ? 'saisie' : null),
    livraisons_pendant: nombre(e.livraisons) || 0, saisi_par: EMPLOYEE.id || null, modifie_le: new Date().toISOString(),
  }));
  let erreur = null;
  const camp = MES_CAMPAGNE.campagneId;
  // Les lignes déjà en base avant l'enregistrement : servent à retirer ce qui ne figure plus dans la liste.
  const avantP = await nexusClient.from('campagne_mesures_produits').select('id, article').eq('site', SITE_ID).eq('campagne_id', camp);
  const avantC = await nexusClient.from('campagne_couts').select('id').eq('site', SITE_ID).eq('campagne_id', camp);
  if (avantP.error || avantC.error){ console.error(avantP.error || avantC.error); erreur = avantP.error || avantC.error; }
  if (!erreur && lignes.length){
    const r = await nexusClient.from('campagne_mesures_produits').upsert(lignes, {onConflict: 'campagne_id,article'});
    if (r.error){ console.error(r.error); erreur = r.error; }
  }
  if (!erreur){
    const gardes = new Set(lignes.map(l => l.article));
    const retires = (avantP.data || []).filter(x => !gardes.has(x.article)).map(x => x.id);
    if (retires.length){
      const d = await nexusClient.from('campagne_mesures_produits').delete().in('id', retires);
      if (d.error){ console.error(d.error); erreur = d.error; }
    }
  }
  if (!erreur){
    // Coûts : on insère d'abord, puis on retire les anciennes lignes par identifiant (une insertion refusée ne perd rien).
    const couts = MES_COUTS.filter(c => c.libelle.trim() && nombre(c.montant) != null && nombre(c.montant) >= 0)
      .map(c => ({site: SITE_ID, campagne_id: camp, libelle: c.libelle.trim(), montant_ht: nombre(c.montant), saisi_par: EMPLOYEE.id || null}));
    if (couts.length){
      const r = await nexusClient.from('campagne_couts').insert(couts);
      if (r.error){ console.error(r.error); erreur = r.error; }
    }
    if (!erreur){
      const anciens = (avantC.data || []).map(x => x.id);
      if (anciens.length){
        const d = await nexusClient.from('campagne_couts').delete().in('id', anciens);
        if (d.error){ console.error(d.error); erreur = d.error; }
      }
    }
  }
  st.textContent = erreur ? MV.erreurEnregistrement : MV.enregistre;
  if (!erreur){ await chargerMesures(); afficher(); }
}
function mesBrancher(){
  const sel = $('mesCampagne');
  sel.addEventListener('change', () => mesCharger(sel.value));
  const zone = $('mesProduits');
  const maj = ev => {
    const el = ev.target;
    if (!el.dataset || el.dataset.mchamp === undefined) return;
    const i = Number(el.dataset.mi), c = el.dataset.mchamp, e = MES_PRODUITS[i];
    if (c === 'article'){
      e.article = el.value;
      const q = el.value.trim().toLowerCase();
      const box = document.querySelector('[data-msugg="' + i + '"]');
      const liste = q ? CATALOGUE_ARTICLES.filter(a => a.toLowerCase().includes(q)).slice(0, 8) : [];
      box.innerHTML = liste.map(a => '<button type="button" data-mchoix="' + i + '" data-article="' + esc(a) + '">' + esc(a) + '</button>').join('');
      box.classList.toggle('open', liste.length > 0);
      return;
    }
    if (c === 'nouveau'){ e.nouveau = el.checked; const sp = document.querySelector('[data-mjdef="' + i + '"]'); if (sp) sp.textContent = (String(e.joursRef).trim() === '' && !e.nouveau) ? MV.joursDefaut : ''; mesCalculer(); return; }
    e[c] = el.value;
    if (c === 'joursRef'){ const sp = document.querySelector('[data-mjdef="' + i + '"]'); if (sp) sp.textContent = (el.value.trim() === '' && !e.nouveau) ? MV.joursDefaut : ''; }
    if (c === 'stockDebut') e.srcDebut = 'saisie';
    if (c === 'stockFin') e.srcFin = 'saisie';
    if (c === 'fournisseur' || c === 'catalogue') mesMajAchatAvant(e);
    if (ev.type === 'change' && (c === 'fournisseur')) { mesPeindre(); return; }
    mesCalculer();
  };
  zone.addEventListener('input', maj);
  zone.addEventListener('change', maj);
  zone.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.mchoix !== undefined) mesPreremplir(Number(b.dataset.mchoix), b.dataset.article);
    else if (b.dataset.mretirer !== undefined){ MES_PRODUITS.splice(Number(b.dataset.mretirer), 1); mesPeindre(); }
  });
  $('mesCouts').addEventListener('input', ev => {
    const el = ev.target;
    if (!el.dataset || el.dataset.cchamp === undefined) return;
    MES_COUTS[Number(el.dataset.ci)][el.dataset.cchamp === 'montant' ? 'montant' : 'libelle'] = el.value;
    mesCalculer();
  });
  $('mesCouts').addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (b && b.dataset.cretirer !== undefined){ MES_COUTS.splice(Number(b.dataset.cretirer), 1); mesPeindreCouts(); mesCalculer(); }
  });
  $('mesAjouter').addEventListener('click', () => { MES_PRODUITS.push(mesNouveau()); mesPeindre(); });
  $('mesCoutAjouter').addEventListener('click', () => { MES_COUTS.push({libelle: '', montant: ''}); mesPeindreCouts(); });
  $('mesEnregistrer').addEventListener('click', mesEnregistrer);
  $('mesFermer').addEventListener('click', () => { $('mesure').hidden = true; });
  $('mesFournEnr').addEventListener('click', async () => {
    const nom = $('mesFournNom').value.trim(), rem = nombre($('mesFournRem').value);
    const st = $('mesFournStatut');
    if (!nom || rem == null || rem < 0 || rem >= 100){ st.textContent = MV.erreurEnregistrement; return; }
    const r = await nexusClient.from('fournisseurs_conditions').upsert({site: SITE_ID, fournisseur: nom, remise_habituelle_pct: rem, maj_par: EMPLOYEE.id || null, maj_le: new Date().toISOString()}, {onConflict: 'site,fournisseur'});
    if (r.error){ console.error(r.error); st.textContent = MV.erreurEnregistrement; return; }
    st.textContent = MV.fournisseurEnregistre;
    const f = MES_FICHES.find(x => x.fournisseur === nom);
    if (f) f.remise_habituelle_pct = rem; else MES_FICHES.push({fournisseur: nom, remise_habituelle_pct: rem});
    mesPeindre();
  });
  const carte = document.querySelector('[data-carte="compensation"]');
  if (carte) carte.addEventListener('click', () => ouvrirMesure(null));
}
function mesPeindreFixes(){
  $('mesTitre').textContent = MV.titre; $('mesIntro').textContent = MV.intro; $('mesChoisirLib').textContent = MV.choisir;
  $('mesPrefillNote').textContent = MV.prefillNote; $('mesAjouter').textContent = MV.ajouterProduit;
  $('mesCoutsTitre').textContent = MV.coutsTitre; $('mesCoutsNote').textContent = MV.coutsNote; $('mesCoutAjouter').textContent = MV.coutAjouter;
  $('mesEnregistrer').textContent = MV.enregistrer; $('mesFermer').textContent = MV.fermer;
  $('mesFournTitre').textContent = MV.fournisseurTitre; $('mesFournNote').textContent = MV.fournisseurNote;
  $('mesFournNomLib').textContent = MV.fournisseurNom; $('mesFournRemLib').textContent = MV.fournisseurRemise; $('mesFournEnr').textContent = MV.fournisseurEnregistrer;
}

peindreTextesFixes();
simPeindreFixes();
simBrancher();
mesPeindreFixes();
mesBrancher();
brancherBilan();
brancherFormulaire();
brancherFiche();
nexusRequireAuth().then(async employee => {
  if (!employee) return;
  if (employee.role !== 'manager' && employee.role !== 'gerant'){
    $('app').innerHTML = '<div class="reserve">' + esc(V.reserve) + '</div>';
    return;
  }
  EMPLOYEE = employee; SITE_ID = employee.site_id;
  if (!(await NexusForfait.nexusRequireProfessional('NEXUS-Campagne-v2.html', SITE_ID))) return;
  await chargerEtAfficher();
});
