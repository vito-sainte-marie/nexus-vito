      jaugeage_apres_le: m.jaugeage_apres_le || null,
      delta_mesure_l: M.calculerDeltaMesure(Number(m.jaugeage_avant_l), m.jaugeage_apres_l === '' ? null : Number(m.jaugeage_apres_l)),
    }));

    const anomalies = construireAnomaliesVisite();

    const { data, error } = await NexusReceptionDonnees.soumettreVisiteComplete(nexusClient, ligneVisite, lignesFinales, compartimentsFinaux, mesuresFinales, anomalies);
    enSoumission = false;
    if (error) {
      btn.disabled = false;
      btn.textContent = 'Terminer la réception';
      alert("Une erreur est survenue pendant l'enregistrement. Réessayez.");
      return;
    }
    derniereVisite = data;

    // Pont Réception → Carburants (21/08/2026) : la livraison vient d'être
    // enregistrée (preuve durable dans carburant_reception_*), on pousse
    // maintenant son jaugeage après-livraison dans carburant_releves pour
    // que le "stock" de Carburants Pilotage la reflète sans ressaisie
    // manuelle. Best-effort, non bloquant pour l'employé (Article 5, même
    // discipline que le statut de jaugeage pompiste) : si cette écriture
    // échoue, la mesure réelle reste en sécurité dans carburant_reception_
    // mesures — seul l'affichage du stock reste en retard, rattrapable.
    if (typeof NexusCarburantDonnees !== 'undefined' && data && data.id) {
      NexusCarburantDonnees.enregistrerReleveDepuisReceptionLivraison(nexusClient, siteId, {
        date: ligneVisite.date_visite,
        employeeId: employeeCourant.id,
        visiteId: data.id,
        mesures: mesuresFinales,
        cuvesGo: (config && config.cuvesCarburants && config.cuvesCarburants.go && config.cuvesCarburants.go.cuves) || [],
      }).then(r => { if (!r.ok) console.error('Pont réception carburant → stock (non bloquant):', r.error); })
        .catch(e => console.error('Pont réception carburant → stock (non bloquant):', e));
    }

    allerEtape('succes');
  }

  // ------------------------------------------------------------
  // SUCCÈS — message positif et rassurant
  // ------------------------------------------------------------
  function renderSucces() {
    const M = NexusReceptionMoteur;
    const statutGlobal = M.statutGlobalVisite(carburantsPrevus().map(c => resultatsParCarburant[c].statut));
    const tousCoherents = statutGlobal === 'coherente';
    document.getElementById('content').innerHTML = `
      <div class="checkmark">✓</div>
      <div class="final-greet">Réception terminée</div>
      <div class="final-liste">
        <div class="final-item"><i>✓</i>Tous les compartiments ont été réceptionnés.</div>
        <div class="final-item"><i>✓</i>Le chargement camion correspond au bon de livraison${derogationGlobaleCompartiments ? ' (déverrouillage manager tracé).' : '.'}</div>
        <div class="final-item"><i>${tousCoherents ? '✓' : '•'}</i>${tousCoherents ? 'Le rapprochement des jaugeages est cohérent avec les seuils de contrôle de la station.' : 'Un écart de rapprochement a été signalé — votre manager le consultera dans Carburants Performance.'}</div>
      </div>
      <div class="final-merci">Vous pouvez rouvrir la piste et reprendre le service carburant selon la procédure du site.</div>
      <div class="final-merci">Merci ${employeeCourant.nom} ! À bientôt lors de la prochaine livraison.</div>
      <button class="btn-primary" id="btnRetourAccueilFinal">Terminer</button>
    `;
    document.getElementById('btnRetourAccueilFinal').addEventListener('click', () => allerEtape('accueil'));
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    employeeCourant = employee;
    siteId = employee.site_id;
    demarrerHorloge();
    [config, managersSite] = await Promise.all([
      NexusReceptionDonnees.chargerConfigReception(nexusClient, siteId),
      chargerManagersSite(),
    ]);
    if (!config) config = { cuvesOrdonnees: [], cuvesCarburants: {}, nombreCompartimentsDefaut: 6, seuilEcartCompartimentsPct: 2, seuilEcartMesurePct: 2, consignesSecurite: [], contactManager: {} };
    render();
  });
</script>
</body>
