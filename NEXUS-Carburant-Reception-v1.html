<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Réception carburant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-header-nav.js"></script>
<script src="nexus-desktop.js"></script>
<script src="nexus-reception-moteur.js"></script>
<script src="nexus-reception-donnees.js"></script>
<script src="nexus-carburant-moteur.js"></script>
<script src="nexus-carburant-donnees.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
    --sp95:#34D399; --go:#F5A623; --gnr:#F0575A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .horodateur-discret{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:8px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  .stepper{display:flex; gap:6px; margin-bottom:16px;}
  .stepper-item{flex:1; height:5px; border-radius:3px; background:var(--panel-raised);}
  .stepper-item.fait{background:var(--green);}
  .stepper-item.actif{background:var(--cyan); opacity:0.85;}
  .stepper-label{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; margin-bottom:14px; letter-spacing:0.03em; text-transform:uppercase;}

  .champ-label{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); margin-bottom:6px; letter-spacing:0.03em;}
  .champ-label .optionnel{color:var(--text-dim); text-transform:none; letter-spacing:0; font-family:var(--sans);}
  .champ-input{
    width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    padding:12px 14px; color:var(--text); font-family:var(--mono); font-size:16px; margin-bottom:14px;
  }
  .champ-input.texte{font-family:var(--sans); font-size:15px;}
  .champ-input:focus{outline:none; border-color:var(--cyan);}
  .champ-note{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:14px; margin-top:-8px;}
  select.champ-input{appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0Z' fill='%238A96A5'/></svg>"); background-repeat:no-repeat; background-position:right 14px center;}

  /* ---- Coach NEXUS ---- */
  .nexus-dit{background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.25); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:12.5px; line-height:1.55; color:var(--text-mid);}
  .nexus-dit b{color:var(--text);}
  .nexus-dit .coach-tete{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--cyan);}

  /* ---- Accueil ---- */
  .accueil-hero{text-align:center; padding:6px 4px 4px;}
  .accueil-icone{width:64px; height:64px; border-radius:20px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:30px; background:radial-gradient(circle at 32% 28%, rgba(79,195,217,0.30), var(--panel-raised) 72%); box-shadow:inset 0 0 0 1px rgba(79,195,217,0.25);}
  .consignes-liste{display:flex; flex-direction:column; gap:8px; margin:10px 0 4px;}
  .consigne-item{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:var(--text-mid);}
  .consigne-puce{flex-shrink:0; width:18px; height:18px; border-radius:50%; background:var(--panel-raised); color:var(--cyan); font-size:10px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .consigne-theme{color:var(--text); font-weight:600;}

  /* ---- Carburant attendu (étape 1) ---- */
  .carburant-attendu-card{background:var(--panel); border:1.5px solid var(--hairline); border-radius:14px; padding:14px 16px; margin-bottom:10px; transition:border-color .15s;}
  .carburant-attendu-card.actif{border-color:var(--cc, var(--cyan));}
  .carburant-attendu-tete{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .carburant-attendu-nom{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700;}
  .carburant-pastille{width:10px; height:10px; border-radius:50%; background:var(--cc, var(--text-dim));}
  .toggle-switch{position:relative; width:42px; height:24px; border-radius:14px; background:var(--panel-raised); border:1px solid var(--hairline); cursor:pointer; flex-shrink:0;}
  .toggle-switch.on{background:rgba(79,195,217,0.25); border-color:var(--cyan);}
  .toggle-knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--text-dim); transition:left .15s, background .15s;}
  .toggle-switch.on .toggle-knob{left:20px; background:var(--cyan);}
  .carburant-attendu-corps{margin-top:12px;}
  .carburant-attendu-vide{font-size:12px; color:var(--text-dim); margin-top:2px;}

  /* ---- Jauge cuve (étapes 2 & 5) ---- */
  .cuve-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin-bottom:12px;}
  .cuve-titre{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cuve-titre-nom{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .cuve-titre .capacite{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); font-weight:500;}
  .cuve-jauge-visuelle{position:relative; height:22px; border-radius:8px; background:var(--panel-raised); border:1px solid var(--hairline); overflow:hidden; margin-bottom:12px;}
  .cuve-jauge-remplissage{position:absolute; left:0; top:0; bottom:0; border-radius:7px 0 0 7px; transition:width .3s ease;}
  .cuve-jauge-pct{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:10px; font-weight:700; color:var(--text-mid);}
  .cuve-avant-recap{display:flex; justify-content:space-between; font-size:12px; color:var(--text-mid); margin-bottom:8px; font-family:var(--mono);}
  .cuve-variation{font-family:var(--mono); font-size:13px; font-weight:700; text-align:right; margin-top:6px;}

  /* ---- Camion / compartiments ---- */
  .camion-cadre{background:var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:16px 12px; margin-bottom:14px;}
  .camion-titre{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px; text-align:center;}
  .camion-grille{display:flex; gap:6px;}
  .compartiment-bloc{
    flex:1; aspect-ratio:1/1.3; border-radius:10px; border:2px solid var(--hairline); background:var(--panel-raised);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
    font-family:var(--mono); position:relative; transition:transform .12s;
  }
  .compartiment-bloc:active{transform:scale(0.94);}
  .compartiment-numero{font-size:11px; color:var(--text-dim); font-weight:700;}
  .compartiment-carburant{font-size:10px; font-weight:700;}
  .compartiment-qte{font-size:9px; color:var(--text-dim);}
  .compartiment-check{position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--green); color:#04141a; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; border:2px solid var(--panel);}
  .compartiment-bloc.carb-sp95{border-color:var(--sp95); background:rgba(52,211,153,0.10);}
  .compartiment-bloc.carb-go{border-color:var(--go); background:rgba(245,166,35,0.10);}
  .compartiment-bloc.carb-gnr{border-color:var(--gnr); background:rgba(240,87,90,0.10);}
  .compartiment-bloc.non-receptionne{border-color:var(--red); background:var(--red-dim); animation:pulseAlerte 1.6s infinite;}
  .compartiment-bloc.compartiment-vide{border-color:var(--hairline); background:repeating-linear-gradient(45deg, var(--panel-raised), var(--panel-raised) 6px, var(--panel) 6px, var(--panel) 12px); opacity:0.7;}
  .compartiment-bloc.compartiment-vide .compartiment-carburant{color:var(--text-dim);}
  @keyframes pulseAlerte{0%,100%{box-shadow:0 0 0 0 rgba(240,87,90,0.35);} 50%{box-shadow:0 0 0 6px rgba(240,87,90,0);}}
  .camion-legende{display:flex; justify-content:center; gap:14px; margin-top:12px; font-size:10.5px; color:var(--text-mid);}
  .camion-legende span{display:inline-flex; align-items:center; gap:5px;}
  .camion-legende i{width:9px; height:9px; border-radius:50%; display:inline-block;}

  /* 15/08/2026 — rappel des quantités attendues (BL) en tête d'étape 3,
     pour comparer d'un coup d'œil pendant l'assignation des compartiments
     sans avoir à revenir à l'étape 1. */
  .rappel-bl{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .rappel-bl-item{flex:1; min-width:90px; display:flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:9px 12px;}
  .rappel-bl-item .carburant-pastille{flex-shrink:0;}
  .rappel-bl-nom{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em;}
  .rappel-bl-valeur{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--text);}

  /* 15/08/2026 — message explicite quand "Continuer" reste grisé faute de
     compartiment(s) pas encore complets (carburant + quantité + cuve) —
     remonté par Frédéric : le bouton restait grisé sans aucune explication
     même quand la somme des quantités correspondait déjà au BL, tant qu'un
     seul compartiment n'avait pas sa cuve de destination choisie. */
  .compartiments-incomplet{background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:12px; color:var(--text-mid); line-height:1.5;}
  .compartiments-incomplet b{color:var(--text);}

  .btn-ajuster-compartiments{width:100%; display:flex; gap:8px; margin-bottom:14px;}
  .btn-ajuster-compartiments button{flex:1; padding:9px; border:1.5px dashed var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:12px; font-weight:600; cursor:pointer;}

  .fiche-compartiment{background:var(--panel-raised); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin-bottom:14px;}
  .fiche-titre{font-size:13.5px; font-weight:700; margin-bottom:12px;}
  .carburant-chip-row{display:flex; gap:8px; margin-bottom:14px;}
  .carburant-chip{flex:1; text-align:center; padding:12px 6px; border-radius:10px; border:1.5px solid var(--hairline); background:var(--panel); font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer;}
  .carburant-chip.actif{border-color:var(--cc, var(--cyan)); background:rgba(79,195,217,0.14); color:var(--cc, var(--cyan));}

  .compartiment-total{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:13px; display:flex; justify-content:space-between; align-items:center;}
  .compartiment-total .valeur{font-family:var(--mono); font-weight:700;}
  .compartiment-total.ok{border-color:rgba(52,211,153,0.35); background:var(--green-dim);}
  .compartiment-total.ok .valeur{color:var(--green);}
  .compartiment-total.ecart{border-color:rgba(240,87,90,0.35); background:var(--red-dim);}
  .compartiment-total.ecart .valeur{color:var(--red);}

  /* ---- Blocage / anomalie ---- */
  /* 15/08/2026 — alerte capacité au jaugeage initial (étape 2) : le
     litrage attendu (BL, étape 1) ne rentre pas dans la place restante
     des cuves du carburant concerné. Ton amber (avertissement avant coup),
     pas rouge (pas un blocage — le pompiste peut décider d'appeler son
     manager ou de répartir autrement). */
  .capacite-alerte{background:var(--amber-dim); border:1.5px solid rgba(245,166,35,0.4); border-radius:12px; padding:12px 14px; margin-bottom:14px;}
  .capacite-alerte-titre{font-size:12.5px; font-weight:700; color:var(--amber); margin-bottom:4px;}
  .capacite-alerte-ligne{font-size:12px; color:var(--text-mid); line-height:1.5;}
  .blocage-card{background:var(--red-dim); border:1.5px solid rgba(240,87,90,0.4); border-radius:16px; padding:18px; margin-bottom:14px;}
  .blocage-tete{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .blocage-icone{font-size:22px;}
  .blocage-titre{font-size:15px; font-weight:700; color:var(--red);}
  .blocage-section{margin-bottom:10px;}
  .blocage-label{font-family:var(--mono); font-size:10px; color:var(--text-mid); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px;}
  .blocage-valeur{font-size:13px; line-height:1.5;}
  .blocage-consigne{font-size:13px; font-weight:600; color:var(--text); margin-top:12px; padding-top:12px; border-top:1px solid rgba(240,87,90,0.25);}
  .contact-manager-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px; margin-bottom:14px; display:flex; align-items:center; gap:12px;}
  .contact-manager-icone{font-size:20px;}
  .contact-manager-nom{font-size:13.5px; font-weight:700;}
  .contact-manager-tel{font-family:var(--mono); font-size:13px; color:var(--cyan);}

  .derogation-panel{background:var(--panel); border:1.5px dashed var(--hairline); border-radius:14px; padding:16px; margin-top:6px;}
  .derogation-titre{font-size:12.5px; font-weight:700; margin-bottom:10px; color:var(--text-mid);}

  .motif-liste{display:flex; flex-direction:column; gap:8px;}
  .motif-item{background:var(--panel); border:1.5px solid var(--hairline); border-radius:10px; padding:12px 14px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .motif-item:active{background:var(--panel-raised);}

  /* ---- Résumé / rapprochement ---- */
  .resume-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:18px; margin-bottom:14px;}
  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0;}
  .stat-row + .stat-row{border-top:1px solid var(--hairline);}
  .stat-label{font-size:13px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:15px; font-weight:700;}
  .stat-value.amber{color:var(--amber);}
  .stat-value.cyan{color:var(--cyan);}
  .stat-value.red{color:var(--red);}
  .stat-value.green{color:var(--green);}
  .stat-row.total{margin-top:6px; padding-top:14px; border-top:1.5px solid var(--hairline);}
  .stat-row.total .stat-label{font-weight:700; color:var(--text);}
  .stat-row.total .stat-value{font-size:19px;}
  .carburant-resultat-tete{font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:6px; margin-top:16px;}
  .carburant-resultat-tete:first-child{margin-top:0;}

  .badge-statut{display:inline-block; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:6px 12px; border-radius:20px; margin-bottom:14px;}
  .badge-statut.ok{background:var(--green-dim); color:var(--green);}
  .badge-statut.attention{background:var(--amber-dim); color:var(--amber);}
  .badge-statut.alerte{background:var(--red-dim); color:var(--red);}
  .badge-statut.attente{background:var(--panel-raised); color:var(--text-mid);}

  .btn-primary{width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-primary.danger{background:var(--red); color:#2a0708;}
  .btn-ghost{width:100%; padding:12px; border:1px solid var(--hairline); border-radius:10px; background:transparent; color:var(--text-mid); font-size:13px; cursor:pointer; margin-top:8px;}
  .btn-loading-dots{display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle;}
  .btn-loading-dots i{width:4px; height:4px; border-radius:50%; background:currentColor; display:inline-block; font-style:normal; animation:btnDotsBounce 1.2s infinite ease-in-out;}
  .btn-loading-dots i:nth-child(2){animation-delay:0.15s;}
  .btn-loading-dots i:nth-child(3){animation-delay:0.3s;}
  @keyframes btnDotsBounce{0%,80%,100%{opacity:0.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);}}

  /* Modale de validation finale de la réception (Sprint C4, audit §9.1,
     17/08/2026) — même structure bottom-sheet que .cloture-overlay/
     .cloture-modal (NEXUS-FDJ-v1.html) : jamais un confirm() natif du
     navigateur pour verrouiller une réception. */
  .recep-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:300;}
  .recep-modal{width:100%; max-width:460px; background:var(--panel); border:1px solid var(--hairline); border-top-left-radius:18px; border-top-right-radius:18px; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto;}
  .recep-titre{font-size:16.5px; font-weight:700; margin-bottom:14px;}
  .recep-ligne{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px; padding:11px 13px; margin-bottom:10px; font-size:12.5px;}
  .recep-valeur{font-family:var(--mono); font-weight:700; font-size:13.5px; white-space:nowrap;}
  .recep-valeur.green{color:var(--green);}
  .recep-valeur.amber{color:var(--amber);}
  .recep-texte{font-size:13px; color:var(--text-mid); line-height:1.6; margin-bottom:14px;}
  .recep-avertissement{font-size:12.5px; color:var(--amber); background:var(--amber-dim); border:1px solid rgba(245,166,35,0.3); border-radius:10px; padding:10px 12px; margin-bottom:14px; line-height:1.5;}
  .recep-actions .btn-ghost, .recep-actions .btn-primary{margin-top:8px;}

  .checkmark{width:64px; height:64px; border-radius:50%; background:var(--green-dim); color:var(--green); font-size:30px; display:flex; align-items:center; justify-content:center; margin:8px auto 18px;}
  .final-greet{font-size:19px; font-weight:700; text-align:center; margin-bottom:10px;}
  .final-liste{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
  .final-item{display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:1.5; color:var(--text-mid);}
  .final-item i{color:var(--green); flex-shrink:0; margin-top:1px;}
  .final-merci{font-size:12.5px; color:var(--text-dim); text-align:center; margin-bottom:6px;}

  .locked{padding:80px 24px; text-align:center; color:var(--text-mid); font-size:14px;}

  .accordeon-toggle{display:flex; justify-content:space-between; align-items:center; padding:10px 0; cursor:pointer; font-size:12.5px; color:var(--text-mid); font-weight:600;}

  .content-fade{animation:contentFade .22s ease;}
  @keyframes contentFade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Carburants</div>
    <div class="title" id="titre">Chargement…</div>
    <div class="horodateur-discret" id="horodateurDiscret">--</div>
    <div class="sub" id="sousTitre"></div>
  </div>
  <div class="divider"></div>

  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>

  <footer>NEXUS Réception carburant v2 · Visite guidée, contrôlée, tracée · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS Réception carburant v2 (15/08/2026) — reconstruction complète à
  // partir de la demande détaillée de Frédéric ("Demande d'évolution —
  // Module NEXUS Réception Carburant"). Remplace le modèle v1 (14/08/2026,
  // 1 carburant à la fois, répété) par une VISITE camion unique pouvant
  // porter plusieurs carburants dans des compartiments différents, avec un
  // vrai contrôle central bloquant (compartiments vs BL) et une réception
  // compartiment par compartiment tracée.
  //
  // Règles de conception explicites de la demande, structurantes pour ce
  // fichier :
  //   - "L'employé ne doit jamais devoir décider lui-même si un écart est
  //     normal." → aucun jugement n'est écrit ici à la main, tout passe par
  //     NexusReceptionMoteur (Article 11).
  //   - "Ne rien coder spécifiquement pour Sainte-Marie." → cuves (ordre,
  //     capacité), nombre de compartiments, seuils, consignes de sécurité
  //     et contact manager viennent tous de station_config via
  //     NexusReceptionDonnees.chargerConfigReception(), jamais une valeur
  //     en dur dans ce fichier (seul TRANSPORTEUR_DEFAUT reste une
  //     exception assumée, héritée de v1, propre au site pilote).
  //   - La soumission finale est UNE SEULE écriture atomique
  //     (NexusReceptionDonnees.soumettreVisiteComplete) : l'employé n'a
  //     jamais besoin de revenir modifier sa saisie après coup.
  //   - Déverrouillage manager (P1) : déclaratif — nom du manager
  //     sélectionné dans la liste des managers/gérants du site + motif
  //     libre, tracé dans carburant_reception_anomalies. Non
  //     ré-authentifié cryptographiquement dans ce lot (limite documentée
  //     dans le Data Dictionary) — le manager est supposé physiquement
  //     présent, comme le décrit la demande ("Le manager peut disposer
  //     d'une validation exceptionnelle, tracée dans l'audit").
  // ------------------------------------------------------------

  let employeeCourant = null;
  let siteId = null;
  let config = null; // NexusReceptionDonnees.chargerConfigReception()
  let managersSite = [];

  let etape = 'accueil';
  // 5 étapes visibles dans le stepper (demande explicite de Frédéric) —
  // 'calcul' (rapprochement) et 'succes' sont des écrans de conclusion,
  // hors barre de progression, comme dans la maquette fournie.
  const ETAPES = ['livraison', 'jaugeage_avant', 'compartiments', 'reception', 'jaugeage_final'];
  const ETAPES_LABELS = { livraison: 'Livraison attendue', jaugeage_avant: 'Jaugeage initial', compartiments: 'Camion', reception: 'Réception', jaugeage_final: 'Jaugeage final' };

  const TRANSPORTEUR_DEFAUT = 'TRANSHYDRO SARL';

  let visite = { transporteur: '', chauffeur: '', immatriculation: '', bon_livraison_reference: '', heure_debut: '' };
  let dernierEnTeteMemorise = null; // repris d'une visite précédente immédiate — non utilisé en v2 (1 seule visite = tous les carburants), conservé null.

  let lignes = { sp95: { actif: false, quantite_bl_l: '' }, go: { actif: false, quantite_bl_l: '' }, gnr: { actif: false, quantite_bl_l: '' } };
  let mesuresParCuve = {}; // cuveId -> { carburant, jaugeage_avant_l, jaugeage_avant_le, jaugeage_apres_l, jaugeage_apres_le }
  let compartiments = []; // [{ numero, carburant, quantite_declaree_l, cuve_destination_id, statut, motif_non_receptionne, receptionne_le }]
  let compartimentOuvert = null; // numero du compartiment dont la fiche est ouverte
  let controleCompartiments = null; // sortie de verifierCompartimentsVsBl, calculée une fois tous les compartiments assignés
  let derogationGlobaleCompartiments = null; // { nom, motif, le } si un manager a levé l'anomalie compartiments vs BL
  let derogationsParCompartiment = {}; // numero -> { nom, motif, le }
  let panneauDerogationPour = null; // 'compartiments' | numero de compartiment | null
  let heureFin = '';
  let resultatsParCarburant = null; // { sp95: sortie calculerReceptionCarburant + comparaisonHistorique, ... }
  let enSoumission = false;
  let derniereVisite = null; // après soumission réussie
  // Sprint C4 "Réception" (audit Carburants, 17/08/2026) — clé générée UNE
  // SEULE FOIS par visite (à "Démarrons ensemble"), jamais régénérée avant
  // une nouvelle visite. Envoyée à chaque tentative de soumission : un
  // double clic ou un retry réseau après coupure porte la même clé, donc
  // n'est jamais compté deux fois (nexus-reception-donnees.js gère le
  // conflit 23505 correspondant comme un succès idempotent).
  let idempotencyKey = null;
  function genererIdempotencyKey() {
    return (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function heureLocale() { return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function demarrerHorloge() {
    const maj = () => {
      const el = document.getElementById('horodateurDiscret');
      if (!el) return;
      const jour = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      el.textContent = `${jour.charAt(0).toUpperCase()}${jour.slice(1)} · ${heureLocale()}`;
    };
    maj(); setInterval(maj, 15000);
  }
  function dateISO(d) {
    const dt = d || new Date();
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }
  function datetimeLocalMaintenant() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtNum(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 1 }); }
  // 15/08/2026 — saisie en m³ (×1000 L) pour aller plus vite au clavier sur
  // 2 champs précis (quantité BL étape 1, quantité compartiment étape 3),
  // demande explicite de Frédéric. Le m³ n'est QU'une commodité de saisie :
  // la donnée stockée (quantite_bl_l / quantite_declaree_l) reste TOUJOURS
  // en Litres, seule unité que connaissent le moteur, la base et tous les
  // calculs/résultats/deltas affichés ailleurs (jaugeage, rapprochement,
  // Pilotage, PDF) — jamais touchés par ce changement (Article 11, une
  // seule vérité de stockage).
  function litresVersM3(l) { return (l === '' || l === null || l === undefined || isNaN(Number(l))) ? '' : Number(l) / 1000; }
  function m3VersLitres(m3) { return (m3 === '' || m3 === null || m3 === undefined || isNaN(Number(m3))) ? '' : Math.round(Number(m3) * 1000); }
  const NOM_CARBURANT = { sp95: 'Sans plomb (SP95)', go: 'Gasoil (GO)', gnr: 'Gasoil non routier (GNR)' };
  const NOM_CARBURANT_COURT = { sp95: 'SP95', go: 'GO', gnr: 'GNR' };

  function carburantsPrevus() { return NexusReceptionMoteur.CARBURANTS.filter(c => lignes[c].actif && Number(lignes[c].quantite_bl_l) > 0); }
  function cuvesPrevues() { const prevus = carburantsPrevus(); return (config.cuvesOrdonnees || []).filter(cu => prevus.includes(cu.carburant)); }
  // Clé composite pour mesuresParCuve — l'id d'une cuve n'est unique QUE
  // dans la liste de son propre carburant côté station_config (ex. réel
  // Vito Sainte-Marie : SP95 et GNR ont chacun une cuve id="unique"). Une
  // clé "cuveId" seule collisionnerait dès qu'une visite porte les deux
  // carburants à la fois — jamais observé pendant la conception, trouvé en
  // écrivant le test avec la config réelle du site pilote.
  function cleCuve(cu) { return `${cu.carburant}__${cu.id}`; }

  async function chargerManagersSite() {
    const { data, error } = await nexusClient.from('employees').select('id, nom').eq('site_id', siteId).in('role', ['manager', 'gerant']).eq('actif', true);
    if (error) { console.error('Chargement managers site (réception):', error); return []; }
    return data || [];
  }

  // ------------------------------------------------------------
  // NAVIGATION ÉTAPES
  // ------------------------------------------------------------
  function indexEtape() { return ETAPES.indexOf(etape); }
  function stepperHtml() {
    const idx = indexEtape();
    if (idx < 0) return '';
    return `
      <div class="stepper">${ETAPES.map((e,i) => `<div class="stepper-item ${i < idx ? 'fait' : (i === idx ? 'actif' : '')}"></div>`).join('')}</div>
      <div class="stepper-label">Étape ${idx+1} sur ${ETAPES.length} — ${ETAPES_LABELS[etape]}</div>
    `;
  }
  function allerEtape(e) { etape = e; render(); }

  function render() {
    document.getElementById('titre').textContent = etape === 'accueil' ? 'Réception carburant' : (etape === 'succes' ? 'Réception terminée' : 'Réception carburant');
    document.getElementById('sousTitre').textContent = etape === 'accueil' ? 'Livraison, jaugeage terrain et rapprochement. Vous saisissez les faits, NEXUS effectue les contrôles.' : '';
    const c = document.getElementById('content');
    c.classList.remove('content-fade'); void c.offsetWidth; c.classList.add('content-fade');
    if (etape === 'accueil') renderAccueil();
    else if (etape === 'livraison') renderLivraison();
    else if (etape === 'jaugeage_avant') renderJaugeage('avant');
    else if (etape === 'compartiments') renderCompartimentsEtape();
    else if (etape === 'reception') renderReceptionEtape();
    else if (etape === 'jaugeage_final') renderJaugeage('apres');
    else if (etape === 'calcul') renderCalcul();
    else if (etape === 'succes') renderSucces();
  }

  // ------------------------------------------------------------
  // ACCUEIL — consignes de sécurité paramétrées par site (Coach NEXUS)
  // ------------------------------------------------------------
  function renderAccueil() {
    if (!cuvesActivesSite().length) {
      document.getElementById('content').innerHTML = `<div class="locked">Aucun carburant actif n'est configuré pour ce site. Contactez votre manager.</div>`;
      return;
    }
    const consignes = config.consignesSecurite || [];
    document.getElementById('content').innerHTML = `
      <div class="accueil-hero">
        <div class="accueil-icone">🚛</div>
      </div>
      ${consignes.length ? `
        <div class="nexus-dit">
          <div class="coach-tete">🧭 Coach NEXUS — avant de commencer</div>
          <div class="consignes-liste">
            ${consignes.map(c => `<div class="consigne-item"><div class="consigne-puce">•</div><div><span class="consigne-theme">${c.theme ? c.theme + ' — ' : ''}</span>${c.texte}</div></div>`).join('')}
          </div>
        </div>
      ` : ''}
      <button class="btn-primary" id="btnDemarrer">Démarrons ensemble</button>
    `;
    document.getElementById('btnDemarrer').addEventListener('click', demarrerVisite);
  }
  function cuvesActivesSite() { return config.cuvesOrdonnees || []; }

  function demarrerVisite() {
    idempotencyKey = genererIdempotencyKey();
    visite = { transporteur: TRANSPORTEUR_DEFAUT, chauffeur: '', immatriculation: '', bon_livraison_reference: '', heure_debut: datetimeLocalMaintenant() };
    lignes = { sp95: { actif: false, quantite_bl_l: '' }, go: { actif: false, quantite_bl_l: '' }, gnr: { actif: false, quantite_bl_l: '' } };
    mesuresParCuve = {};
    compartiments = [];
    compartimentOuvert = null;
    controleCompartiments = null;
    derogationGlobaleCompartiments = null;
    derogationsParCompartiment = {};
    panneauDerogationPour = null;
    heureFin = '';
    resultatsParCarburant = null;
    allerEtape('livraison');
  }

  // ------------------------------------------------------------
  // ÉTAPE 1 — LIVRAISON ATTENDUE (multi-carburant)
  // ------------------------------------------------------------
  function renderLivraison() {
    const carburantsDisponibles = NexusReceptionMoteur.CARBURANTS.filter(c => (config.cuvesCarburants[c] || {}).actif);
    document.getElementById('content').innerHTML = `
      ${stepperHtml()}
      <div class="champ-label">Carburants livrés</div>
      ${carburantsDisponibles.map(c => `
        <div class="carburant-attendu-card ${lignes[c].actif ? 'actif' : ''}" style="--cc:var(--${c});">
          <div class="carburant-attendu-tete">
            <div class="carburant-attendu-nom"><span class="carburant-pastille" style="--cc:var(--${c});"></span>${NOM_CARBURANT[c]}</div>
            <div class="toggle-switch ${lignes[c].actif ? 'on' : ''}" data-toggle="${c}"><div class="toggle-knob"></div></div>
          </div>
          <div class="carburant-attendu-corps">
            ${lignes[c].actif ? `
              <div class="champ-label" style="margin-top:10px;">Quantité attendue (m³)</div>
              <input class="champ-input" data-qte="${c}" type="number" inputmode="decimal" step="0.001" placeholder="0" value="${litresVersM3(lignes[c].quantite_bl_l)}" style="margin-bottom:0;">
            ` : `<div class="carburant-attendu-vide">Non prévu</div>`}
          </div>
        </div>
      `).join('')}
      <div class="champ-label" style="margin-top:16px;">Transporteur <span class="optionnel">(optionnel)</span></div>
      <input class="champ-input texte" id="fTransporteur" placeholder="Nom du transporteur" value="${visite.transporteur}">
      <div class="champ-label">Chauffeur <span class="optionnel">(optionnel)</span></div>
      <input class="champ-input texte" id="fChauffeur" placeholder="Nom du chauffeur" value="${visite.chauffeur}">
      <div class="champ-label">Immatriculation <span class="optionnel">(optionnel)</span></div>
      <input class="champ-input texte" id="fImmat" placeholder="AA-123-BB" value="${visite.immatriculation}">
      <div class="champ-label">N° de BL ou de facture <span class="optionnel">(optionnel)</span></div>
      <input class="champ-input texte" id="fRefBl" placeholder="N° du bon de livraison, ou FAC-XXXXX" value="${visite.bon_livraison_reference}">
      <div class="champ-label">Heure de début de réception</div>
      <input class="champ-input" id="fHeureDebut" type="datetime-local" value="${visite.heure_debut}">
      <button class="btn-primary" id="btnContinuerLivraison" disabled>Continuer</button>
      <button class="btn-ghost" id="btnAnnulerLivraison">Annuler</button>
    `;
    document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => {
      const c = el.getAttribute('data-toggle');
      lignes[c].actif = !lignes[c].actif;
      if (!lignes[c].actif) lignes[c].quantite_bl_l = '';
      renderLivraison();
    }));
    document.querySelectorAll('[data-qte]').forEach(input => input.addEventListener('input', () => {
      lignes[input.getAttribute('data-qte')].quantite_bl_l = m3VersLitres(input.value);
      majBoutonLivraison();
    }));
    const maj = () => {
      visite.transporteur = document.getElementById('fTransporteur').value;
      visite.chauffeur = document.getElementById('fChauffeur').value;
      visite.immatriculation = document.getElementById('fImmat').value;
      visite.bon_livraison_reference = document.getElementById('fRefBl').value;
      visite.heure_debut = document.getElementById('fHeureDebut').value;
      majBoutonLivraison();
    };
    ['fTransporteur','fChauffeur','fImmat','fRefBl','fHeureDebut'].forEach(id => document.getElementById(id).addEventListener('input', maj));
    majBoutonLivraison();
    document.getElementById('btnContinuerLivraison').addEventListener('click', () => {
      // Prépare les mesures de cuve pour les carburants prévus (étape 2).
      mesuresParCuve = {};
      cuvesPrevues().forEach(cu => { mesuresParCuve[cleCuve(cu)] = { cuve_id: cu.id, carburant: cu.carburant, jaugeage_avant_l: '', jaugeage_avant_le: '', jaugeage_apres_l: '', jaugeage_apres_le: '' }; });
      // Compartiments par défaut, nombre configuré par site — l'employé
      // peut ajuster à l'étape 3 (add/retirer), jamais figé. Un compartiment
      // peut être marqué "vide" (non utilisé pour cette livraison, ex. un
      // camion à 6 compartiments qui n'en charge que 5) : `vide:false` à la
      // création, l'employé le bascule lui-même à l'étape 3.
      const n = config.nombreCompartimentsDefaut || 6;
      compartiments = Array.from({ length: n }, (_, i) => ({ numero: i + 1, carburant: null, quantite_declaree_l: '', cuve_destination_id: null, vide: false, statut: 'a_receptionner', motif_non_receptionne: null, receptionne_le: null }));
      allerEtape('jaugeage_avant');
    });
    document.getElementById('btnAnnulerLivraison').addEventListener('click', () => { if (confirm('Annuler cette réception ? La saisie en cours sera perdue.')) allerEtape('accueil'); });
  }
  function majBoutonLivraison() {
    const prevus = carburantsPrevus();
    const ok = prevus.length > 0 && visite.heure_debut;
    const btn = document.getElementById('btnContinuerLivraison');
    if (btn) btn.disabled = !ok;
  }

  // ------------------------------------------------------------
  // ÉTAPES 2 & 5 — JAUGEAGE (avant / après), reproduit le Veeder-Root
  // ------------------------------------------------------------
  // 15/08/2026 — au jaugeage initial (phase "avant"), on avertit le
  // pompiste si le litrage attendu (BL, étape 1) ne rentre pas dans la
  // place restante des cuves de ce carburant. Vérification par CARBURANT
  // (pas par cuve individuelle) : à cette étape, la répartition entre
  // cuves d'un même carburant multi-cuves (ex. GO) n'est pas encore
  // connue — elle ne le sera qu'à l'étape 3 (compartiments). C'est donc
  // une vérification agrégée, la seule possible avec l'information
  // disponible ici, mais elle suffit à repérer le cas réel visé :
  // "la facture ne rentre pas dans ce qu'il reste de place".
  function verifierCapaciteJaugeage() {
    const parCarburant = {};
    cuvesPrevues().forEach(cu => {
      if (!parCarburant[cu.carburant]) parCarburant[cu.carburant] = { capacite: 0, jaugeageAvant: 0 };
      parCarburant[cu.carburant].capacite += Number(cu.capacite) || 0;
      const val = mesuresParCuve[cleCuve(cu)].jaugeage_avant_l;
      parCarburant[cu.carburant].jaugeageAvant += (val !== '' && val != null && !isNaN(Number(val))) ? Number(val) : 0;
    });
    return Object.keys(parCarburant).map(carb => {
      const p = parCarburant[carb];
      const attendu = Number(lignes[carb].quantite_bl_l) || 0;
      const disponible = p.capacite - p.jaugeageAvant;
      return { carburant: carb, attendu, disponible, exces: attendu - disponible };
    }).filter(a => a.attendu > 0 && a.exces > 0);
  }
  function jaugeageAlerteHtml() {
    const depassements = verifierCapaciteJaugeage();
    if (depassements.length === 0) return '';
    return `
      <div class="capacite-alerte">
        <div class="capacite-alerte-titre">⚠ Attention — la livraison risque de ne pas rentrer</div>
        ${depassements.map(a => `<div class="capacite-alerte-ligne">${NOM_CARBURANT_COURT[a.carburant]} : ${fmtNum(a.attendu)} L attendus pour ${fmtNum(a.disponible)} L de place restante — dépassement d'environ ${fmtNum(a.exces)} L. Prévenez votre manager avant le déchargement.</div>`).join('')}
      </div>
    `;
  }
  // Met à jour uniquement la jauge visuelle d'UNE cuve après une saisie —
  // ne touche jamais à #content.innerHTML pendant la frappe : régénérer
  // tout le HTML recréait l'input à chaque caractère et fermait le
  // clavier numérique du téléphone après chaque chiffre (bug remonté le
  // 15/08/2026). L'input reste désormais le même nœud DOM du début à la
  // fin de la saisie.
  // Ciblage par id (jaugeRemplissage_/jaugePct_/jaugeVariation_, tous
  // suffixés par la clé composite de cuve) plutôt que par .closest()/
  // querySelector(classe) : plus robuste, et cohérent avec le reste de
  // l'écran qui identifie déjà tout par id ou attribut data-xxx.
  function majJaugeVisuelle(phase, cu) {
    const cle = cleCuve(cu);
    const champL = phase === 'avant' ? 'jaugeage_avant_l' : 'jaugeage_apres_l';
    const m = mesuresParCuve[cle];
    const val = m[champL];
    const pct = cu.capacite ? Math.max(0, Math.min(100, (Number(val || 0) / cu.capacite) * 100)) : 0;
    const remplissage = document.getElementById(`jaugeRemplissage_${cle}`);
    if (remplissage) remplissage.style.width = pct + '%';
    const pctTexte = document.getElementById(`jaugePct_${cle}`);
    if (pctTexte) pctTexte.textContent = val !== '' && val != null ? fmtNum(pct) + ' %' : '';
    if (phase === 'apres') {
      const variation = document.getElementById(`jaugeVariation_${cle}`);
      if (variation) {
        if (val !== '' && val != null && m.jaugeage_avant_l !== '' && m.jaugeage_avant_l != null) {
          const diff = Number(val) - Number(m.jaugeage_avant_l);
          variation.textContent = `Variation : ${diff >= 0 ? '+' : ''}${fmtNum(diff)} L`;
          variation.style.display = '';
        } else {
          variation.textContent = '';
          variation.style.display = 'none';
        }
      }
    }
    if (phase === 'avant') {
      const alerteZone = document.getElementById('jaugeageAlerteZone');
      if (alerteZone) alerteZone.innerHTML = jaugeageAlerteHtml();
    }
  }
  function renderJaugeage(phase) {
    const champL = phase === 'avant' ? 'jaugeage_avant_l' : 'jaugeage_apres_l';
    const champLe = phase === 'avant' ? 'jaugeage_avant_le' : 'jaugeage_apres_le';
    const cuves = cuvesPrevues();
    const notePhase = phase === 'avant'
      ? 'Mesurez le niveau de chaque cuve concernée AVANT le début du déchargement — reproduisez ce que vous lisez sur le Veeder-Root.'
      : 'Mesurez le niveau de chaque cuve une fois le déchargement terminé.';
    document.getElementById('content').innerHTML = `
      ${stepperHtml()}
      <div class="champ-note" style="margin-top:0;">${notePhase}</div>
      ${phase === 'avant' ? `<div id="jaugeageAlerteZone">${jaugeageAlerteHtml()}</div>` : ''}
      ${cuves.map(cu => {
        const cle = cleCuve(cu);
        const m = mesuresParCuve[cle];
        const val = m[champL];
        const pct = cu.capacite ? Math.max(0, Math.min(100, (Number(val || 0) / cu.capacite) * 100)) : 0;
        return `
        <div class="cuve-card">
          <div class="cuve-titre">
            <div class="cuve-titre-nom"><span class="carburant-pastille" style="--cc:var(--${cu.carburant});"></span>${cu.label || cu.id} <span class="capacite">${cu.carburant ? NOM_CARBURANT_COURT[cu.carburant] : ''}</span></div>
            <span class="capacite">${cu.capacite ? `${fmtNum(cu.capacite)} L` : ''}</span>
          </div>
          ${phase === 'apres' ? `<div class="cuve-avant-recap"><span>Avant</span><span>${fmtNum(m.jaugeage_avant_l)} L</span></div>` : ''}
          <div class="cuve-jauge-visuelle">
            <div class="cuve-jauge-remplissage" id="jaugeRemplissage_${cle}" style="width:${pct}%; background:var(--${cu.carburant});"></div>
            <div class="cuve-jauge-pct" id="jaugePct_${cle}">${val !== '' && val != null ? fmtNum(pct) + ' %' : ''}</div>
          </div>
          <div class="champ-label">Jaugeage ${phase} (L)</div>
          <input class="champ-input" data-cuve="${cle}" data-champ="${champL}" type="number" inputmode="decimal" placeholder="0" value="${val}" style="margin-bottom:0;">
          ${phase === 'apres' ? `<div class="cuve-variation" id="jaugeVariation_${cle}" style="color:var(--${cu.carburant}); ${val !== '' && val != null && m.jaugeage_avant_l !== '' ? '' : 'display:none;'}">${val !== '' && val != null && m.jaugeage_avant_l !== '' ? `Variation : ${(Number(val) - Number(m.jaugeage_avant_l)) >= 0 ? '+' : ''}${fmtNum(Number(val) - Number(m.jaugeage_avant_l))} L` : ''}</div>` : ''}
        </div>
      `; }).join('')}
      <button class="btn-primary" id="btnContinuerJaugeage" disabled style="margin-top:8px;">Continuer</button>
      <button class="btn-ghost" id="btnRetourJaugeage">Retour</button>
    `;
    document.querySelectorAll('[data-cuve]').forEach(input => input.addEventListener('input', () => {
      const cle = input.getAttribute('data-cuve'), champ = input.getAttribute('data-champ');
      mesuresParCuve[cle][champ] = input.value;
      const cu = cuves.find(c => cleCuve(c) === cle);
      if (cu) majJaugeVisuelle(phase, cu);
      majBoutonJaugeage(champL);
    }));
    majBoutonJaugeage(champL);
    document.getElementById('btnContinuerJaugeage').addEventListener('click', () => {
      const maintenant = new Date().toISOString();
      cuves.forEach(cu => { mesuresParCuve[cleCuve(cu)][champLe] = maintenant; });
      if (phase === 'apres') { heureFin = maintenant; allerEtape('calcul'); }
      else allerEtape('compartiments');
    });
    document.getElementById('btnRetourJaugeage').addEventListener('click', () => allerEtape(phase === 'avant' ? 'livraison' : 'reception'));
  }
  function majBoutonJaugeage(champL) {
    const cuves = cuvesPrevues();
    const complet = cuves.every(cu => mesuresParCuve[cleCuve(cu)][champL] !== '' && !isNaN(Number(mesuresParCuve[cleCuve(cu)][champL])));
    const btn = document.getElementById('btnContinuerJaugeage');
    if (btn) btn.disabled = !complet;
  }

  // ------------------------------------------------------------
  // CAMION — grille de compartiments partagée (étapes 3 & 4)
  // ------------------------------------------------------------
  function camionGrilleHtml(mode) {
    return `
      <div class="camion-cadre">
        <div class="camion-titre">Camion — ${compartiments.length} compartiment${compartiments.length > 1 ? 's' : ''}</div>
        <div class="camion-grille">
          ${compartiments.map(c => {
            const classeCarb = c.vide ? 'compartiment-vide' : (c.carburant ? `carb-${c.carburant}` : '');
            const classeAlerte = mode === 'reception' && c.statut === 'non_receptionne' && !derogationsParCompartiment[c.numero] ? 'non-receptionne' : '';
            const coche = mode === 'reception' && c.statut === 'receptionne';
            return `
            <div class="compartiment-bloc ${classeCarb} ${classeAlerte}" data-compartiment="${c.numero}">
              ${coche ? '<div class="compartiment-check">✓</div>' : ''}
              <div class="compartiment-numero">${c.numero}</div>
              <div class="compartiment-carburant" style="color:${c.carburant ? `var(--${c.carburant})` : 'var(--text-dim)'};">${c.vide ? 'Vide' : (c.carburant ? NOM_CARBURANT_COURT[c.carburant] : '—')}</div>
              ${!c.vide && c.quantite_declaree_l ? `<div class="compartiment-qte">${fmtNum(c.quantite_declaree_l)} L</div>` : ''}
            </div>
          `; }).join('')}
        </div>
        <div class="camion-legende">
          <span><i style="background:var(--sp95);"></i>SP95</span>
          <span><i style="background:var(--go);"></i>GO</span>
          <span><i style="background:var(--gnr);"></i>GNR</span>
        </div>
      </div>
    `;
  }

  // 15/08/2026 — bandeau rappel des quantités attendues (saisies à l'étape
  // 1) affiché en tête de l'étape 3, un badge coloré par carburant PRÉVU
  // uniquement (jamais un carburant à 0 ou non coché — Article 5, on
  // n'affiche que ce qui a réellement été déclaré).
  function rappelQuantitesBlHtml() {
    const prevus = carburantsPrevus();
    if (prevus.length === 0) return '';
    return `
      <div class="rappel-bl">
        ${prevus.map(c => `
          <div class="rappel-bl-item" style="border-color:var(--${c});">
            <span class="carburant-pastille" style="--cc:var(--${c});"></span>
            <div>
              <div class="rappel-bl-nom">${NOM_CARBURANT_COURT[c]}</div>
              <div class="rappel-bl-valeur">${fmtNum(lignes[c].quantite_bl_l)} L</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // ------------------------------------------------------------
  // ÉTAPE 3 — COMPARTIMENTS DU CAMION (assignation + contrôle bloquant)
  // ------------------------------------------------------------
  // 15/08/2026 — explique précisément, compartiment par compartiment, ce
  // qui manque encore quand "Continuer" reste grisé faute d'assignation
  // complète (carburant + quantité + cuve de destination) — jamais laisser
  // le bouton grisé sans dire pourquoi (remonté par Frédéric : la somme
  // des quantités correspondait déjà au BL, mais une cuve de destination
  // n'avait pas été choisie sur un compartiment GO, donc `tousAssignes`
  // restait faux et AUCUN message ne s'affichait — rien à comparer au BL
  // tant que l'assignation elle-même n'est pas complète).
  function messageCompartimentsIncompletsHtml() {
    // Un compartiment marqué "vide" (non utilisé pour cette livraison) est
    // considéré complet sans aucune saisie — ce n'est pas un oubli, c'est
    // une déclaration explicite de l'employé.
    const manquants = compartiments.filter(c => !c.vide && !(c.carburant && Number(c.quantite_declaree_l) > 0 && c.cuve_destination_id));
    if (manquants.length === 0) return '';
    const details = manquants.map(c => {
      const champsManquants = [];
      if (!c.carburant) champsManquants.push('carburant');
      else if (!(Number(c.quantite_declaree_l) > 0)) champsManquants.push('quantité');
      if (c.carburant && !c.cuve_destination_id) champsManquants.push('cuve de destination');
      return `compartiment ${c.numero} (${champsManquants.join(', ')})`;
    });
    return `
      <div class="compartiments-incomplet">
        <b>Encore incomplet :</b> ${details.join(' · ')}. Touchez chaque compartiment listé pour compléter l'assignation — "Continuer" ne s'active qu'une fois tous les compartiments complets.
      </div>
    `;
  }

  function renderCompartimentsEtape() {
    const M = NexusReceptionMoteur;
    const tousAssignes = compartiments.every(c => c.vide || (c.carburant && Number(c.quantite_declaree_l) > 0 && c.cuve_destination_id));
    if (tousAssignes) {
      const lignesAttendues = carburantsPrevus().map(c => ({ carburant: c, quantite_bl_l: Number(lignes[c].quantite_bl_l) }));
      controleCompartiments = M.verifierCompartimentsVsBl(lignesAttendues, compartiments, config.seuilEcartCompartimentsPct);
    } else {
      controleCompartiments = null;
    }

    document.getElementById('content').innerHTML = `
      ${stepperHtml()}
      ${rappelQuantitesBlHtml()}
      <div class="champ-note" style="margin-top:0;">Touchez chaque compartiment pour indiquer le carburant, la quantité et la cuve de destination, tel qu'indiqué sur le bon de livraison.</div>
      ${camionGrilleHtml('assignation')}
      <div class="btn-ajuster-compartiments">
        <button id="btnRetirerCompartiment" ${compartiments.length <= 1 ? 'disabled style="opacity:0.35;"' : ''}>− Retirer</button>
        <button id="btnAjouterCompartiment">+ Ajouter</button>
      </div>
      <div id="ficheCompartimentZone"></div>
      ${controleCompartiments ? renderVerdictCompartiments() : messageCompartimentsIncompletsHtml()}
      <button class="btn-primary" id="btnContinuerCompartiments" ${!(controleCompartiments && controleCompartiments.coherentGlobal) && !derogationGlobaleCompartiments ? 'disabled' : ''}>Continuer vers la réception</button>
      <button class="btn-ghost" id="btnRetourCompartiments">Retour</button>
    `;
    document.querySelectorAll('[data-compartiment]').forEach(el => el.addEventListener('click', () => {
      compartimentOuvert = Number(el.getAttribute('data-compartiment'));
      renderFicheCompartiment();
    }));
    if (compartimentOuvert != null) renderFicheCompartiment();
    document.getElementById('btnAjouterCompartiment').addEventListener('click', () => {
      compartiments.push({ numero: compartiments.length + 1, carburant: null, quantite_declaree_l: '', cuve_destination_id: null, vide: false, statut: 'a_receptionner', motif_non_receptionne: null, receptionne_le: null });
      renderCompartimentsEtape();
    });
    document.getElementById('btnRetirerCompartiment').addEventListener('click', () => {
      if (compartiments.length > 1) { compartiments.pop(); if (compartimentOuvert > compartiments.length) compartimentOuvert = null; renderCompartimentsEtape(); }
    });
    document.getElementById('btnContinuerCompartiments').addEventListener('click', () => {
      // Nombre réel de compartiments retenu pour la visite (peut avoir été
      // ajusté à cette étape) — écrit dans visite.nombre_compartiments à la
      // soumission finale.
      allerEtape('reception');
    });
    document.getElementById('btnRetourCompartiments').addEventListener('click', () => allerEtape('jaugeage_avant'));
    // Le panneau de dérogation (s'il est affiché, cf. renderVerdictCompartiments)
    // fait partie du HTML injecté ci-dessus — ses écouteurs doivent être
    // posés après coup, comme tout le reste de cette fonction.
    cablerDerogation(renderCompartimentsEtape);
  }

  // 15/08/2026 — quand un carburant n'a qu'une seule cuve sur le site (cas
  // le plus courant, ex. "Réservoir 1" unique pour le SP95), on assigne
  // directement cette cuve au lieu de forcer un choix dans un menu à une
  // seule option : c'est ce menu à une seule option, sur mobile, qui
  // bloquait la validation du compartiment (le tap sur "Valider" tombait
  // parfois sur le picker natif encore ouvert). Quand plusieurs cuves
  // existent (ex. GO avec 2 cuves), le choix manuel reste obligatoire.
  function cuvesPourCarburant(carb) { return (config.cuvesOrdonnees || []).filter(cu => cu.carburant === carb); }

  function renderFicheCompartiment() {
    const zone = document.getElementById('ficheCompartimentZone');
    if (!zone) return;
    const c = compartiments.find(x => x.numero === compartimentOuvert);
    if (!c) { zone.innerHTML = ''; return; }
    if (c.carburant && !c.cuve_destination_id) {
      const cuvesCarb = cuvesPourCarburant(c.carburant);
      if (cuvesCarb.length === 1) c.cuve_destination_id = cuvesCarb[0].id;
    }
    const prevus = carburantsPrevus();
    zone.innerHTML = `
      <div class="fiche-compartiment">
        <div class="fiche-titre">Compartiment ${c.numero}</div>
        <button class="btn-ghost" id="btnToggleVideCompartiment" style="margin-top:0;">${c.vide ? '↺ Ce compartiment n\'est finalement pas vide' : '○ Marquer ce compartiment comme vide (non utilisé)'}</button>
        ${c.vide ? `
          <div class="champ-note">Compartiment vide — non utilisé pour cette livraison, il est ignoré du contrôle et de la réception.</div>
        ` : `
          <div class="champ-label">Carburant</div>
          <div class="carburant-chip-row">
            ${prevus.map(carb => `<div class="carburant-chip ${c.carburant === carb ? 'actif' : ''}" style="--cc:var(--${carb});" data-carb="${carb}">${NOM_CARBURANT_COURT[carb]}</div>`).join('')}
          </div>
          <div class="champ-label">Quantité (m³)</div>
          <input class="champ-input" id="fQteCompartiment" type="number" inputmode="decimal" step="0.001" placeholder="0" value="${litresVersM3(c.quantite_declaree_l)}">
          <div class="champ-label">Cuve destination</div>
          <select class="champ-input" id="fCuveCompartiment" ${!c.carburant ? 'disabled' : ''}>
            <option value="">— Choisir —</option>
            ${(config.cuvesOrdonnees || []).filter(cu => cu.carburant === c.carburant).map(cu => `<option value="${cu.id}" ${c.cuve_destination_id === cu.id ? 'selected' : ''}>${cu.label || cu.id}</option>`).join('')}
          </select>
        `}
        <button class="btn-primary" id="btnValiderCompartiment" style="margin-top:0;">Valider</button>
      </div>
    `;
    document.getElementById('btnToggleVideCompartiment').addEventListener('click', () => {
      c.vide = !c.vide;
      if (c.vide) { c.carburant = null; c.quantite_declaree_l = ''; c.cuve_destination_id = null; }
      renderFicheCompartiment();
    });
    if (!c.vide) {
      document.querySelectorAll('[data-carb]').forEach(el => el.addEventListener('click', () => {
        c.carburant = el.getAttribute('data-carb');
        const cuvesCarb = cuvesPourCarburant(c.carburant);
        c.cuve_destination_id = cuvesCarb.length === 1 ? cuvesCarb[0].id : null;
        renderFicheCompartiment();
      }));
      document.getElementById('fQteCompartiment').addEventListener('input', (e) => { c.quantite_declaree_l = m3VersLitres(e.target.value); });
      document.getElementById('fCuveCompartiment').addEventListener('change', (e) => { c.cuve_destination_id = e.target.value || null; });
    }
    document.getElementById('btnValiderCompartiment').addEventListener('click', () => {
      compartimentOuvert = null;
      renderCompartimentsEtape();
    });
  }

  function renderVerdictCompartiments() {
    const M = NexusReceptionMoteur;
    if (controleCompartiments.coherentGlobal) {
      return `
        <div class="compartiment-total ok">
          <span>✅ Chargement cohérent avec le bon de livraison</span>
        </div>
      `;
    }
    const lignesEcart = controleCompartiments.carburantsEnAnomalie.map(carb => {
      const r = controleCompartiments.parCarburant[carb];
      return `
        <div class="blocage-section">
          <div class="blocage-label">${NOM_CARBURANT[carb]}</div>
          <div class="blocage-valeur">Livraison attendue : <b>${fmtNum(r.attendu)} L</b> — Compartiments déclarés : <b>${fmtNum(r.declare)} L</b> — Écart : <b>${M.texteEcart(r.ecart, r.ecartPct)}</b></div>
        </div>
      `;
    }).join('');
    return `
      <div class="blocage-card">
        <div class="blocage-tete"><span class="blocage-icone">🔴</span><span class="blocage-titre">Anomalie détectée</span></div>
        ${lignesEcart}
        <div class="blocage-consigne">Ne commencez pas la réception. Contactez votre manager.</div>
      </div>
      ${contactManagerHtml()}
      ${derogationGlobaleCompartiments
        ? `<div class="compartiment-total ok"><span>🔓 Déverrouillé par ${derogationGlobaleCompartiments.nom}</span></div>`
        : renderBoutonDerogation('compartiments')}
      ${panneauDerogationPour === 'compartiments' ? renderPanneauDerogation('compartiments') : ''}
    `;
  }

  function contactManagerHtml() {
    const cm = config.contactManager || {};
    if (!cm.nom && !cm.telephone) return '';
    return `
      <div class="contact-manager-card">
        <div class="contact-manager-icone">📞</div>
        <div>
          <div class="contact-manager-nom">${cm.nom || 'Manager du site'}</div>
          ${cm.telephone ? `<div class="contact-manager-tel">${cm.telephone}</div>` : ''}
        </div>
      </div>
    `;
  }

  function renderBoutonDerogation(pour) {
    return `<button class="btn-ghost" id="btnOuvrirDerogation" data-pour="${pour}">Un manager est présent, déverrouiller</button>`;
  }

  function renderPanneauDerogation(pour) {
    return `
      <div class="derogation-panel">
        <div class="derogation-titre">Déverrouillage manager — décision tracée dans l'audit</div>
        <div class="champ-label">Manager présent</div>
        <select class="champ-input" id="fDerogationManager">
          <option value="">— Choisir —</option>
          ${managersSite.map(m => `<option value="${m.nom}">${m.nom}</option>`).join('')}
        </select>
        <div class="champ-label">Motif de la dérogation</div>
        <input class="champ-input texte" id="fDerogationMotif" placeholder="Ex : écart connu, contrôlé sur place">
        <button class="btn-primary" id="btnConfirmerDerogation" data-pour="${pour}" disabled>Confirmer le déverrouillage</button>
        <button class="btn-ghost" id="btnAnnulerDerogation">Annuler</button>
      </div>
    `;
  }

  // Écouteurs communs aux panneaux de dérogation — appelés après chaque
  // render des étapes 3 et 4 (délégation légère, ces boutons n'existent
  // pas toujours dans le DOM).
  function cablerDerogation(rerender) {
    const btnOuvrir = document.getElementById('btnOuvrirDerogation');
    if (btnOuvrir) btnOuvrir.addEventListener('click', () => { panneauDerogationPour = btnOuvrir.getAttribute('data-pour'); rerender(); });
    const selectManager = document.getElementById('fDerogationManager');
    const inputMotif = document.getElementById('fDerogationMotif');
    const btnConfirmer = document.getElementById('btnConfirmerDerogation');
    const majBtn = () => { if (btnConfirmer) btnConfirmer.disabled = !(selectManager.value && inputMotif.value.trim()); };
    if (selectManager) { selectManager.addEventListener('change', majBtn); inputMotif.addEventListener('input', majBtn); majBtn(); }
    if (btnConfirmer) btnConfirmer.addEventListener('click', () => {
      const derogation = { nom: selectManager.value, motif: inputMotif.value.trim(), le: new Date().toISOString() };
      const pour = btnConfirmer.getAttribute('data-pour');
      if (pour === 'compartiments') derogationGlobaleCompartiments = derogation;
      else derogationsParCompartiment[pour] = derogation;
      panneauDerogationPour = null;
      rerender();
    });
    const btnAnnuler = document.getElementById('btnAnnulerDerogation');
    if (btnAnnuler) btnAnnuler.addEventListener('click', () => { panneauDerogationPour = null; rerender(); });
  }

  // ------------------------------------------------------------
  // ÉTAPE 4 — RÉCEPTION COMPARTIMENT PAR COMPARTIMENT
  // ------------------------------------------------------------
  function renderReceptionEtape() {
    const M = NexusReceptionMoteur;
    // Un compartiment "vide" n'a jamais rien à décharger : il ne doit
    // jamais bloquer la suite du parcours, ni être ouvrable ici (rien à y
    // réceptionner).
    const bloquants = M.compartimentsBloquants(compartiments).filter(c => !derogationsParCompartiment[c.numero] && !c.vide);
    document.getElementById('content').innerHTML = `
      ${stepperHtml()}
      <div class="champ-note" style="margin-top:0;">Touchez un compartiment au fur et à mesure de son déchargement effectif.</div>
      ${camionGrilleHtml('reception')}
      <div id="ficheReceptionZone"></div>
      ${bloquants.length ? `<div class="compartiment-total ecart"><span>🔴 ${bloquants.length} compartiment${bloquants.length>1?'s':''} non réceptionné${bloquants.length>1?'s':''}</span></div>` : ''}
      <button class="btn-primary" id="btnContinuerReception" ${bloquants.length ? 'disabled' : ''}>Continuer vers le jaugeage final</button>
      <button class="btn-ghost" id="btnRetourReception">Retour</button>
    `;
    document.querySelectorAll('[data-compartiment]').forEach(el => el.addEventListener('click', () => {
      const numero = Number(el.getAttribute('data-compartiment'));
      const comp = compartiments.find(x => x.numero === numero);
      if (comp && comp.vide) return; // rien à réceptionner sur un compartiment vide
      compartimentOuvert = numero;
      renderFicheReception();
    }));
    if (compartimentOuvert != null) renderFicheReception();
    document.getElementById('btnContinuerReception').addEventListener('click', () => allerEtape('jaugeage_final'));
    document.getElementById('btnRetourReception').addEventListener('click', () => allerEtape('compartiments'));
  }

  function renderFicheReception() {
    const zone = document.getElementById('ficheReceptionZone');
    if (!zone) return;
    const c = compartiments.find(x => x.numero === compartimentOuvert);
    if (!c) { zone.innerHTML = ''; return; }
    const M = NexusReceptionMoteur;

    if (c.statut === 'non_receptionne' && !derogationsParCompartiment[c.numero]) {
      const motif = M.libelleMotifNonReception(c.motif_non_receptionne);
      zone.innerHTML = `
        <div class="blocage-card">
          <div class="blocage-tete"><span class="blocage-icone">🔴</span><span class="blocage-titre">Compartiment ${c.numero} non réceptionné</span></div>
          <div class="blocage-valeur">${fmtNum(c.quantite_declaree_l)} L de ${NOM_CARBURANT_COURT[c.carburant] || ''} étaient prévus dans ce compartiment.</div>
          <div class="blocage-consigne">${motif.message}</div>
        </div>
        ${contactManagerHtml()}
        ${renderBoutonDerogation(String(c.numero))}
        ${panneauDerogationPour === String(c.numero) ? renderPanneauDerogation(String(c.numero)) : ''}
        <button class="btn-ghost" id="btnRevenirSurCompartiment">Revenir sur ce compartiment</button>
      `;
      const btnRevenir = document.getElementById('btnRevenirSurCompartiment');
      if (btnRevenir) btnRevenir.addEventListener('click', () => { c.statut = 'a_receptionner'; c.motif_non_receptionne = null; renderReceptionEtape(); });
      cablerDerogation(renderReceptionEtape);
      return;
    }

    zone.innerHTML = `
      <div class="fiche-compartiment">
        <div class="fiche-titre">Compartiment ${c.numero} — ${NOM_CARBURANT_COURT[c.carburant] || ''} · ${fmtNum(c.quantite_declaree_l)} L</div>
        ${c.statut === 'receptionne'
          ? `<div class="compartiment-total ok"><span>✓ Compartiment réceptionné</span></div>`
          : `<button class="btn-primary" id="btnMarquerReceptionne" style="margin-top:0;">✓ Compartiment réceptionné</button>
             <div class="champ-label" style="margin-top:14px;">Ce compartiment n'a pas été réceptionné ?</div>
             <div class="motif-liste">
               ${Object.keys(M.MOTIFS_NON_RECEPTION).map(m => `<div class="motif-item" data-motif="${m}">${M.MOTIFS_NON_RECEPTION[m].label}<span>›</span></div>`).join('')}
             </div>`
        }
      </div>
    `;
    const btnOk = document.getElementById('btnMarquerReceptionne');
    if (btnOk) btnOk.addEventListener('click', () => { c.statut = 'receptionne'; c.receptionne_le = new Date().toISOString(); compartimentOuvert = null; renderReceptionEtape(); });
    document.querySelectorAll('[data-motif]').forEach(el => el.addEventListener('click', () => {
      const motif = el.getAttribute('data-motif');
      const infos = M.libelleMotifNonReception(motif);
      if (!infos.bloquant) {
        // 'oubli_validation' : NEXUS permet de revenir sur le compartiment,
        // aucune anomalie tracée — l'employé va simplement le valider.
        c.statut = 'a_receptionner'; c.motif_non_receptionne = null; compartimentOuvert = null; renderReceptionEtape();
        return;
      }
      c.statut = 'non_receptionne'; c.motif_non_receptionne = motif;
      renderReceptionEtape();
    }));
  }

  // ------------------------------------------------------------
  // RAPPROCHEMENT FINAL — les 3 vérités (prévu / compartiments / mesuré)
  // ------------------------------------------------------------
  function calculerResultatsFinal() {
    const M = NexusReceptionMoteur;
    const compartimentsParCarburant = M.sommeCompartimentsParCarburant(compartiments);
    const deltasParCarburant = M.agregerDeltaParCarburant(Object.values(mesuresParCuve).map(m => ({ carburant: m.carburant, jaugeage_avant_l: m.jaugeage_avant_l === '' ? null : Number(m.jaugeage_avant_l), jaugeage_apres_l: m.jaugeage_apres_l === '' ? null : Number(m.jaugeage_apres_l) })));
    const out = {};
    carburantsPrevus().forEach(carb => {
      out[carb] = M.calculerReceptionCarburant({
        attenduL: Number(lignes[carb].quantite_bl_l),
        compartimentsL: compartimentsParCarburant[carb] != null ? compartimentsParCarburant[carb] : null,
        mesureL: deltasParCarburant[carb] != null ? deltasParCarburant[carb] : null,
        seuilPct: config.seuilEcartMesurePct,
      });
    });
    return out;
  }

  async function chargerComparaisonsHistoriques() {
    const M = NexusReceptionMoteur;
    const out = {};
    await Promise.all(carburantsPrevus().map(async carb => {
      const historique = await NexusReceptionDonnees.chargerHistoriqueEcartsRatio(nexusClient, siteId, carb);
      out[carb] = M.comparerHistorique(resultatsParCarburant[carb].ecartMesureRatio, historique);
    }));
    return out;
  }

  function renderCalcul() {
    resultatsParCarburant = calculerResultatsFinal();
    const M = NexusReceptionMoteur;
    const statutGlobal = M.statutGlobalVisite(carburantsPrevus().map(c => resultatsParCarburant[c].statut));
    const libelle = M.libelleStatutReception(statutGlobal);
    document.getElementById('content').innerHTML = `
      <div class="badge-statut ${libelle.niveau}">${libelle.texte}</div>
      <div class="resume-card" id="resumeFinal">
        ${carburantsPrevus().map(carb => {
          const r = resultatsParCarburant[carb];
          return `
          <div class="carburant-resultat-tete"><span class="carburant-pastille" style="--cc:var(--${carb});"></span>${NOM_CARBURANT[carb]}</div>
          <div class="stat-row"><span class="stat-label">Prévu (BL)</span><span class="stat-value">${fmtNum(r.attenduL)} L</span></div>
          <div class="stat-row"><span class="stat-label">Compartiments</span><span class="stat-value">${fmtNum(r.compartimentsL)} L</span></div>
          <div class="stat-row total"><span class="stat-label">Mesuré par jaugeage</span><span class="stat-value">${r.mesureL != null ? fmtNum(r.mesureL) + ' L' : '—'}</span></div>
          <div class="stat-row"><span class="stat-label">Delta</span><span class="stat-value ${r.statut === 'a_rapprocher' ? 'red' : (r.statut === 'coherente' ? 'green' : '')}">${M.texteEcart(r.ecartMesureL, r.ecartMesureRatio)}</span></div>
        `; }).join('')}
      </div>
      <div class="nexus-dit" id="lectureNexus"><div class="coach-tete">🧭 Coach NEXUS</div><div id="lectureNexusTexte">Comparaison à l'historique en cours…</div></div>
      <button class="btn-primary" id="btnTerminerReception">Terminer la réception</button>
      <button class="btn-ghost" id="btnRetourCalcul">Retour</button>
    `;
    chargerComparaisonsHistoriques().then(comparaisons => {
      const phrases = carburantsPrevus().map(carb => {
        const r = resultatsParCarburant[carb];
        if (r.statut !== 'a_rapprocher') return null;
        return M.phraseRapprochement(NOM_CARBURANT_COURT[carb], r.ecartMesureL, r.ecartMesureRatio, comparaisons[carb]);
      }).filter(Boolean);
      const texte = phrases.length ? phrases.join(' ') : 'La réception terrain est cohérente avec le bon de livraison, sur l\'ensemble des carburants livrés.';
      const zone = document.getElementById('lectureNexusTexte');
      if (zone) zone.innerHTML = texte;
    });
    document.getElementById('btnTerminerReception').addEventListener('click', confirmerEtSoumettre);
    document.getElementById('btnRetourCalcul').addEventListener('click', () => allerEtape('jaugeage_final'));
  }

  // Liste des anomalies de la visite en cours (dérogations manager sur le
  // contrôle compartiments vs BL et/ou sur des compartiments non
  // réceptionnés) — extrait de soumettreVisite() pour que la modale de
  // validation finale (§9.1 de l'audit) et la soumission réelle affichent
  // et enregistrent EXACTEMENT la même liste, jamais deux constructions
  // séparées qui pourraient diverger (Article 11).
  function construireAnomaliesVisite() {
    const anomalies = [];
    if (derogationGlobaleCompartiments && controleCompartiments) {
      controleCompartiments.carburantsEnAnomalie.forEach(carb => {
        const r = controleCompartiments.parCarburant[carb];
        anomalies.push({
          type: 'compartiments_vs_bl', carburant: carb,
          details: { attendu: r.attendu, declare: r.declare, ecart: r.ecart, ecart_pct: r.ecartPct },
          statut: 'derogation_manager',
          derogation_manager_nom: derogationGlobaleCompartiments.nom,
          derogation_motif: derogationGlobaleCompartiments.motif,
          derogation_le: derogationGlobaleCompartiments.le,
        });
      });
    }
    Object.keys(derogationsParCompartiment).forEach(numero => {
      const c = compartiments.find(x => x.numero === Number(numero));
      const d = derogationsParCompartiment[numero];
      anomalies.push({
        type: 'compartiment_non_receptionne', carburant: c ? c.carburant : null, compartiment_numero: Number(numero),
        details: { motif: c ? c.motif_non_receptionne : null, quantite_declaree_l: c ? c.quantite_declaree_l : null },
        statut: 'derogation_manager',
        derogation_manager_nom: d.nom, derogation_motif: d.motif, derogation_le: d.le,
      });
    });
    return anomalies;
  }

  // ------------------------------------------------------------
  // MODALE DE VALIDATION FINALE — audit Carburants §9.1 (17/08/2026) :
  // "remplacer les confirmations navigateur par une modale NEXUS présentant
  // les faits avant verrouillage." Même structure bottom-sheet que
  // .cloture-overlay/.cloture-modal (NEXUS-FDJ-v1.html, demande de
  // Frédéric : "je ferais une vraie modale cohérente avec l'interface") —
  // jamais un confirm() natif pour un geste aussi engageant. Retourne une
  // Promise résolue à true si l'employé confirme, false sinon (fermeture,
  // clic hors modale, "Revoir avant de valider").
  // ------------------------------------------------------------
  function demanderConfirmationReception() {
    return new Promise(resolve => {
      const M = NexusReceptionMoteur;
      const anomalies = construireAnomaliesVisite();
      const totalCompartiments = compartiments.length;
      const compartimentsReceptionnes = compartiments.filter(c => c.statut === 'receptionne').length;
      const lignesHtml = carburantsPrevus().map(carb => {
        const r = resultatsParCarburant[carb];
        return `
          <div class="recep-ligne">
            <span>${NOM_CARBURANT_COURT[carb]} — BL ${fmtNum(r.attenduL)} L / mesuré ${r.mesureL != null ? fmtNum(r.mesureL) + ' L' : '—'}</span>
            <span class="recep-valeur ${r.statut === 'a_rapprocher' ? 'amber' : 'green'}">${M.texteEcart(r.ecartMesureL, r.ecartMesureRatio)}</span>
          </div>`;
      }).join('');
      const overlay = document.createElement('div');
      overlay.className = 'recep-overlay';
      overlay.innerHTML = `
        <div class="recep-modal">
          <div class="recep-titre">Clôturer cette réception ?</div>
          ${lignesHtml}
          <div class="recep-texte">Compartiments confirmés : ${compartimentsReceptionnes}/${totalCompartiments}.</div>
          ${anomalies.length ? `<div class="recep-avertissement">🟠 ${anomalies.length} anomalie${anomalies.length > 1 ? 's' : ''} déverrouillée${anomalies.length > 1 ? 's' : ''} par dérogation manager sera${anomalies.length > 1 ? 'ont' : ''} enregistrée${anomalies.length > 1 ? 's' : ''} avec cette réception.</div>` : ''}
          <div class="recep-texte">Après validation, vous ne pourrez plus modifier cette réception. Toute correction sera tracée par le manager.</div>
          <div class="recep-actions">
            <button type="button" class="btn-primary" id="btnRecepValider">Clôturer la réception</button>
            <button type="button" class="btn-ghost" id="btnRecepRetour">Revoir avant de valider</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const fermer = (resultat) => { overlay.remove(); resolve(resultat); };
      document.getElementById('btnRecepValider').addEventListener('click', () => fermer(true));
      document.getElementById('btnRecepRetour').addEventListener('click', () => fermer(false));
      overlay.addEventListener('click', e => { if (e.target === overlay) fermer(false); });
    });
  }

  let modaleReceptionOuverte = false; // évite d'empiler deux modales sur un double-tap avant que la première n'ait eu le temps de s'afficher.
  async function confirmerEtSoumettre() {
    if (modaleReceptionOuverte || enSoumission) return;
    modaleReceptionOuverte = true;
    const confirme = await demanderConfirmationReception();
    modaleReceptionOuverte = false;
    if (confirme) await soumettreVisite();
  }

  // ------------------------------------------------------------
  // SOUMISSION
  // ------------------------------------------------------------
  async function soumettreVisite() {
    if (enSoumission) return;
    enSoumission = true;
    const btn = document.getElementById('btnTerminerReception');
    btn.disabled = true;
    btn.innerHTML = `Enregistrement<span class="btn-loading-dots"><i></i><i></i><i></i></span>`;

    const M = NexusReceptionMoteur;
    const heureDebutISO = visite.heure_debut ? new Date(visite.heure_debut).toISOString() : new Date().toISOString();
    const heureFinISO = heureFin || new Date().toISOString();
    const uneDerogation = !!derogationGlobaleCompartiments || Object.keys(derogationsParCompartiment).length > 0;

    const ligneVisite = {
      site: siteId,
      date_visite: dateISO(new Date(heureDebutISO)),
      heure_debut: heureDebutISO,
      heure_fin: heureFinISO,
      transporteur: visite.transporteur || null,
      chauffeur: visite.chauffeur || null,
      immatriculation: visite.immatriculation || null,
      bon_livraison_reference: visite.bon_livraison_reference || null,
      employe_id: employeeCourant.id,
      nombre_compartiments: compartiments.length,
      statut: uneDerogation ? 'terminee_avec_derogation' : 'terminee',
      idempotency_key: idempotencyKey,
    };

    const lignesFinales = carburantsPrevus().map(carb => {
      const r = resultatsParCarburant[carb];
      return {
        carburant: carb,
        quantite_bl_l: r.attenduL,
        quantite_compartiments_l: r.compartimentsL,
        quantite_mesuree_l: r.mesureL,
        delta_l: r.ecartMesureL,
        delta_ratio: r.ecartMesureRatio,
        statut: r.statut,
      };
    });

    const compartimentsFinaux = compartiments.map(c => ({
      numero: c.numero,
      carburant: c.carburant,
      quantite_declaree_l: c.quantite_declaree_l !== '' ? Number(c.quantite_declaree_l) : null,
      cuve_destination_id: c.cuve_destination_id,
      statut: c.statut,
      motif_non_receptionne: c.motif_non_receptionne,
      receptionne_le: c.receptionne_le,
    }));

    const mesuresFinales = Object.values(mesuresParCuve).map(m => ({
      cuve_id: m.cuve_id,
      carburant: m.carburant,
      jaugeage_avant_l: Number(m.jaugeage_avant_l),
      jaugeage_avant_le: m.jaugeage_avant_le,
      jaugeage_apres_l: m.jaugeage_apres_l !== '' ? Number(m.jaugeage_apres_l) : null,
