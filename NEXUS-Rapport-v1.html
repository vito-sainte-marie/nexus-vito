<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  /* Sélecteur de période */
  .periode-bar{display:flex; gap:6px; flex-wrap:wrap; padding:0 20px 14px;}
  .periode-btn{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.02em;
    padding:8px 12px; border-radius:20px; border:1px solid var(--hairline); background:var(--panel);
    color:var(--text-mid); cursor:pointer;
  }
  .periode-btn.actif{color:var(--cyan); border-color:rgba(79,195,217,0.5); background:rgba(79,195,217,0.1);}
  .libre-bar{display:none; gap:8px; padding:0 20px 14px;}
  .libre-bar.visible{display:flex;}
  .libre-bar input{flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:8px 10px; color:var(--text); font-family:var(--mono); font-size:12.5px;}
  .libre-btn{font-family:var(--sans); font-size:12px; font-weight:700; color:#04141a; background:var(--cyan); border:none; border-radius:8px; padding:8px 14px; cursor:pointer;}
  .periode-label{padding:0 20px 6px; font-family:var(--mono); font-size:11px; color:var(--text-dim);}

  .badge{display:inline-block; font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:0.03em; padding:2px 7px; border-radius:20px; text-transform:uppercase; margin-left:6px; vertical-align:middle;}
  .badge-real{color:var(--green); background:var(--green-dim);}
  .badge-derived{color:var(--cyan); background:rgba(79,195,217,0.12);}
  .badge-insuffisant{color:var(--text-dim); background:var(--panel-raised);}

  .chapitre{padding:0 20px 8px;}
  .chapitre-titre{font-size:16px; font-weight:700; margin:18px 0 4px;}
  .chapitre-note{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:12px;}

  .kpi-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin-bottom:12px;}
  .kpi-row{display:flex; align-items:baseline; justify-content:space-between; padding:6px 0;}
  .kpi-row + .kpi-row{border-top:1px solid var(--hairline);}
  .kpi-label{font-size:12.5px; color:var(--text-mid);}
  .kpi-valeur{font-family:var(--mono); font-weight:700; font-size:14px;}
  .kpi-evol{font-family:var(--mono); font-size:11px; margin-left:6px;}
  .kpi-evol.hausse{color:var(--green);}
  .kpi-evol.baisse{color:var(--red);}
  .kpi-evol.stable{color:var(--text-dim);}

  .synthese-texte{font-size:13.5px; line-height:1.6; color:var(--text); background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin-bottom:12px;}

  .axe-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px;}
  .axe-icone{font-size:20px;}
  .axe-nom{font-size:13.5px; font-weight:700;}
  .axe-detail{font-size:11.5px; color:var(--text-mid); margin-top:2px;}
  .axe-statut{margin-left:auto; font-family:var(--mono); font-size:10px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; white-space:nowrap;}

  .decision-ligne{padding:9px 0; border-top:1px solid var(--hairline); font-size:12px;}
  .decision-ligne:first-child{border-top:none;}
  .decision-meta{color:var(--text-dim); font-family:var(--mono); font-size:10px; margin-top:2px;}

  .btn-pdf{
    display:block; width:100%; margin:18px 20px 6px; padding:15px; border:none; border-radius:12px;
    background:var(--cyan); color:#04141a; font-family:var(--sans); font-weight:700; font-size:14.5px; cursor:pointer; width:calc(100% - 40px);
  }
  .btn-pdf:disabled{opacity:0.5;}
  .btn-pdf:active{opacity:0.85;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}

  /* Vue bureau (cohérente avec les autres écrans manager NEXUS) */
  body.nexus-desktop .phone{max-width:640px; border:none;}
</style>

<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · RAPPORT</div>
    <div class="title">Rapport NEXUS</div>
    <div class="sub" id="sousTitre">Chargement…</div>
  </div>
  <div class="divider"></div>

  <div class="periode-bar" id="periodeBar"></div>
  <div class="libre-bar" id="libreBar">
    <input type="date" id="libreDebut">
    <input type="date" id="libreFin">
    <button class="libre-btn" id="btnLibreValider">Valider</button>
  </div>
  <div class="periode-label" id="periodeLabel"></div>

  <div class="section" id="content" style="padding-top:0;">
    <div class="loading">Chargement…</div>
  </div>

  <div class="periode-label" style="padding-top:0; padding-bottom:10px;">L'écran ci-dessus reste un aperçu synthétique (Synthèse + Santé). Le PDF est le Rapport NEXUS de Direction complet — 18 sections, 8 à 20 pages selon les données disponibles.</div>
  <button class="btn-pdf" id="btnPdf" style="display:none;">Générer le PDF</button>

  <footer>NEXUS Rapport de Direction · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ------------------------------------------------------------
  // NEXUS Rapport v1 (10/08/2026) — premier bout-en-bout du "Rapport
  // NEXUS" décrit dans le cadrage développeur du 10/08/2026, limité
  // (choix de Frédéric, "2 chapitres bout-en-bout") aux Chapitres 1
  // (Synthèse dirigeant) et 2 (Santé de l'entreprise), pour prouver
  // l'architecture complète — sélection de période calendaire, cascade
  // de sources honnête, PDF multi-pages — avant de généraliser aux 10
  // autres chapitres du cadrage.
  //
  // Distinct de Brief NEXUS : Brief est un instantané "aujourd'hui",
  // toujours 1 page, sans sélection de période. Rapport NEXUS compare
  // une période calendaire choisie par le manager à une référence
  // résolue automatiquement (voir nexus-periodes.js) et peut s'exporter
  // en PDF multi-pages (voir NexusPdfMoteur.ConstructeurRapport).
  //
  // Toute la logique de calcul vit dans nexus-rapport-moteur.js (pur) et
  // nexus-periodes.js (résolution de bornes, pur) — ce fichier ne fait
  // que charger les données (nexus-rapport-donnees.js) et mettre en
  // forme, à l'écran et dans le PDF, EXACTEMENT le même objet calculé
  // (Article 11 : jamais deux calculs séparés de la même chose).
  // ------------------------------------------------------------

  let SITE_ID = null; // jamais 'vito-sainte-marie' par defaut (de-Vito-isation, 11/08/2026) - toujours ecrase par employee.site_id apres nexusRequireAuth()
  let NOM_ENTREPRISE = null;
  let MANAGER_COURANT = null;
  let TYPE_PERIODE = 'semaine';
  let CHAPITRE1 = null;
  let CHAPITRE2 = null;
  let RAPPORT_DIRECTION = null; // 11/08/2026 — Rapport NEXUS de Direction (18 sections), voir nexus-rapport-direction-moteur.js

  const TYPES = [
    { cle: 'semaine', label: 'Semaine' },
    { cle: 'mois', label: 'Mois' },
    { cle: 'trimestre', label: 'Trimestre' },
    { cle: 'annee', label: 'Année' },
    { cle: 'libre', label: 'Dates libres' },
  ];

  const COULEUR_STATUT = {
    'En hausse': { c: 'var(--green)', f: 'var(--green-dim)' },
    'En baisse': { c: 'var(--red)', f: 'var(--red-dim)' },
    'Stable': { c: 'var(--text-mid)', f: 'var(--panel-raised)' },
    'Données insuffisantes': { c: 'var(--text-dim)', f: 'var(--panel-raised)' },
  };

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function badgeConfiance(confiance) {
    if (confiance === 'reel') return '<span class="badge badge-real">RÉEL</span>';
    if (confiance === 'derive') return '<span class="badge badge-derived">DÉRIVÉ</span>';
    return '<span class="badge badge-insuffisant">INSUFFISANT</span>';
  }

  function renderBarrePeriodes() {
    const bar = document.getElementById('periodeBar');
    bar.innerHTML = TYPES.map(t => `<button class="periode-btn ${t.cle === TYPE_PERIODE ? 'actif' : ''}" data-type="${t.cle}">${t.label}</button>`).join('');
    bar.querySelectorAll('.periode-btn').forEach(btn => btn.addEventListener('click', () => {
      TYPE_PERIODE = btn.dataset.type;
      renderBarrePeriodes();
      const libreBar = document.getElementById('libreBar');
      if (TYPE_PERIODE === 'libre') { libreBar.classList.add('visible'); return; }
      libreBar.classList.remove('visible');
      chargerEtRendre();
    }));
    document.getElementById('libreBar').classList.toggle('visible', TYPE_PERIODE === 'libre');
  }

  // Carburants/FDJ période-scopés (11/08/2026, "Rapport par secteur", audit
  // stratégique Brief/Rapport de Direction) — chargeurs locaux à cet écran,
  // sur le même modèle que chargerCaPeriode/chargerMargePeriode
  // (nexus-rapport-donnees.js) : reçoivent (client, site, periode),
  // retournent { disponible:true, ... } ou { disponible:false, raison },
  // donc réutilisables tels quels par NexusRapportDonnees.chargerAvecRepli
  // pour la référence (jamais une deuxième boucle de repli réécrite ici).
  // Carburants : réutilise NexusCarburantDonnees.chargerVentesPeriode +
  // NexusCarburantMoteur (calculerMixCarburant/identifierProduitMoteur) —
  // exactement les primitives déjà utilisées par Carburants Pilotage,
  // jamais un second calcul de volume/mix (Article 11).
  async function chargerCarburantsPeriode(client, site, periode) {
    const donnees = await NexusCarburantDonnees.chargerVentesPeriode(client, site, periode.debut, periode.fin);
    const mix = NexusCarburantMoteur.calculerMixCarburant(donnees.ventes);
    if (!mix || !mix.total) return { disponible: false, raison: `Aucune vente carburant ne couvre la période ${periode.debut} → ${periode.fin}.` };
    return {
      disponible: true, volumeActuel: mix.total, ventes: donnees.ventes,
      produitMoteur: NexusCarburantMoteur.identifierProduitMoteur(donnees.ventes),
      couvertureIncertaine: donnees.nbQuartsTotal > 0 && donnees.nbQuartsAvecLitrage < donnees.nbQuartsTotal,
    };
  }

  // FDJ : mêmes vues que Brief NEXUS (view_fdj_daily_summary/
  // view_fdj_game_daily), simplement filtrées sur la période choisie par
  // le manager au lieu d'une fenêtre glissante fixe de 7 jours.
  //
  // Couverture quarts finalisés (23/08/2026, audit "Anti-dégradation
  // temporelle" §6, v2.225 — "rapport hebdomadaire FDJ") : `nb_quarts`
  // (vue `view_fdj_daily_summary`) compte TOUS les quarts FDJ enregistrés
  // sur la période, alors que `nb_quarts_controles`/`ca_grattage` sont déjà
  // filtrés côté SQL sur `caisse_comptabilisable` (shift validé ET caisse
  // non provisoire — vérifié dans la définition de la vue) : le CA affiché
  // n'a donc JAMAIS inclus de quart en brouillon (l'audit était déjà
  // respecté sur le fond). Ce qui manquait, c'est la TRANSPARENCE demandée
  // par l'audit ("Le Brief peut signaler la couverture, ex. 8/10 quarts
  // finalisés, sans pénaliser le score") : `nbQuartsControles` était
  // calculé puis jeté sans jamais être montré au manager. Les deux
  // compteurs sont désormais retournés — Article 5, jamais un total
  // "définitif" présenté sans dire combien de quarts y contribuent
  // réellement.
  async function chargerFdjPeriode(client, site, periode) {
    const [{ data: dailyRows, error: e1 }, { data: gameDailyRows, error: e2 }, { data: jeuxData, error: e3 }] = await Promise.all([
      client.from('view_fdj_daily_summary').select('ca_grattage, nb_quarts_controles, nb_quarts').eq('site', site).gte('date', periode.debut).lte('date', periode.fin),
      client.from('view_fdj_game_daily').select('game_id, ca').eq('site', site).gte('date', periode.debut).lte('date', periode.fin),
      client.from('fdj_games').select('id, nom').eq('site', site).eq('actif', true),
    ]);
    if (e1 || e2 || e3) { [e1, e2, e3].forEach(e => { if (e) console.error('Rapport NEXUS — chargement FDJ période:', e); }); return { disponible: false, raison: 'Erreur de chargement des données FDJ.' }; }
    const rows = dailyRows || [];
    const nbQuartsControles = rows.reduce((s, r) => s + (r.nb_quarts_controles || 0), 0);
    if (!nbQuartsControles) return { disponible: false, raison: `Aucun quart FDJ contrôlé sur la période ${periode.debut} → ${periode.fin}.` };
    const nbQuartsTotal = rows.reduce((s, r) => s + (r.nb_quarts || 0), 0);
    const caActuel = rows.reduce((s, r) => s + (r.ca_grattage || 0), 0);
    const gameCa = {};
    (gameDailyRows || []).forEach(l => { if (l.ca) gameCa[l.game_id] = (gameCa[l.game_id] || 0) + Number(l.ca); });
    const jeuxTop5 = Object.entries(gameCa)
      .sort((a, b) => b[1] - a[1]).slice(0, 5)
      .map(([gid, ca]) => { const j = (jeuxData || []).find(j => j.id === gid); return { id: gid, nom: j ? j.nom : gid, ca }; });
    const jeuMoteur = jeuxTop5[0] || null;
    return { disponible: true, caActuel, jeuMoteur, jeuxTop5, nbQuartsControles, nbQuartsTotal };
  }

  async function chargerEtRendre(bornesLibres) {
    document.getElementById('content').innerHTML = '<div class="loading">Calcul du rapport…</div>';
    document.getElementById('btnPdf').style.display = 'none';

    const periode = NexusPeriodes.resoudrePeriodeCalendaire(TYPE_PERIODE, todayISO(), bornesLibres);
    document.getElementById('periodeLabel').textContent = `Période : ${periode.label} (${periode.debut} → ${periode.fin})`;
    // Comparaison à avancement égal (13/08/2026) — même correctif que
    // NEXUS-Carburants-Pilotage-v1.html : si "Semaine"/"Mois" est choisi
    // alors que la période est encore en cours, chaque référence est
    // désormais tronquée aux mêmes jours écoulés plutôt que comparée à une
    // période de référence complète (voir
    // nexus-periodes.js::resoudrePeriodesReference). Aucun changement pour
    // un rapport généré sur une période déjà terminée.
    const referencesCandidates = NexusPeriodes.resoudrePeriodesReference(periode, todayISO());

    const [ca, marge, decisions, carbActuel, fdjActuel] = await Promise.all([
      NexusRapportDonnees.chargerCaPeriode(nexusClient, SITE_ID, periode),
      NexusRapportDonnees.chargerMargePeriode(nexusClient, SITE_ID, periode),
      NexusRapportDonnees.chargerDecisionsPeriode(nexusClient, SITE_ID, periode),
      chargerCarburantsPeriode(nexusClient, SITE_ID, periode),
      chargerFdjPeriode(nexusClient, SITE_ID, periode),
    ]);
    const [caRef, margeRef, carbRef, fdjRef] = await Promise.all([
      NexusRapportDonnees.chargerAvecRepli(NexusRapportDonnees.chargerCaPeriode, nexusClient, SITE_ID, referencesCandidates),
      NexusRapportDonnees.chargerAvecRepli(NexusRapportDonnees.chargerMargePeriode, nexusClient, SITE_ID, referencesCandidates),
      NexusRapportDonnees.chargerAvecRepli(chargerCarburantsPeriode, nexusClient, SITE_ID, referencesCandidates),
      NexusRapportDonnees.chargerAvecRepli(chargerFdjPeriode, nexusClient, SITE_ID, referencesCandidates),
    ]);

    CHAPITRE1 = NexusRapportMoteur.construireChapitreSynthese({ periode, ca, caRef, marge, margeRef, decisions });
    // Carburants/FDJ combinés ICI (actuel + référence → évolution), sur le
    // même principe que ca/caRef pour le Chapitre 1 — le moteur pur reçoit
    // un objet déjà comparé, jamais deux mesures séparées à recombiner
    // lui-même.
    const carburantsChapitre = carbActuel.disponible
      ? { disponible: true, volumeActuel: carbActuel.volumeActuel, produitMoteur: carbActuel.produitMoteur,
          couvertureIncertaine: carbActuel.couvertureIncertaine || (carbRef.disponible && carbRef.couvertureIncertaine),
          evolution: carbRef.disponible ? NexusCarburantMoteur.calculerEvolutionVolume(carbActuel.volumeActuel, carbRef.volumeActuel) : null }
      : { disponible: false, raison: carbActuel.raison };
    const fdjChapitre = fdjActuel.disponible
      ? { disponible: true, caActuel: fdjActuel.caActuel, jeuMoteur: fdjActuel.jeuMoteur,
          evolution: (fdjRef.disponible && fdjRef.caActuel > 0) ? (fdjActuel.caActuel - fdjRef.caActuel) / fdjRef.caActuel : null,
          nbQuartsControles: fdjActuel.nbQuartsControles, nbQuartsTotal: fdjActuel.nbQuartsTotal }
      : { disponible: false, raison: fdjActuel.raison };
    CHAPITRE2 = NexusRapportMoteur.construireChapitreSante(CHAPITRE1, { carburants: carburantsChapitre, fdj: fdjChapitre });

    // ------------------------------------------------------------
    // Rapport NEXUS de Direction (11/08/2026) — chargement des données
    // complémentaires (catégories Commerce, Opérations, Équipe,
    // Trajectoire) puis assemblage des 18 sections. Le Chapitre 1/2
    // ci-dessus reste la base (jamais recalculée) ; le reste est ajouté
    // par-dessus (Article 11).
    // ------------------------------------------------------------
    const [commerceCategories, operations, equipe, trajectoire] = await Promise.all([
      NexusRapportDirectionDonnees.chargerCommerceCategories(nexusClient, SITE_ID),
      NexusRapportDirectionDonnees.chargerOperationsPeriode(nexusClient, SITE_ID, periode),
      NexusRapportDirectionDonnees.chargerEquipePeriode(nexusClient, SITE_ID, periode),
      NexusRapportDirectionDonnees.chargerTrajectoire(nexusClient, SITE_ID),
    ]);

    // Carburants détaillé : mix + décomposition d'évolution par carburant
    // (moteur d'évolution), calculés ICI à partir des ventes actuel/
    // référence déjà chargées — jamais un second appel réseau, jamais un
    // second calcul de volume (Article 11 : NexusCarburantMoteur fait le
    // calcul, ce fichier ne fait que le déclencher avec les bonnes
    // entrées).
    let carburantsDetail = { disponible: false, raison: carburantsChapitre.raison };
    if (carburantsChapitre.disponible) {
      const mix = NexusCarburantMoteur.calculerMixCarburant(carbActuel.ventes);
      let moteurEvolution = null;
      if (carbRef.disponible && carbRef.ventes) {
        const decomposition = NexusCarburantMoteur.decomposerEvolution(carbActuel.ventes, carbRef.ventes);
        moteurEvolution = NexusCarburantMoteur.identifierMoteurEvolution(decomposition);
      }

      // Task #480 (18/08/2026, "Brancher Brief/Rapport sur les indicateurs
      // économiques carburant validés") : coût moyen pondéré + effet prix
      // stock hérité (Sprint C8) — même lecture que Carburants Pilotage
      // (chargerEtRendreEconomie), jamais un second calcul (Article 11).
      // POINT-IN-TIME, volontairement indépendant de la période choisie
      // pour ce rapport (même principe que Pilotage : le CMP/effet prix
      // décrit le stock actuellement en cuve, pas une période passée) —
      // nécessite donc son propre chargement du contrôle du jour, jamais
      // dérivé de carbActuel/carbRef qui portent la période du rapport.
      const aujourdhuiEco = new Date().toISOString().slice(0, 10);
      const [controleJourEco, cuvesConfigEco, prixVenteEco] = await Promise.all([
        NexusCarburantDonnees.chargerControleJour(nexusClient, SITE_ID, aujourdhuiEco),
        NexusCarburantDonnees.chargerCuvesConfig(nexusClient, SITE_ID),
        NexusCarburantDonnees.chargerPrixCarburantsCourant(nexusClient, SITE_ID),
      ]);
      const clesActivesEco = NexusCarburantMoteur.CLES_CARBURANT.filter(cle => !cuvesConfigEco.config || !cuvesConfigEco.config[cle] || cuvesConfigEco.config[cle].actif);
      const effetsParCarburantEco = {};
      await Promise.all(clesActivesEco.map(async cle => {
        const livraisons = await NexusCarburantDonnees.chargerLivraisonsCouteesCarburant(nexusClient, SITE_ID, cle, 60);
        const cmpData = NexusCarburantMoteur.calculerCmpProgressif(livraisons);
        const stockActuelL = (controleJourEco && controleJourEco.parCarburant && controleJourEco.parCarburant[cle]) ? controleJourEco.parCarburant[cle].stockPhysiqueAffiche : null;
        effetsParCarburantEco[cle] = NexusCarburantMoteur.calculerEffetPrixStockHerite({ cmp: cmpData.cmp, coutRemplacementActuel: cmpData.coutRemplacementActuel, prixVenteDuMois: prixVenteEco ? prixVenteEco[cle] : null, stockPhysiqueActuelL: stockActuelL });
      }));
      const effetPrixResume = NexusCarburantMoteur.resumerEffetPrixCarburants(effetsParCarburantEco);

      carburantsDetail = {
        disponible: true, mix, evolution: carburantsChapitre.evolution,
        produitMoteur: carburantsChapitre.produitMoteur, moteurEvolution,
        couvertureIncertaine: carburantsChapitre.couvertureIncertaine,
        effetPrixResume,
      };
    }
    const fdjDetail = fdjChapitre.disponible
      ? { disponible: true, caActuel: fdjChapitre.caActuel, evolution: fdjChapitre.evolution, jeuMoteur: fdjChapitre.jeuMoteur, jeuxTop5: fdjActuel.jeuxTop5,
          nbQuartsControles: fdjChapitre.nbQuartsControles, nbQuartsTotal: fdjChapitre.nbQuartsTotal }
      : { disponible: false, raison: fdjChapitre.raison };

    // Granularité stratégique (même filtre que Brief NEXUS, appliqué ici
    // aux décisions déjà journalisées plutôt qu'à des candidats bruts —
    // journal_decisions porte les mêmes champs article/impact_eur) :
    // les 3 "décisions dirigeant" de la Synthèse exécutive ne montrent
    // jamais une décision SKU isolée de faible matérialité.
    const decisionsStrategiques = (CHAPITRE1.decisions || [])
      .filter(d => NexusSecteursMoteur.estDecisionStrategique(d))
      .sort((a, b) => (b.impact_eur || 0) - (a.impact_eur || 0));

    // Moteur de risques (12/08/2026, migration partielle du chapitre 12,
    // suite v2.46-v2.48) — LECTURE SEULE ici, volontairement : ce fichier
    // ne relance aucune qualification/écriture (contrairement à Brief/
    // Cockpit, qui tournent sur une fenêtre glissante de 30 jours et
    // enregistrent à chaque ouverture). La période du Rapport est choisie
    // librement par le manager (semaine/mois/trimestre/année/libre) —
    // relancer une observation avec cette fenêtre arbitraire polluerait
    // la mémoire du signal (récurrence comptée sur une durée incohérente
    // avec les autres appelants). Le Rapport se contente donc de lire les
    // signaux déjà entretenus par Brief/Cockpit (chargerSignauxSite) et de
    // les présenter formatés, jamais un 2e calcul de matérialité.
    const signauxRisqueBruts = await NexusRisquesDonnees.chargerSignauxSite(nexusClient, SITE_ID, { statut: 'surveille' });
    const signauxRisqueQualifies = signauxRisqueBruts.filter(s => s.niveau !== 'anomalie').map(s => {
      // Cadrage risques Phase 2 (18/08/2026, tâche #231) : `domaine` et
      // `sujet` (nom brut de la catégorie/du quart, sans mise en forme)
      // sont désormais conservés en plus de `phrase` — nécessaires pour que
      // `construireAmeliorer()`/`construireSyntheseExecutive()` (chapitres
      // 2 et 13-14) puissent eux aussi reclasser leurs constats Marge sur
      // ces mêmes signaux qualifiés, au lieu d'une comparaison de pairs.
      // Chapitre 12 continue d'utiliser exclusivement `phrase` (inchangé).
      //
      // Cadrage risques Phase 3 (18/08/2026, tâche #232, "dimension urgence
      // + référence au contrat NexusRisques") : `urgence`/`urgenceLabel`
      // rejoignent `niveauConfiance` — les 3 champs que le contrat de
      // sortie de `NexusRisques`/`chargerSignauxSite()` expose pour
      // qualifier un signal (gravité, urgence, confiance de la
      // qualification), jusqu'ici seul `niveau` (gravité) et
      // `niveauConfiance` étaient transmis, `urgence` était silencieusement
      // perdu au passage de `signauxRisqueBruts` à `signauxRisqueQualifies`
      // — le Rapport n'en montrait donc qu'une fraction. `urgence` est déjà
      // calculé (jamais persisté) par `chargerSignauxSite()` via
      // `NexusRisques.classifierUrgence` — zéro nouveau calcul ici, même
      // champ déjà consommé par Brief NEXUS depuis P1.3 (v2.53).
      // Cadrage risques Phase 5 (18/08/2026, tâche #234) : ternaire binaire
      // marge/caisse remplacé par le mapping partagé
      // NexusRisques.sujetSignal/domaineLabelSignal — même correctif que
      // Brief/Cockpit (Article 11, une seule source, sinon tout signal
      // Carburants se serait affiché à tort comme "Caisse").
      const sujet = NexusRisques.sujetSignal(s);
      return {
        niveau: s.niveau, domaine: s.domaine, sujet,
        urgence: s.urgence, urgenceLabel: NexusRisques.LABEL_URGENCE[s.urgence] || s.urgence,
        phrase: NexusRisques.genererPhraseContexte({
          domaineLabel: NexusRisques.domaineLabelSignal(s),
          sujet,
          niveau: s.niveau,
          motif: (s.historique_transitions && s.historique_transitions.length) ? s.historique_transitions[s.historique_transitions.length - 1].motif : '',
        }),
        actionRecommandee: s.action_recommandee, niveauConfiance: s.niveau_confiance, depuisLe: s.premiere_detection_le,
      };
    });

    RAPPORT_DIRECTION = NexusRapportDirectionMoteur.construireRapportDirection({
      nomEntreprise: NOM_ENTREPRISE, periode, dateReference: new Date(),
      chapitre1: CHAPITRE1, chapitre2: CHAPITRE2, decisionsStrategiques,
      commerceCategories, carburantsDetail, fdjDetail, operations, equipe, trajectoire,
      signauxQualifies: signauxRisqueQualifies,
    });

    render();
    document.getElementById('btnPdf').style.display = 'block';
  }

  function ligneEvolutionHTML(evol) {
    if (evol == null) return '<span class="kpi-evol stable">—</span>';
    const cls = evol > 0.02 ? 'hausse' : evol < -0.02 ? 'baisse' : 'stable';
    return `<span class="kpi-evol ${cls}">${evol >= 0 ? '+' : ''}${(evol * 100).toFixed(1)} %</span>`;
  }

  function render() {
    const c1 = CHAPITRE1, c2 = CHAPITRE2;
    document.getElementById('sousTitre').textContent = `Synthèse et santé de l'entreprise sur la période sélectionnée.`;

    const decisionsHTML = c1.decisions.length
      ? c1.decisions.slice(0, 8).map(d => `
        <div class="decision-ligne">
          ${d.recommandation || d.article || d.candidate_id}
          <div class="decision-meta">${d.date}${d.impact_eur ? ` · ${NexusRapportMoteur.formaterEuros(d.impact_eur)}` : ''}${d.etat ? ` · ${d.etat}` : ''}</div>
        </div>`).join('') + (c1.decisions.length > 8 ? `<div class="decision-meta" style="padding-top:8px;">+ ${c1.decisions.length - 8} autre${c1.decisions.length - 8 > 1 ? 's' : ''} — voir Journal NEXUS.</div>` : '')
      : '<div class="decision-meta">Aucune décision enregistrée sur cette période.</div>';

    const axesHTML = c2.axes.map(a => {
      const couleur = COULEUR_STATUT[a.statut] || COULEUR_STATUT['Données insuffisantes'];
      return `
        <div class="axe-card">
          <span class="axe-icone">${a.icone}</span>
          <div>
            <div class="axe-nom">${a.nom}${a.confiance ? badgeConfiance(a.confiance) : ''}</div>
            <div class="axe-detail">${a.detail}</div>
          </div>
          <span class="axe-statut" style="color:${couleur.c}; background:${couleur.f};">${a.statut}</span>
        </div>`;
    }).join('');

    const axesNonCouvertsHTML = c2.axesNonCouverts.map(a => `
      <div class="axe-card" style="opacity:0.6;">
        <span class="axe-icone">${a.icone}</span>
        <div>
          <div class="axe-nom">${a.nom}</div>
          <div class="axe-detail">${a.raison}</div>
        </div>
        <span class="axe-statut" style="color:var(--text-dim); background:var(--panel-raised);">Non couvert (V1)</span>
      </div>`).join('');

    document.getElementById('content').innerHTML = `
      <div class="chapitre">
        <div class="chapitre-titre">Chapitre 1 — Synthèse dirigeant</div>
        <div class="synthese-texte">${c1.syntheseTexte}</div>
        <div class="kpi-card">
          <div class="kpi-row">
            <span class="kpi-label">CA de la période ${c1.ca.disponible ? badgeConfiance(c1.ca.confiance) : ''}</span>
            <span><span class="kpi-valeur">${c1.ca.disponible ? NexusRapportMoteur.formaterEuros(c1.ca.valeur) : '—'}</span>${ligneEvolutionHTML(c1.evolutionCa)}</span>
          </div>
          <div class="kpi-row">
            <span class="kpi-label">Marge de la période ${c1.marge.disponible ? badgeConfiance(c1.marge.confiance) : ''}</span>
            <span><span class="kpi-valeur">${c1.marge.disponible && c1.marge.tauxPct != null ? c1.marge.tauxPct.toFixed(1) + ' %' : '—'}</span>${c1.evolutionMargeTaux != null ? `<span class="kpi-evol ${c1.evolutionMargeTaux > 0.5 ? 'hausse' : c1.evolutionMargeTaux < -0.5 ? 'baisse' : 'stable'}">${c1.evolutionMargeTaux >= 0 ? '+' : ''}${c1.evolutionMargeTaux.toFixed(1)} pt</span>` : ''}</span>
          </div>
          <div class="kpi-row">
            <span class="kpi-label">Décisions sur la période</span>
            <span class="kpi-valeur">${c1.nbDecisions}${c1.impactDecisions ? ` (${NexusRapportMoteur.formaterEuros(c1.impactDecisions)})` : ''}</span>
          </div>
        </div>
        <div class="chapitre-note">Décisions prises pendant la période (journal NEXUS) :</div>
        <div class="kpi-card">${decisionsHTML}</div>
      </div>

      <div class="chapitre">
        <div class="chapitre-titre">Chapitre 2 — Santé de l'entreprise</div>
        <div class="chapitre-note">Direction de chaque secteur sur la période, comparée à sa référence — Commerce, Marge, Carburants et FDJ sont scopés par période calendaire. Opérations et Équipe listés ci-dessous par transparence, non calculés dans ce chapitre (aucun scoping par période calendaire fiable de l'écart de caisse ou des pointages).</div>
        ${axesHTML}
        ${axesNonCouvertsHTML}
      </div>
    `;
  }

  // ------------------------------------------------------------
  // Export PDF — RAPPORT NEXUS DE DIRECTION (11/08/2026), refonte demandée
  // par Frédéric : "le PDF doit devenir un véritable rapport de direction
  // [...] 8 à 20 pages selon la période et les données disponibles, sans
  // jamais remplir artificiellement." Consomme UNIQUEMENT l'objet
  // RAPPORT_DIRECTION déjà construit par NexusRapportDirectionMoteur —
  // aucun recalcul ici, seulement de la mise en page (Article 11). Chaque
  // section absente de données affiche honnêtement "Donnée insuffisante"
  // plutôt que d'être improvisée ou masquée (Article 5).
  // ------------------------------------------------------------
  const CO = () => NexusPdfMoteur.COULEUR;
  const DM = () => NexusRapportDirectionMoteur;

  function pdfEncadreInsuffisant(rapport, texte) {
    rapport.paragraphe(`Donnée insuffisante — ${texte}`, { taille: 9, couleur: CO().texteDim });
  }

  function pdfSousSection(rapport, titre) {
    rapport.sousTitre(titre.toUpperCase(), { taille: 9.5, couleur: CO().cyan });
  }

  async function genererPdf() {
    const btn = document.getElementById('btnPdf');
    btn.disabled = true;
    btn.textContent = 'Génération…';
    const R = RAPPORT_DIRECTION;
    const fmt = DM();

    const rapport = await NexusPdfMoteur.creerRapport({
      titre: `Rapport NEXUS de Direction — ${R.couverture.periodeLabel}`,
      sujet: 'Rapport NEXUS de Direction',
      entete: { app: 'NEXUS OS · Rapport de Direction', sousTitre: R.couverture.periodeLabel },
    });

    // ---- 1. Page de couverture ----
    rapport.pageDeGarde({
      nomEntreprise: R.couverture.nomEntreprise,
      periodeBornes: R.couverture.periodeLabel + ' · ' + R.couverture.periodeBornes,
      mentionBas: `Généré le ${R.couverture.genereLe.toLocaleDateString('fr-FR')}${MANAGER_COURANT && MANAGER_COURANT.nom ? ' par ' + MANAGER_COURANT.nom : ''}.`,
    });
    rapport._nouvellePage();

    // ---- 2. Synthèse exécutive ----
    rapport.sectionTitre('Synthèse exécutive');
    rapport.sousTitre('ÉTAT GÉNÉRAL', { taille: 9.5, couleur: CO().cyan });
    rapport.paragraphe(R.syntheseExecutive.etatGeneral, { taille: 11, couleur: CO().texte });
    rapport.paragraphe(R.syntheseExecutive.phraseDirecteur);
    pdfSousSection(rapport, 'Les 3 choses à retenir');
    if (R.syntheseExecutive.troisChoses.length) {
      R.syntheseExecutive.troisChoses.forEach((c, i) => rapport.paragraphe(`${i + 1}. ${c.titre} — ${c.detail}`, { taille: 9.5 }));
    } else {
      pdfEncadreInsuffisant(rapport, 'pas assez de mesures sur cette période pour dégager 3 points.');
    }
    pdfSousSection(rapport, '3 décisions dirigeant');
    if (R.syntheseExecutive.troisDecisions.length) {
      R.syntheseExecutive.troisDecisions.forEach((d, i) => rapport.paragraphe(`${i + 1}. ${d.texte}`, { taille: 9.5 }));
    } else {
      pdfEncadreInsuffisant(rapport, 'aucune décision stratégique enregistrée sur cette période.');
    }

    // ---- 3. Tableau de bord économique ----
    rapport._nouvellePage();
    rapport.sectionTitre('Tableau de bord économique');
    const tb = R.tableauDeBord;
    pdfSousSection(rapport, 'Commerce');
    rapport.ligneCle('CA période', fmt.fmtEuros(tb.commerce.ca));
    rapport.ligneCle('Évolution', fmt.fmtPct(tb.commerce.evolution));
    rapport.ligneCle('Marge %', tb.commerce.marge_pct != null ? tb.commerce.marge_pct.toFixed(1) + ' %' : '—');
    rapport.ligneCle('Évolution marge', fmt.fmtPts(tb.commerce.evolutionMarge));
    pdfSousSection(rapport, 'FDJ');
    if (tb.fdj.disponible !== false) {
      rapport.ligneCle('CA FDJ', fmt.fmtEuros(tb.fdj.ca));
      rapport.ligneCle('Évolution', fmt.fmtPct(tb.fdj.evolution));
    } else pdfEncadreInsuffisant(rapport, 'aucun quart FDJ contrôlé sur cette période.');
    pdfSousSection(rapport, 'Carburants (litrage)');
    if (tb.carburants.disponible !== false && tb.carburants.mix) {
      NexusCarburantMoteur.CLES_CARBURANT.forEach(c => {
        if (tb.carburants.mix[c] != null) rapport.ligneCle(NexusCarburantMoteur.NOM_CARBURANT_COURT[c], fmt.fmtL(tb.carburants.mix[c].litres));
      });
      rapport.ligneCle('Total', fmt.fmtL(tb.carburants.total));
      rapport.ligneCle('Évolution', fmt.fmtPct(tb.carburants.evolution));
    } else pdfEncadreInsuffisant(rapport, 'aucune vente carburant sur cette période.');
    pdfSousSection(rapport, 'Opérations');
    if (tb.operations.disponible !== false) {
      rapport.ligneCle('Contrôles caisse', String(tb.operations.nbControles));
      rapport.ligneCle('Taux conforme', tb.operations.tauxConforme != null ? (tb.operations.tauxConforme * 100).toFixed(0) + ' %' : '—');
      rapport.ligneCle('Anomalies', String(tb.operations.nbAnomalies));
    } else pdfEncadreInsuffisant(rapport, 'aucun contrôle caisse sur cette période.');
    if (tb.operationsInventaire.disponible !== false) {
      rapport.ligneCle('Inventaires (comptages)', String(tb.operationsInventaire.totalCounts));
      rapport.ligneCle('Écarts ouverts', String(tb.operationsInventaire.openDiscrepancies));
    }
    pdfSousSection(rapport, 'Équipe');
    if (tb.equipe.disponible !== false) {
      rapport.ligneCle('Collaborateurs actifs', String(tb.equipe.collaborateursActifs));
      rapport.ligneCle('Ponctualité', tb.equipe.tauxPonctualite != null ? (tb.equipe.tauxPonctualite * 100).toFixed(0) + ' %' : '—');
      rapport.ligneCle('Missions réalisées', `${tb.equipe.tauxMissions != null ? (tb.equipe.tauxMissions * 100).toFixed(0) + ' %' : '—'}`);
    } else pdfEncadreInsuffisant(rapport, 'aucun pointage ni mission sur cette période.');

    // ---- 4. Trajectoire ----
    rapport._nouvellePage();
    rapport.sectionTitre("Trajectoire de l'entreprise");
    if (R.trajectoire.disponible) {
      rapport.tableau(
        [{ label: 'Mois', cle: 'label', largeur: 0.4 }, { label: 'CA', cle: 'ca', largeur: 0.3, align: 'droite' }, { label: 'Marge', cle: 'marge', largeur: 0.3, align: 'droite' }],
        R.trajectoire.mois.map(m => ({ label: m.label, ca: fmt.fmtEuros(m.ca), marge: fmt.fmtEuros(m.marge) })),
      );
      rapport.ligneCle('Évolution vs mois précédent', fmt.fmtPct(R.trajectoire.evolutionMoisPrecedent));
      rapport.ligneCle('Évolution vs moyenne récente', fmt.fmtPct(R.trajectoire.evolutionVsMoyenne3Mois));
      rapport.ligneCle('Évolution vs même mois N-1', R.trajectoire.disponibleN1 ? fmt.fmtPct(R.trajectoire.evolutionN1) : 'Donnée insuffisante');
      rapport.paragraphe(R.trajectoire.commentaire);
      if (R.trajectoire.blocsPartiels) rapport.paragraphe(R.trajectoire.methodeNote, { taille: 8, couleur: CO().texteDim });
    } else {
      pdfEncadreInsuffisant(rapport, R.trajectoire.raison);
    }

    // ---- 5-6. Commerce + Produits ----
    rapport._nouvellePage();
    rapport.sectionTitre('Commerce');
    if (R.commerce.disponible) {
      rapport.paragraphe(`Période affichée : ${R.commerce.periodeAffichage.debut} → ${R.commerce.periodeAffichage.fin}${R.commerce.periodeEnCours ? ' (en cours)' : ''}.`, { taille: 8.5, couleur: CO().texteDim });
      rapport.ligneCle('CA total', fmt.fmtEuros(R.commerce.ca_total));
      rapport.ligneCle('Marge totale', fmt.fmtEuros(R.commerce.marge_total));
      if (R.commerce.phraseContribution) rapport.paragraphe(R.commerce.phraseContribution);
      rapport.tableau(
        [{ label: 'Catégorie', cle: 'nom', largeur: 0.32 }, { label: 'CA', cle: 'ca', largeur: 0.22, align: 'droite' }, { label: 'Part CA', cle: 'part', largeur: 0.16, align: 'droite' }, { label: 'Évolution', cle: 'evol', largeur: 0.15, align: 'droite' }, { label: 'Marge %', cle: 'marge', largeur: 0.15, align: 'droite' }],
        R.commerce.categories.slice(0, 15).map(c => ({
          nom: c.nom, ca: fmt.fmtEuros(c.ca_total), part: c.part_du_ca != null ? (c.part_du_ca * 100).toFixed(0) + ' %' : '—',
          evol: fmt.fmtPct(c.evolution_ca), marge: (c.marge_pct_moyenne * 100).toFixed(0) + ' %',
        })),
      );
    } else pdfEncadreInsuffisant(rapport, R.commerce.raison);

    rapport.sectionTitre('Produits moteurs et à potentiel');
    if (R.produitsMoteurs.disponible) {
      pdfSousSection(rapport, 'Produits moteurs');
      rapport.paragraphe(`Ces ${R.produitsMoteurs.produitsMoteurs.length} références représentent ${R.produitsMoteurs.partMoteurs != null ? (R.produitsMoteurs.partMoteurs * 100).toFixed(0) + ' %' : '—'} du CA boutique.`, { taille: 9.5 });
      R.produitsMoteurs.produitsMoteurs.forEach(p => rapport.paragraphe(`• ${p.article} (${p.categorie}) — ${fmt.fmtEuros(p.ca)}`, { taille: 9 }));
      pdfSousSection(rapport, 'Produits à potentiel');
      if (R.produitsMoteurs.produitsPotentiel.length) {
        R.produitsMoteurs.produitsPotentiel.forEach(p => rapport.paragraphe(`• ${p.article} (${p.categorie}) — marge ${(p.marge_pct * 100).toFixed(0)} %`, { taille: 9 }));
        rapport.paragraphe(R.produitsMoteurs.heuristiquePotentielNote, { taille: 8, couleur: CO().texteDim });
      } else pdfEncadreInsuffisant(rapport, 'aucun produit ne ressort de cette lecture sur la période.');
    } else pdfEncadreInsuffisant(rapport, 'catégories Commerce indisponibles.');

    // ---- 7. Marge ----
    rapport._nouvellePage();
    rapport.sectionTitre('Marge');
    if (R.marge.disponible) {
      const cl = R.marge.classement;
      rapport.ligneCle('Marge moyenne pondérée du magasin', (cl.margeMoyennePonderee * 100).toFixed(1) + ' %');
      pdfSousSection(rapport, 'Catégories moteurs de marge');
      rapport.paragraphe(cl.moteurs.length ? cl.moteurs.map(m => m.nom).join(', ') : 'Aucune catégorie nettement au-dessus de la moyenne.', { taille: 9.5 });
      pdfSousSection(rapport, 'Catégories neutres');
      rapport.paragraphe(cl.neutres.length ? cl.neutres.map(m => m.nom).join(', ') : '—', { taille: 9.5 });
      pdfSousSection(rapport, 'Catégories qui détruisent de la marge');
      rapport.paragraphe(cl.destructeurs.length ? cl.destructeurs.map(m => m.nom).join(', ') : 'Aucune.', { taille: 9.5 });
      pdfSousSection(rapport, 'Explication de la variation');
      pdfEncadreInsuffisant(rapport, R.marge.decompositionNote);
    } else pdfEncadreInsuffisant(rapport, 'catégories Commerce indisponibles.');

    // ---- 8. Carburants ----
    rapport._nouvellePage();
    rapport.sectionTitre('Carburants');
    if (R.carburants.disponible) {
      pdfSousSection(rapport, 'Mix carburants');
      NexusCarburantMoteur.CLES_CARBURANT.forEach(c => {
        if (R.carburants.mix[c] != null) rapport.ligneCle(NexusCarburantMoteur.NOM_CARBURANT_COURT[c], `${fmt.fmtL(R.carburants.mix[c].litres)} (${(R.carburants.mix[c].pct * 100).toFixed(0)} %)`);
      });
      if (R.carburants.moteurEvolution) {
        rapport.paragraphe(`Moteur de l'évolution : ${NexusCarburantMoteur.NOM_CARBURANT_COURT[R.carburants.moteurEvolution.cle]} (${R.carburants.moteurEvolution.delta >= 0 ? '+' : ''}${Math.round(R.carburants.moteurEvolution.delta).toLocaleString('fr-FR')} L).`, { taille: 9.5 });
      }
      if (R.carburants.couvertureIncertaine) rapport.paragraphe('Couverture partielle des quarts sur cette période — volume indicatif.', { taille: 8, couleur: CO().ambre });
      pdfSousSection(rapport, 'Stock et livraisons');
      pdfEncadreInsuffisant(rapport, R.carburants.stockNote);
      pdfSousSection(rapport, 'Économie carburant');
      if (R.carburants.economieDisponible) {
        rapport.paragraphe(`${NexusCarburantMoteur.NOM_CARBURANT_COURT[R.carburants.economieCle]} — ${NexusCarburantMoteur.libelleEffetPrixStockHerite(R.carburants.economieEffet)}`, { taille: 9.5 });
      } else {
        pdfEncadreInsuffisant(rapport, R.carburants.economieNote);
      }
    } else pdfEncadreInsuffisant(rapport, R.carburants.raison);

    // ---- 9. FDJ ----
    rapport._nouvellePage();
    rapport.sectionTitre('FDJ');
    if (R.fdj.disponible) {
      rapport.ligneCle('CA FDJ', fmt.fmtEuros(R.fdj.caActuel));
      rapport.ligneCle('Évolution', fmt.fmtPct(R.fdj.evolution));
      pdfSousSection(rapport, 'Jeux moteurs (Top 5)');
      if (R.fdj.jeuxTop.length) rapport.tableau(
        [{ label: 'Jeu', cle: 'nom', largeur: 0.6 }, { label: 'CA', cle: 'ca', largeur: 0.4, align: 'droite' }],
        R.fdj.jeuxTop.map(j => ({ nom: j.nom, ca: fmt.fmtEuros(j.ca) })),
      ); else pdfEncadreInsuffisant(rapport, 'aucun détail par jeu sur cette période.');
      rapport.paragraphe(R.fdj.lectureNexus, { taille: 9.5 });
    } else pdfEncadreInsuffisant(rapport, R.fdj.raison);

    // ---- 10. Opérations ----
    rapport._nouvellePage();
    rapport.sectionTitre('Opérations');
    pdfSousSection(rapport, 'Piste (contrôles caisse)');
    if (R.operations.piste.disponible !== false) {
      rapport.ligneCle('Contrôles', String(R.operations.piste.total));
      rapport.ligneCle('Taux conforme', R.operations.piste.tauxConforme != null ? (R.operations.piste.tauxConforme * 100).toFixed(0) + ' %' : '—');
      rapport.ligneCle('Écart cumulé', fmt.fmtEuros(R.operations.piste.ecartCumule));
      rapport.ligneCle('Composante la plus touchée', R.operations.piste.composantePlusTouchee || '—');
    } else pdfEncadreInsuffisant(rapport, 'aucun contrôle caisse sur cette période.');
    pdfSousSection(rapport, 'Boutique (inventaire)');
    if (R.operations.boutique.disponible !== false) {
      rapport.ligneCle('Comptages', String(R.operations.boutique.totalCounts));
      rapport.ligneCle('Écarts détectés', String(R.operations.boutique.totalDiscrepancies));
      rapport.ligneCle('Écarts ouverts', String(R.operations.boutique.openDiscrepancies));
      rapport.ligneCle('Démarque potentielle estimée', fmt.fmtEuros(R.operations.boutique.estimatedValue));
    } else pdfEncadreInsuffisant(rapport, 'aucune synthèse inventaire sur cette période.');
    rapport.paragraphe(R.operations.syntheseTexte, { taille: 9.5 });

    // ---- 11. Équipe ----
    rapport._nouvellePage();
    rapport.sectionTitre('Équipe');
    if (R.equipe.disponible) {
      pdfSousSection(rapport, 'Fiabilité collective');
      rapport.ligneCle('Collaborateurs actifs', String(R.equipe.collaborateursActifs));
      rapport.ligneCle('Ponctualité', R.equipe.tauxPonctualite != null ? (R.equipe.tauxPonctualite * 100).toFixed(0) + ' %' : '—');
      rapport.ligneCle('Missions réalisées', `${R.equipe.nbMissionsTerminees} / ${R.equipe.nbMissions}`);
      rapport.ligneCle('Conformité caisse', R.equipe.tauxConformeCaisse != null ? (R.equipe.tauxConformeCaisse * 100).toFixed(0) + ' %' : '—');
      pdfSousSection(rapport, 'Progression');
      pdfEncadreInsuffisant(rapport, R.equipe.progressionNote);
      pdfSousSection(rapport, 'Axes de formation');
      rapport.paragraphe(R.equipe.axeFormation || 'Aucun axe de formation prioritaire identifié sur cette période.', { taille: 9.5 });
      if (R.equipe.recommandationManageriale) {
        pdfSousSection(rapport, 'Recommandation managériale');
        rapport.paragraphe(R.equipe.recommandationManageriale, { taille: 9.5 });
      }
    } else pdfEncadreInsuffisant(rapport, R.equipe.raison);

    // ---- 12. Risques et contrôle interne ----
    rapport._nouvellePage();
    rapport.sectionTitre('Risques et contrôle interne');
    // Restructuré le 12/08/2026 (cadrage développeur de Frédéric, Phase 1) :
    // "Risques & vigilances" est désormais LA SEULE sous-section à utiliser
    // le mot "risque" dans ce chapitre, exclusivement issue de
    // `signauxQualifies` (NexusRisques — comparaison à SA PROPRE référence
    // historique, confirmée dans le temps). "Constats sectoriels" (ex-
    // "Autres constats de la période") est purement descriptif — plus de
    // colonnes Impact/Urgence empruntant un vocabulaire de risque à des
    // seuils instantanés/comparaisons de pairs qui n'ont pas la preuve de
    // récurrence exigée par NEXUS pour parler de risque. Les deux
    // continuent de se compléter, sans jamais se substituer l'une à
    // l'autre (voir Data Dictionary v2.49/v2.51).
    pdfSousSection(rapport, 'Risques & vigilances');
    if (R.risques.signauxQualifies && R.risques.signauxQualifies.length) {
      const resume = R.risques.resume || {};
      const partiesResume = [];
      if (resume.risqueAvere) partiesResume.push(`${resume.risqueAvere} risque${resume.risqueAvere > 1 ? 's' : ''} avéré${resume.risqueAvere > 1 ? 's' : ''}`);
      if (resume.exposition) partiesResume.push(`${resume.exposition} exposition${resume.exposition > 1 ? 's' : ''}`);
      if (resume.signalFaible) partiesResume.push(`${resume.signalFaible} signal${resume.signalFaible > 1 ? 'aux' : ''} faible${resume.signalFaible > 1 ? 's' : ''}`);
      if (partiesResume.length) rapport.encadre([{ texte: partiesResume.join(' · '), gras: true }], { couleurBordure: CO().cyan });
      R.risques.signauxQualifies.forEach(s => {
        const [entete, ...reste] = s.phrase.split('\n');
        // Cadrage risques Phase 3 (18/08/2026, tâche #232) : la liste est
        // désormais triée par urgence d'abord, gravité ensuite (fait dans
        // le moteur, `construireChapitreRisques`) — la ligne méta ci-
        // dessous affiche les 3 champs du contrat NexusRisques jusqu'ici
        // réduits à `niveau` seul dans ce chapitre : urgence, confiance de
        // la qualification, ancienneté du signal. Même contenu que la ligne
        // `.risque-meta` déjà affichée par Brief NEXUS depuis P1.3, adaptée
        // au texte brut du PDF.
        const depuis = s.depuisLe ? fmt.fmtDateFr(s.depuisLe) : null;
        // `encadre()` (nexus-pdf-moteur.js) rend chaque ligne à taille fixe
        // (9.5, pas de `taille` par ligne) — la méta est donc une ligne de
        // plus au même gabarit que le reste, jamais un style en trop qui
        // n'existerait pas réellement dans le moteur PDF partagé.
        const meta = `Urgence : ${s.urgenceLabel || '—'} · Confiance ${s.niveauConfiance || '—'}${depuis ? ` · suivi depuis le ${depuis}` : ''}`;
        rapport.encadre(
          [
            { texte: entete, gras: true },
            { texte: reste.join(' ') },
            { texte: meta },
            ...(s.actionRecommandee ? [{ texte: s.actionRecommandee }] : []),
          ],
          { couleurBordure: s.niveau === 'risque_avere' ? CO().rouge : CO().ambre },
        );
      });
      rapport.paragraphe("NEXUS compare chaque signal à sa propre référence historique et ne le qualifie de risque qu'une fois suffisamment d'éléments réunis — mémoire partagée avec Brief NEXUS et le Cockpit. Classé par urgence d'abord, gravité ensuite : une exposition immédiate peut passer avant un risque avéré déjà connu depuis longtemps.", { taille: 8, couleur: CO().texteDim });
    } else {
      pdfEncadreInsuffisant(rapport, 'aucun signal de risque confirmé sur cette période — NEXUS observe, aucune récurrence suffisante pour conclure à un risque pour l\'instant.');
    }
    pdfSousSection(rapport, 'Constats sectoriels');
    if (R.risques.constatsSectoriels.length) {
      rapport.paragraphe('Observations descriptives sur la période — un constat sectoriel n\'est pas nécessairement un risque : il peut s\'expliquer par un positionnement volontaire, une saisonnalité ou une évolution normale de l\'activité.', { taille: 8, couleur: CO().texteDim });
      rapport.tableau(
        [{ label: 'Secteur', cle: 'secteur', largeur: 0.22 }, { label: 'Constat', cle: 'libelle', largeur: 0.78 }],
        R.risques.constatsSectoriels,
      );
    } else {
      rapport.paragraphe('Aucun constat sectoriel notable sur cette période.', { taille: 9.5, couleur: CO().texteDim });
    }

    // ---- 13-14. Forces / Ce qui doit progresser ----
    rapport._nouvellePage();
    rapport.sectionTitre('Ce qui va bien');
    if (R.forces.length) {
      R.forces.forEach(f => rapport.encadre([{ texte: f.titreCourt, gras: true }, { texte: f.detail }], { couleurBordure: CO().vert }));
    } else pdfEncadreInsuffisant(rapport, 'pas assez de mesures positives distinctes sur cette période.');

    rapport._nouvellePage();
    rapport.sectionTitre('Ce qui doit progresser');
    if (R.ameliorer.length) {
      R.ameliorer.forEach(a => {
        rapport.sousTitre(a.constat, { taille: 10.5, couleur: CO().texte });
        rapport.paragraphe(`Constat : ${a.impact}`, { taille: 9 });
        rapport.paragraphe(`Cause probable : ${a.causeProbable}`, { taille: 9, couleur: CO().texteDim });
        rapport.paragraphe(`Action proposée : ${a.actionProposee}`, { taille: 9.5 });
      });
    } else rapport.paragraphe('Aucun point de vigilance majeur identifié sur cette période.', { taille: 9.5, couleur: CO().vert });

    // ---- 15. Projection économique ----
    rapport._nouvellePage();
    rapport.sectionTitre('Projection économique');
    if (R.projection.disponible) {
      rapport.bandeau(R.projection.mention, { couleur: CO().ambre });
      rapport.ligneCle('Scénario rythme actuel', fmt.fmtEuros(R.projection.rythmeActuel));
      rapport.ligneCle(`Scénario moyenne ${R.projection.nbMoisMoyenne} derniers mois`, R.projection.scenarioMoyenneNMois != null ? fmt.fmtEuros(R.projection.scenarioMoyenneNMois) : 'Donnée insuffisante');
      rapport.ligneCle('Scénario même période N-1', 'Donnée insuffisante');
    } else pdfEncadreInsuffisant(rapport, R.projection.raison);

    // ---- 16. Suggestions de développement ----
    rapport._nouvellePage();
    rapport.sectionTitre('Suggestions de développement');
    if (R.suggestions.length) {
      R.suggestions.forEach(s => {
        rapport.sousTitre(s.secteur.toUpperCase(), { taille: 9.5, couleur: CO().cyan });
        rapport.paragraphe(s.suggestion, { taille: 10 });
        rapport.paragraphe(`Pourquoi : ${s.pourquoi}`, { taille: 8.5, couleur: CO().texteDim });
        rapport.paragraphe(`Données utilisées : ${s.donneesUtilisees} · Confiance : ${s.confiance}`, { taille: 8, couleur: CO().texteDim });
        rapport.paragraphe(`Ce qui manque pour confirmer : ${s.manquePourConfirmer}`, { taille: 8, couleur: CO().texteDim });
      });
    } else pdfEncadreInsuffisant(rapport, 'aucun signal exploitable pour une suggestion sur cette période.');

    // ---- 17. Décisions prises + effets observés ----
    rapport._nouvellePage();
    rapport.sectionTitre('Décisions prises sur la période');
    if (R.decisionsChapitre.disponible) {
      rapport.tableau(
        [{ label: 'Date', cle: 'date', largeur: 0.14 }, { label: 'Décision', cle: 'decision', largeur: 0.42 }, { label: 'Secteur', cle: 'secteur', largeur: 0.2 }, { label: 'Statut', cle: 'statut', largeur: 0.24 }],
        R.decisionsChapitre.decisions.slice(0, 30),
      );
    } else pdfEncadreInsuffisant(rapport, 'aucune décision enregistrée sur cette période.');
    // Effets observés (12/08/2026, cadrage §13, lot P2.2) : jusqu'ici
    // toujours rendu comme "Donnée insuffisante" quel que soit le contenu
    // réel — desormais un vrai rendu dès que `construireDecisionsChapitre()`
    // a pu remesurer au moins une décision Marge+ (voir
    // nexus-rapport-direction-moteur.js, evaluerEffetDecisionMarge). Repli
    // inchangé (pdfEncadreInsuffisant) si aucune décision n'a encore de
    // mesure disponible.
    pdfSousSection(rapport, 'Effets observés');
    if (R.decisionsChapitre.effetsObservesDisponible) {
      R.decisionsChapitre.decisions.filter(d => d.effet && d.effet.disponible).forEach(d => {
        rapport.sousTitre(d.secteur, { taille: 9, couleur: CO().cyan });
        rapport.paragraphe(d.effet.phrase, { taille: 9 });
      });
      rapport.paragraphe(R.decisionsChapitre.effetsObservesNote, { taille: 8, couleur: CO().texteDim });
    } else {
      pdfEncadreInsuffisant(rapport, R.decisionsChapitre.effetsObservesNote);
    }

    // ---- 18. Priorités + signature ----
    rapport._nouvellePage();
    rapport.sectionTitre('Priorités de la prochaine période');
    if (R.priorites.length) {
      R.priorites.forEach(p => rapport.paragraphe(`${p.rang} — ${p.titre} : ${p.action}`, { taille: 10 }));
    } else rapport.paragraphe('Aucune priorité de direction identifiée sur cette période.', { taille: 9.5 });

    rapport.y -= 20;
    rapport.sousTitre(R.signature.accroche, { taille: 11, couleur: CO().texte });
    rapport.sousTitre(R.signature.sousAccroche, { taille: 9.5, couleur: CO().texteDim });
    rapport.paragraphe(R.signature.mentionConfiance, { taille: 7.5, couleur: CO().texteDim });

    rapport.piedDePageToutesPages('NEXUS OS · Rapport NEXUS de Direction');
    const pdfBytes = await NexusPdfMoteur.finaliser(rapport);
    const nomFichier = `NEXUS-Rapport-Direction-${CHAPITRE1.periode.debut}-${CHAPITRE1.periode.fin}.pdf`;
    await NexusPdfMoteur.partagerOuTelechargerPdf(pdfBytes, nomFichier, { titre: 'Rapport NEXUS de Direction' });

    btn.disabled = false;
    btn.textContent = 'Générer le PDF';
  }

  // ------------------------------------------------------------
  // INITIALISATION
  // ------------------------------------------------------------
  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Cet écran est réservé aux managers.</div>';
      return;
    }
    MANAGER_COURANT = employee;
    SITE_ID = employee.site_id;
    const { data: siteRow } = await nexusClient.from('sites').select('nom_entreprise').eq('site_id', SITE_ID).maybeSingle();
    NOM_ENTREPRISE = (siteRow && siteRow.nom_entreprise) || SITE_ID;

    renderBarrePeriodes();
    document.getElementById('btnLibreValider').addEventListener('click', () => {
      const debut = document.getElementById('libreDebut').value;
      const fin = document.getElementById('libreFin').value;
      if (!debut || !fin || fin < debut) { alert('Choisissez une date de début et une date de fin valides.'); return; }
      chargerEtRendre({ debut, fin });
    });
    document.getElementById('btnPdf').addEventListener('click', genererPdf);

    await chargerEtRendre();
  });
</script>
</body>
</html>
