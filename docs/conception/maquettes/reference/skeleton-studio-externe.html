<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS — Galerie Skeleton</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#080f17;color:#e3edf5}header,main{max-width:1450px;margin:auto;padding:24px}h1{font-size:28px;margin:0}p{color:#8fa5b5}button,select{font:inherit;padding:10px 15px;border:1px solid #345365;border-radius:8px;background:#142b39;color:#e3edf5;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid cyan}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}.sample{border:1px solid #284353;border-radius:16px;padding:14px;background:#101d29}.sample h2{font-size:16px;margin:0 0 12px}.screen{--bg:#0b1520;--panel:#112735;--base:#203b4b;--shine:#386578;--ink:#d8eaf4;--edge:#284858;background:var(--bg);color:var(--ink);border:1px solid var(--edge);border-radius:12px;padding:12px;min-height:320px;overflow:hidden}.day{--bg:#f4f7fa;--panel:#fff;--base:#dce6ee;--shine:#f8fcff;--ink:#203d50;--edge:#ccdbe5}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;min-width:0}.hero{height:72px;margin-bottom:10px;display:flex;align-items:center;gap:14px}.orb{width:38px;height:38px;border:2px solid var(--edge);border-top-color:#45c8d7;border-radius:12px;transform:rotate(12deg);flex:none}.lines{flex:1}.s{background:linear-gradient(105deg,var(--base) 30%,var(--shine) 49%,var(--base) 68%);background-size:240% 100%;animation:sweep 2.8s linear infinite;border-radius:5px;height:9px;margin:8px 0}.big{height:23px;width:65%}.tiles{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:7px;margin-bottom:9px}.tile{min-height:75px;padding:8px}.bottom{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}.bars{height:80px;display:flex;align-items:end;gap:5px}.bars .s{flex:1;margin:0;border-radius:4px 4px 0 0}.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--edge);padding:4px 0}.avatar{width:22px;height:22px;flex:none;border-radius:50%}.pulse .s{animation:pulse 2s ease-in-out infinite;background:var(--base)}.pulse .orb{animation:glow 2s ease-in-out infinite}.minimal .s{animation:pulse 3.5s ease-in-out infinite;background:var(--base)}.minimal .orb{border-top-color:var(--edge)}.glass .panel{box-shadow:inset 0 1px 0 #72d9ed15}.mobile{max-width:280px;margin:auto}.mobile .tiles{grid-template-columns:repeat(2,1fr)}.mobile .bottom{grid-template-columns:1fr}.loaded .s,.loaded .orb{animation:none}.loaded .s{background:none;height:auto;margin:8px 0;color:var(--ink);font-size:11px;overflow:hidden;white-space:nowrap}.loaded .big{font-size:19px;font-weight:700}.loaded .bars .s{background:#2599a9;height:var(--h);font-size:0}.loaded .avatar{background:#2599a9}.loaded .orb{background:#2599a9}.status{font-size:11px;margin:8px 0;color:#8fa5b5}@keyframes sweep{from{background-position:120% 0}to{background-position:-120% 0}}@keyframes pulse{50%{opacity:.48}}@keyframes glow{50%{box-shadow:0 0 14px #45c8d777}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.paused *{animation-play-state:paused!important}
</style><header><h1>NEXUS / Skeleton Studio</h1><p>Galerie de conception · trois signatures visuelles · données de démonstration fictives</p><div class="controls"><select id="module" aria-label="Module"><option>Brief</option><option>Paye</option><option>Produits</option><option>Carburants Performance</option><option>Accueil</option></select><button id="theme">Mode Jour</button><button id="device">Mode mobile</button><button id="play">Simuler le chargement</button><button id="pause">Suspendre les animations</button></div><div id="status" role="status">Aperçu des squelettes</div></header><main class="gallery" id="gallery"></main><script>
const $=id=>document.getElementById(id);let day=false,mobile=false,loaded=false,timer,paused=false;const configs={Brief:['Carburants','Commerce','Marge','FDJ','Opérations'],Paye:['Salariés','Heures','Variables'],Produits:['Références','Ventes','Marge'],'Carburants Performance':['SP95','Gazole','GNR'],Accueil:['Piloter','Performer','Exécuter']};const s=(w,t,cls='')=>`<div class="s ${cls}" style="width:${w}%">${loaded?t:''}</div>`;function render(){const m=$('module').value; $('gallery').innerHTML=[['glass','A — Verre et lumière'],['pulse','B — Impulsion cyan'],['minimal','C — Élégance minimaliste']].map(([c,n])=>`<section class="sample"><h2>${n}</h2><div class="screen ${c} ${day?'day':''} ${mobile?'mobile':''} ${loaded?'loaded':''}" aria-busy="${!loaded}"><div class="panel hero"><div class="orb"></div><div class="lines">${s(65,m,'big')}${s(85,'Station de démonstration')}</div></div><div class="tiles" style="--n:${configs[m].length===5?3:configs[m].length}">${configs[m].map((x,i)=>`<div class="panel tile">${s(85,x)}${s(75,['42','18','24','8','96'][i],'big')}${s(55,'Exemple')}</div>`).join('')}</div><div class="bottom"><div class="panel">${s(75,m==='Paye'?'Salariés':m==='Produits'?'Références':'Évolution')}${['Paye','Produits'].includes(m)?Array.from({length:5},(_,i)=>`<div class="row"><div class="s avatar"></div><div class="lines">${s(85,'Exemple '+(i+1))}</div>${s(25,'—')}</div>`).join(''):`<div class="bars">${[35,58,43,75,60,88,68,95].map(h=>`<div class="s" style="height:${h}%;--h:${h}%"></div>`).join('')}</div>`}</div><div class="panel">${s(90,m==='Paye'?'Fiche salarié':'Détails')}${[1,2,3,4].map(i=>s(95,'Information '+i)).join('')}</div></div></div><div class="status">${loaded?'Données fictives affichées':'Structure en attente de données'}</div></section>`).join('');} $('module').onchange=()=>{clearTimeout(timer);loaded=false;render()};$('theme').onclick=()=>{day=!day;$('theme').textContent=day?'Mode Nuit':'Mode Jour';render()};$('device').onclick=()=>{mobile=!mobile;$('device').textContent=mobile?'Mode bureau':'Mode mobile';render()};$('pause').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('pause').textContent=paused?'Reprendre les animations':'Suspendre les animations'};$('play').onclick=()=>{clearTimeout(timer);loaded=false;render();$('status').textContent='Chargement simulé…';timer=setTimeout(()=>{loaded=true;render();$('status').textContent='Chargement terminé — données fictives'},1800)};render();</script></html>
