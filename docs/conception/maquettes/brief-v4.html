<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquette Brief v4</title>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--line:#d9d3c5;--text:#1f1d19;--mid:#5f5a4d;--accent:#0b6e4f;--warn:#8f5200;--bad:#a3261f;--ok:#0b6e4f;--grey:#8a8578}
:root[data-theme=nuit]{--bg:#0b0f14;--panel:#151b23;--line:#2b3440;--text:#ecebe6;--mid:#a3a79f;--accent:#4fc79a;--warn:#e0a24a;--bad:#f07a72;--ok:#4fc79a;--grey:#7d838c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "IBM Plex Sans",system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px}p.n{color:var(--mid);margin:0 0 8px}
.bar{display:flex;gap:8px;margin-bottom:12px}.bar button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.cadre{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:auto;margin-bottom:16px;padding:16px}
.m375{width:375px;height:812px}.m1280{width:1280px;max-width:100%}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.entete{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.entete b{font-size:18px}.fiab{color:var(--mid);font-size:13px}
.carte{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.carte h3{margin:0 0 6px;font-size:13px;color:var(--mid);font-weight:500}
.gros{font-size:28px;font-weight:600}.date{font-size:12px;color:var(--mid)}
.haut{display:grid;gap:12px;grid-template-columns:1fr}.m1280 .haut{grid-template-columns:320px 1fr}
.trois{display:grid;gap:12px;grid-template-columns:1fr}.m1280 .trois{grid-template-columns:repeat(3,1fr)}
.grille{display:grid;gap:12px;grid-template-columns:1fr;margin:12px 0}.m1280 .grille{grid-template-columns:repeat(4,1fr)}
.sect .note{font-size:24px;font-weight:600}.pastille{display:inline-block;font-size:12px;border:1px solid currentColor;border-radius:8px;padding:1px 8px}
.ok{color:var(--ok)}.av{color:var(--warn)}.mal{color:var(--bad)}
.gris{border-style:dashed}.gris .note{color:var(--grey)}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--accent);font:inherit;margin-top:8px}
.prio{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
.prio:last-child{border:0}.prio .p{color:var(--mid);font-size:13px}
svg.c{width:100%;height:70px;display:block}svg.c path{fill:none;stroke:var(--accent);stroke-width:2}
.tend{width:80px;height:24px}
.legende{font-size:12px;color:var(--mid)}
.obj{grid-column:1/-1;font-size:12px;color:var(--accent)}
.objg{display:grid;gap:12px;grid-template-columns:1fr;margin-top:12px}.m1280 .objg{grid-template-columns:repeat(3,1fr)}
.barre{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}.barre i{display:block;height:100%;background:var(--accent)}
.prop{font-size:12px;color:var(--warn)}
</style></head><body>
<h1>Brief v4 (maquette, données fictives)</h1>
<p class="n">Aucune donnée réelle. Le bouton Jour / Nuit change les jetons. Le secteur Équipe n'existe plus ; Marge est un indicateur daté (taux réel contre cible), absent du graphique, non mesuré faute d'objectif saisi ; 4 secteurs sur 5 sont mesurés.</p>
<div class="bar"><button onclick="document.documentElement.dataset.theme='jour'">Jour</button><button onclick="document.documentElement.dataset.theme='nuit'">Nuit</button></div>

<!--GABARIT-->
<h2>1280</h2>
<div class="cadre m1280" id="d"></div>
<h2>375</h2>
<div class="cadre m375" id="m"></div>

<template id="t">
 <div class="entete"><b>Brief du jour · 26/11</b><span class="fiab mono">4 secteurs mesurés sur 5 · Carburant 26/11 · Commerce 14/11 · FDJ 25/11 · Opérations 25/11 · Marge non mesurée</span></div>
 <div class="haut">
  <div class="carte"><h3>État global</h3><div class="gros mono">56 / 100</div><span class="pastille av">À confirmer</span><div class="date">4 secteurs sur 5 · le plus ancien : 14/11</div></div>
  <div class="trois">
   <div class="carte"><h3>Volumes carburant</h3><div class="gros mono">12 400 L</div><div class="date">jour 26/11</div></div>
   <div class="carte"><h3>Chiffre boutique</h3><div class="gros mono">3 150 €</div><div class="date">dernier quart audité, 25/11</div></div>
   <div class="carte gris"><h3>Marge réelle</h3><div class="gros mono" style="color:var(--grey)">non mesurée</div><div class="date">taux réel de la période : non mesuré · cible à définir dans Produits</div><button class="btn">Définir l'objectif</button></div>
  </div>
 </div>
 <div class="grille">
  <div class="carte sect"><h3>Carburant</h3><div class="note mono">62</div><span class="pastille ok">Sous contrôle</span><svg class="tend" viewBox="0 0 80 24"><path d="M0 18 L20 14 L40 16 L60 9 L80 8" fill="none" stroke="currentColor" stroke-width="2"/></svg><div class="date">jour 26/11</div><button class="btn">Détails</button></div>
  <div class="carte sect"><h3>Commerce</h3><div class="note mono">48</div><span class="pastille av">À relancer</span><svg class="tend" viewBox="0 0 80 24"><path d="M0 8 L20 10 L40 12 L60 16 L80 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><div class="date">données du 14/11 · import à refaire</div><button class="btn">Détails</button></div>
  <div class="carte sect"><h3>FDJ</h3><div class="note mono">55</div><span class="pastille av">À confirmer</span><svg class="tend" viewBox="0 0 80 24"><path d="M0 14 L20 12 L40 14 L60 13 L80 12" fill="none" stroke="currentColor" stroke-width="2"/></svg><div class="date">7 jours jusqu'au 25/11</div><button class="btn">Détails</button></div>
  <div class="carte sect"><h3>Opérations</h3><div class="note mono">60</div><span class="pastille ok">Sous contrôle</span><div class="date">écarts de caisse : somme des valeurs absolues par quart, 25/11</div><button class="btn">Détails</button></div>
  <div class="carte sect gris"><h3>Marge</h3><div class="note mono">non mesurée</div><div class="date">aucun objectif saisi dans Produits. Neutre, non pénalisée.</div><button class="btn">Définir l'objectif</button></div>
 </div>
 <div class="carte"><h3>Mes priorités du jour</h3>
  <div class="prio"><b>Vérifier le stock de la cuve 2</b><span class="pastille av">Aujourd'hui</span><span class="p">2 jours de stock restant</span><span class="obj">sert l'objectif : volumes du mois</span></div>
  <div class="prio"><b>Relancer l'import des ventes</b><span class="pastille av">Cette semaine</span><span class="p">dernier import il y a 12 jours</span><span class="obj">sert l'objectif : marge du trimestre</span></div>
  <div class="prio"><b>Contrôler l'écart de caisse du quart de nuit</b><span class="pastille mal">À corriger</span><span class="p mono">écart 18 €</span><span class="obj">sans objectif lié</span></div>
 </div>
 <div class="carte" style="margin-top:12px"><h3>Objectifs et potentiel · où je vais, ce qui me sépare de l'objectif</h3>
  <div class="objg">
   <div><b>Court terme · mois</b><div>Volumes carburant</div><div class="mono">358 000 L / 400 000 L</div><div class="barre"><i style="width:89%"></i></div><div class="date">écart 42 000 L (10,5 %) · en baisse · pas atteint à ce rythme · au 26/11</div></div>
   <div><b>Moyen terme · trimestre</b><div>Ventes boutique</div><div class="mono">8 900 € / 12 000 €</div><div class="barre"><i style="width:74%"></i></div><div class="date">écart 3 100 € · stable · trop tôt pour dire · au 25/11</div></div>
   <div><b>Long terme · année</b><div>Chiffre FDJ</div><div class="mono gris" style="color:var(--grey)">objectif non défini</div><div class="prop">Proposition de NEXUS : 36 000 € (moyenne des mois passés), à valider</div><button class="btn">Définir l'objectif</button></div>
  </div>
  <h3 style="margin-top:12px">Potentiel déjà mesuré, par nature</h3>
  <div class="prio"><b>Marge à récupérer</b><span class="mono">640 €</span><span class="p">Marge+ et Scanner tarifaire · mesuré le 14/11</span></div>
  <div class="prio"><b>Pertes évitables</b><span class="mono">210 €</span><span class="p">écarts de caisse · mesuré le 25/11</span></div>
  <div class="prio"><b>Carburant à commander</b><span class="mono">15 000 L</span><span class="p">moteur de commande · mesuré le 26/11</span></div>
  <div class="legende">Trois natures, trois chiffres : jamais additionnés.</div>
 </div>
 <div class="carte" style="margin-top:12px"><h3>Évolution sur 40 jours</h3>
  <div class="legende">Volumes carburant (L)</div><svg class="c" viewBox="0 0 400 70"><path d="M0 50 L60 40 L120 45 L180 30 L240 35 L300 22 L400 26"/></svg>
  <div class="legende">Ventes boutique (€)</div><svg class="c" viewBox="0 0 400 70"><path d="M0 30 L60 34 L120 28 L180 40 L240 38 L300 44 L400 36"/></svg>
  <div class="legende">Chiffre FDJ (€)</div><svg class="c" viewBox="0 0 400 70"><path d="M0 40 L60 38 L120 42 L180 36 L240 40 L300 38 L400 41"/></svg>
  <button class="btn">Afficher les valeurs</button>
 </div>
 <div style="margin-top:12px"><button class="btn">Ouvrir le rapport A4</button></div>
</template>
<script>
const t=document.getElementById('t').innerHTML;
document.getElementById('d').innerHTML=t;document.getElementById('m').innerHTML=t;
</script>
</body></html>
