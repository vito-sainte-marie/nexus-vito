<!doctype html><html lang="fr" data-theme="nuit"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objectifs de station : bureau de gestion</title><style>

.bandeau2{display:flex;align-items:center;gap:16px;background:#07131E;color:#fff;border-radius:12px;padding:20px 28px}.bandeau2 img{width:56px;height:56px;object-fit:contain}.bandeau2 h1{margin:0;font:600 30px/1 var(--t-sans)}.bandeau2 p{margin:4px 0 0;color:#9AA8B6}

.an{display:grid;grid-template-columns:1.15fr 2fr;gap:24px}

.mois button i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--piste);opacity:.7}
.mois button[aria-pressed=true] i{opacity:1;outline:2px solid var(--t-cyan)}
.mois button:focus-visible{outline:2px solid var(--t-cyan)}
.trim{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.trim div{background:var(--t-raised);border-radius:8px;padding:10px;font-size:12px;color:var(--t-mid)}.trim b{display:block;color:var(--t-text);font:600 16px var(--t-mono)}
.ajust{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--t-line);background:var(--t-panel);color:var(--t-text);font:600 14px var(--t-sans);cursor:pointer}.btn.p{background:var(--t-cyan);color:#07131E;border-color:var(--t-cyan)}
.btn.s{min-height:44px;min-width:44px;padding:0}
.obj{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--t-line);font-size:13px}
.obj:first-of-type{border-top:0}
.obj .l small{display:block;color:var(--t-mid);font-size:12px}
.obj .v{font:600 15px var(--t-mono)}.obj .v small{display:block;font:11px var(--t-sans);color:var(--t-mid);font-weight:400}
.obj .jauge{margin-top:6px}
.entete{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:12px;font-size:11px;color:var(--t-mid);text-transform:uppercase;letter-spacing:.06em;padding-bottom:6px}
table.val{width:100%;border-collapse:collapse;font-size:12px}table.val th,table.val td{text-align:right;padding:6px 8px;border-top:1px solid var(--t-line)}table.val th:first-child,table.val td:first-child{text-align:left}
.sec h3{margin-bottom:6px}

</style></head><body>
<div class="hors"><span>Maquette bureau 1280 · valeurs fictives, aucune donnée réelle.</span>
 <button type="button" data-th="jour" aria-pressed="false">Jour</button><button type="button" data-th="nuit" aria-pressed="true">Nuit</button></div>
<main class="page" id="p"></main>
<script>
const IC='../../../assets/icones/';
const v2=id=>`<img class="ico" alt="" src="${IC}v2/${id}/${id}-24.svg">`;
const fr=(n,d=0)=>n.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
/* Données fictives : litres de carburant, base des 4 mois d'historique */
const BASE=[352000,336000,361000,371000]; /* 4 mois */
const JOURS=[31,28,31,30,31,30,31,31,30,31,30,31]; /* 2027 : 365 jours */
const SAIS=[.94,.93,.99,1,1.02,1.06,1.1,1.1,1.03,1,.97,.99]; /* exemple fictif de profil saisonnier : n'existe pas avec 4 mois d'historique */
let mode='jours';
let hyp=3, sel=null, ajust=Array(12).fill(0), valide=false;
const moyBase=()=>BASE.reduce((a,b)=>a+b,0)/BASE.length;
const annuel=()=>Math.round(moyBase()*12*(1+hyp/100)/1000)*1000;
const prop=()=>{const a=annuel();if(mode==='jours')return JOURS.map(j=>Math.round(a*j/365/1000)*1000);const t=SAIS.reduce((x,y)=>x+y,0);return SAIS.map(q=>Math.round(a*q/t/1000)*1000)};
const mois=()=>prop().map((v,i)=>v+ajust[i]*1000);
const M=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function annee(){const m=mois(),tot=m.reduce((a,b)=>a+b,0),mx=Math.max(...m);
 const tr=[0,1,2,3].map(q=>m.slice(q*3,q*3+3).reduce((a,b)=>a+b,0));
 return `<div class="carte an"><div>
  <h3>${v2('mod-carburants')}Objectif de l’année 2027 · litres de carburant</h3>
  <div class="champ"><label for="hy">Hausse visée sur la dernière année connue (%)</label><input id="hy" inputmode="decimal" value="${hyp}" aria-describedby="bs"></div>
  <div class="base" id="bs">Base NEXUS : <b>${fr(moyBase()*12)} L</b> par an, calculée sur le rythme moyen des 4 mois d’historique.<br><span class="limite">Avec 4 mois d’historique, aucune saison n’est supposée.</span></div>
  <div style="margin-top:14px;font-size:12px;color:var(--t-mid)">Objectif proposé pour l’année</div><div class="mono" style="font:600 32px var(--t-mono)">${fr(tot)} <span class="unite">L</span></div>
  </div><div>
  <div style="font-size:12px;color:var(--t-mid)">Répartition proposée sur 12 mois — touchez un mois pour l’ajuster</div>
  <div class="aide" style="margin:4px 0 6px"><b>${mode==='jours'?'Répartition proportionnelle au nombre de jours de chaque mois.':'Profil saisonnier proposé.'}</b> ${mode==='jours'?'Janvier compte 31 jours, février 28 : chacun reçoit sa part.':'Source : exemple fictif, il faudrait au moins 12 mois d’historique réel pour l’établir.'} <button type="button" class="lien" id="mode">${mode==='jours'?'Voir le profil saisonnier':'Revenir au prorata des jours'}</button></div>
  <div class="mois" role="group" aria-label="Litres visés par mois">${m.map((v,i)=>`<button type="button" data-i="${i}" aria-pressed="${sel===i}" aria-label="${M[i]} : ${fr(v)} litres"><span>${fr(v/1000)}</span><i style="height:${Math.round(v/mx*120)}px"></i>${M[i]}</button>`).join('')}</div>
  <div class="trim">${tr.map((v,q)=>`<div>T${q+1}<b>${fr(v)} L</b>somme de ses trois mois</div>`).join('')}</div>
  <div class="ajust">${sel!==null?`<span>${M[sel]} :</span><button class="btn s" data-d="-5" aria-label="Retirer 5 000 litres">−</button><button class="btn s" data-d="5" aria-label="Ajouter 5 000 litres">+</button><span class="mono">${fr(m[sel])} L</span>`:'<span class="aide">Aucun mois sélectionné.</span>'}
   <button class="btn p" id="val" style="margin-left:auto">${valide?'Objectifs validés ✓':'Valider les 12 mois et l’année'}</button></div>
  <div class="aide" style="margin-top:8px" role="status">${valide?'Validé par le gérant. Les mois, trimestres et l’année sont enregistrés ensemble.':'Rien n’est enregistré tant que vous n’avez pas validé.'}</div>
 </div></div>`}
const jmarque=(mn,mx,pos,obj,zone,c,lab)=>{const P=v=>((v-mn)/(mx-mn)*100).toFixed(1),z=zone==='haut'?`left:${P(obj)}%;width:${(100-P(obj)).toFixed(1)}%`:`left:0;width:${P(obj)}%`;return `<div class="jm" role="img" aria-label="${lab}" style="--c:var(--${c})"><i class="zone" style="${z}"></i><b class="cible" style="left:${P(obj)}%"></b><u class="pos" style="left:${P(pos)}%"></u></div>`};
const ligne=(l,sub,val,cib,pa,att,ec,te,c)=>`<div class="obj"><div class="l"><b>${l}</b><small>${sub}</small></div><div class="v">${val}<small>valeur à ce jour</small></div><div class="v">${cib}<small>objectif</small>${typeof pa==='string'?pa:`<div class="jauge" style="--c:var(--${c||'t-cyan'})"><i style="--p:${pa}"></i></div>`}</div><div class="v">${att}<small>attendu à cette date</small></div><div class="v ${ec[1]}">${ec[0]}<small>écart</small></div><div class="v">${te}<small>tendance</small></div></div>`;
const ent=`<div class="entete"><span>Objectif</span><span>Valeur</span><span>Objectif · avancement</span><span>Attendu</span><span>Écart</span><span>Tendance</span></div>`;
function secteurs(){return `
<section class="sec"><h2 class="ts">Par secteur · novembre</h2><div class="carte">${ent}
<h3 style="margin:12px 0 0">${v2('mod-carburants')}Carburant</h3>
${ligne('Litres vendus','par mois, litres du Tempo','322 000 L','400 000 L',81,'346 700 L',['24 700 L sous le repère','rouge'],'stable')}
<h3 style="margin:12px 0 0">${v2('mod-produits')}Commerce</h3>
${ligne('Ventes boutique','par mois','81 900 €','90 000 €',91,'78 000 €',['3 900 € au-dessus du repère','vert'],'en hausse')}
