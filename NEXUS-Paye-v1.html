<style>
:root{--bg:#0B0F14;--panel:#141B22;--raised:#1A222C;--line:#242E38;--text:#EDF1F5;--mid:#8A96A5;--dim:#57626F;--green:#34D399;--cyan:#4FC3D9;--amber:#F5A623;--red:#F0546B;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}html,body{background:var(--bg);color:var(--text);font-family:var(--sans)}body{display:flex;justify-content:center;min-height:100vh}.phone{width:100%;max-width:760px;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.header{padding:20px;position:relative}.menu{position:absolute;right:18px;top:18px;color:var(--cyan);border:1px solid rgba(79,195,217,.3);background:rgba(79,195,217,.1);padding:7px 12px;border-radius:20px;text-decoration:none;font:600 10.5px var(--mono)}.eyebrow,.section-label{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--cyan)}h1{font-size:22px;margin-top:4px}.subtitle{font:11px/1.55 var(--mono);color:var(--dim);margin-top:5px;max-width:620px}.divider{height:1px;background:var(--line)}main{padding:16px 20px 28px}.period{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.period button,.btn{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:10px 12px;cursor:pointer;font:600 11px var(--mono)}.period strong{font:700 14px var(--mono);text-transform:capitalize}.status{font:700 10px var(--mono);padding:5px 9px;border-radius:12px;background:rgba(245,166,35,.14);color:var(--amber)}.status.verifie{background:rgba(52,211,153,.14);color:var(--green)}.status.transmis{background:rgba(79,195,217,.14);color:var(--cyan)}.hero{padding:16px;background:linear-gradient(135deg,rgba(79,195,217,.12),rgba(52,211,153,.05));border:1px solid rgba(79,195,217,.28);border-radius:13px;margin-bottom:10px}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero h2{font-size:16px;margin-bottom:5px}.hero p{font:10.5px/1.5 var(--mono);color:var(--mid)}.quick-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}.quick-nav button{border:1px solid var(--line);background:var(--panel);color:var(--mid);border-radius:9px;padding:10px 6px;font:600 10px var(--mono);cursor:pointer}.quick-nav button:first-child{color:var(--amber);border-color:rgba(245,166,35,.25)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}.kpi span{display:block;font:9px var(--mono);color:var(--dim);text-transform:uppercase}.kpi b{display:block;font:700 20px var(--mono);margin-top:5px}.kpi.warn b{color:var(--amber)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.section-head{display:flex;align-items:center;gap:7px;margin:18px 0 10px;scroll-margin-top:12px}.section-head .section-label{margin:0}.section-label{color:var(--dim);margin-bottom:11px}.info-btn{width:22px;height:22px;border:1px solid rgba(79,195,217,.35);border-radius:50%;background:rgba(79,195,217,.09);color:var(--cyan);font:700 10px var(--mono);cursor:pointer;flex:none}.alert{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:9px;padding:11px 12px;color:var(--amber);font-size:12px;line-height:1.5;margin-bottom:8px}.ok{color:var(--green);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#071217}.btn.success{background:var(--green);border-color:var(--green);color:#07150f}.btn.danger{color:var(--red)}.btn:disabled{opacity:.35;cursor:not-allowed}.review-card{background:var(--panel);border:1px solid rgba(245,166,35,.26);border-radius:11px;padding:12px;margin-bottom:8px}.review-system{border-color:var(--line)}.review-name{font-size:11px;color:var(--mid);margin-bottom:5px}.employee{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden}.employee-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px;cursor:pointer}.employee-name{font-weight:700;text-transform:capitalize}.meta{font:10.5px/1.5 var(--mono);color:var(--mid);margin-top:3px}.summary-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.summary-chip{font:9px var(--mono);color:var(--mid);background:var(--raised);padding:4px 6px;border-radius:7px}.pill{font:700 9px var(--mono);padding:4px 7px;border-radius:9px;background:var(--raised);color:var(--mid);white-space:nowrap}.pill.green{color:var(--green);background:rgba(52,211,153,.12)}.pill.amber{color:var(--amber);background:rgba(245,166,35,.12)}.pill.info{color:var(--cyan);background:rgba(79,195,217,.12)}.employee-body{display:none;border-top:1px solid var(--line);padding:12px 14px}.employee.open .employee-body{display:block}.item{padding:10px;background:var(--raised);border:1px solid var(--line);border-radius:8px;margin-bottom:7px}.item-top{display:flex;justify-content:space-between;gap:10px}.item-title{font-size:12.5px;font-weight:600}.item-date{font:10px var(--mono);color:var(--dim);white-space:nowrap}.item-meta{font:10.5px/1.5 var(--mono);color:var(--mid);margin-top:4px}.ecart-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.ecart-cell{background:var(--panel);border-radius:7px;padding:7px}.ecart-cell span{display:block;font:8px var(--mono);color:var(--dim);text-transform:uppercase}.ecart-cell b{display:block;font:11px var(--mono);margin-top:3px}.source-link{display:inline-block;color:var(--cyan);font:600 9.5px var(--mono);text-decoration:none;margin-top:7px}.item-actions{display:flex;gap:6px;margin-top:8px}.item-actions .btn{padding:7px 9px;font-size:9.5px}.item.valide{border-color:rgba(52,211,153,.3)}.item.information{border-color:rgba(79,195,217,.25)}.item.exclu{opacity:.65}.item.blocked{border-color:rgba(240,84,107,.45)}.empty{font-size:12px;color:var(--dim);font-style:italic}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.date-range{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font:9.5px var(--mono);text-transform:uppercase;color:var(--dim);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px;font:12px var(--sans)}.field.full{grid-column:1/-1}.help{font:10.5px/1.55 var(--mono);color:var(--dim);margin-top:8px}.accountant-list{display:grid;gap:7px;margin:10px 0 12px}.accountant-line{display:flex;align-items:center;gap:8px;color:var(--mid);font-size:11px}.accountant-line::before{content:'✓';color:var(--green);font-weight:700}.modal{position:fixed;inset:0;background:rgba(3,8,12,.76);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50}.modal[hidden]{display:none}.modal-card{width:min(430px,100%);background:var(--panel);border:1px solid rgba(79,195,217,.35);border-radius:14px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.45)}.modal-card h3{font-size:15px;margin-bottom:8px}.modal-card p{font:11px/1.65 var(--mono);color:var(--mid);white-space:pre-line}.modal-card .btn{margin-top:14px}.modal-card.large{width:min(540px,100%);max-height:86vh;overflow:auto}.modal-card.danger{border-color:rgba(240,84,107,.45)}.modal-champ{margin-top:12px;text-align:left}.modal-champ label{display:block;font:9.5px var(--mono);text-transform:uppercase;color:var(--dim);margin-bottom:4px}.modal-champ .aide{font:10px/1.5 var(--mono);color:var(--dim);margin-top:4px}.modal-card input,.modal-card select,.modal-card textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px;font:12px var(--sans)}.modal-champ.case{display:flex;align-items:center;gap:8px}.modal-champ.case input{width:auto}.modal-champ.case label{margin:0;text-transform:none;font:11px var(--mono);color:var(--mid)}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.modal-actions .btn{margin-top:0}.modal-erreur{color:var(--red);font:10.5px/1.5 var(--mono);margin-top:10px}.modal-erreur[hidden]{display:none}.pill.red{color:var(--red);background:rgba(240,84,107,.12)}.vars{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.var{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px}.var span{display:block;font:8.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.05em}.var b{display:block;font:700 15px var(--mono);margin-top:4px}.var small{display:block;font:9px/1.4 var(--mono);color:var(--mid);margin-top:3px}.var.vide b{color:var(--dim)}.var.attente{border-color:rgba(245,166,35,.32)}.var.attente small{color:var(--amber)}.var.pleine{grid-column:1/-1}.detail-zone{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}.detail-zone[hidden]{display:none}.rh-bloc{display:grid;gap:3px;margin-bottom:6px}.rh-motif-titre{font-size:13.5px;font-weight:700}.rh-periode{font:600 11.5px var(--mono);color:var(--cyan)}.rh-couverture{font:10.5px var(--mono);color:var(--mid)}.info-auto{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:6px;font-size:12px;color:var(--mid)}.info-auto summary{cursor:pointer}.info-auto .muet{opacity:.7}.info-auto-dates{margin:6px 0 0 18px;font:10.5px/1.6 var(--mono)}.explication{font-size:12px;line-height:1.55;color:var(--mid);background:var(--raised);border-radius:8px;padding:9px 10px;margin-bottom:8px;display:grid;gap:4px}.explication b{color:var(--text)}.loading{text-align:center;padding:44px 10px;color:var(--dim);font:11px var(--mono)}footer{padding:18px;text-align:center;border-top:1px solid var(--line);color:var(--dim);font:10px var(--mono)}@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick-nav{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;margin-top:2px}.ecart-grid{grid-template-columns:1fr 1fr}.ecart-cell:last-child{grid-column:1/-1}}

/* ── Cockpit bureau (09/10/2026, mandat Fast Track de Frédéric) ──────────
   Avant : quarante cartes verticales, un écran de plusieurs mètres, le même
   geste répété carte après carte. Après : une bannière compacte, une ligne
   d'indicateurs cliquables, un tableau dense des salariés et un panneau
   contextuel. Rien n'est recalculé ici — la présentation change, le moteur
   métier (nexus-paye-moteur.js) n'est pas touché.
   Le mobile ne reçoit JAMAIS le tableau compressé : les colonnes se replient
   en fiches empilées (navigation adaptée), règle NEXUS inchangée. */
body{display:block}
.cockpit{width:100%;max-width:1680px;margin:0 auto;min-height:100vh;border-left:0;border-right:0}
/* Vue bureau (09/10/2026, signalé par Frédéric sur Safari) : le
   `body{display:block}` ci-dessus annulait la coquille de nexus-desktop.js,
   qui suppose un body en flex — la barre latérale s'empilait au-dessus et
   repoussait tout l'écran sous ses 1 600 px. On rend le flex à la coquille
   et le cockpit prend la largeur restante. */
body.nexus-desktop{display:flex}
body.nexus-desktop>.cockpit{flex:1;min-width:0;max-width:none;margin:0}
main{padding:12px 18px 20px}
/* Bannière : identité, mois, état du dossier, actions principales. */
.topbar{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) minmax(0,auto);align-items:center;gap:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:9px}
.topbar .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.topbar .brand b{font:700 15px var(--sans)}
.topbar .brand .eyebrow{color:var(--cyan)}
.topbar .station{font:600 10.5px var(--mono);color:var(--mid);background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.monthnav button{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font:600 11px var(--mono)}
.monthnav strong{font:700 13.5px var(--mono);text-transform:capitalize;min-width:150px;text-align:center}
.topacts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.topacts .btn{padding:7px 10px;font-size:10px}
.topbar .menu{position:static;padding:6px 10px}
/* Indicateurs : cinq, tous cliquables, tous reliés à une donnée réelle. */
.kpirow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:9px}
button.kpi{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;color:var(--text);font-family:var(--sans)}
button.kpi:hover,button.kpi:focus-visible{border-color:rgba(79,195,217,.45);outline:none}
button.kpi span b,button.kpi span small{text-transform:none}
button.kpi span{display:block;font:9px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
button.kpi b{display:block;font:700 19px var(--mono);margin-top:3px}
.kpi-attente{font-style:normal;font-size:10.5px;font-weight:600;color:var(--amber);white-space:nowrap}
button.kpi small{display:block;font:9.5px/1.35 var(--mono);color:var(--mid);margin-top:2px}
button.kpi.actif{border-color:var(--cyan);background:rgba(79,195,217,.08)}
button.kpi.warn b{color:var(--amber)}
button.kpi.money b{color:var(--cyan)}
/* Espace de travail : tableau à gauche, panneau contextuel à droite. */
.workspace{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(360px,1fr);gap:10px;align-items:start}
.tablewrap,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tabletools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 10px;border-bottom:1px solid var(--line)}
.tabletools input[type="search"]{flex:1 1 170px;min-width:140px;background:var(--raised);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 9px;font:12px var(--sans)}
.filtres{display:flex;gap:5px;flex-wrap:wrap}
button.filtre{border:1px solid var(--line);background:var(--raised);color:var(--mid);border-radius:8px;padding:6px 9px;cursor:pointer;font:600 9.5px var(--mono)}
button.filtre[aria-pressed="true"]{color:#071217;background:var(--cyan);border-color:var(--cyan)}
.tablescroll{overflow:auto;max-height:calc(100vh - 322px);max-height:calc(100dvh - 322px);-webkit-overflow-scrolling:touch}
table.sal{width:100%;border-collapse:collapse}
table.sal th,table.sal td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12.5px}
table.sal thead th{position:sticky;top:0;z-index:2;background:var(--raised);font:600 9px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
table.sal thead th button.tri{all:unset;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
table.sal thead th button.tri:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
table.sal tbody tr{cursor:pointer}
table.sal tbody tr:hover{background:var(--raised)}
table.sal tbody tr.selected{background:rgba(79,195,217,.1);box-shadow:inset 2px 0 0 var(--cyan)}
table.sal tbody tr:focus-visible{outline:1px solid var(--cyan);outline-offset:-1px}
table.sal tbody tr.horspaie{opacity:.78}
.cell-nom{font-weight:600;text-transform:capitalize;font-size:12.5px}
.cell-sub{font:9.5px/1.35 var(--mono);color:var(--mid)}
/* Une ligne qui attend une décision se repère sans lire : filet ambre à gauche. */
table.sal tbody tr.prioritaire{box-shadow:inset 3px 0 0 var(--amber)}
table.sal tbody tr.prioritaire.selected{box-shadow:inset 3px 0 0 var(--cyan)}
.flag.compte{color:#071217;background:var(--amber)}
.zeros{font:10px/1.5 var(--mono);color:var(--mid);padding:6px 2px 0}
.sous-titre{font:700 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mid);margin:10px 0 6px}
.regul-etat{font:11px/1.5 var(--mono);color:var(--amber);padding:6px 0}
.cell-num{font:600 12px var(--mono);white-space:nowrap}
.cell-num.zero{color:var(--dim)}
.flag{display:inline-block;font:700 9px var(--mono);padding:3px 6px;border-radius:7px;background:var(--raised);color:var(--mid);white-space:nowrap}
.flag.amber{color:var(--amber);background:rgba(245,166,35,.13)}
.flag.red{color:var(--red);background:rgba(240,84,107,.13)}
.flag.cyan{color:var(--cyan);background:rgba(79,195,217,.13)}
.flag.vide{color:var(--dim);background:none;padding-left:0}
/* Panneau contextuel : trois onglets, une seule décision par anomalie. */
.paneltabs{display:flex;gap:5px;padding:8px 9px;border-bottom:1px solid var(--line);flex-wrap:wrap}
button.tab{border:1px solid var(--line);background:var(--raised);color:var(--mid);border-radius:8px;padding:7px 10px;cursor:pointer;font:600 10px var(--mono)}
button.tab[aria-selected="true"]{color:#071217;background:var(--cyan);border-color:var(--cyan)}
button.tab .n{font-weight:700}
.panelbody{padding:10px 12px}
.panelbody>section{margin-bottom:12px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;margin-bottom:9px}
.panel-head h2{font-size:15.5px;text-transform:capitalize}
.bloc-titre{display:flex;align-items:center;gap:6px;font:600 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:0 0 7px}
.lignes{display:grid;gap:4px;margin-bottom:8px}
.ligne{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--mid);background:var(--raised);border-radius:7px;padding:6px 8px}
.ligne b{font:600 11.5px var(--mono);color:var(--text);white-space:nowrap}
.ligne.muet b{color:var(--dim)}
.vars{grid-template-columns:repeat(2,minmax(0,1fr))}
.var b{font-size:14px}
.ecart-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.item{margin-bottom:6px}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:9px;overflow:hidden}
.drawer[hidden]{display:none}
.drawer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.empty-state{padding:26px 14px;text-align:center;color:var(--dim);font:11px/1.6 var(--mono)}
footer{padding:12px;font-size:9.5px}
@media(max-width:1180px){.kpirow{grid-template-columns:repeat(3,minmax(0,1fr))}.workspace{grid-template-columns:1fr}.tablescroll{max-height:none}}
@media(max-width:1000px){.drawer-grid{grid-template-columns:1fr}}
/* Mobile : plus de tableau — une fiche par salarié, en-têtes repliés dans
   chaque cellule. Zones tactiles ≥ 44 px, comme partout dans NEXUS. */
@media(max-width:820px){
 main{padding:10px 12px 18px}
 .topbar{grid-template-columns:1fr;gap:8px}
 .topacts{justify-content:flex-start}
 .kpirow{grid-template-columns:repeat(2,minmax(0,1fr))}
 table.sal thead{display:none}
 table.sal tbody tr{display:grid;grid-template-columns:1fr;gap:3px;padding:9px 10px;border-bottom:1px solid var(--line)}
 /* Une cellule porte souvent plusieurs blocs (poste + barème, plusieurs
    pastilles) : en flex `space-between` ils s'étalaient sur la ligne et le
    premier flottait au milieu. L'en-tête reste à gauche, toutes les valeurs
    s'empilent à droite. */
 table.sal tbody td{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:3px;align-items:baseline;border:0;padding:3px 0;min-height:22px}
 table.sal tbody td::before{content:attr(data-col);font:9px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);grid-column:1;grid-row:1;align-self:start;padding-top:2px}
 table.sal tbody td>*{grid-column:2;justify-self:end;text-align:right}
 table.sal tbody td.cell-first>*{grid-column:1 / -1;justify-self:start;text-align:left}
 table.sal tbody td.cell-first::before{display:none}
 .monthnav button,.topacts .btn,button.filtre,button.tab{min-height:44px}
 /* Le compte y était pour la barre du haut seulement : les commandes du
    panneau, les bulles (i) et la recherche restaient sous le pouce. La

const LIBELLES={absence_a_qualifier:'Absence à qualifier',absence_qualifiee:'Absence qualifiée',presence_exceptionnelle:'Présence exceptionnelle',absence_a_verifier:'Présence à vérifier',conge_paye:'Congé payé',arret_maladie:'Arrêt maladie',retard:'Retard',retard_incoherent:'Retard incohérent',heure_supplementaire:'Heure supplémentaire',jour_ferie:'Jour férié',acompte:'Acompte',dette:'Dette / avance qualifiée',ecart_caisse:'Écart de caisse qualifié',autre:'Autre variable'};
const INFOS={ecartsCalcul:['Comment sont calculés les écarts ?','Cet écran est en lecture seule : il reprend les écarts saisis dans Verify (boutique / piste) et FDJ, sans rien modifier. La saisie, la vérification et la correction se font dans Verify ou FDJ.\nLes montants sont ceux du mois civil choisi, au fuseau horaire de la station, avec les mêmes calculs que la page Analyse des écarts.\nAucun montant n’est retenu automatiquement sur la paie : seul un montant que vous saisissez vous-même ici est transmis à la comptabilité.\nUn versement supérieur à l’écart (surplus de versement) n’est pas transmis à la comptabilité.'],indicateursEcarts:['Manques validés et solde opérationnel','Manques validés du mois : somme des manques de caisse du mois civil que le manager a validés (écarts « à vérifier » exclus). C’est l’indicateur principal. Solde opérationnel du mois : somme algébrique de tous les écarts du mois, manques et excédents, validés ou non ; il peut être moins négatif sans que les manques validés diminuent. Les régularisations encaissées ce mois comptent au jour de l’encaissement, même sur un écart d’un mois antérieur ; le reste à régulariser est un cumul depuis l’origine, arrêté à la fin du mois. Mêmes chiffres que la page Analyse des écarts. Aucune retenue sur salaire n’est créée.'],heures:['Comment lire les heures','Constatée : journée attestée par Verify (avec ou sans pointage), ou par le planning officiel pour un renfort. Le détail « confirmée par deux sources » (Verify et pointage) figure dans l’infobulle de la tuile et dans le PDF. Calculée : durée chiffrée selon les règles du poste (journée longue = 7 h + 1 h supplémentaire, règle du 10/10). Corrigée : heures exceptionnelles justifiées par le manager. Confirmée : jour retenu après ces contrôles. Hors planning : présence constatée un jour non planifié ; ses heures proposées par le barème restent en attente tant que vous n’avez pas tranché. Retenue : ce qui part à la comptabilité — uniquement les heures sans réserve et celles que vous avez confirmées.'],dossier:['Dossier mensuel','NEXUS prépare les variables et les preuves. La comptabilité reste responsable du bulletin. Aucune retenue n’est appliquée automatiquement.'],preuves:['Présence confirmée','Le planning indique ce qui était prévu. Verify et le pointage apportent les preuves de présence réelle. Une journée attestée par une seule source reste signalée comme telle.'],arbitrage:['À vérifier','Cette zone rassemble uniquement les décisions qui nécessitent votre intervention avant de préparer le dossier comptable.'],ecart:['Écart de caisse','Un écart positif ou négatif reste visible pour la traçabilité. Il ne devient jamais automatiquement une dette du salarié ni une retenue sur paie.'],export:['Dossier comptable','L’export contient les présences confirmées, les variables validées et les écarts informatifs. Les éléments encore à vérifier ne sont jamais transmis.'],periode:['Saisie sur une période','Pour une seule journée, utilisez la même date dans « Du » et « Au ». Pour plusieurs jours, NEXUS conserve une ligne datée par journée. Les congés et absences ne se saisissent pas ici : ils relèvent d’un événement RH.'],evenementRH:['Événement RH','Une absence longue, un congé, une maternité, une paternité, une formation ou un arrêt maladie est UN événement, avec une date de début et une date de fin — jamais une ligne par jour. Déclaré une fois, il est reporté automatiquement sur chaque mois qu’il traverse, y compris quand la date de retour n’est pas encore connue.'],statutSalarie:['Statut du salarié','Prêt : plus rien à décider. À vérifier : les données sont là, un arbitrage reste à rendre. Donnée manquante : il manque un paramétrage ou toute donnée du mois. Le statut du mois est celui du salarié le plus en retard.'],regularisation:['Écarts et régularisations','L’écart initial reste attaché à la période où il est né. Un versement encaissé plus tard apparaît comme une régularisation et réduit le solde restant, sans réécrire les statistiques du mois d’origine. Aucun écart de caisse ne devient automatiquement une retenue sur salaire : seul un montant saisi par le manager est transmis à la comptabilité.'],heuresRetenues:['Heures retenues','Une heure est Constatée (mesurée par Verify ou Pointage), Calculée (d’après le barème de la station pour une journée constatée) ou Corrigée (modifiée par le manager). NEXUS additionne les heures confirmées du mois. Les heures supplémentaires arbitrées s’ajoutent à ce total ; celles déjà comprises dans le barème y figurent déjà et ne sont pas comptées deux fois.']};
// Les seuls types encore saisissables JOURNÉE PAR JOURNÉE. Congés,
// maladie, maternité, paternité, formation et absences longues n'y sont
// plus : ce sont des événements RH, portés par une période unique
// (03/09/2026). Le refus est aussi posé dans nexus-paye-donnees.js.
// « retard » y entre le 08/10/2026 (règles SMU §4) : NEXUS ne déduit
// plus aucun retard du pointage ; seul le manager le déclare, ici.
const TYPES_VARIABLE_MANUELLE=['presence_exceptionnelle','retard','heure_supplementaire','jour_ferie','acompte','dette','autre'];
const LIBELLE_STATUT_ITEM={a_verifier:'à vérifier',information:'information',valide:'validé',examine:'examiné',corrige:'corrigé',justifie:'justifié',exclu:'sans impact paie'};
const LIBELLE_SOURCE={verify:'Verify',pointage:'Pointage',planning:'Planning officiel',duree_reference:'Durée de référence de la station',horaire_exceptionnel:'Horaire exceptionnel saisi par le manager',fdj:'FDJ',manuel:'Saisie manager',renfort:'Renfort déclaré dans Verify'};
const MOTIFS_RH=[['conge_maternite','Congé maternité'],['arret_maladie','Arrêt maladie'],['conge','Congé'],['conge_paternite','Congé paternité'],['formation','Formation'],['autre','Autre']];
const STATUTS_SALARIE={pret:['Prêt','green'],a_verifier:['À vérifier','amber'],donnee_manquante:['Donnée manquante','red'],hors_paie:['Hors paie','']};
const ECHAPPE=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const infoBtn=(cle,label)=>`<button type="button" class="info-btn" data-info="${cle}" aria-label="Information${label?` : ${ECHAPPE(label)}`:''}">i</button>`;
const euros=c=>c==null?'—':`${c>0?'+':''}${(c/100).toFixed(2)} €`;
const eurosDe=v=>euros(Math.round(v*100));
// P2 (03/09/2026) : « vérifié » est un mot d'ingénieur. Ce que le
// manager doit lire, c'est où en est le dossier vis-à-vis de la comptabilité.
const LIBELLE_STATUT_DOSSIER={brouillon:'en préparation',verifie:'prêt pour comptabilité',transmis:'transmis'};
const jjmmaaaaFR=iso=>{const p=String(iso||'').slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(iso||'')};
const pluriel=(n,mot)=>`${n} ${mot}${n>1?'s':''}`;
const pillStatut=st=>{const [l,c]=STATUTS_SALARIE[st]||STATUTS_SALARIE.hors_paie;return `<span class="pill ${c}">${l}</span>`};
function lienPlanningSecurise(){const brut=RAPPORT&&RAPPORT.planningOfficiel&&RAPPORT.planningOfficiel.url;try{const u=new URL(brut);return u.protocol==='https:'&&u.hostname==='docs.google.com'&&u.pathname.startsWith('/spreadsheets/d/')?u.href:''}catch(_){return''}}
function moisLabel(){return new Date(`${MOIS}T12:00:00`).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});}
function dernierJourMois(){return NexusEcartsDonnees.bornesDuMois(MOIS).dateFin}
function etatPeriode(){return (RAPPORT.periodeEnregistree&&RAPPORT.periodeEnregistree.statut)||'brouillon';}
// Validation du mois (06/11/2026) : règles dans nexus-paye-validation.js, écran ici.
let MENTION_VALIDATION='';
function nomsParametrages(){return (RAPPORT.bloqueurs||[]).filter(b=>b.categorie==='configuration').map(b=>{const f=(RAPPORT.employes||[]).find(x=>x.employee.id===b.employeeId);return f?f.employee.nom:String(b.libelle||'').split(' : ')[0]})}
function nbATraiter(){const s=RAPPORT.synthese;return NexusPayeValidation.aTraiter({bloqueurs:RAPPORT.bloqueurs,salariesInclus:s.salariesInclus,salariesPrets:s.salariesPrets})}
function etatValidation(){const s=RAPPORT.synthese;return NexusPayeValidation.etat({statut:etatPeriode(),bloqueurs:RAPPORT.bloqueurs,parametrages:nomsParametrages(),salariesInclus:s.salariesInclus,salariesPrets:s.salariesPrets});}
function nomVerificateur(p){if(!p||!p.verifie_par)return 'un responsable';const f=(RAPPORT.employes||[]).find(x=>x.employee.id===p.verifie_par);return f?f.employee.nom:(EMPLOYEE&&EMPLOYEE.id===p.verifie_par?EMPLOYEE.nom:'un responsable');}
function boutonsValidation(mobile){
 const e=etatValidation(), p=RAPPORT.periodeEnregistree||null;
 const valider=e.validerVisible?`<button type="button" class="btn${e.validerActif?' primary':''}" id="validerMois" ${e.validerActif?'':`disabled title="${ECHAPPE(e.validerTitre)}"`}>${ECHAPPE(e.validerLibelle)}</button>`:'';
 const transmettre=`<button type="button" class="btn${e.transmettreActif?' primary':''} transmettre" id="transmettreMois" ${e.transmettreActif?'':`disabled title="${ECHAPPE(e.transmettreTitre)}"`}>${e.statut==='transmis'?'Transmis':'Transmettre à la comptabilité'}</button>`;
 if(mobile)return valider+transmettre;
 const badge=e.statut!=='brouillon'&&p?`<span class="badge-verif">Vérifié par ${ECHAPPE(nomVerificateur(p))} le ${jjmmaaaaFR(p.verifie_le)}</span>`:'';
 return `<span class="capsule-valides">${ECHAPPE(e.capsule)}</span>${badge}${valider}${transmettre}`;
}
async function validerMois(){
 if(!etatValidation().validerActif)return;
 const snapshot={genere_le:new Date().toISOString(),periode:MOIS,lignes:NexusPayeMoteur.lignesExport(RAPPORT),dossier:NexusPayeMoteur.dossierComptable(RAPPORT)};
 await NexusPayeDonnees.enregistrerPeriode(nexusClient,{siteId:SITE,periode:MOIS,statut:'verifie',snapshot,actorId:EMPLOYEE.id});
 MENTION_VALIDATION='Mois vérifié. Vous pouvez maintenant le transmettre à la comptabilité.';
 reload();
}
async function transmettreMois(){
 if(!etatValidation().transmettreActif)return;
 await NexusPayeDonnees.enregistrerPeriode(nexusClient,{siteId:SITE,periode:MOIS,statut:'transmis',snapshot:RAPPORT.periodeEnregistree.snapshot,actorId:EMPLOYEE.id});
 MENTION_VALIDATION='Mois transmis à la comptabilité.';
 reload();
}
function itemMeta(i){const q=i.quantiteMinutes!=null?`${i.quantiteMinutes} min`:'';const m=i.montantCentimes!=null?`${(i.montantCentimes/100).toFixed(2)} €`:'';return [LIBELLES[i.typeItem]||i.typeItem,q,m,i.contestationOuverte?'Contestation ouverte — transmission bloquée':''].filter(Boolean).join(' · ')}
// ─── Cockpit mensuel (09/10/2026, mandat Fast Track de Frédéric) ──────────
// Avant ce lot, l'écran empilait quarante cartes verticales : il fallait
// défiler plusieurs écrans pour savoir ce qui manquait. Le cockpit tient
// la même vérité sur une seule page — bannière, cinq indicateurs
// cliquables, tableau dense des salariés, panneau contextuel.
// Tout ce qui suit est de la PRÉSENTATION. Les totaux, les statuts et les
// arbitrages viennent de NexusPayeMoteur ; aucun calcul métier n'est
// refait ici, et aucun chiffre affiché n'est inventé.
let FICHE_ONGLET='synthese', FICHE_OUVERTE=false;
let SELECTION=null, ONGLET='fiche', FILTRE='inclus', RECHERCHE='', TRI={cle:'statut',sens:1}, COMMERCE='';
const SANS_ACCENT=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const H2=n=>Number(n||0).toFixed(2);
const hFr=n=>`${String(Math.round(Number(n||0)*100)/100).replace('.',',')} h`;
const ONGLETS=[['fiche','Fiche salarié'],['decisions','Décisions'],['dossier','Dossier comptable']];
// Ordre de lecture du tableau (présentation, pas une règle métier) :
// ce qui manque d'abord, ce qui est prêt ensuite, hors paie en dernier.
const RANG_STATUT={donnee_manquante:0,a_verifier:1,pret:2,hors_paie:3};
const FILTRES=[['tous','Tous'],['a_verifier','À vérifier'],['prets','Prêts'],['hors_paie','Hors paie']];
// Le statut affiché dans la bannière est celui du dossier, pas celui d'un
// salarié : préparation tant qu'un paramétrage manque, vérification dès
// qu'un arbitrage est en attente, prêt quand le mois est validé.
function etatDossier(statut){
 if(statut!=='brouillon')return LIBELLE_STATUT_DOSSIER[statut]||statut;
 const s=RAPPORT.synthese;
 if(s.configurationRequise)return 'en préparation';
 if(s.aVerifier)return 'en vérification';
 return 'en préparation · prêt à valider';
}
function trouverFiche(id){return (RAPPORT.employes||[]).find(f=>f.employee.id===id)||null}
function selectionParDefaut(){
 const l=RAPPORT.employes||[];
 const f=l.find(x=>x.statut==='a_verifier')||l.find(x=>x.statut==='donnee_manquante')||l.find(x=>x.reglage.inclus)||l[0];
 return f?f.employee.id:null;
}
function itemsEnAttente(f){return (f.items||[]).filter(i=>!NexusPayeMoteur.sansIncidencePaie(i)&&(i.statut==='a_verifier'||i.contestationOuverte))}
function bloqueursConfig(id){return (RAPPORT.bloqueurs||[]).filter(b=>b.categorie==='configuration'&&b.employeeId===id)}
function horsPlanning(f){return (f.items||[]).filter(i=>i.typeItem==='presence_exceptionnelle').length}
// Écarts de caisse (09/10/2026). La différence entre l'écart initial et
// l'écart final validé est une CORRECTION faite à la validation (recomptage,
// erreur de saisie…), pas un encaissement : la présenter comme « versée »
// fabriquait un paiement que personne n'avait reçu. Les encaissements réels
// viennent des opérations de régularisation (NexusPayeRegularisations), sur
// l'univers complet des écarts de la station : un versement de ce mois pour
// un écart d'un mois antérieur reste lié à son écart.
function correctionValidationCentimes(i){
 if(i.ecartInitialCentimes==null||i.ecartFinalCentimes==null)return null;
 const v=i.ecartFinalCentimes-i.ecartInitialCentimes;
 return v===0?null:v;
}
function totauxEcarts(){
 const l=(RAPPORT.items||[]).filter(i=>i.typeItem==='ecart_caisse');
 let initial=0,retenu=0,aAttribuer=0,enAttente=0;
 l.forEach(i=>{
  if(i.ecartInitialCentimes!=null)initial+=i.ecartInitialCentimes;
  if(i.impactPaye&&i.montantCentimes!=null)retenu+=i.montantCentimes;
  if(i.attributionRequise)aAttribuer++;
  if(i.statut==='a_verifier'||i.contestationOuverte)enAttente++;
 });
 return {lignes:l,initial,retenu,aAttribuer,enAttente};
}
// Ne lève jamais : un état explicite remplace des zéros trompeurs.
let REGUL={etat:'chargement'};
async function chargerRegularisationsPaye(){
 try{
  const f=await NexusStation.fuseauDeLaStation(SITE);
  if(!f||!f.timezone)return {etat:f&&f.indetermine==='reseau'?'erreur':'sans_fuseau'};
  const [univers,ops]=await Promise.all([NexusEcartsDonnees.chargerEcartsConsolides(nexusClient,SITE,{}),NexusPayeRegularisations.chargerOperations(nexusClient,SITE)]);
  const opt={fuseau:f.timezone,dateDebut:MOIS,dateFin:dernierJourMois()};
  return {etat:'ok',indic:NexusEcartsDonnees.indicateursPeriode(univers,{dateDebut:opt.dateDebut,dateFin:opt.dateFin}),situations:NexusPayeRegularisations.situationsParEcart(univers,ops,opt),synthese:NexusPayeRegularisations.syntheseRegularisationsPeriode(univers,NexusPayeRegularisations.operationsDeLUnivers(univers,ops),opt),domaines:NexusPayeRegularisations.syntheseParDomaine(univers,ops,opt)};
 }catch(e){console.error(e);return {etat:'erreur',message:(e&&e.message)||String(e)}}
}
function regulOk(){return !!(REGUL&&REGUL.etat==='ok'&&REGUL.synthese)}
function raisonRegul(){
 const e=REGUL&&REGUL.etat;
 if(e==='sans_fuseau')return 'Fuseau horaire de la station non configuré : les régularisations ne peuvent pas être datées.';
 if(e==='erreur')return 'Régularisations indisponibles (lecture impossible) : aucun montant n’est affiché plutôt qu’un zéro trompeur.';
 return 'Régularisations en cours de chargement…';
}
// Heures d'une présence hors planning : le barème les propose, le moteur
// les compte déjà dans la présence (règle inchangée, soumise à arbitrage).
// L'écran les sépare tant que la décision n'est pas prise.
function heuresEnAttente(f){
 return (f.items||[]).filter(i=>i.typeItem==='presence_exceptionnelle'&&i.statut==='a_verifier'&&i.heuresAttribuees!=null)
  .reduce((t,i)=>t+Number(i.heuresAttribuees||0),0);
}
function agregats(){
 let jours=0,mesures=0,reconstitues=0,supp=0,horsPaie=0,horsPlan=0,attente=0;
 (RAPPORT.employes||[]).forEach(f=>{
  if(!f.reglage.inclus){horsPaie++;return}
  const v=NexusPayeMoteur.variablesComptables(f);
  jours+=Number(v.presence.jours||0);mesures+=Number(v.presence.joursMesures||0);
  reconstitues+=Number(v.presence.joursReconstitues||0);supp+=Number(v.heuresSupplementaires.heures||0);
  horsPlan+=horsPlanning(f);attente+=heuresEnAttente(f);
 });
 return {jours,mesures,reconstitues,supp:Math.round(supp*100)/100,horsPaie,horsPlan,attente:Math.round(attente*100)/100};
}
// Tri et filtres : l'ordre par défaut remonte les salariés qui attendent
// une décision, et renvoie les hors paie en fin de liste — visibles,
// jamais au premier plan (ils ne doivent pas gêner la lecture du reste).
function fichesAffichees(){
 const q=SANS_ACCENT(RECHERCHE).trim();
 let l=(RAPPORT.employes||[]).filter(f=>{
  if(FILTRE==='hors_paie'){if(f.reglage.inclus)return false}
  else if(!f.reglage.inclus)return false;
  if(FILTRE==='a_verifier'&&!(f.statut!=='pret'||itemsEnAttente(f).length||bloqueursConfig(f.employee.id).length))return false;
  if(FILTRE==='prets'&&f.statut!=='pret')return false;
  if(!q)return true;
  return SANS_ACCENT(`${f.employee.nom} ${f.employee.role||''}`).includes(q);
 });
 const rang=f=>RANG_STATUT[f.statut]==null?99:RANG_STATUT[f.statut];
 const cle=f=>{
  if(TRI.cle==='heures')return Number(f.heuresConfirmees||0);
  if(TRI.cle==='anomalies')return itemsEnAttente(f).length+bloqueursConfig(f.employee.id).length;
  if(TRI.cle==='statut')return rang(f);
  return SANS_ACCENT(f.employee.nom);
 };
 l.sort((a,b)=>{
  if(a.reglage.inclus!==b.reglage.inclus)return a.reglage.inclus?-1:1;
  const ka=cle(a),kb=cle(b);
  if(ka<kb)return -1*TRI.sens; if(ka>kb)return 1*TRI.sens;
  return SANS_ACCENT(a.employee.nom)<SANS_ACCENT(b.employee.nom)?-1:1;
 });
 return l;
}
function fleche(c){return TRI.cle===c?(TRI.sens>0?' ↑':' ↓'):''}
function libelleCompte(l){
 const inclus=l.filter(f=>f.reglage.inclus).length;
 return `${pluriel(l.length,'ligne')} affichée${l.length>1?'s':''} · ${inclus} dans la paie · ${l.length-inclus} hors paie`;
}
function corpsTable(l){
 if(!l.length)return `<tr><td colspan="4"><div class="empty-state">Aucun salarié ne correspond à ce filtre.</div></td></tr>`;
 const groupes=TRI.cle==='statut'&&FILTRE!=='hors_paie';
 let out='',dernier=null;
 l.forEach(f=>{
  if(groupes){const g=f.statut==='pret'?'Prêts':'À traiter d’abord';if(g!==dernier){out+=`<tr class="grp"><td colspan="4">${g}</td></tr>`;dernier=g}}
  out+=ligneSalarie(f);
 });
 return out;
}
function renderTable(){
 const s=RAPPORT.synthese, l=fichesAffichees(), a=agregats();
 const ongletsListe=[['inclus',`Salariés (${s.salariesInclus})`],['hors_paie',`Hors paie (${a.horsPaie})`]];
 return `<div class="tabletools">
  <div class="liste-onglets filtres" role="group" aria-label="Liste des salariés">${ongletsListe.map(([v,lib])=>`<button type="button" class="filtre" data-filtre="${v}" aria-pressed="${(v==='hors_paie')===(FILTRE==='hors_paie')}">${lib}</button>`).join('')}</div>${infoBtn('statutSalarie','statut du salarié')}
  <input id="recherche" type="search" placeholder="Rechercher un salarié…" aria-label="Rechercher un salarié" value="${ECHAPPE(RECHERCHE)}">
 </div>
 <div class="tablescroll"><table class="sal"><caption class="sr">Salariés du mois</caption><thead><tr>
  <th scope="col"><button type="button" class="tri" data-tri="nom" data-lib="Salarié">Salarié${fleche('nom')}</button></th>
  <th scope="col">Fonction</th>
  <th scope="col"><button type="button" class="tri" data-tri="heures" data-lib="Heures">Heures${fleche('heures')}</button></th>
  <th scope="col"><button type="button" class="tri" data-tri="statut" data-lib="Statut">Statut${fleche('statut')}</button></th>
 </tr></thead><tbody id="tbody">${corpsTable(l)}</tbody></table></div>
 <div class="help" id="tableCount" style="padding:0 11px 9px;margin:0">${libelleCompte(l)}</div>`;
}
function anneau(pct,couleur){
 const c=157.1, d=Math.max(0,Math.min(100,pct))/100*c;
 return `<svg class="anneau" viewBox="0 0 60 60" aria-hidden="true"><circle class="fond" cx="30" cy="30" r="25"/><circle cx="30" cy="30" r="25" style="stroke:${couleur}" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${c}" transform="rotate(-90 30 30)"/></svg>`;
}
function renderKpis(s,ec,a){
 const inclus=s.salariesInclus, prets=s.salariesPrets, atraiter=nbATraiter();
 const pc=n=>inclus?Math.round(n/inclus*100):0;

function section(titre,tuiles){

// ─── Modales NEXUS (03/09/2026) ────────────────────────────────────────
// Les boîtes natives du navigateur (prompt / alert / confirm) sont
// bannies de PAYE : elles ne portent ni le vocabulaire ni les garde-fous
// de NEXUS, elles bloquent l'interface, et sur iOS en PWA elles sont
// parfois purement ignorées — un manager pouvait croire avoir répondu à
// une question qui ne lui avait jamais été posée. Tout passe désormais
// par une modale graphique, avec ses champs typés et sa validation.
let DIALOGUE = null;
function socleDialogue(){
 if(DIALOGUE) return DIALOGUE;
 const d=document.createElement('div');
 d.className='modal'; d.id='nexusDialogue'; d.hidden=true;
 d.innerHTML='<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dlgTitre"><h3 id="dlgTitre"></h3><p id="dlgTexte"></p><div id="dlgChamps"></div><div class="modal-erreur" id="dlgErreur" hidden></div><div class="modal-actions" id="dlgActions"></div></div>';
 document.body.appendChild(d);
 DIALOGUE=d; return d;
}
function champDialogue(c){
 const id=`dlg_${c.cle}`;
 if(c.type==='checkbox') return `<div class="modal-champ case"><input type="checkbox" id="${id}" name="${ECHAPPE(c.cle)}"${c.valeur?' checked':''}><label for="${id}">${ECHAPPE(c.label)}</label></div>`;
 let controle;
 if(c.type==='select') controle=`<select id="${id}" name="${ECHAPPE(c.cle)}">${(c.options||[]).map(([v,l])=>`<option value="${ECHAPPE(v)}"${String(c.valeur)===String(v)?' selected':''}>${ECHAPPE(l)}</option>`).join('')}</select>`;
 else if(c.type==='textarea') controle=`<textarea id="${id}" name="${ECHAPPE(c.cle)}" rows="${c.lignes||2}" placeholder="${ECHAPPE(c.placeholder||'')}">${ECHAPPE(c.valeur||'')}</textarea>`;
 else controle=`<input id="${id}" name="${ECHAPPE(c.cle)}" type="${ECHAPPE(c.type||'text')}" value="${ECHAPPE(c.valeur==null?'':c.valeur)}"${c.min!=null?` min="${ECHAPPE(c.min)}"`:''}${c.max!=null?` max="${ECHAPPE(c.max)}"`:''}${c.pas?` step="${ECHAPPE(c.pas)}"`:''} placeholder="${ECHAPPE(c.placeholder||'')}">`;
 return `<div class="modal-champ"><label for="${id}">${ECHAPPE(c.label)}</label>${controle}${c.aide?`<div class="aide">${ECHAPPE(c.aide)}</div>`:''}</div>`;
}
// Résout avec un objet { cle: valeur } si l'utilisateur valide, `null`
// s'il annule (échap, clic hors carte, bouton Annuler) — jamais une
// exception : annuler n'est pas une erreur.
function ouvrirDialogue(opts){
 const d=socleDialogue(), carte=d.querySelector('.modal-card'), champs=opts.champs||[];
 carte.classList.toggle('danger',!!opts.danger);
 carte.classList.toggle('large',champs.length>2);
 d.querySelector('#dlgTitre').textContent=opts.titre||'';
 const p=d.querySelector('#dlgTexte'); p.textContent=opts.texte||''; p.hidden=!opts.texte;
 const err=d.querySelector('#dlgErreur'); err.hidden=true; err.textContent='';
 const zone=d.querySelector('#dlgChamps'); zone.innerHTML=champs.map(champDialogue).join('');
 const actions=d.querySelector('#dlgActions');
 actions.innerHTML=`${opts.annuler===false?'':`<button class="btn" data-dlg="annuler">${ECHAPPE(opts.libelleAnnuler||'Annuler')}</button>`}<button class="btn ${opts.danger?'danger':'primary'}" data-dlg="valider">${ECHAPPE(opts.libelleValider||'Confirmer')}</button>`;
 d.hidden=false;
 const premier=zone.querySelector('input,select,textarea'); if(premier) premier.focus();
 return new Promise(resolve=>{
  const touche=e=>{if(e.key==='Escape')fin(null);else if(e.key==='Enter'&&e.target&&e.target.tagName!=='TEXTAREA')valider()};
  const fin=v=>{d.hidden=true;d.onclick=null;document.removeEventListener('keydown',touche);resolve(v)};
  const lire=()=>{const o={};champs.forEach(c=>{const el=zone.querySelector(`[name="${c.cle}"]`);if(el)o[c.cle]=c.type==='checkbox'?el.checked:el.value});return o};
  const valider=()=>{const v=lire();const e=opts.verifier?opts.verifier(v):null;if(e){err.textContent=e;err.hidden=false;return}fin(v)};
  actions.querySelector('[data-dlg="valider"]').onclick=valider;
  const annuler=actions.querySelector('[data-dlg="annuler"]'); if(annuler) annuler.onclick=()=>fin(null);
  d.onclick=e=>{if(e.target===d)fin(null)};
  document.addEventListener('keydown',touche);
 });
}

 const reponse=await ouvrirDialogue({titre:'Marquer l’écart vérifié',
  texte:`${item.libelle}\n\nVerify reste retenu et le jour reste compté. Si le planning est faux, corrigez-le plutôt : le signalement disparaîtra de lui-même.`,
  champs:[{cle:'motif',label:'Motif',type:'textarea',placeholder:'Pourquoi cet écart est justifié'}],
  libelleValider:'Marquer vérifié',
  verifier:v=>String(v.motif||'').trim()?null:'Le motif est obligatoire.'});
 if(!reponse)return;
 btn.disabled=true;
 try{await NexusPayeDonnees.enregistrerDecision(nexusClient,{siteId:SITE,employeeId:btn.dataset.emp,periode:MOIS,item,statut:'valide',impactPaye:false,montantCentimes:null,note:`Écart vérifié : ${String(reponse.motif).trim()}`,actorId:EMPLOYEE.id});await reload()}
 catch(e){console.error('NEXUS PAYE — vérification du signalement :',e);btn.disabled=false;nexusErreur('Vérification non enregistrée',`NEXUS n'a pas pu enregistrer cette vérification : ${messageErreur(e)}\n\nRien n'a été modifié.`)}

async function decision(btn,valider){
 const item=trouver(btn.dataset.emp,btn.dataset.key);if(!item)return;
 if(valider&&item.contestationOuverte){nexusErreur('Transmission bloquée','La contestation de cet écart est encore ouverte. Traitez-la dans Verify avant de trancher ici.');return}
 if(valider&&item.typeItem==='retard_incoherent'){nexusErreur('Retard incohérent','Ce retard est techniquement incohérent. Corrigez le pointage source ou excluez ce signal, mais ne le validez pas.');return}
 let montant=null,impact=false,justif=null;
 if(valider&&item.typeItem==='ecart_caisse'){
  // Le montant n'est JAMAIS repris automatiquement : le manager saisit ce
  // qu'il transmet, en connaissance de cause (doctrine PAYE inchangée).
  const reponse=await ouvrirDialogue({titre:'Montant à transmettre à la comptabilité',
   texte:`${item.libelle}\n\nNEXUS ne reprend pas automatiquement le montant de référence : saisissez le montant exact que vous transmettez, en euros.`,
   champs:[{cle:'montant',label:'Montant transmis (€)',type:'number',pas:'0.01',min:'0',placeholder:'0,00'},{cle:'justification',label:'Justification (obligatoire)',type:'textarea',placeholder:'Pourquoi cet écart est transmis à la comptabilité'}],
   libelleValider:'Transmettre ce montant',
   verifier:v=>{const n=Number(String(v.montant).replace(',','.'));if(!(v.montant!==''&&Number.isFinite(n)&&n>=0))return 'Saisissez un montant positif, en euros.';return NexusPayeRegularisations.justificationRequise('transmettre',v.justification)?null:'La transmission exige une justification (au moins 5 caractères).'}});
  if(!reponse)return;
  montant=Math.round(Number(String(reponse.montant).replace(',','.'))*100);impact=true;
  justif=String(reponse.justification||'').trim();
 }else if(valider&&['heure_supplementaire','retard','absence_a_verifier','conge_paye','arret_maladie','jour_ferie','acompte','dette'].includes(item.typeItem)){impact=true}
 if(!valider&&item.typeItem==='ecart_caisse'){
  const r=await ouvrirDialogue({titre:'Écart sans impact paie',texte:`${item.libelle}\n\nUn écart classé sans impact paie doit dire pourquoi : l'auteur, la date et le statut précédent sont conservés.`,
   champs:[{cle:'justification',label:'Justification (obligatoire)',type:'textarea',placeholder:'Pourquoi cet écart est sans impact paie'}],
   libelleValider:'Classer sans impact paie',
   verifier:v=>NexusPayeRegularisations.justificationRequise('sans_impact',v.justification)?null:'La justification est obligatoire (au moins 5 caractères).'});
  if(!r)return;justif=String(r.justification).trim();
 }
 btn.disabled=true;
 try{await NexusPayeDonnees.enregistrerDecision(nexusClient,{siteId:SITE,employeeId:btn.dataset.emp,periode:MOIS,item,statut:valider?'valide':'exclu',impactPaye:impact,montantCentimes:montant,note:justif,actorId:EMPLOYEE.id});await reload()}
 catch(e){console.error('NEXUS PAYE — enregistrement de la décision :',e);btn.disabled=false;nexusErreur('Décision non enregistrée',`NEXUS n'a pas pu enregistrer cette décision : ${messageErreur(e)}\n\nRien n'a été modifié.`)}
}
function majPeriodeManuelle(){const debut=document.getElementById('manualDateDebut').value,fin=document.getElementById('manualDateFin').value,resume=document.getElementById('manualPeriodSummary'),btn=document.getElementById('addManual');if(!debut||!fin){resume.textContent='Choisissez la date de début et la date de fin.';btn.textContent='Ajouter et valider';return}try{const dates=NexusPayeDonnees.datesInclusives(debut,fin);resume.textContent=dates.length===1?'1 journée sélectionnée.':`${dates.length} jours sélectionnés, du ${new Date(`${debut}T12:00:00`).toLocaleDateString('fr-FR')} au ${new Date(`${fin}T12:00:00`).toLocaleDateString('fr-FR')}.`;btn.textContent=dates.length===1?'Ajouter et valider':`Ajouter ${dates.length} jours et valider`}catch(_){resume.textContent='La date de fin doit être postérieure ou égale à la date de début.';btn.textContent='Ajouter et valider'}}
// Marquage d'un écart. Rien d'autre que le statut et la justification ne
// part en base : ni quantité, ni montant, ni impact paie.
async function marquerEcart(b){
 const key=b.dataset.key, statut=b.dataset.statut, item=trouverEcart(key);
 if(!item){nexusErreur('Écart introuvable','Cet écart n’est plus dans le dossier affiché. Actualisez la page.');return;}
 const zone=document.querySelector(`.ecart-motif[data-key="${CSS.escape(key)}"]`);
 const motif=zone?String(zone.value||'').trim():'';
 if((statut==='corrige'||statut==='justifie')&&!motif){nexusErreur('Justification attendue','Un écart corrigé ou justifié doit dire pourquoi. Écrivez la justification, puis recommencez.');return;}
 const boutons=document.querySelectorAll(`.ecart-marquer[data-key="${CSS.escape(key)}"]`);
 boutons.forEach(x=>x.disabled=true);
 try{
  await NexusPayeDonnees.marquerTraitementAnomalie(nexusClient,{siteId:SITE,employeeId:item.employeeId||b.dataset.emp,periode:MOIS,item,statut,justification:motif,actorId:EMPLOYEE.id});
  await reload();
 }catch(e){console.error('NEXUS PAYE : marquage d un ecart :',e);boutons.forEach(x=>x.disabled=false);
  nexusErreur('Marquage impossible',`NEXUS n’a pas pu enregistrer ce traitement : ${messageErreur(e)}\n\nAucune heure n’a été modifiée, et votre justification est restée dans le champ.`);}
}

// Horaire exceptionnel (§5.4). La durée nette est recalculée par le moteur,
// jamais saisie, et la valeur initiale est conservée dans le detail.
// Champs de la carte « Horaire exceptionnel », rendue seulement quand la migration est posée
// (SAISIES_MANAGER) : lus ici, derrière un bouton qui n'existe qu'avec la carte.
const champHoraire=id=>document.querySelector('#'+id);
async function addHoraireExceptionnel(){
 const emp=champHoraire('hxEmployee').value, date=champHoraire('hxDate').value,
  debut=champHoraire('hxDebut').value, fin=champHoraire('hxFin').value,
  pause=champHoraire('hxPause').value, motif=String(champHoraire('hxMotif').value||'').trim(), justification=String(champHoraire('hxJustification').value||'').trim();
 if(!emp||!date){nexusErreur('Salarié et date obligatoires','Choisissez le salarié et la journée concernée.');return;}
 if(!motif){nexusErreur('Motif obligatoire','Un horaire exceptionnel doit porter son motif : la comptabilité doit pouvoir le relire dans six mois.');return;}
 if(!justification){nexusErreur('Justification obligatoire','Un horaire exceptionnel s’appuie sur une justification : pièce, accord ou constat.');return;}
 const nette=NexusPayeMoteur.dureeNetteHeures(debut,fin,Number(pause||0));
 if(nette==null){nexusErreur('Horaires invalides','La fin doit suivre le début, pause déduite.');return;}
 const fiche=RAPPORT.employes.find(f=>f.employee.id===emp);
 const jour=fiche?(fiche.items||[]).find(i=>i.date===date&&i.heuresAttribuees!=null):null;
 const initiales=jour?jour.heuresAttribuees:null;
 const ok=await nexusConfirmer('Enregistrer cet horaire exceptionnel',`${debut} à ${fin}, pause ${Number(pause||0)} min, soit ${nette} h nettes${initiales!=null?` au lieu de ${initiales} h`:''}.\n\nLes paramètres standards de la station ne changent pas.`,'Enregistrer');
 if(!ok)return;
 const btn=champHoraire('addHoraire');btn.disabled=true;
 try{
  await NexusPayeDonnees.enregistrerHoraireExceptionnel(nexusClient,{siteId:SITE,employeeId:emp,periode:MOIS,date,debut,fin,pauseMinutes:Number(pause||0),motif,justification,heuresInitiales:initiales,actorId:EMPLOYEE.id});
  await reload();
 }catch(e){console.error('NEXUS PAYE : horaire exceptionnel :',e);btn.disabled=false;
  nexusErreur('Enregistrement impossible',`NEXUS n’a pas pu enregistrer cet horaire : ${messageErreur(e)}\n\nRien n’a été modifié.`);}
}

async function addManual(){
 const employeeId=document.getElementById('manualEmployee').value,typeItem=document.getElementById('manualType').value,
  dateDebut=document.getElementById('manualDateDebut').value,dateFin=document.getElementById('manualDateFin').value||dateDebut,
  libelle=document.getElementById('manualLabel').value.trim(),min=document.getElementById('manualMinutes').value,montant=document.getElementById('manualAmount').value;
 if(!employeeId||!dateDebut||!dateFin||!libelle)return nexusErreur('Saisie incomplète','Employé, période et libellé sont obligatoires.');
 let dates;
 try{dates=NexusPayeDonnees.datesInclusives(dateDebut,dateFin)}catch(e){return nexusErreur('Période invalide',messageErreur(e))}
 if(dateDebut<MOIS||dateFin>dernierJourMois())return nexusErreur('Période hors du mois','Une variable du mois doit rester dans le mois affiché. Une absence qui déborde relève d’un événement RH.');
 if(montant!==''&&dates.length>1)return nexusErreur('Montant sur plusieurs jours','Un montant en euros doit être rattaché à une seule date, pour éviter de le répéter chaque jour.');
 if(['acompte','dette'].includes(typeItem)&&montant==='')return nexusErreur('Montant obligatoire','Le montant est obligatoire pour une dette ou un acompte.');
// §7 : par défaut le retard est de 0 minute. Il n'en vaut donc un que si
 // le manager en saisit la durée, et le libelle en porte le motif.
 if(typeItem==='retard'&&!(Number(min)>0))return nexusErreur('Durée obligatoire','Un retard se déclare avec sa durée en minutes, supérieure à zéro. Par défaut il est de 0 : il ne compte que si vous en saisissez la durée.');
 const m=montant===''?null:Math.round(Number(String(montant).replace(',','.'))*100);
 if(montant!==''&&!Number.isFinite(m))return nexusErreur('Montant invalide','Saisissez un montant en euros, par exemple 50 ou 50,00.');
 const btn=document.getElementById('addManual');btn.disabled=true;
 try{await NexusPayeDonnees.ajouterItemsManuels(nexusClient,{siteId:SITE,employeeId,periode:MOIS,dates,typeItem,libelle,
   quantiteMinutes:min===''?null:Number(min),montantCentimes:m,
   impactPaye:['acompte','dette','heure_supplementaire','jour_ferie','retard'].includes(typeItem),note:libelle,actorId:EMPLOYEE.id});
  await reload()}
 catch(e){console.error('NEXUS PAYE — ajout manuel :',e);btn.disabled=false;nexusErreur('Ajout impossible',messageErreur(e))}
}
// Déclaration d'un événement RH depuis le formulaire (03/09/2026).
// Écrit UNE ligne dans employee_indisponibilites — jamais N items de
// paie. C'est le chaînon qui manquait : jusqu'ici, l'écran proposait
// « congé payé » et « arrêt maladie » comme des variables journalières,
// ce qui recréait à la main exactement le dépliage que le moteur venait
// d'abolir. La période peut déborder du mois affiché : c'est même le cas
// normal (un congé maternité couvre six mois).
async function addRH(){
 const employeeId=document.getElementById('rhEmployee').value,motif=document.getElementById('rhMotif').value,
  debut=document.getElementById('rhDebut').value,indetermine=document.getElementById('rhIndetermine').checked,
  commentaire=document.getElementById('rhCommentaire').value.trim();
 let fin=document.getElementById('rhFin').value;
 if(!employeeId||!motif||!debut)return nexusErreur('Saisie incomplète','Salarié, motif et date de début sont obligatoires.');
 if(!fin&&!indetermine)return nexusErreur('Fin de période manquante','Indiquez une date de fin, ou cochez « Date de retour non connue ».');
 if(fin&&fin<debut)return nexusErreur('Période invalide','La date de fin précède la date de début.');
 // Retour non daté : date_fin ne sert que d'horizon provisoire, le moteur
 // prolonge l'absence tant que la reprise n'est pas déclarée.
 if(!fin)fin=dernierJourMois();
 const nom=(RAPPORT.employes.find(f=>f.employee.id===employeeId)||{employee:{}}).employee.nom||'ce salarié';
 const libelleMotif=(MOTIFS_RH.find(([v])=>v===motif)||[,motif])[1];
 if(!await nexusConfirmer('Déclarer cet événement RH ?',`${nom}\n${libelleMotif}\n${jjmmaaaaFR(debut)} → ${indetermine?'retour non daté':jjmmaaaaFR(fin)}\n\nDéclaré une fois, cet événement sera reporté sur chaque mois qu’il traverse et ne vous sera plus redemandé.`,'Déclarer l’événement'))return;
 const btn=document.getElementById('addRH');btn.disabled=true;
 try{await NexusPayeDonnees.declarerIndisponibilite(nexusClient,{siteId:SITE,employeeId,dateDebut:debut,dateFin:fin,motif,finIndeterminee:indetermine,commentaire:commentaire||null,actorId:EMPLOYEE.id});
  await reload()}
 catch(e){console.error('NEXUS PAYE — déclaration d’un événement RH :',e);btn.disabled=false;nexusErreur('Déclaration impossible',messageErreur(e))}
}
// A3 / B1-c (05/09/2026) — l'identité du commerce imprimée sur le dossier
// comptable. Elle était passée EN DUR ('ViTO Sainte-Marie') : l'écran ne
// lisait même pas la table `sites`, donc tout client exportait son dossier
// de paie au nom d'un autre. Trois branches, même règle qu'App et Cockpit :
// panne technique -> error, nom non configuré -> warn, et dans les deux cas
// un repli sur l'identifiant du commerce COURANT.
async function nomDuCommerce(){
 const {data,error}=await nexusClient.from('sites').select('nom_entreprise').eq('site_id',SITE).maybeSingle();
 if(error){console.error('Lecture identité du commerce :',error);return SITE||'Commerce non identifié'}
 if(!data||!data.nom_entreprise){console.warn('Identité du commerce non configurée — dossier au nom de l’identifiant du site.');return SITE||'Commerce non identifié'}
 return data.nom_entreprise
}

 btn.disabled=true;btn.textContent='Génération…';

 finally{btn.disabled=false;btn.textContent='2 · Générer le dossier comptable'}
}
