<style>
:root{--bg:#0B0F14;--panel:#141B22;--raised:#1A222C;--line:#242E38;--text:#EDF1F5;--mid:#8A96A5;--dim:#57626F;--green:#34D399;--cyan:#4FC3D9;--amber:#F5A623;--red:#F0546B;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}html,body{background:var(--bg);color:var(--text);font-family:var(--sans)}body{display:flex;justify-content:center;min-height:100vh}.phone{width:100%;max-width:760px;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.header{padding:20px;position:relative}.menu{position:absolute;right:18px;top:18px;color:var(--cyan);border:1px solid rgba(79,195,217,.3);background:rgba(79,195,217,.1);padding:7px 12px;border-radius:20px;text-decoration:none;font:600 10.5px var(--mono)}.eyebrow,.section-label{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--cyan)}h1{font-size:22px;margin-top:4px}.subtitle{font:11px/1.55 var(--mono);color:var(--dim);margin-top:5px;max-width:620px}.divider{height:1px;background:var(--line)}main{padding:16px 20px 28px}.period{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.period button,.btn{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:10px 12px;cursor:pointer;font:600 11px var(--mono)}.period strong{font:700 14px var(--mono);text-transform:capitalize}.status{font:700 10px var(--mono);padding:5px 9px;border-radius:12px;background:rgba(245,166,35,.14);color:var(--amber)}.status.verifie{background:rgba(52,211,153,.14);color:var(--green)}.status.transmis{background:rgba(79,195,217,.14);color:var(--cyan)}.hero{padding:16px;background:linear-gradient(135deg,rgba(79,195,217,.12),rgba(52,211,153,.05));border:1px solid rgba(79,195,217,.28);border-radius:13px;margin-bottom:10px}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero h2{font-size:16px;margin-bottom:5px}.hero p{font:10.5px/1.5 var(--mono);color:var(--mid)}.quick-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}.quick-nav button{border:1px solid var(--line);background:var(--panel);color:var(--mid);border-radius:9px;padding:10px 6px;font:600 10px var(--mono);cursor:pointer}.quick-nav button:first-child{color:var(--amber);border-color:rgba(245,166,35,.25)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}.kpi span{display:block;font:9px var(--mono);color:var(--dim);text-transform:uppercase}.kpi b{display:block;font:700 20px var(--mono);margin-top:5px}.kpi.warn b{color:var(--amber)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.section-head{display:flex;align-items:center;gap:7px;margin:18px 0 10px;scroll-margin-top:12px}.section-head .section-label{margin:0}.section-label{color:var(--dim);margin-bottom:11px}.info-btn{width:22px;height:22px;border:1px solid rgba(79,195,217,.35);border-radius:50%;background:rgba(79,195,217,.09);color:var(--cyan);font:700 10px var(--mono);cursor:pointer;flex:none}.alert{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:9px;padding:11px 12px;color:var(--amber);font-size:12px;line-height:1.5;margin-bottom:8px}.ok{color:var(--green);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#071217}.btn.success{background:var(--green);border-color:var(--green);color:#07150f}.btn.danger{color:var(--red)}.btn:disabled{opacity:.35;cursor:not-allowed}.review-card{background:var(--panel);border:1px solid rgba(245,166,35,.26);border-radius:11px;padding:12px;margin-bottom:8px}.review-system{border-color:var(--line)}.review-name{font-size:11px;color:var(--mid);margin-bottom:5px}.employee{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden}.employee-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px;cursor:pointer}.employee-name{font-weight:700;text-transform:capitalize}.meta{font:10.5px/1.5 var(--mono);color:var(--mid);margin-top:3px}.summary-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.summary-chip{font:9px var(--mono);color:var(--mid);background:var(--raised);padding:4px 6px;border-radius:7px}.pill{font:700 9px var(--mono);padding:4px 7px;border-radius:9px;background:var(--raised);color:var(--mid);white-space:nowrap}.pill.green{color:var(--green);background:rgba(52,211,153,.12)}.pill.amber{color:var(--amber);background:rgba(245,166,35,.12)}.pill.info{color:var(--cyan);background:rgba(79,195,217,.12)}.employee-body{display:none;border-top:1px solid var(--line);padding:12px 14px}.employee.open .employee-body{display:block}.item{padding:10px;background:var(--raised);border:1px solid var(--line);border-radius:8px;margin-bottom:7px}.item-top{display:flex;justify-content:space-between;gap:10px}.item-title{font-size:12.5px;font-weight:600}.item-date{font:10px var(--mono);color:var(--dim);white-space:nowrap}.item-meta{font:10.5px/1.5 var(--mono);color:var(--mid);margin-top:4px}.ecart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.ecart-cell{background:var(--panel);border-radius:7px;padding:7px}.ecart-cell span{display:block;font:8px var(--mono);color:var(--dim);text-transform:uppercase}.ecart-cell b{display:block;font:11px var(--mono);margin-top:3px}.source-link{display:inline-block;color:var(--cyan);font:600 9.5px var(--mono);text-decoration:none;margin-top:7px}.item-actions{display:flex;gap:6px;margin-top:8px}.item-actions .btn{padding:7px 9px;font-size:9.5px}.item.valide{border-color:rgba(52,211,153,.3)}.item.information{border-color:rgba(79,195,217,.25)}.item.exclu{opacity:.65}.item.blocked{border-color:rgba(240,84,107,.45)}.empty{font-size:12px;color:var(--dim);font-style:italic}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.date-range{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font:9.5px var(--mono);text-transform:uppercase;color:var(--dim);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px;font:12px var(--sans)}.field.full{grid-column:1/-1}.help{font:10.5px/1.55 var(--mono);color:var(--dim);margin-top:8px}.accountant-list{display:grid;gap:7px;margin:10px 0 12px}.accountant-line{display:flex;align-items:center;gap:8px;color:var(--mid);font-size:11px}.accountant-line::before{content:'✓';color:var(--green);font-weight:700}.modal{position:fixed;inset:0;background:rgba(3,8,12,.76);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50}.modal[hidden]{display:none}.modal-card{width:min(430px,100%);background:var(--panel);border:1px solid rgba(79,195,217,.35);border-radius:14px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.45)}.modal-card h3{font-size:15px;margin-bottom:8px}.modal-card p{font:11px/1.65 var(--mono);color:var(--mid);white-space:pre-line}.modal-card .btn{margin-top:14px}.modal-card.large{width:min(540px,100%);max-height:86vh;overflow:auto}.modal-card.danger{border-color:rgba(240,84,107,.45)}.modal-champ{margin-top:12px;text-align:left}.modal-champ label{display:block;font:9.5px var(--mono);text-transform:uppercase;color:var(--dim);margin-bottom:4px}.modal-champ .aide{font:10px/1.5 var(--mono);color:var(--dim);margin-top:4px}.modal-card input,.modal-card select,.modal-card textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px;font:12px var(--sans)}.modal-champ.case{display:flex;align-items:center;gap:8px}.modal-champ.case input{width:auto}.modal-champ.case label{margin:0;text-transform:none;font:11px var(--mono);color:var(--mid)}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.modal-actions .btn{margin-top:0}.modal-erreur{color:var(--red);font:10.5px/1.5 var(--mono);margin-top:10px}.modal-erreur[hidden]{display:none}.pill.red{color:var(--red);background:rgba(240,84,107,.12)}.vars{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.var{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px}.var span{display:block;font:8.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.05em}.var b{display:block;font:700 15px var(--mono);margin-top:4px}.var small{display:block;font:9px/1.4 var(--mono);color:var(--mid);margin-top:3px}.var.vide b{color:var(--dim)}.var.attente{border-color:rgba(245,166,35,.32)}.var.attente small{color:var(--amber)}.var.pleine{grid-column:1/-1}.detail-zone{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}.detail-zone[hidden]{display:none}.rh-bloc{display:grid;gap:3px;margin-bottom:6px}.rh-motif-titre{font-size:13.5px;font-weight:700}.rh-periode{font:600 11.5px var(--mono);color:var(--cyan)}.rh-couverture{font:10.5px var(--mono);color:var(--mid)}.loading{text-align:center;padding:44px 10px;color:var(--dim);font:11px var(--mono)}footer{padding:18px;text-align:center;border-top:1px solid var(--line);color:var(--dim);font:10px var(--mono)}@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick-nav{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;margin-top:2px}.ecart-grid{grid-template-columns:1fr 1fr}.ecart-cell:last-child{grid-column:1/-1}}

<body><div class="phone">
<header class="header"><a class="menu" href="NEXUS-App-v1.html">☰ Menu</a><div class="eyebrow">NEXUS · Manager</div><h1>Paye</h1><div class="subtitle">Préparer les variables pour la comptable à partir des faits disponibles. NEXUS distingue toujours ce qui est mesuré, reconstitué et arbitré.</div></header>
<div class="divider"></div>
<main id="app"><div class="loading">Chargement du dossier mensuel…</div></main>
<footer>NEXUS prépare les variables · la comptable établit le bulletin</footer>
</div>
<script>
let EMPLOYEE, SITE, RAPPORT, MOIS = NexusPayeMoteur.moisISO(new Date());
const LIBELLES={absence_a_qualifier:'Absence à qualifier',absence_qualifiee:'Absence qualifiée',presence_exceptionnelle:'Présence exceptionnelle',absence_a_verifier:'Absence à vérifier',conge_paye:'Congé payé',arret_maladie:'Arrêt maladie',retard:'Retard',retard_incoherent:'Retard incohérent',heure_supplementaire:'Heure supplémentaire',jour_ferie:'Jour férié',acompte:'Acompte',dette:'Dette / avance qualifiée',ecart_caisse:'Écart de caisse qualifié',autre:'Autre variable'};
const INFOS={dossier:['Dossier mensuel','NEXUS prépare les variables et les preuves. La comptable reste responsable du bulletin. Aucune retenue n’est appliquée automatiquement.'],preuves:['Présence confirmée','Le planning indique ce qui était prévu. Verify et le pointage apportent les preuves de présence réelle. Une présence reconstituée reste signalée comme telle.'],arbitrage:['À vérifier','Cette zone rassemble uniquement les décisions qui nécessitent votre intervention avant de préparer le dossier comptable.'],ecart:['Écart de caisse','Un écart positif ou négatif reste visible pour la traçabilité. Il ne devient jamais automatiquement une dette du salarié ni une retenue sur paie.'],export:['Dossier comptable','L’export contient les présences confirmées, les variables validées et les écarts informatifs. Les éléments encore à vérifier ne sont jamais transmis.'],periode:['Saisie sur une période','Pour une seule journée, utilisez la même date dans « Du » et « Au ». Pour plusieurs jours, NEXUS conserve une ligne datée par journée. Les congés et absences ne se saisissent pas ici : ils relèvent d’un événement RH.'],evenementRH:['Événement RH','Une absence longue, un congé, une maternité, une paternité, une formation ou un arrêt maladie est UN événement, avec une date de début et une date de fin — jamais une ligne par jour. Déclaré une fois, il est reporté automatiquement sur chaque mois qu’il traverse, y compris quand la date de retour n’est pas encore connue.'],statutSalarie:['Statut du salarié','Prêt : plus rien à décider. À vérifier : les données sont là, un arbitrage reste à rendre. Donnée manquante : il manque un paramétrage ou toute donnée du mois. Le statut du mois est celui du salarié le plus en retard.']};
// Les seuls types encore saisissables JOURNÉE PAR JOURNÉE. Congés,
// maladie, maternité, paternité, formation et absences longues n'y sont
// plus : ce sont des événements RH, portés par une période unique
// (03/09/2026). Le refus est aussi posé dans nexus-paye-donnees.js.
const TYPES_VARIABLE_MANUELLE=['presence_exceptionnelle','heure_supplementaire','jour_ferie','acompte','dette','autre'];
const MOTIFS_RH=[['conge_maternite','Congé maternité'],['arret_maladie','Arrêt maladie'],['conge','Congé'],['conge_paternite','Congé paternité'],['formation','Formation'],['autre','Autre']];
const STATUTS_SALARIE={pret:['Prêt','green'],a_verifier:['À vérifier','amber'],donnee_manquante:['Donnée manquante','red'],hors_paie:['Hors paie','']};
const ECHAPPE=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const infoBtn=(cle,label)=>`<button type="button" class="info-btn" data-info="${cle}" aria-label="Information${label?` : ${ECHAPPE(label)}`:''}">i</button>`;
const euros=c=>c==null?'—':`${c>0?'+':''}${(c/100).toFixed(2)} €`;
// P2 (03/09/2026) : « vérifié » est un mot d'ingénieur. Ce que le
// manager doit lire, c'est où en est le dossier vis-à-vis de la comptable.
const LIBELLE_STATUT_DOSSIER={brouillon:'en préparation',verifie:'prêt pour comptabilité',transmis:'transmis'};
const jjmmaaaaFR=iso=>{const p=String(iso||'').slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(iso||'')};
const pluriel=(n,mot)=>`${n} ${mot}${n>1?'s':''}`;
const pillStatut=st=>{const [l,c]=STATUTS_SALARIE[st]||STATUTS_SALARIE.hors_paie;return `<span class="pill ${c}">${l}</span>`};
function lienPlanningSecurise(){const brut=RAPPORT&&RAPPORT.planningOfficiel&&RAPPORT.planningOfficiel.url;try{const u=new URL(brut);return u.protocol==='https:'&&u.hostname==='docs.google.com'&&u.pathname.startsWith('/spreadsheets/d/')?u.href:''}catch(_){return''}}
function moisLabel(){return new Date(`${MOIS}T12:00:00`).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});}
function dernierJourMois(){const d=new Date(`${NexusPayeMoteur.finMoisISO(MOIS)}T12:00:00`);d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function etatPeriode(){return (RAPPORT.periodeEnregistree&&RAPPORT.periodeEnregistree.statut)||'brouillon';}
function itemMeta(i){const q=i.quantiteMinutes!=null?`${i.quantiteMinutes} min`:'';const m=i.montantCentimes!=null?`${(i.montantCentimes/100).toFixed(2)} €`:'';return [LIBELLES[i.typeItem]||i.typeItem,q,m,i.contestationOuverte?'Contestation ouverte — transmission bloquée':''].filter(Boolean).join(' · ')}
function render(){
 const s=RAPPORT.synthese, statut=etatPeriode();
 const decisions=RAPPORT.items.filter(i=>i.statut==='a_verifier'||i.contestationOuverte);
 const informations=RAPPORT.items.filter(i=>i.statut==='information');
 const blocagesSysteme=RAPPORT.bloqueurs.filter(b=>b.categorie==='configuration'||(!b.categorie&&!b.sourceCle));
 document.getElementById('app').innerHTML=`
 <div class="period"><button id="prev">←</button><strong>${moisLabel()}</strong><span class="status ${statut}">${LIBELLE_STATUT_DOSSIER[statut]||statut}</span><button id="next">→</button></div>
 <section class="hero"><div class="hero-top"><div><h2>${RAPPORT.bloqueurs.length?`${RAPPORT.bloqueurs.length} point${RAPPORT.bloqueurs.length>1?'s':''} à traiter`:'Mois prêt à être validé'}</h2><p>${RAPPORT.bloqueurs.length?`NEXUS a regroupé les décisions nécessaires. ${s.salariesDonneeManquante?`${s.salariesDonneeManquante} salarié(s) attendent une donnée, ${s.salariesAVerifier} un arbitrage.`:'Commencez par la boîte À vérifier.'}`:'Toutes les variables connues sont arbitrées. Validez le mois, puis générez le dossier comptable.'}</p></div>${infoBtn('dossier','dossier mensuel')}</div>${RAPPORT.bloqueurs.length?'<button class="btn primary jump-review" style="margin-top:12px">Examiner les points à vérifier</button>':''}</section>
 <nav class="quick-nav" aria-label="Navigation PAYE"><button data-jump="reviewSection">À vérifier${s.aVerifier?` · ${s.aVerifier}`:''}</button><button data-jump="employeesSection">Salariés</button><button data-jump="accountantSection">Dossier comptable</button></nav>
 ${RAPPORT.planningOfficiel&&RAPPORT.planningOfficiel.source==='google_sheets'?`<div class="card"><div class="section-label">Planning officiel</div><div class="help" style="margin:0;">Google Sheets est la prévision officielle. PAYE la rapproche toujours des preuves réelles Verify et Pointage.${lienPlanningSecurise()?` <a href="${ECHAPPE(lienPlanningSecurise())}" target="_blank" rel="noopener" style="color:var(--green);">Ouvrir le planning ↗</a>`:''}</div></div>`:''}
 <div class="kpis"><div class="kpi"><span>Salariés suivis</span><b>${s.salariesInclus}</b></div><div class="kpi"><span>Heures confirmées</span><b>${s.heuresConfirmees} h</b></div><div class="kpi"><span>Salariés prêts</span><b>${s.salariesPrets}/${s.salariesInclus}</b></div><div class="kpi warn"><span>À vérifier</span><b>${s.aVerifier}</b></div></div>${s.salariesDonneeManquante?`<div class="alert">${s.salariesDonneeManquante} salarié(s) en « donnée manquante » : leur fiche est incomplète et ne doit pas partir en paie.</div>`:''}
 ${blocagesSysteme.length?`<div class="section-head"><div class="section-label">Configuration requise · ${blocagesSysteme.length}</div></div>
 <section>${blocagesSysteme.map(b=>`<div class="review-card review-system"><div class="review-name">Paramétrage</div><div class="item-title">${ECHAPPE(b.libelle)}</div><div class="item-meta">Réglage permanent — à compléter une fois, pas un arbitrage du mois.</div><button class="btn jump-employees" style="margin-top:8px">Configurer</button></div>`).join('')}</section>`:''}
 <div class="section-head" id="reviewSection"><div class="section-label">Éléments de paie à vérifier${decisions.length?` · ${decisions.length}`:''}</div>${infoBtn('arbitrage','arbitrages')}</div>
 <section>${!decisions.length?'<div class="card ok">✓ Aucun arbitrage en attente.</div>':decisions.map(i=>`<div class="review-card"><div class="review-name">${ECHAPPE(i.employeeNom||'Employé à identifier')}</div>${renderItem(null,i)}</div>`).join('')}</section>
 ${informations.length?`<section class="card"><div class="section-label" style="display:flex;align-items:center;gap:7px">Informations sans impact paie · ${informations.length} ${infoBtn('ecart','écarts informatifs')}</div><div class="help" style="margin:0 0 9px">Ces éléments restent visibles pour la traçabilité mais ne bloquent pas le dossier.</div>${informations.map(i=>renderItem(null,i)).join('')}</section>`:''}
 <div class="section-head" id="employeesSection"><div class="section-label">Salariés · ${s.salariesPrets}/${s.salariesInclus} prêts</div>${infoBtn('statutSalarie','statut du salarié')}</div>
 <section>${RAPPORT.employes.map(renderEmployee).join('')}</section>
 <div class="section-head" id="accountantSection"><div class="section-label">Dossier comptable</div>${infoBtn('export','export comptable')}</div>

// Carte salarié (03/09/2026, P1 demandé par Frédéric). Elle affiche
// désormais directement les VARIABLES COMPTABLES agrégées — présence,
// absence, CP, maladie/maternité, retards, heures supplémentaires, jours
// fériés, éléments financiers — c'est-à-dire ce que la comptable recopie.
// Les événements journaliers et leurs sources ne disparaissent pas : ils
// passent au second plan, derrière « Voir le détail ». L'agrégation vient
// de NexusPayeMoteur.variablesComptables, la même que celle du dossier
// PDF : l'écran et le document ne peuvent pas diverger.
function tuile(label,valeur,sous,options){
 const o=options||{};
 return `<div class="var${o.vide?' vide':''}${o.attente?' attente':''}${o.pleine?' pleine':''}"><span>${ECHAPPE(label)}</span><b>${ECHAPPE(valeur)}</b>${sous?`<small>${ECHAPPE(sous)}</small>`:''}</div>`;
}
function renderVariables(v){
 const attente=n=>n?`${n} en attente d’arbitrage`:'';
 const fin=v.financier, totalFin=fin.acompteCentimes+fin.detteCentimes+fin.retenueEcartCentimes;
 const detailFin=[fin.acompteCentimes?`acompte ${euros(fin.acompteCentimes)}`:'',fin.detteCentimes?`dette ${euros(fin.detteCentimes)}`:'',fin.retenueEcartCentimes?`écart retenu ${euros(fin.retenueEcartCentimes)}`:'',fin.ecartsInformatifs?`${pluriel(fin.ecartsInformatifs,'écart')} informatif${fin.ecartsInformatifs>1?'s':''}`:''].filter(Boolean).join(' · ');
 return `<div class="vars">`
  +tuile('Présence',`${v.presence.heures} h`,`${pluriel(v.presence.jours,'jour')} confirmé${v.presence.jours>1?'s':''}${v.presence.joursReconstitues?` · ${v.presence.joursReconstitues} reconstitué${v.presence.joursReconstitues>1?'s':''}`:''}`,{vide:!v.presence.heures})
  +tuile('Absence non déclarée',String(v.absence.jours),attente(v.absence.enAttente)||(v.absence.jours?'retenue en paie':'aucune'),{vide:!v.absence.jours,attente:!!v.absence.enAttente})
  +tuile('Congés payés',String(v.congesPayes.jours),v.congesPayes.evenements?`${pluriel(v.congesPayes.evenements,'événement')}`:'aucun',{vide:!v.congesPayes.jours})
  +tuile('Maladie / maternité',String(v.maladieMaternite.jours),v.maladieMaternite.detail.map(e=>e.libelle).join(' · ')||'aucune',{vide:!v.maladieMaternite.jours})
  +tuile('Retards',v.retards.minutes?`${v.retards.minutes} min`:'0',attente(v.retards.enAttente)||(v.retards.occurrences?`sur ${pluriel(v.retards.occurrences,'jour')}`:'aucun'),{vide:!v.retards.minutes,attente:!!v.retards.enAttente})
  +tuile('Heures supplémentaires',`${v.heuresSupplementaires.heures} h`,attente(v.heuresSupplementaires.enAttente)||(v.heuresSupplementaires.heuresDejaIncluses?`${v.heuresSupplementaires.heuresDejaIncluses} h déjà comprises dans la présence`:'validées'),{vide:!v.heuresSupplementaires.heures,attente:!!v.heuresSupplementaires.enAttente})
  +tuile('Jours fériés',String(v.joursFeries.jours),attente(v.joursFeries.enAttente)||'travaillés',{vide:!v.joursFeries.jours,attente:!!v.joursFeries.enAttente})
  +tuile('Éléments financiers',totalFin?euros(totalFin):'—',attente(fin.enAttente)||detailFin||'aucun',{vide:!totalFin,attente:!!fin.enAttente})
  +(v.autresAbsences.jours?tuile('Autres absences qualifiées',String(v.autresAbsences.jours),v.autresAbsences.detail.map(e=>e.libelle).join(' · '),{pleine:true}):'')
  +`</div>`;
}
function renderEmployee(f){
 const inclus=f.reglage.inclus,id=f.employee.id;
 // Trois statuts, et trois seulement (P1) : le badge dit toujours Prêt,
 // À vérifier ou Donnée manquante — un rattachement jamais confirmé EST
 // une donnée manquante, pas une nuance de plus.
 const statut=pillStatut(f.statut);
 const v=inclus?NexusPayeMoteur.variablesComptables(f):null;
 const corps=!inclus
  ?`<div class="empty">Cet employé ne figure pas dans le dossier de paie de la station.${f.reglage.commentaire?` ${ECHAPPE(f.reglage.commentaire)}`:''}</div>`
  :`${f.reglage.confirme?'':'<div class="alert">Rattachement à la paie jamais confirmé : confirmez-le pour que ce salarié puisse être déclaré prêt.</div>'}${renderVariables(v)}`
   +`<div class="actions"><button class="btn configure" data-id="${id}">Configurer le rattachement</button><button class="btn detail-toggle" data-emp="${id}">Voir le détail des sources et événements</button></div>`
   +`<div class="detail-zone" data-emp="${id}" hidden>${f.items.length?f.items.map(i=>renderItem(f,i)).join(''):'<div class="empty">Aucun événement particulier détecté sur ce mois.</div>'}</div>`;
 return `<article class="employee" data-employee="${id}"><div class="employee-head"><div><div class="employee-name">${ECHAPPE(f.employee.nom)}</div><div class="meta">${ECHAPPE(f.employee.role||'')}${inclus?` · ${f.heuresConfirmees.toFixed(2)} h · ${pluriel(f.joursConfirmes.size,'jour')}`:''}</div></div>${statut}</div><div class="employee-body">${corps}</div></article>`;
}
// Qualifier une période une seule fois. Le manager choisit un motif puis
// confirme ; NEXUS écrit sur l'ÉVÉNEMENT, ce qui vaut pour tous les mois
// suivants. « Date de retour non connue » évite de forcer une date inventée.
// Déclarer une absence CONSTATÉE comme événement RH. Même formulaire que la
// qualification : le manager ne doit pas apprendre deux vocabulaires selon
// que l'absence a été prévue ou découverte après coup.
function blocDeclaration(i,emp){
 const sel=MOTIFS_RH.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
 return `<div class="item-actions" style="flex-direction:column;align-items:stretch;gap:8px">
  <label style="font-size:11px;opacity:.75">Motif de l'absence
   <select class="rh-motif-new" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}" style="width:100%;margin-top:4px;padding:8px;border-radius:8px">
    <option value="">— à qualifier —</option>${sel}</select></label>
  <label style="font-size:11px;opacity:.75;display:flex;align-items:center;gap:6px">
   <input type="checkbox" class="rh-indetermine-new" data-key="${ECHAPPE(i.sourceCle)}"> Date de retour non connue</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn primary rh-declarer" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}"
     data-debut="${ECHAPPE(i.date||'')}" data-fin="${ECHAPPE(i.dateFin||i.date||'')}">Déclarer l’absence</button>
   <button class="btn exclude" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}">Ignorer cette détection</button>
  </div>
  <div style="font-size:10px;opacity:.6">Déclarée une fois, cette absence ne vous sera plus redemandée les mois suivants.</div>
 </div>`}
function blocQualification(i){
 const sel=MOTIFS_RH.map(([v,l])=>`<option value="${v}"${i.motif===v?' selected':''}>${l}</option>`).join('');
 return `<div class="item-actions" style="flex-direction:column;align-items:stretch;gap:8px">
  <label style="font-size:11px;opacity:.75">Motif de l'absence
   <select class="rh-motif" data-ev="${ECHAPPE(i.evenementId)}" style="width:100%;margin-top:4px;padding:8px;border-radius:8px">
    <option value="">— à qualifier —</option>${sel}</select></label>
  <label style="font-size:11px;opacity:.75;display:flex;align-items:center;gap:6px">
   <input type="checkbox" class="rh-indetermine" data-ev="${ECHAPPE(i.evenementId)}"${i.finIndeterminee?' checked':''}> Date de retour non connue</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn primary rh-confirmer" data-ev="${ECHAPPE(i.evenementId)}">Confirmer la période</button>
   <button class="btn rh-reprise" data-ev="${ECHAPPE(i.evenementId)}">Salarié revenu…</button>
  </div>
  <div style="font-size:10px;opacity:.6">Une seule confirmation couvre toute la période, y compris les mois suivants.</div>
 </div>`}
function renderItem(f,i){
 const emp=i.employeeId||(f&&f.employee.id)||'',periode=i.origine==='indisponibilite',
  statut=i.statut==='a_verifier'?'à vérifier':i.statut==='information'?'information':i.statut==='valide'?'validé':'sans impact paie',
  ecart=i.typeItem==='ecart_caisse',
  actions=i.statut==='a_verifier'&&!i.attributionRequise?(periode&&i.evenementId?blocQualification(i):i.serieAbsence?blocDeclaration(i,emp):`<div class="item-actions"><button class="btn exclude" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}">${ecart?'Sans impact paie':'Ne pas retenir'}</button><button class="btn ${ecart?'primary':''} validate" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}">${ecart?'Transmettre à la comptable':'Confirmer'}</button></div>`):'',
  source=i.deepLink?`<a class="source-link" href="${ECHAPPE(i.deepLink)}">${i.attributionRequise?'Corriger l’attribution dans':'Voir le contrôle'} ${i.origine==='fdj'?'FDJ':'Verify'} ↗</a>`:'';
 // Un événement RH se lit en trois lignes — motif, période couverte,
 // nombre de jours — et non comme une phrase datée noyée dans un libellé
 // (03/09/2026). C'est la forme que Frédéric a demandée, et c'est aussi
 // celle que reprend le dossier comptable PDF.
 let entete;
 if(i.evenementRH){
  const debordement=[];
  if(i.evenementDebut&&i.evenementDebut<i.date) debordement.push(`commencé le ${jjmmaaaaFR(i.evenementDebut)}`);
  if(i.dateReprise) debordement.push(`reprise le ${jjmmaaaaFR(i.dateReprise)}`);
  else if(i.finIndeterminee) debordement.push('retour non daté');
  else if(i.evenementFin&&i.evenementFin>i.dateFin) debordement.push(`jusqu’au ${jjmmaaaaFR(i.evenementFin)}`);
  entete=`<div class="rh-bloc"><div class="rh-motif-titre">${ECHAPPE(i.motifLibelle||i.libelle)}</div>`
   +`<div class="rh-periode">${jjmmaaaaFR(i.date)} → ${jjmmaaaaFR(i.dateFin||i.date)}</div>`
   +`<div class="rh-couverture">${pluriel(i.joursMois||0,'jour')} couvert${(i.joursMois||0)>1?'s':''}${debordement.length?` · ${ECHAPPE(debordement.join(' · '))}`:''}</div></div>`;
 }else{
  entete=`<div class="item-top"><div class="item-title">${ECHAPPE(i.libelle)}</div><div class="item-date">${periode&&i.joursMois?pluriel(i.joursMois,'jour'):(i.date||'')}${i.quart?` · Q${ECHAPPE(i.quart)}`:''}</div></div>`;
 }
 // Pour un événement RH, le décompte est déjà dans l'en-tête : on ne
 // garde du détail que ce qu'il n'a pas dit.
 let detail=i.detail||'';
 if(i.evenementRH){
  const c=[];
  if(i.joursPlanifiesMois) c.push(`${pluriel(i.joursPlanifiesMois,'jour')} normalement travaillé${i.joursPlanifiesMois>1?'s':''}`);
  if(i.contradiction) c.push(`${pluriel((i.joursAvecPreuve||[]).length,'jour')} avec présence constatée`);
  detail=c.join(' · ');
 }
 return `<div class="item ${i.statut} ${i.bloquantTechnique?'blocked':''}">${entete}`
  +`${detail?`<div class="item-meta">${ECHAPPE(detail)}${i.heuresAttribuees!=null?` <button class="h-edit" data-key="${ECHAPPE(i.sourceCle)}" title="Corriger les heures retenues" aria-label="Corriger les heures retenues" style="background:none;border:0;color:inherit;opacity:.7;cursor:pointer;padding:0 2px">✎</button>`:''}</div>`:''}`
  +`${i.heuresAttribuees!=null?`<div class="h-box" data-key="${ECHAPPE(i.sourceCle)}" hidden style="display:flex;align-items:center;gap:6px;margin:2px 0 6px"><input class="h-val" type="number" min="0" max="24" step="0.25" value="${i.heuresAttribuees}" style="width:72px;padding:6px;border-radius:8px"><span style="font-size:11px;opacity:.7">h retenues</span><button class="btn h-save" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}">Enregistrer</button></div>`:''}`
  +`${ecart?`<div class="ecart-grid"><div class="ecart-cell"><span>Initial</span><b>${euros(i.ecartInitialCentimes)}</b></div><div class="ecart-cell"><span>Final validé</span><b>${euros(i.ecartFinalCentimes)}</b></div><div class="ecart-cell"><span>Impact paie</span><b>${i.impactPaye?'Oui':'Aucun'}</b></div></div>`:''}`
  +`<div class="item-meta">${ECHAPPE(itemMeta(i))} · ${statut}${i.causeCode?` · motif : ${ECHAPPE(i.causeCode.replaceAll('_',' '))}`:''}</div>${source}${actions}</div>`;
}

// ─── Modales NEXUS (03/09/2026) ────────────────────────────────────────
// Les boîtes natives du navigateur (prompt / alert / confirm) sont
// bannies de PAYE : elles ne portent ni le vocabulaire ni les garde-fous
// de NEXUS, elles bloquent l'interface, et sur iOS en PWA elles sont
// parfois purement ignorées — un manager pouvait croire avoir répondu à
// une question qui ne lui avait jamais été posée. Tout passe désormais
// par une modale graphique, avec ses champs typés et sa validation.
let DIALOGUE = null;
function socleDialogue(){
 if(DIALOGUE) return DIALOGUE;
 const d=document.createElement('div');
 d.className='modal'; d.id='nexusDialogue'; d.hidden=true;
 d.innerHTML='<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dlgTitre"><h3 id="dlgTitre"></h3><p id="dlgTexte"></p><div id="dlgChamps"></div><div class="modal-erreur" id="dlgErreur" hidden></div><div class="modal-actions" id="dlgActions"></div></div>';
 document.body.appendChild(d);
 DIALOGUE=d; return d;
}
function champDialogue(c){
 const id=`dlg_${c.cle}`;
 if(c.type==='checkbox') return `<div class="modal-champ case"><input type="checkbox" id="${id}" name="${ECHAPPE(c.cle)}"${c.valeur?' checked':''}><label for="${id}">${ECHAPPE(c.label)}</label></div>`;
 let controle;
 if(c.type==='select') controle=`<select id="${id}" name="${ECHAPPE(c.cle)}">${(c.options||[]).map(([v,l])=>`<option value="${ECHAPPE(v)}"${String(c.valeur)===String(v)?' selected':''}>${ECHAPPE(l)}</option>`).join('')}</select>`;
 else if(c.type==='textarea') controle=`<textarea id="${id}" name="${ECHAPPE(c.cle)}" rows="${c.lignes||2}" placeholder="${ECHAPPE(c.placeholder||'')}">${ECHAPPE(c.valeur||'')}</textarea>`;
 else controle=`<input id="${id}" name="${ECHAPPE(c.cle)}" type="${ECHAPPE(c.type||'text')}" value="${ECHAPPE(c.valeur==null?'':c.valeur)}"${c.min!=null?` min="${ECHAPPE(c.min)}"`:''}${c.max!=null?` max="${ECHAPPE(c.max)}"`:''}${c.pas?` step="${ECHAPPE(c.pas)}"`:''} placeholder="${ECHAPPE(c.placeholder||'')}">`;
 return `<div class="modal-champ"><label for="${id}">${ECHAPPE(c.label)}</label>${controle}${c.aide?`<div class="aide">${ECHAPPE(c.aide)}</div>`:''}</div>`;
}
// Résout avec un objet { cle: valeur } si l'utilisateur valide, `null`
// s'il annule (échap, clic hors carte, bouton Annuler) — jamais une
// exception : annuler n'est pas une erreur.
function ouvrirDialogue(opts){
 const d=socleDialogue(), carte=d.querySelector('.modal-card'), champs=opts.champs||[];
 carte.classList.toggle('danger',!!opts.danger);
 carte.classList.toggle('large',champs.length>2);
 d.querySelector('#dlgTitre').textContent=opts.titre||'';
 const p=d.querySelector('#dlgTexte'); p.textContent=opts.texte||''; p.hidden=!opts.texte;
 const err=d.querySelector('#dlgErreur'); err.hidden=true; err.textContent='';
 const zone=d.querySelector('#dlgChamps'); zone.innerHTML=champs.map(champDialogue).join('');
 const actions=d.querySelector('#dlgActions');
 actions.innerHTML=`${opts.annuler===false?'':`<button class="btn" data-dlg="annuler">${ECHAPPE(opts.libelleAnnuler||'Annuler')}</button>`}<button class="btn ${opts.danger?'danger':'primary'}" data-dlg="valider">${ECHAPPE(opts.libelleValider||'Confirmer')}</button>`;
 d.hidden=false;
 const premier=zone.querySelector('input,select,textarea'); if(premier) premier.focus();
 return new Promise(resolve=>{
  const touche=e=>{if(e.key==='Escape')fin(null);else if(e.key==='Enter'&&e.target&&e.target.tagName!=='TEXTAREA')valider()};
  const fin=v=>{d.hidden=true;d.onclick=null;document.removeEventListener('keydown',touche);resolve(v)};
  const lire=()=>{const o={};champs.forEach(c=>{const el=zone.querySelector(`[name="${c.cle}"]`);if(el)o[c.cle]=c.type==='checkbox'?el.checked:el.value});return o};
  const valider=()=>{const v=lire();const e=opts.verifier?opts.verifier(v):null;if(e){err.textContent=e;err.hidden=false;return}fin(v)};
  actions.querySelector('[data-dlg="valider"]').onclick=valider;
  const annuler=actions.querySelector('[data-dlg="annuler"]'); if(annuler) annuler.onclick=()=>fin(null);
  d.onclick=e=>{if(e.target===d)fin(null)};
  document.addEventListener('keydown',touche);
 });
}

async function decision(btn,valider){
 const item=trouver(btn.dataset.emp,btn.dataset.key);if(!item)return;
 if(valider&&item.contestationOuverte){nexusErreur('Transmission bloquée','La contestation de cet écart est encore ouverte. Traitez-la dans Verify avant de trancher ici.');return}
 if(valider&&item.typeItem==='retard_incoherent'){nexusErreur('Retard incohérent','Ce retard est techniquement incohérent. Corrigez le pointage source ou excluez ce signal, mais ne le validez pas.');return}
 let montant=null,impact=false;
 if(valider&&item.typeItem==='ecart_caisse'){
  // Le montant n'est JAMAIS repris automatiquement : le manager saisit ce
  // qu'il transmet, en connaissance de cause (doctrine PAYE inchangée).
  const reponse=await ouvrirDialogue({titre:'Montant à transmettre à la comptable',
   texte:`${item.libelle}\n\nNEXUS ne reprend pas automatiquement le montant de référence : saisissez le montant exact que vous transmettez, en euros.`,
   champs:[{cle:'montant',label:'Montant transmis (€)',type:'number',pas:'0.01',min:'0',placeholder:'0,00'}],
   libelleValider:'Transmettre ce montant',
   verifier:v=>{const n=Number(String(v.montant).replace(',','.'));return (v.montant!==''&&Number.isFinite(n)&&n>=0)?null:'Saisissez un montant positif, en euros.'}});
  if(!reponse)return;
  montant=Math.round(Number(String(reponse.montant).replace(',','.'))*100);impact=true;
 }else if(valider&&['heure_supplementaire','retard','absence_a_verifier','conge_paye','arret_maladie','jour_ferie','acompte','dette'].includes(item.typeItem)){impact=true}
 btn.disabled=true;
 try{await NexusPayeDonnees.enregistrerDecision(nexusClient,{siteId:SITE,employeeId:btn.dataset.emp,periode:MOIS,item,statut:valider?'valide':'exclu',impactPaye:impact,montantCentimes:montant,note:null,actorId:EMPLOYEE.id});await reload()}
 catch(e){console.error('NEXUS PAYE — enregistrement de la décision :',e);btn.disabled=false;nexusErreur('Décision non enregistrée',`NEXUS n'a pas pu enregistrer cette décision : ${messageErreur(e)}\n\nRien n'a été modifié.`)}
}
function majPeriodeManuelle(){const debut=document.getElementById('manualDateDebut').value,fin=document.getElementById('manualDateFin').value,resume=document.getElementById('manualPeriodSummary'),btn=document.getElementById('addManual');if(!debut||!fin){resume.textContent='Choisissez la date de début et la date de fin.';btn.textContent='Ajouter et valider';return}try{const dates=NexusPayeDonnees.datesInclusives(debut,fin);resume.textContent=dates.length===1?'1 journée sélectionnée.':`${dates.length} jours sélectionnés, du ${new Date(`${debut}T12:00:00`).toLocaleDateString('fr-FR')} au ${new Date(`${fin}T12:00:00`).toLocaleDateString('fr-FR')}.`;btn.textContent=dates.length===1?'Ajouter et valider':`Ajouter ${dates.length} jours et valider`}catch(_){resume.textContent='La date de fin doit être postérieure ou égale à la date de début.';btn.textContent='Ajouter et valider'}}
async function addManual(){
 const employeeId=document.getElementById('manualEmployee').value,typeItem=document.getElementById('manualType').value,
  dateDebut=document.getElementById('manualDateDebut').value,dateFin=document.getElementById('manualDateFin').value||dateDebut,
  libelle=document.getElementById('manualLabel').value.trim(),min=document.getElementById('manualMinutes').value,montant=document.getElementById('manualAmount').value;
 if(!employeeId||!dateDebut||!dateFin||!libelle)return nexusErreur('Saisie incomplète','Employé, période et libellé sont obligatoires.');
 let dates;
 try{dates=NexusPayeDonnees.datesInclusives(dateDebut,dateFin)}catch(e){return nexusErreur('Période invalide',messageErreur(e))}
 if(dateDebut<MOIS||dateFin>dernierJourMois())return nexusErreur('Période hors du mois','Une variable du mois doit rester dans le mois affiché. Une absence qui déborde relève d’un événement RH.');
 if(montant!==''&&dates.length>1)return nexusErreur('Montant sur plusieurs jours','Un montant en euros doit être rattaché à une seule date, pour éviter de le répéter chaque jour.');
 if(['acompte','dette'].includes(typeItem)&&montant==='')return nexusErreur('Montant obligatoire','Le montant est obligatoire pour une dette ou un acompte.');
 const m=montant===''?null:Math.round(Number(String(montant).replace(',','.'))*100);
 if(montant!==''&&!Number.isFinite(m))return nexusErreur('Montant invalide','Saisissez un montant en euros, par exemple 50 ou 50,00.');
 const btn=document.getElementById('addManual');btn.disabled=true;
 try{await NexusPayeDonnees.ajouterItemsManuels(nexusClient,{siteId:SITE,employeeId,periode:MOIS,dates,typeItem,libelle,
   quantiteMinutes:min===''?null:Number(min),montantCentimes:m,
   impactPaye:['acompte','dette','heure_supplementaire','jour_ferie'].includes(typeItem),note:libelle,actorId:EMPLOYEE.id});
  await reload()}
 catch(e){console.error('NEXUS PAYE — ajout manuel :',e);btn.disabled=false;nexusErreur('Ajout impossible',messageErreur(e))}
}
// Déclaration d'un événement RH depuis le formulaire (03/09/2026).
// Écrit UNE ligne dans employee_indisponibilites — jamais N items de
// paie. C'est le chaînon qui manquait : jusqu'ici, l'écran proposait
// « congé payé » et « arrêt maladie » comme des variables journalières,
// ce qui recréait à la main exactement le dépliage que le moteur venait
// d'abolir. La période peut déborder du mois affiché : c'est même le cas
// normal (un congé maternité couvre six mois).
async function addRH(){
 const employeeId=document.getElementById('rhEmployee').value,motif=document.getElementById('rhMotif').value,
  debut=document.getElementById('rhDebut').value,indetermine=document.getElementById('rhIndetermine').checked,
  commentaire=document.getElementById('rhCommentaire').value.trim();
 let fin=document.getElementById('rhFin').value;
 if(!employeeId||!motif||!debut)return nexusErreur('Saisie incomplète','Salarié, motif et date de début sont obligatoires.');
 if(!fin&&!indetermine)return nexusErreur('Fin de période manquante','Indiquez une date de fin, ou cochez « Date de retour non connue ».');
 if(fin&&fin<debut)return nexusErreur('Période invalide','La date de fin précède la date de début.');
 // Retour non daté : date_fin ne sert que d'horizon provisoire, le moteur
 // prolonge l'absence tant que la reprise n'est pas déclarée.
 if(!fin)fin=dernierJourMois();
 const nom=(RAPPORT.employes.find(f=>f.employee.id===employeeId)||{employee:{}}).employee.nom||'ce salarié';
 const libelleMotif=(MOTIFS_RH.find(([v])=>v===motif)||[,motif])[1];
 if(!await nexusConfirmer('Déclarer cet événement RH ?',`${nom}\n${libelleMotif}\n${jjmmaaaaFR(debut)} → ${indetermine?'retour non daté':jjmmaaaaFR(fin)}\n\nDéclaré une fois, cet événement sera reporté sur chaque mois qu’il traverse et ne vous sera plus redemandé.`,'Déclarer l’événement'))return;
 const btn=document.getElementById('addRH');btn.disabled=true;
 try{await NexusPayeDonnees.declarerIndisponibilite(nexusClient,{siteId:SITE,employeeId,dateDebut:debut,dateFin:fin,motif,finIndeterminee:indetermine,commentaire:commentaire||null,actorId:EMPLOYEE.id});
  await reload()}
 catch(e){console.error('NEXUS PAYE — déclaration d’un événement RH :',e);btn.disabled=false;nexusErreur('Déclaration impossible',messageErreur(e))}
}

// comptable doit pouvoir régénérer deux fois le même document — et
// seulement à défaut d'un calcul en direct.
async function genererDossierPdf(){
 const btn=document.getElementById('dossierPdf');
 const snap=RAPPORT.periodeEnregistree&&RAPPORT.periodeEnregistree.snapshot;
 const dossier=(snap&&snap.dossier)||NexusPayeMoteur.dossierComptable(RAPPORT);
 btn.disabled=true;btn.textContent='Génération…';
 try{
  const pdf=await NexusPayeDossierPdf.construireDossierPdf(dossier,{site:SITE,nomEntreprise:'ViTO Sainte-Marie'});
  await NexusPdfMoteur.partagerOuTelechargerPdf(pdf.bytes,pdf.nomFichier,{titre:pdf.titre,texte:'Variables de paie préparées par NEXUS.'});
 }catch(e){console.error('NEXUS PAYE — dossier comptable PDF :',e);nexusErreur('Dossier non généré',`NEXUS n'a pas pu produire le dossier comptable : ${messageErreur(e)}`);}
 finally{btn.disabled=false;btn.textContent='2 · Générer le dossier comptable'}
}
function csvCell(v){const s=String(v??'');return `"${s.replace(/"/g,'""')}"`}
function exportCSV(){const snap=RAPPORT.periodeEnregistree&&RAPPORT.periodeEnregistree.snapshot;const lignes=snap&&snap.lignes?snap.lignes:NexusPayeMoteur.lignesExport(RAPPORT);const cols=['employe','type','date','source','ecart_initial','ecart_final','statut','quantite_minutes','montant_euros','impact_paye','commentaire'];const csv='\uFEFF'+[cols.join(';'),...lignes.map(l=>cols.map(c=>csvCell(l[c])).join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`NEXUS-Paye-${SITE}-${MOIS.slice(0,7)}.csv`;a.click();URL.revokeObjectURL(a.href)}
nexusRequireAuth().then(async employee=>{if(!employee)return;if(!['manager','gerant'].includes(employee.role)){document.getElementById('app').innerHTML='<div class="alert">NEXUS PAYE est réservé aux managers et gérants.</div>';return}EMPLOYEE=employee;SITE=employee.site_id;await reload()}).catch(e=>{document.getElementById('app').innerHTML=`<div class="alert">Session indisponible : ${ECHAPPE(e.message||e)}</div>`});
