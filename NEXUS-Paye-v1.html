<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="favicon.ico">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Paye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F14;--panel:#141B22;--raised:#1A222C;--line:#242E38;--text:#EDF1F5;--mid:#8A96A5;--dim:#57626F;--green:#34D399;--cyan:#4FC3D9;--amber:#F5A623;--red:#F0546B;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--text);font-family:var(--sans)}body{display:flex;justify-content:center;min-height:100vh}.phone{width:100%;max-width:760px;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.header{padding:20px;position:relative}.menu{position:absolute;right:18px;top:18px;color:var(--cyan);border:1px solid rgba(79,195,217,.3);background:rgba(79,195,217,.1);padding:7px 12px;border-radius:20px;text-decoration:none;font:600 10.5px var(--mono)}.eyebrow,.section-label{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--cyan)}h1{font-size:22px;margin-top:4px}.subtitle{font:11px/1.55 var(--mono);color:var(--dim);margin-top:5px;max-width:620px}.divider{height:1px;background:var(--line)}main{padding:16px 20px 28px}.period{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.period button,.btn{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:10px 12px;cursor:pointer;font:600 11px var(--mono)}.period strong{font:700 14px var(--mono);text-transform:capitalize}.status{font:700 10px var(--mono);padding:5px 9px;border-radius:12px;background:rgba(245,166,35,.14);color:var(--amber)}.status.verifie{background:rgba(52,211,153,.14);color:var(--green)}.status.transmis{background:rgba(79,195,217,.14);color:var(--cyan)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}.kpi span{display:block;font:9px var(--mono);color:var(--dim);text-transform:uppercase}.kpi b{display:block;font:700 20px var(--mono);margin-top:5px}.kpi.warn b{color:var(--amber)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.section-label{color:var(--dim);margin-bottom:11px}.alert{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:9px;padding:11px 12px;color:var(--amber);font-size:12px;line-height:1.5;margin-bottom:8px}.ok{color:var(--green);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#071217}.btn.success{background:var(--green);border-color:var(--green);color:#07150f}.btn.danger{color:var(--red)}.btn:disabled{opacity:.35;cursor:not-allowed}.employee{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden}.employee-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px;cursor:pointer}.employee-name{font-weight:700}.meta{font:10.5px/1.5 var(--mono);color:var(--mid);margin-top:3px}.pill{font:700 9px var(--mono);padding:4px 7px;border-radius:9px;background:var(--raised);color:var(--mid);white-space:nowrap}.pill.green{color:var(--green);background:rgba(52,211,153,.12)}.pill.amber{color:var(--amber);background:rgba(245,166,35,.12)}.employee-body{display:none;border-top:1px solid var(--line);padding:12px 14px}.employee.open .employee-body{display:block}.item{padding:10px;background:var(--raised);border:1px solid var(--line);border-radius:8px;margin-bottom:7px}.item-top{display:flex;justify-content:space-between;gap:10px}.item-title{font-size:12.5px;font-weight:600}.item-date{font:10px var(--mono);color:var(--dim);white-space:nowrap}.item-meta{font:10.5px/1.5 var(--mono);color:var(--mid);margin-top:4px}.item-actions{display:flex;gap:6px;margin-top:8px}.item-actions .btn{padding:7px 9px;font-size:9.5px}.item.valide{border-color:rgba(52,211,153,.3)}.item.exclu{opacity:.58}.item.blocked{border-color:rgba(240,84,107,.45)}.empty{font-size:12px;color:var(--dim);font-style:italic}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font:9.5px var(--mono);text-transform:uppercase;color:var(--dim);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px;font:12px var(--sans)}.field.full{grid-column:1/-1}.help{font:10.5px/1.55 var(--mono);color:var(--dim);margin-top:8px}.loading{text-align:center;padding:44px 10px;color:var(--dim);font:11px var(--mono)}footer{padding:18px;text-align:center;border-top:1px solid var(--line);color:var(--dim);font:10px var(--mono)}@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-build.js"></script>
<script src="nexus-auth.js?v=20260902-1905"></script>
<script src="nexus-header-nav.js?v=20260902-1905"></script>
<script src="nexus-desktop.js?v=20260902-1905"></script>
<script src="nexus-ecarts-moteur.js?v=20260902-1905"></script>
<script src="nexus-ecarts-donnees.js?v=20260902-1905"></script>
<script src="nexus-paye-moteur.js?v=20260902-1905"></script>
<script src="nexus-paye-donnees.js?v=20260902-1905"></script>
</head>
<body><div class="phone">
<header class="header"><a class="menu" href="NEXUS-App-v1.html">☰ Menu</a><div class="eyebrow">NEXUS · Manager</div><h1>Paye</h1><div class="subtitle">Préparer les variables pour la comptable à partir des faits disponibles. NEXUS distingue toujours ce qui est mesuré, reconstitué et arbitré.</div></header>
<div class="divider"></div>
<main id="app"><div class="loading">Chargement du dossier mensuel…</div></main>
<footer>NEXUS prépare les variables · la comptable établit le bulletin</footer>
</div>
<script>
let EMPLOYEE, SITE, RAPPORT, MOIS = NexusPayeMoteur.moisISO(new Date());
const LIBELLES={presence_exceptionnelle:'Présence exceptionnelle',absence_a_verifier:'Absence à vérifier',conge_paye:'Congé payé',arret_maladie:'Arrêt maladie',retard:'Retard',retard_incoherent:'Retard incohérent',heure_supplementaire:'Heure supplémentaire',jour_ferie:'Jour férié',acompte:'Acompte',dette:'Dette / avance qualifiée',ecart_caisse:'Écart de caisse qualifié',autre:'Autre variable'};
const ECHAPPE=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lienPlanningSecurise(){const brut=RAPPORT&&RAPPORT.planningOfficiel&&RAPPORT.planningOfficiel.url;try{const u=new URL(brut);return u.protocol==='https:'&&u.hostname==='docs.google.com'&&u.pathname.startsWith('/spreadsheets/d/')?u.href:''}catch(_){return''}}
function moisLabel(){return new Date(`${MOIS}T12:00:00`).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});}
function dernierJourMois(){const d=new Date(`${NexusPayeMoteur.finMoisISO(MOIS)}T12:00:00`);d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function etatPeriode(){return (RAPPORT.periodeEnregistree&&RAPPORT.periodeEnregistree.statut)||'brouillon';}
function itemMeta(i){const q=i.quantiteMinutes!=null?`${i.quantiteMinutes} min`:'';const m=i.montantCentimes!=null?`${(i.montantCentimes/100).toFixed(2)} €`:'';return [LIBELLES[i.typeItem]||i.typeItem,q,m,i.contestationOuverte?'Contestation ouverte — transmission bloquée':''].filter(Boolean).join(' · ')}
function render(){
 const s=RAPPORT.synthese, statut=etatPeriode();
 document.getElementById('app').innerHTML=`
 <div class="period"><button id="prev">←</button><strong>${moisLabel()}</strong><span class="status ${statut}">${statut}</span><button id="next">→</button></div>
 ${RAPPORT.planningOfficiel&&RAPPORT.planningOfficiel.source==='google_sheets'?`<div class="card"><div class="section-label">Planning officiel</div><div class="help" style="margin:0;">Google Sheets est la référence choisie pour l'équipe. PAYE continue de distinguer cette prévision des preuves réelles Verify et Pointage.${lienPlanningSecurise()?` <a href="${ECHAPPE(lienPlanningSecurise())}" target="_blank" rel="noopener" style="color:var(--green);">Ouvrir le planning ↗</a>`:''}</div></div>`:''}
 <div class="kpis"><div class="kpi"><span>Salariés suivis</span><b>${s.salariesInclus}</b></div><div class="kpi"><span>Heures confirmées</span><b>${s.heuresConfirmees} h</b></div><div class="kpi"><span>Variables validées</span><b>${s.variablesValidees}</b></div><div class="kpi warn"><span>À arbitrer</span><b>${s.aVerifier}</b></div></div>
 <section class="card"><div class="section-label">Contrôle avant transmission</div>${RAPPORT.bloqueurs.length?`<div class="alert"><b>${RAPPORT.bloqueurs.length} point(s) empêchent la clôture.</b><br>${RAPPORT.bloqueurs.slice(0,4).map(b=>ECHAPPE(b.libelle)).join('<br>')}${RAPPORT.bloqueurs.length>4?'<br>…':''}</div>`:'<div class="ok">✓ Toutes les variables sont arbitrées. Le dossier peut être figé.</div>'}<div class="actions" style="margin-top:11px"><button class="btn success" id="ready" ${RAPPORT.bloqueurs.length||statut!=='brouillon'?'disabled':''}>Marquer prêt</button><button class="btn primary" id="export" ${statut==='brouillon'?'disabled':''}>Exporter CSV</button><button class="btn" id="sent" ${statut!=='verifie'?'disabled':''}>Marquer transmis</button><button class="btn danger" id="reopen" ${statut==='brouillon'?'disabled':''}>Rouvrir</button></div></section>
 <section><div class="section-label">Détail par employé</div>${RAPPORT.employes.map(renderEmployee).join('')}</section>
 <section class="card"><div class="section-label">Ajouter une variable connue</div><div class="form-grid"><div class="field"><label>Employé</label><select id="manualEmployee">${RAPPORT.employes.filter(f=>f.reglage.inclus).map(f=>`<option value="${f.employee.id}">${ECHAPPE(f.employee.nom)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select id="manualType">${['presence_exceptionnelle','conge_paye','arret_maladie','absence_a_verifier','heure_supplementaire','jour_ferie','acompte','dette','autre'].map(t=>`<option value="${t}">${LIBELLES[t]}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="manualDate" type="date" min="${MOIS}" max="${dernierJourMois()}"></div><div class="field"><label>Minutes</label><input id="manualMinutes" type="number" min="0" step="1" placeholder="facultatif"></div><div class="field"><label>Montant €</label><input id="manualAmount" type="number" step="0.01" placeholder="facultatif"></div><div class="field full"><label>Libellé / justificatif</label><textarea id="manualLabel" rows="2" placeholder="Ce que la comptable doit comprendre"></textarea></div></div><button class="btn primary" id="addManual" style="margin-top:10px">Ajouter et valider</button><div class="help">Une dette, un acompte ou un montant de caisse n'est pris en compte que s'il est saisi ou validé explicitement ici.</div></section>`;
 bind();
}
function renderEmployee(f){const inclus=f.reglage.inclus;const config=!f.reglage.confirme?'<span class="pill amber">à confirmer</span>':inclus?'<span class="pill green">inclus</span>':'<span class="pill">hors paie</span>';return `<article class="employee" data-employee="${f.employee.id}"><div class="employee-head"><div><div class="employee-name">${ECHAPPE(f.employee.nom)}</div><div class="meta">${ECHAPPE(f.employee.role||'')} · ${f.heuresConfirmees.toFixed(2)} h confirmées · ${f.presencesMesurees} mesurée(s) · ${f.presencesReconstituees} reconstituée(s)</div></div>${config}</div><div class="employee-body"><div class="actions" style="margin-bottom:10px"><button class="btn configure" data-id="${f.employee.id}">Configurer le rattachement</button></div>${!inclus?'<div class="empty">Cet employé ne figure pas dans le dossier de paie de la station.</div>':f.items.length?f.items.map(i=>renderItem(f,i)).join(''):'<div class="empty">Aucune variable particulière détectée sur ce mois.</div>'}</div></article>`}
function renderItem(f,i){return `<div class="item ${i.statut} ${i.bloquantTechnique?'blocked':''}"><div class="item-top"><div class="item-title">${ECHAPPE(i.libelle)}</div><div class="item-date">${i.date||''}</div></div><div class="item-meta">${ECHAPPE(itemMeta(i))} · ${i.statut.replace('_',' ')}</div>${i.statut==='a_verifier'?`<div class="item-actions"><button class="btn validate" data-emp="${f.employee.id}" data-key="${ECHAPPE(i.sourceCle)}">Valider</button><button class="btn exclude" data-emp="${f.employee.id}" data-key="${ECHAPPE(i.sourceCle)}">Exclure</button></div>`:''}</div>`}
function trouver(emp,key){const f=RAPPORT.employes.find(x=>x.employee.id===emp);return f&&f.items.find(i=>i.sourceCle===key)}
async function reload(){document.getElementById('app').innerHTML='<div class="loading">Actualisation et contrôles croisés…</div>';try{RAPPORT=await NexusPayeDonnees.chargerRapport(nexusClient,SITE,MOIS);render()}catch(e){console.error(e);document.getElementById('app').innerHTML=`<div class="alert">NEXUS PAYE n'a pas pu charger le dossier : ${ECHAPPE(e.message||e)}</div>`}}
function bind(){
 document.getElementById('prev').onclick=()=>{const d=new Date(`${MOIS}T12:00:00`);d.setMonth(d.getMonth()-1);MOIS=NexusPayeMoteur.moisISO(d);reload()};
 document.getElementById('next').onclick=()=>{const d=new Date(`${MOIS}T12:00:00`);d.setMonth(d.getMonth()+1);MOIS=NexusPayeMoteur.moisISO(d);reload()};
 document.querySelectorAll('.employee-head').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'));
 document.querySelectorAll('.configure').forEach(b=>b.onclick=async e=>{e.stopPropagation();const f=RAPPORT.employes.find(x=>x.employee.id===b.dataset.id);const choix=prompt(`Rattachement de ${f.employee.nom}\n1 = inclus automatique\n2 = inclus, heures manuelles\n3 = hors paie`,f.reglage.inclus?(f.reglage.modePresence==='manuel'?'2':'1'):'3');if(!['1','2','3'].includes(choix))return;await NexusPayeDonnees.enregistrerReglageEmploye(nexusClient,{siteId:SITE,employeeId:f.employee.id,inclusPaye:choix!=='3',modePresence:choix==='1'?'automatique':choix==='2'?'manuel':'exclu',commentaire:null,actorId:EMPLOYEE.id});reload()});
 document.querySelectorAll('.validate').forEach(b=>b.onclick=async()=>decision(b,true));document.querySelectorAll('.exclude').forEach(b=>b.onclick=async()=>decision(b,false));
 document.getElementById('addManual').onclick=addManual;
 document.getElementById('ready').onclick=async()=>{if(RAPPORT.bloqueurs.length)return;const snapshot={genere_le:new Date().toISOString(),periode:MOIS,lignes:NexusPayeMoteur.lignesExport(RAPPORT)};await NexusPayeDonnees.enregistrerPeriode(nexusClient,{siteId:SITE,periode:MOIS,statut:'verifie',snapshot,actorId:EMPLOYEE.id});reload()};
 document.getElementById('sent').onclick=async()=>{await NexusPayeDonnees.enregistrerPeriode(nexusClient,{siteId:SITE,periode:MOIS,statut:'transmis',snapshot:RAPPORT.periodeEnregistree.snapshot,actorId:EMPLOYEE.id});reload()};
 document.getElementById('reopen').onclick=async()=>{if(!confirm('Rouvrir le dossier ? Le snapshot validé sera supprimé.'))return;await NexusPayeDonnees.enregistrerPeriode(nexusClient,{siteId:SITE,periode:MOIS,statut:'brouillon',snapshot:null,actorId:EMPLOYEE.id});reload()};
 document.getElementById('export').onclick=exportCSV;
}
async function decision(btn,valider){const item=trouver(btn.dataset.emp,btn.dataset.key);if(!item)return;if(valider&&item.contestationOuverte){alert('Impossible : la contestation est encore ouverte.');return}if(valider&&item.typeItem==='retard_incoherent'){alert('Ce retard est techniquement incohérent. Corrigez le pointage source ou excluez ce signal, mais ne le validez pas.');return}let montant=null,impact=false;if(valider&&item.typeItem==='ecart_caisse'){const v=prompt('Montant exact à transmettre à la comptable, en euros. NEXUS ne reprend pas automatiquement le montant de référence.','');if(v===null)return;const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0){alert('Montant invalide.');return}montant=Math.round(n*100);impact=true}else if(valider&&['heure_supplementaire','retard','absence_a_verifier','conge_paye','arret_maladie','jour_ferie','acompte','dette'].includes(item.typeItem)){impact=true}await NexusPayeDonnees.enregistrerDecision(nexusClient,{siteId:SITE,employeeId:btn.dataset.emp,periode:MOIS,item,statut:valider?'valide':'exclu',impactPaye:impact,montantCentimes:montant,note:null,actorId:EMPLOYEE.id});reload()}
async function addManual(){const employeeId=document.getElementById('manualEmployee').value,typeItem=document.getElementById('manualType').value,date=document.getElementById('manualDate').value,libelle=document.getElementById('manualLabel').value.trim(),min=document.getElementById('manualMinutes').value,montant=document.getElementById('manualAmount').value;if(!employeeId||!date||!libelle){alert('Employé, date et libellé sont obligatoires.');return}if(['acompte','dette'].includes(typeItem)&&montant===''){alert('Le montant est obligatoire pour une dette ou un acompte.');return}const m=montant===''?null:Math.round(Number(String(montant).replace(',','.'))*100);if(montant!==''&&!Number.isFinite(m)){alert('Montant invalide.');return}await NexusPayeDonnees.ajouterItemManuel(nexusClient,{siteId:SITE,employeeId,periode:MOIS,date,typeItem,libelle,quantiteMinutes:min===''?null:Number(min),montantCentimes:m,impactPaye:['acompte','dette','heure_supplementaire','retard','absence_a_verifier','conge_paye','arret_maladie','jour_ferie'].includes(typeItem),note:libelle,actorId:EMPLOYEE.id});reload()}
function csvCell(v){const s=String(v??'');return `"${s.replace(/"/g,'""')}"`}
function exportCSV(){const snap=RAPPORT.periodeEnregistree&&RAPPORT.periodeEnregistree.snapshot;const lignes=snap&&snap.lignes?snap.lignes:NexusPayeMoteur.lignesExport(RAPPORT);const cols=['employe','type','date','quantite_minutes','montant_euros','impact_paye','commentaire'];const csv='\uFEFF'+[cols.join(';'),...lignes.map(l=>cols.map(c=>csvCell(l[c])).join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`NEXUS-Paye-${SITE}-${MOIS.slice(0,7)}.csv`;a.click();URL.revokeObjectURL(a.href)}
nexusRequireAuth().then(async employee=>{if(!employee)return;if(!['manager','gerant'].includes(employee.role)){document.getElementById('app').innerHTML='<div class="alert">NEXUS PAYE est réservé aux managers et gérants.</div>';return}EMPLOYEE=employee;SITE=employee.site_id;await reload()}).catch(e=>{document.getElementById('app').innerHTML=`<div class="alert">Session indisponible : ${ECHAPPE(e.message||e)}</div>`});
</script></body></html>
