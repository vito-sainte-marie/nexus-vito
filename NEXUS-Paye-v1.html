<style>
:root{--bg:#0B0F14;--panel:#141B22;--raised:#1A222C;--line:#242E38;--text:#EDF1F5;--mid:#8A96A5;--dim:#57626F;--green:#34D399;--cyan:#4FC3D9;--amber:#F5A623;--red:#F0546B;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}html,body{background:var(--bg);color:var(--text);font-family:var(--sans)}body{display:flex;justify-content:center;min-height:100vh}.phone{width:100%;max-width:760px;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.header{padding:20px;position:relative}.menu{position:absolute;right:18px;top:18px;color:var(--cyan);border:1px solid rgba(79,195,217,.3);background:rgba(79,195,217,.1);padding:7px 12px;border-radius:20px;text-decoration:none;font:600 10.5px var(--mono)}.eyebrow,.section-label{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--cyan)}h1{font-size:22px;margin-top:4px}.subtitle{font:11px/1.55 var(--mono);color:var(--dim);margin-top:5px;max-width:620px}.divider{height:1px;background:var(--line)}main{padding:16px 20px 28px}.period{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.period button,.btn{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:10px 12px;cursor:pointer;font:600 11px var(--mono)}.period strong{font:700 14px var(--mono);text-transform:capitalize}.status{font:700 10px var(--mono);padding:5px 9px;border-radius:12px;background:rgba(245,166,35,.14);color:var(--amber)}.status.verifie{background:rgba(52,211,153,.14);color:var(--green)}.status.transmis{background:rgba(79,195,217,.14);color:var(--cyan)}.hero{padding:16px;background:linear-gradient(135deg,rgba(79,195,217,.12),rgba(52,211,153,.05));border:1px solid rgba(79,195,217,.28);border-radius:13px;margin-bottom:10px}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero h2{font-size:16px;margin-bottom:5px}.hero p{font:10.5px/1.5 var(--mono);color:var(--mid)}.quick-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}.quick-nav button{border:1px solid var(--line);background:var(--panel);color:var(--mid);border-radius:9px;padding:10px 6px;font:600 10px var(--mono);cursor:pointer}.quick-nav button:first-child{color:var(--amber);border-color:rgba(245,166,35,.25)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}.kpi span{display:block;font:9px var(--mono);color:var(--dim);text-transform:uppercase}.kpi b{display:block;font:700 20px var(--mono);margin-top:5px}.kpi.warn b{color:var(--amber)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.section-head{display:flex;align-items:center;gap:7px;margin:18px 0 10px;scroll-margin-top:12px}.section-head .section-label{margin:0}.section-label{color:var(--dim);margin-bottom:11px}.info-btn{width:22px;height:22px;border:1px solid rgba(79,195,217,.35);border-radius:50%;background:rgba(79,195,217,.09);color:var(--cyan);font:700 10px var(--mono);cursor:pointer;flex:none}.alert{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:9px;padding:11px 12px;color:var(--amber);font-size:12px;line-height:1.5;margin-bottom:8px}.ok{color:var(--green);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#071217}.btn.success{background:var(--green);border-color:var(--green);color:#07150f}.btn.danger{color:var(--red)}.btn:disabled{opacity:.35;cursor:not-allowed}.review-card{background:var(--panel);border:1px solid rgba(245,166,35,.26);border-radius:11px;padding:12px;margin-bottom:8px}.review-system{border-color:var(--line)}.review-name{font-size:11px;color:var(--mid);margin-bottom:5px}.employee{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden}.employee-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px;cursor:pointer}.employee-name{font-weight:700;text-transform:capitalize}.meta{font:10.5px/1.5 var(--mono);color:var(--mid);margin-top:3px}.summary-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.summary-chip{font:9px var(--mono);color:var(--mid);background:var(--raised);padding:4px 6px;border-radius:7px}.pill{font:700 9px var(--mono);padding:4px 7px;border-radius:9px;background:var(--raised);color:var(--mid);white-space:nowrap}.pill.green{color:var(--green);background:rgba(52,211,153,.12)}.pill.amber{color:var(--amber);background:rgba(245,166,35,.12)}.pill.info{color:var(--cyan);background:rgba(79,195,217,.12)}.employee-body{display:none;border-top:1px solid var(--line);padding:12px 14px}.employee.open .employee-body{display:block}.item{padding:10px;background:var(--raised);border:1px solid var(--line);border-radius:8px;margin-bottom:7px}.item-top{display:flex;justify-content:space-between;gap:10px}.item-title{font-size:12.5px;font-weight:600}.item-date{font:10px var(--mono);color:var(--dim);white-space:nowrap}.item-meta{font:10.5px/1.5 var(--mono);color:var(--mid);margin-top:4px}.ecart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.ecart-cell{background:var(--panel);border-radius:7px;padding:7px}.ecart-cell span{display:block;font:8px var(--mono);color:var(--dim);text-transform:uppercase}.ecart-cell b{display:block;font:11px var(--mono);margin-top:3px}.source-link{display:inline-block;color:var(--cyan);font:600 9.5px var(--mono);text-decoration:none;margin-top:7px}.item-actions{display:flex;gap:6px;margin-top:8px}.item-actions .btn{padding:7px 9px;font-size:9.5px}.item.valide{border-color:rgba(52,211,153,.3)}.item.information{border-color:rgba(79,195,217,.25)}.item.exclu{opacity:.65}.item.blocked{border-color:rgba(240,84,107,.45)}.empty{font-size:12px;color:var(--dim);font-style:italic}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.date-range{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font:9.5px var(--mono);text-transform:uppercase;color:var(--dim);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px;font:12px var(--sans)}.field.full{grid-column:1/-1}.help{font:10.5px/1.55 var(--mono);color:var(--dim);margin-top:8px}.accountant-list{display:grid;gap:7px;margin:10px 0 12px}.accountant-line{display:flex;align-items:center;gap:8px;color:var(--mid);font-size:11px}.accountant-line::before{content:'✓';color:var(--green);font-weight:700}.modal{position:fixed;inset:0;background:rgba(3,8,12,.76);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50}.modal[hidden]{display:none}.modal-card{width:min(430px,100%);background:var(--panel);border:1px solid rgba(79,195,217,.35);border-radius:14px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.45)}.modal-card h3{font-size:15px;margin-bottom:8px}.modal-card p{font:11px/1.65 var(--mono);color:var(--mid);white-space:pre-line}.modal-card .btn{margin-top:14px}.loading{text-align:center;padding:44px 10px;color:var(--dim);font:11px var(--mono)}footer{padding:18px;text-align:center;border-top:1px solid var(--line);color:var(--dim);font:10px var(--mono)}@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick-nav{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;margin-top:2px}.ecart-grid{grid-template-columns:1fr 1fr}.ecart-cell:last-child{grid-column:1/-1}}
</style>

<body><div class="phone">
<header class="header"><a class="menu" href="NEXUS-App-v1.html">☰ Menu</a><div class="eyebrow">NEXUS · Manager</div><h1>Paye</h1><div class="subtitle">Préparer les variables pour la comptable à partir des faits disponibles. NEXUS distingue toujours ce qui est mesuré, reconstitué et arbitré.</div></header>
<div class="divider"></div>
<main id="app"><div class="loading">Chargement du dossier mensuel…</div></main>
<footer>NEXUS prépare les variables · la comptable établit le bulletin</footer>
</div>
<script>
let EMPLOYEE, SITE, RAPPORT, MOIS = NexusPayeMoteur.moisISO(new Date());
const LIBELLES={absence_a_qualifier:'Absence à qualifier',absence_qualifiee:'Absence qualifiée',presence_exceptionnelle:'Présence exceptionnelle',absence_a_verifier:'Absence à vérifier',conge_paye:'Congé payé',arret_maladie:'Arrêt maladie',retard:'Retard',retard_incoherent:'Retard incohérent',heure_supplementaire:'Heure supplémentaire',jour_ferie:'Jour férié',acompte:'Acompte',dette:'Dette / avance qualifiée',ecart_caisse:'Écart de caisse qualifié',autre:'Autre variable'};
const INFOS={dossier:['Dossier mensuel','NEXUS prépare les variables et les preuves. La comptable reste responsable du bulletin. Aucune retenue n’est appliquée automatiquement.'],preuves:['Présence confirmée','Le planning indique ce qui était prévu. Verify et le pointage apportent les preuves de présence réelle. Une présence reconstituée reste signalée comme telle.'],arbitrage:['À vérifier','Cette zone rassemble uniquement les décisions qui nécessitent votre intervention avant de préparer le dossier comptable.'],ecart:['Écart de caisse','Un écart positif ou négatif reste visible pour la traçabilité. Il ne devient jamais automatiquement une dette du salarié ni une retenue sur paie.'],export:['Dossier comptable','L’export contient les présences confirmées, les variables validées et les écarts informatifs. Les éléments encore à vérifier ne sont jamais transmis.'],periode:['Saisie sur une période','Pour une seule journée, utilisez la même date dans « Du » et « Au ». Pour plusieurs jours, NEXUS conserve une ligne datée par journée.']};
const ECHAPPE=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const infoBtn=(cle,label)=>`<button type="button" class="info-btn" data-info="${cle}" aria-label="Information${label?` : ${ECHAPPE(label)}`:''}">i</button>`;
const euros=c=>c==null?'—':`${c>0?'+':''}${(c/100).toFixed(2)} €`;
function lienPlanningSecurise(){const brut=RAPPORT&&RAPPORT.planningOfficiel&&RAPPORT.planningOfficiel.url;try{const u=new URL(brut);return u.protocol==='https:'&&u.hostname==='docs.google.com'&&u.pathname.startsWith('/spreadsheets/d/')?u.href:''}catch(_){return''}}
function moisLabel(){return new Date(`${MOIS}T12:00:00`).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});}
function dernierJourMois(){const d=new Date(`${NexusPayeMoteur.finMoisISO(MOIS)}T12:00:00`);d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function etatPeriode(){return (RAPPORT.periodeEnregistree&&RAPPORT.periodeEnregistree.statut)||'brouillon';}
function itemMeta(i){const q=i.quantiteMinutes!=null?`${i.quantiteMinutes} min`:'';const m=i.montantCentimes!=null?`${(i.montantCentimes/100).toFixed(2)} €`:'';return [LIBELLES[i.typeItem]||i.typeItem,q,m,i.contestationOuverte?'Contestation ouverte — transmission bloquée':''].filter(Boolean).join(' · ')}
function render(){
 const s=RAPPORT.synthese, statut=etatPeriode();
 const decisions=RAPPORT.items.filter(i=>i.statut==='a_verifier'||i.contestationOuverte);
 const informations=RAPPORT.items.filter(i=>i.statut==='information');
 const blocagesSysteme=RAPPORT.bloqueurs.filter(b=>b.categorie==='configuration'||(!b.categorie&&!b.sourceCle));
 document.getElementById('app').innerHTML=`
 <div class="period"><button id="prev">←</button><strong>${moisLabel()}</strong><span class="status ${statut}">${statut}</span><button id="next">→</button></div>
 <section class="hero"><div class="hero-top"><div><h2>${RAPPORT.bloqueurs.length?`${RAPPORT.bloqueurs.length} point${RAPPORT.bloqueurs.length>1?'s':''} à traiter`:'Dossier prêt à être vérifié'}</h2><p>${RAPPORT.bloqueurs.length?'NEXUS a regroupé les décisions nécessaires. Commencez par la boîte À vérifier.':'Toutes les variables connues sont arbitrées. Vous pouvez contrôler puis figer le dossier.'}</p></div>${infoBtn('dossier','dossier mensuel')}</div>${RAPPORT.bloqueurs.length?'<button class="btn primary jump-review" style="margin-top:12px">Examiner les points à vérifier</button>':''}</section>
 <nav class="quick-nav" aria-label="Navigation PAYE"><button data-jump="reviewSection">À vérifier${s.aVerifier?` · ${s.aVerifier}`:''}</button><button data-jump="employeesSection">Salariés</button><button data-jump="accountantSection">Dossier comptable</button></nav>
 ${RAPPORT.planningOfficiel&&RAPPORT.planningOfficiel.source==='google_sheets'?`<div class="card"><div class="section-label">Planning officiel</div><div class="help" style="margin:0;">Google Sheets est la prévision officielle. PAYE la rapproche toujours des preuves réelles Verify et Pointage.${lienPlanningSecurise()?` <a href="${ECHAPPE(lienPlanningSecurise())}" target="_blank" rel="noopener" style="color:var(--green);">Ouvrir le planning ↗</a>`:''}</div></div>`:''}
 <div class="kpis"><div class="kpi"><span>Salariés suivis</span><b>${s.salariesInclus}</b></div><div class="kpi"><span>Heures confirmées</span><b>${s.heuresConfirmees} h</b></div><div class="kpi"><span>Variables validées</span><b>${s.variablesValidees}</b></div><div class="kpi warn"><span>À vérifier</span><b>${s.aVerifier}</b></div></div>
 ${blocagesSysteme.length?`<div class="section-head"><div class="section-label">Configuration requise · ${blocagesSysteme.length}</div></div>
 <section>${blocagesSysteme.map(b=>`<div class="review-card review-system"><div class="review-name">Paramétrage</div><div class="item-title">${ECHAPPE(b.libelle)}</div><div class="item-meta">Réglage permanent — à compléter une fois, pas un arbitrage du mois.</div><button class="btn jump-employees" style="margin-top:8px">Configurer</button></div>`).join('')}</section>`:''}
 <div class="section-head" id="reviewSection"><div class="section-label">Éléments de paie à vérifier${decisions.length?` · ${decisions.length}`:''}</div>${infoBtn('arbitrage','arbitrages')}</div>
 <section>${!decisions.length?'<div class="card ok">✓ Aucun arbitrage en attente.</div>':decisions.map(i=>`<div class="review-card"><div class="review-name">${ECHAPPE(i.employeeNom||'Employé à identifier')}</div>${renderItem(null,i)}</div>`).join('')}</section>
 ${informations.length?`<section class="card"><div class="section-label" style="display:flex;align-items:center;gap:7px">Informations sans impact paie · ${informations.length} ${infoBtn('ecart','écarts informatifs')}</div><div class="help" style="margin:0 0 9px">Ces éléments restent visibles pour la traçabilité mais ne bloquent pas le dossier.</div>${informations.map(i=>renderItem(null,i)).join('')}</section>`:''}
 <div class="section-head" id="employeesSection"><div class="section-label">Salariés</div>${infoBtn('preuves','présences')}</div>
 <section>${RAPPORT.employes.map(renderEmployee).join('')}</section>
 <div class="section-head" id="accountantSection"><div class="section-label">Dossier comptable</div>${infoBtn('export','export comptable')}</div>
 <section class="card">${RAPPORT.bloqueurs.length?`<div class="alert"><b>${RAPPORT.bloqueurs.length} point(s) empêchent encore la préparation finale.</b><br>Traitez la boîte « À vérifier » avant de figer le dossier.</div>`:'<div class="ok">✓ Toutes les variables sont arbitrées. Le dossier peut être figé.</div>'}<div class="accountant-list"><div class="accountant-line">Présences confirmées et heures retenues</div><div class="accountant-line">Variables validées par salarié</div><div class="accountant-line">Écarts informatifs sans impact paie</div><div class="accountant-line">Historique figé avant transmission</div></div><div class="actions"><button class="btn success" id="ready" ${RAPPORT.bloqueurs.length||statut!=='brouillon'?'disabled':''}>1 · Marquer prêt</button><button class="btn primary" id="export" ${statut==='brouillon'?'disabled':''}>2 · Exporter le dossier</button><button class="btn" id="sent" ${statut!=='verifie'?'disabled':''}>3 · Marquer transmis</button><button class="btn danger" id="reopen" ${statut==='brouillon'?'disabled':''}>Rouvrir</button></div></section>
 <section class="card"><div class="section-label" style="display:flex;align-items:center;gap:7px">Ajouter une variable connue ${infoBtn('periode','saisie manuelle')}</div><div class="form-grid"><div class="field"><label>Employé</label><select id="manualEmployee">${RAPPORT.employes.filter(f=>f.reglage.inclus).map(f=>`<option value="${f.employee.id}">${ECHAPPE(f.employee.nom)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select id="manualType">${['presence_exceptionnelle','conge_paye','arret_maladie','absence_a_verifier','heure_supplementaire','jour_ferie','acompte','dette','autre'].map(t=>`<option value="${t}">${LIBELLES[t]}</option>`).join('')}</select></div><div class="date-range field full"><div class="field"><label>Du</label><input id="manualDateDebut" type="date" min="${MOIS}" max="${dernierJourMois()}"></div><div class="field"><label>Au</label><input id="manualDateFin" type="date" min="${MOIS}" max="${dernierJourMois()}"></div></div><div class="field full"><div class="help" id="manualPeriodSummary" style="margin-top:0;">Choisissez la date de début et la date de fin.</div></div><div class="field"><label>Minutes par jour</label><input id="manualMinutes" type="number" min="0" step="1" placeholder="facultatif"></div><div class="field"><label>Montant €</label><input id="manualAmount" type="number" step="0.01" placeholder="facultatif"></div><div class="field full"><label>Libellé / justificatif</label><textarea id="manualLabel" rows="2" placeholder="Ce que la comptable doit comprendre"></textarea></div></div><button class="btn primary" id="addManual" style="margin-top:10px">Ajouter et valider</button><div class="help">Un montant en euros reste limité à une seule date pour éviter toute duplication.</div></section>
 <div class="modal" id="infoModal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="infoTitle"><h3 id="infoTitle"></h3><p id="infoText"></p><button class="btn primary" id="closeInfo">J’ai compris</button></div></div>`;
 bind();
}
function renderEmployee(f){const inclus=f.reglage.inclus,retards=f.items.filter(i=>i.typeItem==='retard').reduce((s,i)=>s+Number(i.quantiteMinutes||0),0),conges=f.items.filter(i=>i.typeItem==='conge_paye'&&i.statut!=='exclu').length,ecarts=f.items.filter(i=>i.typeItem==='ecart_caisse').length,config=!f.reglage.confirme?'<span class="pill amber">à confirmer</span>':inclus?'<span class="pill green">inclus</span>':'<span class="pill">hors paie</span>';return `<article class="employee" data-employee="${f.employee.id}"><div class="employee-head"><div><div class="employee-name">${ECHAPPE(f.employee.nom)}</div><div class="meta">${ECHAPPE(f.employee.role||'')} · ${f.heuresConfirmees.toFixed(2)} h confirmées</div>${inclus?`<div class="summary-chips"><span class="summary-chip">${f.joursConfirmes.size} présence(s)</span><span class="summary-chip">${retards} min retard</span><span class="summary-chip">${conges} congé(s)</span><span class="summary-chip">${ecarts} écart(s)</span></div>`:''}</div>${config}</div><div class="employee-body"><div class="actions" style="margin-bottom:10px"><button class="btn configure" data-id="${f.employee.id}">Configurer le rattachement</button></div>${!inclus?`<div class="empty">Cet employé ne figure pas dans le dossier de paie de la station.${f.reglage.commentaire?` ${ECHAPPE(f.reglage.commentaire)}`:''}</div>`:f.items.length?f.items.map(i=>renderItem(f,i)).join(''):'<div class="empty">Aucune variable particulière détectée sur ce mois.</div>'}</div></article>`}
const MOTIFS_RH=[['conge_maternite','Congé maternité'],['arret_maladie','Arrêt maladie'],['conge','Congé'],['conge_paternite','Congé paternité'],['formation','Formation'],['autre','Autre']];
// Qualifier une période une seule fois. Le manager choisit un motif puis
// confirme ; NEXUS écrit sur l'ÉVÉNEMENT, ce qui vaut pour tous les mois
// suivants. « Date de retour non connue » évite de forcer une date inventée.
// Déclarer une absence CONSTATÉE comme événement RH. Même formulaire que la
// qualification : le manager ne doit pas apprendre deux vocabulaires selon
// que l'absence a été prévue ou découverte après coup.
function blocDeclaration(i,emp){
 const sel=MOTIFS_RH.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
 return `<div class="item-actions" style="flex-direction:column;align-items:stretch;gap:8px">
  <label style="font-size:11px;opacity:.75">Motif de l'absence
   <select class="rh-motif-new" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}" style="width:100%;margin-top:4px;padding:8px;border-radius:8px">
    <option value="">— à qualifier —</option>${sel}</select></label>
  <label style="font-size:11px;opacity:.75;display:flex;align-items:center;gap:6px">
   <input type="checkbox" class="rh-indetermine-new" data-key="${ECHAPPE(i.sourceCle)}"> Date de retour non connue</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn primary rh-declarer" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}"
     data-debut="${ECHAPPE(i.date||'')}" data-fin="${ECHAPPE(i.dateFin||i.date||'')}">Déclarer l'absence</button>
   <button class="btn exclude" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}">Ignorer cette détection</button>
  </div>
  <div style="font-size:10px;opacity:.6">Déclarée une fois, cette absence ne vous sera plus redemandée les mois suivants.</div>
 </div>`}
function blocQualification(i){
 const sel=MOTIFS_RH.map(([v,l])=>`<option value="${v}"${i.motif===v?' selected':''}>${l}</option>`).join('');
 return `<div class="item-actions" style="flex-direction:column;align-items:stretch;gap:8px">
  <label style="font-size:11px;opacity:.75">Motif de l'absence
   <select class="rh-motif" data-ev="${ECHAPPE(i.evenementId)}" style="width:100%;margin-top:4px;padding:8px;border-radius:8px">
    <option value="">— à qualifier —</option>${sel}</select></label>
  <label style="font-size:11px;opacity:.75;display:flex;align-items:center;gap:6px">
   <input type="checkbox" class="rh-indetermine" data-ev="${ECHAPPE(i.evenementId)}"${i.finIndeterminee?' checked':''}> Date de retour non connue</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn primary rh-confirmer" data-ev="${ECHAPPE(i.evenementId)}">Confirmer la période</button>
   <button class="btn rh-reprise" data-ev="${ECHAPPE(i.evenementId)}">Salarié revenu…</button>
  </div>
  <div style="font-size:10px;opacity:.6">Une seule confirmation couvre toute la période, y compris les mois suivants.</div>
 </div>`}
function renderItem(f,i){const emp=i.employeeId||(f&&f.employee.id)||'',periode=i.origine==='indisponibilite',statut=i.statut==='a_verifier'?'à vérifier':i.statut==='information'?'information':i.statut==='valide'?'validé':'sans impact paie',ecart=i.typeItem==='ecart_caisse',actions=i.statut==='a_verifier'&&!i.attributionRequise?(periode&&i.evenementId?blocQualification(i):i.serieAbsence?blocDeclaration(i,emp):`<div class="item-actions"><button class="btn exclude" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}">${ecart?'Sans impact paie':'Ne pas retenir'}</button><button class="btn ${ecart?'primary':''} validate" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}">${ecart?'Transmettre à la comptable':'Confirmer'}</button></div>`):'',source=i.deepLink?`<a class="source-link" href="${ECHAPPE(i.deepLink)}">${i.attributionRequise?'Corriger l’attribution dans':'Voir le contrôle'} ${i.origine==='fdj'?'FDJ':'Verify'} ↗</a>`:'';return `<div class="item ${i.statut} ${i.bloquantTechnique?'blocked':''}"><div class="item-top"><div class="item-title">${ECHAPPE(i.libelle)}</div><div class="item-date">${periode&&i.joursMois?`${i.joursMois} jour${i.joursMois>1?'s':''} sur ce mois`:(i.date||'')}${i.quart?` · Q${ECHAPPE(i.quart)}`:''}</div></div>${i.detail?`<div class="item-meta">${ECHAPPE(i.detail)}${i.heuresAttribuees!=null?` <button class="h-edit" data-key="${ECHAPPE(i.sourceCle)}" title="Corriger les heures retenues" aria-label="Corriger les heures retenues" style="background:none;border:0;color:inherit;opacity:.7;cursor:pointer;padding:0 2px">✎</button>`:''}</div>`:''}${i.heuresAttribuees!=null?`<div class="h-box" data-key="${ECHAPPE(i.sourceCle)}" hidden style="display:flex;align-items:center;gap:6px;margin:2px 0 6px"><input class="h-val" type="number" min="0" max="24" step="0.25" value="${i.heuresAttribuees}" style="width:72px;padding:6px;border-radius:8px"><span style="font-size:11px;opacity:.7">h retenues</span><button class="btn h-save" data-emp="${emp}" data-key="${ECHAPPE(i.sourceCle)}">Enregistrer</button></div>`:''}${ecart?`<div class="ecart-grid"><div class="ecart-cell"><span>Initial</span><b>${euros(i.ecartInitialCentimes)}</b></div><div class="ecart-cell"><span>Final validé</span><b>${euros(i.ecartFinalCentimes)}</b></div><div class="ecart-cell"><span>Impact paie</span><b>${i.impactPaye?'Oui':'Aucun'}</b></div></div>`:''}<div class="item-meta">${ECHAPPE(itemMeta(i))} · ${statut}${i.causeCode?` · motif : ${ECHAPPE(i.causeCode.replaceAll('_',' '))}`:''}</div>${source}${actions}</div>`}
function trouver(emp,key){return RAPPORT.items.find(i=>i.sourceCle===key&&(!emp||i.employeeId===emp))}
async function reload(){document.getElementById('app').innerHTML='<div class="loading">Actualisation et contrôles croisés…</div>';try{RAPPORT=await NexusPayeDonnees.chargerRapport(nexusClient,SITE,MOIS);render()}catch(e){console.error(e);document.getElementById('app').innerHTML=`<div class="alert">NEXUS PAYE n'a pas pu charger le dossier : ${ECHAPPE(e.message||e)}</div>`}}
function bind(){
 document.getElementById('prev').onclick=()=>{const d=new Date(`${MOIS}T12:00:00`);d.setMonth(d.getMonth()-1);MOIS=NexusPayeMoteur.moisISO(d);reload()};
 document.getElementById('next').onclick=()=>{const d=new Date(`${MOIS}T12:00:00`);d.setMonth(d.getMonth()+1);MOIS=NexusPayeMoteur.moisISO(d);reload()};
 document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'}));
 document.querySelectorAll('.h-edit').forEach(b=>b.onclick=()=>{
  const box=document.querySelector(`.h-box[data-key="${b.dataset.key}"]`);
  if(!box)return; box.hidden=!box.hidden; if(!box.hidden)box.querySelector('.h-val').focus();});
 document.querySelectorAll('.h-save').forEach(b=>b.onclick=async()=>{
  const key=b.dataset.key, box=document.querySelector(`.h-box[data-key="${key}"]`);
  const item=trouver(b.dataset.emp,key); if(!item)return;
  const h=Number(String(box.querySelector('.h-val').value).replace(',','.'));
  if(!Number.isFinite(h)||h<0||h>24){alert('Nombre d’heures invalide (0 à 24).');return;}
  b.disabled=true;
  try{await NexusPayeDonnees.enregistrerDecision(nexusClient,{siteId:SITE,employeeId:b.dataset.emp,periode:MOIS,
    item,statut:'valide',impactPaye:true,quantiteMinutes:Math.round(h*60),montantCentimes:null,
    note:`Heures corrigées manuellement : ${h} h (barème NEXUS : ${item.heuresAttribuees} h)`,actorId:EMPLOYEE.id});await reload();}
  catch(e){console.error('NEXUS PAYE — correction des heures :',e);b.disabled=false;
   alert("NEXUS n'a pas pu enregistrer ces heures : "+(e&&e.message?e.message:e)+"\n\nRien n'a été modifié.");}});
 document.querySelectorAll('.rh-declarer').forEach(b=>b.onclick=async()=>{
  const key=b.dataset.key;
  const motif=(document.querySelector(`.rh-motif-new[data-key="${key}"]`)||{}).value||'';
  if(!motif){alert('Choisissez d’abord un motif : NEXUS ne qualifie jamais une absence à votre place.');return;}
  const indet=(document.querySelector(`.rh-indetermine-new[data-key="${key}"]`)||{}).checked;
  b.disabled=true;
  try{await NexusPayeDonnees.declarerIndisponibilite(nexusClient,{siteId:SITE,employeeId:b.dataset.emp,
    dateDebut:b.dataset.debut,dateFin:b.dataset.fin,motif,finIndeterminee:indet,actorId:EMPLOYEE.id});await reload();}
  catch(e){console.error('NEXUS PAYE — déclaration d’absence :',e);b.disabled=false;
   alert("NEXUS n'a pas pu déclarer cette absence : "+(e&&e.message?e.message:e)+"\n\nRien n'a été modifié.");}});
 document.querySelectorAll('.rh-confirmer').forEach(b=>b.onclick=async()=>{
  const ev=b.dataset.ev;
  const motif=(document.querySelector(`.rh-motif[data-ev="${ev}"]`)||{}).value||'';
  if(!motif){alert('Choisissez d’abord un motif : NEXUS ne qualifie jamais une absence à votre place.');return;}
  const indet=(document.querySelector(`.rh-indetermine[data-ev="${ev}"]`)||{}).checked;
  b.disabled=true;
  try{await NexusPayeDonnees.qualifierIndisponibilite(nexusClient,{id:ev,motif,finIndeterminee:indet,actorId:EMPLOYEE.id});reload();}
  catch(e){b.disabled=false;alert('Qualification impossible : '+(e.message||e));}});
 document.querySelectorAll('.rh-reprise').forEach(b=>b.onclick=async()=>{
  const ev=b.dataset.ev;
  const d=prompt('Date de reprise du salarié (AAAA-MM-JJ) :');
  if(!d)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){alert('Format attendu : AAAA-MM-JJ');return;}
  b.disabled=true;
  try{await NexusPayeDonnees.cloturerIndisponibilite(nexusClient,{id:ev,dateReprise:d});reload();}
  catch(e){b.disabled=false;alert('Clôture impossible : '+(e.message||e));}});
 document.querySelectorAll('.jump-review').forEach(b=>b.onclick=()=>document.getElementById('reviewSection').scrollIntoView({behavior:'smooth',block:'start'}));
 document.querySelectorAll('.jump-employees').forEach(b=>b.onclick=()=>document.getElementById('employeesSection').scrollIntoView({behavior:'smooth',block:'start'}));
 document.querySelectorAll('.info-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();const info=INFOS[b.dataset.info];if(!info)return;document.getElementById('infoTitle').textContent=info[0];document.getElementById('infoText').textContent=info[1];document.getElementById('infoModal').hidden=false});
 document.getElementById('closeInfo').onclick=()=>document.getElementById('infoModal').hidden=true;
 document.getElementById('infoModal').onclick=e=>{if(e.target.id==='infoModal')e.currentTarget.hidden=true};
 document.querySelectorAll('.employee-head').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'));
 document.querySelectorAll('.configure').forEach(b=>b.onclick=async e=>{e.stopPropagation();const f=RAPPORT.employes.find(x=>x.employee.id===b.dataset.id);const choix=prompt(`Rattachement de ${f.employee.nom}\n1 = inclus automatique\n2 = inclus, heures manuelles\n3 = hors paie`,f.reglage.inclus?(f.reglage.modePresence==='manuel'?'2':'1'):'3');if(!['1','2','3'].includes(choix))return;await NexusPayeDonnees.enregistrerReglageEmploye(nexusClient,{siteId:SITE,employeeId:f.employee.id,inclusPaye:choix!=='3',modePresence:choix==='1'?'automatique':choix==='2'?'manuel':'exclu',commentaire:null,actorId:EMPLOYEE.id});reload()});
 document.querySelectorAll('.validate').forEach(b=>b.onclick=async()=>decision(b,true));document.querySelectorAll('.exclude').forEach(b=>b.onclick=async()=>decision(b,false));
 document.getElementById('manualDateDebut').onchange=e=>{const fin=document.getElementById('manualDateFin');fin.min=e.target.value||MOIS;if(!fin.value||fin.value<e.target.value)fin.value=e.target.value;majPeriodeManuelle()};
 document.getElementById('manualDateFin').onchange=majPeriodeManuelle;
 document.getElementById('addManual').onclick=addManual;
 document.getElementById('ready').onclick=async()=>{if(RAPPORT.bloqueurs.length)return;const snapshot={genere_le:new Date().toISOString(),periode:MOIS,lignes:NexusPayeMoteur.lignesExport(RAPPORT)};await NexusPayeDonnees.enregistrerPeriode(nexusClient,{siteId:SITE,periode:MOIS,statut:'verifie',snapshot,actorId:EMPLOYEE.id});reload()};
 document.getElementById('sent').onclick=async()=>{await NexusPayeDonnees.enregistrerPeriode(nexusClient,{siteId:SITE,periode:MOIS,statut:'transmis',snapshot:RAPPORT.periodeEnregistree.snapshot,actorId:EMPLOYEE.id});reload()};
 document.getElementById('reopen').onclick=async()=>{if(!confirm('Rouvrir le dossier ? Le snapshot validé sera supprimé.'))return;await NexusPayeDonnees.enregistrerPeriode(nexusClient,{siteId:SITE,periode:MOIS,statut:'brouillon',snapshot:null,actorId:EMPLOYEE.id});reload()};
 document.getElementById('export').onclick=exportCSV;
}
async function decision(btn,valider){const item=trouver(btn.dataset.emp,btn.dataset.key);if(!item)return;if(valider&&item.contestationOuverte){alert('Impossible : la contestation est encore ouverte.');return}if(valider&&item.typeItem==='retard_incoherent'){alert('Ce retard est techniquement incohérent. Corrigez le pointage source ou excluez ce signal, mais ne le validez pas.');return}let montant=null,impact=false;if(valider&&item.typeItem==='ecart_caisse'){const v=prompt('Montant exact à transmettre à la comptable, en euros. NEXUS ne reprend pas automatiquement le montant de référence.','');if(v===null)return;const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0){alert('Montant invalide.');return}montant=Math.round(n*100);impact=true}else if(valider&&['heure_supplementaire','retard','absence_a_verifier','conge_paye','arret_maladie','jour_ferie','acompte','dette'].includes(item.typeItem)){impact=true}btn.disabled=true;try{await NexusPayeDonnees.enregistrerDecision(nexusClient,{siteId:SITE,employeeId:btn.dataset.emp,periode:MOIS,item,statut:valider?'valide':'exclu',impactPaye:impact,montantCentimes:montant,note:null,actorId:EMPLOYEE.id});await reload()}catch(e){console.error('NEXUS PAYE — enregistrement de la décision :',e);btn.disabled=false;alert("NEXUS n'a pas pu enregistrer cette décision : "+(e&&e.message?e.message:e)+"\n\nRien n'a été modifié.")}}
function majPeriodeManuelle(){const debut=document.getElementById('manualDateDebut').value,fin=document.getElementById('manualDateFin').value,resume=document.getElementById('manualPeriodSummary'),btn=document.getElementById('addManual');if(!debut||!fin){resume.textContent='Choisissez la date de début et la date de fin.';btn.textContent='Ajouter et valider';return}try{const dates=NexusPayeDonnees.datesInclusives(debut,fin);resume.textContent=dates.length===1?'1 journée sélectionnée.':`${dates.length} jours sélectionnés, du ${new Date(`${debut}T12:00:00`).toLocaleDateString('fr-FR')} au ${new Date(`${fin}T12:00:00`).toLocaleDateString('fr-FR')}.`;btn.textContent=dates.length===1?'Ajouter et valider':`Ajouter ${dates.length} jours et valider`}catch(_){resume.textContent='La date de fin doit être postérieure ou égale à la date de début.';btn.textContent='Ajouter et valider'}}
async function addManual(){const employeeId=document.getElementById('manualEmployee').value,typeItem=document.getElementById('manualType').value,dateDebut=document.getElementById('manualDateDebut').value,dateFin=document.getElementById('manualDateFin').value||dateDebut,libelle=document.getElementById('manualLabel').value.trim(),min=document.getElementById('manualMinutes').value,montant=document.getElementById('manualAmount').value;if(!employeeId||!dateDebut||!dateFin||!libelle){alert('Employé, période et libellé sont obligatoires.');return}let dates;try{dates=NexusPayeDonnees.datesInclusives(dateDebut,dateFin)}catch(e){alert(e.message||'Période invalide.');return}if((dateDebut<MOIS||dateFin>dernierJourMois())){alert('La période doit rester dans le mois affiché.');return}if(montant!==''&&dates.length>1){alert('Un montant en euros doit être rattaché à une seule date pour éviter de le répéter.');return}if(['acompte','dette'].includes(typeItem)&&montant===''){alert('Le montant est obligatoire pour une dette ou un acompte.');return}const m=montant===''?null:Math.round(Number(String(montant).replace(',','.'))*100);if(montant!==''&&!Number.isFinite(m)){alert('Montant invalide.');return}const btn=document.getElementById('addManual');btn.disabled=true;try{await NexusPayeDonnees.ajouterItemsManuels(nexusClient,{siteId:SITE,employeeId,periode:MOIS,dates,typeItem,libelle,quantiteMinutes:min===''?null:Number(min),montantCentimes:m,impactPaye:['acompte','dette','heure_supplementaire','retard','absence_a_verifier','conge_paye','arret_maladie','jour_ferie'].includes(typeItem),note:libelle,actorId:EMPLOYEE.id});await reload()}catch(e){console.error(e);btn.disabled=false;alert("L'ajout de la période a échoué — réessayez.")}}
function csvCell(v){const s=String(v??'');return `"${s.replace(/"/g,'""')}"`}
function exportCSV(){const snap=RAPPORT.periodeEnregistree&&RAPPORT.periodeEnregistree.snapshot;const lignes=snap&&snap.lignes?snap.lignes:NexusPayeMoteur.lignesExport(RAPPORT);const cols=['employe','type','date','source','ecart_initial','ecart_final','statut','quantite_minutes','montant_euros','impact_paye','commentaire'];const csv='\uFEFF'+[cols.join(';'),...lignes.map(l=>cols.map(c=>csvCell(l[c])).join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`NEXUS-Paye-${SITE}-${MOIS.slice(0,7)}.csv`;a.click();URL.revokeObjectURL(a.href)}
nexusRequireAuth().then(async employee=>{if(!employee)return;if(!['manager','gerant'].includes(employee.role)){document.getElementById('app').innerHTML='<div class="alert">NEXUS PAYE est réservé aux managers et gérants.</div>';return}EMPLOYEE=employee;SITE=employee.site_id;await reload()}).catch(e=>{document.getElementById('app').innerHTML=`<div class="alert">Session indisponible : ${ECHAPPE(e.message||e)}</div>`});
</script></body></html>
