<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
  --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
  --green:#34D399; --green-dim:#153629;
  --amber:#F5A623; --amber-dim:#3A2E14;
  --cyan:#4FC3D9; --cyan-dim:#123138;
  --violet:#8B7FE8; --violet-dim:#241F3D;
  --red:#F0575A; --red-dim:#3A1D1F;
  --gold:#D4AF37; --gold-dim:#332B12;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); font-family:var(--sans); color:var(--text); min-height:100vh;}
body{display:flex; justify-content:center; background-image:radial-gradient(circle at 50% 0%, rgba(79,195,217,0.07), transparent 45%);}
a{color:inherit;}
.app{width:100%; max-width:520px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-bottom:40px;}

.header{padding:20px 20px 14px; position:relative;}
.menu-btn{position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3); border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap;}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
.title{font-size:20px; font-weight:600; margin-top:4px;}
.subtitle{font-family:var(--sans); font-size:12.5px; color:var(--text-mid); margin-top:4px;}
.divider{height:1px; background:var(--hairline); margin:0 20px;}

.section{padding:0 20px;}
.section-label{font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); display:flex; align-items:center; gap:10px; margin:26px 20px 12px;}
.section-label::after{content:''; flex:1; height:1px; background:var(--hairline);}
.section-note{font-family:var(--sans); font-size:11.5px; color:var(--text-mid); line-height:1.5; margin:-6px 20px 14px;}

.accordion-header{display:flex; align-items:center; gap:10px; width:calc(100% - 40px); background:none; border:none; cursor:pointer; padding:8px 0; margin:18px 20px 4px; text-align:left; -webkit-tap-highlight-color:transparent;}
.accordion-head-text{display:flex; flex-direction:column; align-items:flex-start; gap:2px; flex-shrink:0;}
.accordion-title{font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-mid);}
.accordion-subtitle{font-family:var(--sans); font-size:10px; color:var(--text-dim); line-height:1.3;}
.accordion-count{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); text-transform:none; letter-spacing:0; background:var(--panel-raised); border-radius:20px; padding:2px 8px; flex-shrink:0;}
.accordion-line{flex:1; height:1px; background:var(--hairline);}
.accordion-chevron{font-size:11px; color:var(--text-dim); flex-shrink:0; transition:transform .2s ease; display:inline-block;}
.accordion-header[aria-expanded="true"] .accordion-chevron{transform:rotate(180deg);}
.accordion-body{overflow:hidden; max-height:0; transition:max-height .25s ease;}
.accordion-body.open{max-height:5000px;}
.accordion-body > *:first-child{margin-top:2px !important;}
.accordion-body > *:last-child{margin-bottom:14px !important;}

.conseiller-card{display:flex; gap:14px; background:linear-gradient(135deg, rgba(79,195,217,0.08), rgba(79,195,217,0.02)); border:1px solid rgba(79,195,217,0.25); border-radius:14px; padding:18px; margin:0 20px;}
.conseiller-avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--panel-raised); border:1.5px solid rgba(79,195,217,0.4); flex-shrink:0; filter:drop-shadow(0 0 9px rgba(79,195,217,0.5));}
.conseiller-body .conseiller-name{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--cyan); margin-bottom:8px;}
.conseiller-body p{font-size:13px; line-height:1.6; color:var(--text);}
.conseiller-body b{color:var(--cyan);}

.reveles-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.revele-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:13px 11px; text-align:center;}
.revele-tag{font-family:var(--mono); font-size:8.5px; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:8px;}
.revele-jour{font-size:14px; font-weight:700;}
.revele-detail{font-family:var(--mono); font-size:10px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
.revele-vide{font-size:10.5px; color:var(--text-dim); font-style:italic; line-height:1.4; margin-top:8px;}

.compar-panel{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin:0 20px;}
.compar-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.compar-row label{width:64px; flex-shrink:0; font-size:11.5px; color:var(--text-mid);}
.compar-row input[type=date], .compar-row select{flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:6px; padding:8px 9px; color:var(--text); font-family:var(--mono); font-size:12px;}
.btn-comparer{width:100%; margin-top:4px; background:var(--cyan); color:#04141a; border:none; border-radius:8px; padding:11px; font-family:var(--sans); font-weight:600; font-size:13px; cursor:pointer;}
.compar-resultat{margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline);}
.compar-ligne{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0;}
.compar-ligne .cle{color:var(--text-mid);}
.compar-ligne .val{font-family:var(--mono); font-weight:600;}
.compar-evol{margin-top:8px; font-size:12px; font-weight:600;}

.hebdo-row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; margin:0 20px 8px;}
.hebdo-jour{width:76px; flex-shrink:0; font-size:12.5px; font-weight:600;}
.hebdo-occ{margin-top:3px; font-family:var(--mono); font-size:9.5px; font-weight:500; color:var(--text-dim);}
.hebdo-chiffres{flex:1; display:flex; flex-direction:column; gap:3px; font-family:var(--mono); font-size:11px; color:var(--text-mid);}
.hebdo-chiffres b{color:var(--text); font-weight:600;}
.hebdo-ligne{display:flex; align-items:center; gap:6px;}
.hebdo-label{width:54px; flex-shrink:0; color:var(--text-dim); font-size:9.5px; text-transform:uppercase; letter-spacing:.03em;}
.hebdo-evol{font-size:9.5px; font-weight:600;}
.hebdo-statut{font-family:var(--mono); font-size:9px; padding:4px 9px; border-radius:20px; font-weight:700; white-space:nowrap; flex-shrink:0;}

.equipe-sub{font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); margin:14px 20px 8px;}
.equipe-row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; margin:0 20px 8px;}
.equipe-nom{flex:1; font-size:12.5px; font-weight:600;}
.equipe-meta{font-family:var(--mono); font-size:10px; color:var(--text-mid); margin-top:2px;}
.equipe-confiance{font-family:var(--mono); font-size:8.5px; padding:3px 8px; border-radius:20px; font-weight:700; white-space:nowrap; flex-shrink:0;}

.decision-panel{background:var(--panel); border:1px solid rgba(212,175,55,0.3); border-radius:14px; padding:18px; margin:0 20px;}
.decision-tag{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); margin-bottom:10px;}
.decision-texte{font-size:13.5px; line-height:1.6; color:var(--text); margin-bottom:14px;}
.btn-mission{width:100%; background:var(--gold-dim); color:var(--gold); border:1px solid rgba(212,175,55,0.35); border-radius:10px; padding:12px; font-family:var(--sans); font-weight:600; font-size:13px; cursor:pointer;}
.btn-mission:disabled{opacity:0.5; cursor:default;}
.mission-saved{display:none; margin-top:10px; padding:9px; background:var(--green-dim); color:var(--green); border-radius:8px; text-align:center; font-size:12px;}

.litrage-note{margin:0 20px; padding:13px 15px; background:var(--panel-raised); border:1px dashed var(--hairline); border-radius:12px; font-size:11.5px; color:var(--text-mid); line-height:1.55;}

.duo-jours{display:flex; gap:8px; margin:10px 20px 0;}
.duo-item{flex:1; background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:11px 12px; font-size:11.5px; color:var(--text-mid); line-height:1.5;}
.duo-item b{color:var(--text);}
.duo-tag{font-family:var(--mono); font-size:8.5px; letter-spacing:0.05em; text-transform:uppercase; display:block; margin-bottom:4px;}

.carburant-row{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; margin:0 20px 8px;}
.carburant-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.carburant-jour{font-size:12.5px; font-weight:600;}
.carburant-total{font-family:var(--mono); font-size:12.5px; font-weight:700; color:var(--cyan);}
.carburant-detail{font-family:var(--mono); font-size:10.5px; color:var(--text-mid);}

.maturite-badge{display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:5px 11px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:20px; font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--text-mid);}
.maturite-gauge{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:7px;}
.maturite-bar{font-family:var(--mono); font-size:12px; letter-spacing:1px; color:var(--cyan);}
.maturite-progress-txt{font-family:var(--mono); font-size:9.5px; color:var(--text-dim);}
.maturite-confiance{margin-top:5px; font-family:var(--mono); font-size:10px; color:var(--text-mid);}
.maturite-confiance b{color:var(--text); font-weight:700;}

.saison-panel{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px; margin:0 20px;}
.saison-etat{font-size:12px; color:var(--text-mid); line-height:1.6;}
.saison-row{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12px; padding:7px 0; border-bottom:1px solid var(--hairline);}
.saison-row:last-child{border-bottom:none;}
.saison-mois{color:var(--text-mid);}
.saison-val{font-family:var(--mono); font-weight:600; color:var(--text); text-align:right;}

.decouverte-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:14px 15px; margin:0 20px 8px;}
.decouverte-titre{font-size:12.5px; line-height:1.5; color:var(--text); margin-bottom:10px;}
.decouverte-meta{display:flex; flex-wrap:wrap; gap:6px 14px; font-family:var(--mono); font-size:9.5px; color:var(--text-mid);}
.decouverte-meta b{font-weight:700;}
.decouverte-note{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); margin-top:6px;}

.sources-grid{display:flex; flex-direction:column; margin:0 20px; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:4px 15px;}
.source-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--hairline); font-size:11.5px;}
.source-row:last-child{border-bottom:none;}
.source-nom{color:var(--text-mid);}
.source-statut{font-family:var(--mono); font-size:9px; padding:3px 9px; border-radius:20px; font-weight:700; white-space:nowrap; flex-shrink:0;}

.reserve{padding:60px 20px; text-align:center; color:var(--text-dim);}
.loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}
footer{margin-top:auto; padding:20px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline); margin-top:30px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-tempo.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Tempo</div>
    <div class="title">NEXUS Tempo</div>
    <div class="subtitle">Le rythme réel de votre station</div>
    <div id="maturiteZone"></div>
  </div>
  <div class="divider"></div>

  <div id="root"><div class="loading">Analyse du rythme en cours…</div></div>

  <footer>NEXUS Tempo · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // Supabase plafonne chaque requête à 1000 lignes — même garde-fou que
  // partout ailleurs dans NEXUS (Scanner, Cockpit, Verify…).
  async function fetchAllRows(builderFactory, pageSize = 1000) {
    let toutes = [];
    let from = 0;
    while (true) {
      const { data, error } = await builderFactory().range(from, from + pageSize - 1);
      if (error) return { data: null, error };
      toutes = toutes.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    return { data: toutes, error: null };
  }

  // Météo (25/07/2026) — Open-Meteo, API gratuite sans clé. Coordonnées
  // de la station dans nexus-tempo.js (NexusTempo.COORDONNEES_STATION,
  // dérivées du Plus Code donné par Frédéric). Un échec réseau ne doit
  // jamais bloquer le reste de la page : on retombe sur null et
  // NexusTempo.analyserMeteo affiche honnêtement "Météo indisponible".
  async function recupererMeteo(joursExploitables) {
    if (!joursExploitables.length) return null;
    const dates = joursExploitables.map(j => j.date).sort();
    const debut = dates[0], fin = dates[dates.length - 1];
    const { latitude, longitude, timezone } = NexusTempo.COORDONNEES_STATION;
    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${latitude}&longitude=${longitude}&start_date=${debut}&end_date=${fin}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&timezone=${encodeURIComponent(timezone)}`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const meteoParDate = {};
      const jours = (data.daily && data.daily.time) || [];
      jours.forEach((date, i) => {
        meteoParDate[date] = {
          precipitationMm: data.daily.precipitation_sum ? data.daily.precipitation_sum[i] : null,
          tempMax: data.daily.temperature_2m_max ? data.daily.temperature_2m_max[i] : null,
          tempMin: data.daily.temperature_2m_min ? data.daily.temperature_2m_min[i] : null,
        };
      });
      return meteoParDate;
    } catch (err) {
      console.error('Récupération météo (Open-Meteo):', err);
      return null;
    }
  }

  function fmtEur(v) { return Math.round(v).toLocaleString('fr-FR') + ' €'; }
  function fmtPct(v) { return `${v >= 0 ? '+' : ''}${(v * 100).toFixed(1).replace('.', ',')} %`; }
  function fmtDateCourt(iso) {
    const d = NexusTempo.dateLocale(iso);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
  }

  const STATUT_STYLE = {
    'Jour moteur':       { bg: 'var(--green-dim)', fg: 'var(--green)' },
    'Jour solide':       { bg: 'var(--cyan-dim)', fg: 'var(--cyan)' },
    'Jour stable':       { bg: 'var(--panel-raised)', fg: 'var(--text-mid)' },
    'Jour irrégulier':   { bg: 'var(--violet-dim)', fg: 'var(--violet)' },
    'Jour à renforcer':  { bg: 'var(--amber-dim)', fg: 'var(--amber)' },
    'Jour en recul':     { bg: 'var(--red-dim)', fg: 'var(--red)' },
    'Aucune donnée':     { bg: 'var(--panel-raised)', fg: 'var(--text-dim)' },
  };
  const CONFIANCE_STYLE = {
    forte:        { bg: 'var(--green-dim)', fg: 'var(--green)', label: 'Confiance forte' },
    moyenne:      { bg: 'var(--amber-dim)', fg: 'var(--amber)', label: 'Confiance moyenne' },
    insuffisante: { bg: 'var(--panel-raised)', fg: 'var(--text-dim)', label: 'Données insuffisantes' },
  };
  const CONFIANCE_DECOUVERTE_COLOR = {
    'Très forte': 'var(--green)', 'Forte': 'var(--cyan)', 'Moyenne': 'var(--amber)',
    'Faible': 'var(--text-mid)', 'Très faible': 'var(--text-dim)',
  };
  const SOURCE_STATUT_STYLE = {
    connectee: { bg: 'var(--green-dim)', fg: 'var(--green)', label: 'Connectée' },
    prevue: { bg: 'var(--panel-raised)', fg: 'var(--text-dim)', label: 'Prévue' },
  };

  // Ordre d'affichage "semaine française" (lundi → dimanche) — l'index
  // interne du moteur suit la convention JS Date.getDay() (0=dimanche).
  const ORDRE_AFFICHAGE = [1, 2, 3, 4, 5, 6, 0];

  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.getElementById('app').innerHTML = '<div class="reserve">Cet écran est réservé aux managers.</div>';
      return;
    }
    const siteId = employee.site_id || 'vito-sainte-marie';

    const [{ data: auditsRows, error: e1 }, { data: employesRows, error: e2 }, { data: stockRows, error: e3 }] = await Promise.all([
      fetchAllRows(() => nexusClient.from('audits_caisse')
        .select('date, quart, vente_piste, vente_boutique, ecart_piste, ecart_boutique, employes_piste, employes_boutique, litrage_gazole, litrage_sp95, litrage_gnr')
        .eq('site', siteId).order('date', { ascending: true })),
      nexusClient.from('employees').select('id, nom, role').eq('site_id', siteId),
      // Scanner Stock (25/07/2026) : recalculé de façon irrégulière (pas
      // encore un cron quotidien) — voir nexus-tempo.js pour comment ce
      // décalage est géré honnêtement (agregerStockParJour/analyserStock).
      fetchAllRows(() => nexusClient.from('stock_sante_historique')
        .select('calcule_le, indice_confiance, nb_references_stables, nb_references_a_surveiller, nb_references_a_verifier, nb_references_non_concluantes, risque_estime_eur')
        .eq('site', siteId).order('calcule_le', { ascending: true })),
    ]);
    if (e1) console.error('Chargement audits_caisse:', e1);
    if (e2) console.error('Chargement employees:', e2);
    if (e3) console.error('Chargement stock_sante_historique:', e3);

    const employesParId = {};
    (employesRows || []).forEach(e => { employesParId[e.id] = e; });

    const joursAgreges = NexusTempo.agregerParJour(auditsRows || []);
    // Jours "clos" uniquement (25/07/2026, demande de Frédéric) : le
    // jour en cours n'est jamais compté comme exploitable, même s'il a
    // déjà un audit saisi — sa journée n'est pas terminée. Toute la
    // mémoire temporelle (maturité, confiance, décision, saisonnier,
    // découvertes, classement hebdomadaire) se base sur ces jours
    // exploitables, jamais sur le total brut des jours enregistrés.
    const joursExploitables = NexusTempo.filtrerJoursClos(joursAgreges);
    const regroupement = NexusTempo.regrouperParJourSemaine(joursExploitables);
    const classement = NexusTempo.calculerClassement(regroupement);
    const joursReveles = NexusTempo.identifierJoursReveles(classement);
    const meilleursSepares = NexusTempo.identifierMeilleursJoursSepares(classement);
    const classementLitrage = NexusTempo.classementLitrage(classement);
    // L'analyse équipe reste sur les quarts complets déjà saisis (un
    // quart enregistré est une donnée exacte et définitive, même si la
    // journée qui le contient n'est pas terminée) — seuls les TOTAUX
    // journaliers (piste+boutique, classement par jour) exigent une
    // journée close pour être comparables entre eux.
    const analyseEquipe = NexusTempo.analyserEquipe(joursAgreges, employesParId);
    const decision = NexusTempo.genererDecisionPrioritaire(joursExploitables, classement);

    // Mémoire temporelle (25/07/2026) — Niveaux 3 & 4 : ces analyses
    // renvoient honnêtement "insuffisant"/"en apprentissage" tant que
    // l'historique ne le permet pas (voir nexus-tempo.js, Article 5).
    const maturite = NexusTempo.calculerMaturite(joursExploitables);
    const confianceGlobale = NexusTempo.calculerConfianceGlobale(joursExploitables, classement);
    const saisonnier = NexusTempo.analyserSaisonnier(joursExploitables);
    const debutFinMois = NexusTempo.analyserDebutFinMois(joursExploitables);

    // Météo (25/07/2026) — source externe, jamais bloquante : un échec
    // réseau retombe sur meteoParDate=null et NexusTempo.analyserMeteo
    // l'annonce clairement au lieu de deviner.
    const meteoParDate = await recupererMeteo(joursExploitables);
    const joursAvecMeteo = NexusTempo.croiserMeteo(joursExploitables, meteoParDate);
    const analyseMeteo = NexusTempo.analyserMeteo(joursAvecMeteo);

    // Scanner Stock (25/07/2026) — deuxième source interne connectée.
    // stockParDate ne contient qu'un instantané par jour LOCAL
    // (Martinique, UTC-4) — voir NexusTempo.agregerStockParJour.
    const stockParDate = NexusTempo.agregerStockParJour(stockRows || []);
    const etatStockActuel = NexusTempo.dernierEtatStock(stockParDate);
    const joursAvecStock = NexusTempo.croiserStock(joursExploitables, stockParDate);
    const analyseStock = NexusTempo.analyserStock(joursAvecStock);

    const decouvertes = NexusTempo.genererDecouvertes(classement, joursAgreges, employesParId, joursAvecMeteo, joursAvecStock);

    document.getElementById('maturiteZone').innerHTML = renderMaturite(maturite, confianceGlobale);

    renderTout({ siteId, employee, joursAgreges, joursExploitables, classement, joursReveles, meilleursSepares, classementLitrage, analyseEquipe, decision, saisonnier, debutFinMois, decouvertes, analyseMeteo, analyseStock, etatStockActuel });
  });

  // ------------------------------------------------------------
  // Bloc 1 — Résumé du Conseiller NEXUS
  // ------------------------------------------------------------
  function texteConseiller(joursAgreges, joursExploitables, joursReveles, meilleursSepares) {
    if (!joursAgreges.length) {
      return "Aucun audit de caisse enregistré pour l'instant. NEXUS Tempo s'active dès que les audits quotidiens (Nexus Verify) commencent à s'accumuler — un jour de semaine devient lisible à partir de sa première occurrence, fiable à partir de sa deuxième.";
    }
    let texte = '';

    // Distinction jours enregistrés / jours exploitables (25/07/2026,
    // demande de Frédéric) : le jour en cours peut déjà avoir un audit
    // saisi sans que sa journée soit terminée — il compte comme
    // "enregistré" mais pas encore "exploitable" pour les moyennes par
    // jour de semaine. Le dire explicitement évite toute impression de
    // contradiction avec la jauge de maturité, qui ne compte elle aussi
    // que les jours clos.
    const nbEnregistres = joursAgreges.length;
    const nbExploitables = joursExploitables.length;
    if (nbExploitables !== nbEnregistres) {
      const nbEnCours = nbEnregistres - nbExploitables;
      texte += `Sur ${nbEnregistres} jour${nbEnregistres > 1 ? 's' : ''} enregistré${nbEnregistres > 1 ? 's' : ''}, ${nbExploitables} dispose${nbExploitables > 1 ? 'nt' : ''} de données suffisamment complètes pour être analysé${nbExploitables > 1 ? 's' : ''}${nbEnCours > 0 ? ` (le${nbEnCours > 1 ? 's' : ''} ${nbEnCours > 1 ? 'derniers jours' : 'dernier jour'} étant encore en cours)` : ''}. `;
    } else {
      texte += `Sur ${nbEnregistres} jour${nbEnregistres > 1 ? 's' : ''} enregistré${nbEnregistres > 1 ? 's' : ''}, tous exploitables, `;
    }

    if (!nbExploitables) {
      return texte + "l'historique clos est encore trop court pour une lecture fiable du rythme de la station.";
    }

    const { jourMoteur, jourProgression, jourARenforcer } = joursReveles;
    const { meilleurPiste, meilleurBoutique } = meilleursSepares || {};

    // Distinction piste / boutique (25/07/2026, demande de Frédéric) : les
    // deux meilleurs jours peuvent diverger — ex. "meilleures ventes en
    // piste le vendredi, en revanche la boutique a mieux fonctionné mardi
    // dernier". On ne l'affirme que si les deux jours sont identifiables,
    // même avec une seule occurrence chacun : c'est un constat de ce qui a
    // été observé, pas une tendance.
    if (meilleurPiste && meilleurBoutique && meilleurPiste.jourSemaine !== meilleurBoutique.jourSemaine) {
      texte += `le <b>${meilleurPiste.nom}</b> reste votre meilleur jour en piste (${fmtEur(meilleurPiste.moyennePiste)} en moyenne), tandis que le <b>${meilleurBoutique.nom}</b> a mieux fonctionné côté boutique (${fmtEur(meilleurBoutique.moyenneBoutique)} en moyenne). `;
    } else if (jourMoteur) {
      texte += `le <b>${jourMoteur.nom}</b> reste votre journée la plus performante avec ${fmtEur(jourMoteur.moyenneCombinee)} de CA moyen (piste + boutique). `;
    }
    if (jourARenforcer && jourARenforcer.jourSemaine !== (jourMoteur && jourMoteur.jourSemaine)) {
      texte += `Le <b>${jourARenforcer.nom}</b> reste le point faible global`;
      if (jourARenforcer.evolutionCombinee !== null) texte += `, ${fmtPct(jourARenforcer.evolutionCombinee)} sur la dernière occurrence`;
      texte += `. `;
    }
    if (jourProgression) {
      texte += `Le <b>${jourProgression.nom}</b> progresse le plus (${fmtPct(jourProgression.evolutionCombinee)}) sur son historique récent.`;
    } else {
      texte += `Historique clos encore trop court pour identifier une progression fiable — chaque nouvelle journée terminée affine cette lecture.`;
    }
    return texte;
  }

  // ------------------------------------------------------------
  // Valeur "piste" affichée — litrage global (25/07/2026, demande de
  // Frédéric) dès qu'un jour a du litrage saisi, tous carburants confondus
  // (pas de détail GO/SP95/GNR ici — ce détail reste dans le bloc
  // "Carburants" plus bas). Retombe sur le CA piste en € tant qu'aucun
  // litrage n'existe pour ce jour (données antérieures au 25/07/2026).
  // Ne change PAS le classement (toujours basé sur le CA combiné piste +
  // boutique) — seul l'affichage du chiffre piste change.
  // ------------------------------------------------------------
  function valeurPisteAffichee(jour) {
    if (jour.nbOccLitrage > 0) return `${Math.round(jour.litrageMoyenTotal).toLocaleString('fr-FR')} L`;
    return fmtEur(jour.moyennePiste);
  }

  // ------------------------------------------------------------
  // Bloc 2 — Jours révélés
  // ------------------------------------------------------------
  function renderJoursReveles(joursReveles) {
    const { jourMoteur, jourProgression, jourARenforcer } = joursReveles;
    function carte(tag, couleur, jour, extra) {
      if (!jour) return `<div class="revele-card"><div class="revele-tag" style="color:${couleur};">${tag}</div><div class="revele-vide">Historique encore insuffisant.</div></div>`;
      return `<div class="revele-card">
        <div class="revele-tag" style="color:${couleur};">${tag}</div>
        <div class="revele-jour">${jour.nom.charAt(0).toUpperCase() + jour.nom.slice(1)}</div>
        <div class="revele-detail">${extra}</div>
      </div>`;
    }
    return `<div class="reveles-grid">
      ${carte('Jour moteur', 'var(--green)', jourMoteur, jourMoteur ? `${valeurPisteAffichee(jourMoteur)} piste<br>${fmtEur(jourMoteur.moyenneBoutique)} boutique` : '')}
      ${carte('En progression', 'var(--cyan)', jourProgression, jourProgression ? `${fmtPct(jourProgression.evolutionCombinee)}<br>vs historique` : '')}
      ${carte('À renforcer', 'var(--amber)', jourARenforcer, jourARenforcer ? `${valeurPisteAffichee(jourARenforcer)} piste<br>${fmtEur(jourARenforcer.moyenneBoutique)} boutique` : '')}
    </div>`;
  }

  // Duo piste / boutique (25/07/2026) : montre les deux meilleurs jours
  // séparément quand ils ne coïncident pas — un simple constat, valable dès
  // la première occurrence de chacun (voir texteConseiller pour la même
  // idée en phrase complète).
  function renderDuoJours(meilleursSepares) {
    const { meilleurPiste, meilleurBoutique } = meilleursSepares || {};
    if (!meilleurPiste || !meilleurBoutique || meilleurPiste.jourSemaine === meilleurBoutique.jourSemaine) return '';
    return `<div class="duo-jours">
      <div class="duo-item"><span class="duo-tag" style="color:var(--cyan);">Meilleur jour · Piste</span><b>${meilleurPiste.nom.charAt(0).toUpperCase() + meilleurPiste.nom.slice(1)}</b> — ${valeurPisteAffichee(meilleurPiste)} en moyenne</div>
      <div class="duo-item"><span class="duo-tag" style="color:var(--amber);">Meilleur jour · Boutique</span><b>${meilleurBoutique.nom.charAt(0).toUpperCase() + meilleurBoutique.nom.slice(1)}</b> — ${fmtEur(meilleurBoutique.moyenneBoutique)} en moyenne</div>
    </div>`;
  }

  // ------------------------------------------------------------
  // Bloc "Carburants" — litrage réel par jour de semaine, uniquement pour
  // les jours où l'audit a été saisi avec le détail par carburant (voir
  // agregerParJour dans nexus-tempo.js). Tant qu'aucun audit n'a ce détail,
  // NEXUS l'annonce clairement plutôt que d'estimer.
  // ------------------------------------------------------------
  function renderCarburants(classementLitrage) {
    if (!classementLitrage.length) {
      return `<div class="litrage-note">⛽ ${NexusTempo.LITRAGE_INDISPONIBLE}</div>`;
    }
    return classementLitrage.map((j, i) => `
      <div class="carburant-row">
        <div class="carburant-top">
          <div class="carburant-jour">${i + 1}. ${j.nom.charAt(0).toUpperCase() + j.nom.slice(1)}</div>
          <div class="carburant-total">${Math.round(j.litrageMoyenTotal).toLocaleString('fr-FR')} L</div>
        </div>
        <div class="carburant-detail">GO ${Math.round(j.litrageMoyenGazole).toLocaleString('fr-FR')} L · SP95 ${Math.round(j.litrageMoyenSp95).toLocaleString('fr-FR')} L · GNR ${Math.round(j.litrageMoyenGnr).toLocaleString('fr-FR')} L · ${j.nbOccLitrage} occurrence${j.nbOccLitrage > 1 ? 's' : ''} avec détail</div>
      </div>`).join('');
  }

  // ------------------------------------------------------------
  // Bloc 3 — Comparateur (deux périodes, filtre jour de semaine)
  // ------------------------------------------------------------
  function calculerPeriode(joursAgreges, debut, fin, jourFiltre) {
    const lignes = joursAgreges.filter(j => j.date >= debut && j.date <= fin && (jourFiltre === 'tous' || String(j.jourSemaine) === jourFiltre));
    const ventePiste = lignes.reduce((s, j) => s + j.ventePiste, 0);
    const venteBoutique = lignes.reduce((s, j) => s + j.venteBoutique, 0);
    return { nbJours: lignes.length, ventePiste, venteBoutique, total: ventePiste + venteBoutique };
  }

  function renderComparateur(joursAgreges) {
    const optionsJour = NexusTempo.NOM_JOURS.map((n, i) => `<option value="${i}">${n.charAt(0).toUpperCase() + n.slice(1)}</option>`).join('');
    const aujourdhui = new Date();
    const iso = d => d.toISOString().slice(0, 10);
    const finA = iso(aujourdhui);
    const debutA = iso(new Date(aujourdhui.getTime() - 6 * 86400000));
    const finB = iso(new Date(aujourdhui.getTime() - 7 * 86400000));
    const debutB = iso(new Date(aujourdhui.getTime() - 13 * 86400000));

    setTimeout(() => {
      document.getElementById('compDebutA').value = debutA;
      document.getElementById('compFinA').value = finA;
      document.getElementById('compDebutB').value = debutB;
      document.getElementById('compFinB').value = finB;
      document.getElementById('btnComparer').addEventListener('click', () => {
        const dA1 = document.getElementById('compDebutA').value, dA2 = document.getElementById('compFinA').value;
        const dB1 = document.getElementById('compDebutB').value, dB2 = document.getElementById('compFinB').value;
        const jourFiltre = document.getElementById('compJour').value;
        if (!dA1 || !dA2 || !dB1 || !dB2) { alert('Renseignez les deux périodes.'); return; }
        const pA = calculerPeriode(joursAgreges, dA1, dA2, jourFiltre);
        const pB = calculerPeriode(joursAgreges, dB1, dB2, jourFiltre);
        const evolTotal = NexusTempo.evolution(pA.total, pB.total);
        const resultat = document.getElementById('compResultat');
        resultat.style.display = 'block';
        resultat.innerHTML = `
          <div class="compar-ligne"><span class="cle">Période A (${pA.nbJours} jour${pA.nbJours > 1 ? 's' : ''})</span><span class="val">${fmtEur(pA.total)}</span></div>
          <div class="compar-ligne"><span class="cle">— dont piste</span><span class="val">${fmtEur(pA.ventePiste)}</span></div>
          <div class="compar-ligne"><span class="cle">— dont boutique</span><span class="val">${fmtEur(pA.venteBoutique)}</span></div>
          <div class="compar-ligne" style="margin-top:8px;"><span class="cle">Période B (${pB.nbJours} jour${pB.nbJours > 1 ? 's' : ''})</span><span class="val">${fmtEur(pB.total)}</span></div>
          <div class="compar-ligne"><span class="cle">— dont piste</span><span class="val">${fmtEur(pB.ventePiste)}</span></div>
          <div class="compar-ligne"><span class="cle">— dont boutique</span><span class="val">${fmtEur(pB.venteBoutique)}</span></div>
          ${(pA.nbJours === 0 || pB.nbJours === 0)
            ? `<div class="compar-evol" style="color:var(--text-dim);">Au moins une des deux périodes n'a aucune donnée — comparaison non fiable.</div>`
            : `<div class="compar-evol" style="color:${evolTotal >= 0 ? 'var(--green)' : 'var(--red)'};">${fmtPct(evolTotal)} entre B et A</div>`}
        `;
      });
    }, 0);

    return `<div class="compar-panel">
      <div class="compar-row"><label>Période A</label><input type="date" id="compDebutA"><input type="date" id="compFinA"></div>
      <div class="compar-row"><label>Période B</label><input type="date" id="compDebutB"><input type="date" id="compFinB"></div>
      <div class="compar-row"><label>Jour</label><select id="compJour"><option value="tous">Tous les jours</option>${optionsJour}</select></div>
      <button class="btn-comparer" id="btnComparer">Comparer</button>
      <div class="compar-resultat" id="compResultat" style="display:none;"></div>
    </div>`;
  }

  // ------------------------------------------------------------
  // Bloc 4 — Vue hebdomadaire
  // ------------------------------------------------------------
  function renderVueHebdo(classement) {
    return ORDRE_AFFICHAGE.map(idx => {
      const j = classement[idx];
      const style = STATUT_STYLE[j.statut] || STATUT_STYLE['Aucune donnée'];
      const occText = j.occurrences.length === 0
        ? ''
        : `${j.occurrences.length} occurrence${j.occurrences.length > 1 ? 's' : ''}`;
      const chiffres = j.occurrences.length === 0
        ? `<div class="hebdo-ligne" style="color:var(--text-dim);">Aucune donnée</div>`
        : `<div class="hebdo-ligne"><span class="hebdo-label">Piste</span><b>${fmtEur(j.moyennePiste)}</b></div>
           <div class="hebdo-ligne"><span class="hebdo-label">Boutique</span><b>${fmtEur(j.moyenneBoutique)}</b>${j.evolutionCombinee !== null ? ` <span class="hebdo-evol" style="color:${j.evolutionCombinee >= 0 ? 'var(--green)' : 'var(--red)'};">${fmtPct(j.evolutionCombinee)}</span>` : ''}</div>`;
      return `<div class="hebdo-row">
        <div class="hebdo-jour">${j.nom.charAt(0).toUpperCase() + j.nom.slice(1)}<div class="hebdo-occ">${occText}</div></div>
        <div class="hebdo-chiffres">${chiffres}</div>
        <div class="hebdo-statut" style="background:${style.bg}; color:${style.fg};">${j.statut}</div>
      </div>`;
    }).join('');
  }

  // ------------------------------------------------------------
  // Bloc 5 — Analyse équipe (jamais de causalité affirmée)
  // ------------------------------------------------------------
  function renderEquipeListe(liste, metricLabel) {
    if (!liste.length) return `<div class="section-note" style="margin:0 0 10px;">Aucune donnée pour ce rôle.</div>`;
    return liste.map(e => {
      const c = CONFIANCE_STYLE[e.confiance];
      return `<div class="equipe-row">
        <div>
          <div class="equipe-nom">${e.nom}</div>
          <div class="equipe-meta">${metricLabel} ${fmtEur(e.moyenneVente)} · ${e.nbQuarts} quart${e.nbQuarts > 1 ? 's' : ''} observé${e.nbQuarts > 1 ? 's' : ''}</div>
        </div>
        <div class="equipe-confiance" style="background:${c.bg}; color:${c.fg}; margin-left:auto;">${c.label}</div>
      </div>`;
    }).join('');
  }

  function renderEquipe(analyseEquipe) {
    const piste = analyseEquipe.filter(e => e.role === 'piste');
    const boutique = analyseEquipe.filter(e => e.role === 'boutique');
    return `
      <div class="section-note" style="margin:-6px 20px 14px;">NEXUS parle de <b>contribution observée dans un contexte comparable</b>, jamais de performance individuelle certaine — le résultat d'un quart dépend aussi du jour, du trafic, des collègues présents et des ruptures éventuelles.</div>
      <div class="equipe-sub">Piste</div>
      ${renderEquipeListe(piste, 'Moyenne vente piste/quart')}
      <div class="equipe-sub">Boutique</div>
      ${renderEquipeListe(boutique, 'Moyenne vente boutique/quart')}
    `;
  }

  // ------------------------------------------------------------
  // Bloc 6 — Décision NEXUS + création de mission terrain
  // ------------------------------------------------------------
  async function creerMissionTempo(siteId, employee, jourARenforcer, decisionMessage) {
    const slug = jourARenforcer.nom.normalize('NFD').replace(/[̀-ͯ]/g, '');
    const missionId = `TEMPO-${slug}-${Date.now()}`;
    const { error: e1 } = await nexusClient.from('mission_catalog').insert({
      mission_id: missionId,
      titre: `Contrôler le ${jourARenforcer.nom}`,
      pourquoi: decisionMessage,
      famille: 'Tempo',
      role_required: ['manager', 'gerant'],
      site: siteId, site_id: siteId,
      priority: 'normale',
      proof_required: false,
      validation_type: 'manager',
      points: 5,
      actif: true,
      necessite_produit: false,
      ponctuelle: true,
    });
    if (e1) { console.error('Création mission_catalog (Tempo):', e1); return false; }
    const { error: e2 } = await nexusClient.from('mission_assignments').insert({
      mission_id: missionId,
      assigned_to_role: 'manager',
      assigned_by_employee_id: employee.id,
      status: 'assignee',
      site_id: siteId,
      note: decisionMessage,
    });
    if (e2) { console.error('Création mission_assignments (Tempo):', e2); return false; }
    // Trace la décision dans journal_decisions pour que Capital NEXUS
    // puisse un jour en mesurer l'impact — même circuit que les autres
    // règles NEXUS (R2/R3/R4/R5).
    await nexusClient.from('journal_decisions').insert({
      site: siteId, candidate_id: missionId, rule_id: 'R6-TEMPO-JOUR', etat: '🗓️ TEMPO',
      recommandation: decisionMessage, impact_eur: 0,
      article: jourARenforcer.nom, categorie: 'Rythme hebdomadaire',
      date: new Date().toISOString().slice(0, 10), heure: new Date().toTimeString().slice(0, 5),
      employee_id: employee.id,
    });
    return true;
  }

  function renderDecision(decision, siteId, employee) {
    if (!decision.disponible) {
      return `<div class="decision-panel"><div class="decision-tag">Priorité NEXUS</div><div class="decision-texte">${decision.message}</div></div>`;
    }
    return `<div class="decision-panel">
      <div class="decision-tag">Priorité NEXUS</div>
      <div class="decision-texte">${decision.message}</div>
      <button class="btn-mission" id="btnCreerMission">Créer une mission terrain</button>
      <div class="mission-saved" id="missionSaved">✓ Mission créée et assignée au manager</div>
    </div>`;
  }

  function branchBoutonMission(decision, siteId, employee) {
    if (!decision.disponible) return;
    const btn = document.getElementById('btnCreerMission');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Création…';
      const ok = await creerMissionTempo(siteId, employee, decision.jour, decision.message);
      if (!ok) { btn.disabled = false; btn.textContent = 'Créer une mission terrain'; alert('Erreur — réessayez.'); return; }
      btn.style.display = 'none';
      document.getElementById('missionSaved').style.display = 'block';
    });
  }

  // ------------------------------------------------------------
  // Maturité de Tempo — indicateur affiché dans l'en-tête (25/07/2026).
  // Un système vivant : plus l'historique s'accumule, plus Tempo peut
  // affirmer des choses. Jamais de saut de niveau artificiel.
  // ------------------------------------------------------------
  function renderMaturite(m, confiancePct) {
    const TOTAL_BARRES = 10;
    const proportion = m.seuilSuivant !== null
      ? Math.max(0, Math.min(1, (m.joursHistorique - m.seuilPrecedent) / (m.seuilSuivant - m.seuilPrecedent)))
      : 1;
    const rempli = Math.round(proportion * TOTAL_BARRES);
    const barreVisuelle = '█'.repeat(rempli) + '░'.repeat(TOTAL_BARRES - rempli);
    const texteProgression = m.seuilSuivant !== null
      ? `${m.joursHistorique} / ${m.seuilSuivant} jours avant niveau ${m.niveau + 1}`
      : `${m.joursHistorique} jours d'historique — niveau maximal atteint`;
    return `
      <div class="maturite-badge">${m.emoji} Niveau ${m.niveau} · ${m.label}</div>
      <div class="maturite-gauge">
        <span class="maturite-bar">${barreVisuelle}</span>
        <span class="maturite-progress-txt">${texteProgression}</span>
      </div>
      <div class="maturite-confiance">Confiance Tempo <b>${confiancePct} %</b></div>
    `;
  }

  // ------------------------------------------------------------
  // Bloc Niveau 3 — Cycles saisonniers. Affiche les mois pour lesquels
  // au moins deux occurrences existent ; sinon l'état d'apprentissage
  // honnête défini dans nexus-tempo.js. Le début/fin de mois est un
  // signal exploitable même avec un historique court, affiché à part.
  // ------------------------------------------------------------
  function renderSaisonnier(saisonnier, debutFinMois) {
    let html = '';
    if (!saisonnier.disponible) {
      html += `<div class="saison-panel"><div class="saison-etat">📅 ${saisonnier.message}<br><br>Ce module apprend progressivement : les mois, les semaines, les jours fériés, les débuts et fins de mois, les saisons — puis, à terme, les vacances scolaires, les ponts et les événements locaux (voir « Sources de données » plus bas).</div></div>`;
    } else {
      const lignes = saisonnier.moisAnalyse.filter(m => m.disponible).map(m =>
        `<div class="saison-row"><span class="saison-mois">${m.nomMois.charAt(0).toUpperCase() + m.nomMois.slice(1)}</span><span class="saison-val">${fmtEur(m.moyenneCombinee)}<br><span style="font-weight:400; color:var(--text-dim); font-size:9.5px;">${m.nbPeriodesObservees} périodes observées</span></span></div>`
      ).join('');
      html += `<div class="saison-panel">${lignes}</div>`;
    }
    if (debutFinMois.comparaisonDisponible) {
      const sens = debutFinMois.ecartFinVsDebut >= 0 ? 'Les fins de mois génèrent en moyenne plus de CA que les débuts de mois' : 'Les débuts de mois génèrent en moyenne plus de CA que les fins de mois';
      html += `<div class="section-note">${sens} sur la période observée (${fmtPct(debutFinMois.ecartFinVsDebut)} — ${debutFinMois.debut.nbJours} jour${debutFinMois.debut.nbJours > 1 ? 's' : ''} en début, ${debutFinMois.fin.nbJours} en fin de mois).</div>`;
    } else {
      html += `<div class="section-note">Comparaison début / fin de mois : données insuffisantes pour l'instant (au moins ${NexusTempo.SEUILS.MIN_OCCURRENCES_TENDANCE} jours de chaque côté sont nécessaires).</div>`;
    }
    return html;
  }

  // ------------------------------------------------------------
  // Bloc Météo — première source externe connectée (25/07/2026,
  // Open-Meteo). Compare les jours de pluie et les jours secs, sans
  // jamais affirmer de corrélation tant que les deux groupes n'ont pas
  // assez d'occurrences chacun (voir NexusTempo.analyserMeteo).
  // ------------------------------------------------------------
  function renderMeteo(analyseMeteo) {
    if (!analyseMeteo.disponible) {
      return `<div class="saison-panel"><div class="saison-etat">🌦️ ${analyseMeteo.message}</div></div>`;
    }
    const { joursPluie, joursSecs, ecartPiste, ecartBoutique } = analyseMeteo;
    return `<div class="saison-panel">
        <div class="saison-row"><span class="saison-mois">Jours de pluie (${joursPluie.nbJours})</span><span class="saison-val">${fmtEur(joursPluie.moyennePiste)} piste<br><span style="font-weight:400; color:var(--text-dim); font-size:9.5px;">${fmtEur(joursPluie.moyenneBoutique)} boutique</span></span></div>
        <div class="saison-row"><span class="saison-mois">Jours secs (${joursSecs.nbJours})</span><span class="saison-val">${fmtEur(joursSecs.moyennePiste)} piste<br><span style="font-weight:400; color:var(--text-dim); font-size:9.5px;">${fmtEur(joursSecs.moyenneBoutique)} boutique</span></span></div>
      </div>
      <div class="section-note">Écart pluie vs sec : ${fmtPct(ecartPiste)} en piste, ${fmtPct(ecartBoutique)} en boutique — sur la période observée.</div>`;
  }

  // ------------------------------------------------------------
  // Bloc Scanner Stock — deuxième source interne connectée (25/07/2026).
  // Deux parties : un contexte "état actuel" toujours affichable (pas
  // une tendance, juste le dernier calcul connu), puis une tentative de
  // corrélation par jour, honnêtement "non mesurable" tant que Scanner
  // Stock ne recalcule pas son indice à un rythme quotidien régulier.
  // ------------------------------------------------------------
  function renderStock(analyseStock, etatStockActuel) {
    let html = '';
    if (etatStockActuel) {
      html += `<div class="saison-panel">
        <div class="saison-row"><span class="saison-mois">Indice de confiance stock</span><span class="saison-val">${Math.round(etatStockActuel.indiceConfiance)} / 100</span></div>
        <div class="saison-row"><span class="saison-mois">Risque estimé</span><span class="saison-val">${fmtEur(etatStockActuel.risqueEstimeEur)}</span></div>
        <div class="saison-row"><span class="saison-mois">Références à traiter</span><span class="saison-val">${etatStockActuel.nbASurveiller + etatStockActuel.nbAVerifier}</span></div>
      </div>
      <div class="section-note">État Scanner Stock au ${fmtDateCourt(etatStockActuel.date)} — dernier calcul connu, pas une moyenne.</div>`;
    } else {
      html += `<div class="saison-panel"><div class="saison-etat">📦 Aucune donnée Scanner Stock disponible pour l'instant.</div></div>`;
    }
    if (analyseStock.disponible) {
      const { joursSousSurveillance, joursSansAlerte, ecartPiste, ecartBoutique } = analyseStock;
      html += `<div class="saison-panel" style="margin-top:8px;">
          <div class="saison-row"><span class="saison-mois">Jours avec alerte (${joursSousSurveillance.nbJours})</span><span class="saison-val">${fmtEur(joursSousSurveillance.moyennePiste)} piste<br><span style="font-weight:400; color:var(--text-dim); font-size:9.5px;">${fmtEur(joursSousSurveillance.moyenneBoutique)} boutique</span></span></div>
          <div class="saison-row"><span class="saison-mois">Jours sans alerte (${joursSansAlerte.nbJours})</span><span class="saison-val">${fmtEur(joursSansAlerte.moyennePiste)} piste<br><span style="font-weight:400; color:var(--text-dim); font-size:9.5px;">${fmtEur(joursSansAlerte.moyenneBoutique)} boutique</span></span></div>
        </div>
        <div class="section-note">Écart avec/sans alerte : ${fmtPct(ecartPiste)} en piste, ${fmtPct(ecartBoutique)} en boutique.</div>`;
    } else {
      html += `<div class="section-note" style="margin-top:8px;">${analyseStock.message}</div>`;
    }
    return html;
  }

  // ------------------------------------------------------------
  // Bloc Niveau 4 — Tendances découvertes. NEXUS ne dit jamais
  // "cette tendance est certaine" — seulement "NEXUS a détecté une
  // tendance", assortie d'un indice de confiance objectif.
  // ------------------------------------------------------------
  function renderDecouvertes(decouvertes) {
    if (!decouvertes.length || !decouvertes[0].disponible) {
      return `<div class="decouverte-card"><div class="decouverte-titre">🔍 Aucune tendance fiable détectée.</div><div class="decouverte-note">Historique encore insuffisant.</div></div>`;
    }
    return decouvertes.map(d => `
      <div class="decouverte-card">
        <div class="decouverte-titre">🔍 NEXUS a détecté une tendance : ${d.titre}</div>
        <div class="decouverte-meta">
          <span>Confiance <b style="color:${CONFIANCE_DECOUVERTE_COLOR[d.confianceLabel]};">${d.confianceLabel} · ${d.confiancePct} %</b></span>
          <span>Impact estimé <b>${d.impact}</b></span>
        </div>
        <div class="decouverte-note">Source : ${d.source} · ${d.historiqueLabel}</div>
      </div>`).join('');
  }

  // ------------------------------------------------------------
  // Bloc Architecture — sources de données déjà connectées vs prévues.
  // ------------------------------------------------------------
  function renderSources() {
    return `<div class="sources-grid">${NexusTempo.SOURCES_DONNEES.map(s => {
      const st = SOURCE_STATUT_STYLE[s.statut];
      return `<div class="source-row"><span class="source-nom">${s.nom}</span><span class="source-statut" style="background:${st.bg}; color:${st.fg};">${st.label}</span></div>`;
    }).join('')}</div>`;
  }

  // ------------------------------------------------------------
  // Cadres repliables (25/07/2026, demande de Frédéric : trop
  // d'informations affichées d'un coup, "agressif cognitivement").
  // Seuls le Conseiller, Jours révélés et Décision NEXUS restent
  // ouverts par défaut — tout le reste (comparateur, détail hebdo,
  // équipe, carburants, saisonnier, découvertes, sources) est replié
  // et accessible en un tap, sans jamais être retiré du DOM.
  // ------------------------------------------------------------
  function accordion(id, titre, contenuHtml, ouvertParDefaut, options) {
    const { badge, sousTitre } = options || {};
    return `
      <button class="accordion-header" data-target="${id}" aria-expanded="${ouvertParDefaut ? 'true' : 'false'}">
        <span class="accordion-head-text">
          <span class="accordion-title">${titre}</span>
          ${sousTitre ? `<span class="accordion-subtitle">${sousTitre}</span>` : ''}
        </span>
        ${badge ? `<span class="accordion-count">${badge}</span>` : ''}
        <span class="accordion-line"></span>
        <span class="accordion-chevron">▾</span>
      </button>
      <div class="accordion-body${ouvertParDefaut ? ' open' : ''}" id="${id}">${contenuHtml}</div>
    `;
  }

  function branchAccordions() {
    document.querySelectorAll('.accordion-header').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = document.getElementById(btn.dataset.target);
        const ouvert = body.classList.toggle('open');
        btn.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
      });
    });
  }

  // ------------------------------------------------------------
  // Assemblage final
  // ------------------------------------------------------------
  function renderTout({ siteId, employee, joursAgreges, joursExploitables, classement, joursReveles, meilleursSepares, classementLitrage, analyseEquipe, decision, saisonnier, debutFinMois, decouvertes, analyseMeteo, analyseStock, etatStockActuel }) {
    const root = document.getElementById('root');
    const nbDecouvertes = decouvertes.length && decouvertes[0].disponible ? decouvertes.length : 0;

    // Sous-titres des cadres repliés (25/07/2026) : donner un aperçu
    // honnête de ce que contient chaque section sans avoir à l'ouvrir —
    // et rassurer plutôt qu'alarmer quand l'historique est encore court.
    const nbJoursSemaineCouverts = classement.filter(a => a.occurrences.length > 0).length;
    const sousTitreHebdo = `${nbJoursSemaineCouverts} / 7 jours de la semaine documentés`;
    const sousTitreEquipe = analyseEquipe.length
      ? `${analyseEquipe.length} profil${analyseEquipe.length > 1 ? 's' : ''} suivi${analyseEquipe.length > 1 ? 's' : ''}`
      : 'Aucune donnée pour l\'instant';
    const sousTitreCarburants = classementLitrage.length
      ? `Litrage suivi sur ${classementLitrage.length} jour${classementLitrage.length > 1 ? 's' : ''} de la semaine`
      : 'En attente des premiers calculs de litrage';
    const sousTitreSaisonnier = saisonnier.disponible
      ? `${saisonnier.moisAnalyse.filter(m => m.disponible).length} mois comparé${saisonnier.moisAnalyse.filter(m => m.disponible).length > 1 ? 's' : ''}`
      : 'Historique insuffisant';
    const sousTitreDecouvertes = joursExploitables.length < 7
      ? 'Chaque journée enregistrée augmente la précision de Tempo.'
      : (nbDecouvertes ? `${nbDecouvertes} tendance${nbDecouvertes > 1 ? 's' : ''} détectée${nbDecouvertes > 1 ? 's' : ''}` : 'Aucune tendance fiable détectée.');
    const nbSourcesConnectees = NexusTempo.SOURCES_DONNEES.filter(s => s.statut === 'connectee').length;
    const sousTitreSources = `${nbSourcesConnectees} source${nbSourcesConnectees > 1 ? 's' : ''} connectée${nbSourcesConnectees > 1 ? 's' : ''} sur ${NexusTempo.SOURCES_DONNEES.length}`;
    const sousTitreMeteo = analyseMeteo.disponible
      ? `Écart pluie/sec mesuré (${analyseMeteo.joursPluie.nbJours} vs ${analyseMeteo.joursSecs.nbJours} jours)`
      : (analyseMeteo.message.startsWith('Météo indisponible') ? 'Météo indisponible pour le moment' : 'Corrélation non encore mesurable');
    const sousTitreStock = etatStockActuel
      ? `Indice ${Math.round(etatStockActuel.indiceConfiance)}/100 · ${fmtEur(etatStockActuel.risqueEstimeEur)} de risque estimé`
      : 'Aucune donnée Scanner Stock pour l\'instant';

    root.innerHTML = `
      <div class="section" style="margin-top:6px;">
        <div class="conseiller-card">
          <img class="conseiller-avatar" src="assets/nexus-avatar.png" alt="Conseiller NEXUS">
          <div class="conseiller-body">
            <div class="conseiller-name">CONSEILLER NEXUS</div>
            <p>${texteConseiller(joursAgreges, joursExploitables, joursReveles, meilleursSepares)}</p>
          </div>
        </div>
      </div>

      ${accordion('accJours', 'Jours révélés', `<div class="section">${renderJoursReveles(joursReveles)}</div>${renderDuoJours(meilleursSepares)}`, true)}

      ${accordion('accDecision', 'Décision NEXUS', `<div class="section">${renderDecision(decision, siteId, employee)}</div>`, true)}

      ${accordion('accComparateur', 'Comparateur', renderComparateur(joursAgreges), false, { sousTitre: 'Comparez deux périodes de votre choix' })}

      ${accordion('accHebdo', 'Vue hebdomadaire', renderVueHebdo(classement), false, { sousTitre: sousTitreHebdo })}

      ${accordion('accEquipe', 'Analyse équipe', renderEquipe(analyseEquipe), false, { sousTitre: sousTitreEquipe })}

      ${accordion('accCarburants', 'Carburants', `<div class="section">${renderCarburants(classementLitrage)}</div>`, false, { sousTitre: sousTitreCarburants })}

      ${accordion('accSaisonnier', 'Cycles saisonniers', renderSaisonnier(saisonnier, debutFinMois), false, { sousTitre: sousTitreSaisonnier })}

      ${accordion('accMeteo', 'Météo', renderMeteo(analyseMeteo), false, { sousTitre: sousTitreMeteo })}

      ${accordion('accStock', 'Scanner Stock', renderStock(analyseStock, etatStockActuel), false, { sousTitre: sousTitreStock })}

      ${accordion('accDecouvertes', 'Tendances découvertes', `<div class="section">${renderDecouvertes(decouvertes)}</div>`, false, { sousTitre: sousTitreDecouvertes, badge: nbDecouvertes ? String(nbDecouvertes) : null })}

      ${accordion('accSources', 'Sources de données', `${renderSources()}<div class="section-note">NEXUS Tempo est conçu pour accueillir de nouvelles sources sans tout reconstruire : chaque source "Prévue" s'activera dès qu'elle sera branchée, sans jamais remplacer une donnée manquante par une estimation.</div>`, false, { sousTitre: sousTitreSources })}
    `;
    branchBoutonMission(decision, siteId, employee);
    branchAccordions();
  }
</script>
</body>
</html>
