<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Scanner Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-desktop.js"></script>
<script src="nexus-stock.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9;
    --gold:#D4AF37; --gold-dim:#332B12;
    --gris:#57626F; --gris-dim:#1A222C;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh; background-image:radial-gradient(circle at 50% 0%, rgba(212,175,55,0.06), transparent 45%);}
  .phone{width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:20px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold);}
  .title{font-size:21px; font-weight:600; margin-top:4px;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}

  .conseiller-mini{display:flex; align-items:flex-start; gap:12px; padding:16px 20px;}
  .conseiller-avatar{width:52px; height:52px; object-fit:contain; flex-shrink:0; filter:drop-shadow(0 0 8px rgba(212,175,55,0.4));}
  .conseiller-bubble{
    position:relative; flex:1; background:var(--panel); border:1px solid rgba(212,175,55,0.3); border-radius:14px;
    padding:13px 16px; box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  .conseiller-bubble::before{
    content:''; position:absolute; left:-6px; top:16px; width:12px; height:12px; background:var(--panel);
    border-left:1px solid rgba(212,175,55,0.3); border-bottom:1px solid rgba(212,175,55,0.3); transform:rotate(45deg);
  }
  .conseiller-label{font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); margin-bottom:4px;}
  .conseiller-text{font-size:12.5px; line-height:1.55; color:var(--text);}

  .section{padding:6px 20px 20px;}
  .section-label{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim);
    margin:18px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-label::after{content:''; flex:1; height:1px; background:var(--hairline);}

  .confiance-card{
    background:linear-gradient(145deg, var(--panel), var(--panel-raised)); border:1px solid var(--hairline); border-radius:18px;
    padding:26px 20px; text-align:center; position:relative; overflow:hidden;
  }
  .confiance-card::before{content:''; position:absolute; top:-40%; left:-20%; width:140%; height:140%; background:radial-gradient(circle, rgba(212,175,55,0.08), transparent 60%); pointer-events:none;}
  .confiance-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim);}
  .confiance-value{font-family:var(--mono); font-size:56px; font-weight:700; line-height:1.1; margin-top:6px;}
  .confiance-sub{font-size:12.5px; color:var(--text-mid); margin-top:6px;}

  /* ------------------------------------------------------------
     Compacité 24/07/2026 (demande de Frédéric : "réduire l'écran,
     moins surchargé") — les chips de priorités (à vérifier / à
     surveiller / stables / non concluants / stock négatif) étaient
     purement décoratives, puis exactement les mêmes catégories
     réapparaissaient plus bas comme filtres cliquables séparés
     (.filter-row) : deux blocs pour la même information. Ces chips
     sont maintenant elles-mêmes les filtres cliquables — le second
     bloc disparaît, remplacé par une seule ligne d'état qui
     n'apparaît que si un filtre est actif (voir .filter-active-row
     plus bas). Le KPI "Produits sensibles" devient lui aussi
     cliquable pour la même raison.
     ------------------------------------------------------------ */
  .kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px;}
  .kpi-box.clickable{cursor:pointer; transition:border-color .12s, box-shadow .12s;}
  .kpi-box.clickable:active{transform:scale(0.98);}
  .kpi-box.active{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .kpi-toggle{font-family:var(--mono); font-size:9px; color:var(--cyan); opacity:0.75; margin-top:6px; display:flex; align-items:center; gap:4px;}
  .kpi-toggle .chev{transition:transform .15s; display:inline-block;}
  .kpi-box.open .kpi-toggle .chev{transform:rotate(90deg);}
  .kpi-explain{display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--hairline); font-size:11.5px; color:var(--text-mid); line-height:1.6; grid-column:1/-1;}
  .kpi-explain.open{display:block;}
  .kpi-explain b{color:var(--text);}
  .kpi-explain ul{margin:8px 0 0 18px;}
  .kpi-explain li{margin-bottom:4px;}
  .kpi-box{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px 16px;}
  .kpi-label{font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-dim);}
  .kpi-value{font-family:var(--mono); font-size:22px; font-weight:700; margin-top:6px;}
  .kpi-sub{font-size:10.5px; color:var(--text-mid); margin-top:3px;}

  .priorites-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .priorite-chip{
    flex:1; min-width:100px; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:12px 8px; border-radius:12px; font-family:var(--mono); font-size:10.5px; text-align:center;
    cursor:pointer; border:1px solid transparent; transition:transform .12s, box-shadow .12s;
  }
  .priorite-chip:active{transform:scale(0.97);}
  .priorite-chip.active{border-color:currentColor; box-shadow:0 0 0 1px currentColor inset;}
  .priorite-chip .n{font-size:20px; font-weight:700;}
  .chip-rouge{background:var(--red-dim); color:var(--red);}
  .chip-ambre{background:var(--amber-dim); color:var(--amber);}
  .chip-vert{background:var(--green-dim); color:var(--green);}
  .chip-gris{background:var(--gris-dim); color:var(--text-dim);}

  /* Ligne d'état compacte remplaçant l'ancien .filter-row dupliqué —
     n'apparaît que si un filtre est actif, montre lequel et propose
     un retour rapide à "tous". */
  .filter-active-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:12px; padding:10px 14px; background:var(--panel-raised); border:1px solid var(--hairline);
    border-radius:10px; font-family:var(--mono); font-size:11px; color:var(--text-mid);
  }
  .filter-active-row b{color:var(--gold);}
  .filter-reset{color:var(--cyan); cursor:pointer; white-space:nowrap; flex-shrink:0;}

  .inventaire-card{
    background:var(--gold-dim); border:1px solid rgba(212,175,55,0.4); border-radius:14px; padding:18px 20px; margin-top:14px;
    display:flex; align-items:center; gap:14px; cursor:pointer;
  }
  .inventaire-icon{font-size:26px;}
  .inventaire-title{font-size:14px; font-weight:700; color:var(--gold);}
  .inventaire-detail{font-size:11.5px; color:var(--text-mid); margin-top:3px;}

  .search-wrap{padding:4px 20px 8px;}
  .search-box{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:11px 14px;}
  .search-box input{flex:1; background:none; border:none; outline:none; color:var(--text); font-family:var(--sans); font-size:16px;}
  .search-box input::placeholder{color:var(--text-dim);}

  /* Regroupement par catégorie, dépliable (02/08/2026, demande de
     Frédéric — même logique que NEXUS Inventaire) : chaque catégorie se
     déplie indépendamment ; les catégories ayant le plus besoin
     d'attention (stock négatif, à vérifier) remontent en premier — voir
     renderListe(). Même mécanique de bascule que .marge-groupe dans
     NEXUS-Scanner-v1.html (classe .open togglée directement, sans
     recalculer tout le rendu). */
  .categorie-groupe{margin-bottom:10px;}
  .categorie-groupe-head{
    display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer;
    background:var(--panel); border:1px solid var(--hairline); border-radius:12px;
  }
  .categorie-groupe.open .categorie-groupe-head{border-radius:12px 12px 0 0; border-bottom:none;}
  .categorie-groupe-titre{font-size:13.5px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .categorie-groupe-meta{font-family:var(--mono); font-size:10.5px; white-space:nowrap; flex-shrink:0;}
  .categorie-groupe-head .chev{color:var(--text-dim); font-size:14px; transition:transform .15s; display:inline-block; flex-shrink:0;}
  .categorie-groupe.open .categorie-groupe-head .chev{transform:rotate(90deg);}
  .categorie-groupe-body{display:none; padding:10px; background:var(--panel-raised); border:1px solid var(--hairline); border-top:none; border-radius:0 0 12px 12px;}
  .categorie-groupe.open .categorie-groupe-body{display:block;}
  .categorie-groupe-body .produit-card{margin:0 0 10px;}
  .categorie-groupe-body .produit-card:last-child{margin-bottom:0;}

  .produit-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .produit-head{padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px;}
  .produit-etat-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .dot-vert{background:var(--green); box-shadow:0 0 8px rgba(52,211,153,0.6);}
  .dot-ambre{background:var(--amber); box-shadow:0 0 8px rgba(245,166,35,0.6);}
  .dot-rouge{background:var(--red); box-shadow:0 0 8px rgba(240,87,90,0.6);}
  .dot-gris{background:var(--text-dim);}
  .produit-info{flex:1; min-width:0;}
  .produit-nom{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .produit-meta{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:2px;}
  .produit-confiance{font-family:var(--mono); font-size:13px; font-weight:700; flex-shrink:0;}
  .produit-chevron{color:var(--text-dim); font-size:14px; flex-shrink:0;}
  .produit-body{display:none; padding:0 16px 16px; border-top:1px solid var(--hairline);}
  .produit-body.open{display:block;}
  .produit-detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--hairline); font-size:12px;}
  .produit-detail-row:last-of-type{border-bottom:none;}
  .produit-detail-label{color:var(--text-mid);}
  .sensible-etoiles{color:var(--gold); letter-spacing:2px; margin-top:10px; font-size:13px;}
  .sensible-note{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:4px; line-height:1.5;}
  .btn-compter{
    width:100%; margin-top:12px; padding:11px; border:none; border-radius:8px; font-size:12.5px; font-weight:600;
    background:var(--gold); color:#241d0c; cursor:pointer;
  }
  .compter-form{display:none; margin-top:10px; gap:8px;}
  .compter-form.open{display:flex;}
  .compter-form input{
    flex:1; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px;
    padding:10px 12px; color:var(--text); font-family:var(--mono); font-size:16px; text-align:center;
  }
  .compter-form button{padding:0 16px; border:none; border-radius:8px; background:var(--green); color:#04141a; font-weight:700; cursor:pointer;}

  .empty-note{padding:40px 20px; text-align:center; color:var(--text-dim); font-size:12.5px; line-height:1.6;}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-family:var(--sans);}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Scanner Stock</div>
    <div class="title">Où perdez-vous de l'argent ?</div>
  </div>
  <div class="divider"></div>

  <div id="root">
    <div class="empty-note">Chargement…</div>
  </div>

  <footer>NEXUS Scanner Stock v1 · Indice de confiance, pas un simple inventaire</footer>
</div>

<script>
  const ETATS = {
    stable:      { label: '🟢 Stable',                    dot: 'dot-vert'  },
    surveiller:  { label: '🟡 À surveiller',               dot: 'dot-ambre' },
    verifier:    { label: '🔴 Vérification recommandée',   dot: 'dot-rouge' },
    inconnu:     { label: '⚫ Impossible à conclure',      dot: 'dot-gris'  },
    impossible:  { label: '⚠️ Stock négatif — signalé, non modifié', dot: 'dot-rouge' },
  };

  // Libellés lisibles pour la ligne d'état compacte (.filter-active-row) —
  // un seul endroit à mettre à jour si un libellé change, plutôt que
  // recopié à chaque appel de renderRoot().
  const FILTRE_LABELS = {
    verifier: 'À vérifier', surveiller: 'À surveiller', stable: 'Stables',
    inconnu: 'Non concluants', impossible: 'Stock négatif', sensibles: 'Sensibles',
    recommande: 'Recommandés aujourd’hui',
  };

  let ANALYSE = [];        // une entree par article, avec etat/confiance/ecart
  let LISTE_RECOMMANDEE = new Set(); // articles du "recompter aujourd'hui", pour le filtre dedie
  let employeeCourant = null;
  let SITE_ACTUEL = null; // jamais 'vito-sainte-marie' par defaut (de-Vito-isation, 11/08/2026) - toujours ecrase par employee.site_id apres nexusRequireAuth()
  let filtreActuel = 'tous';
  // Catégories dépliées (02/08/2026, demande de Frédéric — "suis la
  // logique comme l'inventaire de classer les produits par catégorie et
  // dépliables") : repliées par défaut comme partout ailleurs dans NEXUS
  // (mode aveugle, groupes de marge…) — jamais réinitialisé entre deux
  // rendus pour que l'état déplié survive à un recomptage ou un changement
  // de filtre.
  const categoriesStockOuvertes = new Set();

  // Supabase plafonne chaque requete a 1000 lignes par defaut, sans erreur —
  // au-dela, le reste est silencieusement absent. Ce helper boucle par pages
  // de 1000 jusqu'a tout recuperer (trouve le 15/07/2026, meme bug que
  // Cockpit/CIN/Scanner des que products a depasse 1000 lignes).
  async function fetchAllRows(builderFactory, pageSize = 1000) {
    let toutes = [];
    let from = 0;
    while (true) {
      const { data, error } = await builderFactory().range(from, from + pageSize - 1);
      if (error) return { data: null, error };
      toutes = toutes.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    return { data: toutes, error: null };
  }

  // Calcul par référence délégué à nexus-stock.js (28/07/2026) — source
  // unique partagée avec le Cockpit, voir en-tête de ce fichier pour le
  // détail de la logique (état/écart/risqueEur).
  async function chargerAnalyse() {
    const { data: relevesTous, error: err1 } = await fetchAllRows(() => nexusClient
      .from('stock_releves')
      .select('article, categorie, quantite_theorique, releve_le')
      .eq('site', SITE_ACTUEL)
      .order('releve_le', { ascending: true })
      .order('article', { ascending: true }));
    if (err1) { console.error('Chargement stock_releves:', err1); return []; }
    if (!relevesTous || relevesTous.length === 0) return [];

    const { data: ventes } = await fetchAllRows(() => nexusClient
      .from('products')
      .select('article, quantite, prix_vente, periode_debut, periode_fin')
      .eq('site', SITE_ACTUEL)
      .order('article', { ascending: true }));

    const { data: controles } = await fetchAllRows(() => nexusClient
      .from('controles_stock')
      .select('article, ecart, controle_le')
      .eq('site', SITE_ACTUEL)
      .order('controle_le', { ascending: false })
      .order('article', { ascending: true }));

    return NexusStock.calculerAnalyseStock(relevesTous, ventes, controles);
  }

  async function marquerControle(article, quantiteTheorique, quantiteComptee) {
    const ecart = quantiteComptee - quantiteTheorique;
    const { error } = await nexusClient.from('controles_stock').insert({
      site: SITE_ACTUEL, article, quantite_theorique: quantiteTheorique,
      quantite_comptee: quantiteComptee, ecart, controle_par: employeeCourant.id,
    });
    if (error) { console.error('Enregistrement controle:', error); alert('Erreur — réessayez.'); return false; }
    return true;
  }

  function renderRoot() {
    const root = document.getElementById('root');

    if (ANALYSE.length === 0) {
      root.innerHTML = `<div class="empty-note">
        Aucun relevé de stock importé pour l'instant.<br><br>
        Rendez-vous dans <b>Import</b>, choisissez "Stock instantané", et déposez votre premier fichier — je commencerai l'analyse dès que j'aurai au moins deux relevés à comparer.
      </div>`;
      return;
    }

    const nbStable = ANALYSE.filter(p => p.etat === 'stable').length;
    const nbSurveiller = ANALYSE.filter(p => p.etat === 'surveiller').length;
    const nbVerifier = ANALYSE.filter(p => p.etat === 'verifier').length;
    const nbInconnu = ANALYSE.filter(p => p.etat === 'inconnu').length;
    const nbImpossible = ANALYSE.filter(p => p.etat === 'impossible').length;
    const total = ANALYSE.length;

    const confianceGlobale = Math.round(ANALYSE.reduce((s, p) => s + p.confiance, 0) / total);
    const risqueEstime = Math.round(ANALYSE.reduce((s, p) => s + p.risqueEur, 0));
    const nbChiffrable = ANALYSE.filter(p => p.risqueEur > 0).length;

    const sensibles = ANALYSE.map(p => ({ ...p, etoiles: NexusStock.calculerSensibilite(p) })).filter(p => p.etoiles >= 3);

    const aRecompter = [
      ...ANALYSE.filter(p => p.etat === 'verifier'),
      ...sensibles.filter(p => p.etat !== 'verifier' && (p.joursDepuisControle === null || p.joursDepuisControle > 20)),
    ].filter((p, i, arr) => arr.findIndex(x => x.article === p.article) === i).slice(0, 20);
    LISTE_RECOMMANDEE = new Set(aRecompter.map(p => p.article));
    const dureeMin = Math.max(1, Math.round(aRecompter.length * 40 / 60));

    const confCouleur = confianceGlobale >= 80 ? 'var(--green)' : confianceGlobale >= 55 ? 'var(--amber)' : 'var(--red)';

    // Compte affiché dans la ligne d'état compacte, propre à chaque filtre —
    // évite de recalculer ailleurs ce qui l'est déjà ci-dessus.
    const comptesFiltre = {
      verifier: nbVerifier, surveiller: nbSurveiller, stable: nbStable, inconnu: nbInconnu,
      impossible: nbImpossible, sensibles: sensibles.length, recommande: aRecompter.length,
    };

    root.innerHTML = `
      <div class="conseiller-mini">
        <img class="conseiller-avatar" src="assets/nexus-avatar.png" alt="Conseiller NEXUS">
        <div class="conseiller-bubble">
          <div class="conseiller-label">Conseiller NEXUS</div>
          <div class="conseiller-text" id="conseillerStockMsg">Calcul en cours…</div>
        </div>
      </div>

      <div class="section">
        <div class="confiance-card">
          <div class="confiance-label">Indice de confiance</div>
          <div class="confiance-value" style="color:${confCouleur};">${confianceGlobale}%</div>
          <div class="confiance-sub">${total} référence${total>1?'s':''} suivie${total>1?'s':''} · confiance dans ce que je vois, pas le stock lui-même</div>
        </div>

        <!-- Chips de priorités = filtres cliquables (24/07/2026) — cliquer
             sur une chip filtre la liste plus bas sur cet état ; recliquer
             la même chip revient à "tous". Remplace l'ancien double
             affichage (chips statiques + rangée de filtres séparée). -->
        <div class="priorites-row" id="prioritesRow">
          <div class="priorite-chip chip-rouge ${filtreActuel==='verifier'?'active':''}" data-filtre="verifier"><span class="n">${nbVerifier}</span>à vérifier</div>
          <div class="priorite-chip chip-ambre ${filtreActuel==='surveiller'?'active':''}" data-filtre="surveiller"><span class="n">${nbSurveiller}</span>à surveiller</div>
          <div class="priorite-chip chip-vert ${filtreActuel==='stable'?'active':''}" data-filtre="stable"><span class="n">${nbStable}</span>stables</div>
          <div class="priorite-chip chip-gris ${filtreActuel==='inconnu'?'active':''}" data-filtre="inconnu"><span class="n">${nbInconnu}</span>non concluants</div>
          ${nbImpossible > 0 ? `<div class="priorite-chip chip-rouge ${filtreActuel==='impossible'?'active':''}" data-filtre="impossible"><span class="n">${nbImpossible}</span>stock négatif</div>` : ''}
        </div>

        <div class="kpi-grid">
          <div class="kpi-box clickable" id="carteRisque"><div class="kpi-label">Risque estimé</div><div class="kpi-value" style="color:var(--red);">${risqueEstime.toLocaleString('fr-FR')} €</div><div class="kpi-sub">si les écarts sont confirmés</div><div class="kpi-toggle"><span class="chev">›</span> D'où vient ce chiffre ?</div></div>
          <div class="kpi-box clickable ${filtreActuel==='sensibles'?'active':''}" id="carteSensibles"><div class="kpi-label">Produits sensibles</div><div class="kpi-value" style="color:var(--gold);">${sensibles.length}</div><div class="kpi-sub">cumul de facteurs de risque · toucher pour filtrer</div></div>
          <div class="kpi-explain" id="explicationRisque">
            <b>${nbChiffrable}</b> référence${nbChiffrable>1?'s':''} sur ${total} entre${nbChiffrable>1?'nt':''} dans ce total — seules celles qui remplissent les <b>trois conditions</b> à la fois :
            <ul>
              <li>état 🔴 <b>À vérifier</b> (ni "à surveiller", ni "sensible", ni "non concluant")</li>
              <li>écart <b>négatif</b> (moins de stock que prévu, pas un surplus)</li>
              <li>prix de vente <b>connu</b> (sinon impossible de convertir en euros)</li>
            </ul>
            Pour chacune : <b>quantité manquante × prix de vente</b>, additionné. Les ${sensibles.length} "sensibles" ne sont pas ignorés — ils n'ont simplement pas encore un écart chiffrable aujourd'hui.
          </div>
        </div>

        ${filtreActuel !== 'tous' ? `
        <div class="filter-active-row" id="filterActiveRow">
          <span>Filtré : <b>${FILTRE_LABELS[filtreActuel] || filtreActuel}</b> (${comptesFiltre[filtreActuel] != null ? comptesFiltre[filtreActuel] : ''})</span>
          <span class="filter-reset" id="filterReset">✕ Voir tout (${total})</span>
        </div>` : ''}

        ${aRecompter.length > 0 ? `
        <div class="inventaire-card" id="carteInventaire">
          <div class="inventaire-icon">📋</div>
          <div>
            <div class="inventaire-title">Inventaire conseillé aujourd'hui</div>
            <div class="inventaire-detail">${aRecompter.length} produit${aRecompter.length>1?'s':''} · environ ${dureeMin} minute${dureeMin>1?'s':''} · <span style="text-decoration:underline;">voir la liste →</span></div>
          </div>
        </div>` : ''}
      </div>

      <div class="search-wrap">
        <div class="search-box"><span>🔍</span><input type="text" id="searchStock" placeholder="Rechercher une référence..."></div>
      </div>

      <!-- desktop-grid (02/08/2026) : mise en colonnes en vue bureau (voir
           nexus-desktop.js) — purement additif, aucun effet en mobile. Même
           principe que NEXUS-Missions-v1.html : seule la liste de cartes
           répétées passe en colonnes, pas le résumé/les filtres au-dessus. -->
      <div class="section desktop-grid" id="listeProduits"></div>
    `;

    document.getElementById('conseillerStockMsg').textContent = genererMessageConseiller(nbVerifier, nbSurveiller, risqueEstime, aRecompter);

    renderListe();

    document.getElementById('searchStock').addEventListener('input', renderListe);

    // Chips de priorités — clic = filtre, reclic sur la meme chip = retour a "tous".
    document.querySelectorAll('#prioritesRow .priorite-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const f = chip.dataset.filtre;
        filtreActuel = (filtreActuel === f) ? 'tous' : f;
        renderRoot();
      });
    });

    const carteSensibles = document.getElementById('carteSensibles');
    if (carteSensibles) {
      carteSensibles.addEventListener('click', () => {
        filtreActuel = (filtreActuel === 'sensibles') ? 'tous' : 'sensibles';
        renderRoot();
      });
    }

    const filterReset = document.getElementById('filterReset');
    if (filterReset) filterReset.addEventListener('click', (e) => { e.stopPropagation(); filtreActuel = 'tous'; renderRoot(); });

    const carteInv = document.getElementById('carteInventaire');
    if (carteInv) carteInv.addEventListener('click', () => { filtreActuel = (filtreActuel === 'recommande') ? 'tous' : 'recommande'; renderRoot(); });

    const carteRisque = document.getElementById('carteRisque');
    const explication = document.getElementById('explicationRisque');
    if (carteRisque && explication) {
      carteRisque.addEventListener('click', () => {
        carteRisque.classList.toggle('open');
        explication.classList.toggle('open');
      });
    }
  }

  function genererMessageConseiller(nbVerifier, nbSurveiller, risqueEstime, aRecompter) {
    const prenom = employeeCourant ? employeeCourant.nom : '';
    if (nbVerifier === 0 && nbSurveiller === 0) {
      return `${prenom}, tout est cohérent pour l'instant — aucune référence ne mérite une vérification prioritaire aujourd'hui.`;
    }
    let msg = `${prenom}, je vous recommande de vérifier les ${aRecompter.length} référence${aRecompter.length>1?'s':''} ci-dessous en priorité. `;
    if (risqueEstime > 0) msg += `Elles représentent environ ${risqueEstime.toLocaleString('fr-FR')} € de risque estimé si les écarts se confirment.`;
    else msg += `Aucun écart chiffrable pour l'instant, mais leur profil justifie un contrôle.`;
    return msg;
  }

  function renderListe() {
    const q = document.getElementById('searchStock').value.trim().toLowerCase();
    let liste = ANALYSE.map(p => ({ ...p, etoiles: NexusStock.calculerSensibilite(p) }));

    if (filtreActuel === 'verifier') liste = liste.filter(p => p.etat === 'verifier');
    else if (filtreActuel === 'surveiller') liste = liste.filter(p => p.etat === 'surveiller');
    else if (filtreActuel === 'stable') liste = liste.filter(p => p.etat === 'stable');
    else if (filtreActuel === 'inconnu') liste = liste.filter(p => p.etat === 'inconnu');
    else if (filtreActuel === 'sensibles') liste = liste.filter(p => p.etoiles >= 3);
    else if (filtreActuel === 'recommande') liste = liste.filter(p => LISTE_RECOMMANDEE.has(p.article));
    else if (filtreActuel === 'impossible') liste = liste.filter(p => p.etat === 'impossible');

    if (q) liste = liste.filter(p => p.article.toLowerCase().includes(q));

    const ordre = { impossible: -1, verifier: 0, surveiller: 1, inconnu: 2, stable: 3 };
    liste.sort((a, b) => (ordre[a.etat] - ordre[b.etat]) || (b.risqueEur - a.risqueEur));

    const el = document.getElementById('listeProduits');
    if (liste.length === 0) {
      el.innerHTML = `<div class="empty-note">Aucune référence ne correspond.</div>`;
      return;
    }

    // Regroupement par catégorie, dépliable (02/08/2026, demande de
    // Frédéric — même logique que NEXUS Inventaire) : data-idx continue de
    // désigner la position réelle dans `liste` (déjà filtrée/triée
    // ci-dessus), seul l'AFFICHAGE change — le groupement ne retrie jamais
    // les produits eux-mêmes, il les répartit simplement par catégorie en
    // conservant leur ordre relatif (état puis risque).
    function renderProduitCard(p, i) {
      const e = ETATS[p.etat];
      return `
      <div class="produit-card">
        <div class="produit-head" data-idx="${i}">
          <div class="produit-etat-dot ${e.dot}"></div>
          <div class="produit-info">
            <div class="produit-nom">${p.article}</div>
            <div class="produit-meta">Stock actuel ${p.quantiteActuelle}</div>
          </div>
          <div class="produit-confiance" style="color:${p.confiance>=70?'var(--green)':p.confiance>=45?'var(--amber)':'var(--red)'};">${p.confiance}%</div>
          <div class="produit-chevron">›</div>
        </div>
        <div class="produit-body" id="body-${i}">
          <div class="produit-detail-row"><span class="produit-detail-label">État</span><span>${e.label}</span></div>
          ${p.ecart !== null ? `<div class="produit-detail-row"><span class="produit-detail-label">Écart estimé</span><span>${p.ecart>0?'+':''}${Math.round(p.ecart)} unités</span></div>` : ''}
          ${p.risqueEur > 0 ? `<div class="produit-detail-row"><span class="produit-detail-label">Risque</span><span style="color:var(--red);">${Math.round(p.risqueEur).toLocaleString('fr-FR')} €</span></div>` : ''}
          <div class="produit-detail-row"><span class="produit-detail-label">Dernier contrôle réel</span><span>${p.joursDepuisControle !== null ? p.joursDepuisControle + ' jour(s)' : 'Jamais'}</span></div>
          <div class="sensible-note">${p.note}</div>
          ${p.etoiles >= 3 ? `<div class="sensible-etoiles">${'★'.repeat(p.etoiles)}${'☆'.repeat(5-p.etoiles)} <span class="sensible-note" style="display:inline; color:var(--gold);">produit sensible</span></div>` : ''}
          <button class="btn-compter" data-idx="${i}">📷 Compter maintenant</button>
          <div class="compter-form" id="form-${i}">
            <input type="number" id="input-${i}" placeholder="Quantité réelle">
            <button data-idx="${i}">✓</button>
          </div>
        </div>
      </div>`;
    }

    const groupesMap = new Map();
    liste.forEach((p, i) => {
      const cat = p.categorie || 'Non classé';
      if (!groupesMap.has(cat)) groupesMap.set(cat, []);
      groupesMap.get(cat).push({ p, idx: i });
    });
    // Score d'urgence (02/08/2026) : les catégories avec du stock négatif
    // ou des références "à vérifier" remontent en premier — mêmes poids
    // relatifs que l'ordre de tri des produits eux-mêmes ci-dessus.
    const groupes = Array.from(groupesMap.entries()).map(([nom, items]) => {
      const score = items.reduce((s, { p }) => {
        if (p.etat === 'impossible') return s + 1000;
        if (p.etat === 'verifier') return s + 100;
        if (p.etat === 'surveiller') return s + 10;
        if (p.etat === 'inconnu') return s + 1;
        return s;
      }, 0);
      return { nom, items, score };
    }).sort((a, b) => b.score - a.score || a.nom.localeCompare(b.nom, 'fr'));

    el.innerHTML = groupes.map(g => {
      const ouvert = categoriesStockOuvertes.has(g.nom);
      const nbATraiter = g.items.filter(({ p }) => p.etat === 'verifier' || p.etat === 'impossible').length;
      return `
        <div class="categorie-groupe${ouvert ? ' open' : ''}" data-cat="${g.nom.replace(/"/g, '&quot;')}">
          <div class="categorie-groupe-head">
            <span class="categorie-groupe-titre">${g.nom} <span style="color:var(--text-dim); font-weight:400;">(${g.items.length})</span></span>
            <span class="categorie-groupe-meta" style="color:${nbATraiter > 0 ? 'var(--red)' : 'var(--text-dim)'};">${nbATraiter > 0 ? `${nbATraiter} à traiter` : 'à jour'}</span>
            <span class="chev">›</span>
          </div>
          <div class="categorie-groupe-body">
            ${g.items.map(({ p, idx }) => renderProduitCard(p, idx)).join('')}
          </div>
        </div>
      `;
    }).join('');

    el.querySelectorAll('.categorie-groupe-head').forEach(head => {
      head.addEventListener('click', () => {
        const groupe = head.closest('.categorie-groupe');
        if (!groupe) return;
        groupe.classList.toggle('open');
        const cat = groupe.dataset.cat;
        if (groupe.classList.contains('open')) categoriesStockOuvertes.add(cat); else categoriesStockOuvertes.delete(cat);
      });
    });
    el.querySelectorAll('.produit-head').forEach(h => {
      h.addEventListener('click', () => document.getElementById(`body-${h.dataset.idx}`).classList.toggle('open'));
    });
    el.querySelectorAll('.btn-compter').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById(`form-${btn.dataset.idx}`).classList.add('open');
        btn.style.display = 'none';
      });
    });
    el.querySelectorAll('.compter-form button').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const idx = btn.dataset.idx;
        const input = document.getElementById(`input-${idx}`);
        const val = parseFloat(input.value);
        if (isNaN(val)) { input.focus(); return; }
        const article = liste[idx].article;
        const theorique = liste[idx].quantiteActuelle;
        btn.disabled = true; btn.textContent = '…';
        const ok = await marquerControle(article, theorique, val);
        if (ok) {
          ANALYSE = await chargerAnalyse();
          renderRoot();
        } else {
          btn.disabled = false; btn.textContent = '✓';
        }
      });
    });
  }

  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.getElementById('root').innerHTML = `<div class="locked">Cet écran est réservé aux managers.</div>`;
      return;
    }
    employeeCourant = employee;
    SITE_ACTUEL = employee.site_id;
    ANALYSE = await chargerAnalyse();
    renderRoot();

    if (ANALYSE.length > 0) {
      const total = ANALYSE.length;
      await nexusClient.from('stock_sante_historique').insert({
        site: SITE_ACTUEL,
        indice_confiance: Math.round(ANALYSE.reduce((s, p) => s + p.confiance, 0) / total),
        nb_references_stables: ANALYSE.filter(p => p.etat === 'stable').length,
        nb_references_a_surveiller: ANALYSE.filter(p => p.etat === 'surveiller').length,
        nb_references_a_verifier: ANALYSE.filter(p => p.etat === 'verifier').length,
        nb_references_non_concluantes: ANALYSE.filter(p => p.etat === 'inconnu').length,
        risque_estime_eur: Math.round(ANALYSE.reduce((s, p) => s + p.risqueEur, 0)),
      });
    }
  });
</script>
</body>
</html>
