<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>Le Cockpit — NEXUS v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14;
    --panel:#141B22;
    --panel-raised:#1A222C;
    --hairline:#242E38;
    --text:#EDF1F5;
    --text-mid:#8A96A5;
    --text-dim:#57626F;
    --green:#34D399;
    --green-dim:#153629;
    --amber:#F5A623;
    --amber-dim:#3A2E14;
    --red:#F0575A;
    --red-dim:#3A1D1F;
    --cyan:#4FC3D9;
    --gold:#D4AF37; --gold-dim:#332B12;
    --mono:'IBM Plex Mono',monospace;
    --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{
    display:flex; justify-content:center;
    min-height:100vh;
    background-image: radial-gradient(circle at 50% 0%, rgba(79,195,217,0.07), transparent 45%);
  }
  .phone{
    width:100%; max-width:430px; min-height:100vh;
    display:flex; flex-direction:column;
    border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);
   padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  /* HEADER */
  .header{padding:20px 20px 14px; display:flex; align-items:center; gap:12px;}
  .menu-btn{
    margin-left:auto; flex-shrink:0; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .header .logo-frame{
    width:64px; height:64px; border-radius:20px; flex-shrink:0;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--hairline);
  }
  .header .logo{
    height:44px; width:44px; object-fit:cover; object-position:center; border-radius:12px;
  }
  .header .id{display:flex; flex-direction:column;}
  .greet{font-size:20px; font-weight:600;}
  .role-badge{
    font-family:var(--mono); font-size:9.5px; padding:2px 8px; border-radius:10px; letter-spacing:0.04em;
    text-transform:uppercase; border:1px solid var(--hairline); color:var(--text-dim); margin-left:8px; vertical-align:middle;
  }
  .station{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-top:3px; letter-spacing:0.02em;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  /* SANTE */
  .story{
    padding:22px 24px 8px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px;
  }
  .story-line{
    font-size:15px; line-height:1.5; color:var(--text); max-width:300px;
    opacity:0; transform:translateY(6px); animation:storyIn .5s ease forwards;
  }
  .story-arrow{
    font-size:14px; color:var(--text-dim); margin:6px 0;
    opacity:0; animation:storyIn .5s ease forwards;
  }
  .story-indice{
    display:flex; align-items:baseline; gap:8px;
    opacity:0; transform:translateY(6px); animation:storyIn .5s ease forwards;
  }
  .story-indice-label{font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}
  .story-indice-value{font-family:var(--mono); font-size:34px; font-weight:700; color:var(--gold); text-shadow:0 0 16px rgba(212,175,55,0.35);}
  .story-gain{
    font-size:18px; font-weight:700; line-height:1.4; max-width:300px; margin-top:2px;
    opacity:0; transform:translateY(6px); animation:storyIn .5s ease forwards;
  }
  .story-gain b{color:var(--green); font-size:21px;}
  .story-source{
    font-family:var(--mono); font-size:9.5px; color:var(--text-dim); line-height:1.5; max-width:280px; margin-top:10px;
    opacity:0; animation:storyIn .5s ease forwards;
  }
  @keyframes storyIn{ to{ opacity:1; transform:translateY(0); } }
  .sante{padding:26px 20px; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .sante-label{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim);}
  .sante-score{font-family:var(--mono); font-size:64px; font-weight:700; line-height:1; display:flex; align-items:baseline; gap:10px; color:var(--gold); text-shadow:0 0 20px rgba(212,175,55,0.3);}
  .toast-or{
    position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); z-index:999;
    background:linear-gradient(145deg, var(--gold-dim), #241d0c); border:1px solid rgba(212,175,55,0.45);
    color:var(--gold); font-family:var(--mono); font-size:12.5px; font-weight:600; letter-spacing:0.02em;
    padding:13px 22px; border-radius:30px; box-shadow:0 8px 28px rgba(212,175,55,0.25), 0 0 0 1px rgba(212,175,55,0.15) inset;
    opacity:0; transition:opacity .35s ease, transform .35s ease; pointer-events:none; white-space:nowrap;
  }
  .toast-or.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .succes-card{
    background:linear-gradient(145deg, var(--gold-dim), rgba(212,175,55,0.04)); border:1px solid rgba(212,175,55,0.35);
    border-radius:16px; padding:18px 20px; display:flex; align-items:center; gap:14px;
    box-shadow:0 6px 22px rgba(212,175,55,0.15);
    opacity:0; transform:translateY(8px); animation:succesIn .5s ease forwards;
  }
  @keyframes succesIn{ to{ opacity:1; transform:translateY(0); } }

  /* Chargement des priorités (28/07/2026) — logo NEXUS qui tourne pendant
     que les données réelles (Produits, Caisse, Stock, Rappels) arrivent,
     à la place d'un message de succès prématuré. Voir renderPlansAction(). */
  .plans-loading{padding:30px 20px; text-align:center;}
  .plans-loading-logo{width:38px; height:38px; margin-bottom:12px; animation:nexusSpin 1.3s linear infinite; filter:drop-shadow(0 0 10px rgba(79,195,217,0.4));}
  @keyframes nexusSpin{ to{ transform:rotate(360deg); } }
  .plans-loading-text{font-size:12.5px; color:var(--text-dim);}
  .loading-dots span{animation:loadingDot 1.4s infinite; opacity:0;}
  .loading-dots span:nth-child(2){animation-delay:0.2s;}
  .loading-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes loadingDot{ 0%,80%,100%{opacity:0;} 40%{opacity:1;} }

  .succes-icon{font-size:26px; flex-shrink:0;}
  .succes-title{font-size:14.5px; font-weight:700; color:var(--gold);}
  .succes-detail{font-size:12.5px; color:var(--text-mid); margin-top:4px; line-height:1.5;}
  .succes-detail b{color:var(--gold);}
  .sante-dot{width:14px; height:14px; border-radius:50%; background:var(--amber); box-shadow:0 0 12px rgba(245,166,35,0.6); margin-bottom:10px;}
  .sante-sub{font-size:12px; color:var(--text-mid);}
  /* ============================================================
     BRIEF DU MATIN — 23/07/2026. Cockpit simplifié en briefing : un seul
     geste pour "où en est ma station aujourd'hui", tout le reste (anciens
     5 Plans d'action complets, Top ventes, détail de l'Indice) reste
     disponible mais replié sous "Explorer" — rien n'est supprimé.
     ============================================================ */
  .brief-hero{
    margin:14px 20px 6px; padding:30px 22px 26px; border-radius:22px; text-align:center;
    background:radial-gradient(120% 140% at 50% -10%, rgba(212,175,55,0.16), rgba(79,195,217,0.05) 55%, transparent 80%), var(--panel);
    border:1px solid rgba(212,175,55,0.22);
    box-shadow:0 12px 36px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .brief-date{font-family:var(--mono); font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-dim); margin-bottom:16px;}
  .brief-indice-value{font-family:var(--mono); font-size:74px; font-weight:700; line-height:1; text-shadow:0 0 30px currentColor;}
  .brief-indice-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-top:8px;}
  .brief-etat{margin-top:18px; display:inline-flex; align-items:center; gap:9px; font-size:13px; color:var(--text-mid); line-height:1.5; padding:10px 18px; border-radius:22px; background:var(--panel-raised); max-width:100%;}
  .brief-etat-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 10px currentColor;}
  .conseiller-more{margin-top:12px; padding-top:12px; border-top:1px solid var(--hairline); text-align:center; font-family:var(--mono); font-size:11px; color:var(--cyan); cursor:pointer;}
  .conseiller-gain{margin-top:10px; font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .conseiller-gain b{color:var(--green); font-size:15px;}
  .conseiller-calme{font-size:13px; color:var(--text-mid); line-height:1.6; text-align:center; padding:6px 0;}
  .explorer-toggle{
    margin:8px 20px 0; padding:14px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--hairline);
    display:flex; justify-content:center; align-items:center; gap:8px; font-family:var(--mono); font-size:11.5px;
    color:var(--cyan); letter-spacing:0.03em; cursor:pointer;
  }
  .explorer-toggle .chev{transition:transform .2s ease; display:inline-block;}
  .explorer-toggle.open .chev{transform:rotate(180deg);}
  .empty-serein{margin:0 20px; padding:18px; text-align:center; font-size:12.5px; color:var(--text-dim); background:var(--panel-raised); border-radius:12px; line-height:1.5;}
  .indice-facteur{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .indice-facteur:last-child{border-bottom:none;}
  .indice-valeur{font-family:var(--mono); font-weight:700;}
  .indice-note{font-size:10.5px; color:var(--text-dim); margin-top:10px; line-height:1.5; font-style:italic;}
  /* SECTION generic */
  .section{padding:20px 20px;}
  .section-title{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .section-title .badge{
    font-family:var(--mono); font-size:9.5px; padding:2px 7px; border-radius:10px; letter-spacing:0.02em;
  }
  .badge-real{color:var(--green); background:var(--green-dim);}
  .badge-derived{color:var(--cyan); background:rgba(79,195,217,0.12);}
  .section-note{font-size:11px; color:var(--text-dim); line-height:1.5; margin-top:10px;}
  /* MISSIONS */
  .mission{
    display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--hairline);
  }
  .mission:last-child{border-bottom:none;}
  .mission .rank{
    font-family:var(--mono); font-size:15px; font-weight:700; color:var(--text-dim); width:22px; flex-shrink:0;
  }
  .mission .mtext{font-size:14px; line-height:1.4;}
  .mission .mtext b{font-weight:600;}
  .mission .mscore{font-family:var(--mono); font-size:10px; color:var(--green); margin-top:3px;}
  /* OPPORTUNITE */
  .opp-card{
    background:var(--green-dim); border:1px solid rgba(52,211,153,0.25); border-radius:10px;
    padding:18px; display:flex; flex-direction:column; gap:4px;
  }
  .opp-value{font-family:var(--mono); font-size:32px; font-weight:700; color:var(--green);}
  .opp-desc{font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  /* RISQUE */
  .risk-card{
    background:var(--red-dim); border:1px solid rgba(240,87,90,0.3); border-radius:10px;
    padding:16px 18px; display:flex; flex-direction:column; gap:4px;
  }
  .risk-title{font-size:14px; font-weight:600; color:var(--text);}
  .risk-desc{font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .risk-caveat{font-family:var(--mono); font-size:10.5px; color:var(--amber); margin-top:4px;}
  /* RISQUES QUALIFIÉS (moteur de risques, 12/08/2026) — même structure
     visuelle que NEXUS-Brief-v1.html (.risque-item), délibérément distincte
     de .risk-card ci-dessus (qui reste toujours rouge, un seul cas) : ici
     la couleur du point suit le NIVEAU (ambre pour signal faible/
     exposition, rouge pour risque avéré), jamais un unique voyant. */
  .risque-item{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--hairline);}
  .risque-item:last-child{border-bottom:none;}
  .risque-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:5px;}
  .risque-dot.niveau-signal_faible{background:var(--amber); box-shadow:0 0 8px rgba(245,166,35,0.6);}
  .risque-dot.niveau-exposition{background:var(--amber); box-shadow:0 0 8px rgba(245,166,35,0.6);}
  .risque-dot.niveau-risque_avere{background:var(--red); box-shadow:0 0 8px rgba(240,87,90,0.6);}
  .risque-text{flex:1; font-size:12.5px; line-height:1.55; color:var(--text-mid);}
  .risque-niveau{color:var(--text); font-weight:600; display:block; margin-bottom:2px;}
  .risque-action{color:var(--cyan); font-size:11.5px; margin-top:4px; display:block;}
  .risque-meta{color:var(--text-dim); font-family:var(--mono); font-size:10px; margin-top:4px; display:block;}
  /* BOUCLAGE DES DECISIONS — "qu'est-ce que ça a donné ?" (23/07/2026) */
  .bouclage-card{
    border-radius:12px; padding:14px 16px; margin-bottom:10px; border:1px solid var(--hairline); background:var(--panel-raised, rgba(255,255,255,0.02));
  }
  .bouclage-card:last-child{margin-bottom:0;}
  .bouclage-card.positif{border-color:rgba(52,211,153,0.35); background:var(--green-dim);}
  .bouclage-card.negatif{border-color:rgba(240,87,90,0.3); background:var(--red-dim);}
  .bouclage-meta{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;}
  .bouclage-texte{font-size:12.5px; line-height:1.55; color:var(--text-mid);}
  .bouclage-texte b{color:var(--text);}
  .bouclage-card.positif .bouclage-texte b{color:var(--green);}
  .bouclage-card.negatif .bouclage-texte b{color:var(--red);}
  /* TOP VENTES */
  .top-item{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--hairline);
  }
  .top-item:last-child{border-bottom:none;}
  .top-rank{font-family:var(--mono); font-size:12px; color:var(--text-dim); width:20px;}
  .top-name{font-size:14px; flex:1;}
  .top-val{font-family:var(--mono); font-size:13px; color:var(--green);}

  /* Regard du Conseiller sur les produits stratégiques (28/07/2026) —
     remplace le Top ventes brut dès qu'une évolution est calculable, voir
     NexusConseiller.analyserProduitsStrategiques() et renderTopVentes(). */
  .strategique-card{background:var(--panel); border:1px solid var(--hairline); border-left:3px solid var(--hairline); border-radius:10px; padding:14px 16px; margin-bottom:10px;}
  .strategique-card:last-child{margin-bottom:0;}
  .strategique-card.alerte{border-left-color:var(--amber);}
  .strategique-card.serein{border-left-color:var(--cyan);}
  .strategique-nom{font-size:13.5px; font-weight:600; margin-bottom:8px;}
  .strategique-indics{display:flex; flex-wrap:wrap; gap:6px 14px; font-family:var(--mono); font-size:11.5px; margin-bottom:8px;}
  .strategique-indics span b{font-weight:700;}
  .strategique-phrase{font-size:12.5px; line-height:1.55; color:var(--text-mid);}
  .strategique-phrase b{color:var(--text);}
  .strategique-action{font-family:var(--mono); font-size:11px; color:var(--cyan); margin-top:10px; padding-top:8px; border-top:1px dashed var(--hairline);}
  .strategique-groupe-titre{font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); margin:14px 0 8px;}
  .strategique-groupe-titre:first-child{margin-top:0;}
  footer{
    margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim);
    text-align:center; border-top:1px solid var(--hairline);
  }
  .plan-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden; border-left:3px solid var(--hairline);}
  .plan-card.etat-agir{border-left-color:#F0575A;}
  .plan-card.etat-opportunite{border-left-color:#34D399;}
  .plan-card.etat-surveiller{border-left-color:#F5A623;}
  .plan-card.etat-decider{border-left-color:#F0575A;}
  .plan-card.etat-recommandation{border-left-color:#4FC3D9;}
  .plan-head{padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px;}
  .plan-etat{font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; padding:3px 9px; border-radius:20px; font-weight:700; white-space:nowrap;}
  .etat-agir .plan-etat{background:#3A1D1F; color:#F0575A;}
  .etat-opportunite .plan-etat{background:#153629; color:#34D399;}
  .etat-surveiller .plan-etat{background:#3A2E14; color:#F5A623;}
  .etat-decider .plan-etat{background:#3A1D1F; color:#F0575A;}
  .etat-recommandation .plan-etat{background:rgba(79,195,217,0.12); color:#4FC3D9;}
  .plan-action-teaser{flex:1; font-size:13.5px; font-weight:600; line-height:1.4;}
  .plan-chevron{color:var(--text-dim); font-size:14px; transition:0.15s;}
  .plan-card.open .plan-chevron{transform:rotate(90deg);}
  .plan-body{display:none; padding:0 16px 16px;}
  .plan-card.open .plan-body{display:block;}
  .plan-story{font-size:12.5px; line-height:1.75; color:var(--text-mid);}
  .plan-story b{color:var(--text); font-weight:600;}
  .plan-story .story-label{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); display:block; margin-top:10px; margin-bottom:2px;}
  .mentor-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:20px; text-align:center;}
  .mentor-quote{font-size:14px; line-height:1.6; font-style:italic; color:var(--text);}
  .mentor-sign{font-family:var(--mono); font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-top:12px;}
  .conseiller-card{background:linear-gradient(135deg, rgba(79,195,217,0.08), rgba(79,195,217,0.02)); border:1px solid rgba(79,195,217,0.25); border-radius:14px; padding:18px;}
  .conseiller-wrap{display:flex; align-items:flex-start; gap:10px;}
  .conseiller-avatar-standalone{width:52px; height:52px; border-radius:50%; background:var(--panel-raised); border:1.5px solid rgba(79,195,217,0.4); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; overflow:hidden;}
  .conseiller-bubble{position:relative; flex:1;}
  .conseiller-bubble::before{content:''; position:absolute; left:-7px; top:23px; width:14px; height:14px; background:linear-gradient(135deg, rgba(79,195,217,0.08), rgba(79,195,217,0.02)); border-left:1px solid rgba(79,195,217,0.25); border-bottom:1px solid rgba(79,195,217,0.25); transform:rotate(45deg); border-radius:0 0 0 4px;}
  .conseiller-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .conseiller-avatar{width:34px; height:34px; border-radius:50%; background:var(--cyan); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .conseiller-name{font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--cyan); letter-spacing:0.03em;}
  .conseiller-sub{font-family:var(--mono); font-size:9px; color:var(--text-dim);}
  .conseiller-text{font-size:13px; line-height:1.65; color:var(--text);}
  .conseiller-text b{color:var(--cyan);}

    async function exclureAvecCommentaire(article) {
      const commentaire = prompt(`Pourquoi exclure "${article}" des recommandations ? (optionnel)`, '');

    const ETATS_URGENTS = ['🔥 À AGIR', '🔴 CRITIQUE'];
    function renderBriefMini() {

      if (!el) return;
      const total = dernierAffichage.length;
      const nbUrgent = dernierAffichage.filter(p => ETATS_URGENTS.includes(p.etat)).length;
      const dateTexte = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
      let couleur, etatTexte;
      if (total === 0) {
        couleur = 'var(--green)';
        etatTexte = 'Rien ne nécessite votre attention immédiate ce matin.';
      } else if (nbUrgent > 0) {
        couleur = 'var(--red)';
        etatTexte = `${nbUrgent} priorité${nbUrgent>1?'s':''} urgente${nbUrgent>1?'s':''} sur ${total} à traiter aujourd'hui.`;
      } else {
        couleur = 'var(--amber)';
        etatTexte = `${total} priorité${total>1?'s':''} identifiée${total>1?'s':''}, aucune urgente.`;
      }
      el.innerHTML = `
        <div class="brief-date">${dateTexte}</div>
        <div class="brief-etat"><span class="brief-etat-dot" style="background:${couleur};"></span>${etatTexte}</div>
      `;
    }
    function renderSucces() {
      const el = document.getElementById('succesSection');
      if (!el) return;
      if (!MEILLEUR_SUCCES) { el.innerHTML = ''; return; }
      const prenom = (typeof STATION_CONFIG !== 'undefined' && STATION_CONFIG.manager_prenom) ? STATION_CONFIG.manager_prenom : '';
      const pct = Math.round(MEILLEUR_SUCCES.evolution * 100);
      el.innerHTML = `
        <div class="succes-card">
          <div class="succes-icon">🏆</div>
          <div>
            <div class="succes-title">Bravo ${prenom} — ${MEILLEUR_SUCCES.article} progresse de +${pct} %</div>
            <div class="succes-detail">Soit environ <b>+${Math.round(MEILLEUR_SUCCES.gain).toLocaleString('fr-FR')} €</b> depuis la période précédente. Continuez sur cette voie.</div>
          </div>
        </div>`;
    }
    // ------------------------------------------------------------
    // Bouclage des décisions — "qu'est-ce que ça a donné ?" (23/07/2026,
    // demande de Frédéric : "il faut que NEXUS ait une mémoire").
    //
    // Pour chaque décision déjà validée qui porte une référence chiffrée
    // (ca_reference + période, voir construirePlansAction()), on cherche la
    // période la plus proche APRÈS cette référence dont la durée est
    // comparable (±20 %, même règle que la tendance) — jamais une
    // comparaison avec une période trop différente. Si l'article n'a pas
    // encore une telle période, ou n'apparaît plus dans le catalogue à ce
    // moment-là (rupture, retrait…), la décision reste simplement en
    // attente : pas de résultat affiché, jamais de résultat inventé.
    // ------------------------------------------------------------
    function renderBouclage() {
      const el = document.getElementById('bouclageSection');
      if (!el) return;
      const decisions = JOURNAL_DECISIONS.filter(d => d.ca_reference != null && d.periode_reference_fin && d.periode_reference_debut);
      const resultats = [];
      decisions.forEach(d => {
        const dureeRef = NexusPeriodes.joursEntre(d.periode_reference_debut, d.periode_reference_fin);
        const periodeResultat = PERIODES_TRIEES_MEMOIRE
          .filter(p => p.debut > d.periode_reference_fin)
          .filter(p => {
            const ecart = Math.max(p.duree, dureeRef) > 0
              ? Math.abs(p.duree - dureeRef) / Math.max(p.duree, dureeRef) : 1;
            return ecart <= 0.2;
          })
          .sort((a, b) => a.debut.localeCompare(b.debut))[0]; // la plus proche dans le temps d'abord
        if (!periodeResultat) return; // pas encore assez de recul pour juger
        const cle = `${periodeResultat.debut}|${periodeResultat.fin}|${d.categorie || ''}|${d.article}`;
        const caApres = CA_PAR_PERIODE_ARTICLE[cle];
        if (caApres == null || !(d.ca_reference > 0)) return; // article absent de cette période ou référence inexploitable — pas de conclusion fabriquée
        resultats.push({ decision: d, periodeResultat, caApres, evolution: (caApres - d.ca_reference) / d.ca_reference });
      });
      if (!resultats.length) { el.innerHTML = ''; return; }
      resultats.sort((a, b) => new Date(b.decision.created_at || b.decision.date) - new Date(a.decision.created_at || a.decision.date));
      const aAfficher = resultats.slice(0, 3);
      const reste = resultats.length - aAfficher.length;
      el.innerHTML = `
        <div class="section-title">Résultat de vos décisions <span class="badge badge-real">Mesuré</span></div>
        ${aAfficher.map(r => {
          const positif = r.evolution >= 0;
          const pct = Math.round(r.evolution * 100);
          const dateDecision = new Date(r.decision.date + 'T00:00:00').toLocaleDateString('fr-FR');
          const tendanceMot = (typeof NexusVocab !== 'undefined' && NexusVocab.tendance) ? NexusVocab.tendance(r.evolution) : '';
          return `
          <div class="bouclage-card ${positif ? 'positif' : 'negatif'}">
            <div class="bouclage-meta">Décision du ${dateDecision} — ${r.decision.article}</div>
            <div class="bouclage-texte">« ${r.decision.recommandation} » — résultat : <b>${positif?'+':''}${pct} %</b> depuis (${Math.round(r.decision.ca_reference).toLocaleString('fr-FR')} € → ${Math.round(r.caApres).toLocaleString('fr-FR')} €).${tendanceMot ? ' ' + tendanceMot : ''}${positif ? '' : ' À vérifier avant de reproduire cette décision ailleurs.'}</div>
          </div>`;
        }).join('')}
        ${reste > 0 ? `<div style="font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:4px;">+ ${reste} autre${reste>1?'s':''} décision${reste>1?'s':''} déjà bouclée${reste>1?'s':''} — voir le Journal NEXUS pour l'historique complet.</div>` : ''}
      `;
    }
    // Remplace l'ancien bloc "Risques" fige en dur — celui-ci lit PIRE_RISQUE,
    // calcule a chaque chargement par le meme moteur que les Plans d'action.
    // Un produit exclu (via 🚫) disparait ici comme partout ailleurs, des le
    // prochain calcul, car construirePlansAction() ne le reprend plus.
    function renderRisques() {
      const el = document.getElementById('risqueSection');
      if (!el) return;
      if (!PIRE_RISQUE) {
        // Distinguer "vérifié, rien à signaler" de "pas encore de période
        // comparable pour en juger" — sinon ce message affirme une
        // tranquillité que NEXUS n'a pas les moyens de garantir. Voir
        // correctif du 23/07/2026 (audit général NEXUS).
        const texte = TENDANCE_DISPONIBLE === false
          ? "Pas encore de période précédente de durée comparable pour mesurer une baisse fiable — dès qu'un nouvel import complet sera disponible, NEXUS pourra vérifier."
          : "Aucun risque significatif actif sur les données actuelles.";
        el.innerHTML = `<div class="section-title">Risques <span class="badge badge-real">Mesuré</span></div>
          <div class="risk-card" style="border-color:var(--hairline); background:var(--panel);">
            <div class="risk-desc" style="color:var(--text-dim);">${texte}</div>
          </div>`;
        return;
      }
      const r = PIRE_RISQUE;
      el.innerHTML = `
        <div class="section-title">Risques <span class="badge badge-real">Mesuré</span></div>
        <div class="risk-card">
          <div class="risk-title">${r.article}</div>
          <div class="risk-desc">${r.analyse} ${r.situation} ${r.contexte}</div>
          <button class="plan-appel" data-article="${r.article}" style="width:100%; margin-top:10px; padding:10px; border:1px solid rgba(240,87,90,0.35); border-radius:8px; background:none; color:var(--red); font-size:11.5px; cursor:pointer;">🚫 Je comprends — ne plus me signaler ce produit</button>
        </div>`;
      el.querySelector('.plan-appel').addEventListener('click', async () => {
        const ok = await exclureAvecCommentaire(r.article);
        if (ok) {
          PLANS_ACTION = await construirePlansAction();
          renderPlansAction();
          renderBriefMini();
          renderNouvelles();
          renderTopVentes();
        }
      });
    }
    // Signaux de risque qualifiés (moteur de risques, 12/08/2026, pilote
    // Marge+Caisse) — délibérément une fonction et une section DOM à part
    // de renderRisques() ci-dessus, jamais fusionnées : celle-ci répond à
    // "quel est le produit qui baisse le plus fort en ce moment ?" (un seul
    // cas, mesuré sur la période), celle-ci répond à "quels faits se
    // répètent dans le temps au point de devenir un risque avéré ?"
    // (matrice de matérialité, mémoire du signal). Voir NEXUS-Brief-v1.html
    // pour la même section — même structure de rendu, même styles
    // .risque-item/.risque-dot/.risque-text, contrat de données identique
    // (sortie de NexusRisquesDonnees.chargerSignauxSite via
    // qualifierEtEnregistrerRisquesPilote).
    function renderRisquesQualifies() {
      const el = document.getElementById('risquesQualifiesSection');
      if (!el) return;
      if (!RISQUES_QUALIFIES_SITE.length) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <div class="section-title">Signaux de risque — À surveiller <span class="badge badge-derived">dérivé</span></div>
        ${RISQUES_QUALIFIES_SITE.map(s => {
          // Cadrage risques Phase 5 (18/08/2026, tâche #234) : ternaire
          // binaire marge/caisse remplacé par le mapping partagé
          // NexusRisques.domaineLabelSignal/sujetSignal — même correctif
          // que Brief/Rapport (Article 11, une seule source).
          const phrase = NexusRisques.genererPhraseContexte({
            domaineLabel: NexusRisques.domaineLabelSignal(s),
            sujet: NexusRisques.sujetSignal(s),
            niveau: s.niveau,
            motif: (s.historique_transitions && s.historique_transitions.length) ? s.historique_transitions[s.historique_transitions.length - 1].motif : '',
          });
          const [entete, ...reste] = phrase.split('\n');
          const motif = reste.join(' ');
          const depuis = s.premiere_detection_le ? new Date(s.premiere_detection_le).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : null;
          return `<div class="risque-item">
            <span class="risque-dot niveau-${s.niveau}"></span>
            <span class="risque-text">
              <span class="risque-niveau">${entete}</span>${motif}
              ${s.action_recommandee ? `<span class="risque-action">${s.action_recommandee}</span>` : ''}
              <span class="risque-meta">Confiance ${s.niveau_confiance || '—'}${depuis ? ` · suivi depuis le ${depuis}` : ''}</span>
            </span>
          </div>`;
        }).join('')}
        <div class="section-note">NEXUS compare chaque signal à sa propre référence historique et ne le qualifie de risque qu'une fois suffisamment d'éléments réunis.</div>`;
    }
    // Vue d'ensemble des produits en baisse — complète Risques (qui ne montre
    // que le pire cas) sans mélanger ça aux 5 Plans d'action scorés. Repliée
    // par défaut (même mécanique .plan-card/.open que les plans) pour ne pas
    // surcharger l'écran : un manager pressé voit juste le compte, et peut
    // déplier s'il veut le détail des 5 pires. Demande de Frédéric 23/07/2026.
    function renderProduitsBaisse() {
      const el = document.getElementById('baisseSection');
      if (!el) return;
      if (!PRODUITS_EN_BAISSE.length) { el.innerHTML = ''; return; }
      const nb = PRODUITS_EN_BAISSE.length; // total réel, jamais filtré (Article 5) — le titre reste exact
      // Déduplication signal → action (22/08/2026, v2.227, audit §6) :
      // un article déjà visible comme carte d'action pleine taille dans
      // "Plan d'exploitation" (dernierAffichage) n'est pas répété dans le
      // détail de cette carte — mais il compte toujours dans `nb` ci-dessus.
      const { liste: baisseNonActionnee } = NexusConseiller.filtrerBaisseDejaEnAction(PRODUITS_EN_BAISSE, dernierAffichage);
      const pires = baisseNonActionnee.slice(0, 5);
      const reste = baisseNonActionnee.length - pires.length;
      // Réduire le bruit des grandes listes (24/08/2026, v2.228, audit
      // §8) : le teaser ne dit plus juste "N produits en baisse" (trop
      // alarmant sur un gros chiffre qui mélange tout) mais répartit par
      // sévérité, avec un phrasé qui annonce que NEXUS a déjà fait le tri.
      const severite = NexusConseiller.repartirBaisseParSeverite(PRODUITS_EN_BAISSE, dernierAffichage);
      const partsSeverite = [
        severite.significatives > 0 ? `${severite.significatives} significative${severite.significatives>1?'s':''}` : null,
        severite.aVerifier > 0 ? `${severite.aVerifier} à vérifier` : null,
        severite.necessitentAction > 0 ? `${severite.necessitentAction} déjà en action` : null,
      ].filter(Boolean).join(' · ');
      el.innerHTML = `
        <div class="plan-card etat-surveiller" id="carteBaisse">
          <div class="plan-head" onclick="document.getElementById('carteBaisse').classList.toggle('open')">
            <span class="plan-etat">📉 EN BAISSE</span>
            <span class="plan-action-teaser">${nb} référence${nb>1?'s':''} vend${nb>1?'ent':''} moins sur la période${partsSeverite ? ' — ' + partsSeverite : ''}</span>
            <span class="plan-chevron">›</span>
          </div>
          <div class="plan-body">
            <div class="plan-story">
              <span class="story-label">Détail</span>
              ${pires.length ? pires.map(p => `${p.article} (${p.categorie}) — ${(p.evolution*100).toFixed(1)} %`).join('<br>') : 'Tous déjà dans votre Plan d\'exploitation ci-dessus.'}
              ${reste > 0 ? `<br><span style="color:var(--text-dim);">+ ${reste} autre${reste>1?'s':''} — voir Produits pour le détail complet.</span>` : ''}
            </div>
          </div>
        </div>`;
    }
    // Remplace l'ancien "Top ventes" fige — TOP_VENTES vient des memes lignes
    // rowsAffichage (periode la plus recente) que le reste du moteur, jamais
    // un texte recopie a la main.
    // Formate une évolution en pourcentage signé (+12 % / -8 %), ou null si
    // l'évolution elle-même est null (pas de base précédente exploitable —
    // voir analyserProduitsStrategiques, jamais un "0 %" fabriqué à la place).
    function formatPctSigne(v) {
      if (v == null) return null;
      return `${v >= 0 ? '+' : ''}${(v * 100).toFixed(0)} %`;
    }

    // Regard du Conseiller sur les produits stratégiques (28/07/2026,
    // demande de Frédéric) — remplace le classement brut par CA dès qu'une
    // évolution est calculable (voir NexusConseiller.analyserProduitsStrategiques) :
    // le signal le plus utile est le cas où le CA progresse alors que les
    // quantités reculent (croissance purement tarifaire), suivi des top
    // progressions/régressions de volume et des marges en progression.
    // Sans paire de périodes comparables, on retombe honnêtement sur
    // l'ancien Top ventes (classement CA simple, pas d'évolution affichée).
    function renderTopVentes() {
      const el = document.getElementById('topVentesSection');
      if (!el) return;
      const ps = PRODUITS_STRATEGIQUES;

      if (!ps.disponible) {
        if (!TOP_VENTES.length) { el.innerHTML = ''; return; }
        el.innerHTML = `
          <div class="section-title">Top ventes <span class="badge badge-real">Mesuré</span></div>
          ${TOP_VENTES.map((p, i) => `
            <div class="top-item">
              <span class="top-rank">0${i+1}</span>
              <span class="top-name">${p.article}</span>
              <span class="top-val">${Math.round(p.ca).toLocaleString('fr-FR')} €</span>
            </div>`).join('')}`;
        return;
      }

      // Un pourcentage seul n'informe pas ("+2300 %" sur une base de 1
      // unité) — toujours l'accoler au volume réel en unités (28/07/2026,
      // retour de Frédéric). Jamais affiché sans son couple absolu.
      function texteQuantite(a) {
        const prec = Math.round(a.quantitePrecedente);
        const act = Math.round(a.quantite);
        return `${prec} → ${act} unité${act > 1 ? 's' : ''} (${formatPctSigne(a.evolutionQuantite)})`;
      }

      const carteTarifaire = a => `
        <div class="strategique-card alerte">
          <div class="strategique-nom">${a.article}</div>
          <div class="strategique-indics">
            <span>💶 Prix moyen : <b>${formatPctSigne(a.evolutionPrixMoyen)}</b></span>
            <span>📦 Quantités : <b>${texteQuantite(a)}</b></span>
            <span>💰 Marge : <b>${a.evolutionMarge != null ? formatPctSigne(a.evolutionMarge) : 'non mesurable'}</b></span>
          </div>
          <div class="strategique-phrase">Le chiffre d'affaires progresse (${formatPctSigne(a.evolutionCA)}) uniquement grâce à la hausse du prix (${formatPctSigne(a.evolutionPrixMoyen)}) — les clients achètent moins ce produit : ${texteQuantite(a)}. Si cette tendance continue, il faudra revoir son positionnement ou son offre.</div>
          <div class="strategique-action">👉 Contrôlez le prix affiché et surveillez la concurrence tarifaire.</div>
        </div>`;

      // Une forte baisse dont le nom évoque une saison/un évènement (voir
      // NexusConseiller.MOTSCLES_SAISONNIERS) est présentée sereinement —
      // NEXUS ne peut pas vérifier que la campagne est bien terminée
      // (Article 5), donc le texte reste conditionnel, jamais catégorique.
      const carteSaisonniere = a => `
        <div class="strategique-card serein">
          <div class="strategique-nom">${a.article}</div>
          <div class="strategique-phrase">📅 Produit à consonance saisonnière ou événementielle (« ${a.motCleSaisonnier} »). ${texteQuantite(a)} sur la période. Si cette période est déjà terminée, il ne s'agit probablement pas d'une vraie régression, mais d'une fin de campagne normale.</div>
          <div class="strategique-action">👉 Aucun traitement nécessaire — à confirmer si la campagne est bien terminée.</div>
        </div>`;

      const cartePlate = (a, texte, action) => `
        <div class="strategique-card">
          <div class="strategique-nom">${a.article}</div>
          <div class="strategique-phrase">${texte}</div>
          <div class="strategique-action">${action}</div>
        </div>`;

      let corps = '';
      if (ps.tarifaire.length) corps += ps.tarifaire.map(carteTarifaire).join('');
      if (ps.progressionVolume.length) {
        corps += `<div class="strategique-groupe-titre">📈 Top progression en volume</div>`;
        corps += ps.progressionVolume.map(a => cartePlate(a,
          `Les clients achètent davantage ce produit : ${texteQuantite(a)}, pour un chiffre d'affaires ${formatPctSigne(a.evolutionCA)}.`,
          `👉 Sécurisez le réassort pour éviter une rupture pendant que la demande est forte.`
        )).join('');
      }
      if (ps.regressionVolume.length) {
        corps += `<div class="strategique-groupe-titre">📉 Top régression en volume</div>`;
        corps += ps.regressionVolume.map(a => cartePlate(a,
          `Les clients achètent moins ce produit : ${texteQuantite(a)}, chiffre d'affaires ${formatPctSigne(a.evolutionCA)}. Si aucune rupture n'explique ce recul, une vérification s'impose.`,
          `👉 Observez le facing pendant quelques jours et vérifiez l'absence de rupture.`
        )).join('');
      }
      if (ps.regressionSaisonniere.length) {
        corps += `<div class="strategique-groupe-titre">📅 Baisses probablement saisonnières</div>`;
        corps += ps.regressionSaisonniere.map(carteSaisonniere).join('');
      }
      if (ps.margeEnProgression.length) {
        corps += `<div class="strategique-groupe-titre">💰 Marge en progression</div>`;
        corps += ps.margeEnProgression.map(a => cartePlate(a,
          `Marge ${formatPctSigne(a.evolutionMarge)} sur la période, sans recul du volume vendu.`,
          `👉 Aucun traitement nécessaire — continuez ainsi.`
        )).join('');
      }

      // Sélectivité (28/07/2026, retour de Frédéric : "le Conseiller ne
      // devrait jamais commenter tous les produits, seulement ceux qui
      // méritent l'attention") — affiche toujours ce qui a été passé en
      // revue, même quand rien ne remonte, pour que le silence se lise
      // comme un vrai contrôle effectué plutôt qu'un vide inexpliqué.
      const badgeSelectivite = ps.totalAnalyses > 0
        ? `${ps.totalAnalyses} analysé${ps.totalAnalyses > 1 ? 's' : ''} · ${ps.totalRetenus} retenu${ps.totalRetenus > 1 ? 's' : ''}`
        : 'Prix · Quantité · Marge';

      if (!corps) {
        el.innerHTML = `<div class="section-title">Regard du Conseiller <span class="badge badge-real">${badgeSelectivite}</span></div>
          <div style="padding:16px; text-align:center; color:var(--text-dim); font-size:12.5px;">NEXUS a analysé ${ps.totalAnalyses} produit${ps.totalAnalyses > 1 ? 's' : ''} comparables sur la période — aucun ne nécessite votre attention aujourd'hui.</div>`;
        return;
      }
      // Replier "Regard du Conseiller" derrière son badge (24/08/2026,
      // v2.228, audit §9 : "Le badge « 832 analysés · 9 retenus » est
      // excellent et doit devenir le point d'entrée de la section... Les
      // cartes détaillées ne s'affichent qu'après ouverture.") Même
      // mécanique .plan-card/.open déjà utilisée pour "carteBaisse" —
      // aucun nouveau composant, aucune nouvelle classe CSS.
      const repartitionTexte = NexusConseiller.resumerGroupesStrategiques(ps);
      el.innerHTML = `
        <div class="plan-card" id="carteConseiller">
          <div class="plan-head" onclick="document.getElementById('carteConseiller').classList.toggle('open')">
            <span class="plan-etat">🔎 CONSEILLER</span>
            <span class="plan-action-teaser">Regard du Conseiller — ${badgeSelectivite}${repartitionTexte ? ' — ' + repartitionTexte : ''}</span>
            <span class="plan-chevron">›</span>
          </div>
          <div class="plan-body">${corps}</div>
        </div>`;
    }
    // ------------------------------------------------------------
    // Nouvelles — regroupe Succès, Bouclage, Risques et Produits en baisse
    // sous un seul titre (23/07/2026) : ce sont quatre facettes de la même
    // question ("qu'est-ce qui a changé depuis ma dernière visite ?"), pas
    // quatre sujets différents. Les fonctions internes (renderSucces,
    // renderBouclage, renderRisques, renderProduitsBaisse) gardent leur
    // logique et leurs boutons d'exclusion exactement comme avant — seul
    // le regroupement visuel change, pour ne prendre aucun risque sur des
    // interactions déjà éprouvées. Si les quatre sont vides, un message
    // serein le dit explicitement plutôt que de laisser un vide silencieux.
    // ------------------------------------------------------------
    function renderNouvelles() {
      renderSucces();
      renderBouclage();
      renderRisques();
      renderProduitsBaisse();
      const zones = ['succesSection', 'bouclageSection', 'risqueSection', 'baisseSection'].map(id => document.getElementById(id));
      const vide = zones.every(el => !el || !el.innerHTML.trim());
      const titre = document.getElementById('nouvellesTitle');
      const videEl = document.getElementById('nouvellesVide');
      if (titre) titre.style.display = vide ? 'none' : 'flex';
      if (videEl) videEl.style.display = vide ? 'block' : 'none';
    }
    // renderConseiller() (carte à priorité unique) et ouvrirExplorer() ont
    // été retirés le 28/07/2026 : la carte dupliquait "Le Conseiller" de
    // l'accueil (App-v1), et l'Explorer n'a plus rien à replier depuis que
    // "Toutes les priorités" est promue en pleine page (voir restructuration
    // en tête de fichier). Le bouton de validation vit désormais uniquement
    // dans chaque carte de la liste "Vos priorités du jour" (renderPlansAction).
    // ---------------------------------------------------------------
    // NEXUS — Configuration par station (paramétrage, pas moteur)
    // C'est la SEULE partie de ce fichier qui change d'une station à
    // l'autre. Tout le reste du Cockpit (logique, sections, calculs)
    // reste identique — c'est ce qui rend NEXUS générique plutôt que
    // sur-mesure (Capability 010 — Se déployer sur une nouvelle station).
    // ---------------------------------------------------------------
    const STATION_CONFIG = {
      manager_prenom: "",
      manager_role: "",
      station_nom: "VITO SAINTE-MARIE USINE",
      logo_url: ""
    };
    // ------------------------------------------------------------
    // Rappels manuels (28/07/2026, demande de Frédéric — "le cockpit
    // pourrais me faire des rappels... version simple pour l'instant" —
    // puis retour le même jour : "tu aurais dû juste brancher rappels dans
    // produits au cockpit"). Volontairement simple : texte + date
    // d'échéance optionnelle. Pas de calcul automatique de
    // réapprovisionnement/point de commande — cette donnée (stock réel,
    // délais fournisseurs) n'existe pas encore en base pour le proposer
    // honnêtement (voir nexus-stock.js). Un rappel ajouté ici rejoint la
    // liste "Vos priorités du jour" comme un candidat de plus (voir
    // chargerCandidatsRappels() / NexusConseiller.normaliserRappel), il
    // n'a pas sa propre liste séparée — seul ce formulaire d'ajout reste
    // ici. Table public.rappels, RLS : lecture toute l'équipe du site,
    // écriture manager/gérant du site (même patron que journal_decisions).
    // ------------------------------------------------------------
    async function ajouterRappel(texte, dateEcheance) {
      const { error } = await nexusClient.from('rappels').insert({
        site: SITE_ACTUEL, texte, date_echeance: dateEcheance || null, cree_par: employeeCourantId,
      });
      if (error) { console.error('Ajout rappel:', error); alert('Erreur — réessayez.'); return false; }
      return true;
    }
    async function marquerRappelFait(id) {
      const { error } = await nexusClient.from('rappels').update({ fait: true, fait_le: new Date().toISOString() }).eq('id', id);
      if (error) { console.error('Clôture rappel:', error); alert('Erreur — réessayez.'); return false; }
      return true;
    }

    // Case "Justifié" sur un écart de caisse (28/07/2026, demande de
    // Frédéric) — réutilise exactement le mécanisme déjà en place dans
    // NEXUS-Verify-v1.html : la vue v_caisse_ecart_a_traiter exclut tout
    // audit dont le commentaire n'est pas vide (voir sa définition SQL).
    // Cocher ici revient donc à commenter l'audit, avec une trace explicite
    // de qui a justifié et quand — jamais un simple drapeau silencieux —
    // plutôt que d'ajouter une colonne dédiée en plus d'un mécanisme qui
    // existe déjà.
    //
    // commentaire_le (24/08/2026, v2.231, audit "Cockpit Améliorations
    // Développeur" §12 — "NEXUS trace l'action... cycle de vie explicite
    // et auditable") : le texte de trace ci-dessus existait déjà, mais
    // aucun horodatage dédié ne permettait de savoir QUAND l'action a eu
    // lieu (valide_le appartient à un autre mécanisme, la validation
    // d'audit depuis Verify) — impossible donc de faire apparaître cette
    // action dans le Journal NEXUS ("Aujourd'hui"). Nouvelle colonne
    // (migration `ajouter_commentaire_le_audits_caisse`), lue par
    // NEXUS-Journal-v1.html.
    async function marquerCaisseJustifiee(auditId) {
      const trace = `Justifié depuis le Cockpit par ${STATION_CONFIG.manager_prenom || 'un manager'} le ${new Date().toLocaleDateString('fr-FR')}.`;
      const { error } = await nexusClient.from('audits_caisse').update({ commentaire: trace, commentaire_le: new Date().toISOString() }).eq('id', auditId);
      if (error) { console.error('Justification écart caisse:', error); return false; }
      return true;
    }
    nexusRequireAuth().then(async employee => {
      if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
      employeeCourantId = employee.id;
      SITE_ACTUEL = employee.site_id;
      await chargerJournalDecisions();
      PLANS_ACTION = await construirePlansAction();
      renderPlansAction();
      STATION_CONFIG.manager_prenom = employee.nom;
      STATION_CONFIG.manager_role = employee.role;
      const { data: siteActuel } = await nexusClient.from('sites').select('nom_entreprise, logo_url').eq('site_id', SITE_ACTUEL).maybeSingle();
      if (siteActuel && siteActuel.nom_entreprise) STATION_CONFIG.station_nom = siteActuel.nom_entreprise;
      if (siteActuel && siteActuel.logo_url) STATION_CONFIG.logo_url = siteActuel.logo_url;
      const header = document.getElementById('nexus-header');
      header.innerHTML = `
        <div class="logo-frame"><img class="logo" src="${STATION_CONFIG.logo_url}" alt="${STATION_CONFIG.station_nom}" onerror="this.style.display='none'"></div>
        <div class="id">
          <div class="greet">Bonjour ${STATION_CONFIG.manager_prenom} <span class="role-badge">${STATION_CONFIG.manager_role}</span></div>
          <div class="station">${STATION_CONFIG.station_nom}</div>
        </div>
        <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>`;
      renderBriefMini();
      renderNouvelles();
      renderTopVentes();
      const rappelBtn = document.getElementById('rappelAjouterBtn');
      if (rappelBtn) {
        rappelBtn.addEventListener('click', async () => {
          const inputTexte = document.getElementById('rappelTexteInput');
          const inputDate = document.getElementById('rappelDateInput');
          const texte = inputTexte.value.trim();
          if (!texte) { inputTexte.focus(); return; }
          rappelBtn.disabled = true;
          const ok = await ajouterRappel(texte, inputDate.value || null);
          rappelBtn.disabled = false;
          if (ok) {
            inputTexte.value = '';
            inputDate.value = '';
            PLANS_ACTION = await construirePlansAction(); // le nouveau rappel rejoint la liste
            renderPlansAction();
            renderBriefMini();
          }
        });
      }
    });
  </script>
</div>
</body>
</html>
