      nexusClient.from('mission_completions').select('mission_id').eq('site_id', SITE_ACTUEL).eq('date', aujourdhui),
    ]);
    if (catalogueRes.error) { console.error('Chargement mission_catalog (Brief):', catalogueRes.error); return null; }
    const total = catalogueRes.count != null ? catalogueRes.count : null;
    if (total == null) return null;
    const faitesAujourdhui = new Set((completionsRes.data || []).map(r => r.mission_id)).size;
    return Math.max(0, total - faitesAujourdhui);
  }

  // ------------------------------------------------------------
  // Statuts par axe — repris à l'identique des fonctions statutCommerce/
  // statutValeur/statutEquipe de NEXUS-App-v1.html (mêmes seuils, jamais
  // recalculés différemment ici), plus deux fonctions propres à Brief NEXUS
  // pour les axes Opérations et Risques (5e axe, nouveau sur cet écran).
  // ------------------------------------------------------------
  function statutCommerce(facteurs) {
    if (!facteurs || facteurs.evolutionReelle == null) return 'Données insuffisantes';
    if (facteurs.evolutionReelle >= 0.05) return 'En progression';
    if (facteurs.evolutionReelle <= -0.05) return 'En repli';
    return 'Stable';
  }
  function statutValeur(facteurs, margePlusResultat) {
    if (!facteurs || facteurs.margeReelle == null) return 'Données insuffisantes';
    if (margePlusResultat && margePlusResultat.nbEcarts > 0) return 'À surveiller';
    return 'Sous contrôle';
  }
  function statutEquipe(equipeScore, totalPointages) {
    if (equipeScore == null || totalPointages == null || totalPointages < SEUIL_MIN_POINTAGES_EQUIPE) return 'Données insuffisantes';
    if (equipeScore >= 90) return 'Sous contrôle';
    if (equipeScore >= 70) return 'À surveiller';
    return 'À corriger';
  }
  function statutRisques(score) {
    if (score == null) return 'Données insuffisantes';
    if (score >= 70) return 'Sous contrôle';
    if (score >= 40) return 'À surveiller';
    return 'À corriger';
  }

  // Scores numériques 0-100 pour la Boussole — pondération PROVISOIRE, non
  // recalibrée (même esprit que la pondération de nexus-indice.js, elle
  // aussi documentée comme provisoire). Chaque entrée est une donnée réelle
  // déjà calculée ailleurs dans NEXUS ; seule la façon de les combiner en
  // une position sur 100 est un premier jet à ajuster avec l'usage réel.
  function scoreDepuisEvolution(evol) {
    if (evol == null) return null;
    return Math.max(0, Math.min(100, Math.round(50 + evol * 250)));
  }
  function scoreDepuisMarge(margeReelle) {
    if (margeReelle == null) return null;
    return Math.max(0, Math.min(100, Math.round(50 + (margeReelle - 0.25) * 100)));
  }
  function scoreOperations(detailOperations, totalJours) {
    if (!totalJours || detailOperations == null) return null;
    return Math.max(0, Math.min(100, Math.round(100 - (detailOperations / SEUIL_ECART_OPERATIONS_EUR) * 50)));
  }
  function scoreRisques({ nbCritiquesCaisse, alertesInventaireOuvertes, risqueStockTotal, pertesR2Total }) {
    if (nbCritiquesCaisse == null && alertesInventaireOuvertes == null && risqueStockTotal == null && pertesR2Total == null) return null;
    let penalite = 0;
    penalite += Math.min(40, (nbCritiquesCaisse || 0) * 15);
    penalite += Math.min(20, (alertesInventaireOuvertes || 0) * 4);
    penalite += (risqueStockTotal || 0) > 0 ? 20 : 0;
    penalite += (pertesR2Total || 0) > 0 ? 20 : 0;
    return Math.max(0, Math.min(100, Math.round(100 - penalite)));
  }

  function couleurAxe(valeur) {
    if (valeur === null) return { hex: '#57626F', nom: 'Donnée insuffisante' };
    if (valeur >= 70) return { hex: '#34D399', nom: 'Sous contrôle' };
    if (valeur >= 40) return { hex: '#F5A623', nom: 'À surveiller' };
    return { hex: '#F0575A', nom: 'Priorité' };
  }

  // Radar SVG 5 axes — coordonnées polaires adaptées de genererRadarSVG()
  // dans NEXUS-Radar-Manager-v1.html (même principe : grille + polygone +
  // points colorés par statut), réduit à 5 axes pour la Boussole NEXUS.
  function genererBoussoleSVG(axes) {
    const cx = 140, cy = 140, rMax = 95, n = axes.length;
    const angle = i => (Math.PI * 2 * i / n) - Math.PI / 2;
    const point = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
    let defs = `<defs><radialGradient id="glowBrief" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.30"/><stop offset="100%" stop-color="#D4AF37" stop-opacity="0.04"/>
    </radialGradient></defs>`;
    let grid = '';
    [0.33, 0.66, 1].forEach(f => {
      const pts = axes.map((_, i) => point(i, rMax * f).join(',')).join(' ');
      grid += `<polygon points="${pts}" fill="none" stroke="#242E38" stroke-width="1"/>`;
    });
    axes.forEach((_, i) => { const [x, y] = point(i, rMax); grid += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#242E38" stroke-width="1"/>`; });
    const mesures = axes.map((a, i) => a.valeur != null ? point(i, rMax * Math.max(a.valeur, 8) / 100) : null);
    let dataShape = '';
    const ptsValides = mesures.filter(p => p !== null);
    if (ptsValides.length >= 3) dataShape = `<polygon points="${ptsValides.map(p => p.join(',')).join(' ')}" fill="url(#glowBrief)" stroke="#D4AF37" stroke-width="2.5" stroke-linejoin="round"/>`;
    let dots = '';
    axes.forEach((a, i) => {
      const c = couleurAxe(a.valeur);
      if (a.valeur != null) { const [x, y] = point(i, rMax * Math.max(a.valeur, 8) / 100); dots += `<circle cx="${x}" cy="${y}" r="5.5" fill="${c.hex}" stroke="#0B0F14" stroke-width="2"/>`; }
      else { const [x, y] = point(i, rMax * 0.35); dots += `<circle cx="${x}" cy="${y}" r="4" fill="none" stroke="#57626F" stroke-width="1.5" stroke-dasharray="2,2"/>`; }
    });
    let labels = '';
    axes.forEach((a, i) => {
      const [x, y] = point(i, rMax + 24);
      const c = couleurAxe(a.valeur);
      labels += `<circle cx="${x}" cy="${y}" r="14" fill="${a.valeur != null ? c.hex + '22' : '#1A222C'}" stroke="${a.valeur != null ? c.hex : '#242E38'}" stroke-width="1.5"/>`;
      labels += `<text x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="middle" font-size="13">${a.icone}</text>`;
    });
    return `<svg viewBox="0 0 280 280">${defs}${grid}${dataShape}${dots}${labels}</svg>`;
  }

  // ------------------------------------------------------------
  // Assemblage complet du Brief — une seule fonction qui appelle tous les
  // moteurs, puis construit l'objet ExecutiveBrief rendu par renderBrief().
  // ------------------------------------------------------------
  async function construireBrief() {
    const rowsBrut = await chargerProducts();
    const { periodeAffichage, paire, rowsPaireActuelle, rowsPairePrecedente } = NexusPeriodes.analyserPeriodes(rowsBrut);
    const facteurs = NexusIndice.calculerFacteurs(rowsBrut);
    const periodeLabel = periodeAffichage
      ? `Période analysée : ${new Date(periodeAffichage.debut + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} – ${new Date(periodeAffichage.fin + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}`
      : new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const candidatsProduitsBrut = NexusConseiller.calculerCandidatsProduits(rowsBrut);
    const produitsStrategiques = paire ? NexusConseiller.analyserProduitsStrategiques(rowsPaireActuelle, rowsPairePrecedente) : null;

    const [margePlusResultat, constatTempo, messagesAdvisor, candidatsCaisseObj, candidatsStock, candidatsRappels, candidatsFdj, candidatsCoach, domaineEquipe, alertesInvOuvertes, controlesVerifyRestants, missionsRestantes] = await Promise.all([
      chargerMargePlus(rowsBrut), chargerConstatTempo(), chargerMessagesAdvisor(),
      chargerCandidatsCaisse(), chargerCandidatsStock(), chargerCandidatsRappels(), chargerCandidatsFdj(), chargerCandidatsCoachEquipe(), chargerDomaineEquipe(),
      chargerAlertesInventaireOuvertes(), chargerControlesVerifyRestants(), chargerMissionsRestantes(),
    ]);

    // Succès à féliciter — même détection que MEILLEUR_SUCCES du Cockpit
    // (plus forte progression, base ≥ 50 € pour ne pas célébrer un
    // pourcentage gonflé par un tout petit chiffre de départ).
    let meilleurSucces = null;
    if (paire) {
      const precedentParArticle = {};
      rowsPairePrecedente.forEach(r => { const cle = r.categorie + '|' + r.article; precedentParArticle[cle] = (precedentParArticle[cle] || 0) + (r.ca || 0); });
      rowsPaireActuelle.forEach(p => {
        const cle = p.categorie + '|' + p.article;
        const caPrec = precedentParArticle[cle];
        const evolution = (caPrec && caPrec > 0) ? (p.ca - caPrec) / caPrec : null;
        if (evolution === null || evolution <= 0 || caPrec < 50) return;
        if (!meilleurSucces || evolution > meilleurSucces.evolution) meilleurSucces = { article: p.article, evolution, gain: Math.max(p.ca - caPrec, 0) };
      });
    }

    const statutCommerceVal = statutCommerce(facteurs);
    const statutValeurVal = statutValeur(facteurs, margePlusResultat);
    const statutOperationsVal = constatTempo.statutOperations;
    const statutEquipeVal = statutEquipe(domaineEquipe.equipeScore, domaineEquipe.totalPointages);
    const risquesR2 = candidatsProduitsBrut.filter(c => c.rule_id === 'R2-BAISSE');
    const pertesR2Total = risquesR2.reduce((s, c) => s + (c.impact_eur || 0), 0);
    const risqueStockTotal = candidatsStock.reduce((s, c) => s + (c.impact_eur || 0), 0);
    const nbCritiquesCaisse = candidatsCaisseObj.raw.filter(c => c.statut === 'critique').length;
    const scoreRisquesVal = scoreRisques({ nbCritiquesCaisse, alertesInventaireOuvertes: alertesInvOuvertes, risqueStockTotal, pertesR2Total });
    const statutRisquesVal = statutRisques(scoreRisquesVal);

    // type : 'reel' si l'axe vient d'un seul facteur mesuré directement
    // (Commerce/Marge/Opérations/Équipe), 'derive' si l'axe interprète
    // plusieurs signaux combinés par une pondération encore provisoire
    // (Risques — voir scoreRisques) — distinction demandée par Frédéric
    // (02/08/2026 soir) pour ne jamais faire passer une interprétation
    // pour une mesure directe. moteurs : liste des moteurs du Conseiller
    // dont une décision peut légitimement être rattachée à cet axe dans
    // la Boussole (Décision liée, voir renderBoussole).
    const AXES = [
      { nom: 'Commerce', icone: '🛒', type: 'reel', moteurs: ['produits'], valeur: scoreDepuisEvolution(facteurs ? facteurs.evolutionReelle : null), statut: statutCommerceVal, cible: 'NEXUS-Produits-v1.html', detail: facteurs && facteurs.evolutionReelle != null ? `Évolution du CA : ${facteurs.evolutionReelle >= 0 ? '+' : ''}${(facteurs.evolutionReelle * 100).toFixed(1)} % vs période précédente comparable.` : "Pas encore de paire de périodes comparables." },
      { nom: 'Marge', icone: '💰', type: 'reel', moteurs: ['marge'], valeur: scoreDepuisMarge(facteurs ? facteurs.margeReelle : null), statut: statutValeurVal, cible: 'NEXUS-Scanner-v1.html', detail: facteurs && facteurs.margeReelle != null ? `Marge réelle : ${(facteurs.margeReelle * 100).toFixed(1)} %${margePlusResultat && margePlusResultat.nbEcarts ? ` · ${margePlusResultat.nbEcarts} écart${margePlusResultat.nbEcarts > 1 ? 's' : ''} de marge actif${margePlusResultat.nbEcarts > 1 ? 's' : ''}` : ''}.` : "Marge non calculable sur les données actuelles." },
      { nom: 'Opérations', icone: '⚙️', type: 'reel', moteurs: ['caisse'], valeur: scoreOperations(constatTempo.detailOperations, constatTempo.totalJours), statut: statutOperationsVal, cible: 'NEXUS-Verify-v1.html', detail: constatTempo.totalJours ? `Écart de caisse moyen : ${Math.round(constatTempo.detailOperations)} €/jour${controlesVerifyRestants ? ` · ${controlesVerifyRestants} contrôle${controlesVerifyRestants > 1 ? 's' : ''} caisse en attente aujourd'hui` : ''}.` : "Pas encore assez d'audits de caisse enregistrés." },
      { nom: 'Équipe', icone: '👥', type: 'reel', moteurs: [], valeur: domaineEquipe.equipeScore, statut: statutEquipeVal, cible: 'NEXUS-Resultats-Equipe-v1.html', detail: domaineEquipe.totalPointages != null && domaineEquipe.totalPointages >= SEUIL_MIN_POINTAGES_EQUIPE ? `Ponctualité mesurée sur ${domaineEquipe.totalPointages} pointages${domaineEquipe.employesASurveiller ? ` · ${domaineEquipe.employesASurveiller} employé${domaineEquipe.employesASurveiller > 1 ? 's' : ''} à surveiller` : ''}.` : "Pas encore assez de pointages enregistrés." },
      { nom: 'Risques', icone: '⚠️', type: 'derive', moteurs: ['caisse', 'stock'], valeur: scoreRisquesVal, statut: statutRisquesVal, cible: 'NEXUS-Scanner-Stock-v1.html', detail: `${nbCritiquesCaisse} écart${nbCritiquesCaisse > 1 ? 's' : ''} de caisse critique${nbCritiquesCaisse > 1 ? 's' : ''} · ${alertesInvOuvertes || 0} alerte${(alertesInvOuvertes || 0) > 1 ? 's' : ''} inventaire ouverte${(alertesInvOuvertes || 0) > 1 ? 's' : ''} · ${Math.round(risqueStockTotal).toLocaleString('fr-FR')} € de risque stock estimé.` },
    ];

    // Indice Boussole explicable (demande de Frédéric, 02/08/2026 soir ;
    // renommé "Indice NEXUS" → "Indice Boussole" le 10/08/2026) : sur cet
    // écran, l'indice N'EST PAS le même calcul que l'Indice Marge de
    // l'accueil/Radar du Manager (nexus-indice.js, marge+évolution CA
    // uniquement) — il est la moyenne des axes de la Boussole réellement
    // mesurés aujourd'hui, chacun recentré à 50 (neutre), pour pouvoir se
    // décomposer honnêtement axe par axe ("Comprendre l'Indice Boussole 62").
    // Un axe non mesuré est exclu de la moyenne, jamais compté comme 50 par
    // défaut (Article 5 : jamais un chiffre inventé).
    const axesMesures = AXES.filter(a => a.valeur != null);
    const scoreGlobal = axesMesures.length ? Math.round(axesMesures.reduce((s, a) => s + a.valeur, 0) / axesMesures.length) : null;
    const indiceExplication = {
      periodeLabel, nbMesures: axesMesures.length,
      deltas: AXES.map(a => ({ nom: a.nom, icone: a.icone, mesure: a.valeur != null, delta: a.valeur != null ? a.valeur - 50 : null })),
    };

    // Synthèse exécutive — structure imposée par Frédéric (02/08/2026 soir) :
    // où vous en êtes → ce qui explique la situation → priorité de la
    // semaine, recalculée à partir des signaux réels (jamais un commentaire
    // générique). Le 3e temps ("les 3 décisions") et le 4e/5e ("impact
    // attendu", "niveau de confiance") vivent dans les sections Décisions et
    // Impact juste en dessous plutôt que dans ce paragraphe, pour ne pas
    // produire un mur de texte — la synthèse annonce, les sections suivantes
    // développent.
    function syntheseExecutive() {
      const concerns = AXES.filter(a => a.statut === 'À surveiller' || a.statut === 'En repli' || a.statut === 'À corriger').map(a => a.nom.toLowerCase());
      const debut = statutCommerceVal === 'En progression' ? "Votre activité commerciale progresse"
        : statutCommerceVal === 'En repli' ? "Votre activité commerciale recule"
        : statutCommerceVal === 'Stable' ? "Votre activité commerciale reste stable" : null;
      let phrase1;
      if (!concerns.length) {
        phrase1 = debut ? `${debut}, sans point de vigilance identifié aujourd'hui sur les 5 axes suivis par NEXUS.` : "NEXUS n'a pas encore assez de données pour évaluer l'état global de votre commerce.";
      } else {
        const liste = concerns.length === 1 ? concerns[0] : concerns.slice(0, -1).join(', ') + ' et ' + concerns[concerns.length - 1];
        phrase1 = `${debut || "NEXUS analyse encore votre activité"}, mais ${liste} ${concerns.length > 1 ? 'se dégradent' : 'se dégrade'}.`;
      }
      // `decisions` est déclaré plus bas dans cette même fonction mais déjà
      // affecté au moment où syntheseExecutive() est APPELÉE (dans l'objet
      // retourné en toute fin de construireBrief) — fermeture JS classique,
      // pas un accès à une variable non initialisée.
      const priorite = decisions[0];
      const phrase2 = priorite ? ` Priorité cette semaine : ${priorite.decision.charAt(0).toLowerCase()}${priorite.decision.slice(1)}` : '';
      return phrase1 + phrase2;
    }

    // Forces — max 2, seulement des signaux positifs réels (jamais complétées
    // artificiellement pour "faire un compte rond").
    const forces = [];
    if (meilleurSucces) forces.push({ icone: '📈', titre: `${meilleurSucces.article} en forte progression`, detail: `+${(meilleurSucces.evolution * 100).toFixed(0)} % sur la période, soit environ ${Math.round(meilleurSucces.gain).toLocaleString('fr-FR')} € de gain.`, cible: 'NEXUS-Produits-v1.html' });
    if (produitsStrategiques && produitsStrategiques.margeEnProgression.length) {
      const m = produitsStrategiques.margeEnProgression[0];
      forces.push({ icone: '💰', titre: `Marge en progression sur ${m.article}`, detail: `Marge en hausse de ${(m.evolutionMarge * 100).toFixed(0)} % sur la période.`, cible: 'NEXUS-Scanner-v1.html' });
    }
    if (forces.length < 2 && constatTempo.jourPlusRentable) forces.push({ icone: '🗓️', titre: `${constatTempo.jourPlusRentable.nom} — votre journée la plus rentable`, detail: "Confirmé sur plusieurs semaines d'historique, produits d'appel exclus.", cible: 'NEXUS-Tempo-v1.html' });
    if (forces.length < 2 && statutEquipeVal === 'Sous contrôle') forces.push({ icone: '👥', titre: "Ponctualité de l'équipe sous contrôle", detail: `Score de ponctualité : ${domaineEquipe.equipeScore}/100 sur ${domaineEquipe.totalPointages} pointages.`, cible: 'NEXUS-Resultats-Equipe-v1.html' });

    // Moteur de priorité cross-moteurs — les 7 moteurs disponibles dans
    // NEXUS aujourd'hui, fusionnés par NexusConseiller.fusionnerEtSelectionner
    // (rang partagé, jamais un simple tri par euros). n=6 : les 3 premiers
    // deviennent les décisions, les 3 suivants la liste de vigilance — un
    // seul et même classement pour les deux, pas deux logiques distinctes.
    const candidatsProduitsNormalises = candidatsProduitsBrut.filter(c => !VALIDEES_SITE.has(c.candidate_id)).map(NexusConseiller.normaliserProduit);
    const candidatMargeListe = margePlusResultat && margePlusResultat.candidatTop && !VALIDEES_SITE.has(margePlusResultat.candidatTop.candidate_id) ? [NexusConseiller.normaliserMarge(margePlusResultat.candidatTop)] : [];
    const candidatTempoBrut = construireCandidatTempo(constatTempo);
    const candidatTempoListe = candidatTempoBrut ? [NexusConseiller.normaliserTempo(candidatTempoBrut)] : [];
    // Règle non négociable pour ce Brief (demande de Frédéric, 02/08/2026
    // soir) : "si NEXUS ne peut pas expliquer précisément pourquoi une
    // information mérite l'attention du dirigeant, elle ne doit pas
    // apparaître." normaliserAdvisor() produit une décision volontairement
    // générique ("Vérifiez ce point dans l'écran concerné") car
    // advisor_messages est un texte libre sans geste concret associé —
    // Brief NEXUS écarte donc tout signal dont le texte réel (message_text)
    // est absent ou trop court pour être précis, plutôt que d'afficher une
    // ligne vague. Les signaux retenus sont ensuite reformulés à partir de
    // leur texte réel dans enrichirDecision() (jamais le gabarit générique).
    const candidatsAdvisorListe = messagesAdvisor
      .filter(m => m.message_text && m.message_text.trim().length >= 12)
      .map(NexusConseiller.normaliserAdvisor);
    const nbMoteursActifs = [candidatsProduitsNormalises, candidatMargeListe, candidatTempoListe, candidatsAdvisorListe, candidatsCaisseObj.normalises, candidatsStock, candidatsRappels, candidatsFdj, candidatsCoach].filter(l => l.length > 0).length;

    const fusion = NexusConseiller.fusionnerEtSelectionner(
      [candidatsProduitsNormalises, candidatMargeListe, candidatTempoListe, candidatsAdvisorListe, candidatsCaisseObj.normalises, candidatsStock, candidatsRappels, candidatsFdj, candidatsCoach],
      { site: SITE_ACTUEL, n: 6 }
    );
    const decisions = fusion.slice(0, 3);
    const watchlist = fusion.slice(3, 6);

    function quandAgir(rang) {
      if (rang <= 0) return "Aujourd'hui";
      if (rang === 1) return "Dans les 48 heures";
      if (rang === 2) return "Cette semaine";
      return "Dès que possible";
    }
    function niveauConfiance(p) { return (p.validable && !p.limites) ? 'Élevé' : 'Moyen'; }
    // Décision précise (demande de Frédéric, 02/08/2026 soir) : "chaque
    // décision doit obligatoirement contenir le sujet précis, l'action, la
    // raison, le module source." Les moteurs Caisse/Stock/Rappel écrivent
    // déjà l'action ET la raison dans un seul champ décision (ex : "Allez
    // voir Dylan : un écart de 40 € reste non justifié...") — utilisés tels
    // quels. Le moteur Advisor est réécrit ici à partir du texte réel du
    // signal (jamais le gabarit générique). Produits et Tempo séparent
    // action et raison dans deux champs (decision/pourquoi) — cette
    // fonction les recompose en une seule phrase "action — raison" pour le
    // titre de la carte, sur le modèle exact donné par Frédéric ("Contrôlez
    // le prix d'achat du Coca-Cola 2 L dans Produits : sa marge est
    // inférieure de 11,6 points...").
    function texteActionPrecis(p) {
      if (p.moteur === 'advisor') return `Vérifiez : ${p.pourquoi}`;
      return p.decision;
    }
    function teaserPrecis(p, action) {
      if (p.moteur === 'produits' || p.moteur === 'tempo') {
        const phrases = (p.pourquoi || '').split('. ').map(s => s.trim()).filter(Boolean);
        const raison = phrases[phrases.length - 1] ? phrases[phrases.length - 1].replace(/\.$/, '') : null;
        return raison ? `${action.replace(/\.$/, '')} — ${raison.charAt(0).toLowerCase()}${raison.slice(1)}.` : action;
      }
      return action; // caisse/stock/rappel/advisor : la raison est déjà dans l'action
    }
    function enrichirDecision(p) {
      const action = texteActionPrecis(p);
      return {
        ...p,
        ceQueJObserve: p.pourquoi,
        pourquoiCelaCompte: p.impactAttendu,
        ceQuiSembleLExpliquer: `Détecté par le moteur ${MOTEUR_LABEL[p.moteur] || p.moteur} à partir de ${MOTEUR_SOURCE[p.moteur] || 'données réelles'}.`,
        ceQuiManquePourConfirmer: p.limites || "Aucune réserve identifiée — signal directement mesuré.",
        ceQueJeRecommande: action,
        teaser: teaserPrecis(p, action),
        quandAgir: quandAgir(p.rang),
        niveauDeConfiance: niveauConfiance(p),
      };
    }

    const gain = decisions.filter(p => ['🔥 À AGIR', '📈 OPPORTUNITÉ', '💡 RECOMMANDATION'].includes(p.etat)).reduce((s, p) => s + (p.impact_eur || 0), 0);
    const risque = decisions.filter(p => !['🔥 À AGIR', '📈 OPPORTUNITÉ', '💡 RECOMMANDATION'].includes(p.etat)).reduce((s, p) => s + (p.impact_eur || 0), 0);

    const decisionsEnrichies = decisions.map(enrichirDecision);
    // La liste de vigilance passe par le même filtre de précision que les
    // décisions (texteActionPrecis) — même règle non négociable, qu'un
    // signal advisor apparaisse en position 1 ou en position 5.
    const watchlistPrecise = watchlist.map(p => ({ ...p, action: texteActionPrecis(p) }));
    return {
      periodeAffichage, periodeLabel, scoreGlobal, indiceExplication, axes: AXES,
      synthese: syntheseExecutive(), forces: forces.slice(0, 2),
      decisions: decisionsEnrichies, watchlist: watchlistPrecise,
      impact: { gain, risque, delai: 'Cette semaine', confianceGlobale: `${nbMoteursActifs}/7 moteurs NEXUS ont contribué à cette synthèse aujourd'hui.` },
      missionsRestantes,
    };
  }

  // ------------------------------------------------------------
  // Rendu — une fonction par section, toutes appelées depuis renderBrief().
  // ------------------------------------------------------------
  function renderHeroEtSynthese(brief) {
    let couleur = 'var(--text-dim)', statutTexte = 'Données insuffisantes';
    if (brief.scoreGlobal != null) {
      if (brief.scoreGlobal >= 90) { couleur = 'var(--green)'; statutTexte = 'Excellence'; }
      else if (brief.scoreGlobal >= 75) { couleur = 'var(--green)'; statutTexte = 'Sous contrôle'; }
      else if (brief.scoreGlobal >= 60) { couleur = 'var(--amber)'; statutTexte = 'À surveiller'; }
      else { couleur = 'var(--red)'; statutTexte = 'Priorité élevée'; }
    }
    const ex = brief.indiceExplication;
    const deltasHTML = ex.deltas.map(d => {
      if (!d.mesure) return `<div class="indice-delta-row"><span>${d.icone} ${d.nom}</span><span class="indice-delta-absent">Non mesuré</span></div>`;
      const signe = d.delta >= 0 ? '+' : '';
      const c = d.delta > 0 ? 'var(--green)' : d.delta < 0 ? 'var(--red)' : 'var(--text-dim)';
      return `<div class="indice-delta-row"><span>${d.icone} ${d.nom}</span><span style="color:${c}; font-family:var(--mono); font-weight:700;">${signe}${d.delta}</span></div>`;
    }).join('');
    return `
      <div class="brief-hero">
        <div class="brief-date">${brief.periodeLabel}</div>
        <div class="brief-indice-value" style="color:${couleur};">${brief.scoreGlobal != null ? brief.scoreGlobal : '—'}</div>
        <!-- Renommé "Indice NEXUS" → "Indice Boussole" le 10/08/2026
             (décision de Frédéric, suite au doc NEXUS-Brief-V2-Architecture-v1.md :
             garder les deux formules d'indice distinctes plutôt que les
             unifier, mais les nommer clairement au lieu de les laisser
             porter le même nom générique — voir aussi NEXUS-App-v1.html,
             "Indice Marge"). -->
        <div class="brief-indice-label">Indice Boussole</div>
        <div class="brief-etat"><span class="brief-etat-dot" style="color:${couleur};"></span>${statutTexte}</div>
        <div class="brief-synthese">${brief.synthese}</div>
        <div class="indice-explain-wrap" id="indiceExplainWrap">
          <div class="indice-explain-toggle" onclick="document.getElementById('indiceExplainWrap').classList.toggle('open')">Comprendre l'Indice Boussole ${brief.scoreGlobal != null ? brief.scoreGlobal : '—'} <span class="chev">›</span></div>
          <div class="indice-explain">
            <div class="section-note" style="margin-top:0;">Moyenne des axes de la Boussole mesurés aujourd'hui (${ex.nbMesures}/5), chacun recentré à 50 = neutre. ${ex.periodeLabel}.</div>
            ${deltasHTML}
            <div class="section-note" style="font-style:italic;">Cet Indice Boussole diffère volontairement de l'Indice Marge affiché sur votre écran d'accueil (calculé, lui, uniquement à partir de la marge et de l'évolution du CA) — pas un bug, deux indices distincts avec leur propre nom : ici la vision d'ensemble du dirigeant, là un signal opérationnel plus étroit.</div>
          </div>
        </div>
      </div>
      <div class="legend-line"><b style="color:var(--green);">RÉEL</b> = calculé directement à partir de données mesurées &nbsp;·&nbsp; <b style="color:var(--cyan);">DÉRIVÉ</b> = interprétation croisant plusieurs signaux &nbsp;·&nbsp; <b style="color:var(--gold);">ESTIMÉ</b> = projection financière, pas une garantie</div>`;
  }

  const NOM_ECRAN = {
    'NEXUS-Produits-v1.html': 'Produits', 'NEXUS-Scanner-v1.html': 'Scanner NEXUS', 'NEXUS-Verify-v1.html': 'Verify',
    'NEXUS-Resultats-Equipe-v1.html': 'Résultats Équipe', 'NEXUS-Scanner-Stock-v1.html': 'Scanner Stock',
  };
  // Chaque axe, au clic, ouvre trois informations demandées par Frédéric
  // (02/08/2026 soir) : État (statut + valeur), Cause principale (le detail
  // déjà calculé pour cet axe — jamais un texte différent inventé pour
  // l'occasion) et Décision liée (la première décision affichée aujourd'hui
  // dont le moteur source correspond à cet axe, ou une phrase honnête s'il
  // n'y en a aucune — jamais une décision qui n'existe pas).
  function renderBoussole(brief) {
    const svg = genererBoussoleSVG(brief.axes);
    const nbReels = brief.axes.filter(a => a.type === 'reel').length;
    const nbDerives = brief.axes.filter(a => a.type === 'derive').length;
    const rows = brief.axes.map((a, i) => {
      const c = couleurAxe(a.valeur);
      const decisionLiee = (a.moteurs || []).length ? brief.decisions.find(d => a.moteurs.includes(d.moteur)) : null;
      const typeInfo = a.type === 'reel' ? { label: 'RÉEL', cls: 'badge-real' } : { label: 'DÉRIVÉ', cls: 'badge-derived' };
      return `
        <div class="axe-block" id="axe-${i}">
          <div class="axe-row" onclick="document.getElementById('axe-${i}').classList.toggle('open')">
            <span class="axe-dot" style="background:${c.hex}; color:${c.hex};"></span>
            <span class="axe-nom">${a.icone} ${a.nom}</span>
            <span class="axe-statut" style="color:${COULEUR_STATUT_DOMAINE[a.statut] || 'var(--text-dim)'};">${a.statut}</span>
            <span class="axe-chev">›</span>
          </div>
          <div class="axe-detail">
            <div class="decision-field"><div class="decision-field-label">État <span class="badge ${typeInfo.cls}" style="margin-left:6px;">${typeInfo.label}</span></div><div class="decision-field-text">${a.statut}${a.valeur != null ? ` — ${a.valeur}/100` : ''}</div></div>
            <div class="decision-field"><div class="decision-field-label">Cause principale</div><div class="decision-field-text">${a.detail}</div></div>
            <div class="decision-field"><div class="decision-field-label">Décision liée</div><div class="decision-field-text">${decisionLiee ? decisionLiee.decision : "Aucune décision prioritaire liée à cet axe aujourd'hui."}</div></div>
            <a href="${a.cible}" class="decision-lien">→ Ouvrir ${NOM_ECRAN[a.cible] || a.cible}</a>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="section">
        <div class="section-title">Boussole NEXUS <span class="badge badge-real">${nbReels} réels</span><span class="badge badge-derived" style="margin-left:5px;">${nbDerives} dérivé</span></div>
        <div class="boussole-card">
          <div class="boussole-svg-wrap">${svg}</div>
          ${rows}
        </div>
        <div class="section-note">Un axe grisé n'est pas mauvais, il manque simplement de données pour l'instant. Touchez un axe pour voir son état, sa cause principale et la décision qui s'y rattache.</div>
      </div>`;
  }

  function renderForces(brief) {
    if (!brief.forces.length) return '';
    return `
      <div class="section">
        <div class="section-title">Ce qui va bien <span class="badge badge-real">réel</span></div>
        ${brief.forces.map(f => `<a class="force-card" href="${f.cible}" style="text-decoration:none;">
          <div class="force-icon">${f.icone}</div>
          <div class="force-titre">${f.titre}</div>
          <div class="force-detail">${f.detail}</div>
        </a>`).join('')}
      </div>`;
  }

  function decisionCardHTML(p, i, estPriorite) {
    // Décision prioritaire ouverte par défaut, plus grande (demande de
    // Frédéric, 02/08/2026 soir : "le dirigeant doit savoir immédiatement
    // quelle décision prendre en premier") — les 2 secondaires restent
    // repliées et visuellement plus compactes (classe .secondaire).
    return `
      <div class="decision-card ${ETAT_CLASS[p.etat] || ''} ${estPriorite ? 'priorite open' : 'secondaire'}" id="decision-${i}">
        <div class="decision-head" onclick="document.getElementById('decision-${i}').classList.toggle('open')">
          <span class="decision-rank ${estPriorite ? '' : 'secondaire'}">${estPriorite ? '① PRIORITÉ' : `#${i + 1}`}</span>
          <span class="decision-teaser">${p.teaser}</span>
          <span class="decision-chevron">›</span>
        </div>
        <div class="decision-body">
          <div class="decision-field"><div class="decision-field-label">Ce que j'observe</div><div class="decision-field-text">${p.ceQueJObserve}</div></div>
          ${p.pourquoiCelaCompte ? `<div class="decision-field"><div class="decision-field-label">Pourquoi cela compte</div><div class="decision-field-text"><b>${p.pourquoiCelaCompte}</b></div></div>` : ''}
          <div class="decision-field"><div class="decision-field-label">Ce qui semble l'expliquer</div><div class="decision-field-text">${p.ceQuiSembleLExpliquer}</div></div>
          <div class="decision-field"><div class="decision-field-label">Ce qui manque pour confirmer</div><div class="decision-field-text">${p.ceQuiManquePourConfirmer}</div></div>
          ${p.preuve ? `<div class="decision-field"><div class="decision-field-label">Preuves</div><div class="decision-field-text">${p.preuve}</div></div>` : ''}
          <div class="decision-chips">
            <span class="decision-chip">📅 ${p.quandAgir}</span>
            <span class="decision-chip ${p.niveauDeConfiance === 'Élevé' ? 'confiance-eleve' : 'confiance-moyen'}">Confiance : ${p.niveauDeConfiance}</span>
            <span class="decision-chip">${MOTEUR_LABEL[p.moteur] || 'Signal'}</span>
          </div>
          ${p.validable
            ? `<button class="decision-valider" data-id="${p.candidate_id}">✓ Accepter cette décision</button>`
            : p.moteur === 'rappel'
              ? `<button class="decision-fait" data-rappel-id="${p.rappelId}">✓ Marquer comme fait</button>`
              : p.cible ? `<a href="${p.cible}" class="decision-lien">→ Voir les preuves dans ${MOTEUR_LABEL[p.moteur] || p.cible}</a>` : ''}
          ${p.moteur === 'caisse' && p.auditId ? `<label class="caisse-justifie-row"><input type="checkbox" class="caisse-justifie-checkbox" data-audit-id="${p.auditId}"><span>Justifié — ne plus me signaler cet écart</span></label>` : ''}
        </div>
      </div>`;
  }

  function renderDecisions(brief) {
    if (!brief.decisions.length) {
      return `<div class="section"><div class="section-title">Décisions recommandées <span class="badge badge-real">réel</span></div>
        <div class="empty-serein">✅ Rien ne nécessite une décision du dirigeant aujourd'hui — toutes les priorités identifiées ont été traitées ou validées.</div></div>`;
    }
    return `
      <div class="section">
        <div class="section-title">Décisions recommandées <span class="badge badge-real">réel</span></div>
        ${brief.decisions.map((p, i) => decisionCardHTML(p, i, i === 0)).join('')}
        <div class="section-note">Classement partagé entre 7 moteurs NEXUS (Produits, Marge+, Tempo, Signaux Qualité/Caisse, Verify, Scanner Stock, Rappels) — jamais un simple tri par montant, qui favoriserait toujours le même moteur. Délai et confiance (<span class="badge badge-derived" style="padding:1px 6px;">dérivé</span>) sont déduits du rang de priorité, pas mesurés directement.</div>
      </div>`;
  }

  function renderWatchlist(brief) {
    if (!brief.watchlist.length) return '';
    return `
      <div class="section">
        <div class="section-title">À surveiller <span class="badge badge-derived">dérivé</span></div>
        ${brief.watchlist.map(p => `<a class="watch-item" href="${p.cible || '#'}">
          <span class="watch-dot"></span>
          <span class="watch-text"><b>${p.action}</b><br>${p.pourquoi}</span>
          <span class="watch-chev">›</span>
        </a>`).join('')}
        <div class="section-note">Ces signaux suivent juste derrière les 3 décisions ci-dessus dans le même classement — pas encore prioritaires, mais à ne pas perdre de vue.</div>
      </div>`;
  }

  // Impact relié explicitement aux décisions affichées (demande de
  // Frédéric, 02/08/2026 soir) : les deux chiffres ne sont plus des blocs
  // détachés — leur libellé nomme les décisions dont ils sont la somme, et
  // un clic déplie la répartition ligne par ligne pour vérifier qu'aucun
  // montant n'est décoratif.
  const ETATS_GAIN = ['🔥 À AGIR', '📈 OPPORTUNITÉ', '💡 RECOMMANDATION'];
  function renderImpact(brief) {
    const sujet = p => (p.article || MOTEUR_LABEL[p.moteur] || p.decision || '').toString().slice(0, 42);
    const gainItems = brief.decisions.filter(p => ETATS_GAIN.includes(p.etat) && p.impact_eur > 0);
    const risqueItems = brief.decisions.filter(p => !ETATS_GAIN.includes(p.etat) && p.impact_eur > 0);
    const ligne = (p, signe) => `<div class="impact-meta-row"><span class="impact-meta-label">${sujet(p)}</span><span class="impact-meta-val">${signe}${Math.round(p.impact_eur).toLocaleString('fr-FR')} €</span></div>`;
    const breakdown = (items, signe, videTexte) => items.length ? items.map(p => ligne(p, signe)).join('') : `<div class="section-note" style="margin-top:0;">${videTexte}</div>`;
    return `
      <div class="section">
        <div class="section-title">Impact des décisions affichées <span class="badge badge-estime">estimé</span></div>
        <div class="impact-grid">
          <div class="impact-card gain" id="impactGainCard" style="cursor:pointer;">
            <div class="impact-value">${Math.round(brief.impact.gain).toLocaleString('fr-FR')} €</div>
            <div class="impact-label">Gain potentiel associé aux décisions affichées</div>
          </div>
          <div class="impact-card risque" id="impactRisqueCard" style="cursor:pointer;">
            <div class="impact-value">${Math.round(brief.impact.risque).toLocaleString('fr-FR')} €</div>
            <div class="impact-label">Risque financier non traité</div>
          </div>
        </div>
        <div id="impactBreakdown" style="display:none; margin-top:12px;">
          <div class="decision-field-label" style="margin-bottom:6px;">Répartition par décision</div>
          ${breakdown(gainItems, '+', "Aucune décision affichée ne porte de gain chiffré aujourd'hui.")}
          ${breakdown(risqueItems, '−', "Aucune décision affichée ne porte de risque chiffré aujourd'hui.")}
        </div>
        <div class="impact-meta-row" style="margin-top:12px;"><span class="impact-meta-label">Délai recommandé</span><span class="impact-meta-val">${brief.impact.delai}</span></div>
        <div class="impact-meta-row"><span class="impact-meta-label">Fiabilité de la synthèse</span><span class="impact-meta-val">${brief.impact.confianceGlobale}</span></div>
        <div class="section-note">Ces montants sont des estimations issues des 3 décisions affichées ci-dessus, jamais une garantie — touchez un bloc pour voir la répartition.</div>
      </div>`;
  }

  // ------------------------------------------------------------
  // RAPPORT PDF (10/08/2026) — réutilise le moteur PDF partagé
  // (nexus-pdf-moteur.js, ConstructeurRapportUnePage) déjà construit pour
  // NEXUS FDJ Pilotage. Même flux en 2 temps (Générer, puis
  // Partager/Ouvrir) et même sanitisation WinAnsi automatique. Aucune
  // nouvelle agrégation nécessaire ici : BRIEF (variable module-level,
  // reconstruite par rafraichir()) est DÉJÀ le résultat assemblé et
  // classé par les 7-9 moteurs NEXUS pour l'affichage écran — le rapport
  // PDF met simplement en page ces mêmes données (Article 11, une seule
  // vérité), jamais un recalcul parallèle.
  // ------------------------------------------------------------
  let dernierRapportPdf = null;

  function renderRapportBrief() {
    return `
      <div class="section">
        <div class="rapport-titre">Rapport PDF</div>
        <div class="rapport-sous">Une page A4 — la synthèse du jour à imprimer ou partager.</div>
        <div id="zoneActionsRapport">
          <button class="btn-rapport-pdf" id="btnGenererRapport" type="button">Générer mon rapport</button>
        </div>
      </div>`;
  }

  // Compose le texte "Ce qui compte aujourd'hui" (5 points max) à partir
  // des 5 axes de la Boussole réellement mesurés — jamais un axe non
  // mesuré affiché comme "0" (même règle que l'écran : Article 5).
  function pointsBoussoleRapport(brief) {
    return brief.axes.map(a => ({
      label: a.nom,
      valeur: a.valeur != null ? `${a.statut} (${a.valeur}/100)` : 'Pas encore assez de données',
    }));
  }

  async function construireRapportPdf() {
    const brief = BRIEF;
    const { COULEUR, ZONES_1P, MM: MM1P } = NexusPdfMoteur;
    const c = await NexusPdfMoteur.creerRapportUnePage({
      titre: `NEXUS Brief — ${brief.periodeLabel}`,
      sujet: 'Brief NEXUS — synthèse dirigeant',
    });

    const zEntete = c.allouerZone(ZONES_1P.entete);
    c.entete(zEntete, {
      app: 'NEXUS · BRIEF',
      ligne1: `Synthèse du ${brief.periodeLabel}`,
      ligne2: `${STATION_CONFIG.station_nom} · ${brief.decisions.length} décision${brief.decisions.length > 1 ? 's' : ''} prioritaire${brief.decisions.length > 1 ? 's' : ''}`,
    });

    const zKpi = c.allouerZone(ZONES_1P.kpi);
    const confianceCourte = (brief.impact.confianceGlobale || '').split(' ')[0] || '—';
    c.ligneKpi(zKpi, [
      { label: 'Indice Boussole', valeur: brief.scoreGlobal != null ? `${brief.scoreGlobal}/100` : '—' },
      { label: 'Gain potentiel', valeur: `${Math.round(brief.impact.gain).toLocaleString('fr-FR')} €`, couleurValeur: COULEUR.vert },
      { label: 'Risque identifié', valeur: `${Math.round(brief.impact.risque).toLocaleString('fr-FR')} €`, couleurValeur: brief.impact.risque > 0 ? COULEUR.rouge : COULEUR.texte },
      { label: 'Fiabilité', valeur: confianceCourte, detail: 'moteurs actifs' },
    ]);

    const zSynthese = c.allouerZone(ZONES_1P.synthese);
    c.paragraphe(zSynthese, { titre: 'SYNTHÈSE', texte: brief.synthese, taille: 9.3, interligne: 13 });

    // Zone "graphique" réutilisée pour la Boussole (5 axes, mini-barres) —
    // pas de courbe temporelle disponible côté Brief, mais le principe
    // "mini-graphique borné à la zone" du moteur partagé s'applique
    // exactement pareil.
    const zBoussole = c.allouerZone(ZONES_1P.graphique);
    c.barresHorizontales(zBoussole, {
      titre: 'BOUSSOLE NEXUS (5 AXES)',
      max: 5,
      items: brief.axes.map(a => ({ label: a.nom, valeur: a.valeur != null ? `${a.valeur}/100` : '—', part: a.valeur != null ? a.valeur / 100 : 0 })),
    });

    const zForcesWatch = c.allouerZone(ZONES_1P.ventes);
    const colsForcesWatch = c.diviserColonnes(zForcesWatch);
    c.listePoints(colsForcesWatch.gauche, {
      titre: 'FORCES DU MOMENT',
      max: 2,
      points: brief.forces.length ? brief.forces.map(f => ({ label: f.titre, valeur: f.detail })) : [{ label: 'Aucune force identifiée', valeur: 'sur cette période' }],
    });
    c.listePoints(colsForcesWatch.droite, {
      titre: 'À SURVEILLER',
      max: 3,
      // w.article est souvent null (les candidats Tempo/Advisor/Caisse/Rappel
      // n'ont pas d'article associé) — on reprend exactement les champs déjà
      // utilisés par l'affichage à l'écran (renderWatchlist : action en gras,
      // pourquoi en détail), toujours renseignés quel que soit le moteur
      // d'origine du candidat. Bug réel constaté au test iPhone du 10/08/2026 :
      // "null :" affiché dans le PDF pour les candidats sans article.
      points: brief.watchlist.length ? brief.watchlist.map(w => ({ label: w.action, valeur: w.pourquoi })) : [{ label: 'Rien à surveiller', valeur: 'en dehors des décisions ci-dessous' }],
    });

    // Zone "équipe" réallouée aux décisions (Brief n'a pas de bloc
    // équipe/stock distinct — l'axe Équipe vit déjà dans la Boussole
    // ci-dessus) : les décisions gagnent le budget des deux zones réunies
    // pour un détail plus lisible sur les 3 décisions prioritaires.
    const zDecisions = c.allouerZone(ZONES_1P.equipe + ZONES_1P.decisions);
    c.decisions(zDecisions, {
      titre: 'DÉCISIONS PRIORITAIRES',
      max: 3,
      texteAucune: '✅ Rien ne nécessite une décision du dirigeant aujourd’hui.',
      items: brief.decisions.map((p, i) => ({
        urgence: i === 0 ? 'critique' : (i === 1 ? 'important' : 'observation'),
        titre: p.decision,
        detail: p.pourquoi,
      })),
    });

    const zPied = c.allouerZone(ZONES_1P.piedDePage);
    c.piedDePage(
      zPied,
      'NEXUS Brief · synthèse générée automatiquement — vérité avant certitude, jamais une prédiction.',
      `Généré le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`,
    );

    const bytes = await NexusPdfMoteur.finaliser(c);
    const nomFichier = `NEXUS-Brief-${new Date().toISOString().slice(0, 10)}.pdf`;
    return {
      bytes, nomFichier,
      titre: `NEXUS Brief — ${brief.periodeLabel}`,
      texte: `Brief NEXUS — ${STATION_CONFIG.station_nom}`,
    };
  }

  async function lancerGenerationRapport() {
    const zoneActions = document.getElementById('zoneActionsRapport');
    zoneActions.innerHTML = `
      <button class="btn-rapport-pdf" disabled type="button">Génération en cours…</button>
      <div class="statut-rapport">Cela peut prendre quelques secondes.</div>
    `;
    try {
      dernierRapportPdf = await construireRapportPdf();
      afficherActionsRapportPret();
    } catch (e) {
      console.error('NEXUS Brief — génération du rapport PDF :', e);
      zoneActions.innerHTML = `
        <button class="btn-rapport-pdf" id="btnGenererRapport" type="button">Générer mon rapport</button>
        <div class="statut-rapport statut-erreur">Erreur lors de la génération du rapport — réessayez.<br><span class="statut-detail">${(e && e.message) ? e.message : 'Erreur inconnue — voir la console du navigateur.'}</span></div>
      `;
      document.getElementById('btnGenererRapport').addEventListener('click', lancerGenerationRapport);
    }
  }

  function afficherActionsRapportPret() {
    const zoneActions = document.getElementById('zoneActionsRapport');
    const partageOk = NexusPdfMoteur.webShareDisponible();
    zoneActions.innerHTML = `
      <div class="statut-rapport statut-pret">Rapport prêt.</div>
      <div class="rapport-actions">
        ${partageOk ? `<button class="btn-rapport-pdf" id="btnPartagerRapport" type="button">Partager le PDF</button>` : ''}
        <button class="btn-rapport-pdf${partageOk ? ' secondaire' : ''}" id="btnOuvrirRapport" type="button">${partageOk ? 'Ouvrir le PDF' : 'Ouvrir / enregistrer le PDF'}</button>
      </div>
      <button class="btn-lien" id="btnRegenererRapport" type="button">Régénérer</button>
    `;
    if (partageOk) {
      document.getElementById('btnPartagerRapport').addEventListener('click', async () => {
        const r = await NexusPdfMoteur.partagerPdf(dernierRapportPdf.bytes, dernierRapportPdf.nomFichier, { titre: dernierRapportPdf.titre, texte: dernierRapportPdf.texte });
        const s = zoneActions.querySelector('.statut-rapport');
        if (r === 'echec' || r === 'indisponible') { if (s) s.textContent = 'Partage impossible sur cet appareil — utilisez « Ouvrir le PDF ».'; }
        else if (r === 'partage') { if (s) s.textContent = 'Rapport partagé.'; }
      });
    }
    document.getElementById('btnOuvrirRapport').addEventListener('click', async () => {
      await NexusPdfMoteur.telechargerPdf(dernierRapportPdf.bytes, dernierRapportPdf.nomFichier);
      const s = zoneActions.querySelector('.statut-rapport');
      if (s) s.textContent = 'Rapport ouvert.';
    });
    document.getElementById('btnRegenererRapport').addEventListener('click', lancerGenerationRapport);
  }

  function renderBrief() {
    const root = document.getElementById('briefRoot');
    dernierRapportPdf = null; // un Brief déjà rafraîchi invalide le rapport déjà généré
    root.innerHTML = `<div class="desktop-grid">
      ${renderHeroEtSynthese(BRIEF)}
      ${renderBoussole(BRIEF)}
      ${renderForces(BRIEF)}
      ${renderDecisions(BRIEF)}
      ${renderWatchlist(BRIEF)}
      ${renderImpact(BRIEF)}
      ${renderRapportBrief()}
    </div>`;
    document.getElementById('btnGenererRapport').addEventListener('click', lancerGenerationRapport);

    root.querySelectorAll('.decision-valider').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation(); btn.disabled = true;
        const plan = BRIEF.decisions.find(p => p.candidate_id === btn.dataset.id);
        if (!plan) return;
        const ok = await enregistrerJournalDecision(plan);
        if (!ok) { btn.disabled = false; alert("Erreur d'enregistrement — réessayez."); return; }
        await rafraichir();
      });
    });
    root.querySelectorAll('.decision-fait').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation(); btn.disabled = true;
        const ok = await marquerRappelFait(btn.dataset.rappelId);
        if (!ok) { btn.disabled = false; alert("Erreur — réessayez."); return; }
        await rafraichir();
      });
    });
    root.querySelectorAll('.caisse-justifie-checkbox').forEach(cb => {
      cb.addEventListener('click', e => e.stopPropagation());
      cb.addEventListener('change', async () => {
        if (!cb.checked) return;
        cb.disabled = true;
        const ok = await marquerCaisseJustifiee(cb.dataset.auditId);
        if (!ok) { cb.disabled = false; cb.checked = false; alert("Erreur — réessayez."); return; }
        await rafraichir();
      });
    });
    const impactBreakdown = document.getElementById('impactBreakdown');
    ['impactGainCard', 'impactRisqueCard'].forEach(id => {
      const card = document.getElementById(id);
      if (card && impactBreakdown) card.addEventListener('click', () => {
        impactBreakdown.style.display = impactBreakdown.style.display === 'none' ? 'block' : 'none';
      });
    });
  }

  async function rafraichir() {
    BRIEF = await construireBrief();
    renderBrief();
  }

  // Écrit la décision validée dans journal_decisions — même table, mêmes
  // colonnes que NEXUS-Cockpit-v2.html (enregistrerJournalDecision), pour
  // qu'une décision acceptée depuis Brief NEXUS soit indiscernable d'une
  // décision acceptée depuis le Cockpit, y compris dans Journal NEXUS.
  async function enregistrerJournalDecision(plan) {
    const row = {
      site: SITE_ACTUEL, candidate_id: plan.candidate_id, rule_id: plan.ruleId, etat: plan.etat,
      recommandation: plan.decision, impact_eur: plan.impact_eur, article: plan.article, categorie: plan.categorie || null,
      date: new Date().toISOString().slice(0, 10), heure: new Date().toTimeString().slice(0, 5),
      employee_id: employeeCourantId,
      ca_reference: plan.ca_reference != null ? plan.ca_reference : null,
      periode_reference_debut: plan.periode_reference_debut || null, periode_reference_fin: plan.periode_reference_fin || null,
    };
    const { error } = await nexusClient.from('journal_decisions').insert(row);
    if (error) { console.error('Écriture Journal (Brief):', error); return false; }
    VALIDEES_SITE.add(plan.candidate_id);
    JOURNAL_DECISIONS.unshift({ ...row, created_at: new Date().toISOString() });
    return true;
  }
  async function marquerRappelFait(rappelId) {
    const { error } = await nexusClient.from('rappels').update({ fait: true, fait_le: new Date().toISOString() }).eq('id', rappelId);
    if (error) { console.error('Marquer rappel fait (Brief):', error); return false; }
    return true;
  }
  async function marquerCaisseJustifiee(auditId) {
    const trace = `Justifié depuis Brief NEXUS par ${STATION_CONFIG.manager_prenom || 'un dirigeant'} le ${new Date().toLocaleDateString('fr-FR')}.`;
    const { error } = await nexusClient.from('audits_caisse').update({ commentaire: trace }).eq('id', auditId);
    if (error) { console.error('Justification écart caisse (Brief):', error); return false; }
    return true;
  }

  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div class="locked">Brief NEXUS est réservé aux managers et gérants.</div>';
      return;
    }
    employeeCourantId = employee.id;
    SITE_ACTUEL = employee.site_id || 'vito-sainte-marie';
    if (!(await NexusForfait.nexusRequireBriefNexus(SITE_ACTUEL))) return;
    STATION_CONFIG.manager_prenom = employee.nom;
    STATION_CONFIG.manager_role = employee.role;
    const { data: siteActuel } = await nexusClient.from('sites').select('nom_entreprise, logo_url').eq('site_id', SITE_ACTUEL).maybeSingle();
    if (siteActuel && siteActuel.nom_entreprise) STATION_CONFIG.station_nom = siteActuel.nom_entreprise;
    if (siteActuel && siteActuel.logo_url) STATION_CONFIG.logo_url = siteActuel.logo_url;
    const header = document.getElementById('nexus-header');
    header.innerHTML = `
      <div class="logo-frame"><img class="logo" src="${STATION_CONFIG.logo_url}" alt="${STATION_CONFIG.station_nom}" onerror="this.style.display='none'"></div>
      <div class="id">
        <div class="greet">Brief NEXUS <span class="role-badge">${STATION_CONFIG.manager_role}</span></div>
        <div class="station">${STATION_CONFIG.station_nom}</div>
      </div>
      <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>`;
    await chargerJournalDecisions();
    await rafraichir();
  });
</script>
</body>
</html>
