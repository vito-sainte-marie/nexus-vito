<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>Brief NEXUS — Vue dirigeant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14;
    --panel:#141B22;
    --panel-raised:#1A222C;
    --hairline:#242E38;
    --text:#EDF1F5;
    --text-mid:#8A96A5;
    --text-dim:#57626F;
    --green:#34D399;
    --green-dim:#153629;
    --amber:#F5A623;
    --amber-dim:#3A2E14;
    --red:#F0575A;
    --red-dim:#3A1D1F;
    --cyan:#4FC3D9;
    --gold:#D4AF37; --gold-dim:#332B12;
    --mono:'IBM Plex Mono',monospace;
    --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{
    display:flex; justify-content:center;
    min-height:100vh;
    background-image: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.07), transparent 45%);
  }
  .phone{
    width:100%; max-width:430px; min-height:100vh;
    display:flex; flex-direction:column;
    border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);
   padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  /* HEADER */
  .header{padding:20px 20px 14px; display:flex; align-items:center; gap:12px;}
  .menu-btn{
    margin-left:auto; flex-shrink:0; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .header .logo-frame{
    width:64px; height:64px; border-radius:20px; flex-shrink:0;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--hairline);
  }
  .header .logo{height:44px; width:44px; object-fit:cover; object-position:center; border-radius:12px;}
  .header .id{display:flex; flex-direction:column;}
  .greet{font-size:20px; font-weight:600;}
  .role-badge{
    font-family:var(--mono); font-size:9.5px; padding:2px 8px; border-radius:10px; letter-spacing:0.04em;
    text-transform:uppercase; border:1px solid var(--hairline); color:var(--text-dim); margin-left:8px; vertical-align:middle;
  }
  .station{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-top:3px; letter-spacing:0.02em;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .locked{padding:60px 24px; text-align:center; font-size:14px; color:var(--text-mid); font-family:var(--sans);}

  /* HERO — état global du jour, ton dirigeant */
  .brief-hero{
    margin:14px 20px 6px; padding:30px 22px 26px; border-radius:22px; text-align:center;
    background:radial-gradient(120% 140% at 50% -10%, rgba(212,175,55,0.16), rgba(79,195,217,0.05) 55%, transparent 80%), var(--panel);
    border:1px solid rgba(212,175,55,0.22);
    box-shadow:0 12px 36px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .brief-date{font-family:var(--mono); font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-dim); margin-bottom:16px;}
  .brief-indice-value{font-family:var(--mono); font-size:74px; font-weight:700; line-height:1; text-shadow:0 0 30px currentColor;}
  .brief-indice-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-top:8px;}
  .brief-etat{margin-top:18px; display:inline-flex; align-items:center; gap:9px; font-size:13px; color:var(--text-mid); line-height:1.5; padding:10px 18px; border-radius:22px; background:var(--panel-raised); max-width:100%;}
  .brief-etat-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 10px currentColor;}
  .brief-synthese{margin-top:16px; font-size:14.5px; line-height:1.6; color:var(--text); max-width:320px; margin-left:auto; margin-right:auto;}
  .indice-explain-toggle{margin-top:14px; font-family:var(--mono); font-size:11px; color:var(--cyan); cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .indice-explain-toggle .chev{display:inline-block; transition:0.2s;}
  .indice-explain-wrap.open .indice-explain-toggle .chev{transform:rotate(90deg);}
  .indice-explain{display:none; margin-top:12px; text-align:left; background:var(--panel-raised); border-radius:12px; padding:14px 16px;}
  .indice-explain-wrap.open .indice-explain{display:block;}
  .indice-delta-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .indice-delta-row:last-child{border-bottom:none;}
  .indice-delta-absent{color:var(--text-dim); font-family:var(--mono); font-size:10.5px;}
  .legend-line{padding:0 20px 14px; font-size:10.5px; color:var(--text-dim); line-height:1.6; text-align:center;}

  .plans-loading{padding:36px 20px; text-align:center;}
  .plans-loading-logo{width:38px; height:38px; margin-bottom:12px; animation:nexusSpin 1.3s linear infinite; filter:drop-shadow(0 0 10px rgba(79,195,217,0.4));}
  @keyframes nexusSpin{ to{ transform:rotate(360deg); } }
  .plans-loading-text{font-size:12.5px; color:var(--text-dim); transition:opacity 0.25s ease;}
  .plans-loading-text.fade{opacity:0;}
  .loading-dots span{animation:loadingDot 1.4s infinite; opacity:0;}
  .loading-dots span:nth-child(2){animation-delay:0.2s;}
  .loading-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes loadingDot{ 0%,80%,100%{opacity:0;} 40%{opacity:1;} }
  /* Checklist de chargement "pendant que NEXUS réfléchit" (13/08/2026) —
     même vocabulaire visuel que le connecteur de données de
     NEXUS-Verify-v1.html (.dc-check-item/.dc-check-mark), repris ici sous
     un autre nom de classe car le contenu diffère de nature : chez Verify,
     chaque ligne reflète une donnée réellement détectée dans un import ;
     ici, chaque ligne est un jalon d'un minutage d'attente (pas un flux
     d'état réel par secteur — la synthèse réelle n'est prête qu'au tout
     dernier appel de renderBrief(), qui remplace cet écran entièrement).
     Purement une pacing UI, jamais une prétention de progression mesurée
     (Article 5) — les noms de moteurs eux-mêmes restent au niveau secteur
     ("Commerce", "Marge"...), jamais les 9 moteurs techniques du registre
     (NexusMoteursRegistre) : ce niveau de détail reste réservé à la
     mention de fiabilité affichée une fois la synthèse réellement prête
     (voir impact.confianceGlobale / #briefFooter). */
  .brief-loading-checklist{max-width:230px; margin:16px auto 0; text-align:left;}
  .brief-loading-checklist .dc-check-item{
    display:flex; align-items:center; gap:8px; font-family:var(--sans); font-size:12.5px; color:var(--text);
    padding:4px 0; opacity:0; transform:translateY(4px);
    animation:dcCheckIn 0.35s ease forwards;
  }
  .brief-loading-checklist .dc-check-item .dc-check-mark{color:var(--green); font-weight:700; flex-shrink:0;}
  @keyframes dcCheckIn{ to{ opacity:1; transform:translateY(0); } }

  /* SECTION generic */
  .section{padding:20px 20px;}
  .section-title{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .section-title .badge{font-family:var(--mono); font-size:9.5px; padding:2px 7px; border-radius:10px; letter-spacing:0.02em;}
  .badge-real{color:var(--green); background:var(--green-dim);}
  .badge-derived{color:var(--cyan); background:rgba(79,195,217,0.12);}
  .badge-estime{color:var(--gold); background:rgba(212,175,55,0.14);}
  .badge-absent{color:var(--text-dim); background:var(--panel-raised);}
  .section-note{font-size:11px; color:var(--text-dim); line-height:1.5; margin-top:10px;}

  /* BOUSSOLE NEXUS — radar 5 axes */
  .boussole-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:18px;
    position:relative; overflow:hidden;
  }
  .boussole-card::before{content:''; position:absolute; top:-40%; left:-20%; width:140%; height:140%; background:radial-gradient(circle, rgba(212,175,55,0.08), transparent 60%); pointer-events:none;}
  .boussole-svg-wrap{display:flex; justify-content:center; margin-bottom:6px;}
  .boussole-svg-wrap svg{width:100%; max-width:280px; height:auto;}
  .axe-block{border-bottom:1px solid var(--hairline);}
  .axe-block:last-child{border-bottom:none;}
  .axe-row{
    display:flex; align-items:center; gap:12px; padding:11px 4px;
    color:inherit; cursor:pointer;
  }
  .axe-row:active{background:var(--panel-raised);}
  .axe-dot{width:11px; height:11px; border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor;}
  .axe-nom{flex:1; font-size:13.5px; font-weight:600;}
  .axe-statut{font-family:var(--mono); font-size:10.5px; text-align:right;}
  .axe-chev{color:var(--text-dim); font-size:14px; flex-shrink:0; transition:0.2s;}
  .axe-block.open .axe-chev{transform:rotate(90deg);}
  .axe-detail{display:none; padding:0 4px 16px;}
  .axe-block.open .axe-detail{display:block;}

  /* FORCES */
  .force-card{
    background:linear-gradient(145deg, var(--gold-dim), rgba(212,175,55,0.04)); border:1px solid rgba(212,175,55,0.35);
    border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:4px; margin-bottom:10px;
  }
  .force-card:last-child{margin-bottom:0;}
  .force-icon{font-size:20px;}
  .force-titre{font-size:13.5px; font-weight:700; color:var(--gold); margin-top:2px;}
  .force-detail{font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .empty-serein{margin:0; padding:18px; text-align:center; font-size:12.5px; color:var(--text-dim); background:var(--panel-raised); border-radius:12px; line-height:1.5;}

  /* DECISIONS */
  .decision-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden; border-left:3px solid var(--hairline);}
  .decision-card:last-child{margin-bottom:0;}
  .decision-card.priorite{
    border-left-width:4px; border-left-color:var(--gold); box-shadow:0 0 0 1px rgba(212,175,55,0.15) inset, 0 8px 24px rgba(212,175,55,0.08);
    background:linear-gradient(145deg, rgba(212,175,55,0.07), var(--panel));
  }
  .decision-card.priorite .decision-head{padding:18px 18px 16px;}
  .decision-card.priorite .decision-teaser{font-size:15.5px; line-height:1.45;}
  .decision-card.priorite .decision-valider{background:var(--gold); color:#241d0c; font-size:13px; padding:13px;}
  .decision-card.secondaire{border-left-width:2px; opacity:0.94;}
  .decision-card.secondaire .decision-head{padding:11px 14px;}
  .decision-card.secondaire .decision-teaser{font-size:12.5px; font-weight:500;}
  .decision-card.secondaire .decision-rank{font-size:9px; padding:2px 7px;}
  .decision-card.etat-agir{border-left-color:#F0575A;}
  .decision-card.etat-opportunite{border-left-color:#34D399;}
  .decision-card.etat-surveiller{border-left-color:#F5A623;}
  .decision-card.etat-recommandation{border-left-color:#4FC3D9;}
  .decision-head{padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px;}
  .decision-rank{font-family:var(--mono); font-size:9.5px; font-weight:700; color:var(--gold); background:rgba(212,175,55,0.12); border-radius:20px; padding:3px 8px; white-space:nowrap;}
  .decision-rank.secondaire{color:var(--text-dim); background:var(--panel-raised);}
  .decision-teaser{flex:1; font-size:13.5px; font-weight:600; line-height:1.4;}
  .decision-chevron{color:var(--text-dim); font-size:14px; transition:0.15s;}
  .decision-card.open .decision-chevron{transform:rotate(90deg);}
  .decision-body{display:none; padding:0 16px 16px;}
  .decision-card.open .decision-body{display:block;}
  .decision-field{margin-top:12px;}
  .decision-field-label{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:3px;}
  .decision-field-text{font-size:12.5px; line-height:1.65; color:var(--text-mid);}
  .decision-field-text b{color:var(--text); font-weight:600;}
  .decision-chips{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .decision-chip{font-family:var(--mono); font-size:10px; padding:4px 10px; border-radius:14px; background:var(--panel-raised); color:var(--text-mid); border:1px solid var(--hairline);}
  .decision-chip.confiance-eleve{color:var(--green); border-color:rgba(52,211,153,0.3);}
  .decision-chip.confiance-moyen{color:var(--amber); border-color:rgba(245,166,35,0.3);}
  .decision-valider, .decision-fait{width:100%; margin-top:14px; padding:11px; border:none; border-radius:8px; font-size:12.5px; font-weight:600; background:var(--green); color:#04141a; cursor:pointer;}
  .decision-valider:disabled, .decision-fait:disabled{opacity:0.85; cursor:default;}
  .decision-lien{display:block; text-align:center; margin-top:14px; padding:11px; border:1px solid var(--hairline); border-radius:8px; color:var(--cyan); font-family:var(--mono); font-size:11.5px; text-decoration:none;}
  /* Confirmation optimiste (10/08/2026, correction du bug signalé par
     Frédéric : "le bouton Accepter cette décision ne fonctionne pas") —
     l'écriture réseau réussissait déjà (vérifié directement en base), mais
     rien ne le montrait avant la fin du rechargement complet du Brief
     (plusieurs appels réseau) : le clic paraissait sans effet, et un
     rechargement manuel impatient pendant ce délai pouvait donner
     l'impression que la décision "revenait". La carte se grise et se
     confirme visuellement dès le clic, avant même la fin de l'écriture. */
  .decision-card.valide-optimiste{opacity:0.55; pointer-events:none;}
  .caisse-justifie-row{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:11.5px; color:var(--text-dim); cursor:pointer;}

  /* WATCHLIST */
  .watch-item{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--hairline); text-decoration:none; color:inherit;}
  .watch-item:last-child{border-bottom:none;}
  .watch-dot{width:8px; height:8px; border-radius:50%; background:var(--amber); flex-shrink:0; margin-top:5px; box-shadow:0 0 8px rgba(245,166,35,0.6);}
  .watch-text{flex:1; font-size:12.5px; line-height:1.55; color:var(--text-mid);}
  .watch-text b{color:var(--text); font-weight:600;}
  .watch-chev{color:var(--text-dim); font-size:13px; margin-top:3px;}
  /* RISQUES — moteur de qualification du risque (pilote Marge+Caisse,
     12/08/2026). Reprend la structure de .watch-item, mais la couleur du
     point suit le NIVEAU du signal (jamais un simple voyant rouge unique —
     signal_faible reste ambre, exposition/risque_avere passent au rouge),
     et chaque ligne affiche la phrase de contexte complète du moteur
     (NexusRisques.genererPhraseContexte), pas juste un titre tronqué. */
  .risque-item{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--hairline);}
  .risque-item:last-child{border-bottom:none;}
  .risque-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:5px;}
  .risque-dot.niveau-signal_faible{background:var(--amber); box-shadow:0 0 8px rgba(245,166,35,0.6);}
  .risque-dot.niveau-exposition{background:var(--amber); box-shadow:0 0 8px rgba(245,166,35,0.6);}
  .risque-dot.niveau-risque_avere{background:var(--red); box-shadow:0 0 8px rgba(240,87,90,0.6);}
  .risque-text{flex:1; font-size:12.5px; line-height:1.55; color:var(--text-mid);}
  .risque-niveau{color:var(--text); font-weight:600; display:block; margin-bottom:2px;}
  /* Urgence (12/08/2026, cadrage §9) : 2e dimension affichée à côté de la
     gravité, jamais en remplacement — badge discret, pas un second point
     coloré qui dupliquerait visuellement risque-dot. */
  .risque-urgence{display:inline-block; font-size:9.5px; font-family:var(--mono); font-weight:600; letter-spacing:0.02em; padding:1px 7px; border-radius:9px; margin-bottom:4px;}
  .risque-urgence.urgence-immediate{color:var(--red); background:rgba(240,87,90,0.12);}
  .risque-urgence.urgence-moyenne{color:var(--amber); background:rgba(245,166,35,0.12);}
  .risque-urgence.urgence-faible{color:var(--text-dim); background:rgba(255,255,255,0.06);}
  .risque-action{color:var(--cyan); font-size:11.5px; margin-top:4px; display:block;}
  .risque-meta{color:var(--text-dim); font-family:var(--mono); font-size:10px; margin-top:4px; display:block;}

  /* IMPACT */
  .impact-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .impact-card{border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:4px;}
  .impact-card.gain{background:var(--green-dim); border:1px solid rgba(52,211,153,0.25);}
  .impact-card.risque{background:var(--red-dim); border:1px solid rgba(240,87,90,0.3);}
  .impact-value{font-family:var(--mono); font-size:22px; font-weight:700;}
  .impact-card.gain .impact-value{color:var(--green);}
  .impact-card.risque .impact-value{color:var(--red);}
  .impact-label{font-size:11px; color:var(--text-mid); line-height:1.4;}
  .impact-meta-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .impact-meta-row:last-child{border-bottom:none;}
  .impact-meta-label{color:var(--text-dim);}
  .impact-meta-val{font-family:var(--mono); font-weight:600;}

  footer{padding:24px 20px 32px; text-align:center; font-family:var(--mono); font-size:10px; color:var(--text-dim); letter-spacing:0.03em;}

  /* Rapport PDF (10/08/2026) — mêmes classes que NEXUS-FDJ-Analyse-v1.html
     (moteur PDF partagé, même identité visuelle sur tous les rapports
     NEXUS, Article 11). */
  .rapport-titre{font-size:16px; font-weight:700;}
  .rapport-sous{font-size:11.5px; color:var(--text-mid); margin-top:4px;}
  .btn-rapport-pdf{display:block; width:100%; margin:14px 0 8px; padding:13px; border-radius:10px; border:none; background:var(--cyan); color:#0B0F14; font-family:var(--sans); font-size:13.5px; font-weight:700; cursor:pointer;}
  .btn-rapport-pdf:disabled{opacity:0.55; cursor:default;}
  .btn-rapport-pdf.secondaire{background:var(--panel-raised); color:var(--text); border:1px solid var(--hairline);}
  .rapport-actions{display:flex; gap:8px;}
  .rapport-actions .btn-rapport-pdf{margin:14px 0 0;}
  .btn-lien{display:block; width:100%; margin:10px 0 8px; padding:6px; border:none; background:none; color:var(--text-dim); font-family:var(--sans); font-size:11.5px; text-decoration:underline; cursor:pointer;}
  .statut-rapport{font-size:11.5px; color:var(--text-mid); text-align:center; margin-top:8px; min-height:14px; line-height:1.5;}
  .statut-rapport.statut-pret{color:var(--green);}
  .statut-rapport.statut-erreur{color:var(--red);}
  .statut-detail{font-family:var(--mono); font-size:10px; color:var(--text-dim);}
</style>
</head>
<body>
<div class="phone">
  <div class="header" id="nexus-header"></div>
  <div class="divider"></div>
  <div id="briefRoot">
    <div class="plans-loading">
      <img class="plans-loading-logo" src="nexus-avatar.png" alt="">
      <div class="plans-loading-text" id="briefLoadingMsg">NEXUS interroge votre activité<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
      <div class="brief-loading-checklist" id="briefLoadingChecklist"></div>
    </div>
  </div>
  <footer id="briefFooter">NEXUS Brief · synthèse dirigeant</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-build.js"></script>

<script>
  // ============================================================
  // NEXUS Brief — synthèse à l'attention du dirigeant (02/08/2026, demande
  // de Frédéric) : "cette page fera appel à toute ta puissance... tu devras
  // puiser dans tous les moteurs de NEXUS, toutes ses ressources sans
  // exception." Cette page n'introduit AUCUN nouveau calcul métier — elle
  // appelle les moteurs partagés déjà en production (NexusPeriodes,
  // NexusIndice, NexusMarge, NexusTempo, NexusStock, NexusConseiller) et les
  // mêmes requêtes déjà validées dans NEXUS-App-v1.html / NEXUS-Cockpit-v2.html,
  // pour ne jamais diverger de ce que ces écrans affichent déjà. Sa valeur
  // ajoutée est la SYNTHÈSE : un tri de priorité partagé entre les 7 moteurs
  // (NexusConseiller.fusionnerEtSelectionner), une Boussole NEXUS à 5 axes,
  // et une structure de décision en 8 champs — jamais un chiffre inventé
  // (Article 5 de la Constitution NEXUS) : toute case affiche honnêtement
  // "Donnée insuffisante" plutôt qu'une fausse valeur par défaut.
  //
  // Feuille de route (cadrage fourni par Frédéric, 02/08/2026) : ce fichier
  // livre la Phase 1 (brief statique agrégé, indicateurs fiables) et une
  // bonne partie des Phases 2-3 (moteur de priorité déjà partagé via
  // nexus-conseiller.js, structure Conseiller à 8 champs). Les Phases 4-5
  // (preuves entièrement traçables avec historique de consultation, mémoire
  // d'impact des décisions dans le temps) restent un chantier à part —
  // notées en fin de fichier plutôt que bâclées sous pression de temps.
  // ============================================================

  const ETAT_CLASS = {
    "🔥 À AGIR": "etat-agir", "📈 OPPORTUNITÉ": "etat-opportunite",
    "🟡 À SURVEILLER": "etat-surveiller", "💡 RECOMMANDATION": "etat-recommandation",
    "🔴 CRITIQUE": "etat-agir", "🟡 À VÉRIFIER": "etat-surveiller",
    "📦 À COMPTER": "etat-surveiller", "⚠️ RAPPEL EN RETARD": "etat-agir",
    "📌 RAPPEL": "etat-recommandation", "🗓️ TEMPO": "etat-recommandation",
    "📋 SIGNAL": "etat-recommandation",
  };
  // MOTEUR_LABEL/MOTEUR_SOURCE (13/08/2026) : déplacés dans
  // nexus-moteurs-registre.js — registre central, une seule vérité sur "à
  // quoi correspond ce moteur" (cadrage "moteurs dynamiques", Frédéric).
  // `MOTEUR_LABEL[x]` devient `NexusMoteursRegistre.nomPublic(x)`.
  const MOTEUR_SOURCE = NexusMoteursRegistre.MOTEUR_SOURCE;
  const COULEUR_STATUT_DOMAINE = {
    'En progression': 'var(--green)', 'Sous contrôle': 'var(--green)', 'Stable': 'var(--text-mid)',
    // 'À confirmer'/'À relancer' (22/08/2026, refonte statut métier) :
    // remplacent l'ancien statut unique 'À surveiller', qui reste ci-dessous
    // pour un éventuel appelant non migré (non-régression). 'En repli' reste
    // aussi pour la même raison — Commerce ne le produit plus (voir
    // nexus-secteurs-moteur.js, construireSecteurCommerce).
    'À confirmer': 'var(--amber)', 'À relancer': 'var(--amber)',
    'À surveiller': 'var(--amber)', 'En repli': 'var(--red)', 'À corriger': 'var(--red)',
    'Données insuffisantes': 'var(--text-dim)',
    'Référence certifiée': 'var(--green)',
    // 'À actualiser' (22/08/2026, fallback temporel carburant, v2.214/
    // v2.215) : même couleur neutre que "Données insuffisantes" — un état
    // périmé n'est ni une alerte ni un signal positif, c'est une absence de
    // preuve fraîche (même discipline que qualiteChaineCarburant côté
    // Pilotage, jamais confondu avec un vrai problème opérationnel).
    'À actualiser': 'var(--text-dim)',
  };
  // Seuils Boussole — désormais définis une seule fois dans
  // nexus-boussole-moteur.js (Article 11) et simplement relus ici.
  const { SEUIL_ECART_OPERATIONS_EUR, SEUIL_MIN_POINTAGES_EQUIPE } = NexusBoussoleMoteur;

  let SITE_ACTUEL = null; // jamais 'vito-sainte-marie' par defaut (de-Vito-isation, 11/08/2026) - toujours ecrase par employee.site_id apres nexusRequireAuth()
  let employeeCourantId = null;
  let VALIDEES_SITE = new Set();
  let JOURNAL_DECISIONS = [];
  // Secteurs configurables (11/08/2026, audit stratégique Brief/Rapport de
  // Direction) : type_commerce/secteurs viennent de la table sites
  // (migration ajouter_secteurs_configurables_sites) — repli sur le preset
  // station-service tant que la ligne n'est pas encore chargée, jamais un
  // écran vide au premier rendu.
  // Placeholder AVANT chargement de la ligne `sites` — jamais 'station-service'
  // par défaut (durci le 11/08/2026, Article 11/Article 5) : si la requête
  // `sites` échoue ou n'est jamais atteinte, ce placeholder doit rester
  // "non configuré" plutôt que de laisser croire que le site est une
  // station-service par défaut. Voir NexusSecteursCatalogue.secteursActifsSite().
  let SITE_SECTEURS_CONFIG = { type_commerce: null, secteurs: null };
  let STATION_CONFIG = { manager_prenom: '', manager_role: '', station_nom: 'Ma station', logo_url: '' };
  let BRIEF = null;
  // Poignée de l'écran de chargement dynamique (22/08/2026) — { tickSecteur,
  // demarrerSequenceFinale } une fois le site résolu, null avant (ou si
  // l'écran a déjà été remplacé). construireBrief() appelle tickSecteur()
  // au fil des résolutions réelles, jamais avant.
  let ANIMATION_CHARGEMENT = null;

  // ------------------------------------------------------------
  // Chargeurs de données — extraits le 11/08/2026 vers nexus-brief-donnees.js
  // (refactoring des pages monolithiques, audit "philosophie/architecture",
  // Brief NEXUS choisi comme page pilote ; voir Data Dictionary v2.40).
  // Ce fichier ne garde qu'un alias local pour chargerJournalDecisions()
  // (qui alimente l'état de page JOURNAL_DECISIONS/VALIDEES_SITE, donc reste
  // ici) et construireCandidatTempo (alias direct vers le moteur partagé,
  // inchangé). Tous les autres chargeurs sont appelés directement via
  // NexusBriefDonnees.xxx(nexusClient, SITE_ACTUEL, ...) dans construireBrief()
  // ci-dessous, sans indirection locale supplémentaire.
  // ------------------------------------------------------------
  async function chargerJournalDecisions() {
    const { journal, validees } = await NexusBriefDonnees.chargerJournalDecisions(nexusClient, SITE_ACTUEL);
    JOURNAL_DECISIONS = journal;
    VALIDEES_SITE = validees;
  }

  // Candidat Tempo enrichi pour le Conseiller — centralisé le 11/08/2026
  // dans NexusTempo.construireCandidatTempo() (Article 11). Cette copie
  // locale était encore décrite comme "reprise à l'identique" de
  // NEXUS-App-v1.html alors qu'elle avait déjà divergé : elle ne
  // construisait jamais le bloc `opportunites` (jour en progression / jour
  // à renforcer), contrairement à App-v1 — corrigé en passant à la version
  // partagée, désormais strictement identique sur les deux écrans.
  const construireCandidatTempo = NexusTempo.construireCandidatTempo;

  // ------------------------------------------------------------
  // Statuts par secteur + scores 0-100 — définis une seule fois dans
  // nexus-boussole-moteur.js (Article 11, "une seule vérité"), consommés
  // depuis le 11/08/2026 par NexusSecteursMoteur (voir construireSecteurs)
  // plutôt que directement ici : ce fichier ne garde que ce qui sert
  // encore au rendu (couleurAxe pour le point coloré du radar,
  // genererBoussoleSVG pour le radar lui-même).
  // ------------------------------------------------------------
  const { couleurAxe, genererBoussoleSVG } = NexusBoussoleMoteur;

  // ------------------------------------------------------------
  // Assemblage complet du Brief — une seule fonction qui appelle tous les
  // moteurs, puis construit l'objet ExecutiveBrief rendu par renderBrief().
  // ------------------------------------------------------------
  async function construireBrief() {
    // Garde ajoutée le 11/08/2026 (audit "philosophie/architecture", section
    // 6.4, demande explicite de Frédéric "durcissement du repli métier
    // silencieux") : avant tout chargement de données, on vérifie que ce
    // site a une configuration métier réellement outillée. Si non, Brief
    // NEXUS ne doit ni deviner un métier par défaut, ni afficher une
    // synthèse vide qui ressemblerait à "tout va bien" — il s'arrête ici et
    // remonte un état explicite que renderBrief() affiche en plein écran,
    // avant même de lancer les ~15 requêtes réseau habituelles (inutiles
    // tant que la configuration n'est pas résolue).
    const secteursCheck = NexusSecteursCatalogue.secteursActifsSite(SITE_SECTEURS_CONFIG);
    if (secteursCheck.statut !== 'ok') {
      return { configurationIncomplete: { statut: secteursCheck.statut, typeCommerce: secteursCheck.typeCommerce } };
    }

    const rowsBrut = await NexusBriefDonnees.chargerProducts(nexusClient, SITE_ACTUEL);
    // Coche "Ventes analysées" (secteur commerce) dès que sa seule et unique
    // source (rowsBrut) est arrivée — pas de Promise.all à attendre ici, ce
    // chargeur est résolu avant le reste (22/08/2026, écran de chargement
    // dynamique). `tickSecteur` est lui-même un no-op si 'commerce' n'est
    // pas actif pour ce site (Article 5 — jamais une coche métier qui n'a
    // pas de sens ici).
    if (ANIMATION_CHARGEMENT) ANIMATION_CHARGEMENT.tickSecteur('commerce');
    const { periodeAffichage, paire, rowsPaireActuelle, rowsPairePrecedente } = NexusPeriodes.analyserPeriodes(rowsBrut);
    const facteurs = NexusIndice.calculerFacteurs(rowsBrut);
    const periodeLabel = periodeAffichage
      ? `Période analysée : ${new Date(periodeAffichage.debut + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} – ${new Date(periodeAffichage.fin + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}`
      : new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const candidatsProduitsBrut = NexusConseiller.calculerCandidatsProduits(rowsBrut);
    const produitsStrategiques = paire ? NexusConseiller.analyserProduitsStrategiques(rowsPaireActuelle, rowsPairePrecedente) : null;

    // Coches "réellement interrogées" (22/08/2026, écran de chargement
    // dynamique) : Opérations et FDJ agrègent chacun PLUSIEURS chargeurs
    // (Article 11 — même agrégation que le contrat secteur, jamais un
    // deuxième découpage) ; la coche n'apparaît qu'une fois TOUTES les
    // parties de ce secteur résolues, jamais au premier chargeur arrivé —
    // le libellé affiché ("Contrôles consolidés") promet une consolidation
    // complète, la coche doit rester fidèle à ce qu'elle affirme (Article 5).
    function surResolutionSecteur(id, nbParties) {
      let restantes = nbParties;
      return (valeur) => {
        restantes -= 1;
        if (restantes <= 0 && ANIMATION_CHARGEMENT) ANIMATION_CHARGEMENT.tickSecteur(id);
        return valeur;
      };
    }
    const onMargeResolue = surResolutionSecteur('marge', 1);
    // Opérations : Tempo + Signal(advisor) + Caisse + Stock + Rappels +
    // alertes Inventaire + contrôles Verify restants — les 7 chargeurs déjà
    // agrégés dans construireSecteurOperations() (nexus-secteurs-moteur.js).
    const onOperationsResolue = surResolutionSecteur('operations', 7);
    const onFdjResolue = surResolutionSecteur('fdj', 2); // candidats FDJ + Coach FDJ
    const onEquipeResolue = surResolutionSecteur('equipe', 1);
    // Commande Carburant (24/08/2026, cahier §24-25) ajoute un 2e chargeur
    // sous le même secteur 'carburants' (même tick d'animation, jamais un
    // nouvel identifiant de secteur pour un simple signal supplémentaire
    // du même domaine — voir chargerCandidatCommandeCarburant ci-dessous).
    const onCarburantsResolue = surResolutionSecteur('carburants', 2);

    // Chargeurs (nexus-brief-donnees.js, refactoring pages monolithiques,
    // 11/08/2026) — chacun appelé directement avec (nexusClient, SITE_ACTUEL,
    // ...) plutôt que via un alias local, ce fichier ne gardant plus que
    // l'orchestration et l'affichage (Data Dictionary v2.40).
    const [margePlusResultat, constatTempo, messagesAdvisor, candidatsCaisseObj, candidatsStock, candidatsRappels, candidatsFdjObj, candidatsCoach, domaineEquipe, alertesInvOuvertes, alertesInvCritiquesOuvertes, controlesVerifyRestants, missionsRestantes, carburants, agregationCaisseParQuart, candidatsCommandeCarburant] = await Promise.all([
      NexusBriefDonnees.chargerMargePlus(nexusClient, SITE_ACTUEL, rowsBrut).then(onMargeResolue),
      NexusBriefDonnees.chargerConstatTempo(nexusClient, SITE_ACTUEL).then(onOperationsResolue),
      NexusBriefDonnees.chargerMessagesAdvisor(nexusClient, SITE_ACTUEL).then(onOperationsResolue),
      NexusBriefDonnees.chargerCandidatsCaisse(nexusClient, SITE_ACTUEL).then(onOperationsResolue),
      NexusBriefDonnees.chargerCandidatsStock(nexusClient, SITE_ACTUEL).then(onOperationsResolue),
      NexusBriefDonnees.chargerCandidatsRappels(nexusClient, SITE_ACTUEL).then(onOperationsResolue),
      NexusBriefDonnees.chargerCandidatsFdj(nexusClient, SITE_ACTUEL).then(onFdjResolue),
      NexusBriefDonnees.chargerCandidatsCoachEquipe(nexusClient, SITE_ACTUEL).then(onFdjResolue),
      NexusBriefDonnees.chargerDomaineEquipe(nexusClient).then(onEquipeResolue),
      NexusBriefDonnees.chargerAlertesInventaireOuvertes(nexusClient, SITE_ACTUEL).then(onOperationsResolue),
      // Sprint "Cockpit — enrichir Opérations" (29/08/2026, doctrine NEXUS
      // Inventaire V2) : sous-compte des alertes inventaire CRITIQUES,
      // additif à alertesInvOuvertes ci-dessus (jamais un remplacement,
      // Article 11) — Frédéric a explicitement choisi de garder Inventaire
      // fondu dans Opérations plutôt qu'un secteur à part (décision
      // architecturale antérieure de l'audit du 12/08/2026, confirmée).
      NexusBriefDonnees.chargerAlertesInventaireCritiquesOuvertes(nexusClient, SITE_ACTUEL).then(onOperationsResolue),
      NexusBriefDonnees.chargerControlesVerifyRestants(nexusClient, SITE_ACTUEL).then(onOperationsResolue),
      NexusBriefDonnees.chargerMissionsRestantes(nexusClient, SITE_ACTUEL),
      // chargerCarburantsBriefAvecFallback (22/08/2026, fallback temporel
      // "dernier état fiable" — voir NEXUS-Data-Dictionary-v2.md v2.214/
      // v2.215) : remplace l'appel direct à chargerCarburantsBrief() par une
      // version qui, si aujourd'hui n'est pas encore complet (jaugeage/
      // ventes pas encore captés), affiche le dernier jour fiable plutôt
      // qu'un score dégradé artificiellement par une donnée simplement pas
      // encore fraîche.
      NexusBriefDonnees.chargerCarburantsBriefAvecFallback(nexusClient, SITE_ACTUEL, new Date().toISOString().slice(0, 10)).then(onCarburantsResolue),
      NexusRisquesDonnees.chargerAgregationCaisseTousQuarts(nexusClient, SITE_ACTUEL, 30),
      // Notification Commande Carburant (24/08/2026, cahier §24-25) —
      // réutilise l'évaluation déjà construite par NexusCarburantCommandeDonnees
      // (Article 11, voir chargerCandidatCommandeCarburant) ; jamais plus
      // d'1 candidat retourné (plafond "2 notifications max" du cahier
      // trivialement respecté, ce moteur ne contribuant jamais qu'à lui
      // seul dans le tri fusionné ci-dessous).
      NexusBriefDonnees.chargerCandidatCommandeCarburant(nexusClient, SITE_ACTUEL).then(onCarburantsResolue),
    ]);
    // Fin de l'interrogation réelle des moteurs — bascule sur la séquence de
    // pacing pour la phase de synthèse elle-même (voir demarrerAnimationChargement).
    if (ANIMATION_CHARGEMENT) ANIMATION_CHARGEMENT.demarrerSequenceFinale();
    const candidatsFdj = candidatsFdjObj.candidats;
    const fdjResume = candidatsFdjObj.resume;

    // Moteur de risques (pilote Marge+Caisse, 12/08/2026) — qualifie et
    // enregistre les observations du jour, puis ne garde pour l'affichage
    // que les signaux ayant dépassé le simple constat isolé (niveau
    // non-anomalie) : NEXUS observe silencieusement en base à chaque
    // ouverture de Brief, mais ne "parle" de risque au dirigeant qu'une
    // fois le niveau justifié — philosophie explicite de Frédéric. Vit
    // dans NexusRisquesDonnees (pas ici) pour rester appelable à
    // l'identique depuis Cockpit/Rapport/secteurs (Article 11).
    const signauxRisqueBruts = await NexusRisquesDonnees.qualifierEtEnregistrerRisquesPilote(nexusClient, SITE_ACTUEL, {
      rowsBrut, periodeAffichage, categoriesEnEcart: margePlusResultat ? margePlusResultat.categoriesEnEcart : [],
      agregationCaisseParQuart,
    });

    // Domaine Équipe (Cadrage risques Phase 6, tâche #235, 18/08/2026) —
    // volontairement une 2e écriture SÉPARÉE, fire-and-forget (jamais
    // `await`, jamais mêlée à l'appel ci-dessus) : contrairement à
    // Marge/Caisse, aucune section affichée CE tour-ci par Brief ne dépend
    // de son résultat (la carte secteur Équipe lit `domaineEquipe`
    // directement, pas les signaux persistés) — bloquer le rendu principal
    // sur 2 requêtes supplémentaires (ponctualité par collaborateur,
    // site-filtrée, distincte du `chargerDomaineEquipe` ci-dessus qui ne
    // filtre pas par site) n'apporterait rien à l'utilisateur aujourd'hui,
    // seulement demain à Cockpit/Rapport une fois le signal accumulé — même
    // discipline que `qualifierRisquesCarburantEnArrierePlan` (Carburants
    // Pilotage, Phase 5). Un échec ici (réseau, table absente) ne doit
    // JAMAIS empêcher Brief de s'afficher.
    NexusRisquesDonnees.chargerPonctualiteCollaborateursAQualifier(nexusClient, SITE_ACTUEL)
      .then(ponctualiteCollaborateurs => NexusRisquesDonnees.qualifierEtEnregistrerRisquesPilote(nexusClient, SITE_ACTUEL, { ponctualiteCollaborateurs }))
      .catch(e => console.error('Qualification risques Équipe (arrière-plan, sans impact sur Brief) :', e));
    // Tri par urgence d'abord, gravité ensuite (12/08/2026, cadrage §9 :
    // "Brief doit montrer en priorité l'urgence, tout en conservant la
    // gravité. Une exposition immédiate peut être plus importante
    // aujourd'hui qu'un risque avéré de moyen terme.") — jamais un tri par
    // gravité seule comme avant ce lot, qui aurait pu masquer une
    // exposition urgente derrière un risque avéré déjà installé depuis des
    // mois. Plafond ramené de 4 à 3 (critère d'acceptation explicite du
    // cadrage : "Brief affiche au maximum 3 risques/expositions
    // significatifs."). `chargerSignauxSite` (nexus-risques-donnees.js)
    // trie déjà par gravité pour ses autres appelants (Cockpit) — ce
    // re-tri est local à Brief, pas une modification de la fonction
    // partagée (même discipline que P0.2 : Brief-only quand la granularité
    // d'affichage diffère d'un autre écran).
    const RANG_URG = NexusRisques.RANG_URGENCE;
    const RANG_NIV = NexusRisques.RANG_NIVEAU;
    const signauxRisque = signauxRisqueBruts
      .filter(s => s.niveau !== 'anomalie')
      .slice()
      .sort((a, b) => {
        const diffUrg = (RANG_URG[b.urgence] || 0) - (RANG_URG[a.urgence] || 0);
        if (diffUrg !== 0) return diffUrg;
        return (RANG_NIV[b.niveau] || 0) - (RANG_NIV[a.niveau] || 0);
      })
      .slice(0, 3);

    // Signaux qualifiés par domaine, filtrés UNE SEULE FOIS (12/08/2026,
    // regroupé à l'occasion du lot P1 — jusqu'ici la même paire de filtres
    // `domaine === 'marge'/'caisse' && niveau !== 'anomalie'` était répétée
    // à 3 endroits indépendants : phrasesRisqueMarge/Caisse, les deux Sets
    // de dédoublonnage P0.3, et maintenant l'agrégateur "Ce qui freine"
    // P1.1 — Article 11, une seule source plutôt que 3 copies qui
    // auraient pu diverger). SANS le plafond d'affichage à 3
    // (`signauxRisque` ci-dessus, réservé à la section "Risques &
    // expositions") : Freins/Lecture du directeur/dédoublonnage doivent
    // refléter l'image complète des signaux confirmés, jamais seulement le
    // sous-ensemble montré dans cette section.
    const signauxRisqueMargeQualifies = signauxRisqueBruts
      .filter(s => s.domaine === 'marge' && s.niveau !== 'anomalie')
      .map(s => ({ categorie: (s.cle_signal || '').replace('marge:categorie:', ''), niveau: s.niveau }));
    const signauxRisqueCaisseQualifies = signauxRisqueBruts
      .filter(s => s.domaine === 'caisse' && s.niveau !== 'anomalie')
      .map(s => ({ quart: (s.cle_signal || '').replace('caisse:quart:', ''), niveau: s.niveau }));

    // Phrase courte, cohérente avec le style des autres entrées de
    // risques[] (constat factuel, sans rappeler le domaine déjà porté par
    // le secteur qui les affiche) — consommées par construireFreins()/
    // construireLectureDirecteur() (Opérations) pour `risques[]`. Pour
    // Marge, `risques[]` reste alimenté à l'identique (contrat Annexe A
    // inchangé) ; le `frein` affiché, lui, passe désormais par
    // NexusSecteursMoteur.construireSyntheseFreinMarge() ci-dessous (P1.1),
    // qui reçoit signauxRisqueMargeQualifies directement plutôt que des
    // phrases déjà formatées, pour pouvoir agréger (compter les catégories,
    // en nommer jusqu'à 3) au lieu de tout concaténer.
    const phrasesRisqueMarge = signauxRisqueMargeQualifies
      .map(s => `${NexusRisques.LABEL_NIVEAU[s.niveau] || s.niveau} — ${s.categorie}.`);
    const phrasesRisqueCaisse = signauxRisqueCaisseQualifies
      .map(s => `${NexusRisques.LABEL_NIVEAU[s.niveau] || s.niveau} — Quart ${s.quart}.`);

    // Déduplication Décisions/Signaux opérationnels vs Risques (12/08/2026,
    // audit stratégique Brief NEXUS, P0 "dédupliquer les signaux") : la
    // capture de l'audit montre le même sujet apparaissant à la fois dans
    // « À surveiller » (désormais « Signaux opérationnels ») et dans «
    // Risques — À surveiller » (désormais « Risques & expositions »).
    // Cause identifiée : `candidatMargeListe` (Marge+, comparaison de
    // pairs sur la période en cours) et `candidatsCaisseObj` (écarts
    // caisse encore à traiter, `v_caisse_ecart_a_traiter`) alimentent
    // Décisions/Watchlist SANS tenir compte du fait qu'une même
    // catégorie/un même quart peut AUSSI être déjà qualifié par
    // NexusRisques — et c'est même garanti pour la marge, puisque
    // `categoriesEnEcart` (ci-dessus) alimente déjà le moteur de risques
    // avec les catégories que Marge+ a repérées. Règle imposée par
    // l'audit : « Si un signal opérationnel devient un risque qualifié, il
    // disparaît de la rubrique secondaire et reste uniquement dans
    // Risques. » Déduplication par identifiant de fait source (catégorie
    // pour la marge, quart pour la caisse) — jamais par simple libellé
    // texte, qui pourrait diverger entre les deux formulations.
    const risqueMargeCategoriesQualifiees = new Set(signauxRisqueMargeQualifies.map(s => s.categorie));
    const risqueCaisseQuartsQualifies = new Set(signauxRisqueCaisseQualifies.map(s => s.quart));

    // Succès à féliciter — extrait le 11/08/2026 (Article 11) dans
    // NexusConseiller.analyserEvolutionsPaire(), source unique désormais
    // partagée avec NEXUS-Cockpit-v2.html (MEILLEUR_SUCCES).
    const meilleurSucces = paire ? NexusConseiller.analyserEvolutionsPaire(rowsPaireActuelle, rowsPairePrecedente).meilleurSucces : null;

    const nbCritiquesCaisse = candidatsCaisseObj.raw.filter(c => c.statut === 'critique').length;
    const risqueStockTotal = candidatsStock.reduce((s, c) => s + (c.impact_eur || 0), 0);

    // Secteurs (Brief V3, 11/08/2026, audit stratégique Brief/Rapport de
    // Direction) : remplace la Boussole à 5 axes de granularité hétérogène
    // (Commerce/Marge/Opérations/Équipe + Risques dérivé) par les 6 secteurs
    // dirigeant recommandés par l'audit (Bloc B, section 4). Le contrat de
    // chaque secteur (statut/évolution/force/frein/décision liée) est
    // assemblé par NexusSecteursMoteur — jamais un second calcul ici
    // (Article 11) : ce fichier ne fait que passer les valeurs déjà connues
    // (facteurs, margePlusResultat, constatTempo, domaineEquipe, carburants,
    // fdjResume) au moteur partagé. La liste de secteurs ACTIFS vient de
    // NexusSecteursCatalogue.secteursActifsSite(SITE_SECTEURS_CONFIG) — pour
    // Vito comme pour tout site station-service aujourd'hui : les 6 secteurs
    // historiques, dans le même ordre. L'ancien axe "Risques" (dérivé, non
    // structurant au sens de l'audit) est retiré en tant qu'axe autonome ;
    // ses composantes (écarts de caisse critiques, alertes inventaire,
    // risque stock) vivent maintenant dans le secteur Opérations (risks[],
    // transversal — exactement la définition donnée par l'audit section 11).
    // secteursCheck.statut === 'ok' est garanti ici (vérifié en tête de
    // fonction, avant tout chargement) — on réutilise le même résultat
    // plutôt que de rappeler secteursActifsSite() une seconde fois.
    const secteurs = NexusSecteursMoteur.construireSecteurs(secteursCheck.secteurs, {
      carburants, facteurs, margePlusResultat, fdjResume, constatTempo, controlesVerifyRestants,
      nbCritiquesCaisse, alertesInvOuvertes, alertesInvCritiquesOuvertes, risqueStockTotal,
      domaineEquipe, seuilMinPointages: SEUIL_MIN_POINTAGES_EQUIPE,
      phrasesRisqueMarge, phrasesRisqueCaisse, signauxRisqueMargeQualifies,
      // siteId (23/08/2026, v2.223, contrat commun de sortie des moteurs,
      // audit §4) : transmis pour que `secteur.contrat.site_id` soit
      // renseigné — champ purement additif, aucun écran existant ne le lit
      // encore.
      siteId: SITE_ACTUEL,
    });
    // AXES : alias historique conservé pour renderBoussole()/le PDF, qui
    // lisent `a.nom` (convention Brief) là où le contrat secteur partagé
    // utilise `label` (convention Annexe A de l'audit, partagée avec
    // NEXUS-Rapport-v1.html) — un seul mapping, jamais deux champs tenus
    // manuellement en parallèle.
    const AXES = secteurs.map(s => ({ ...s, nom: s.label }));

    // Indice Boussole explicable (demande de Frédéric, 02/08/2026 soir ;
    // renommé "Indice NEXUS" → "Indice Boussole" le 10/08/2026) : sur cet
    // écran, l'indice N'EST PAS le même calcul que l'Indice Marge de
    // l'accueil/Radar du Manager (nexus-indice.js, marge+évolution CA
    // uniquement) — il est la moyenne des secteurs réellement mesurés
    // aujourd'hui, chacun recentré à 50 (neutre), pour pouvoir se
    // décomposer honnêtement secteur par secteur. Un secteur non mesuré est
    // exclu de la moyenne, jamais compté comme 50 par défaut (Article 5).
    //
    // Filtre corrigé le 12/08/2026 (audit stratégique Brief NEXUS, P0
    // "sécuriser l'Indice Boussole") : filtrait auparavant sur
    // `a.valeur != null`, un champ que certains secteurs (Carburants,
    // Équipe) pouvaient remplir avec un score réel MÊME quand leur propre
    // `confiance` disait "INSUFFISANT" à l'utilisateur — un secteur pouvait
    // donc afficher "Données insuffisantes" tout en tirant l'Indice vers le
    // bas silencieusement. Corrigé à la source dans nexus-secteurs-moteur.js
    // (invariant désormais imposé : confiance === 'RÉEL' ⟺ valeur !== null
    // pour les 6 secteurs), et le filtre ici lit maintenant `confiance`
    // directement — la même donnée que le badge "X/6 mesurés" affiché à
    // l'écran (renderBoussole), pour ne plus jamais avoir deux comptages
    // différents du nombre de secteurs mesurés sur le même écran.
    const axesMesures = AXES.filter(a => a.confiance === 'RÉEL');
    const scoreGlobal = axesMesures.length ? Math.round(axesMesures.reduce((s, a) => s + a.valeur, 0) / axesMesures.length) : null;
    // `couverture` (13/08/2026, reformulation Performance/Maîtrise — voir
    // nexus-boussole-moteur.js) : distingue, PARMI les secteurs mesurés,
    // ceux où les deux dimensions (Performance ET Maîtrise) sont connues
    // ("complet") de ceux où l'une des deux manque aujourd'hui
    // ("partiel" — ex. Carburants sans jaugeage du jour, Marge sans
    // comparaison Marge+ disponible). Remplace le seul badge "X/6 mesurés"
    // (v2.52-v2.55), qui ne distinguait pas ces deux cas.
    const nbComplets = axesMesures.filter(a => a.couverture === 'complete').length;
    const nbPartiels = axesMesures.filter(a => a.couverture === 'partielle').length;
    const indiceExplication = {
      periodeLabel, nbMesures: axesMesures.length, totalAxes: AXES.length, nbComplets, nbPartiels,
      // `deltas` (13/08/2026) : affiche désormais le score BRUT /100 de
      // chaque secteur, plus le delta ±50 par rapport au neutre — retour
      // d'usage direct de Frédéric : *"74/100 est beaucoup plus
      // compréhensible que +24 par rapport à 50."* Le delta reste calculé
      // (utile en interne pour le radar SVG), simplement plus mis en avant
      // dans ce texte.
      deltas: AXES.map(a => ({ nom: a.nom, icone: a.icone, mesure: a.valeur != null, valeur: a.valeur, delta: a.valeur != null ? a.valeur - 50 : null })),
    };

    // Forces (Bloc D de l'audit, "deux ou trois forces maximum") — fusionne
    // les succès produits déjà détectés (spécifiques, ex. "Coca-Cola 2L en
    // forte progression") avec les forces au niveau secteur assemblées par
    // NexusSecteursMoteur (ex. "CA FDJ en forte progression") : les
    // premières restent prioritaires (plus précises, niveau dirigeant), les
    // secondes complètent jusqu'à 3 seulement si nécessaire.
    //
    // Matérialité (12/08/2026, audit stratégique Brief NEXUS, P0 "filtrer
    // la granularité dirigeant") : `meilleurSucces` (NexusConseiller.
    // analyserEvolutionsPaire) et `margeEnProgression` (NexusConseiller.
    // analyserProduitsStrategiques) ne portent AUCUN seuil de matérialité —
    // `meilleurSucces` ne demande qu'un CA précédent >= 50 €, et
    // `margeEnProgression` trie uniquement par pourcentage d'évolution de
    // marge, sans plancher en euros. Un article passé de 55 € à 700 € de CA
    // ressort donc comme "+1200 %", exactement l'exemple cité par l'audit
    // ("un +1200 % peut provenir d'une base faible et n'est pas
    // automatiquement une information de direction"). Ces deux fonctions
    // restent inchangées dans nexus-conseiller.js (Article 11 : Cockpit les
    // consomme aussi, à raison, pour son propre usage SKU — voir
    // NEXUS-Cockpit-v2.html) ; le filtre de matérialité est donc appliqué
    // ICI, uniquement pour Brief, en réutilisant le seuil déjà établi par
    // NexusSecteursMoteur.estDecisionStrategique() plutôt que d'inventer un
    // 2e seuil — même principe, même ordre de grandeur, un seul chiffre à
    // faire évoluer avec l'usage réel.
    //
    // Matérialité relative (12/08/2026, cadrage §4/§15, lot P2.1) : "Seuils
    // adaptatifs selon la taille du site et l'importance du secteur." Le
    // seuil fixe (500 €) ne s'adaptait pas à la taille du site — vérifié en
    // base : sur le site pilote, 500 € représente 0,44 à 0,76 % du CA total
    // de la période selon la fenêtre (2 à 3 semaines), un même montant
    // deviendrait dérisoire sur un site bien plus grand ou écrasant sur un
    // site bien plus petit. `caTotalPeriode` réutilise `rowsBrut`/
    // `periodeAffichage`, déjà en mémoire (aucune nouvelle lecture
    // Supabase) — calculé UNE SEULE FOIS ici, appliqué à la fois aux Forces
    // (ci-dessous) ET aux Décisions/Watchlist (candidatsProduitsNormalises/
    // candidatMargeListe, plus bas) : un seul seuil de matérialité pour tout
    // Brief, jamais deux barres différentes dans le même écran.
    const caTotalPeriode = periodeAffichage
      ? rowsBrut.filter(r => r.periode_debut === periodeAffichage.debut).reduce((s, r) => s + (Number(r.ca) || 0), 0)
      : null;
    const seuilImpactAdaptatif = NexusSecteursMoteur.calculerSeuilImpactAdaptatif(caTotalPeriode);
    const SEUIL_FORCE_PRODUIT_EUR = seuilImpactAdaptatif;
    const forces = [];
    if (meilleurSucces && meilleurSucces.gain >= SEUIL_FORCE_PRODUIT_EUR) {
      forces.push({ icone: '📈', titre: `${meilleurSucces.article} en forte progression`, detail: `+${(meilleurSucces.evolution * 100).toFixed(0)} % sur la période, soit environ ${Math.round(meilleurSucces.gain).toLocaleString('fr-FR')} € de gain.`, cible: 'NEXUS-Produits-v1.html' });
    }
    if (produitsStrategiques && produitsStrategiques.margeEnProgression.length) {
      const m = produitsStrategiques.margeEnProgression.find(p => p.marge >= SEUIL_FORCE_PRODUIT_EUR);
      if (m) forces.push({ icone: '💰', titre: `Marge en progression sur ${m.article}`, detail: `Marge en hausse de ${(m.evolutionMarge * 100).toFixed(0)} % sur la période (${Math.round(m.marge).toLocaleString('fr-FR')} € de marge sur la période).`, cible: 'NEXUS-Scanner-v1.html' });
    }
    if (forces.length < 3 && constatTempo.jourPlusRentable) forces.push({ icone: '🗓️', titre: `${constatTempo.jourPlusRentable.nom} — votre journée la plus rentable`, detail: "Confirmé sur plusieurs semaines d'historique, produits d'appel exclus.", cible: 'NEXUS-Tempo-v1.html' });
    secteurs.forEach(s => { if (forces.length < 3 && s.force) forces.push({ icone: s.icone, titre: s.force.titre, detail: s.force.detail, cible: s.force.cible }); });

    // Moteur de priorité cross-moteurs — les 7 moteurs disponibles dans
    // NEXUS aujourd'hui, fusionnés par NexusConseiller.fusionnerEtSelectionner
    // (rang partagé, jamais un simple tri par euros). n=6 : les 3 premiers
    // deviennent les décisions, les 3 suivants la liste de vigilance — un
    // seul et même classement pour les deux, pas deux logiques distinctes.
    // Granularité stratégique (Bloc G de l'audit, demande confirmée de
    // Frédéric) : "une référence produit ne remonte au Brief que si elle
    // est structurante." Filtre appliqué AVANT normalisation — c'est là que
    // `contribution`/`impact_eur` sont encore présents sur le candidat brut
    // (normaliserProduit()/normaliserMarge() ne les recopient pas tous) —
    // voir NexusSecteursMoteur.estDecisionStrategique. Ce filtre est une
    // politique d'affichage propre à Brief NEXUS : le Cockpit et
    // NEXUS-Produits-v1.html continuent de voir CHAQUE décision, y compris
    // au niveau SKU — nexus-conseiller.js lui-même n'est pas modifié.
    const candidatsProduitsNormalises = candidatsProduitsBrut
      .filter(c => !VALIDEES_SITE.has(c.candidate_id) && NexusSecteursMoteur.estDecisionStrategique(c, seuilImpactAdaptatif))
      .map(NexusConseiller.normaliserProduit);
    // `!risqueMargeCategoriesQualifiees.has(...)` (12/08/2026, dédoublonnage
    // P0) : si NexusRisques a déjà qualifié cette catégorie (signal_faible+,
    // comparaison à sa propre référence historique), elle reste UNIQUEMENT
    // dans "Risques — À surveiller" — jamais recopiée en Décision/Watchlist
    // pour le même fait.
    const candidatMargeListe = margePlusResultat && margePlusResultat.candidatTop
      && !VALIDEES_SITE.has(margePlusResultat.candidatTop.candidate_id)
      && NexusSecteursMoteur.estDecisionStrategique(margePlusResultat.candidatTop, seuilImpactAdaptatif)
      && !risqueMargeCategoriesQualifiees.has(margePlusResultat.candidatTop.categorie)
      ? [NexusConseiller.normaliserMarge(margePlusResultat.candidatTop)] : [];
    const candidatTempoBrut = construireCandidatTempo(constatTempo);
    const candidatTempoListe = candidatTempoBrut ? [NexusConseiller.normaliserTempo(candidatTempoBrut)] : [];
    // Même règle pour la caisse (12/08/2026, dédoublonnage P0) : un quart
    // déjà qualifié par NexusRisques (`caisse:quart:${quart}`, comparaison à
    // sa propre référence sur fenêtre glissante) ne doit plus apparaître en
    // Décision/Watchlist via `v_caisse_ecart_a_traiter` — seuls les écarts
    // encore à traiter sur un quart NON déjà qualifié restent dans cette
    // liste secondaire. Filtré sur `.raw` (avant normalisation, où `.quart`
    // est encore présent tel quel) puis renormalisé à l'identique.
    const candidatsCaisseNormalisesDedupliques = candidatsCaisseObj.raw
      .filter(c => !risqueCaisseQuartsQualifies.has(String(c.quart)))
      .map(NexusConseiller.normaliserCaissePersonne);
    // Règle non négociable pour ce Brief (demande de Frédéric, 02/08/2026
    // soir) : "si NEXUS ne peut pas expliquer précisément pourquoi une
    // information mérite l'attention du dirigeant, elle ne doit pas
    // apparaître." normaliserAdvisor() produit une décision volontairement
    // générique ("Vérifiez ce point dans l'écran concerné") car
    // advisor_messages est un texte libre sans geste concret associé —
    // Brief NEXUS écarte donc tout signal dont le texte réel (message_text)
    // est absent ou trop court pour être précis, plutôt que d'afficher une
    // ligne vague. Les signaux retenus sont ensuite reformulés à partir de
    // leur texte réel dans enrichirDecision() (jamais le gabarit générique).
    const candidatsAdvisorListe = messagesAdvisor
      .filter(m => m.message_text && m.message_text.trim().length >= 12)
      .map(NexusConseiller.normaliserAdvisor);
    // Signaux "decisions" pour le registre de moteurs (13/08/2026,
    // NexusMoteursRegistre — cadrage "moteurs dynamiques") : un simple
    // booléen par clé `decisionKey` du registre, dérivé des candidats déjà
    // calculés ci-dessus, aucun second calcul (Article 11). Remplace
    // l'ancien `nbMoteursActifs` (comptage brut, dénominateur "/7" fixe
    // codé plus bas) par une liste NOMMÉE de moteurs, réutilisable pour le
    // pied de page ET la mention de fiabilité.
    const signauxDecisionsMoteurs = {
      produits: candidatsProduitsNormalises.length > 0, marge: candidatMargeListe.length > 0,
      tempo: candidatTempoListe.length > 0, advisor: candidatsAdvisorListe.length > 0,
      caisse: candidatsCaisseNormalisesDedupliques.length > 0, stock: candidatsStock.length > 0,
      rappel: candidatsRappels.length > 0, fdj: candidatsFdj.length > 0, coach: candidatsCoach.length > 0,
      commande_carburant: candidatsCommandeCarburant.length > 0,
    };
    // Signaux "axes" pour le registre de moteurs — un booléen par secteur du
    // contrat commun (`confiance === 'RÉEL'`), pour les moteurs sans
    // decisionKey propre (Contrôles/Équipe/Carburants). `AXES` est déjà
    // construit plus haut (secteurs.map, avant les candidats de décision).
    const signauxAxesMoteurs = Object.fromEntries(AXES.map(a => [a.id, a.confiance === 'RÉEL']));
    // Registre de moteurs (cadrage "moteurs dynamiques", 13/08/2026) : plus
    // aucun nom de moteur écrit en dur — actifs = filtrés par les secteurs
    // réellement actifs de CE site (`secteursCheck.secteurs`, déjà résolu
    // plus haut), contributeurs = filtrés par les signaux `decisions`/`axes`
    // ci-dessus.
    const moteursActifsListe = NexusMoteursRegistre.moteursActifsPourSite(secteursCheck.secteurs.map(s => s.id));
    const moteursContributeursListe = NexusMoteursRegistre.moteursContributeurs(
      { decisions: signauxDecisionsMoteurs, axes: signauxAxesMoteurs }, moteursActifsListe
    );
    const mentionFiabiliteMoteurs = NexusMoteursRegistre.construireMentionFiabilite(moteursContributeursListe, moteursActifsListe);
    const texteAgregationMoteurs = NexusMoteursRegistre.construireTexteAgregation(moteursContributeursListe);

    const fusion = NexusConseiller.fusionnerEtSelectionner(
      [candidatsProduitsNormalises, candidatMargeListe, candidatTempoListe, candidatsAdvisorListe, candidatsCaisseNormalisesDedupliques, candidatsStock, candidatsRappels, candidatsFdj, candidatsCoach, candidatsCommandeCarburant],
      { site: SITE_ACTUEL, n: 6 }
    );
    const decisions = fusion.slice(0, 3);
    const watchlist = fusion.slice(3, 6);

    function quandAgir(rang) {
      if (rang <= 0) return "Aujourd'hui";
      if (rang === 1) return "Dans les 48 heures";
      if (rang === 2) return "Cette semaine";
      return "Dès que possible";
    }
    function niveauConfiance(p) { return (p.validable && !p.limites) ? 'Élevé' : 'Moyen'; }
    // Décision précise (demande de Frédéric, 02/08/2026 soir) : "chaque
    // décision doit obligatoirement contenir le sujet précis, l'action, la
    // raison, le module source." Les moteurs Caisse/Stock/Rappel écrivent
    // déjà l'action ET la raison dans un seul champ décision (ex : "Allez
    // voir Dylan : un écart de 40 € reste non justifié...") — utilisés tels
    // quels. Le moteur Advisor est réécrit ici à partir du texte réel du
    // signal (jamais le gabarit générique). Produits et Tempo séparent
    // action et raison dans deux champs (decision/pourquoi) — cette
    // fonction les recompose en une seule phrase "action — raison" pour le
    // titre de la carte, sur le modèle exact donné par Frédéric ("Contrôlez
    // le prix d'achat du Coca-Cola 2 L dans Produits : sa marge est
    // inférieure de 11,6 points...").
    function texteActionPrecis(p) {
      if (p.moteur === 'advisor') return `Vérifiez : ${p.pourquoi}`;
      return p.decision;
    }
    function teaserPrecis(p, action) {
      if (p.moteur === 'produits' || p.moteur === 'tempo') {
        const phrases = (p.pourquoi || '').split('. ').map(s => s.trim()).filter(Boolean);
        const raison = phrases[phrases.length - 1] ? phrases[phrases.length - 1].replace(/\.$/, '') : null;
        return raison ? `${action.replace(/\.$/, '')} — ${raison.charAt(0).toLowerCase()}${raison.slice(1)}.` : action;
      }
      return action; // caisse/stock/rappel/advisor : la raison est déjà dans l'action
    }
    function enrichirDecision(p) {
      const action = texteActionPrecis(p);
      return {
        ...p,
        ceQueJObserve: p.pourquoi,
        pourquoiCelaCompte: p.impactAttendu,
        ceQuiSembleLExpliquer: `Détecté par le moteur ${NexusMoteursRegistre.nomPublic(p.moteur) || p.moteur} à partir de ${MOTEUR_SOURCE[p.moteur] || 'données réelles'}.`,
        ceQuiManquePourConfirmer: p.limites || "Aucune réserve identifiée — signal directement mesuré.",
        ceQueJeRecommande: action,
        teaser: teaserPrecis(p, action),
        quandAgir: quandAgir(p.rang),
        niveauDeConfiance: niveauConfiance(p),
      };
    }

    const gain = decisions.filter(p => ['🔥 À AGIR', '📈 OPPORTUNITÉ', '💡 RECOMMANDATION'].includes(p.etat)).reduce((s, p) => s + (p.impact_eur || 0), 0);
    const risque = decisions.filter(p => !['🔥 À AGIR', '📈 OPPORTUNITÉ', '💡 RECOMMANDATION'].includes(p.etat)).reduce((s, p) => s + (p.impact_eur || 0), 0);

    const decisionsEnrichies = decisions.map(enrichirDecision);
    // La liste de vigilance passe par le même filtre de précision que les
    // décisions (texteActionPrecis) — même règle non négociable, qu'un
    // signal advisor apparaisse en position 1 ou en position 5.
    const watchlistPrecise = watchlist.map(p => ({ ...p, action: texteActionPrecis(p) }));

    // Blocs A/C/E/F de la structure Brief V3 (audit, section 4) — construits
    // par NexusSecteursMoteur à partir des secteurs déjà assemblés, jamais
    // un second calcul ici. Bloc A (verdict) — 13/08/2026, correctif
    // "rupture de niveau" (retour d'usage direct) : ne reçoit plus la
    // première décision brute (qui pouvait être un SKU individuel comme
    // "Vin chavron") — sa "Priorité :" est maintenant dérivée uniquement
    // des secteurs en difficulté/à surveiller (voir
    // NexusSecteursMoteur.construirePrioriteDirection), donc toujours au
    // niveau entreprise. La décision SKU d'origine reste visible, inchangée,
    // dans la carte "Décisions recommandées" juste en dessous.
    const verdict = NexusSecteursMoteur.construireVerdictDirection(AXES);
    const ceQuiAChange = NexusSecteursMoteur.construireCeQuiAChange(AXES);
    const freins = NexusSecteursMoteur.construireFreins(AXES);
    const lectureDirecteur = NexusSecteursMoteur.construireLectureDirecteur(AXES);

    return {
      periodeAffichage, periodeLabel, scoreGlobal, indiceExplication, axes: AXES,
      synthese: verdict, ceQuiAChange, freins, lectureDirecteur,
      forces: forces.slice(0, 3),
      decisions: decisionsEnrichies, watchlist: watchlistPrecise,
      risquesQualifies: signauxRisque.map(s => ({
        niveau: s.niveau, niveauLabel: NexusRisques.LABEL_NIVEAU[s.niveau] || s.niveau,
        urgence: s.urgence, urgenceLabel: NexusRisques.LABEL_URGENCE[s.urgence] || s.urgence,
        domaine: s.domaine, secteur: s.secteur,
        phrase: NexusRisques.genererPhraseContexte({
          // Cadrage risques Phase 5 (18/08/2026, tâche #234) : ce ternaire
          // était binaire marge/caisse en dur — cassé silencieusement dès
          // qu'un 3e domaine (Carburants) apparaîtrait, puisque `else`
          // retombait toujours sur "Caisse". Remplacé par le mapping
          // partagé NexusRisques.domaineLabelSignal/sujetSignal (Article 11
          // — une seule source pour Brief/Cockpit/Rapport).
          domaineLabel: NexusRisques.domaineLabelSignal(s),
          sujet: NexusRisques.sujetSignal(s),
          niveau: s.niveau, motif: (s.historique_transitions && s.historique_transitions.length) ? s.historique_transitions[s.historique_transitions.length - 1].motif : '',
        }),
        actionRecommandee: s.action_recommandee, niveauConfiance: s.niveau_confiance,
        depuisLe: s.premiere_detection_le,
      })),
      impact: { gain, risque, delai: 'Cette semaine', confianceGlobale: mentionFiabiliteMoteurs },
      footerTexte: texteAgregationMoteurs,
      missionsRestantes,
      carburants,
    };
  }

  // ------------------------------------------------------------
  // Rendu — une fonction par section, toutes appelées depuis renderBrief().
  // ------------------------------------------------------------
  function renderHeroEtSynthese(brief) {
    let couleur = 'var(--text-dim)', statutTexte = 'Données insuffisantes';
    if (brief.scoreGlobal != null) {
      if (brief.scoreGlobal >= 90) { couleur = 'var(--green)'; statutTexte = 'Excellence'; }
      else if (brief.scoreGlobal >= 75) { couleur = 'var(--green)'; statutTexte = 'Sous contrôle'; }
      else if (brief.scoreGlobal >= 60) { couleur = 'var(--amber)'; statutTexte = 'À surveiller'; }
      else { couleur = 'var(--red)'; statutTexte = 'Priorité élevée'; }
    }
    const ex = brief.indiceExplication;
    // Score brut /100 mis en avant (13/08/2026, retour d'usage direct de
    // Frédéric — voir nexus-boussole-moteur.js) : le delta ±50 recentré
    // n'est plus la lecture principale ("+24" nécessite de savoir que 50 est
    // neutre ; "74/100" se comprend seul). Le delta reste affiché en petit,
    // repère optionnel pour qui veut le detail.
    const deltasHTML = ex.deltas.map(d => {
      if (!d.mesure) return `<div class="indice-delta-row"><span>${d.icone} ${d.nom}</span><span class="indice-delta-absent">Non mesuré</span></div>`;
      const c = d.valeur >= 70 ? 'var(--green)' : d.valeur >= 40 ? 'var(--amber)' : 'var(--red)';
      const signe = d.delta >= 0 ? '+' : '';
      return `<div class="indice-delta-row"><span>${d.icone} ${d.nom}</span><span style="color:${c}; font-family:var(--mono); font-weight:700;">${d.valeur}/100 <span style="opacity:0.55; font-weight:400;">(${signe}${d.delta})</span></span></div>`;
    }).join('');
    return `
      <div class="brief-hero">
        <div class="brief-date">${brief.periodeLabel}</div>
        <div class="brief-indice-value" style="color:${couleur};">${brief.scoreGlobal != null ? brief.scoreGlobal : '—'}</div>
        <!-- Renommé "Indice NEXUS" → "Indice Boussole" le 10/08/2026
             (décision de Frédéric, suite au doc NEXUS-Brief-V2-Architecture-v1.md :
             garder les deux formules d'indice distinctes plutôt que les
             unifier, mais les nommer clairement au lieu de les laisser
             porter le même nom générique — voir aussi NEXUS-App-v1.html,
             "Indice Marge"). -->
        <div class="brief-indice-label">Indice Boussole</div>
        <div class="brief-etat"><span class="brief-etat-dot" style="color:${couleur};"></span>${statutTexte}</div>
        <div class="brief-synthese">${brief.synthese}</div>
        <div class="indice-explain-wrap" id="indiceExplainWrap">
          <div class="indice-explain-toggle" onclick="document.getElementById('indiceExplainWrap').classList.toggle('open')">Comprendre l'Indice Boussole ${brief.scoreGlobal != null ? brief.scoreGlobal : '—'} <span class="chev">›</span></div>
          <div class="indice-explain">
            <div class="section-note" style="margin-top:0;">Moyenne des secteurs mesurés aujourd'hui (${ex.nbMesures}/${ex.totalAxes}), chaque secteur combinant une note de Performance et une note de Maîtrise. ${ex.periodeLabel}.</div>
            ${deltasHTML}
            <div class="section-note" style="font-style:italic;">Cet Indice Boussole diffère volontairement de l'Indice Marge affiché sur votre écran d'accueil (calculé, lui, uniquement à partir de la marge et de l'évolution du CA) — pas un bug, deux indices distincts avec leur propre nom : ici la vision d'ensemble du dirigeant, là un signal opérationnel plus étroit.</div>
          </div>
        </div>
      </div>
      <div class="legend-line"><b style="color:var(--green);">RÉEL</b> = calculé directement à partir de données mesurées &nbsp;·&nbsp; <b style="color:var(--cyan);">DÉRIVÉ</b> = interprétation croisant plusieurs signaux &nbsp;·&nbsp; <b style="color:var(--gold);">ESTIMÉ</b> = projection financière, pas une garantie</div>`;
  }

  const NOM_ECRAN = {
    'NEXUS-Produits-v1.html': 'Produits', 'NEXUS-Scanner-v1.html': 'Scanner NEXUS', 'NEXUS-Verify-v1.html': 'Verify',
    'NEXUS-Resultats-Equipe-v1.html': 'Résultats Équipe', 'NEXUS-Scanner-Stock-v1.html': 'Scanner Stock',
    'NEXUS-Carburants-Pilotage-v1.html': 'Carburants Performance', 'NEXUS-FDJ-Analyse-v1.html': 'FDJ Performance',
  };
  // "Vos secteurs" (11/08/2026, Brief V3, Bloc B de l'audit) — remplace la
  // Boussole à 5 axes par les 6 secteurs dirigeant (voir construireBrief).
  // Nom interne "Boussole"/axe-* conservé dans le code (CSS, ids) pour ne
  // pas réécrire toute la mise en page pour un simple renommage — seul le
  // texte visible par le manager change. Chaque secteur, au clic, ouvre
  // trois informations demandées par Frédéric (02/08/2026 soir) : État
  // (statut + valeur), Cause principale (le detail déjà calculé pour ce
  // secteur — jamais un texte différent inventé pour l'occasion) et
  // Décision liée (la première décision affichée aujourd'hui dont le
  // moteur source correspond à ce secteur, ou une phrase honnête s'il n'y
  // en a aucune — jamais une décision qui n'existe pas).
  function renderBoussole(brief) {
    const svg = genererBoussoleSVG(brief.axes);
    const mesures = brief.axes.filter(a => a.confiance === 'RÉEL');
    const nbMesures = mesures.length;
    // Badge "N secteurs analysés · X complets · Y partiels" (13/08/2026,
    // reformulation Performance/Maîtrise, remplace "X/6 mesurés") — retour
    // d'usage direct de Frédéric : *"la phrase est techniquement vraie...
    // mais elle induit en erreur."* `couverture` vient des constructeurs de
    // nexus-secteurs-moteur.js, jamais recalculée ici (Article 11).
    const nbPartiels = mesures.filter(a => a.couverture === 'partielle').length;
    const nbComplets = nbMesures - nbPartiels;
    const badgeCouverture = nbPartiels > 0
      ? `${nbComplets} complet${nbComplets > 1 ? 's' : ''} · ${nbPartiels} partiel${nbPartiels > 1 ? 's' : ''}`
      : `${nbComplets} complet${nbComplets > 1 ? 's' : ''}`;
    const rows = brief.axes.map((a, i) => {
      // couleurAxe(a.statut) (22/08/2026, refonte statut métier) : plus
      // couleurAxe(a.valeur) — voir nexus-boussole-moteur.js.
      const c = couleurAxe(a.statut);
      const decisionLiee = (a.moteurs || []).length ? brief.decisions.find(d => a.moteurs.includes(d.moteur)) : null;
      const typeInfo = a.confiance === 'RÉEL' ? { label: 'RÉEL', cls: 'badge-real' } : { label: 'DONNÉES INSUFFISANTES', cls: 'badge-derived' };
      // Détail Activité/Maîtrise (13/08/2026) : remplace le champ "État"
      // brut (qui juxtaposait statut et valeur sans les relier) par les
      // deux dimensions qui COMPOSENT `valeur`, sur le modèle donné par
      // Frédéric ("Activité : 25/100 · Maîtrise : 40/100"). Une dimension
      // non modélisée pour ce secteur (ex. Maîtrise pour Commerce) n'a pas
      // de ligne — absence de ligne, jamais un "0/100" qui laisserait
      // croire à une pénalité.
      const ligneActivite = a.activite != null ? `<div class="decision-field"><div class="decision-field-label">Activité</div><div class="decision-field-text">${a.activite}/100</div></div>` : '';
      const ligneMaitrise = a.maitrise != null ? `<div class="decision-field"><div class="decision-field-label">Maîtrise</div><div class="decision-field-text">${a.maitrise}/100</div></div>` : '';
      // Fallback temporel "dernier état fiable" (22/08/2026, v2.214/v2.215) :
      // badge de fraîcheur + bloc "Aujourd'hui — en cours" séparé, posés
      // uniquement quand `fraicheur.mode !== 'jour'` — jamais mélangés au
      // score lui-même (règle de Frédéric : jamais silencieusement J-1 et J
      // dans le même chiffre). Générique sur tous les secteurs (seul
      // Carburants les alimente aujourd'hui, voir nexus-secteurs-moteur.js).
      const badgeFraicheurTxt = a.fraicheur ? NexusCarburantMoteur.libelleBadgeFraicheur(a.fraicheur) : null;
      const badgeFraicheur = badgeFraicheurTxt
        ? `<span class="badge" style="margin-left:6px; color:${a.fraicheur.mode === 'perime' ? 'var(--amber)' : 'var(--text-dim)'}; border-color:currentColor;">${badgeFraicheurTxt}</span>`
        : '';
      const blocEnCours = (a.enCours && a.enCours.length)
        ? `<div class="decision-field"><div class="decision-field-label">Aujourd'hui — en cours</div><div class="decision-field-text">${a.enCours.join(' ')}</div></div>`
        : '';
      return `
        <div class="axe-block" id="axe-${i}">
          <div class="axe-row" onclick="document.getElementById('axe-${i}').classList.toggle('open')">
            <span class="axe-dot" style="background:${c.hex}; color:${c.hex};"></span>
            <span class="axe-nom">${a.icone} ${a.nom}</span>
            <span class="axe-statut" style="color:${COULEUR_STATUT_DOMAINE[a.statut] || 'var(--text-dim)'};">${a.valeur != null ? `${a.valeur}/100 · ` : ''}${a.statut}</span>
            <span class="axe-chev">›</span>
          </div>
          <div class="axe-detail">
            <div class="decision-field"><div class="decision-field-label">État <span class="badge ${typeInfo.cls}" style="margin-left:6px;">${typeInfo.label}</span>${badgeFraicheur}</div><div class="decision-field-text">${a.statut}${a.valeur != null ? ` — ${a.valeur}/100` : ''}</div></div>
            ${ligneActivite}
            ${ligneMaitrise}
            <div class="decision-field"><div class="decision-field-label">Cause principale</div><div class="decision-field-text">${a.detail}</div></div>
            ${blocEnCours}
            <div class="decision-field"><div class="decision-field-label">Décision liée</div><div class="decision-field-text">${decisionLiee ? decisionLiee.decision : "Aucune décision prioritaire liée à ce secteur aujourd'hui."}</div></div>
            <a href="${a.cible}" class="decision-lien">→ Ouvrir ${NOM_ECRAN[a.cible] || a.cible}</a>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="section">
        <div class="section-title">Vos secteurs <span class="badge badge-real">${brief.axes.length} analysés · ${badgeCouverture}</span></div>
        <div class="boussole-card">
          <div class="boussole-svg-wrap">${svg}</div>
          ${rows}
        </div>
        <div class="section-note">Un secteur grisé n'est pas mauvais, il manque simplement de données pour l'instant. Touchez un secteur pour voir son état, sa cause principale et la décision qui s'y rattache.</div>
      </div>`;
  }

  // Bloc C — "Ce qui a changé" (audit, section 4) : 3 évolutions maximum,
  // déjà sélectionnées par NexusSecteursMoteur.construireCeQuiAChange à
  // partir des secteurs. Rien à afficher si aucun secteur n'a bougé de plus
  // de 5 % (ou seuil équivalent) sur la période — jamais une liste vide
  // remplie artificiellement.
  function renderCeQuiAChange(brief) {
    if (!brief.ceQuiAChange.length) return '';
    return `
      <div class="section">
        <div class="section-title">Ce qui a changé <span class="badge badge-derived">dérivé</span></div>
        ${brief.ceQuiAChange.map(texte => `<div class="force-card" style="cursor:default;"><div class="force-detail">${texte}</div></div>`).join('')}
      </div>`;
  }

  // Bloc E — "Ce qui freine la performance" (audit, section 4) : symétrique
  // du Bloc D (Forces), 3 fragilités maximum, sourcées des secteurs
  // (frein[]) — jamais un duplicata des décisions déjà listées plus bas.
  function renderFreins(brief) {
    if (!brief.freins.length) return '';
    return `
      <div class="section">
        <div class="section-title">Ce qui freine la performance <span class="badge badge-real">réel</span></div>
        ${brief.freins.map(f => `<a class="force-card" href="${f.cible}" style="text-decoration:none;">
          <div class="force-titre">${f.titre}</div>
          <div class="force-detail">${f.detail}</div>
        </a>`).join('')}
      </div>`;
  }

  // Bloc F — "Lecture du directeur d'exploitation" (audit, section 4) :
  // interprétation courte issue de règles déterministes
  // (NexusSecteursMoteur.construireLectureDirecteur), jamais un texte libre
  // généré à la volée — signature éditoriale nouvelle demandée par l'audit.
  function renderLectureDirecteur(brief) {
    return `
      <div class="section">
        <div class="section-title">Lecture du directeur d'exploitation <span class="badge badge-derived">dérivé</span></div>
        <div class="force-card" style="cursor:default;">
          <div class="force-detail" style="font-style:italic;">${brief.lectureDirecteur}</div>
        </div>
      </div>`;
  }

  function renderForces(brief) {
    if (!brief.forces.length) return '';
    return `
      <div class="section">
        <div class="section-title">Forces du moment <span class="badge badge-real">réel</span></div>
        ${brief.forces.map(f => `<a class="force-card" href="${f.cible}" style="text-decoration:none;">
          <div class="force-icon">${f.icone}</div>
          <div class="force-titre">${f.titre}</div>
          <div class="force-detail">${f.detail}</div>
        </a>`).join('')}
      </div>`;
  }

  function decisionCardHTML(p, i, estPriorite) {
    // Décision prioritaire ouverte par défaut, plus grande (demande de
    // Frédéric, 02/08/2026 soir : "le dirigeant doit savoir immédiatement
    // quelle décision prendre en premier") — les 2 secondaires restent
    // repliées et visuellement plus compactes (classe .secondaire).
    return `
      <div class="decision-card ${ETAT_CLASS[p.etat] || ''} ${estPriorite ? 'priorite open' : 'secondaire'}" id="decision-${i}">
        <div class="decision-head" onclick="document.getElementById('decision-${i}').classList.toggle('open')">
          <span class="decision-rank ${estPriorite ? '' : 'secondaire'}">${estPriorite ? '① PRIORITÉ' : `#${i + 1}`}</span>
          <span class="decision-teaser">${p.teaser}</span>
          <span class="decision-chevron">›</span>
        </div>
        <div class="decision-body">
          <div class="decision-field"><div class="decision-field-label">Ce que j'observe</div><div class="decision-field-text">${p.ceQueJObserve}</div></div>
