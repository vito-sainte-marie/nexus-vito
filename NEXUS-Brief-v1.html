<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>Brief NEXUS — Vue dirigeant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14;
    --panel:#141B22;
    --panel-raised:#1A222C;
    --hairline:#242E38;
    --text:#EDF1F5;
    --text-mid:#8A96A5;
    --text-dim:#57626F;
    --green:#34D399;
    --green-dim:#153629;
    --amber:#F5A623;
    --amber-dim:#3A2E14;
    --red:#F0575A;
    --red-dim:#3A1D1F;
    --cyan:#4FC3D9;
    --gold:#D4AF37; --gold-dim:#332B12;
    --mono:'IBM Plex Mono',monospace;
    --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{
    display:flex; justify-content:center;
    min-height:100vh;
    background-image: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.07), transparent 45%);
  }
  .phone{
    width:100%; max-width:430px; min-height:100vh;
    display:flex; flex-direction:column;
    border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);
   padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  /* HEADER */
  .header{padding:20px 20px 14px; display:flex; align-items:center; gap:12px;}
  .menu-btn{
    margin-left:auto; flex-shrink:0; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .header .logo-frame{
    width:64px; height:64px; border-radius:20px; flex-shrink:0;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--hairline);
  }
  .header .logo{height:44px; width:44px; object-fit:cover; object-position:center; border-radius:12px;}
  .header .id{display:flex; flex-direction:column;}
  .greet{font-size:20px; font-weight:600;}
  .role-badge{
    font-family:var(--mono); font-size:9.5px; padding:2px 8px; border-radius:10px; letter-spacing:0.04em;
    text-transform:uppercase; border:1px solid var(--hairline); color:var(--text-dim); margin-left:8px; vertical-align:middle;
  }
  .station{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-top:3px; letter-spacing:0.02em;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .locked{padding:60px 24px; text-align:center; font-size:14px; color:var(--text-mid); font-family:var(--sans);}

  /* HERO — état global du jour, ton dirigeant */
  .brief-hero{
    margin:14px 20px 6px; padding:30px 22px 26px; border-radius:22px; text-align:center;
    background:radial-gradient(120% 140% at 50% -10%, rgba(212,175,55,0.16), rgba(79,195,217,0.05) 55%, transparent 80%), var(--panel);
    border:1px solid rgba(212,175,55,0.22);
    box-shadow:0 12px 36px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .brief-date{font-family:var(--mono); font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-dim); margin-bottom:16px;}
  .brief-indice-value{font-family:var(--mono); font-size:74px; font-weight:700; line-height:1; text-shadow:0 0 30px currentColor;}
  .brief-indice-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-top:8px;}
  .brief-etat{margin-top:18px; display:inline-flex; align-items:center; gap:9px; font-size:13px; color:var(--text-mid); line-height:1.5; padding:10px 18px; border-radius:22px; background:var(--panel-raised); max-width:100%;}
  .brief-etat-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 10px currentColor;}
  .brief-synthese{margin-top:16px; font-size:14.5px; line-height:1.6; color:var(--text); max-width:320px; margin-left:auto; margin-right:auto;}
  .indice-explain-toggle{margin-top:14px; font-family:var(--mono); font-size:11px; color:var(--cyan); cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .indice-explain-toggle .chev{display:inline-block; transition:0.2s;}
  .indice-explain-wrap.open .indice-explain-toggle .chev{transform:rotate(90deg);}
  .indice-explain{display:none; margin-top:12px; text-align:left; background:var(--panel-raised); border-radius:12px; padding:14px 16px;}
  .indice-explain-wrap.open .indice-explain{display:block;}
  .indice-delta-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .indice-delta-row:last-child{border-bottom:none;}
  .indice-delta-absent{color:var(--text-dim); font-family:var(--mono); font-size:10.5px;}
  .legend-line{padding:0 20px 14px; font-size:10.5px; color:var(--text-dim); line-height:1.6; text-align:center;}

  .plans-loading{padding:36px 20px; text-align:center;}
  .plans-loading-logo{width:38px; height:38px; margin-bottom:12px; animation:nexusSpin 1.3s linear infinite; filter:drop-shadow(0 0 10px rgba(79,195,217,0.4));}
  @keyframes nexusSpin{ to{ transform:rotate(360deg); } }
  .plans-loading-text{font-size:12.5px; color:var(--text-dim);}
  .loading-dots span{animation:loadingDot 1.4s infinite; opacity:0;}
  .loading-dots span:nth-child(2){animation-delay:0.2s;}
  .loading-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes loadingDot{ 0%,80%,100%{opacity:0;} 40%{opacity:1;} }

  /* SECTION generic */
  .section{padding:20px 20px;}
  .section-title{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .section-title .badge{font-family:var(--mono); font-size:9.5px; padding:2px 7px; border-radius:10px; letter-spacing:0.02em;}
  .badge-real{color:var(--green); background:var(--green-dim);}
  .badge-derived{color:var(--cyan); background:rgba(79,195,217,0.12);}
  .badge-estime{color:var(--gold); background:rgba(212,175,55,0.14);}
  .badge-absent{color:var(--text-dim); background:var(--panel-raised);}
  .section-note{font-size:11px; color:var(--text-dim); line-height:1.5; margin-top:10px;}

  /* BOUSSOLE NEXUS — radar 5 axes */
  .boussole-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:18px;
    position:relative; overflow:hidden;
  }
  .boussole-card::before{content:''; position:absolute; top:-40%; left:-20%; width:140%; height:140%; background:radial-gradient(circle, rgba(212,175,55,0.08), transparent 60%); pointer-events:none;}
  .boussole-svg-wrap{display:flex; justify-content:center; margin-bottom:6px;}
  .boussole-svg-wrap svg{width:100%; max-width:280px; height:auto;}
  .axe-block{border-bottom:1px solid var(--hairline);}
  .axe-block:last-child{border-bottom:none;}
  .axe-row{
    display:flex; align-items:center; gap:12px; padding:11px 4px;
    color:inherit; cursor:pointer;
  }
  .axe-row:active{background:var(--panel-raised);}
  .axe-dot{width:11px; height:11px; border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor;}
  .axe-nom{flex:1; font-size:13.5px; font-weight:600;}
  .axe-statut{font-family:var(--mono); font-size:10.5px; text-align:right;}
  .axe-chev{color:var(--text-dim); font-size:14px; flex-shrink:0; transition:0.2s;}
  .axe-block.open .axe-chev{transform:rotate(90deg);}
  .axe-detail{display:none; padding:0 4px 16px;}
  .axe-block.open .axe-detail{display:block;}

  /* FORCES */
  .force-card{
    background:linear-gradient(145deg, var(--gold-dim), rgba(212,175,55,0.04)); border:1px solid rgba(212,175,55,0.35);
    border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:4px; margin-bottom:10px;
  }
  .force-card:last-child{margin-bottom:0;}
  .force-icon{font-size:20px;}
  .force-titre{font-size:13.5px; font-weight:700; color:var(--gold); margin-top:2px;}
  .force-detail{font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .empty-serein{margin:0; padding:18px; text-align:center; font-size:12.5px; color:var(--text-dim); background:var(--panel-raised); border-radius:12px; line-height:1.5;}

  /* DECISIONS */
  .decision-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden; border-left:3px solid var(--hairline);}
  .decision-card:last-child{margin-bottom:0;}
  .decision-card.priorite{
    border-left-width:4px; border-left-color:var(--gold); box-shadow:0 0 0 1px rgba(212,175,55,0.15) inset, 0 8px 24px rgba(212,175,55,0.08);
    background:linear-gradient(145deg, rgba(212,175,55,0.07), var(--panel));
  }
  .decision-card.priorite .decision-head{padding:18px 18px 16px;}
  .decision-card.priorite .decision-teaser{font-size:15.5px; line-height:1.45;}
  .decision-card.priorite .decision-valider{background:var(--gold); color:#241d0c; font-size:13px; padding:13px;}
  .decision-card.secondaire{border-left-width:2px; opacity:0.94;}
  .decision-card.secondaire .decision-head{padding:11px 14px;}
  .decision-card.secondaire .decision-teaser{font-size:12.5px; font-weight:500;}
  .decision-card.secondaire .decision-rank{font-size:9px; padding:2px 7px;}
  .decision-card.etat-agir{border-left-color:#F0575A;}
  .decision-card.etat-opportunite{border-left-color:#34D399;}
  .decision-card.etat-surveiller{border-left-color:#F5A623;}
  .decision-card.etat-recommandation{border-left-color:#4FC3D9;}
  .decision-head{padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px;}
  .decision-rank{font-family:var(--mono); font-size:9.5px; font-weight:700; color:var(--gold); background:rgba(212,175,55,0.12); border-radius:20px; padding:3px 8px; white-space:nowrap;}
  .decision-rank.secondaire{color:var(--text-dim); background:var(--panel-raised);}
  .decision-teaser{flex:1; font-size:13.5px; font-weight:600; line-height:1.4;}
  .decision-chevron{color:var(--text-dim); font-size:14px; transition:0.15s;}
  .decision-card.open .decision-chevron{transform:rotate(90deg);}
  .decision-body{display:none; padding:0 16px 16px;}
  .decision-card.open .decision-body{display:block;}
  .decision-field{margin-top:12px;}
  .decision-field-label{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:3px;}
  .decision-field-text{font-size:12.5px; line-height:1.65; color:var(--text-mid);}
  .decision-field-text b{color:var(--text); font-weight:600;}
  .decision-chips{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .decision-chip{font-family:var(--mono); font-size:10px; padding:4px 10px; border-radius:14px; background:var(--panel-raised); color:var(--text-mid); border:1px solid var(--hairline);}
  .decision-chip.confiance-eleve{color:var(--green); border-color:rgba(52,211,153,0.3);}
  .decision-chip.confiance-moyen{color:var(--amber); border-color:rgba(245,166,35,0.3);}
  .decision-valider, .decision-fait{width:100%; margin-top:14px; padding:11px; border:none; border-radius:8px; font-size:12.5px; font-weight:600; background:var(--green); color:#04141a; cursor:pointer;}
  .decision-valider:disabled, .decision-fait:disabled{opacity:0.85; cursor:default;}
  .decision-lien{display:block; text-align:center; margin-top:14px; padding:11px; border:1px solid var(--hairline); border-radius:8px; color:var(--cyan); font-family:var(--mono); font-size:11.5px; text-decoration:none;}
  /* Confirmation optimiste (10/08/2026, correction du bug signalé par
     Frédéric : "le bouton Accepter cette décision ne fonctionne pas") —
     l'écriture réseau réussissait déjà (vérifié directement en base), mais
     rien ne le montrait avant la fin du rechargement complet du Brief
     (plusieurs appels réseau) : le clic paraissait sans effet, et un
     rechargement manuel impatient pendant ce délai pouvait donner
     l'impression que la décision "revenait". La carte se grise et se
     confirme visuellement dès le clic, avant même la fin de l'écriture. */
  .decision-card.valide-optimiste{opacity:0.55; pointer-events:none;}
  .caisse-justifie-row{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:11.5px; color:var(--text-dim); cursor:pointer;}

  /* WATCHLIST */
  .watch-item{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--hairline); text-decoration:none; color:inherit;}
  .watch-item:last-child{border-bottom:none;}
  .watch-dot{width:8px; height:8px; border-radius:50%; background:var(--amber); flex-shrink:0; margin-top:5px; box-shadow:0 0 8px rgba(245,166,35,0.6);}
  .watch-text{flex:1; font-size:12.5px; line-height:1.55; color:var(--text-mid);}
  .watch-text b{color:var(--text); font-weight:600;}
  .watch-chev{color:var(--text-dim); font-size:13px; margin-top:3px;}

  /* IMPACT */
  .impact-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .impact-card{border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:4px;}
  .impact-card.gain{background:var(--green-dim); border:1px solid rgba(52,211,153,0.25);}
  .impact-card.risque{background:var(--red-dim); border:1px solid rgba(240,87,90,0.3);}
  .impact-value{font-family:var(--mono); font-size:22px; font-weight:700;}
  .impact-card.gain .impact-value{color:var(--green);}
  .impact-card.risque .impact-value{color:var(--red);}
  .impact-label{font-size:11px; color:var(--text-mid); line-height:1.4;}
  .impact-meta-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .impact-meta-row:last-child{border-bottom:none;}
  .impact-meta-label{color:var(--text-dim);}
  .impact-meta-val{font-family:var(--mono); font-weight:600;}

  footer{padding:24px 20px 32px; text-align:center; font-family:var(--mono); font-size:10px; color:var(--text-dim); letter-spacing:0.03em;}

  /* Rapport PDF (10/08/2026) — mêmes classes que NEXUS-FDJ-Analyse-v1.html
     (moteur PDF partagé, même identité visuelle sur tous les rapports
     NEXUS, Article 11). */
  .rapport-titre{font-size:16px; font-weight:700;}
  .rapport-sous{font-size:11.5px; color:var(--text-mid); margin-top:4px;}
  .btn-rapport-pdf{display:block; width:100%; margin:14px 0 8px; padding:13px; border-radius:10px; border:none; background:var(--cyan); color:#0B0F14; font-family:var(--sans); font-size:13.5px; font-weight:700; cursor:pointer;}
  .btn-rapport-pdf:disabled{opacity:0.55; cursor:default;}
  .btn-rapport-pdf.secondaire{background:var(--panel-raised); color:var(--text); border:1px solid var(--hairline);}
  .rapport-actions{display:flex; gap:8px;}
  .rapport-actions .btn-rapport-pdf{margin:14px 0 0;}
  .btn-lien{display:block; width:100%; margin:10px 0 8px; padding:6px; border:none; background:none; color:var(--text-dim); font-family:var(--sans); font-size:11.5px; text-decoration:underline; cursor:pointer;}
  .statut-rapport{font-size:11.5px; color:var(--text-mid); text-align:center; margin-top:8px; min-height:14px; line-height:1.5;}
  .statut-rapport.statut-pret{color:var(--green);}
  .statut-rapport.statut-erreur{color:var(--red);}
  .statut-detail{font-family:var(--mono); font-size:10px; color:var(--text-dim);}
</style>
</head>
<body>
<div class="phone">
  <div class="header" id="nexus-header"></div>
  <div class="divider"></div>
  <div id="briefRoot">
    <div class="plans-loading">
      <img class="plans-loading-logo" src="nexus-avatar.png" alt="">
      <div class="plans-loading-text">NEXUS agrège vos moteurs<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
  </div>
  <footer>NEXUS Brief · synthèse dirigeant · agrège Produits, Marge+, Tempo, Verify, Stock, Inventaire, Missions, Équipe</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-forfait.js"></script>
<script src="nexus-desktop.js"></script>
<script src="nexus-periodes.js"></script>
<script src="nexus-indice.js"></script>
<script src="nexus-marge.js"></script>
<script src="nexus-tempo.js"></script>
<script src="nexus-stock.js"></script>
<script src="nexus-fdj-moteur.js"></script>
<script src="nexus-coach-fdj-moteur.js"></script>
<script src="nexus-boussole-moteur.js"></script>
<script src="nexus-carburant-moteur.js"></script>
<script src="nexus-carburant-donnees.js"></script>
<script src="nexus-secteurs-catalogue.js"></script>
<script src="nexus-secteurs-moteur.js"></script>
<script src="nexus-conseiller.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="nexus-pdf-moteur.js"></script>
<script>
  // ============================================================
  // NEXUS Brief — synthèse à l'attention du dirigeant (02/08/2026, demande
  // de Frédéric) : "cette page fera appel à toute ta puissance... tu devras
  // puiser dans tous les moteurs de NEXUS, toutes ses ressources sans
  // exception." Cette page n'introduit AUCUN nouveau calcul métier — elle
  // appelle les moteurs partagés déjà en production (NexusPeriodes,
  // NexusIndice, NexusMarge, NexusTempo, NexusStock, NexusConseiller) et les
  // mêmes requêtes déjà validées dans NEXUS-App-v1.html / NEXUS-Cockpit-v2.html,
  // pour ne jamais diverger de ce que ces écrans affichent déjà. Sa valeur
  // ajoutée est la SYNTHÈSE : un tri de priorité partagé entre les 7 moteurs
  // (NexusConseiller.fusionnerEtSelectionner), une Boussole NEXUS à 5 axes,
  // et une structure de décision en 8 champs — jamais un chiffre inventé
  // (Article 5 de la Constitution NEXUS) : toute case affiche honnêtement
  // "Donnée insuffisante" plutôt qu'une fausse valeur par défaut.
  //
  // Feuille de route (cadrage fourni par Frédéric, 02/08/2026) : ce fichier
  // livre la Phase 1 (brief statique agrégé, indicateurs fiables) et une
  // bonne partie des Phases 2-3 (moteur de priorité déjà partagé via
  // nexus-conseiller.js, structure Conseiller à 8 champs). Les Phases 4-5
  // (preuves entièrement traçables avec historique de consultation, mémoire
  // d'impact des décisions dans le temps) restent un chantier à part —
  // notées en fin de fichier plutôt que bâclées sous pression de temps.
  // ============================================================

  const ETAT_CLASS = {
    "🔥 À AGIR": "etat-agir", "📈 OPPORTUNITÉ": "etat-opportunite",
    "🟡 À SURVEILLER": "etat-surveiller", "💡 RECOMMANDATION": "etat-recommandation",
    "🔴 CRITIQUE": "etat-agir", "🟡 À VÉRIFIER": "etat-surveiller",
    "📦 À COMPTER": "etat-surveiller", "⚠️ RAPPEL EN RETARD": "etat-agir",
    "📌 RAPPEL": "etat-recommandation", "🗓️ TEMPO": "etat-recommandation",
    "📋 SIGNAL": "etat-recommandation",
  };
  const MOTEUR_LABEL = { produits: 'Produits', marge: 'Marge+', tempo: 'Tempo', advisor: 'Signal', caisse: 'Caisse', stock: 'Stock', rappel: 'Rappel', fdj: 'FDJ', coach: 'Coach FDJ' };
  const MOTEUR_SOURCE = {
    produits: 'des ventes réelles importées (Produits)', marge: 'la comparaison de marge entre produits comparables (Marge+)',
    tempo: 'l’historique de caisse par jour de semaine (Tempo)', advisor: 'la détection Qualité/Caisse automatique',
    caisse: 'un audit de caisse réel (Verify)', stock: 'les relevés de stock (Scanner Stock)', rappel: 'un rappel ajouté manuellement',
    fdj: 'le stock et les comptages de quart FDJ réels (FDJ Pilotage)',
    coach: 'les recommandations Coach FDJ déjà générées pour chaque employé (Coach FDJ)',
  };
  const COULEUR_STATUT_DOMAINE = {
    'En progression': 'var(--green)', 'Sous contrôle': 'var(--green)', 'Stable': 'var(--text-mid)',

  async function fetchAllRows(builderFactory, pageSize = 1000) {
    let toutes = [];
    let from = 0;
    while (true) {
      const { data, error } = await builderFactory().range(from, from + pageSize - 1);
      if (error) return { data: null, error };
      toutes = toutes.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    return { data: toutes, error: null };
  }

  async function chargerMargePlus(rowsBrut) {
    const { periodeAffichage, rowsAffichage } = NexusPeriodes.analyserPeriodes(rowsBrut);

    const [exclusionsRes, valideesRes] = await Promise.all([

      nexusClient.from('journal_decisions').select('candidate_id').eq('site', SITE_ACTUEL).eq('rule_id', 'R5-MARGE-ECART'),
    ]);
    const rowsPropres = rowsAffichage.filter(r => (r.ca || 0) > 0 && (r.marge || 0) >= 0 && (r.marge || 0) <= (r.ca || 0));
    const exclusionsManuelles = new Set(((exclusionsRes && exclusionsRes.data) || []).map(r => r.article));
    const valideesMarge = new Set(((valideesRes && valideesRes.data) || []).map(d => d.candidate_id));
    const ecarts = NexusMarge.detecterEcartsMarge(rowsPropres, exclusionsManuelles)
      .filter(e => !valideesMarge.has(`LIVE-R5-${e.categorie}|${e.article}`));
    const meilleur = ecarts[0];
    const candidatTop = meilleur ? {
      candidate_id: `LIVE-R5-${meilleur.categorie}|${meilleur.article}`, etat: '💡 RECOMMANDATION',
      article: meilleur.article, categorie: meilleur.categorie, impact_eur: meilleur.gainPotentiel,

      analyse: `Cet écart peut venir d'un prix d'achat renégocié, d'une remise non répercutée, ou d'un choix délibéré — à vérifier avant d'ajuster quoi que ce soit.`,
      recommandation: `Vérifiez si le prix d'achat ou de vente de ${meilleur.article} peut se rapprocher de la marge médiane de son groupe.`,
      impact: `Si aligné sur la médiane du groupe, gain potentiel estimé à environ ${Math.round(meilleur.gainPotentiel).toLocaleString('fr-FR')} € sur cette période — une hypothèse, pas une garantie.`,
      ca_reference: meilleur.ca, periode_reference_debut: periodeAffichage.debut, periode_reference_fin: periodeAffichage.fin,
    } : null;
    return { nbEcarts: ecarts.length, gainPotentiel: ecarts.reduce((s, e) => s + e.gainPotentiel, 0), candidatTop };
  }

  // Constat NEXUS Tempo — repris à l'identique de chargerConstatTempoHome().
  async function chargerConstatTempo() {
    const [{ data, error }, produitsRes] = await Promise.all([
      fetchAllRows(() => nexusClient.from('audits_caisse')
        .select('date, quart, vente_piste, vente_boutique, ecart_piste, ecart_boutique, employes_piste, employes_boutique')
        .eq('site', SITE_ACTUEL).order('date', { ascending: true })),
      fetchAllRows(() => nexusClient.from('products').select('categorie, article, ca, periode_debut, periode_fin').eq('site', SITE_ACTUEL)),
    ]);
    if (error || !data) {
      console.error('Chargement audits_caisse (constat Tempo, Brief):', error);
      return { jourARenforcer: null, jourMoteur: null, jourPlusRentable: null, jourProgression: null, totalJours: 0, statutOperations: 'Données insuffisantes', detailOperations: null };
    }
    const joursAgreges = NexusTempo.agregerParJour(data);
    const totalJours = joursAgreges.length;
    const joursExploitables = NexusTempo.filtrerJoursClos(joursAgreges);
    const periodesProduitsAppel = NexusTempo.calculerPeriodesProduitsAppel(produitsRes && produitsRes.error ? [] : (produitsRes.data || []), estProduitAppel);
    const joursValorises = NexusTempo.attribuerValorisationBoutique(joursExploitables, periodesProduitsAppel);
    const regroupement = NexusTempo.regrouperParJourSemaine(joursValorises);
    const classement = NexusTempo.calculerClassement(regroupement);
    const { jourARenforcer, jourMoteur: jourMoteurBrut, jourProgression: jourProgressionBrut } = NexusTempo.identifierJoursReveles(classement);
    const jourPlusRentableBrut = NexusTempo.identifierJourPlusRentable(classement);
    const SEUIL_CONSTAT_TEMPO = -0.10;
    const jourARenforcerRetenu = (!jourARenforcer || !jourARenforcer.confianceTendance || jourARenforcer.evolutionCombinee === null || jourARenforcer.evolutionCombinee > SEUIL_CONSTAT_TEMPO) ? null : jourARenforcer;
    const jourMoteur = (jourMoteurBrut && jourMoteurBrut.confianceTendance) ? jourMoteurBrut : null;
    const jourPlusRentable = (jourPlusRentableBrut && jourPlusRentableBrut.nbOccValorisation > 0) ? jourPlusRentableBrut : null;
    const jourProgression = (jourProgressionBrut && jourProgressionBrut.confianceTendance) ? jourProgressionBrut : null;
    const detailOperations = totalJours > 0 ? joursAgreges.reduce((s, j) => s + Math.abs(j.ecartPiste) + Math.abs(j.ecartBoutique), 0) / totalJours : null;
    const statutOperationsVal = calculerStatutOperations(detailOperations, totalJours);
    return { jourARenforcer: jourARenforcerRetenu, jourMoteur, jourPlusRentable, jourProgression, totalJours, statutOperations: statutOperationsVal, detailOperations };
  }

  // Candidat Tempo enrichi pour le Conseiller — repris à l'identique de
  // construireCandidatTempoHome() dans NEXUS-App-v1.html.
  function construireCandidatTempo(constatTempo) {
    const { jourPlusRentable, jourMoteur, jourARenforcer, jourProgression } = constatTempo;
    const jourCible = jourPlusRentable || jourMoteur;
    if (!jourCible) return null;
    const fmt = v => `${Math.round(v).toLocaleString('fr-FR')} €`;
    const fmtPct = v => `${v >= 0 ? '+' : ''}${(v * 100).toFixed(1).replace('.', ',')} %`;
    const majuscule = s => s.charAt(0).toUpperCase() + s.slice(1);
    const diverge = !!(jourPlusRentable && jourMoteur && jourPlusRentable.jourSemaine !== jourMoteur.jourSemaine);
    let pourquoi = `Le ${jourCible.nom} est actuellement la journée qui crée le plus de valeur pour votre station.`;
    let pourquoiBullets = null, pourquoiPasAutre = null;
    if (jourPlusRentable) {
      pourquoiBullets = [
        `Meilleure performance piste : ${fmt(jourPlusRentable.moyennePisteValorisation)}`,
        `Meilleure estimation de valeur : ${fmt(jourPlusRentable.moyenneCombineeValorisee)}`,
        `Données issues de ${jourPlusRentable.nbOccValorisation} journée${jourPlusRentable.nbOccValorisation > 1 ? 's' : ''} exploitable${jourPlusRentable.nbOccValorisation > 1 ? 's' : ''}`,
      ];
    }
    if (diverge) {
      pourquoi += ` Le ${jourMoteur.nom} génère davantage de chiffre d'affaires brut, mais une part importante provient de produits d'appel à faible contribution.`;
      pourquoiPasAutre = { titre: `Pourquoi pas le ${jourMoteur.nom} ?`, texte: `Le chiffre d'affaires boutique y est supérieur (${fmt(jourMoteur.moyenneBoutique)}), mais il est fortement influencé par des produits d'appel. Ces ventes génèrent beaucoup de trafic mais relativement peu de valeur.` };
    } else if (jourPlusRentable) {
      pourquoi += ` Cette estimation reste cohérente une fois les produits d'appel retirés du calcul.`;
    }
    let limites = null;
    if (jourMoteur && jourMoteur.nbOccValorisation === 0 && jourMoteur.occurrences && jourMoteur.occurrences.length > 0) {
      limites = `Le ${jourMoteur.nom} n'a pas encore été entièrement valorisé — le calcul sera actualisé au prochain import.`;
    }
    return {
      jourCible, decision: `Concentrez vos prochaines actions commerciales le ${jourCible.nom}.`,
      pourquoi, pourquoiBullets, pourquoiPasAutre,
      impactAttendu: `En privilégiant le ${jourCible.nom} pour vos animations et mises en avant, vous exploitez la journée offrant aujourd'hui le meilleur potentiel économique.`,
      limites,
    };
  }

  async function chargerDerniereReferenceFdj() {

      .order('date', { ascending: false }).order('created_at', { ascending: false }).limit(1).maybeSingle();

  // Carburants (11/08/2026, Phase 1 de la montée en puissance de NEXUS
  // Carburants demandée par Frédéric) : résumé condensé, PAS intégré au
  // classement cross-moteurs ci-dessus (fusionnerEtSelectionner) — une
  // carte autonome, sur le modèle exact donné par Frédéric ("⛽ Carburants
  // — À surveiller / GO : écart de −186 L ce matin. / Voir le détail →"),
  // pas une compétition avec les 3 décisions prioritaires. Réutilise TEL
  // QUEL nexus-carburant-moteur.js/nexus-carburant-donnees.js — jamais un
  // recalcul local du statut ou de l'évolution (Article 11).
  async function chargerCarburantsBrief() {
    const aujourdhui = new Date().toISOString().slice(0, 10);
    // 7 derniers jours glissants vs les 7 jours précédents — PAS la semaine
    // calendaire (lundi→dimanche) : une semaine calendaire en cours (ex.
    // mardi) n'aurait que 2 jours de données face à 7 jours pour la
    // référence, ce qui fabriquerait une "évolution" massivement négative
    // sans rapport avec la réalité. Même convention que
    // chargerCandidatsFdj() ci-dessous, dans ce même fichier — toujours
    // comparer des fenêtres de durée égale.
    const finActuelle = new Date(); finActuelle.setHours(23, 59, 59, 999);
    const debutActuelle = new Date(finActuelle); debutActuelle.setDate(debutActuelle.getDate() - 6);
    const finPrecedente = new Date(debutActuelle); finPrecedente.setDate(finPrecedente.getDate() - 1);
    const debutPrecedente = new Date(finPrecedente); debutPrecedente.setDate(debutPrecedente.getDate() - 6);
    const iso = d => d.toISOString().slice(0, 10);

    const [controle, actuel, reference] = await Promise.all([
      NexusCarburantDonnees.chargerControleJour(nexusClient, SITE_ACTUEL, aujourdhui),
      NexusCarburantDonnees.chargerVentesPeriode(nexusClient, SITE_ACTUEL, iso(debutActuelle), iso(finActuelle)),
      NexusCarburantDonnees.chargerVentesPeriode(nexusClient, SITE_ACTUEL, iso(debutPrecedente), iso(finPrecedente)),
    ]);
    const M = NexusCarburantMoteur;
    const mix = M.calculerMixCarburant(actuel.ventes);
    const mixRef = M.calculerMixCarburant(reference.ventes);
    const evolution = mix && mixRef ? M.calculerEvolutionVolume(mix.total, mixRef.total) : null;
    const produitMoteur = M.identifierProduitMoteur(actuel.ventes);
    return { controle, volumeSemaine: mix ? mix.total : null, evolution, produitMoteur };
  }

  async function chargerCandidatsFdj() {
    const finActuelle = new Date(); finActuelle.setHours(23, 59, 59, 999);
    const debutActuelle = new Date(finActuelle); debutActuelle.setDate(debutActuelle.getDate() - 6); debutActuelle.setHours(0, 0, 0, 0);
    const finComp = new Date(debutActuelle); finComp.setDate(finComp.getDate() - 1); finComp.setHours(23, 59, 59, 999);
    const debutComp = new Date(finComp); debutComp.setDate(debutComp.getDate() - 6); debutComp.setHours(0, 0, 0, 0);
    const iso = d => d.toISOString().slice(0, 10);

    const [{ data: jeuxData, error: e1 }, { data: dailyRows, error: e2 }, { data: gameDailyRows, error: e3 },
      { data: emplacements, error: e4 }, { data: mouvements, error: e5 }, reference] = await Promise.all([
      nexusClient.from('fdj_games').select('id, nom').eq('site', SITE_ACTUEL).eq('actif', true),
      nexusClient.from('view_fdj_daily_summary').select('*').eq('site', SITE_ACTUEL).gte('date', iso(debutComp)).lte('date', iso(finActuelle)),
      nexusClient.from('view_fdj_game_daily').select('game_id, ca, date').eq('site', SITE_ACTUEL).gte('date', iso(debutActuelle)).lte('date', iso(finActuelle)),
      nexusClient.from('fdj_locations').select('id, type').eq('site', SITE_ACTUEL).eq('actif', true),
      nexusClient.from('fdj_stock_movements').select('type_mouvement, quantite, game_id, location_source_id, location_destination_id, created_at').eq('site', SITE_ACTUEL),
      chargerDerniereReferenceFdj(),
    ]);
    if (e1 || e2 || e3 || e4 || e5) { [e1, e2, e3, e4, e5].forEach(e => { if (e) console.error('Chargement données FDJ (Brief):', e); }); return { candidats: [], resume: null }; }
    if (!jeuxData || !jeuxData.length) return { candidats: [], resume: null };

    const champs = ['ca_grattage', 'nb_ecarts_non_nuls', 'nb_quarts_controles'];
    const sommer = lignes => champs.reduce((acc, c) => { acc[c] = (lignes || []).reduce((s, l) => s + (l[c] != null ? Number(l[c]) : 0), 0); return acc; }, {});
    const actuelRows = (dailyRows || []).filter(r => r.date >= iso(debutActuelle));
    const compRows = (dailyRows || []).filter(r => r.date < iso(debutActuelle));
    const actuel = sommer(actuelRows);
    const comp = sommer(compRows);
    const evolCa = comp.nb_quarts_controles > 0 && comp.ca_grattage > 0 ? (actuel.ca_grattage - comp.ca_grattage) / comp.ca_grattage : null;

    const gameCa = {};
    (gameDailyRows || []).forEach(l => { if (l.ca) gameCa[l.game_id] = (gameCa[l.game_id] || 0) + Number(l.ca); });
    let jeuMoteur = null, caMax = 0;
    Object.entries(gameCa).forEach(([gid, ca]) => { if (ca > caMax) { caMax = ca; jeuMoteur = { id: gid, nom: (jeuxData.find(j => j.id === gid) || {}).nom || gid }; } });

    const locations = {};
    (emplacements || []).forEach(e => { locations[e.type] = e.id; });
    const soldes = NexusFdjMoteur.soldesCarnetsAvecReference(mouvements || [], locations, reference);

    const candidatsBrut = NexusFdjMoteur.calculerCandidatsFdj({
      soldes, jeux: jeuxData.map(j => ({ id: j.id, nom: j.nom })),
      actuel, evolCa, jeuMoteur,
      labelPeriode: '7 derniers jours', labelComp: '7 jours précédents',
      periodeCle: iso(debutActuelle),
    });
    // resume (11/08/2026, secteur FDJ du Brief V3) : ces mêmes nombres
    // (actuel.ca_grattage, evolCa, jeuMoteur, nb_ecarts_non_nuls) servaient
    // déjà à calculer candidatsBrut ci-dessus mais n'étaient jusqu'ici pas
    // retournés à l'appelant — ajout additif pour que
    // NexusSecteursMoteur.construireSecteurs (Article 11, aucun second
    // calcul) puisse construire le secteur FDJ du Bloc B sans réinterroger
    // Supabase une deuxième fois pour les mêmes lignes.
    return {
      candidats: candidatsBrut.map(NexusConseiller.normaliserFdj),
      resume: {
        caGrattage: actuel.ca_grattage, evolutionCa: evolCa, jeuMoteur,
        nbEcarts: actuel.nb_ecarts_non_nuls, nbQuartsControles: actuel.nb_quarts_controles,
      },
    };
  }

  // Paramétrage FDJ du site (10/08/2026, audit "Paramétrage autonome &
  // multi-site" §17) : les seuils déclencheurs de calculerCandidatsCoachEquipe
  // viennent désormais de fdj_site_settings plutôt que d'être identiques
  // pour tous les sites. Absence de ligne -> repli sur les mêmes valeurs
  // que l'ancien comportement (voir NexusCoachFdj.SEUILS_COACH_EQUIPE_DEFAUT).
  async function chargerSeuilsCoachEquipeFdj() {
    const { data, error } = await nexusClient.from('fdj_site_settings').select('coach_seuil_risque_recurrent, coach_seuil_axe_equipe, coach_seuil_progres_base, coach_seuil_progres_baisse').eq('site', SITE_ACTUEL).maybeSingle();
    if (error) { console.error('Chargement paramètres FDJ site (seuils Coach):', error); return undefined; }
    if (!data) return undefined;
    return {
      risqueRecurrent: data.coach_seuil_risque_recurrent,
      axeEquipe: data.coach_seuil_axe_equipe,

      progresBaisse: data.coach_seuil_progres_baisse,
    };
