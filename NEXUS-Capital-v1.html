<html lang="fr">
<head>
<meta charset="UTF-8">

<title>NEXUS — Capital NEXUS</title>

<style>
:root{
  --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
  --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
  --green:#34D399; --green-dim:#153629;
  --amber:#F5A623; --amber-dim:#3A2E14;
  --cyan:#4FC3D9; --cyan-dim:#123138;
  --violet:#8B7FE8; --violet-dim:#241F3D;
  --gold:#D4AF37; --gold-dim:#332B12;
  --red:#F0575A; --red-dim:#3A1D1F;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); font-family:var(--sans); color:var(--text); min-height:100vh;}
body{display:flex; justify-content:center; background-image:radial-gradient(circle at 50% 0%, rgba(79,195,217,0.07), transparent 45%);}
a{color:inherit; text-decoration:none;}

.app{width:100%; max-width:520px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-bottom:78px; position:relative;}

.topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 20px 16px;}
.icon-btn{width:38px; height:38px; border-radius:10px; background:var(--panel); border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text-mid); flex-shrink:0;}
.topbar-title{text-align:center; flex:1;}
.topbar-title h1{font-size:19px; font-weight:600;}
.topbar-title p{font-family:var(--mono); font-size:11px; color:var(--text-mid); margin-top:2px; letter-spacing:0.02em;}
.topbar-title p .plan-tag{color:var(--gold); opacity:0.85;}
.topbar-actions{display:flex; gap:8px;}

.section{padding:0 20px;}
.section-label{
  font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim);
  display:flex; align-items:center; gap:10px; margin:26px 0 12px;
}
.section-label::after{content:''; flex:1; height:1px; background:var(--hairline);}
.section-label .link{color:var(--cyan); text-transform:none; letter-spacing:0; font-size:12px; margin-left:auto; flex:none;}

.capital-panel{
  background:var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:22px 22px 20px; margin:0 20px;
  position:relative; overflow:hidden;
}
.capital-eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.14em; color:var(--gold); text-transform:uppercase; display:flex; align-items:center; gap:6px;}
.capital-info{margin-left:auto; width:20px; height:20px; border-radius:50%; border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-dim); cursor:default;}
.capital-row-top{display:flex; align-items:center;}
.capital-amount{font-family:var(--sans); font-size:44px; font-weight:700; color:var(--gold); margin-top:10px; letter-spacing:-0.01em; text-shadow:0 0 22px rgba(212,175,55,0.3);}
.capital-sub{font-size:14px; font-weight:600; margin-top:2px;}
.capital-desc{font-size:12px; color:var(--text-mid); margin-top:8px; line-height:1.5; max-width:60%;}
.capital-chart{position:absolute; right:18px; top:56px; width:150px; height:70px;}
.capital-badge{
  display:inline-flex; align-items:center; gap:6px; margin-top:16px; font-family:var(--mono); font-size:11.5px;
  background:var(--green-dim); color:var(--green); padding:6px 12px; border-radius:20px; font-weight:600;
}
.capital-badge.baisse{background:var(--red-dim); color:var(--red);}

.levers-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.lever-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px;}
.lever-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:12px;}
.lever-title{font-size:12.5px; color:var(--text-mid); line-height:1.35; margin-bottom:10px; min-height:34px;}
.lever-amount{font-family:var(--sans); font-size:19px; font-weight:700;}
.lever-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:3px;}

.decision-item{display:flex; align-items:center; gap:14px; padding:14px; background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px;}
.decision-rank{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:700; flex-shrink:0;}
.rank-1{background:var(--amber-dim); color:var(--amber);}
.rank-2{background:var(--panel-raised); color:var(--text-mid);}
.rank-3{background:var(--red-dim); color:#D98A85;}
.decision-body{flex:1; min-width:0;}
.decision-title{font-size:13.5px; font-weight:600;}
.decision-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:2px;}
.decision-amount{font-size:14.5px; font-weight:700; color:var(--green); flex-shrink:0;}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.mini-panel{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px;}
.mini-label{font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-mid); margin-bottom:10px;}
.mini-label.amber{color:var(--amber);}
.opp-number{font-size:30px; font-weight:700; color:var(--amber);}
.opp-desc{font-size:11px; color:var(--text-mid); margin-top:4px; line-height:1.4;}
.opp-potential{font-size:15px; font-weight:700; color:var(--amber); margin-top:10px;}
.mini-empty{font-size:11.5px; color:var(--text-dim); line-height:1.5; padding:6px 0;}

.advisor-panel{display:flex; gap:14px; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:18px;}
.advisor-avatar{width:44px; height:44px; border-radius:50%; background:var(--panel-raised); border:1.5px solid rgba(79,195,217,0.4); flex-shrink:0; overflow:hidden;}
.advisor-avatar img{width:100%; height:100%; object-fit:cover;}
.advisor-body .advisor-title{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--cyan); margin-bottom:8px;}
.advisor-body p{font-size:13px; line-height:1.55; color:var(--text);}

.journal-day{margin-bottom:16px;}
.journal-date{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px;}
.journal-entry{display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; margin-bottom:8px;}
.journal-check{color:var(--green); font-size:14px; flex-shrink:0;}
.journal-text{flex:1; font-size:12.5px; line-height:1.4;}
.journal-amount{font-size:13.5px; font-weight:700; color:var(--green); flex-shrink:0;}
.journal-summary{
  background:var(--cyan-dim); border:1px solid rgba(79,195,217,0.3); border-radius:12px; padding:14px 16px; margin-top:6px;
  font-size:12.5px; color:var(--text); line-height:1.5;
}
.journal-summary b{color:var(--cyan);}
.journal-empty{font-size:12px; color:var(--text-mid); line-height:1.5;}

.cta-panel{background:var(--panel); border:1px solid rgba(79,195,217,0.35); border-radius:14px; padding:20px; text-align:center;}
.cta-panel .ct{font-size:14.5px; font-weight:600;}
.cta-panel .cd{font-size:12px; color:var(--text-mid); margin-top:8px; line-height:1.5;}
.cta-btn{display:inline-block; margin-top:14px; font-family:var(--mono); font-size:11.5px; font-weight:600; color:#06181C; background:var(--cyan); padding:10px 18px; border-radius:8px;}

.disclaimer{font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; line-height:1.6; padding:20px 20px 8px;}
.loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  background:rgba(20,27,34,0.95); backdrop-filter:blur(8px); border-top:1px solid var(--hairline);
  display:flex; padding:10px 8px 14px;
}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; color:var(--text-dim);}
.tab.active{color:var(--cyan);}
.tab .tab-icon{font-size:19px;}
.tab .tab-label{font-family:var(--mono); font-size:9.5px; letter-spacing:0.02em;}
</style>

<script>
  // ============================================================
  // Capital NEXUS™ — lancé officiellement le 24/07/2026 pour Vito
  // Sainte-Marie (offre NEXUS Professional). Jusqu'ici cette page était une
  // pure démonstration (chiffres fixes, bandeau "DÉMONSTRATION"). Elle est
  // désormais entièrement calculée à partir de journal_decisions : chaque
  // décision validée dans NEXUS (Cockpit R2/R3/R4, Nexus Marge+ R5,
  // Conseiller de l'accueil) y écrit déjà une ligne avec impact_eur.
  //
  // Important pour rester honnête (Constitution NEXUS, article 5) :
  // impact_eur est une ESTIMATION prise au moment de la validation, pas un
  // gain vérifié après coup — NEXUS n'a aujourd'hui aucune boucle de retour
  // qui confirme que l'action a été faite et a réellement produit ce
  // résultat. Le vocabulaire de cette page doit donc toujours parler de
  // "valeur identifiée" ou "estimée", jamais "d'argent gagné". Pour la même
  // raison, l'ancien panneau ROI (coût abonnement vs valeur créée) a été
  // retiré : NEXUS ne connaît pas le prix réellement facturé à ce site, et
  // en inventer un violerait ce même principe. Il pourra être réactivé le
  // jour où ce prix sera configuré quelque part (voir la conversation avec
  // Frédéric du 24/07/2026 sur les offres Essential / Professional).
  //
  // De même, l'ancien panneau "Fiabilité des estimations" (92%) a été
  // supprimé : aucune donnée ne permet de calculer un taux de fiabilité
  // réel tant qu'il n'existe pas de vérification après coup.
  // ============================================================

  let SITE_ACTUEL = 'vito-sainte-marie';

  function fetchAllRowsCapital(builderFactory, pageSize = 1000) {
    return (async () => {
      let toutes = [];
      let from = 0;
      while (true) {
        const { data, error } = await builderFactory().range(from, from + pageSize - 1);
        if (error) return { data: null, error };
        toutes = toutes.concat(data || []);
        if (!data || data.length < pageSize) break;
        from += pageSize;
      }
      return { data: toutes, error: null };
    })();
  }

  async function chargerJournalDecisions(siteId) {
    const { data, error } = await fetchAllRowsCapital(() => nexusClient
      .from('journal_decisions')
      .select('candidate_id, rule_id, etat, recommandation, impact_eur, article, categorie, date, heure')
      .eq('site', siteId)
      .order('date', { ascending: true })
      .order('heure', { ascending: true }));
    if (error) { console.error('Chargement journal_decisions (Capital):', error); return []; }
    return data || [];
  }

  // Reproduit les seuils R2/R3/R4 (Cockpit) + R5 (Nexus Marge+) pour savoir
  // combien de recommandations restent en attente et quel potentiel elles
  // représentent — même moteur que NEXUS-App-v1.html, volontairement
  // allégé ici : seuls le compte et le total sont nécessaires, pas le texte
  // de chaque recommandation.
  async function chargerOpportunitesNonAppliquees(siteId) {
    const [{ data, error }, produitsAppelRes, exclusionsRes, valideesRes] = await Promise.all([
      fetchAllRowsCapital(() => nexusClient.from('products')
        .select('categorie, article, ca, marge, periode_debut, periode_fin')
        .eq('site', siteId)
        .order('periode_debut', { ascending: false })
        .order('article', { ascending: true })),
      nexusClient.from('produits_appel').select('article').eq('site', siteId),
      nexusClient.from('marge_exceptions').select('article').eq('site', siteId),
      nexusClient.from('journal_decisions').select('candidate_id').eq('site', siteId),
    ]);
    if (error || !data || !data.length) return { nb: 0, potentiel: 0, topCategorie: null };

    const produitsAppel = new Set(((produitsAppelRes && produitsAppelRes.data) || []).map(r => r.article));
    const rowsBrut = data.filter(r => !produitsAppel.has(r.article));
    const { periodeAffichage, rowsAffichage, paire, rowsPaireActuelle, rowsPairePrecedente } = NexusPeriodes.analyserPeriodes(rowsBrut);
    if (!periodeAffichage) return { nb: 0, potentiel: 0, topCategorie: null };

    const validees = new Set(((valideesRes && valideesRes.data) || []).map(d => d.candidate_id));
    const candidats = [];

    const caTotalParRayon = {};
    rowsAffichage.forEach(r => { caTotalParRayon[r.categorie] = (caTotalParRayon[r.categorie] || 0) + (r.ca || 0); });
    rowsAffichage.forEach(p => {
      const caRayon = caTotalParRayon[p.categorie] || 0;
      const contribution = caRayon > 0 ? p.ca / caRayon : 0;
      if (contribution >= 0.15 && p.ca > 0) {
        candidats.push({ candidate_id: `LIVE-R4-${p.categorie}|${p.article}`, categorie: p.categorie, impact_eur: p.ca });
      }
    });
    if (paire) {
      const precedentParArticle = {};
      rowsPairePrecedente.forEach(r => {
        const cle = r.categorie + '|' + r.article;
        precedentParArticle[cle] = (precedentParArticle[cle] || 0) + (r.ca || 0);
      });
      rowsPaireActuelle.forEach(p => {
        const cle = p.categorie + '|' + p.article;
        const caPrec = precedentParArticle[cle];
        if (!caPrec || caPrec <= 0) return;
        const evolution = (p.ca - caPrec) / caPrec;
        if (evolution >= 0.20) candidats.push({ candidate_id: `LIVE-R3-${cle}`, categorie: p.categorie, impact_eur: Math.max(p.ca - caPrec, 0) });
        if (evolution <= -0.30) candidats.push({ candidate_id: `LIVE-R2-${cle}`, categorie: p.categorie, impact_eur: Math.max(caPrec - p.ca, 0) });
      });
    }
    const exclusionsManuelles = new Set(((exclusionsRes && exclusionsRes.data) || []).map(r => r.article));
    const rowsPropresMarge = rowsAffichage.filter(r => (r.ca || 0) > 0 && (r.marge || 0) >= 0 && (r.marge || 0) <= (r.ca || 0));
    NexusMarge.detecterEcartsMarge(rowsPropresMarge, exclusionsManuelles).forEach(e => {
      candidats.push({ candidate_id: `LIVE-R5-${e.categorie}|${e.article}`, categorie: e.categorie, impact_eur: e.gainPotentiel });
    });

    const enAttente = candidats.filter(c => !validees.has(c.candidate_id));
    const parCategorie = {};
    enAttente.forEach(c => { parCategorie[c.categorie] = (parCategorie[c.categorie] || 0) + c.impact_eur; });
    const topCategorie = Object.entries(parCategorie).sort((a, b) => b[1] - a[1])[0];

    return {
      nb: enAttente.length,
      potentiel: enAttente.reduce((s, c) => s + c.impact_eur, 0),
      topCategorie: topCategorie ? topCategorie[0] : null,
    };
  }

  function fmtEur(v) { return Math.round(v).toLocaleString('fr-FR') + ' €'; }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function labelJour(iso) {
    const auj = new Date().toISOString().slice(0, 10);
    const hierDate = new Date(); hierDate.setDate(hierDate.getDate() - 1);
    const hier = hierDate.toISOString().slice(0, 10);
    if (iso === auj) return "Aujourd'hui";
    if (iso === hier) return 'Hier';
    return fmtDate(iso);
  }

  const LABEL_REGLE = { 'R4-RENFORT-A': 'Renfort', 'R3-HAUSSE': 'Opportunité saisie', 'R2-BAISSE': 'Baisse traitée', 'R5-MARGE-ECART': 'Marge' };
  function labelRegle(ruleId) { return LABEL_REGLE[ruleId] || ruleId; }

  const DEF_LEVIERS = [
    { id: 'R4-RENFORT-A', label: 'Renforts appliqués', icon: '🔥', bg: 'var(--green-dim)', fg: 'var(--green)' },
    { id: 'R3-HAUSSE', label: 'Opportunités saisies', icon: '📈', bg: 'var(--cyan-dim)', fg: 'var(--cyan)' },
    { id: 'R2-BAISSE', label: 'Baisses traitées', icon: '🟡', bg: 'var(--amber-dim)', fg: 'var(--amber)' },
    { id: 'R5-MARGE-ECART', label: 'Écarts de marge corrigés', icon: '💡', bg: 'var(--violet-dim)', fg: 'var(--violet)' },
  ];

  function calculerLeviers(decisions) {
    const totaux = {};
    decisions.forEach(d => {
      if (!totaux[d.rule_id]) totaux[d.rule_id] = { montant: 0, nb: 0 };
      totaux[d.rule_id].montant += (d.impact_eur || 0);
      totaux[d.rule_id].nb += 1;
    });
    return DEF_LEVIERS.map(l => ({ ...l, montant: (totaux[l.id] && totaux[l.id].montant) || 0, nb: (totaux[l.id] && totaux[l.id].nb) || 0 }));
  }

  function calculerSparkline(decisions) {
    if (!decisions.length) return [];
    const parMois = {};
    decisions.forEach(d => {
      const mois = (d.date || '').slice(0, 7);
      if (!mois) return;
      parMois[mois] = (parMois[mois] || 0) + (d.impact_eur || 0);
    });
    const mois = Object.keys(parMois).sort();
    let cumul = 0;
    return mois.map(m => { cumul += parMois[m]; return { mois: m, cumul }; });
  }

  function renderSparklineSVG(points, width, height) {
    if (points.length < 2) return null;
    const maxV = Math.max(...points.map(p => p.cumul), 1);
    const minV = Math.min(...points.map(p => p.cumul), 0);
    const span = (maxV - minV) || 1;
    const stepX = width / (points.length - 1);
    const coords = points.map((p, i) => {
      const x = i * stepX;
      const y = height - ((p.cumul - minV) / span) * (height - 6) - 3;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const dernier = coords[coords.length - 1].split(',');
    return `<polyline points="${coords.join(' ')}" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="${dernier[0]}" cy="${dernier[1]}" r="4" fill="#34D399"/>`;
  }

  function calculerDelta(decisions) {
    const maintenant = new Date();
    const moisCourant = maintenant.toISOString().slice(0, 7);
    const moisPrecDate = new Date(maintenant.getFullYear(), maintenant.getMonth() - 1, 1);
    const moisPrec = moisPrecDate.toISOString().slice(0, 7);
    const sommeMois = m => decisions.filter(d => (d.date || '').slice(0, 7) === m).reduce((s, d) => s + (d.impact_eur || 0), 0);
    const actuel = sommeMois(moisCourant);
    const precedent = sommeMois(moisPrec);
    if (precedent > 0) {
      const pct = ((actuel - precedent) / precedent) * 100;
      return { texte: `${pct >= 0 ? '↑ +' : '↓ '}${Math.abs(pct).toFixed(1).replace('.', ',')} % vs mois précédent`, positif: pct >= 0 };
    }
    if (actuel > 0) return { texte: 'Nouveau ce mois-ci', positif: true };
    return null;
  }

  function texteConseillerCapital(leviers, opportunites) {
    const leviersActifs = leviers.filter(l => l.montant > 0).sort((a, b) => b.montant - a.montant);
    if (!leviersActifs.length) {
      return "Aucune décision validée pour l'instant — validez vos premières recommandations depuis Cockpit, Produits ou Nexus Marge+ pour commencer à faire grandir votre Capital NEXUS.";
    }
    const principal = leviersActifs[0];
    let texte = `Vos gains proviennent principalement de vos décisions "${principal.label}" (${fmtEur(principal.montant)}).`;
    if (opportunites && opportunites.nb > 0 && opportunites.topCategorie) {
      texte += ` Le levier avec le plus de potentiel non exploité concerne actuellement ${opportunites.topCategorie}.`;
    }
    return texte;
  }

  function moisAbrege(iso) {
    const d = new Date(iso + '-01T00:00:00');
    return d.toLocaleDateString('fr-FR', { month: 'short' });
  }

  function renderRoot(decisions, opportunites) {
    const root = document.getElementById('root');
    const disclaimer = document.getElementById('disclaimer');
    disclaimer.textContent = "Capital NEXUS estime la valeur potentielle identifiée par vos décisions validées, au moment de leur validation — ce n'est pas un chiffre d'affaires vérifié après coup.";

    const capitalTotal = decisions.reduce((s, d) => s + (d.impact_eur || 0), 0);
    const delta = calculerDelta(decisions);
    const points = calculerSparkline(decisions);
    const leviers = calculerLeviers(decisions);
    const top3 = [...decisions].sort((a, b) => (b.impact_eur || 0) - (a.impact_eur || 0)).slice(0, 3);
    const registreTries = [...decisions].sort((a, b) => (b.date + b.heure).localeCompare(a.date + a.heure)).slice(0, 10);
    const parJour = {};
    registreTries.forEach(d => { (parJour[d.date] = parJour[d.date] || []).push(d); });
    const joursOrdonnes = Object.keys(parJour).sort().reverse();

    const moisCourant = new Date().toISOString().slice(0, 7);
    const decisionsCeMois = decisions.filter(d => (d.date || '').slice(0, 7) === moisCourant);
    const totalCeMois = decisionsCeMois.reduce((s, d) => s + (d.impact_eur || 0), 0);

    const chartSVG = renderSparklineSVG(points, 150, 70);
    const miniChartSVG = renderSparklineSVG(points, 130, 70);

    root.innerHTML = `
      <div class="capital-panel">
        <div class="capital-row-top">
          <div class="capital-eyebrow">● Capital NEXUS™</div>
          <div class="capital-info" title="Somme des impacts estimés de toutes vos décisions validées">i</div>
        </div>
        <div class="capital-amount">${capitalTotal > 0 ? '+' : ''}${fmtEur(capitalTotal)}</div>
        <div class="capital-sub">Valeur identifiée par vos décisions validées</div>
        <div class="capital-desc">Estimée au moment de la validation de chaque décision — pas encore vérifiée après coup.</div>
        ${chartSVG ? `<svg class="capital-chart" viewBox="0 0 150 70" fill="none">${chartSVG}</svg>` : ''}
        ${delta ? `<div class="capital-badge${delta.positif ? '' : ' baisse'}">${delta.texte}</div>` : ''}
      </div>

      <div class="section">
        <div class="section-label">Les leviers de valeur</div>
      </div>
      <div class="section">
        <div class="levers-grid">
          ${leviers.map(l => `
            <div class="lever-card">
              <div class="lever-icon" style="background:${l.bg}; color:${l.fg};">${l.icon}</div>
              <div class="lever-title">${l.label}</div>
              <div class="lever-amount" style="color:${l.fg};">${fmtEur(l.montant)}</div>
              <div class="lever-meta">${l.nb} décision${l.nb > 1 ? 's' : ''}</div>
            </div>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-label">🏆 Top 3 des décisions les plus rentables</div>
        ${top3.length ? top3.map((d, i) => `
          <div class="decision-item">
            <div class="decision-rank rank-${i + 1}">${i + 1}</div>
            <div class="decision-body">
              <div class="decision-title">${d.article || d.categorie || 'Décision'}</div>
              <div class="decision-meta">${fmtDate(d.date)} · ${labelRegle(d.rule_id)}</div>
            </div>
            <div class="decision-amount">+${fmtEur(d.impact_eur || 0)}</div>
          </div>`).join('') : `<div class="mini-empty">Aucune décision validée pour l'instant.</div>`}
      </div>

      <div class="section">
        <div class="two-col">
          <div class="mini-panel">
            <div class="mini-label">Évolution de la valeur créée</div>
            ${miniChartSVG ? `
              <svg viewBox="0 0 130 70" width="100%" height="70">${miniChartSVG}</svg>
              <div class="roi-meta" style="display:flex; justify-content:space-between; margin-top:6px; font-family:var(--mono); font-size:10.5px; color:var(--text-dim);">
                <span>${moisAbrege(points[0].mois)}</span><span>${moisAbrege(points[points.length - 1].mois)}</span>
              </div>` : `<div class="mini-empty">Historique encore trop court pour un graphique.</div>`}
          </div>
          <div class="mini-panel">
            <div class="mini-label amber">Opportunités non appliquées</div>
            <div class="opp-number">${opportunites.nb}</div>
            <div class="opp-desc">recommandation${opportunites.nb > 1 ? 's' : ''} en attente, tous moteurs confondus</div>
            ${opportunites.nb > 0 ? `<div class="opp-potential">Potentiel ${fmtEur(opportunites.potentiel)}</div>` : ''}
          </div>
        </div>
      </div>

      <div class="section">
        <div class="advisor-panel">
          <div class="advisor-avatar"><img src="assets/nexus-avatar.png" alt="Conseiller NEXUS"></div>
          <div class="advisor-body">
            <div class="advisor-title">L'avis du conseiller NEXUS</div>
            <p>${texteConseillerCapital(leviers, opportunites)}</p>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Registre de la Valeur™</div>
        ${joursOrdonnes.length ? joursOrdonnes.map(jour => `
          <div class="journal-day">
            <div class="journal-date">${labelJour(jour)}</div>
            ${parJour[jour].map(d => `
              <div class="journal-entry">
                <span class="journal-check">✅</span>
                <span class="journal-text">${(d.recommandation || d.article || 'Décision validée').slice(0, 90)}</span>
                <span class="journal-amount">+${fmtEur(d.impact_eur || 0)}</span>
              </div>`).join('')}
          </div>`).join('') + `
          <div class="journal-summary">Ce mois-ci, NEXUS estime avoir identifié <b>${fmtEur(totalCeMois)}</b> de valeur supplémentaire grâce à <b>${decisionsCeMois.length} décision${decisionsCeMois.length > 1 ? 's' : ''}</b> validée${decisionsCeMois.length > 1 ? 's' : ''}.</div>`
          : `<div class="journal-empty">Aucune décision validée pour l'instant — le Registre de la Valeur se remplira au fur et à mesure de vos décisions dans Cockpit, Produits, Nexus Marge+ et l'accueil.</div>`}
      </div>

      <div class="section" style="margin-top:6px;">
        <div class="cta-panel">
          <div class="ct">Voir le détail de chaque décision</div>
          <div class="cd">Le Journal NEXUS liste toutes vos décisions validées, avec leur contexte complet.</div>
          <a class="cta-btn" href="NEXUS-Journal-v1.html">Ouvrir le Journal NEXUS →</a>
        </div>
      </div>
    `;
  }

  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    if (employee.role !== 'manager' && employee.role !== 'gerant') {
      document.body.innerHTML = '<div style="padding:60px 20px; text-align:center; color:#8A96A5; font-family:sans-serif; background:#0B0F14; min-height:100vh;">Cet écran est réservé aux managers.</div>';
      return;
    }
    SITE_ACTUEL = employee.site_id || 'vito-sainte-marie';

    const [decisions, opportunites] = await Promise.all([
      chargerJournalDecisions(SITE_ACTUEL),
      chargerOpportunitesNonAppliquees(SITE_ACTUEL),
    ]);
    renderRoot(decisions, opportunites);
  });
</script>
</body>
</html>
