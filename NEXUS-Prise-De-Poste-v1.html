<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Prise de poste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-build.js"></script>
<script src="nexus-station.js?v=20260904-0104"></script>
<script src="nexus-auth.js?v=20260904-0104"></script>
<script src="nexus-desktop.js?v=20260904-0104"></script>
<script src="nexus-fil-debut-quart.js?v=20261021-0001"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:24px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:22px; font-weight:600; margin-top:4px;}
  .sub{font-size:13px; color:var(--text-mid); margin-top:6px; line-height:1.5;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}

  .section{padding:16px 20px;}

  .role-grid{display:flex; flex-direction:column; gap:12px;}
  .role-card{
    position:relative; background:linear-gradient(145deg, var(--panel), var(--panel-raised));
    border:1.5px solid var(--hairline); border-radius:16px; padding:16px 18px;
    display:flex; align-items:center; gap:16px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    transition:border-color .18s, box-shadow .18s, transform .18s, background .18s;
  }
  .role-card:active{transform:scale(0.98);}
  .role-card.selected{
    border-color:var(--cyan);
    background:linear-gradient(145deg, rgba(79,195,217,0.14), rgba(79,195,217,0.04));
    box-shadow:0 0 0 1px rgba(79,195,217,0.4), 0 8px 28px rgba(79,195,217,0.28);
    transform:translateY(-1px);
  }
  .role-icon{
    position:relative; width:60px; height:60px; border-radius:16px; flex-shrink:0; overflow:hidden;
    background:radial-gradient(circle at 32% 28%, rgba(79,195,217,0.30), var(--panel-raised) 72%);
    box-shadow:inset 0 0 0 1px rgba(79,195,217,0.18);
    display:flex; align-items:center; justify-content:center;
    transition:box-shadow .18s, background .18s;
  }
  .role-icon img{
    width:82%; height:82%; object-fit:contain;
    filter:drop-shadow(0 0 7px rgba(79,195,217,0.55));
  }
  .role-card.selected .role-icon{
    background:radial-gradient(circle at 32% 28%, rgba(79,195,217,0.55), rgba(79,195,217,0.12) 72%);
    box-shadow:inset 0 0 0 1.5px rgba(79,195,217,0.6), 0 0 18px rgba(79,195,217,0.45);
  }
  .role-card.selected .role-icon img{filter:drop-shadow(0 0 10px rgba(79,195,217,0.85));}
  .role-name{font-size:15.5px; font-weight:700; letter-spacing:0.01em;}
  .role-suggestion{font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--cyan); margin-top:3px; opacity:0.85;}
  .role-check{
    margin-left:auto; width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background:var(--cyan); color:#04141a; font-size:14px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(0.6); transition:opacity .18s, transform .18s;
    box-shadow:0 0 12px rgba(79,195,217,0.6);
  }
  .role-card.selected .role-check{opacity:1; transform:scale(1);}

  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600;
    background:var(--cyan); color:#04141a; cursor:pointer; margin-top:18px;
  }
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-text{width:100%; padding:12px; border:none; background:none; color:var(--text-dim); font-size:12.5px; cursor:pointer; margin-top:8px;}

  .summary-card{background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:20px; margin-top:4px;}
  .summary-role{display:flex; align-items:center; gap:12px; padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--hairline);}
  .summary-role .role-icon{
    width:56px; height:56px;
    background:radial-gradient(circle at 32% 28%, rgba(79,195,217,0.45), rgba(79,195,217,0.08) 72%);
    box-shadow:inset 0 0 0 1.5px rgba(79,195,217,0.5), 0 0 16px rgba(79,195,217,0.35);
  }
  .summary-role-name{font-size:16px; font-weight:700;}
  .summary-role-quart{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px;}
  .summary-role-tagline{font-size:11.5px; color:var(--text-mid); font-style:italic; margin-top:3px;}

  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0;}
  .stat-label{font-size:13px; color:var(--text-mid);}
  .stat-value{font-family:var(--mono); font-size:15px; font-weight:700;}
  .stat-value.amber{color:var(--amber);}
  .stat-value.cyan{color:var(--cyan);}

  .loading{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  /* Avertissement sécurité pompiste (27/07/2026, demande de Frédéric) —
     rappelé au moment précis où ce rôle est confirmé, avant même de voir
     les missions du jour. */
  .warning-securite{background:var(--red-dim); border:1px solid rgba(240,87,90,0.4); border-radius:10px; padding:12px 14px; font-size:12px; color:var(--red); line-height:1.55; margin-top:14px;}
  .warning-securite b{color:var(--red);}

  /* FDJ Vague 1 (17/09/2026) — l'ouverture du quart FDJ est une conséquence
     de la prise de poste, pas une action de plus ; son résultat se lit ici.
     Trois tons, aucun vocabulaire accusatoire : elle a eu lieu, elle n'a pas
     lieu d'être, ou elle se heurte à un quart déjà tenu par quelqu'un. */
  .note-fdj{border-radius:10px; padding:11px 13px; font-size:12px; line-height:1.55; margin-top:14px;}
  .note-fdj.ok{background:var(--green-dim); border:1px solid rgba(58,191,127,0.35); color:var(--green);}
  .note-fdj.info{background:rgba(255,255,255,0.04); border:1px solid var(--hairline); color:var(--text-mid);}
  .note-fdj.conflit{background:var(--amber-dim); border:1px solid rgba(232,168,56,0.4); color:var(--amber);}

  .final-card{padding:8px 0;}
  .final-greet{font-size:19px; font-weight:700;}
  .final-line{font-size:13.5px; color:var(--text-mid); margin-top:10px; display:flex; justify-content:space-between;}
  .final-line b{color:var(--text); font-weight:600;}
  .checkmark{width:56px; height:56px; border-radius:50%; background:var(--green-dim); color:var(--green); font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Prise de poste</div>
  </div>
  <div class="divider"></div>

  <!-- desktop-grid (02/08/2026) : mise en colonnes en vue bureau (voir
       nexus-desktop.js) — purement additif, aucun effet en mobile. -->
  <div class="section desktop-grid" id="content">
    <div class="loading">Chargement…</div>
  </div>

  <footer>NEXUS Prise de poste v1 · <span class="nexus-nom-commerce">Ma station</span> · <a href="#" id="logout" style="color:var(--cyan); text-decoration:none;">Se déconnecter</a></footer>
</div>

<script src="nexus-prise-de-poste.js"></script>
<script>
  // Un seul écran : le choix du poste vit dans nexus-prise-de-poste.js, que
  // l'Accueil monte aussi. Cette page ne fait que l'héberger.
  nexusRequireAuth().then(employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    NexusPriseDePoste.monter(document.getElementById('content'), employee);
  });

  // Lien de déconnexion en pied de page (05/08/2026, demande de Frédéric) —
  // même mécanisme que sur NEXUS-App-v1.html.
  document.getElementById('logout').addEventListener('click', (e) => {
    e.preventDefault();
    nexusLogout();
  });
</script>
</body>
</html>
