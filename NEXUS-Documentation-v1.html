<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --cyan-dim:rgba(79,195,217,0.1);
    --violet:#A883FF; --violet-dim:#241C3A;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:20px 20px 14px; position:relative;}
  .back-btn{
    position:absolute; top:18px; left:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5; cursor:pointer;
  }
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan); text-align:center;}
  .title{font-size:20px; font-weight:600; margin-top:4px; text-align:center;}
  .soustitre{font-size:12.5px; color:var(--text-mid); margin-top:4px; line-height:1.5; text-align:center;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .content{flex:1; padding-bottom:40px;}
  .section{padding:16px 20px 0;}
  .section-label{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--cyan); margin-bottom:10px; display:flex; align-items:center; gap:8px;}

  /* Recherche intelligente — même esprit que "Recherche NEXUS" de
     NEXUS-App-v1.html : un champ, filtrage par mots-clés au fil de la
     frappe, jamais de résultat vide sans message. */
  .recherche-box{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:12px 14px; margin-bottom:6px;}
  .recherche-box input{flex:1; background:none; border:none; outline:none; color:var(--text); font-family:var(--sans); font-size:14px;}
  .recherche-box input::placeholder{color:var(--text-dim);}
  .recherche-compteur{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-bottom:14px;}
  .recherche-vide{display:none; text-align:center; padding:30px 20px; color:var(--text-dim); font-size:12.5px; line-height:1.6;}

  .groupe{margin-bottom:6px;}
  .groupe-titre{font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--text); padding:16px 0 8px; display:flex; align-items:center; gap:8px;}
  .groupe-desc{font-size:11.5px; color:var(--text-mid); margin:-4px 0 10px; line-height:1.5;}

  details.moteur{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:8px; overflow:hidden;}
  details.moteur[open]{border-color:rgba(79,195,217,0.35);}
  details.moteur summary{
    list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px;
    -webkit-tap-highlight-color:transparent;
  }
  details.moteur summary::-webkit-details-marker{display:none;}
  .moteur-icone{font-size:17px; flex-shrink:0;}
  .moteur-titre-ligne{flex:1; min-width:0;}
  .moteur-nom{font-size:13.5px; font-weight:600;}
  .moteur-resume-court{font-size:11px; color:var(--text-dim); margin-top:2px; line-height:1.4;}
  .moteur-chevron{color:var(--text-dim); font-size:13px; transition:transform 0.15s; flex-shrink:0;}
  details.moteur[open] .moteur-chevron{transform:rotate(90deg); color:var(--cyan);}
  .moteur-corps{padding:0 16px 16px;}
  .moteur-badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .badge{font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:4px 8px; border-radius:8px; white-space:nowrap;}
  .badge-role{background:var(--panel-raised); color:var(--text-mid);}
  .badge-essential{background:var(--green-dim); color:var(--green);}
  .badge-professional{background:var(--amber-dim); color:var(--amber);}
  .moteur-resume{font-size:12.5px; color:var(--text); line-height:1.6; margin-bottom:12px;}
  .moteur-souslabel{font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-dim); margin:12px 0 6px;}
  .moteur-liste{list-style:none;}
  .moteur-liste li{font-size:12px; color:var(--text-mid); line-height:1.55; padding:5px 0 5px 18px; position:relative;}
  .moteur-liste li::before{content:'—'; position:absolute; left:0; color:var(--cyan);}
  .moteur-attention{background:var(--amber-dim); border:1px solid rgba(245,166,35,0.3); border-radius:8px; padding:10px 12px; margin-top:10px; font-size:11.5px; color:var(--amber); line-height:1.55;}
  .moteur-lien{display:inline-block; margin-top:12px; font-family:var(--mono); font-size:11px; color:var(--cyan); text-decoration:none; padding:8px 12px; background:var(--cyan-dim); border-radius:8px;}

  .footer-lien{display:block; text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:20px;}
  .intro-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:16px; margin-bottom:16px; font-size:12px; color:var(--text-mid); line-height:1.6;}
  .intro-card b{color:var(--text);}
</style>
</head>
<body>

  <div class="header">

</div>

<script>
  // ============================================================
  // NEXUS DOCUMENTATION — v1 (07/08/2026, demande de Frédéric)
  //
  // "Une documentation pour comprendre et utiliser comme un mode d'emploi
  // tous les moteurs créés." Page consultable uniquement par les comptes
  // authentifiés — Essential ET Professional y ont accès (ce n'est PAS
  // une page verrouillée par nexusRequireProfessional : les deux forfaits
  // ont des moteurs à documenter). Seule barrière : nexusRequireAuth(),
  // qui bloque déjà tout visiteur public non connecté et le renvoie vers
  // NEXUS-Login-v1.html — exactement le niveau de restriction demandé
  // ("non en lecture publique").
  //
  // Contenu rédigé à partir des commentaires réels laissés en tête de
  // chaque page NEXUS (le code de ce projet documente systématiquement le
  // "pourquoi" de chaque écran) — jamais une fonctionnalité inventée qui
  // n'existe pas dans le code source réel. Si un moteur évolue, ce fichier
  // devra être mis à jour à la main : aucune génération automatique.
  // ============================================================

  const MOTEURS = [
    // ---- PILOTER ----
    {
      groupe: 'piloter', icone: '🧭', nom: 'Brief NEXUS', href: 'NEXUS-Brief-v1.html',
      role: 'Manager', forfait: null,
      resume: "La synthèse du dirigeant : agrège les 7 moteurs NEXUS (Produits, Marge+, Tempo, Verify, Scanner Stock, Inventaire, Rappels) en une Boussole NEXUS à 5 axes et 3 décisions priorisées. N'introduit aucun nouveau calcul — il appelle les moteurs déjà en production pour ne jamais afficher un chiffre différent de ce que montrent Cockpit ou les écrans détaillés.",
      actions: [
        "Consulter la Boussole NEXUS (5 axes de santé du commerce) en un coup d'œil",
        "Voir les 3 décisions les plus prioritaires du moment, tous moteurs confondus",
        "Ouvrir le détail de chaque axe pour comprendre d'où vient le score",
      ],
      attention: "Toute case affiche honnêtement « Donnée insuffisante » plutôt qu'une valeur inventée — c'est volontaire, pas un bug.",
    },
    {
      groupe: 'piloter', icone: '🏠', nom: 'Cockpit', href: 'NEXUS-Cockpit-v2.html',
      role: 'Tous', forfait: null,
      resume: "Répond à une seule question : « que dois-je faire maintenant ? ». Distribue le travail du jour sur toutes les catégories du magasin (Produits, Caisse, Stock) et rappelle les nouveautés depuis votre dernière visite.",
      actions: [
        "Voir le nombre d'actions restantes à traiter dès l'ouverture",
        "Consulter les « Nouvelles » : bouclage des décisions déjà validées, risques détectés entre-temps",
        "Parcourir le Plan d'exploitation du jour (cartes Situation/Analyse/Décision), Produits + Caisse + Stock mélangés",
        "Cocher un écart de caisse « Justifié » directement, sans repasser par Verify",
        "Ajouter un rappel manuel (texte libre + date) qui rejoint les priorités du jour",
        "Ouvrir « Gérer les assignations » pour distribuer une tâche à l'équipe",
      ],
    },
    {
      groupe: 'piloter', icone: '💡', nom: "Centre d'Intelligence NEXUS", href: 'NEXUS-Centre-Intelligence-v1.html',
      role: 'Manager', forfait: null,
      resume: "« Pourquoi cela arrive-t-il, et quelle est la meilleure décision ? » — rassemble les détections d'anomalies commerciales, les messages structurés du Conseiller (Qualité, Caisse) et la santé caisse du mois (écarts cumulés, comparatif au mois précédent).",
      actions: [
        "Comprendre le raisonnement complet derrière une alerte vue ailleurs (Scanner, Cockpit, Journal)",
        "Suivre l'évolution des écarts de caisse sur le mois, comparée au mois précédent",
        "Lire les messages Qualité et Caisse générés par les règles NEXUS",
      ],
    },
    {
      groupe: 'piloter', icone: '📓', nom: 'Journal', href: 'NEXUS-Journal-v1.html',
      role: 'Manager', forfait: 'professional',
      resume: "« Le Journal n'analyse rien et ne juge rien. Il enregistre chaque fait avec son heure, comme une boîte noire. » Chronologie unique triée par heure décroissante : décisions validées, missions terminées et pointages du jour, sans regroupement ni résumé.",
      actions: [
        "Consulter « Aujourd'hui en chiffres » : valeur décidée en €, missions faites, employés pointés",
        "Filtrer par onglet : Tout / Décisions / Missions / Pointages",
        "Voir chaque décision validée avec son montant d'impact estimé et la règle appliquée",
        "Lire la note d'un employé contestant un retard, associée directement au pointage concerné",
      ],
      attention: "Le Journal ne prend jamais parti sur un pointage contesté : il ajoute la note de l'employé au fait déjà enregistré, sans trancher à sa place.",
    },
    {
      groupe: 'piloter', icone: '💰', nom: 'Capital NEXUS', href: 'NEXUS-Capital-v1.html',
      role: 'Manager', forfait: 'professional',
      resume: "Calcule la valeur potentielle totale identifiée par toutes les décisions validées dans NEXUS (Cockpit, Marge+, Conseiller). Vocabulaire volontairement prudent : « valeur identifiée / estimée », jamais « argent gagné » — impact_eur est une estimation prise au moment de la validation, pas un gain vérifié après coup.",
      actions: [
        "Consulter le montant cumulé du Capital NEXUS et son évolution récente",
        "Voir le panneau ROI Professional : coût de l'abonnement, valeur créée depuis le 1er juillet 2026, ratio en %",
        "Voir la répartition de la valeur par levier (Renforts, Opportunités saisies, Baisses traitées, Écarts de marge corrigés)",
        "Consulter le Top 3 des décisions les plus rentables et le Registre de la Valeur (détail jour par jour)",
      ],
      attention: "Ce n'est pas un chiffre d'affaires vérifié après coup — le disclaimer de la page le rappelle explicitement.",
    },
    {
      groupe: 'piloter', icone: '🔎', nom: 'Scanner NEXUS', href: 'NEXUS-Scanner-v1.html',
      role: 'Manager', forfait: 'professional',
      resume: "Photographie l'état du magasin à un instant T : répartition ABC des catégories (méthode Pareto), marge globale, et « NEXUS Marge+ » qui détecte des écarts de marge entre produits économiquement comparables (jamais entre catégories entières).",
      actions: [
        "Consulter la répartition ABC des catégories avec détail dépliable",
        "Basculer entre Top 5 par CA et Top 5 par marge",
        "Parcourir les opportunités « NEXUS Marge+ » par priorité, chacune dépliable en Constat/Explication/Décision",
        "Créer une mission directement depuis une opportunité (échéance 7 jours)",
        "Consulter les anomalies détectées (lignes CA/marge incohérentes)",
      ],
      attention: "Le score de confiance affiché n'est pas une probabilité de succès, et l'effort indiqué est une estimation par défaut, non mesurée.",
    },
    {
      groupe: 'piloter', icone: '🧑‍🤝‍🧑', nom: 'Radar du Manager', href: 'NEXUS-Radar-Manager-v1.html',
      role: 'Manager', forfait: 'professional',
      resume: "Vue en radar (8 axes) répondant à « où investir votre énergie aujourd'hui ». Seuls certains domaines sont réellement mesurés à partir de vraies données — les autres sont marqués « hors de portée » de NEXUS pour l'instant, jamais comme une mauvaise performance.",
      actions: [
        "Voir un verdict global : domaines pilotés avec une vraie donnée / sains / à agir / hors de portée",
        "Consulter le diagramme radar (vert = sain, ambre = à surveiller, gris pointillé = non mesurable)",
        "Ouvrir le détail de chaque domaine mesuré avec sa jauge de progression",
      ],
      attention: "Résultats et Développement sont mesurés ; Stocks, Achats, Exploitation et Conformité ne le sont pas encore — ce n'est pas noté à zéro, juste pas mesurable aujourd'hui.",
    },

    // ---- PERFORMER ----
    {
      groupe: 'performer', icone: '📦', nom: 'Produits', href: 'NEXUS-Produits-v1.html',
      role: 'Manager', forfait: null,
      resume: "Le référentiel produit : une fiche d'identité par référence, avec le même moteur de règles que le Cockpit appliqué à un seul produit. Combine ventes, photo produit, photo terrain, emplacement en rayon et indicateurs de fiabilité.",
      actions: [
        "Rechercher un produit par nom, ou y arriver via un lien direct depuis le Conseiller NEXUS",
        "Consulter le statut simplifié (Performant / À surveiller / Dormant / Stratégique) et l'action recommandée",
        "Lire l'analyse Constat → Explication → Décision propre au produit",
        "Vérifier ou prendre une photo terrain du produit en rayon",
        "Renseigner l'emplacement physique du produit dans le magasin",
        "Consulter l'historique T1 → T2 quand une comparaison fiable existe",
      ],
      attention: "L'emplacement en rayon n'est jamais déduit automatiquement — uniquement saisi et confirmé par un manager.",
    },
    {
      groupe: 'performer', icone: '🗂️', nom: 'Rayon', href: 'NEXUS-Rayon-v1.html',
      role: 'Manager', forfait: null,
      resume: "Analyse chaque rayon (catégorie) avec un verdict immédiat (créateur de valeur / stratégique à faible marge / à surveiller / en dégradation / rayon de trafic), un cycle Constat → Explication → Décision, et une section « Pourquoi ? » qui rend visible et navigable tout le raisonnement de NEXUS.",
      actions: [
        "Choisir un rayon (recherche ou liste triée par CA) et consulter son verdict",
        "Parcourir 3 onglets : Performance (KPI, poids dans le magasin), Références (tops CA/marge, réalité vs instinct), Terrain (ce que NEXUS ne sait pas encore, lancer un contrôle photo)",
        "Déplier « Pourquoi ? » pour voir question par question comment chaque conclusion a été calculée",
      ],
      attention: "Les rayons dits « de trafic » (cartes prépayées, presse, jeux…) ne sont jamais jugés sur leur marge — leur rôle est d'attirer le client, pas de générer du profit direct.",
    },
    {
      groupe: 'performer', icone: '📆', nom: 'Tempo', href: 'NEXUS-Tempo-v1.html',
      role: 'Manager', forfait: 'professional',
      resume: "Le rythme réel de la station, jour par jour de la semaine, à partir des audits de caisse quotidiens. Gouverné par la règle « jamais de chiffre inventé » : aucune tendance sans un minimum d'historique.",
      actions: [
        "Voir le statut de chaque jour de la semaine (moteur / solide / stable / irrégulier / à renforcer / en recul)",
        "Consulter la décision prioritaire du moment et créer une mission terrain associée",
        "Comparer deux périodes de dates au choix",
        "Consulter la contribution observée par employé (jamais présentée comme un jugement individuel certain)",
        "Explorer les sections complémentaires : Carburants, Cycles saisonniers, Météo, Scanner Stock, Capital NEXUS",
      ],
      attention: "Aucune tendance n'apparaît sans au moins 14 jours d'historique global, et aucun classement d'employé sans un minimum de quarts comparables.",
    },
    {
      groupe: 'performer', icone: '📣', nom: 'Campagnes', href: 'NEXUS-Campagne-v1.html',
      role: 'Manager', forfait: 'professional',
      resume: "Suit le cycle de vie complet d'une promotion : déclaration rapide, puis mesure automatique de son impact réel sur le CA (avant/pendant), à partir des vrais audits de caisse.",
      actions: [
        "Déclarer une nouvelle promotion (dates, type boutique/carburant/mixte, produits concernés)",
        "Consulter la liste des promotions et leur impact CA mesuré",
        "Depuis Import, rattacher un fichier de ventes « avant » ou « pendant » à une promotion existante",
      ],
      attention: "La mesure d'impact reste volontairement au niveau du CA global, jamais par produit — afficher un impact par référence serait une estimation déguisée en fait mesuré.",
    },
    {
      groupe: 'performer', icone: '📉', nom: 'Scanner Stock', href: 'NEXUS-Scanner-Stock-v1.html',
      role: 'Manager', forfait: null,

        "Consulter l'indice de confiance global et le risque estimé en euros",
        "Filtrer par état (à vérifier, à surveiller, stables, non concluants, stock négatif)",
        "Consulter la liste « Inventaire conseillé aujourd'hui »",
        "Marquer un contrôle (quantité réellement comptée) directement depuis une fiche produit",
      ],
      attention: "Nécessite au moins deux relevés de stock importés avant de pouvoir démarrer l'analyse.",
    },

    // ---- EXÉCUTER ----
    {
      groupe: 'executer', icone: '🧾', nom: 'Verify', href: 'NEXUS-Verify-v1.html',
      role: 'Manager', forfait: null,
      resume: "Contrôle de caisse quotidien : dépose ou saisit le rapport de recettes, les dépôts piste/boutique (CB, billets, pièces), et NEXUS détecte les écarts par rapport à ce qui est attendu. Chaque ligne de contrôle affichée reflète une donnée réellement détectée, jamais un état inventé.",
      actions: [
        "Importer ou saisir le rapport de recettes du jour",
        "Renseigner les dépôts caisse par zone (piste / boutique)",

        "Justifier un écart avec un commentaire",
      ],
    },
    {
      groupe: 'executer', icone: '📋', nom: 'Inventaire — comptage', href: 'NEXUS-Inventaire-v1.html',
      role: 'Tous', forfait: null,
      resume: "L'écran de comptage terrain, ouvert à tous les employés : ouverture et clôture de quart, catégorie par catégorie, sur la base d'une feuille papier réelle à 11 familles (jaugeage carburant, gaz, glaçons, journaux, pains/sandwichs, viennoiserie, cigarettes, boissons chaudes/bières, huiles, lave-glace, CBD). Vocabulaire imposé : « stock transmis », « stock compté », jamais « ventes » ni « stock théorique ».",

        "Choisir sa zone (Piste ou Boutique) et compter catégorie par catégorie",
        "Pour les produits comptés en deux lieux (boissons, huiles, lave-glace) : saisir le dépôt en cours de trajet — NEXUS demande automatiquement la boutique juste avant validation finale",

        "Consulter et corriger sa saisie avant validation d'ouverture ou de clôture",

    },
    {
      groupe: 'executer', icone: '🧭', nom: 'Contrôle inventaire', href: 'NEXUS-Inventaire-Manager-v1.html',

      actions: [

  const GROUPES_LABELS = {
    piloter: { titre: '🧭 Piloter', desc: 'Comprendre où en est le commerce et décider.' },
    performer: { titre: '📈 Performer', desc: 'Faire progresser produits, rayons et campagnes.' },
    executer: { titre: '✅ Exécuter', desc: "Le travail terrain : caisse, inventaire, missions, planning." },
    equipe: { titre: '👥 Équipe', desc: 'Évaluer et suivre la progression des employés.' },
    'comptes-clients': { titre: '💼 Comptes Clients', desc: 'Facturation, documents et relation client.' },
    administrer: { titre: '⚙️ Administrer', desc: 'Configurer NEXUS et les échéances récurrentes.' },
    employe: { titre: '🙋 Espace employé', desc: 'Les écrans que chaque employé utilise au quotidien.' },
  };
  const ORDRE_GROUPES = ['piloter', 'performer', 'executer', 'equipe', 'comptes-clients', 'administrer', 'employe'];

  function normaliser(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function texteRecherche(m) {
    return normaliser([m.nom, m.resume, m.role, ...(m.actions || []), m.attention || ''].join(' '));
  }

  function badgeForfait(forfait) {
    if (forfait === 'professional') return '<span class="badge badge-professional">Professional</span>';
    return '<span class="badge badge-essential">Essential</span>';
  }

  function rendreMoteur(m) {
    return `
      <details class="moteur" data-recherche="${texteRecherche(m)}">
        <summary>
          <span class="moteur-icone">${m.icone}</span>
          <div class="moteur-titre-ligne">
            <div class="moteur-nom">${m.nom}</div>
            <div class="moteur-resume-court">${m.resume.slice(0, 78)}${m.resume.length > 78 ? '…' : ''}</div>
          </div>
          <span class="moteur-chevron">›</span>
        </summary>
        <div class="moteur-corps">
          <div class="moteur-badges">
            <span class="badge badge-role">${m.role}</span>
            ${badgeForfait(m.forfait)}
          </div>
          <div class="moteur-resume">${m.resume}</div>
          ${m.actions && m.actions.length ? `
            <div class="moteur-souslabel">Ce que vous pouvez faire</div>
            <ul class="moteur-liste">${m.actions.map(a => `<li>${a}</li>`).join('')}</ul>
          ` : ''}
          ${m.attention ? `<div class="moteur-attention">⚠ ${m.attention}</div>` : ''}
          <a class="moteur-lien" href="${m.href}">Ouvrir cet écran →</a>
        </div>
      </details>
    `;
  }

  function render() {
    const app = document.getElementById('app');
    const groupesHtml = ORDRE_GROUPES.map(g => {
      const items = MOTEURS.filter(m => m.groupe === g);
      if (!items.length) return '';
      const label = GROUPES_LABELS[g];
      return `
        <div class="groupe" data-groupe-bloc="${g}">
          <div class="groupe-titre">${label.titre}</div>
          <div class="groupe-desc">${label.desc}</div>
          ${items.map(rendreMoteur).join('')}
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="section">
        <div class="intro-card">
          <b>${MOTEURS.length} moteurs NEXUS</b> documentés ci-dessous, classés comme dans le menu Explorer NEXUS. Utilisez la recherche pour trouver directement ce que vous cherchez par mot-clé (ex : "carburant", "caisse", "planning", "photo").
        </div>
        <div class="recherche-box">
          <span>🔍</span>
          <input type="text" id="rechercheDoc" placeholder="Rechercher un moteur, une action, un mot-clé…">
        </div>
        <div class="recherche-compteur" id="rechercheCompteur"></div>
      </div>
      <div class="section" id="listeGroupes">
        ${groupesHtml}
        <div class="recherche-vide" id="rechercheVide">Aucun moteur ne correspond à cette recherche. Essayez un autre mot-clé, ou parcourez les catégories ci-dessus.</div>
      </div>
      <a class="footer-lien" href="NEXUS-App-v1.html">Retour à l'accueil NEXUS →</a>
    `;

    const input = document.getElementById('rechercheDoc');
    const compteur = document.getElementById('rechercheCompteur');
    const vide = document.getElementById('rechercheVide');
    const tousLesDetails = Array.from(document.querySelectorAll('details.moteur'));
    const tousLesBlocsGroupe = Array.from(document.querySelectorAll('[data-groupe-bloc]'));

    input.addEventListener('input', () => {
      const q = normaliser(input.value.trim());
      if (!q) {
        tousLesDetails.forEach(d => { d.style.display = ''; d.open = false; });
        tousLesBlocsGroupe.forEach(b => b.style.display = '');
        compteur.textContent = '';
        vide.style.display = 'none';
        return;
      }
      let nbTrouves = 0;
      tousLesBlocsGroupe.forEach(bloc => {
        const items = Array.from(bloc.querySelectorAll('details.moteur'));
        let nbVisiblesDansGroupe = 0;
        items.forEach(d => {
          const match = d.dataset.recherche.includes(q);
          d.style.display = match ? '' : 'none';
          d.open = match;
          if (match) { nbVisiblesDansGroupe++; nbTrouves++; }
        });
        bloc.style.display = nbVisiblesDansGroupe ? '' : 'none';
      });
      compteur.textContent = nbTrouves ? `${nbTrouves} résultat${nbTrouves > 1 ? 's' : ''}` : '';
      vide.style.display = nbTrouves ? 'none' : 'block';
    });
  }

  (async function init() {
    const employee = await nexusRequireAuth();
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    render();
  })();
</script>
