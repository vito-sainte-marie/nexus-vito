<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>NEXUS — Comprendre NEXUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --cyan-dim:rgba(79,195,217,0.1);
    --violet:#A883FF; --violet-dim:#241C3A;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:20px 20px 14px; position:relative;}
  .back-btn{
    position:absolute; top:18px; left:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5; cursor:pointer;
  }
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan); text-align:center;}
  .title{font-size:20px; font-weight:600; margin-top:4px; text-align:center;}
  .soustitre{font-size:12.5px; color:var(--text-mid); margin-top:4px; line-height:1.5; text-align:center;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .content{flex:1; padding-bottom:40px;}
  .section{padding:16px 20px 0;}
  .section-label{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--cyan); margin-bottom:10px; display:flex; align-items:center; gap:8px;}

  /* Recherche */
  .recherche-box{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:12px 14px; margin-bottom:6px;}
  .recherche-box input{flex:1; background:none; border:none; outline:none; color:var(--text); font-family:var(--sans); font-size:14px;}
  .recherche-box input::placeholder{color:var(--text-dim);}
  .recherche-compteur{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-bottom:6px;}
  .recherche-vide{display:none; text-align:center; padding:30px 20px; color:var(--text-dim); font-size:12.5px; line-height:1.6;}

  /* "Que voulez-vous faire ?" — le vrai point d'entrée pédagogique
     (07/08/2026, demande de Frédéric, retour utilisateur sur la v1) :
     un dirigeant sait ce qu'il veut faire ("comprendre pourquoi ma marge
     baisse"), pas quel moteur ouvrir pour ça — c'est à NEXUS de faire ce
     lien, jamais l'inverse. */
  .intentions-card{background:var(--panel); border:1px solid rgba(79,195,217,0.25); border-radius:14px; padding:16px; margin:14px 0;}
  .intentions-titre{font-size:14px; font-weight:700; margin-bottom:3px;}
  .intentions-sous{font-size:11.5px; color:var(--text-mid); margin-bottom:14px; line-height:1.5;}
  .intentions-grille{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .intention-chip{
    display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left;
    background:var(--panel-raised); border:1px solid var(--hairline); border-radius:10px;
    padding:11px 12px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .intention-chip .ic-emoji{font-size:17px;}
  .intention-chip .ic-label{font-size:11.5px; font-weight:600; line-height:1.3;}
  .intention-chip.active{background:rgba(79,195,217,0.14); border-color:var(--cyan);}
  .intention-chip.active .ic-label{color:var(--cyan);}
  .intention-reset{display:none; margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--cyan); cursor:pointer; text-align:center; padding:8px; border-radius:8px; background:var(--cyan-dim);}
  .intention-reset.visible{display:block;}

  /* Réponse guidée (08/08/2026, demande de Frédéric) : cliquer sur un
     objectif ne doit pas se contenter de filtrer une liste — NEXUS
     répond d'abord par une phrase qui enchaîne les moteurs dans le bon
     ordre, comme le ferait un collègue expérimenté. Les boutons/fiches
     filtrés en dessous restent la deuxième étape, pas la seule. */
  .reponse-guidee{display:none; margin-top:12px; background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.3); border-radius:10px; padding:12px 13px; font-size:12px; line-height:1.65; color:var(--text);}
  .reponse-guidee.visible{display:block;}
  .reponse-guidee b{color:var(--cyan);}

  /* "Je ne sais pas par où commencer" (08/08/2026, ajusté le même jour :
     "je la ferais ressortir légèrement davantage, car elle peut devenir
     l'entrée idéale pour un nouvel utilisateur") : contrairement aux 6
     objectifs, ce raccourci ne filtre rien — il envoie directement vers
     Brief NEXUS, dont c'est précisément le rôle. Style volontairement
     plus affirmé que les chips (accent cyan plutôt que bordure en
     pointillés) pour qu'il rassure plutôt qu'il n'hésite. */
  .intention-demarrage{
    display:flex; align-items:center; gap:12px; margin-top:10px;
    background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.35); border-radius:10px;
    padding:13px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .intention-demarrage .id-emoji{font-size:20px; flex-shrink:0;}
  .intention-demarrage .id-corps{flex:1; min-width:0;}
  .intention-demarrage .id-titre{font-size:12.5px; font-weight:700; color:var(--text);}
  .intention-demarrage .id-texte{font-size:11px; color:var(--text-mid); margin-top:2px; line-height:1.45;}
  .intention-demarrage .id-fleche{color:var(--cyan); font-family:var(--mono); font-size:14px; flex-shrink:0;}

  /* Parcours recommandé (08/08/2026, demande de Frédéric) : "le clic sur
     un objectif doit produire un parcours, pas seulement filtrer une
     liste." Remplace entièrement l'affichage par catégorie tant qu'un
     objectif est actif — étapes numérotées, cliquables, qui ouvrent
     directement le moteur concerné. */
  .parcours-titre{font-size:13px; font-weight:700; margin-bottom:10px;}
  .parcours-etape{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--hairline);
    border-radius:11px; padding:12px 14px; margin-bottom:8px; text-decoration:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .parcours-numero{
    flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--cyan-dim); color:var(--cyan);
    font-family:var(--mono); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .parcours-icone{font-size:15px; flex-shrink:0;}
  .parcours-corps{flex:1; min-width:0;}
  .parcours-nom{font-size:12.5px; font-weight:600; color:var(--text);}
  .parcours-etape-texte{font-size:11px; color:var(--text-mid); margin-top:1px; line-height:1.4;}
  .parcours-fleche{color:var(--text-dim); font-size:13px; flex-shrink:0;}

  .groupe{margin-bottom:6px;}
  .groupe-titre{font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--text); padding:16px 0 8px; display:flex; align-items:center; gap:8px;}
  .groupe-desc{font-size:11.5px; color:var(--text-mid); margin:-4px 0 10px; line-height:1.5;}

  details.moteur{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:8px; overflow:hidden;}
  details.moteur[open]{border-color:rgba(79,195,217,0.35);}
  details.moteur summary{
    list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px;
    -webkit-tap-highlight-color:transparent;
  }
  details.moteur summary::-webkit-details-marker{display:none;}
  .moteur-icone{font-size:17px; flex-shrink:0;}
  .moteur-titre-ligne{flex:1; min-width:0;}
  .moteur-nom{font-size:13.5px; font-weight:600;}
  .moteur-resume-court{font-size:11px; color:var(--text-dim); margin-top:2px; line-height:1.4;}
  .moteur-chevron{color:var(--text-dim); font-size:13px; transition:transform 0.15s; flex-shrink:0;}
  details.moteur[open] .moteur-chevron{transform:rotate(90deg); color:var(--cyan);}
  .moteur-corps{padding:0 16px 16px;}
  .moteur-badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .badge{font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:4px 8px; border-radius:8px; white-space:nowrap;}
  .badge-role{background:var(--panel-raised); color:var(--text-mid);}
  .badge-essential{background:var(--green-dim); color:var(--green);}
  .badge-professional{background:var(--amber-dim); color:var(--amber);}

  .bloc{margin-bottom:14px;}
  .bloc:last-of-type{margin-bottom:0;}
  .bloc-label{font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--cyan); margin-bottom:5px; display:flex; align-items:center; gap:6px;}
  .bloc-texte{font-size:12.5px; color:var(--text); line-height:1.6;}

  .bloc-exemple{background:var(--violet-dim); border:1px solid rgba(168,131,255,0.3); border-radius:10px; padding:12px 14px; margin-top:14px;}
  .bloc-exemple .bloc-label{color:var(--violet);}
  .bloc-exemple .bloc-texte{color:var(--text); font-style:italic;}

  .moteur-lien{display:block; text-align:center; margin-top:16px; font-family:var(--mono); font-size:11.5px; font-weight:600; color:#04141a; text-decoration:none; padding:11px 12px; background:var(--cyan); border-radius:9px;}

  .footer-lien{display:block; text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:20px;}
  .intro-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:16px; margin-bottom:16px; font-size:12px; color:var(--text-mid); line-height:1.6;}
  .intro-card b{color:var(--text);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a class="back-btn" href="NEXUS-App-v1.html">← Retour</a>
    <div class="eyebrow">NEXUS · Comprendre NEXUS</div>
    <div class="title">Comprendre NEXUS</div>
    <div class="soustitre">Découvrez quel moteur utiliser selon ce que vous voulez faire.</div>
  </div>
  <div class="divider"></div>
  <div class="content" id="app">
    <div class="section"><div class="moteur-resume-court" style="text-align:center; padding:40px 0; color:var(--text-dim);">Chargement…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-build.js"></script>
<script src="nexus-auth.js?v=20260903-1156"></script>
<script src="nexus-header-nav.js?v=20260903-1156"></script>
<script src="nexus-desktop.js?v=20260903-1156"></script>
<script>
  // ============================================================
  // NEXUS — COMPRENDRE NEXUS — v2 (07/08/2026, demande de Frédéric)
  //
  // Refonte pédagogique demandée après retour utilisateur sur la v1
  // ("Mode d'emploi") : "NEXUS doit partir de la problématique du
  // dirigeant et l'envoyer vers le bon moteur — pas lui demander de
  // connaître l'architecture du logiciel." Même principe que la refonte
  // Inventaire : faire comprendre au logiciel l'intention de
  // l'utilisateur, pas l'inverse.
  //
  // Deux points d'entrée cohabitent volontairement :
  // 1. "Que voulez-vous faire ?" (intentions) — la voie recommandée pour
  //    quelqu'un qui ne connaît pas encore les moteurs par leur nom.
  // 2. Parcours par catégorie (Piloter/Performer/...) + recherche — pour
  //    quelqu'un qui sait déjà ce qu'il cherche.
  //
  // Contenu rédigé à partir des commentaires réels laissés en tête de
  // chaque page NEXUS — jamais une fonctionnalité inventée qui n'existe
  // pas dans le code source réel. Si un moteur évolue, ce fichier devra
  // être mis à jour à la main : aucune génération automatique.
  //
  // Accès : nexusRequireAuth() uniquement — Essential ET Professional y
  // ont accès (pas de nexusRequireProfessional), seul un visiteur public
  // non connecté est bloqué (renvoyé vers NEXUS-Login-v1.html).
  // ============================================================

  const INTENTIONS = [
    { id: 'comprendre-activite', emoji: '🧭', label: 'Comprendre mon activité' },
    { id: 'augmenter-ventes', emoji: '📈', label: 'Augmenter mes ventes' },
    { id: 'ameliorer-marge', emoji: '💰', label: 'Améliorer ma marge' },
    { id: 'controler-caisses', emoji: '🧾', label: 'Contrôler mes caisses' },
    { id: 'maitriser-stocks', emoji: '📦', label: 'Maîtriser mes stocks' },
    { id: 'piloter-equipe', emoji: '👥', label: 'Piloter mon équipe' },
  ];

  // Réponse guidée par objectif (08/08/2026, demande de Frédéric) : "je ne
  // voudrais pas simplement voir une liste de moteurs [...] Puis seulement
  // les boutons correspondants." — un enchaînement rédigé, pas une liste
  // brute. Les noms de moteurs cités correspondent toujours à un m.nom
  // réel plus bas (Marge+ est la fonctionnalité qui vit dans Scanner NEXUS,
  // jamais un moteur séparé).
  const REPONSES_GUIDEES = {
    'comprendre-activite': "Commencez par <b>Brief NEXUS</b> pour un état des lieux complet en 5 minutes. Le <b>Cockpit</b> vous indique ensuite les priorités du jour, et le <b>Centre d'Intelligence NEXUS</b> vous aide à comprendre pourquoi un résultat évolue.",
    'augmenter-ventes': "<b>Scanner NEXUS</b> repère les catégories et produits à fort potentiel. <b>Rayon</b> et <b>Produits</b> vous permettent de descendre au détail. <b>Tempo</b> et <b>Campagnes</b> vous aident à choisir le bon moment pour agir.",
    'ameliorer-marge': "Commencez par <b>Marge+</b> (dans Scanner NEXUS) pour identifier les catégories et produits concernés. Utilisez ensuite <b>Produits</b> pour descendre à la référence. Si une action est identifiée, suivez son impact dans <b>Capital NEXUS</b>.",
    'controler-caisses': "Utilisez <b>Verify</b> : il centralise le contrôle des caisses, rapproche les justificatifs et fait ressortir les écarts à examiner. Le <b>Journal</b> retrouve le déroulé exact d'une journée, le <b>Cockpit</b> remonte les écarts prioritaires du jour, et <b>FDJ</b> fait le même travail spécifiquement pour la caisse grattage et tirages.",
    'maitriser-stocks': "<b>Inventaire</b> est l'écran de comptage terrain, et <b>Contrôle inventaire</b> la vue manager sur les écarts. <b>Scanner Stock</b> vous aide à prioriser vos prochains comptages, <b>Rappels</b> évite d'oublier une échéance comme le jaugeage carburant, et <b>FDJ</b> couvre le même besoin pour le stock de jeux à gratter.",
    'piloter-equipe': "<b>Résultats Équipe</b> et <b>Radar du Manager</b> donnent une vue d'ensemble. <b>Nexus Planner</b> organise le planning du mois, <b>Missions</b> et <b>Assignations</b> cadrent le travail au quotidien, et <b>Évaluations</b> permet de noter la tenue et la performance.",
  };

  // "Je ne sais pas par où commencer" (08/08/2026, ajusté le même jour) :
  // pas un filtre, une redirection directe — c'est exactement le rôle de
  // Brief NEXUS. 🧭 plutôt que 🤷 : NEXUS doit rassurer et prendre le
  // relais, pas paraître hésitant.
  const DEMARRAGE = {
    emoji: '🧭',
    titre: 'Vous ne savez pas où commencer ?',
    texte: 'Brief NEXUS analyse votre activité et vous montre les priorités du moment.',
    href: 'NEXUS-Brief-v1.html',
  };

  // Parcours recommandé par objectif (08/08/2026, demande de Frédéric) :
  // "quand l'utilisateur sélectionne un objectif [...] afficher
  // uniquement [un parcours numéroté]". Remplace l'affichage groupé par
  // catégorie tant qu'un objectif est actif. `id` doit toujours pointer
  // vers un m.id réel de MOTEURS ; `nomAffiche` permet d'afficher un nom
  // de fonctionnalité (ex. Marge+) tout en ouvrant le bon moteur.
  const PARCOURS = {
    'comprendre-activite': {
      titre: 'Pour comprendre votre activité, NEXUS vous recommande :',
      etapes: [
        { id: 'brief', texte: "voir l'état des lieux en 5 minutes" },
        { id: 'cockpit', texte: 'traiter les priorités du jour' },
        { id: 'cin', texte: "comprendre pourquoi un résultat évolue" },
        { id: 'journal', texte: "retrouver le déroulé exact d'une journée" },
      ],
    },
    'augmenter-ventes': {
      titre: 'Pour augmenter vos ventes, NEXUS vous recommande :',
      etapes: [
        { id: 'tempo', texte: 'identifier les jours et créneaux à renforcer' },
        { id: 'produits', texte: 'identifier les références qui sous-performent' },
        { id: 'campagnes', texte: 'mettre en place une action commerciale' },
        { id: 'capital', texte: "mesurer l'impact obtenu" },
      ],
    },
    'ameliorer-marge': {
      titre: 'Pour améliorer votre marge, NEXUS vous recommande :',
      etapes: [
        { id: 'scanner', nomAffiche: 'Marge+ (Scanner NEXUS)', texte: 'identifier les catégories et produits concernés' },
        { id: 'produits', texte: 'descendre jusqu\'à la référence' },
        { id: 'capital', texte: "suivre l'impact de la décision" },
      ],
    },
    'controler-caisses': {
      titre: 'Pour contrôler vos caisses, NEXUS vous recommande :',
      etapes: [
        { id: 'verify', texte: 'contrôler la caisse du jour et rapprocher les justificatifs' },
        { id: 'journal', texte: "retrouver le déroulé exact d'une journée" },
        { id: 'cockpit', texte: 'traiter les écarts prioritaires du jour' },
      ],
    },
    'maitriser-stocks': {
      titre: 'Pour maîtriser vos stocks, NEXUS vous recommande :',
      etapes: [
        { id: 'inventaire', texte: "compter à l'ouverture et à la clôture du poste" },
        { id: 'controle-inventaire', texte: 'trancher les écarts remontés du terrain' },
        { id: 'scanner-stock', texte: 'prioriser les prochains comptages' },
        { id: 'rappels', texte: 'ne pas oublier le jaugeage carburant' },
      ],
    },
    'piloter-equipe': {
      titre: 'Pour piloter votre équipe, NEXUS vous recommande :',
      etapes: [
        { id: 'planner', texte: 'construire le planning du mois' },
        { id: 'missions', texte: "cadrer le travail quotidien de l'équipe" },
        { id: 'resultats', texte: 'suivre qui progresse et qui décroche' },
        { id: 'evaluations', texte: 'noter la tenue et calculer la prime' },
      ],
    },
  };

  const MOTEURS = [
    // ---- PILOTER ----
    {
      id: 'brief', groupe: 'piloter', icone: '🧭', nom: 'Brief NEXUS', href: 'NEXUS-Brief-v1.html',
      role: 'Manager', forfait: null, intentions: ['comprendre-activite'],
      aQuoiCaSert: "En 5 minutes, voyez où en est votre entreprise, ce qui va bien, ce qui nécessite votre attention et les décisions prioritaires à prendre.",
      quandUtiliser: "Le matin, avant de commencer votre journée — pour savoir tout de suite sur quoi porter votre attention, sans devoir ouvrir sept écrans différents.",
      donneesSources: "Agrège les résultats déjà calculés par les autres moteurs NEXUS (Produits, Marge+, Tempo, Verify, Scanner Stock, Inventaire, Rappels) — jamais un nouveau calcul, toujours cohérent avec ce qu'affichent les écrans détaillés.",
      exempleConcret: "Votre marge boissons diminue depuis trois semaines. Brief NEXUS vous alerte. Le Centre d'Intelligence vous permet ensuite d'en rechercher les causes. Produits vous montre les références responsables.",
    },
    {
      id: 'cockpit', groupe: 'piloter', icone: '🏠', nom: 'Cockpit', href: 'NEXUS-Cockpit-v2.html',
      role: 'Tous', forfait: null, intentions: ['comprendre-activite', 'controler-caisses'],

  function normaliser(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function texteRecherche(m) {
    return normaliser([m.nom, m.aQuoiCaSert, m.quandUtiliser, m.donneesSources, m.exempleConcret || '', m.role].join(' '));
  }

  function badgeForfait(forfait) {
    if (forfait === 'professional') return '<span class="badge badge-professional">Professional</span>';
    return '<span class="badge badge-essential">Essential</span>';
  }

  function rendreMoteur(m) {
    return `
      <details class="moteur" data-id="${m.id}" data-intentions="${(m.intentions || []).join(',')}" data-recherche="${texteRecherche(m)}">
        <summary>
          <span class="moteur-icone">${m.icone}</span>
          <div class="moteur-titre-ligne">
            <div class="moteur-nom">${m.nom}</div>
            <div class="moteur-resume-court">${m.aQuoiCaSert.slice(0, 78)}${m.aQuoiCaSert.length > 78 ? '…' : ''}</div>
          </div>
          <span class="moteur-chevron">›</span>
        </summary>
        <div class="moteur-corps">
          <div class="moteur-badges">
            <span class="badge badge-role">${m.role}</span>
            ${badgeForfait(m.forfait)}
          </div>
          <div class="bloc">
            <div class="bloc-label">🔹 À quoi sert ce moteur ?</div>
            <div class="bloc-texte">${m.aQuoiCaSert}</div>
          </div>
          <div class="bloc">
            <div class="bloc-label">🔹 Quand l'utiliser ?</div>
            <div class="bloc-texte">${m.quandUtiliser}</div>
          </div>
          <div class="bloc">
            <div class="bloc-label">🔹 D'où viennent les données ?</div>
            <div class="bloc-texte">${m.donneesSources}</div>
          </div>
          ${m.exempleConcret ? `
            <div class="bloc-exemple">
              <div class="bloc-label">💬 Exemple concret</div>
              <div class="bloc-texte">${m.exempleConcret}</div>
            </div>
          ` : ''}
          <a class="moteur-lien" href="${m.href}">Ouvrir ${m.nom} →</a>
        </div>
      </details>
    `;
  }

  function render() {
    const app = document.getElementById('app');
    const intentionsHtml = INTENTIONS.map(i => `
      <div class="intention-chip" data-intention="${i.id}">
        <span class="ic-emoji">${i.emoji}</span>
        <span class="ic-label">${i.label}</span>
      </div>
    `).join('');

    const groupesHtml = ORDRE_GROUPES.map(g => {
      const items = MOTEURS.filter(m => m.groupe === g);
      if (!items.length) return '';
      const label = GROUPES_LABELS[g];
      return `
        <div class="groupe" data-groupe-bloc="${g}">
          <div class="groupe-titre">${label.titre}</div>
          <div class="groupe-desc">${label.desc}</div>
          ${items.map(rendreMoteur).join('')}
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="section">
        <div class="intro-card">
          <b>${MOTEURS.length} moteurs NEXUS</b> travaillent pour votre activité.<br>Choisissez votre objectif ou recherchez ce que vous voulez faire : NEXUS vous guide vers le bon outil.
        </div>
        <div class="recherche-box">
          <span>🔍</span>
          <input type="text" id="rechercheDoc" placeholder="Rechercher un moteur, une action, un mot-clé…">
        </div>
        <div class="recherche-compteur" id="rechercheCompteur"></div>

        <div class="intentions-card">
          <div class="intentions-titre">Que voulez-vous faire ?</div>
          <div class="intentions-sous">Choisissez votre objectif — NEXUS vous montre uniquement les moteurs concernés.</div>
          <div class="intentions-grille">${intentionsHtml}</div>
          <div class="reponse-guidee" id="reponseGuidee"></div>
          <div class="intention-demarrage" id="intentionDemarrage">
            <span class="id-emoji">${DEMARRAGE.emoji}</span>
            <div class="id-corps">
              <div class="id-titre">${DEMARRAGE.titre}</div>
              <div class="id-texte">${DEMARRAGE.texte}</div>
            </div>
            <span class="id-fleche">→</span>
          </div>
          <div class="intention-reset" id="intentionReset">← Revenir à tous les moteurs</div>
        </div>
      </div>
      <div class="section" id="parcoursZone" style="display:none;"></div>
      <div class="section" id="listeGroupes">
        ${groupesHtml}
        <div class="recherche-vide" id="rechercheVide">Aucun moteur ne correspond. Essayez un autre mot-clé, ou choisissez un objectif ci-dessus.</div>
      </div>
      <a class="footer-lien" href="NEXUS-App-v1.html">Retour à l'accueil NEXUS →</a>
    `;

    const input = document.getElementById('rechercheDoc');
    const compteur = document.getElementById('rechercheCompteur');
    const vide = document.getElementById('rechercheVide');
    const chips = Array.from(document.querySelectorAll('.intention-chip'));
    const resetChip = document.getElementById('intentionReset');
    const reponseGuidee = document.getElementById('reponseGuidee');
    const demarrageBtn = document.getElementById('intentionDemarrage');
    const parcoursZone = document.getElementById('parcoursZone');
    const listeGroupesEl = document.getElementById('listeGroupes');
    const tousLesDetails = Array.from(document.querySelectorAll('details.moteur'));
    const tousLesBlocsGroupe = Array.from(document.querySelectorAll('[data-groupe-bloc]'));
    let intentionActive = null;

    function reinitialiserAffichage() {
      parcoursZone.style.display = 'none';
      parcoursZone.innerHTML = '';
      listeGroupesEl.style.display = '';
      tousLesDetails.forEach(d => { d.style.display = ''; d.open = false; });
      tousLesBlocsGroupe.forEach(b => b.style.display = '');
      compteur.textContent = '';
      vide.style.display = 'none';
      reponseGuidee.classList.remove('visible');
      reponseGuidee.innerHTML = '';
    }

    // Parcours recommandé (08/08/2026) : remplace entièrement l'affichage
    // groupé par catégorie tant qu'un objectif est actif — "le clic sur
    // un objectif doit produire un parcours, pas seulement filtrer une
    // liste." Chaque étape ouvre directement le moteur concerné.
    function afficherParcours(id) {
      const data = PARCOURS[id];
      listeGroupesEl.style.display = 'none';
      if (!data) { parcoursZone.style.display = 'none'; parcoursZone.innerHTML = ''; return; }
      const etapesHtml = data.etapes.map((etape, i) => {
        const m = MOTEURS.find(mm => mm.id === etape.id);
        if (!m) return '';
        return `
          <a class="parcours-etape" href="${m.href}">
            <span class="parcours-numero">${i + 1}</span>
            <span class="parcours-icone">${m.icone}</span>
            <div class="parcours-corps">
              <div class="parcours-nom">${etape.nomAffiche || m.nom}</div>
              <div class="parcours-etape-texte">${etape.texte}</div>
            </div>
            <span class="parcours-fleche">→</span>
          </a>
        `;
      }).join('');
      parcoursZone.innerHTML = `<div class="parcours-titre">${data.titre}</div>${etapesHtml}`;
      parcoursZone.style.display = '';
    }

    // Un seul filtre actif à la fois — texte libre OU intention, jamais les
    // deux mélangés (07/08/2026) : garde l'expérience simple, "ne pas
    // surcharger l'esprit" comme demandé.
    function appliquerFiltre(predicat) {
      let nbTrouves = 0;
      tousLesBlocsGroupe.forEach(bloc => {
        const items = Array.from(bloc.querySelectorAll('details.moteur'));
        let nbVisiblesDansGroupe = 0;
        items.forEach(d => {
          const match = predicat(d);
          d.style.display = match ? '' : 'none';
          d.open = match && (Boolean(input.value.trim()) || Boolean(intentionActive));
          if (match) { nbVisiblesDansGroupe++; nbTrouves++; }
        });
        bloc.style.display = nbVisiblesDansGroupe ? '' : 'none';
      });
      compteur.textContent = nbTrouves ? `${nbTrouves} résultat${nbTrouves > 1 ? 's' : ''}` : '';
      vide.style.display = nbTrouves ? 'none' : 'block';
    }

    input.addEventListener('input', () => {
      const q = normaliser(input.value.trim());
      if (intentionActive) {
        intentionActive = null;
        chips.forEach(c => c.classList.remove('active'));
        resetChip.classList.remove('visible');
      }
      reinitialiserAffichage(); // repart toujours d'un état propre : groupes visibles, parcours masqué
      if (!q) return;
      appliquerFiltre(d => d.dataset.recherche.includes(q));
    });

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.dataset.intention;
        if (intentionActive === id) {
          // Re-cliquer sur le même objectif désactive le filtre.
          intentionActive = null;
          chips.forEach(c => c.classList.remove('active'));
          resetChip.classList.remove('visible');
          reinitialiserAffichage();
          return;
        }
        intentionActive = id;
        input.value = '';
        chips.forEach(c => c.classList.toggle('active', c === chip));
        resetChip.classList.add('visible');
        // La réponse guidée d'abord (08/08/2026) : une phrase qui
        // enchaîne les moteurs dans le bon ordre. Puis le parcours
        // numéroté remplace entièrement la liste groupée par catégorie
        // — "un guide de décision, pas un simple annuaire filtrable."
        reponseGuidee.innerHTML = REPONSES_GUIDEES[id] || '';
        reponseGuidee.classList.toggle('visible', Boolean(REPONSES_GUIDEES[id]));
        afficherParcours(id);
      });
    });

    demarrageBtn.addEventListener('click', () => {
      window.location.href = DEMARRAGE.href;
    });

    resetChip.addEventListener('click', () => {
      intentionActive = null;
      chips.forEach(c => c.classList.remove('active'));
      resetChip.classList.remove('visible');
      reinitialiserAffichage();
    });

    // Lien direct par intention (10/08/2026, refonte "Porte NEXUS" de
    // NEXUS-App-v1.html) : une carte "Que voulez-vous faire ?" de l'accueil
    // peut désormais arriver ici avec ?intention=piloter-equipe et
    // atterrir directement sur le bon parcours, au lieu de revenir sur la
    // liste complète des 6 objectifs à choisir soi-même. Réutilise le clic
    // existant sur le chip correspondant — aucune deuxième logique.
    const intentionUrl = new URLSearchParams(window.location.search).get('intention');
    if (intentionUrl) {
      const chipCible = chips.find(c => c.dataset.intention === intentionUrl);
      if (chipCible) chipCible.click();
    }
  }

  (async function init() {
    const employee = await nexusRequireAuth();
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    render();
  })();
</script>
</body>
</html>
