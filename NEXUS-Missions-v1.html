<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0B0F14">
<title>NEXUS — Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-auth.js"></script>
<script src="nexus-desktop.js"></script>
<script src="nexus-periodes.js"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);}

  .header{padding:20px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:20px; font-weight:600; margin-top:4px;}
  .role-jour{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .role-jour a{color:var(--cyan); text-decoration:none;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}

  .search-wrap{padding:14px 20px 8px;}
  .search-box{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:11px 14px;}
  .search-box input{flex:1; background:none; border:none; outline:none; color:var(--text); font-family:var(--sans); font-size:13.5px;}
  .search-box input::placeholder{color:var(--text-dim);}

  .tabs{display:flex; gap:6px; padding:10px 20px; overflow-x:auto;}
  .tab{
    flex-shrink:0; padding:7px 13px; border-radius:20px; font-size:11.5px; font-weight:600;
    background:var(--panel); border:1px solid var(--hairline); cursor:pointer; color:var(--text-mid); white-space:nowrap;
  }
  .tab.active{background:rgba(79,195,217,0.12); border-color:var(--cyan); color:var(--cyan);}

  .section{padding:6px 20px 20px;}
  .section-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin:14px 0 10px; display:flex; align-items:center; gap:8px;}
  /* Correctif alignement (03/08/2026, signalé par Frédéric sur capture
     d'écran) : #categoriesSection et #niveauxSection n'ont pas la classe
     .section (qui donne un padding horizontal de 20px aux autres blocs de
     la page) — leur .section-label se retrouvait donc collé au bord de
     l'écran, alors que .categories-grid/.niveaux-wrap juste en dessous ont
     bien leur propre marge de 20px. Ce correctif aligne le libellé sur la
     grille, sans toucher .section-label ailleurs (où le padding du parent
     .section suffit déjà). */
  #categoriesSection .section-label, #niveauxSection .section-label{margin-left:20px; margin-right:20px;}
  .section-label::after{content:''; flex:1; height:1px; background:var(--hairline);}
  /* Liste "Vos missions" dépliable (03/08/2026, demande de Frédéric) — même
     mécanique de chevron rotatif que .categorie-groupe-head ailleurs dans
     NEXUS (Scanner Stock). */
  .section-label-pliable{cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .section-label-pliable .chev{color:var(--text-dim); font-size:12px; transition:transform .15s; display:inline-block; flex-shrink:0;}
  .section-label-pliable.open .chev{transform:rotate(90deg);}

  .mission-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .mission-head{padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .mission-titre{font-size:13.5px; font-weight:600; flex:1;}
  .mission-meta{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:3px;}
  /* Missions conditionnelles (03/08/2026, retour détaillé de Frédéric) :
     jamais comptées dans les obligations ou le potentiel du jour — un badge
     rappelle qu'elles ne s'appliquent que si une situation réelle survient. */
  .mission-conditionnelle-badge{font-family:var(--mono); font-size:9px; letter-spacing:0.02em; color:var(--amber); margin-top:4px;}
  .sous-section-label{font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); margin:16px 0 8px; padding-left:2px;}
  .badge{font-family:var(--mono); font-size:9.5px; padding:3px 8px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .badge-critique{background:var(--red-dim); color:var(--red);}
  .badge-haute{background:var(--amber-dim); color:var(--amber);}
  .badge-normale{background:rgba(79,195,217,0.12); color:var(--cyan);}
  .badge-basse{background:var(--panel-raised); color:var(--text-dim);}
  .badge-auto{background:var(--green-dim); color:var(--green);}
  .badge-controle{background:rgba(79,195,217,0.12); color:var(--cyan);}

  .mission-body{display:none; padding:0 16px 16px; border-top:1px solid var(--hairline);}
  .mission-body.open{display:block;}
  .mission-pourquoi{font-size:12px; color:var(--text-mid); line-height:1.5; margin:12px 0;}
  .check-item{display:flex; align-items:flex-start; gap:10px; padding:8px 0; font-size:12.5px; cursor:pointer;}
  .check-box{width:18px; height:18px; border:1.5px solid var(--text-dim); border-radius:5px; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:12px;}
  .check-box.checked{background:var(--green); border-color:var(--green); color:#04141a;}
  .check-text.checked{color:var(--text-dim); text-decoration:line-through;}
  .mission-photo{font-family:var(--mono); font-size:10px; color:var(--amber); margin-top:10px;}
  /* Photo par action (27/07/2026, demande de Frédéric — prise de poste
     pompiste) : chaque étape de la checklist exige sa propre preuve photo
     avant de pouvoir être cochée, au lieu d'une seule photo globale en fin
     de mission (voir mission_catalog.photo_par_action). */
  .check-item-photo .check-text{flex:1;}
  .check-photo-badge{flex-shrink:0; font-family:var(--mono); font-size:9.5px; color:var(--amber); white-space:nowrap;}
  .check-photo-badge.done{color:var(--green);}

  .produit-cible-picker{margin-top:12px;}
  .produit-recherche-wrap{position:relative; margin-top:6px;}
  .produit-recherche{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; padding:10px 12px; color:var(--text); font-family:var(--sans); font-size:12.5px;}
  .produit-suggestions{margin-top:6px; display:flex; flex-direction:column; gap:4px; max-height:180px; overflow-y:auto;}
  .produit-suggestion-item{padding:9px 12px; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; cursor:pointer; font-size:12px;}
  .produit-suggestion-item:active{border-color:var(--cyan);}
  .produit-suggestion-item .psi-cat{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); margin-top:2px;}
  .produit-choisi{margin-top:6px; padding:10px 12px; background:var(--green-dim); color:var(--green); border-radius:8px; font-size:12.5px; font-weight:600;}
  .produit-changer{font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--text-mid); text-decoration:underline; cursor:pointer; margin-left:6px;}
  .btn-valider{
    width:100%; margin-top:12px; padding:12px; border:none; border-radius:8px; font-size:13px; font-weight:600;
    background:var(--cyan); color:#04141a; cursor:pointer;
  }
  .btn-valider:disabled{opacity:0.3; cursor:not-allowed;}
  .validation-ok{margin-top:12px; padding:10px; text-align:center; background:var(--green-dim); color:var(--green); border-radius:8px; font-size:12.5px; font-weight:600;}

  .controle-banner{background:rgba(79,195,217,0.08); border:1px solid rgba(79,195,217,0.3); border-radius:8px; padding:10px 12px; font-size:11.5px; color:var(--cyan); line-height:1.5; margin:12px 0;}
  /* Avertissement sécurité pompiste (27/07/2026, demande de Frédéric) —
     interdiction NEXUS/téléphone à la vue d'un client et sur la piste de
     distribution de carburant. Toujours visible en haut de ses missions,
     jamais masqué par la recherche : c'est une consigne de sécurité, pas
     un contenu accessoire. */
  .warning-securite{background:var(--red-dim); border:1px solid rgba(240,87,90,0.4); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--red); line-height:1.55; margin:0 0 14px;}
  .warning-securite b{color:var(--red);}
  .warning-securite-ligne{display:flex; align-items:center; flex-wrap:wrap; gap:8px; justify-content:space-between;}
  .warning-securite-toggle{background:none; border:1px solid rgba(240,87,90,0.4); color:var(--red); font-family:var(--mono); font-size:9.5px; letter-spacing:0.02em; padding:4px 9px; border-radius:20px; cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .warning-securite-detail{display:none; margin-top:8px; padding-top:8px; border-top:1px solid rgba(240,87,90,0.25);}
  .warning-securite-detail.open{display:block;}
  .presence-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-dim); margin:16px 0 6px;}
  .presence-item{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12.5px; cursor:pointer;}
  .presence-box{width:16px; height:16px; border:1.5px solid var(--text-dim); border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px;}
  .presence-box.checked{background:var(--cyan); border-color:var(--cyan); color:#04141a;}
  .evaluer-liens{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .evaluer-lien{font-family:var(--mono); font-size:11.5px; color:var(--cyan); text-decoration:none;}

  .empty-note{padding:30px 20px; text-align:center; color:var(--text-dim); font-size:12.5px;}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}
  .plan-card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; margin-bottom:10px; overflow:hidden; border-left:3px solid var(--hairline);}
  .plan-card.etat-agir{border-left-color:#F0575A;}
  .plan-card.etat-opportunite{border-left-color:#34D399;}
  .plan-card.etat-surveiller{border-left-color:#F5A623;}
  .plan-card.etat-decider{border-left-color:#F0575A;}
  .plan-card.etat-recommandation{border-left-color:#4FC3D9;}
  .plan-head{padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px;}
  .plan-etat{font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; padding:3px 9px; border-radius:20px; font-weight:700; white-space:nowrap;}
  .etat-agir .plan-etat{background:#3A1D1F; color:#F0575A;}
  .etat-opportunite .plan-etat{background:#153629; color:#34D399;}
  .etat-surveiller .plan-etat{background:#3A2E14; color:#F5A623;}
  .etat-decider .plan-etat{background:#3A1D1F; color:#F0575A;}
  .etat-recommandation .plan-etat{background:rgba(79,195,217,0.12); color:#4FC3D9;}
  .plan-action-teaser{flex:1; font-size:13.5px; font-weight:600; line-height:1.4;}
  .plan-chevron{color:var(--text-dim); font-size:14px; transition:0.15s;}
  .plan-card.open .plan-chevron{transform:rotate(90deg);}
  .plan-body{display:none; padding:0 16px 16px;}
  .plan-card.open .plan-body{display:block;}
  .plan-story{font-size:12.5px; line-height:1.75; color:var(--text-mid);}
  .plan-story .story-label{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); display:block; margin-top:10px; margin-bottom:2px;}
  .plan-impact{margin-top:12px; padding:10px 12px; background:var(--panel-raised); border-radius:8px; font-size:12px;}
  .plan-impact b{color:#34D399;}
  .plan-valider{width:100%; margin-top:12px; padding:11px; border:none; border-radius:8px; font-size:12.5px; font-weight:600; background:var(--green); color:#04141a; cursor:pointer;}

  .conseiller-perso{background:linear-gradient(135deg, rgba(79,195,217,0.08), rgba(79,195,217,0.02)); border:1px solid rgba(79,195,217,0.25); border-radius:14px; padding:16px 18px; margin:0 20px 14px; opacity:1; transition:opacity 0.5s ease;}
  /* Accueil renfort (03/08/2026) : le message de bienvenue s'efface en
     douceur avant que la recommandation Coach habituelle ne prenne sa
     place, voir renderConseillerPersoAvecAccueil. */
  .conseiller-perso-sortant{opacity:0;}
  .conseiller-perso-head{display:flex; align-items:center; gap:11px; margin-bottom:10px;}
  .conseiller-perso-avatar{width:42px; height:42px; border-radius:50%; object-fit:cover; flex-shrink:0; filter:drop-shadow(0 0 9px rgba(79,195,217,0.5));}
  .conseiller-perso-nom{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--cyan); letter-spacing:0.03em;}
  .conseiller-perso-sous{font-family:var(--mono); font-size:9px; color:var(--text-dim);}
  .conseiller-perso-texte{font-size:12.5px; line-height:1.6; color:var(--text);}
  .conseiller-perso-palier{margin-top:12px;}
  .conseiller-perso-palier-ligne{font-family:var(--mono); font-size:10px; color:var(--text-mid); display:flex; justify-content:space-between; margin-bottom:5px;}
  .conseiller-perso-bar-track{height:6px; background:var(--panel-raised); border-radius:3px; overflow:hidden;}
  .conseiller-perso-bar{height:100%; background:var(--cyan); border-radius:3px;}
  .conseiller-perso-cta-btn{width:100%; margin-top:13px; padding:11px; border:none; border-radius:8px; font-size:12.5px; font-weight:600; background:var(--cyan); color:#04141a; cursor:pointer;}
  /* Signalement d'affluence renfort (03/08/2026) — bouton secondaire,
     jamais aussi appuyé que le CTA principal cyan, sauf une fois actif. */
  .conseiller-perso-affluence-btn{width:100%; margin-top:8px; padding:10px; border:1px solid rgba(240,180,60,0.4); border-radius:8px; font-size:12px; font-weight:600; background:none; color:var(--amber); cursor:pointer;}
  .conseiller-perso-affluence-btn.actif{background:rgba(240,180,60,0.14); border-color:var(--amber);}

  /* Restructuration en 2 niveaux (03/08/2026, demande de Frédéric) : bloc
     "Votre journée", catégories avec points disponibles, niveaux de points
     10/7/5/2. */
  .journee-card{margin:0 20px 14px; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px 18px;}
  .journee-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}
  .journee-points{font-size:22px; font-weight:700; margin-top:4px;}
  .journee-detail{font-family:var(--mono); font-size:11.5px; color:var(--text-mid); margin-top:6px; line-height:1.6;}
  .journee-lien{display:inline-block; margin-top:10px; font-family:var(--mono); font-size:11.5px; color:var(--cyan); text-decoration:none;}
  /* Nouveau système de score (03/08/2026, demande de Frédéric) : évolution
     vs le dernier service comparable, même code couleur que le classement
     de Résultats Équipe (hausse/baisse/stable). */
  .journee-evolution{font-family:var(--mono); font-size:11px; margin-top:6px; display:flex; align-items:center; gap:5px;}
  .journee-evolution.hausse{color:var(--green);}
  .journee-evolution.baisse{color:var(--red);}
  .journee-evolution.stable{color:var(--text-dim);}
  .journee-attente{font-family:var(--mono); font-size:11px; color:var(--amber); margin-top:4px;}
  .journee-obligatoires{font-family:var(--mono); font-size:10.5px; color:var(--cyan); margin-top:2px;}
  /* Score du jour v2 (03/08/2026) : prochaine priorité actionnable
     directement dans le bloc, même choix que le Conseiller personnel. */
  /* .journee-priorite est devenu un bloc autonome (03/08/2026, retour de
     Frédéric — "prochaine priorité" placée juste après "Score du jour",
     avant les missions obligatoires) : reprend le même habillage carte
     que .journee-card au lieu de dépendre de son padding parent. */
  .journee-priorite{margin:0 20px 14px; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:16px 18px;}
  .journee-priorite-label{font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}
  .journee-priorite-titre{font-size:14px; font-weight:600; margin-top:4px;}
  .journee-priorite-detail{font-family:var(--mono); font-size:11px; color:var(--text-mid); margin-top:3px;}
  .journee-priorite-btn{width:100%; margin-top:10px; padding:11px; border:none; border-radius:9px; background:var(--cyan); color:#04141a; font-size:13px; font-weight:600; cursor:pointer;}
  .journee-priorite-btn:active{opacity:0.85;}

  .categories-grid{margin:0 20px 14px; display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .categorie-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px 14px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .categorie-card.active{border-color:var(--cyan); background:rgba(79,195,217,0.08);}
  .categorie-nom{font-size:12.5px; font-weight:600;}
  .categorie-points{font-family:var(--mono); font-size:10.5px; color:var(--cyan); margin-top:4px;}
  .categorie-card.active .categorie-points{color:var(--cyan);}
  .categorie-vide{opacity:0.5;}

  .niveaux-wrap{margin:0 20px 14px; display:flex; flex-direction:column; gap:8px;}
  .niveau-chip{
    background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:12px 14px;
    cursor:pointer; -webkit-tap-highlight-color:transparent; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .niveau-chip.active{border-color:var(--cyan); background:rgba(79,195,217,0.08);}
  .niveau-chip-titre{font-size:12.5px; font-weight:700;}
  .niveau-chip-desc{font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:2px;}
  .niveau-chip-stat{font-family:var(--mono); font-size:10.5px; color:var(--text-mid); text-align:right; white-space:nowrap;}
  .niveau-chip-stat b{color:var(--cyan);}
  .niveau-chip-tous{justify-content:center; color:var(--text-mid); font-family:var(--mono); font-size:11px;}

</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Plans d'action</div>
    <div class="title">Vos plans d'action</div>
    <div class="role-jour" id="roleJourLigne"></div>
  </div>
  <div class="divider"></div>

  <!-- Ordre d'affichage terrain (03/08/2026, retour détaillé de Frédéric —
       "la priorité opérationnelle doit apparaître avant les filtres") :
       1. Score du jour  2. Prochaine priorité  3. Missions obligatoires
       avant le départ (+ bannière sécurité, recommandations manager,
       missions assignées)  4. Coach NEXUS  5. Missions disponibles
       6. Catégories et filtres (dont la recherche)  7. Missions
       conditionnelles, en dernier. Chaque fonction de rendu cible son
       propre <div> par id — voir renderJourneeSection/renderPrioriteSection/
       render()/renderCategoriesSection/renderNiveauxSection/
       renderConseillerPerso plus bas ; l'ordre visuel est entièrement
       déterminé par la position de ces <div> ici, indépendamment de
       l'ordre des appels JS. -->
  <div id="journeeSection"></div>
  <div id="prioriteSection"></div>
  <div class="section desktop-grid" id="obligatoiresSection"></div>
  <div id="conseillerPersoSection"></div>
  <div class="section desktop-grid" id="disponiblesSection"></div>

  <div id="categoriesSection"></div>
  <div id="niveauxSection"></div>
  <div class="search-wrap">
    <div class="search-box"><span>🔍</span><input type="text" id="search" placeholder="Rechercher un plan d'action..."></div>
  </div>

  <!-- desktop-grid (02/08/2026) : mise en colonnes en vue bureau (voir
       nexus-desktop.js) — purement additif, aucun effet en mobile. -->
  <div class="section desktop-grid" id="conditionnellesSection"></div>
  <footer>NEXUS Plans d'action v1 · 55 procédures · Cahier de Notes de Services intégré</footer>
</div>

<script>
  let catalogue = [];
  let roleDuJour = null;
  // "quart" (matin/soir) du service en cours + service comparable précédent
  // (03/08/2026, demande de Frédéric) — voir chargerDernierServiceComparable.
  let quartDuJour = null;
  let dernierServiceComparable = null;

  // Intitulé "Renfort opérationnel" (03/08/2026, demande de Frédéric) :
  // renommage d'affichage uniquement, partout où le rôle du jour est montré
  // en texte à l'employé — la valeur interne reste 'renfort' (shifts.role,
  // mission_catalog.role_required), voir aussi ROLES dans
  // NEXUS-Prise-De-Poste-v1.html qui porte le même libellé côté sélection.
  function libelleRole(role) {
    return role === 'renfort' ? 'Renfort opérationnel' : role;
  }

  // CORRIGE le 26/07/2026 (Frédéric a signalé un résidu : une mission
  // "Renfort A — Bière Heineken 50cl" figée, générée par l'ancien système
  // de démo pré-20/07/2026, suggérée en boucle par le Conseiller
  // personnel). Deux garde-fous ajoutés pour que ça ne puisse plus se
  // reproduire, y compris pour un futur site :
  //   1) .eq('site_id', SITE_ACTUEL) — un site ne charge plus jamais le
  //      catalogue d'un autre site (avant, aucun filtre de site n'était
  //      appliqué du tout sur cette requête).
  //   2) .eq('ponctuelle', false) — les missions ponctuelles (créées via
  //      le bouton "Créer une mission" de Scanner) ne font plus jamais
  //      partie du catalogue récurrent ni des suggestions quotidiennes du
  //      Conseiller personnel (voir choisirMissionSuggeree ci-dessous) —
  //      elles vivent uniquement dans mission_assignments, affichées et
  //      clôturables depuis la section "Missions assignées" plus bas.
  // Fenêtre horaire (03/08/2026, demande de Frédéric : "Ouverture station"
  // ne doit plus être proposée après 6h du matin) — exploite la colonne
  // mission_catalog.time_window, posée mais jamais utilisée jusqu'ici.
  // Convention : 'avant-HH:MM' = mission visible strictement avant cette
  // heure locale ; toute autre valeur (dont null) laisse la mission
  // visible sans restriction — jamais masquer une mission sur une donnée
  // mal formée plutôt qu'un vrai motif d'exclusion.
  function missionDansSaFenetreHoraire(m, maintenant) {
    if (!m.time_window) return true;
    const match = /^avant-(\d{2}):(\d{2})$/.exec(m.time_window);
    if (!match) return true;
    const limite = new Date(maintenant);
    limite.setHours(Number(match[1]), Number(match[2]), 0, 0);
    return maintenant < limite;
  }

  async function chargerCatalogue() {
    const { data, error } = await nexusClient
      .from('mission_catalog')
      .select('*')
      .eq('actif', true)
      .eq('ponctuelle', false)
      .eq('site_id', SITE_ACTUEL);
    if (error) { console.error('Chargement catalogue:', error); return []; }
    const maintenant = new Date();
    return (data || []).filter(m => missionDansSaFenetreHoraire(m, maintenant));
  }

  // Corrige le 21/07/2026 (Frederic a signale devoir reconfirmer sa
  // prise de poste a chaque retour sur cet ecran) : l'ancienne version
  // comparait heure_debut a des chaines "AAAA-MM-JJT00:00:00" / "T23:59:59"
  // SANS fuseau horaire explicite — une comparaison ambigue contre une
  // colonne timestamptz, potentiellement mal interpretee selon le fuseau
  // de session Postgres. Remplace par une vraie fenetre glissante de 24h,
  // avec des bornes ISO completes (avec "Z", donc UTC sans ambiguite) —
  // en plus de corriger ce risque, ca correspond exactement a la demande
  // de Frederic : la prise de poste reste valable 24h, pas jusqu'a minuit.
  async function chargerShiftAujourdhui(employeeId) {
    const il24h = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
    const { data, error } = await nexusClient
      .from('shifts')
      // "quart" (03/08/2026, demande de Frédéric) : récupéré en plus de
      // "role" pour permettre la comparaison au dernier service comparable
      // (même rôle ET même quart) — voir chargerDernierServiceComparable.
      .select('role, quart')
      .eq('employee_id', employeeId)
      .gte('heure_debut', il24h)
      .order('heure_debut', { ascending: false })
      .limit(1);
    if (error) { console.error('Chargement shift du jour:', error); return null; }
    return (data && data[0]) ? data[0] : null;
  }

  // Évolution vs le dernier service comparable (03/08/2026, demande de
  // Frédéric) : "comparable" = même rôle ET même quart (matin/soir) — les
  // standards d'un quart du matin en pompiste n'ont pas de sens comparés à
  // un quart du soir en caissière. On cherche le service précédent le plus
  // récent dans les mêmes conditions (avant aujourd'hui), et son total de
  // points gagnés ce jour-là (validés + en attente, comme le score du jour
  // actuel — on compare deux choses de même nature).
  async function chargerDernierServiceComparable(employeeId, role, quart) {
    if (!role || !quart) return null;
    const { data, error } = await nexusClient
      .from('shifts')
      .select('heure_debut')
      .eq('employee_id', employeeId)
      .eq('role', role)
      .eq('quart', quart)
      .order('heure_debut', { ascending: false })
      .limit(10);
    if (error) { console.error('Chargement dernier service comparable:', error); return null; }
    const aujISO = new Date().toISOString().slice(0, 10);
    const precedent = (data || []).find(s => new Date(s.heure_debut).toISOString().slice(0, 10) !== aujISO);
    if (!precedent) return null;
    const dateISO = new Date(precedent.heure_debut).toISOString().slice(0, 10);

    const { data: completions, error: erreurCompletions } = await nexusClient
      .from('mission_completions')
      .select('points, points_ajustement')
      .eq('employee_id', employeeId)
      .eq('date', dateISO);
    if (erreurCompletions) { console.error('Chargement complétions service comparable:', erreurCompletions); return null; }
    const points = (completions || []).reduce((s, c) => s + (c.points || 0) + (c.points_ajustement || 0), 0);
    return { date: dateISO, points };
  }

  // Employes actifs du site — utilise pour le "controle manager" (cf.
  // estMissionControleManager) : le manager coche qui etait present sur
  // site au moment du controle, puis peut les evaluer directement.
  async function chargerEmployesSite() {
    const { data, error } = await nexusClient.from('employees').select('id, nom').eq('site_id', SITE_ACTUEL).eq('actif', true).order('nom');
    if (error) { console.error('Chargement employés (contrôle mission):', error); return []; }
    return data || [];
  }
  let EMPLOYES_SITE = [];
  let presentsState = {};

  // Nuance demandee par Frederic (20/07/2026, precisee le 20/07/2026) : pour
  // le manager, le nettoyage et la gestion des dechets sont des CONTROLES —
  // il verifie que l'equipe l'a fait, il ne le fait pas lui-meme. Cible sur
  // le titre de la mission (pas sur toute la famille Qualite/Securite, qui
  // peut contenir d'autres missions que le manager execute lui-meme).
  // Applique uniquement quand l'ecran est vu par un manager (les employes
  // gardent leurs missions "a faire" normales).
  function estMissionControleManager(m) {
    if (roleDuJour !== 'manager') return false;
    const titre = (m.titre || '').toLowerCase();
    return titre.includes('nettoyage') || titre.includes('déchet') || titre.includes('dechet');
  }

  const FAMILLES = ["Toutes","Commerce","Qualité","Sécurité","Exploitation","Management"];
  let familleActive = "Toutes";
  const missionsOuvertes = new Set();
  // Bannière sécurité compacte (03/08/2026, demande de Frédéric) : repliée
  // par défaut sur la page Missions, jamais perdue — juste réduite à une
  // ligne pour ne plus repousser les missions vers le bas.
  let warningSecuriteOuvert = false;

  // Repli des sous-blocs de la liste "Vos missions", généralisé à tous les
  // rôles (03/08/2026, demande de Frédéric — "repli les missions partout
  // également") : remplace l'ancien toggle unique "Vos missions — rôle X"
  // qui ouvrait/fermait tout d'un bloc. Chaque sous-bloc (Obligatoires/
  // Disponibles/Conditionnelles pour la plupart des rôles, Priorités du
  // service/Disponibles entre deux urgences/Conditionnelles en plus pour le
  // renfort — voir plus bas) se replie indépendamment, et seul le bloc le
  // plus directement actionnable reste ouvert par défaut (obligatoires pour
  // les rôles classiques, "à faire maintenant" pour le renfort — géré à
  // part via missionsAssigneesZone, pas dans cet objet). Le reste démarre
  // replié pour ne jamais donner l'impression d'une liste insurmontable à
  // l'ouverture de la page. Pendant une recherche active, un bloc s'ouvre
  // automatiquement pour ne jamais masquer un résultat (voir blocListe()).
  let blocsListeOuverts = { obligatoires: true, disponibles: false, conditionnelles: false, priorites: false, creux: false };

  // Signalement d'affluence (03/08/2026, demande de Frédéric — "pendant une
  // affluence, la boutique est prioritaire") : un état AUTO-DÉCLARÉ par le
  // renfort ou son manager, jamais une détection automatique — NEXUS n'a
  // aucun flux caisse/file d'attente en temps réel, exactement comme pour
  // les livraisons (voir "Déclarer cette livraison" dans Inventaire, même
  // principe). N'est pas persisté (localStorage) : un état "affluence en
  // cours" doit rester court par nature ; mieux vaut qu'un rafraîchissement
  // de page le remette à zéro plutôt qu'il ne reste bloqué toute la journée
  // en cas d'oubli. Un filet de sécurité supplémentaire (minuteurFinAffluence)
  // le désactive automatiquement au bout de 45 minutes pour la même raison.
  let affluenceEnCours = false;
  let afficherApresAffluenceUneFois = false;
  let minuteurFinAffluence = null;
  const DUREE_MAX_AFFLUENCE_MIN = 45;

  // Trouve la mission de soutien immédiat la plus pertinente (caisse
  // d'abord, piste ensuite) non encore validée aujourd'hui — utilisée
  // uniquement pendant une affluence signalée.
  function missionSoutienActiviteRenfort() {
    const aujISO = new Date().toISOString().slice(0, 10);
    const faitesAujourdhui = new Set(completionsCache.filter(c => c.date === aujISO).map(c => c.mission_id));
    const titresSoutien = ['Soutien immédiat à la caisse', 'Soutien immédiat à la piste'];
    for (const titre of titresSoutien) {
      const m = catalogue.find(x => x.titre === titre && Array.isArray(x.role_required) && x.role_required.includes('renfort') && !faitesAujourdhui.has(x.mission_id));
      if (m) return m;
    }
    return null;
  }

  // Hiérarchie de priorité du renfort (03/08/2026, demande détaillée de
  // Frédéric — "le renfort doit suivre cette hiérarchie") :
  //   1. Danger ou problème de sécurité
  //   2. Client en attente ou affluence
  //   3. Salissure présentant un risque
  //   4. Réception de marchandise
  //   5. Rupture ou réassort prioritaire
  //   6. Sanitaires et espace café
  //   7. Inventaire tournant
  //   8. Entretien planifié
  //   9. Facing et amélioration visuelle
  // Dérivée du titre/famille/points réels de chaque mission plutôt que
  // d'une table de correspondance mission par mission — sur 71 missions
  // renfort, une table à la main serait impossible à tenir à jour de façon
  // fiable ; ces règles restent lisibles et modifiables si un cas particulier
  // doit être corrigé. Utilisée uniquement pour le classement du Coach (voir
  // choisirMissionSuggeree) — jamais pour changer la classification
  // obligatoire/disponible/conditionnelle ni les 4 blocs de la liste.
  function rangHierarchieRenfort(m) {
    const t = (m.titre || '').toLowerCase();
    if (t.includes('sécurité') || t.includes('risque') || t.includes('danger') || t.includes('panneau') || t.includes('sensible')) return 1;
    if (t.includes('affluence') || t.includes('soutien immédiat')) return 2;
    if (t.includes('salissure')) return 3;
    if (t.includes('réception') || t.includes('livraison')) return 4;
    if (t.includes('rupture') || (t.includes('réassort') && (m.points || 0) >= 7) || t.includes('rayon en tension')) return 5;
    if (t.includes('sanitaire') || t.includes('wc') || t.includes('café')) return 6;
    if (t.includes('inventaire')) return 7;
    if (t.includes('facing') || t.includes('présentoir') || t.includes('affichage')) return 9;
    return 8; // entretien planifié — niveau par défaut du reste (nettoyage, consommables, rangement...)
  }

  // Restructuration en 2 niveaux (03/08/2026, demande de Frédéric) : les
  // missions récurrentes sont regroupées par palier de points (barème
  // 10/7/5/2 fixé le même jour dans mission_catalog — voir migration
  // regrader_missions_bareme_10_7_5_2). niveauActif filtre la liste en plus
  // de familleActive (les deux se combinent, indépendamment) — null = tous
  // les niveaux.
  const NIVEAUX = [
    { pts: 10, emoji: '🏆', nom: 'Missions essentielles', desc: 'Critiques : sécurité, caisse, ouverture et fermeture.' },
    { pts: 7, emoji: '⭐', nom: 'Missions prioritaires', desc: 'Impact direct sur l’activité.' },
    { pts: 5, emoji: '💪', nom: 'Missions régulières', desc: 'Utiles au bon fonctionnement.' },
    { pts: 2, emoji: '⚡', nom: 'Actions rapides', desc: 'Simples, mais nécessaires.' },
  ];
  let niveauActif = null;

  // Missions du rôle du jour, dans le catalogue déjà filtré (site, actif,
  // ponctuelle, fenêtre horaire — voir chargerCatalogue). Factorisé ici
  // (03/08/2026) car utilisé à la fois par render(), choisirMissionSuggeree
  // et calculerPotentielJour — un seul et même filtre de rôle partout.
  function missionsDuRoleAujourdhui() {
    return catalogue.filter(m => Array.isArray(m.role_required) && m.role_required.includes(roleDuJour));
  }

  // Potentiel de points du jour (03/08/2026, demande de Frédéric) : points
  // déjà obtenus aujourd'hui (mission_completions du jour, en tenant compte
  // d'un éventuel retrait manager via points_ajustement — voir
  // NEXUS-Resultats-Equipe-v1.html, mécanisme déjà existant), points encore
  // accessibles (missions du rôle pas encore faites), répartis par famille
  // et par niveau de points. Jamais un chiffre inventé : uniquement basé
  // sur le catalogue réellement chargé et les complétions réelles.
  // Obligatoire / disponible / conditionnelle (03/08/2026, retour détaillé de
  // Frédéric sur l'interface employé) : "22 missions obligatoires restantes"
  // comptait TOUTES les missions du rôle non faites, y compris des missions
  // purement situationnelles (livraison carburant, anomalie technique,
  // impayé...) qui n'ont aucune raison de peser sur le sentiment de charge
  // du jour. mission_catalog.disponibilite distingue maintenant :
  //   - obligatoire   : à faire à chaque service concerné
  //   - disponible    : recommandé mais flexible selon le rythme du service
  //   - conditionnelle: seulement si une situation réelle survient — jamais
  //                     comptée dans le potentiel de points ni le taux de
  //                     réalisation, affichée à part (voir render()).
  function calculerPotentielJour() {
    const aujISO = new Date().toISOString().slice(0, 10);
    const faitesAujourdhui = new Set(completionsCache.filter(c => c.date === aujISO).map(c => c.mission_id));
    const missions = missionsDuRoleAujourdhui();

    const parFamille = {};
    const parNiveau = {};
    let pointsDisponibles = 0;
    let missionsObligatoiresTotal = 0;
    let missionsObligatoiresFaites = 0;

    missions.forEach(m => {
      const fait = faitesAujourdhui.has(m.mission_id);
      const conditionnelle = m.disponibilite === 'conditionnelle';

      if (m.disponibilite === 'obligatoire') {
        missionsObligatoiresTotal += 1;
        if (fait) missionsObligatoiresFaites += 1;
      }

      // Les missions conditionnelles restent en dehors des totaux — ce ne
      // sont pas des tâches prévues pour aujourd'hui, seulement des tâches
      // disponibles SI une situation réelle survient.
      if (conditionnelle) return;

      if (!parFamille[m.famille]) parFamille[m.famille] = { nbTotal: 0, nbFaites: 0, pointsDisponibles: 0 };
      const pf = parFamille[m.famille];
      pf.nbTotal += 1;
      if (fait) pf.nbFaites += 1; else pf.pointsDisponibles += m.points;

      if (!parNiveau[m.points]) parNiveau[m.points] = { nbTotal: 0, nbFaites: 0, pointsDisponibles: 0 };
      const pn = parNiveau[m.points];
      pn.nbTotal += 1;
      if (fait) pn.nbFaites += 1; else pn.pointsDisponibles += m.points;

      if (!fait) pointsDisponibles += m.points;
    });

    const completionsAujourdhui = completionsCache.filter(c => c.date === aujISO);
    // Score du jour : la ligne principale est désormais les points VALIDÉS
    // (03/08/2026, demande de Frédéric — "le score doit distinguer gagné,
    // validé et en attente") — un chiffre honnête, jamais gonflé par des
    // missions pas encore confirmées. Les points en attente restent
    // affichés séparément, jamais cachés.
    const pointsObtenusAujourdhui = completionsAujourdhui
      .reduce((s, c) => s + (c.points || 0) + (c.points_ajustement || 0), 0);
    const pointsValidesAujourdhui = completionsAujourdhui
      .filter(c => (c.statut_validation || 'valide') === 'valide')
      .reduce((s, c) => s + (c.points || 0) + (c.points_ajustement || 0), 0);
    const pointsEnAttenteAujourdhui = pointsObtenusAujourdhui - pointsValidesAujourdhui;

    return { parFamille, parNiveau, pointsDisponibles, missionsObligatoiresTotal, missionsObligatoiresFaites, pointsObtenusAujourdhui, pointsValidesAujourdhui, pointsEnAttenteAujourdhui };
  }

  // Catégorie où se concentre le plus de points disponibles — utilisé pour
  // contextualiser "X points disponibles" (03/08/2026, demande de Frédéric :
  // "114 points disponibles, dont 31 en sécurité").
  function familleTopPotentiel(parFamille) {
    let top = null, max = 0;
    Object.entries(parFamille).forEach(([f, v]) => { if (v.pointsDisponibles > max) { max = v.pointsDisponibles; top = f; } });
    return top ? { famille: top, points: max } : null;
  }

  // Score du jour v2 (03/08/2026, retour détaillé de Frédéric sur
  // l'interface employé) :
  //  - la ligne principale est désormais les points VALIDÉS, jamais un
  //    total "gagné" qui mélangeait validé et en attente sans le dire ;
  //  - progression sur les missions OBLIGATOIRES seulement (petit nombre
  //    réaliste), plus jamais un total qui inclut les missions
  //    conditionnelles ;
  //  - "premier service mesuré" quand aucun historique comparable
  //    n'existe encore, plutôt qu'une comparaison à 0 dénuée de sens ;
  //  - la prochaine priorité du Coach est actionnable directement ici
  //    (bouton "Commencer cette mission"), pas seulement dans le message
  //    du Conseiller personnel plus bas.
  function renderJourneeSection(potentiel) {
    const el = document.getElementById('journeeSection');
    if (!el) return;
    if (!missionsDuRoleAujourdhui().length) { el.innerHTML = ''; return; }

    let evolutionHtml;
    if (dernierServiceComparable) {
      const delta = potentiel.pointsValidesAujourdhui - dernierServiceComparable.points;
      const classe = delta > 0 ? 'hausse' : delta < 0 ? 'baisse' : 'stable';
      const icone = delta > 0 ? '▲' : delta < 0 ? '▼' : '=';
      const signe = delta > 0 ? '+' : '';
      evolutionHtml = `<div class="journee-evolution ${classe}">${icone} ${signe}${delta} pt${Math.abs(delta) > 1 ? 's' : ''} vs votre dernier service comparable (${dernierServiceComparable.points} pts)</div>`;
    } else {
      evolutionHtml = `<div class="journee-evolution stable">Premier service mesuré — votre référence commence aujourd'hui.</div>`;
    }

    const attenteHtml = potentiel.pointsEnAttenteAujourdhui > 0
      ? `<div class="journee-attente">${potentiel.pointsEnAttenteAujourdhui} point${potentiel.pointsEnAttenteAujourdhui > 1 ? 's' : ''} en attente de validation</div>`
      : '';

    const obligatoiresHtml = potentiel.missionsObligatoiresTotal > 0
      ? `<div class="journee-obligatoires">${potentiel.missionsObligatoiresFaites} / ${potentiel.missionsObligatoiresTotal} mission${potentiel.missionsObligatoiresTotal > 1 ? 's' : ''} obligatoire${potentiel.missionsObligatoiresTotal > 1 ? 's' : ''} terminée${potentiel.missionsObligatoiresTotal > 1 ? 's' : ''}</div>`
      : `<div class="journee-obligatoires">Aucune mission obligatoire pour l'instant</div>`;

    const top = familleTopPotentiel(potentiel.parFamille);
    const dispoLigne = `${potentiel.pointsDisponibles} point${potentiel.pointsDisponibles > 1 ? 's' : ''} disponible${potentiel.pointsDisponibles > 1 ? 's' : ''}${top ? `, dont ${top.points} en ${top.famille}` : ''}`;

    el.innerHTML = `
      <div class="journee-card">
        <div class="journee-label">Score du jour</div>
        ${obligatoiresHtml}
        <div class="journee-points">${potentiel.pointsValidesAujourdhui} point${potentiel.pointsValidesAujourdhui > 1 ? 's' : ''} validé${potentiel.pointsValidesAujourdhui > 1 ? 's' : ''}</div>
        ${attenteHtml}
        ${evolutionHtml}
        <div class="journee-detail">${dispoLigne}</div>
        <a class="journee-lien" href="NEXUS-Progression-v1.html">Consulter votre score dans Ma Progression →</a>
      </div>`;
  }

  // Prochaine priorité (03/08/2026, retour détaillé de Frédéric — "la
  // priorité opérationnelle doit apparaître avant les filtres") : extraite
  // du bloc "Score du jour" en son propre bloc autonome, positionné juste
  // après lui. Même choix que le Conseiller personnel plus bas — jamais un
  // second calcul divergent — et exclut déjà les missions conditionnelles
  // depuis choisirMissionSuggeree().
  function renderPrioriteSection(potentiel) {
    const el = document.getElementById('prioriteSection');
    if (!el) return;
    if (!missionsDuRoleAujourdhui().length) { el.innerHTML = ''; return; }

    const suggestion = choisirMissionSuggeree();
    if (!suggestion || !suggestion.mission) { el.innerHTML = ''; return; }

    const m = suggestion.mission;
    const detailsPriorite = [
      m.estimated_duration_min ? `Environ ${m.estimated_duration_min} min` : null,
      m.points ? `${m.points} point${m.points > 1 ? 's' : ''}` : null,
    ].filter(Boolean).join(' · ');

    el.innerHTML = `
      <div class="journee-priorite">
        <div class="journee-priorite-label">Prochaine priorité</div>
        <div class="journee-priorite-titre">${m.titre}</div>
        ${detailsPriorite ? `<div class="journee-priorite-detail">${detailsPriorite}</div>` : ''}
        <button class="journee-priorite-btn" id="btnCommencerPriorite">Commencer cette mission</button>
      </div>`;

    const btnPriorite = document.getElementById('btnCommencerPriorite');

  function typeActionPourCategorie(categorie) {
    const c = (categorie || '').toLowerCase();
    if (c.includes('gaz')) return 'stock';
    if (c.includes('carte') || c.includes('prépayé') || c.includes('prepaye') || c.includes('transcash') || c.includes('pcs')) return 'support';
    if (c.includes('pain') || c.includes('patisserie') || c.includes('pâtisserie') || c.includes('viennoiserie') || c.includes('sandwich') || c.includes('snack')) return 'production';
    if (c.includes('tabac') || c.includes('cigarette') || c.includes('paquet de')) return 'comptoir';
    if (c.includes('presse')) return 'presentoir';
    return 'facing';
  }

  // Supabase plafonne chaque requete a 1000 lignes par defaut, sans erreur —
  // ce helper boucle par pages de 1000 jusqu'a tout recuperer. Meme correctif
  // que Cockpit/CIN (trouve le 15/07/2026).
  async function fetchAllRows(builderFactory, pageSize = 1000) {
    let toutes = [];
    let from = 0;
    while (true) {
      const { data, error } = await builderFactory().range(from, from + pageSize - 1);
      if (error) return { data: null, error };
      toutes = toutes.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    return { data: toutes, error: null };
  }

  async function construirePlansAction() {
    const [{ data, error }, produitsAppel] = await Promise.all([
      fetchAllRows(() => nexusClient
        .from('products')
        .select('categorie, article, ca, marge, periode_debut, periode_fin')
        .eq('site', SITE_ACTUEL)
        .order('periode_debut', { ascending: false })
        .order('article', { ascending: true })),
      chargerProduitsAppel(),
    ]);
    if (error || !data || !data.length) { if (error) console.error('Chargement products (plans action):', error); return []; }

    const rowsBrut = data.filter(r => !produitsAppel.has(r.article));

    // CORRECTIF 23/07/2026 (harmonisation demandée par Frédéric : "un système,
    // pas une succession de pages") — même bug et même correctif que sur
    // Rayon/Cockpit/Produits/Centre-Intelligence le même jour : comparer
    // aveuglément les deux périodes les plus récentes fabrique une évolution
    // fausse dès qu'elles se chevauchent ou n'ont pas une durée comparable.
    // Le moteur partagé nexus-periodes.js sépare "période affichée" (sert au
    // calcul R4, qui ne dépend d'aucun historique) de "paire comparable"
    // (utilisée uniquement pour R3-HAUSSE/R2-BAISSE, et seulement si la
    // période affichée en fait elle-même partie).
    const { periodeAffichage, rowsAffichage: rowsActuels, paire, rowsPairePrecedente, periodeEnCours } = NexusPeriodes.analyserPeriodes(rowsBrut);
    if (!periodeAffichage) { console.error('Aucune période exploitable dans products.'); return []; }
    const rowsPrecedentsComparables = (paire && !periodeEnCours) ? rowsPairePrecedente : [];

    const caTotalParRayon = {};
    rowsActuels.forEach(r => { caTotalParRayon[r.categorie] = (caTotalParRayon[r.categorie] || 0) + (r.ca || 0); });

    const precedentParArticle = {};
    rowsPrecedentsComparables.forEach(r => {
      const cle = r.categorie + '|' + r.article;
      precedentParArticle[cle] = (precedentParArticle[cle] || 0) + (r.ca || 0);
    });

    const candidats = [];
    const fmt = v => Math.round(v).toLocaleString('fr-FR');

    rowsActuels.forEach(p => {
      const caRayon = caTotalParRayon[p.categorie] || 0;
      const contribution = caRayon > 0 ? p.ca / caRayon : 0;
      const cle = p.categorie + '|' + p.article;
      const caPrec = precedentParArticle[cle];
      const evolution = (caPrec && caPrec > 0) ? (p.ca - caPrec) / caPrec : null;

      if (contribution >= 0.15 && p.ca > 0) {
        const lang = LANGAGE_ACTION[typeActionPourCategorie(p.categorie)];
        candidats.push({
          etat: "🔥 À AGIR", rule_id: "R4-RENFORT-A", article: p.article, categorie: p.categorie,
          situation: `${p.article} représente ${(contribution*100).toFixed(1)} % du chiffre d'affaires du rayon ${p.categorie}.`,
          contexte: "Cette contribution est calculée sur l'ensemble des références du rayon.",
          analyse: lang.analyseAgir,
          consequence: lang.consAgir(fmt(p.ca)),
          recommandation: lang.recoAgir(p.article),
          impact: `Vous sécurisez environ ${fmt(p.ca)} € de chiffre d'affaires déjà généré par cette référence.`,
          candidate_id: `LIVE-R4-${cle}`, impact_eur: p.ca,
        });
      }
      if (evolution !== null && evolution >= 0.20) {
        const gain = Math.max(p.ca - caPrec, 0);
        const lang = LANGAGE_ACTION[typeActionPourCategorie(p.categorie)];
        candidats.push({
          etat: "📈 OPPORTUNITÉ", rule_id: "R3-HAUSSE", article: p.article, categorie: p.categorie,
          situation: `Les ventes de ${p.article} progressent de ${(evolution*100).toFixed(1)} % sur la période.`,
          contexte: "Cette progression est mesurée entre les deux périodes importées.",
          analyse: "Cette dynamique dépasse une croissance ordinaire.",
          consequence: "Cette croissance peut être amplifiée si l'offre suit la demande.",
          recommandation: lang.recoHausse(p.article),
          impact: `Vous avez gagné environ ${fmt(gain)} € sur cette référence depuis la période précédente.`,
          candidate_id: `LIVE-R3-${cle}`, impact_eur: gain,
        });
      }
      if (evolution !== null && evolution <= -0.30) {
        const perte = Math.max(caPrec - p.ca, 0);
        const lang = LANGAGE_ACTION[typeActionPourCategorie(p.categorie)];
        candidats.push({
          etat: "🟡 À SURVEILLER", rule_id: "R2-BAISSE", article: p.article, categorie: p.categorie,
          situation: `Les ventes de ${p.article} chutent de ${(evolution*100).toFixed(1)} % sur la période.`,
          contexte: "NEXUS ne dispose pas de la donnée de stock pour cette référence.",
          analyse: "Je ne peux pas encore conclure à une vraie tendance sans vérification terrain.",
          consequence: "Une rupture non détectée expliquerait aussi bien cette baisse qu'un désintérêt réel.",
          recommandation: lang.recoBaisse(p.article),
          impact: "Vérification demandée — aucune conclusion tant que le stock n'est pas confirmé.",
          candidate_id: `LIVE-R2-${cle}`, impact_eur: perte,
        });
      }
    });

    candidats.sort((a, b) => b.impact_eur - a.impact_eur);
    return candidats;
  }

  async function chargerMissionsAssignees() {
    const { data, error } = await nexusClient
      .from('mission_assignments')
      .select('id, mission_id, due_at, note, status')
      .eq('site_id', SITE_ACTUEL)
      .eq('assigned_to_employee_id', employeeId)
      .eq('status', 'assignee')
      .order('due_at', { ascending: true });
    if (error) { console.error('Chargement missions assignées:', error); return []; }
    if (!data || !data.length) return [];

    const missionIds = [...new Set(data.map(a => a.mission_id))];
    const { data: missions, error: erreurCatalogue } = await nexusClient
      .from('mission_catalog')
      .select('mission_id, titre, pourquoi, priority, points')
      .in('mission_id', missionIds);
    if (erreurCatalogue) { console.error('Chargement catalogue (missions assignées):', erreurCatalogue); return []; }

    const catalogueParId = {};
    (missions || []).forEach(m => { catalogueParId[m.mission_id] = m; });
    return data
      .map(a => ({ ...a, mission: catalogueParId[a.mission_id] || null }))
      .filter(a => a.mission); // ignore une assignation orpheline (mission désactivée entre-temps)
  }

              ${a.due_at ? `<div class="plan-impact">📅 Échéance — <b>${new Date(a.due_at).toLocaleDateString('fr-FR')}</b></div>` : ''}
              <button class="plan-valider" data-assignee-id="${a.id}" data-mission-id="${a.mission_id}" data-titre="${a.mission.titre.replace(/"/g,'&quot;')}" data-points="${a.mission.points || 5}">✓ Marquer comme terminée</button>
            </div>

      el.querySelectorAll('.plan-valider').forEach(btn => {

    }
    if (!assignees.length) { el.innerHTML = ''; return; }

    el.innerHTML = `
      <div class="section-label">Missions assignées</div>
      ${assignees.map(a => `
        <div class="plan-card" id="assignee-${a.id}">
          <div class="plan-head" onclick="document.getElementById('assignee-${a.id}').classList.toggle('open')">
            ${priorityBadge(a.mission.priority || 'normale')}
            <span class="plan-action-teaser">${a.mission.titre}</span>
            <span class="plan-chevron">›</span>
          </div>
          <div class="plan-body">
            <div class="plan-story">${a.mission.pourquoi || a.note || ''}</div>
            ${a.due_at ? `<div class="plan-impact">📅 Échéance — <b>${new Date(a.due_at).toLocaleDateString('fr-FR')}</b></div>` : ''}
            <button class="plan-valider" data-assignee-id="${a.id}" data-mission-id="${a.mission_id}" data-titre="${a.mission.titre.replace(/"/g,'&quot;')}" data-points="${a.mission.points || 5}">✓ Marquer comme terminée</button>
          </div>
        </div>`).join('')}
    `;
    el.querySelectorAll('.plan-valider').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        btn.disabled = true;
        btn.textContent = 'Enregistrement…';
        await cloturerMissionAssignee(btn.dataset.assigneeId, btn.dataset.missionId, btn.dataset.titre, Number(btn.dataset.points));
        renderConseillerPerso(calculerStatsPersonnelles(completionsCache), employeActuel);
        await renderMissionsAssignees();

  }

  let employeActuel = null;
  let employeeId = null;
  let SITE_ACTUEL = 'vito-sainte-marie'; // ecrase par employee.site_id une fois connecte
  let checkState = {};
  // Photo par action (27/07/2026) : { "missionId_index": photoUrl } — ne
  // contient une entrée que pour les items déjà photographiés, sur les
  // missions mission_catalog.photo_par_action = true.
  let itemPhotoState = {};
  // Anti-rebond ouverture appareil photo (05/08/2026, retour employé —
  // "l'appareil s'est figé") : { clé: timestamp du dernier vrai
  // déclenchement }. Un tapotement répété pendant que l'appareil photo est
  // déjà en train de s'ouvrir relançait un second (voire un troisième)
  // appareil photo en parallèle, ce qui pouvait bloquer le téléphone. Clé =
  // "missionId_index" pour une photo par étape, ou missionId seul pour la
  // photo de preuve globale d'une mission — jamais de collision entre les
  // deux formats.
  let dernierTapAppareilPhoto = {};
  const DELAI_ANTI_REBOND_PHOTO_MS = 1500;
  let completionsCache = [];
  // Heure d'arrivée réelle du jour (03/08/2026, correction demandée par
  // Frédéric) : l'ancien seuil "fin de service" (horloge murale >= 16h,
  // seul) pouvait suggérer une mission de clôture à un employé qui venait
  // tout juste de pointer son arrivée en fin d'après-midi — incohérent.
  // Chargée une fois au démarrage (voir chargerHeureArriveeAujourdhui),
  // utilisée par choisirMissionSuggeree pour exiger un vrai temps écoulé
  // depuis l'arrivée, en plus de l'heure murale.
  let heureArriveeAujourdhui = null;

  async function chargerHeureArriveeAujourdhui(employeeId) {
    const d = new Date();
    const todayISO = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const { data, error } = await nexusClient
      .from('pointages').select('heure').eq('employee_id', employeeId).eq('date', todayISO).eq('type', 'arrivee').maybeSingle();
    if (error) { console.error('Chargement heure arrivée (suggestion Coach):', error); return null; }
    return (data && data.heure) ? new Date(`${todayISO}T${data.heure}`) : null;
  }
  // Produit choisi pour les missions necessite_produit = true (ex. "Photo
  // de vérification rayon") — { missionId: {categorie, article} }. Voir
  // migration-mission-photo-produit-v1.sql.
  let produitCibleState = {};
  let PRODUITS_ARTICLES = [];

  // Liste légère (categorie + article seulement) pour le sélecteur de
  // produit — mêmes lignes que products, mais pas besoin des prix/CA ici.
  async function chargerProduitsPourPhoto() {
    const { data, error } = await fetchAllRows(() => nexusClient
      .from('products')
      .select('categorie, article')
      .eq('site', SITE_ACTUEL));
    if (error) { console.error('Chargement produits (photo rayon):', error); return []; }
    const vus = new Set();
    const liste = [];
    (data || []).forEach(r => {
      const cle = r.categorie + '|' + r.article;
      if (!vus.has(cle)) { vus.add(cle); liste.push({ categorie: r.categorie, article: r.article }); }
    });
    liste.sort((a, b) => a.article.localeCompare(b.article, 'fr'));
    return liste;
  }

  // Retourne { checkState, photoState } (27/07/2026, ajout photo_url) —
  // deux maps distinctes plutôt qu'un seul objet mélangé, pour que le
  // reste du code garde exactement la même forme qu'avant sur checkState.
  async function chargerProgressionSupabase(empId) {
    const { data, error } = await nexusClient
      .from('mission_progress')
      .select('mission_id, checklist_index, checked, photo_url')
      .eq('employee_id', empId);
    if (error) { console.error('Chargement progression:', error); return { checkState: {}, photoState: {} }; }
    const checkStateChargee = {};
    const photoStateChargee = {};
    (data || []).forEach(row => {
      const key = `${row.mission_id}_${row.checklist_index}`;
      if (row.checked) checkStateChargee[key] = true;
      if (row.photo_url) photoStateChargee[key] = row.photo_url;
    });
    return { checkState: checkStateChargee, photoState: photoStateChargee };
  }

  // photoUrl (27/07/2026, photo par action) : optionnel, seulement fourni
  // pour les missions mission_catalog.photo_par_action = true. `null`
  // efface explicitement une photo existante (cas d'un item décoché pour
  // recommencer) plutôt que de laisser une preuve périmée en base.
  async function sauvegarderProgressionItem(empId, missionId, index, checked, photoUrl) {
    const { error } = await nexusClient
      .from('mission_progress')
      .upsert(
        { employee_id: empId, mission_id: missionId, checklist_index: index, checked, photo_url: photoUrl || null, updated_at: new Date().toISOString() },
        { onConflict: 'employee_id,mission_id,checklist_index' }

    if (error) console.error('Sauvegarde progression:', error);

  function priorityBadge(p) {
    return `<span class="badge badge-${p}">${p}</span>`;
  }

  // Sélecteur de produit pour les missions necessite_produit = true (ex.
  // "Photo de vérification rayon") — l'employé cherche par nom, choisit
  // dans la liste réelle du catalogue (pas de saisie libre : ça garantit
  // que article_cible correspond toujours exactement à products.article,

        <div class="produit-cible-picker">

  // photoParAction (27/07/2026, demande de Frédéric — prise de poste
  // pompiste) : quand la mission l'exige (mission_catalog.photo_par_action),
  // chaque item affiche une pastille caméra au lieu d'être coché
  // directement — voir le listener dédié dans render() plus bas, qui
  // ouvre l'appareil photo et ne coche l'item qu'après upload réussi.
  function renderChecklist(missionId, checklist, photoParAction) {
    // Filet de sécurité (05/08/2026, retour employé — "je n'arrive pas à
    // voir les détails des missions") : certaines missions générées par le
    // Conseiller NEXUS n'ont pas de checklist (checklist = [] en base), et
    // une checklist absente/mal formée ne doit plus jamais faire planter
    // tout l'affichage — elle est simplement traitée comme vide.
    const items = Array.isArray(checklist) ? checklist : [];
    return items.map((item, i) => {
      const key = `${missionId}_${i}`;
      const checked = checkState[key];
      const photoUrl = itemPhotoState[key];
      if (photoParAction) {
        return `<div class="check-item check-item-photo" data-key="${key}" data-photo="1">
          <div class="check-box ${checked?'checked':''}">${checked?'✓':''}</div>
          <div class="check-text ${checked?'checked':''}">${item}</div>
          <span class="check-photo-badge ${photoUrl?'done':''}">${photoUrl ? '📷 fait' : '📷 photo requise'}</span>
          <input type="file" accept="image/*" capture="environment" class="check-photo-input" data-key="${key}" style="display:none;">
        </div>`;
      }
      return `<div class="check-item" data-key="${key}">
        <div class="check-box ${checked?'checked':''}">${checked?'✓':''}</div>
        <div class="check-text ${checked?'checked':''}">${item}</div>
      </div>`;
    }).join('');
  }

  async function chargerCompletionsSupabase(empId) {
    const { data, error } = await nexusClient
      .from('mission_completions')
      .select('*')
      .eq('employee_id', empId);
    if (error) { console.error('Chargement complétions:', error); return []; }
    return data || [];

  async function sauvegarderCompletionSupabase(empId, entry) {
    const { error } = await nexusClient
      .from('mission_completions')
      .insert({
        employee_id: empId, mission_id: entry.mission_id, titre: entry.titre,
        date: entry.date, heure: entry.heure, photo_fournie: entry.photo_fournie,

        employes_presents: entry.employes_presents || null,
        article_cible: entry.article_cible || null, categorie_cible: entry.categorie_cible || null,
        // Points en attente de validation (03/08/2026, demande de Frédéric) :
        // seules les missions à preuve photo passent par une validation
        // manager avant que leurs points comptent comme "validés" — voir
        // NEXUS-Resultats-Equipe-v1.html pour l'action de validation.
        statut_validation: entry.statut_validation || 'valide',
      });
