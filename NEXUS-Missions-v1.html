  }

  // Redimensionnement côté client avant envoi (05/08/2026, retour employé —
  // "l'appareil s'est figé" en prenant une photo de preuve) : une photo
  // brute d'un téléphone récent pèse souvent 5 à 15 Mo. Envoyée telle
  // quelle depuis une connexion mobile/wifi de station-service, l'upload
  // peut prendre plus d'une minute sans aucun retour visuel — ce qui donne
  // l'impression que l'application (voire le téléphone) est figée. On
  // redescend à une taille raisonnable pour une preuve (max 1600px de
  // côté, JPEG 82%), ce qui réduit très fortement le temps d'envoi. En cas
  // d'échec du redimensionnement (format non supporté, navigateur ancien,
  // etc.), on retombe simplement sur le fichier d'origine plutôt que de
  // bloquer la preuve.
  async function redimensionnerPhoto(file) {
    try {
      if (!file.type || !file.type.startsWith('image/') || typeof createImageBitmap !== 'function') return file;
      const bitmap = await createImageBitmap(file);
      const MAX_COTE = 1600;
      const ratio = Math.min(1, MAX_COTE / Math.max(bitmap.width, bitmap.height));
      if (ratio === 1) { if (bitmap.close) bitmap.close(); return file; } // déjà assez petite
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * ratio);
      canvas.height = Math.round(bitmap.height * ratio);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      if (bitmap.close) bitmap.close();
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
      if (!blob) return file;
      return new File([blob], file.name || 'photo.jpg', { type: 'image/jpeg' });
    } catch (err) {
      console.error('Redimensionnement photo (on garde le fichier original) :', err);
      return file;
    }
  }

  // Upload reel du fichier vers Supabase Storage (bucket prive) + lien signe
  // longue duree, enregistre directement en base — remplace l'ancien
  // comportement qui ne verifiait qu'un booleen sans jamais conserver le
  // fichier (corrige le 15/07/2026, a la demande explicite de Frederic).
  async function uploaderPreuvePhoto(missionId, file) {
    const fichier = await redimensionnerPhoto(file);
    const ext = (fichier.name && fichier.name.includes('.')) ? fichier.name.split('.').pop().toLowerCase() : 'jpg';
    const chemin = `${employeeId}/${missionId}-${Date.now()}.${ext}`;
    const { error: erreurUpload } = await nexusClient.storage
      .from('preuves-missions')
      .upload(chemin, fichier, { contentType: fichier.type || 'image/jpeg' });
    if (erreurUpload) { console.error('Upload preuve photo:', erreurUpload); return null; }

    const DIX_ANS = 315360000;
    const { data: signee, error: erreurSignee } = await nexusClient.storage
      .from('preuves-missions')
      .createSignedUrl(chemin, DIX_ANS);
    if (erreurSignee) { console.error('URL signée preuve photo:', erreurSignee); return null; }
    return signee.signedUrl;
  }

  const POINTS_PAR_PRIORITE = {critique:10, haute:7, normale:5, basse:3};

  // ------------------------------------------------------------
  // Conseiller NEXUS côté employé (21/07/2026, demande de Frédéric) —
  // même avatar, même voix que côté manager, mais adressé directement
  // à la personne connectée. Règle non négociable héritée du Conseiller
  // Contextuel : jamais un chiffre ou un compliment qui ne vient pas
  // d'une donnée réelle. Tout ce qui suit est calculé depuis
  // completionsCache (les missions RÉELLEMENT validées par cet
  // employé, déjà chargées) — rien n'est estimé ni décoratif.
  // ------------------------------------------------------------
  const PALIERS_MISSIONS = [10, 25, 50, 100, 200, 500];

  function calculerStatsPersonnelles(completions) {
    const parJour = {};
    completions.forEach(c => {
      if (!parJour[c.date]) parJour[c.date] = 0;
      parJour[c.date] += 1;
    });

    // Streak : jours consécutifs avec au moins une mission validée, en
    // remontant depuis aujourd'hui. Si rien n'est encore validé
    // aujourd'hui, on part d'hier plutôt que de casser un vrai streak
    // juste parce que la journée vient de commencer.
    const aujISO = new Date().toISOString().slice(0, 10);
    let curseur = new Date();
    if (!parJour[aujISO]) curseur.setDate(curseur.getDate() - 1);
    let streak = 0;
    while (true) {
      const iso = curseur.toISOString().slice(0, 10);
      if (parJour[iso]) { streak += 1; curseur.setDate(curseur.getDate() - 1); } else break;
    }

    const now = new Date();
    const jourSemaineISO = (now.getDay() + 6) % 7; // 0 = lundi
    const lundi = new Date(now);
    lundi.setDate(now.getDate() - jourSemaineISO);
    const lundiISO = lundi.toISOString().slice(0, 10);
    const completionsSemaine = completions.filter(c => c.date >= lundiISO);
    const missionsSemaine = completionsSemaine.length;
    const pointsSemaine = completionsSemaine.reduce((s, c) => s + (c.points || 0), 0);

    const totalMissions = completions.length;
    const totalAvantAujourdhui = totalMissions - (parJour[aujISO] || 0);
    const palierFrancheAujourdhui = PALIERS_MISSIONS.find(p => totalAvantAujourdhui < p && totalMissions >= p) || null;
    const prochainPalier = PALIERS_MISSIONS.find(p => totalMissions < p) || null;

    return { streak, missionsSemaine, pointsSemaine, totalMissions, palierFrancheAujourdhui, prochainPalier };
  }

  // Un seul fil de pensée, pas un constat suivi d'un ordre séparé — la
  // suggestion découle explicitement du fait personnel qui précède
  // ("ne cassons pas cette série", "pour continuer sur cette lancée"),
  // pour donner l'impression d'un conseil qui connaît la situation,
  // pas de deux blocs décorrélés. Demande de Frédéric le 21/07/2026.
  function messageConseillerPerso(stats, suggestion, prenom, pointsObtenusAujourdhui, etatAffluence) {
    etatAffluence = etatAffluence || {};

    // Affluence signalée par le renfort lui-même (03/08/2026, demande de
    // Frédéric) : priorité absolue sur tout le reste du message, y compris
    // sur le cas "rien à faire" — la file passe avant tout. Voir
    // affluenceEnCours/missionSoutienActiviteRenfort.
    if (etatAffluence.affluenceEnCours) {
      return suggestion
        ? `${prenom}, la boutique est prioritaire : soutenez la file avant de reprendre « ${suggestion.mission.titre} ».`
        : `${prenom}, la boutique est prioritaire : soutenez la file clients.`;
    }

    if (!suggestion) {
      // Fin d'affluence signalée, plus aucune mission à reprendre (03/08/2026).
      if (etatAffluence.apresAffluence) {
        return `${prenom}, la situation est revenue à la normale. Tout est à jour pour l'instant — beau travail.`;
      }
      if (stats.palierFrancheAujourdhui) {
        return `${prenom}, ${stats.palierFrancheAujourdhui}ᵉ mission validée aujourd'hui et tout est à jour pour l'instant — beau travail.`;
      }
      return pointsObtenusAujourdhui > 0
        ? `${prenom}, ${pointsObtenusAujourdhui} points obtenus aujourd'hui et tout est à jour pour l'instant — beau travail.`
        : `${prenom}, tout est à jour pour aujourd'hui. Rien de plus à faire pour l'instant.`;
    }

    // Phrasé plus direct et naturel (03/08/2026, retour détaillé de
    // Frédéric) : le prénom ouvre la phrase ("Frédéric, votre prochaine
    // priorité est…"), et la durée/les points forment une phrase séparée
    // ("Elle prend environ X min et rapporte Y points."), au lieu d'être
    // accolés au titre entre parenthèses/tirets.
    const t = suggestion.mission.titre;
    const dureeTxt = suggestion.mission.estimated_duration_min ? `environ ${suggestion.mission.estimated_duration_min} min` : null;
    // Mention du poids en points (03/08/2026, demande de Frédéric) : purement
    // informatif — l'ordre de suggestion reste priorité > durée (voir
    // choisirMissionSuggeree), jamais trié par points, pour ne pas pousser
    // à ne choisir que les missions à forte valeur.
    const ptsTxt = suggestion.mission.points ? `${suggestion.mission.points} point${suggestion.mission.points > 1 ? 's' : ''}` : null;
    let phraseDureePoints = '';
    if (dureeTxt && ptsTxt) phraseDureePoints = ` Elle prend ${dureeTxt} et rapporte ${ptsTxt}.`;
    else if (dureeTxt) phraseDureePoints = ` Elle prend ${dureeTxt}.`;
    else if (ptsTxt) phraseDureePoints = ` Elle rapporte ${ptsTxt}.`;

    // Fin d'affluence signalée, une mission à reprendre (03/08/2026,
    // exemple donné par Frédéric : "La situation est revenue à la normale.
    // Reprenez le réassort des boissons froides : 7 points, environ 12
    // minutes.") — utilise la vraie suggestion du moment, jamais un
    // exemple figé.
    if (etatAffluence.apresAffluence) {
      return `${prenom}, la situation est revenue à la normale. Reprenez « ${t} ».${phraseDureePoints}`;
    }

    if (suggestion.presqueFinie) {
      return `${prenom}, la checklist de « ${t} » est déjà entièrement cochée — il ne manque que la validation.`;
    }
    // Mission de clôture suggérée (03/08/2026, demande de Frédéric) : à ce
    // stade, choisirMissionSuggeree() a déjà vérifié qu'on est réellement
    // en fin de service (heure murale ET temps écoulé depuis l'arrivée) —
    // message dédié, plus valorisant qu'un simple "prochaine étape". Retiré
    // le "facilement" (03/08/2026) : le Coach cherche la mission la plus
    // utile pour clore le service, pas la plus simple.
    if (estMissionDeCloture(suggestion.mission)) {
      // Renfort (03/08/2026, "coordinateur mobile") : bilan réel du service
      // (zones soutenues = familles distinctes validées aujourd'hui, points
      // validés) avant la dernière priorité — jamais de chiffre inventé,
      // uniquement des complétions réellement enregistrées aujourd'hui.
      if (roleDuJour === 'renfort') {
        const aujISO = new Date().toISOString().slice(0, 10);
        const completionsAujourdhui = completionsCache.filter(c => c.date === aujISO);
        const famillesSoutenues = new Set(completionsAujourdhui
          .map(c => { const m = catalogue.find(x => x.mission_id === c.mission_id); return m ? m.famille : null; })
          .filter(Boolean)).size;
        const pointsValidesAuj = completionsAujourdhui
          .filter(c => (c.statut_validation || 'valide') === 'valide')
          .reduce((s, c) => s + (c.points || 0), 0);
        const bilan = famillesSoutenues > 0
          ? `Vous avez soutenu ${famillesSoutenues} zone${famillesSoutenues > 1 ? 's' : ''} et validé ${pointsValidesAuj} point${pointsValidesAuj > 1 ? 's' : ''} aujourd'hui.`
          : `Votre service touche à sa fin.`;
        // Potentiel restant réel (03/08/2026, exemple de Frédéric : "Potentiel
        // restant : 15 points") — recalculé ici plutôt que listé mission par
        // mission : lister exactement les N missions restantes aurait demandé
        // un second mécanisme de sélection en plus de celui déjà utilisé pour
        // « ${t} », avec un risque de double-compte ou d'incohérence entre les
        // deux. Le total, lui, est un vrai nombre, pas une estimation.
        const potentielRestant = calculerPotentielJour().pointsDisponibles;
        const potentielTxt = potentielRestant > 0 ? ` Potentiel restant : ${potentielRestant} point${potentielRestant > 1 ? 's' : ''}.` : '';
        return `${prenom}, ${bilan} Il reste « ${t} » avant votre départ.${phraseDureePoints}${potentielTxt}`;
      }
      return `${prenom}, votre prochaine priorité est « ${t} ».${phraseDureePoints} Réalisez-la avant votre départ.`;
    }
    // Début de service renfort (03/08/2026, "coordinateur mobile") : mandat
    // général plutôt qu'un horaire précis — NEXUS n'a pas de planning de
    // livraison ni de file d'attente en temps réel, donc jamais d'heure
    // inventée (contrairement à l'exemple "livraison prévue à 15h30" fourni
    // par Frédéric, qui reste une illustration, pas une donnée réelle).
    if (suggestion.debutDeService && roleDuJour === 'renfort') {
      return `${prenom}, votre priorité aujourd'hui est de maintenir la fluidité entre la boutique et la piste. Commencez par « ${t} ».${phraseDureePoints}`;
    }
    // Début de service (03/08/2026, demande de Frédéric) : même choisirMissionSuggeree()
    // a déjà vérifié qu'on est bien dans l'heure suivant l'arrivée — message
    // dédié pour démarrer le quart. Retiré le "facilement" (03/08/2026,
    // retour détaillé de Frédéric) : la mission choisie est la plus utile
    // selon le nouveau classement (heure > sécurité > urgence > durée >
    // points), pas nécessairement la plus simple.
    if (suggestion.debutDeService) {
      return `${prenom}, commencez votre service par « ${t} ».${phraseDureePoints}`;
    }
    if (stats.palierFrancheAujourdhui) {
      return `${prenom}, ${stats.palierFrancheAujourdhui}ᵉ mission validée aujourd'hui. Prochaine priorité : « ${t} ».${phraseDureePoints}`;
    }
    if (stats.streak >= 5) {
      return `${prenom}, ${stats.streak} jours de suite avec au moins une mission validée — ne cassons pas cette série. Prochaine priorité : « ${t} ».${phraseDureePoints}`;
    }
    if (stats.streak >= 2) {
      return `${prenom}, ${stats.streak} jours d'affilée. On enchaîne avec « ${t} » ?${phraseDureePoints}`;
    }
    if (pointsObtenusAujourdhui > 0) {
      return `${prenom}, ${pointsObtenusAujourdhui} points obtenus aujourd'hui. Prochaine priorité : « ${t} ».${phraseDureePoints}`;
    }
    if (stats.missionsSemaine > 0) {
      return `${prenom}, ${stats.missionsSemaine} mission${stats.missionsSemaine > 1 ? 's' : ''} validée${stats.missionsSemaine > 1 ? 's' : ''} cette semaine. Prochaine priorité : « ${t} ».${phraseDureePoints}`;
    }
    return `${prenom}, aucune mission validée pour l'instant cette semaine — commençons par « ${t} ».${phraseDureePoints}`;
  }

  // Une mission de clôture/fermeture n'a aucun sens suggérée en début de
  // journée — corrigé le 21/07/2026 (Frédéric l'a signalé). Détection par
  // mots-clés dans le titre, même logique que estMissionControleManager.
  function estMissionDeCloture(m) {
    const titre = (m.titre || '').toLowerCase();
    return titre.includes('clôture') || titre.includes('cloture') || titre.includes('fermeture');
  }

  // Même logique que estMissionDeCloture, pour l'autre bout de la journée
  // (03/08/2026, demande de Frédéric) : "Contrôle éclairage extérieur (soir)"
  // n'a aucun sens suggéré par le Coach avant la tombée de la nuit — on ne
  // peut pas juger si un éclairage extérieur fonctionne en plein jour.
  // Détection par mots-clés dans le titre, comme pour la clôture. La
  // tombée de la nuit n'a pas d'heure fixe toute l'année (17h en hiver,
  // 22h en été) ; à défaut d'un calcul de coucher de soleil, 19h est un
  // seuil prudent qui évite l'essentiel des cas de jour, quitte à
  // suggérer un peu tard certains jours d'été plutôt que trop tôt.
  function estMissionDuSoir(m) {
    const titre = (m.titre || '').toLowerCase();
    return titre.includes('soir') || titre.includes('nuit');
  }
  const HEURE_TOMBEE_DE_NUIT = 19;

  // Suggestion d'une mission précise, en guise d'appel à l'action — pas
  // juste un constat de progression. Priorité 1 : une mission dont la
  // checklist est déjà entièrement cochée mais pas encore validée (le
  // geste le plus rapide, on encourage à finir ce qui est presque fait).
  //
  // Classement v2 (03/08/2026, retour détaillé de Frédéric — "le Coach ne
  // doit pas chercher la mission la plus facile, mais la prochaine mission
  // la plus utile") : remplace l'ancien tri "points croissants" pour les
  // novices/début de service, qui pouvait mettre en avant une mission
  // longue à faible enjeu (ex. 15 min pour 2 points) plutôt qu'une mission
  // courte et importante (ex. 5 min pour 7 points). Ordre désormais unique,
  // quel que soit le profil de l'employé :
  //   1. obligation liée à l'heure (mission avec fenêtre horaire active,
  //      ou clôture en fin de service réelle, ou "soir" après la tombée
  //      de la nuit)
  //   2. sécurité (famille Sécurité)
  //   3. urgence (priorité critique > haute > normale > basse)
  //   4. durée (la plus courte d'abord)
  //   5. points (les plus élevés d'abord)
  // Les missions conditionnelles (voir mission_catalog.disponibilite) ne
  // sont jamais candidates : ce sont des tâches situationnelles, pas des
  // suggestions proactives.
  //
  // Fin de service réelle (03/08/2026, correction demandée par Frédéric) :
  // l'ancien seuil (horloge murale >= 16h, seul) a suggéré "Fermeture
  // station" à un employé qui venait tout juste de pointer son arrivée à
  // 16h51 — incohérent. On exige désormais AUSSI qu'un temps minimal se
  // soit écoulé depuis l'arrivée réelle du jour (pointages), en plus de
  // l'heure murale : les deux ensemble, jamais l'un sans l'autre. Si
  // l'heure d'arrivée est inconnue (erreur réseau, consultation externe),
  // on retombe sur l'ancien comportement (horloge murale seule) plutôt que
  // de bloquer toute suggestion de clôture indéfiniment.
  //
  // Les missions ponctuelles ne sont jamais candidates ici depuis le
  // 26/07/2026 : elles ne sont même plus chargées dans `catalogue` (voir
  // chargerCatalogue), donc ce filtre en profite automatiquement sans
  // changement supplémentaire.
  const SEUIL_HEURES_DEPUIS_ARRIVEE_POUR_CLOTURE = 3;

  // Début de service (03/08/2026, demande de Frédéric, cas du pompiste) :
  // dans l'heure qui suit l'arrivée, on privilégie une victoire facile et
  // rapide (le moins de points, comme pour un novice) plutôt que la mission
  // objectivement la plus prioritaire — démarrer le quart sur une tâche
  // simple plutôt qu'une tâche lourde ou mal choisie. Purement additif au
  // cas "novice" existant : les deux mènent au même tri par points croissants,
  // seul le message du Coach change (voir messageConseillerPerso).
  const SEUIL_HEURES_DEBUT_DE_SERVICE = 1;

  // Variété à chaque ouverture (03/08/2026, demande de Frédéric : "à chaque
  // rafraîchissement ou ouverture de page, le conseiller propose une
  // nouvelle mission, toujours en fonction de l'horodateur adapté matin ou
  // soir") — le cadrage horaire (clôture réservée à la fin de service,
  // "soir" réservé après la tombée de la nuit, victoire facile en début de
  // service) reste strictement identique ; ce qui change, c'est qu'on ne
  // fige plus le choix sur UNE mission au sein des candidats réellement
  // équivalents (même groupe de priorité, ou même groupe de points en
  // début de service / pour un novice). On tire au sort dans ce groupe, en
  // évitant si possible de répéter la mission montrée au chargement
  // précédent (mémorisée en localStorage), pour donner l'impression d'un
  // conseiller vivant plutôt qu'un script figé — jamais au prix de
  // suggérer une mission incohérente pour le moment de la journée.
  function clePersistanceDerniereSuggestion() {
    return `nexus_derniere_suggestion_${employeeId}`;
  }

  function choisirParmiEquivalents(groupe) {
    if (groupe.length === 1) return groupe[0];
    const cle = clePersistanceDerniereSuggestion();
    let derniereId = null;
    try { derniereId = localStorage.getItem(cle); } catch (e) { /* stockage indisponible, tant pis */ }
    const sansRepetition = derniereId ? groupe.filter(m => m.mission_id !== derniereId) : groupe;
    const pool = sansRepetition.length > 0 ? sansRepetition : groupe;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function choisirMissionSuggeree() {
    const aujISO = new Date().toISOString().slice(0, 10);
    const faitesAujourdhui = new Set(completionsCache.filter(c => c.date === aujISO).map(c => c.mission_id));

    const heuresDepuisArrivee = heureArriveeAujourdhui != null
      ? (Date.now() - heureArriveeAujourdhui.getTime()) / 3600000
      : null;
    const enFinDeService = new Date().getHours() >= 16
      && (heuresDepuisArrivee === null || heuresDepuisArrivee >= SEUIL_HEURES_DEPUIS_ARRIVEE_POUR_CLOTURE);
    const nuitTombee = new Date().getHours() >= HEURE_TOMBEE_DE_NUIT;
    const debutDeService = heuresDepuisArrivee !== null && heuresDepuisArrivee <= SEUIL_HEURES_DEBUT_DE_SERVICE;

    const candidates = catalogue.filter(m =>
      Array.isArray(m.role_required) && m.role_required.includes(roleDuJour) && !faitesAujourdhui.has(m.mission_id)
      && m.disponibilite !== 'conditionnelle'
      && (enFinDeService || !estMissionDeCloture(m))
      && (nuitTombee || !estMissionDuSoir(m))
    );
    if (candidates.length === 0) return null;

    const presqueFinies = candidates.filter(m => Array.isArray(m.checklist) && m.checklist.length > 0 && toutCoche(m));
    if (presqueFinies.length > 0) {
      presqueFinies.sort((a, b) => (a.estimated_duration_min || 0) - (b.estimated_duration_min || 0));
      return { mission: presqueFinies[0], presqueFinie: true };
    }

    const rang = { critique: 0, haute: 1, normale: 2, basse: 3 };
    // Clé de tri v2 : heure > sécurité > urgence > durée > points (les plus
    // élevés d'abord). Un temps_window encore présent dans `catalogue`
    // signifie déjà qu'on est dans sa fenêtre active (chargerCatalogue
    // filtre le reste) — donc simplement `!!m.time_window` suffit à
    // détecter une obligation horaire active.
    //
    // Renfort (03/08/2026, hiérarchie détaillée de Frédéric — "il ne
    // délaisse pas une file d'attente pour nettoyer une vitre, mais il
    // n'abandonne pas non plus une flaque dangereuse pour remplir un
    // rayon") : remplace le couple générique [sécurité, urgence] par
    // rangHierarchieRenfort(), qui encode les 9 niveaux exacts qu'il a
    // donnés. L'horaire reste prioritaire sur tout (une obligation liée à
    // l'heure passe avant même le danger), et durée/points restent les
    // départages finaux — voir rangHierarchieRenfort ci-dessous.
    const cleDe = m => {
      const horaire = (m.time_window || (enFinDeService && estMissionDeCloture(m)) || (nuitTombee && estMissionDuSoir(m))) ? 0 : 1;
      const duree = m.estimated_duration_min || 0;
      const points = -(m.points || 0);
      if (roleDuJour === 'renfort') {
        return [horaire, rangHierarchieRenfort(m), duree, points];
      }
      const securite = m.famille === 'Sécurité' ? 0 : 1;
      const urgence = rang[m.priority] ?? 2;
      return [horaire, securite, urgence, duree, points];
    };
    const comparerCles = (a, b) => {
      for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] - b[i]; }
      return 0;
    };
    const triees = [...candidates].sort((a, b) => comparerCles(cleDe(a), cleDe(b)));
    const meilleureCle = cleDe(triees[0]);
    // On ne prend pas systématiquement le premier : on regroupe tous les
    // candidats strictement à égalité sur toute la clé, et
    // choisirParmiEquivalents() tire au sort dedans (variété à chaque
    // ouverture, voir plus haut).
    const groupe = candidates.filter(m => comparerCles(cleDe(m), meilleureCle) === 0);
    const missionChoisie = choisirParmiEquivalents(groupe);
    try { localStorage.setItem(clePersistanceDerniereSuggestion(), missionChoisie.mission_id); } catch (e) { /* stockage indisponible, tant pis */ }
    // debutDeService seulement si la mission choisie n'est pas déjà couverte
    // par un autre message dédié (clôture) — mutuellement exclusifs en
    // pratique (le seuil de clôture exige >= 3h depuis l'arrivée, celui-ci
    // <= 1h), mais on le vérifie explicitement plutôt que de le supposer.
    const estDebutDeService = debutDeService && !estMissionDeCloture(missionChoisie);
    return { mission: missionChoisie, presqueFinie: false, debutDeService: estDebutDeService };
  }

  // Ouvre la mission suggérée, quels que soient l'onglet famille ou la
  // recherche en cours, et y amène l'œil directement.
  function voirMissionSuggeree(missionId) {
    familleActive = 'Toutes';
    const champRecherche = document.getElementById('search');
    if (champRecherche) champRecherche.value = '';
    missionsOuvertes.add(missionId);
    render();
    const corps = document.getElementById(`body-${missionId}`);
    if (corps) corps.closest('.mission-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function renderConseillerPerso(stats, prenom) {
    const el = document.getElementById('conseillerPersoSection');
    if (!el) return;

    const estRenfort = roleDuJour === 'renfort';
    let suggestion = choisirMissionSuggeree();
    // Affluence signalée (renfort uniquement, 03/08/2026) : la suggestion
    // normale du Coach s'efface au profit du soutien immédiat le temps que
    // l'affluence dure — voir missionSoutienActiviteRenfort.
    if (estRenfort && affluenceEnCours) {
      const missionSoutien = missionSoutienActiviteRenfort();
      if (missionSoutien) suggestion = { mission: missionSoutien, presqueFinie: false };
    }
    // Points du jour (03/08/2026, demande de Frédéric) : le Coach mentionne
    // désormais les points déjà obtenus aujourd'hui et le poids en points
    // de la mission suggérée — jamais pour prioriser par points (le tri de
    // choisirMissionSuggeree reste priorité > durée, inchangé), seulement
    // pour informer.
    const pointsObtenusAujourdhui = calculerPotentielJour().pointsObtenusAujourdhui;

    // La barre de palier n'apparaît que quand elle est vraiment
    // parlante (à moins de 30% du prochain cap) — sinon c'est la même
    // ligne à chaque visite, ce qui use plus qu'elle n'informe. Inutile
    // aussi le jour même où le palier vient d'être franchi, déjà dit
    // dans le message.
    let palierHtml = '';
    if (!stats.palierFrancheAujourdhui && stats.prochainPalier) {
      const precedent = [...PALIERS_MISSIONS].reverse().find(p => p < stats.prochainPalier) || 0;
      const pct = Math.round(((stats.totalMissions - precedent) / (stats.prochainPalier - precedent)) * 100);
      if (pct >= 70) {
        const restant = stats.prochainPalier - stats.totalMissions;
        palierHtml = `
          <div class="conseiller-perso-palier">
            <div class="conseiller-perso-palier-ligne"><span>Plus que ${restant} mission${restant > 1 ? 's' : ''}</span><span>palier ${stats.prochainPalier}</span></div>
            <div class="conseiller-perso-bar-track"><div class="conseiller-perso-bar" style="width:${Math.min(100, pct)}%;"></div></div>
          </div>`;
      }
    }

    const boutonHtml = suggestion ? `
      <button class="conseiller-perso-cta-btn" id="btnSuggestionMission" data-mission="${suggestion.mission.mission_id}">${suggestion.presqueFinie ? 'Valider maintenant →' : 'Voir cette mission →'}</button>` : '';

    // Signalement d'affluence (renfort uniquement, 03/08/2026) : bouton
    // auto-déclaré, même principe que "Déclarer cette livraison" dans
    // Inventaire — jamais de détection automatique de file d'attente.
    const boutonAffluenceHtml = estRenfort ? `
      <button class="conseiller-perso-affluence-btn ${affluenceEnCours ? 'actif' : ''}" id="btnToggleAffluence">${affluenceEnCours ? '✓ Fin de l’affluence' : '⚡ Signaler une affluence'}</button>` : '';

    // "Coach NEXUS" côté employé, "Conseiller NEXUS" côté manager
    // (27/07/2026, demande de Frédéric — cette carte reste affichée aux
    // deux rôles puisqu'elle porte sur les missions de la personne
    // connectée, quel que soit son rôle du jour).
    const estCoach = roleDuJour !== 'manager';
    el.innerHTML = `
      <div class="conseiller-perso">
        <div class="conseiller-perso-head">
          <img class="conseiller-perso-avatar" src="assets/nexus-avatar.png" alt="${estCoach ? 'Coach NEXUS' : 'Conseiller NEXUS'}">
          <div>
            <div class="conseiller-perso-nom">${estCoach ? 'COACH NEXUS' : 'CONSEILLER NEXUS'}</div>
            <div class="conseiller-perso-sous">Votre progression</div>
          </div>
        </div>
        <div class="conseiller-perso-texte">${messageConseillerPerso(stats, suggestion, prenom, pointsObtenusAujourdhui, { affluenceEnCours: estRenfort && affluenceEnCours, apresAffluence: estRenfort && afficherApresAffluenceUneFois })}</div>
        ${palierHtml}
        ${boutonHtml}
        ${boutonAffluenceHtml}
      </div>`;

    // Le message "après affluence" ne s'affiche qu'une seule fois — une
    // fois rendu, on referme le drapeau pour retomber sur le fil normal du
    // Coach au prochain rendu (validation d'une mission, etc.).
    if (estRenfort) afficherApresAffluenceUneFois = false;

    const btnToggleAffluence = document.getElementById('btnToggleAffluence');
    if (btnToggleAffluence) {
      btnToggleAffluence.addEventListener('click', () => {
        if (affluenceEnCours) {
          affluenceEnCours = false;
          afficherApresAffluenceUneFois = true;
          if (minuteurFinAffluence) { clearTimeout(minuteurFinAffluence); minuteurFinAffluence = null; }
        } else {
          affluenceEnCours = true;
          afficherApresAffluenceUneFois = false;
          // Filet de sécurité (03/08/2026) : désactive automatiquement le
          // mode affluence au bout de 45 min en cas d'oubli, pour ne
          // jamais laisser le Coach bloqué sur "soutenez la file" toute la
          // journée.
          minuteurFinAffluence = setTimeout(() => {
            affluenceEnCours = false;
            afficherApresAffluenceUneFois = true;
            minuteurFinAffluence = null;
            renderConseillerPerso(calculerStatsPersonnelles(completionsCache), employeActuel);
          }, DUREE_MAX_AFFLUENCE_MIN * 60000);
        }
        renderConseillerPerso(calculerStatsPersonnelles(completionsCache), employeActuel);
      });
    }

    const btnCta = document.getElementById('btnSuggestionMission');
    if (btnCta) btnCta.addEventListener('click', () => voirMissionSuggeree(btnCta.dataset.mission));
  }

  // Accueil renfort à la prise de poste (03/08/2026, demande de Frédéric) :
  // le renfort n'a pas de rôle fixe d'un service à l'autre — contrairement
  // au pompiste ou à la caissière, il "intervient là où l'activité en a le
  // plus besoin". Le Coach le dit explicitement une fois, à la connexion,
  // avant de basculer sur sa recommandation habituelle : bonjour + rappel du
  // rôle du jour, affiché quelques secondes, puis remplacé par la première
  // mission suggérée — jamais réaffiché plusieurs fois pour le même
  // service (voir cleAccueilRenfort).
  function cleAccueilRenfort(employeeIdCle) {
    return `nexus_accueil_renfort_${employeeIdCle}_${new Date().toISOString().slice(0, 10)}`;
  }

  function afficherAccueilRenfort(prenom) {
    const el = document.getElementById('conseillerPersoSection');
    if (!el) return;
    el.innerHTML = `
      <div class="conseiller-perso">
        <div class="conseiller-perso-head">
          <img class="conseiller-perso-avatar" src="assets/nexus-avatar.png" alt="Coach NEXUS">
          <div>
            <div class="conseiller-perso-nom">COACH NEXUS</div>
            <div class="conseiller-perso-sous">Prise de poste</div>
          </div>
        </div>
        <div class="conseiller-perso-texte">Bonjour ${prenom}, tu es en renfort aujourd'hui. Ton renfort intervient là où l'activité en a le plus besoin : tu dois observer, prioriser et agir pour maintenir la fluidité du service, la disponibilité des produits et la sécurité de la station. Je vais t'accompagner.</div>
      </div>`;
  }

  // Affiche l'accueil renfort une seule fois par service (marqué en
  // localStorage), puis bascule sur la recommandation Coach normale au bout
  // de quelques secondes, avec un fondu (voir .conseiller-perso-sortant).
  // Si l'accueil a déjà été vu aujourd'hui, ou pour tout autre rôle, la
  // recommandation Coach s'affiche directement, sans détour.
  function renderConseillerPersoAvecAccueil(stats, prenom) {
    if (roleDuJour !== 'renfort') {
      renderConseillerPerso(stats, prenom);
      return;
    }
    const cle = cleAccueilRenfort(employeeId);
    let dejaAccueilli = false;
    try { dejaAccueilli = localStorage.getItem(cle) === '1'; } catch (e) { /* stockage indisponible, tant pis */ }
    if (dejaAccueilli) {
      renderConseillerPerso(stats, prenom);
      return;
    }
    afficherAccueilRenfort(prenom);
    try { localStorage.setItem(cle, '1'); } catch (e) { /* stockage indisponible, tant pis */ }
    setTimeout(() => {
      const bloc = document.querySelector('#conseillerPersoSection .conseiller-perso');
      if (bloc) bloc.classList.add('conseiller-perso-sortant');
      setTimeout(() => renderConseillerPerso(stats, prenom), 500);
    }, 4000);
  }

  function toutCoche(mission) {
    const items = Array.isArray(mission.checklist) ? mission.checklist : [];
    return items.every((_, i) => checkState[`${mission.mission_id}_${i}`]);
  }

  // nbCoches (02/08/2026, demande de Frédéric — "permets de valider ce qu'ils
  // ont fait ... attribue les points correspondant à ce qui est validé par
  // photo") : compte les items réellement cochés d'une mission. Pour une
  // mission photo_par_action, coché ≡ photographié (voir le listener qui les
  // fixe ensemble), donc ce compteur reflète exactement le nombre d'étapes
  // prouvées par photo — c'est la base du calcul de points proportionnel.
  function nbCoches(mission) {
    const items = Array.isArray(mission.checklist) ? mission.checklist : [];
    return items.reduce((n, _, i) => n + (checkState[`${mission.mission_id}_${i}`] ? 1 : 0), 0);
  }

  function renderMissionCard(m, isAuto) {
    const priorite = m.priority || 'normale';
    // Filet de sécurité (05/08/2026) : longueur de checklist toujours
    // sûre, même si m.checklist est absente/mal formée en base.
    const checklistLen = Array.isArray(m.checklist) ? m.checklist.length : 0;
    // Une mission necessite_produit ne peut être validée qu'une fois un
    // produit choisi — même logique de blocage que la checklist.
    // Missions à photo_par_action (02/08/2026, demande de Frédéric) : chaque
    // étape cochée est déjà une preuve photo individuelle, donc on n'exige
    // plus que TOUT soit fait pour débloquer la validation — une seule étape
    // photographiée suffit à valider ce qui a réellement été fait, avec des
    // points proportionnels (voir finaliser() plus bas). Les autres missions
    // checklist gardent l'exigence stricte du tout-ou-rien.
    const nbFait = m.photo_par_action ? nbCoches(m) : null;
    const checklistOk = m.photo_par_action ? nbFait > 0 : toutCoche(m);
    const complet = checklistOk && (!m.necessite_produit || !!produitCibleState[m.mission_id]);
    // Barème de points (28/07/2026, demande de Frédéric — "il y a t'il un
    // barème de points ?") : visible directement sur la carte, jamais
    // seulement découvert après coup dans Résultats Équipe. Même règle de
    // calcul que sauvegarderCompletionSupabase plus bas (+2 preuve photo
    // unique) — une mission à photo_par_action n'a pas ce bonus, chaque
    // étape est déjà photographiée, ce n'est plus un geste en plus.
    const baremeNote = m.proof_required ? ' (+2 preuve photo)' : (m.photo_par_action ? ' · photo à chaque étape, points proportionnels' : '');
    const controle = !isAuto && estMissionControleManager(m);
    const completionAujourdhui = completionsCache.find(c => c.mission_id === m.mission_id && c.date === new Date().toISOString().slice(0,10));
    const dejaValidee = !!completionAujourdhui;

    let libelleBouton;
    if (m.photo_par_action) {
      if (nbFait === 0) {
        libelleBouton = controle ? 'Photographiez au moins une étape' : 'Photographiez au moins une étape';
      } else if (nbFait === checklistLen) {
        libelleBouton = controle ? 'Valider le contrôle' : 'Valider la mission';
      } else {
        libelleBouton = controle ? `Valider le contrôle (${nbFait}/${checklistLen})` : `Valider ce qui est fait (${nbFait}/${checklistLen})`;
      }
    } else {
      libelleBouton = complet
        ? (controle ? 'Valider le contrôle' : 'Valider la mission')
        : (controle ? 'Cochez tout pour valider le contrôle' : 'Cochez tout pour valider');
    }

    const blocPresence = controle ? `
        <div class="presence-label">Employés présents au moment du contrôle</div>
        ${EMPLOYES_SITE.length === 0
          ? `<div class="mission-pourquoi" style="margin:4px 0;">Aucun employé actif trouvé pour ce site.</div>`
          : EMPLOYES_SITE.map(e => {
              const key = `${m.mission_id}_${e.id}`;
              const checked = !!presentsState[key];
              return `<div class="presence-item" data-key="${key}">
                <div class="presence-box ${checked?'checked':''}">${checked?'✓':''}</div>
                <div>${e.nom}</div>
              </div>`;
            }).join('')}` : '';

    const liensEvaluer = (controle && dejaValidee && completionAujourdhui.employes_presents && completionAujourdhui.employes_presents.length)
      ? `<div class="evaluer-liens">${completionAujourdhui.employes_presents.map(pid => {
          const emp = EMPLOYES_SITE.find(e => e.id === pid);
          return emp ? `<a class="evaluer-lien" href="NEXUS-Evaluation-Employe-v1.html?employe=${emp.id}">→ Évaluer ${emp.nom}</a>` : '';
        }).join('')}</div>`
      : '';

    return `
      <div class="mission-card">
        <div class="mission-head" data-id="${m.mission_id}">
          <div>
            <div class="mission-titre">${m.titre}</div>
            <div class="mission-meta">${m.famille || 'Auto'} · ${m.estimated_duration_min} min · ${m.points || 5} pts${baremeNote}${isAuto && m.impact_attendu_eur ? ' · Impact ' + m.impact_attendu_eur + '€' : ''}</div>
            ${m.disponibilite === 'conditionnelle' ? `<div class="mission-conditionnelle-badge">À réaliser uniquement si nécessaire</div>` : ''}
          </div>
          ${isAuto ? '<span class="badge badge-auto">Conseiller NEXUS</span>' : (controle ? '<span class="badge badge-controle">🔍 Contrôle</span>' : priorityBadge(priorite))}
        </div>
        <div class="mission-body ${missionsOuvertes.has(m.mission_id)?'open':''}" id="body-${m.mission_id}">
          ${controle ? `<div class="controle-banner">🔍 Mode contrôle manager — vous vérifiez que l'équipe a bien réalisé ces points, vous ne les faites pas vous-même.</div>` : ''}
          <div class="mission-pourquoi">${m.pourquoi}</div>
          ${renderChecklist(m.mission_id, m.checklist, m.photo_par_action)}
          ${m.necessite_produit ? renderPickerProduit(m.mission_id) : ''}
          ${m.proof_required ? `<div class="mission-photo">📷 Photo requise pour valider</div>
            <input type="file" accept="image/*" capture="environment" id="photo-${m.mission_id}" style="display:none;">` : ''}
          ${blocPresence}
          ${dejaValidee
            ? `<div class="validation-ok">✓ ${controle ? 'Contrôlée' : 'Validée'} aujourd'hui</div>${liensEvaluer}`
            : `<button class="btn-valider" data-mission="${m.mission_id}" ${!complet?'disabled':''}>${libelleBouton}</button>`}
        </div>
      </div>`;
  }

  function render() {
    // Bloc "Votre journée" + Prochaine priorité + Catégories + Niveaux
    // (03/08/2026) : recalculés à chaque rendu, car complétions/checklist
    // changent en direct.
    const potentiel = calculerPotentielJour();
    renderJourneeSection(potentiel);
    renderPrioriteSection(potentiel);
    renderCategoriesSection(potentiel);
    renderNiveauxSection(potentiel);

    const q = document.getElementById('search').value.trim().toLowerCase();
    // Réorganisation en 3 conteneurs distincts (03/08/2026, retour détaillé
    // de Frédéric — "la priorité opérationnelle doit apparaître avant les
    // filtres") : Obligatoires / Disponibles / Conditionnelles ne sont plus
    // un seul bloc #content contigu, mais trois <div> placées à des
    // endroits différents du DOM (voir le squelette HTML plus haut), avec
    // le Coach entre Obligatoires et Disponibles, et Catégories/filtres
    // entre Disponibles et Conditionnelles. Le contenu de chaque groupe
    // reste calculé exactement comme avant à partir de `lib`.
    const elObligatoires = document.getElementById('obligatoiresSection');
    const elDisponibles = document.getElementById('disponiblesSection');
    const elConditionnelles = document.getElementById('conditionnellesSection');

    let htmlObligatoires = '';
    let htmlDisponibles = '';
    let htmlConditionnelles = '';

    // Avertissement sécurité pompiste (27/07/2026, demande de Frédéric ;
    // compacté le 03/08/2026 — le message reste justifié mais occupait trop
    // de place et repoussait les missions vers le bas) : une ligne toujours
    // visible, le détail complet repliable derrière "Voir les règles de
    // sécurité". Toujours en tête du bloc Obligatoires, même pendant une
    // recherche.
    if (roleDuJour === 'pompiste') {
      htmlObligatoires += `<div class="warning-securite">
        <div class="warning-securite-ligne">⚠️ Téléphone interdit sur la piste et pendant toute distribution. <button class="warning-securite-toggle" id="toggleWarningSecurite">${warningSecuriteOuvert ? 'Masquer' : 'Voir les règles de sécurité'}</button></div>
        <div class="warning-securite-detail ${warningSecuriteOuvert ? 'open' : ''}">N'utilisez jamais NEXUS ni votre téléphone à la vue d'un client. C'est strictement interdit sur la piste de distribution de carburant, et encore plus pendant une distribution en cours.</div>
      </div>`;
    }

    // Les recommandations du Conseiller NEXUS s'adressent au manager, pas aux employés —
    // c'est lui qui décide ensuite de déléguer une mission.
    if (!q && roleDuJour === 'manager') {
      htmlObligatoires += `<div class="section-label">Aujourd'hui — recommandé par le Conseiller NEXUS</div>`;
      htmlObligatoires += `<div id="plansActionMissions"></div>`;
    }

    // Missions assignées individuellement (créées via "Créer une mission"
    // dans Scanner, ex. vérification de marge sur un produit précis) —
    // visibles par la personne à qui elles sont assignées, quel que soit
    // son rôle du jour. Rendu séparément (comme plansActionMissions) pour
    // ne pas régénérer toute la liste à chaque frappe de recherche. Ajouté
    // le 26/07/2026 suite au résidu Heineken 50 : ces missions ponctuelles
    // ne font plus jamais partie du catalogue récurrent (chargerCatalogue)
    // ni des suggestions du Conseiller personnel (choisirMissionSuggeree) —
    // ce bloc est désormais leur seul et unique lieu d'affichage.
    if (!q) {
      htmlObligatoires += `<div id="missionsAssigneesZone"></div>`;
    }

    let lib = missionsDuRoleAujourdhui();
    lib = lib.filter(m => familleActive==='Toutes' || m.famille===familleActive);
    // Filtre par niveau de points (03/08/2026) — se combine indépendamment
    // du filtre catégorie, voir renderNiveauxSection.
    if (niveauActif !== null) lib = lib.filter(m => m.points === niveauActif);
    if (q) lib = lib.filter(m => m.titre.toLowerCase().includes(q) || (m.pourquoi||'').toLowerCase().includes(q));

    const estRenfort = roleDuJour === 'renfort';

    // Sous-blocs individuellement repliables, généralisés à tous les rôles
    // (03/08/2026, demande de Frédéric — "repli les missions partout
    // également") : remplace l'ancien toggle unique "Vos missions — rôle X"
    // par des libellés indépendants, chacun avec son propre état dans
    // blocsListeOuverts. Une recherche active force l'ouverture (jamais de
    // résultat masqué par un bloc replié).
    const blocListe = (cle, titre, missions, cible) => {
      if (missions.length === 0) return;
      const ouvert = q ? true : blocsListeOuverts[cle];
      cible.html += `<div class="section-label section-label-pliable ${ouvert ? 'open' : ''}" data-bloc-liste="${cle}">${titre} (${missions.length}) <span class="chev">›</span></div>`;
      // Filet de sécurité (05/08/2026, retour employé — "je n'arrive pas à
      // voir les détails des missions") : une mission au format inattendu
      // ne doit plus jamais casser le rendu de TOUTE la liste — elle est
      // loguée et sautée, les autres missions continuent de s'afficher
      // normalement.
      if (ouvert) missions.forEach(m => {
        try {
          cible.html += renderMissionCard(m, m.mission_id.startsWith('MISSION-'));
        } catch (err) {
          console.error('Rendu mission ignoré (format inattendu) :', m.mission_id, err);
        }
      });
    };

    if (lib.length === 0) {
      htmlObligatoires += `<div class="empty-note">Aucune mission ne correspond à votre rôle du jour.</div>`;
    } else if (estRenfort) {
      // Organisation en 4 blocs pour le renfort (03/08/2026, demande
      // détaillée de Frédéric — "le renfort ne doit pas recevoir une liste
      // fixe de 30 tâches") :
      //   1. À faire maintenant — rendu séparément, voir missionsAssigneesZone
      //      ci-dessus (seul signal réellement temps réel disponible : une
      //      mission assignée par le manager).
      //   2. Priorités du service — missions préparées à l'avance, valeur
      //      7-10 pts, disponibles dès maintenant (pas liées à un
      //      événement réel) : inventaire tournant, réassort, contrôle des
      //      zones clients, produits sensibles...
      //   3. Disponibles entre deux urgences — missions régulières à faible
      //      enjeu (2-5 pts), à faire quand le calme le permet : facing,
      //      prix, dates, consommables, propreté ciblée.
      //   4. Conditionnelles — n'existent que si l'événement survient
      //      (affluence, incident, sécurité...) : disponibilite =
      //      'conditionnelle', même logique que les autres rôles.
      const prioritesService = lib.filter(m => m.disponibilite === 'disponible' && m.points >= 7);
      const disponiblesCreux = lib.filter(m => m.disponibilite === 'disponible' && m.points < 7);
      const conditionnelles = lib.filter(m => m.disponibilite === 'conditionnelle');

      const cibleOblig = { html: htmlObligatoires };
      blocListe('priorites', 'Priorités du service', prioritesService, cibleOblig);
      htmlObligatoires = cibleOblig.html;

      const cibleDispo = { html: htmlDisponibles };
      blocListe('creux', 'Disponibles entre deux urgences', disponiblesCreux, cibleDispo);
      htmlDisponibles = cibleDispo.html;

      const cibleCond = { html: htmlConditionnelles };
      blocListe('conditionnelles', 'Conditionnelles', conditionnelles, cibleCond);
      htmlConditionnelles = cibleCond.html;
    } else {
      // Trois blocs (03/08/2026, retour détaillé de Frédéric) : obligatoire
      // d'abord, disponible ensuite, conditionnelle en dernier — jamais
      // mélangées, pour que l'employé sache d'un coup d'œil ce qui est
      // vraiment attendu de lui aujourd'hui. Repliés par défaut (03/08/2026)
      // sauf Obligatoires, seul bloc réellement actionnable au quotidien —
      // même principe que "à faire maintenant" pour le renfort ci-dessus.
      const obligatoires = lib.filter(m => m.disponibilite === 'obligatoire');
      const disponiblesListe = lib.filter(m => m.disponibilite !== 'obligatoire' && m.disponibilite !== 'conditionnelle');
      const conditionnelles = lib.filter(m => m.disponibilite === 'conditionnelle');

      const cibleOblig = { html: htmlObligatoires };
      blocListe('obligatoires', 'Obligatoires avant le départ', obligatoires, cibleOblig);
      htmlObligatoires = cibleOblig.html;

      const cibleDispo = { html: htmlDisponibles };
      blocListe('disponibles', 'Disponibles pendant le service', disponiblesListe, cibleDispo);
      htmlDisponibles = cibleDispo.html;

      const cibleCond = { html: htmlConditionnelles };
      blocListe('conditionnelles', 'Missions conditionnelles', conditionnelles, cibleCond);
      htmlConditionnelles = cibleCond.html;
    }

    if (elObligatoires) elObligatoires.innerHTML = htmlObligatoires;
    if (elDisponibles) elDisponibles.innerHTML = htmlDisponibles;
    if (elConditionnelles) elConditionnelles.innerHTML = htmlConditionnelles;
    if (roleDuJour === 'manager') renderPlansActionMissions();
    renderMissionsAssignees();

    // Bascule indépendante de chaque sous-bloc, pour tous les rôles
    // (03/08/2026, demande de Frédéric — "repli les missions partout
    // également") — voir blocsListeOuverts.
    document.querySelectorAll('[data-bloc-liste]').forEach(el => {
      el.addEventListener('click', () => {
        const cle = el.dataset.blocListe;
        blocsListeOuverts[cle] = !blocsListeOuverts[cle];
        render();
      });
    });

    const toggleWarningSecurite = document.getElementById('toggleWarningSecurite');
    if (toggleWarningSecurite) {
      toggleWarningSecurite.addEventListener('click', (e) => {
        e.stopPropagation();
        warningSecuriteOuvert = !warningSecuriteOuvert;
        render();
      });
    }

    // Le bloc "Vos missions" est désormais réparti sur trois conteneurs
    // distincts (obligatoiresSection/disponiblesSection/conditionnellesSection)
    // au lieu d'un seul #content contigu — le câblage des interactions
    // (plier une carte, cocher un item, valider une mission, etc.) se fait
    // donc au niveau du document entier plutôt que d'un conteneur unique.
    // Sans risque de collision : ces classes (.mission-head, .check-item,
    // .presence-item, .produit-recherche, .produit-changer, .btn-valider)
    // ne sont produites que par renderMissionCard/renderChecklist/
    // renderPickerProduit, jamais ailleurs sur la page.
    document.querySelectorAll('.mission-head').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        if (missionsOuvertes.has(id)) missionsOuvertes.delete(id); else missionsOuvertes.add(id);
        document.getElementById(`body-${id}`).classList.toggle('open');
      });
    });
    // Photo par action (27/07/2026) : un item marqué data-photo="1" ne se
    // coche jamais d'un simple clic — le clic ouvre l'appareil photo, et
    // l'item n'est coché qu'après upload réussi (voir uploaderPreuvePhoto).
    // Un clic sur un item déjà photographié permet de recommencer (erreur
    // de manip), en effaçant explicitement l'ancienne preuve.
    document.querySelectorAll('.check-item[data-photo="1"]').forEach(el => {
      const key = el.dataset.key;
      const lastUnderscore = key.lastIndexOf('_');
      const missionId = key.slice(0, lastUnderscore);
      const idx = parseInt(key.slice(lastUnderscore + 1), 10);
      const input = el.querySelector('.check-photo-input');

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        if (checkState[key]) {
          checkState[key] = false;
          delete itemPhotoState[key];
          render();
          sauvegarderProgressionItem(employeeId, missionId, idx, false, null);
          return;
        }
        // Anti-rebond (05/08/2026) : ignore tout nouveau tapotement tant
        // que l'appareil photo vient de s'ouvrir il y a moins de 1.5s.
        const maintenant = Date.now();
        if (maintenant - (dernierTapAppareilPhoto[key] || 0) < DELAI_ANTI_REBOND_PHOTO_MS) return;
        dernierTapAppareilPhoto[key] = maintenant;
        const badge = el.querySelector('.check-photo-badge');
        if (badge) badge.textContent = "Ouverture de l'appareil…";
        input.click();
      });
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('change', async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const badge = el.querySelector('.check-photo-badge');
        if (badge) badge.textContent = 'Envoi…';
        const url = await uploaderPreuvePhoto(`${missionId}-etape${idx}`, file);
        if (!url) { alert("Erreur lors de l'envoi de la photo — réessayez."); render(); return; }
        checkState[key] = true;
        itemPhotoState[key] = url;
        render();
        sauvegarderProgressionItem(employeeId, missionId, idx, true, url);
      });
    });
    document.querySelectorAll('.check-item:not([data-photo="1"])').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = el.dataset.key;
        checkState[key] = !checkState[key];
        render(); // re-rendu immédiat (optimiste) pour activer/desactiver le bouton Valider

        const lastUnderscore = key.lastIndexOf('_');
        const missionId = key.slice(0, lastUnderscore);
        const idx = parseInt(key.slice(lastUnderscore + 1), 10);
        sauvegarderProgressionItem(employeeId, missionId, idx, checkState[key]);
      });
    });
    document.querySelectorAll('.presence-item').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = el.dataset.key;
        presentsState[key] = !presentsState[key];
        render();
      });
    });

    // Sélecteur de produit (missions necessite_produit) — recherche câblée
    // directement sur son propre input/suggestions, SANS passer par render()
    // à chaque frappe (ça ferait perdre le focus du champ à chaque lettre).
    document.querySelectorAll('.produit-recherche').forEach(input => {
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('input', () => {
        const missionId = input.id.replace('produit-search-', '');
        const box = document.getElementById(`produit-suggestions-${missionId}`);
        if (!box) return;
        const q = input.value.trim().toLowerCase();
        if (q.length < 2) { box.innerHTML = ''; return; }
        const matches = PRODUITS_ARTICLES.filter(p => p.article.toLowerCase().includes(q)).slice(0, 8);
        box.innerHTML = matches.map((p, i) => `
          <div class="produit-suggestion-item" data-mission="${missionId}" data-i="${i}">
            <div>${p.article}</div>
            <div class="psi-cat">${p.categorie}</div>
          </div>`).join('');
        box.querySelectorAll('.produit-suggestion-item').forEach(item => {
          item.addEventListener('click', e => {
            e.stopPropagation();
            produitCibleState[missionId] = matches[Number(item.dataset.i)];
            missionsOuvertes.add(missionId); // reste ouverte après le choix
            render();
          });
        });
      });
    });
    document.querySelectorAll('.produit-changer').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        delete produitCibleState[el.dataset.mission];
        missionsOuvertes.add(el.dataset.mission);
        render();
      });
    });

    document.querySelectorAll('.btn-valider').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const missionId = btn.dataset.mission;
        const mission = catalogue.find(m => m.mission_id === missionId);
        if (!mission) return;

        const libelleInitial = btn.textContent;
        const controle = estMissionControleManager(mission);

        const finaliser = async (file) => {
          if (mission.proof_required && !file) {
            alert('Photo requise — la mission ne peut pas être validée sans preuve.');
            return;
          }
          const produitCible = mission.necessite_produit ? produitCibleState[missionId] : null;
          if (mission.necessite_produit && !produitCible) {
            alert('Choisissez le produit concerné avant de valider.');
            return;
          }

          let photoUrl = null;
          if (file) {
            btn.disabled = true;
            btn.textContent = 'Envoi de la photo…';
            photoUrl = await uploaderPreuvePhoto(missionId, file);
            if (mission.proof_required && !photoUrl) {
              alert("Erreur lors de l'envoi de la photo — réessayez. La mission n'a pas été validée.");
              btn.disabled = false;
              btn.textContent = libelleInitial;
              return;
            }
          }

          // Points proportionnels pour les missions photo_par_action
          // (02/08/2026, demande de Frédéric) : si seulement une partie des
          // étapes a été cochée + photographiée, on n'attribue que la part
          // correspondante du barème (minimum 1 point dès qu'une étape est
          // prouvée), plutôt que tout ou rien. Les autres missions gardent
          // le calcul fixe existant (+2 preuve photo unique le cas échéant).
          let points;
          let estPartielle = false;
          if (mission.photo_par_action) {
            // Filet de sécurité (05/08/2026) : total toujours sûr, et on
            // évite une division par zéro si jamais la checklist est vide.
            const total = Array.isArray(mission.checklist) ? mission.checklist.length : 0;
            const fait = nbCoches(mission);
            estPartielle = fait < total;
            points = total > 0 ? Math.max(1, Math.round((mission.points || 5) * (fait / total))) : (mission.points || 5);
          } else {
            points = mission.proof_required ? (mission.points || 5) + 2 : (mission.points || 5);
          }
          const checklistLenFinal = Array.isArray(mission.checklist) ? mission.checklist.length : 0;
          const titreFinal = estPartielle ? `${mission.titre} (${nbCoches(mission)}/${checklistLenFinal})` : mission.titre;
          const employesPresents = controle
            ? EMPLOYES_SITE.filter(e => presentsState[`${missionId}_${e.id}`]).map(e => e.id)
            : null;
          const entry = {
            mission_id: missionId, titre: titreFinal,
            date: new Date().toISOString().slice(0,10), heure: new Date().toTimeString().slice(0,5),
            photo_fournie: !!photoUrl, photo_url: photoUrl, points,
            employes_presents: employesPresents,
            article_cible: produitCible ? produitCible.article : null,
            categorie_cible: produitCible ? produitCible.categorie : null,
            // Points en attente de validation (03/08/2026, demande de
            // Frédéric) : uniquement les missions à preuve photo — les
            // autres restent créditées immédiatement.
            statut_validation: mission.proof_required ? 'en_attente' : 'valide',
          };
          completionsCache.push(entry); // re-rendu optimiste
          delete produitCibleState[missionId]; // repart propre pour la prochaine fois
          render();
          renderConseillerPerso(calculerStatsPersonnelles(completionsCache), employeActuel);
          sauvegarderCompletionSupabase(employeeId, entry);
        };

        if (mission.proof_required) {
          // Anti-rebond (05/08/2026) : même protection que pour les photos
          // par étape — un second tapotement sur "Valider" pendant
          // l'ouverture de l'appareil photo ne doit plus en relancer un
          // second en parallèle.
          const maintenant = Date.now();
          if (maintenant - (dernierTapAppareilPhoto[missionId] || 0) < DELAI_ANTI_REBOND_PHOTO_MS) return;
          dernierTapAppareilPhoto[missionId] = maintenant;
          const input = document.getElementById(`photo-${missionId}`);
          input.onchange = () => finaliser(input.files && input.files[0]);
          input.click();
        } else {
          finaliser(null);
        }
      });
    });
  }

  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html

    employeActuel = employee.nom;
    employeeId = employee.id;
    SITE_ACTUEL = employee.site_id || 'vito-sainte-marie';

    if (!employee.consultation_externe) {
      const shiftDuJour = await chargerShiftAujourdhui(employeeId);
      if (!shiftDuJour) {
        window.location.href = 'NEXUS-Prise-De-Poste-v1.html';
        return;
      }
      roleDuJour = shiftDuJour.role;
      quartDuJour = shiftDuJour.quart || null;
    } else {
      roleDuJour = 'manager'; // vue d'ensemble par defaut pour une consultation externe
    }

    document.querySelector('.eyebrow').textContent = roleDuJour === 'manager' ? "NEXUS · Plans d'action" : 'NEXUS · Missions';
    document.querySelector('.title').textContent = roleDuJour === 'manager' ? "Vos plans d'action" : 'Vos missions du jour';

    // Lien permanent pour refaire la prise de poste volontairement (erreur
    // de saisie, changement de rôle en cours de journée...) — la prise de
    // poste reste valable 24h automatiquement, mais ne doit jamais bloquer
    // une correction manuelle. Demande de Frédéric le 21/07/2026.
    if (!employee.consultation_externe) {
      document.getElementById('roleJourLigne').innerHTML =
        `Rôle du jour : ${libelleRole(roleDuJour)} · <a href="NEXUS-Prise-De-Poste-v1.html">Changer de rôle / refaire la prise de poste</a>`;
    }

    catalogue = await chargerCatalogue();
    const progression = await chargerProgressionSupabase(employeeId);
    checkState = progression.checkState;
    itemPhotoState = progression.photoState;
    completionsCache = await chargerCompletionsSupabase(employeeId);
    if (!employee.consultation_externe) {
      heureArriveeAujourdhui = await chargerHeureArriveeAujourdhui(employeeId);
      dernierServiceComparable = await chargerDernierServiceComparable(employeeId, roleDuJour, quartDuJour);
    }
    // Chargé seulement si le catalogue contient une mission qui en a besoin
    // — évite une requête inutile pour les sites/rôles qui ne l'utilisent pas.
    if (catalogue.some(m => m.necessite_produit)) {
      PRODUITS_ARTICLES = await chargerProduitsPourPhoto();
    }
    // Accueil renfort à la connexion/prise de poste (03/08/2026) : seul ce
    // premier rendu — celui déclenché par le chargement de la page — passe
    // par renderConseillerPersoAvecAccueil ; les rendus suivants (temps réel,
    // validation d'une mission...) rappellent renderConseillerPerso
    // directement, l'accueil ne devant apparaître qu'une fois par service.
    renderConseillerPersoAvecAccueil(calculerStatsPersonnelles(completionsCache), employee.nom);
    if (roleDuJour === 'manager') {
      EMPLOYES_SITE = await chargerEmployesSite();
      PLANS_ACTION = await construirePlansAction();
    }

    // Catégories (03/08/2026) : remplace l'ancienne barre d'onglets plats
    // par renderCategoriesSection (appelé depuis render(), qui recrée ses
    // propres cartes + listeners à chaque rendu, points disponibles inclus).

    document.getElementById('search').addEventListener('input', render);

    render();

    // Rappel carburant — meme source unique de verite que HOME (le resultat
    // deja calcule dans Parametres Rappels), injecte une seule fois au
    // chargement, pas a chaque re-rendu de la liste.
    (async function injecterRappelCarburantMissions() {
      try {
        const derniereRecommandation = JSON.parse(localStorage.getItem('nexus_derniere_recommandation_carburant') || 'null');
        if (!derniereRecommandation) return;
        const aujourdISO = new Date().toISOString().slice(0,10);
        if (derniereRecommandation.date !== aujourdISO) return;
        if (derniereRecommandation.action !== 'COMMANDER') return;

        const r = derniereRecommandation;
        const total = (r.qSP||0) + (r.qGO||0);
        PLANS_ACTION.unshift({
          etat: r.mode === 'CAMION_COMPLET' ? "🔥 À AGIR" : "🔴 À DÉCIDER",
          candidate_id: "RAPPEL-CARBU-" + r.date,
          recommandation: `Je vous recommande de commander le carburant aujourd'hui — ${r.qSP>0?`Sans Plomb ~${r.qSP.toLocaleString('fr-FR')} L`:''}${r.qSP>0&&r.qGO>0?', ':''}${r.qGO>0?`Gasoil ~${r.qGO.toLocaleString('fr-FR')} L`:''}.`,
          situation: `Calcul réalisé aujourd'hui dans Paramètres Rappels : ${r.mode === 'CAMION_COMPLET' ? 'camion complet visé' : 'complément de sécurité'} (${total.toLocaleString('fr-FR')} L au total).`,
          contexte: r.message,
          analyse: "Ce résultat vient directement du calcul complet — pas d'une version simplifiée.",
          consequence: `Commande à passer le ${r.dateCommande} pour livraison le ${r.dateLivraison}.`,
          impact: "Vous évitez une rupture tout en respectant la règle de stock minimal en fin de mois.",
        });
        await renderPlansActionMissions();
      } catch (err) { console.error('Rappel carburant:', err); }
    })();
  });
</script>
</body>
</html>
