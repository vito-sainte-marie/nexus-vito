<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Live Développement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nexus-build.js"></script>
<script src="nexus-auth.js?v=20260904-0104"></script>
<script src="nexus-live-acces.js?v=20260907-0100"></script>
<script src="nexus-live-evenement.js?v=20260907-0100"></script>
<script src="nexus-live-projection.js?v=20260907-0100"></script>
<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline);}
  .header{padding:20px 20px 14px;}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--amber);}
  .title{font-size:20px; font-weight:600; margin-top:4px;}
  .subtitle{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:4px;}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}
  .section{padding:16px 20px;}
  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:18px; margin-bottom:14px;}
  .section-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:12px;}
  .locked{padding:40px 20px; text-align:center; color:var(--text-dim); font-family:var(--mono); font-size:12px;}
  .statut-badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; border-radius:20px; padding:4px 10px;}
  .statut-AUTONOMOUS{color:var(--green); background:var(--green-dim); border:1px solid rgba(52,211,153,0.4);}
  .statut-HUMAN_REQUIRED{color:var(--amber); background:var(--amber-dim); border:1px solid rgba(245,166,35,0.4);}
  .statut-FAIL_CLOSED{color:var(--red); background:var(--red-dim); border:1px solid rgba(240,87,90,0.4);}
  .statut-IDLE{color:var(--text-mid); background:var(--panel-raised); border:1px solid var(--hairline);}
  .timeline-item{padding:8px 0; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .timeline-item:last-child{border-bottom:none;}
  .timeline-meta{font-family:var(--mono); font-size:9.5px; color:var(--text-dim); margin-top:2px;}
  .guardian-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:12.5px;}
  .empty-note{color:var(--text-dim); font-size:12px; font-family:var(--mono);}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="header">
    <div class="eyebrow">NEXUS · Créateur</div>
    <div class="title">Live Développement</div>
    <div class="subtitle" id="sousTitre">Chargement…</div>
  </div>
  <div class="divider"></div>
  <div class="section" id="root"><div class="empty-note">Chargement…</div></div>
</div>
<script>
  // NEXUS LIVE DÉVELOPPEMENT — MVP (07/09/2026), lot
  // NEXUS-LIVE-CONTROL-CENTER-1-20260906. Réservé au Créateur NEXUS
  // (spec-1.md §2-3) : la page appelle nexusRequireAuth() comme tout écran
  // authentifié NEXUS, puis délègue la décision d'accès à
  // NexusLiveAcces.nexusLiveAutorise(employee) — un seul point de vérité,
  // aucun second calcul d'autorisation ici. Le masquage de ce point d'entrée
  // dans la navigation NEXUS est une mesure UX ; la protection réelle est
  // la politique RLS `select_nexus_live_events` (je_suis_createur()) posée
  // par la migration 20260907010000 — un accès direct à l'URL par un
  // utilisateur non Créateur charge la page mais n'obtient aucune donnée.

  function afficherRefus(motif) {
    document.getElementById('sousTitre').textContent = 'Accès refusé';
    document.getElementById('root').innerHTML =
      `<div class="locked">Cet écran est réservé au Créateur NEXUS.<br>(${motif})</div>`;
  }

  function libelleStatut(statut) {
    const L = {
      AUTONOMOUS: 'Système autonome', HUMAN_REQUIRED: 'Intervention requise',
      FAIL_CLOSED: 'Bloqué en sécurité', IDLE: 'Au repos',
    };
    return L[statut] || statut;
  }

  function renderProjection(projection, evenements) {
    document.getElementById('sousTitre').textContent = 'Environnement Test';
    const root = document.getElementById('root');
    if (!evenements.length) {
      root.innerHTML = '<div class="card"><div class="empty-note">Aucun événement Live reçu pour le moment.</div></div>';
      return;
    }

    const dernier = evenements[evenements.length - 1];
    const guardiansHtml = Object.keys(projection.guardians).length
      ? Object.entries(projection.guardians).map(([id, statut]) =>
          `<div class="guardian-row"><span>${id}</span><span>${statut}</span></div>`).join('')
      : '<div class="empty-note">Aucun Guardian actif sur ce lot.</div>';

    const timelineHtml = evenements.slice(-8).reverse().map(evt =>
      `<div class="timeline-item">${evt.summary}
        <div class="timeline-meta">${evt.phase} · ${evt.status} · ${evt.actor.id} · ${evt.occurred_at}</div>
      </div>`).join('');

    root.innerHTML = `
      <div class="card">
        <div class="section-label">Maintenant</div>
        <span class="statut-badge statut-${projection.system_status}">${libelleStatut(projection.system_status)}</span>
        <div style="margin-top:10px;">Lot actif : <strong>${projection.active_lots.join(', ') || '—'}</strong></div>
        <div>Agent actif : ${projection.active_actor || '—'}</div>
        <div>Étape : ${projection.current_phase || '—'}</div>
        <div>Prochaine étape automatique : ${projection.next_automatic_step || '—'}</div>
      </div>
      ${projection.human_gate ? `<div class="card"><div class="section-label">Intervention</div>
        <div>${projection.human_gate.question}</div></div>` : ''}
      <div class="card">
        <div class="section-label">Guardians</div>
        ${guardiansHtml}
      </div>
      <div class="card">
        <div class="section-label">Timeline</div>
        ${timelineHtml}
      </div>
    `;
  }

  nexusRequireAuth().then(async employee => {
    if (!employee) return; // nexus-auth.js gère déjà la redirection vers NEXUS-Login-v1.html
    if (!window.NexusLiveAcces || !window.NexusLiveAcces.nexusLiveAutorise(employee)) {
      afficherRefus(window.NexusLiveAcces ? window.NexusLiveAcces.motifRefusLive(employee) : 'module_acces_indisponible');
      return;
    }
    const { data, error } = await nexusClient
      .from('nexus_live_events')
      .select('event_id, occurred_at, lot_id, run_id, actor_id, actor_role, phase, status, summary, evidence, next_step, human_gate, source')
      .order('occurred_at', { ascending: true })
      .limit(500);
    if (error) {
      document.getElementById('root').innerHTML = `<div class="card"><div class="empty-note">Lecture du journal Live impossible : ${error.message}</div></div>`;
      return;
    }
    const evenements = (data || []).map(row => ({
      protocol: 'nexus-execution-event/1',
      event_id: row.event_id,
      occurred_at: row.occurred_at,
      lot_id: row.lot_id,
      run_id: row.run_id,
      actor: { id: row.actor_id, role: row.actor_role },
      phase: row.phase,
      status: row.status,
      summary: row.summary,
      evidence: row.evidence,
      next_step: row.next_step,
      human_gate: row.human_gate,
      source: row.source,
    })).filter(window.NexusLiveEvenement.evenementValide);
    const projection = window.NexusLiveProjection.construireProjectionLive(evenements);
    renderProjection(projection, evenements);
  });
</script>
</body>
</html>
