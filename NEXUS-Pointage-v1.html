<style>
  :root{
    --bg:#0B0F14; --panel:#141B22; --panel-raised:#1A222C; --hairline:#242E38;
    --text:#EDF1F5; --text-mid:#8A96A5; --text-dim:#57626F;
    --green:#34D399; --green-dim:#153629;
    --amber:#F5A623; --amber-dim:#3A2E14;
    --red:#F0575A; --red-dim:#3A1D1F;
    --cyan:#4FC3D9; --cyan-dim:rgba(79,195,217,0.12);
    --gold:#D4AF37;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); font-family:var(--sans); color:var(--text);}
  body{display:flex; justify-content:center; min-height:100vh;}
  .phone{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; border-left:1px solid var(--hairline); border-right:1px solid var(--hairline); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  .header{padding:20px 20px 14px; position:relative;}
  .menu-btn{
    position:absolute; top:18px; right:18px; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--cyan); background:rgba(79,195,217,0.1); border:1px solid rgba(79,195,217,0.3);
    border-radius:20px; padding:7px 12px; text-decoration:none; white-space:nowrap; z-index:5;
  }
  .menu-btn:active{background:rgba(79,195,217,0.2);}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan);}
  .title{font-size:19px; font-weight:600; margin-top:4px;}
  .heure-live{font-family:var(--mono); font-size:28px; font-weight:600; margin-top:10px; color:var(--text);}
  .date-live{font-size:12px; color:var(--text-mid); margin-top:2px; text-transform:capitalize;}
  .service-live{font-family:var(--mono); font-size:11.5px; font-weight:600; margin-top:6px; min-height:14px; color:var(--green);}
  .service-live.pause{color:var(--amber);}
  .divider{height:1px; background:var(--hairline); margin:0 20px;}

  .section{padding:16px 20px;}
  .section-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .section-label::after{content:''; flex:1; height:1px; background:var(--hairline);}

  /* Boutons de pointage (28/07/2026, demande de Frédéric) : reprend le
     design plein-largeur coloré par type de l'ancien prototype Pointage
     (fichier uploadé le 19/07/2026, avant la refonte de cette page) —
     vert=arrivée, ambre=pause, rouge=départ — avec les améliorations
     apportées depuis (sous-texte dynamique, photo obligatoire, état
     "pointé"). */
  .pointage-list{display:flex; flex-direction:column; gap:10px;}
  .pointage-btn{
    display:block; box-sizing:border-box;
    border:none; border-radius:12px; padding:16px 18px; width:100%; text-align:left;
    font-family:var(--sans); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .pointage-btn .label{display:block; font-size:14.5px; font-weight:700;}
  .pointage-btn .sous{display:block; font-family:var(--mono); font-size:11px; font-weight:500; margin-top:3px; opacity:0.85;}
  .pointage-btn.couleur-arrivee{background:var(--green); color:#04141a;}
  .pointage-btn.couleur-pause{background:var(--amber); color:#04141a;}
  .pointage-btn.couleur-depart{background:var(--red); color:#04141a;}
  .pointage-btn:disabled{opacity:0.35; cursor:not-allowed;}
  /* Équivalent de :disabled pour un <label> (les actions avec photo) — voir
     setElementOccupe() : un <label> n'a pas de vrai état disabled. */
  .pointage-btn.pointage-occupe{opacity:0.6; pointer-events:none;}

  .timeline{list-style:none; padding:0; margin:0;}
  .timeline-item{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .timeline-item:last-child{border-bottom:none;}
  .timeline-dot{width:8px; height:8px; border-radius:50%; background:var(--cyan); flex-shrink:0; margin-top:5px;}
  .timeline-dot.retard{background:var(--red);}
  .timeline-dot.vide{background:transparent; border:1.5px solid var(--text-dim);}
  .timeline-body{flex:1; min-width:0;}
  .timeline-row-top{font-size:13px;}
  .timeline-label{font-size:13px;}
  .timeline-label-prochaine{font-family:var(--mono); font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-dim);}
  .timeline-heure{font-family:var(--mono); font-size:12px; color:var(--text-mid); flex-shrink:0;}
  .timeline-sub{font-family:var(--mono); font-size:11px; color:var(--text-mid); margin-top:3px; line-height:1.5;}
  .timeline-sub.retard{color:var(--amber);}
  .timeline-photo{font-family:var(--mono); font-size:11px; color:var(--cyan); text-decoration:none;}
  .timeline-empty{font-size:12.5px; color:var(--text-dim); padding:6px 0;}
  .timeline-anomalie-lien{background:none; border:none; padding:0; margin-top:5px; font-family:var(--mono); font-size:11px; color:var(--cyan); cursor:pointer; text-decoration:underline; -webkit-tap-highlight-color:transparent;}
  .timeline-anomalie-ok{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:5px;}
  .anomalie-form{margin-top:8px;}
  .anomalie-form textarea{width:100%; background:var(--panel-raised); border:1px solid var(--hairline); border-radius:8px; color:var(--text); font-family:var(--sans); font-size:16px; padding:8px 10px; resize:vertical; min-height:56px;}
  .anomalie-form-actions{display:flex; gap:8px; margin-top:6px;}
  .anomalie-btn{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; border-radius:8px; padding:7px 12px; border:1px solid var(--hairline); background:var(--panel); color:var(--text-mid); cursor:pointer;}
  .anomalie-btn.primaire{border-color:var(--cyan); color:var(--cyan);}

  .confirm-banner{background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.35); border-radius:12px; padding:14px; margin-bottom:14px; font-size:13px; line-height:1.55; color:var(--green); display:none;}
  .confirm-banner.retard{background:var(--red-dim); border-color:rgba(240,87,90,0.4); color:var(--red);}
  .confirm-banner.show{display:block;}
  .confirm-banner-titre{font-weight:600;}
  .confirm-banner-sous{font-family:var(--mono); font-size:11.5px; margin-top:3px; opacity:0.85;}

  .activite-jour{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px;}
  .activite-texte{font-size:13px; color:var(--text);}
  .activite-lien{display:inline-block; margin-top:6px; font-family:var(--mono); font-size:11.5px; color:var(--cyan); text-decoration:none;}

  .info-note{background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px; font-size:12.5px; line-height:1.6; color:var(--text-mid);}
  .locked{padding:60px 20px; text-align:center; color:var(--text-dim); font-size:13px;}

  .equipe-item{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--hairline); font-size:13px;}
  .equipe-item:last-child{border-bottom:none;}
  .equipe-nom{color:var(--text);}
  .equipe-statut{font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}
  .equipe-statut.ok{color:var(--green);}
  .equipe-statut.retard{color:var(--red);}

  footer{margin-top:auto; padding:16px 20px 24px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-align:center; border-top:1px solid var(--hairline);}

  /* Capture caméra en page (10/08/2026, demande de Frédéric suite au 3e cas
     de Samantha — Samsung Galaxy S24 cette fois) : remplace l'appareil
     photo natif comme moyen PRINCIPAL de prendre la photo de pointage.
     L'appareil photo natif (via <input capture>) fait quitter la page —
     certains navigateurs Android (Samsung Internet notamment) déchargent
     alors la page en arrière-plan pour récupérer de la mémoire, et
     l'employé revient sur un écran "neuf" sans que rien n'ait été
     enregistré (voir les 2 correctifs précédents plus haut dans le JS).
     En restant dans la page (flux vidéo + capture canvas), NEXUS ne quitte
     jamais son propre contexte : Android n'a plus de raison de le tuer.
     L'ancien mécanisme (label + input capture) est conservé comme repli
     si getUserMedia est indisponible ou refusé — jamais un employé
     totalement bloqué faute de caméra en page. */
  .camera-overlay{position:fixed; inset:0; background:#000; z-index:100; display:flex; flex-direction:column;}
  .camera-video-wrap{flex:1; position:relative; overflow:hidden; background:#000;}
  .camera-video-wrap video, .camera-video-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .camera-consigne{position:absolute; top:0; left:0; right:0; padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top)); background:linear-gradient(rgba(0,0,0,0.65), transparent); color:#fff; font-size:13px; line-height:1.5; text-align:center;}
  .camera-close{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px; width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.25); color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .camera-controls{padding:22px 20px calc(22px + env(safe-area-inset-bottom)); background:#0B0F14; display:flex; align-items:center; justify-content:center; gap:22px;}
  .camera-btn-capture{width:68px; height:68px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,0.35); cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .camera-btn-capture:active{background:#dcdcdc;}
  .camera-controls-preview{padding:18px 20px calc(18px + env(safe-area-inset-bottom)); background:#0B0F14; display:flex; gap:12px;}
  .camera-btn-texte{flex:1; padding:14px; border-radius:10px; font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; border:none; text-align:center;}
  .camera-btn-texte.reprendre{background:var(--panel-raised); color:var(--text); border:1px solid var(--hairline);}
  .camera-btn-texte.valider{background:var(--cyan); color:#04141a;}
  .camera-etat{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:32px; text-align:center; color:#fff; font-size:13.5px; line-height:1.6;}
  .camera-etat-actions{margin-top:18px; display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px;}
  .camera-etat-actions button, .camera-etat-actions label{display:block; padding:13px; border-radius:10px; font-family:var(--sans); font-size:13.5px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; border:none; text-align:center;}
  .camera-etat-actions .primaire{background:var(--cyan); color:#04141a;}
  .camera-etat-actions .secondaire{background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.25);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="NEXUS-App-v1.html" class="menu-btn">☰ Menu</a>
    <div class="eyebrow">NEXUS · Pointage</div>
    <div class="title" id="pageTitle">Chargement…</div>
    <div class="heure-live" id="heureLive">--:--:--</div>
    <div class="date-live" id="dateLive"></div>
    <div class="service-live" id="serviceLive"></div>
  </div>
  <div class="divider"></div>
  <!-- desktop-grid (02/08/2026) : mise en colonnes en vue bureau (voir
       nexus-desktop.js) — purement additif, aucun effet en mobile. -->
  <div class="section desktop-grid" id="app">
    <div class="info-note">Chargement de votre journée…</div>
  </div>
  <footer>NEXUS Pointage v1 · Vito Sainte-Marie Usine</footer>
</div>

<script>
  // ============================================================
  // NEXUS Pointage — page d'horodatage arrivée / pause / départ
  // (28/07/2026). Cette page comblait un lien mort : elle était déjà
  // référencée dans la navigation et la recherche de App-v1, et la
  // table Supabase `pointages` existait déjà et alimente depuis
  // longtemps Journal, Radar-Manager, Résultats Équipe, Progression
  // et Apprentissage — mais aucun écran ne permettait réellement de
  // pointer depuis la migration du 15/07/2026 (voir commentaire dans
  // NEXUS-Journal-v1.html). Cette page est donc le formulaire de
  // saisie qui manquait, pas une nouvelle fonctionnalité de zéro.
  //
  // Règle : chaque type ('arrivee','pause_debut','pause_fin','depart')
  // ne peut être pointé qu'une fois par jour et par employé, dans
  // l'ordre. Le retard n'est calculé (retard_min) que pour l'arrivée,
  // à partir du quart actif de l'employé dans `shifts` (statut
  // 'en_cours') — jamais un chiffre inventé : si aucun quart actif
  // n'est trouvé, retard_min reste à 0 plutôt que d'être estimé.
  //
  // Photo de validation (28/07/2026, demande de Frédéric) : l'arrivée et
  // le départ exigent une photo qui valide l'action, avant même
  // l'enregistrement en base — rien n'est inséré tant que la photo n'est
  // pas envoyée avec succès. Début/fin de pause restent sans photo.
  // ============================================================

  // Règle "le clic est le moment d'arrivée" (03/08/2026, demande de
  // Frédéric) : pour arrivée/départ, la photo passe par l'appareil photo du
  // téléphone puis un envoi réseau avant d'être enregistrée — ce délai ne
  // doit jamais faire porter une heure tardive à l'employé. C'est donc
  // l'instant du CLIC sur le bouton (avant l'ouverture de l'appareil photo)
  // qui est retenu comme heure réelle du pointage, tant que la validation
  // (photo prise + envoyée avec succès) aboutit dans la minute qui suit —
  // au-delà, on retombe sur l'heure réelle de validation (voir
  // enregistrerPointage). Règle volontairement silencieuse : aucune
  // minuterie ni avertissement affiché à l'employé, seulement une logique
  // de fond qui le protège d'un délai réseau qu'il ne maîtrise pas, sans
  // permettre non plus de geler une heure d'arrivée en attendant.
  const TOLERANCE_CLIC_VALIDATION_MS = 60000;
  const clicPointage = {}; // type -> Date, posé au clic, lu par enregistrerPointage

  // Détection d'une tentative interrompue (03/08/2026, demande de Frédéric,
  // suite au cas de Samantha : elle pensait avoir pris la photo mais son
  // pointage n'était jamais arrivé en base — probablement la page quittée
  // ou la connexion coupée pendant l'envoi — et se retrouvait bloquée sans
  // comprendre pourquoi). On pose un repère juste avant l'envoi et on le
  // retire dès que l'issue (succès ou échec) est connue ; s'il est encore
  // présent au chargement suivant de la page pour ce même employé, c'est
  // qu'une tentative précédente n'a jamais abouti.
  const CLE_TENTATIVE_EN_COURS = 'nexus_pointage_tentative_en_cours';

  const ORDRE_TYPES = ['arrivee', 'pause_debut', 'pause_fin', 'depart'];
  const LABELS_TYPES = {
    // consignePhoto (28/07/2026, demande de Frédéric) : précise ce qui
    // doit être photographié — NEXUS ne peut pas vérifier le contenu
    // d'une photo, seulement guider l'employé sur quoi prendre avant
    // qu'il n'ouvre l'appareil photo. Arrivée : l'extérieur de la
    // station (parking) suffit. Départ : la mise en alarme est
    // obligatoire, c'est la preuve que la station est sécurisée.
    arrivee: { icon: '🟢', label: 'Arrivée', sous: 'Prise de poste', photoRequise: true, consignePhoto: 'Photo extérieure (parking) suffisante — une fois la photo prise, patientez quelques secondes, ne quittez pas la page', histLabel: 'Arrivée enregistrée', labelProchaine: 'Arrivée' },
    pause_debut: { icon: '⏸️', label: 'Début pause', sous: '', photoRequise: false, histLabel: 'Début de pause enregistré', labelProchaine: 'Début de pause' },
    pause_fin: { icon: '▶️', label: 'Fin pause', sous: '', photoRequise: false, histLabel: 'Fin de pause enregistrée', labelProchaine: 'Fin de pause' },
    depart: { icon: '🔴', label: 'Départ', sous: 'Fin de poste', photoRequise: true, consignePhoto: 'Obligatoire : photo de la mise en alarme — une fois la photo prise, patientez quelques secondes, ne quittez pas la page', histLabel: 'Départ enregistré', labelProchaine: 'Départ' },
  };

  // Couleur par type (28/07/2026, demande de Frédéric) : reprend exactement
  // le code couleur de l'ancien prototype Pointage (vert=arrivée,
  // ambre=pause, rouge=départ) pour les boutons pleine-largeur.
  const COULEUR_TYPES = { arrivee: 'arrivee', pause_debut: 'pause', pause_fin: 'pause', depart: 'depart' };

  // Photo de validation (28/07/2026, demande de Frédéric) : l'arrivée et
  // le départ exigent une photo qui valide l'action, même principe que
  // photo_par_action sur les missions (voir NEXUS-Missions-v1.html) —
  // réutilise le même bucket privé preuves-missions plutôt que d'en
  // créer un nouveau, c'est le même concept de preuve photographiée.
  // Redimensionnement côté client avant envoi (05/08/2026, même correctif
  // que sur NEXUS-Missions-v1.html) : une photo brute de téléphone récent
  // pèse souvent 5 à 15 Mo. Envoyée telle quelle depuis le wifi/mobile de
  // la station, l'upload peut prendre plus d'une minute — la bannière
  // "patientez" (voir plus haut) limite déjà la confusion, mais on réduit
  // aussi directement le temps d'attente réel en redescendant à une taille
  // raisonnable pour une preuve (max 1600px de côté, JPEG 82%). En cas
  // d'échec du redimensionnement, on retombe sur le fichier d'origine
  // plutôt que de bloquer le pointage.
  async function redimensionnerPhotoPointage(file) {
    try {
      if (!file.type || !file.type.startsWith('image/') || typeof createImageBitmap !== 'function') return file;
      const bitmap = await createImageBitmap(file);
      const MAX_COTE = 1600;
      const ratio = Math.min(1, MAX_COTE / Math.max(bitmap.width, bitmap.height));
      if (ratio === 1) { if (bitmap.close) bitmap.close(); return file; }
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * ratio);
      canvas.height = Math.round(bitmap.height * ratio);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      if (bitmap.close) bitmap.close();
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
      if (!blob) return file;
      return new File([blob], file.name || 'photo.jpg', { type: 'image/jpeg' });
    } catch (err) {
      console.error('Redimensionnement photo pointage (on garde le fichier original) :', err);
      return file;
    }
  }

  // Capture caméra EN PAGE (10/08/2026, demande de Frédéric — voir le
  // commentaire CSS .camera-overlay pour le contexte complet du 3e cas de
  // Samantha, Samsung Galaxy S24). Devient le moyen PRINCIPAL de prendre la
  // photo de pointage — jamais quitter le contexte de la page NEXUS elle-
  // même, donc plus aucune raison pour Android de la décharger pendant que
  // l'appareil photo est au premier plan. Retourne : un File (photo validée
  // par l'employé après aperçu) ; ou la chaîne 'repli' si l'employé a choisi
  // l'appareil photo natif (le <label for="inputId"> à l'intérieur de cette
  // fonction déclenche alors un vrai clic utilisateur sur l'input caché
  // existant, dont l'écouteur 'change' — inchangé — prend le relais
  // exactement comme avant ce chantier) ; ou null si l'employé a
  // véritablement annulé (aucune tentative en cours, natif ou en page).
  async function ouvrirCameraPointage({ consigne, inputId }) {
    return new Promise(resolve => {
      let flux = null;
      let photoBlobUrl = null;
      let resolu = false;

      const overlay = document.createElement('div');
      overlay.className = 'camera-overlay';
      document.body.appendChild(overlay);

      function arreterFlux() {
        if (flux) { flux.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); flux = null; }
        if (photoBlobUrl) { try { URL.revokeObjectURL(photoBlobUrl); } catch (e) {} photoBlobUrl = null; }
      }
      function fermer(valeur) {
        if (resolu) return;
        resolu = true;
        arreterFlux();
        overlay.remove();
        resolve(valeur);
      }
      function afficherEtat(html) { overlay.innerHTML = `<div class="camera-etat">${html}</div>`; }

      // Repli vers l'appareil photo natif (label + input capture, mécanisme
      // historique conservé tel quel) — jamais un employé bloqué faute de
      // caméra en page : indisponible, refusée, ou capture impossible.
      function afficherRepli(message) {
        afficherEtat(`
          <div>
            <div style="margin-bottom:6px; font-size:22px;">📷</div>
            <div>${message}</div>
            <div class="camera-etat-actions">
              <label class="primaire" for="${inputId}">Utiliser l'appareil photo du téléphone</label>
              <button class="secondaire" type="button" data-annuler-camera>Annuler</button>
            </div>
          </div>
        `);
        overlay.querySelector('[data-annuler-camera]').addEventListener('click', () => fermer(null));
        // Résolution spéciale 'repli' (et non null) : l'appelant doit savoir
        // que le mécanisme natif prend le relais (repère localStorage à
        // conserver, contrairement à une annulation volontaire).
        overlay.querySelector(`label[for="${inputId}"]`).addEventListener('click', () => fermer('repli'));
      }

      async function demarrer() {
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
          afficherRepli("La capture caméra intégrée n'est pas disponible sur ce navigateur.");
          return;
        }
        afficherEtat('Ouverture de la caméra…');
        try {
          flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        } catch (err) {
          console.error('getUserMedia (pointage):', err);
          const refuse = err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError');
          afficherRepli(refuse
            ? "Accès à la caméra refusé. Autorisez l'accès dans les réglages de votre téléphone, ou utilisez l'appareil photo natif ci-dessous."
            : "Impossible d'ouvrir la caméra intégrée à l'application. Utilisez l'appareil photo de votre téléphone à la place.");
          return;
        }
        if (resolu) { flux.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); return; }
        afficherVue();
      }

      function afficherVue() {
        overlay.innerHTML = `
          <div class="camera-video-wrap">
            <div class="camera-consigne">${consigne}</div>
            <div class="camera-close" data-fermer-camera>✕</div>
            <video autoplay playsinline muted></video>
          </div>
          <div class="camera-controls"><button type="button" class="camera-btn-capture" aria-label="Prendre la photo"></button></div>
        `;
        const video = overlay.querySelector('video');
        video.srcObject = flux;
        overlay.querySelector('[data-fermer-camera]').addEventListener('click', () => fermer(null));
        overlay.querySelector('.camera-btn-capture').addEventListener('click', () => capturer(video));
      }

      function capturer(video) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (!blob) { afficherRepli("La photo n'a pas pu être capturée. Utilisez l'appareil photo de votre téléphone à la place."); return; }
          photoBlobUrl = URL.createObjectURL(blob);
          afficherApercu(blob);
        }, 'image/jpeg', 0.9);
      }

      function afficherApercu(blob) {
        overlay.innerHTML = `
          <div class="camera-video-wrap">
            <div class="camera-consigne">${consigne}</div>
            <div class="camera-close" data-fermer-camera>✕</div>
            <img src="${photoBlobUrl}" alt="Photo prise">
          </div>
          <div class="camera-controls-preview">
            <button type="button" class="camera-btn-texte reprendre" data-reprendre>Reprendre</button>
            <button type="button" class="camera-btn-texte valider" data-valider>Valider cette photo</button>
          </div>
        `;
        overlay.querySelector('[data-fermer-camera]').addEventListener('click', () => fermer(null));
        overlay.querySelector('[data-reprendre]').addEventListener('click', () => {
          if (photoBlobUrl) { try { URL.revokeObjectURL(photoBlobUrl); } catch (e) {} photoBlobUrl = null; }
          afficherVue();
        });
        overlay.querySelector('[data-valider]').addEventListener('click', () => {
          fermer(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
        });
      }

      demarrer();
    });
  }

  async function uploaderPhotoPointage(employeeId, type, file) {
    const fichier = await redimensionnerPhotoPointage(file);
    const ext = (fichier.name && fichier.name.includes('.')) ? fichier.name.split('.').pop().toLowerCase() : 'jpg';
    const chemin = `${employeeId}/pointage-${type}-${Date.now()}.${ext}`;
    const { error: erreurUpload } = await nexusClient.storage
      .from('preuves-missions')
      .upload(chemin, fichier, { contentType: fichier.type || 'image/jpeg' });
    if (erreurUpload) { console.error('Upload photo pointage:', erreurUpload); return null; }

    const DIX_ANS = 315360000;
    const { data: signee, error: erreurSignee } = await nexusClient.storage
      .from('preuves-missions')
      .createSignedUrl(chemin, DIX_ANS);
    if (erreurSignee) { console.error('URL signée photo pointage:', erreurSignee); return null; }
    return signee.signedUrl;
  }

  // Une relance automatique avant d'abandonner (07/08/2026, demande de
  // Frédéric) : beaucoup d'échecs d'upload sont un simple aléa réseau
  // passager (wifi de station, cellulaire faible) — retenter une fois,
  // silencieusement, maximise les chances d'obtenir la preuve photo avant
  // de conclure à un échec technique et d'accepter le pointage sans elle.
  async function uploaderPhotoPointageAvecRelance(employeeId, type, file) {
    let url = await uploaderPhotoPointage(employeeId, type, file);
    if (!url) {
      await new Promise(resolve => setTimeout(resolve, 1500));
      url = await uploaderPhotoPointage(employeeId, type, file);
    }
    return url;
  }

  function heureLocale() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function dateISOLocale(d) {
    d = d || new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function demarrerHorloge() {
    const majHeure = () => {
      document.getElementById('heureLive').textContent = heureLocale();
      document.getElementById('dateLive').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      majServiceLive();
    };
    majHeure();
    setInterval(majHeure, 1000);
  }

  // Service/pause en cours (28/07/2026, demande de Frédéric) : petite ligne
  // sous l'horloge, sous la date — "Service en cours depuis X" tant que
  // l'employé est arrivé et n'a ni pointé sa pause ni son départ, "Pause en
  // cours depuis X" pendant la pause. `etatCompteur`/`referenceCompteur`
  // sont réglés par afficherFormulairePointage() à chaque rendu, à partir
  // de l'heure réelle du pointage concerné (jamais une estimation) — null
  // quand rien n'est en cours, ce qui rend majServiceLive() un no-op.
  let etatCompteur = null; // 'service' | 'pause' | null
  let referenceCompteur = null; // Date

  function formatDureeLongue(totalMin) {
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const txtH = h > 1 ? `${h} heures` : '1 heure';
    const txtM = m > 1 ? `${m} minutes` : (m === 1 ? '1 minute' : '0 minute');
    if (h > 0 && m > 0) return `${txtH} et ${txtM}`;
    if (h > 0) return txtH;
    return txtM;
  }

  function majServiceLive() {
    const el = document.getElementById('serviceLive');
    if (!el) return;
    if (!etatCompteur || !referenceCompteur) { el.textContent = ''; el.classList.remove('pause'); return; }
    const totalMin = Math.max(0, Math.floor((Date.now() - referenceCompteur.getTime()) / 60000));
    const duree = formatDureeLongue(totalMin);
    el.classList.toggle('pause', etatCompteur === 'pause');
    el.textContent = etatCompteur === 'pause' ? `Pause en cours depuis ${duree}` : `Service en cours depuis ${duree}`;
  }

  nexusRequireAuth().then(async employee => {
    if (!employee) return;
    demarrerHorloge();

    const estNiveauManager = employee.role === 'manager' || employee.role === 'gerant';
    const siteId = employee.site_id;

    const { data: stationConfig } = await nexusClient
      .from('station_config').select('pointage_actif, manager_pointage_requis').eq('site', siteId).maybeSingle();
    const pointageRequisManager = !!(stationConfig && stationConfig.manager_pointage_requis);

    // Pointage désactivé pour tout le site (16/08/2026, demande de Frédéric)
    // — verrou défensif : en pratique nexus-auth.js ne redirige plus jamais
    // personne vers cette page tant que pointage_actif=false, et les points
    // d'entrée (accueil, recherche) ont disparu, mais un lien direct copié/
    // collé ou mis en favori doit quand même retomber sur un message clair
    // plutôt qu'un formulaire de pointage qui n'a plus lieu d'être.
    if (stationConfig && stationConfig.pointage_actif === false) {
      document.getElementById('pageTitle').textContent = 'Pointage';
      document.getElementById('app').innerHTML = `
        <div class="locked">Le pointage est désactivé sur ce site.<br>Un manager peut le réactiver depuis Paramètres Station.</div>
      `;
      return;
    }

    if (estNiveauManager && !pointageRequisManager) {
      document.getElementById('pageTitle').textContent = 'Pointage';
      document.getElementById('app').innerHTML = `
        <div class="section-label">📋 Équipe aujourd'hui</div>
        <ul class="timeline" id="equipeListe"><li class="timeline-empty">Chargement…</li></ul>
        <div style="height:14px;"></div>
        <div class="info-note">Le pointage n'est pas requis pour votre poste — activable dans Paramètres Station si vous souhaitez suivre vos propres horaires.</div>
      `;
      await afficherEquipeManager(siteId);
      return;
    }

    document.getElementById('pageTitle').textContent = 'Pointer ma journée';
    await afficherFormulairePointage(employee, siteId);
  });

  async function afficherEquipeManager(siteId) {
    const today = dateISOLocale();
    const [{ data: equipe }, { data: pointagesJour }] = await Promise.all([
      nexusClient.from('employees').select('id, nom').eq('site_id', siteId).eq('actif', true),
      nexusClient.from('pointages').select('employee_id, type, heure, retard_min').eq('site', siteId).eq('date', today),
    ]);
    const parEmploye = {};
    (pointagesJour || []).forEach(p => {
      parEmploye[p.employee_id] = parEmploye[p.employee_id] || {};
      parEmploye[p.employee_id][p.type] = p;
    });
    const liste = document.getElementById('equipeListe');
    if (!liste) return;
    const lignes = (equipe || []).map(e => {
      const p = parEmploye[e.id] || {};
      let statutTxt, statutClasse;
      if (p.depart) { statutTxt = `Terminé à ${(p.depart.heure || '').slice(0, 5)}`; statutClasse = 'ok'; }
      else if (p.pause_fin) { statutTxt = 'De retour de pause'; statutClasse = 'ok'; }
      else if (p.pause_debut) { statutTxt = 'En pause'; statutClasse = ''; }
      else if (p.arrivee) { statutTxt = p.arrivee.retard_min > 0 ? `Arrivé, ${p.arrivee.retard_min} min de retard` : 'Arrivé à l\'heure'; statutClasse = p.arrivee.retard_min > 0 ? 'retard' : 'ok'; }
      else { statutTxt = 'Pas encore pointé'; statutClasse = ''; }
      return `<div class="equipe-item"><span class="equipe-nom">${e.nom}</span><span class="equipe-statut ${statutClasse}">${statutTxt}</span></div>`;
    });
    liste.outerHTML = lignes.length
      ? `<div>${lignes.join('')}</div>`
      : '<div class="timeline-empty">Aucun employé actif sur ce site.</div>';
  }

  async function afficherFormulairePointage(employee, siteId) {
    const today = dateISOLocale();
    const [{ data: pointagesJour, error: erreurPointages }, { data: shiftActif }] = await Promise.all([
      nexusClient.from('pointages').select('id, type, heure, retard_min, photo_url, photo_echec_technique, heure_debut_quart, anomalie_signalee').eq('employee_id', employee.id).eq('date', today),
      nexusClient.from('shifts').select('id, quart, heure_debut').eq('employee_id', employee.id).eq('statut', 'en_cours').order('heure_debut', { ascending: false }).limit(1).maybeSingle(),
    ]);
    if (erreurPointages) console.error('Chargement pointages du jour:', erreurPointages);

    const dejaFait = {};
    (pointagesJour || []).forEach(p => { dejaFait[p.type] = p; });

    const prochainType = ORDRE_TYPES.find(t => !dejaFait[t]);

    // Tentative précédente interrompue (03/08/2026, cas de Samantha) : si le
    // repère posé juste avant un envoi précédent est encore présent — donc
    // jamais nettoyé par un succès ou un échec explicite — et que le type
    // concerné n'est toujours pas pointé aujourd'hui, la photo a été prise
    // mais l'enregistrement n'a jamais abouti (page quittée, connexion
    // coupée). On le dit clairement plutôt que de laisser l'employé
    // deviner pourquoi NEXUS le renvoie encore vers cet écran.
    let noteTentativeInterrompue = '';
    try {
      const brut = localStorage.getItem(CLE_TENTATIVE_EN_COURS);
      if (brut) {
        const tentative = JSON.parse(brut);
        if (tentative && tentative.employeeId === employee.id && !dejaFait[tentative.type]) {
          const infoType = LABELS_TYPES[tentative.type];
          noteTentativeInterrompue = `<div class="info-note" style="margin-bottom:14px; border-color:var(--amber); color:var(--amber);">⚠ Votre dernière tentative (${infoType ? infoType.label.toLowerCase() : tentative.type}) n'a pas abouti — probablement une coupure pendant la prise de photo ou l'envoi (ça arrive avec l'appareil photo sur certains téléphones). Reprenez-la ci-dessous, ça ne prend qu'un instant.</div>`;
        } else {
          localStorage.removeItem(CLE_TENTATIVE_EN_COURS);
        }
      }
    } catch (e) { console.error('Lecture tentative de pointage interrompue:', e); }

    // Ligne "service/pause en cours" sous l'horloge (28/07/2026, demande de
    // Frédéric) : pause en priorité (si en cours), sinon service tant que
    // l'arrivée est pointée et le départ ne l'est pas encore — toujours à
    // partir de l'heure réelle du pointage concerné, jamais une estimation.
    if (dejaFait.pause_debut && !dejaFait.pause_fin) {
      etatCompteur = 'pause';
      referenceCompteur = new Date(`${today}T${dejaFait.pause_debut.heure}`);
    } else if (dejaFait.arrivee && !dejaFait.depart) {
      etatCompteur = 'service';
      referenceCompteur = new Date(`${today}T${dejaFait.arrivee.heure}`);
    } else {
      etatCompteur = null;
      referenceCompteur = null;
    }

    // Boutons de pointage (28/07/2026, demande de Frédéric) : design
    // plein-largeur coloré repris de l'ancien prototype Pointage, avec les
    // améliorations conservées (sous-texte dynamique, consigne photo,
    // état "pointé").
    const boutonsHtml = ORDRE_TYPES.map(type => {
      const info = LABELS_TYPES[type];
      const fait = dejaFait[type];
      const estProchain = type === prochainType;
      const bloque = !fait && !estProchain;
      const classes = ['pointage-btn', `couleur-${COULEUR_TYPES[type]}`];
      // Échec technique de la photo (07/08/2026) : signalé sobrement dans le
      // sous-texte du bouton déjà pointé, sans jamais donner l'impression
      // que le pointage lui-même est en cause.
      const notePhotoBtn = fait && !fait.photo_url && fait.photo_echec_technique ? ' · Photo non reçue (technique)' : '';
      let sousTexte = fait ? `Pointé à ${(fait.heure || '').slice(0, 5)}${fait.photo_url ? ' · Photo ✓' : notePhotoBtn}` : info.sous;
      if (!fait && info.photoRequise) sousTexte = `📷 ${info.consignePhoto}`;
      const contenuInterieur = `
        <span class="label">${fait ? '✓ ' : ''}${info.label}</span>
        ${sousTexte ? `<span class="sous">${sousTexte}</span>` : ''}
      `;

      // Action active nécessitant une photo (10/08/2026, correction en
      // profondeur — 3e cas de Samantha, Samsung Galaxy S24) : le bouton
      // ouvre désormais une capture caméra EN PAGE (voir ouvrirCameraPointage
      // et .camera-overlay) — on ne quitte plus jamais le contexte NEXUS,
      // donc plus aucune raison pour Android de décharger la page pendant
      // la prise de vue. L'ancien mécanisme (01/08/2026 : <label for="…">
      // associé nativement à un <input capture>, pour contourner un bug où
      // AUCUN Android ne parvenait à ouvrir l'appareil photo via
      // input.click() en JS) est conservé tel quel comme REPLI — l'input
      // caché reste dans le DOM, et ouvrirCameraPointage crée lui-même un
      // <label for="${inputId}"> (vrai clic utilisateur, jamais un
      // .click() programmatique) quand la caméra en page est indisponible,
      // refusée, ou en échec.
      if (!fait && !bloque && info.photoRequise) {
        const inputId = `photoInput-${type}`;
        return `<div class="pointage-item">
          <button type="button" class="${classes.join(' ')}" data-type="${type}" data-photo-btn>
            ${contenuInterieur}
          </button>
          <input type="file" id="${inputId}" accept="image/*" capture="environment" class="pointage-photo-input" data-type="${type}"
            style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;">
        </div>`;
      }

      return `<button class="${classes.join(' ')}" data-type="${type}" ${fait || bloque ? 'disabled' : ''}>${contenuInterieur}</button>`;
    }).join('');

    const retourEnAttente = !dejaFait.arrivee && new URLSearchParams(window.location.search).get('retour');
    document.getElementById('app').innerHTML = `
      ${retourEnAttente ? '<div class="info-note" style="margin-bottom:14px;">🔒 Pointez votre arrivée pour accéder au reste de NEXUS.</div>' : ''}
      ${noteTentativeInterrompue}
      <div class="confirm-banner" id="confirmBanner"></div>
      <div class="section-label">⏱ Votre journée</div>
      <div class="pointage-list">${boutonsHtml}</div>
      <div style="height:18px;"></div>
      <div class="section-label">📋 Historique du service</div>
      <ul class="timeline" id="timelineJour"></ul>
      <div style="height:18px;"></div>
      <div class="section-label">✔ Activité du jour</div>
      <div class="activite-jour" id="activiteJour">
        <div class="activite-texte">Chargement…</div>
      </div>
    `;

    renderTimeline(pointagesJour || [], prochainType, employee, siteId);
    chargerActiviteJour(employee, siteId);
    majServiceLive();

    // Actions sans photo : simple <button>, clic direct. heureClic capturé
    // au clic lui-même (03/08/2026) : c'est cet instant, pas celui —
    // potentiellement bien plus tardif pour une action photo — où
    // l'enregistrement aboutit réellement, qui doit faire foi (voir
    // enregistrerPointage).
    document.querySelectorAll('button.pointage-btn[data-type]:not([data-photo-btn])').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        finaliserPointage(btn, employee, siteId, btn.dataset.type, shiftActif, null, new Date());
      });
    });

    // Actions avec photo (10/08/2026, correction en profondeur — 3e cas de
    // Samantha, Samsung Galaxy S24) : le bouton ouvre désormais la capture
    // caméra EN PAGE (voir ouvrirCameraPointage) au lieu de déléguer à un
    // <label> associé à l'appareil photo natif — voir TOLERANCE_CLIC_
    // VALIDATION_MS plus haut pour la règle "le clic est le moment
    // d'arrivée".
    //
    // Repère posé DÈS le clic, avant l'ouverture de la caméra (07/08/2026,
    // 2e cas de Samantha — Samsung Internet cette fois) : certains
    // navigateurs Android pouvaient décharger complètement la page pendant
    // que l'appareil photo natif était au premier plan (pour récupérer de
    // la mémoire) — au retour, la page repartait de zéro, sans jamais
    // déclencher le 'change' de l'input ni son propre repère (posé trop
    // tard pour ce cas précis). Ce risque disparaît en grande partie avec
    // la caméra en page (10/08/2026), mais le repère est conservé dès le
    // clic par prudence, et reste indispensable pour le chemin de repli
    // (appareil photo natif) qui, lui, garde exactement l'ancien risque.
    document.querySelectorAll('button.pointage-btn[data-photo-btn]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (btn.disabled) return;
        const type = btn.dataset.type;
        const info = LABELS_TYPES[type];
        clicPointage[type] = new Date();
        try {
          localStorage.setItem(CLE_TENTATIVE_EN_COURS, JSON.stringify({ employeeId: employee.id, type, depuis: Date.now() }));
        } catch (e) { console.error('Pose du repère de tentative de pointage (au clic):', e); }

        const inputId = `photoInput-${type}`;
        const resultat = await ouvrirCameraPointage({ consigne: info.consignePhoto, inputId });

        if (resultat === 'repli') return; // l'input caché + son écouteur 'change' (ci-dessous) prennent le relais, repère conservé
        if (!resultat) {
          // Annulation volontaire (fermeture de l'overlay) : ce n'est pas
          // une tentative interrompue à signaler au prochain chargement.
          try { localStorage.removeItem(CLE_TENTATIVE_EN_COURS); } catch (e) {}
          return;
        }
        await traiterPhotoPointage(resultat, btn, type, employee, siteId, shiftActif, clicPointage[type]);
      });
    });

    // Chemin de repli : appareil photo natif (mécanisme du 01/08/2026,
    // inchangé) — déclenché depuis l'intérieur de ouvrirCameraPointage via
    // un vrai clic utilisateur sur le <label for="${inputId}">.
    document.querySelectorAll('.pointage-photo-input').forEach(input => {
      input.addEventListener('change', async () => {
        const file = input.files && input.files[0];
        // L'input et le bouton associé sont frères dans .pointage-item.
        const btn = input.parentElement && input.parentElement.querySelector('.pointage-btn');
        const type = input.dataset.type;
        if (!file) {
          // 01/08/2026 — signalé par Frédéric : un employé (Angelique)
          // restait bloqué sur cet écran sans comprendre pourquoi, car un
          // retour vide de l'appareil photo (photo annulée, ou refusée par
          // le téléphone/navigateur faute d'autorisation caméra) ne
          // provoquait auparavant AUCUN message — le bouton restait
          // silencieux, sans indice sur ce qui bloquait. On rend maintenant
          // cet échec visible pour qu'elle sache qu'il faut réessayer et
          // autoriser l'accès à l'appareil photo si le téléphone le demande.
          // Repère retiré (07/08/2026) : une photo annulée volontairement
          // n'est pas une tentative interrompue à signaler au prochain
          // chargement — seul un rechargement forcé pendant la prise doit
          // déclencher l'avertissement.
          try { localStorage.removeItem(CLE_TENTATIVE_EN_COURS); } catch (e) {}
          const sousVide = btn && btn.querySelector('.sous');
          if (sousVide) sousVide.textContent = "Aucune photo reçue — réessaie et autorise l'accès à l'appareil photo si ton téléphone te le demande.";
          return;
        }
        const heureClic = clicPointage[type] || new Date();
        await traiterPhotoPointage(file, btn, type, employee, siteId, shiftActif, heureClic);
      });
    });
  }

  // traiterPhotoPointage (10/08/2026) : logique d'envoi extraite pour être
  // partagée par les deux chemins de capture — caméra en page (chemin
  // principal) et appareil photo natif (chemin de repli) — qui ne
  // diffèrent que par la façon dont le File a été obtenu.
  async function traiterPhotoPointage(file, btn, type, employee, siteId, shiftActif, heureClic) {
    setElementOccupe(btn, true);

    // Avertissement d'attente bien visible (03/08/2026, demande de
    // Frédéric, suite au cas de Samantha) : le petit sous-texte du bouton
    // ne suffisait pas à se faire remarquer — on affiche donc aussi une
    // bannière pleine largeur, au même endroit que la confirmation finale,
    // pour que l'employé sache qu'il doit patienter et ne pas quitter la
    // page pendant l'envoi.
    const sousEl = btn && btn.querySelector('.sous');
    if (sousEl) sousEl.textContent = 'Photo reçue — envoi en cours…';
    const banner = document.getElementById('confirmBanner');
    if (banner) {
      banner.classList.remove('retard');
      banner.innerHTML = `<div class="confirm-banner-titre">⏳ Photo reçue, patientez…</div><div class="confirm-banner-sous">L'enregistrement est en cours — ne quittez pas cette page.</div>`;
      banner.classList.add('show');
    }

    // Repère "tentative en cours" (03/08/2026) : posé juste avant l'envoi,
    // retiré dès que le résultat (succès ou échec) est connu. S'il subsiste
    // au prochain chargement de la page, l'envoi a été interrompu en cours
    // de route (page quittée, réseau coupé) — voir la vérification en haut
    // de afficherFormulairePointage().
    try {
      localStorage.setItem(CLE_TENTATIVE_EN_COURS, JSON.stringify({ employeeId: employee.id, type, depuis: Date.now() }));
    } catch (e) { console.error('Pose du repère de tentative de pointage:', e); }

    const photoUrl = await uploaderPhotoPointageAvecRelance(employee.id, type, file);
    try { localStorage.removeItem(CLE_TENTATIVE_EN_COURS); } catch (e) {}

    if (!photoUrl) {
      // Échec technique persistant, même après relance (07/08/2026, demande
      // de Frédéric) : un problème technique ne doit jamais mettre en doute
      // la bonne foi de l'employé, ni le bloquer — le pointage est accepté
      // sans photo (voir enregistrerPointage, qui affiche la confirmation
      // avec cette précision), avec une trace explicite
      // (photo_echec_technique) pour rester honnête envers le manager sur
      // ce qui s'est passé, sans pénaliser l'employé.
      await finaliserPointage(btn, employee, siteId, type, shiftActif, null, heureClic, true);
      return;
    }
    await finaliserPointage(btn, employee, siteId, type, shiftActif, photoUrl, heureClic, false);
  }

  // setElementOccupe (01/08/2026) : équivalent de btn.disabled — les
  // actions avec photo restent des <button> (10/08/2026), mais on garde
  // cette indirection pour uniformiser avec les autres appels et couvrir
  // d'éventuels éléments sans propriété .disabled.
  function setElementOccupe(el, occupe) {
    if (!el) return;
    if ('disabled' in el) el.disabled = occupe;
    el.classList.toggle('pointage-occupe', occupe);
  }

  async function finaliserPointage(btn, employee, siteId, type, shiftActif, photoUrl, heureClic, photoEchecTechnique) {
    setElementOccupe(btn, true);
    const sous = btn.querySelector('.sous');
    if (sous) sous.textContent = '…';
    const ok = await enregistrerPointage(employee, siteId, type, shiftActif, photoUrl, heureClic, photoEchecTechnique);

    // Laisser le temps de lire la bannière (07/08/2026, cas de Samantha) :
    // enregistrerPointage() affiche une bannière de confirmation (avec
    // l'heure, ou le retard) ou d'échec dans #confirmBanner — mais juste en
    // dessous, afficherFormulairePointage() reconstruit tout l'écran, y
    // compris un #confirmBanner vide neuf. Sans délai, la bannière n'était
    // donc jamais réellement visible, ni en succès ni en échec — l'employé
    // ne voyait que l'écran se redessiner, ce qui a probablement renforcé
    // l'impression de "boucle" même quand le pointage avait fonctionné.
    await new Promise(resolve => setTimeout(resolve, 1400));

    // Retour automatique (28/07/2026) : quand cette page a été atteinte via
    // le blocage obligatoire de nexus-auth.js (?retour=<page>), on renvoie
    // l'employé directement vers la page qu'il voulait consulter dès que
    // son arrivée est enregistrée — pas la peine de le faire cliquer deux fois.
    if (ok && type === 'arrivee') {
      const retour = new URLSearchParams(window.location.search).get('retour');
      if (retour) { window.location.href = retour; return; }
    }
    await afficherFormulairePointage(employee, siteId);
  }

  // Historique du service (28/07/2026, demande de Frédéric) : chaque
  // pointage déjà fait affiche désormais une ligne de contexte sous son
  // heure — jamais un simple "+X min" en rouge sans explication, pour ne
  // pas laisser croire à l'employé à une erreur du système. Le retard est
  // présenté avec l'horaire prévu (heure_debut_quart, capturé au moment du
  // pointage — jamais recalculé après coup) et l'heure réelle, jamais juste
  // un delta brut. Une dernière ligne "Prochaine action" (pastille vide)
  // montre ce qui reste à pointer, quand il en reste.
  function renderTimeline(pointagesJour, prochainType, employee, siteId) {
    const liste = document.getElementById('timelineJour');
    if (!liste) return;
    if (!pointagesJour.length) {
      liste.innerHTML = '<li class="timeline-empty">Rien pointé pour l\'instant aujourd\'hui.</li>';
      return;
    }
    const tries = [...pointagesJour].sort((a, b) => (a.heure || '').localeCompare(b.heure || ''));
    const lignesFaites = tries.map(p => {
      const info = LABELS_TYPES[p.type] || { label: p.type, histLabel: p.type };
      const enRetard = p.type === 'arrivee' && p.retard_min > 0;
      const heureReelle = (p.heure || '').slice(0, 5);

      // Lignes de contexte séparées (28/07/2026, affinage demandé par
      // Frédéric) : "Horaire prévu" sur sa propre ligne, puis "Retard
      // constaté" + "Photo ✓" ensemble sur la suivante — jamais un horaire
      // prévu affiché sans donnée réelle (heure_debut_quart), conformément
      // à l'article 5 (jamais un chiffre inventé). Si ce quart n'a pas été
      // capturé (donnée antérieure à cette fonctionnalité), on se limite à
      // mentionner le retard sans inventer d'horaire prévu.
      const lignesSub = [];
      if (enRetard) {
        if (p.heure_debut_quart) {
          const horairePrevu = new Date(p.heure_debut_quart).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
          lignesSub.push(`<div class="timeline-sub">Horaire prévu : ${horairePrevu}</div>`);
        }
        const retardEtPhoto = [`Retard constaté : ${p.retard_min} min`];
        if (p.photo_url) retardEtPhoto.push(`<a class="timeline-photo" href="${p.photo_url}" target="_blank" rel="noopener">Photo ✓</a>`);
        lignesSub.push(`<div class="timeline-sub retard">${retardEtPhoto.join(' · ')}</div>`);
      } else if (p.photo_url) {
        lignesSub.push(`<div class="timeline-sub"><a class="timeline-photo" href="${p.photo_url}" target="_blank" rel="noopener">Photo ✓</a></div>`);
      }
      // Échec technique de la photo (07/08/2026, demande de Frédéric) :
      // visible dans l'historique pour le manager, formulé sans mettre en
      // cause l'employé — un fait technique, pas un doute sur sa présence.
      if (!p.photo_url && p.photo_echec_technique) {
        lignesSub.push(`<div class="timeline-sub" style="color:var(--amber);">📷 Photo non reçue (problème technique) — pointage accepté normalement</div>`);
      }

      // Contester ce pointage (28/07/2026, demande de Frédéric, renommé
      // depuis "Signaler une anomalie") : protège aussi le manager contre
      // des contestations tardives — le texte et son horodatage sont
      // conservés tels quels dans anomalie_signalee/anomalie_signalee_le,
      // jamais résumés ni modifiés (seul le libellé affiché a changé).
      let anomalieHtml = '';
      if (enRetard) {
        anomalieHtml = p.anomalie_signalee
          ? `<div class="timeline-anomalie-ok">✓ Pointage contesté</div>`
          : `<button class="timeline-anomalie-lien" data-pointage-id="${p.id}">Contester ce pointage →</button>
             <div class="anomalie-form" id="anomalieForm-${p.id}" style="display:none;">
               <textarea id="anomalieTexte-${p.id}" placeholder="Expliquez pourquoi ce pointage ne reflète pas la réalité (ex : embouteillage, panne, imprévu)…"></textarea>
               <div class="anomalie-form-actions">
                 <button class="anomalie-btn primaire" data-envoyer-anomalie="${p.id}">Envoyer</button>
                 <button class="anomalie-btn" data-annuler-anomalie="${p.id}">Annuler</button>
               </div>
             </div>`;
      }

      return `<li class="timeline-item">
        <span class="timeline-dot ${enRetard ? 'retard' : ''}"></span>
        <div class="timeline-body">
          <div class="timeline-row-top"><span class="timeline-heure">${heureReelle}</span> — <span class="timeline-label">${info.histLabel || info.label}</span></div>
          ${lignesSub.join('')}
          ${anomalieHtml}
        </div>
      </li>`;
    });

    const ligneProchaine = prochainType ? `<li class="timeline-item">
        <span class="timeline-dot vide"></span>
        <div class="timeline-body">
          <div class="timeline-label-prochaine">Prochaine étape</div>
          <div class="timeline-label">${LABELS_TYPES[prochainType].labelProchaine}</div>
        </div>
      </li>` : '';

    liste.innerHTML = lignesFaites.join('') + ligneProchaine;

    liste.querySelectorAll('.timeline-anomalie-lien').forEach(btn => {
      btn.addEventListener('click', () => {
        const form = document.getElementById(`anomalieForm-${btn.dataset.pointageId}`);
        if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });
    });
    liste.querySelectorAll('[data-annuler-anomalie]').forEach(btn => {
      btn.addEventListener('click', () => {
        const form = document.getElementById(`anomalieForm-${btn.dataset.annulerAnomalie}`);
        if (form) form.style.display = 'none';
      });
    });
    liste.querySelectorAll('[data-envoyer-anomalie]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const pointageId = btn.dataset.envoyerAnomalie;
        const texteEl = document.getElementById(`anomalieTexte-${pointageId}`);
        const texte = (texteEl && texteEl.value || '').trim();
        if (!texte) { texteEl && texteEl.focus(); return; }
        btn.disabled = true;
        btn.textContent = 'Envoi…';
        const { error } = await nexusClient.from('pointages')
          .update({ anomalie_signalee: texte, anomalie_signalee_le: new Date().toISOString() })
          .eq('id', pointageId);
        if (error) {
          console.error('Signalement anomalie:', error);
          btn.disabled = false;
          btn.textContent = 'Envoyer';
          return;
        }
        await afficherFormulairePointage(employee, siteId);
      });
    });
  }

  // Activité du jour (28/07/2026, demande de Frédéric) : compte réel des
  // missions terminées, en cours et restantes de l'employé, jamais une
  // estimation — mission_completions (date = aujourd'hui) et
  // mission_assignments (status = 'assignee', seul statut "en cours" qui
  // existe réellement, voir NEXUS-Missions-v1.html) pour les deux premiers
  // chiffres. "Restantes" (28/07/2026, affinage demandé par Frédéric)
  // reprend exactement la même logique que le Conseiller personnel de
  // Missions (chargerShiftAujourdhui + mission_catalog.role_required) :
  // les missions récurrentes du rôle du jour non encore faites aujourd'hui.
  // Si aucun quart n'est identifiable (roleDuJour introuvable), on omet ce
  // chiffre plutôt que d'en inventer un — jamais un chiffre inventé.
  async function chargerRoleDuJour(employeeId) {
    const il24h = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
    const { data, error } = await nexusClient
      .from('shifts').select('role').eq('employee_id', employeeId)
      .gte('heure_debut', il24h).order('heure_debut', { ascending: false }).limit(1);
    if (error) { console.error('Chargement rôle du jour (activité):', error); return null; }
    return (data && data[0]) ? data[0].role : null;
  }

  async function chargerActiviteJour(employee, siteId) {
    const zone = document.getElementById('activiteJour');
    if (!zone) return;
    const today = dateISOLocale();
    const [{ data: terminees, error: erreurTerminees }, { data: enCours, error: erreurEnCours }, roleDuJour, { data: catalogue, error: erreurCatalogue }] = await Promise.all([
      nexusClient.from('mission_completions').select('id, mission_id').eq('employee_id', employee.id).eq('date', today),
      nexusClient.from('mission_assignments').select('id').eq('site_id', siteId).eq('assigned_to_employee_id', employee.id).eq('status', 'assignee'),
      chargerRoleDuJour(employee.id),
      nexusClient.from('mission_catalog').select('mission_id, role_required, time_window').eq('actif', true).eq('ponctuelle', false).eq('site_id', siteId),
    ]);
    if (erreurTerminees) console.error('Activité du jour (terminées):', erreurTerminees);
    if (erreurEnCours) console.error('Activité du jour (en cours):', erreurEnCours);
    if (erreurCatalogue) console.error('Activité du jour (catalogue):', erreurCatalogue);

    const nbTerminees = (terminees || []).length;
    const nbEnCours = (enCours || []).length;

    let texteRestantes = '';
    if (roleDuJour && catalogue) {
      const maintenant = new Date();
      const faitesAujourdhui = new Set((terminees || []).map(t => t.mission_id));
      // Fenêtre horaire (03/08/2026) : même règle que NEXUS-Missions-v1.html
      // (missionDansSaFenetreHoraire) — "Ouverture station" ne doit plus
      // compter comme restante après 6h, ce compteur reprenant exactement
      // la même logique que le Conseiller personnel de Missions.
      const nbRestantes = catalogue.filter(m => {
        if (!Array.isArray(m.role_required) || !m.role_required.includes(roleDuJour) || faitesAujourdhui.has(m.mission_id)) return false;
        if (!m.time_window) return true;
        const match = /^avant-(\d{2}):(\d{2})$/.exec(m.time_window);
        if (!match) return true;
        const limite = new Date(maintenant);
        limite.setHours(Number(match[1]), Number(match[2]), 0, 0);
        return maintenant < limite;
      }).length;
      texteRestantes = ` · ${nbRestantes} restante${nbRestantes > 1 ? 's' : ''}`;
    }

    zone.innerHTML = `
      <div class="activite-texte">${nbTerminees} terminée${nbTerminees > 1 ? 's' : ''} · ${nbEnCours} en cours${texteRestantes}</div>
      <a class="activite-lien" href="NEXUS-Missions-v1.html">Voir mes missions →</a>
    `;
  }

  // Officialisation de la prise de poste (28/07/2026, demande de Frédéric) :
  // le suivi des retards ne devient réel que le 1er août 2026. Avant cette
  // date, le pointage arrivée/départ existe déjà (utile pour la photo et
  // l'habitude), mais aucun retard n'est calculé ni compté — retard_min
  // reste à 0 quel que soit l'horaire réel, pour ne pas pénaliser une
  // période qui n'a jamais été annoncée comme officielle aux employés.
  const DATE_OFFICIALISATION_RETARDS = '2026-08-01';

  async function enregistrerPointage(employee, siteId, type, shiftActif, photoUrl, heureClic, photoEchecTechnique) {
    const now = new Date();

    // Règle "le clic est le moment d'arrivée" (03/08/2026, demande de
    // Frédéric — voir TOLERANCE_CLIC_VALIDATION_MS en haut du fichier) :
    // pour une action avec photo, `now` (l'instant où l'envoi vient
    // d'aboutir) peut être sensiblement plus tardif que le clic initial à
    // cause du temps de l'appareil photo puis de l'envoi réseau. Tant que
    // la validation aboutit dans la minute suivant le clic, c'est le clic
    // qui fait foi ; au-delà, on retombe sur l'heure réelle de validation
    // (jamais un chiffre inventé — juste une heure plus tardive et bien
    // réelle si le délai a franchi la tolérance).
    const heureRetenue = (heureClic && (now.getTime() - heureClic.getTime()) <= TOLERANCE_CLIC_VALIDATION_MS)
      ? heureClic
      : now;
    const heure = heureRetenue.toTimeString().slice(0, 8);
    const today = dateISOLocale(heureRetenue);

    let retardMin = 0;
    if (type === 'arrivee' && shiftActif && shiftActif.heure_debut && today >= DATE_OFFICIALISATION_RETARDS) {
      const debutPrevu = new Date(shiftActif.heure_debut);
      const diffMin = Math.round((heureRetenue - debutPrevu) / 60000);
      retardMin = diffMin > 0 ? diffMin : 0;
    }

    const { error } = await nexusClient.from('pointages').insert({
      employee_id: employee.id,
      site: siteId,
      date: today,
      type,
      heure,
      // Filet de sécurité (07/08/2026) : `quart` est NOT NULL en base —
      // sans quart actif (ex. pointage fait avant toute "prise de poste"),
      // un `null` explicite ferait échouer l'insertion entière et
      // bloquerait le pointage, exactement ce qu'on cherche à éviter avec
      // photo_echec_technique ci-dessous. 'non_defini' n'est pas un chiffre
      // inventé — il documente honnêtement l'absence de quart identifiable.
      quart: (shiftActif && shiftActif.quart) || 'non_defini',
      retard_min: retardMin,
      photo_url: photoUrl || null,
      // Échec technique de la photo (07/08/2026, demande de Frédéric) : ne
      // doit jamais mettre en cause la bonne foi de l'employé ni bloquer le
      // pointage — cette colonne trace explicitement le cas pour le
      // manager, distinct d'une photo simplement absente.
      photo_echec_technique: !!photoEchecTechnique,
      // heure_debut_quart (28/07/2026) : capturé ici, au moment du pointage,
      // et jamais recalculé ensuite — c'est ce qui permet à l'historique
      // d'afficher "Horaire prévu" sans jamais inventer ou réestimer une
      // valeur après coup (article 5 de la constitution NEXUS).
      heure_debut_quart: (type === 'arrivee' && shiftActif && shiftActif.heure_debut) || null,
    });

    const banner = document.getElementById('confirmBanner');
    if (error) {
      console.error('Enregistrement pointage:', error);
      if (banner) {
        banner.textContent = "Le pointage n'a pas pu être enregistré — réessayez.";
        banner.classList.add('show');
      }
      return false;
    }
    if (banner) {
      banner.classList.remove('retard');
      // Note discrète sur l'échec technique de la photo (07/08/2026) :
      // ajoutée au message de confirmation, jamais à sa place — le
      // pointage est bien enregistré, la photo est juste un détail annexe
      // à préciser, pas une inquiétude à faire porter à l'employé.
      const notePhoto = photoEchecTechnique
        ? ' · Photo non envoyée (problème technique), ton pointage est accepté quand même.'
        : '';
      if (type === 'arrivee' && retardMin > 0) {
        banner.classList.add('retard');
        const horairePrevu = shiftActif && shiftActif.heure_debut
          ? new Date(shiftActif.heure_debut).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
          : null;
        banner.innerHTML = `
          <div class="confirm-banner-titre">Arrivée enregistrée à ${heure.slice(0, 5)}</div>
          <div class="confirm-banner-sous">${horairePrevu ? `Horaire prévu : ${horairePrevu} · ` : ''}Retard constaté : ${retardMin} min${notePhoto}</div>
        `;
      } else {
        banner.textContent = `${LABELS_TYPES[type].label} enregistré${type === 'depart' ? '' : 'e'} à ${heure.slice(0, 5)}.${notePhoto}`;
      }
      banner.classList.add('show');
    }
    return true;
  }
</script>
</body>
</html>
